---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: 'roles/.*/templates/'
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        language: system
        # Lints only the staged YAML files, passed explicitly. The CI
        # `ansible-lint` job still lints the whole repo, so CI remains the
        # full-repo gate. Staged molecule/, playbooks/ and roles/ files are all
        # passed here too, so a violation in a file being committed is caught
        # before the commit. A whole-repo lint on every commit took 15-40 min
        # with several sessions sharing the machine.
        # `require_serial` keeps one ansible-lint process per commit.
        #
        # `env -u GIT_DIR ...` is required, not cosmetic. Git exports GIT_DIR,
        # GIT_INDEX_FILE and GIT_WORK_TREE to every hook, and child processes
        # inherit them. ansible-lint auto-installs requirements.yml, and for a
        # git-source entry that means `git clone` followed by `git checkout
        # <sha>` — which, with GIT_DIR inherited, runs against THIS repo's
        # object store instead of the clone. The pinned commit is genuinely not
        # a ref here, so it fails with "upload-pack: not our ref" naming a SHA
        # that is perfectly valid upstream.
        entry: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE ansible-lint
        files: \.(yaml|yml)$
        pass_filenames: true
        require_serial: true

  # markdownlint-cli2, not markdownlint-cli: the repo's canonical markdown
  # config is .markdownlint-cli2.yaml (auto-discovered; line_length 160 +
  # CHANGELOG.md in its `ignores`). The previous markdownlint-cli hook pointed
  # at a .markdownlint.json that does not exist, so it linted with built-in
  # defaults (line_length 80) and failed on files the canonical config passes.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
