---
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    # No NixOS host and no nix on the runner: skip the controller-side
    # nixos-rebuild and the systemd management, leaving the EnvironmentFile
    # render — the part this role owns.
    herdr_hail_deploy_enabled: false
    # Normally resolved from herdr_group via the tofu-derived inventory.
    herdr_hail_runtime_host: "herdr.molecule.invalid"
    herdr_hail_slack_bot_token: "xoxb-molecule-not-a-real-token"
    herdr_hail_slack_app_token: "xapp-molecule-not-a-real-token"
    herdr_hail_slack_channel: "C0MOLECULE"
    herdr_hail_slack_allowed_users: "U0MOLECULE"
    herdr_hail_extra_env:
      HERDR_HAIL_LOG_LEVEL: debug

  tasks:
    - name: Include herdr_hail role
      ansible.builtin.include_role:
        name: herdr_hail
