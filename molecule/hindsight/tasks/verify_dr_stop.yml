---
# These harmless fixture units run only inside the disposable Molecule host.
# Both services are actively running when the real role is asked to stop them.
- name: Install harmless DR timer and service fixtures
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.0 }}.{{ item.1 }}"
    mode: "0644"
    content: |
      [Unit]
      Description=Molecule Hindsight DR containment fixture

      {% if item.1 == 'service' %}
      [Service]
      Type=simple
      ExecStart=/usr/bin/sleep 3600

      {% else %}
      [Timer]
      OnActiveSec=1h

      [Install]
      WantedBy=timers.target
      {% endif %}
  loop: "{{ ['hindsight-bank-export', 'hindsight-bank-dr-drill'] | product(['service', 'timer']) | list }}"
  loop_control:
    label: "{{ item.0 }}.{{ item.1 }}"

- name: Reload systemd for the fixture units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Start both static fixture services
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: started
  loop: [hindsight-bank-export, hindsight-bank-dr-drill]

- name: Enable and start both fixture timers
  ansible.builtin.systemd_service:
    name: "{{ item }}.timer"
    enabled: true
    state: started
  loop: [hindsight-bank-export, hindsight-bank-dr-drill]

- name: Read the active state before invoking the DR role
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ item.0 }}.{{ item.1 }}"]
  loop: "{{ ['hindsight-bank-export', 'hindsight-bank-dr-drill'] | product(['service', 'timer']) | list }}"
  loop_control:
    label: "{{ item.0 }}.{{ item.1 }}"
  register: hindsight_fixture_dr_before
  changed_when: false

- name: Require every fixture unit to be active before containment
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | trim == 'active'
  loop: "{{ hindsight_fixture_dr_before.results }}"
  loop_control:
    label: "{{ item.item.0 }}.{{ item.item.1 }}"

- name: Apply the real disabled DR role without S3 credentials
  ansible.builtin.include_role:
    name: hindsight_bank_dr
  vars:
    hindsight_bank_dr_api_key: ""
    hindsight_bank_dr_bao_addr: ""
    hindsight_bank_dr_bao_role_id: ""
    hindsight_bank_dr_bao_secret_id: ""
    hindsight_bank_dr_s3_access_key_id: ""
    hindsight_bank_dr_s3_secret_access_key: ""

- name: Read the stopped state of every DR fixture unit
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ item.0 }}.{{ item.1 }}"]
  loop: "{{ ['hindsight-bank-export', 'hindsight-bank-dr-drill'] | product(['service', 'timer']) | list }}"
  loop_control:
    label: "{{ item.0 }}.{{ item.1 }}"
  register: hindsight_fixture_dr_active
  changed_when: false
  failed_when: false

- name: Read the enabled state of every DR fixture unit
  ansible.builtin.command:
    argv: [systemctl, is-enabled, "{{ item.0 }}.{{ item.1 }}"]
  loop: "{{ ['hindsight-bank-export', 'hindsight-bank-dr-drill'] | product(['service', 'timer']) | list }}"
  loop_control:
    label: "{{ item.0 }}.{{ item.1 }}"
  register: hindsight_fixture_dr_enabled
  changed_when: false
  failed_when: false

- name: Require every timer and active service to be stopped
  ansible.builtin.assert:
    that:
      - item.rc == 3
      - item.stdout | trim == 'inactive'
  loop: "{{ hindsight_fixture_dr_active.results }}"
  loop_control:
    label: "{{ item.item.0 }}.{{ item.item.1 }}"

- name: Require timers to be disabled and services to remain static
  ansible.builtin.assert:
    that:
      - item.rc == (0 if item.item.1 == 'service' else 1)
      - item.stdout | trim == ('static' if item.item.1 == 'service' else 'disabled')
  loop: "{{ hindsight_fixture_dr_enabled.results }}"
  loop_control:
    label: "{{ item.item.0 }}.{{ item.item.1 }}"
