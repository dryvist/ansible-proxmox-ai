---
# Molecule verification playbook
# Validates that the hindsight_docker role executed correctly

- name: Verify
  hosts: all
  become: true
  gather_facts: true

  vars:
    hindsight_docker_data_dir: /opt/hindsight
    hindsight_docker_api_port: 8888

  tasks:
    # Reads only hindsight_docker_image out of the role's own defaults (the
    # same Renovate-managed pin run_db_migration.yml uses), rather than
    # include_vars-ing the whole file: that file also defines
    # hindsight_docker_api_port (tofu_data-dependent), which would outrank
    # and break this play's own `vars: hindsight_docker_api_port: 8888`
    # override used by the health-check task below.
    - name: Load hindsight_docker role defaults (image tag)
      ansible.builtin.set_fact:
        hindsight_docker_image: "{{ _hindsight_docker_defaults.hindsight_docker_image }}"
      vars:
        _hindsight_docker_defaults: >-
          {{ lookup('file', playbook_dir + '/../../roles/hindsight_docker/defaults/main.yml') | from_yaml }}

    - name: Stat the rendered docker-compose file
      ansible.builtin.stat:
        path: "{{ hindsight_docker_data_dir }}/docker-compose.yml"
      register: hindsight_compose_stat

    - name: Assert compose file exists with restricted mode
      ansible.builtin.assert:
        that:
          - hindsight_compose_stat.stat.exists
          - hindsight_compose_stat.stat.mode == '0600'

    - name: Read the rendered compose file
      ansible.builtin.slurp:
        src: "{{ hindsight_docker_data_dir }}/docker-compose.yml"
      register: hindsight_compose_content
      no_log: true

    # Parsed into a fact rather than checked as a whole-file substring: a
    # substring match is satisfied by a comment that merely mentions the name,
    # which is exactly how the wrong variable (HERMES_PASSWORD) survived the
    # equivalent check in hermes_ui/verify.yml. Its own task so a parse
    # failure is attributable, matching that file's fix.
    - name: Parse the rendered compose file
      ansible.builtin.set_fact:
        hindsight_compose: "{{ hindsight_compose_content.content | b64decode | from_yaml }}"
      no_log: true

    - name: Assert compose wiring (image, worker id, pgvector, local embeddings)
      vars:
        hindsight_env: "{{ hindsight_compose.services.hindsight.environment }}"
      ansible.builtin.assert:
        that:
          - "'ghcr.io/vectorize-io/hindsight' in hindsight_compose.services.hindsight.image"
          - hindsight_env.HINDSIGHT_API_WORKER_ID | default('') | length > 0
          - hindsight_env.HINDSIGHT_API_VECTOR_EXTENSION == 'pgvector'
          - hindsight_env.HINDSIGHT_API_EMBEDDINGS_PROVIDER == 'local'
        fail_msg: >-
          hindsight compose wiring is wrong. Keys present:
          {{ hindsight_env.keys() | list }}

    - name: Check hindsight container is running
      ansible.builtin.command: >-
        docker ps --filter name=hindsight --filter status=running
        --format {% raw %}'{{ .Names }}'{% endraw %}
      register: hindsight_ps
      changed_when: false

    - name: Assert hindsight container is running
      ansible.builtin.assert:
        that:
          - "'hindsight' in hindsight_ps.stdout"

    - name: Verify hindsight health endpoint answers 200
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ hindsight_docker_api_port }}/health"
        method: GET
        status_code: 200
      retries: 12
      delay: 10
      register: hindsight_verify_health
      until: hindsight_verify_health.status == 200

    # prepare.yml seeds the pgvector database one revision behind the image's
    # head (production's real steady state, not an empty database) before
    # converge ever runs, so the converge playbook's call to
    # tasks/run_db_migration.yml exercises the real backup+migrate path —
    # confirm both actually happened.
    - name: Stat the pre-migration backup produced by run_db_migration.yml
      ansible.builtin.stat:
        path: "{{ hindsight_docker_data_dir }}/pre-migration-backups/pre-migration.zip"
      register: hindsight_premigration_backup_stat

    - name: Assert the pre-migration backup exists and is non-empty
      ansible.builtin.assert:
        that:
          - hindsight_premigration_backup_stat.stat.exists
          - hindsight_premigration_backup_stat.stat.size > 0

    # run_db_migration.yml's own head-revision probe already generated this
    # config file (into the same directory as the backup) — reused here
    # rather than regenerated.
    - name: Determine the image's target head revision (verification)
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network=host
          - -v
          - "{{ hindsight_docker_data_dir }}/pre-migration-backups/alembic-heads.ini:/tmp/alembic-heads.ini:ro"
          - "{{ hindsight_docker_image }}"
          - alembic
          - -c
          - /tmp/alembic-heads.ini
          - heads
      register: hindsight_verify_head_probe
      changed_when: false

    # Same bridge-gateway address prepare.yml and run_db_migration.yml both
    # use to reach the seed Postgres, re-derived fresh (facts don't persist
    # across Molecule's separate per-stage ansible-playbook invocations).
    - name: Discover the Docker bridge gateway (verification)
      ansible.builtin.command: >-
        docker network inspect bridge
        --format {% raw %}'{{ (index .IPAM.Config 0).Gateway }}'{% endraw %}
      register: hindsight_verify_bridge_gw
      changed_when: false

    - name: Query the database's current Alembic revision (verification)
      ansible.builtin.command:
        argv:
          - psql
          - "postgresql://hindsight@{{ hindsight_verify_bridge_gw.stdout | trim }}:5432/hindsight"
          - -tAc
          - "SELECT version_num FROM public.alembic_version"
      environment:
        PGPASSWORD: molecule-test-password
      register: hindsight_verify_current_revision
      changed_when: false

    - name: Assert the database's current revision matches the image's target head
      ansible.builtin.assert:
        that:
          - >-
            (hindsight_verify_current_revision.stdout | trim) ==
            (hindsight_verify_head_probe.stdout | trim).split(' ')[0]
        fail_msg: >-
          Database is at revision {{ hindsight_verify_current_revision.stdout | trim }},
          but the image's head is {{ (hindsight_verify_head_probe.stdout | trim).split(' ')[0] }} —
          run_db_migration.yml did not migrate all the way to head.
