---
# Molecule converge playbook
# Tests the hindsight_docker role against the test container. Hindsight is
# stateless except Postgres, so the scenario boots a pgvector container first
# (via the same docker_engine bootstrap the role depends on) and points the
# role at it through the Docker bridge gateway.

- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Use the installed FUSE driver inside the privileged test container.
    hindsight_docker_storage_driver: fuse-overlayfs
    # Values normally injected from tofu_data.constants / OpenBao
    hindsight_docker_api_port: 8888
    hindsight_docker_cp_port: 9999
    hindsight_docker_db_port: 5432
    hindsight_docker_db_password: molecule-test-password
    hindsight_docker_cp_access_key: molecule-test-cp-key
    bao_apps_secrets:
      hindsight_api_key: molecule-test-hindsight-api-key
    hindsight_docker_llm_api_key: molecule-test-llm-key
    hindsight_docker_llm_base_url: "http://127.0.0.1:9/v1"  # mock provider makes no network calls
    hindsight_retain_model: ai-default
    hindsight_docker_worker_id: hindsight-test
    hindsight_service_enabled: true
    hindsight_docker_migration_approved_image: "{{ hindsight_docker_image }}"
    hindsight_docker_llm_provider: mock
    ai_orchestration_otel_endpoint: "http://127.0.0.1:9/molecule-fixture"  # never called during converge
    # Matches production (false): the migration runs explicitly, once, from
    # tasks/run_db_migration.yml — see the task below that calls it via
    # include_role/tasks_from before the role itself is included, exercising
    # the real pre-migration-backup + migration tasks against the populated
    # legacy database instead of letting the API self-migrate on startup.
    hindsight_docker_run_migrations_on_startup: false
    # Load the image's cached models offline, using the production CPU reranker.
    # The mock provider makes no router calls; keep the existing fixture budget.
    hindsight_docker_startup_timeout: 120
    hindsight_docker_health_retries: 18
    hindsight_docker_health_delay: 5

  tasks:
    - name: Bootstrap Docker (same role the hindsight_docker meta dependency uses)
      ansible.builtin.include_role:
        name: docker_engine
      vars:
        docker_engine_configure_daemon_json: true
        docker_engine_storage_driver: fuse-overlayfs

    - name: Discover the Docker bridge gateway (compose -> host-published ports)
      ansible.builtin.command: >-
        docker network inspect bridge
        --format {% raw %}'{{ (index .IPAM.Config 0).Gateway }}'{% endraw %}
      register: hindsight_molecule_bridge_gw
      changed_when: false

    - name: Run the real pre-migration-backup + migration tasks against the fresh database
      ansible.builtin.include_role:
        name: hindsight_docker
        tasks_from: run_db_migration.yml
      vars:
        hindsight_docker_db_host: "{{ hindsight_molecule_bridge_gw.stdout | trim }}"

    - name: Converge hindsight with container-log capture on failure
      block:
        - name: Include hindsight_docker role
          ansible.builtin.include_role:
            name: hindsight_docker
          vars:
            hindsight_docker_db_host: "{{ hindsight_molecule_bridge_gw.stdout | trim }}"
      rescue:
        - name: Dump hindsight container logs (diagnosis)
          ansible.builtin.command: docker logs --tail 80 hindsight
          register: hindsight_molecule_logs
          changed_when: false
          failed_when: false

        - name: Dump docker state (diagnosis)
          ansible.builtin.command: docker ps -a
          register: hindsight_molecule_ps
          changed_when: false
          failed_when: false

        - name: Fail with the captured diagnostics
          ansible.builtin.fail:
            msg: |
              hindsight converge failed.
              docker ps -a:
              {{ hindsight_molecule_ps.stdout | default('') }}
              container logs:
              {{ hindsight_molecule_logs.stdout | default('') }}
              {{ hindsight_molecule_logs.stderr | default('') }}

    # S6: runs the real decommission task file (playbooks/hindsight.yml's
    # own final play, not re-typed here) against the live container this
    # scenario just deployed. The bounded worker has no queued work yet, so
    # this proves the wiring/ordering
    # (role defaults resolve, groups['hindsight_group'] is populated, the
    # dead-signal filter runs against a live hindsight-admin CLI) without
    # decommissioning anything real.
    - name: Run the stale-worker decommission task for real (single host, nothing claimed, nothing stale)
      ansible.builtin.include_role:
        name: hindsight_docker
        tasks_from: decommission_stale_workers.yml
      vars:
        hindsight_docker_db_host: "{{ hindsight_molecule_bridge_gw.stdout | trim }}"
