---
# agent_guest molecule scenario. The toolchain and Cribl Edge installs are
# tagged molecule-notest (skipped via --skip-tags) because they need apt repos,
# the npm registry and release tarballs; what is left is the surface worth
# testing — the autonomous config mirror renderers, the job runner's own
# self-check, the systemd units, and the no-sudo user contract.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

platforms:
  - name: agent-guest-test
    image: geerlingguy/docker-debian12-ansible:latest
    privileged: true
    command: ""
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - ai_agent_pool_group
      - lxc_containers

provisioner:
  name: ansible
  env:
    PROXMOX_SUBDOMAIN: "${PROXMOX_SUBDOMAIN:-molecule.invalid}"
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles

verifier:
  name: ansible

scenario:
  name: agent_guest
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
