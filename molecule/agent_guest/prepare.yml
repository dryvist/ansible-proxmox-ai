---
# Molecule preparation — base packages the role's apt task expects present.

- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        timeout: 30

    - name: Gather facts
      ansible.builtin.setup:

    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
      register: _apt_update_result
      until: _apt_update_result is succeeded
      retries: 3
      delay: 10
      when: ansible_facts['os_family'] == 'Debian'

    # git itself is one of agent_guest_apt_packages, but the whole toolchain
    # install (apt packages, npm CLIs, gitleaks release tarball) is tagged
    # molecule-notest because MOST of it needs real egress (npm registry,
    # GitHub releases). git specifically needs none of that — the base Debian
    # apt repos are already reachable here (the cache update above proves it)
    # — so it is installed in prepare instead of skipped, letting the
    # role's own git_config task actually run and be verified under molecule.
    - name: Install git (so the role's git_config task is exercised, not skipped)
      ansible.builtin.apt:
        name: git
        state: present
      when: ansible_facts['os_family'] == 'Debian'
