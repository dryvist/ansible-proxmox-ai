---
# Molecule converge — exercises the agent_guest render surface. The queue token
# is left empty so the timer stays disabled and no live Vikunja is needed.

- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Normally derived from the squid_group inventory membership and
    # tofu_data.constants — neither exists in a molecule run.
    agent_guest_proxy_host: squid.molecule.invalid
    agent_guest_proxy_port: 3128
    agent_guest_no_proxy: localhost,127.0.0.1,::1,10.0.0.0/8,.molecule.invalid

  tasks:
    - name: Include agent_guest role
      ansible.builtin.include_role:
        name: agent_guest
