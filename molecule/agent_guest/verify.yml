---
# Molecule verification for agent_guest (render surface).
#
# The thing that must not silently break is the single-list inheritance: all
# three tools' policy files derive from agent_guest_residual_deny, so every
# entry must appear in each tool's native format. A renderer that dropped
# entries would otherwise produce a valid-looking config with no protection.

- name: Verify
  hosts: all
  become: true
  gather_facts: false

  vars:
    agent_guest_home: /home/agent

  tasks:
    # policy.yml's own header: "A test that hand-rolled its own `nix eval`
    # would still pass while the converge's own invocation was broken" — so
    # verify uses the SAME interface converge does, not a hand-rolled read of
    # defaults/main.yml. That hand-rolled read was itself a real defect this
    # scenario turned up: agent_guest_residual_deny is resolved at runtime by
    # policy.yml (see its header), not a literal in defaults/main.yml, so
    # `include_vars` on that file alone never contained the key.
    - name: Evaluate the residual deny policy (same interface converge uses)
      ansible.builtin.include_role:
        name: agent_guest
        tasks_from: policy.yml

    - name: Read the rendered policy files
      ansible.builtin.slurp:
        src: "{{ agent_guest_home }}/{{ item }}"
      register: agent_guest_policies
      loop:
        - .claude/settings.json
        - .codex/rules/default.rules
        - .gemini/policies/autonomous.toml

    # Parsed into facts rather than checked as whole-file substrings: a
    # substring match is satisfied by a comment that merely mentions the name.
    # Own task (not no_log, unlike hermes_ui's — none of these three files
    # carry a secret value) so a parse failure is attributable rather than
    # buried inside the assert below.
    - name: Parse the rendered policy files
      vars:
        _codex: "{{ agent_guest_policies.results[1].content | b64decode }}"
      ansible.builtin.set_fact:
        agent_guest_claude: "{{ agent_guest_policies.results[0].content | b64decode | from_json }}"
        agent_guest_gemini: "{{ agent_guest_policies.results[2].content | b64decode | community.general.from_toml }}"
        agent_guest_codex_rules: "{{ _codex.splitlines() | select('match', '^prefix_rule') | list }}"

    - name: Assert every deny prefix reached all three tools in its native format
      # Each comparison is precomputed via its own `{{ }}`-templated var, and
      # `that:` only checks the resulting lengths. A chained
      # filter+regex_replace expression evaluated bare inside `that:` (no
      # `{{ }}`) was empirically observed to disagree with the identical
      # expression evaluated as a `{{ }}` template — reproduced against a
      # fixed, already-converged container (same settings.json both times).
      vars:
        _deny: "{{ agent_guest_residual_deny }}"
        _claude_deny: "{{ agent_guest_claude.permissions.deny }}"
        _gemini_prefixes: "{{ agent_guest_gemini.rule | map(attribute='commandPrefix') | list }}"
        _claude_expected: >-
          {{ _deny | map('regex_replace', '^(.*)$', 'Bash(\1 *)') | list }}
        _claude_missing: "{{ _claude_expected | difference(_claude_deny) }}"
        _gemini_missing: "{{ _deny | difference(_gemini_prefixes) }}"
      ansible.builtin.assert:
        that:
          - _claude_missing | length == 0
          - _gemini_missing | length == 0
          - agent_guest_codex_rules | length == _deny | length
          # bypassPermissions without an enforced deny list is the failure mode
          # this whole mirror exists to prevent.
          - agent_guest_claude.permissions.defaultMode == 'bypassPermissions'
        fail_msg: >-
          The autonomous deny mirror did not reach every tool — one of the three
          renderers dropped entries from agent_guest_residual_deny.
          claude missing={{ _claude_missing }} gemini missing={{ _gemini_missing }}

    - name: Run the job runner's own self-check (parse + launch-flag assertions)
      ansible.builtin.command:
        cmd: /usr/local/bin/agent-task --self-check
      changed_when: false

    - name: Assert no ANTHROPIC_API_KEY assignment was rendered
      # ai_runner seeded it; it outranks CLAUDE_CODE_OAUTH_TOKEN and flips
      # billing off the subscription. This is the regression guard.
      # Anchored to an assignment, not the bare name: the env template carries a
      # comment explaining the absence, and matching that would fail forever.
      ansible.builtin.command:
        cmd: grep -rlE '^[[:space:]]*(export[[:space:]]+)?ANTHROPIC_API_KEY=' /etc/agent-guest /home/agent
      register: agent_guest_anthropic
      changed_when: false
      failed_when: agent_guest_anthropic.rc == 0

    - name: Stat the runner and units
      ansible.builtin.stat:
        path: "{{ item }}"
      register: agent_guest_artifacts
      loop:
        - /usr/local/bin/agent-task
        - /etc/systemd/system/agent-task@.service
        - /etc/systemd/system/agent-queue.timer
        - /etc/agent-guest/openbao-agent.hcl
        - /etc/agent-guest/agent-guest.env

    - name: Assert the runner and units are installed
      ansible.builtin.assert:
        that:
          - agent_guest_artifacts.results | rejectattr('stat.exists') | list | length == 0
          - agent_guest_artifacts.results[0].stat.mode == '0755'
          - agent_guest_artifacts.results[4].stat.mode == '0640'
        fail_msg: "agent_guest runner, units or env file are missing or wrong mode"

    - name: Read the agent user's group membership
      ansible.builtin.command:
        cmd: id -nG agent
      register: agent_guest_groups
      changed_when: false

    - name: Assert the agent user has no sudo path
      ansible.builtin.assert:
        that:
          - "'sudo' not in agent_guest_groups.stdout.split()"
          - "'root' not in agent_guest_groups.stdout.split()"
        fail_msg: "the agent user gained a privileged group — the no-sudo contract is broken"
