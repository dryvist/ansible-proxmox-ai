---
# Backend selection for the llama_cpp role.
#
# WHAT THIS COVERS: the role deploys a PREBUILT upstream binary selected from
# the shared pinned asset names. A wrong selection can run without the intended
# backend, so this checks each backend against the release asset fixture.
#
# WHAT THIS DOES NOT COVER, stated rather than implied: it does not converge the
# role against a GPU. A Docker container has no /dev/nvidia*, no /dev/kfd, and
# no Vulkan ICD, so the device-access tasks and the vulkaninfo visibility gate
# cannot run here. Those are verified on the live guest at converge time — the
# gate exists precisely because that is the only place the answer is real.
- name: Converge
  hosts: all
  gather_facts: false

  vars:
    tofu_data:
      domain: molecule.invalid
      constants:
        service_ports:
          llm_fast_api: 10434

    # Assets from the pinned llama.cpp release, including CUDA assets that must
    # not be selected for the ROCm, Vulkan, or CPU backends.
    upstream_assets:
      - llama-b11459-bin-ubuntu-cuda-13.4-x64.tar.gz
      - cudart-llama-b11459-bin-ubuntu-cuda-13.4-x64.tar.gz
      - llama-b11459-bin-ubuntu-rocm-10.0-x64.tar.gz
      - llama-b11459-bin-ubuntu-vulkan-x64.tar.gz
      - llama-b11459-bin-ubuntu-x64.tar.gz

    expected:
      vulkan:
        asset: llama-b11459-bin-ubuntu-vulkan-x64.tar.gz
        devices: ['/dev/nvidia0', '/dev/nvidiactl', '/dev/nvidia-uvm', '/dev/nvidia-uvm-tools']
        gpu: true
      rocm:
        asset: llama-b11459-bin-ubuntu-rocm-10.0-x64.tar.gz
        devices: ['/dev/kfd', '/dev/dri/card0', '/dev/dri/renderD128']
        gpu: true
      cpu:
        asset: llama-b11459-bin-ubuntu-x64.tar.gz
        devices: ['/dev/kfd', '/dev/dri/card0', '/dev/dri/renderD128']
        gpu: false

  tasks:
    - name: Evaluate the role defaults for each backend
      ansible.builtin.include_tasks: tasks/assert_backend.yml
      loop: "{{ expected | dict2items }}"
      loop_control:
        loop_var: backend
