---
# Asserted per backend. Load the role defaults and shared release defaults
# rather than restating their expressions, so the test follows the real pin.
#
# PRECEDENCE TRAP, found by this scenario on its first run. `include_vars` sits
# at precedence 18 and task-level `vars:` at 17, so include_vars WINS. Setting
# the backend as a task var therefore did nothing at all — every backend
# evaluated as the defaults' `rocm`, and the vulkan case selected the ROCm
# asset. `set_fact` is 19, so it overrides include_vars; the order below is
# load-bearing, not stylistic.
#
- name: "Load the role defaults with backend={{ backend.key }}"
  ansible.builtin.include_vars:
    dir: "{{ playbook_dir }}/../../roles/llama_cpp/defaults/main"

- name: "Load the shared llama.cpp release defaults with backend={{ backend.key }}"
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../roles/llamacpp_release/defaults/main/00-release.yml"

# set_fact (precedence 19) outranks include_vars (18) — see the note above.
- name: "Override the loaded default to backend={{ backend.key }}"
  ansible.builtin.set_fact:
    llama_cpp_gpu_backend: "{{ backend.key }}"

- name: "Select the pinned asset for backend={{ backend.key }}"
  ansible.builtin.set_fact:
    matched: >-
      {{ upstream_assets
         | select('equalto', llama_cpp_llamacpp_asset_name) | list }}

- name: "Assert the pinned asset exists exactly once for backend={{ backend.key }}"
  ansible.builtin.assert:
    that:
      - matched | length == 1
    fail_msg: >-
      backend={{ backend.key }} matched {{ matched | length }} assets
      ({{ matched }}). The shared release pin must name exactly one asset in
      the fixture.

- name: "Assert the matched asset is the intended one for backend={{ backend.key }}"
  ansible.builtin.assert:
    that:
      - matched | first == backend.value.asset
    fail_msg: >-
      backend={{ backend.key }} selected {{ matched | first }}, expected
      {{ backend.value.asset }}.
    success_msg: "backend={{ backend.key }} -> {{ matched | first }}"

- name: "Assert the device-node set for backend={{ backend.key }}"
  ansible.builtin.assert:
    that:
      - (llama_cpp_gpu_device_nodes | default([])) == backend.value.devices
    fail_msg: >-
      backend={{ backend.key }} resolved device nodes
      {{ llama_cpp_gpu_device_nodes | default([]) }}, expected
      {{ backend.value.devices }}. The NVIDIA guest has no /dev/dri at all, so
      carrying the AMD list across backends fails the device-presence assert
      and reads as broken passthrough rather than as a wrong list.

- name: "Assert the derived GPU boolean for backend={{ backend.key }}"
  ansible.builtin.assert:
    that:
      - (llama_cpp_gpu | bool) == backend.value.gpu
    fail_msg: >-
      backend={{ backend.key }} derived llama_cpp_gpu={{ llama_cpp_gpu }},
      expected {{ backend.value.gpu }}. Every pre-existing GPU task keys off
      this boolean, so getting it wrong silently skips or runs all of them.
