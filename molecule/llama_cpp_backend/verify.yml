---
# The per-guest parameter ceiling.
#
# The role carries TWO size guards and they are not the same thing:
#   - an ABSOLUTE >=14B rule scoped to llm_fast_group, from four host
#     hard-locks on that card. Untouched, and must stay untouched.
#   - a per-guest ceiling that applies everywhere, added because outside
#     llm_fast_group the role previously enforced NOTHING — a new guest served
#     any size at all by virtue of being in a different group.
#
# This exercises only the model guard. Including the full install entrypoint
# would also require a real proxy and package changes, neither of which this
# scenario needs to validate.
- name: Verify
  hosts: all
  gather_facts: false

  vars:
    tofu_data:
      domain: molecule.invalid
      constants:
        service_ports:
          llm_fast_api: 10434

  tasks:
    - name: Converge with a model above the ceiling
      block:
        - name: Include the role with an oversized model
          ansible.builtin.include_role:
            name: llama_cpp
            tasks_from: guards.yml
          vars:
            llama_cpp_max_param_billions: 28
            llama_cpp_models:
              - name: oversized
                aliases: []
                hf_repo: molecule/Oversized
                gguf: oversized.gguf
                param_billions: 999
                embeddings: false

        - name: Record that the ceiling did NOT fire
          ansible.builtin.set_fact:
            ceiling_failure_task: ""
            ceiling_failure_message: ""

      rescue:
        - name: Record the failing guard task and its message
          ansible.builtin.set_fact:
            ceiling_failure_task: "{{ ansible_failed_task.name | default('') }}"
            ceiling_failure_message: "{{ ansible_failed_result.msg | default('') }}"

    - name: Assert the ceiling refused the oversized model
      ansible.builtin.assert:
        that:
          - ceiling_failure_task == "Assert no model exceeds this guest's parameter ceiling"
          - >-
            "oversized" in ceiling_failure_message
            and "ceiling of" in ceiling_failure_message
            and "28B" in ceiling_failure_message
        fail_msg: >-
          The 999B model did not fail at the per-guest 28B ceiling. Failure:
          {{ ceiling_failure_task }}: {{ ceiling_failure_message }}
        success_msg: The per-guest ceiling refused a model above the limit.

    - name: Report how many assertions this scenario ran
      ansible.builtin.debug:
        msg: >-
          llama_cpp_backend ran 1 ceiling assertion here, plus 4 per backend
          across 3 backends (12) in converge = 13 total.
