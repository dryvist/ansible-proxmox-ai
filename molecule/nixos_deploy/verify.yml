---
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: A deploy missing any required field must be refused
      block:
        - name: Re-enter the role with the field emptied
          ansible.builtin.include_role:
            name: nixos_deploy
          vars:
            nixos_deploy_flake_ref: "{{ 'github:dryvist/nix-ai/x' if item != 'flake_ref' else '' }}"
            nixos_deploy_host_attr: "{{ 'herdr' if item != 'host_attr' else '' }}"
            nixos_deploy_target: "{{ 'root@herdr.molecule.invalid' if item != 'target' else '' }}"

        - name: The guard did not fire
          ansible.builtin.fail:
            msg: >-
              nixos_deploy accepted a spec with an empty {{ item }}. A partially
              specified deploy builds the wrong configuration or pushes it at
              the wrong guest, and both fail late and confusingly.
      rescue:
        - name: Expected refusal
          ansible.builtin.debug:
            msg: "nixos_deploy refused a spec with an empty {{ item }}, as it must."
      loop:
        - flake_ref
        - host_attr
        - target

    # A positive control does not validate the question on its own, but its
    # absence would leave the loop above passing for the wrong reason — an
    # always-failing role satisfies every negative case.
    - name: A fully specified deploy must pass the guard
      ansible.builtin.include_role:
        name: nixos_deploy
      vars:
        nixos_deploy_flake_ref: "github:dryvist/nix-ai/molecule-not-a-real-ref"
        nixos_deploy_host_attr: herdr
        nixos_deploy_target: "root@herdr.molecule.invalid"
