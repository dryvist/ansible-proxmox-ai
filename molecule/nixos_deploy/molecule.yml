---
# nixos_deploy runs `nixos-rebuild --target-host` on the CONTROLLER, which
# needs nix and a real NixOS guest — neither exists on a CI runner, and that
# task carries molecule-notest accordingly. What is left, and what this
# scenario covers, is the guard in front of it: a partially specified deploy
# either builds the wrong configuration or pushes it at the wrong guest, and
# both fail late and confusingly.
#
# The guard is the entire untagged surface of the role, so a scenario that only
# fed it valid input would assert nothing at all. verify.yml drives each
# required field into its empty state and requires the refusal.

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

platforms:
  - name: nixos-deploy-test
    # No stable version tags available; geerlingguy only publishes :latest
    image: geerlingguy/docker-debian12-ansible:latest
    privileged: true
    command: ""
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - herdr_group
      - lxc_containers

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles

verifier:
  name: ansible

scenario:
  name: nixos_deploy
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
