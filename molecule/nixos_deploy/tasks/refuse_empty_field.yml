---
# One negative control, parameterised by `field`. A block cannot carry `loop`,
# so the loop lives on the include in verify.yml.
- name: Refuse a deploy missing the field
  block:
    - name: Re-enter the role with an emptied field
      ansible.builtin.include_role:
        name: nixos_deploy
      vars:
        nixos_deploy_flake_ref: "{{ '' if field == 'flake_ref' else 'github:dryvist/nix-ai/molecule-not-a-real-ref' }}"
        nixos_deploy_host_attr: "{{ '' if field == 'host_attr' else 'herdr' }}"
        nixos_deploy_target: "{{ '' if field == 'target' else 'root@herdr.molecule.invalid' }}"

    - name: The guard did not fire
      ansible.builtin.fail:
        msg: >-
          nixos_deploy accepted a spec with an empty {{ field }}. A partially
          specified deploy builds the wrong configuration or pushes it at the
          wrong guest, and both fail late and confusingly.
  rescue:
    - name: Record the expected refusal
      ansible.builtin.debug:
        msg: "nixos_deploy refused a spec with an empty {{ field }}, as it must."
