---
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    nixos_deploy_flake_ref: "github:dryvist/nix-ai/molecule-not-a-real-ref"
    nixos_deploy_host_attr: herdr

  tasks:
    # The nixos-rebuild task itself is molecule-notest, so this exercises the
    # guard and the variable plumbing that feeds it, nothing more.
    - name: Include nixos_deploy role
      ansible.builtin.include_role:
        name: nixos_deploy
