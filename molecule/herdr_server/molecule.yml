---
# herdr_server is a THIN role: the server, the agent CLIs, the hail bridge and
# every systemd unit come from nix-ai the flake, converged by nixos_deploy on
# the controller. There is no NixOS host here and no nix on the runner, so
# herdr_server_deploy_enabled is false in converge.yml and this scenario
# exercises the part this role actually owns — the two rendered
# EnvironmentFiles and their permissions.
#
# That is the repo's stated convention: test the render surface, tag the
# network- and platform-dependent tasks out.

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

platforms:
  - name: herdr-server-test
    # No stable version tags available; geerlingguy only publishes :latest
    image: geerlingguy/docker-debian12-ansible:latest
    privileged: true
    command: ""
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - herdr_group
      - lxc_containers

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles

verifier:
  name: ansible

scenario:
  name: herdr_server
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
