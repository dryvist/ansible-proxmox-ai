---
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    # No NixOS host and no nix on the runner: skip the controller-side
    # nixos-rebuild and the systemd management, leaving the EnvironmentFile
    # renders — the part this role owns.
    herdr_server_deploy_enabled: false
    herdr_server_model_base_url: "https://llm.molecule.invalid/v1"
    herdr_server_model_api_key: "sk-molecule-not-a-real-key"
    herdr_server_anthropic_api_key: "sk-ant-molecule-not-a-real-key"
    herdr_server_openai_api_key: "sk-molecule-not-a-real-direct-key"
    herdr_server_extra_env:
      HERDR_LOG_LEVEL: debug
    herdr_server_hail_slack_bot_token: "xoxb-molecule-not-a-real-token"
    herdr_server_hail_slack_app_token: "xapp-molecule-not-a-real-token"
    herdr_server_hail_slack_channel: "C0MOLECULE"
    herdr_server_hail_slack_allowed_users: "U0MOLECULE"
    herdr_server_hail_extra_env:
      HERDR_HAIL_LOG_LEVEL: debug

  tasks:
    - name: Include herdr_server role
      ansible.builtin.include_role:
        name: herdr_server
