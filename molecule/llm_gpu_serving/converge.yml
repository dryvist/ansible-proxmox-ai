---
- name: Render GPU serving units for every profile
  hosts: all
  gather_facts: true

  vars:
    llm_gpu_serving_systemd_dir: /tmp/llm-gpu-serving-units
    llm_gpu_serving_model_cache_mount_path: /tmp/model-cache
    llm_gpu_serving_api_port: 10434
    llm_gpu_serving_listen_host: LISTEN_ADDRESS
    llm_gpu_serving_render_only: true

  tasks:
    - name: Create the test unit directory
      ansible.builtin.file:
        path: "{{ llm_gpu_serving_systemd_dir }}"
        state: directory
        mode: "0755"

    - name: Render role systemd units
      ansible.builtin.include_role:
        name: llm_gpu_serving
        tasks_from: render-units.yml
