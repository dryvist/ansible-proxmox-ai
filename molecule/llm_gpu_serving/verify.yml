---
- name: Verify rendered GPU serving units
  hosts: all
  gather_facts: false

  vars:
    llm_gpu_serving_systemd_dir: /tmp/llm-gpu-serving-units
    expected_units:
      - llm-gpu-serving-small.service
      - llm-gpu-serving-medium-a.service
    disabled_units:
      - llm-gpu-serving-medium-b.service
      - llm-gpu-serving-max.service

  tasks:
    - name: Inspect the rendered profile units
      ansible.builtin.stat:
        path: "{{ llm_gpu_serving_systemd_dir }}/{{ item }}"
      loop: "{{ expected_units }}"
      register: llm_gpu_serving_rendered_units

    - name: Assert every profile unit rendered
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
      loop: "{{ llm_gpu_serving_rendered_units.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect disabled profile units
      ansible.builtin.stat:
        path: "{{ llm_gpu_serving_systemd_dir }}/{{ item }}"
      loop: "{{ disabled_units }}"
      register: llm_gpu_serving_disabled_units

    - name: Assert disabled profile units were not rendered
      ansible.builtin.assert:
        that:
          - not item.stat.exists
      loop: "{{ llm_gpu_serving_disabled_units.results }}"
      loop_control:
        label: "{{ item.item }}"
