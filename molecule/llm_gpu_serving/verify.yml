---
- name: Verify rendered GPU serving units
  hosts: all
  gather_facts: false

  vars:
    llm_gpu_serving_systemd_dir: /tmp/llm-gpu-serving-units
    expected_units:
      - llm-gpu-serving-small.service
      - llm-gpu-serving-medium-a.service
      - llm-gpu-serving-medium-b.service
      - llm-gpu-serving-max.service

  tasks:
    - name: Inspect the rendered profile units
      ansible.builtin.stat:
        path: "{{ llm_gpu_serving_systemd_dir }}/{{ item }}"
      loop: "{{ expected_units }}"
      register: llm_gpu_serving_rendered_units

    - name: Assert every profile unit rendered
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
      loop: "{{ llm_gpu_serving_rendered_units.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the llama.cpp profile unit
      ansible.builtin.slurp:
        src: "{{ llm_gpu_serving_systemd_dir }}/llm-gpu-serving-medium-b.service"
      register: llm_gpu_serving_llama_unit

    - name: Read the small GGUF profile unit
      ansible.builtin.slurp:
        src: "{{ llm_gpu_serving_systemd_dir }}/llm-gpu-serving-small.service"
      register: llm_gpu_serving_small_unit

    - name: Assert the GGUF profile unit runs llama-server with its slots
      ansible.builtin.assert:
        that:
          - "'/llama.cpp/llama-server' in (llm_gpu_serving_llama_unit.content | b64decode)"
          - "'--parallel ' in (llm_gpu_serving_llama_unit.content | b64decode)"
          - "'--jinja' in (llm_gpu_serving_llama_unit.content | b64decode)"
          - "'vllm serve' not in (llm_gpu_serving_llama_unit.content | b64decode)"

    - name: Assert the small profile unit runs the pinned GGUF with four slots
      ansible.builtin.assert:
        that:
          - "'/llama.cpp/llama-server' in (llm_gpu_serving_small_unit.content | b64decode)"
          - "'Qwen3.5-9B-Q4_K_M.gguf' in (llm_gpu_serving_small_unit.content | b64decode)"
          - "'--ctx-size 32768' in (llm_gpu_serving_small_unit.content | b64decode)"
          - "'--parallel 4' in (llm_gpu_serving_small_unit.content | b64decode)"
          - "'--n-gpu-layers 99' in (llm_gpu_serving_small_unit.content | b64decode)"
          - "'--flash-attn on' in (llm_gpu_serving_small_unit.content | b64decode)"
          - "'--jinja' in (llm_gpu_serving_small_unit.content | b64decode)"
          - "'vllm serve' not in (llm_gpu_serving_small_unit.content | b64decode)"
