---
- name: Render Laya service files without installing GPU packages
  hosts: all
  gather_facts: true
  vars:
    laya_systemone_api_key: fixture-token-123
    laya_systemone_render_only: true
    laya_systemone_env_dir: "{{ playbook_dir }}/../../.task-tmp/laya-systemone/etc"
    laya_systemone_env_file: "{{ laya_systemone_env_dir }}/laya.env"
    laya_systemone_unit_path: "{{ playbook_dir }}/../../.task-tmp/laya-systemone/systemd/laya-systemone.service"
    laya_systemone_user: llm-gpu-serving
    laya_systemone_group: llm-gpu-serving
    laya_systemone_venv: /opt/laya-systemone/venv
    nvidia_gpu_guest_data_dir: /var/lib/llm-gpu-serving
    nvidia_gpu_guest_hf_home: /var/lib/llm-gpu-serving/.cache/huggingface
  tasks:
    - name: Create the test systemd directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../.task-tmp/laya-systemone/systemd"
        state: directory
        mode: "0755"

    - name: Render Laya service files
      ansible.builtin.include_role:
        name: laya_systemone
        tasks_from: render-unit.yml
