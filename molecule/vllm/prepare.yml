---
# Molecule preparation playbook for the vllm role.
#
# Deliberately thin. Every task that touches apt, the NVIDIA repo, the GPU
# device nodes, the venv, or systemd is skipped under Docker virtualization by
# the role itself, so nothing here needs to fake a GPU. What remains — the
# parameter-ceiling assert and the rendered systemd unit — is what this
# scenario exists to cover, and both run unmodified in a plain container.

- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        timeout: 30

    - name: Gather facts
      ansible.builtin.setup:
