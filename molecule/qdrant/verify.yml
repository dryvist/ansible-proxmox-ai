---
# Molecule verification playbook
# Validates that the qdrant_docker role executed correctly

- name: Verify
  hosts: all
  become: true
  gather_facts: true

  vars:
    qdrant_docker_data_dir: /opt/qdrant
    qdrant_docker_image_repo: "qdrant/qdrant"
    qdrant_docker_container_name: qdrant
    qdrant_docker_http_port: 6333

  tasks:
    - name: Check qdrant data directories exist
      ansible.builtin.stat:
        path: "{{ qdrant_docker_data_dir }}/{{ item }}"
      register: qdrant_dir_check
      loop:
        - storage
        - snapshots
        - config

    - name: Assert qdrant data directories exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "Qdrant directory not found: {{ item.item }}"
      loop: "{{ qdrant_dir_check.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check docker-compose.yml was deployed
      ansible.builtin.stat:
        path: "{{ qdrant_docker_data_dir }}/docker-compose.yml"
      register: compose_file

    - name: Assert docker-compose.yml exists
      ansible.builtin.assert:
        that:
          - compose_file.stat.exists
        fail_msg: "docker-compose.yml not found - template was not deployed"

    - name: Read docker-compose.yml content
      ansible.builtin.slurp:
        src: "{{ qdrant_docker_data_dir }}/docker-compose.yml"
      register: compose_content

    # Parsed into a fact rather than checked as a whole-file substring: a
    # substring match is satisfied by a comment that merely mentions the name,
    # which is how a dead/renamed variable can survive verify indefinitely.
    - name: Parse the rendered docker-compose file
      ansible.builtin.set_fact:
        qdrant_compose: "{{ compose_content.content | b64decode | from_yaml }}"

    - name: Assert docker-compose.yml references correct qdrant image and container name
      ansible.builtin.assert:
        that:
          - qdrant_docker_image_repo in qdrant_compose.services.qdrant.image
          - qdrant_compose.services.qdrant.container_name == qdrant_docker_container_name
        fail_msg: >-
          docker-compose.yml service block does not match the expected
          image/container name (got {{ qdrant_compose.services.qdrant }})

    - name: Assert docker-compose.yml mounts required volumes
      vars:
        qdrant_expected_volumes:
          - "{{ qdrant_docker_data_dir }}/storage:/qdrant/storage"
          - "{{ qdrant_docker_data_dir }}/snapshots:/qdrant/snapshots"
          - "{{ qdrant_docker_data_dir }}/config/config.yaml:/qdrant/config/production.yaml:ro"
      ansible.builtin.assert:
        that:
          - qdrant_expected_volumes | difference(qdrant_compose.services.qdrant.volumes) | length == 0
        fail_msg: >-
          docker-compose.yml is missing required Qdrant volume mounts
          (got {{ qdrant_compose.services.qdrant.volumes }})

    - name: Check config.yaml was deployed
      ansible.builtin.stat:
        path: "{{ qdrant_docker_data_dir }}/config/config.yaml"
      register: config_file

    - name: Assert config.yaml exists
      ansible.builtin.assert:
        that:
          - config_file.stat.exists
        fail_msg: "config.yaml not found - template was not deployed"

    - name: Read config.yaml content
      ansible.builtin.slurp:
        src: "{{ qdrant_docker_data_dir }}/config/config.yaml"
      register: config_content

    - name: Parse the rendered qdrant config.yaml
      ansible.builtin.set_fact:
        qdrant_config: "{{ config_content.content | b64decode | from_yaml }}"

    - name: Assert config.yaml has expected content
      ansible.builtin.assert:
        that:
          - qdrant_config.storage.storage_path == '/qdrant/storage'
          - qdrant_config.storage.snapshots_path == '/qdrant/snapshots'
          - qdrant_config.service.http_port == 6333
          - qdrant_config.service.grpc_port == 6334
        fail_msg: "config.yaml does not contain expected Qdrant configuration ({{ qdrant_config }})"

    - name: Check Docker service is running
      ansible.builtin.systemd:
        name: docker
      register: docker_status
      failed_when: false

    - name: Assert Docker service is active
      ansible.builtin.assert:
        that:
          - docker_status.status.ActiveState == 'active'
        fail_msg: >-
          Docker service is not running
          (ActiveState: {{ docker_status.status.ActiveState | default('unknown') }})

    - name: Check qdrant container was started
      ansible.builtin.shell: >
        docker ps -a --filter "name=^qdrant$" --quiet
      register: container_exists
      changed_when: false

    - name: Assert qdrant container was created and started
      ansible.builtin.assert:
        that:
          - container_exists.stdout | length > 0
        fail_msg: "Qdrant container was never started by docker-compose"

    - name: Verify qdrant health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ qdrant_docker_http_port }}/healthz"
        method: GET
        status_code: 200
      register: qdrant_health
      retries: 10
      delay: 5
      until: qdrant_health.status == 200
      changed_when: false
