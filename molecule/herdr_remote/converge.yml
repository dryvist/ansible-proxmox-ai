---
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    # No NixOS host and no nix on the runner: skip the controller-side
    # nixos-rebuild and the systemd management, leaving the EnvironmentFile
    # render — the part this role owns.
    herdr_remote_deploy_enabled: false
    # Normally derived from herdr_group via the tofu-derived inventory.
    herdr_remote_remotes: "herdr.molecule.invalid"
    herdr_remote_hostname: "herdr.molecule.invalid"
    herdr_remote_trusted_origins: "https://herdr.molecule.invalid"
    herdr_remote_relay_token: "molecule-not-a-real-relay-token"
    herdr_remote_extra_env:
      HERDR_REMOTE_LOG_LEVEL: debug

  tasks:
    - name: Include herdr_remote role
      ansible.builtin.include_role:
        name: herdr_remote
