---
# herdr_remote is a THIN role: the relay and its unit come from nix-ai the
# flake. As with herdr_server, the deploy gate is false here and the scenario
# covers the rendered EnvironmentFile plus the two asserts the role makes
# BEFORE it renders anything — the unauthenticated-bind guard in particular,
# which is the one failure that would be invisible at runtime.

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

platforms:
  - name: herdr-ui-test
    # No stable version tags available; geerlingguy only publishes :latest
    image: geerlingguy/docker-debian12-ansible:latest
    privileged: true
    command: ""
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - herdr_ui_group
      - lxc_containers

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles

verifier:
  name: ansible

scenario:
  name: herdr_remote
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
