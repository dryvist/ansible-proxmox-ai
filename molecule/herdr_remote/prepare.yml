---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for the container to accept connections
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Gather facts
      ansible.builtin.setup:

    # NixOS creates this user and directory on a real guest. Stand them up here
    # so the template task under test has a valid owner to chown to.
    - name: Create the herdr-remote service user
      ansible.builtin.user:
        name: herdr-remote
        system: true
        home: /var/lib/herdr-remote
        create_home: true
        shell: /usr/sbin/nologin
