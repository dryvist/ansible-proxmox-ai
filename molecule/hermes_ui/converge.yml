---
# Molecule converge playbook
# Tests the hermes_ui_docker role against the test container. Both apps are
# stateless-enough for CI: mission-control's SQLite lives on the bind mount,
# hermes-workspace holds no state of its own.

- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Use the installed FUSE driver inside the privileged test container.
    hermes_ui_docker_storage_driver: fuse-overlayfs
    # Values normally injected from tofu_data.constants / OpenBao
    hermes_ui_docker_workspace_port: 3000
    hermes_ui_docker_mission_control_port: 3001
    hermes_ui_docker_workspace_password: molecule-test-password
    hermes_ui_docker_mission_control_auth_user: molecule-admin
    hermes_ui_docker_mission_control_auth_pass: molecule-test-password
    # The production readiness gate assumes a real fabric hostname; point it
    # somewhere inert instead (never called during converge — hermes-workspace
    # does not health-check its own gateway on boot).
    hermes_ui_docker_workspace_hermes_api_url: "http://127.0.0.1:9"
    hermes_ui_docker_workspace_hermes_dashboard_url: "http://127.0.0.1:9"
    hermes_ui_docker_mission_control_allowed_hosts: "localhost,127.0.0.1"
    # The runner builds and saves mission-control (see _molecule.yml); compose
    # uses the image loaded below instead of building it in this instance.
    hermes_ui_docker_mission_control_build_policy: never

  tasks:
    - name: Bootstrap Docker (same role the hermes_ui_docker meta dependency uses)
      ansible.builtin.include_role:
        name: docker_engine
      vars:
        docker_engine_configure_daemon_json: true
        docker_engine_storage_driver: fuse-overlayfs

    - name: Check whether the mission-control image is already loaded
      ansible.builtin.command: docker image inspect homelab/mission-control:local
      register: hermes_ui_molecule_mc_image
      changed_when: false
      failed_when: false

    - name: Require the runner-built mission-control tarball path
      ansible.builtin.assert:
        that:
          - lookup('env', 'HERMES_UI_MISSION_CONTROL_IMAGE_TAR') | length > 0
        fail_msg: HERMES_UI_MISSION_CONTROL_IMAGE_TAR must name the saved mission-control image.
      when: hermes_ui_molecule_mc_image.rc != 0

    - name: Copy the runner-built mission-control image into the instance
      ansible.builtin.copy:
        src: "{{ lookup('env', 'HERMES_UI_MISSION_CONTROL_IMAGE_TAR') }}"
        dest: /var/tmp/mission-control-image.tar
        mode: "0600"
      when: hermes_ui_molecule_mc_image.rc != 0

    - name: Load the mission-control image into the instance's Docker daemon
      ansible.builtin.command: docker load --input /var/tmp/mission-control-image.tar
      changed_when: true
      when: hermes_ui_molecule_mc_image.rc != 0

    - name: Remove the mission-control tarball from the instance
      ansible.builtin.file:
        path: /var/tmp/mission-control-image.tar
        state: absent
      when: hermes_ui_molecule_mc_image.rc != 0

    - name: Converge hermes-ui with container-log capture on failure
      block:
        - name: Include hermes_ui_docker role
          ansible.builtin.include_role:
            name: hermes_ui_docker
      rescue:
        - name: Dump hermes-workspace container logs (diagnosis)
          ansible.builtin.command: docker logs --tail 80 hermes-workspace
          register: hermes_ui_molecule_workspace_logs
          changed_when: false
          failed_when: false

        - name: Dump mission-control container logs (diagnosis)
          ansible.builtin.command: docker logs --tail 80 mission-control
          register: hermes_ui_molecule_mc_logs
          changed_when: false
          failed_when: false

        - name: Dump docker state (diagnosis)
          ansible.builtin.command: docker ps -a
          register: hermes_ui_molecule_ps
          changed_when: false
          failed_when: false

        - name: Fail with the captured diagnostics
          ansible.builtin.fail:
            msg: |
              hermes-ui converge failed.
              docker ps -a:
              {{ hermes_ui_molecule_ps.stdout | default('') }}
              hermes-workspace logs:
              {{ hermes_ui_molecule_workspace_logs.stdout | default('') }}
              {{ hermes_ui_molecule_workspace_logs.stderr | default('') }}
              mission-control logs:
              {{ hermes_ui_molecule_mc_logs.stdout | default('') }}
              {{ hermes_ui_molecule_mc_logs.stderr | default('') }}
