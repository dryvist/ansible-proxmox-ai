---
# Molecule verification playbook
# Validates that the hermes_ui_docker role executed correctly

- name: Verify
  hosts: all
  become: true
  gather_facts: true

  vars:
    hermes_ui_docker_data_dir: /opt/hermes-ui
    hermes_ui_docker_workspace_port: 3000
    hermes_ui_docker_mission_control_port: 3001

  tasks:
    - name: Stat the rendered docker-compose file
      ansible.builtin.stat:
        path: "{{ hermes_ui_docker_data_dir }}/docker-compose.yml"
      register: hermes_ui_compose_stat

    - name: Assert compose file exists with restricted mode
      ansible.builtin.assert:
        that:
          - hermes_ui_compose_stat.stat.exists
          - hermes_ui_compose_stat.stat.mode == '0600'

    - name: Read the rendered compose file
      ansible.builtin.slurp:
        src: "{{ hermes_ui_docker_data_dir }}/docker-compose.yml"
      register: hermes_ui_compose_content
      no_log: true

    - name: Assert compose wiring (both services, distinct ports, secrets present)
      ansible.builtin.assert:
        that:
          - "'ghcr.io/outsourc-e/hermes-workspace' in hermes_ui_compose_rendered"
          - "'HERMES_PASSWORD' in hermes_ui_compose_rendered"
          - "'./mission-control' in hermes_ui_compose_rendered"
          - "'NEXT_PUBLIC_GATEWAY_OPTIONAL: \"true\"' in hermes_ui_compose_rendered"
          - "'3000:3000' in hermes_ui_compose_rendered"
          - "'3001:3000' in hermes_ui_compose_rendered"
      vars:
        hermes_ui_compose_rendered: "{{ hermes_ui_compose_content.content | b64decode }}"
      no_log: true

    - name: Check both containers are running
      ansible.builtin.command: >-
        docker ps --filter status=running
        --format {% raw %}'{{ .Names }}'{% endraw %}
      register: hermes_ui_ps
      changed_when: false

    - name: Assert hermes-workspace and mission-control containers are running
      ansible.builtin.assert:
        that:
          - "'hermes-workspace' in hermes_ui_ps.stdout"
          - "'mission-control' in hermes_ui_ps.stdout"

    - name: Verify mission-control health endpoint answers 200
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ hermes_ui_docker_mission_control_port }}/api/status?action=health"
        method: GET
        status_code: 200
      retries: 12
      delay: 10
      register: hermes_ui_verify_mc_health
      until: hermes_ui_verify_mc_health.status == 200
