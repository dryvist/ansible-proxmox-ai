---
# Ansible collections required for this repository
# Note: ansible.builtin is not listed as it's included with ansible-core
collections:
  # RustFS inventory resolver: s3_object
  - name: amazon.aws
    version: "12.0.0"

  - name: ansible.posix
    version: "2.2.2"

  # ipaddr/ipv4 filters used by the download_vpn role
  - name: ansible.utils
    version: "6.1.1"

  # from_toml filter; proxmox_pct_remote connection plugin
  - name: community.general
    version: "13.5.0"

  # proxmox_pct_remote connection plugin (LXC) and the local backend.
  - name: community.proxmox
    version: "2.1.0"

  # docker_compose_v2 added in 3.6.0; docker_compose_v2_exec (3.13.0)
  - name: community.docker
    version: "5.4.0"

  # openbao_secrets role: vault_login (approle) + vault_kv2_get (needs python hvac)
  - name: community.hashi_vault
    version: "7.1.0"

  # postgres role: postgresql_user/_db/_privs idempotent role+db creation
  - name: community.postgresql
    version: "5.1.0"

  # Shared homelab roles. A collection, not a `roles:` git entry:
  # `ansible-galaxy role install` archives the whole repo, then picks what to
  # install by taking the SHORTEST path above any meta/main.yml it finds. The
  # name in the entry selects nothing. A repo holding one role resolves to that
  # role and looks correct; add a second role that sorts shorter and the same
  # pin silently installs that one instead, still under the requested name — at
  # this pin it installed cribl_edge as roles/inventory_resolve. A collection
  # installs from the subdirectory holding galaxy.yml, so every role in it is
  # addressed unambiguously by FQCN.
  #
  # Pinned to the v5.49.0 release commit. Renovate tracks the release tag.
  # renovate: datasource=github-tags depName=dryvist/homelab-contracts currentValue=v5.63.0
  - name: https://github.com/dryvist/homelab-contracts.git#/ansible/
    type: git
    version: 766af85c2d0878f58b62ceccc90e4ee58ac01b13

  # Shared Hermes runtime installer and systemd units.
  # renovate: datasource=github-tags depName=jpe-ansible/ansible-ai-agents currentValue=v1.2.10
  - name: https://github.com/jpe-ansible/ansible-ai-agents.git
    type: git
    version: b148612ce8989ac290f3977759ef51655db90da0

# No `roles:` section — inventory_resolve comes from the collection above, by
# FQCN, for the reason stated there.
