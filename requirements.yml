---
# Ansible collections required for this repository
# Note: ansible.builtin is not listed as it's included with ansible-core
collections:
  # RustFS inventory resolver: s3_object
  - name: amazon.aws
    version: "12.0.0"

  - name: ansible.posix
    version: "2.2.2"

  # ipaddr/ipv4 filters used by the download_vpn role
  - name: ansible.utils
    version: "6.1.1"

  # from_toml filter; proxmox_pct_remote connection plugin
  - name: community.general
    version: "13.5.0"

  # community.proxmox 2.0.0's proxmox_pct_remote connection plugin calls
  # self._raise_paramiko_connect_exception(), a helper a ruff-style refactor
  # (upstream PR #372, commit 0ffe419) extracted a call to but never actually
  # added — the method has never existed. Any LXC connect failure other than
  # a bad host key or a failed auth (closed port, timeout, DNS, no route to
  # host) crashes with an unrelated AttributeError instead of a real message,
  # masking the actual cause. Confirmed present in every released version
  # (1.6.0 through 2.0.0) and on the collection's current main branch; not a
  # paramiko-version issue — reproduced identically regardless of paramiko
  # version. Tracked upstream at
  # https://github.com/ansible-collections/community.proxmox/issues/477, fix
  # pending in https://github.com/ansible-collections/community.proxmox/pull/492
  # (MERGED 2026-08-12) -- but no release carries it yet: Galaxy's newest
  # published version is still 2.0.0. So the fork pin stays until upstream
  # publishes, then this whole entry is replaced by a plain Galaxy pin.
  #
  # Two annotations, because they answer different questions. The upstream
  # watch below bumps `upstream-latest` when community.proxmox publishes --
  # that PR IS the signal to delete the fork. Digest-tracking the fork alone
  # would only ever say "the fork moved", never "you can stop using it", which
  # is how a workaround outlives its cause.
  # renovate: datasource=github-tags depName=viniciussaporto/community.proxmox
  # upstream-latest: 2.0.0
  # renovate: datasource=github-tags depName=viniciussaporto/community.proxmox currentValue=2.0.0
  - name: https://github.com/viniciussaporto/community.proxmox.git
    type: git
    version: de9df0164413ef813844cc38464b843b03ae23fe

  # docker_compose_v2 added in 3.6.0; docker_compose_v2_exec (3.13.0)
  - name: community.docker
    version: "5.4.0"

  # openbao_secrets role: vault_login (approle) + vault_kv2_get (needs python hvac)
  - name: community.hashi_vault
    version: "7.1.0"

  # postgres role: postgresql_user/_db/_privs idempotent role+db creation
  - name: community.postgresql
    version: "5.0.0"

  # Shared homelab roles. A collection, not a `roles:` git entry:
  # `ansible-galaxy role install` archives the whole repo, then picks what to
  # install by taking the SHORTEST path above any meta/main.yml it finds. The
  # name in the entry selects nothing. A repo holding one role resolves to that
  # role and looks correct; add a second role that sorts shorter and the same
  # pin silently installs that one instead, still under the requested name — at
  # this pin it installed cribl_edge as roles/inventory_resolve. A collection
  # installs from the subdirectory holding galaxy.yml, so every role in it is
  # addressed unambiguously by FQCN.
  #
  # Pinned to the v5.34.0 release commit. Renovate tracks the release tag.
  # renovate: datasource=github-tags depName=dryvist/homelab-contracts currentValue=v5.34.0
  - name: https://github.com/dryvist/homelab-contracts.git#/ansible/
    type: git
    version: f1d752f8f5f10d433143506da787d7e3983300a9

  # Shared Hermes runtime installer and systemd units.
  # renovate: datasource=github-tags depName=jpe-ansible/ansible-ai-agents currentValue=v1.2.5
  - name: https://github.com/jpe-ansible/ansible-ai-agents.git
    type: git
    version: 97ec52618afd8e1fd4cff8aa3e4b1f213fc117b5

# No `roles:` section — inventory_resolve comes from the collection above, by
# FQCN, for the reason stated there.
