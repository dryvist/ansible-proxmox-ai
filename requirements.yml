---
# Ansible collections required for this repository
# Note: ansible.builtin is not listed as it's included with ansible-core
collections:
  - name: amazon.aws
    version: ">=9.0.0"  # RustFS inventory resolver: s3_object

  - name: ansible.posix
    version: ">=1.3.0"

  - name: ansible.utils
    version: ">=2.10.0"  # ipaddr/ipv4 filters used by the download_vpn role

  - name: community.general
    version: ">=10.3.0"  # Required for proxmox_pct_remote connection plugin

  # Better proxmox_pct_remote implementation. Ceiling at <2.0.0: validate_certs
  # default flips to true at 2.0.0; opt in deliberately rather than inherit
  # the change silently.
  - name: community.proxmox
    version: ">=2.0.0,<2.1.0"

  - name: community.docker
    version: ">=3.6.0"  # docker_compose_v2 module added in 3.6.0

  - name: community.hashi_vault
    version: ">=6.0.0"  # openbao_secrets role: vault_login (approle) + vault_kv2_get (needs python hvac)

  - name: community.postgresql
    version: ">=3.4.0"  # postgres role: postgresql_user/_db/_privs idempotent role+db creation

  # Shared homelab roles. A collection, not a `roles:` git entry:
  # `ansible-galaxy role install` archives the whole repo, then picks what to
  # install by taking the SHORTEST path above any meta/main.yml it finds. The
  # name in the entry selects nothing. A repo holding one role resolves to that
  # role and looks correct; add a second role that sorts shorter and the same
  # pin silently installs that one instead, still under the requested name — at
  # this pin it installed cribl_edge as roles/inventory_resolve. A collection
  # installs from the subdirectory holding galaxy.yml, so every role in it is
  # addressed unambiguously by FQCN.
  #
  # An immutable SHA, not a branch — a moving ref would let an unreviewed
  # contracts change reach a converge here without a PR in this repo.
  # Install into a fresh worktree with:
  #   ansible-galaxy install -r requirements.yml
  # (`install` covers both sections; `collection install` and `role install`
  # each silently ignore the other and still exit zero.)
  - name: https://github.com/dryvist/homelab-contracts.git#/ansible/
    type: git
    version: c5e139cb7ccb286016020dd85c2f1d9c3b5a376f

# No `roles:` section — inventory_resolve comes from the collection above, by
# FQCN, for the reason stated there.
