---
# Opt-in container runtime for GPU guests in llm_gpu_container_trial_group or named in
# llm_gpu_container_trial_hosts. No other playbook imports this one. The inventory
# loader and the first pre-task refuse the live medium GPU guest.
- name: Load OpenTofu infrastructure inventory
  ansible.builtin.import_playbook: ../inventory/load_tofu.yml

- name: Configure the GPU container runtime on opted-in guests
  # llm_gpu_container_trial_hosts (extra-var) names the target hosts explicitly.
  hosts: "{{ llm_gpu_container_trial_hosts | default('llm_gpu_container_trial_group') }}"
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tags:
    - llm_gpu_container_trial
  pre_tasks:
    - name: Refuse the live medium GPU guest
      ansible.builtin.assert:
        that:
          - inventory_hostname != 'llm-blackwell-7-96GB-medium'
        fail_msg: The container-trial converge must never reach the live medium GPU guest.
        quiet: true

    - name: Require the trial guest to be in nvidia_gpu_group
      ansible.builtin.assert:
        that:
          - inventory_hostname in groups.get('nvidia_gpu_group', [])
        fail_msg: >-
          {{ inventory_hostname }} is in the container-trial group but not in
          nvidia_gpu_group. Tag the guest nvidia-gpu or remove the
          llm-container-trial tag.
        quiet: true
  tasks:
    - name: Gather facts
      ansible.builtin.include_tasks: tasks/gather_facts.yml

    - name: Load the artifact cache proxy settings and require the proxy
      ansible.builtin.include_role:
        name: llamacpp_release
        tasks_from: prepare.yml

    - name: Install Docker on the trial guest through the artifact cache proxy
      ansible.builtin.include_role:
        name: docker_engine
        apply:
          environment: "{{ llamacpp_release_proxy_environment }}"

    - name: Install the NVIDIA container toolkit and verify GPU access
      ansible.builtin.include_role:
        name: nvidia_container_toolkit
