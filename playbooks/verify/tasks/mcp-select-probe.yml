---
- name: Select the intended service grant and a registered forbidden server
  ansible.builtin.set_fact:
    _mcp_allowed: >-
      {{ llm_router_mcp_hermes_object_permission.mcp_servers if _mcp_key.profile != 'eval' else [] }}
    _mcp_forbidden: >-
      {{ _mcp_app.server_id if _mcp_key.profile != 'eval' else llm_router_mcp_zammad_server_id }}
    _mcp_probe: >-
      {{ _mcp_read_probes[_mcp_app.app] if _mcp_key.profile != 'eval' else _mcp_read_probes.zammad }}
  vars:
    _mcp_app: "{{ _llm_router_app_agent_matrix | selectattr('enabled') | first }}"
    _mcp_read_probes:
      vikunja:
        name: vikunja_tasks
        arguments: {subcommand: list}
      zammad:
        name: zammad_search_tickets
        arguments: {query: ""}

- name: Require the explicit read operation in the registered catalog
  ansible.builtin.assert:
    quiet: true
    that:
      - _mcp_probe.name in _mcp_catalog[_mcp_forbidden].allowed_tools
