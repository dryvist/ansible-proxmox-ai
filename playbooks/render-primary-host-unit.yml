---
- name: Load serving ports and runtime constants from published infrastructure inventory
  import_playbook: ../inventory/load_tofu.yml

- name: Render the primary host-interim unit contract
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Render profile-owned serving contract for the PVE runner
      ansible.builtin.include_role:
        name: llm_gpu_serving
        tasks_from: render-host-contract.yml
      tags:
        - llm_gpu_serving_host_contract
