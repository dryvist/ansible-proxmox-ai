---
- name: Configure or run the opt-in model release watcher on the controller
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load watcher defaults and configure the timer or collect proposals
      ansible.builtin.include_role:
        name: llm_model_watch
        tasks_from: "{{ 'run.yml' if llm_model_watch_run | default(false) | bool else 'main.yml' }}"
