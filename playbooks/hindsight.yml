---
# Hindsight agent-memory service. Imported by site.yml; kept in its own file
# so site.yml stays under its token budget (.token-limits.yaml).
#
# Two stateless API replicas (Docker in LXC) behind the Traefik pool at
# hindsight.<domain>; state lives in the ai-VLAN Postgres cluster. serial: 1
# keeps the converge rolling so the pool always has a healthy member. The role
# reads its own ports from tofu_data.constants.memory_ports and uses no host
# facts, so gather_facts stays off like qdrant. A second, non-serial play
# below decommissions stale worker ids only after every replica above has
# redeployed and passed its health check.

- name: Configure Hindsight agent-memory service
  hosts: hindsight_group
  become: true
  gather_facts: false
  # Same rolling-pool contract as the llm_router play; the role's own /health
  # check is this pool's per-member gate. serial: 1 was already here — the
  # gate import and max_fail_percentage make the unreachable-vs-unhealthy
  # split explicit, so a replica whose node is down no longer aborts the play.
  serial: 1
  max_fail_percentage: 0
  pre_tasks:
    - name: Gate on pool-member reachability
      ansible.builtin.import_tasks: tasks/pool_member_gate.yml
    - name: Load the fabric model registry
      ansible.builtin.import_tasks: tasks/load_fabric_registry.yml
    - name: Run the Hindsight database-migration gate
      ansible.builtin.import_tasks: tasks/hindsight_lifecycle_gates.yml
  tags:
    - hindsight_docker
    - memory
    - ai
  tasks:
    - name: Converge hindsight_docker (isolated — failure does not abort downstream plays)
      block:
        - name: Include hindsight_docker role
          ansible.builtin.include_role:
            name: hindsight_docker
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: hindsight_docker

# No serial: this must see every currently-inventoried host from the
# batch-by-batch play above already redeployed and healthy before it runs,
# never race a single batch's own pre_tasks — see the comment header on
# roles/hindsight_docker/tasks/decommission_stale_workers.yml for the
# same-batch inventory-rename failure a pre_tasks placement caused.
- name: Decommission stale Hindsight worker ids after every replica has redeployed
  hosts: hindsight_group
  become: true
  gather_facts: false
  tags:
    - hindsight_docker
    - memory
    - ai
  tasks:
    - name: Decommission Hindsight worker ids no longer present in inventory
      ansible.builtin.include_role:
        name: hindsight_docker
        tasks_from: decommission_stale_workers.yml
