---
- name: Prepare the isolated Hermes egress profile
  hosts: hermes_agent_group
  become: true
  gather_facts: false
  tags:
    - hermes_agent
    - hermes_profiles_env
    - hermes_units_gateways
    - squid
    - agent
    - ai
    - llm
  pre_tasks:
    - name: Resolve isolated identity preparation endpoints on the controller
      ansible.builtin.include_tasks: tasks/isolated_egress_endpoints.yml
      when: inventory_hostname in hermes_agent_isolated_hosts
  tasks:
    - name: Prepare the identity-scoped proxy inputs and guest environment
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: egress
      vars:
        hermes_agent_egress_host_overrides: >-
          {{ squid_isolated_endpoint_hosts_by_identity.get(hermes_agent_identity, {}) }}
      when: inventory_hostname in hermes_agent_isolated_hosts

- name: Configure the agent-plane egress proxy
  hosts: squid_group
  become: true
  gather_facts: false
  tags:
    - squid
    - hermes_agent
    - hermes_profiles_env
    - agent
    - ai
    - llm
  tasks:
    - name: Converge squid (isolated — failure does not abort downstream plays)
      block:
        - name: Resolve isolated identity proxy endpoints on the controller
          ansible.builtin.include_tasks: tasks/isolated_egress_endpoints.yml
          when: hermes_agent_isolated_hosts | length > 0
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include squid role
          ansible.builtin.include_role:
            name: squid
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: squid
