---
# LLM serving and routing: the two GPU serving guests, the shared spend store,
# and the LiteLLM router in front of them.
#
# Split out of site.yml as one unit because these plays are ORDER-COUPLED in
# ways the rest of the file is not — the NVIDIA guest's two engines must run in
# sequence to hand off the card, and the spend store must precede the router
# pool. Keeping them together makes that ordering local and reviewable instead
# of buried in a 25-play file.

# =============================================================================
# Phase 4: LLM serving fabric — llama.cpp light tier + LiteLLM front door.
# llama.cpp router mode (llm-fast) serves the co-resident light models;
# the LiteLLM proxy (llm-router x3) is the single OpenAI-compatible endpoint,
# fronted by Traefik at https://llm.<subdomain>, routing large vs light by alias.
# =============================================================================

- name: Configure llama.cpp light-tier serving (router mode, AMD ROCm)
  hosts: llm_fast_group
  become: true
  gather_facts: false
  # The served model names come from the registry, not a role default
  # (llama_cpp_models in roles/llama_cpp/defaults/main/00-core.yml). hf_repo/
  # gguf for those same models come from the shared catalog (see
  # inventory/group_vars/llm_fast_group.yml, llama_cpp_catalog_lookup_names).
  pre_tasks:
    - name: Load the fabric model registry
      ansible.builtin.import_tasks: tasks/load_fabric_registry.yml
    - name: Load the shared model catalog
      ansible.builtin.import_tasks: tasks/load_model_catalog.yml
  tags:
    - llama_cpp
    - llm
    - ai
  tasks:
    - name: Converge llama_cpp (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include llama_cpp role
          ansible.builtin.include_role:
            name: llama_cpp
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: llama_cpp_fast

# One play for the whole CPU pool. Shared knobs: group_vars/llm_cpu_pool_group;
# tier models: llm_cpu_moe_group / llm_cpu_9b_group (hosts land in both).
- name: Configure llama.cpp CPU pool serving
  hosts: llm_cpu_pool_group
  become: true
  gather_facts: false
  # hf_repo/gguf for both tiers' models come from the shared catalog (see
  # inventory/group_vars/llm_cpu_9b_group.yml / llm_cpu_moe_group.yml,
  # llama_cpp_catalog_lookup_names) — same loader as the fast/vllm plays.
  pre_tasks:
    - name: Load the fabric model registry
      ansible.builtin.import_tasks: tasks/load_fabric_registry.yml
    - name: Load the shared model catalog
      ansible.builtin.import_tasks: tasks/load_model_catalog.yml
  tags:
    - llama_cpp
    - llm
    - ai
    - llm_cpu_pool
  tasks:
    - name: Converge llama_cpp (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include llama_cpp role
          ansible.builtin.include_role:
            name: llama_cpp
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: llama_cpp_cpu_pool

# The NVIDIA serving guest.
#
# CORRECTION, and do not re-derive the old reasoning from it. This role used
# to read "upstream llama.cpp ships no Linux CUDA binary, so CUDA serving here
# is vLLM from official wheels." The first clause is true and remains true.
# The conclusion does not follow: upstream ships a prebuilt Linux VULKAN
# binary that runs on NVIDIA, which is how the 27B is served here now — see
# inventory/group_vars/llm_vllm_group.yml for the full reasoning (vLLM cannot
# read these weights at all; no CUDA build is not why Vulkan was chosen).
#
# No vLLM role exists: llama.cpp on Vulkan (below) is the only engine
# converged against this guest. The `llm_vllm_group` inventory group name and
# the registry's `vllm` TIER key are a different thing — both name the
# ROUTER's view of this guest, unrelated to which engine actually serves it;
# do not remove either.
- name: Configure llama.cpp serving on the NVIDIA guest (router mode, Vulkan)
  hosts: llm_vllm_group
  become: true
  gather_facts: false
  # The served context window is the registry's, not this group's — see
  # llama_cpp_ctx_size in inventory/group_vars/llm_vllm_group.yml. Loaded the
  # SAME way the llm_router converge and fabric_watchdog load it, so the path is
  # never hand-rolled. public: true is required: without it the registry is in
  # scope only for the included tasks, and llama_cpp_ctx_size then resolves
  # undefined when the role renders the --models-preset. The shared model
  # catalog (hf_repo/gguf) is loaded the same way — see
  # inventory/group_vars/llm_vllm_group.yml, llama_cpp_catalog_lookup_names.
  pre_tasks:
    - name: Load the fabric model registry
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml
        public: true
    - name: Load the shared model catalog
      ansible.builtin.import_tasks: tasks/load_model_catalog.yml
  tags:
    - llama_cpp
    - llm
    - ai
  tasks:
    - name: Converge llama_cpp (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include llama_cpp role
          ansible.builtin.include_role:
            name: llama_cpp
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: llama_cpp_nvidia

# Ordered BEFORE the router pool on purpose. This is the store the routers
# count spend in, so converging it second would leave the first router of a
# rolling pass pointed at a store that is not serving yet. A shared ceiling is
# only a ceiling once every member can reach the same counter.
- name: Configure the shared spend store for the router pool
  hosts: llm_redis_group
  become: true
  gather_facts: false
  tags:
    - llm_redis
    - llm
    - ai
  tasks:
    - name: Converge redis (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include redis role
          ansible.builtin.include_role:
            name: redis
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: llm_redis

- name: Configure the LiteLLM router (fabric front door)
  hosts: llm_router_group
  become: true
  gather_facts: false
  # Rolling pool converge. Restarting all three routers in the same play took
  # the whole front door down on 2026-07-24 (the watchdog recorded a down
  # transition across the converge) — the pool exists for redundancy and the
  # deploy path defeated it. serial: 1 restarts one member at a time, and the
  # role's own liveness check is the gate: it runs after flush_handlers, inside
  # this member's window, so the next member is not touched until this one is
  # serving again. max_fail_percentage: 0 stops the play on any failure rather
  # than marching on to break the rest.
  #
  # NOT isolated. The rescue the other plays use turns a failed member into a
  # "rescued" one, which max_fail_percentage never sees — so a render that
  # killed member 1 was still rolled onto members 2 and 3. The rescue here
  # re-raises the failure via `fail`, which stops the entire playbook run
  # (not just this play's rolling batch): the CPU-scaler, syslog-route, and
  # RAG plays below never run. Remaining pool members keep serving their
  # previous config.
  serial: 1
  max_fail_percentage: 0
  pre_tasks:
    - name: Load Hermes' operating-profile list
      ansible.builtin.import_tasks: tasks/load_hermes_profiles.yml
      vars:
        _hermes_agent_role_dir: "{{ playbook_dir }}/../roles/hermes_agent"
    - name: Gate on pool-member reachability
      ansible.builtin.import_tasks: tasks/pool_member_gate.yml
  tags:
    - llm_router
    - llm
    - ai
  tasks:
    - name: Converge llm_router (a failed member stops the rolling batch)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include llm_router role
          ansible.builtin.include_role:
            name: llm_router
      rescue:
        - name: Record the failure for the end-of-run gate
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: llm_router
        - name: Stop the rolling converge at this member
          ansible.builtin.fail:
            msg: >-
              llm_router failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default(ansible_failed_task.name | default('task failed')) }}.
              Remaining pool members keep their previous config.

# Virtual keys, their budgets, and caller-facing roles — its own run_once
# play, not a task inside the rolling converge above: seed-consumers.yml
# writes to the pool's SHARED database (every member's proxy reads the same
# Postgres-backed key store), so running it once per serial:1 member sent
# the same /key/generate and /key/update calls three times per converge.
# Gates on pool-member reachability the same way the rolling play above
# does, via pre_tasks rather than a play-level run_once, so the gate's ping
# still runs per host: run_once only covers the seeding task itself, never
# the gate, so a member the rolling play already end_host'd for being down
# cannot become this play's run_once pick. If every member fails the gate,
# the tail play below records a loud, run-failing message instead of
# silently seeding nothing. run_once: true on the seeding task still
# executes on one real pool member over its normal connection, so the
# 127.0.0.1 URLs in seed-consumers.yml's tasks stay correct unchanged.
# Contract: tests/llm_router/test_seed_key_route_model_reconcile.yml and
# tests/llm_router/test_seed_play_reachability_gate.yml.
- name: Seed llm_router virtual keys, budgets, and caller-facing roles
  hosts: llm_router_group
  become: true
  gather_facts: false
  pre_tasks:
    - name: Gate on pool-member reachability
      ansible.builtin.import_tasks: tasks/pool_member_gate.yml
  tags:
    - llm_router
    - llm
    - ai
  tasks:
    - name: Converge the llm_router consumer seeding (isolated — failure does not abort downstream plays)
      run_once: true
      block:
        - name: Include the llm_router consumer-seeding tasks
          ansible.builtin.include_role:
            name: llm_router
            tasks_from: seed-consumers.yml
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: llm_router_seed_consumers

# If the gate above end_host'd every member, the tasks: play above never ran
# (zero hosts left to run them) — and a play with zero hosts is not itself a
# failure, so the run would otherwise carry on as if seeding had nothing to
# do. Catch that here, from localhost, which the gate's end_host never
# touches: every original pool member's pool_member_probe (registered by the
# gate before any end_host fires) stays readable in hostvars regardless of
# how many members got end_host'd, so this can tell "every member was down"
# apart from "seeding ran and finished".
- name: Fail loudly if the whole llm_router pool failed the reachability gate
  hosts: localhost
  gather_facts: false
  tags:
    - llm_router
    - llm
    - ai
  tasks:
    - name: Record an isolated failure when consumer seeding had no reachable pool member to run on
      ansible.builtin.set_fact:
        site_isolated_failures: >-
          {{ (site_isolated_failures | default([])) +
             ['llm_router_seed_consumers: every llm_router_group member failed the reachability gate' ~
              ' — seeding did not run'] }}
      when: >-
        (groups['llm_router_group']
         | map('extract', hostvars, 'pool_member_probe')
         | selectattr('ping', 'defined')
         | selectattr('ping', 'equalto', 'pong')
         | list | length) == 0

- name: Configure the CPU LLM pool scaler
  hosts: llm_router_group
  become: true
  gather_facts: false
  run_once: true
  tags:
    - llm_cpu_scaler
    - llm
    - ai
    - llm_cpu_pool
  tasks:
    - name: Converge llm_cpu_scaler (isolated — failure does not abort downstream plays)
      block:
        - name: Include llm_cpu_scaler role
          ansible.builtin.include_role:
            name: llm_cpu_scaler
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: llm_cpu_scaler

# Journal forwarding for the router pool, after every member is converged.
# Its own play, not a task inside the rolling converge above: the route
# renders from inventory constants alone, so a missing one fails HERE — loud,
# named in the end-of-run gate — after the ladder has landed on all members,
# never splitting the pool between two configs. Contract:
# tests/llm_router/test_syslog_route_outside_rolling_play.yml.
- name: Ship the router pool's journal to the dedicated LLM Splunk index
  hosts: llm_router_group
  become: true
  gather_facts: false
  tags:
    - llm_router
    - llm
    - ai
  tasks:
    - name: Converge the llm_router log route (isolated — failure does not abort downstream plays)
      block:
        - name: Include the llm_router syslog route
          ansible.builtin.include_role:
            name: llm_router
            tasks_from: 10-llm-router-syslog.yml
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: llm_router_syslog_route

# =============================================================================
# Phase 5: LlamaIndex RAG Engine
# Embeddings via the fabric router — must converge AFTER the router play;
# its health check queries https://llm.<subdomain>/v1/models.
# =============================================================================
