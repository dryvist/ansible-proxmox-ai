---
# The headless agent execution plane: the legacy AI job runners, the egress
# proxy that is the plane's whole outbound boundary, the pooled autonomous
# agent guests, and the opt-in play that returns a guest to the pool.
#
# Split out of site.yml as one unit, the way llm-serving.yml was, to keep that
# file within its token budget. Order INSIDE this file is load-bearing (the
# proxy play must precede the pooled guests — see its header); its position in
# the overall converge is unchanged: site.yml imports it last, after the
# orchestration platforms. The interactive agent plane (Hermes, herdr) is
# agents.yml.

# =============================================================================
# Phase 7: Headless AI execution plane (WS7A) — AI job runners.
# Confined guests (tofu `ai-runner` + `ai-github` tags) that run the Claude
# Code / Codex CLIs in permission-skipping mode, driven by a systemd worker
# polling the Vikunja AI Jobs queue. Safety is the LXC/firewall boundary, not
# the agent — so this only ever converges guests behind a restrictive egress
# profile. bao_ai_runner_secrets comes from the Phase 0 pre-fetch play.
# =============================================================================

- name: Configure headless AI job runners
  hosts: ai_runner_group
  become: true
  gather_facts: true
  tags:
    - ai_runner
    - agent
    - ai
  tasks:
    - name: Converge ai_runner (isolated — failure does not abort downstream plays)
      block:
        - name: Include ai_runner role
          ansible.builtin.include_role:
            name: ai_runner
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: ai_runner

# =============================================================================
# Phase 7a: Squid — the agent plane's egress chokepoint.
#
# This play MUST run BEFORE the pooled agent guests below: an `ai-proxied` guest
# has no direct WAN rule, so until this proxy is up it cannot reach an apt repo,
# the npm registry or GitHub, and agent_guest's very first toolchain task (an
# apt update) fails. The domain allowlist enforced here is the plane's whole
# egress boundary — the Proxmox firewall cannot filter by hostname.
# =============================================================================

- name: Configure the agent-plane egress proxy
  hosts: squid_group
  become: true
  gather_facts: true
  tags:
    - squid
    - agent
    - ai
  tasks:
    - name: Converge squid (isolated — failure does not abort downstream plays)
      block:
        - name: Include squid role
          ansible.builtin.include_role:
            name: squid
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: squid

# =============================================================================
# Phase 7b: Pooled autonomous agent guests (ai-runner-pool-NN, `ai-proxied`).
# agent_guest is ai_runner's successor: same Vikunja queue, but one job per
# systemd unit under `bao agent` supervision, three CLIs instead of two, the
# nix-ai autonomous config mirror, a clone/gitleaks/PR flow, and per-guest
# transcript shipping. The legacy ai_runner play above stays until this role
# carries load on the canary; removing it is a follow-up PR, not this one.
# =============================================================================

- name: Configure pooled autonomous agent guests
  hosts: ai_agent_pool_group
  become: true
  gather_facts: true
  tags:
    - agent_guest
    - agent
    - ai
  tasks:
    - name: Converge agent_guest (isolated — failure does not abort downstream plays)
      block:
        - name: Include agent_guest role
          ansible.builtin.include_role:
            name: agent_guest
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: agent_guest

# Pool return lives in its OWN play, not inside the converge play above: play
# tags are inherited by every task, so a `never`-tagged include inside the
# converge play effectively carries `agent_guest` too — and `--tags
# agent_guest` then overrides `never` and wipes the guest at the end of every
# converge. Opt in explicitly:
#   ansible-playbook playbooks/site.yml --tags agent_guest_pool_return --limit <guest>,localhost
- name: Return pooled agent guests to the pool (drain, stop, de-credential, wipe)
  hosts: ai_agent_pool_group
  become: true
  gather_facts: false
  tags:
    - never
    - agent_guest_pool_return
  tasks:
    - name: Drain, stop, de-credential and wipe the guest
      ansible.builtin.include_role:
        name: agent_guest
        tasks_from: pool_return.yml
