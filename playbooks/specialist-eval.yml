---
# Specialist evaluation instances. Not imported by site.yml: run it on its own with
# `ansible-playbook playbooks/specialist-eval.yml`. Hosts come from the sim-eval inventory tag.

- name: Configure Sim agent-workflow builder (isolated evaluation)
  hosts: sim_eval_group
  become: true
  gather_facts: false
  tags:
    - sim_docker
    - specialist-eval
  tasks:
    - name: Converge sim_docker (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include sim_docker role
          ansible.builtin.include_role:
            name: sim_docker
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: sim_docker
