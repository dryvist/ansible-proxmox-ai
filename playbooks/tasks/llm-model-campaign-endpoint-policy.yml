---
- name: Require HTTPS unless this is the exact explicitly allowed trial endpoint
  ansible.builtin.assert:
    that:
      - >-
        (benchmark_endpoint_root | string
         is match('^https://[A-Za-z0-9-]+([.][A-Za-z0-9-]+)+$')
         and benchmark_endpoint_root | urlsplit('hostname') is search('[A-Za-z]'))
        or
        (llm_model_campaign_allow_trial_http | default(false) | bool
         and benchmark_endpoint_root | string is match('^http://[^/]+$')
         and benchmark_endpoint_root | string
             == llm_model_trial_endpoint_url | regex_replace('/v1$', ''))
    fail_msg: >-
      Campaign endpoints must use HTTPS. HTTP is accepted only when explicitly
      enabled for the candidate pass and equal to the trial role endpoint.
    quiet: true
