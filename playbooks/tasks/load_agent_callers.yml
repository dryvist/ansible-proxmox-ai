---
# Loads dryvist.homelab.agent_callers' facts (agent_callers_registry and its
# schema/tier values) into a play that derives `ai_callers`
# (inventory/group_vars/all/). The role is tasks-only and publishes host facts,
# so no `public:` is needed. Import it from `pre_tasks`, or before the role, in any
# play that renders agentgateway or reads the agentgateway-agent-keys domain:
#
#   pre_tasks:
#     - ansible.builtin.import_tasks: tasks/load_agent_callers.yml
- name: Load the harness caller registry
  ansible.builtin.include_role:
    name: dryvist.homelab.agent_callers
