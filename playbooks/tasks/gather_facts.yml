---
# Shared first-task for every isolated play's block (see
# record_isolated_failure.yml for the rescue half of the same pattern).
#
# ansible.builtin.setup on an unreachable host returns UNREACHABLE, which
# rescue: does not catch. ignore_unreachable converts that into a normal
# registered result instead of aborting the play outside the block; the
# explicit fail immediately after turns it into a rescuable FAILED so
# record_isolated_failure.yml still records it.
- name: Gather facts (isolated)
  ansible.builtin.setup:
  ignore_unreachable: true
  register: _isolated_setup

- name: Fail when the host is unreachable (isolated)
  ansible.builtin.fail:
    msg: "unreachable: {{ _isolated_setup.msg | default('') }}"
  when: _isolated_setup.unreachable | default(false)
