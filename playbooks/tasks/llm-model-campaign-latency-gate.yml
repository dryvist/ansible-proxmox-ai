---
- name: Validate the interactive latency gate settings
  ansible.builtin.assert:
    that:
      - llm_campaign_interactive_key_aliases is sequence
      - llm_campaign_interactive_key_aliases is not string
      - llm_campaign_interactive_key_aliases | length > 0
      - >-
        llm_campaign_interactive_key_aliases | map('string')
        | select('match', '^[A-Za-z0-9_-]+$') | list | length
        == llm_campaign_interactive_key_aliases | length
      - llm_campaign_interactive_scope_labels is mapping
      - llm_campaign_interactive_scope_labels | length > 0
      - >-
        llm_campaign_interactive_scope_labels | dict2items
        | selectattr('key', 'match', '^[A-Za-z_][A-Za-z0-9_]*$')
        | map(attribute='value') | map('string')
        | select('match', '^[A-Za-z0-9_-]+$') | list | length
        == llm_campaign_interactive_scope_labels | length
      - llm_campaign_latency_max_ratio | float > 0
      - llm_campaign_latency_min_samples | string is match('^[1-9][0-9]*$')
      - llm_campaign_latency_windows is sequence
      - llm_campaign_latency_windows is not string
      - llm_campaign_latency_windows | length > 0
      - >-
        llm_campaign_latency_windows | map('string')
        | select('match', '^[1-9][0-9]*[smhd]$') | list | length
        == llm_campaign_latency_windows | length
    fail_msg: >-
      The interactive latency gate requires regex-safe aliases and scope labels, a
      positive ratio and sample threshold, and non-empty safe latency windows.
    quiet: true
  when: llm_campaign_latency_gate_enabled | bool

- name: Reset interactive latency gate state
  ansible.builtin.set_fact:
    _llm_campaign_latency_window_counts: []
    _llm_campaign_latency_selected_window: null
    _llm_campaign_latency_window_response_reason: ready
    _llm_campaign_latency_largest_window: null
    _llm_campaign_latency_reason: null
    _llm_campaign_latency_classification_observation: {}
    _llm_campaign_latency_classification_reason: null
    _llm_campaign_latency_classification_kind: null
    _llm_campaign_latency_baseline_observation: {}
  changed_when: false
  when: llm_campaign_latency_gate_enabled | bool

- name: Count interactive requests and choose a latency window
  ansible.builtin.include_tasks: llm-model-campaign-latency-gate-counts.yml
  when: llm_campaign_latency_gate_enabled | bool

- name: Compare interactive p95 latency with its baseline
  ansible.builtin.include_tasks: llm-model-campaign-latency-gate-ratio.yml
  when:
    - llm_campaign_latency_gate_enabled | bool
    - _llm_campaign_latency_reason == 'pass'

- name: Report the interactive latency gate result
  ansible.builtin.include_tasks: llm-model-campaign-latency-gate-report.yml
  when: llm_campaign_latency_gate_enabled | bool
