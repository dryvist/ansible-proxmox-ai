---
- name: Reject a missing or malformed reconciled local-llm secret
  ansible.builtin.assert:
    that:
      - openbao_secrets_local_llm_seed_result.get(local_llm_secret.field, '') is string
      - openbao_secrets_local_llm_seed_result.get(local_llm_secret.field, '') | trim | length > 0
    fail_msg: The reconciled local-llm secret is missing or malformed.
    quiet: true
  no_log: true
