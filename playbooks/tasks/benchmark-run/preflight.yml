---
- name: Validate the benchmark run survey
  ansible.builtin.assert:
    that:
      - node is defined and node in tofu_data.nodes
      - client_vmid is defined and client_vmid | string is match('^[0-9]{3,9}$')
      - gpu_guest_vmid is defined and gpu_guest_vmid | string is match('^[0-9]{3,9}$')
      - client_vmid | string != gpu_guest_vmid | string
      - (upgrade | default('true') | string | lower) in ['', 'true', 'false']
      - engine_url is defined
      - (engine_url | string | urlsplit('scheme')) in ['http', 'https']
      - engine_url | string | urlsplit('hostname') | length > 0
      - engine_url | string | urlsplit('username') | default('', true) | length == 0
      - engine_url | string | urlsplit('password') | default('', true) | length == 0
      - engine_url | string | urlsplit('query') | default('', true) | length == 0
      - engine_url | string | urlsplit('fragment') | default('', true) | length == 0
      - engine_url | string | urlsplit('path') is match('^(/[^?#]+)?/v1/?$')
      - model is defined and model | string | trim | length > 0
      - tokenizer is defined and tokenizer | string | trim | length > 0
      - suite is defined
      - >-
        suite == 'bigcodebench-hard' or suite == 'vllm-sweep' or
        suite in ['lmcache-multi-round-qa', 'vllm-multi-turn'] or
        suite | string is match('^promptfoo-[a-z0-9][a-z0-9-]*$')
      - >-
        suite in ['lmcache-multi-round-qa', 'vllm-multi-turn'] or
        (reasoning_arm is defined and reasoning_arm in ['off', 'low', 'high', 'xhigh'])
      - >-
        suite in ['lmcache-multi-round-qa', 'vllm-multi-turn'] or
        (concurrency is defined and concurrency | int > 0)
      - >-
        suite in ['lmcache-multi-round-qa', 'vllm-multi-turn'] or
        (max_tokens is defined and max_tokens | int > 0)
      - >-
        suite in ['lmcache-multi-round-qa', 'vllm-multi-turn'] or
        (sandbox_pool is defined and sandbox_pool | int > 0)
      - run_id is defined and run_id | string is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')
      - (moe_cpu_offload | default('none')) in ['none', 'ncmoe', 'cpumoe']
      - >-
        (moe_cpu_offload | default('none')) != 'ncmoe' or
        (moe_cpu_layers is defined and moe_cpu_layers | int > 0)
      - >-
        (moe_cpu_offload | default('none')) == 'ncmoe' or
        (moe_cpu_layers | default(0) | int == 0)
      - not (publish | default(false) | bool)
      - lookup('env', 'PROXMOX_SSH_KEY_PATH') | length > 0
    fail_msg: >-
      The survey must select one published node, distinct client and GPU guest
      VMIDs, a tagged client, an OpenAI-compatible /v1 URL, a model and
      tokenizer, a supported suite, an explicit reasoning arm, positive limits,
      and a safe run ID. Publishing is disabled until an approved dataset-token
      path exists.
    quiet: true

- name: Require a suite input file when Promptfoo is selected
  ansible.builtin.assert:
    that:
      - items_file is defined
      - items_file | string is match('^https://raw[.]githubusercontent[.]com/[^/?#]+/[^/?#]+/[0-9a-f]{40}/[^?#]+$')
      - items_file | string | urlsplit('path') | basename is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
    fail_msg: >-
      Promptfoo requires items_file to be an immutable raw GitHub file URL with
      a commit SHA in the path and a simple filename.
    quiet: true
  when: suite is match('^promptfoo-')

- name: Require the BigCodeBench sandbox pool to cover its concurrency
  ansible.builtin.assert:
    that:
      - sandbox_pool | int >= concurrency | int
      - sandbox_pool | int <= 8
    fail_msg: >-
      BigCodeBench sandbox_pool must be at least concurrency and at most the
      supported pool size of eight.
    quiet: true
  when: suite == 'bigcodebench-hard'

- name: Require no separate input file for the pinned BigCodeBench set
  ansible.builtin.assert:
    that:
      - items_file | default('') | length == 0
    fail_msg: >-
      BigCodeBench uses the pinned built-in dataset selection and sample limit;
      items_file is only used by Promptfoo suites.
    quiet: true
  when: suite == 'bigcodebench-hard'

- name: Validate BigCodeBench item and request-timeout limits
  ansible.builtin.assert:
    that:
      - item_limit | default(30) | int > 0
      - item_limit | default(30) | int <= 148
      - evalscope_timeout_seconds | default(3600) | int > 0
    fail_msg: >-
      BigCodeBench item_limit must be between one and 148, and
      evalscope_timeout_seconds must be positive.
    quiet: true
  when: suite == 'bigcodebench-hard'

- name: Require fixed-length input parameters for a vLLM serving cell
  ansible.builtin.assert:
    that:
      - input_tokens is defined and input_tokens | int > 0
      - num_prompts is defined and num_prompts | int > 0
      - seed is defined and seed | string is match('^[0-9]+$')
      - request_rate is defined
      - >-
        request_rate | string == 'inf' or
        request_rate | string is match('^[0-9]+([.][0-9]+)?$')
      - request_rate | string == 'inf' or request_rate | float > 0
      - items_file | default('') | length == 0
    fail_msg: >-
      vllm-sweep runs one fixed-length vllm bench serve cell. Supply positive
      input_tokens, num_prompts, and seed, plus request_rate=inf or a positive
      Poisson arrival rate; do not set items_file.
    quiet: true
  when: suite == 'vllm-sweep'

- name: Validate cache-tier benchmark inputs
  ansible.builtin.assert:
    that:
      - workload_id is defined
      - kv_arm is defined
      - cache_workload is defined
      - host_ram_limit_gib is defined
      - prefix_caching is defined
      - kv_offload_backend is defined
      - kv_offload_cpu_gib is defined
      - kv_offload_disk_gib is defined
      - weight_cpu_offload_gib is defined
      - llamacpp_cache_ram_mib is defined
      - gpu_memory_utilization is defined
      - max_num_batched_tokens is defined
      - gpu_kv_capacity_tokens is defined
      - num_users is defined
      - num_rounds is defined
      - shared_prompt_tokens is defined
      - user_history_tokens is defined
      - answer_tokens is defined
      - duration_seconds is defined
      - request_rate is defined
      - lmcache_compatibility_status | default('unverified') in ['unverified', 'compatible', 'incompatible']
      - lmcache_compatibility_evidence | default('') | string | length <= 500
      - workload_id in ['W1', 'W2', 'W3']
      - kv_arm in ['A0', 'A1', 'A2', 'A3']
      - host_ram_limit_gib | int == 64
      - prefix_caching | bool
      - kv_offload_backend in ['none', 'native', 'lmcache']
      - kv_offload_cpu_gib | float >= 0
      - kv_offload_disk_gib | float == 0
      - weight_cpu_offload_gib | float == 0
      - llamacpp_cache_ram_mib | int == 0
      - gpu_memory_utilization | float > 0 and gpu_memory_utilization | float <= 1
      - max_num_batched_tokens | int > 0
      - gpu_kv_capacity_tokens | int > 0
      - num_users | int > 0
      - num_rounds | int >= 6
      - shared_prompt_tokens | int == 2048
      - user_history_tokens | int >= 32768
      - answer_tokens | int == 512
      - duration_seconds | int > 0 and duration_seconds | int <= 1080
      - request_rate | string is match('^[0-9]+([.][0-9]+)?$')
      - request_rate | float > 0
      - >-
        (kv_arm == 'A0' and kv_offload_backend == 'none' and
         kv_offload_cpu_gib | float == 0) or
        (kv_arm == 'A1' and kv_offload_backend == 'native' and
         kv_offload_cpu_gib | float == 24) or
        (kv_arm == 'A2' and kv_offload_backend == 'native' and
         kv_offload_cpu_gib | float > 0) or
        (kv_arm == 'A3' and kv_offload_backend == 'lmcache' and
         kv_offload_cpu_gib | float > 0)
      - >-
        kv_arm != 'A3' or
        (lmcache_compatibility_status | default('unverified') == 'compatible' and
         lmcache_compatibility_evidence | default('') | string | trim | length > 0)
      - >-
        (workload_id == 'W1' and cache_workload == 'fits_gpu') or
        (workload_id == 'W2' and cache_workload == 'spills_to_ram') or
        (workload_id == 'W3' and cache_workload == 'exceeds_all')
    fail_msg: >-
      Cache-tier requests must match the contract arms and workload classes:
      64 GiB host limit, prefix caching, zero weight/disk offload, 2k shared
      prompt, at least 32k user history, at least six rounds, and 512 answer
      tokens. Each cell is limited to 18 minutes plus runner overhead.
    quiet: true
  when: suite in ['lmcache-multi-round-qa', 'vllm-multi-turn']

- name: Add the selected Proxmox node to this run's inventory
  ansible.builtin.add_host:
    name: "{{ node }}"
    groups: benchmark_run_node
    ansible_host: "{{ (tofu_data.nodes[node].role | default(node, true)) ~ '.' ~ tofu_data.domain }}"
    ansible_connection: ssh
    ansible_user: root
    ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') }}"
    ansible_python_interpreter: auto_silent
    benchmark_run_request:
      node: "{{ node }}"
      client_vmid: "{{ client_vmid | int }}"
      gpu_guest_vmid: "{{ gpu_guest_vmid | int }}"
      upgrade: >-
        {{ false if suite in ['lmcache-multi-round-qa', 'vllm-multi-turn'] else
           ((upgrade | default('true') | string | lower) != 'false') }}
      engine_url: "{{ engine_url }}"
      model: "{{ model }}"
      tokenizer: "{{ tokenizer }}"
      suite: "{{ suite }}"
      items_file: "{{ items_file | default('') }}"
      reasoning_arm: "{{ reasoning_arm | default('off') }}"
      concurrency: "{{ concurrency | default(num_users | default(1)) | int }}"
      max_tokens: "{{ max_tokens | default(answer_tokens | default(1)) | int }}"
      item_limit: "{{ item_limit | default(30) | int }}"
      evalscope_timeout_seconds: "{{ evalscope_timeout_seconds | default(3600) | int }}"
      sandbox_pool: "{{ sandbox_pool | default(1) | int }}"
      input_tokens: "{{ input_tokens | default(0) | int }}"
      request_rate: "{{ request_rate | default('inf') }}"
      num_prompts: "{{ num_prompts | default(0) | int }}"
      seed: "{{ seed | default(0) | int }}"
      run_id: "{{ run_id }}"
      evalscope_version: "{{ _benchmark_run_evalscope_version }}"
      promptfoo_version: "{{ _benchmark_run_promptfoo_version }}"
      uv_version: "{{ _benchmark_run_uv_version }}"
      node_version: "{{ _benchmark_run_node_version }}"
      vllm_client_image: "{{ _benchmark_run_vllm_client_image }}"
      vllm_client_version: "{{ _benchmark_run_vllm_client_version }}"
      vllm_serving_version: "{{ _benchmark_run_vllm_client_version }}"
      lmcache_version: "{{ _benchmark_run_lmcache_version }}"
      gutenberg_sha256: "{{ _benchmark_run_gutenberg_sha256 }}"
      bcb_dataset_revision: "{{ _benchmark_run_bcb_dataset_revision }}"
      bcb_sandbox_image: "{{ _benchmark_run_bcb_sandbox_image }}"
      workload_id: "{{ workload_id | default('') }}"
      kv_arm: "{{ kv_arm | default('') }}"
      host_ram_limit_gib: "{{ host_ram_limit_gib | default(0) | int }}"
      prefix_caching: "{{ prefix_caching | default(false) | bool }}"
      kv_offload_backend: "{{ kv_offload_backend | default('none') }}"
      kv_offload_cpu_gib: "{{ kv_offload_cpu_gib | default(0) | float }}"
      kv_offload_disk_gib: "{{ kv_offload_disk_gib | default(0) | float }}"
      weight_cpu_offload_gib: "{{ weight_cpu_offload_gib | default(0) | float }}"
      llamacpp_cache_ram_mib: "{{ llamacpp_cache_ram_mib | default(0) | int }}"
      gpu_memory_utilization: "{{ gpu_memory_utilization | default(0) | float }}"
      max_num_batched_tokens: "{{ max_num_batched_tokens | default(0) | int }}"
      gpu_kv_capacity_tokens: "{{ gpu_kv_capacity_tokens | default(0) | int }}"
      cache_workload: "{{ cache_workload | default('none') }}"
      num_users: "{{ num_users | default(0) | int }}"
      num_rounds: "{{ num_rounds | default(0) | int }}"
      shared_prompt_tokens: "{{ shared_prompt_tokens | default(0) | int }}"
      user_history_tokens: "{{ user_history_tokens | default(0) | int }}"
      answer_tokens: "{{ answer_tokens | default(0) | int }}"
      duration_seconds: "{{ duration_seconds | default(0) | int }}"
      lmcache_compatibility_status: "{{ lmcache_compatibility_status | default('unverified') }}"
      lmcache_compatibility_evidence: "{{ lmcache_compatibility_evidence | default('') }}"
      moe_cpu_offload: "{{ moe_cpu_offload | default('none') }}"
      moe_cpu_layers: "{{ moe_cpu_layers | default(0) | int }}"

- name: Ensure exactly one selected node was added
  ansible.builtin.assert:
    that:
      - groups['benchmark_run_node'] | default([]) | length == 1
    quiet: true
