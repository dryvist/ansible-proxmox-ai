---
- name: Read the selected GPU guest status
  ansible.builtin.command:
    argv: [pct, status, "{{ benchmark_run_request.gpu_guest_vmid }}"]
  register: _benchmark_run_gpu_guest_status
  changed_when: false
  check_mode: false

- name: Require the selected GPU guest to be running before package upgrades
  ansible.builtin.assert:
    that:
      - _benchmark_run_gpu_guest_status.stdout | trim == 'status: running'
    fail_msg: >-
      The selected GPU guest must already be running for its package upgrade.
    quiet: true

- name: Update package indexes in the GPU guest
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ benchmark_run_request.gpu_guest_vmid }}"
      - --
      - apt-get
      - update
  changed_when: false
  when: not ansible_check_mode

- name: Upgrade all GPU guest packages
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ benchmark_run_request.gpu_guest_vmid }}"
      - --
      - env
      - DEBIAN_FRONTEND=noninteractive
      - apt-get
      - full-upgrade
      - --yes
  register: _benchmark_run_gpu_guest_upgrade
  changed_when: "'0 upgraded' not in _benchmark_run_gpu_guest_upgrade.stdout"
  when: not ansible_check_mode
