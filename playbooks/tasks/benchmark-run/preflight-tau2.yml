---
- name: Require the OpenBao key location for the tau2 suite
  ansible.builtin.assert:
    that:
      - api_key_kv_path is defined
      - api_key_kv_path | string is match('^[A-Za-z0-9][A-Za-z0-9._/-]*$')
      - api_key_kv_field is defined
      - api_key_kv_field | string is match('^[A-Za-z0-9_.-]+$')
    fail_msg: >-
      The tau2 suite reads its bearer key from the secret store and requires
      api_key_kv_path (the KV v2 path of the key) and api_key_kv_field (the
      field name holding the key).
    quiet: true
  when: suite == 'tau2-banking-knowledge'

- name: Validate the tau2 domain
  ansible.builtin.assert:
    that:
      - (tau2_domain | default('banking_knowledge') | string) in ['banking_knowledge', 'airline', 'retail', 'telecom']
    fail_msg: >-
      tau2_domain must be one of banking_knowledge, airline, retail, or telecom.
      It defaults to banking_knowledge when unset.
    quiet: true
  when: suite == 'tau2-banking-knowledge'

- name: Validate the tau2 trial count and max concurrency
  ansible.builtin.assert:
    that:
      - tau2_num_trials | default(1) | string is match('^[0-9]+$')
      - tau2_num_trials | default(1) | int >= 1
      - tau2_max_concurrency | default(concurrency) | string is match('^[0-9]+$')
      - tau2_max_concurrency | default(concurrency) | int >= 1
    fail_msg: >-
      tau2_num_trials and tau2_max_concurrency must be integers of at least one.
      tau2_num_trials defaults to 1; tau2_max_concurrency defaults to concurrency.
    quiet: true
  when: suite == 'tau2-banking-knowledge'
