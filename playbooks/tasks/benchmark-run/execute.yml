---
- name: Dispatch the selected suite
  block:
    - name: Run BigCodeBench-Hard through EvalScope
      ansible.builtin.import_tasks: bigcodebench.yml
      when: benchmark_run_request.suite == 'bigcodebench-hard'

    - name: Run the selected Promptfoo config
      ansible.builtin.import_tasks: promptfoo.yml
      when: benchmark_run_request.suite is match('^promptfoo-')

    - name: Run one fixed-length vLLM serving cell
      ansible.builtin.import_tasks: vllm-serve.yml
      when: benchmark_run_request.suite == 'vllm-sweep'

    - name: Run an LMCache multi-round QA cell
      ansible.builtin.import_tasks: lmcache-multi-round-qa.yml
      when: benchmark_run_request.suite == 'lmcache-multi-round-qa'

    - name: Run the vLLM multi-turn cross-check
      ansible.builtin.import_tasks: vllm-multi-turn.yml
      when: benchmark_run_request.suite == 'vllm-multi-turn'

  always:
    - name: Find cache-cell telemetry snapshots on the selected node
      ansible.builtin.find:
        paths: "{{ _benchmark_run_node_scratch }}/telemetry"
        file_type: file
      register: _benchmark_run_kvo_telemetry_files
      when: >-
        benchmark_run_request.suite in ['vllm-sweep', 'lmcache-multi-round-qa', 'vllm-multi-turn']

    - name: Create the cache-cell telemetry directory in the client
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ benchmark_run_request.client_vmid }}"
          - --
          - mkdir
          - -p
          - "{{ _benchmark_run_client_result }}/telemetry"
      changed_when: true
      when:
        - benchmark_run_request.suite in ['vllm-sweep', 'lmcache-multi-round-qa', 'vllm-multi-turn']
        - _benchmark_run_kvo_telemetry_files.matched | default(0) | int > 0

    - name: Copy cache-cell telemetry snapshots into the client archive
      ansible.builtin.command:
        argv:
          - pct
          - push
          - "{{ benchmark_run_request.client_vmid }}"
          - "{{ item.path }}"
          - "{{ _benchmark_run_client_result }}/telemetry/{{ item.path | basename }}"
      loop: "{{ _benchmark_run_kvo_telemetry_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: true
      when: >-
        benchmark_run_request.suite in ['vllm-sweep', 'lmcache-multi-round-qa', 'vllm-multi-turn']

    - name: Summarize the LMCache cache-tier cell from its CSV and metric snapshots
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ benchmark_run_request.client_vmid }}"
          - --
          - docker
          - run
          - --rm
          - --pull=never
          - --network
          - host
          - -v
          - "{{ _benchmark_run_client_result }}:/out:ro"
          - --workdir
          - /out
          - --entrypoint
          - python
          - "{{ benchmark_run_request.vllm_client_image }}"
          - -c
          - |
            import csv, glob, json, math, os, re, statistics, sys

            cfg = json.loads(sys.argv[1])
            csv_path = os.path.join('/out', sys.argv[2])
            telemetry_dir = os.path.join('/out', 'telemetry')

            def number(value):
                try:
                    result = float(value)
                except (TypeError, ValueError):
                    return None
                return result if math.isfinite(result) else None

            def percentile(values, p):
                values = sorted(value for value in values if value is not None)
                if not values:
                    return None
                position = (len(values) - 1) * p
                lower = int(position)
                upper = min(lower + 1, len(values) - 1)
                return values[lower] + (values[upper] - values[lower]) * (position - lower)

            rows = []
            with open(csv_path, newline='', encoding='utf-8') as source:
                for row in csv.DictReader(source):
                    parsed = {key: number(row.get(key)) for key in (
                        'prompt_tokens', 'generation_tokens', 'ttft', 'generation_time',
                        'question_id', 'launch_time', 'finish_time')}
                    if parsed['question_id'] is not None:
                        parsed['question_id'] = int(parsed['question_id'])
                        rows.append(parsed)
            if not rows:
                raise SystemExit('LMCache summary CSV contains no completed requests')

            by_round = {}
            for row in rows:
                by_round.setdefault(row['question_id'], []).append(row)
            round_results = []
            for question_id, requests in sorted(by_round.items()):
                ttft = [row['ttft'] * 1000 for row in requests if row['ttft'] is not None]
                tpot = [row['generation_time'] * 1000 / row['generation_tokens']
                        for row in requests if row['generation_time'] is not None and
                        row['generation_tokens'] and row['generation_tokens'] > 0]
                starts = [row['launch_time'] for row in requests if row['launch_time'] is not None]
                finishes = [row['finish_time'] for row in requests if row['finish_time'] is not None]
                span = max(finishes) - min(starts) if starts and finishes else 0
                round_results.append({
                    'round': question_id,
                    'ttft_p50_ms': percentile(ttft, 0.50),
                    'ttft_p99_ms': percentile(ttft, 0.99),
                    'tpot_p50_ms_per_token': percentile(tpot, 0.50),
                    'tpot_p99_ms_per_token': percentile(tpot, 0.99),
                    'throughput_tokens_per_s': sum(row['generation_tokens'] or 0
                                                   for row in requests) / span if span > 0 else None,
                })

            all_ttft = [row['ttft'] * 1000 for row in rows if row['ttft'] is not None]
            first_ttft = [row['ttft'] * 1000 for row in rows
                          if row['question_id'] == 1 and row['ttft'] is not None]
            later_ttft = [row['ttft'] * 1000 for row in rows
                          if row['question_id'] > 1 and row['ttft'] is not None]
            all_tpot = [row['generation_time'] * 1000 / row['generation_tokens']
                        for row in rows if row['generation_time'] is not None and
                        row['generation_tokens'] and row['generation_tokens'] > 0]
            starts = [row['launch_time'] for row in rows if row['launch_time'] is not None]
            finishes = [row['finish_time'] for row in rows if row['finish_time'] is not None]
            span = max(finishes) - min(starts) if starts and finishes else 0

            samples = []
            cache_config = None
            prom_pattern = re.compile(r'^([A-Za-z_:][A-Za-z0-9_:]*)(?:\{([^}]*)\})?\s+([-+0-9.eE]+)')
            label_pattern = re.compile(r'([A-Za-z_][A-Za-z0-9_]*)="((?:\\.|[^"])*)"')
            for path in sorted(glob.glob(os.path.join(telemetry_dir, cfg['run_id'] + '-*.prom'))):
                phase = os.path.basename(path)[len(cfg['run_id']) + 1:].split('-', 1)[0]
                with open(path, encoding='utf-8') as source:
                    for line in source:
                        match = prom_pattern.match(line.strip())
                        if not match:
                            continue
                        name, raw_labels, raw_value = match.groups()
                        value = number(raw_value)
                        if value is None:
                            continue
                        labels = dict(label_pattern.findall(raw_labels or ''))
                        samples.append((phase, name, labels, value))
                        if name == 'vllm:cache_config_info' and cache_config is None:
                            if 'num_gpu_blocks' in labels and 'block_size' in labels:
                                cache_config = {
                                    'num_gpu_blocks': int(labels['num_gpu_blocks']),
                                    'block_size': int(labels['block_size']),
                                }
            if not cache_config or not cache_config['num_gpu_blocks'] or not cache_config['block_size']:
                raise SystemExit('vllm:cache_config_info with num_gpu_blocks and block_size is missing')

            def metric_totals(phase):
                totals = {}
                for sample_phase, name, _labels, value in samples:
                    if sample_phase == phase:
                        totals[name] = totals.get(name, 0.0) + value
                return totals

            before = metric_totals('before')
            after = metric_totals('after')
            metric_names = set(before) | set(after)

            def counter_delta(predicate):
                names = [name for name in metric_names if predicate(name.lower())]
                if not names:
                    return None
                deltas = [after.get(name, 0.0) - before.get(name, 0.0) for name in names]
                return sum(deltas) if all(delta >= 0 for delta in deltas) else None

            prefix_queries = counter_delta(lambda name: 'prefix_cache_queries' in name)
            prefix_hits = counter_delta(lambda name: 'prefix_cache_hits' in name)
            prefix_rate = prefix_hits / prefix_queries if prefix_queries and prefix_queries > 0 else None
            external_hit_names = [name for name in metric_names
                                  if ('external' in name.lower() or 'lmcache' in name.lower())
                                  and 'hit' in name.lower() and not name.lower().endswith('_bucket')]
            external_hits = counter_delta(lambda name: name in {item.lower() for item in external_hit_names})
            external_query_names = [name for name in metric_names
                                    if ('external' in name.lower() or 'lmcache' in name.lower())
                                    and any(term in name.lower() for term in ('quer', 'request', 'lookup'))
                                    and 'hit' not in name.lower()]
            external_queries = counter_delta(lambda name: name in {item.lower() for item in external_query_names})
            external_rate = (
                external_hits / external_queries
                if external_hits is not None and external_queries and external_queries > 0
                else None
            )
            external_metrics = {
                name: {'before': before.get(name), 'after': after.get(name),
                       'delta': after.get(name, 0.0) - before.get(name, 0.0)}
                for name in sorted(metric_names)
                if any(term in name.lower() for term in ('external', 'lmcache', 'prefix_cache', 'kv_offload'))
            }
            kv_usage = [value for _phase, name, _labels, value in samples
                        if 'kv_cache_usage_perc' in name]
            preemptions = counter_delta(lambda name: 'preempt' in name and
                                        not any(term in name for term in ('_bucket', '_created')))
            idle_medians = [value for _phase, name, labels, value in samples
                            if 'kv_block_idle_before_evict' in name and labels.get('quantile') == '0.5']
            idle_medians = [value for value in idle_medians if value is not None]

            memory_path = os.path.join(telemetry_dir, cfg['run_id'] + '-cgroup-memory.tsv')
            memory_rows = []
            with open(memory_path, newline='', encoding='utf-8') as source:
                for row in csv.DictReader(source, delimiter='\t'):
                    parsed = {key: number(row.get(key)) for key in (
                        'memory_current_bytes', 'memory_max_bytes', 'memory_peak_bytes',
                        'vllm_main_process_rss_kib')}
                    if parsed['memory_current_bytes'] is not None:
                        memory_rows.append(parsed)
            if not memory_rows:
                raise SystemExit('cgroup/RSS telemetry has no numeric samples')
            gib = 1024 ** 3
            memory_max = max(row['memory_max_bytes'] for row in memory_rows if row['memory_max_bytes'] is not None)
            memory_peak = max(row['memory_peak_bytes'] for row in memory_rows if row['memory_peak_bytes'] is not None)
            rss_peak = max(row['vllm_main_process_rss_kib'] for row in memory_rows
                           if row['vllm_main_process_rss_kib'] is not None)
            result = {
                'suite': cfg['suite'], 'arm': cfg['kv_arm'], 'workload': cfg['workload_id'],
                'run_id': cfg['run_id'], 'seed': cfg.get('seed'),
                'host_ram_limit_gib': cfg['host_ram_limit_gib'],
                'prefix_caching': cfg['prefix_caching'],
                'kv_offload_backend': cfg['kv_offload_backend'],
                'kv_offload_cpu_gib': cfg['kv_offload_cpu_gib'],
                'kv_offload_disk_gib': cfg['kv_offload_disk_gib'],
                'weight_cpu_offload_gib': cfg['weight_cpu_offload_gib'],
                'llamacpp_cache_ram_mib': cfg['llamacpp_cache_ram_mib'],
                'gpu_memory_utilization': cfg['gpu_memory_utilization'],
                'max_num_batched_tokens': cfg['max_num_batched_tokens'],
                'cache_workload': cfg['cache_workload'], 'num_users': cfg['num_users'],
                'num_rounds': cfg['num_rounds'], 'shared_prompt_tokens': cfg['shared_prompt_tokens'],
                'user_history_tokens': cfg['user_history_tokens'], 'answer_tokens': cfg['answer_tokens'],
                'request_rate': cfg['request_rate'], 'duration_seconds': cfg['duration_seconds'],
                'gpu_kv_capacity_tokens': cache_config['num_gpu_blocks'] * cache_config['block_size'],
                'cache_config_info': cache_config,
                'gpu_guest_cgroup_memory_max_bytes': int(memory_max),
                'gpu_guest_cgroup_memory_peak_bytes': int(memory_peak),
                'gpu_guest_cgroup_memory_max_gib': memory_max / gib,
                'gpu_guest_cgroup_memory_peak_gib': memory_peak / gib,
                'vllm_process_rss_peak_kib': int(rss_peak),
                'vllm_process_rss_peak_gib': rss_peak * 1024 / gib,
                'host_ram_peak_gib': max(row['memory_current_bytes'] for row in memory_rows) / gib,
                'csv_request_count': len(rows),
                'ttft_first_round_p50_ms': percentile(first_ttft, 0.50),
                'ttft_later_rounds_p50_ms': percentile(later_ttft, 0.50),
                'ttft_later_rounds_p99_ms': percentile(later_ttft, 0.99),
                'ttft_mean_ms': statistics.mean(all_ttft) if all_ttft else None,
                'tpot_p50_ms_per_token': percentile(all_tpot, 0.50),
                'tpot_p99_ms_per_token': percentile(all_tpot, 0.99),
                'throughput_tokens_per_s': (
                    sum(row['generation_tokens'] or 0 for row in rows) / span if span > 0 else None
                ),
                'requests_per_s': len(rows) / span if span > 0 else None,
                'ttft_by_round': round_results,
                'prefix_cache_hit_rate': prefix_rate,
                'external_prefix_cache_hit_rate': external_rate,
                'external_prefix_cache_hits': external_hits,
                'external_prefix_cache_metric_deltas': external_metrics,
                'kv_cache_usage_peak': max(kv_usage) if kv_usage else None,
                'kv_block_idle_before_evict_p50_s': statistics.median(idle_medians) if idle_medians else None,
                'preemptions': preemptions,
                'cache_metric_snapshot_count': sum(
                    1 for path in glob.glob(
                        os.path.join(telemetry_dir, cfg['run_id'] + '-*.prom')
                    )
                ),
                'ambient_temp_f': 80, 'gpu_power_limit_w': 300, 'gpu_fan_percent': 100,
            }
            print(json.dumps(result, separators=(',', ':'), allow_nan=False))
          - >-
            {{ {
              'suite': benchmark_run_request.suite,
              'run_id': benchmark_run_request.run_id,
              'kv_arm': benchmark_run_request.kv_arm,
              'workload_id': benchmark_run_request.workload_id,
              'host_ram_limit_gib': benchmark_run_request.host_ram_limit_gib,
              'prefix_caching': benchmark_run_request.prefix_caching,
              'kv_offload_backend': benchmark_run_request.kv_offload_backend,
              'kv_offload_cpu_gib': benchmark_run_request.kv_offload_cpu_gib,
              'kv_offload_disk_gib': benchmark_run_request.kv_offload_disk_gib,
              'weight_cpu_offload_gib': benchmark_run_request.weight_cpu_offload_gib,
              'llamacpp_cache_ram_mib': benchmark_run_request.llamacpp_cache_ram_mib,
              'gpu_memory_utilization': benchmark_run_request.gpu_memory_utilization,
              'max_num_batched_tokens': benchmark_run_request.max_num_batched_tokens,
              'cache_workload': benchmark_run_request.cache_workload,
              'num_users': benchmark_run_request.num_users,
              'num_rounds': benchmark_run_request.num_rounds,
              'shared_prompt_tokens': benchmark_run_request.shared_prompt_tokens,
              'user_history_tokens': benchmark_run_request.user_history_tokens,
              'answer_tokens': benchmark_run_request.answer_tokens,
              'request_rate': benchmark_run_request.request_rate,
              'duration_seconds': benchmark_run_request.duration_seconds,
              'seed': benchmark_run_request.seed
            } | to_json }}
          - "{{ benchmark_run_request.run_id }}-summary.csv"
      register: _benchmark_run_kvo_result
      changed_when: false
      failed_when: _benchmark_run_kvo_result.rc != 0
      when:
        - benchmark_run_request.suite == 'lmcache-multi-round-qa'
        - _benchmark_run_suite.rc | default(1) == 0

    - name: Emit the KVO result JSON line to the Semaphore task log
      ansible.builtin.debug:
        msg: "KVO_RESULT {{ _benchmark_run_kvo_result.stdout | trim }}"
      when: >-
        _benchmark_run_kvo_result is defined and
        _benchmark_run_kvo_result.rc | default(1) == 0

    - name: Calculate peak guest RAM and GPU memory from resource samples
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && awk -F '\t' 'NR > 1 && $3 ~ /^[0-9]+$/ && $4 ~ /^[0-9]+$/ {
          if (!count || $3 > ram) ram = $3;
          if (!count || $4 > gpu) gpu = $4;
          count++
          } END { if (!count) exit 1; printf "%.0f %.0f", ram, gpu }'
          {{ (_benchmark_run_node_scratch ~ '/telemetry/' ~
              benchmark_run_request.run_id ~ '-cgroup-memory.tsv') | quote }}
        executable: /bin/bash
      register: _benchmark_run_resource_peaks
      changed_when: false
      failed_when: _benchmark_run_resource_peaks.rc != 0
      no_log: true
      when: benchmark_run_request.suite == 'vllm-sweep'

    - name: Require the configured guest RAM headroom through the fixed-length cell
      ansible.builtin.assert:
        that:
          - >-
            benchmark_run_request.host_ram_limit_gib | float * 1073741824
            - _benchmark_run_resource_peaks.stdout.split()[0] | float
            >= 1610612736
        fail_msg: >-
          The fixed-length MoE cell used less than 1.5 GiB of guest RAM headroom;
          the cell's result is not accepted.
        quiet: true
      when:
        - benchmark_run_request.suite == 'vllm-sweep'
        - benchmark_run_request.moe_cpu_offload in ['ncmoe', 'cpumoe']

    - name: Add measured resource peaks to publisher dimensions
      ansible.builtin.set_fact:
        _benchmark_run_campaign_dimensions: >-
          {{ _benchmark_run_campaign_dimensions | combine({
            'resource': {
              'host_ram_peak_gib': (_benchmark_run_resource_peaks.stdout.split()[0] | float / 1073741824),
              'accelerator_memory_peak_gb':
                (_benchmark_run_resource_peaks.stdout.split()[1] | float * 1048576 / 1000000000)
            }
          }, recursive=true) }}
      when: benchmark_run_request.suite == 'vllm-sweep'

    - name: Write publisher dimensions with measured resource peaks
      ansible.builtin.copy:
        dest: "{{ _benchmark_run_node_scratch }}/campaign-dimensions.json"
        mode: "0640"
        content: >-
          {{ {
            'campaign_dimensions': _benchmark_run_campaign_dimensions,
            'dimension_null_reasons': _benchmark_run_campaign_dimension_null_reasons
          } | to_nice_json }}
      when: benchmark_run_request.suite == 'vllm-sweep'

    - name: Copy measured publisher dimensions into the client archive
      ansible.builtin.command:
        argv:
          - pct
          - push
          - "{{ benchmark_run_request.client_vmid }}"
          - "{{ _benchmark_run_node_scratch }}/campaign-dimensions.json"
          - "{{ _benchmark_run_client_root }}/campaign-dimensions.json"
      changed_when: true
      when: benchmark_run_request.suite == 'vllm-sweep'

    - name: Read a safe Promptfoo pass count from its JSON output
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ benchmark_run_request.client_vmid }}"
          - --
          - /usr/local/bin/node
          - -p
          - >-
            (function(){const r=JSON.parse(require('fs').readFileSync(
            '{{ _benchmark_run_client_result }}/{{ benchmark_run_request.suite }}.json',
            'utf8'));const n=r.results.stats.successes;if(!Number.isInteger(n)){
            throw new Error('Promptfoo success count missing')};return String(n)+' passed'})()
      register: _benchmark_run_promptfoo_summary
      changed_when: false
      when: benchmark_run_request.suite is match('^promptfoo-')

    - name: Emit a safe suite summary to the Semaphore task log
      ansible.builtin.debug:
        msg:
          suite: "{{ benchmark_run_request.suite }}"
          return_code: "{{ _benchmark_run_suite.rc | default('unknown') }}"
          stdout_line_count: "{{ _benchmark_run_suite.stdout_lines | default([]) | length }}"
          stderr_line_count: "{{ _benchmark_run_suite.stderr_lines | default([]) | length }}"
          workload_id: "{{ benchmark_run_request.workload_id | default('not applicable') }}"
          kv_arm: "{{ benchmark_run_request.kv_arm | default('not applicable') }}"
          cache_workload: "{{ benchmark_run_request.cache_workload | default('not applicable') }}"
          promptfoo_pass_summary: >-
            {{ (_benchmark_run_promptfoo_summary.stdout | default('not reported', true))
               if benchmark_run_request.suite is match('^promptfoo-')
               else 'not applicable' }}
      when: _benchmark_run_suite is defined

    - name: Archive the raw suite output inside the client
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ benchmark_run_request.client_vmid }}"
          - --
          - tar
          - -czf
          - "{{ _benchmark_run_client_archive }}"
          - -C
          - "{{ _benchmark_run_client_root }}"
          - .
      register: _benchmark_run_archive
      changed_when: true

    - name: Copy the raw result archive from the client to the node
      ansible.builtin.command:
        argv:
          - pct
          - pull
          - "{{ benchmark_run_request.client_vmid }}"
          - "{{ _benchmark_run_client_archive }}"
          - "{{ _benchmark_run_node_artifact }}/{{ benchmark_run_request.run_id }}.tar.gz"
      register: _benchmark_run_collect
      changed_when: true

    - name: Report the raw result artifact path
      ansible.builtin.debug:
        msg: "Raw benchmark results: {{ _benchmark_run_node_artifact }}/{{ benchmark_run_request.run_id }}.tar.gz"

    - name: Remove temporary run inputs from the node
      ansible.builtin.file:
        path: "{{ _benchmark_run_node_scratch }}"
        state: absent
