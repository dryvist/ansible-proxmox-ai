---
# Loads roles/hermes_agent's operating-profile list into a play that does
# not run that role, the same include_vars-then-set_fact shape
# load_fabric_registry.yml uses for llm_router's registry. Import from
# `pre_tasks`:
#
#   pre_tasks:
#     - ansible.builtin.import_tasks: tasks/load_hermes_profiles.yml
- name: Load Hermes' operating-profile list
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../roles/hermes_agent/defaults/main/150-fleet-health-profiles.yml"
    name: _hermes_fleet_health_defaults

- name: Publish hermes_agent_profiles to this play
  ansible.builtin.set_fact:
    hermes_agent_profiles: "{{ _hermes_fleet_health_defaults.hermes_agent_profiles }}"
