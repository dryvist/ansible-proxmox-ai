---
# Loads roles/hermes_agent's operating-profile list into a play that does
# not run that role, the same include_vars-then-set_fact shape
# load_fabric_registry.yml uses for llm_router's registry. Import with
# `_hermes_agent_role_dir` set to that role's directory:
#
#   ansible.builtin.import_tasks: tasks/load_hermes_profiles.yml
#   vars:
#     _hermes_agent_role_dir: "{{ playbook_dir }}/../roles/hermes_agent"
- name: Load Hermes' operating-profile list
  ansible.builtin.include_vars:
    file: "{{ _hermes_agent_role_dir }}/defaults/main/150-fleet-health-profiles.yml"
    name: _hermes_fleet_health_defaults

# Only the name and the router-facing security markers cross into this play:
# other profile fields may reference a variable only hermes_agent defines.
- name: Publish hermes_agent_profiles to this play
  ansible.builtin.set_fact:
    hermes_agent_profiles: >-
      {%- if (hermes_agent_identity | default(hermes_agent_id | default('hermes'))) in ['hermes-private', 'pepper']
            or hermes_agent_isolated | default(false) | bool -%}
      {{ [] }}
      {%- else -%}
      {%- set ns = namespace(profiles=[]) -%}
      {%- for profile in _hermes_fleet_health_defaults.hermes_agent_profiles -%}
      {%- set _gate = profile.feature_gate | default('') -%}
      {%- if not _gate or lookup('vars', _gate, default=false) | bool -%}
      {%- set _public_profile = {'name': profile.name} -%}
      {%- if profile.locked | default(false) -%}
      {%- set _public_profile = _public_profile | combine({'locked': true, 'mcp': profile.mcp}) -%}
      {%- endif -%}
      {%- set ns.profiles = ns.profiles + [_public_profile] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.profiles }}
      {%- endif -%}
