---
# include_role (not import_tasks on the role's raw task path): loads the
# role's own defaults/main.yml first. Runs in pre_tasks, outside the tasks:
# block/rescue below, so a failed gate is fatal to the whole play instead of
# one replica's isolated failure — see the comment header on
# roles/hindsight_docker/tasks/run_db_migration.yml for why this gate
# exists. Worker decommission runs from its own final play, after every
# batch below has redeployed — see the second play in playbooks/hindsight.yml
# and the comment header on decommission_stale_workers.yml for why.

- name: Run the Hindsight database migration once, before any replica redeploys
  ansible.builtin.include_role:
    name: hindsight_docker
    tasks_from: run_db_migration.yml
