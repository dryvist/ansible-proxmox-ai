---
# include_role (not import_tasks on the role's raw task path): loads the
# role's own defaults/main.yml first. Runs in pre_tasks, outside the tasks:
# block/rescue below, so a failed gate is fatal to the whole play instead of
# one replica's isolated failure — see the comment headers on
# roles/hindsight_docker/tasks/run_db_migration.yml and
# decommission_stale_workers.yml for why each gate exists.

- name: Run the Hindsight database migration once, before any replica redeploys
  ansible.builtin.include_role:
    name: hindsight_docker
    tasks_from: run_db_migration.yml

- name: Decommission Hindsight worker ids no longer present in inventory
  ansible.builtin.include_role:
    name: hindsight_docker
    tasks_from: decommission_stale_workers.yml
