---
# Loads dryvist.homelab.llm_model_catalog's defaults (llm_model_catalog_models)
# into a play that needs the shared GGUF catalog — same public-defaults shape
# as tasks/load_fabric_registry.yml, minus tasks_from: the catalog role has no
# tasks at all, only defaults (dryvist/homelab-contracts). Import from
# `pre_tasks` in any play whose llama_cpp_models sources hf_repo/gguf from the
# catalog by name (see roles/llama_cpp/defaults/main/00-core.yml):
#
#   pre_tasks:
#     - ansible.builtin.import_tasks: tasks/load_model_catalog.yml
- name: Load the shared model catalog
  ansible.builtin.include_role:
    name: dryvist.homelab.llm_model_catalog
    public: true
