---
- name: Assemble interactive latency gate report values
  ansible.builtin.set_fact:
    _llm_campaign_latency_observation:
      # Empty until a ratio/baseline query ran; a count-stage failure reports its values in window_counts.
      http_status: >-
        {{ _llm_campaign_latency_classification_observation.http_status
           if 'http_status' in _llm_campaign_latency_classification_observation
           else 'n/a (count stage, see window counts)' }}
      prometheus_status: >-
        {{ _llm_campaign_latency_classification_observation.prometheus_status
           if 'prometheus_status' in _llm_campaign_latency_classification_observation
           else 'n/a (count stage, see window counts)' }}
      result_count: >-
        {{ _llm_campaign_latency_classification_observation.result_count
           if 'result_count' in _llm_campaign_latency_classification_observation
           else 'n/a (count stage, see window counts)' }}
      raw_ratio: >-
        {{ _llm_campaign_latency_classification_observation.raw_value
           if _llm_campaign_latency_classification_kind == 'ratio' else none }}
      max_ratio: "{{ llm_campaign_latency_max_ratio }}"
      window: >-
        {{ _llm_campaign_latency_selected_window.window
           if _llm_campaign_latency_selected_window is mapping else none }}
      sample_count: >-
        {{ _llm_campaign_latency_selected_window.sample_count
           if _llm_campaign_latency_selected_window is mapping
           else _llm_campaign_latency_largest_window.sample_count | default(none) }}
      largest_window: >-
        {{ _llm_campaign_latency_largest_window.window
           if _llm_campaign_latency_largest_window is mapping else none }}
      largest_window_count: >-
        {{ _llm_campaign_latency_largest_window.sample_count | default(none)
           if _llm_campaign_latency_largest_window is mapping else none }}
      baseline_value: "{{ _llm_campaign_latency_baseline_observation.raw_value | default(none) }}"
      window_counts: >-
        {{ _llm_campaign_latency_window_counts
           | map('dict2items') | map('selectattr', 'key', 'in',
               ['window', 'http_status', 'prometheus_status', 'result_count', 'sample_count'])
           | map('items2dict') | list }}
  changed_when: false

- name: Fail closed on interactive latency gate failures
  ansible.builtin.assert:
    that:
      - "_llm_campaign_latency_reason in ['pass', 'idle: nothing to protect']"
    fail_msg: >-
      Interactive latency gate failed: {{ _llm_campaign_latency_reason }};
      HTTP status={{ _llm_campaign_latency_observation.http_status }};
      Prometheus status={{ _llm_campaign_latency_observation.prometheus_status | default('none', true) }};
      result count={{ 'none' if _llm_campaign_latency_observation.result_count is none
                      else _llm_campaign_latency_observation.result_count }};
      raw ratio={{ _llm_campaign_latency_observation.raw_ratio | default('none', true) }};
      baseline p95={{ _llm_campaign_latency_observation.baseline_value | default('none', true) }};
      max ratio={{ _llm_campaign_latency_observation.max_ratio }};
      window={{ _llm_campaign_latency_observation.window | default('none', true) }};
      sample count={{ _llm_campaign_latency_observation.sample_count | default('none', true) }};
      largest window={{ _llm_campaign_latency_observation.largest_window | default('none', true) }};
      count={{ _llm_campaign_latency_observation.largest_window_count | default('none', true) }};
      window counts={{ _llm_campaign_latency_observation.window_counts | to_json }}.
    quiet: true

- name: Report idle interactive latency gate
  ansible.builtin.debug:
    msg: >-
      idle: nothing to protect; largest window={{ _llm_campaign_latency_observation.largest_window }}
      count={{ _llm_campaign_latency_observation.largest_window_count }}
  when: "_llm_campaign_latency_reason == 'idle: nothing to protect'"

- name: Report the interactive latency gate result
  ansible.builtin.debug:
    msg: >-
      Interactive latency gate passed: ratio={{ _llm_campaign_latency_observation.raw_ratio }},
      max={{ _llm_campaign_latency_observation.max_ratio }},
      window={{ _llm_campaign_latency_observation.window }},
      samples={{ _llm_campaign_latency_observation.sample_count }}.
  when: _llm_campaign_latency_reason == 'pass'
