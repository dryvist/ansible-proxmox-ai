---
# Drain model inputs against the same registry projections the router renders.
- name: Use safe registry targets while GPU profiles are drained
  ansible.builtin.set_fact:
    ai_default_model: "{{ llm_router_primary_model }}"
    hermes_brain_model: "{{ llm_router_primary_model }}"
    hermes_goal_judge_model: >-
      {{ llm_router_d1_zdr_rungs_by_class['local'] | first
         | default(llm_router_d1_zdr_rungs_by_class['sub'] | first
           | default(llm_router_primary_model, true), true) }}
  when: not (llm_router_gpu_profiles_enabled | bool)
