---
# Loads llm_router's registry defaults into a play that is not llm_router's
# own (llm-serving.yml) — see roles/llm_router/tasks/registry.yml for why
# this exact include_role/tasks_from/public shape is the one path every
# consumer (fabric_watchdog, the llm_vllm_group llama.cpp play, this file's
# callers) uses rather than hand-rolling the registry path. Import from
# `pre_tasks` in any play whose defaults resolve an llm_router selector:
#
#   pre_tasks:
#     - ansible.builtin.import_tasks: tasks/load_fabric_registry.yml
- name: Load the fabric model registry
  ansible.builtin.include_role:
    name: llm_router
    tasks_from: registry.yml
    public: true
