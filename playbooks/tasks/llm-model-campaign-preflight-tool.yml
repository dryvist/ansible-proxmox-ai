---
- name: Inspect the installed llama-bench command surface
  ansible.builtin.command:
    argv: [llama-bench, --help]
  register: _llm_campaign_llama_help
  changed_when: false
  when:
    - engine == 'llama_cpp'
    - _llm_campaign_run.executable == 'llama-bench'

- name: Require the llama-bench recipe options
  ansible.builtin.assert:
    that:
      - _llm_campaign_llama_help.stdout is search('-fa')
      - _llm_campaign_llama_help.stdout is search('-ngl')
      - _llm_campaign_llama_help.stdout is search('-o')
      - _llm_campaign_llama_help.stdout is search('-p')
      - _llm_campaign_llama_help.stdout is search('-n')
    fail_msg: "The installed llama-bench lacks one or more options declared by the recipe."
    quiet: true
  when:
    - engine == 'llama_cpp'
    - _llm_campaign_run.executable == 'llama-bench'

- name: Inspect the installed llama-batched-bench command surface
  ansible.builtin.command:
    argv: [llama-batched-bench, --help]
  register: _llm_campaign_batched_help
  changed_when: false
  when:
    - engine == 'llama_cpp'
    - _llm_campaign_run.executable == 'llama-batched-bench'

- name: Require the llama-batched-bench recipe options
  ansible.builtin.assert:
    that:
      - _llm_campaign_batched_help.stdout is search('-c')
      - _llm_campaign_batched_help.stdout is search('-npp')
      - _llm_campaign_batched_help.stdout is search('-ntg')
      - _llm_campaign_batched_help.stdout is search('-npl')
      - _llm_campaign_batched_help.stdout is search('-ngl')
    fail_msg: "The installed llama-batched-bench lacks one or more options declared by the recipe."
    quiet: true
  when:
    - engine == 'llama_cpp'
    - _llm_campaign_run.executable == 'llama-batched-bench'

- name: Require declared llama.cpp depth support before that row can run
  ansible.builtin.assert:
    that:
      - _llm_campaign_llama_help.stdout is search(_llm_campaign_run.requires_capability.flag)
    fail_msg: "The installed llama-bench does not report the depth flag required by this recipe."
    quiet: true
  when:
    - engine == 'llama_cpp'
    - _llm_campaign_run.requires_capability is defined

- name: Inspect the installed vLLM serve-bench command surface
  ansible.builtin.command:
    argv: [vllm, bench, serve, --help]
  register: _llm_campaign_vllm_help
  changed_when: false
  when:
    - engine == 'vllm'
    - _llm_campaign_run.executable == 'vllm'

- name: Require every vLLM option used by the selected recipe
  ansible.builtin.assert:
    that:
      - _llm_campaign_vllm_help.stdout is search('--backend')
      - _llm_campaign_vllm_help.stdout is search('--endpoint')
      - _llm_campaign_vllm_help.stdout is search('--max-concurrency')
      - _llm_campaign_vllm_help.stdout is search('--random-input-len')
      - _llm_campaign_vllm_help.stdout is search('--random-output-len')
      - _llm_campaign_vllm_help.stdout is search('--random-prefix-len')
      - _llm_campaign_vllm_help.stdout is search('--save-result')
      - _llm_campaign_vllm_help.stdout is search('--save-detailed')
      - _llm_campaign_vllm_help.stdout is search('--num-prompts')
      - _llm_campaign_vllm_help.stdout is search('--ignore-eos')
      - _llm_campaign_vllm_help.stdout is search('--seed')
      - _llm_campaign_vllm_help.stdout is search('--percentile-metrics')
      - _llm_campaign_vllm_help.stdout is search('--metric-percentiles')
    fail_msg: "The installed vLLM bench serve lacks one or more options declared by the recipe."
    quiet: true
  when:
    - engine == 'vllm'
    - _llm_campaign_run.executable == 'vllm'

- name: Inspect the installed MLX benchmark module
  ansible.builtin.command:
    argv: [python, -m, mlx_lm.benchmark, --help]
  register: _llm_campaign_mlx_help
  changed_when: false
  when:
    - engine == 'mlx_lm'
    - _llm_campaign_run.executable == 'python'

- name: Require every MLX option used by the selected recipe
  ansible.builtin.assert:
    that:
      - _llm_campaign_mlx_help.stdout is search('--prompt-tokens')
      - _llm_campaign_mlx_help.stdout is search('--generation-tokens')
      - _llm_campaign_mlx_help.stdout is search('--num-trials')
    fail_msg: "The installed MLX benchmark module lacks one or more options declared by the recipe."
    quiet: true
  when:
    - engine == 'mlx_lm'
    - _llm_campaign_run.executable == 'python'

- name: Inspect the installed lm-eval command surface
  ansible.builtin.command:
    argv: [lm_eval, --help]
  register: _llm_campaign_lmeval_help
  changed_when: false
  when: _llm_campaign_run.executable == 'lm_eval'

- name: Require every lm-eval option used by the selected recipe
  ansible.builtin.assert:
    that:
      - _llm_campaign_lmeval_help.stdout is search('--output_path')
      - _llm_campaign_lmeval_help.stdout is search('--log_samples')
      - _llm_campaign_lmeval_help.stdout is search('--gen_kwargs')
      - _llm_campaign_lmeval_help.stdout is search('--limit')
      - _llm_campaign_lmeval_help.stdout is search('--model_args')
      - _llm_campaign_lmeval_help.stdout is search('--tasks')
      - _llm_campaign_lmeval_help.stdout is search('--batch_size')
      - _llm_campaign_lmeval_help.stdout is search('--apply_chat_template')
      - _llm_campaign_lmeval_help.stdout is search('--fewshot_as_multiturn')
    fail_msg: "The installed lm-eval lacks one or more options declared by the recipe."
    quiet: true
  when: _llm_campaign_run.executable == 'lm_eval'

- name: Inspect the installed EvalScope command surface
  ansible.builtin.command:
    argv: [evalscope, eval, --help]
  register: _llm_campaign_evalscope_help
  changed_when: false
  when: _llm_campaign_run.executable == 'evalscope'

- name: Require every EvalScope option used by the selected recipe
  ansible.builtin.assert:
    that:
      - _llm_campaign_evalscope_help.stdout is search('--model')
      - _llm_campaign_evalscope_help.stdout is search('--api-url')
      - _llm_campaign_evalscope_help.stdout is search('--api-key')
      - _llm_campaign_evalscope_help.stdout is search('--eval-type')
      - _llm_campaign_evalscope_help.stdout is search('--datasets')
      - _llm_campaign_evalscope_help.stdout is search('--dataset-args')
      - _llm_campaign_evalscope_help.stdout is search('--generation-config')
      - _llm_campaign_evalscope_help.stdout is search('--eval-batch-size')
      - _llm_campaign_evalscope_help.stdout is search('--sandbox')
      - _llm_campaign_evalscope_help.stdout is search('--work-dir')
      - _llm_campaign_evalscope_help.stdout is search('--no-timestamp')
    fail_msg: "The installed EvalScope lacks one or more options declared by the recipe."
    quiet: true
  when: _llm_campaign_run.executable == 'evalscope'

# EvalScope runs LiveCodeBench generations in a local subprocess with a
# per-test timeout unless the recipe asks for a Docker sandbox; only that
# request needs an engine.
- name: Require a running Docker engine for the EvalScope code sandbox
  ansible.builtin.command:
    argv: [docker, info]
  changed_when: false
  when:
    - _llm_campaign_run.executable == 'evalscope'
    - >-
      '"engine": "docker"' in (_llm_campaign_run.argv | default([]) | map('string') | join(' '))

- name: Inspect the installed uv command for controller-side throughput rows
  ansible.builtin.command:
    argv: [uv, --version]
  register: _llm_campaign_uv_version
  changed_when: false
  delegate_to: localhost
  when:
    - _llm_campaign_run.run_on == 'controller'
    - _llm_campaign_run.executable == 'uv'
