---
# Resolves the client endpoint hostnames of every isolated Hermes identity, each through
# that identity's own AppRole. An identity in the research posture has no client
# endpoints: nothing is read for it and its proxy policy uses inventory hostnames only.
- name: Resolve the client endpoints for the isolated identities' proxy policies
  when: _pepper_egress_clients | length > 0
  vars: &pepper_egress_client_vars
    _pepper_egress_clients: >-
      {%- set identities = [] -%}
      {%- for host in hermes_agent_isolated_hosts -%}
        {%- if not (hostvars[host].hermes_agent_pepper_research_enabled | default(false) | bool) -%}
          {%- set _ = identities.append(hostvars[host].hermes_agent_identity) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ identities | unique | list }}
  block:
    - name: Fetch each isolated identity's domain through its own AppRole
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        apply:
          delegate_to: localhost
          connection: local
          become: false
          run_once: true
      vars:
        ansible_become: false
        # Pepper keeps its own paths; any other identity reads the roster leaf its runtime
        # reads (ai/<identity>, inventory/group_vars/all/openbao_secrets/11-roster-domains.yml).
        openbao_secrets_domains: >-
          {%- set domains = [] -%}
          {%- for identity in _pepper_egress_clients -%}
            {%- set env_name = 'OPENBAO_APPROLE_' ~ (identity | upper | replace('-', '_')) -%}
            {%- set _ = domains.append({
                  'name': identity,
                  'role_id_env': env_name ~ '_ROLE_ID',
                  'secret_id_env': env_name ~ '_SECRET_ID',
                  'paths': openbao_secrets_pepper_paths if identity == 'pepper' else ['ai/' ~ identity],
                  'required': true}) -%}
          {%- endfor -%}
          {{ domains }}
        # The squid play has no Hermes hosts in ansible_play_hosts_all. Activate each
        # identity's own roster groups so the shared role's domain filter keeps its entry.
        openbao_secrets_active_groups: >-
          {{ _pepper_egress_clients | map('extract', openbao_secrets_domain_groups)
             | select('defined') | flatten | unique | list }}
        # This endpoint read must never fall back to the broader operator identity.
        openbao_secrets_operator_domains: []
      run_once: true

    - name: Project only each identity's client endpoint hostnames
      ansible.builtin.set_fact:
        squid_pepper_endpoint_hosts_by_identity: >-
          {%- set by_identity = {} -%}
          {%- for identity in _pepper_egress_clients -%}
            {%- set domain = _pepper_egress_domains.get(identity, {}) -%}
            {%- set hosts = {'hermes_agent_pepper_youtrack_host':
                  domain.get('YOUTRACK_MCP_URL', '') | ansible.builtin.urlsplit('hostname')} -%}
            {%- if identity == 'pepper' -%}
              {%- set _ = hosts.update({'hermes_agent_pepper_vault_host':
                    domain.get('PEPPER_VAULT_REPO_URL', '') | ansible.builtin.urlsplit('hostname')}) -%}
            {%- endif -%}
            {%- set _ = by_identity.update({identity: hosts}) -%}
          {%- endfor -%}
          {{ by_identity }}
      vars:
        _pepper_egress_domains: "{{ hostvars['localhost'].openbao_secrets_by_domain | default({}, true) }}"
      no_log: true

    - name: Require every client endpoint hostname
      ansible.builtin.assert:
        that:
          - >-
            squid_pepper_endpoint_hosts_by_identity.values() | map('dict2items') | flatten
            | rejectattr('value') | list | length == 0
        fail_msg: >-
          An isolated identity's proxy requires its client endpoint URLs from its own identity domain;
          refusing to render the allowlist.
        quiet: true
      no_log: true
  rescue:
    - name: Refuse a proxy render without the client endpoints
      ansible.builtin.fail:
        msg: >-
          An isolated identity's proxy requires its client endpoint URLs from its own identity domain;
          check that identity's AppRole lookup. Refusing to render the allowlist.

- name: Skip the client endpoints when every isolated identity is in the research posture
  ansible.builtin.set_fact:
    squid_pepper_endpoint_hosts_by_identity: {}
  when: _pepper_egress_clients | length == 0
  vars: *pepper_egress_client_vars
