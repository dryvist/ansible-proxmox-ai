---
- name: Resolve the client endpoints for the Pepper proxy policy
  block:
    - name: Read only the client endpoint hostnames on the controller
      ansible.builtin.set_fact:
        squid_pepper_endpoint_hosts: >-
          {{ squid_pepper_endpoint_hosts | default({}) | combine({item.name:
             lookup('community.hashi_vault.hashi_vault',
               openbao_secrets_kv_mount ~ '/data/' ~ openbao_secrets_pepper_path ~ ':' ~ item.field,
               url=lookup('ansible.builtin.env', 'SECRET_STORE_ADDR')
                   | default(lookup('ansible.builtin.env', 'BAO_ADDR'), true),
               token=lookup('ansible.builtin.env', 'BAO_TOKEN'),
               validate_certs=true) | ansible.builtin.urlsplit('hostname')}) }}
      loop:
        - name: hermes_agent_pepper_youtrack_host
          field: YOUTRACK_MCP_URL
        - name: hermes_agent_pepper_vault_host
          field: PEPPER_VAULT_REPO_URL
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_become: false
      no_log: true
  rescue:
    - name: Refuse a proxy render without the client endpoints
      ansible.builtin.fail:
        msg: >-
          Pepper proxy requires both client endpoint URLs from its identity secret;
          check controller lookup access. Refusing to render the allowlist.
