---
# Play-level failure isolation: every independent guest play below wraps its
# role(s) in block/rescue, so one dead host can't abort the whole run (an
# ansible-core executor behavior — see playbooks/tasks/record_isolated_failure.yml
# for the root cause). The gate play at the end of this file still fails the
# run if any play recorded a failure.
#
# Import OpenTofu infrastructure data before running application playbooks.
# This populates the inventory dynamically from the published tofu inventory.
- name: Load OpenTofu infrastructure inventory
  import_playbook: ../inventory/load_tofu.yml

# =============================================================================
# Phase 0: OpenBao resource-domain secrets pre-fetch
# Reads each resource domain's KV subtree into a `bao_<domain>_secrets` fact.
# It runs once on the controller and publishes values to managed-secret hosts
# and clickhouse_group. It skips when BAO_ADDR or domain credentials are unset.
#
# The `always` tag makes prefetched values available to scoped role runs.
# Controller-side reads complete before consumer roles run.
# =============================================================================

- name: Pre-fetch resource-domain secrets from OpenBao
  hosts: managed_secrets_group:clickhouse_group
  gather_facts: false
  tags: always
  pre_tasks:
    # The agentgateway-agent-keys domain lists every `ai_callers` leaf, and the
    # registry half of that map is a role fact.
    - name: Load the harness caller registry
      ansible.builtin.import_tasks: tasks/load_agent_callers.yml
  tasks:
    - name: Fetch each resource-domain's KV subtree via its own AppRole
      ansible.builtin.include_role:
        name: openbao_secrets

    # Publish the domain's shared, un-prefixed fact at the playbook layer
    # (like tofu_data in load_tofu.yml). openbao_secrets_by_domain was
    # computed once on the delegated controller; a domain that was skipped
    # (BAO_ADDR or its creds unset) is simply absent from the dict, so
    # `default({})` covers it the same as a host outside this play.
    - name: Publish each domain's merged secrets to every host in this play
      ansible.builtin.set_fact:
        bao_local_llm_secrets: "{{ openbao_secrets_by_domain['local-llm'] | default({}) }}"
        bao_apps_secrets: "{{ openbao_secrets_by_domain['apps'] | default({}) }}"
        bao_ai_public_secrets: "{{ openbao_secrets_by_domain['ai-public'] | default({}) }}"
        bao_ai_runner_secrets: "{{ openbao_secrets_by_domain['ai-runner'] | default({}) }}"
        # agent_guest reuses the ai-runner OpenBao domain: same queue token,
        # same guests, no new identity to provision for the successor role.
        bao_agent_guest_secrets: "{{ openbao_secrets_by_domain['ai-runner'] | default({}) }}"
        bao_hermes_secrets: "{{ openbao_secrets_by_domain['hermes'] | default({}) }}"
        bao_clickhouse_secrets: "{{ openbao_secrets_by_domain['clickhouse'] | default({}) }}"
        # The whole map, so an identity-keyed consumer can select its OWN
        # domain by name (hermes_agent_bao, keyed on hermes_agent_id) instead
        # of needing a new binding line here per agent. Written from the
        # controller expression rather than the vars: entry below to keep the
        # set_fact free of a same-name self-reference.
        openbao_secrets_by_domain: >-
          {{ hostvars['localhost'].openbao_secrets_by_domain | default({}) }}
      vars:
        openbao_secrets_by_domain: "{{ hostvars['localhost'].openbao_secrets_by_domain | default({}) }}"
      no_log: true
      when: inventory_hostname not in groups.get('llm_classify', [])

    - name: Publish only the Laya key to classifier guests
      ansible.builtin.set_fact:
        bao_local_llm_secrets: >-
          {{ {'laya_api_key':
             (hostvars['localhost'].openbao_secrets_by_domain | default({}))
             .get('local-llm', {}).get('laya_api_key', '')} }}
      no_log: true
      when: inventory_hostname in groups.get('llm_classify', [])

# =============================================================================
# Phase 1: Qdrant Vector Database
# AI RAG vector database — Docker in LXC container
# =============================================================================

- name: Configure Qdrant vector database
  hosts: qdrant_group
  become: true
  gather_facts: false
  tags:
    - qdrant_docker
    - vectordb
    - ai
  vars:
    _vdb_ports: >-
      {{ hostvars['localhost']['tofu_data']['constants']['vector_db_ports'] }}
    qdrant_docker_http_port: "{{ _vdb_ports.qdrant_http }}"
    qdrant_docker_grpc_port: "{{ _vdb_ports.qdrant_grpc }}"
  tasks:
    - name: Converge qdrant_docker (isolated — failure does not abort downstream plays)
      block:
        - name: Include qdrant_docker role
          ansible.builtin.include_role:
            name: qdrant_docker
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: qdrant_docker

# Phase 1b/1c: Hindsight agent-memory service, its worker-decommission
# sweep, and its logical DR. Split out to keep this file within its token
# budget (.token-limits.yaml) — same reason as agents.yml and
# llm-serving.yml below.
- name: Configure Hindsight (agent-memory service + logical DR)
  import_playbook: hindsight.yml

# =============================================================================
# Phase 2: Local LLM — Ollama inference (AMD ROCm) + Open WebUI chat
# Ollama serves models on the ai VLAN; Open WebUI is the chat front-end,
# fronted by Traefik at https://llm.<subdomain>. Ollama stays internal.
# =============================================================================

- name: Configure Ollama LLM inference (AMD ROCm)
  hosts: ollama_group
  become: true
  gather_facts: false
  tags:
    - ollama
    - llm
    - ai
  tasks:
    - name: Converge ollama (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include ollama role
          ansible.builtin.include_role:
            name: ollama
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: ollama

- name: Configure Open WebUI chat front-end
  hosts: open_webui_group
  become: true
  gather_facts: false
  pre_tasks:
    - name: Load the fabric model registry
      ansible.builtin.import_tasks: tasks/load_fabric_registry.yml
  tags:
    - open_webui
    - llm
    - ai
  tasks:
    - name: Converge open_webui (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include open_webui role
          ansible.builtin.include_role:
            name: open_webui
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: open_webui

# Phase 3: the interactive agent plane (Hermes, its companion UI, herdr).
# Split out to keep this file within its token budget — it converges here,
# after Hindsight and before the serving fabric, exactly as before.
- name: Configure the interactive agent plane
  import_playbook: agents.yml

# LLM serving and routing (both GPU guests, spend store, router). Split out
# to keep this file within its token budget and because those plays are
# order-coupled with each other — see the playbook's own header.
- name: Configure LLM serving and routing
  import_playbook: llm-serving.yml

# Read-only router database preflight. Tagged `never`: runs only when selected
# with --tags llm_router_db_preflight, never in a converge.
- name: Read-only preflight of the LLM router database
  import_playbook: llm-router-db-preflight.yml

- name: Configure LlamaIndex RAG engine
  hosts: llamaindex_group
  become: true
  gather_facts: false
  tags:
    - llamaindex
    - rag
    - ai
  vars:
    _vdb_ports: >-
      {{ hostvars['localhost']['tofu_data']['constants']['vector_db_ports'] }}
    llamaindex_qdrant_host: "{{ hostvars['qdrant']['container_ip'] }}"
    llamaindex_qdrant_port: "{{ _vdb_ports.qdrant_http }}"
    llamaindex_agent_sessions_enabled: true
    llamaindex_splunk_url: >-
      {{ lookup('env', 'SPLUNK_URL') or undef('SPLUNK_URL required (Doppler)') }}
  tasks:
    - name: Converge llamaindex (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include llamaindex role
          ansible.builtin.include_role:
            name: llamaindex
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: llamaindex

- name: Configure AI orchestration platforms and observability
  import_playbook: ai-orchestration.yml

# Phase 7: the headless agent execution plane (job runners, egress proxy,
# pooled agent guests, pool return). Split out to keep this file within its
# token budget; the proxy-before-guests ordering lives in that file's headers.
- name: Configure the headless agent execution plane
  import_playbook: agent-runners.yml

# Secrets and deployment inventory are ready before a campaign can use them;
# the never tag keeps it opt-in during normal site convergence.
- name: Run a named model benchmark campaign
  import_playbook: llm-model-campaign.yml
  tags:
    - never
    - model_campaign

- name: Fail the run if any isolated play recorded a failure
  hosts: localhost
  gather_facts: false
  tags:
    - always
  tasks:
    # Failures are recorded host-locally (see tasks/record_isolated_failure.yml
    # — a shared delegated fact would drop entries when hosts fail
    # concurrently), so aggregate across every host's hostvars here.
    - name: Surface isolated play failures
      vars:
        _all_isolated_failures: >-
          {{ groups['all'] | union(['localhost'])
             | map('extract', hostvars, 'site_isolated_failures')
             | select('defined') | flatten }}
      ansible.builtin.fail:
        msg: >-
          {{ _all_isolated_failures | length }} isolated play failure(s) —
          the rest of site.yml still ran: {{ _all_isolated_failures | join('; ') }}
      when: _all_isolated_failures | length > 0
