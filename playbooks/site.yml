---
# Import OpenTofu infrastructure data before running application playbooks.
# This populates the inventory dynamically from the published tofu inventory.
- name: Load OpenTofu infrastructure inventory
  import_playbook: ../inventory/load_tofu.yml

# =============================================================================
# Phase 0: OpenBao resource-domain secrets pre-fetch
# Reads each resource domain's KV subtree (its own least-privilege AppRole)
# into a `bao_<domain>_secrets` fact — local-llm for the LLM/RAG stack, apps
# for the Hindsight memory-service credentials (apps/hindsight) — so every
# consumer role can resolve its secrets bao-first with an env fallback. Runs
# once on the controller
# and publishes to every AI group; it SKIPS CLEANLY when BAO_ADDR or the
# domain's role_id/secret_id envs are unset.
#
# tags: always — the pre-fetch must precede ANY consumer role, so a scoped
# run (`--tags llm_router`) still gets its secrets without having to remember
# a `--tags openbao_secrets,llm_router` pairing (the trap the upstream apps
# repo still has). The fetch is a handful of controller-side API reads, so
# running it on every scoped converge is cheap.
# =============================================================================

- name: Pre-fetch resource-domain secrets from OpenBao
  hosts: >-
    qdrant_group:hindsight_group:llamaindex_group:ollama_group:open_webui_group:
    hermes_agent_group:llm_fast_group:llm_router_group:llm_redis_group:
    dify_group:langflow_group:langgraph_group:agent_exec_group:
    langfuse_group:agentgateway_group:ai_orchestration_group:ai_runner_group:
    ai_agent_pool_group
  gather_facts: false
  tags: always
  tasks:
    - name: Fetch each resource-domain's KV subtree via its own AppRole
      ansible.builtin.include_role:
        name: openbao_secrets

    # Publish the domain's shared, un-prefixed fact at the playbook layer
    # (like tofu_data in load_tofu.yml). openbao_secrets_by_domain was
    # computed once on the delegated controller; a domain that was skipped
    # (BAO_ADDR or its creds unset) is simply absent from the dict, so
    # `default({})` covers it the same as a host outside this play.
    - name: Publish each domain's merged secrets to every host in this play
      ansible.builtin.set_fact:
        bao_local_llm_secrets: "{{ openbao_secrets_by_domain['local-llm'] | default({}) }}"
        bao_apps_secrets: "{{ openbao_secrets_by_domain['apps'] | default({}) }}"
        bao_ai_public_secrets: "{{ openbao_secrets_by_domain['ai-public'] | default({}) }}"
        bao_ai_runner_secrets: "{{ openbao_secrets_by_domain['ai-runner'] | default({}) }}"
        # agent_guest reuses the ai-runner OpenBao domain: same queue token,
        # same guests, no new identity to provision for the successor role.
        bao_agent_guest_secrets: "{{ openbao_secrets_by_domain['ai-runner'] | default({}) }}"
        bao_hermes_secrets: "{{ openbao_secrets_by_domain['hermes'] | default({}) }}"
        # The whole map, so an identity-keyed consumer can select its OWN
        # domain by name (hermes_agent_bao, keyed on hermes_agent_id) instead
        # of needing a new binding line here per agent. Written from the
        # controller expression rather than the vars: entry below to keep the
        # set_fact free of a same-name self-reference.
        openbao_secrets_by_domain: >-
          {{ hostvars['localhost'].openbao_secrets_by_domain | default({}) }}
      vars:
        openbao_secrets_by_domain: "{{ hostvars['localhost'].openbao_secrets_by_domain | default({}) }}"
      no_log: true

# =============================================================================
# Phase 1: Qdrant Vector Database
# AI RAG vector database — Docker in LXC container
# =============================================================================

- name: Configure Qdrant vector database
  hosts: qdrant_group
  become: true
  gather_facts: false
  tags:
    - qdrant_docker
    - vectordb
    - ai
  vars:
    _vdb_ports: >-
      {{ hostvars['localhost']['tofu_data']['constants']['vector_db_ports'] }}
    qdrant_docker_http_port: "{{ _vdb_ports.qdrant_http }}"
    qdrant_docker_grpc_port: "{{ _vdb_ports.qdrant_grpc }}"
  roles:
    - role: qdrant_docker

# =============================================================================
# Phase 1b: Hindsight agent-memory service
# Two stateless API replicas (Docker in LXC) behind the Traefik pool at
# hindsight.<domain>; state lives in the ai-VLAN Postgres cluster. serial: 1
# keeps the converge rolling so the pool always has a healthy member. The role
# reads its own ports from tofu_data.constants.memory_ports and uses no host
# facts, so gather_facts stays off like qdrant.
# =============================================================================

- name: Configure Hindsight agent-memory service
  hosts: hindsight_group
  become: true
  gather_facts: false
  # Same rolling-pool contract as the llm_router play below; the role's own
  # /health check is this pool's per-member gate. serial: 1 was already here —
  # the gate import and max_fail_percentage make the unreachable-vs-unhealthy
  # split explicit, so a replica whose node is down no longer aborts the play.
  serial: 1
  max_fail_percentage: 0
  pre_tasks:
    - name: Gate on pool-member reachability
      ansible.builtin.import_tasks: tasks/pool_member_gate.yml
  tags:
    - hindsight_docker
    - memory
    - ai
  roles:
    - role: hindsight_docker

# =============================================================================
# Phase 2: Local LLM — Ollama inference (AMD ROCm) + Open WebUI chat
# Ollama serves models on the ai VLAN; Open WebUI is the chat front-end,
# fronted by Traefik at https://llm.<subdomain>. Ollama stays internal.
# =============================================================================

- name: Configure Ollama LLM inference (AMD ROCm)
  hosts: ollama_group
  become: true
  gather_facts: true
  tags:
    - ollama
    - llm
    - ai
  roles:
    - role: ollama

- name: Configure Open WebUI chat front-end
  hosts: open_webui_group
  become: true
  gather_facts: true
  tags:
    - open_webui
    - llm
    - ai
  roles:
    - role: open_webui

# =============================================================================
# Phase 3: Hermes Agent — the NousResearch autonomous agent (NOT the serving
# stack above). Headless `hermes gateway` daemon; brain = the fabric router;
# memory = Hindsight; HERMES_HOME on a persisted ZFS volume.
# =============================================================================

- name: Configure Hermes Agent (autonomous agent)
  hosts: hermes_agent_group
  become: true
  gather_facts: true
  tags:
    - hermes_agent
    - agent
    - ai
  roles:
    # codex_runner MUST run first — hermes_agent's config.yaml references its
    # sudo grant + resolved Codex binary path (the escalation MCP entry).
    - role: codex_runner
    - role: hermes_agent
    # Minutes-level MCP-fabric / LLM-front-door outage detection with Slack
    # transition alerts — runs here so probes traverse exactly Hermes' path.
    - role: fabric_watchdog

# =============================================================================
# Phase 4: LLM serving fabric — llama.cpp light tier + LiteLLM front door.
# llama.cpp + llama-swap (llm-fast) serves the co-resident light models;
# the LiteLLM proxy (llm-router x3) is the single OpenAI-compatible endpoint,
# fronted by Traefik at https://llm.<subdomain>, routing large vs light by alias.
# =============================================================================

- name: Configure llama.cpp light-tier serving (llama-swap, AMD ROCm)
  hosts: llm_fast_group
  become: true
  gather_facts: true
  tags:
    - llama_cpp
    - llm
    - ai
  roles:
    - role: llama_cpp

# Ordered BEFORE the router pool on purpose. This is the store the routers
# count spend in, so converging it second would leave the first router of a
# rolling pass pointed at a store that is not serving yet. A shared ceiling is
# only a ceiling once every member can reach the same counter.
- name: Configure the shared spend store for the router pool
  hosts: llm_redis_group
  become: true
  gather_facts: true
  tags:
    - llm_redis
    - llm
    - ai
  roles:
    - role: redis

- name: Configure the LiteLLM router (fabric front door)
  hosts: llm_router_group
  become: true
  gather_facts: true
  # Rolling pool converge. Restarting all three routers in the same play took
  # the whole front door down on 2026-07-24 (the watchdog recorded a down
  # transition across the converge) — the pool exists for redundancy and the
  # deploy path defeated it. serial: 1 restarts one member at a time, and the
  # role's own liveness check is the gate: it runs after flush_handlers, inside
  # this member's window, so the next member is not touched until this one is
  # serving again. max_fail_percentage: 0 stops the play on any failure rather
  # than marching on to break the rest.
  serial: 1
  max_fail_percentage: 0
  pre_tasks:
    - name: Gate on pool-member reachability
      ansible.builtin.import_tasks: tasks/pool_member_gate.yml
  tags:
    - llm_router
    - llm
    - ai
  roles:
    - role: llm_router

# =============================================================================
# Phase 5: LlamaIndex RAG Engine
# Embeddings via the fabric router — must converge AFTER the router play;
# its health check queries https://llm.<subdomain>/v1/models.
# =============================================================================

- name: Configure LlamaIndex RAG engine
  hosts: llamaindex_group
  become: true
  gather_facts: true
  tags:
    - llamaindex
    - rag
    - ai
  vars:
    _vdb_ports: >-
      {{ hostvars['localhost']['tofu_data']['constants']['vector_db_ports'] }}
    llamaindex_qdrant_host: "{{ hostvars['qdrant']['container_ip'] }}"
    llamaindex_qdrant_port: "{{ _vdb_ports.qdrant_http }}"
  roles:
    - role: llamaindex

# =============================================================================
# Phase 6: AI orchestration platforms + observability
# Visual builders (Dify, LangFlow) + a CrewAI/LangChain runtime on the ai
# VLAN; Langfuse LLM-observability on siem. Docker-in-LXC except agent-exec
# (plain Python venv). Each emits OpenTelemetry to the Cribl Edge OTLP
# endpoint (ai_orchestration_otel_endpoint).
# =============================================================================

- name: Configure Dify LLMOps platform
  hosts: dify_group
  become: true
  gather_facts: true
  tags:
    - dify_docker
    - ai-orchestration
  roles:
    - role: dify_docker

- name: Configure LangFlow visual prototyping
  hosts: langflow_group
  become: true
  gather_facts: true
  tags:
    - langflow_docker
    - ai-orchestration
  roles:
    - role: langflow_docker

- name: Configure LangGraph server + Agent Chat UI (zero-cloud)
  hosts: langgraph_group
  become: true
  gather_facts: true
  tags:
    - langgraph_docker
    - ai-orchestration
  roles:
    - role: langgraph_docker

- name: Configure agent-exec runtime (CrewAI + LangChain)
  hosts: agent_exec_group
  become: true
  gather_facts: true
  tags:
    - agent_exec
    - ai-orchestration
  roles:
    - role: agent_exec

- name: Configure Langfuse LLM observability
  hosts: langfuse_group
  become: true
  gather_facts: true
  tags:
    - langfuse_docker
    - observability
  roles:
    - role: langfuse_docker

- name: Configure agentgateway MCP/LLM/A2A data plane
  hosts: agentgateway_group
  become: true
  gather_facts: true
  tags:
    - agentgateway_docker
    - ai-orchestration
  roles:
    - role: agentgateway_docker

# =============================================================================
# Phase 7: Headless AI execution plane (WS7A) — AI job runners.
# Confined guests (tofu `ai-runner` + `ai-github` tags) that run the Claude
# Code / Codex CLIs in permission-skipping mode, driven by a systemd worker
# polling the Vikunja AI Jobs queue. Safety is the LXC/firewall boundary, not
# the agent — so this only ever converges guests behind a restrictive egress
# profile. bao_ai_runner_secrets comes from the Phase 0 pre-fetch play.
# =============================================================================

- name: Configure headless AI job runners
  hosts: ai_runner_group
  become: true
  gather_facts: true
  tags:
    - ai_runner
    - agent
    - ai
  roles:
    - role: ai_runner

# =============================================================================
# Phase 7a: Squid — the agent plane's egress chokepoint.
#
# This play MUST run BEFORE the pooled agent guests below: an `ai-proxied` guest
# has no direct WAN rule, so until this proxy is up it cannot reach an apt repo,
# the npm registry or GitHub, and agent_guest's very first toolchain task (an
# apt update) fails. The domain allowlist enforced here is the plane's whole
# egress boundary — the Proxmox firewall cannot filter by hostname.
# =============================================================================

- name: Configure the agent-plane egress proxy
  hosts: squid_group
  become: true
  gather_facts: true
  tags:
    - squid
    - agent
    - ai
  roles:
    - role: squid

# =============================================================================
# Phase 7b: Pooled autonomous agent guests (ai-runner-pool-NN, `ai-proxied`).
# agent_guest is ai_runner's successor: same Vikunja queue, but one job per
# systemd unit under `bao agent` supervision, three CLIs instead of two, the
# nix-ai autonomous config mirror, a clone/gitleaks/PR flow, and per-guest
# transcript shipping. The legacy ai_runner play above stays until this role
# carries load on the canary; removing it is a follow-up PR, not this one.
# =============================================================================

- name: Configure pooled autonomous agent guests
  hosts: ai_agent_pool_group
  become: true
  gather_facts: true
  tags:
    - agent_guest
    - agent
    - ai
  roles:
    - role: agent_guest

# Pool return lives in its OWN play, not inside the converge play above: play
# tags are inherited by every task, so a `never`-tagged include inside the
# converge play effectively carries `agent_guest` too — and `--tags
# agent_guest` then overrides `never` and wipes the guest at the end of every
# converge. Opt in explicitly:
#   ansible-playbook playbooks/site.yml --tags agent_guest_pool_return --limit <guest>,localhost
- name: Return pooled agent guests to the pool (drain, stop, de-credential, wipe)
  hosts: ai_agent_pool_group
  become: true
  gather_facts: false
  tags:
    - never
    - agent_guest_pool_return
  tasks:
    - name: Drain, stop, de-credential and wipe the guest
      ansible.builtin.include_role:
        name: agent_guest
        tasks_from: pool_return.yml
