---
# Play-level failure isolation: every independent guest play below wraps its
# role(s) in block/rescue, so one dead host can't abort the whole run (an
# ansible-core executor behavior — see playbooks/tasks/record_isolated_failure.yml
# for the root cause). The gate play at the end of this file still fails the
# run if any play recorded a failure.
#
# Import OpenTofu infrastructure data before running application playbooks.
# This populates the inventory dynamically from the published tofu inventory.
- name: Load OpenTofu infrastructure inventory
  import_playbook: ../inventory/load_tofu.yml

# =============================================================================
# Phase 0: OpenBao resource-domain secrets pre-fetch
# Reads each resource domain's KV subtree (its own least-privilege AppRole)
# into a `bao_<domain>_secrets` fact — local-llm for the LLM/RAG stack, apps
# for the Hindsight memory-service credentials (apps/hindsight) — so every
# consumer role can resolve its secrets bao-first with an env fallback. Runs
# once on the controller
# and publishes to every AI group; it SKIPS CLEANLY when BAO_ADDR or the
# domain's role_id/secret_id envs are unset.
#
# tags: always — the pre-fetch must precede ANY consumer role, so a scoped
# run (`--tags llm_router`) still gets its secrets without having to remember
# a `--tags openbao_secrets,llm_router` pairing (the trap the upstream apps
# repo still has). The fetch is a handful of controller-side API reads, so
# running it on every scoped converge is cheap.
# =============================================================================

- name: Pre-fetch resource-domain secrets from OpenBao
  hosts: >-
    qdrant_group:hindsight_group:llamaindex_group:ollama_group:open_webui_group:
    hermes_agent_group:hermes_ui_group:herdr_group:herdr_ui_group:
    llm_fast_group:llm_cpu_moe_group:llm_cpu_9b_group:llm_vllm_group:
    llm_router_group:llm_redis_group:
    dify_group:langflow_group:langgraph_group:agent_exec_group:
    langfuse_group:phoenix_group:agentgateway_group:ai_orchestration_group:ai_runner_group:
    ai_agent_pool_group
  gather_facts: false
  tags: always
  tasks:
    - name: Fetch each resource-domain's KV subtree via its own AppRole
      ansible.builtin.include_role:
        name: openbao_secrets

    # Publish the domain's shared, un-prefixed fact at the playbook layer
    # (like tofu_data in load_tofu.yml). openbao_secrets_by_domain was
    # computed once on the delegated controller; a domain that was skipped
    # (BAO_ADDR or its creds unset) is simply absent from the dict, so
    # `default({})` covers it the same as a host outside this play.
    - name: Publish each domain's merged secrets to every host in this play
      ansible.builtin.set_fact:
        bao_local_llm_secrets: "{{ openbao_secrets_by_domain['local-llm'] | default({}) }}"
        bao_apps_secrets: "{{ openbao_secrets_by_domain['apps'] | default({}) }}"
        bao_ai_public_secrets: "{{ openbao_secrets_by_domain['ai-public'] | default({}) }}"
        bao_ai_runner_secrets: "{{ openbao_secrets_by_domain['ai-runner'] | default({}) }}"
        # agent_guest reuses the ai-runner OpenBao domain: same queue token,
        # same guests, no new identity to provision for the successor role.
        bao_agent_guest_secrets: "{{ openbao_secrets_by_domain['ai-runner'] | default({}) }}"
        bao_hermes_secrets: "{{ openbao_secrets_by_domain['hermes'] | default({}) }}"
        # The whole map, so an identity-keyed consumer can select its OWN
        # domain by name (hermes_agent_bao, keyed on hermes_agent_id) instead
        # of needing a new binding line here per agent. Written from the
        # controller expression rather than the vars: entry below to keep the
        # set_fact free of a same-name self-reference.
        openbao_secrets_by_domain: >-
          {{ hostvars['localhost'].openbao_secrets_by_domain | default({}) }}
      vars:
        openbao_secrets_by_domain: "{{ hostvars['localhost'].openbao_secrets_by_domain | default({}) }}"
      no_log: true

# =============================================================================
# Phase 1: Qdrant Vector Database
# AI RAG vector database — Docker in LXC container
# =============================================================================

- name: Configure Qdrant vector database
  hosts: qdrant_group
  become: true
  gather_facts: false
  tags:
    - qdrant_docker
    - vectordb
    - ai
  vars:
    _vdb_ports: >-
      {{ hostvars['localhost']['tofu_data']['constants']['vector_db_ports'] }}
    qdrant_docker_http_port: "{{ _vdb_ports.qdrant_http }}"
    qdrant_docker_grpc_port: "{{ _vdb_ports.qdrant_grpc }}"
  tasks:
    - name: Converge qdrant_docker (isolated — failure does not abort downstream plays)
      block:
        - name: Include qdrant_docker role
          ansible.builtin.include_role:
            name: qdrant_docker
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: qdrant_docker

# =============================================================================
# Phase 1b: Hindsight agent-memory service
# Two stateless API replicas (Docker in LXC) behind the Traefik pool at
# hindsight.<domain>; state lives in the ai-VLAN Postgres cluster. serial: 1
# keeps the converge rolling so the pool always has a healthy member. The role
# reads its own ports from tofu_data.constants.memory_ports and uses no host
# facts, so gather_facts stays off like qdrant.
# =============================================================================

- name: Configure Hindsight agent-memory service
  hosts: hindsight_group
  become: true
  gather_facts: false
  # Same rolling-pool contract as the llm_router play below; the role's own
  # /health check is this pool's per-member gate. serial: 1 was already here —
  # the gate import and max_fail_percentage make the unreachable-vs-unhealthy
  # split explicit, so a replica whose node is down no longer aborts the play.
  serial: 1
  max_fail_percentage: 0
  pre_tasks:
    - name: Gate on pool-member reachability
      ansible.builtin.import_tasks: tasks/pool_member_gate.yml
    - name: Load the fabric model registry
      ansible.builtin.import_tasks: tasks/load_fabric_registry.yml
  tags:
    - hindsight_docker
    - memory
    - ai
  tasks:
    - name: Converge hindsight_docker (isolated — failure does not abort downstream plays)
      block:
        - name: Include hindsight_docker role
          ansible.builtin.include_role:
            name: hindsight_docker
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: hindsight_docker

