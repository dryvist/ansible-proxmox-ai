- name: Configure agentgateway MCP/LLM/A2A data plane
  hosts: agentgateway_group
  become: true
  gather_facts: false
  tags:
    - agentgateway_docker
    - ai-orchestration
  pre_tasks:
    # ai_callers (inventory/group_vars/all.yml) merges the registry facts this loads.
    - name: Load the harness caller registry
      ansible.builtin.import_tasks: tasks/load_agent_callers.yml
