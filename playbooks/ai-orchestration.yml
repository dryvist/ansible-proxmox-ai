---
# =============================================================================
# Phase 6: AI orchestration platforms + observability
# Visual builders (Dify, LangFlow) + a CrewAI/LangChain runtime on the ai
# VLAN; Langfuse LLM-observability on siem. Docker-in-LXC except agent-exec
# (plain Python venv). Each emits OpenTelemetry to the Cribl Stream OTLP
# endpoint (ai_orchestration_otel_endpoint).
# =============================================================================

- name: Configure Dify LLMOps platform
  hosts: dify_group
  become: true
  gather_facts: false
  tags:
    - dify_docker
    - ai-orchestration
  tasks:
    - name: Converge dify_docker (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include dify_docker role
          ansible.builtin.include_role:
            name: dify_docker
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: dify_docker

