---
# Legacy profile serving stays available until replacement engine guests are
# declared. The inventory loader excludes this group once those guests exist.
- name: Configure legacy GPU profile serving
  hosts: llm_gpu_legacy_group
  become: true
  gather_facts: false
  serial: 1
  tags:
    - llm_gpu_serving
    - llm
    - ai
  pre_tasks:
    - name: Require the legacy GPU serving host to be in nvidia_gpu_group
      ansible.builtin.assert:
        that:
          - inventory_hostname in groups.get('nvidia_gpu_group', [])
        fail_msg: >-
          {{ inventory_hostname }} is in a GPU serving group but not in
          nvidia_gpu_group. Tag the guest nvidia-gpu or remove it from the
          serving group.
        quiet: true
  tasks:
    - name: Converge llm_gpu_serving (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include llm_gpu_serving role
          ansible.builtin.include_role:
            name: llm_gpu_serving
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: llm_gpu_serving

- name: Configure the selected llama.cpp engine guest
  hosts: llm_gpu_serving_llama_cpp_group
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tags:
    - llm_gpu_serving
    - llamacpp_serving
    - llm
    - ai
  pre_tasks:
    - name: Require the llama.cpp GPU serving host to be in nvidia_gpu_group
      ansible.builtin.assert:
        that:
          - inventory_hostname in groups.get('nvidia_gpu_group', [])
        fail_msg: >-
          {{ inventory_hostname }} is in a GPU serving group but not in
          nvidia_gpu_group. Tag the guest nvidia-gpu or remove it from the
          serving group.
        quiet: true
  tasks:
    - name: Converge llamacpp_serving (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include llamacpp_serving role
          ansible.builtin.include_role:
            name: llamacpp_serving
      rescue:
        - name: Record isolated failure for the final run gate
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: llamacpp_serving
        - name: Mark the selected GPU engine convergence as failed
          ansible.builtin.set_fact:
            llm_gpu_engine_convergence_failed: true

- name: Configure the Laya classifier guest
  hosts: llm_classify
  become: true
  gather_facts: false
  serial: 1
  tags:
    - laya_systemone
    - llm
    - ai
  vars:
    laya_systemone_api_key: >-
      {{ (bao_local_llm_secrets | default({}, true)).get('laya_api_key',
         lookup('ansible.builtin.env', 'LLM_LAYA_API_KEY')) | default('', true) }}
  pre_tasks:
    - name: Require the classifier guest to be in nvidia_gpu_group
      ansible.builtin.assert:
        that:
          - inventory_hostname in groups.get('nvidia_gpu_group', [])
        fail_msg: >-
          {{ inventory_hostname }} is in llm_classify but not in
          nvidia_gpu_group. Tag the guest nvidia-gpu or remove it from
          llm_classify.
        quiet: true
  tasks:
    - name: Converge laya_systemone (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include laya_systemone role
          ansible.builtin.include_role:
            name: laya_systemone
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: laya_systemone

