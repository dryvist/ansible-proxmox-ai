---
# Legacy profile serving stays available until the replacement pair is
# declared. The inventory loader excludes this group once both engine guests
# exist, so the legacy engine-switching role never runs against either new
# guest.
- name: Configure legacy GPU profile serving
  hosts: llm_gpu_legacy_group:&nvidia_gpu_group
  become: true
  gather_facts: false
  serial: 1
  tags:
    - llm_gpu_serving
    - llm
    - ai
  tasks:
    - name: Converge llm_gpu_serving (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include llm_gpu_serving role
          ansible.builtin.include_role:
            name: llm_gpu_serving
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: llm_gpu_serving

- name: Configure the selected llama.cpp engine guest
  hosts: llm_gpu_serving_llama_cpp_group:&nvidia_gpu_group
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tags:
    - llamacpp_serving
    - llm
    - ai
  tasks:
    - name: Converge llamacpp_serving (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include llamacpp_serving role
          ansible.builtin.include_role:
            name: llamacpp_serving
      rescue:
        - name: Record isolated failure for the final run gate
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: llamacpp_serving
        - name: Mark the selected GPU engine convergence as failed
          ansible.builtin.set_fact:
            llm_gpu_engine_convergence_failed: true

- name: Configure the selected vLLM engine guest
  hosts: llm_gpu_serving_vllm_group:&nvidia_gpu_group
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tags:
    - vllm_serving
    - llm
    - ai
  tasks:
    - name: Converge vllm_serving (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: tasks/gather_facts.yml
        - name: Include vllm_serving role
          ansible.builtin.include_role:
            name: vllm_serving
      rescue:
        - name: Record isolated failure for the final run gate
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: vllm_serving
        - name: Mark the selected GPU engine convergence as failed
          ansible.builtin.set_fact:
            llm_gpu_engine_convergence_failed: true
