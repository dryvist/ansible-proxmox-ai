---
# Arize Phoenix — the second OTLP trace sink on the Cribl fan-out, a peer of
# Langfuse. Cribl Stream (ansible-proxmox-apps) forks in_otel to it; nothing
# in this repo emits to it directly. Imported by site.yml; kept in its own file
# so site.yml stays under its token budget (.token-limits.yaml).
- name: Configure Arize Phoenix LLM observability
  hosts: phoenix_group
  become: true
  gather_facts: true
  tags:
    - phoenix_docker
    - observability
  tasks:
    - name: Converge phoenix_docker (isolated — failure does not abort downstream plays)
      block:
        - name: Include phoenix_docker role
          ansible.builtin.include_role:
            name: phoenix_docker
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: phoenix_docker
