---
# Populate the dynamic host groups from the published OpenTofu inventory.
- name: Load OpenTofu infrastructure inventory
  ansible.builtin.import_playbook: ../inventory/load_tofu.yml

- name: Resolve and preflight one exact model revision on the controller
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_become: false
  tasks:
    - name: Read a queued model trial request
      ansible.builtin.include_vars:
        file: "{{ llm_model_trial_request_file }}"
        name: llm_model_trial_request
      when: llm_model_trial_request_file is defined

    - name: Bind the queued immutable model revision
      ansible.builtin.set_fact:
        hf_repo: "{{ llm_model_trial_request.hf_repo }}"
        revision: "{{ llm_model_trial_request.revision }}"
      when: llm_model_trial_request_file is defined

    - name: Require exactly one GPU trial host in the inventory
      ansible.builtin.assert:
        that:
          - groups['llm_gpu_group'] | default([]) | length == 1
        fail_msg: >-
          The trial is fixed to host 6000 and requires llm_gpu_group to resolve
          to exactly one inventory host.
        quiet: true

    - name: Run the controller-side Hugging Face preflight
      ansible.builtin.include_role:
        name: llm_model_trial
        tasks_from: preflight.yml

    - name: Require the queued quantization to match the validated trial plan
      ansible.builtin.assert:
        that:
          - llm_model_trial_request.accelerator | string == llm_model_trial_host | string
          - llm_model_trial_selected.quantization == llm_model_trial_request.quantization
          - llm_model_trial_selected.resolved_sha == llm_model_trial_request.revision
        quiet: true
      when: llm_model_trial_request_file is defined

- name: Serve one run-scoped candidate on the fixed 6000 GPU host
  hosts: llm_gpu_group
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Run the target-side model trial role
      ansible.builtin.include_role:
        name: llm_model_trial
        tasks_from: serve.yml
      tags:
        - llm_model_trial
