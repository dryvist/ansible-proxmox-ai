---
# CI Gate — wrapper around the shared ansible CI gate.
#
# ansible-lint and the standardized change filter live in
# JacobPEvans/.github/.github/workflows/_ansible-ci.yml so lint runs identically
# across ansible-proxmox, ansible-splunk and this repo.
#
# Molecule scenario selection and runner grouping stay here; the reusable
# workflow runs each selected group with the shared setup and test steps. The
# shared Ansible CI workflow runs lint only (molecule:false), while this wrapper
# keeps _data-contract.yml local and aggregates all results in its required
# "Merge Gate". Molecule selection uses the changes call's filters and skips
# when it marks a develop pull request tiny. Data-contract gates only on the
# contract-scope job's outputs, so it starts beside lint instead of after it.
# Installer-sha always runs.
#
# No e2e job: converges need live infrastructure; the data-contract job's
# inventory-load check covers the deploy-orchestration wiring in CI.

name: CI Gate

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  molecule-contract-filters:
    name: Load Molecule filters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scenario_filters: ${{ steps.load.outputs.scenario_filters }}
      contract_filters: ${{ steps.load.outputs.contract_filters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Load Molecule filter configuration
        id: load
        run: |
          scenario_delimiter="SCENARIO_FILTERS_$(openssl rand -hex 16)"
          {
            printf 'scenario_filters<<%s\n' "$scenario_delimiter"
            cat .github/filters/molecule-scenario-filters.yml
            printf '%s\n' "$scenario_delimiter"
          } >> "$GITHUB_OUTPUT"
          contract_delimiter="CONTRACT_FILTERS_$(openssl rand -hex 16)"
          {
            printf 'contract_filters<<%s\n' "$contract_delimiter"
            cat .github/filters/molecule-contract-filters.yml
            printf '%s\n' "$contract_delimiter"
          } >> "$GITHUB_OUTPUT"

  ci:
    needs: molecule-contract-filters
    permissions:
      contents: read
      pull-requests: read
    uses: JacobPEvans/.github/.github/workflows/_ansible-ci.yml@v1
    with:
      # Molecule is owned locally (see header); the shared workflow runs lint only.
      molecule: false
      molecule_scenario_filters: ${{ needs.molecule-contract-filters.outputs.scenario_filters }}
      molecule_contract_filters: ${{ needs.molecule-contract-filters.outputs.contract_filters }}

  changes:
    name: Detect Changes
    needs: molecule-contract-filters
    uses: JacobPEvans/.github/.github/workflows/_ansible-changes.yml@v1
    with:
      molecule: false
      molecule_scenario_filters: ${{ needs.molecule-contract-filters.outputs.scenario_filters }}
      molecule_contract_filters: ${{ needs.molecule-contract-filters.outputs.contract_filters }}

  # Data Contract runs the repo-wide contract suite. On develop PRs, select it
  # only for contract inputs; workflow-only edits still exercise the CI gate.
  contract-scope:
    name: Data Contract Scope
    runs-on: ubuntu-latest
    timeout-minutes: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository) && 60 || 10 }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full_suite: ${{ steps.select.outputs.full_suite }}
      pytest_targets: ${{ steps.select.outputs.pytest_targets }}
      ansible_tests: ${{ steps.select.outputs.ansible_tests }}
      llm_router_playbooks: ${{ steps.select.outputs.llm_router_playbooks }}
      run_inventory: ${{ steps.select.outputs.run_inventory }}
      run_selector_checks: ${{ steps.select.outputs.run_selector_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select focused contract checks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] ||
             [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/develop ]]; then
            echo 'full_suite=true' >> "$GITHUB_OUTPUT"
            python .github/scripts/select-contract-scope.py --full --output "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == pull_request && "$BASE_REF" == main ]]; then
            echo 'full_suite=true' >> "$GITHUB_OUTPUT"
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            if grep -qvE '(^docs/|\.md$)' "$RUNNER_TEMP/changed-paths"; then
              python .github/scripts/select-contract-scope.py --full --output "$GITHUB_OUTPUT"
            else
              python .github/scripts/select-contract-scope.py --full --skip-router --output "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo 'full_suite=false' >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == push ]]; then
            BASE_SHA="$PUSH_BEFORE"
            HEAD_SHA="$PUSH_HEAD"
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
          python .github/scripts/select-contract-scope.py \
            --paths-file "$RUNNER_TEMP/changed-paths" \
            --output "$GITHUB_OUTPUT"
      - name: Report the selected contract scope
        if: ${{ always() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          SELECT_RESULT: ${{ steps.select.outcome }}
        run: |
          if [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] ||
             [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/develop ]] ||
             [[ "$EVENT_NAME" == pull_request && "$BASE_REF" == main ]]; then
            selection=full
          elif [[ "$SELECT_RESULT" != success ]]; then
            selection=failed-unmapped
          else
            selection=focused
          fi
          printf 'Data Contract selection: %s\n' "$selection" >> "$GITHUB_STEP_SUMMARY"

  # Pushes to main and develop run the full contract suite and skip Molecule.
  # Pull requests run the focused selection unless the full suite is selected.
  data-contract:
    name: Data Contract
    needs: contract-scope
    if: >-
      always() &&
      needs.contract-scope.result == 'success' &&
      (
        needs.contract-scope.outputs.full_suite == 'true' ||
        (
          github.event_name != 'push' &&
          (
            needs.contract-scope.outputs.pytest_targets != '[]' ||
            needs.contract-scope.outputs.ansible_tests != '[]' ||
            needs.contract-scope.outputs.llm_router_playbooks != '[]' ||
            needs.contract-scope.outputs.run_inventory == 'true' ||
            needs.contract-scope.outputs.run_selector_checks == 'true'
          )
        )
      )
    uses: ./.github/workflows/_data-contract.yml
    with:
      full_suite: ${{ needs.contract-scope.outputs.full_suite == 'true' }}
      pytest_targets: ${{ needs.contract-scope.outputs.pytest_targets }}
      ansible_tests: ${{ needs.contract-scope.outputs.ansible_tests }}
      llm_router_playbooks: ${{ needs.contract-scope.outputs.llm_router_playbooks }}
      run_inventory: ${{ needs.contract-scope.outputs.run_inventory == 'true' }}
      run_selector_checks: ${{ needs.contract-scope.outputs.run_selector_checks == 'true' }}
      # 15: other data-contract jobs fit; router-contract raises its own timeout to 30.
      timeout_minutes: >-
        ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository) && 60 || 15 }}

  molecule-select:
    name: Select Molecule runner groups
    needs: changes
    if: >-
      needs.changes.outputs.tiny != 'true' &&
      github.event_name == 'pull_request' &&
      (
        github.event.pull_request.base.ref == 'main' ||
        needs.changes.outputs.molecule == 'true'
      ) &&
      (
        github.event.pull_request.base.ref == 'main' ||
        needs.changes.outputs.molecule_scenarios != '[]'
      )
    uses: ./.github/workflows/_molecule-select.yml
    with:
      scenarios: ${{ needs.changes.outputs.molecule_scenarios }}
      full_suite: ${{ github.event.pull_request.base.ref == 'main' }}

  molecule-hosted:
    name: Molecule on ubuntu-latest
    needs: molecule-select
    if: ${{ needs.molecule-select.outputs.hosted_scenarios != '[]' }}
    uses: JacobPEvans/.github/.github/workflows/_molecule.yml@v1
    with:
      scenario_require_molecule_yml: true
      pull_request_discover_timeout_minutes: >-
        ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository) && 60 || 15 }}
      galaxy_cache_prefix: ansible-galaxy-
      galaxy_force_install: true
      galaxy_retry_attempts: 4
      galaxy_step_timeout_minutes: 10
      galaxy_refresh_contracts_v5: on_cache_hit
      docker_timeout_seconds: 180
      doppler_enabled: true
      scenarios: ${{ needs.molecule-select.outputs.hosted_scenarios }}
      runner_label: ubuntu-latest
      pull_request_timeout_minutes: >-
        ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository) && 60 || 15 }}
      test_secret_env_map: >-
        ${{ (contains(needs.molecule-select.outputs.hosted_scenarios, '"qdrant"') ||
        contains(needs.molecule-select.outputs.hosted_scenarios, '"llamaindex"')) &&
        '{"QDRANT_API_KEY":"QDRANT_API_KEY"}' || '{}' }}
      nix_scenarios: '["agent_guest"]'
    secrets: inherit

  molecule-hermes-ui:
    name: Molecule hermes_ui runner
    needs: molecule-select
    if: ${{ needs.molecule-select.outputs.hermes_ui_scenarios != '[]' }}
    uses: JacobPEvans/.github/.github/workflows/_molecule.yml@v1
    with:
      scenario_require_molecule_yml: true
      pull_request_discover_timeout_minutes: >-
        ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository) && 60 || 15 }}
      galaxy_cache_prefix: ansible-galaxy-
      galaxy_force_install: true
      galaxy_retry_attempts: 4
      galaxy_step_timeout_minutes: 10
      galaxy_refresh_contracts_v5: on_cache_hit
      docker_timeout_seconds: 180
      doppler_enabled: true
      scenarios: ${{ needs.molecule-select.outputs.hermes_ui_scenarios }}
      runner_label: >-
        ${{ github.event.pull_request.head.repo.full_name == github.repository &&
        format('runs-on={0}/cpu=16/ram=32/family=m7+c7/extras=s3-cache/volume=80gb', github.run_id) ||
        'ubuntu-latest' }}
      pull_request_timeout_minutes: >-
        ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository) && 60 || 25 }}
      test_secret_env_map: '{}'
    secrets: inherit

  # Deliberately UNCONDITIONAL — no `needs: ci`, no change filter. A version
  # pin and its checksum are two lines that must move together, and the whole
  # point of the gate is to catch the case where only one of them did. Gating
  # it on a path filter would mean a mismatch reaching main whenever the filter
  # judged the change irrelevant, which is exactly the judgement that cannot be
  # trusted here. It is one curl per pin, so running it always costs nothing.
  installer-sha:
    name: Installer checksums
    runs-on: ubuntu-latest
    timeout-minutes: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository) && 60 || 10 }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify each pinned version matches its checksum
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/check-installer-sha.sh

  gate:
    name: Merge Gate
    needs:
      - ci
      - changes
      - molecule-contract-filters
      - contract-scope
      - data-contract
      - molecule-select
      - molecule-hosted
      - molecule-hermes-ui
      - installer-sha
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 10 }}
    steps:
      - name: Set up Node for the shared result aggregator
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check out the shared result aggregator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github
          ref: 1ee6eaa788a7d713019c71493cd2a03b9021dc2a
          path: .gh-shared
          sparse-checkout: scripts/ci-gate-aggregate.mts
          sparse-checkout-cone-mode: false

      - name: Check all results
        env:
          CI_GATE_JOBS: ${{ toJSON(needs) }}
          CI_GATE_ALLOWED_SKIPS: >-
            ${{ ((github.event_name == 'pull_request' &&
            github.event.pull_request.base.ref != 'main') ||
            github.event_name == 'push') &&
            'data-contract, molecule-select, molecule-hosted, molecule-hermes-ui' || '' }}
        run: node .gh-shared/scripts/ci-gate-aggregate.mts
