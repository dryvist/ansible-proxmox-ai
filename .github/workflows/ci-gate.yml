---
# CI Gate — wrapper around the shared ansible CI gate.
#
# ansible-lint and the standardized change filter live in
# dryvist/.github/.github/workflows/_ansible-ci.yml so lint runs identically
# across ansible-proxmox, ansible-splunk and this repo.
#
# Molecule stays LOCAL here: this repo's molecule job has a deliberate
# least-privilege Doppler handling (it maps only the secret the scenarios
# consume into the test step, never inject-env-vars). Routing it through the
# shared molecule (which uses inject-env-vars) would regress that. So the
# shared workflow runs lint only (molecule:false) and this wrapper keeps
# _molecule.yml and _data-contract.yml local, aggregating everything in its
# own required "Merge Gate". The molecule job gates on the shared workflow's
# exported filter outputs (one change-detection definition), data-contract gates
# on the contract-scope job's outputs, and installer-sha always runs.
#
# No e2e job: converges need live infrastructure; the data-contract job's
# inventory-load check covers the deploy-orchestration wiring in CI.

name: CI Gate

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: dryvist/.github/.github/workflows/_ansible-ci.yml@c4501ea67ce4469a5cc95216c9a989516da2adb8 # v1
    with:
      # Molecule is owned locally (see header); the shared workflow runs lint only.
      molecule: false
      # Which scenarios a change touches. The shared workflow turns this into
      # its `molecule_scenarios` output, which the local molecule job below
      # consumes — one change-detection definition, same as the filter outputs.
      #
      # Each entry lists the scenario's transitive role closure plus its own
      # directory. Changes to shared workflow inputs widen centrally.
      molecule_scenario_filters: |
        agent_guest:
          - 'roles/agent_guest/**'
          - 'roles/ai_runner/**'
          - 'roles/squid/**'
          - 'molecule/agent_guest/**'
        ai_runner:
          - 'roles/ai_runner/**'
          - 'molecule/ai_runner/**'
        herdr_remote:
          - 'roles/herdr_remote/**'
          - 'roles/nixos_deploy/**'
          - 'roles/herdr_server/**'
          - 'molecule/herdr_remote/**'
        herdr_server:
          - 'roles/herdr_server/**'
          - 'roles/nixos_deploy/**'
          - 'molecule/herdr_server/**'
        hermes_ui:
          - 'roles/hermes_ui_docker/**'
          - 'roles/docker_engine/**'
          - 'roles/openbao_secrets/**'
          - 'molecule/hermes_ui/**'
        hindsight:
          - 'roles/hindsight_docker/**'
          - 'roles/docker_engine/**'
          - 'roles/openbao_secrets/**'
          - 'molecule/hindsight/**'
          - 'tests/hindsight_docker/**'
        llama_cpp_backend:
          - 'roles/llama_cpp/**'
          - 'roles/llamacpp_release/**'
          - 'molecule/llama_cpp_backend/**'
        llm_gpu_serving:
          - 'roles/llm_gpu_serving/**'
          - 'roles/llamacpp_release/**'
          - 'roles/nvidia_gpu_guest/**'
          - 'molecule/llm_gpu_serving/**'
          - '.github/workflows/ci-gate.yml'
          - 'tests/nvidia_gpu_guest/**'
        llamaindex:
          - 'roles/llamaindex/**'
          - 'roles/ollama/**'
          - 'molecule/llamaindex/**'
        nixos_deploy:
          - 'roles/nixos_deploy/**'
          - 'molecule/nixos_deploy/**'
        qdrant:
          - 'roles/docker_engine/**'
          - 'roles/qdrant_docker/**'
          - 'molecule/qdrant/**'
      # These paths have contract coverage in the Data Contract workflow
      # above. The shared selector narrows only when every changed Ansible
      # path matches; unlisted paths still select the full Molecule matrix.
      molecule_contract_filters: |
        contract_only:
          - 'llm-models.d/**'
          - 'roles/llm_router/**'
          - 'roles/hermes_agent/**'
          - 'tests/llm_router/**'
          - 'tests/hermes_agent/**'
          - 'tests/fixtures/llm-router-target-output.yml'
          - 'tests/llm_model_campaign/**'
          - 'tests/test_contract_scope_selector.py'
          - 'tests/test_contract_scope_mapping.py'
          - 'tests/test_ci_workflow_policy.py'
          - 'tests/test_ci_gate_dispatch.py'
          - 'roles/fabric_watchdog/**'
          - 'roles/dify_docker/**'
          - 'roles/langflow_docker/**'
          - 'roles/clickhouse_docker/**'
          - 'roles/langfuse_docker/**'
          - 'roles/llamacpp_serving/**'
          - 'roles/vllm_serving/**'
          - 'roles/nvidia_gpu_guest/**'
          - 'tests/agent_concurrency/**'
          - 'tests/dify_docker/**'
          - 'tests/langfuse_docker/**'
          - 'tests/llamacpp_release/**'
          - 'tests/llamacpp_serving/**'
          - 'tests/vllm_serving/**'
          - 'tests/nvidia_gpu_guest/**'
          - 'tests/llm_gpu_engine_roles/**'
          - 'tests/llm_gpu_legacy/**'
          - 'tests/llm_gpu_serving/**'
          - 'tests/openbao_secrets/**'
          - 'tests/inventory_load/**'
          - 'tests/repo_guards/**'
          - 'playbooks/llm-model-campaign-target.yml'
          - 'playbooks/tasks/llm-model-campaign-convert.yml'
          - 'playbooks/templates/llm-model-campaign-dimensions.json.j2'

  # Data Contract runs the repo-wide contract suite. On develop PRs, select it
  # only for contract inputs; workflow-only edits still exercise the CI gate.
  contract-scope:
    name: Data Contract Scope
    runs-on: ubuntu-latest
    timeout-minutes: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository) && 60 || 10 }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full_suite: ${{ steps.select.outputs.full_suite }}
      pytest_targets: ${{ steps.select.outputs.pytest_targets }}
      ansible_tests: ${{ steps.select.outputs.ansible_tests }}
      llm_router_playbooks: ${{ steps.select.outputs.llm_router_playbooks }}
      run_inventory: ${{ steps.select.outputs.run_inventory }}
      run_selector_checks: ${{ steps.select.outputs.run_selector_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select focused contract checks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] ||
             [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/develop ]] ||
             [[ "$EVENT_NAME" == pull_request && "$BASE_REF" == main ]]; then
            echo 'full_suite=true' >> "$GITHUB_OUTPUT"
            python .github/scripts/select-contract-scope.py --full --output "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'full_suite=false' >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == push ]]; then
            BASE_SHA="$PUSH_BEFORE"
            HEAD_SHA="$PUSH_HEAD"
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
          python .github/scripts/select-contract-scope.py \
            --paths-file "$RUNNER_TEMP/changed-paths" \
            --output "$GITHUB_OUTPUT"
      - name: Report the selected contract scope
        if: ${{ always() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          SELECT_RESULT: ${{ steps.select.outcome }}
        run: |
          if [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] ||
             [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/develop ]] ||
             [[ "$EVENT_NAME" == pull_request && "$BASE_REF" == main ]]; then
            selection=full
          elif [[ "$SELECT_RESULT" != success ]]; then
            selection=failed-unmapped
          else
            selection=focused
          fi
          printf 'Data Contract selection: %s\n' "$selection" >> "$GITHUB_STEP_SUMMARY"

  # Pushes to main and develop run the full contract suite and skip Molecule.
  # Pull requests run the focused selection unless the full suite is selected.
  data-contract:
    name: Data Contract
    needs: contract-scope
    if: >-
      always() &&
      needs.contract-scope.result == 'success' &&
      (
        needs.contract-scope.outputs.full_suite == 'true' ||
        (
          github.event_name != 'push' &&
          (
            needs.contract-scope.outputs.pytest_targets != '[]' ||
            needs.contract-scope.outputs.ansible_tests != '[]' ||
            needs.contract-scope.outputs.llm_router_playbooks != '[]' ||
            needs.contract-scope.outputs.run_inventory == 'true' ||
            needs.contract-scope.outputs.run_selector_checks == 'true'
          )
        )
      )
    uses: ./.github/workflows/_data-contract.yml
    with:
      full_suite: ${{ needs.contract-scope.outputs.full_suite == 'true' }}
      pytest_targets: ${{ needs.contract-scope.outputs.pytest_targets }}
      ansible_tests: ${{ needs.contract-scope.outputs.ansible_tests }}
      llm_router_playbooks: ${{ needs.contract-scope.outputs.llm_router_playbooks }}
      run_inventory: ${{ needs.contract-scope.outputs.run_inventory == 'true' }}
      run_selector_checks: ${{ needs.contract-scope.outputs.run_selector_checks == 'true' }}
      timeout_minutes: >-
        ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository) && 60 || 10 }}

  molecule:
    name: Molecule
    needs: ci
    if: >-
      github.event_name == 'pull_request' &&
      (
        github.event.pull_request.base.ref == 'main' ||
        needs.ci.outputs.molecule == 'true'
      ) &&
      (
        github.event.pull_request.base.ref == 'main' ||
        needs.ci.outputs.molecule_scenarios != '[]'
      )
    uses: ./.github/workflows/_molecule.yml
    with:
      scenarios: ${{ needs.ci.outputs.molecule_scenarios }}
      full_suite: ${{ github.event.pull_request.base.ref == 'main' }}
      timeout_minutes: >-
        ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository) && 60 || 10 }}
    secrets: inherit

  # Deliberately UNCONDITIONAL — no `needs: ci`, no change filter. A version
  # pin and its checksum are two lines that must move together, and the whole
  # point of the gate is to catch the case where only one of them did. Gating
  # it on a path filter would mean a mismatch reaching main whenever the filter
  # judged the change irrelevant, which is exactly the judgement that cannot be
  # trusted here. It is one curl per pin, so running it always costs nothing.
  installer-sha:
    name: Installer checksums
    runs-on: ubuntu-latest
    timeout-minutes: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository) && 60 || 10 }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify each pinned version matches its checksum
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/check-installer-sha.sh

  gate:
    name: Merge Gate
    needs: [ci, contract-scope, data-contract, molecule, installer-sha]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository) && 60 || 10 }}
    steps:
      - name: Set up Node for the shared result aggregator
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Check out the shared result aggregator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/.github
          ref: 1ee6eaa788a7d713019c71493cd2a03b9021dc2a
          path: .gh-shared
          sparse-checkout: scripts/ci-gate-aggregate.mts
          sparse-checkout-cone-mode: false

      - name: Check all results
        env:
          CI_GATE_JOBS: ${{ toJSON(needs) }}
          CI_GATE_ALLOWED_SKIPS: >-
            ${{ ((github.event_name == 'pull_request' &&
            github.event.pull_request.base.ref != 'main') ||
            github.event_name == 'push') &&
            'data-contract, molecule' || '' }}
        run: node .gh-shared/scripts/ci-gate-aggregate.mts
