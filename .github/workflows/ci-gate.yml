---
# Local scenario selection splits calls to the shared Molecule workflow.
# Shared Ansible CI runs lint; Merge Gate aggregates all required results.
# Data Contract uses the contract-scope job's selection outputs.

name: CI Gate

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: JacobPEvans/.github/.github/workflows/_ansible-ci.yml@v1
    with:
      # Shared Ansible CI runs lint only.
      molecule: false
      # Filter each scenario by its role closure and directory.
      molecule_scenario_filters: &molecule_scenario_filters |
        agent_guest:
          - 'roles/agent_guest/**'
          - 'roles/ai_runner/**'
          - 'roles/squid/**'
          - 'molecule/agent_guest/**'
        ai_runner:
          - 'roles/ai_runner/**'
          - 'molecule/ai_runner/**'
        herdr_remote:
          - 'roles/herdr_remote/**'
          - 'roles/nixos_deploy/**'
          - 'roles/herdr_server/**'
          - 'molecule/herdr_remote/**'
        herdr_server:
          - 'roles/herdr_server/**'
          - 'roles/nixos_deploy/**'
          - 'molecule/herdr_server/**'
        hermes_ui:
          - 'roles/hermes_ui_docker/**'
          - 'roles/docker_engine/**'
          - 'roles/openbao_secrets/**'
          - 'molecule/hermes_ui/**'
          - '.github/workflows/ci-gate.yml'
          - '.github/workflows/_molecule-select.yml'
        hindsight:
          - 'roles/hindsight_docker/**'
          - 'roles/docker_engine/**'
          - 'roles/openbao_secrets/**'
          - 'molecule/hindsight/**'
          - 'tests/hindsight_docker/**'
        llama_cpp_backend:
          - 'roles/llama_cpp/**'
          - 'roles/llamacpp_release/**'
          - 'molecule/llama_cpp_backend/**'
          - 'tests/llama_cpp/**'
        llm_gpu_serving:
          - 'roles/llm_gpu_serving/**'
          - 'roles/llamacpp_serving/**'
          - 'roles/llamacpp_release/**'
          - 'roles/nvidia_gpu_guest/**'
          - 'molecule/llm_gpu_serving/**'
          - '.github/workflows/ci-gate.yml'
          - '.github/workflows/_molecule-select.yml'
          - 'tests/nvidia_gpu_guest/**'
        llamaindex:
          - 'roles/llamaindex/**'
          - 'roles/ollama/**'
          - 'molecule/llamaindex/**'
        nixos_deploy:
          - 'roles/nixos_deploy/**'
          - 'molecule/nixos_deploy/**'
        qdrant:
          - 'roles/docker_engine/**'
          - 'roles/qdrant_docker/**'
          - 'molecule/qdrant/**'
      # Contract-only paths run through the focused Data Contract job.
      molecule_contract_filters: &molecule_contract_filters |
        contract_only:
          - 'llm-models.d/**'
          - 'roles/llm_model_trial/**'
          - 'roles/llm_router/**'
          - 'roles/hermes_agent/**'
          - 'tests/llm_router/**'
          - 'tests/hermes_agent/**'
          - 'tests/fixtures/llm-router-target-output.yml'
          - 'tests/llm_model_campaign/**'
          - 'tests/llm_model_trial/**'
          - 'tests/test_contract_scope_selector.py'
          - 'tests/test_contract_scope_mapping.py'
          - 'tests/test_ci_workflow_policy.py'
          - 'tests/test_ci_gate_dispatch.py'
          - 'roles/fabric_watchdog/**'
          - 'roles/dify_docker/**'
          - 'roles/langflow_docker/**'
          - 'roles/clickhouse_docker/**'
          - 'roles/langfuse_docker/**'
          - 'roles/llamacpp_serving/**'
          - 'roles/vllm_serving/**'
          - 'roles/strata_serving/**'
          - 'roles/nvidia_gpu_guest/**'
          - 'tests/agent_concurrency/**'
          - 'tests/dify_docker/**'
          - 'tests/langfuse_docker/**'
          - 'tests/llamacpp_release/**'
          - 'tests/llamacpp_serving/**'
          - 'tests/vllm_serving/**'
          - 'tests/nvidia_gpu_guest/**'
          - 'tests/llm_gpu_engine_roles/**'
          - 'tests/llm_gpu_legacy/**'
          - 'tests/llm_gpu_serving/**'
          - 'tests/openbao_secrets/**'
          - 'tests/inventory_load/**'
          - 'tests/repo_guards/**'
          - 'tests/benchmark_run/**'
          - 'playbooks/llm-model-campaign-target.yml'
          - 'playbooks/tasks/llm-model-campaign-convert.yml'
          - 'playbooks/templates/llm-model-campaign-dimensions.json.j2'
          - 'playbooks/benchmark-run.yml'
          - 'playbooks/tasks/benchmark-run/**'

  changes:
    name: Detect Changes
    uses: JacobPEvans/.github/.github/workflows/_ansible-changes.yml@v1
    with:
      molecule: false
      molecule_scenario_filters: *molecule_scenario_filters
      molecule_contract_filters: *molecule_contract_filters

  # Run Data Contract on contract inputs; CI workflow edits still exercise the gate.
  contract-scope:
    name: Data Contract Scope
    runs-on: ubuntu-latest
    timeout-minutes: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository) && 60 || 10 }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full_suite: ${{ steps.select.outputs.full_suite }}
      pytest_targets: ${{ steps.select.outputs.pytest_targets }}
      ansible_tests: ${{ steps.select.outputs.ansible_tests }}
      llm_router_playbooks: ${{ steps.select.outputs.llm_router_playbooks }}
      run_inventory: ${{ steps.select.outputs.run_inventory }}
      run_selector_checks: ${{ steps.select.outputs.run_selector_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select focused contract checks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] ||
             [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/develop ]]; then
            echo 'full_suite=true' >> "$GITHUB_OUTPUT"
            python .github/scripts/select-contract-scope.py --full --output "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == pull_request && "$BASE_REF" == main ]]; then
            echo 'full_suite=true' >> "$GITHUB_OUTPUT"
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            if grep -qvE '(^docs/|\.md$)' "$RUNNER_TEMP/changed-paths"; then
              python .github/scripts/select-contract-scope.py --full --output "$GITHUB_OUTPUT"
            else
              python .github/scripts/select-contract-scope.py --full --skip-router --output "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo 'full_suite=false' >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == push ]]; then
            BASE_SHA="$PUSH_BEFORE"
            HEAD_SHA="$PUSH_HEAD"
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
          python .github/scripts/select-contract-scope.py \
            --paths-file "$RUNNER_TEMP/changed-paths" \
            --output "$GITHUB_OUTPUT"
      - name: Report the selected contract scope
        if: ${{ always() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          SELECT_RESULT: ${{ steps.select.outcome }}
        run: |
          if [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] ||
             [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/develop ]] ||
             [[ "$EVENT_NAME" == pull_request && "$BASE_REF" == main ]]; then
            selection=full
          elif [[ "$SELECT_RESULT" != success ]]; then
            selection=failed-unmapped
          else
            selection=focused
          fi
          printf 'Data Contract selection: %s\n' "$selection" >> "$GITHUB_STEP_SUMMARY"

  # Pushes run full contract validation; pull requests use focused selection.
  data-contract:
    name: Data Contract
    needs: contract-scope
    if: >-
      always() &&
      needs.contract-scope.result == 'success' &&
      (
        needs.contract-scope.outputs.full_suite == 'true' ||
        (
          github.event_name != 'push' &&
          (
            needs.contract-scope.outputs.pytest_targets != '[]' ||
            needs.contract-scope.outputs.ansible_tests != '[]' ||
            needs.contract-scope.outputs.llm_router_playbooks != '[]' ||
            needs.contract-scope.outputs.run_inventory == 'true' ||
            needs.contract-scope.outputs.run_selector_checks == 'true'
          )
        )
      )
    uses: ./.github/workflows/_data-contract.yml
    with:
      full_suite: ${{ needs.contract-scope.outputs.full_suite == 'true' }}
      pytest_targets: ${{ needs.contract-scope.outputs.pytest_targets }}
      ansible_tests: ${{ needs.contract-scope.outputs.ansible_tests }}
      llm_router_playbooks: ${{ needs.contract-scope.outputs.llm_router_playbooks }}
      run_inventory: ${{ needs.contract-scope.outputs.run_inventory == 'true' }}
      run_selector_checks: ${{ needs.contract-scope.outputs.run_selector_checks == 'true' }}
      # 15: other data-contract jobs fit; router-contract raises its own timeout to 30.
      timeout_minutes: >-
        ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository) && 60 || 15 }}

  # Lane alias names are exported and checked by a local reusable workflow.
  lane-alias-parity:
    name: Lane alias parity
    uses: ./.github/workflows/_lane-alias-parity.yml

  molecule-select:
    name: Select Molecule runner groups
    needs: changes
    if: >-
      needs.changes.outputs.tiny != 'true' &&
      github.event_name == 'pull_request' &&
      (
        github.event.pull_request.base.ref == 'main' ||
        needs.changes.outputs.molecule == 'true'
      ) &&
      (
        github.event.pull_request.base.ref == 'main' ||
        needs.changes.outputs.molecule_scenarios != '[]'
      )
    uses: ./.github/workflows/_molecule-select.yml
    with:
      scenarios: ${{ needs.changes.outputs.molecule_scenarios }}
      full_suite: ${{ github.event.pull_request.base.ref == 'main' }}

  molecule-hosted:
    name: Molecule on ubuntu-latest
    needs: molecule-select
    if: ${{ needs.molecule-select.outputs.hosted_scenarios != '[]' }}
    uses: JacobPEvans/.github/.github/workflows/_molecule.yml@v1
    with:
      scenario_require_molecule_yml: true
      molecule_roles_path: roles
      pull_request_discover_timeout_minutes: &molecule_pr_discover_timeout >-
        ${{ (github.base_ref == 'main' && github.head_ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository) && 60 || 15 }}
      galaxy_retry_attempts: 4
      galaxy_step_timeout_minutes: 10
      galaxy_refresh_contracts_v5: on_cache_hit
      docker_timeout_seconds: 180
      doppler_enabled: true
      scenarios: ${{ needs.molecule-select.outputs.hosted_scenarios }}
      runner_label: ubuntu-latest
      pull_request_timeout_minutes: *molecule_pr_discover_timeout
      nix_scenarios: '["agent_guest"]'
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  molecule-hermes-ui:
    name: Molecule hermes_ui runner
    needs: molecule-select
    if: ${{ needs.molecule-select.outputs.hermes_ui_scenarios != '[]' }}
    uses: JacobPEvans/.github/.github/workflows/_molecule.yml@v1
    with:
      scenario_require_molecule_yml: true
      molecule_roles_path: roles
      pull_request_discover_timeout_minutes: *molecule_pr_discover_timeout
      galaxy_retry_attempts: 4
      galaxy_step_timeout_minutes: 10
      galaxy_refresh_contracts_v5: on_cache_hit
      docker_timeout_seconds: 180
      doppler_enabled: true
      scenarios: ${{ needs.molecule-select.outputs.hermes_ui_scenarios }}
      runner_label: >-
        ${{ github.event.pull_request.head.repo.full_name == github.repository &&
        format('runs-on={0}/cpu=16/ram=32/family=m7+c7/extras=s3-cache/volume=80gb', github.run_id) ||
        'ubuntu-latest' }}
      pull_request_timeout_minutes: >-
        ${{ (github.base_ref == 'main' && github.head_ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository) && 60 || 25 }}
      test_secret_env_map: '{}'
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  # Always verify installer pin and checksum pairs, regardless of changed paths.
  installer-sha:
    name: Installer checksums
    runs-on: ubuntu-latest
    timeout-minutes: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository) && 60 || 10 }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify each pinned version matches its checksum
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/check-installer-sha.sh

  gate:
    name: Merge Gate
    needs:
      - ci
      - changes
      - contract-scope
      - data-contract
      - lane-alias-parity
      - molecule-select
      - molecule-hosted
      - molecule-hermes-ui
      - installer-sha
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 10 }}
    steps:
      - name: Set up Node for the shared result aggregator
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check out the shared result aggregator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JacobPEvans/.github
          ref: 1ee6eaa788a7d713019c71493cd2a03b9021dc2a
          path: .gh-shared
          sparse-checkout: scripts/ci-gate-aggregate.mts
          sparse-checkout-cone-mode: false

      - name: Check all results
        env:
          CI_GATE_JOBS: ${{ toJSON(needs) }}
          CI_GATE_ALLOWED_SKIPS: >-
            ${{ ((github.event_name == 'pull_request' &&
            github.event.pull_request.base.ref != 'main') ||
            github.event_name == 'push') &&
            'data-contract, molecule-select, molecule-hosted, molecule-hermes-ui' || '' }}
        run: node .gh-shared/scripts/ci-gate-aggregate.mts
