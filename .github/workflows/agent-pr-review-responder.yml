---
name: Local PR Review Responder

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  respond:
    if: vars.AI_AGENT_PR_REVIEW_ENABLED == 'true'
    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: write
    uses: dryvist/ai-workflows/.github/workflows/cc-pr-review-responder.yml@main
    with:
      runner_label: review
      repo_context: Ansible roles and local AI service configuration.
      daily_run_limit: "5"
      local_only: true
      local_model: review-local
      dry_run: ${{ vars.AI_AGENT_PR_REVIEW_DRY_RUN != 'false' }}
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
