---
name: Local CI Failure Agent

on:
  workflow_run:
    workflows: ["CI Gate"]
    types: [completed]

permissions: {}

jobs:
  ci-fix:
    if: vars.AI_AGENT_CI_FIX_ENABLED == 'true' && github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: dryvist/ai-workflows/.github/workflows/cc-ci-fix.yml@aa4ed4a4bca92a3094bf4432689ddc5d84b98649 # v0.48.3
    with:
      runner_label: review
      repo_context: Ansible roles and local AI service configuration.
      ci_structure: CI Gate checks repository policy, rendering contracts, and tests.
      daily_run_limit: "5"
      local_only: true
      local_model: review-local
      dry_run: ${{ vars.AI_AGENT_CI_FIX_DRY_RUN != 'false' }}
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
