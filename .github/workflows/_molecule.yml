---
name: Molecule

on:
  workflow_call:
    inputs:
      scenarios:
        description: >-
          JSON array of the scenarios this change touched, from the shared
          ansible CI's `molecule_scenarios` output. An empty string means "run
          every scenario" — that is the only widening signal a consumer handles;
          the rules producing it live in dryvist/.github's _ansible-ci.yml.
        type: string
        default: ""
      full_suite:
        description: Run every discovered Molecule scenario.
        type: boolean
        default: false
      timeout_minutes:
        description: Runner timeout for each job, passed by the caller.
        type: number
        default: 10
    secrets:
      DOPPLER_TOKEN:
        description: Doppler service token
        required: true

permissions:
  contents: read

jobs:
  # The matrix is DERIVED from the scenarios on disk, never hand-written — see
  # .github/scripts/discover-molecule-scenarios.sh for why.
  discover:
    name: Discover scenarios
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      # Narrowed set when the change is attributable, the full on-disk list
      # otherwise. Discovery still runs either way, so a scenario that exists
      # but is absent from the caller's filter map is never invisible here.
      scenarios: >-
        ${{ inputs.full_suite && steps.find.outputs.scenarios ||
        inputs.scenarios != '' && inputs.scenarios || steps.find.outputs.scenarios }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Find molecule scenarios
        id: find
        run: .github/scripts/discover-molecule-scenarios.sh

  test:
    name: Molecule (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.discover.outputs.scenarios) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Install Molecule and dependencies
        run: |
          uv pip install --system \
            molecule \
            'molecule-plugins[docker]>=23.0.0' \
            'ansible-core>=2.16' \
            'docker>=7.0.0' \
            netaddr \
            ansible-lint

      # Cache Galaxy content keyed on requirements.yml, using the v2 key and
      # paths of dryvist/.github's _ansible-ci.yml so a warm run of either
      # workflow warms the other. The install runs only on a miss.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-v2-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible collections
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy install -r requirements.yml

      # agent_guest's converge play does `nix eval` delegate_to: localhost
      # (roles/agent_guest/tasks/policy.yml) — it evaluates the pinned
      # nix-ai flake ref (public repo) to resolve the residual deny policy.
      # Only that scenario needs Nix on the runner.
      - name: Install Nix
        if: matrix.scenario == 'agent_guest'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Least-privilege secret handling: this action (pinned v2.0.0) has NO
      # allowlist input — it always fetches the token's entire config.
      # With inject-env-vars it would export EVERY key into the job environment
      # for every subsequent step. We deliberately omit inject-env-vars so no
      # secret lands in the ambient job env, then map ONLY the key the
      # molecule scenarios actually consume into the test step's own env below.
      # The value is still registered with the runner's mask (the action calls
      # core.setSecret per key), so it is redacted in logs. The value remains
      # available as a masked step output (steps.doppler.outputs.<KEY>).
      - name: Fetch secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}

      # hermes_ui only: build mission-control on the runner from the repo, ref
      # and build args the role itself uses, then save the image so the molecule
      # run loads it instead of compiling it inside the test instance.
      - name: Read mission-control build inputs from the hermes_ui role
        id: mc-inputs
        if: matrix.scenario == 'hermes_ui'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import sys

          import yaml

          defaults = yaml.safe_load(open("roles/hermes_ui_docker/defaults/main.yml"))
          template = open("roles/hermes_ui_docker/templates/docker-compose.yml.j2").read()

          image = re.search(r"^\s*image:\s*(homelab/mission-control:\S+)\s*$", template, re.M)
          if image is None:
              sys.exit("compose template has no homelab/mission-control image line")
          for arg in ("MC_VERSION", "NEXT_PUBLIC_GATEWAY_OPTIONAL"):
              if not re.search(rf"^\s*{arg}:", template, re.M):
                  sys.exit(f"compose template no longer passes build arg {arg}")

          print(f"repo={defaults['hermes_ui_docker_mission_control_repo']}")
          print(f"ref={defaults['hermes_ui_docker_mission_control_ref']}")
          print(f"gateway={defaults['hermes_ui_docker_mission_control_gateway_optional']}")
          print(f"image={image.group(1)}")
          PY

      - name: Set up Docker Buildx
        if: matrix.scenario == 'hermes_ui'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build mission-control on the runner
        if: matrix.scenario == 'hermes_ui'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "${{ steps.mc-inputs.outputs.repo }}#${{ steps.mc-inputs.outputs.ref }}"
          tags: ${{ steps.mc-inputs.outputs.image }}
          build-args: |
            MC_VERSION=${{ steps.mc-inputs.outputs.ref }}
            NEXT_PUBLIC_GATEWAY_OPTIONAL=${{ steps.mc-inputs.outputs.gateway }}
          load: true
          push: false
          cache-from: type=gha,scope=mission-control
          cache-to: type=gha,scope=mission-control,mode=max

      - name: Save the mission-control image for the molecule run
        if: matrix.scenario == 'hermes_ui'
        env:
          MC_IMAGE: ${{ steps.mc-inputs.outputs.image }}
        run: |
          tar="$GITHUB_WORKSPACE/mission-control-image.tar"
          docker save "$MC_IMAGE" -o "$tar"
          echo "HERMES_UI_MISSION_CONTROL_IMAGE_TAR=$tar" >> "$GITHUB_ENV"

      - name: Run molecule tests
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
          # Docker API client timeout (seconds) for community.docker modules,
          # incl. molecule destroy. Default is 60s.
          DOCKER_TIMEOUT: "180"
          # Only the secret the scenarios reference (verified against
          # molecule/*/molecule.yml provisioner.env):
          #   qdrant      -> QDRANT_API_KEY
          #   llamaindex  -> QDRANT_API_KEY
          #   agent_guest, ai_runner, hindsight, hermes_ui -> none (their
          #   env vars carry defaults or read from lookup('env', ...) with a
          #   fallback; verified against each scenario's provisioner.env)
          # This list is itself hand-maintained, so it can go stale the same way
          # the matrix above did. It is a comment, not a gate — a scenario
          # missing from it still runs and still receives the variable below.
          QDRANT_API_KEY: ${{ steps.doppler.outputs.QDRANT_API_KEY }}
        # Run the normal lifecycle, including initial and final destruction.
        run: molecule test -s "$MOLECULE_SCENARIO"
