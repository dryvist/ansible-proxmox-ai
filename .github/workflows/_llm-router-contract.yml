---
# The llm_router role's data contract, split out of _data-contract.yml.
#
# WHY ITS OWN FILE. These checks are an ENUMERATED list — a test file added
# without a line here is decorative — so the list only grows, and it grew past
# the repo's per-file token budget while three PRs were appending to it at
# once. The budget exists to force exactly this split rather than to be raised:
# an agent changing one router contract should read this file, not every
# openbao, hermes and phoenix check as well.
#
# It grew past budget again — the remaining checks live in
# _llm-router-contract-2.yml, called alongside this one by _data-contract.yml.
#
# Called by _data-contract.yml, so its result still reaches the Merge Gate
# through that workflow's conclusion.

name: LLM Router Contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  llm-router-contract:
    name: Check
    runs-on: ubuntu-latest

    # Static placeholders for the required-environment inputs the llm_router
    # role reads. No workflow context or untrusted input is interpolated here.
    # NOT secrets and NOT a bypass: the role's guards still refuse a real
    # converge with these unset, and the checks below render the config rather
    # than reaching any provider. Without them `lookup('env', NAME) |
    # mandatory(...)` returns '' rather than raising, and every check that
    # renders the proxy config asserts against a config carrying an EMPTY
    # master key and bearer token — and passes.
    env:
      LLM_ROUTER_MASTER_KEY: sk-ci-placeholder-not-a-secret
      LLM_LARGE_BEARER_TOKEN: ci-placeholder-bearer-not-a-secret
      PROXMOX_SUBDOMAIN: pve.example.test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      # pytest joins the existing pip install: the hermes_agent self-checks below
      # use parametrize and raises, so pytest is their runner, not an extra tool.
      # redis is ONLY for test_fast_subagent_lock_behavioral.py, which skips
      # cleanly (not silently) if it or the redis: service above is missing —
      # see that file's own docstring for why litellm/fastapi themselves are
      # deliberately NOT added here.
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible pytest pyyaml

      # Cache Galaxy content keyed on requirements.yml. On a hit the collections
      # (and any roles) are already present, so the install below is skipped;
      # on a miss (requirements.yml changed) it runs and repopulates the cache.
      # Same key/paths as dryvist/.github's _ansible-ci.yml so a warm run of
      # either workflow warms the other.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible dependencies
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: |
          ansible-galaxy install -r requirements.yml

      # Every consumer alias must name a model the serving host will actually
      # serve. On 2026-07-28 all four returned HTTP 404 at once — the serving
      # host runs llama-swap in single-model mode, where a non-resident model is
      # in disabledModels and 404s rather than being served under the wrong
      # weights. Render-time and offline on purpose: the defect was invisible for
      # as long as llama-swap grafted disabled ids onto the resident, so a live
      # probe would have passed while Hermes was answered by a model nobody
      # selected.
      - name: Verify llm_router servable-alias contract
        run: >-
          ansible-playbook tests/llm_router/test_alias_servable.yml
          -i localhost, -c local

      # Admission budget, every chat ladder's terminal rungs, local-first order.
      - name: Verify llm_router admission budget, ladder and local-first order
        run: >-
          ansible-playbook tests/llm_router/test_admission_budget_and_ladder.yml
          tests/llm_router/test_local_first_by_order.yml
          -i localhost, -c local

      # The two CI review roles, the Codex rungs and the Z.ai overflow pair.
      - name: Verify llm_router review roles and their terminal rungs
        run: >-
          ansible-playbook tests/llm_router/test_review_roles.yml
          -i localhost, -c local

      # The parsed TYPE of litellm_settings.callbacks, with and without a spend
      # store: a block scalar around the list is valid YAML that never starts.
      - name: Verify llm_router callbacks render as a list
        run: >-
          ansible-playbook tests/llm_router/test_callbacks_render_as_list.yml
          -i localhost, -c local

      - name: Verify llm_router process-recovery and rolling-converge contracts
        run: >-
          ansible-playbook tests/llm_router/test_service_restart_policy.yml
          tests/llm_router/test_syslog_route_outside_rolling_play.yml
          -i localhost, -c local

      # The no-credential half of the rendered fallback contract: local
      # complexity routing remains available while no unauthenticated cloud
      # group is advertised.
      - name: Verify llm_router hermes-default failover contract
        run: >-
          ansible-playbook tests/llm_router/test_hermes_default_failover.yml
          -i localhost, -c local

      # The credentialed half of the same contract: with cloud rungs present,
      # a fallback leg narrower than the primary must not stand in front of
      # them. A narrow leg raises ContextWindowExceededError before doing any
      # work, so every one standing in front spends an attempt -- and a unit of
      # the shared max_fallbacks budget -- on a rung that could not have served
      # the request. (It does not abort the chain; the walk advances. See
      # roles/llm_router/tasks/assert-fallback-chain.yml.)
      - name: Verify llm_router narrow-fallback ordering contract
        run: >-
          ansible-playbook tests/llm_router/test_fallback_narrow_legs_last.yml
          -i localhost, -c local

      # Both fallback maps are looked up under the model name AS TYPED, with no
      # alias resolution first -- so every servable id and every advertised
      # alias needs its own key in each. A name in one map but not the other
      # is a regression either way round.
      - name: Verify llm_router fallback entry-point contract
        run: >-
          ansible-playbook tests/llm_router/test_fallback_entry_points.yml
          -i localhost, -c local

      # Split from the entry-point contract above to stay under the per-file
      # token budget — same rendered maps, the ZDR-ladder and wider-escape
      # invariants over them.
      - name: Verify llm_router ZDR-ladder purity and context-window escape coverage
        run: >-
          ansible-playbook tests/llm_router/test_fallback_zdr_and_escape.yml
          -i localhost, -c local

      # max_fallbacks is one depth budget shared by every rendered chain; the
      # attempt-key count it must cover is read off the render, not the
      # defaults' own expression.
      - name: Verify llm_router fallback depth-budget contract
        run: >-
          ansible-playbook tests/llm_router/test_fallback_depth_budget.yml
          -i localhost, -c local

      - name: Verify llm_router Hermes cloud value contract
        run: >-
          ansible-playbook tests/llm_router/test_hermes_cloud_value.yml
          -i localhost, -c local

      - name: Verify llm_router provider credential policy
        run: >-
          ansible-playbook tests/llm_router/test_hermes_provider_policy.yml
          -i localhost, -c local

      - name: Verify llm_router provider-key contract
        run: >-
          ansible-playbook tests/llm_router/test_hermes_provider_keys.yml
          -i localhost, -c local

      - name: Verify llm_router whitespace-credential contract
        run: >-
          ansible-playbook tests/llm_router/test_hermes_provider_keys_whitespace.yml
          -i localhost, -c local

      - name: Verify every seeded virtual-key alias has an apps domain path
        run: >-
          ansible-playbook tests/llm_router/test_virtual_key_apps_paths_covered.yml
          -i localhost, -c local

      - name: Verify the key budget-limits daily window arithmetic
        run: >-
          ansible-playbook tests/llm_router/test_key_budget_limits_window.yml
          -i localhost, -c local

      # The paid-egress contract: the registry is the allowlist (no
      # `openrouter/*` passthrough), and the spend ceiling is enforced by the
      # router rather than described to the caller. Both failures are silent —
      # the render succeeds either way and neither ansible-lint nor
      # --syntax-check can see them.
      # The subscription tier's own render contract. Every other fixture leaves
      # its credential unseeded, so without this step the tier's whole render
      # block -- including the hints projection -- ships unexecuted. This list
      # is enumerated, not globbed: a test file added without a line here is
      # decorative.
      - name: Verify llm_router subscription-tier render contract
        run: >-
          ansible-playbook tests/llm_router/test_opencode_tier_render.yml
          -i localhost, -c local

      - name: Verify llm_router OpenRouter allowlist and budget contract
        run: >-
          ansible-playbook tests/llm_router/test_openrouter_allowlist.yml
          -i localhost, -c local

      # The pairing invariant itself, proven from both sides: a budget with no
      # store must FAIL the converge, and a store with no budget must pass. This
      # list is enumerated, not globbed, so a test file added without a line
      # here is decorative — the exact rot the hermes-default step above was
      # rescued from. That matters more than usual for this one: the assertion
      # it covers exists specifically to stop an unbacked ceiling being
      # reintroduced, so a version of it that never runs restores the defect
      # while looking like the guard against it.
      - name: Verify llm_router budget/store pairing contract
        run: >-
          ansible-playbook tests/llm_router/test_budget_requires_store.yml
          -i localhost, -c local
