---
# The llm_router role's data contract, split out of _data-contract.yml.
#
# WHY ITS OWN FILE. These checks are an ENUMERATED list — a test file added
# without a matrix entry is decorative — so the list only grows, and it grew
# past the repo's per-file token budget twice while it repeated a full step
# block (name, comment, run) per check. A `strategy.matrix` collapses that to
# one shared step and one line per playbook, which is what actually fixes the
# growth rather than moving it to a second file.
#
# Called by _data-contract.yml, so its result still reaches the Merge Gate
# through that workflow's conclusion.

name: LLM Router Contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  llm-router-contract:
    name: ${{ matrix.playbook }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One or two space-separated tests/llm_router/*.yml playbooks per
        # entry — two only where the original single ansible-playbook
        # invocation ran them together (process-recovery pair, admission
        # pair), preserved here so they still share one Ansible process.
        playbook:
          - tests/llm_router/test_alias_servable.yml # servable-alias contract
          # admission budget, ladder, local-first order
          - tests/llm_router/test_admission_budget_and_ladder.yml tests/llm_router/test_local_first_by_order.yml
          - tests/llm_router/test_review_roles.yml # review roles, Codex rungs, Z.ai overflow
          - tests/llm_router/test_callbacks_render_as_list.yml # callbacks parse as a list, not a block scalar
          # process-recovery + rolling-converge
          - tests/llm_router/test_service_restart_policy.yml tests/llm_router/test_syslog_route_outside_rolling_play.yml
          - tests/llm_router/test_hermes_default_failover.yml # no-credential fallback stays local
          - tests/llm_router/test_fallback_narrow_legs_last.yml # narrow-fallback ordering
          - tests/llm_router/test_fallback_entry_points.yml # fallback entry-point contract
          - tests/llm_router/test_fallback_zdr_and_escape.yml # ZDR-ladder purity + escape coverage
          - tests/llm_router/test_fallback_depth_budget.yml # fallback depth-budget contract
          - tests/llm_router/test_hermes_cloud_value.yml # Hermes cloud value contract
          - tests/llm_router/test_hermes_provider_policy.yml # provider credential policy
          - tests/llm_router/test_hermes_provider_keys.yml # provider-key contract
          - tests/llm_router/test_hermes_provider_keys_whitespace.yml # whitespace-credential contract
          - tests/llm_router/test_virtual_key_apps_paths_covered.yml # every virtual-key alias has an apps domain path
          - tests/llm_router/test_key_budget_limits_window.yml # key budget-limits daily window arithmetic
          - tests/llm_router/test_opencode_tier_render.yml # subscription-tier render contract
          - tests/llm_router/test_openrouter_allowlist.yml # OpenRouter allowlist + budget contract
          - tests/llm_router/test_budget_requires_store.yml # budget/store pairing contract
          - tests/llm_router/test_spend_log_retention.yml # request-record retention contract
          - tests/llm_router/test_serving_share.yml # serving-share metric job contract
          - tests/llm_router/test_local_admission_cap.yml # local admission-cap contract
          - tests/llm_router/test_registry_render_parity.yml # registry/render parity contract
          - tests/llm_router/test_background_health_check_exclusion.yml # background health-check exclusion
          - tests/llm_router/test_serving_identity.yml # heavy-tier serving identity contract
          - tests/llm_router/test_endpoint_dns_assert.yml # backend DNS resolution contract
          - tests/llm_router/test_servable_probe.yml # servable probe gate contract
          - tests/llm_router/test_servable_probe_remote.yml # servable probe remote contract
          - tests/llm_router/test_servable_probe_plan.yml # servable probe plan contract
          - tests/llm_router/test_litellm_oidc_env.yml # generic-OIDC env rendering contract
          # OIDC admin identity is mandatory, never a literal
          - tests/llm_router/test_litellm_oidc_admin_identity_required.yml

    # Static placeholders for the required-environment inputs the llm_router
    # role reads. No workflow context or untrusted input is interpolated here.
    # NOT secrets and NOT a bypass: the role's guards still refuse a real
    # converge with these unset, and the checks below render the config rather
    # than reaching any provider.
    env:
      LLM_ROUTER_MASTER_KEY: sk-ci-placeholder-not-a-secret
      LLM_LARGE_BEARER_TOKEN: ci-placeholder-bearer-not-a-secret
      PROXMOX_SUBDOMAIN: pve.example.test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      # Cache Galaxy content keyed on requirements.yml. On a hit the collections
      # (and any roles) are already present, so the install below is skipped;
      # on a miss (requirements.yml changed) it runs and repopulates the cache.
      # Same key/paths as dryvist/.github's _ansible-ci.yml so a warm run of
      # either workflow warms the other.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible dependencies
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: |
          ansible-galaxy install -r requirements.yml

      - name: Run llm_router contract playbook
        run: ansible-playbook ${{ matrix.playbook }} -i localhost, -c local

  # Not part of the matrix above: this is pytest, not ansible-playbook, and it
  # needs a real Redis to exercise fast_subagent_lock.py.j2's actual EVAL
  # calls (test_fast_subagent_lock_behavioral.py), which nothing else in this
  # file needs — a service scoped to every matrix instance would start Redis
  # 30 times for one consumer.
  llm-router-registry-contract:
    name: Registry single-source contract
    runs-on: ubuntu-latest

    env:
      LLM_ROUTER_MASTER_KEY: sk-ci-placeholder-not-a-secret
      LLM_LARGE_BEARER_TOKEN: ci-placeholder-bearer-not-a-secret
      PROXMOX_SUBDOMAIN: pve.example.test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # test_fast_subagent_lock_behavioral.py: a missing redis package or an
      # unreachable server must FAIL this job, never quietly skip the one
      # suite that exercises the lock's real Redis behavior — see that
      # file's own docstring.
      LLM_ROUTER_REQUIRE_REDIS: "1"

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible pytest pyyaml redis

      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible dependencies
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: |
          ansible-galaxy install -r requirements.yml

      # The alerting block in config.yaml.j2: present only when a webhook URL
      # is set, and never a hardcoded host.
      - name: Verify llm_router alert-webhook render contract
        run: >-
          ansible-playbook tests/llm_router/test_alert_webhook.yml
          -i localhost, -c local

      # The cheap role's GPU-first ladder and the per-rung attempt bounds it
      # inherits from the registry.
      - name: Verify llm_router cheap role GPU-first ladder contract
        run: >-
          ansible-playbook tests/llm_router/test_cheap_gpu_first_ladder.yml
          -i localhost, -c local

      # The GPU rung's admission control derives from the guest's own
      # llama_cpp_parallel, never a separately-set literal.
      - name: Verify llm_router GPU rung admission-matches-backend contract
        run: >-
          ansible-playbook tests/llm_router/test_gpu_rung_admission_matches_backend.yml
          -i localhost, -c local

      # Every published Hermes agent renders as its own deployment, with its
      # own bearer, reachable through no alias or fallback chain.
      - name: Verify llm_router Hermes agent deployment contract
        run: >-
          ansible-playbook tests/llm_router/test_hermes_agents.yml
          -i localhost, -c local

      # Every local deployment carries its own non-streaming timeout, since a
      # non-streaming call never falls back to stream_timeout.
      - name: Verify llm_router local non-streaming timeout contract
        run: >-
          ansible-playbook tests/llm_router/test_local_nonstreaming_timeout.yml
          -i localhost, -c local

      # An OpenCode-only credential (no hermes-cloud key seeded) still keeps
      # every entry point fallback-capable.
      - name: Verify llm_router OpenCode-only entry-point contract
        run: >-
          ansible-playbook tests/llm_router/test_opencode_only_entry_points.yml
          -i localhost, -c local

      # Registry hints reach the rendered model_info, in the known vocabulary
      # consumers filter on.
      - name: Verify llm_router registry hints projection contract
        run: >-
          ansible-playbook tests/llm_router/test_registry_hints_projection.yml
          -i localhost, -c local

      # retire-role-deployments.yml's delete-id expression selects only the
      # genuine DB-stored shadow, never the /model/info alias-projection row.
      - name: Verify llm_router role-deployment retirement db-only contract
        run: >-
          ansible-playbook tests/llm_router/test_retire_role_deployments_db_only.yml
          -i localhost, -c local

      # llm_router_seed_mode defaults to initial (seed once), never rebuild
      # (always overwrite), so an Admin UI ladder edit survives a converge.
      - name: Verify llm_router settings seed-mode contract
        run: >-
          ansible-playbook tests/llm_router/test_router_settings_seed_mode.yml
          -i localhost, -c local

      # The router-settings DB sync handler runs after the restart handler,
      # never before it, so a down proxy doesn't strand the converge mid-roll.
      - name: Verify llm_router settings sync-after-restart handler order
        run: >-
          ansible-playbook tests/llm_router/test_router_settings_sync_after_restart.yml
          -i localhost, -c local

      # The seed-key format guard fails loud, by alias, before /key/generate
      # ever fires on a value LiteLLM would reject.
      - name: Verify llm_router seed-key format guard contract
        run: >-
          ansible-playbook tests/llm_router/test_seed_key_format_assert.yml
          -i localhost, -c local

      # The live-alias expression only finds aliases against the full-object
      # /key/list response shape seed-keys.yml now requests.
      - name: Verify llm_router seed-key live-alias contract
        run: >-
          ansible-playbook tests/llm_router/test_seed_key_live_aliases.yml
          -i localhost, -c local

      # fast-gpu is gated by the 4080 session lock, not the redirect set, in
      # both the registry composition and the rendered callback.
      - name: Verify llm_router subagent-lock gated-models contract
        run: >-
          ansible-playbook tests/llm_router/test_subagent_lock_gated_models.yml
          -i localhost, -c local

      # The router's syslog route renders the documented index/sourcetype and
      # matches the real unit names, never a hand-typed fixture.
      - name: Verify llm_router syslog route contract
        run: >-
          ansible-playbook tests/llm_router/test_syslog_route.yml
          -i localhost, -c local

      # The registry rule's teeth: a registry value re-typed as a literal in
      # the role, its tests or the playbooks fails here. Render parity cannot
      # see that input — a REGISTERED id typed a second time renders correctly
      # until the registry entry changes. pytest, not a `python3 <file>` loop,
      # for the same reason as the role self-checks in _data-contract.yml.
      - name: Verify llm_router registry single-source contract
        run: python -m pytest tests/llm_router/ -q
