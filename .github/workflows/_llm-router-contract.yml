        # - tests/llm_router/test_hermes_profile_keys_assert.yml
        # - tests/llm_router/test_hermes_default_failover.yml
        # - tests/llm_router/test_schema_push_failure_redaction.yml
        # - tests/llm_router/test_router_settings_sync_after_restart.yml
        # - tests/llm_router/test_zai_flat_rate_no_budget.yml
        # - tests/llm_router/test_syslog_route.yml
        # - tests/llm_router/test_drift_live_key_shape.yml
        # - tests/llm_router/test_drift_live_keys.yml
        # - tests/llm_router/test_hermes_provider_policy.yml
        # - tests/llm_router/test_key_budget_limits_window.yml
        # - tests/llm_router/test_seed_play_reachability_gate.yml
        # - tests/llm_router/test_cross_modality_fail_fast.yml
        # - tests/llm_router/test_retire_role_deployments_db_only.yml
        #   tests/llm_router/test_drift_role_report.yml
        # - tests/llm_router/test_servable_probe_remote.yml
        # - tests/llm_router/test_registry_render_parity.yml
        # - tests/llm_router/test_registry_render_parity_exemptions.yml
        # - tests/llm_router/test_seed_key_live_aliases.yml
        # - tests/llm_router/test_seed_keys_rotation_reread_preserves_existing.yml
        # - tests/llm_router/test_ladder_keys.yml
        # - tests/llm_router/test_seed_key_trace_reconcile.yml
        # - tests/llm_router/test_seed_key_model_allowlist_reconcile.yml
        # - tests/llm_router/test_fallback_depth_budget.yml
        # - tests/llm_router/test_router_ui_drift.yml
        # - tests/llm_router/test_jwt_unique_index.yml
        # - tests/llm_router/test_hermes_rate_limit_retry.yml
        # - tests/llm_router/test_seed_key_pagination.yml
