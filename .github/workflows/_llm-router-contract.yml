---
# The llm_router role's data contract, split out of _data-contract.yml.
#
# WHY ITS OWN FILE. These checks are an ENUMERATED list — a test file added
# without a matrix entry is decorative — so the list only grows, and it grew
# past the repo's per-file token budget twice while it repeated a full step
# block (name, comment, run) per check. A `strategy.matrix` collapses that to
# one shared step and schedules named router playbook groups as contract jobs.
#
# Called by _data-contract.yml, so its result still reaches the Merge Gate
# through that workflow's conclusion.

name: LLM Router Contract

on:
  workflow_call:
    inputs:
      full_suite:
        type: boolean
        required: true
      playbooks:
        type: string
        required: true
      timeout_minutes:
        type: number
        default: 10

permissions:
  contents: read

jobs:
  router-contract-dependencies:
    name: Router contract dependencies
    if: inputs.playbooks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || inputs.timeout_minutes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install router contract dependencies
        uses: ./.github/actions/router-deps
        with:
          save: "true"

      - name: Verify selected playbooks are registered
        if: inputs.playbooks != '[]'
        env:
          PLAYBOOKS: ${{ inputs.playbooks }}
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml

          registry = yaml.safe_load(Path('.github/router-contracts.yml').read_text())
          registered = {playbook for entry in registry['contracts'] for playbook in entry}
          selected = {playbook for shard in json.loads(os.environ['PLAYBOOKS'])
                      for playbook in shard['playbooks'].split()}
          unknown = sorted(selected - registered)
          if unknown:
              raise SystemExit(f'unregistered router contract playbooks: {unknown}')
          PY

      - name: Router lock resolves for the router Python
        # Debian 13 router guests provide Python 3.13.
        run: >-
          .venv/bin/uv --no-config pip install --dry-run --require-hashes
          --python .venv/bin/python
          --python-version 3.13
          --python-platform x86_64-unknown-linux-gnu
          -r roles/llm_router/files/requirements.txt

  llm-router-contract:
    name: "Router contract: ${{ matrix.shard.name }}"
    if: ${{ !cancelled() && inputs.playbooks != '[]' }}
    needs: router-contract-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes < 30 && 30 || inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        # Each named shard runs its playbooks through the shared loop.
        shard: ${{ fromJSON(inputs.playbooks) }}
        # The registry lives in .github/router-contracts.yml and the selector
        # passes its focused entries through this matrix input. Workflow edits select all.
    env:
      LLM_ROUTER_MASTER_KEY: sk-ci-placeholder-not-a-secret
      LLM_LARGE_BEARER_TOKEN: ci-placeholder-bearer-not-a-secret
      PROXMOX_SUBDOMAIN: pve.example.test
      ANSIBLE_OPENTELEMETRY_ENABLED: 'true'
      ANSIBLE_OPENTELEMETRY_STORE_SPANS_IN_FILE: /dev/null

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore router contract dependencies
        uses: ./.github/actions/router-deps

      - name: Run llm_router contract playbook
        env:
          PLAYBOOKS: ${{ matrix.shard.playbooks }}
        run: |
          result=0
          for playbook in $PLAYBOOKS; do
            echo "::group::$playbook"
            if ! ansible-playbook "$playbook" -i localhost, -c local; then
              result=1
            fi
            echo "::endgroup::"
          done
          exit "$result"

  # Not part of the matrix above: pytest, not ansible-playbook.
  llm-router-registry-contract:
    name: Registry single-source contract
    if: ${{ !cancelled() && inputs.playbooks != '[]' }}
    needs: router-contract-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    env:
      LLM_ROUTER_MASTER_KEY: sk-ci-placeholder-not-a-secret
      LLM_LARGE_BEARER_TOKEN: ci-placeholder-bearer-not-a-secret
      PROXMOX_SUBDOMAIN: pve.example.test
      ANSIBLE_OPENTELEMETRY_ENABLED: 'true'
      ANSIBLE_OPENTELEMETRY_STORE_SPANS_IN_FILE: /dev/null

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore router contract dependencies
        uses: ./.github/actions/router-deps

      # The registry rule's teeth: a registry value re-typed as a literal in
      # the role, its tests or the playbooks fails here. Render parity cannot
      # see that input — a REGISTERED id typed a second time renders correctly
      # until the registry entry changes. pytest, not a `python3 <file>` loop,
      # for the same reason as the role self-checks in _data-contract.yml.
      - name: Verify llm_router registry single-source contract
        run: python -m pytest tests/llm_router/ -q
