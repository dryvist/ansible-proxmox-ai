---
# The llm_router role's data contract, split out of _data-contract.yml.
#
# WHY ITS OWN FILE. These checks are an ENUMERATED list — a test file added
# without a line here is decorative — so the list only grows, and it grew past
# the repo's per-file token budget while three PRs were appending to it at
# once. The budget exists to force exactly this split rather than to be raised:
# an agent changing one router contract should read this file, not every
# openbao, hermes and phoenix check as well.
#
# Called by _data-contract.yml, so its result still reaches the Merge Gate
# through that workflow's conclusion.

name: LLM Router Contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  llm-router-contract:
    name: Check
    runs-on: ubuntu-latest

    # Static placeholders for the required-environment inputs the llm_router
    # role reads. No workflow context or untrusted input is interpolated here.
    # NOT secrets and NOT a bypass: the role's guards still refuse a real
    # converge with these unset, and the checks below render the config rather
    # than reaching any provider. Without them `lookup('env', NAME) |
    # mandatory(...)` returns '' rather than raising, and every check that
    # renders the proxy config asserts against a config carrying an EMPTY
    # master key and bearer token — and passes.
    env:
      LLM_ROUTER_MASTER_KEY: sk-ci-placeholder-not-a-secret
      LLM_LARGE_BEARER_TOKEN: ci-placeholder-bearer-not-a-secret
      PROXMOX_SUBDOMAIN: pve.example.test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      # pytest joins the existing pip install: the hermes_agent self-checks below
      # use parametrize and raises, so pytest is their runner, not an extra tool.
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible pytest pyyaml

      - name: Install Ansible dependencies
        run: |
          ansible-galaxy install -r requirements.yml

      # Every consumer alias must name a model the serving host will actually
      # serve. On 2026-07-28 all four returned HTTP 404 at once — the serving
      # host runs llama-swap in single-model mode, where a non-resident model is
      # in disabledModels and 404s rather than being served under the wrong
      # weights. Render-time and offline on purpose: the defect was invisible for
      # as long as llama-swap grafted disabled ids onto the resident, so a live
      # probe would have passed while Hermes was answered by a model nobody
      # selected.
      - name: Verify llm_router servable-alias contract
        run: >-
          ansible-playbook tests/llm_router/test_alias_servable.yml
          -i localhost, -c local

      - name: Verify llm_router process-recovery contract
        run: >-
          ansible-playbook tests/llm_router/test_service_restart_policy.yml
          -i localhost, -c local

      # The no-credential half of the rendered fallback contract: local
      # complexity routing remains available while no unauthenticated cloud
      # group is advertised.
      - name: Verify llm_router hermes-default failover contract
        run: >-
          ansible-playbook tests/llm_router/test_hermes_default_failover.yml
          -i localhost, -c local

      # The credentialed half of the same contract: with cloud rungs present,
      # a fallback leg narrower than the primary must not stand in front of
      # them. A narrow leg raises ContextWindowExceededError before doing any
      # work, so every one standing in front spends an attempt -- and a unit of
      # the shared max_fallbacks budget -- on a rung that could not have served
      # the request. (It does not abort the chain; the walk advances. See
      # roles/llm_router/tasks/assert-fallback-chain.yml.)
      - name: Verify llm_router narrow-fallback ordering contract
        run: >-
          ansible-playbook tests/llm_router/test_fallback_narrow_legs_last.yml
          -i localhost, -c local

      # Both fallback maps are looked up under the model name AS TYPED, with no
      # alias resolution first -- so every name a caller can use for the primary
      # needs its own key in each. A name in one map but not the other is a
      # regression either way round.
      - name: Verify llm_router fallback entry-point contract
        run: >-
          ansible-playbook tests/llm_router/test_fallback_entry_points.yml
          -i localhost, -c local

      - name: Verify llm_router Hermes cloud value contract
        run: >-
          ansible-playbook tests/llm_router/test_hermes_cloud_value.yml
          -i localhost, -c local

      - name: Verify llm_router provider-key contract
        run: >-
          ansible-playbook tests/llm_router/test_hermes_provider_keys.yml
          -i localhost, -c local

      # The paid-egress contract: the registry is the allowlist (no
      # `openrouter/*` passthrough), and the spend ceiling is enforced by the
      # router rather than described to the caller. Both failures are silent —
      # the render succeeds either way and neither ansible-lint nor
      # --syntax-check can see them.
      # The subscription tier's own render contract. Every other fixture leaves
      # its credential unseeded, so without this step the tier's whole render
      # block -- including the hints projection -- ships unexecuted. This list
      # is enumerated, not globbed: a test file added without a line here is
      # decorative.
      - name: Verify llm_router subscription-tier render contract
        run: >-
          ansible-playbook tests/llm_router/test_opencode_tier_render.yml
          -i localhost, -c local

      - name: Verify llm_router OpenRouter allowlist and budget contract
        run: >-
          ansible-playbook tests/llm_router/test_openrouter_allowlist.yml
          -i localhost, -c local

      # The pairing invariant itself, proven from both sides: a budget with no
      # store must FAIL the converge, and a store with no budget must pass. This
      # list is enumerated, not globbed, so a test file added without a line
      # here is decorative — the exact rot the hermes-default step above was
      # rescued from. That matters more than usual for this one: the assertion
      # it covers exists specifically to stop an unbacked ceiling being
      # reintroduced, so a version of it that never runs restores the defect
      # while looking like the guard against it.
      - name: Verify llm_router budget/store pairing contract
        run: >-
          ansible-playbook tests/llm_router/test_budget_requires_store.yml
          -i localhost, -c local
      # Pins the per-request-record contract: with a database attached, every
      # request leaves an attributable row, the table is bounded by a retention
      # job, and prompts stay out of it. Each half fails silently on its own —
      # spend logs off means no request can be tied to the deployment that
      # served it, error logs off leaves only successes so every derived rate
      # is right by construction, and a missing retention period schedules no
      # cleanup at all rather than a long one.
      - name: Verify llm_router request-record retention contract
        run: >-
          ansible-playbook tests/llm_router/test_spend_log_retention.yml
          -i localhost, -c local
      # Pins that every LOCAL deployment carries an in-flight admission cap.
      # Until 2026-08 only the OpenRouter egress tier had rpm/tpm/
      # max_parallel_requests, so LiteLLM admitted every inbound request to
      # local backends unbounded.
      - name: Verify llm_router local admission-cap contract
        run: >-
          ansible-playbook tests/llm_router/test_local_admission_cap.yml
          -i localhost, -c local

      # Pins the registry <-> rendered model_list parity guard
      # (assert-registry-render-parity.yml) — the only check that catches an
      # entry enabled in the registry but absent from the render, or vice
      # versa; every other assert only checks the registry against itself.
      - name: Verify llm_router registry/render parity contract
        run: >-
          ansible-playbook tests/llm_router/test_registry_render_parity.yml
          -i localhost, -c local

      # Pins that every llama-swap-backed deployment (large + standby, fast +
      # light) stays excluded from background health checks, and that the
      # dedicated vLLM tier and cloud legs remain probeable. Nothing else
      # inspects model_info, so a template edit that drops the exclusion from
      # one tier would otherwise ship silently.
      - name: Verify llm_router background health-check exclusion contract
        run: >-
          ansible-playbook tests/llm_router/test_background_health_check_exclusion.yml
          -i localhost, -c local

      # Pins the heavy-tier serving identity contract: address and hostname
      # come from a published authority, never a value committed here, and
      # their absence is fatal rather than papered over.
      - name: Verify llm_router heavy-tier serving identity contract
        run: >-
          ansible-playbook tests/llm_router/test_serving_identity.yml
          -i localhost, -c local

      # Pins the backend DNS resolution contract: every advertised backend
      # base URL must resolve on the router guest itself, so an
      # advertised-but-unresolvable host (the apex-vs-subdomain trap
      # documented on llm_router_llm_vllm_base_url) fails the converge
      # instead of a later, unrelated-looking connection error.
      - name: Verify llm_router backend DNS resolution contract
        run: >-
          ansible-playbook tests/llm_router/test_endpoint_dns_assert.yml
          -i localhost, -c local

      # The gate half of the servable probe: a registry claim the serving gate
      # contradicts is fatal, and each reason it declined to check is reported
      # as a decline rather than passing silently.
      - name: Verify llm_router servable probe gate contract
        run: >-
          ansible-playbook tests/llm_router/test_servable_probe.yml
          -i localhost, -c local

      # The remote half: a provider listing missing a registered id is fatal,
      # and an unseeded tier is reported as not deployed, not merely unchecked.
      - name: Verify llm_router servable probe remote contract
        run: >-
          ansible-playbook tests/llm_router/test_servable_probe_remote.yml
          -i localhost, -c local

      # Which endpoints the probe plans to query at all. A plan that drops a
      # tier verifies nothing while the converge stays green.
      - name: Verify llm_router servable probe plan contract
        run: >-
          ansible-playbook tests/llm_router/test_servable_probe_plan.yml
          -i localhost, -c local

      # Pins the generic-OIDC env block litellm.env.j2 emits once the Authelia
      # client secret resolves, and its honest absence when none does. Nothing
      # else renders that template outside a converge, so without this step the
      # SSO-env contract ships unverified — this list is enumerated, not
      # globbed, so an unlisted test is decorative.
      - name: Verify llm_router generic-OIDC env rendering contract
        run: >-
          ansible-playbook tests/llm_router/test_litellm_oidc_env.yml
          -i localhost, -c local

      # The registry rule's teeth: a registry value re-typed as a literal in
      # the role, its tests or the playbooks fails here. Render parity cannot
      # see that input — a REGISTERED id typed a second time renders correctly
      # until the registry entry changes. pytest, not a `python3 <file>` loop,
      # for the same reason as the role self-checks in _data-contract.yml.
      - name: Verify llm_router registry single-source contract
        run: python -m pytest tests/llm_router/ -q
