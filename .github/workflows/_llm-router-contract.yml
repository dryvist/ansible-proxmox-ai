---
# The llm_router role's data contract, split out of _data-contract.yml.
#
# WHY ITS OWN FILE. These checks are an ENUMERATED list — a test file added
# without a matrix entry is decorative — so the list only grows, and it grew
# past the repo's per-file token budget twice while it repeated a full step
# block (name, comment, run) per check. A `strategy.matrix` collapses that to
# one shared step and schedules named router playbook groups as contract jobs.
#
# Called by _data-contract.yml, so its result still reaches the Merge Gate
# through that workflow's conclusion.

name: LLM Router Contract

on:
  workflow_call:
    inputs:
      full_suite:
        type: boolean
        required: true
      playbooks:
        type: string
        required: true
      timeout_minutes:
        type: number
        default: 10

permissions:
  contents: read

jobs:
  router-contract-dependencies:
    name: Router contract dependencies
    if: inputs.playbooks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || inputs.timeout_minutes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install router contract dependencies
        uses: ./.github/actions/router-deps
        with:
          save: "true"

      - name: Router lock resolves for the router Python
        # Debian 13 router guests provide Python 3.13.
        run: >-
          .venv/bin/uv --no-config pip install --dry-run --require-hashes
          --python .venv/bin/python
          --python-version 3.13
          --python-platform x86_64-unknown-linux-gnu
          -r roles/llm_router/files/requirements.txt

  llm-router-contract:
    name: "Router contract: ${{ matrix.shard.name }}"
    if: ${{ !cancelled() && inputs.playbooks != '[]' }}
    needs: router-contract-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes < 30 && 30 || inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        # Each named shard runs its playbooks through the shared loop.
        shard: ${{ fromJSON(inputs.playbooks) }}
        # This commented playbook list is the selector's single source of router checks.
        # - tests/llm_router/test_vllm_tier_switch.yml
        # - tests/llm_router/test_vllm_tier_switch_on.yml
        # - tests/llm_router/test_vllm_tier_switch_guard.yml
        # - tests/llm_router/test_role_sensitivity_reconcile.yml
