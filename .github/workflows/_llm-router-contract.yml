        # - tests/llm_router/test_fallback_completeness.yml
        # - tests/llm_router/test_servable_probe_plan.yml
        # - tests/llm_router/test_router_settings_seed_mode.yml
        # - tests/llm_router/test_litellm_local_workstation_key_zdr.yml
        # - tests/llm_router/test_schema_migration_enforced.yml
        # - tests/llm_router/test_mcp_slack_optional.yml
        # - tests/llm_router/test_glance_profile_key.yml
        # - tests/llm_router/test_cheap_gpu_first_ladder.yml
        # - tests/llm_router/test_litellm_oidc_env.yml
        # - tests/llm_router/test_review_roles.yml
        # - tests/llm_router/test_hermes_private_key_zdr.yml
