        # - tests/llm_router/test_zdr_key_tags.yml
        # - tests/llm_router/test_local_nonstreaming_timeout.yml
        # - tests/llm_router/test_otel_export.yml
        # - tests/llm_router/test_local_only_no_hosted_fallback.yml
        # - tests/llm_router/test_hermes_provider_keys.yml
        # - tests/llm_router/test_opencode_only_entry_points.yml
        # - tests/llm_router/test_gpu_pro6000_enabled_render.yml
        # - tests/llm_router/test_db_connection_pool_limit.yml
        # - tests/llm_router/test_credential_placeholder_rejected.yml
        # - tests/llm_router/test_llm_roles_egress.yml
        # - tests/llm_router/test_hermes_agents.yml
        # - tests/llm_router/test_openrouter_allowlist.yml
        # - tests/llm_router/test_review_local.yml
        # - tests/llm_router/test_registry_hints_projection.yml
        # - tests/llm_router/test_local_admission_cap.yml
        # - tests/llm_router/test_langfuse_export.yml
        # - tests/llm_router/test_free_route_credential_gate_order.yml
        # - tests/llm_router/test_redis_coordination.yml
        # - tests/llm_router/test_spend_log_retention.yml
        # - tests/llm_router/test_virtual_key_apps_paths_covered.yml
        # - tests/llm_router/test_background_health_check_exclusion.yml
        # - tests/llm_router/test_admission_budget_and_ladder.yml
        # - tests/llm_router/test_assertion_inputs_materialized.yml
        # - tests/llm_router/test_opencode_tier_render.yml
        # - tests/llm_router/test_auto_router_deployment_tags.yml
        # - tests/llm_router/test_hermes_provider_keys_escape.yml
        # - tests/llm_router/test_deployment_class_tags.yml
        # - tests/llm_router/test_alert_webhook.yml
        # - tests/llm_router/test_callbacks_render_as_list.yml
        # - tests/llm_router/test_hermes_provider_keys_whitespace.yml
        # - tests/llm_router/test_hermes_public_key_alias_brain.yml
        # Workflow edits select every router contract entry in CI.
    env:
      LLM_ROUTER_MASTER_KEY: sk-ci-placeholder-not-a-secret
      LLM_LARGE_BEARER_TOKEN: ci-placeholder-bearer-not-a-secret
      PROXMOX_SUBDOMAIN: pve.example.test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-ci.txt

      # Cache Galaxy content keyed on requirements.yml. install --force
      # reinstalls every entry, so restored content never satisfies it alone.
      # Same v2 key/paths as dryvist/.github's _ansible-ci.yml on main, so a warm run of
      # either workflow warms the other.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-v2-${{ runner.os }}-${{ hashFiles('requirements.yml') }}
          restore-keys: |
            ansible-galaxy-v2-${{ runner.os }}-

      - name: Install Ansible dependencies
        run: |
          ansible-galaxy install --force -r requirements.yml

      - name: Run llm_router contract playbook
        env:
          PLAYBOOKS: ${{ matrix.playbook }}
        run: |
          result=0
          for playbook in $PLAYBOOKS; do
            echo "::group::$playbook"
            if ! ansible-playbook "$playbook" -i localhost, -c local; then
              result=1
            fi
            echo "::endgroup::"
          done
          exit "$result"

  # Not part of the matrix above: pytest, not ansible-playbook.
  llm-router-registry-contract:
    name: Registry single-source contract
    if: inputs.full_suite || inputs.playbooks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    env:
      LLM_ROUTER_MASTER_KEY: sk-ci-placeholder-not-a-secret
      LLM_LARGE_BEARER_TOKEN: ci-placeholder-bearer-not-a-secret
      PROXMOX_SUBDOMAIN: pve.example.test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-ci.txt

      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-v2-${{ runner.os }}-${{ hashFiles('requirements.yml') }}
          restore-keys: |
            ansible-galaxy-v2-${{ runner.os }}-

      - name: Install Ansible dependencies
        run: |
          ansible-galaxy install --force -r requirements.yml

      # The registry rule's teeth: a registry value re-typed as a literal in
      # the role, its tests or the playbooks fails here. Render parity cannot
      # see that input — a REGISTERED id typed a second time renders correctly
      # until the registry entry changes. pytest, not a `python3 <file>` loop,
      # for the same reason as the role self-checks in _data-contract.yml.
      - name: Verify llm_router registry single-source contract
        run: python -m pytest tests/llm_router/ -q
