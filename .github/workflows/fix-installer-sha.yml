---
# Refresh pinned installer and release-asset checksums on Renovate branches.
# The shared helper verifies pins and updates their digests in place.
# The existing GitHub App writes signed Contents API commits to the same PR;
# those commits trigger the required checks. A matching pin produces no diff.
# Only the two declared defaults files are eligible for checksum commits.
name: Fix installer sha256 (Renovate PRs)

on:
  pull_request:
    types: [opened, synchronize]
    # Keep these paths coupled to both pin tables in check-installer-sha.sh.
    paths:
      - "roles/hermes_agent/defaults/main/10-installer-and-bundles.yml"
      - "roles/llamacpp_release/defaults/main/00-release.yml"

concurrency:
  # A newer push on the same PR makes an in-flight run's captured head sha
  # stale before it can commit against it — cancel rather than let a stale
  # fix land after a newer one.
  group: fix-installer-sha-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fix:
    name: Fix
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Recompute the checksum
        id: fix
        run: |
          .github/scripts/check-installer-sha.sh --fix
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already matches — nothing to fix."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff
          fi

      - name: Generate GitHub App token
        if: steps.fix.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Pushed via the Contents API (never `git push`): the only way a commit
      # from CI satisfies this repo's required_signatures rule — see the
      # header. `sha` is the CURRENT blob sha at that path on the branch, not
      # the pre-fix content we read locally, so a concurrent push between our
      # checkout and this step fails the API call loudly (409) instead of
      # silently overwriting it.
      - name: Commit the fix onto the Renovate branch
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for file in $(git diff --name-only); do
            case "$file" in
              roles/hermes_agent/defaults/main/10-installer-and-bundles.yml|\
                roles/llamacpp_release/defaults/main/00-release.yml) ;;
              *) echo "Unexpected checksum file: $file" >&2; exit 1 ;;
            esac
            current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${BRANCH}" --jq .sha)
            gh api "repos/${GITHUB_REPOSITORY}/contents/${file}" -X PUT \
              -f message="fix(deps): refresh pinned artifact checksums" \
              -f content="$(base64 -w0 "$file")" \
              -f sha="$current_sha" \
              -f branch="$BRANCH"
          done
