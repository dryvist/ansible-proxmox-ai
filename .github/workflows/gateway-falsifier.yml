---
name: Agentgateway Fixture Falsifier

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/requirements-ci.txt'
      - '.github/workflows/gateway-falsifier.yml'
      - 'integration/agentgateway/**'
      - 'integration/vikunja-read-token/**'
      - 'roles/agentgateway_docker/**'
      - 'tests/agentgateway_docker/**'
  push:
    branches: [main, develop]
    paths:
      - '.github/requirements-ci.txt'
      - '.github/workflows/gateway-falsifier.yml'
      - 'integration/agentgateway/**'
      - 'integration/vikunja-read-token/**'
      - 'roles/agentgateway_docker/**'
      - 'tests/agentgateway_docker/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway-falsifier:
    name: Gateway fixture acceptance
    runs-on: ubuntu-latest
    cache-mode: read
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 10 }}
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install pinned test dependencies
        run: python -m pip install -r .github/requirements-ci.txt

      - name: Check out pinned Agentgateway source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: agentgateway/agentgateway
          ref: ea5608642b9d5c94c5baf5fd9f2f9849b808e963
          path: .agentgateway
          persist-credentials: false

      # The maintained Makefile builds its local testbox image without publishing it.
      - name: Build pinned MCP testbox
        run: make -C .agentgateway/controller testbox-docker IMAGE_REGISTRY=gateway-falsifier

      - name: Run gateway falsifier
        env:
          FALSIFIER_RUNTIME_DIR: ${{ runner.temp }}/gateway-falsifier
        run: python -m pytest -o pythonpath=tests/agentgateway_docker -q -s integration/agentgateway
