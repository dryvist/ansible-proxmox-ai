---
# Exports the repository's lane alias names and checks them against the shared lane contract.

name: Lane Alias Parity

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lane-alias-names:
    name: Export lane alias names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Export lane alias names
        run: python3 tests/llm_router/lane_alias_names.py > lane-alias-parity-apai.json

      - name: Generate the router names this head serves
        run: python3 scripts/generate_servable_aliases.py -o servable-aliases.json

      - name: Upload generated lane alias names
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-alias-names
          path: |
            lane-alias-parity-apai.json
            servable-aliases.json

  # The shared check job sets its own timeout-minutes: 5.
  alias-parity:
    name: Shared lane alias parity
    needs: lane-alias-names
    uses: dryvist/homelab-contracts/.github/workflows/alias-parity.yml@81f378a91457a45cb2249f811f0bf6b9328762e4 # v5.56.0
    with:
      names-artifact: lane-alias-names
      names-files: lane-alias-parity-apai.json
      router-names-file: servable-aliases.json
