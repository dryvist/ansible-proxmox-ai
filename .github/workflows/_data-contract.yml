---
# Local syntax, inventory and role contracts, aggregated by Merge Gate.

name: Data Contract

on:
  workflow_call:
    inputs:
      full_suite:
        type: boolean
        required: true
      pytest_targets:
        type: string
        required: true
      ansible_tests:
        type: string
        required: true
      llm_router_playbooks:
        type: string
        required: true
      run_inventory:
        type: boolean
        required: true
      run_selector_checks:
        type: boolean
        required: true
      timeout_minutes:
        type: number
        default: 10

permissions:
  contents: read

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    # Static placeholders for the required-environment inputs the llm_router
    # role reads. No workflow context or untrusted input is interpolated here.
    # NOT secrets and NOT a bypass: the role's guards still refuse a real
    # converge with these unset, and the tests below render the config rather
    # than reaching any provider.
    env:
      LLM_ROUTER_MASTER_KEY: sk-ci-placeholder-not-a-secret
      LLM_LARGE_BEARER_TOKEN: ci-placeholder-bearer-not-a-secret
      PROXMOX_SUBDOMAIN: pve.example.test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      # pytest joins the existing pip install: the hermes_agent self-checks below
      # use parametrize and raises, so pytest is their runner, not an extra tool.
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-ci.txt

      # Cache Galaxy content keyed on requirements.yml; the install verifies
      # restored dependencies and installs any that are missing.
      # Same key/paths as dryvist/.github's _ansible-ci.yml so a warm run of
      # either workflow warms the other.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible dependencies
        run: |
          ansible-galaxy install -r requirements.yml

      - name: Syntax check playbooks
        run: |
          for playbook in playbooks/*.{yml,yaml}; do
            if [ -f "$playbook" ]; then
              echo "Checking syntax: $playbook"
              ansible-playbook "$playbook" --syntax-check
            fi
          done
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'

      # `lookup('env', 'NAME')` returns '' when unset, never Undefined, so a
      # `| mandatory(...)` guard on one can never fire. The failure is silent
      # and in the dangerous direction: a missing key renders as a deliberately
      # unkeyed tier and the converge stays green.
      - name: Verify required-environment guards actually fire
        if: inputs.full_suite || contains(inputs.ansible_tests, 'tests/repo_guards/test_env_guards_actually_fire.yml')
        run: >-
          ansible-playbook tests/repo_guards/test_env_guards_actually_fire.yml
          -i inventory/hosts.yml -c local

      - name: Verify every optional KV path has a presence-gated consumer
        if: >-
          inputs.full_suite || contains(inputs.ansible_tests,
          'tests/openbao_secrets/test_optional_paths_are_gated.yml')
        run: >-
          ansible-playbook tests/openbao_secrets/test_optional_paths_are_gated.yml
          -i inventory/hosts.yml -c local

      - name: Verify GPU profile inventory switch from capability tags
        if: >-
          inputs.full_suite || contains(inputs.ansible_tests,
          'tests/openbao_secrets/test_gpu_profile_inventory_gate.yml')
        run: >-
          ansible-playbook tests/openbao_secrets/test_gpu_profile_inventory_gate.yml
          -i inventory/hosts.yml -c local

      - name: Verify ungranted apps paths are fetched only when their flag is on
        if: inputs.full_suite || contains(inputs.ansible_tests, 'tests/openbao_secrets/test_ungranted_paths_gated.yml')
        run: >-
          ansible-playbook tests/openbao_secrets/test_ungranted_paths_gated.yml
          -i inventory/hosts.yml -c local

      - name: Verify the Hermes OpenBao view excludes local-llm once its own domain resolves
        if: inputs.full_suite || contains(inputs.ansible_tests, 'tests/openbao_secrets/test_hermes_domain_view.yml')
        run: >-
          ansible-playbook tests/openbao_secrets/test_hermes_domain_view.yml
          -i inventory/hosts.yml -c local
        env:
          CODEX_AUTH_JSON: public-auth-fixture
          HERMES_PRIVATE_CODEX_AUTH_JSON: private-auth-fixture
          HERMES_GITHUB_PRIVATE_VAULT_ROLE_ID: public-role-fixture
          HERMES_GITHUB_PRIVATE_VAULT_SECRET_ID: public-secret-fixture
          HERMES_PRIVATE_GITHUB_PRIVATE_VAULT_ROLE_ID: private-role-fixture
          HERMES_PRIVATE_GITHUB_PRIVATE_VAULT_SECRET_ID: private-secret-fixture

      - name: Verify the source-address tolerance can still fire
        if: inputs.full_suite || contains(inputs.pytest_targets, 'tests/test_openbao_login_classification.py')
        run: python3 tests/test_openbao_login_classification.py -v

      - name: Verify Hermes API key seed contract
        if: inputs.full_suite || contains(inputs.ansible_tests, 'tests/openbao_secrets/verify_hermes_api_key_seed.yml')
        run: >-
          ansible-playbook tests/openbao_secrets/verify_hermes_api_key_seed.yml
          -i inventory/hosts.yml -c local

      # The published alias contract is DERIVED from the registry, so the thing
      # to test is that the generator still parses it and renders the same bytes
      # twice — a checksum on a nondeterministic render is decoration. Runs on
      # every PR so a registry edit that breaks generation fails here rather
      # than at tag time, when the release is already cut.
      - name: Verify the alias contract generates deterministically
        if: inputs.full_suite || inputs.run_selector_checks
        run: |
          python3 scripts/generate_servable_aliases.py -o first.json
          python3 scripts/generate_servable_aliases.py -o second.json
          diff -u first.json second.json
          rm first.json second.json

      # The agent_guest residual deny policy is now RESOLVED from nix-ai rather
      # than committed here, so the risk moved from drift to arriving empty,
      # malformed, or silently weaker — onto an agent that runs unattended with
      # standing credentials and bypassPermissions. This asserts the resolved
      # policy against a golden list frozen at the pre-migration render and
      # proves every artifact renders byte-identically.
      #
      # Needs nix, because it evaluates the pinned ref exactly as the converge
      # does. A variant that read a checked-in copy instead would pass while
      # the converge's own eval was broken, which is the drift this whole
      # change removes — so the installer is the honest cost of the test.
      - name: Install Nix
        if: inputs.full_suite || contains(inputs.ansible_tests, 'tests/agent_guest/test_residual_deny_contract.yml')
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20

      # phoenix_docker renders Authelia SSO env only when a client secret is
      # present, and takes every port from tofu constants. Renders the compose
      # template both ways and asserts the gate flips and no literal port
      # leaked in.
      - name: Verify phoenix_docker compose render contract
        if: inputs.full_suite || contains(inputs.ansible_tests, 'tests/phoenix_docker/test_compose_render.yml')
        run: >-
          ansible-playbook tests/phoenix_docker/test_compose_render.yml
          -i localhost, -c local

      - name: Verify Hindsight model vars are single-sourced and key-scoped
        if: >-
          inputs.full_suite || contains(inputs.ansible_tests,
          'tests/hindsight_docker/test_model_var_confined_to_key_scope.yml')
        run: >-
          ansible-playbook tests/hindsight_docker/test_model_var_confined_to_key_scope.yml
          -i localhost, -c local

      - name: Verify dify_docker database password re-assert
        if: inputs.full_suite || contains(inputs.ansible_tests, 'tests/dify_docker/test_db_password.yml')
        run: >-
          ansible-playbook tests/dify_docker/test_db_password.yml
          -i localhost, -c local

      # A login refused with 401 means the account's stored password drifted
      # from dify_docker_admin_password (setup only runs once, so a stack
      # recreated against an already-provisioned database can carry a
      # password from whenever it was first created). Stubs the console login
      # and the docker CLI — standing up real Dify isn't practical in CI —
      # and proves the real task file: a successful login never touches the
      # account, a 401 gets one native reset then one retry.
      - name: Verify dify_docker login/password-reset contract
        if: inputs.full_suite || contains(inputs.ansible_tests, 'tests/dify_docker/test_admin_password_reset.yml')
        run: >-
          ansible-playbook tests/dify_docker/test_admin_password_reset.yml
          -i localhost, -c local

      - name: Verify agent_guest residual deny contract
        if: inputs.full_suite || contains(inputs.ansible_tests, 'tests/agent_guest/test_residual_deny_contract.yml')
        run: >-
          ansible-playbook tests/agent_guest/test_residual_deny_contract.yml
          -i localhost, -c local

      - name: Verify Stage 0 evaluation reconciliation
        run: >-
          ansible-playbook tests/langfuse_docker/test_stage0_evaluation.yml
          -i localhost, -c local

      - name: Verify code evaluator dispatcher settings
        run: >-
          ansible-playbook tests/langfuse_docker/test_code_eval_dispatcher.yml
          -i localhost, -c local

      - name: Verify code evaluator compose settings
        if: inputs.full_suite || contains(inputs.ansible_tests, 'tests/langfuse_docker/test_code_eval_compose.yml')
        run: >-
          ansible-playbook tests/langfuse_docker/test_code_eval_compose.yml
          -i localhost, -c local

      # A servable GPU profile entry must carry a complete serving floor.
      - name: Verify the GPU serving floor contract
        if: >-
          inputs.full_suite || contains(inputs.ansible_tests,
          'tests/nvidia_gpu_guest/test_floor_required_for_servable.yml')
        run: >-
          ansible-playbook tests/nvidia_gpu_guest/test_floor_required_for_servable.yml
          -i localhost, -c local

      # Shared release downloads derive their proxy from published inventory.
      - name: Verify release proxy endpoints from published inventory
        if: >-
          inputs.full_suite || contains(inputs.ansible_tests,
          'tests/llamacpp_release/verify_inventory_proxy.yml')
        run: >-
          ansible-playbook tests/llamacpp_release/verify_inventory_proxy.yml
          -i localhost, -c local

      # Cache sync with and without a declared model origin; stand-in binaries.
      - name: Verify GPU serving cache sync without a model origin
        if: inputs.full_suite || contains(inputs.ansible_tests, 'tests/nvidia_gpu_guest/test_cache_only_sync.yml')
        run: >-
          ansible-playbook tests/nvidia_gpu_guest/test_cache_only_sync.yml
          -i localhost, -c local

      # assert_hardening.yml pass and fail paths; no packages or live router.
      - name: Verify llamaindex hardening checks fail closed
        if: inputs.full_suite || contains(inputs.ansible_tests, 'tests/llamaindex/test_hardening.yml')
        run: >-
          ansible-playbook tests/llamaindex/test_hardening.yml
          -i localhost, -c local

      # Host contract renderer: the primary-profile unit and the every-profile
      # contract (one unit per enabled profile, only the active one started).
      - name: Verify GPU serving host contract rendering
        if: >-
          inputs.full_suite ||
          contains(inputs.ansible_tests, 'tests/llm_gpu_legacy/test_render_host_contract.yml') ||
          contains(inputs.ansible_tests, 'tests/llm_gpu_legacy/test_render_host_contract_all.yml')
        run: >-
          ansible-playbook tests/llm_gpu_legacy/test_render_host_contract.yml
          tests/llm_gpu_legacy/test_render_host_contract_all.yml
          -i localhost, -c local

      # Every test under tests/; llm_router/ runs in _llm-router-contract.yml;
      # qdrant_llamaindex/ needs live Qdrant + Ollama.
      - name: Run role self-checks
        if: inputs.full_suite || inputs.pytest_targets != '[]'
        env:
          PYTEST_TARGETS: ${{ inputs.pytest_targets }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          targets = json.loads(os.environ['PYTEST_TARGETS'])
          if not targets:
              raise SystemExit('focused pytest selection is empty')
          subprocess.run(
              ['python', '-m', 'pytest', *targets, '-q', '--ignore=tests/llm_router',
               '--ignore=tests/qdrant_llamaindex'], check=True)
          PY

  # The llm_router role's contract checks, in their own file: that list only
  # grows and outgrew this file's token budget. Its result reaches the Merge
  # Gate through this workflow's conclusion.
  llm-router-contract:
    name: LLM Router Contract
    uses: ./.github/workflows/_llm-router-contract.yml
    with:
      full_suite: ${{ inputs.full_suite }}
      playbooks: ${{ inputs.llm_router_playbooks }}
      timeout_minutes: ${{ inputs.timeout_minutes }}

  verify-inventory-load:
    name: Verify Inventory Load
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    if: inputs.full_suite || inputs.run_inventory

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-ci.txt

      # load_tofu.yml (imported by verify_inventory.yml) include_role's the
      # shared inventory_resolve role by FQCN, so this run is what proves the
      # collection actually resolves it. `install` covers both sections of
      # requirements.yml — `collection install` and `role install` each silently
      # ignore the other section and still exit zero.
      # Cache Galaxy content keyed on requirements.yml; the install verifies
      # restored dependencies and installs any that are missing.
      # Same key/paths as dryvist/.github's _ansible-ci.yml so a warm run of
      # either workflow warms the other.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible dependencies
        run: |
          ansible-galaxy install -r requirements.yml

      - name: Verify inventory loads and groups are assigned correctly
        run: |
          ansible-playbook tests/inventory_load/verify_inventory.yml \
            -i inventory/hosts.yml -c local
          ansible-playbook tests/inventory_load/test_ssh_probe_result_selection.yml \
            -i inventory/hosts.yml -c local
        env:
          # Pin the fixture explicitly (resolution priority 1) so the test is
          # hermetic even on a runner with ambient AWS creds — the S3 artifact
          # (priority 2) must never feed a test.
          TOFU_INVENTORY_PATH: ${{ github.workspace }}/tests/inventory_load/tofu_inventory.json
          PROXMOX_SSH_KEY_PATH: /dev/null
          ANSIBLE_HOST_KEY_CHECKING: 'false'
