---
# Repo-specific data-contract checks for ansible-proxmox-ai.
#
# ansible-lint is centralized in dryvist/.github/_ansible-ci.yml. The job here
# asserts THIS repo's data contract — playbook syntax. It is not generic
# ansible CI, so it stays local and is aggregated by the wrapper's
# "Merge Gate".
#
# Two jobs: playbook syntax, and an inventory-load check that runs
# inventory/load_tofu.yml against the committed sample fixture and asserts
# the tag -> group mapping. The inventory SCHEMA itself stays owned upstream
# by ansible-proxmox-apps; this repo is a read-only consumer and only tests
# its own mapping of that contract.

name: Data Contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      # pytest joins the existing pip install: the hermes_agent self-checks below
      # use parametrize and raises, so pytest is their runner, not an extra tool.
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible pytest pyyaml

      - name: Install Ansible dependencies
        run: |
          ansible-galaxy install -r requirements.yml

      - name: Syntax check playbooks
        run: |
          for playbook in playbooks/*.{yml,yaml}; do
            if [ -f "$playbook" ]; then
              echo "Checking syntax: $playbook"
              ansible-playbook "$playbook" --syntax-check
            fi
          done
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'

      - name: Verify Hermes API key seed contract
        run: >-
          ansible-playbook tests/openbao_secrets/verify_hermes_api_key_seed.yml
          -i inventory/hosts.yml -c local

      # Every consumer alias must name a model the serving host will actually
      # serve. On 2026-07-28 all four returned HTTP 404 at once — the serving
      # host runs llama-swap in single-model mode, where a non-resident model is
      # in disabledModels and 404s rather than being served under the wrong
      # weights. Render-time and offline on purpose: the defect was invisible for
      # as long as llama-swap grafted disabled ids onto the resident, so a live
      # probe would have passed while Hermes was answered by a model nobody
      # selected.
      - name: Verify llm_router servable-alias contract
        run: >-
          ansible-playbook tests/llm_router/test_alias_servable.yml
          -i localhost, -c local

      - name: Verify llm_router process-recovery contract
        run: >-
          ansible-playbook tests/llm_router/test_service_restart_policy.yml
          -i localhost, -c local

      # Runnable but never run until now, which made it decorative — the same
      # rot the hermes_agent self-checks below were rescued from. It is also the
      # only llm_router test that inspects the RENDERED config, so the defects
      # it covers (a stale port constant silently re-deriving the standalone
      # port for the cluster entry; a fallback target outside the servable set)
      # were invisible to every check that did run.
      - name: Verify llm_router hermes-default failover contract
        run: >-
          ansible-playbook tests/llm_router/test_hermes_default_failover.yml
          -i localhost, -c local

      # The paid-egress contract: the registry is the allowlist (no
      # `openrouter/*` passthrough), and the spend ceiling is enforced by the
      # router rather than described to the caller. Both failures are silent —
      # the render succeeds either way and neither ansible-lint nor
      # --syntax-check can see them.
      - name: Verify llm_router OpenRouter allowlist and budget contract
        run: >-
          ansible-playbook tests/llm_router/test_openrouter_allowlist.yml
          -i localhost, -c local

      # The pairing invariant itself, proven from both sides: a budget with no
      # store must FAIL the converge, and a store with no budget must pass. This
      # list is enumerated, not globbed, so a test file added without a line
      # here is decorative — the exact rot the hermes-default step above was
      # rescued from. That matters more than usual for this one: the assertion
      # it covers exists specifically to stop an unbacked ceiling being
      # reintroduced, so a version of it that never runs restores the defect
      # while looking like the guard against it.
      - name: Verify llm_router budget/store pairing contract
        run: >-
          ansible-playbook tests/llm_router/test_budget_requires_store.yml
          -i localhost, -c local

      # Pins that every LOCAL deployment carries an in-flight admission cap.
      # Until 2026-08 only the OpenRouter egress tier had rpm/tpm/
      # max_parallel_requests, so LiteLLM admitted every inbound request to
      # local backends unbounded.
      - name: Verify llm_router local admission-cap contract
        run: >-
          ansible-playbook tests/llm_router/test_local_admission_cap.yml
          -i localhost, -c local

      # Pins the registry <-> rendered model_list parity guard
      # (assert-registry-render-parity.yml) — the only check that catches an
      # entry enabled in the registry but absent from the render, or vice
      # versa; every other assert only checks the registry against itself.
      - name: Verify llm_router registry/render parity contract
        run: >-
          ansible-playbook tests/llm_router/test_registry_render_parity.yml
          -i localhost, -c local

      # Pins the heavy-tier serving identity contract: address and hostname
      # come from a published authority, never a value committed here, and
      # their absence is fatal rather than papered over.
      - name: Verify llm_router heavy-tier serving identity contract
        run: >-
          ansible-playbook tests/llm_router/test_serving_identity.yml
          -i localhost, -c local

      # The published alias contract is DERIVED from the registry, so the thing
      # to test is that the generator still parses it and renders the same bytes
      # twice — a checksum on a nondeterministic render is decoration. Runs on
      # every PR so a registry edit that breaks generation fails here rather
      # than at tag time, when the release is already cut.
      - name: Verify the alias contract generates deterministically
        run: |
          python3 scripts/generate_servable_aliases.py -o first.json
          python3 scripts/generate_servable_aliases.py -o second.json
          diff -u first.json second.json
          rm first.json second.json

      # The agent_guest residual deny policy is now RESOLVED from nix-ai rather
      # than committed here, so the risk moved from drift to arriving empty,
      # malformed, or silently weaker — onto an agent that runs unattended with
      # standing credentials and bypassPermissions. This asserts the resolved
      # policy against a golden list frozen at the pre-migration render and
      # proves every artifact renders byte-identically.
      #
      # Needs nix, because it evaluates the pinned ref exactly as the converge
      # does. A variant that read a checked-in copy instead would pass while
      # the converge's own eval was broken, which is the drift this whole
      # change removes — so the installer is the honest cost of the test.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20

      - name: Verify agent_guest residual deny contract
        run: >-
          ansible-playbook tests/agent_guest/test_residual_deny_contract.yml
          -i localhost, -c local

      # The hermes_agent self-checks render the role's Jinja templates and assert
      # the emitted contract. They were runnable-but-unrun until now, which made
      # them decorative; running them here is what stops them rotting. It must be
      # pytest and not a `python3 <file>` loop: two of these files have no
      # __main__ block, so running them as scripts collects nothing and exits 0 —
      # a green light for tests that never ran.
      - name: Run role self-checks
        run: python -m pytest tests/hermes_agent/ tests/llama_cpp/ -q

  verify-inventory-load:
    name: Verify Inventory Load
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      # load_tofu.yml (imported by verify_inventory.yml) include_role's the
      # shared inventory_resolve role by FQCN, so this run is what proves the
      # collection actually resolves it. `install` covers both sections of
      # requirements.yml — `collection install` and `role install` each silently
      # ignore the other section and still exit zero.
      - name: Install Ansible dependencies
        run: |
          ansible-galaxy install -r requirements.yml

      - name: Verify inventory loads and groups are assigned correctly
        run: >-
          ansible-playbook tests/inventory_load/verify_inventory.yml
          -i inventory/hosts.yml -c local
        env:
          # Pin the fixture explicitly (resolution priority 1) so the test is
          # hermetic even on a runner with ambient AWS creds — the S3 artifact
          # (priority 2) must never feed a test.
          TOFU_INVENTORY_PATH: ${{ github.workspace }}/tests/inventory_load/tofu_inventory.json
          PROXMOX_SSH_KEY_PATH: /dev/null
          ANSIBLE_HOST_KEY_CHECKING: 'false'
