---
# Router contract dependencies: one cached virtualenv plus Galaxy content,
# shared by every _llm-router-contract.yml job. A cache miss installs from the
# pinned CI requirements; only the dependencies job saves the cache.
name: Router contract dependencies
description: Restore or install the router contract Python and Ansible dependencies.

inputs:
  save:
    description: Save the cache after a miss.
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: .github/requirements-ci.txt

    - name: Compute router contract cache key
      id: key
      shell: bash
      env:
        PY: ${{ steps.setup-python.outputs.python-version }}
        HASH: ${{ hashFiles('.github/requirements-ci.txt', 'requirements.yml') }}
      run: echo "key=router-contract-deps-v1-$RUNNER_OS-$PY-$HASH" >> "$GITHUB_OUTPUT"

    - name: Restore router contract dependencies
      id: router-deps-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          .venv
          ~/.ansible/collections
          ~/.ansible/roles
        key: ${{ steps.key.outputs.key }}

    - name: Install Python requirements on cache miss
      if: steps.router-deps-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/pip install -r .github/requirements-ci.txt

    - name: Install Ansible dependencies on cache miss
      if: steps.router-deps-cache.outputs.cache-hit != 'true'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        max_attempts: 4
        timeout_minutes: 10
        command: .venv/bin/ansible-galaxy install --force -r requirements.yml
      env:
        ANSIBLE_GALAXY_SERVER_TIMEOUT: "60"

    # The cache key hashes requirements.yml; refresh the same pinned requirements.
    - name: Refresh pinned Galaxy requirements on cache hit
      if: steps.router-deps-cache.outputs.cache-hit == 'true'
      uses: ./.github/actions/refresh-contracts
      with:
        galaxy-executable: .venv/bin/ansible-galaxy

    - name: Save router contract dependencies
      if: inputs.save == 'true' && steps.router-deps-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          .venv
          ~/.ansible/collections
          ~/.ansible/roles
        key: ${{ steps.router-deps-cache.outputs.cache-primary-key }}

    - name: Add the Python environment to PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
