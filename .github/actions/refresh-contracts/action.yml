---
name: Refresh pinned Galaxy requirements
description: Force-refresh pinned Galaxy requirements after restoring cached content.

inputs:
  galaxy-executable:
    description: Ansible Galaxy executable to use.
    default: ansible-galaxy

runs:
  using: composite
  steps:
    - name: Refresh pinned Galaxy requirements
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        max_attempts: 4
        timeout_minutes: 10
        command: '"$GALAXY" collection install -r requirements.yml --force'
      env:
        ANSIBLE_GALAXY_SERVER_TIMEOUT: "60"
        GALAXY: ${{ inputs.galaxy-executable }}
