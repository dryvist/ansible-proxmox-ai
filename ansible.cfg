[defaults]
inventory = inventory/hosts.yml
roles_path = roles
callback_plugins = callback_plugins
# converge_telemetry ships per-host converge-freshness and per-task timing
# events to Splunk HEC at end of run. It stays inert unless the playbook
# publishes its configuration via set_stats (only site.yml does), so
# enabling it here costs nothing elsewhere. ansible.posix.profile_tasks
# gives per-task wall clock on stdout as well.
callbacks_enabled = converge_telemetry, ansible.posix.profile_tasks
host_key_checking = True
deprecation_warnings = True
retry_files_enabled = False
# The execution plane runs every converge in one memory-capped container
# and can run two repositories' templates at once. That cap supports about
# sixteen workers total, so this stays at eight to leave the other run its
# half. Workstation runs pass --forks explicitly and are unaffected.
forks = 8
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600
# NOTE: allow_world_readable_tmpfiles = True is disabled for security
# If plugins fail due to permission issues, investigate root cause rather than
# globally disabling file permissions. This setting exposes sensitive data in tmp files.
# allow_world_readable_tmpfiles = True

[inventory]
enable_plugins = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

[proxmox_pct_remote_connection]
pipelining = False

[paramiko_connection]
# The automation SSH certificates omit permit-pty. The PCT connection only
# needs an exec channel, so requesting a PTY makes the node's SSH server close
# the channel right after a successful authentication.
pty = False
