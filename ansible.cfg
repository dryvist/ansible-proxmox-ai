[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
deprecation_warnings = True
retry_files_enabled = False
# The execution plane runs every converge in one memory-capped container
# and can run two repositories' templates at once. That cap supports about
# sixteen workers total, so this stays at eight to leave the other run its
# half. Workstation runs pass --forks explicitly and are unaffected.
forks = 8
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600
# NOTE: allow_world_readable_tmpfiles = True is disabled for security
# If plugins fail due to permission issues, investigate root cause rather than
# globally disabling file permissions. This setting exposes sensitive data in tmp files.
# allow_world_readable_tmpfiles = True
# Traces every converge run as an OTLP span (community.general >=10.3.0,
# pinned in requirements.yml). Native callback, no custom plugin.
# profile_tasks (ansible.posix, pinned in requirements.yml) prints each
# task's wall time in the run's own output, so a slow step shows up without a
# second tool.
callbacks_enabled = community.general.opentelemetry, ansible.posix.profile_tasks

[inventory]
enable_plugins = yaml

[callback_opentelemetry]
# The value is the NAME of an env var the plugin checks for existence, not a
# boolean — a workstation run without it set stays silent; the execution
# plane sets it from its own run environment.
enable_from_environment = ANSIBLE_OPENTELEMETRY_ENABLED
# Secrets safety: task arguments can carry credentials.
hide_task_arguments = true
otel_service_name = ansible-proxmox-ai
# The Cribl OTLP receiver ai_orchestration_otel_endpoint points at speaks
# OTLP/HTTP, not the plugin's grpc default.
otel_exporter_otlp_traces_protocol = http/protobuf

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

[proxmox_pct_remote_connection]
pipelining = False

[paramiko_connection]
# The automation SSH certificates omit permit-pty. The PCT connection only
# needs an exec channel, so requesting a PTY makes the node's SSH server close
# the channel right after a successful authentication.
pty = False
