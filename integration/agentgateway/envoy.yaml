---
admin:
  access_log_path: /dev/null
  address:
    pipe:
      path: /run/envoy/admin.sock
      mode: 511

static_resources:
  listeners:
    - name: mcp_observer
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8002
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": >-
                  type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mcp_observer
                codec_type: AUTO
                route_config:
                  name: testbox_route
                  virtual_hosts:
                    - name: testbox
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: testbox
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.tap
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.tap.v3.Tap
                      common_config:
                        static_config:
                          match_config:
                            any_match: true
                          output_config:
                            max_buffered_rx_bytes: 1048576
                            max_buffered_tx_bytes: 1048576
                            sinks:
                              - format: JSON_BODY_AS_STRING
                                file_per_tap:
                                  path_prefix: /tap/trace
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: testbox
      type: STRICT_DNS
      connect_timeout: 2s
      dns_refresh_rate: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: testbox
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: testbox
                      port_value: 8000
