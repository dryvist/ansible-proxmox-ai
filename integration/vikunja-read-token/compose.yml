---
services:
  vikunja:
    image: vikunja/vikunja:2.7.1@sha256:f7dc8428d10aef17f3075886d3c1c022f566ec456f88985f02c137f4fc534576
    restart: "no"
    environment:
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /tmp/vikunja.db
      VIKUNJA_FILES_BASEPATH: /tmp/files
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
      VIKUNJA_SERVICE_ENABLEEMAILREMINDERS: "false"
      VIKUNJA_CORS_ENABLE: "false"
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT_SECRET:?generated by the pytest fixture}
    ports:
      - "127.0.0.1::3456"
    networks:
      - fixture

networks:
  fixture:
    name: ${FIXTURE_NETWORK:?generated by the pytest fixture}
