  # once a backend actually answers for this id.
  - client_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }

  # NOT SERVED (live 404, verified 2026-08-14) — disabled rather than
  # advertised. Re-enable only once a backend actually answers for this id.
  - client_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 65536

  # NOT SERVED (live 404, verified 2026-08-14) — disabled rather than
  # advertised. Re-enable only once a backend actually answers for this id.
  - client_model_id: mlx-community/Qwen3.6-27B-mxfp4
    upstream_model_id: mlx-community/Qwen3.6-27B-mxfp4
    provider: openai
    tier: large
    enabled: false
    context_window: 65536

  # Local complexity router; tier targets derive from serving_role entries.
  - client_model_id: hermes-default
    upstream_model_id: complexity_router
    litellm_model_name: auto_router/complexity_router
    provider: auto_router
    tier: hermes-router
    enabled: true
    context_window: 65536
    max_output_tokens: 8192

  # ── light tier ──────────────────────────────────────────────────────────────
  # The llama-swap model names, served as-is. Each becomes TWO same-name
  # deployments (GPU box + CPU standby) so LiteLLM load-balances the pair and
  # cools a failed deployment down — a GPU outage drains to CPU automatically.
  - client_model_id: qwen3-4b
    upstream_model_id: qwen3-4b
    provider: openai
    tier: light
    enabled: true

  - client_model_id: embeddings
    upstream_model_id: embeddings
    provider: openai
    tier: light
    enabled: true
    embedding: true

  # ── NVIDIA GPU tier ─────────────────────────────────────────────────────────
  # The tier key stays `vllm`: it names the ROUTER TIER and its base URL, not
  # the engine. This guest serves with llama.cpp on Vulkan; roles/vllm/defaults
  # records why vLLM cannot read these weights and why "no Linux CUDA binary"
  # does NOT rule llama.cpp out. Do not re-derive either.
  #
  # upstream_model_id is the name the serving host answers to — for llama-swap,
  # the model's `name` — so this must match
  # inventory/group_vars/llm_vllm_group.yml.
  - client_model_id: qwen3.8-27b
    upstream_model_id: qwen3.8-27b
    provider: openai
    tier: vllm
    enabled: true
    context_window: 16384

  # Same 4080 backend as the physical entry above, wired into the Hermes
  # fallback chain rather than left reachable only from Open WebUI. It is the
  # local backup to the Mac primary — one more free, on-network attempt before
  # any request pays for a cloud token. Registry order is what makes it a
  # backup rather than a peer: it sits directly after the Mac tiers and before
  # every paid leg below, so it is tried second, not load-balanced against.
  #
  # Its fail-fast fields say "available or busy", never "retry me": zero
  # retries, a short per-attempt timeout, and cooldown_time: 0 so a busy
  # answer never benches the deployment — the next request gets to try it
  # fresh instead of waiting out a manufactured cooldown window. There is
  # nothing here to back off from; a single GPU either has a free slot or it
  # does not.
  #
  # context_window is 16384, not the Mac primary's 65536, and that gap is
  # deliberate rather than a smaller catalog window: enable_pre_call_checks
  # makes LiteLLM skip any deployment whose advertised window cannot hold the
  # request, so this leg self-selects for short requests only and a long one
  # falls straight through to the leg below without wasting an attempt here.
  #
  # `tier: hermes-local`, NOT `vllm`, and the distinction is load-bearing. The
  # plain `vllm` entry above is the physical deployment Open WebUI already
  # calls; this is a separate routing role over the same backend, and it needs
  # a tier view of its own for one reason: the cloud projection drops any entry
  # whose credential is absent, and a local leg has no credential. Filtering it
  # that way would silently render nothing — the failure this whole tier exists
  # to avoid. Both tiers render against the same vLLM base URL; no second URL
  # variable exists or should.
  - client_model_id: hermes-local-4080
    upstream_model_id: qwen3.8-27b
    provider: openai
    tier: hermes-local
    route_group: hermes-local-4080
    fallback_group: hermes-local-4080
    enabled: true
    context_window: 16384
    num_retries: 0
    request_timeout: 20
    stream_timeout: 10
    allowed_fails: 50
    # cooldown_time: 0 is the INTENT (never park this rung), not the observed
    # behaviour. Measured 2026-08-22: saturating this deployment until every
    # in-flight call hit the 20s timeout parked it anyway, and the next call
    # returned "No deployments available ... Try again in 30 seconds" — the
    # proxy's own default cooldown, applied because 0 does not read as
    # "disabled" here. It self-clears: the same call succeeded 40s later.
    #
    # Impact is bounded and was left as-is deliberately. This is a FALLBACK
    # rung, not the primary; the primary answered normally throughout, with
    # zero attempted fallbacks. A parked rung means the chain skips to the
    # next one for 30s, which is the chain working. Do not "fix" this by
    # widening allowed_fails — 50 was never the binding constraint here.
    cooldown_time: 0

  # OpenRouter's `@preset/best-free` Preset — a named, server-side config the
  # human edits in OpenRouter's dashboard, so the model behind it changes with
  # no code change here. Never write a concrete model id in its place; the
  # preset IS the pointer.
  #
  # This entry and `best-free` (openrouter tier, below) deliberately name the
  # same preset twice: this doctrine's own rule is that a model name written
  # twice is the defect the registry exists to remove, so it earns a comment
  # both places rather than a silent exception. They differ in tier and
  # routing role, not target — this one is the free rung of the Hermes
  # fallback chain (after the local legs, before the paid alibaba/gemini/
  # openrouter legs below), the other is a plain-tier handle a caller can name
  # directly. Neither is an alias of the other because an alias may point only
  # at a first-class large-tier entry (schema, `stable_aliases`); an
  # openrouter-tier entry can never be one.
  #
  # context_window: 131072, not the preset's real ~1,048,576 window: this
  # field is the EFFECTIVE SERVING window advertised to callers, and matching
  # the other cloud legs' figure keeps the fallback chain a homogeneous
  # provider-diverse ladder rather than one leg answering a different capacity
  # class than the rest.
  #
  # No monthly_budget: a free preset has no spend to bound, and
  # assert-budget-backing.yml only fires when a budget is set with no Redis
  # store behind it — an absent budget here is simply unused, not dishonest.
  - client_model_id: hermes-cloud-free
    upstream_model_id: '@preset/best-free'
    litellm_model_name: openrouter/@preset/best-free
    provider: openrouter
    tier: hermes-cloud
    route_group: hermes-cloud-free
    fallback_group: hermes-cloud-free
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # zero_data_retention is deliberately FALSE here and true everywhere else.
    # ZDR filters out any upstream that retains prompts, and the free models
    # this preset exists to reach do retain them — a ZDR-constrained request
    # can only ever be served by the subset that does not, which is not what
    # this rung is for. Operator decision, 2026-08-22: no ZDR on the free
    # preset; zdr stays true on every paid leg and on the provider wildcard.
    #
    # The trade is explicit and was chosen deliberately: this rung sends
    # prompts to an upstream that may retain them. It is the free tier, it
    # sits behind both local tiers, and it is never the primary. Anything
    # that must not leave a retention-free path uses a different rung.
    #
    # NOT the reason: this rung's intermittent upstream 429s and timeouts.
    # Those were measured against the preset directly with each provider
    # constraint applied in isolation (none / data_collection only / zdr only
    # / the full block) and all four behaved identically — the shared free
    # pool is simply rate-limited some of the time. Changing zdr does not fix
    # that and was never expected to; the fallback chain is what covers it.
    zero_data_retention: false

  # Hermes provider-diverse value fallbacks; one credential per provider.
  - client_model_id: hermes-cloud-alibaba
    upstream_model_id: complexity_router
    litellm_model_name: auto_router/complexity_router
    provider: auto_router
    tier: hermes-cloud-router
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    routine_model: hermes-cloud-alibaba-routine
    agentic_model: hermes-cloud-alibaba-agentic
    credential_env: DASHSCOPE_API_KEY
    key_field: DASHSCOPE_API_KEY

