---
# THE MODEL REGISTRY — the single place any model name, alias, tier, or
# enabled/disabled state is written for the whole AI fabric. Everything
# downstream DERIVES from this file: roles/llm_router/defaults/ projects these
# entries into the role's tier views, and templates/config.yaml.j2 renders the
# LiteLLM `model_list` + `router_settings.model_group_alias` from those. A
# model name written twice is the defect class this file exists to remove.
#
# PURE DATA, DELIBERATELY — no Jinja, no host/port/URL literals, no secrets;
# topology values stay in the role, selected by `tier`/`endpoint` below.
#
# Field reference and the "why" behind PURE DATA: docs/LLM_MODELS_SCHEMA.md.
# Per-entry incident history and selection rationale:
# docs/LLM_MODELS_REGISTRY_NOTES.md. Both split out of here to keep this data
# file under the repo's per-file token budget — the same reason applies to the
# next long note anyone wants to add: write it there, leave a pointer here.
#

llm_router_model_registry:
  # ── large tier ──────────────────────────────────────────────────────────────
  # The mlx-community models on the neutral large-tier runner, bearer-authed.
  # One deployment each, registered under the backend's own model id (the
  # serving gate lists models under their full MLX repo ids) — no alias names.
  # No cross-tier fallback. Native windows for reference: gpt-oss 131072,
  # Qwen3* 262144; the served values below are deliberately smaller.
  - client_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    upstream_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    provider: openai
    tier: large
    enabled: true
    context_window: 32768

  - client_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 32768

  # THE PRIMARY, since 2026-08-14. The serving host now holds TWO models warm
  # (dryvist/nix-darwin lib/hosts/mac-studio.nix, "Two warm brains"): a dense 27B
  # for deliberate work and the 35B MoE below for routine work. This entry is the
  # deliberate one, so the consumer aliases resolve here.
  #
  # 65536 matches its resident profile in nix-ai catalog-data.nix
  # (cacheMemoryMb = 16384, maxRequestTokens = 65536). Advertising half the real
  # window does not protect anything — it just makes Hermes auto-compact at 24.5K
  # (75% of 32768) when ~49K is actually available.
  #
  # THINKING IS ON for this model, configured serving-side: the catalog passes
  # --chat-template-args {"reasoning_effort":"medium"} and this registry does not
  # restate it. That is deliberate — sampling/serving posture belongs to whoever
  # launches the worker, and a second spelling here is the drift this file
  # exists to remove. Unset, the model's own template defaults the effort to
  # `xhigh`, which measured 0 answer characters on 3 of 3 runs; `medium` answers
  # and finishes. It is a prompt string, not a budget, so responses are longer
  # and slower than the 35B's — that is the point of a deliberate tier, and the
  # router's own request budget (ai_router_request_timeout_seconds 2400,
  # ai_stream_read_timeout_seconds 1800) already covers minutes-long answers.
  #
  # Its aliases are the fabric's stable consumer handles. `interim-brain` is a
  # handle so hermes_brain_model (or secret/ai/public/brain) can repoint in one
  # line; it tracks the primary rather than naming its own model, because a
  # second physical id there is exactly the drift this registry prevents.
  - client_model_id: mlx-community/Qwen3.8-27B-4bit
    upstream_model_id: mlx-community/Qwen3.8-27B-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    servable: true
    serving_role: primary
    stable_aliases:
      - hermes-default
      - tool-calling
      - interim-brain

  # THE ROUTINE TIER — the second warm model, resident beside the primary rather
  # than swapping against it (nix-darwin maxResidentWorkers = 2). It held
  # `serving_role: primary` and all three consumer aliases until 2026-08-14; both
  # moved to the 27B above and this entry stayed servable, because it is: the
  # host serves it, verified from the worker's own command line at converge.
  #
  # It carries a serving_role rather than none so the registry's real invariant
  # still holds — servable if and only if the entry names the role it serves in.
  # Nothing selects `routine` today; it is a name for a fact, not a switch. Its
  # 65536 window is the same resident profile figure as the primary's.
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    servable: true
    serving_role: routine

  # THE SMALL TIER — the on-demand 9B that stays servable beside the two warm
  # models and never evicts either. goal-judge points here, cross-family to the
  # primary on purpose. 32768 is the small-cache tier figure, matching the swap
  # flags it loads under. Why it is a first-class entry, why the judge does not
  # ride the worker's model, and the measured ~79s cold-load correction:
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  - client_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 32768
    servable: true
    serving_role: small
    stable_aliases:
      - goal-judge

  # OptiQ-4bit: the agentic-bench-winning brain (ai_default_model, all.yml). A
  # first-class entry — NOT passthrough — so the default model carries an
  # explicit max_input_tokens rather than falling through the "*" wildcard to a
  # null one. The repetition_penalty is the anti-repetition-loop fix, and
  # `standby` marks it as the entry that gets a failover sibling: both, and why
  # temperature is deliberately not pinned, in
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }
    standby: true

  # Qwen3-Next-80B Thinking: served from the nix-ai catalog swap tier, loaded on
  # demand — the escalation rubric's deep-analysis tier (ai_escalation_rubric,
  # all.yml) requests it by this real id.
  - client_model_id: mlx-community/Qwen3-Next-80B-A3B-Thinking-4bit
    upstream_model_id: mlx-community/Qwen3-Next-80B-A3B-Thinking-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 32768
    extra_body: { repetition_penalty: 1.05 }

  # Instruct sibling: the fleet brain (ai_default_model) since 2026-07-17 —
  # agentic-bench winner, resident on the serving host with a 65536 window (also
  # Hermes' compression model, which hard-requires >=64K).
  - client_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }

  # Hermes' stable default target. The 65,536-token input contract passed a
  # direct production-profile mlx_lm probe before this alias was enabled.
  - client_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536

  # Resident serialized goal judge.
  - client_model_id: mlx-community/Qwen3.6-27B-mxfp4
    upstream_model_id: mlx-community/Qwen3.6-27B-mxfp4
    provider: openai
    tier: large
    enabled: true
    context_window: 65536

  # The two-Mac cluster brain (JACCL pipeline across both Macs, ~256 GB
  # combined), served by mlx-lm rank 0 behind the gate's own cluster TLS site — a
  # DIFFERENT port on the same host, hence `endpoint: cluster`. Reachable only
  # while a cluster window is up (cable in); normal serving quiesces during
  # windows, so this entry is what keeps a brain reachable then. It is
  # hermes-default's fallback target and carries NO stable_aliases by design.
  #
  # `servable` moves ONLY together with llm_router_cluster_leg_available in
  # roles/llm_router/defaults/main/50-servable.yml —
  # tasks/assert-cluster-leg.yml fails the converge if the two disagree.
  # Why, and the month-long drift that motivated it:
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  - client_model_id: mlx-community/GLM-4.7-REAP-50-mxfp4
    upstream_model_id: mlx-community/GLM-4.7-REAP-50-mxfp4
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    servable: true
    serving_role: cluster
    endpoint: cluster
    extra_body: { repetition_penalty: 1.05 }

  # ── light tier ──────────────────────────────────────────────────────────────
  # The llama-swap model names, served as-is. Each becomes TWO same-name
  # deployments (GPU box + CPU standby) so LiteLLM load-balances the pair and
  # cools a failed deployment down — a GPU outage drains to CPU automatically.
  - client_model_id: qwen3-4b
    upstream_model_id: qwen3-4b
    provider: openai
    tier: light
    enabled: true

  - client_model_id: embeddings
    upstream_model_id: embeddings
    provider: openai
    tier: light
    enabled: true
    embedding: true

  # ── OpenRouter egress tier (paid SaaS) ──────────────────────────────────────
  # Served under their REAL upstream ids. NEVER part of any fallback chain — a
  # flaky or rate-limited upstream must not be able to degrade the local brain;
  # consumers opt in by requesting the id explicitly.
  #
  # THIS LIST IS THE EGRESS ALLOWLIST: an entry with a seeded key_field is the
  # only way a model becomes reachable. One key per model in OpenBao under
  # secrets-external/ai/saas/openrouter; keys are account-wide, there is no
  # router-enforced spend cap, and the :free variant is logged by the vendor.
  # Full disclosure and the rate-vs-spend distinction:
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  - client_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    upstream_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1000000
    key_field: nvidia-nemotron-3-ultra-550b-a55b-free

  # Cheap paid egress: efficiency-optimized MoE. The workhorse escalation.
  - client_model_id: deepseek/deepseek-v4-flash
    upstream_model_id: deepseek/deepseek-v4-flash
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1000000
    key_field: deepseek-deepseek-v4-flash

  # MiniMax, TWO entries deliberately — m2.5 is the cheap default and m3 the
  # long-context one, so a caller taking the cheapest tier that can do the job
  # is not forced to pay for a shape it does not need. Both windows are the
  # catalog's real serving windows, not round numbers. The selection, the
  # pricing table, and why an inflated window is the compress-death failure:
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  #
  # Inert until `minimax-minimax-m2-5` and `minimax-minimax-m3` are seeded under
  # secrets-external/ai/saas/openrouter — an unseeded key_field renders no entry
  # at all, which is what makes both safe to land ahead of the secrets.
  - client_model_id: minimax/minimax-m2.5
    upstream_model_id: minimax/minimax-m2.5
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 204800
    key_field: minimax-minimax-m2-5

  - client_model_id: minimax/minimax-m3
    upstream_model_id: minimax/minimax-m3
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1048576
    key_field: minimax-minimax-m3
