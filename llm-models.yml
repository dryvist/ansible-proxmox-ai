  # ── OpenRouter egress tier (paid SaaS) ──────────────────────────────────────
  # Explicit opt-in allowlist sharing one OpenRouter provider credential.
  #
  # `best-free`: a stable, callable handle for the same `@preset/best-free`
  # preset served into the Hermes fallback chain as `hermes-cloud-free` above
  # — same target, deliberately named twice for the reason documented there.
  # It carries no `stable_aliases` on purpose: roles/llm_router/tasks/assert.yml
  # requires every alias target to be both in llm_router_servable_models and a
  # first-class large-tier entry, and an alias pointing at an openrouter-tier
  # entry fails both checks. Those asserts are correct — on 2026-07-28 every
  # consumer alias 404'd at once from exactly this kind of gap — so this entry
  # gets a plain, memorable client_model_id instead of weakening the guard.
  #
  # context_window: 131072, matching `hermes-cloud-free`'s note above — the
  # effective serving figure this registry advertises, not the preset's real
  # window.
  - client_model_id: best-free
    upstream_model_id: '@preset/best-free'
    litellm_model_name: openrouter/@preset/best-free
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 131072
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY

  - client_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    upstream_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1000000
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY

  # Cheap paid egress: efficiency-optimized MoE. The workhorse escalation.
  - client_model_id: deepseek/deepseek-v4-flash
    upstream_model_id: deepseek/deepseek-v4-flash
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1000000
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY

  # MiniMax, TWO entries deliberately — m2.5 is the cheap default and m3 the
  # long-context one, so a caller taking the cheapest tier that can do the job
  # is not forced to pay for a shape it does not need. Both windows are the
  # catalog's real serving windows, not round numbers. The selection, the
  # pricing table, and why an inflated window is the compress-death failure:
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  #
  # Inert until the provider credential is seeded. A missing provider key
  # renders no OpenRouter entry, so model additions can land safely first.
  - client_model_id: minimax/minimax-m2.5
    upstream_model_id: minimax/minimax-m2.5
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 204800
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY

