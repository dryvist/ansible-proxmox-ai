---
# Canonical model, alias, tier, and enablement data. Role defaults project the
# views rendered by config.yaml.j2. Schema and rationale live under docs/.

llm_router_model_registry:
  # ── large tier ──────────────────────────────────────────────────────────────
  # Disabled = unadvertised until normal registry probes pass.
  - client_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    upstream_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    provider: openai
    tier: large
    enabled: false
    context_window: 32768

  # NOT SERVED (404, verified 2026-08-14) — re-enable once a backend answers.
  - client_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 32768

  # Primary model; selection rationale: docs/.
  - client_model_id: mlx-community/Qwen3.8-27B-4bit
    upstream_model_id: mlx-community/Qwen3.8-27B-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    servable: true
    serving_role: primary
    stable_aliases:
      - tool-calling
      - interim-brain

  # THE ROUTINE TIER — second warm model, resident beside the primary; also
  # the universal judge since 2026-08-15. docs/LLM_MODELS_REGISTRY_NOTES.md.
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    servable: true
    serving_role: routine
    stable_aliases:
      - goal-judge

  # THE SMALL TIER — on-demand 9B, trivial-task tier an hourly note-capture
  # pipe calls by id (held goal-judge until 2026-08-15). docs/LLM_MODELS_REGISTRY_NOTES.md.
  - client_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 32768
    servable: true
    serving_role: small

  - client_model_id: mlx-community/Unlimited-OCR-bf16
    upstream_model_id: mlx-community/Unlimited-OCR-bf16
    provider: openai
    tier: large
    enabled: true
    context_window: 32768
    servable: true
    serving_role: ocr
    stable_aliases:
      - Unlimited OCR

  # Context/sampling data retained while disabled.
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }
    standby: true

  # NOT SERVED — re-enable once a backend serves this id and checks pass.
  - client_model_id: mlx-community/Qwen3-Next-80B-A3B-Thinking-4bit
    upstream_model_id: mlx-community/Qwen3-Next-80B-A3B-Thinking-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 32768
    extra_body: { repetition_penalty: 1.05 }

  # NOT SERVED (404, verified 2026-08-14) — formerly ai_default_model; re-enable once a backend answers.
  - client_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }

  # Both below: NOT SERVED (404, verified 2026-08-14) — re-enable once a backend answers.
  - client_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 65536

  - client_model_id: mlx-community/Qwen3.6-27B-mxfp4
    upstream_model_id: mlx-community/Qwen3.6-27B-mxfp4
    provider: openai
    tier: large
    enabled: false
    context_window: 65536

  # Local complexity router; targets derive from serving_role entries.
  - client_model_id: hermes-default
    upstream_model_id: complexity_router
    litellm_model_name: auto_router/complexity_router
    provider: auto_router
    tier: hermes-router
    enabled: true
    context_window: 65536
    max_output_tokens: 8192

  # ── light tier ──────────────────────────────────────────────────────────────
  # llama-swap model names, served as-is. Each becomes TWO same-name
  # deployments (GPU + CPU standby); LiteLLM load-balances and cools a failed
  # one down — a GPU outage drains to CPU automatically.
  - client_model_id: qwen3-4b
    upstream_model_id: qwen3-4b
    provider: openai
    tier: light
    enabled: true

  - client_model_id: embeddings
    upstream_model_id: embeddings
    provider: openai
    tier: light
    enabled: true
    embedding: true

  # ── NVIDIA GPU tier ─────────────────────────────────────────────────────────
  # Tier key stays `vllm` (names the ROUTER TIER/URL, not the engine) — this
  # guest serves via llama.cpp on Vulkan (roles/vllm/defaults has why). Must
  # match llama-swap's name in inventory/group_vars/llm_vllm_group.yml.
  # Window/timeout anchors; guest derives too. Why: llm_vllm_group.yml.
  - client_model_id: qwen3.8-27b
    upstream_model_id: qwen3.8-27b
    provider: openai
    tier: vllm
    enabled: true
    context_window: &ctx4080 32768

  # Local backup rung in the Hermes chain, same backend as the vllm entry.
  # tier: hermes-local, NOT vllm — load-bearing: the cloud projection drops
  # entries with no credential, and a local leg has none. Details: docs/LLM_MODELS_REGISTRY_NOTES.md.
  - client_model_id: hermes-local-4080
    upstream_model_id: qwen3.8-27b
    provider: openai
    tier: hermes-local
    route_group: hermes-local-4080
    fallback_group: hermes-local-4080
    enabled: true
    context_window: *ctx4080
    num_retries: 0
    request_timeout: &to4080 300
    stream_timeout: *to4080
    allowed_fails: 50
    # 0 is the intent, not the observed behaviour: the proxy still parks this
    # deployment 30s after repeated timeouts, self-clearing. Do not widen
    # allowed_fails instead — it was never the binding constraint.
    cooldown_time: 0

  # `@preset/best-free` is server-side (OpenRouter dashboard) — never write a
  # concrete id here. Naming/alias rationale: docs/LLM_MODELS_REGISTRY_NOTES.md.
  # context_window is the EFFECTIVE SERVING window advertised to callers, not
  # the preset's real (larger) one.
  - client_model_id: hermes-cloud-free
    upstream_model_id: '@preset/best-free'
    litellm_model_name: openrouter/@preset/best-free
    provider: openrouter
    tier: hermes-cloud
    route_group: hermes-cloud-free
    fallback_group: hermes-cloud-free
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # False here (true elsewhere) — operator decision: ZDR would exclude the
    # very upstream this free rung exists to reach. NOT the cause of the
    # intermittent upstream 429s (measured separately per provider). Details:
    # docs/LLM_MODELS_REGISTRY_NOTES.md.
    zero_data_retention: false

  # Hermes value fallbacks; one credential per provider.
  - client_model_id: hermes-cloud-alibaba
    upstream_model_id: complexity_router
    litellm_model_name: auto_router/complexity_router
    provider: auto_router
    tier: hermes-cloud-router
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    routine_model: hermes-cloud-alibaba-routine
    agentic_model: hermes-cloud-alibaba-agentic
    credential_env: DASHSCOPE_API_KEY
    key_field: DASHSCOPE_API_KEY

  - client_model_id: hermes-cloud-alibaba-qwen3.5-flash
    upstream_model_id: qwen3.5-flash
    litellm_model_name: dashscope/qwen3.5-flash
    provider: dashscope
    tier: hermes-cloud
    route_group: hermes-cloud-alibaba-routine
    fallback_group: hermes-cloud-alibaba
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.0000001
    output_cost_per_token: 0.0000004
    credential_env: DASHSCOPE_API_KEY
    key_field: DASHSCOPE_API_KEY
    api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    monthly_budget: 1.665

  - client_model_id: hermes-cloud-alibaba-qwen3.6-flash
    upstream_model_id: qwen3.6-flash
    litellm_model_name: dashscope/qwen3.6-flash
    provider: dashscope
    tier: hermes-cloud
    route_group: hermes-cloud-alibaba-agentic
    fallback_group: hermes-cloud-alibaba
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.00000025
    output_cost_per_token: 0.0000015
    credential_env: DASHSCOPE_API_KEY
    key_field: DASHSCOPE_API_KEY
    api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    monthly_budget: 1.665

  - client_model_id: hermes-cloud-gemini
    upstream_model_id: complexity_router
    litellm_model_name: auto_router/complexity_router
    provider: auto_router
    tier: hermes-cloud-router
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    routine_model: hermes-cloud-gemini-routine
    agentic_model: hermes-cloud-gemini-agentic
    credential_env: GEMINI_API_KEY
    key_field: GEMINI_API_KEY

  - client_model_id: hermes-cloud-gemini-3.5-flash-lite
    upstream_model_id: gemini-3.5-flash-lite
    litellm_model_name: gemini/gemini-3.5-flash-lite
    provider: gemini
    tier: hermes-cloud
    route_group: hermes-cloud-gemini-routine
    fallback_group: hermes-cloud-gemini
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.0000003
    output_cost_per_token: 0.0000025
    credential_env: GEMINI_API_KEY
    key_field: GEMINI_API_KEY
    monthly_budget: 1.665

  - client_model_id: hermes-cloud-gemini-3.7-flash
    upstream_model_id: gemini-3.7-flash
    litellm_model_name: gemini/gemini-3.7-flash
    provider: gemini
    tier: hermes-cloud
    route_group: hermes-cloud-gemini-agentic
    fallback_group: hermes-cloud-gemini
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.00000075
    output_cost_per_token: 0.00000375
    credential_env: GEMINI_API_KEY
    key_field: GEMINI_API_KEY
    monthly_budget: 1.665

  - client_model_id: hermes-cloud-openrouter-kimi-k2.6
    upstream_model_id: moonshotai/kimi-k2.6
    litellm_model_name: openrouter/moonshotai/kimi-k2.6
    provider: openrouter
    tier: hermes-cloud
    route_group: hermes-cloud-openrouter
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.0000006
    output_cost_per_token: 0.00000341
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    monthly_budget: 1.67

  - client_model_id: hermes-cloud-openrouter-glm-5.2
    upstream_model_id: z-ai/glm-5.2
    litellm_model_name: openrouter/z-ai/glm-5.2
    provider: openrouter
    tier: hermes-cloud
    route_group: hermes-cloud-openrouter
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.0000007308
    output_cost_per_token: 0.000002297
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    monthly_budget: 1.67

  # ── OpenRouter egress tier (paid SaaS) ──────────────────────────────────────
  # Explicit opt-in allowlist, one shared provider credential. `best-free`:
  # callable handle for the hermes-cloud-free preset — see that entry.
  - client_model_id: best-free
    upstream_model_id: '@preset/best-free'
    litellm_model_name: openrouter/@preset/best-free
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 131072
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY

  - client_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    upstream_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1000000
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY

  # Cheap paid egress: efficiency-optimized MoE workhorse escalation.
  - client_model_id: deepseek/deepseek-v4-flash
    upstream_model_id: deepseek/deepseek-v4-flash
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1000000
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY

  # MiniMax, TWO entries deliberately (m2.5 cheap default, m3 long-context) —
  # inert until the provider key is seeded. Selection/pricing:
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  - client_model_id: minimax/minimax-m2.5
    upstream_model_id: minimax/minimax-m2.5
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 204800
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY

  # Own key_field: this provider's spend and retention stay separable from the
  # shared OpenRouter credential, and the entry is inert until it is seeded.
  # `subagent` is a ROLE, seeded into the database — see 50-servable.yml.
  - client_model_id: ox-alpha
    upstream_model_id: stealth/ox-alpha
    litellm_model_name: openrouter/stealth/ox-alpha
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1048576
    max_output_tokens: 131072
    credential_env: OX_ALPHA_API_KEY
    key_field: OX_ALPHA_API_KEY
    stable_aliases:
      - subagent

  - client_model_id: minimax/minimax-m3
    upstream_model_id: minimax/minimax-m3
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1048576
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
