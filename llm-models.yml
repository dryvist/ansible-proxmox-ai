---
# THE MODEL REGISTRY — the single place any model name, alias, tier, or
# enabled/disabled state is written for the whole AI fabric.
#
# Everything downstream DERIVES from this file and nothing re-spells a model
# name: roles/llm_router/defaults/main.yml projects these entries into the
# role's tier views and selector vars, and templates/config.yaml.j2 renders the
# LiteLLM `model_list` + `router_settings.model_group_alias` from those. A model
# name written twice is the defect class this file exists to remove — on
# 2026-07-28 every consumer alias in the router pointed at something the serving
# host does not serve (four simultaneous live 404s) precisely because the alias
# map and the serving host's enabled set had no shared definition.
#
# PURE DATA, DELIBERATELY. No Jinja, no host/port/URL literals, no secrets. It
# parses standalone with any YAML reader so CI can generate the published alias
# contract from it without an Ansible run. Anything topology-shaped (base URLs,
# ports, bearer env names) stays in the role, selected symbolically by `tier`
# and `endpoint` below.
#
# ── Schema ──────────────────────────────────────────────────────────────────
#
# Required on every entry:
#   client_model_id   What a caller sends. Rendered as the LiteLLM
#                     `model_list[].model_name`. This is the ONLY name a
#                     consumer may use besides a stable alias.
#   upstream_model_id The id the backend itself serves. Written explicitly even
#                     where it currently equals client_model_id: the two are
#                     independent naming decisions, and collapsing them is how a
#                     rename upstream silently becomes a rename for callers.
#   provider          LiteLLM provider prefix — `openai` (any OpenAI-compatible
#                     backend, which is every local tier) or `openrouter`.
#   tier              `large` | `light` | `openrouter`. Selects which backend
#                     endpoint the role renders and the deployment shape (light
#                     entries become TWO same-name deployments, GPU + CPU).
#   enabled           false removes the entry from the rendered config entirely.
#
# Optional:
#   litellm_model_name  Explicit override for `litellm_params.model`. Omitted
#                       everywhere today because the value is STRUCTURALLY
#                       composed as `<provider>/<upstream_model_id>` — it is a
#                       derivation, not a third independent name. Set it only
#                       when a backend needs a LiteLLM route string that is not
#                       that composition.
#   context_window      The backend's EFFECTIVE SERVING window — what its
#                       KV-cache budget (nix-ai catalog cacheMemoryMb) sustains,
#                       NOT the model's native max_position_embeddings. Renders
#                       as model_info.max_input_tokens/max_tokens and is the
#                       fabric's input enforcement via enable_pre_call_checks;
#                       Hermes auto-compacts at 75% of it. LiteLLM has no
#                       built-in entry for these backend ids, so an omitted
#                       value resolves max_input_tokens to null and every client
#                       that reads it falls back to a near-zero context guess
#                       and compresses its requests to death (outage
#                       2026-07-08). Advertising the NATIVE window is the
#                       opposite failure: sessions grow past the serving ceiling
#                       and die mid-stream instead of compacting.
#   servable            The serving host will actually answer for this id.
#                       DISTINCT FROM `enabled`, and conflating them is a real
#                       outage: the serving host runs llama-swap in single-model
#                       mode, so every non-resident model is demoted to
#                       `disabledModels` and returns HTTP 404 — not a degraded
#                       answer, no answer. `enabled` means "the router offers
#                       it"; `servable` means "the backend serves it". Alias and
#                       fallback targets must be servable. NOTE servable does
#                       NOT mean pre-loaded or residency-pinned: the small tier
#                       is servable and still evictable (ttl=900), with a
#                       measured ~79s cold load.
#   serving_role        `primary` | `small` | `cluster`. Names the entry the
#                       fabric's selector vars point at, so repointing the
#                       serving host is a move of this one field.
#   stable_aliases      Consumer-facing role names for this entry, rendered into
#                       `router_settings.model_group_alias`. HARD RULE (AGENTS.md):
#                       an alias carries ZERO deployment configuration and never
#                       becomes its own model_list entry — duplicating a physical
#                       entry's context_window/extra_body/api_base under a second
#                       name silently drifts from the real backend every time the
#                       model changes (root cause of the #1004 diagnosis cost).
#   endpoint            Symbolic backend selector WITHIN a tier. Only `cluster`
#                       is defined today (the two-Mac cluster gate's own TLS
#                       site); omitted means the tier's normal endpoint. The
#                       actual URL/port lives in the role, never here.
#   extra_body          Sampling parameters forwarded to the backend verbatim.
#   embedding           light tier only — marks the entry as an embeddings group.
#   standby             large tier only — also render a same-id, same-window
#                       failover deployment when the role has a standby backend
#                       URL configured.
#   key_field           openrouter tier only — the per-model field in OpenBao
#                       secrets-external/ai/saas/openrouter. An entry whose key
#                       is not seeded renders nothing, so the list is safe to
#                       extend ahead of key seeding.

llm_router_model_registry:
  # ── large tier ──────────────────────────────────────────────────────────────
  # The mlx-community models on the neutral large-tier runner, bearer-authed.
  # One deployment each, registered under the backend's own model id (the
  # serving gate lists models under their full MLX repo ids) — no alias names.
  # No cross-tier fallback. Native windows for reference: gpt-oss 131072,
  # Qwen3* 262144; the served values below are deliberately smaller.
  - client_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    upstream_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    provider: openai
    tier: large
    enabled: true
    context_window: 32768

  - client_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 32768

  # THE RESIDENT. 65536, not the 32768 it carried until 2026-07-28: that was the
  # SWAP-class figure, and this model is resident. Its resident profile in nix-ai
  # catalog-data.nix is provisioned cacheMemoryMb = 16384 with
  # maxRequestTokens = 65536, and the catalog comment states 65536 "avoids the
  # 32768 truncation/retry death-loop". Advertising half the real window does not
  # protect anything — it just makes Hermes auto-compact at 24.5K (75% of 32768)
  # when ~49K is actually available.
  #
  # Its aliases are the fabric's stable consumer handles. `interim-brain` is a
  # handle so hermes_brain_model (or secret/ai/public/brain) can repoint in one
  # line; it tracks the primary rather than naming its own model, because a
  # second physical id there is exactly the drift this registry prevents.
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    servable: true
    serving_role: primary
    stable_aliases:
      - hermes-default
      - tool-calling
      - interim-brain

  # THE SMALL TIER — the on-demand 9B that stays servable beside the resident
  # (nix-ai alwaysAvailableModels) and never evicts it. A first-class entry
  # because goal-judge points here, and an alias target with no context_window
  # falls through the "*" wildcard to a null max_input_tokens and compresses its
  # caller to death. 32768 is the small-cache tier figure, matching the swap
  # flags it loads under.
  #
  # It is the only model that may differ from the primary (user decision
  # 2026-07-28 — concurrency belongs to the largest accurate model, the small
  # tier stays cross-family to it, which is also what an LLM judge should be).
  # The judge runs here and NOT on the worker's model: same-model judging is
  # self-preference bias by construction, and it also made worker and judge
  # contend for one serving slot.
  #
  # CORRECTED 2026-08: this used to be described as "always up for the judge".
  # Measured live against the deployed serving host and it is false — the
  # deployed llama-swap config (nix-ai modules/mlx/llama-swap-topology.nix) has
  # the PRIMARY pinned resident (ttl=0) and THIS model as the evictable
  # swap-class member (ttl=900), the opposite of what was claimed. Measured
  # cold-load after eviction: ~79s, which exceeds
  # hermes_agent_kanban_goal_judge_timeout_seconds (60s) — see the goal-judge
  # comment in roles/hermes_agent/defaults/main.yml for the full incident and the
  # precondition for using this model as the judge target again.
  - client_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 32768
    servable: true
    serving_role: small
    stable_aliases:
      - goal-judge

  # OptiQ-4bit: the agentic-bench-winning brain (ai_default_model, all.yml). A
  # first-class entry — NOT passthrough — so the default model carries an
  # explicit max_input_tokens: the wildcard "*" entry sets none, and a null there
  # makes Hermes/OpenWebUI fall back to a near-zero context guess and compress
  # every request to death.
  #
  # extra_body.repetition_penalty: the anti-repetition-loop fix. In long agentic
  # sessions this brain emitted ~37 IDENTICAL tool calls per turn (Hermes dedups
  # + executes once, the model re-emits next turn, the task never advances). The
  # 20/20-clean agentic bench and the looping production sessions differ only in
  # sampling. A gentle 1.05 repetition penalty directly taxes verbatim
  # re-emission while staying mild enough to preserve tool-call JSON validity.
  # extra_body carries it through the router to the MLX model server.
  # (temperature is deliberately NOT pinned: 0.7 would merely restate the engine
  # fallback the loop already runs under. If 1.05 is insufficient, the next lever
  # is to match the clean bench's sampling — temperature ~1.0 /
  # presence_penalty 0.0 — added to this same extra_body.)
  #
  # standby: OptiQ is the hermes-brain (PR #59) and the only brain that stays
  # resident beside the shard, so it is the entry that gets a same-id failover
  # sibling when a standby backend exists. Inert by default — see the standby var
  # block in roles/llm_router/defaults/main.yml for the dedicated-port topology
  # and the wired-ceiling safety gate.
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }
    standby: true

  # Qwen3-Next-80B Thinking: served from the nix-ai catalog swap tier, loaded on
  # demand — the escalation rubric's deep-analysis tier (ai_escalation_rubric,
  # all.yml) requests it by this real id.
  - client_model_id: mlx-community/Qwen3-Next-80B-A3B-Thinking-4bit
    upstream_model_id: mlx-community/Qwen3-Next-80B-A3B-Thinking-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 32768
    extra_body: { repetition_penalty: 1.05 }

  # Instruct sibling: the fleet brain (ai_default_model) since 2026-07-17 —
  # agentic-bench winner, resident on the serving host with a 65536 window (also
  # Hermes' compression model, which hard-requires >=64K).
  - client_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }

  # Hermes' stable default target. The 65,536-token input contract passed a
  # direct production-profile mlx_lm probe before this alias was enabled.
  - client_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536

  # Resident serialized goal judge.
  - client_model_id: mlx-community/Qwen3.6-27B-mxfp4
    upstream_model_id: mlx-community/Qwen3.6-27B-mxfp4
    provider: openai
    tier: large
    enabled: true
    context_window: 65536

  # The two-Mac cluster brain (JACCL pipeline across both Macs, ~256 GB
  # combined), served by mlx-lm rank 0 behind the gate's own cluster TLS site — a
  # DIFFERENT port on the same host, hence `endpoint: cluster`. Reachable only
  # while a cluster window is up (cable in); normal serving quiesces during
  # windows, so this entry is what keeps a brain reachable then.
  #
  # Servable because it is hermes-default's fallback target while a window is up
  # — a real, reachable target, not a stale alias. It carries NO stable_aliases:
  # hermes-default resolves to the primary and reaches this entry through
  # router_settings.fallbacks, so both backends answer under one consumer name
  # without a second alias that would pin traffic to a gate that is usually down.
  - client_model_id: mlx-community/GLM-4.7-REAP-50-mxfp4
    upstream_model_id: mlx-community/GLM-4.7-REAP-50-mxfp4
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    servable: true
    serving_role: cluster
    endpoint: cluster
    extra_body: { repetition_penalty: 1.05 }

  # ── light tier ──────────────────────────────────────────────────────────────
  # The llama-swap model names, served as-is. Each becomes TWO same-name
  # deployments (GPU box + CPU standby) so LiteLLM load-balances the pair and
  # cools a failed deployment down — a GPU outage drains to CPU automatically.
  - client_model_id: qwen3-4b
    upstream_model_id: qwen3-4b
    provider: openai
    tier: light
    enabled: true

  - client_model_id: embeddings
    upstream_model_id: embeddings
    provider: openai
    tier: light
    enabled: true
    embedding: true

  # ── OpenRouter egress tier (paid SaaS) ──────────────────────────────────────
  # Served under their REAL upstream ids. NEVER part of any fallback chain — a
  # flaky or rate-limited upstream must not be able to degrade the local brain;
  # consumers opt in by requesting the id explicitly.
  #
  # Key model (deliberate): ONE OpenRouter API key PER MODEL, irrespective of
  # which harness or caller makes the request. key_field names the per-model
  # field in OpenBao — canonically secrets-external/ai/saas/openrouter (an
  # internet-reachable SaaS credential), dual-mounted with the internal path
  # during the migration. context_window is the model's real serving window
  # (never null — the compress-death rule applies to every entry).
  #
  # Operator disclosure 2026-07-19: these keys are ACCOUNT-WIDE — the per-model
  # field names were a naming-level guardrail, not a technical one. Because of
  # that, THIS LIST IS THE EGRESS ALLOWLIST: an entry here with a seeded key is
  # the only way a model becomes reachable, and the `openrouter/*` passthrough
  # that used to route around it is gone.
  #
  # There is no router-enforced SPEND cap, and nothing here should be read as
  # claiming one — the proxy has no Redis or database to track spend in, by
  # design. What the router does enforce is a rate ceiling per egress
  # deployment. Caller-side policy (deliberate escalation, :free rules) is
  # therefore still doing real work here rather than being a backstop.
  #
  # Free endpoint: rate-limited, and the vendor logs prompt/session data on the
  # :free variant — never send confidential material through this model.
  - client_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    upstream_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1000000
    key_field: nvidia-nemotron-3-ultra-550b-a55b-free

  # Cheap paid egress: efficiency-optimized MoE. The workhorse escalation.
  - client_model_id: deepseek/deepseek-v4-flash
    upstream_model_id: deepseek/deepseek-v4-flash
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1000000
    key_field: deepseek-deepseek-v4-flash

  # MiniMax, TWO entries. The live keyless catalog
  # (https://openrouter.ai/api/v1/models, read 2026-08-02) carries eight
  # `minimax/*` ids, so "add MiniMax" is a selection, not a lookup — and since
  # the delegation doctrine tells callers to take the cheapest tier that can
  # actually do a subtask, one entry would force every MiniMax call to pay for
  # whichever shape it did not need. These two cover both:
  #
  #   minimax-m2.5  204,800 ctx   $0.15 / $0.90 per Mtok  — the cheap default
  #   minimax-m3  1,048,576 ctx   $0.30 / $1.20 per Mtok  — the long-context one
  #
  # context_window is the catalog's real serving window in both cases, not a
  # round number: the servable-alias contract test exists because an inflated
  # window is the compress-death failure, and an entry advertising more than the
  # backend serves dies mid-stream instead of compacting. (DeepSeek's 1000000
  # above is a pre-existing rounding of the same 1048576 window — left alone
  # rather than widened in a PR about something else.)
  #
  # Both are PAID — neither has a `:free` variant — so both fall under the rate
  # ceilings the role applies to every egress deployment. Note those are rate
  # limits, not a spend cap: this proxy has no store to track spend in. See the
  # egress block in roles/llm_router/defaults/main.yml.
  #
  # Inert until `minimax-minimax-m2-5` and `minimax-minimax-m3` are seeded under
  # secrets-external/ai/saas/openrouter — an unseeded key_field renders no entry
  # at all, which is what makes both safe to land ahead of the secrets.
  - client_model_id: minimax/minimax-m2.5
    upstream_model_id: minimax/minimax-m2.5
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 204800
    key_field: minimax-minimax-m2-5

  - client_model_id: minimax/minimax-m3
    upstream_model_id: minimax/minimax-m3
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1048576
    key_field: minimax-minimax-m3
