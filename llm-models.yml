---
# Canonical model, alias, tier, and enablement data. Role defaults project the
# views rendered by config.yaml.j2. Schema and rationale live under docs/.

llm_router_model_registry:
  # ── large tier ──────────────────────────────────────────────────────────────
  # Disabled entries remain unadvertised until normal registry probes pass.
  - client_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    upstream_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    provider: openai
    tier: large
    enabled: false
    context_window: 32768

  # NOT SERVED (live 404, verified 2026-08-14) — disabled rather than
  # advertised. Re-enable only once a backend actually answers for this id.
  - client_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 32768

  # Primary deliberate model; selection rationale is documented under docs/.
  - client_model_id: mlx-community/Qwen3.8-27B-4bit
    upstream_model_id: mlx-community/Qwen3.8-27B-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    servable: true
    serving_role: primary
    stable_aliases:
      - tool-calling
      - interim-brain

  # THE ROUTINE TIER — the second warm model, resident beside the primary rather
  # than swapping against it (nix-darwin maxResidentWorkers = 2). It held
  # `serving_role: primary` and all three consumer aliases until 2026-08-14; both
  # moved to the 27B above and this entry stayed servable, because it is: the
  # host serves it, verified from the worker's own command line at converge.
  #
  # It carries a serving_role rather than none so the registry's real invariant
  # still holds — servable if and only if the entry names the role it serves in.
  # Its 65536 window is the same resident profile figure as the primary's.
  #
  # IT IS ALSO THE UNIVERSAL JUDGE (2026-08-15). `goal-judge` moved here from
  # the 9B for one reason: residency. This model is pinned resident (ttl=0) and
  # cannot be evicted, so a judge call costs no cold load — where the 9B is
  # swap-class (ttl=900) with a MEASURED ~79s cold load, and at the 2-3 goal
  # cards/hour this fabric drains it evicts between nearly every card, so almost
  # every judge call paid that tax in full. Residency was always the real fix;
  # it arrived with maxResidentWorkers = 2 rather than with a timeout raise.
  #
  # It stays cross-generation to the worker (Qwen3.6 judging Qwen3.8), which is
  # what the no-self-preference rule actually requires, and thinking is off here
  # so a verdict does not pay the primary's deliberation cost. The judge and the
  # worker are separate resident workers with their own serving slots, so they
  # no longer serialize against each other either.
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    servable: true
    serving_role: routine
    stable_aliases:
      - goal-judge

  # THE SMALL TIER — the on-demand 9B that stays servable beside the two warm
  # models and never evicts either. 32768 is the small-cache tier figure,
  # matching the swap flags it loads under.
  #
  # It HELD `goal-judge` until 2026-08-15; that alias moved to the resident 35B
  # because this model's swap-class cold load (~79s, measured) was the judge's
  # actual failure mode. It keeps serving_role: small and stays servable — it is
  # the trivial-task tier and an hourly note-capture pipe requests its physical
  # id — it just is not the judge. Why it is a first-class entry rather than a
  # bare alias target, and the full cold-load correction:
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  - client_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 32768
    servable: true
    serving_role: small

  - client_model_id: mlx-community/Unlimited-OCR-bf16
    upstream_model_id: mlx-community/Unlimited-OCR-bf16
    provider: openai
    tier: large
    enabled: true
    context_window: 32768
    servable: true
    serving_role: ocr
    stable_aliases:
      - Unlimited OCR

  # Explicit context and sampling data are retained while this entry is disabled.
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    provider: openai
    tier: large
