    litellm_model_name: gemini/gemini-3.5-flash-lite
    provider: gemini
    tier: hermes-cloud
    route_group: hermes-cloud-gemini-routine
    fallback_group: hermes-cloud-gemini
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.0000003
    output_cost_per_token: 0.0000025
    credential_env: GEMINI_API_KEY
    key_field: GEMINI_API_KEY
    monthly_budget: 1.665

  - client_model_id: hermes-cloud-gemini-3.7-flash
    upstream_model_id: gemini-3.7-flash
    litellm_model_name: gemini/gemini-3.7-flash
    provider: gemini
    tier: hermes-cloud
    route_group: hermes-cloud-gemini-agentic
    fallback_group: hermes-cloud-gemini
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
