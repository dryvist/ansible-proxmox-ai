    key_field: OPENROUTER_API_KEY

  # MiniMax, TWO entries deliberately — m2.5 is the cheap default and m3 the
  # long-context one, so a caller taking the cheapest tier that can do the job
  # is not forced to pay for a shape it does not need. Both windows are the
  # catalog's real serving windows, not round numbers. The selection, the
  # pricing table, and why an inflated window is the compress-death failure:
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  #
  # Inert until the provider credential is seeded. A missing provider key
  # renders no OpenRouter entry, so model additions can land safely first.
  - client_model_id: minimax/minimax-m2.5
    upstream_model_id: minimax/minimax-m2.5
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 204800
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY

