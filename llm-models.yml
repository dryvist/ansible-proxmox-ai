---
# THE MODEL REGISTRY — the single place any model name, alias, tier, or
# enabled/disabled state is written for the whole AI fabric. Everything
# downstream DERIVES from this file: roles/llm_router/defaults/ projects these
# entries into the role's tier views, and templates/config.yaml.j2 renders the
# LiteLLM `model_list` + `router_settings.model_group_alias` from those. A
# model name written twice is the defect class this file exists to remove.
#
# PURE DATA, DELIBERATELY — no Jinja, no host/port/URL literals, no secrets;
# topology values stay in the role, selected by `tier` below.
#
# Field reference and the "why" behind PURE DATA: docs/LLM_MODELS_SCHEMA.md.
# Per-entry incident history and selection rationale:
# docs/LLM_MODELS_REGISTRY_NOTES.md. Both split out of here to keep this data
# file under the repo's per-file token budget — the same reason applies to the
# next long note anyone wants to add: write it there, leave a pointer here.
#

llm_router_model_registry:
  # ── large tier ──────────────────────────────────────────────────────────────
  # The mlx-community models on the neutral large-tier runner, bearer-authed.
  # One deployment each, registered under the backend's own model id (the
  # serving gate lists models under their full MLX repo ids) — no alias names.
  # No cross-tier fallback. Native windows for reference: gpt-oss 131072,
  # Qwen3* 262144; the served values below are deliberately smaller.
  # NOT SERVED by the neutral large-tier runner today (live 404, verified
  # 2026-08-14) — disabled rather than advertised. Re-enable only once a
  # backend actually answers for this id.
  - client_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    upstream_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    provider: openai
    tier: large
    enabled: false
    context_window: 32768

  # NOT SERVED (live 404, verified 2026-08-14) — disabled rather than
  # advertised. Re-enable only once a backend actually answers for this id.
  - client_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 32768

  # THE PRIMARY, since 2026-08-14. The serving host now holds TWO models warm
  # (dryvist/nix-darwin lib/hosts/mac-studio.nix, "Two warm brains"): a dense 27B
  # for deliberate work and the 35B MoE below for routine work. This entry is the
  # deliberate one, so the consumer aliases resolve here.
  #
  # 65536 matches its resident profile in nix-ai catalog-data.nix
  # (cacheMemoryMb = 16384, maxRequestTokens = 65536). Advertising half the real
  # window does not protect anything — it just makes Hermes auto-compact at 24.5K
  # (75% of 32768) when ~49K is actually available.
  #
  # THINKING IS ON, configured serving-side and deliberately not restated here.
  # Why, plus the measured 0-answer result at the template's default `xhigh`:
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  #
  # Its aliases are the fabric's stable consumer handles. `interim-brain` is a
  # handle so hermes_brain_model (or secret/ai/public/brain) can repoint in one
  # line; it tracks the primary rather than naming its own model, because a
  # second physical id there is exactly the drift this registry prevents.
  - client_model_id: mlx-community/Qwen3.8-27B-4bit
    upstream_model_id: mlx-community/Qwen3.8-27B-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    servable: true
    serving_role: primary
    stable_aliases:
      - tool-calling
      - interim-brain

  # THE ROUTINE TIER — the second warm model, resident beside the primary rather
  # than swapping against it (nix-darwin maxResidentWorkers = 2). It held
  # `serving_role: primary` and all three consumer aliases until 2026-08-14; both
  # moved to the 27B above and this entry stayed servable, because it is: the
  # host serves it, verified from the worker's own command line at converge.
  #
  # It carries a serving_role rather than none so the registry's real invariant
  # still holds — servable if and only if the entry names the role it serves in.
  # Its 65536 window is the same resident profile figure as the primary's.
  #
  # IT IS ALSO THE UNIVERSAL JUDGE (2026-08-15). `goal-judge` moved here from
  # the 9B for one reason: residency. This model is pinned resident (ttl=0) and
  # cannot be evicted, so a judge call costs no cold load — where the 9B is
  # swap-class (ttl=900) with a MEASURED ~79s cold load, and at the 2-3 goal
  # cards/hour this fabric drains it evicts between nearly every card, so almost
  # every judge call paid that tax in full. Residency was always the real fix;
  # it arrived with maxResidentWorkers = 2 rather than with a timeout raise.
  #
  # It stays cross-generation to the worker (Qwen3.6 judging Qwen3.8), which is
  # what the no-self-preference rule actually requires, and thinking is off here
  # so a verdict does not pay the primary's deliberation cost. The judge and the
  # worker are separate resident workers with their own serving slots, so they
  # no longer serialize against each other either.
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    servable: true
    serving_role: routine
    stable_aliases:
      - goal-judge

  # THE SMALL TIER — the on-demand 9B that stays servable beside the two warm
  # models and never evicts either. 32768 is the small-cache tier figure,
  # matching the swap flags it loads under.
  #
  # It HELD `goal-judge` until 2026-08-15; that alias moved to the resident 35B
  # because this model's swap-class cold load (~79s, measured) was the judge's
  # actual failure mode. It keeps serving_role: small and stays servable — it is
  # the trivial-task tier and an hourly note-capture pipe requests its physical
  # id — it just is not the judge. Why it is a first-class entry rather than a
  # bare alias target, and the full cold-load correction:
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  - client_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 32768
    servable: true
    serving_role: small

  - client_model_id: mlx-community/Unlimited-OCR-bf16
    upstream_model_id: mlx-community/Unlimited-OCR-bf16
    provider: openai
    tier: large
    enabled: true
    context_window: 32768
    servable: true
    serving_role: ocr
    stable_aliases:
      - Unlimited OCR

  # OptiQ-4bit: the agentic-bench-winning brain (ai_default_model, all.yml). A
  # first-class entry — NOT passthrough — so the default model carries an
  # explicit max_input_tokens rather than falling through the "*" wildcard to a
  # null one. The repetition_penalty is the anti-repetition-loop fix, and
  # `standby` marks it as the entry that gets a failover sibling: both, and why
  # temperature is deliberately not pinned, in
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  # NOT SERVED (live 404, verified 2026-08-14) — disabled rather than
  # advertised. Re-enable only once a backend actually answers for this id.
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }
    standby: true

  # NOT SERVED — disabled rather than advertised. Re-enable only after a
  # backend actually serves this id and the normal registry checks pass.
  - client_model_id: mlx-community/Qwen3-Next-80B-A3B-Thinking-4bit
    upstream_model_id: mlx-community/Qwen3-Next-80B-A3B-Thinking-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 32768
    extra_body: { repetition_penalty: 1.05 }

  # NOT SERVED (live 404, verified 2026-08-14) — disabled rather than
  # advertised. Formerly the fleet brain (ai_default_model); re-enable only
  # once a backend actually answers for this id.
  - client_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }

  # NOT SERVED (live 404, verified 2026-08-14) — disabled rather than
  # advertised. Re-enable only once a backend actually answers for this id.
  - client_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 65536

  # NOT SERVED (live 404, verified 2026-08-14) — disabled rather than
  # advertised. Re-enable only once a backend actually answers for this id.
  - client_model_id: mlx-community/Qwen3.6-27B-mxfp4
    upstream_model_id: mlx-community/Qwen3.6-27B-mxfp4
    provider: openai
    tier: large
    enabled: false
    context_window: 65536

  # Hermes' public brain handle is a real LiteLLM complexity router rather
  # than a model_group_alias. The classifier is local and deterministic: it
  # spends no provider tokens and maps routine work to the warm routine model,
  # while complex/reasoning work starts on the warm primary. Its tier targets
  # and fallback chain are derived in roles/llm_router/defaults from the same
  # serving_role entries above, so no physical model id is duplicated here.
  - client_model_id: hermes-default
    upstream_model_id: complexity_router
    litellm_model_name: auto_router/complexity_router
    provider: auto_router
    tier: hermes-router
    enabled: true
    context_window: 65536
    max_output_tokens: 8192

  # ── light tier ──────────────────────────────────────────────────────────────
  # The llama-swap model names, served as-is. Each becomes TWO same-name
  # deployments (GPU box + CPU standby) so LiteLLM load-balances the pair and
  # cools a failed deployment down — a GPU outage drains to CPU automatically.
  - client_model_id: qwen3-4b
    upstream_model_id: qwen3-4b
    provider: openai
    tier: light
    enabled: true

  - client_model_id: embeddings
    upstream_model_id: embeddings
    provider: openai
    tier: light
    enabled: true
    embedding: true

  # ── NVIDIA GPU tier ─────────────────────────────────────────────────────────
  # The tier key stays `vllm`: it names the ROUTER TIER and its base URL, not
  # the engine. This guest serves with llama.cpp on Vulkan; roles/vllm/defaults
  # records why vLLM cannot read these weights and why "no Linux CUDA binary"
  # does NOT rule llama.cpp out. Do not re-derive either.
  #
  # upstream_model_id is the name the serving host answers to — for llama-swap,
  # the model's `name` — so this must match
  # inventory/group_vars/llm_vllm_group.yml.
  - client_model_id: qwen3.8-27b
    upstream_model_id: qwen3.8-27b
    provider: openai
    tier: vllm
    enabled: true
    context_window: 16384

  # ── Hermes provider-diverse value fallbacks ───────────────────────────────
  # These entries are inert until their exact credential resolves. All share a
  # defensive 131072-token input ceiling and 8192-token output ceiling. Prices
  # are USD/token list prices verified on 2026-08-16; LiteLLM's cost router
  # uses the real values only within the equivalent OpenRouter final tier.
  - client_model_id: hermes-cloud-alibaba-qwen3.6-flash
    upstream_model_id: qwen3.6-flash
    litellm_model_name: dashscope/qwen3.6-flash
    provider: dashscope
    tier: hermes-cloud
    route_group: hermes-cloud-alibaba
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.00000025
    output_cost_per_token: 0.0000015
    credential_env: DASHSCOPE_API_KEY
    key_field: DASHSCOPE_API_KEY
    api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    monthly_budget: 3.33

  - client_model_id: hermes-cloud-gemini-3.7-flash
    upstream_model_id: gemini-3.7-flash
    litellm_model_name: gemini/gemini-3.7-flash
    provider: gemini
    tier: hermes-cloud
    route_group: hermes-cloud-gemini
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.00000075
    output_cost_per_token: 0.00000375
    credential_env: GEMINI_API_KEY
    key_field: GEMINI_API_KEY
    monthly_budget: 3.33

  # OpenRouter is the final gateway-diverse tier. Kimi and GLM currently have
  # multiple upstream hosts; Qwen is deliberately absent because OpenRouter's
  # Qwen routes were backed only by Alibaba and are not an independent failure
  # domain. Exact model ids plus provider policy form the allowlist.
  - client_model_id: hermes-cloud-openrouter-kimi-k2.6
    upstream_model_id: moonshotai/kimi-k2.6
    litellm_model_name: openrouter/moonshotai/kimi-k2.6
    provider: openrouter
    tier: hermes-cloud
    route_group: hermes-cloud-openrouter
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.0000006
    output_cost_per_token: 0.00000341
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    monthly_budget: 1.67

  - client_model_id: hermes-cloud-openrouter-glm-5.2
    upstream_model_id: z-ai/glm-5.2
    litellm_model_name: openrouter/z-ai/glm-5.2
    provider: openrouter
    tier: hermes-cloud
    route_group: hermes-cloud-openrouter
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.0000007308
    output_cost_per_token: 0.000002297
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    monthly_budget: 1.67

  # ── OpenRouter egress tier (paid SaaS) ──────────────────────────────────────
  # Served under their REAL upstream ids. NEVER part of any fallback chain — a
  # flaky or rate-limited upstream must not be able to degrade the local brain;
  # consumers opt in by requesting the id explicitly.
  #
  # THIS LIST IS THE EGRESS ALLOWLIST. Every entry shares the single LiteLLM ↔
  # OpenRouter provider credential; an exact registry entry is the only way a
  # model becomes reachable. The :free variant is logged by the vendor.
  # Full disclosure and the rate-vs-spend distinction:
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  - client_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    upstream_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1000000
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY

  # Cheap paid egress: efficiency-optimized MoE. The workhorse escalation.
  - client_model_id: deepseek/deepseek-v4-flash
    upstream_model_id: deepseek/deepseek-v4-flash
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1000000
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY

  # MiniMax, TWO entries deliberately — m2.5 is the cheap default and m3 the
  # long-context one, so a caller taking the cheapest tier that can do the job
  # is not forced to pay for a shape it does not need. Both windows are the
  # catalog's real serving windows, not round numbers. The selection, the
  # pricing table, and why an inflated window is the compress-death failure:
  # docs/LLM_MODELS_REGISTRY_NOTES.md.
  #
  # Inert until the provider credential is seeded. A missing provider key
  # renders no OpenRouter entry, so model additions can land safely first.
  - client_model_id: minimax/minimax-m2.5
    upstream_model_id: minimax/minimax-m2.5
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 204800
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY

  - client_model_id: minimax/minimax-m3
    upstream_model_id: minimax/minimax-m3
    provider: openrouter
    tier: openrouter
    enabled: true
    context_window: 1048576
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
