---
- name: Stop every other GPU serving profile before switching
  ansible.builtin.systemd:
    name: "{{ nvidia_gpu_guest_unit_prefix }}-{{ item.key }}.service"
    state: stopped
    enabled: false
    daemon_reload: true
  register: sglang_serving_stop_others
  # A profile never switched to has no unit yet; there is nothing to stop.
  failed_when:
    - sglang_serving_stop_others.failed | default(false)
    - "'Could not find the requested service' not in (sglang_serving_stop_others.msg | default(''))"
  loop: "{{ sglang_serving_profiles | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - not (sglang_serving_render_only | default(false))
    - item.value.enabled | default(true)
    - item.key != sglang_serving_active_profile

- name: Start the active GPU serving profile
  ansible.builtin.systemd:
    name: "{{ nvidia_gpu_guest_unit_prefix }}-{{ sglang_serving_active_profile }}.service"
    state: "{{ 'stopped' if llm_gpu_serving_paused | default(false) | bool else 'restarted' }}"
    enabled: true
    daemon_reload: true
  when: not (sglang_serving_render_only | default(false))
