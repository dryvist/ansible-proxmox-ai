---
sglang_serving_active_profile: "{{ llm_gpu_active_profiles_by_engine.sglang }}"
sglang_serving_engine: sglang
sglang_serving_profile_defaults:
  _sglang_common: &sglang_common
    engine: sglang
    max_model_len: 65536
    kv_cache_dtype: fp8_e4m3
    reasoning_parser: auto
    tool_call_parser: auto
    port: '{{ nvidia_gpu_guest_api_port }}'
  _qwen38_defaults: &qwen38_defaults
    <<: *sglang_common
    enabled: true
    mem_fraction_static: 0.93
    mtp: false
  _qwen38_mtp_defaults: &qwen38_mtp_defaults
    <<: *sglang_common
    enabled: true
    mem_fraction_static: 0.93
    mtp: true
  _flash_next_defaults: &flash_next_defaults
    <<: *sglang_common
    enabled: false
    mem_fraction_static: 0.93
    mtp: false
    ple_offload_embedding: true
  _flash_next_mtp_defaults: &flash_next_mtp_defaults
    <<: *sglang_common
    enabled: false
    mem_fraction_static: 0.96
    mtp: true
    ple_offload_embedding: true
sglang_serving_profiles:
  qwen38-64k-1-fp8:
    <<: *qwen38_defaults
    max_num_seqs: 1
  qwen38-64k-4-fp8:
    <<: *qwen38_defaults
    max_num_seqs: 4
  qwen38-64k-8-fp8:
    <<: *qwen38_defaults
    max_num_seqs: 8
  qwen38-64k-1-fp8-mtp:
    <<: *qwen38_mtp_defaults
    max_num_seqs: 1
  qwen38-64k-4-fp8-mtp:
    <<: *qwen38_mtp_defaults
    max_num_seqs: 4
  qwen38-64k-8-fp8-mtp:
    <<: *qwen38_mtp_defaults
    max_num_seqs: 8
  flash-next-64k-1-fp8:
    <<: *flash_next_defaults
    max_num_seqs: 1
  flash-next-64k-4-fp8:
    <<: *flash_next_defaults
    max_num_seqs: 4
  flash-next-64k-8-fp8:
    <<: *flash_next_defaults
    max_num_seqs: 8
  flash-next-64k-1-fp8-mtp:
    <<: *flash_next_mtp_defaults
    max_num_seqs: 1
  flash-next-64k-4-fp8-mtp:
    <<: *flash_next_mtp_defaults
    max_num_seqs: 4
  flash-next-64k-8-fp8-mtp:
    <<: *flash_next_mtp_defaults
    max_num_seqs: 8
