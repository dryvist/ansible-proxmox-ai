---
# Flake reference holding the nixosConfigurations. Pinned, never a bare branch:
# an unref'd github: url resolves to the repo's default branch and would deploy
# whatever landed there since the last converge.
nixos_deploy_flake_ref: "github:dryvist/nix-ai/main"

# Attribute under nixosConfigurations. Defaults to the inventory hostname, which
# is what makes this role reusable without a per-guest wrapper.
nixos_deploy_host_attr: "{{ hostname | default(inventory_hostname) }}"

# Where nixos-rebuild pushes the closure. root, because these guests exist to be
# converged and the SSH certificate minted by scripts/run-ansible.sh carries the
# `ansible` principal for root login.
nixos_deploy_target: "root@{{ ansible_host }}"

# switch | boot | test | dry-activate. `boot` is the safe choice for a change
# that cannot be rolled back live.
nixos_deploy_action: switch

nixos_deploy_extra_args: []

# nixos-rebuild has no timeout of its own and a cold closure build can take a
# long while. Bounded so a wedged build fails the play instead of hanging it.
nixos_deploy_timeout: 3600
