---
# Read-only counterpart to ansible-proxmox-apps roles/object_storage's
# iam_bucket_role.yml: that role GENERATES and WRITES the
# secret/rustfs/hindsight-bank-exports/{ro,rw} pair; this role only ever
# READS the rw half of it, via the same shared ansible-converge identity.
# No generate-if-absent here -- object_storage owns provisioning that
# secret; this role fails loudly if it is not there yet rather than
# inventing one.
- name: Fail if the ansible-converge OpenBao identity is not configured
  ansible.builtin.fail:
    msg: >-
      BAO_ADDR / CONVERGE_ROLE_ID / CONVERGE_SECRET_ID (or the
      OPENBAO_APPROLE_ANSIBLE_* fallback) are not all set. Unlike
      object_storage's per-bucket IAM migration (which can fall back to a
      root credential while it rolls out), this role has no other
      credential source: export/drill cannot run without it.
  when: >-
    hindsight_bank_dr_bao_addr | length == 0
    or hindsight_bank_dr_bao_role_id | length == 0
    or hindsight_bank_dr_bao_secret_id | length == 0

- name: Read the hindsight-bank-exports rw credential from OpenBao
  no_log: true
  block:
    - name: Log in with the ansible-converge AppRole
      community.hashi_vault.vault_login:
        url: "{{ hindsight_bank_dr_bao_addr }}"
        auth_method: approle
        role_id: "{{ hindsight_bank_dr_bao_role_id }}"
        secret_id: "{{ hindsight_bank_dr_bao_secret_id }}"
        validate_certs: "{{ hindsight_bank_dr_bao_validate_certs }}"
      register: hindsight_bank_dr_bao_login
      delegate_to: localhost
      become: false
      vars:
        ansible_become: false

    - name: Read the rw credential
      community.hashi_vault.vault_kv2_get:
        url: "{{ hindsight_bank_dr_bao_addr }}"
        auth_method: token
        token: "{{ hindsight_bank_dr_bao_login.login.auth.client_token }}"
        engine_mount_point: "{{ hindsight_bank_dr_bao_kv_mount }}"
        path: "{{ hindsight_bank_dr_bao_kv_path }}"
        validate_certs: "{{ hindsight_bank_dr_bao_validate_certs }}"
      register: hindsight_bank_dr_bao_secret
      delegate_to: localhost
      become: false
      vars:
        ansible_become: false

    # Map each field to its OWN named variable at this read site -- never
    # blind-export the whole secret dict downstream (operator ruling
    # 2026-07-27). These four are the only place hindsight_bank_dr_s3_*
    # values are ever assigned: the ratified secret-path convention stores
    # all four S3 credential fields (access key, secret key, region,
    # endpoint) together at secret/rustfs/<bucket>/{ro,rw}, so region and
    # endpoint come from this same read rather than a role default.
    - name: Map the rw credential's fields to their own role variables
      ansible.builtin.set_fact:
        hindsight_bank_dr_s3_access_key_id: >-
          {{ hindsight_bank_dr_bao_secret.secret.AWS_ACCESS_KEY_ID | default('', true) }}
        hindsight_bank_dr_s3_secret_access_key: >-
          {{ hindsight_bank_dr_bao_secret.secret.AWS_SECRET_ACCESS_KEY | default('', true) }}
        hindsight_bank_dr_s3_region: >-
          {{ hindsight_bank_dr_bao_secret.secret.AWS_REGION | default('', true) }}
        hindsight_bank_dr_s3_endpoint: >-
          {{ hindsight_bank_dr_bao_secret.secret.AWS_ENDPOINT_URL | default('', true) }}

  always:
    - name: Revoke the OpenBao login token used to read the rw credential
      community.hashi_vault.vault_write:
        url: "{{ hindsight_bank_dr_bao_addr }}"
        auth_method: token
        token: "{{ hindsight_bank_dr_bao_login.login.auth.client_token }}"
        path: auth/token/revoke-self
        data: {}
        validate_certs: "{{ hindsight_bank_dr_bao_validate_certs }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_become: false
      when:
        - hindsight_bank_dr_bao_login is defined
        - hindsight_bank_dr_bao_login.login is defined
      register: hindsight_bank_dr_bao_revoke
      # Not fatal (same reasoning and shape as object_storage/iam.yml and
      # openbao_secrets/publish.yml): the token expires on its own TTL, and
      # failing here would mask the real error of the block it is cleaning
      # up. Classified explicitly below rather than left silent.
      ignore_errors: true
      no_log: true

    - name: Warn that the OpenBao login token was not revoked
      ansible.builtin.debug:
        msg: >-
          WARNING: revoking the hindsight-bank-exports rw credential's login
          token failed; it stays valid until its TTL expires. This did not
          affect the read above.
      when: hindsight_bank_dr_bao_revoke is failed
