---
galaxy_info:
  author: Jacob Evans
  description: >-
    Nightly logical export of every Hindsight bank to object storage (portable,
    embedding-independent), plus a scheduled restore drill. Shells into the
    already-running roles/hindsight_docker container via docker exec/docker cp;
    never edits that role or the Postgres PITR tier (roles/postgres) — separate
    lane.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - bookworm
  galaxy_tags:
    - hindsight
    - backup
    - dr
    - ai

# No docker_engine dependency: this role deploys no container of its own. It
# only shells into the container roles/hindsight_docker already deployed on
# the same host in the same play — docker is already present there via that
# role's own docker_engine dependency.
