---
# The Docker guard belongs here too, not only on the tasks. Every task that
# notifies this handler carries it, but a handler is not covered by its
# notifier's `when` — it evaluates its own conditions when it fires. Under
# Docker the unit is still templated (that task is deliberately not skipped, so
# the rendered unit can be asserted against), which notifies this handler,
# which then tries to start a service whose venv was never installed. The role
# header's claim that everything is skipped under Docker was true of the tasks
# and false of the handler.
- name: Restart vllm
  ansible.builtin.systemd_service:
    name: "{{ vllm_service_name }}"
    state: restarted
    daemon_reload: true
  when:
    - vllm_service_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'
