---
# vllm role defaults — vLLM OpenAI-compatible server on an NVIDIA GPU, in a
# privileged LXC.
#
# WHY vLLM AND NOT llama.cpp. Upstream ggml-org/llama.cpp publishes NO Linux
# CUDA and no Linux ROCm release binary — verified across 8 releases; the CUDA
# prebuilts are Windows-only. So the llama_cpp role's release-asset mechanism
# cannot reach CUDA at all, and the remaining ways to run llama.cpp on CUDA
# would be building from source or running a container. vLLM ships official
# manylinux wheels with CUDA bundled, so `pip install` is the whole install.
#
# WHY NOTHING IS BUILT OR REPACKAGED. The wheels are cp38-abi3, so one wheel
# covers every CPython >= 3.8 and this guest's 3.13 is in range (vLLM declares
# requires_python >=3.10,<3.15). No compiler, no Docker, no NVIDIA Container
# Toolkit, no llama-swap.
#
# GPU device nodes (/dev/nvidia*) are passed into the container UPSTREAM by
# ansible-proxmox (role lxc_gpu_features); this role assumes they already exist
# and makes the service user able to open them — the same runtime-group
# resolution idiom as roles/ollama and roles/llama_cpp.

vllm_user: vllm
vllm_group: vllm

vllm_install_dir: /opt/vllm
vllm_venv: "{{ vllm_install_dir }}/venv"
# HuggingFace cache + weights. This guest has no fast/bulk pool, so the store is
# on the root disk rather than a mount point.
vllm_data_dir: /var/lib/vllm

# --- Release resolution -------------------------------------------------------
# Never pin a version: resolve latest at converge, matching how every other
# serving role here treats upstream artifacts. Set vllm_version to an exact
# string only to hold a known-good build during an incident.
vllm_version: ""
vllm_pip_spec: "vllm{{ ('==' + vllm_version) if vllm_version else '' }}"

# --- NVIDIA userspace in the guest -------------------------------------------
# The guest needs the NVIDIA USERSPACE libraries (libcuda.so and friends) that
# match the HOST's kernel module. It must NOT install a kernel module: an LXC
# shares the host kernel, so a second module would be both useless and wrong.
#
# They come from the same NVIDIA repo the host's nvidia_driver role configures,
# so both sides resolve from one source and cannot drift into a version skew —
# which presents as a CUDA init failure inside a container while the host looks
# perfectly healthy.
vllm_nvidia_repo_enabled: true
vllm_nvidia_repo_uri: >-
  https://developer.download.nvidia.com/compute/cuda/repos/debian{{
  ansible_distribution_major_version }}/x86_64/
vllm_nvidia_repo_key_url: >-
  https://developer.download.nvidia.com/compute/cuda/repos/debian{{
  ansible_distribution_major_version }}/x86_64/8793F200.pub
# Userspace only, and the package name matters. `libcuda1` is the CUDA driver
# library itself — the one vLLM links. Its candidate version tracks the same
# repo the host driver came from, so guest and host stay in step by
# construction rather than by a pin someone has to remember to bump.
#
# MEASURED alternatives, both wrong here:
#   nvidia-driver-cuda  — pulls DKMS, binutils, make and libc6-dev. That is the
#                         kernel-module build path; an LXC shares the host
#                         kernel and must never build one.
#   cuda-drivers        — branch metapackage, same problem.
# Never add either.
vllm_nvidia_userspace_packages:
  - libcuda1

# Device nodes the service user must be able to open. Bound in by
# lxc_gpu_features; this role only resolves their owning groups at run time,
# because the majors — and therefore the group mapping — are assigned
# dynamically at module load and have been measured moving across reboots.
vllm_gpu_device_nodes:
  - /dev/nvidia0
  - /dev/nvidiactl
  - /dev/nvidia-uvm
  - /dev/nvidia-uvm-tools

# --- apt egress --------------------------------------------------------------
# This guest's VLAN permits outbound 443 and the internal network, and BLOCKS
# outbound 80 (measured: port 443 open, port 80 blocked). Debian's default
# sources are http://, so a plain `apt-get update` times out on every Debian
# repo while the NVIDIA repo above — which is https — succeeds. The failure
# surfaces as "Failed to update apt cache after N retries" with no cause.
#
# apt therefore goes through the estate's internal apt-cacher-ng, which is
# reachable on the internal path. pip and HuggingFace need no proxy: they are
# https and 443 is already open.
#
# https sources must be sent DIRECT rather than through the cache. apt applies
# the http proxy to https sources when no https proxy is set, and
# apt-cacher-ng refuses the resulting CONNECT with
# "403 CONNECT denied (ask the admin to allow HTTPS tunnels)" — which fails
# the NVIDIA repo even though 443 reaches it directly.
vllm_apt_proxy_enabled: true
vllm_apt_proxy_host: "apt-cacher-ng.{{ tofu_data.domain }}"
vllm_apt_proxy_port: "{{ tofu_data.constants.service_ports.apt_cacher_ng | default(3142) }}"
vllm_apt_proxy_url: "http://{{ vllm_apt_proxy_host }}:{{ vllm_apt_proxy_port }}"
vllm_apt_proxy_conf: /etc/apt/apt.conf.d/01-vllm-proxy

# --- Serving ------------------------------------------------------------------
# Port from the tofu constants registry — no hardcoded ports. Hard-required so a
# missing constant fails loud rather than silently guessing a default.
vllm_api_port: "{{ tofu_data.constants.service_ports.llm_fast_api }}"
vllm_listen_host: "0.0.0.0"

# The served model. AWQ 4-bit, so the weights leave real KV-cache headroom on a
# 16 GB card; an unquantised 14B would not fit at all.
vllm_model: "Qwen/Qwen3-14B-AWQ"
vllm_served_model_name: qwen3-14b
vllm_quantization: awq_marlin

# --- Tool calling --------------------------------------------------------------
# Open WebUI sends `tool_choice: "auto"` on ordinary chat turns. vLLM rejects
# that outright unless BOTH of these are set, with:
#
#   "auto" tool choice requires --enable-auto-tool-choice and
#   --tool-call-parser to be set
#
# The rejection is a 400 from the backend, which the router surfaces as an
# upstream error with no fallback group — so the visible symptom is a chat UI
# that fails on every message while the model itself is loaded, healthy, and
# answering plain API calls perfectly. Nothing about the service looks wrong.
#
# `hermes` is the parser for Qwen models: their chat template already emits
# Hermes-style tool-use blocks, and upstream's tool-calling documentation names
# it for the Qwen family. `qwen3_xml` is NOT the one to reach for here — it is
# specific to the Qwen3-Coder models, which emit a different format.
vllm_enable_auto_tool_choice: true
vllm_tool_call_parser: hermes

# VRAM budget. 0.90 leaves the card's own overhead untouched. Raise it if a
# model OOMs at load; lower it if inference OOMs mid-request.
vllm_gpu_memory_utilization: 0.90
# Do NOT chase the model's native context on a 16 GB card — KV cache grows
# linearly with context length and evicts the weights that make it fast.
vllm_max_model_len: 16384

# Per-guest ceiling, asserted at converge. The llama_cpp role carries an
# ABSOLUTE >=14B rule, but that rule is scoped to the AMD serving guest after
# four host hard-locks on that node. It is NOT relaxed and NOT inherited: this
# is different silicon on a different host, so this guest states its own limit
# rather than silently escaping the other one.
vllm_max_param_billions: 15
vllm_model_param_billions: 14

# --- Service environment ------------------------------------------------------
# One map rather than a line per variable in the unit template, so adding a
# setting is a defaults edit and every consumer sees the same list.
#
# HF_HOME / VLLM_CACHE_ROOT: HuggingFace downloads and the compiled-graph cache
# both land under the data dir, which is on the guest's own disk. Without them
# they default to the service user's home and are re-downloaded on every
# rebuild.
#
# VLLM_USE_FLASHINFER_SAMPLER=0: REQUIRED on this guest, and its absence is not
# a performance question — it is a hard crash loop. FlashInfer's top-k/top-p
# sampler is JIT-compiled on first use, and its build step calls
# get_cuda_path(), which needs `nvcc`. This guest carries NVIDIA USERSPACE
# libraries only, by design (see the userspace section above), so there is no
# compiler and the call raises:
#
#   RuntimeError: Could not find nvcc and default cuda_home='/usr/local/cuda'
#                 doesn't exist
#
# The shape of the failure is what makes it expensive: the engine loads the
# weights to VRAM successfully first, so the service reports `active`, the GPU
# shows gigabytes resident, and only the sampler init fails — after which the
# process exits 1 and systemd restarts it. Measured at NRestarts=132 before this
# was found. `systemctl is-active` is therefore NOT evidence that vLLM is
# serving; only a request that returns a completion is.
#
# Setting this to 0 selects vLLM's PyTorch-native sampler (Triton for batch
# >= 8), which is a supported, documented backend requiring no compiler. It is
# an explicit opt-out the upstream env var exists to provide, not a check being
# silenced. Installing a CUDA toolkit in the guest to satisfy the JIT would
# instead undo the deliberate userspace-only boundary.
vllm_environment:
  HF_HOME: "{{ vllm_data_dir }}/hf"
  VLLM_CACHE_ROOT: "{{ vllm_data_dir }}/cache"
  VLLM_USE_FLASHINFER_SAMPLER: "0"

vllm_service_name: vllm
vllm_service_enabled: true
