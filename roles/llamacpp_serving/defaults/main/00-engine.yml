# Exact release assets and the Renovate-managed tag are shared by llamacpp_release.
llamacpp_serving_asset_name: "{{ llamacpp_release_cuda_asset }}"
llamacpp_serving_cudart_asset_name: "{{ llamacpp_release_cuda_runtime_asset }}"
llamacpp_serving_install_dir: "{{ nvidia_gpu_guest_install_dir }}/llama.cpp"
llamacpp_serving_server_bin: "{{ llamacpp_serving_install_dir }}/llama-server"
llamacpp_serving_asset_marker: "{{ llamacpp_serving_install_dir }}/.installed-asset"
llamacpp_serving_cache_sync_notify_service: true
