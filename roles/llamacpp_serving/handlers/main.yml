---
- name: Stop every other GPU serving profile before switching
  ansible.builtin.systemd:
    name: "{{ nvidia_gpu_guest_unit_prefix }}-{{ item.key }}.service"
    state: stopped
    enabled: false
    daemon_reload: true
  register: llamacpp_serving_stop_others
  # A profile never switched to has no unit yet; there is nothing to stop.
  failed_when:
    - llamacpp_serving_stop_others.failed | default(false)
    - "'Could not find the requested service' not in (llamacpp_serving_stop_others.msg | default(''))"
  loop: "{{ llamacpp_serving_profiles | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - not (llamacpp_serving_render_only | default(false))
    - item.value.enabled | default(true)
    - item.key != llamacpp_serving_active_profile

- name: Start the active GPU serving profile
  ansible.builtin.systemd:
    name: "{{ nvidia_gpu_guest_unit_prefix }}-{{ llamacpp_serving_active_profile }}.service"
    state: restarted
    enabled: true
    daemon_reload: true
  when: not (llamacpp_serving_render_only | default(false))
