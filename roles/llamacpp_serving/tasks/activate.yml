---
- name: Resolve the active profile's registry model
  ansible.builtin.set_fact:
    llamacpp_serving_active_artifact: >-
      {{ nvidia_gpu_guest_registry_by_profile[llamacpp_serving_active_profile].artifact }}

- name: Resolve active profile model paths
  ansible.builtin.set_fact:
    llamacpp_serving_health_host: >-
      {{ nvidia_gpu_guest_listen_host | default(ansible_facts.default_ipv4.address) }}

- name: Cache the active profile's registered model artifact
  ansible.builtin.include_role:
    name: nvidia_gpu_guest
    tasks_from: cache-sync.yml
  loop: >-
    {{ [llamacpp_serving_active_artifact.artifact_id]
       + (llamacpp_serving_active_artifact.required_artifact_ids | default([])) }}
  loop_control:
    loop_var: llamacpp_serving_cache_sync_artifact_id
    label: "{{ llamacpp_serving_cache_sync_artifact_id }}"

- name: Retire units for disabled GPU serving profiles
  ansible.builtin.include_tasks: retire-disabled-profile.yml
  loop: "{{ llamacpp_serving_profiles | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - not (llamacpp_serving_render_only | default(false))
    - not (item.value.enabled | default(true))

- name: Render one systemd unit for each GPU serving profile
  ansible.builtin.include_tasks: render-units.yml

- name: Check profile service states and request a switch when they diverge
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - "{{ nvidia_gpu_guest_unit_prefix }}-{{ item.key }}.service"
  register: llamacpp_serving_profile_state
  changed_when: >-
    (item.key == llamacpp_serving_active_profile and
     (llm_gpu_serving_paused | default(false) | bool) == (llamacpp_serving_profile_state.rc == 0)) or
    (item.key != llamacpp_serving_active_profile and llamacpp_serving_profile_state.rc == 0)
  failed_when: llamacpp_serving_profile_state.rc not in [0, 3, 4]
  loop: "{{ llamacpp_serving_profiles | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value.enabled | default(true)
  notify:
    - Stop every other GPU serving profile before switching
    - Start the active GPU serving profile

- name: Apply pending GPU serving service changes
  ansible.builtin.meta: flush_handlers

- name: Wait for the active GPU serving profile to answer
  ansible.builtin.include_tasks: health-check.yml
  when: not (llm_gpu_serving_paused | default(false) | bool)
