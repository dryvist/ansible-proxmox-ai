---
- name: Validate the active GPU serving profile
  ansible.builtin.assert:
    that:
      - llamacpp_serving_active_profile in llamacpp_serving_profiles
      - llamacpp_serving_profiles[llamacpp_serving_active_profile].enabled | default(true)
      - llamacpp_serving_profiles[llamacpp_serving_active_profile].engine == llamacpp_serving_engine
      - nvidia_gpu_guest_model_cache_mount_path | length > 0
      - nvidia_gpu_guest_registry_by_profile[llamacpp_serving_active_profile].artifact.use == 'serving'
      - >-
        llamacpp_serving_profiles[llamacpp_serving_active_profile].engine in
        nvidia_gpu_guest_registry_by_profile[llamacpp_serving_active_profile].artifact.engines
    fail_msg: >-
      Select an enabled serving profile, provide the target's writable cache
      directory, and set a pinned vLLM version.
    quiet: true

- name: Inspect the supplied writable model cache directory
  ansible.builtin.stat:
    path: "{{ nvidia_gpu_guest_model_cache_mount_path }}"
  register: llamacpp_serving_cache_mount_stat

- name: Assert the writable model cache mount exists
  ansible.builtin.assert:
    that:
      - llamacpp_serving_cache_mount_stat.stat.exists
      - llamacpp_serving_cache_mount_stat.stat.isdir
    fail_msg: >-
      The supplied writable model cache directory at
      {{ nvidia_gpu_guest_model_cache_mount_path }} must already exist as a directory.
    quiet: true

- name: Validate every GPU serving profile
  ansible.builtin.assert:
    that:
      - item.value.engine == llamacpp_serving_engine
      - item.key in nvidia_gpu_guest_registry_by_profile
      - item.value.max_model_len | int > 0
      - item.value.max_num_seqs | int > 0
      - item.value.port | int > 0
      - >-
        item.value.engine != 'vllm'
        or (item.value.linear_backend in ['auto', 'b12x']
            and item.value.moe_backend in ['auto', 'b12x']
            and item.value.gpu_memory_utilization | float > 0
            and item.value.gpu_memory_utilization | float <= 1
            and (not item.value.enable_auto_tool_choice
                 or nvidia_gpu_guest_registry_by_profile[item.key].artifact.tool_call_parser
                    | default(item.value.tool_call_parser) | length > 0)
            and nvidia_gpu_guest_registry_by_profile[item.key].artifact.reasoning_parser
                | default(item.value.reasoning_parser) | length > 0)
      - >-
        item.value.engine != 'llama_cpp'
        or (nvidia_gpu_guest_registry_by_profile[item.key].artifact.format == 'GGUF'
            and nvidia_gpu_guest_registry_by_profile[item.key].artifact.gguf_file | default('')
                is match('^[^*?\\[]+[.]gguf$'))
      - >-
        item.value.engine != 'llama_cpp'
        or item.value.extra_args | default([]) is not string
    fail_msg: "GPU serving profile {{ item.key }} is incomplete or invalid."
    quiet: true
  loop: "{{ llamacpp_serving_profiles | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value.enabled | default(true)
