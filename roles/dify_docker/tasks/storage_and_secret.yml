---
# =============================================================================
# Data Directories
# Container entrypoints (postgres, redis, weaviate) run as their own UIDs; in an
# unprivileged LXC those map to subuids, so leave ownership defaults — chown
# happens inside each container against the bind mount.
# =============================================================================

- name: Create Dify data subdirectories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ dify_docker_data_dir }}"
    - "{{ dify_docker_data_dir }}/postgres"
    - "{{ dify_docker_data_dir }}/weaviate"
    - "{{ dify_docker_data_dir }}/plugin_daemon"
    - "{{ dify_docker_data_dir }}/postgres-init"
    - "{{ dify_docker_data_dir }}/sandbox/dependencies"
    - "{{ dify_docker_data_dir }}/ssrf_proxy"
    - "{{ dify_docker_data_dir }}/nginx"

# The api/worker images run as uid 1001 ("dify"), not root, and write privkeys/
# uploads into this bind mount — it must be writable by that uid.
- name: Create Dify app storage directory (api/worker run as uid 1001)
  ansible.builtin.file:
    path: "{{ dify_docker_data_dir }}/storage"
    state: directory
    owner: "1001"
    group: "1001"
    # 0750, not 0755: the api/worker write private keys here (see above), and
    # only uid 1001 ever reads them. World-readable was handing every local
    # account on the guest the key material this directory exists to hold.
    mode: "0750"

# redis-server runs as the image's redis user (uid 999); a root-owned /data
# makes every RDB save fail (MISCONF) and redis then refuses writes entirely.
- name: Create Dify redis data directory (redis runs as uid 999)
  ansible.builtin.file:
    path: "{{ dify_docker_data_dir }}/redis"
    state: directory
    owner: "999"
    group: "999"
    # 0750: the RDB snapshots written here contain Dify session state and queued
    # task payloads. Only uid 999 needs them.
    mode: "0750"

# =============================================================================
# SECRET_KEY
# The api/worker sign sessions with SECRET_KEY and it protects the material that
# decrypts what the app has already stored. Order of authority: the secret store
# (supplied as dify_docker_secret_key), then the generate-once file on the guest.
#
# The file remains the greenfield bootstrap, but it is NOT the durable home. A
# key that lives only beside the data it unlocks is lost with that guest, and
# data restored without it is unreadable while every surface reports success.
# =============================================================================

- name: Check for the on-guest Dify SECRET_KEY
  ansible.builtin.stat:
    path: "{{ dify_docker_secret_key_path }}"
  register: dify_docker_secret_key_stat

- name: Generate a Dify SECRET_KEY on the guest (greenfield bootstrap only)
  ansible.builtin.copy:
    dest: "{{ dify_docker_secret_key_path }}"
    # 50 alphanumeric chars; boolean flags pin the character set unambiguously.
    content: >-
      {{ lookup('community.general.random_string',
                length=50,
                upper=true, lower=true, numbers=true,
                special=false) }}
    owner: root
    group: root
    mode: "0600"
  when:
    - not dify_docker_secret_key_stat.stat.exists
    - dify_docker_secret_key | length == 0
  no_log: true

- name: Re-check for the on-guest Dify SECRET_KEY
  ansible.builtin.stat:
    path: "{{ dify_docker_secret_key_path }}"
  register: dify_docker_secret_key_stat

- name: Read the on-guest Dify SECRET_KEY into memory
  ansible.builtin.slurp:
    src: "{{ dify_docker_secret_key_path }}"
  register: dify_docker_secret_key_file
  when: dify_docker_secret_key_stat.stat.exists
  no_log: true

- name: Resolve the effective SECRET_KEY (secret store, then on-guest file)
  ansible.builtin.set_fact:
    dify_docker_secret_key: >-
      {{ dify_docker_secret_key
         if dify_docker_secret_key | length > 0
         else ((dify_docker_secret_key_file.content | default('') | b64decode | trim)
               if dify_docker_secret_key_stat.stat.exists else '') }}
  no_log: true

# Deploying with an empty key is the one failure this role must never turn into
# a silent success: the stack would come up, re-protect its stored material
# under an empty key, and what was already stored would become unreadable —
# with every container healthy and every page loading.
- name: Assert a SECRET_KEY resolved
  ansible.builtin.assert:
    that:
      - dify_docker_secret_key | length > 0
    fail_msg: >-
      No Dify SECRET_KEY resolved from the secret store or the guest. Deploying
      without it would leave what the app has already stored unreadable. Re-run
      under the secrets environment so the ai domain is fetched, or restore the
      guest's key file — do NOT let this converge proceed with a freshly
      generated value.
    quiet: true
