---
# =============================================================================
# Data Directories
# Container entrypoints (postgres, redis, weaviate) run as their own UIDs; in an
# unprivileged LXC those map to subuids, so leave ownership defaults — chown
# happens inside each container against the bind mount.
# =============================================================================

- name: Create Dify data subdirectories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ dify_docker_data_dir }}"
    - "{{ dify_docker_data_dir }}/postgres"
    - "{{ dify_docker_data_dir }}/weaviate"
    - "{{ dify_docker_data_dir }}/plugin_daemon"
    - "{{ dify_docker_data_dir }}/postgres-init"
    - "{{ dify_docker_data_dir }}/sandbox/dependencies"
    - "{{ dify_docker_data_dir }}/sandbox/runtime"
    - "{{ dify_docker_data_dir }}/ssrf_proxy"
    - "{{ dify_docker_data_dir }}/nginx"

# The api/worker images run as uid 1001 ("dify"), not root, and write privkeys/
# uploads into this bind mount — it must be writable by that uid.
- name: Create Dify app storage directory (api/worker run as uid 1001)
  ansible.builtin.file:
    path: "{{ dify_docker_data_dir }}/storage"
    state: directory
    owner: "1001"
    group: "1001"
    # 0750, not 0755: the api/worker write private keys here (see above), and
    # only uid 1001 ever reads them. World-readable was handing every local
    # account on the guest the key material this directory exists to hold.
    mode: "0750"

# redis-server runs as the image's redis user (uid 999); a root-owned /data
# makes every RDB save fail (MISCONF) and redis then refuses writes entirely.
- name: Create Dify redis data directory (redis runs as uid 999)
  ansible.builtin.file:
    path: "{{ dify_docker_data_dir }}/redis"
    state: directory
    owner: "999"
    group: "999"
    # 0750: the RDB snapshots written here contain Dify session state and queued
    # task payloads. Only uid 999 needs them.
    mode: "0750"

# =============================================================================
# SECRET_KEY and Agent runtime credentials
# The api/worker sign sessions with SECRET_KEY and it protects the material that
# decrypts what the app has already stored. The configured OpenBao path is the
# authority, and a stored value is never replaced. The on-guest copy is imported
# into the store when the store lacks the field, and rewritten from the store
# when absent. Agent runtime credentials use the same path and seed task; each
# missing field is generated once, while stored values remain authoritative.
# =============================================================================

- name: Check for the on-guest Dify SECRET_KEY
  ansible.builtin.stat:
    path: "{{ dify_docker_secret_key_path }}"
  register: dify_docker_secret_key_stat

- name: Read the on-guest Dify SECRET_KEY into memory
  ansible.builtin.slurp:
    src: "{{ dify_docker_secret_key_path }}"
  register: dify_docker_secret_key_file
  when: dify_docker_secret_key_stat.stat.exists
  no_log: true

- name: Resolve the caller SECRET_KEY (secret store or environment, then on-guest file)
  ansible.builtin.set_fact:
    dify_docker_secret_key_caller: >-
      {{ dify_docker_secret_key
         if dify_docker_secret_key | length > 0
         else ((dify_docker_secret_key_file.content | default('') | b64decode | trim)
               if dify_docker_secret_key_stat.stat.exists else '') }}
  no_log: true

# =============================================================================
# Production admin email discovery
# The OpenBao leaf is the authority for the console admin credentials, but a
# leaf seeded before DIFY_ADMIN_EMAIL existed carries only the password, and
# login_with_reset.yml needs the EXISTING owner account's email. Discover it
# once, read-only, from the instance database and seed the result; seed_generated
# keeps any stored value, so later converges never re-discover. An evaluation
# host keeps its DIFY_EVAL_* isolation and is never queried.
# =============================================================================

- name: Discover the Dify owner email on the guest when the leaf has none
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T db psql -U {{ dify_docker_db_user }}
      -d {{ dify_docker_db_name }} -Atc "select a.email from accounts a
      join tenant_account_joins j on j.account_id = a.id where j.role = 'owner'
      order by a.created_at limit 1"
    chdir: "{{ dify_docker_data_dir }}"
  register: dify_docker_owner_email_query
  # A stack that is not up yet (first run) makes the exec fail; that is the
  # fresh-install case, and the caller value must fall through to the seed.
  failed_when: false
  changed_when: false
  when:
    - "'dify_eval_group' not in (group_names | default([]))"
    - >-
      (bao_local_llm_secrets | default({}, true)).get('DIFY_ADMIN_EMAIL', '')
      | length == 0
    - lookup('env', 'DIFY_ADMIN_EMAIL') | length == 0
  no_log: true

- name: Require the Dify console API base to be set
  ansible.builtin.assert:
    that:
      - dify_docker_console_api_base | default('') | length > 0
    fail_msg: >-
      dify_docker_console_api_base is unset or empty. Set it for the Dify host
      in inventory/group_vars/dify_group.yml to the console address reachable
      from the guest itself.
    quiet: true

# Runs whenever no email was found anywhere (leaf, environment, instance
# database) — including when the discovery query itself failed, which is the
# already-set-up case this check exists to catch. The stack not being up yet
# (fresh install) also fails the probe; the assert below decides, not this
# task.
- name: Check whether the Dify setup is finished when no owner email was found
  ansible.builtin.uri:
    url: "{{ dify_docker_console_api_base }}/setup"
    return_content: true
  register: dify_docker_owner_setup_state
  failed_when: false
  changed_when: false
  when:
    - "'dify_eval_group' not in (group_names | default([]))"
    - >-
      (bao_local_llm_secrets | default({}, true)).get('DIFY_ADMIN_EMAIL', '')
      | length == 0
    - lookup('env', 'DIFY_ADMIN_EMAIL') | length == 0
    - dify_docker_owner_email_query.stdout | default('') | trim | length == 0

# A skipped (no email anywhere) or failed discovery is only safe when the
# instance is confirmed not yet set up; anything else must stop the converge
# before an empty admin email reaches the seed or the setup POST.
- name: Require a confirmed fresh setup when no owner email was found
  ansible.builtin.assert:
    that:
      - >-
        ((dify_docker_owner_setup_state.json | default({})).step
        | default('')) == 'not_started'
    fail_msg: >-
      No Dify admin email was found and the console setup state is not
      confirmed as not started: the setup is already finished but the instance
      database has no owner account to take DIFY_ADMIN_EMAIL from, or the
      instance never answered the setup check. Restore the owner account or
      set DIFY_ADMIN_EMAIL in the environment.
    quiet: true
  when:
    - "'dify_eval_group' not in (group_names | default([]))"
    - >-
      (bao_local_llm_secrets | default({}, true)).get('DIFY_ADMIN_EMAIL', '')
      | length == 0
    - lookup('env', 'DIFY_ADMIN_EMAIL') | length == 0
    - dify_docker_owner_email_query.stdout | default('') | trim | length == 0

- name: Require a non-empty Dify admin email on a not-yet-set-up instance
  ansible.builtin.assert:
    that:
      - dify_docker_admin_email | length > 0
    fail_msg: >-
      DIFY_ADMIN_EMAIL resolved empty on an instance whose console setup has
      not started. Creating the admin with an empty email would leave the
      console unusable. Set DIFY_ADMIN_EMAIL in the environment before
      converging. The wrapper that fills it is not this role's concern.
    quiet: true
  when:
    - "'dify_eval_group' not in (group_names | default([]))"
    - >-
      ((dify_docker_owner_setup_state.json | default({})).step
      | default('')) == 'not_started'

- name: Adopt the discovered owner email as the Dify admin email
  ansible.builtin.set_fact:
    dify_docker_admin_email_discovered: "{{ dify_docker_owner_email_query.stdout | trim }}"
  when:
    - "'dify_eval_group' not in (group_names | default([]))"
    - dify_docker_owner_email_query.rc | default(-1) | int == 0
    - dify_docker_owner_email_query.stdout | default('') | trim | length > 0
  no_log: true

- name: Seed the Dify SECRET_KEY through the shared seed_generated task
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Store Dify secrets, keeping any stored value, in {{ dify_docker_openbao_path }}
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ hostvars['localhost'].openbao_secrets_active_addr | default('', true) }}"
        openbao_secrets_seed_mount: "{{ openbao_secrets_kv_mount }}"
        openbao_secrets_seed_path: "{{ dify_docker_openbao_path }}"
        openbao_secrets_seed_fields: >-
          {{ [
            {'name': 'DIFY_SECRET_KEY', 'length': 50, 'charset': 'alnum',
             'value': dify_docker_secret_key_caller},
            {'name': 'DIFY_AGENT_API_TOKEN', 'length': 50, 'charset': 'alnum',
             'value': dify_docker_agent_api_token},
            {'name': 'DIFY_AGENT_SERVER_SECRET_KEY', 'length': 50, 'charset': 'alnum',
             'value': dify_docker_agent_server_secret_key},
            {'name': 'DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN', 'length': 50, 'charset': 'alnum',
             'value': dify_docker_agent_local_sandbox_auth_token},
            {'name': 'DIFY_ADMIN_PASSWORD', 'length': 50, 'charset': 'alnum',
             'value': dify_docker_admin_password}
          ] + (
            [
              {'name': 'DIFY_DB_PASSWORD', 'length': 50, 'charset': 'alnum',
               'value': dify_docker_db_password},
              {'name': 'DIFY_REDIS_PASSWORD', 'length': 50, 'charset': 'alnum',
               'value': dify_docker_redis_password},
              {'name': 'DIFY_SANDBOX_API_KEY', 'length': 50, 'charset': 'alnum',
               'value': dify_docker_sandbox_api_key},
              {'name': 'DIFY_WEAVIATE_API_KEY', 'length': 50, 'charset': 'alnum',
               'value': dify_docker_weaviate_api_key},
              {'name': 'DIFY_PLUGIN_DAEMON_KEY', 'length': 50, 'charset': 'alnum',
               'value': dify_docker_plugin_daemon_key},
              {'name': 'DIFY_INNER_API_KEY', 'length': 50, 'charset': 'alnum',
               'value': dify_docker_inner_api_key}
            ] if 'dify_eval_group' in (group_names | default([])) else []
          ) + (
            [
              {'name': 'DIFY_ADMIN_EMAIL', 'length': 50, 'charset': 'alnum',
               'value': dify_docker_admin_email}
            ] if 'dify_eval_group' not in (group_names | default([]))
               and dify_docker_admin_email | length > 0 else []
          ) }}
        openbao_secrets_seed_token: "{{ openbao_secrets_converge_writer_token }}"
        openbao_secrets_seed_expected_writer_policy: ansible-converge
        openbao_secrets_seed_check_capabilities: "{{ not ansible_check_mode }}"
        openbao_secrets_seed_revoke_token: false
        openbao_secrets_seed_register: dify_docker_seed_result

- name: Seed the evaluation Dify router key through the shared seed_generated task
  when: "'dify_eval_group' in (group_names | default([]))"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Store the evaluation Dify router key in apps/dify/eval
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ hostvars['localhost'].openbao_secrets_active_addr | default('', true) }}"
        openbao_secrets_seed_mount: "{{ openbao_secrets_kv_mount }}"
        openbao_secrets_seed_path: "{{ dify_docker_eval_router_key_path }}"
        openbao_secrets_seed_fields:
          - name: dify_eval_llm_router_key
            length: 32
            charset: alnum
            prefix: "sk-"
        openbao_secrets_seed_token: "{{ openbao_secrets_converge_writer_token }}"
        openbao_secrets_seed_expected_writer_policy: ansible-converge
        openbao_secrets_seed_check_capabilities: "{{ not ansible_check_mode }}"
        openbao_secrets_seed_revoke_token: false
        openbao_secrets_seed_register: dify_docker_eval_router_seed_result

- name: Resolve the effective SECRET_KEY from the secret store
  ansible.builtin.set_fact:
    dify_docker_secret_key: "{{ dify_docker_seed_result.DIFY_SECRET_KEY }}"
    dify_docker_agent_api_token: "{{ dify_docker_seed_result.DIFY_AGENT_API_TOKEN }}"
    dify_docker_agent_server_secret_key: "{{ dify_docker_seed_result.DIFY_AGENT_SERVER_SECRET_KEY }}"
    dify_docker_agent_local_sandbox_auth_token: "{{ dify_docker_seed_result.DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN }}"
  no_log: true

- name: Resolve the Dify admin credentials from the secret store
  ansible.builtin.set_fact:
    dify_docker_admin_password: "{{ dify_docker_seed_result.DIFY_ADMIN_PASSWORD }}"
    dify_docker_admin_email: >-
      {{ dify_docker_seed_result['DIFY_ADMIN_EMAIL'] | default(dify_docker_admin_email) }}
  no_log: true

- name: Resolve evaluation Dify secrets from OpenBao
  ansible.builtin.set_fact:
    dify_docker_db_password: "{{ dify_docker_seed_result.DIFY_DB_PASSWORD }}"
    dify_docker_redis_password: "{{ dify_docker_seed_result.DIFY_REDIS_PASSWORD }}"
    dify_docker_sandbox_api_key: "{{ dify_docker_seed_result.DIFY_SANDBOX_API_KEY }}"
    dify_docker_weaviate_api_key: "{{ dify_docker_seed_result.DIFY_WEAVIATE_API_KEY }}"
    dify_docker_plugin_daemon_key: "{{ dify_docker_seed_result.DIFY_PLUGIN_DAEMON_KEY }}"
    dify_docker_inner_api_key: "{{ dify_docker_seed_result.DIFY_INNER_API_KEY }}"
    dify_docker_seeded_model_api_key: "{{ dify_docker_eval_router_seed_result.dify_eval_llm_router_key }}"
  when: "'dify_eval_group' in (group_names | default([]))"
  no_log: true

- name: Require the on-guest Dify SECRET_KEY to match the stored value
  ansible.builtin.assert:
    that:
      - (dify_docker_secret_key_file.content | b64decode | trim) == dify_docker_secret_key
    fail_msg: >-
      The on-guest Dify SECRET_KEY differs from the stored DIFY_SECRET_KEY field.
      The stored value is authoritative and the guest file was not rewritten.
    quiet: true
  when: dify_docker_secret_key_stat.stat.exists
  no_log: true

- name: Write the on-guest Dify SECRET_KEY from the stored value when absent
  ansible.builtin.copy:
    dest: "{{ dify_docker_secret_key_path }}"
    content: "{{ dify_docker_secret_key }}"
    owner: root
    group: root
    mode: "0600"
  when: not dify_docker_secret_key_stat.stat.exists
  no_log: true

# Deploying with an empty key is the one failure this role must never turn into
# a silent success: the stack would come up, re-protect its stored material
# under an empty key, and what was already stored would become unreadable —
# with every container healthy and every page loading.
- name: Assert a SECRET_KEY resolved
  ansible.builtin.assert:
    that:
      - dify_docker_secret_key | length > 0
    fail_msg: >-
      No Dify SECRET_KEY resolved from the secret store or the guest. Deploying
      without it would leave what the app has already stored unreadable. Re-run
      under the secrets environment so the ai domain is fetched, or restore the
      guest's key file — do NOT let this converge proceed with a freshly
      generated value.
    quiet: true
