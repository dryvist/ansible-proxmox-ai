---
# =============================================================================
# Config + Compose Files
# =============================================================================

- name: Assert every secret rendered into the Dify compose file is present
  ansible.builtin.include_role:
    name: dryvist.homelab.openbao_secrets
    tasks_from: assert_nonempty.yml
  vars:
    openbao_secrets_required_vars:
      - dify_docker_secret_key
      - dify_docker_db_password
      - dify_docker_redis_password
      - dify_docker_sandbox_api_key
      - dify_docker_weaviate_api_key
      - dify_docker_model_api_key
      - dify_docker_plugin_daemon_key
      - dify_docker_inner_api_key
      - dify_docker_agent_api_token
      - dify_docker_agent_server_secret_key
      - dify_docker_agent_local_sandbox_auth_token

- name: Check for the existing Dify Compose configuration
  ansible.builtin.stat:
    path: "{{ dify_docker_data_dir }}/docker-compose.yml"
  register: dify_docker_previous_compose_stat

- name: Read the existing rendered Dify environment before replacing Compose
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - config
      - --format
      - json
  args:
    chdir: "{{ dify_docker_data_dir }}"
  register: dify_docker_previous_compose_config
  changed_when: false
  check_mode: false
  no_log: true
  when: dify_docker_previous_compose_stat.stat.exists

- name: Keep the existing Dify PASSWORD_PEPPER value
  ansible.builtin.set_fact:
    dify_docker_password_pepper: >-
      {{ (dify_docker_previous_compose_config.stdout | from_json)
         .services.api.environment.PASSWORD_PEPPER }}
  no_log: true
  when:
    - dify_docker_previous_compose_stat.stat.exists
    - dify_docker_password_pepper is not defined
    - >-
      (dify_docker_previous_compose_config.stdout | from_json)
      .services.api.environment.PASSWORD_PEPPER is defined
    - >-
      (dify_docker_previous_compose_config.stdout | from_json)
      .services.api.environment.PASSWORD_PEPPER | string | length > 0

- name: Render Dify squid (ssrf_proxy) configuration
  ansible.builtin.template:
    src: squid.conf.j2
    dest: "{{ dify_docker_data_dir }}/ssrf_proxy/squid.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart dify

- name: Render Dify Agent squid configuration
  ansible.builtin.template:
    src: squid-agent.conf.j2
    dest: "{{ dify_docker_data_dir }}/ssrf_proxy/squid-agent.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart dify

- name: Render Dify nginx routing configuration
  ansible.builtin.template:
    src: nginx-default.conf.j2
    dest: "{{ dify_docker_data_dir }}/nginx/default.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart dify

# Only consumed on first postgres init (empty PGDATA); no notify because postgres
# never re-runs initdb.d against an existing cluster.
- name: Render Dify postgres plugin-database init script
  ansible.builtin.template:
    src: postgres-init-plugin-db.sql.j2
    dest: "{{ dify_docker_data_dir }}/postgres-init/create-plugin-db.sql"
    owner: root
    group: root
    mode: "0644"

- name: Render Dify docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ dify_docker_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"  # contains SECRET_KEY + DB/Redis/sandbox/weaviate secrets
  no_log: true
  notify: Restart dify

# =============================================================================
# Deploy via Docker Compose
# =============================================================================

- name: Re-assert the database password before consumers are recreated
  ansible.builtin.include_tasks: db_password.yml

- name: Deploy Dify via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ dify_docker_data_dir }}"
    state: present
  register: dify_docker_compose_result
  changed_when: >-
    (dify_docker_compose_result.actions | default([]))
    | selectattr('status', 'in', ['Creating', 'Recreating', 'Pulling', 'Building'])
    | list | length > 0
  no_log: true

# =============================================================================
# Health Check
# First boot can take several minutes: image pulls, postgres initdb, the api
# running migrations against the fresh DB, and weaviate warming up.
# =============================================================================

- name: Wait for Dify web port to accept TCP connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ dify_docker_web_port }}"
    timeout: 300

- name: Verify Dify web UI renders through nginx
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dify_docker_web_port }}/"
    method: GET
    status_code: 200
  register: dify_docker_health
  retries: 30
  delay: 10
  until: dify_docker_health.status == 200
  changed_when: false
  when: not ansible_check_mode

# The api runs migrations only when it starts, and `flask upgrade-db` exits 0
# when it fails or skips on the migration lock, so a migration cut off by a
# database restart stays half-applied. Re-run it until it reports success.
- name: Apply pending Dify database migrations
  ansible.builtin.command:
    cmd: docker compose exec -T api flask upgrade-db
    chdir: "{{ dify_docker_data_dir }}"
  register: dify_docker_db_upgrade
  retries: 6
  delay: 20
  until: "'Database migration successful' in dify_docker_db_upgrade.stdout"
  changed_when: "'Running upgrade' in (dify_docker_db_upgrade.stdout ~ dify_docker_db_upgrade.stderr)"
  when: not ansible_check_mode
