---
# Shared by ensure_agent_app_api_key.yml and publish_agent_mcp.yml: resolves
# the Dify app id for dify_docker_dsl_name through the paged exact-name app
# lookup and sets dify_docker_agent_app_id.
- name: Initialize the accumulated Dify app list
  ansible.builtin.set_fact:
    dify_docker_agent_apps_all: []
    dify_docker_agent_apps_more: true
  no_log: true

- name: List Dify apps page by page until no more pages remain
  ansible.builtin.include_tasks: list_agent_app_page.yml
  loop: "{{ range(1, (dify_docker_app_lookup_max_pages | int) + 1) | list }}"
  loop_control:
    loop_var: dify_docker_app_page
  no_log: true

- name: Resolve exact Dify agent app matches by name
  ansible.builtin.set_fact:
    dify_docker_agent_app_matches: >-
      {{ dify_docker_agent_apps_all | default([])
         | selectattr('name', 'equalto', dify_docker_dsl_name) | list }}
  no_log: true

- name: Assert exactly one Dify agent app matched the name
  ansible.builtin.assert:
    that:
      - dify_docker_agent_app_matches | length <= 1
    fail_msg: >-
      More than one Dify app has the agent name "{{ dify_docker_dsl_name }}";
      resolve the duplicate before continuing.
  no_log: false

- name: Resolve the Dify agent app id by name
  ansible.builtin.set_fact:
    dify_docker_agent_app_id: >-
      {{ dify_docker_agent_app_matches[0].id | default('') }}
  no_log: true

- name: Assert the Dify agent app was found
  ansible.builtin.assert:
    that:
      - dify_docker_agent_app_id | length > 0
    fail_msg: >-
      The Dify agent app "{{ dify_docker_dsl_name }}" could not be found.
