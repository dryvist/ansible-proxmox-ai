---
# POSTGRES_PASSWORD only applies at initdb, so a changed DIFY_DB_PASSWORD would
# otherwise reach the api/worker/plugin config while the database kept the old
# one. Re-assert the role password on the running db before compose recreates
# its consumers. Runs over the container's local socket (no old password
# needed); the statement travels on stdin, never argv. First boot (no running
# db) skips: initdb sets the password itself.
- name: Check whether the Dify db service is running
  ansible.builtin.command:
    cmd: docker compose ps --status running --quiet db
    chdir: "{{ dify_docker_data_dir }}"
  register: dify_docker_db_running
  changed_when: false
  failed_when: false

# Re-asserting the same value is a no-op in effect, so it reports ok.
- name: Re-assert the Dify database role password
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T db
      psql -U {{ dify_docker_db_user }} -d {{ dify_docker_db_name }} -v ON_ERROR_STOP=1 -q
    chdir: "{{ dify_docker_data_dir }}"
    stdin: "ALTER ROLE {{ dify_docker_db_user }} PASSWORD $pw${{ dify_docker_db_password }}$pw$;"
  when: dify_docker_db_running.stdout | trim | length > 0
  changed_when: false
  no_log: true
