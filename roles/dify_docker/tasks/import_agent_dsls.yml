---
# =============================================================================
# Verify the pinned public catalog inputs before reconciling any app. Then list
# existing apps once; import_agent_dsl.yml uses catalog hashes to decide whether
# to create, update, or skip each app.
# =============================================================================

- name: Load the pinned agent DSL catalog settings
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/agent_dsls.yml"
  when:
    - dify_docker_provision_model_provider | bool
    - dify_docker_import_agent_dsls | bool
  no_log: true

- name: Fetch the pinned agent DSL catalog manifest and verify its sha256
  ansible.builtin.get_url:
    url: "{{ dify_docker_agent_dsl_base }}/agents/dify/manifest.json"
    dest: "/tmp/dify-agent-dsl-manifest-{{ dify_docker_agent_dsl_commit }}.json"
    checksum: "sha256:{{ dify_docker_agent_dsl_manifest_sha256 }}"
    mode: "0600"
    force: true
  check_mode: false
  when:
    - dify_docker_provision_model_provider | bool
    - dify_docker_import_agent_dsls | bool
  no_log: true

- name: Read the verified agent DSL catalog manifest
  ansible.builtin.slurp:
    src: "/tmp/dify-agent-dsl-manifest-{{ dify_docker_agent_dsl_commit }}.json"
  register: dify_docker_agent_dsl_manifest_raw
  when:
    - dify_docker_provision_model_provider | bool
    - dify_docker_import_agent_dsls | bool
  no_log: true

- name: Initialize catalog-derived agent DSL sources
  ansible.builtin.set_fact:
    dify_docker_agent_dsls: []
  when:
    - dify_docker_provision_model_provider | bool
    - dify_docker_import_agent_dsls | bool
  no_log: true

- name: Build agent DSL URLs from every catalog manifest entry
  ansible.builtin.set_fact:
    dify_docker_agent_dsls: >-
      {{ dify_docker_agent_dsls
         + [dify_docker_agent_dsl_manifest_entry
            | combine({'url': dify_docker_agent_dsl_base ~ '/' ~ dify_docker_agent_dsl_manifest_entry.path})] }}
  loop: "{{ dify_docker_agent_dsl_manifest_raw.content | b64decode | from_json }}"
  loop_control:
    loop_var: dify_docker_agent_dsl_manifest_entry
    label: "{{ dify_docker_agent_dsl_manifest_entry.name }}"
  when:
    - dify_docker_provision_model_provider | bool
    - dify_docker_import_agent_dsls | bool
  no_log: true

- name: Remove the verified agent DSL catalog manifest copy
  ansible.builtin.file:
    path: "/tmp/dify-agent-dsl-manifest-{{ dify_docker_agent_dsl_commit }}.json"
    state: absent
  check_mode: false
  changed_when: false
  when:
    - dify_docker_provision_model_provider | bool
    - dify_docker_import_agent_dsls | bool
  no_log: true

- name: Fetch and verify all catalog agent DSLs before importing any
  ansible.builtin.get_url:
    url: "{{ dify_docker_agent_dsl.url }}"
    dest: "/tmp/dify-agent-dsl-{{ dify_docker_agent_dsl.name }}.yml"
    checksum: "sha256:{{ dify_docker_agent_dsl.sha256 }}"
    mode: "0600"
    force: true
  loop: "{{ dify_docker_agent_dsls }}"
  loop_control:
    loop_var: dify_docker_agent_dsl
    label: "{{ dify_docker_agent_dsl.name }}"
  check_mode: false
  when:
    - dify_docker_provision_model_provider | bool
    - dify_docker_import_agent_dsls | bool
  no_log: true

- name: List existing Dify apps (agent DSL catalog hash check)
  ansible.builtin.uri:
    url: "{{ dify_docker_console_api_base }}/apps?page=1&limit=100"
    method: GET
    headers:
      Cookie: "{{ dify_docker_console_cookies }}"
      X-CSRF-Token: "{{ dify_docker_console_csrf_token }}"
    status_code: 200
    return_content: true
  register: dify_docker_dsl_apps_list
  # Read-only; a check run needs the current names to preview the import.
  check_mode: false
  when:
    - dify_docker_provision_model_provider | bool
    - dify_docker_import_agent_dsls | bool
  changed_when: false
  failed_when: false
  no_log: true

- name: Reconcile each catalog agent DSL
  ansible.builtin.include_tasks: import_agent_dsl.yml
  loop: "{{ dify_docker_agent_dsls }}"
  loop_control:
    loop_var: dify_docker_agent_dsl
    label: "{{ dify_docker_agent_dsl.name }}"
  when:
    - dify_docker_provision_model_provider | bool
    - dify_docker_import_agent_dsls | bool
    - dify_docker_dsl_apps_list.status | default(0) == 200

# Private entries come from the converge-time variable and are fetched with the
# bearer token. They are marked here so an entry cannot be fetched without it,
# and are skipped while the token is empty.
- name: Reconcile each private agent DSL
  ansible.builtin.include_tasks: import_agent_dsl.yml
  loop: "{{ dify_docker_private_agent_dsls | map('combine', {'private': true}) | list }}"
  loop_control:
    loop_var: dify_docker_agent_dsl
    label: private agent DSL
  when:
    - dify_docker_provision_model_provider | bool
    - dify_docker_import_agent_dsls | bool
    - dify_docker_dsl_apps_list.status | default(0) == 200
    - dify_docker_private_agent_dsl_token | length > 0
    - not ansible_check_mode

- name: Report private agent DSLs skipped for a missing token
  ansible.builtin.debug:
    msg: "private agent DSLs are configured but no token was supplied; not fetched"
  when:
    - dify_docker_provision_model_provider | bool
    - dify_docker_import_agent_dsls | bool
    - dify_docker_private_agent_dsls | length > 0
    - dify_docker_private_agent_dsl_token | length == 0
  changed_when: false
