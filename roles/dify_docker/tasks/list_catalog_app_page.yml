---
- name: List one page of Dify apps for the agent catalog
  ansible.builtin.uri:
    url: >-
      {{ dify_docker_console_api_base }}/apps?page={{ dify_docker_dsl_page }}&limit={{ dify_docker_dsl_apps_limit }}
    method: GET
    headers:
      Cookie: "{{ dify_docker_console_cookies }}"
      X-CSRF-Token: "{{ dify_docker_console_csrf_token }}"
    status_code: 200
    return_content: true
  register: dify_docker_dsl_apps_page
  check_mode: false
  changed_when: false
  no_log: true

- name: Validate a Dify app catalog page
  ansible.builtin.assert:
    that:
      - dify_docker_dsl_apps_page.json.total | int == dify_docker_dsl_apps_total | int
      - dify_docker_dsl_apps_page.json.limit | int == dify_docker_dsl_apps_limit | int
      - dify_docker_dsl_apps_page.json.data is sequence
      - dify_docker_dsl_apps_page.json.data | length <= dify_docker_dsl_apps_limit | int
      - dify_docker_dsl_apps_page.json.has_more is boolean
      - >-
        (dify_docker_dsl_page | int < dify_docker_dsl_apps_page_count | int)
        == (dify_docker_dsl_apps_page.json.has_more | bool)
    fail_msg: "Dify returned an inconsistent paginated app list."
  no_log: true

- name: Accumulate a Dify app catalog page
  ansible.builtin.set_fact:
    dify_docker_dsl_apps_all: >-
      {{ dify_docker_dsl_apps_all + dify_docker_dsl_apps_page.json.data }}
  no_log: true
