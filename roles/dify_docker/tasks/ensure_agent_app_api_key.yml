---
- name: List Dify apps to resolve the agent app id
  ansible.builtin.uri:
    url: "{{ dify_docker_console_api_base }}/apps?page=1&limit=100"
    method: GET
    headers:
      Cookie: "{{ dify_docker_console_cookies }}"
      X-CSRF-Token: "{{ dify_docker_console_csrf_token }}"
    status_code: 200
    return_content: true
  register: dify_docker_agent_apps_list
  check_mode: false
  changed_when: false
  no_log: true

- name: Resolve the Dify agent app id by name
  ansible.builtin.set_fact:
    dify_docker_agent_app_id: >-
      {{ (dify_docker_agent_apps_list.json.data | default([])
          | selectattr('name', 'equalto', dify_docker_dsl_name)
          | map(attribute='id') | first) | default('') }}
  no_log: true

- name: Read the stored Dify agent app API key from OpenBao
  community.hashi_vault.vault_kv2_get:
    url: "{{ hostvars['localhost'].openbao_secrets_active_addr | default('', true) }}"
    auth_method: token
    token: "{{ openbao_secrets_converge_writer_token }}"
    engine_mount_point: "{{ openbao_secrets_kv_mount }}"
    path: "{{ dify_docker_agent_app_api_key_path }}"
    validate_certs: "{{ openbao_secrets_validate_certs }}"
  register: dify_docker_agent_app_api_key_lookup
  check_mode: false
  failed_when: >-
    dify_docker_agent_app_api_key_lookup is failed
    and 'Invalid or missing path' not in
      (dify_docker_agent_app_api_key_lookup.msg | default(''))
  changed_when: false
  when: dify_docker_agent_app_id | length > 0
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true

- name: Create the Dify agent app API key only when OpenBao has none
  ansible.builtin.uri:
    url: "{{ dify_docker_console_api_base }}/apps/{{ dify_docker_agent_app_id }}/api-keys"
    method: POST
    headers:
      Cookie: "{{ dify_docker_console_cookies }}"
      X-CSRF-Token: "{{ dify_docker_console_csrf_token }}"
    status_code: 201
    return_content: true
  register: dify_docker_agent_app_api_key_create
  changed_when: dify_docker_agent_app_api_key_create.status | default(0) == 201
  when:
    - not ansible_check_mode
    - dify_docker_agent_app_id | length > 0
    - dify_docker_agent_app_api_key_lookup.secret.api_key | default('', true) | length == 0
  no_log: true

- name: Store the Dify agent app API key through the shared seed_generated task
  when: dify_docker_agent_app_api_key_create.status | default(0) == 201
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Seed the Dify agent app API key in its OpenBao leaf
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ hostvars['localhost'].openbao_secrets_active_addr | default('', true) }}"
        openbao_secrets_seed_mount: "{{ openbao_secrets_kv_mount }}"
        openbao_secrets_seed_path: "{{ dify_docker_agent_app_api_key_path }}"
        openbao_secrets_seed_fields:
          - name: api_key
            length: 50
            charset: alnum
            value: "{{ dify_docker_agent_app_api_key_create.json.token }}"
        openbao_secrets_seed_token: "{{ openbao_secrets_converge_writer_token }}"
        openbao_secrets_seed_expected_writer_policy: ansible-converge
        openbao_secrets_seed_check_capabilities: "{{ not ansible_check_mode }}"
        openbao_secrets_seed_revoke_token: false
        openbao_secrets_seed_register: dify_docker_agent_app_api_key_seed_result
      no_log: true
