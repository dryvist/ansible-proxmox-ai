---
- name: Resolve the agent app id through the shared app lookup
  ansible.builtin.include_tasks: resolve_agent_app_id.yml
  no_log: true

- name: Read the stored Dify agent app API key from OpenBao
  ansible.builtin.include_tasks: read_agent_leaf.yml
  vars:
    dify_docker_agent_leaf_read_path: "{{ dify_docker_agent_app_api_key_path }}"
    dify_docker_agent_leaf_read_register: dify_docker_agent_app_api_key_lookup
  no_log: true

- name: Create the Dify agent app API key only when OpenBao has none
  when:
    - not ansible_check_mode
    - dify_docker_agent_app_id | length > 0
    - ((dify_docker_agent_app_api_key_lookup.secret | default({})).api_key | default('', true)) | length == 0
  ansible.builtin.uri:
    url: "{{ dify_docker_console_api_base }}/apps/{{ dify_docker_agent_app_id }}/api-keys"
    method: POST
    headers:
      Cookie: "{{ dify_docker_console_cookies }}"
      X-CSRF-Token: "{{ dify_docker_console_csrf_token }}"
    status_code: 201
    return_content: true
  register: dify_docker_agent_app_api_key_create
  changed_when: dify_docker_agent_app_api_key_create.status | default(0) == 201
  no_log: true

- name: Store the Dify agent app API key in OpenBao
  when: dify_docker_agent_app_api_key_create.status | default(0) == 201
  block:
    - name: Store the Dify agent app API key through the shared seed_generated task
      ansible.builtin.include_tasks: seed_agent_leaf.yml
      vars:
        dify_docker_agent_leaf_seed_path: "{{ dify_docker_agent_app_api_key_path }}"
        dify_docker_agent_leaf_seed_fields:
          - name: api_key
            length: 50
            charset: alnum
            value: "{{ dify_docker_agent_app_api_key_create.json.token }}"
        dify_docker_agent_leaf_seed_register: dify_docker_agent_app_api_key_seed_result
        # Storage failure after Dify issued a key deletes it, so Dify is not
        # left holding a key the leaf does not store.
        dify_docker_agent_leaf_seed_rollback_url: >-
          {{ dify_docker_console_api_base }}/apps/{{ dify_docker_agent_app_id }}/api-keys/{{
          dify_docker_agent_app_api_key_create.json.id }}
      no_log: true
