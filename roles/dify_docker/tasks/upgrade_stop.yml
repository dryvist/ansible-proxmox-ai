---
# Drain consumers, stop Weaviate, and cold-back it up when its backup module is absent.
- name: Stop Dify ingress and scheduler before draining Celery workers
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - stop
      - -t
      - "{{ dify_docker_stop_timeout_seconds | string }}"
      - "{{ item }}"
  args:
    chdir: "{{ dify_docker_data_dir }}"
  loop:
    - worker_beat
    - nginx
    - web
    - api
  loop_control:
    label: "{{ item }}"
  changed_when: true
  when: item in (dify_docker_deployed_services.stdout_lines | default([]))

# Producers (worker_beat, api) are stopped above, so the queue can only shrink.
# The pre-1.19.0 workers still run and are the only consumers of the legacy
# queue; after this upgrade they read OPS_TRACE_QUEUE exclusively. A timeout
# fails the task, and the upgrade_safety rescue restarts the old stack — the
# play never lets workers start on the new queue with legacy work stranded.
# The queue is never purged: undelivered messages must reach the old handler.
- name: Read the deployed Redis container ID before the queue drain
  ansible.builtin.command:
    argv: [docker, compose, ps, --all, --quiet, redis]
  args:
    chdir: "{{ dify_docker_data_dir }}"
  register: dify_docker_drain_redis_container
  changed_when: false
  when: "'redis' in (dify_docker_deployed_services.stdout_lines | default([]))"

- name: Wait for the legacy ops_trace Celery queue to drain
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --env
      - REDISCLI_AUTH
      - "{{ dify_docker_drain_redis_container.stdout | trim }}"
      - redis-cli
      - --raw
      - -n
      - "1"
      - LLEN
      - "{{ dify_docker_ops_trace_legacy_queue }}"
  args:
    chdir: "{{ dify_docker_data_dir }}"
  environment:
    REDISCLI_AUTH: "{{ dify_docker_redis_password }}"
  register: dify_docker_ops_trace_queue_depth
  changed_when: false
  retries: "{{ (dify_docker_ops_trace_drain_timeout_seconds | int)
               // (dify_docker_ops_trace_drain_poll_seconds | int) }}"
  delay: "{{ dify_docker_ops_trace_drain_poll_seconds | int }}"
  until: dify_docker_ops_trace_queue_depth.stdout | trim == '0'
  no_log: true
  when:
    - "'worker' in (dify_docker_deployed_services.stdout_lines | default([]))"
    - "'redis' in (dify_docker_deployed_services.stdout_lines | default([]))"
    # No broker container means no broker data: nothing is left to strand.
    - dify_docker_drain_redis_container.stdout | trim | length > 0

- name: Drain Dify workers gracefully before deploying the target version
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - stop
      - -t
      - "{{ dify_docker_stop_timeout_seconds | string }}"
      - worker
  args:
    chdir: "{{ dify_docker_data_dir }}"
  changed_when: true
  when: "'worker' in (dify_docker_deployed_services.stdout_lines | default([]))"

- name: Stop old Dify worker dependencies after the drain
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - stop
      - -t
      - "{{ dify_docker_stop_timeout_seconds | string }}"
      - "{{ item }}"
  args:
    chdir: "{{ dify_docker_data_dir }}"
  loop:
    - agent_backend
    - local_sandbox
    - plugin_daemon
    - sandbox
    - ssrf_proxy
    - agent_ssrf_proxy
  loop_control:
    label: "{{ item }}"
  changed_when: true
  when: item in (dify_docker_deployed_services.stdout_lines | default([]))

- name: Stop Weaviate after all pre-upgrade backups are verified
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - stop
      - -t
      - "{{ dify_docker_stop_timeout_seconds | string }}"
      - weaviate
  args:
    chdir: "{{ dify_docker_data_dir }}"
  changed_when: true

- name: Create a cold Weaviate persistence backup after stopping Weaviate
  ansible.builtin.command:
    argv:
      - tar
      - --create
      - --gzip
      - --numeric-owner
      - --file
      - "{{ dify_docker_weaviate_backup_path }}"
      - --directory
      - "{{ dify_docker_weaviate_persistence_path.stdout | trim }}"
      - .
  changed_when: true
  when: not dify_docker_weaviate_backup_module_available | bool

- name: Read the cold Weaviate pre-upgrade backup file
  ansible.builtin.stat:
    path: "{{ dify_docker_weaviate_backup_path }}"
  register: dify_docker_cold_weaviate_backup_stat
  when: not dify_docker_weaviate_backup_module_available | bool

- name: Require a non-empty cold Weaviate pre-upgrade backup
  ansible.builtin.assert:
    that:
      - dify_docker_cold_weaviate_backup_stat.stat.exists
      - dify_docker_cold_weaviate_backup_stat.stat.size > 0
    fail_msg: Cold Weaviate pre-upgrade backup is missing or empty.
    quiet: true
  when: not dify_docker_weaviate_backup_module_available | bool

- name: Set restrictive permissions on the cold Weaviate backup
  ansible.builtin.file:
    path: "{{ dify_docker_weaviate_backup_path }}"
    owner: root
    group: root
    mode: "0600"
  when: not dify_docker_weaviate_backup_module_available | bool

- name: Verify the cold Weaviate pre-upgrade archive integrity
  ansible.builtin.command:
    argv:
      - tar
      - --list
      - --gzip
      - --file
      - "{{ dify_docker_weaviate_backup_path }}"
  changed_when: false
  when: not dify_docker_weaviate_backup_module_available | bool

- name: Find Dify backup artifacts after the new set is verified
  ansible.builtin.find:
    paths: "{{ dify_docker_upgrade_backup_dir }}"
    patterns: "pre-upgrade-*"
    file_type: any
    recurse: false
  register: dify_docker_upgrade_backup_artifacts

- name: Set Dify backup set timestamps in chronological order
  ansible.builtin.set_fact:
    dify_docker_upgrade_backup_timestamps: >-
      {{ dify_docker_upgrade_backup_artifacts.files
         | map(attribute='path') | map('basename')
         | map('regex_replace', '^pre-upgrade-([0-9]{8}T[0-9]{6})-.*$', '\\1')
         | unique | sort | list }}

- name: Select older Dify backup sets beyond the retention bound
  ansible.builtin.set_fact:
    dify_docker_upgrade_expired_backup_timestamps: >-
      {{ dify_docker_upgrade_backup_timestamps[
           0:(dify_docker_upgrade_backup_timestamps | length
              - dify_docker_upgrade_backup_retention_count | int)]
         if (dify_docker_upgrade_backup_timestamps | length)
            > (dify_docker_upgrade_backup_retention_count | int)
         else [] }}

- name: Find artifacts belonging to expired Dify backup sets
  ansible.builtin.find:
    paths: "{{ dify_docker_upgrade_backup_dir }}"
    patterns: "pre-upgrade-{{ item }}-*"
    file_type: any
    recurse: false
  loop: "{{ dify_docker_upgrade_expired_backup_timestamps }}"
  register: dify_docker_expired_backup_artifacts

- name: Delete expired Dify backup sets after the new set is verified
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ dify_docker_expired_backup_artifacts.results
       | map(attribute='files') | flatten | map(attribute='path') | list }}
