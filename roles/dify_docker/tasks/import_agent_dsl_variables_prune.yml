---
# =============================================================================
# Destroy older secret id accessors of one AppRole. Accessors minted in this run (listed in
# dify_docker_dsl_minted_accessors) are never destroyed. Of the others, the newest is kept
# and the rest are destroyed. Runs after the publish, so the kept older id stays valid until
# the next converge. Every task is no_log: accessors identify live credentials. Included once
# per AppRole, with the role name in dify_docker_dsl_secret_id_role.
# =============================================================================

- name: Reset the secret id accessor ages for this role
  ansible.builtin.set_fact:
    dify_docker_dsl_secret_id_ages: []
    dify_docker_dsl_secret_id_stale: []
  no_log: true

- name: List the secret id accessors for this AppRole
  ansible.builtin.uri:
    url: >-
      {{ hostvars['localhost'].openbao_secrets_active_addr | default('', true) }}/v1/auth/approle/role/{{
      dify_docker_dsl_secret_id_role }}/secret-id?list=true
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_secrets_converge_writer_token }}"
    # An AppRole with no accessors answers 404 to a list request.
    status_code: [200, 404]
    return_content: true
    validate_certs: "{{ dify_docker_bao_validate_certs }}"
  register: dify_docker_dsl_secret_id_list
  changed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Look up the creation time of each secret id accessor
  ansible.builtin.uri:
    url: >-
      {{ hostvars['localhost'].openbao_secrets_active_addr | default('', true) }}/v1/auth/approle/role/{{
      dify_docker_dsl_secret_id_role }}/secret-id-accessor/lookup
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_secrets_converge_writer_token }}"
    body_format: json
    body:
      secret_id_accessor: "{{ item }}"
    status_code: 200
    return_content: true
    validate_certs: "{{ dify_docker_bao_validate_certs }}"
  loop: >-
    {{ ((dify_docker_dsl_secret_id_list.json | default({}, true)).data | default({}, true))
       .get('keys', []) }}
  register: dify_docker_dsl_secret_id_lookups
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Collect each accessor with its creation time to the second
  ansible.builtin.set_fact:
    dify_docker_dsl_secret_id_ages: >-
      {{ dify_docker_dsl_secret_id_ages
         + [{'accessor': item.item,
             'created': item.json.data.creation_time | regex_replace('\\.[0-9]+', '')}] }}
  loop: "{{ dify_docker_dsl_secret_id_lookups.results | default([]) }}"
  no_log: true

- name: Select the older accessors to destroy, keeping the newest one not minted in this run
  ansible.builtin.set_fact:
    dify_docker_dsl_secret_id_stale: >-
      {{ (dify_docker_dsl_secret_id_ages
          | rejectattr('accessor', 'in', dify_docker_dsl_minted_accessors | default([], true))
          | sort(attribute='created', reverse=true))[1:]
         | map(attribute='accessor') | list }}
  no_log: true

- name: Destroy each older secret id accessor
  ansible.builtin.uri:
    url: >-
      {{ hostvars['localhost'].openbao_secrets_active_addr | default('', true) }}/v1/auth/approle/role/{{
      dify_docker_dsl_secret_id_role }}/secret-id-accessor/destroy
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_secrets_converge_writer_token }}"
    body_format: json
    body:
      secret_id_accessor: "{{ item }}"
    status_code: [200, 204]
    validate_certs: "{{ dify_docker_bao_validate_certs }}"
  loop: "{{ dify_docker_dsl_secret_id_stale }}"
  changed_when: true
  delegate_to: localhost
  become: false
  no_log: true
