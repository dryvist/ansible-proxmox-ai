---
# Protect durable state while Dify is live, then drain old consumers before
# config_and_deploy starts the target release.
- name: Check for an existing Dify Compose project
  ansible.builtin.stat:
    path: "{{ dify_docker_data_dir }}/docker-compose.yml"
  register: dify_docker_compose_file_stat

- name: Read the deployed Dify Compose services
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - config
      - --services
  args:
    chdir: "{{ dify_docker_data_dir }}"
  register: dify_docker_deployed_services
  changed_when: false
  when: dify_docker_compose_file_stat.stat.exists

- name: Read the deployed Dify API container ID
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - ps
      - --all
      - --quiet
      - api
  args:
    chdir: "{{ dify_docker_data_dir }}"
  register: dify_docker_existing_api_container
  changed_when: false
  when: dify_docker_compose_file_stat.stat.exists

- name: Read the image of the deployed Dify API container
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.Config.Image{{ '}}' }}"
      - "{{ dify_docker_existing_api_container.stdout | trim }}"
  register: dify_docker_deployed_api_image_probe
  changed_when: false
  when:
    - dify_docker_existing_api_container.stdout | default('') | trim | length > 0

- name: Require a readable image for the deployed Dify API container
  ansible.builtin.assert:
    that:
      - dify_docker_deployed_api_image_probe.rc == 0
      - dify_docker_deployed_api_image_probe.stdout | trim | length > 0
    fail_msg: Could not identify the deployed Dify API image; refusing an unguarded upgrade.
    quiet: true
  when:
    - dify_docker_existing_api_container.stdout | default('') | trim | length > 0

- name: Detect whether the deployed Dify image differs from the target
  ansible.builtin.set_fact:
    dify_docker_upgrade_required: >-
      {{ (dify_docker_existing_api_container.stdout | default('') | trim | length > 0)
         and (dify_docker_deployed_api_image_probe.stdout | default('') | trim
              != dify_docker_api_image) }}

- name: Back up and stop Dify before changing its release
  when: dify_docker_upgrade_required | bool
  block:
    - name: Set the Dify pre-upgrade backup timestamp
      ansible.builtin.set_fact:
        dify_docker_upgrade_backup_timestamp: "{{ now(utc=true, fmt='%Y%m%dT%H%M%S') }}"

    - name: Set timestamped Dify pre-upgrade backup paths
      ansible.builtin.set_fact:
        dify_docker_postgres_backup_path: >-
          {{ dify_docker_upgrade_backup_dir ~ '/pre-upgrade-' ~
             dify_docker_upgrade_backup_timestamp ~ '-postgres.sql' }}
        dify_docker_plugin_postgres_backup_path: >-
          {{ dify_docker_upgrade_backup_dir ~ '/pre-upgrade-' ~
             dify_docker_upgrade_backup_timestamp ~ '-postgres-plugin.sql' }}
        dify_docker_postgres_globals_backup_path: >-
          {{ dify_docker_upgrade_backup_dir ~ '/pre-upgrade-' ~
             dify_docker_upgrade_backup_timestamp ~ '-postgres-globals.sql' }}
        dify_docker_uploads_backup_path: >-
          {{ dify_docker_upgrade_backup_dir ~ '/pre-upgrade-' ~
             dify_docker_upgrade_backup_timestamp ~ '-uploads.tar.gz' }}
        dify_docker_agent_home_backup_path: >-
          {{ dify_docker_upgrade_backup_dir ~ '/pre-upgrade-' ~
             dify_docker_upgrade_backup_timestamp ~ '-agent-home.tar.gz' }}
        dify_docker_agent_workspace_backup_path: >-
          {{ dify_docker_upgrade_backup_dir ~ '/pre-upgrade-' ~
             dify_docker_upgrade_backup_timestamp ~ '-agent-workspace.tar.gz' }}
        dify_docker_agent_storage_staging_dir: >-
          {{ dify_docker_upgrade_backup_dir ~ '/pre-upgrade-' ~
             dify_docker_upgrade_backup_timestamp ~ '-agent-storage' }}
        dify_docker_weaviate_backup_path: >-
          {{ dify_docker_upgrade_backup_dir ~ '/pre-upgrade-' ~
             dify_docker_upgrade_backup_timestamp ~ '-weaviate.tar.gz' }}
        dify_docker_weaviate_backup_id: >-
          pre-upgrade-{{ dify_docker_upgrade_backup_timestamp }}

    - name: Set the PostgreSQL pre-upgrade backup path list
      ansible.builtin.set_fact:
        dify_docker_postgres_backup_paths:
          - "{{ dify_docker_postgres_backup_path }}"
          - "{{ dify_docker_plugin_postgres_backup_path }}"
          - "{{ dify_docker_postgres_globals_backup_path }}"

    - name: Ensure the Dify pre-upgrade backup directory exists
      ansible.builtin.file:
        path: "{{ dify_docker_upgrade_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Ensure the Dify Agent backup staging directory exists
      ansible.builtin.file:
        path: "{{ dify_docker_agent_storage_staging_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Require a bounded positive Dify stop timeout
      ansible.builtin.assert:
        that:
          - dify_docker_stop_timeout_seconds | int > 0
          - dify_docker_stop_timeout_seconds | int <= 3600
        fail_msg: Dify compose stop timeout must be between 1 and 3600 seconds.
        quiet: true

    - name: Take live PostgreSQL database backups before the Dify upgrade
      ansible.builtin.shell:
        cmd: >-
          umask 077 && docker compose exec -T db pg_dump
          --username {{ dify_docker_db_user | quote }}
          --dbname {{ item.name | quote }}
          > {{ item.path | quote }}
      args:
        chdir: "{{ dify_docker_data_dir }}"
      loop:
        - name: "{{ dify_docker_db_name }}"
          path: "{{ dify_docker_postgres_backup_path }}"
        - name: "{{ dify_docker_plugin_db_name }}"
          path: "{{ dify_docker_plugin_postgres_backup_path }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    - name: Back up PostgreSQL global roles before the Dify upgrade
      ansible.builtin.shell:
        cmd: >-
          umask 077 && docker compose exec -T db pg_dumpall
          --username {{ dify_docker_db_user | quote }}
          --globals-only
          > {{ dify_docker_postgres_globals_backup_path | quote }}
      args:
        chdir: "{{ dify_docker_data_dir }}"
      changed_when: true

    - name: Read the PostgreSQL pre-upgrade backup files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: dify_docker_postgres_backup_stats
      loop: "{{ dify_docker_postgres_backup_paths }}"

    - name: Require non-empty PostgreSQL pre-upgrade backups
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
        fail_msg: PostgreSQL pre-upgrade backup is missing or empty.
        quiet: true
      loop: "{{ dify_docker_postgres_backup_stats.results }}"

    - name: Set restrictive permissions on the PostgreSQL backups
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ dify_docker_postgres_backup_paths }}"

    - name: Back up Dify uploaded-file storage while the stack is running
      ansible.builtin.command:
        argv:
          - tar
          - --create
          - --gzip
          - --numeric-owner
          - --file
          - "{{ dify_docker_uploads_backup_path }}"
          - --directory
          - "{{ dify_docker_data_dir }}"
          - storage
      args:
        chdir: "{{ dify_docker_data_dir }}"
      changed_when: true

    - name: Read the Dify uploaded-file pre-upgrade backup
      ansible.builtin.stat:
        path: "{{ dify_docker_uploads_backup_path }}"
      register: dify_docker_uploads_backup_stat

    - name: Require a non-empty Dify uploaded-file pre-upgrade backup
      ansible.builtin.assert:
        that:
          - dify_docker_uploads_backup_stat.stat.exists
          - dify_docker_uploads_backup_stat.stat.size > 0
        fail_msg: Dify uploaded-file pre-upgrade backup is missing or empty.
        quiet: true

    - name: Set restrictive permissions on the Dify uploaded-file backup
      ansible.builtin.file:
        path: "{{ dify_docker_uploads_backup_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Verify the Dify uploaded-file archive integrity
      ansible.builtin.command:
        argv:
          - tar
          - --list
          - --gzip
          - --file
          - "{{ dify_docker_uploads_backup_path }}"
      changed_when: false

    - name: Copy Dify Agent snapshot volume (/home/dify/.snapshots) from the live local sandbox
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - cp
          - --archive
          - local_sandbox:/home/dify
          - "{{ dify_docker_agent_storage_staging_dir }}/agent-home"
      args:
        chdir: "{{ dify_docker_data_dir }}"
      changed_when: true
      when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

    - name: Copy Dify Agent workspace storage from the live local sandbox
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - cp
          - --archive
          - local_sandbox:/workspace
          - "{{ dify_docker_agent_storage_staging_dir }}/agent-workspace"
      args:
        chdir: "{{ dify_docker_data_dir }}"
      changed_when: true
      when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

    - name: Back up Dify Agent home snapshot storage while the stack is running
      ansible.builtin.command:
        argv:
          - tar
          - --create
          - --gzip
          - --numeric-owner
          - --file
          - "{{ dify_docker_agent_home_backup_path }}"
          - --directory
          - "{{ dify_docker_agent_storage_staging_dir }}"
          - agent-home
      changed_when: true
      when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

    - name: Read the Dify Agent home pre-upgrade backup
      ansible.builtin.stat:
        path: "{{ dify_docker_agent_home_backup_path }}"
      register: dify_docker_agent_home_backup_stat
      when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

    - name: Require a non-empty Dify Agent home pre-upgrade backup
      ansible.builtin.assert:
        that:
          - dify_docker_agent_home_backup_stat.stat.exists
          - dify_docker_agent_home_backup_stat.stat.size > 0
        fail_msg: Dify Agent home pre-upgrade backup is missing or empty.
        quiet: true
      when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

    - name: Set restrictive permissions on the Dify Agent home backup
      ansible.builtin.file:
        path: "{{ dify_docker_agent_home_backup_path }}"
        owner: root
        group: root
        mode: "0600"
      when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

    - name: Verify the Dify Agent home archive integrity
      ansible.builtin.command:
        argv:
          - tar
          - --list
          - --gzip
          - --file
          - "{{ dify_docker_agent_home_backup_path }}"
      changed_when: false
      when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

    - name: Back up Dify Agent workspace storage while the stack is running
      ansible.builtin.command:
        argv:
          - tar
          - --create
          - --gzip
          - --numeric-owner
          - --file
          - "{{ dify_docker_agent_workspace_backup_path }}"
          - --directory
          - "{{ dify_docker_agent_storage_staging_dir }}"
          - agent-workspace
      changed_when: true
      when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

    - name: Read the Dify Agent workspace pre-upgrade backup
      ansible.builtin.stat:
        path: "{{ dify_docker_agent_workspace_backup_path }}"
      register: dify_docker_agent_workspace_backup_stat
      when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

    - name: Require a non-empty Dify Agent workspace pre-upgrade backup
      ansible.builtin.assert:
        that:
          - dify_docker_agent_workspace_backup_stat.stat.exists
          - dify_docker_agent_workspace_backup_stat.stat.size > 0
        fail_msg: Dify Agent workspace pre-upgrade backup is missing or empty.
        quiet: true
      when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

    - name: Set restrictive permissions on the Dify Agent workspace backup
      ansible.builtin.file:
        path: "{{ dify_docker_agent_workspace_backup_path }}"
        owner: root
        group: root
        mode: "0600"
      when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

    - name: Verify the Dify Agent workspace archive integrity
      ansible.builtin.command:
        argv:
          - tar
          - --list
          - --gzip
          - --file
          - "{{ dify_docker_agent_workspace_backup_path }}"
      changed_when: false
      when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

    - name: Read the running Weaviate container ID for its backup API
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - ps
          - --quiet
          - weaviate
      args:
        chdir: "{{ dify_docker_data_dir }}"
      register: dify_docker_weaviate_container
      changed_when: false

    - name: Require a running Weaviate container before taking its backup
      ansible.builtin.assert:
        that:
          - dify_docker_weaviate_container.stdout | trim | length > 0
        fail_msg: Weaviate is not running; refusing to skip its pre-upgrade backup.
        quiet: true

    - name: Read the running Weaviate container address
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}range .NetworkSettings.Networks{{ '}}' }}{{ '{{' }}.IPAddress{{ '}}' }}{{ '{{' }}end{{ '}}' }}"
          - "{{ dify_docker_weaviate_container.stdout | trim }}"
      register: dify_docker_weaviate_container_address
      changed_when: false

    - name: Require a reachable Weaviate container address
      ansible.builtin.assert:
        that:
          - dify_docker_weaviate_container_address.stdout | trim | length > 0
        fail_msg: Could not determine the running Weaviate container address.
        quiet: true

    - name: Set the Weaviate filesystem backup API URL
      ansible.builtin.set_fact:
        dify_docker_weaviate_backup_api_url: >-
          {{ 'http://' ~ (dify_docker_weaviate_container_address.stdout | trim) ~
             ':' ~ (dify_docker_weaviate_port | string) ~ '/v1/backups/filesystem' }}
        dify_docker_weaviate_meta_api_url: >-
          {{ 'http://' ~ (dify_docker_weaviate_container_address.stdout | trim) ~
             ':' ~ (dify_docker_weaviate_port | string) ~ '/v1/meta' }}

    - name: Read the running Weaviate modules
      ansible.builtin.uri:
        url: "{{ dify_docker_weaviate_meta_api_url }}"
        method: GET
        headers:
          Authorization: "Bearer {{ dify_docker_weaviate_api_key }}"
        status_code: 200
        timeout: 30
        use_proxy: false
      register: dify_docker_weaviate_meta
      changed_when: false
      no_log: true

    - name: Detect whether Weaviate supports filesystem backups
      ansible.builtin.set_fact:
        dify_docker_weaviate_backup_module_available: >-
          {{ 'backup-filesystem' in
             (dify_docker_weaviate_meta.json.modules | default({})) }}

    - name: Start a live Weaviate filesystem backup
      ansible.builtin.uri:
        url: "{{ dify_docker_weaviate_backup_api_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ dify_docker_weaviate_api_key }}"
        body_format: json
        body:
          id: "{{ dify_docker_weaviate_backup_id }}"
        status_code:
          - 200
          - 201
          - 202
        timeout: 30
        use_proxy: false
      register: dify_docker_weaviate_backup_start
      changed_when: true
      no_log: true
      when: dify_docker_weaviate_backup_module_available | bool

    - name: Wait for the Weaviate filesystem backup to finish
      ansible.builtin.uri:
        url: "{{ dify_docker_weaviate_backup_api_url }}/{{ dify_docker_weaviate_backup_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ dify_docker_weaviate_api_key }}"
        status_code: 200
        timeout: 30
        use_proxy: false
      register: dify_docker_weaviate_backup_status
      until: >-
        dify_docker_weaviate_backup_status.json.status | default('')
        in ['SUCCESS', 'FAILED']
      retries: 900
      delay: 2
      changed_when: false
      no_log: true
      when: dify_docker_weaviate_backup_module_available | bool

    - name: Require a successful Weaviate filesystem backup
      ansible.builtin.assert:
        that:
          - dify_docker_weaviate_backup_status.json.status == 'SUCCESS'
        fail_msg: Weaviate filesystem backup did not reach SUCCESS.
        quiet: true
      when: dify_docker_weaviate_backup_module_available | bool

    - name: Archive the completed Weaviate filesystem backup
      ansible.builtin.command:
        argv:
          - tar
          - --create
          - --gzip
          - --numeric-owner
          - --file
          - "{{ dify_docker_weaviate_backup_path }}"
          - --directory
          - "{{ dify_docker_data_dir }}/weaviate/backups"
          - "{{ dify_docker_weaviate_backup_id }}"
      changed_when: true
      when: dify_docker_weaviate_backup_module_available | bool

    - name: Read the Weaviate pre-upgrade backup file
      ansible.builtin.stat:
        path: "{{ dify_docker_weaviate_backup_path }}"
      register: dify_docker_weaviate_backup_stat
      when: dify_docker_weaviate_backup_module_available | bool

    - name: Require a non-empty Weaviate pre-upgrade backup
      ansible.builtin.assert:
        that:
          - dify_docker_weaviate_backup_stat.stat.exists
          - dify_docker_weaviate_backup_stat.stat.size > 0
        fail_msg: Weaviate pre-upgrade backup is missing or empty.
        quiet: true
      when: dify_docker_weaviate_backup_module_available | bool

    - name: Set restrictive permissions on the Weaviate backup
      ansible.builtin.file:
        path: "{{ dify_docker_weaviate_backup_path }}"
        owner: root
        group: root
        mode: "0600"
      when: dify_docker_weaviate_backup_module_available | bool

    - name: Verify the Weaviate pre-upgrade archive integrity
      ansible.builtin.command:
        argv:
          - tar
          - --list
          - --gzip
          - --file
          - "{{ dify_docker_weaviate_backup_path }}"
      changed_when: false
      when: dify_docker_weaviate_backup_module_available | bool

    - name: Stop Dify ingress and scheduler before draining Celery workers
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - stop
          - -t
          - "{{ dify_docker_stop_timeout_seconds | string }}"
          - "{{ item }}"
      args:
        chdir: "{{ dify_docker_data_dir }}"
      loop:
        - worker_beat
        - nginx
        - web
        - api
      loop_control:
        label: "{{ item }}"
      changed_when: true
      when: item in (dify_docker_deployed_services.stdout_lines | default([]))

    - name: Drain Dify workers gracefully before deploying the target version
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - stop
          - -t
          - "{{ dify_docker_stop_timeout_seconds | string }}"
          - worker
      args:
        chdir: "{{ dify_docker_data_dir }}"
      changed_when: true
      when: "'worker' in (dify_docker_deployed_services.stdout_lines | default([]))"

    - name: Stop old Dify worker dependencies after the drain
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - stop
          - -t
          - "{{ dify_docker_stop_timeout_seconds | string }}"
          - "{{ item }}"
      args:
        chdir: "{{ dify_docker_data_dir }}"
      loop:
        - agent_backend
        - local_sandbox
        - plugin_daemon
        - sandbox
        - ssrf_proxy
        - agent_ssrf_proxy
      loop_control:
        label: "{{ item }}"
      changed_when: true
      when: item in (dify_docker_deployed_services.stdout_lines | default([]))

    - name: Stop Weaviate after all pre-upgrade backups are verified
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - stop
          - -t
          - "{{ dify_docker_stop_timeout_seconds | string }}"
          - weaviate
      args:
        chdir: "{{ dify_docker_data_dir }}"
      changed_when: true

    - name: Read the Weaviate persistence mount path for a cold backup
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - >-
            {{ '{{' }}range .Mounts{{ '}}' }}
            {{ '{{' }}if eq .Destination "/var/lib/weaviate"{{ '}}' }}
            {{ '{{' }}.Source{{ '}}' }}
            {{ '{{' }}end{{ '}}' }}
            {{ '{{' }}end{{ '}}' }}
          - "{{ dify_docker_weaviate_container.stdout | trim }}"
      register: dify_docker_weaviate_persistence_path
      changed_when: false
      when: not dify_docker_weaviate_backup_module_available | bool

    - name: Require a Weaviate persistence mount for the cold backup
      ansible.builtin.assert:
        that:
          - dify_docker_weaviate_persistence_path.stdout | trim | length > 0
        fail_msg: Could not determine the Weaviate persistence mount for a cold backup.
        quiet: true
      when: not dify_docker_weaviate_backup_module_available | bool

    - name: Create a cold Weaviate persistence backup after stopping Weaviate
      ansible.builtin.command:
        argv:
          - tar
          - --create
          - --gzip
          - --numeric-owner
          - --file
          - "{{ dify_docker_weaviate_backup_path }}"
          - --directory
          - "{{ dify_docker_weaviate_persistence_path.stdout | trim }}"
          - .
      changed_when: true
      when: not dify_docker_weaviate_backup_module_available | bool

    - name: Read the cold Weaviate pre-upgrade backup file
      ansible.builtin.stat:
        path: "{{ dify_docker_weaviate_backup_path }}"
      register: dify_docker_cold_weaviate_backup_stat
      when: not dify_docker_weaviate_backup_module_available | bool

    - name: Require a non-empty cold Weaviate pre-upgrade backup
      ansible.builtin.assert:
        that:
          - dify_docker_cold_weaviate_backup_stat.stat.exists
          - dify_docker_cold_weaviate_backup_stat.stat.size > 0
        fail_msg: Cold Weaviate pre-upgrade backup is missing or empty.
        quiet: true
      when: not dify_docker_weaviate_backup_module_available | bool

    - name: Set restrictive permissions on the cold Weaviate backup
      ansible.builtin.file:
        path: "{{ dify_docker_weaviate_backup_path }}"
        owner: root
        group: root
        mode: "0600"
      when: not dify_docker_weaviate_backup_module_available | bool

    - name: Verify the cold Weaviate pre-upgrade archive integrity
      ansible.builtin.command:
        argv:
          - tar
          - --list
          - --gzip
          - --file
          - "{{ dify_docker_weaviate_backup_path }}"
      changed_when: false
      when: not dify_docker_weaviate_backup_module_available | bool

  rescue:
    - name: Restart the deployed Dify stack after an unsuccessful backup
      community.docker.docker_compose_v2:
        project_src: "{{ dify_docker_data_dir }}"
        state: present
      no_log: true

    - name: Stop the upgrade after an unsuccessful pre-upgrade backup
      ansible.builtin.fail:
        msg: >-
          Dify upgrade safety failed. The deployed Compose stack was restarted;
          complete PostgreSQL, uploaded-file, Agent snapshot/workspace (when
          configured), and Weaviate backups are required before continuing.
