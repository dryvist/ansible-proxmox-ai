---
- name: Assert router chat roles are available to Dify
  ansible.builtin.assert:
    that:
      - dify_docker_llm_models | default([], true) | length > 0
    fail_msg: >-
      dify_docker_llm_models is empty; the router must expose at least one
      chat capability role before Dify can be configured.
    quiet: true

# The provider cleanup removes every model missing from this list.
- name: Assert the default LLM model is one of Dify's router chat roles
  ansible.builtin.assert:
    that:
      - dify_docker_default_llm_model in (dify_docker_llm_models | map(attribute='name') | list)
    fail_msg: >-
      Default LLM model {{ dify_docker_default_llm_model }} is not among Dify's router chat
      roles ({{ dify_docker_llm_models | map(attribute='name') | join(', ') }}). Check the
      router key scope for the dify key.
    quiet: true
