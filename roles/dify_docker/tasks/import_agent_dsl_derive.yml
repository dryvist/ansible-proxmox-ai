---
# =============================================================================
# Derives the facts the declared-variable checks read, once per app, from the parsed definition.
# The MCP tool nodes are the tool nodes whose provider_type is mcp. Every app runs this, so each
# app's facts come from its own definition; import_agent_dsl.yml clears them when the app ends.
# =============================================================================

- name: Record whether the app declares an AppRole-sourced variable
  ansible.builtin.set_fact:
    dify_docker_dsl_has_approle_entries: >-
      {{ ((dify_docker_dsl_variable_entries | selectattr('approle_role_id', 'defined') | list | length)
          + (dify_docker_dsl_variable_entries | selectattr('approle_secret_id', 'defined') | list | length)) > 0 }}
  no_log: true

- name: Select the MCP tool nodes of this app's definition
  ansible.builtin.set_fact:
    dify_docker_dsl_mcp_nodes: >-
      {{ ((((dify_docker_dsl_document | default({}, true)).workflow | default({}, true))
            .graph | default({}, true)).nodes | default([], true))
         | selectattr('data.type', 'equalto', 'tool')
         | selectattr('data.provider_type', 'equalto', 'mcp') | list }}
  no_log: true

- name: Derive the MCP tool node names and provider ids once
  ansible.builtin.set_fact:
    dify_docker_dsl_mcp_tool_names: >-
      {{ dify_docker_dsl_mcp_nodes | map(attribute='data.tool_name') | map('default', 'unnamed', true) | list }}
    dify_docker_dsl_mcp_provider_ids: >-
      {{ dify_docker_dsl_mcp_nodes | map(attribute='data.provider_id') | map('default', '', true) | list }}
  no_log: true
