---
# One catalog agent app (dify_docker_dsl_name, set by the including loop).
# Publishes the app's native MCP server, activates it, and stores its URL in
# the app's OpenBao leaf (dify_docker_agent_mcp_path) for agentgateway. The
# server_code inside the URL is a bearer secret: it reaches only that leaf,
# and every task that receives, holds or writes it runs with no_log. Check
# mode reads the same endpoints and reports what a live run would change, by
# app name only.
- name: Initialize the accumulated Dify app list for the MCP publish
  ansible.builtin.set_fact:
    dify_docker_agent_apps_all: []
    dify_docker_agent_apps_more: true
  no_log: true

- name: List Dify apps page by page to resolve the agent app id
  ansible.builtin.include_tasks: list_agent_app_page.yml
  loop: "{{ range(1, (dify_docker_app_lookup_max_pages | int) + 1) | list }}"
  loop_control:
    loop_var: dify_docker_app_page
  no_log: true

- name: Resolve exact agent app matches by name
  ansible.builtin.set_fact:
    dify_docker_agent_mcp_app_matches: >-
      {{ dify_docker_agent_apps_all | default([])
         | selectattr('name', 'equalto', dify_docker_dsl_name) | list }}
  no_log: true

- name: Assert exactly one agent app matched the name
  ansible.builtin.assert:
    that:
      - dify_docker_agent_mcp_app_matches | length <= 1
    fail_msg: >-
      More than one Dify app matches the agent name
      "{{ dify_docker_dsl_name }}"; resolve the duplicate before publishing
      its MCP server.

- name: Resolve the agent app id by name
  ansible.builtin.set_fact:
    dify_docker_agent_mcp_app_id: >-
      {{ dify_docker_agent_mcp_app_matches[0].id | default('') }}
  no_log: true

- name: Assert the agent app was found
  ansible.builtin.assert:
    that:
      - dify_docker_agent_mcp_app_id | length > 0
    fail_msg: >-
      The Dify agent app "{{ dify_docker_dsl_name }}" could not be found;
      import the agent DSL catalog first.

- name: Read the agent app MCP server
  ansible.builtin.uri:
    url: >-
      {{ dify_docker_console_api_base }}/apps/{{ dify_docker_agent_mcp_app_id }}/server
    method: GET
    headers:
      Cookie: "{{ dify_docker_console_cookies }}"
      X-CSRF-Token: "{{ dify_docker_console_csrf_token }}"
    status_code: 200
    return_content: true
  register: dify_docker_agent_mcp_server_read
  check_mode: false
  changed_when: false
  no_log: true

- name: Create the agent app MCP server only when the app has none
  ansible.builtin.uri:
    url: >-
      {{ dify_docker_console_api_base }}/apps/{{ dify_docker_agent_mcp_app_id }}/server
    method: POST
    headers:
      Cookie: "{{ dify_docker_console_cookies }}"
      X-CSRF-Token: "{{ dify_docker_console_csrf_token }}"
    body_format: json
    body:
      parameters: {}
    status_code: 201
  register: dify_docker_agent_mcp_server_create
  changed_when: dify_docker_agent_mcp_server_create.status | default(0) == 201
  when:
    - not ansible_check_mode
    - dify_docker_agent_mcp_server_read.json | default({}) == {}
  no_log: true

- name: Resolve the published agent app MCP server
  ansible.builtin.set_fact:
    dify_docker_agent_mcp_server: >-
      {{ dify_docker_agent_mcp_server_create.json
         if dify_docker_agent_mcp_server_create.status | default(0) == 201
         else dify_docker_agent_mcp_server_read.json }}
  no_log: true

- name: Activate the agent app MCP server when it is not active
  ansible.builtin.uri:
    url: >-
      {{ dify_docker_console_api_base }}/apps/{{ dify_docker_agent_mcp_app_id }}/server
    method: PUT
    headers:
      Cookie: "{{ dify_docker_console_cookies }}"
      X-CSRF-Token: "{{ dify_docker_console_csrf_token }}"
    body_format: json
    body:
      id: "{{ dify_docker_agent_mcp_server.id }}"
      description: "{{ dify_docker_agent_mcp_server.description | default('') }}"
      parameters: "{{ dify_docker_agent_mcp_server.parameters | default({}) }}"
      status: active
    status_code: 200
  register: dify_docker_agent_mcp_server_activate
  changed_when: dify_docker_agent_mcp_server_activate.status | default(0) == 200
  when:
    - not ansible_check_mode
    - (dify_docker_agent_mcp_server.status | default('')) != 'active'
  no_log: true

- name: Resolve the agent app MCP server URL
  ansible.builtin.set_fact:
    dify_docker_agent_mcp_url: >-
      {{ dify_docker_public_url | regex_replace('/+$', '') ~
         '/mcp/server/' ~
         (dify_docker_agent_mcp_server.server_code | default('')) ~ '/mcp' }}
  no_log: true

- name: Read the stored agent app MCP server URL from OpenBao
  community.hashi_vault.vault_kv2_get:
    url: "{{ hostvars['localhost'].openbao_secrets_active_addr | default('', true) }}"
    auth_method: token
    token: "{{ openbao_secrets_converge_writer_token }}"
    engine_mount_point: "{{ openbao_secrets_kv_mount }}"
    path: "{{ dify_docker_agent_mcp_path }}"
    validate_certs: "{{ dify_docker_bao_validate_certs }}"
  register: dify_docker_agent_mcp_lookup
  check_mode: false
  failed_when: >-
    dify_docker_agent_mcp_lookup is failed
    and 'Invalid or missing path' not in
      (dify_docker_agent_mcp_lookup.msg | default(''))
  changed_when: false
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true

- name: Detect whether the stored agent app MCP server URL matches
  ansible.builtin.set_fact:
    dify_docker_agent_mcp_url_matches: >-
      {{ (dify_docker_agent_mcp_lookup.secret | default({})).url | default('', true)
         == dify_docker_agent_mcp_url }}
  no_log: true

- name: Detect whether the agent app MCP server needs changes
  ansible.builtin.set_fact:
    dify_docker_agent_mcp_planned_changes: >-
      {{ []
         + (['create its MCP server']
            if dify_docker_agent_mcp_server_read.json | default({}) == {} else [])
         + (['activate its MCP server']
            if (dify_docker_agent_mcp_server.status | default('')) != 'active' else [])
         + (['store its MCP server URL'] if not dify_docker_agent_mcp_url_matches | bool else []) }}
  no_log: true

- name: Report the agent app MCP server changes a live run would make
  ansible.builtin.debug:
    msg: >-
      agent app {{ dify_docker_dsl_name }}: a live run would
      {{ dify_docker_agent_mcp_planned_changes | join(' and ') }}.
  changed_when: true
  when:
    - ansible_check_mode
    - dify_docker_agent_mcp_planned_changes | length > 0

- name: Report a published agent app MCP server
  ansible.builtin.debug:
    msg: >-
      agent app {{ dify_docker_dsl_name }}: its MCP server is published and
      its URL is stored.
  changed_when: false
  when: dify_docker_agent_mcp_planned_changes | length == 0

- name: Store the agent app MCP server URL in OpenBao
  when:
    - not ansible_check_mode
    - not dify_docker_agent_mcp_url_matches | bool
  block:
    - name: Store the agent app MCP server URL through the shared seed_generated task
      delegate_to: localhost
      connection: local
      become: false
      vars:
        ansible_become: false
        openbao_secrets_seed_addr: "{{ hostvars['localhost'].openbao_secrets_active_addr | default('', true) }}"
        openbao_secrets_seed_mount: "{{ openbao_secrets_kv_mount }}"
        openbao_secrets_seed_path: "{{ dify_docker_agent_mcp_path }}"
        openbao_secrets_seed_fields:
          - name: url
            value: "{{ dify_docker_agent_mcp_url }}"
        openbao_secrets_seed_rotate_fields:
          - url
        openbao_secrets_seed_token: "{{ openbao_secrets_converge_writer_token }}"
        openbao_secrets_seed_expected_writer_policy: ansible-converge
        openbao_secrets_seed_check_capabilities: "{{ not ansible_check_mode }}"
        openbao_secrets_seed_revoke_token: false
        openbao_secrets_seed_register: dify_docker_agent_mcp_seed_result
      no_log: true
      # include_role rejects connection; the block carries it, as in storage_and_secret.yml.
      block:
        - name: Run the shared seed_generated task for the agent app MCP server URL
          ansible.builtin.include_role:
            name: dryvist.homelab.openbao_secrets
            tasks_from: seed_generated
