    fail_msg: Dify Agent home pre-upgrade backup is missing or empty.
    quiet: true
  when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

- name: Set restrictive permissions on the Dify Agent home backup
  ansible.builtin.file:
    path: "{{ dify_docker_agent_home_backup_path }}"
    owner: root
    group: root
    mode: "0600"
  when: "'local_sandbox' in (dify_docker_deployed_services.stdout_lines | default([]))"

- name: Verify the Dify Agent home archive integrity
