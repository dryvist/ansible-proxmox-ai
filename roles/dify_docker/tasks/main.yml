---
# Dify (LLMOps platform) deployment.
#
# Installs Docker + Compose on the target LXC, seeds the SECRET_KEY and Agent
# runtime credentials on first run, renders the compose stack, then deploys the
# API, workers, database, vector store, code/Agent sandboxes, Agent backend,
# both SSRF proxies and Nginx.
#
# Docker itself (docker-ce + compose plugin, fuse-overlayfs, the fuse-overlayfs
# daemon.json) is installed by the docker_engine meta dependency (meta/main.yml).
# No venv: Dify deploys via docker_compose_v2, which uses the docker compose CLI
# (not the docker SDK), so compose runs under the system interpreter.
#
# Phases below are ORDER-DEPENDENT: data dirs and the SECRET_KEY must exist
# before the compose file that embeds them is rendered, the stack must be up
# and healthy before the headless setup/login calls it, and a console session
# must exist before any model-provider or seed-app call reuses it.

# dify_docker_llm_models (model_provider.yml) derives its ids from the
# registry; llm_router converges in a different play, so its defaults are not
# in scope here without loading them explicitly. Added to this role's own
# tasks rather than playbooks/site.yml's pre_tasks (the pattern used
# elsewhere): that file is at its own token budget ceiling.
- name: Load the fabric model registry
  ansible.builtin.include_role:
    name: llm_router
    tasks_from: registry.yml
    public: true

- name: Require router chat roles before Dify tasks
  ansible.builtin.include_tasks: assert-model-roles.yml

- name: Data directories and the durable SECRET_KEY
  ansible.builtin.include_tasks: storage_and_secret.yml

- name: Convert existing Redis data to append-only persistence before any restart
  ansible.builtin.include_tasks: redis_persistence.yml
  when:
    - dify_docker_redis_appendonly | bool
    - not ansible_check_mode

- name: Drain and back up Dify before a release upgrade
  ansible.builtin.include_tasks: upgrade_safety.yml
  when: not ansible_check_mode

- name: Render configs/compose and deploy via Docker Compose
  ansible.builtin.include_tasks: config_and_deploy.yml

- name: Headless first-run setup and console login
  ansible.builtin.include_tasks: setup_and_login.yml

- name: Model-provider plugin install and credential provisioning
  ansible.builtin.include_tasks: model_provider.yml

- name: Install and credential declared built-in tool providers
  ansible.builtin.include_tasks: tool_provider_one.yml
  loop: "{{ dify_docker_agent_tool_provider_plugins }}"
  loop_control:
    loop_var: dify_docker_agent_tool_provider
    label: "{{ dify_docker_agent_tool_provider.plugin_id }}"
  when: dify_docker_provision_model_provider | bool

- name: Ensure declared MCP tool providers
  ansible.builtin.include_tasks: mcp_tool_provider_one.yml
  loop: "{{ dify_docker_agent_mcp_providers }}"
  loop_control:
    loop_var: dify_docker_agent_mcp_provider
    label: "{{ dify_docker_agent_mcp_provider.name }}"
  when:
    - dify_docker_provision_model_provider | bool
    - >-
      (bao_local_llm_secrets | default({}, true)).get(
        dify_docker_agent_mcp_provider.openbao_field, '') | length > 0
  no_log: true

- name: Seed a starter chat app (best-effort, idempotent, non-fatal)
  ansible.builtin.include_tasks: seed_app.yml

- name: Import catalog agent DSLs for operator tuning
  ansible.builtin.include_tasks: import_agent_dsls.yml

- name: Wire the tier2 rotation to each agent's webhook trigger
  ansible.builtin.include_tasks: wire_rotation_webhooks.yml
  when:
    - dify_docker_provision_model_provider | bool
    - dify_docker_import_agent_dsls | bool
    # A sliced import wires the rotation only in the slice that imports the rotation app.
    - >-
      dify_docker_agent_dsl_select | length == 0
      or dify_docker_rotation_app_name in dify_docker_agent_dsl_select

- name: Publish each catalog agent app as an MCP server
  ansible.builtin.include_tasks: publish_agent_mcp.yml
  # The built list, so dify_docker_agent_dsl_select slices this step too.
  loop: "{{ dify_docker_agent_dsls | default([]) }}"
  loop_control:
    loop_var: dify_docker_agent_dsl
    label: "{{ dify_docker_agent_dsl.name }}"
  vars:
    dify_docker_dsl_name: "{{ dify_docker_agent_dsl.name }}"
  when:
    - dify_docker_provision_model_provider | bool
    - dify_docker_import_agent_dsls | bool
    - dify_docker_publish_agent_mcp | bool
  no_log: true
