---
# Dify (LLMOps platform) deployment.
#
# Installs Docker + Compose on the target LXC, generates (and persists) a
# SECRET_KEY on first run, renders the bundled compose stack (api/worker/
# worker_beat/web/db/redis/weaviate/sandbox/ssrf_proxy/nginx) plus the nginx and
# squid configs, then deploys via Docker Compose and waits for the web UI.
#
# Docker itself (docker-ce + compose plugin, fuse-overlayfs, the fuse-overlayfs
# daemon.json) is installed by the docker_engine meta dependency (meta/main.yml).
# No venv: Dify deploys via docker_compose_v2, which uses the docker compose CLI
# (not the docker SDK), so compose runs under the system interpreter.
#
# Phases below are ORDER-DEPENDENT: data dirs and the SECRET_KEY must exist
# before the compose file that embeds them is rendered, the stack must be up
# and healthy before the headless setup/login calls it, and a console session
# must exist before any model-provider or seed-app call reuses it.

# dify_docker_llm_models (model_provider.yml) derives its ids from the
# registry; llm_router converges in a different play, so its defaults are not
# in scope here without loading them explicitly. Added to this role's own
# tasks rather than playbooks/site.yml's pre_tasks (the pattern used
# elsewhere): that file is at its own token budget ceiling.
- name: Load the fabric model registry
  ansible.builtin.include_role:
    name: llm_router
    tasks_from: registry.yml
    public: true

- name: Data directories and the durable SECRET_KEY
  ansible.builtin.include_tasks: storage_and_secret.yml

- name: Render configs/compose and deploy via Docker Compose
  ansible.builtin.include_tasks: config_and_deploy.yml

- name: Headless first-run setup and console login
  ansible.builtin.include_tasks: setup_and_login.yml

- name: Model-provider plugin install and credential provisioning
  ansible.builtin.include_tasks: model_provider.yml

- name: Seed a starter chat app (best-effort, idempotent, non-fatal)
  ansible.builtin.include_tasks: seed_app.yml
