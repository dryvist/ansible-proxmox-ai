---
# Headless first-run setup (POST /console/api/setup creates the admin and
# finishes installation), so the UI never shows the /install wizard. The
# instance's OpenBao leaf is authoritative — storage_and_secret.yml seeds the
# fields and reads the stored values back, so login_with_reset.yml re-asserts
# them on every converge — and the environment is the caller fallback. On a
# production host whose leaf lacks DIFY_ADMIN_EMAIL, the role discovers the
# existing owner account's email on the guest before the seed (same task
# file); a fresh install with no owner yet falls back to the caller value.
dify_docker_admin_email: >-
  {{ (bao_local_llm_secrets | default({}, true)).get('DIFY_ADMIN_EMAIL', '')
     or lookup('env', 'DIFY_ADMIN_EMAIL')
     or (dify_docker_admin_email_discovered | default('')) }}
dify_docker_admin_password: >-
  {{ (bao_local_llm_secrets | default({}, true)).get('DIFY_ADMIN_PASSWORD', '')
     or lookup('env', 'DIFY_ADMIN_PASSWORD') }}

# Seed a minimal chat app on first run so there is something to open immediately.
# Best-effort + idempotent (skipped if an app of this name already exists) and
# non-fatal (the console app-create shape drifts across Dify minors). Requires
# model-provider provisioning (it reuses that console session + default model).
dify_docker_seed_app: true
dify_docker_seed_app_name: "Homelab Assistant"

# Import the agent DSLs into the console so the operator can view and tune them.
# An app whose name already exists is re-imported in place (same app id) when its
# recorded catalog sha256 differs from the pin, or when
# dify_docker_agent_dsl_update_existing is true; console edits to it are then
# overwritten. Otherwise it is skipped. The pinned catalog manifest supplies public
# DSL paths and sha256 values; all public files are verified before any import.
# Requires model-provider provisioning (console session).
dify_docker_import_agent_dsls: false

# Catalog entry names to import in this run; empty imports every manifest entry.
# A first import too long for one run goes in named slices.
dify_docker_agent_dsl_select: []

# Re-import every selected public catalog app that already exists, even when its
# recorded catalog sha256 matches. Private DSL entries keep their existing behavior.
dify_docker_agent_dsl_update_existing: false

# Private agent DSL sources. Empty here and never committed: the list is supplied
# at converge time from a private source (extra vars or inventory), not from
# vars/agent_dsls.yml, whose include_vars would override a supplied value.
# Each entry has the same shape as a catalog-derived public DSL entry (name,
# url, sha256), with the commit pin carried in its url. Entries are fetched
# with the bearer token below, verified against their sha256, and imported like
# the public DSLs: an app whose name already exists is skipped.
dify_docker_private_agent_dsls: []
# Read-only token for the private sources, supplied the same way. Private
# entries are not fetched while it is empty. The token only reaches no_log tasks.
dify_docker_private_agent_dsl_token: ""

# After the import, wire the rotation catalog workflow to each agent app's
# webhook trigger. The agent set is read from the rotation draft's own
# <AGENT>_TRIGGER_URL/<AGENT>_WEBHOOK_ID variable pairs (AI_NEWS maps to the
# app "ai-news"), so no agent list is kept here; this is the rotation app's
# catalog entry name.
dify_docker_rotation_app_name: tier2-rotation

# Declared environment variables for catalog apps, keyed by catalog app name. Each entry
# sets one draft variable and names exactly one source:
#   value: plain text supplied by the caller.
#   kv: {path, field} read from the KV mount; the value is never written back anywhere.
#   approle_role_id: {approle} reads the role id of an AppRole.
#   approle_secret_id: {approle} mints a secret id with dify_docker_agent_secret_id_ttl.
# secret: true stores the draft variable with the secret value type. Placeholders only:
#   dify_docker_agent_app_variables:
#     example-app:
#       - name: EXAMPLE_TOKEN
#         secret: true
#         kv: {path: example/app, field: token}
dify_docker_agent_app_variables:
  pr-keeper:
    - name: PR_AUTOMATION_SHADOW
      secret: false
      value: "true"
    - name: PR_AUTOMATION_REPOS
      secret: false
      value: JacobPEvans-ai/pr-automation-fixture
  merge-steward:
    - name: PR_AUTOMATION_SHADOW
      secret: false
      value: "true"
    - name: PR_AUTOMATION_REPOS
      secret: false
      value: JacobPEvans-ai/pr-automation-fixture
# Placeholder text in a catalog app's DSL mapped to a workspace tool provider name. Each
# placeholder is replaced by that provider's id before the app is imported.
dify_docker_agent_tool_providers: {}
# Lifetime of each AppRole secret id minted for a declared variable. After each publish, the
# secret ids minted in the run are kept; of the older ids of the same app, only the newest is kept.
dify_docker_agent_secret_id_ttl: 720h
# The metadata key that names the catalog app on each secret id minted for it. The prune destroys
# only the ids whose metadata names the app being reconciled.
dify_docker_agent_secret_id_app_metadata_key: dify_app
# The issuer AppRole mints, lists, looks up and destroys the secret ids. Its role id and secret id
# are read from the environment variables named here. It logs in through the auth mount below, and
# the AppRole API calls use that same mount.
dify_docker_agent_issuer_env_names:
  role_id: OPENBAO_APPROLE_DIFY_AGENT_SECRET_ID_ISSUER_ROLE_ID
  secret_id: OPENBAO_APPROLE_DIFY_AGENT_SECRET_ID_ISSUER_SECRET_ID
dify_docker_agent_issuer_role_id: >-
  {{ lookup('env', dify_docker_agent_issuer_env_names.role_id) | default('', true) }}
dify_docker_agent_issuer_secret_id: >-
  {{ lookup('env', dify_docker_agent_issuer_env_names.secret_id) | default('', true) }}
dify_docker_agent_issuer_auth_mount: approle
# Per-app views of the maps above, evaluated lazily for the catalog app being imported.
dify_docker_dsl_variable_entries: "{{ dify_docker_agent_app_variables.get(dify_docker_dsl_name, []) }}"
dify_docker_dsl_tool_provider_map: "{{ dify_docker_agent_tool_providers.get(dify_docker_dsl_name, {}) }}"
dify_docker_dsl_has_variables: >-
  {{ (dify_docker_dsl_variable_entries | length > 0)
     or (dify_docker_dsl_tool_provider_map | length > 0) }}
# When true, each selected catalog app reads its declared config from its per-app OpenBao leaf,
# the leaf at dify_docker_openbao_path/dify_docker_agent_app_leaf_segment/<app>. The leaf's
# variables_json field is a list in the dify_docker_agent_app_variables shape, and its
# tool_providers_json field is a map in the dify_docker_agent_tool_providers shape. The parsed
# fields become that app's entries. An app whose inventory also declares entries fails. Both
# fields are required for every selected app.
dify_docker_agent_app_config_from_leaf: false
# Catalog apps that run in live mode. For an app not listed here, every declared variable whose
# name ends with dify_docker_agent_mode_suffix must resolve to dify_docker_agent_mode_shadow_value,
# compared after trimming and lowercasing. Any other value fails the app before its import.
dify_docker_agent_live_apps: []
dify_docker_agent_mode_suffix: _MODE
dify_docker_agent_mode_shadow_value: shadow
# The declared-variable checks run for an app that has declared entries, an MCP tool node, or an
# environment variable with an empty value in its definition. Other apps skip them.
dify_docker_dsl_declared_check_needed: >-
  {{ dify_docker_dsl_has_variables | bool
     or (dify_docker_dsl_mcp_tool_names | length > 0)
     or ((((dify_docker_dsl_document | default({}, true)).workflow | default({}, true))
          .environment_variables | default([], true))
         | selectattr('value', 'equalto', '') | list | length > 0) }}
