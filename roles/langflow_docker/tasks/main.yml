---
# LangFlow Docker deployment.
#
# Installs Docker + Compose on the target LXC, seeds the LangFlow secrets in
# OpenBao (ai/langflow) and keeps an on-guest LANGFLOW_SECRET_KEY copy, then
# deploys the langflowai/langflow image plus a PostgreSQL backend via Docker Compose.
#
# Docker itself (docker-ce + compose plugin, fuse-overlayfs, the fuse-overlayfs
# daemon.json) is installed by the docker_engine meta dependency (meta/main.yml).
# No venv: LangFlow deploys via docker_compose_v2, which uses the docker compose
# CLI (not the docker SDK), so compose runs under the system interpreter.

# =============================================================================
# Data Directories
# Postgres writes to a bind-mounted volume; the image entrypoint runs as its
# own UID (postgres: 999) which, in an unprivileged LXC, maps to a subuid —
# leave ownership defaults, chown happens inside the container.
# =============================================================================

- name: Create LangFlow data subdirectories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ langflow_docker_data_dir }}"
    - "{{ langflow_docker_postgres_data_dir }}"
    - "{{ langflow_docker_app_data_dir }}"

# =============================================================================
# Secrets (stored in OpenBao, persisted on disk)
# =============================================================================
# The secret store (ai/langflow) is the authority: a stored value is never
# replaced. A value from the environment, or the on-guest LANGFLOW_SECRET_KEY
# file, is imported only when the store lacks the field. A field with neither
# is generated by the shared seed_generated task. The image needs the secret key
# at boot to decrypt stored credentials, so it must never be regenerated.

- name: Check for existing LangFlow SECRET_KEY
  ansible.builtin.stat:
    path: "{{ langflow_docker_data_dir }}/.secret_key"
  register: langflow_docker_secret_key_stat

- name: Read LangFlow SECRET_KEY into memory
  ansible.builtin.slurp:
    src: "{{ langflow_docker_data_dir }}/.secret_key"
  register: langflow_docker_secret_key_file
  when: langflow_docker_secret_key_stat.stat.exists
  no_log: true

- name: Resolve the caller LANGFLOW_SECRET_KEY (inventory override, then on-guest file)
  ansible.builtin.set_fact:
    langflow_docker_secret_key_caller: >-
      {{ langflow_docker_secret_key
         if langflow_docker_secret_key | length > 0
         else ((langflow_docker_secret_key_file.content | default('') | b64decode | trim)
               if langflow_docker_secret_key_stat.stat.exists else '') }}
  no_log: true

- name: Check whether PostgreSQL has initialized the LangFlow data directory
  ansible.builtin.stat:
    path: "{{ langflow_docker_postgres_data_dir }}/PG_VERSION"
  register: langflow_docker_postgres_initialized
  changed_when: false

- name: Seed the LangFlow secrets through the shared seed_generated task
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Store the LangFlow secrets in ai/langflow, keeping any stored value
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ hostvars['localhost'].openbao_secrets_active_addr | default('', true) }}"
        openbao_secrets_seed_mount: "{{ openbao_secrets_kv_mount }}"
        openbao_secrets_seed_path: ai/langflow
        openbao_secrets_seed_fields:
          - name: LANGFLOW_SUPERUSER
            value: "{{ langflow_docker_superuser }}"
            generate: "{{ not langflow_docker_postgres_initialized.stat.exists }}"
          - name: LANGFLOW_SUPERUSER_PASSWORD
            value: "{{ langflow_docker_superuser_password }}"
            generate: "{{ not langflow_docker_postgres_initialized.stat.exists }}"
          - name: LANGFLOW_DB_PASSWORD
            value: "{{ langflow_docker_db_password }}"
            generate: "{{ not langflow_docker_postgres_initialized.stat.exists }}"
          - name: LANGFLOW_SECRET_KEY
            length: 50
            charset: alnum
            value: "{{ langflow_docker_secret_key_caller }}"
            generate: "{{ not langflow_docker_postgres_initialized.stat.exists }}"
        openbao_secrets_seed_token: "{{ openbao_secrets_converge_writer_token }}"
        openbao_secrets_seed_expected_writer_policy: ansible-converge
        openbao_secrets_seed_check_capabilities: "{{ not ansible_check_mode }}"
        openbao_secrets_seed_revoke_token: false
        openbao_secrets_seed_register: langflow_docker_seed_result

- name: Resolve the effective LangFlow secrets from the secret store
  ansible.builtin.set_fact:
    langflow_docker_superuser: "{{ langflow_docker_seed_result.LANGFLOW_SUPERUSER }}"
    langflow_docker_superuser_password: "{{ langflow_docker_seed_result.LANGFLOW_SUPERUSER_PASSWORD }}"
    langflow_docker_db_password: "{{ langflow_docker_seed_result.LANGFLOW_DB_PASSWORD }}"
    langflow_docker_secret_key: "{{ langflow_docker_seed_result.LANGFLOW_SECRET_KEY }}"
  no_log: true

- name: Require the on-guest LANGFLOW_SECRET_KEY to match the stored value
  ansible.builtin.assert:
    that:
      - (langflow_docker_secret_key_file.content | b64decode | trim) == langflow_docker_secret_key
    fail_msg: >-
      The on-guest LangFlow SECRET_KEY differs from the stored LANGFLOW_SECRET_KEY field.
      The stored value is authoritative and the guest file was not rewritten.
    quiet: true
  when: langflow_docker_secret_key_stat.stat.exists
  no_log: true

- name: Write the on-guest LangFlow SECRET_KEY from the stored value when absent
  ansible.builtin.copy:
    dest: "{{ langflow_docker_data_dir }}/.secret_key"
    content: "{{ langflow_docker_secret_key }}"
    owner: root
    group: root
    mode: "0600"
  when: not langflow_docker_secret_key_stat.stat.exists
  no_log: true

# =============================================================================
# Compose File
# =============================================================================

- name: Assert every secret rendered into the LangFlow compose file is present
  ansible.builtin.include_role:
    name: dryvist.homelab.openbao_secrets
    tasks_from: assert_nonempty.yml
  vars:
    openbao_secrets_required_vars:
      - langflow_docker_superuser_password
      - langflow_docker_db_password

- name: Render LangFlow docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ langflow_docker_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"  # contains SECRET_KEY, superuser + DB passwords
  no_log: true
  notify: Restart langflow

# =============================================================================
# Deploy via Docker Compose
# =============================================================================

- name: Deploy LangFlow via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ langflow_docker_data_dir }}"
    state: present
  register: langflow_docker_compose_result
  changed_when: >-
    (langflow_docker_compose_result.actions | default([]))
    | selectattr('status', 'in', ['Creating', 'Recreating', 'Pulling', 'Building'])
    | list | length > 0
  no_log: true

# =============================================================================
# Health Check
# First boot can take a few minutes: postgres initdb, then LangFlow running its
# database migrations against the fresh DB before the web server answers.
# =============================================================================

- name: Wait for LangFlow web port to accept TCP connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ langflow_docker_web_port }}"
    timeout: 300

- name: Verify LangFlow health_check endpoint
  ansible.builtin.uri:
    # /health_check validates DB + chat-service connectivity (returns 500 if
    # either is down). /health is served by uvicorn before LangFlow initializes,
    # so it is NOT a reliable readiness signal.
    url: "http://127.0.0.1:{{ langflow_docker_web_port }}/health_check"
    method: GET
    status_code: 200
    return_content: false
  register: langflow_docker_health
  retries: 30
  delay: 10
  until: langflow_docker_health.status == 200
  changed_when: false
  when: not ansible_check_mode
