---
# audio.cpp speech server (audiocpp_server), API-only, CPU backend.
# Pinned to the upstream release; the sha256 is the digest GitHub publishes
# for the CPU asset.
# renovate: datasource=github-releases depName=0xShug0/audio.cpp
audiocpp_release_version: "0.9.6"
audiocpp_release_tag: "v{{ audiocpp_release_version }}"
audiocpp_release_asset: "audio-{{ audiocpp_release_tag }}-bin-ubuntu-x64-cpu.tar.gz"
audiocpp_release_sha256: "18f6f745c006eaaca3bbe6955ec2de4964bf29a25fab409c46b23616c65a652a"
audiocpp_release_download_url: "https://github.com/0xShug0/audio.cpp/releases/download/{{ audiocpp_release_tag }}"
audiocpp_release_url: "{{ audiocpp_release_download_url }}/{{ audiocpp_release_asset }}"

audiocpp_user: audiocpp
audiocpp_group: audiocpp
audiocpp_install_dir: /opt/audiocpp
audiocpp_data_dir: /var/lib/audiocpp
audiocpp_config_dir: /etc/audiocpp
audiocpp_config_file: "{{ audiocpp_config_dir }}/server.json"
audiocpp_server_bin: "{{ audiocpp_install_dir }}/audiocpp_server"
audiocpp_service_name: audiocpp-server

# Loopback only: the server's model-management endpoints load server-local
# paths, so it is not published on the network from this role.
audiocpp_host: 127.0.0.1
audiocpp_api_port: "{{ tofu_data.constants.service_ports.audiocpp_api }}"
audiocpp_threads: 4
audiocpp_max_loaded_models: 1

# Read-only shared models mount. This role never downloads or writes weights.
audiocpp_models_dir: "{{ container_models_mount_path | default('', true) }}"

# Models served by this host. Each entry: id (the request model name), family
# (audio.cpp model family), file (GGUF name on the models mount), task (asr|tts).
audiocpp_models: []
