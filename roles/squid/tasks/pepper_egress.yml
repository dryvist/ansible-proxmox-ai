---
- name: Derive Pepper domains from inventory without an agent play
  ansible.builtin.include_role:
    name: hermes_agent
    tasks_from: egress_domains
  vars:
    hermes_agent_egress_inventory: "{{ hostvars[squid_pepper_host] }}"
    hermes_agent_identity: "{{ hostvars[squid_pepper_host].hermes_agent_identity }}"
    hermes_agent_bao: "{{ hostvars[squid_pepper_host].hermes_agent_bao | default({}) }}"

- name: Index the resolved Pepper domains for this proxy render
  ansible.builtin.set_fact:
    squid_pepper_domains: >-
      {{ squid_pepper_domains | default({}) | combine({squid_pepper_host: hermes_agent_pepper_egress_domains}) }}
