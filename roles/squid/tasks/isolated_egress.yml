---
- name: Derive an isolated host's domains from inventory without an agent play
  ansible.builtin.include_role:
    name: hermes_agent
    tasks_from: egress_domains
  vars:
    hermes_agent_egress_inventory: "{{ hostvars[squid_isolated_host] }}"
    hermes_agent_egress_host_overrides: >-
      {{ squid_isolated_endpoint_hosts_by_identity.get(hostvars[squid_isolated_host].hermes_agent_identity, {}) }}
    hermes_agent_identity: "{{ hostvars[squid_isolated_host].hermes_agent_identity }}"

- name: Index the host's resolved domains for this proxy render
  ansible.builtin.set_fact:
    squid_isolated_domains: >-
      {{ squid_isolated_domains | default({}) | combine({squid_isolated_host: hermes_agent_isolated_egress_domains}) }}
