---
# redis — a native apt install in a plain LXC (no Docker), matching how every
# other single-binary service in this repository is deployed. Ansible owns the
# config and the unit; idempotent.

- name: Install redis-server
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the data directory exists and is owned by redis
  ansible.builtin.file:
    path: "{{ redis_data_dir }}"
    state: directory
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: "0750"

# Debian's redis-server.service sets PrivateUsers, which needs user-namespace
# setup an unprivileged Proxmox LXC denies: the unit dies with
# "Failed to set up user namespacing: Permission denied" and status=217/USER
# before redis ever reads its config. Same override the nautobot role in
# ansible-proxmox-apps already carries for the same package and the same
# reason. Written before the start task below, whose daemon_reload picks the
# drop-in up; the notify covers a later change to the override alone.
- name: Ensure the redis systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/redis-server.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the unprivileged-LXC systemd override
  ansible.builtin.copy:
    dest: /etc/systemd/system/redis-server.service.d/lxc-override.conf
    content: |
      # Managed by Ansible (redis role).
      # Debian's Redis unit enables PrivateUsers, which requires user namespace
      # setup that unprivileged Proxmox LXCs deny.
      [Service]
      PrivateUsers=no
    owner: root
    group: root
    mode: "0644"
  notify: Restart redis

- name: Assert every secret rendered into the redis configuration is present
  ansible.builtin.include_tasks: >-
    {{ role_path }}/../openbao_secrets/tasks/assert_nonempty.yml
  vars:
    openbao_secrets_assert_context: the redis configuration
    openbao_secrets_assert_names:
      - redis_password

- name: Render the redis configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ redis_config_file }}"
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    # 0640 — the file carries requirepass. World-readable would put the
    # credential in reach of every account on the guest.
    mode: "0640"
    # No `validate:` here on purpose. redis-server has no parse-and-exit mode —
    # the closest invocation STARTS the server — so any validate command would
    # have to end in `|| true` to be safe, and a check that cannot fail is worse
    # than no check: it reads as verification while verifying nothing. A bad
    # config surfaces on the restart below, which does fail the converge.
  notify: Restart redis

- name: Enable and start redis
  ansible.builtin.systemd_service:
    name: "{{ redis_service }}"
    state: started
    enabled: true
    daemon_reload: true
