---
# Hindsight agent-memory service (vectorize-io/hindsight) — one stateless API
# replica per hindsight-tagged LXC, all state in the dedicated ai-VLAN
# PostgreSQL cluster (postgres_ai_group, ansible-proxmox-apps). The REST API
# also serves the built-in MCP endpoint (/mcp single-bank, /mcp/ multi-bank).
# Concrete release tag, never :latest. Renovate's docker datasource cannot
# order a floating tag, so it can never compute an upgrade target and silently
# proposes nothing — the pin reads as managed while no bump is possible.
hindsight_docker_image: "ghcr.io/vectorize-io/hindsight:0.9.0"
hindsight_docker_container_name: hindsight
hindsight_docker_data_dir: /opt/hindsight
hindsight_docker_storage_driver: "fuse-overlayfs"

# Ports come from the tofu-owned pipeline constants (memory_ports) — never
# literals here. mandatory() fails the play loudly on a stale inventory.
_hindsight_docker_port_err: >-
  tofu_data.constants.memory_ports.hindsight_* missing —
  regenerate tofu_inventory.json (apply tofu-proxmox)
hindsight_docker_api_port: >-
  {{ (tofu_data | mandatory(_hindsight_docker_port_err))
     ['constants']['memory_ports']['hindsight_api']
     | mandatory(_hindsight_docker_port_err) }}
hindsight_docker_cp_port: >-
  {{ (tofu_data | mandatory(_hindsight_docker_port_err))
     ['constants']['memory_ports']['hindsight_cp']
     | mandatory(_hindsight_docker_port_err) }}

# --- Database (dedicated ai-VLAN Postgres cluster) --------------------------
# Primary's FQDN by name, never an address; DB/user/database all `hindsight`.
hindsight_docker_db_host: "postgres-ai-1.{{ tofu_data.domain }}"
hindsight_docker_db_port: >-
  {{ tofu_data['constants']['service_ports']['postgres_default']
     | mandatory('tofu_data.constants.service_ports.postgres_default missing — regenerate tofu_inventory.json') }}
hindsight_docker_db_name: hindsight
hindsight_docker_db_user: hindsight
# bao-first (apps/hindsight, generated at source) with an env fallback for
# molecule / Doppler runs.
hindsight_docker_db_password: >-
  {{ bao_apps_secrets.hindsight_db_password
     | mandatory('hindsight_db_password was not supplied to this role') }}
# Single source for the DSN: the compose template and the one-shot migration
# command (tasks/run_db_migration.yml) both interpolate this rather than
# each rebuilding the connection string from the parts above.
hindsight_docker_db_url: >-
  postgresql://{{ hindsight_docker_db_user }}:{{ hindsight_docker_db_password }}@{{
  hindsight_docker_db_host }}:{{ hindsight_docker_db_port }}/{{ hindsight_docker_db_name }}

# --- LLM (fact extraction / reflection) --------------------------------------
# The SAME shared route the hindsight virtual key is scoped to (`free`,
# llm_router's 56-virtual-keys.yml) — every genuinely free deployment in
# the registry, nothing else. A stable route name, not a registry value
# (llm-models.d/40-hermes-cloud.yml / 50-openrouter.yml's route_group, never
# a client_model_id), so it is typed literally here the same way `cheap`
# is elsewhere — no cross-role variable needed.
hindsight_docker_retain_llm_model: free
hindsight_docker_llm_base_url: "https://llm.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/v1"
# The base model, backing reflect + consolidation (and any other operation
# upstream adds) via Hindsight's own per-operation fallback. Reuses the
# retain route above rather than a second literal or ai_default_model (the
# general fabric brain, which this key cannot call) — one value, one source.
hindsight_docker_llm_model: "{{ hindsight_docker_retain_llm_model }}"
# bao-first (apps/hindsight, generated at source, same per-caller-key contract
# open-webui/langgraph already use).
hindsight_docker_llm_api_key: >-
  {{ lookup('env', 'HINDSIGHT_LLM_API_KEY')
     | default(bao_apps_secrets.hindsight_llm_router_key, true)
     | mandatory('hindsight_llm_router_key is not seeded: run the apps openbao provisioning first') }}

hindsight_docker_retain_llm_max_concurrent: 1
hindsight_docker_retain_llm_max_retries: 1
# Backoff BEFORE a retry, native to the vendor image (no separate inter-item
# pacing knob exists). With max_concurrent/max_retries above this paces a
# 429'd backlog item to roughly the router's per-key rpm_limit (56-virtual-
# keys.yml `hindsight` entry) instead of hot-looping against it.
hindsight_docker_retain_llm_initial_backoff: "2.0"
hindsight_docker_retain_llm_max_backoff: "30.0"

# --- Control Plane UI ---------------------------------------------------------
# Access-key gated (the API itself is unauthenticated inside the default-deny
# firewall). bao-first, generated at source.
hindsight_docker_cp_access_key: >-
  {{ bao_apps_secrets.hindsight_cp_access_key
     | mandatory('hindsight_cp_access_key was not supplied to this role') }}

# --- HA ------------------------------------------------------------------------
# Stable per-replica worker identity: background tasks (reflection, fact
# extraction) are claimed in Postgres under this id; a random hostname would
# orphan previously-claimed tasks across restarts. inventory_hostname is
# stable per LXC, which is exactly what upstream requires.
hindsight_docker_worker_id: "{{ inventory_hostname }}"

# Decommission worker ids that own claimed-but-orphaned processing tasks and
# no longer have a matching host in hindsight_group (a removed/renamed guest).
# Runs once per converge, before any replica is redeployed, via
# tasks/decommission_stale_workers.yml (imported from playbooks/site.yml
# pre_tasks so a failure here is fatal to the whole rolling play, matching
# max_fail_percentage: 0 — a role-tasks failure would instead be swallowed by
# site.yml's per-replica isolation rescue).
hindsight_docker_decommission_stale_workers: true

# --- Database migrations (0.10.0 made this explicit; upstream default is
# HINDSIGHT_API_RUN_MIGRATIONS_ON_STARTUP=true) ------------------------------
# Startup-time migrations race every replica against the same schema change
# on a serial:1 rollout — replica 2 can start mid-migration against a
# half-applied schema. Migrations instead run exactly once, from
# tasks/run_db_migration.yml (pre_tasks, same fatal-on-failure reasoning as
# the worker decommission above), using the NEW image before any replica is
# redeployed with it.
hindsight_docker_run_migrations_on_startup: false

# This repo has no reachable signal for pgBackRest backup freshness on
# postgres-ai-1 — that role (and its pgbackrest.yml / pg-backup.timer) lives
# in ansible-proxmox-apps and exposes no cross-repo age check or trigger
# today (Vikunja follow-up: add one, project 43 proxmox). The migration gate
# therefore fails closed on an explicit human confirmation rather than
# guessing at backup age: set to true (e.g.
# `-e hindsight_docker_migration_backup_confirmed=true`) only after
# confirming a recent full backup exists (`pgbackrest info` on
# postgres-ai-1) or triggering one via the existing pg-backup.timer /
# pgbackrest-backup@.timer units.
hindsight_docker_migration_backup_confirmed: false

# --- Explicit operation timeouts (0.10.0 wall-clock LLM deadline,
# vectorize-io/hindsight#4784) ------------------------------------------------
# Upstream's own defaults (retain 3600s / consolidation 7200s) are loose
# enough that a wedged worker slot still isn't reclaimed on any timescale a
# real hang actually happens on (vectorize-io/hindsight#4581) — set explicit
# ceilings here, each well under an hour, rather than inherit the loose
# default. Values are budget, not measurement: this fabric's LLM calls run
# against local/router models with the existing per-request timeouts
# (hindsight_docker_llm_base_url), so these are outer wall-clock backstops,
# not the expected steady-state duration.
hindsight_docker_retain_wall_timeout: 300
hindsight_docker_consolidation_wall_timeout: 900
hindsight_docker_reflect_wall_timeout: 120
hindsight_docker_refresh_mental_model_wall_timeout: 120

# Local ONNX embeddings (bundled BGE model) — no external embedding dependency.
hindsight_docker_embeddings_provider: local

# POST-only stateless MCP so the two-replica pool needs no session affinity
# (see the compose template comment). Only flip to false for a single-replica
# deployment that wants SSE streaming.
hindsight_docker_mcp_stateless: true

# Cold-start budget for the readiness gate. A fresh guest must download the
# local embeddings + reranker models and verify the LLM connection (which
# blocks on a llama-swap model load) before /health answers; a warm converge
# answers immediately, so these ceilings only bite on first deploy. Molecule
# overrides them down — its scenario has no fabric router to wait on.
hindsight_docker_startup_timeout: 600
hindsight_docker_health_retries: 60
hindsight_docker_health_delay: 10
