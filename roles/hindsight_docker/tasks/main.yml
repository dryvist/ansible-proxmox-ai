---
- name: Enforce the stopped state without changing stored data
  ansible.builtin.import_tasks: contain.yml
  when: not (hindsight_service_enabled | default(false) | bool)

- name: Configure Hindsight for an enabled service or an approved upgrade
  ansible.builtin.import_tasks: deploy.yml
  when: >-
    (hindsight_service_enabled | default(false) | bool)
    or (hindsight_docker_migration_approved | bool)
