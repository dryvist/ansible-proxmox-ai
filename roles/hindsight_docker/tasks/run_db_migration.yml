---
# Runs the Hindsight database migration exactly once, using the target
# image, before any replica is redeployed with
# HINDSIGHT_API_RUN_MIGRATIONS_ON_STARTUP=false. Imported from
# playbooks/hindsight.yml pre_tasks (not tasks/main.yml), so a failure here
# is fatal to the whole play rather than recorded as one replica's isolated
# failure.
#
# Takes its own pre-migration backup via the vendored `hindsight-admin
# backup` command and refuses to migrate unless that file exists, is
# non-empty, AND is a valid, restorable zip archive — no human confirmation
# step. HINDSIGHT_API_DATABASE_URL and HINDSIGHT_API_VECTOR_EXTENSION are
# passed via `environment:` and a bare `-e` (no inline value): the DSN never
# appears in argv/`ps` output on the host, and the vector extension matches
# the compose template's own value (run-db-migration reconciles indexes
# against it).
#
# The backup container runs as root (--user root): the image's default
# user can't write into a bind-mounted host directory that Ansible just
# created, since that directory is owned by whichever user ran this play
# (root, under become) — matching the same non-root/bind-mount conflict
# the compose template's cache volume comment already documents.
#
# A first-ever deploy has no schema yet, so there is nothing to back up
# before run-db-migration creates it from scratch. This is detected
# positively — probing for Alembic's own `alembic_version` tracker table
# (the table run-db-migration itself creates and stamps; confirmed at
# both the v0.9.0 and v0.10.1 vendor tags, same table, no version_table
# override) — rather than by pattern-matching a backup failure message,
# so a real partially-broken schema (some tables present, others missing)
# still takes a backup and still fails the play like any other backup
# failure, instead of being silently skipped.
#
# Both the backup and the migration are additionally gated on a migration
# actually being pending, so a converge against an already-migrated
# database changes nothing: the database's current revision (queried from
# alembic_version once a schema exists) is compared against the image's
# target head revision, read from the vendored `alembic` CLI (bundled in
# the image alongside `hindsight-admin`; confirmed at both the v0.9.0 and
# v0.10.1 tags) via `alembic heads` against a one-line generated config —
# no database connection needed for that side. A migration is pending
# when there is no schema yet, or the current revision differs from the
# head. The migration task's own changed_when additionally derives from
# Alembic's own log output (confirmed at the pinned v0.9.0 tag: a real
# upgrade logs "Running upgrade <rev> -> <rev>, ..." per revision to
# stderr; a no-op run logs none), so it reports accurately even if
# nothing above ever puts it in that position.
#
# When a migration IS pending, every replica's API/worker containers are
# stopped first (delegate_to looped over the whole group, so this fires
# regardless of which batch/host is currently converging) so an old
# replica never keeps serving against the migrated schema for the rest of
# a serial:1 rollout — a brief planned outage is accepted in exchange.
# Direct connection, not a pooler: this role connects straight to
# hindsight_docker_db_host (defaults/main.yml), so a failed
# run-db-migration's session-scoped advisory lock releases as soon as the
# --rm container exits, not exposed to the pooled-connection wedge
# upstream has documented elsewhere.
#
# The backup, migration, and worker-status/decommission commands
# (decommission_stale_workers.yml) all set no_log: true, since a
# connection-error message from any of them can echo the DSN; each is
# followed by an explicit rc-only assertion so a real failure still
# surfaces without depending on the withheld output.

- name: Ensure the pre-migration backup directory exists
  ansible.builtin.file:
    path: "{{ hindsight_docker_migration_backup_dir }}"
    state: directory
    mode: "0700"
  run_once: true

- name: Install the database client used to probe for an existing schema
  ansible.builtin.apt:
    name: postgresql-client
    state: present
  run_once: true

- name: Probe whether the Alembic migration tracker table already exists
  ansible.builtin.command:
    argv:
      - psql
      - >-
        postgresql://{{ hindsight_docker_db_user }}@{{ hindsight_docker_db_host }}:{{
        hindsight_docker_db_port }}/{{ hindsight_docker_db_name }}
      - -tAc
      - "SELECT to_regclass('public.alembic_version') IS NOT NULL"
  environment:
    # The password never rides argv (visible in /proc/*/cmdline, ps, and
    # audit logs for the probe's lifetime); PGPASSWORD is psql's own
    # env-var credential path.
    PGPASSWORD: "{{ hindsight_docker_db_password }}"
  register: hindsight_docker_schema_probe
  run_once: true
  changed_when: false
  # An inconclusive probe (connection error, unexpected output) must fail
  # the play rather than silently fall through to "no schema, skip the
  # backup" — that would make a transient probe failure indistinguishable
  # from a genuinely fresh database and skip a backup that was needed.
  failed_when: >-
    hindsight_docker_schema_probe.rc != 0
    or (hindsight_docker_schema_probe.stdout | default('') | trim) not in ['t', 'f']

- name: Record whether an existing schema was found
  ansible.builtin.set_fact:
    hindsight_docker_schema_exists: "{{ (hindsight_docker_schema_probe.stdout | trim) == 't' }}"
  run_once: true

- name: Probe the database's current Alembic revision
  ansible.builtin.command:
    argv:
      - psql
      - >-
        postgresql://{{ hindsight_docker_db_user }}@{{ hindsight_docker_db_host }}:{{
        hindsight_docker_db_port }}/{{ hindsight_docker_db_name }}
      - -tAc
      - "SELECT version_num FROM public.alembic_version"
  environment:
    PGPASSWORD: "{{ hindsight_docker_db_password }}"
  register: hindsight_docker_current_revision_probe
  run_once: true
  when: hindsight_docker_schema_exists
  changed_when: false
  # Same fail-closed discipline as the existence probe above: a connection
  # error or a tracker table with anything other than exactly one row
  # must fail the play, not be read as "no current revision".
  failed_when: >-
    hindsight_docker_current_revision_probe.rc != 0
    or (hindsight_docker_current_revision_probe.stdout_lines | default([]) | length) != 1

- name: Generate the alembic config used to read the image's target head revision
  ansible.builtin.copy:
    dest: "{{ hindsight_docker_migration_backup_dir }}/alembic-heads.ini"
    content: |
      [alembic]
      script_location = {{ hindsight_docker_alembic_script_location }}
    mode: "0644"
  run_once: true

- name: Determine the target head revision from the image
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network=host
      - -v
      - "{{ hindsight_docker_migration_backup_dir }}/alembic-heads.ini:/tmp/alembic-heads.ini:ro"
      - "{{ hindsight_docker_image }}"
      - alembic
      - -c
      - /tmp/alembic-heads.ini
      - heads
  register: hindsight_docker_head_revision_probe
  run_once: true
  changed_when: false
  # Fails closed the same way: a bad exit, or anything other than exactly
  # one head line (none, or an unexpected branched-history multi-head
  # tree), must not be silently read as "no migration pending".
  failed_when: >-
    hindsight_docker_head_revision_probe.rc != 0
    or (hindsight_docker_head_revision_probe.stdout_lines | default([]) | length) != 1

- name: Record the image's target head revision
  ansible.builtin.set_fact:
    hindsight_docker_target_head_revision: "{{ (hindsight_docker_head_revision_probe.stdout | trim).split(' ')[0] }}"
  run_once: true

- name: Determine whether a migration is pending
  ansible.builtin.set_fact:
    hindsight_docker_migration_pending: >-
      {{ not hindsight_docker_schema_exists
      or (hindsight_docker_current_revision_probe.stdout | trim) != hindsight_docker_target_head_revision }}
  run_once: true

- name: Report the migration decision
  ansible.builtin.debug:
    msg: >-
      {{ 'No existing schema (alembic_version absent) — first deploy,
      nothing to back up before run-db-migration creates it.'
      if not hindsight_docker_schema_exists
      else ('Database already at the target head revision (' ~ hindsight_docker_target_head_revision
      ~ ') — nothing to migrate.'
      if not hindsight_docker_migration_pending
      else 'Migration pending (current ' ~ (hindsight_docker_current_revision_probe.stdout | trim)
      ~ ', target ' ~ hindsight_docker_target_head_revision ~ ') — taking a pre-migration backup.') }}
  run_once: true

- name: Check whether each replica has already been deployed at least once
  ansible.builtin.stat:
    path: "{{ hindsight_docker_data_dir }}/docker-compose.yml"
  loop: "{{ groups['hindsight_group'] }}"
  delegate_to: "{{ item }}"
  loop_control:
    label: "{{ item }}"
  register: hindsight_docker_compose_exists_check
  run_once: true
  when: hindsight_docker_migration_pending

- name: Stop the Hindsight containers on every already-deployed replica before a pending migration
  community.docker.docker_compose_v2:
    project_src: "{{ hindsight_docker_data_dir }}"
    state: stopped
  loop: "{{ hindsight_docker_compose_exists_check.results | default([]) }}"
  loop_control:
    loop_var: hindsight_docker_replica_check
    label: "{{ hindsight_docker_replica_check.item | default('') }}"
  delegate_to: "{{ hindsight_docker_replica_check.item }}"
  run_once: true
  # A replica with no compose project yet has nothing running to stop —
  # true on Molecule's scaffold (this runs before the role's own first-ever
  # deploy) and, in production, on any host that has never been deployed
  # despite an existing schema.
  when: >-
    hindsight_docker_migration_pending
    and (hindsight_docker_replica_check.stat.exists | default(false))

- name: Compute the pre-migration backup filename from the current and target revisions
  ansible.builtin.set_fact:
    # Timestamped AND revision-tagged so a second migration never overwrites
    # the previous one's backup. Off-host copy and retention are out of
    # scope here — a separate backup/export process is responsible for
    # copying this file off the guest and pruning old ones.
    # now(), not ansible_date_time: this play runs with gather_facts: false
    # (the role uses no host facts), and now() needs no fact gathering.
    hindsight_docker_premigration_backup_filename: >-
      pre-migration-{{ hindsight_docker_current_revision_probe.stdout | trim }}-to-{{
      hindsight_docker_target_head_revision }}-{{ now(utc=true, fmt='%Y%m%dT%H%M%S') }}.zip
  run_once: true
  when: hindsight_docker_schema_exists and hindsight_docker_migration_pending

- name: Take a pre-migration database backup
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network=host
      - --user
      - root
      - -e
      - HINDSIGHT_API_DATABASE_URL
      - -v
      - "{{ hindsight_docker_migration_backup_dir }}:/backup"
      - "{{ hindsight_docker_image }}"
      - hindsight-admin
      - backup
      - "/backup/{{ hindsight_docker_premigration_backup_filename }}"
  environment:
    HINDSIGHT_API_DATABASE_URL: "{{ hindsight_docker_db_url }}"
  register: hindsight_docker_backup_result
  run_once: true
  changed_when: true
  failed_when: false
  no_log: true
  # Sized with margin over measured CI timing (see the migration task's own
  # timeout below); the backup command itself has not yet completed in any
  # CI run against a non-trivial schema, so this ceiling is provisional
  # pending real measured production-scale timing.
  async: "{{ hindsight_docker_backup_wall_timeout_seconds }}"
  poll: 5
  when: hindsight_docker_schema_exists and hindsight_docker_migration_pending

- name: Fail loudly if the pre-migration backup command did not exit cleanly
  ansible.builtin.assert:
    that:
      - hindsight_docker_backup_result.rc | default(-1) == 0
      - not (hindsight_docker_backup_result.failed | default(false))
    fail_msg: >-
      hindsight-admin backup exited abnormally
      (rc={{ hindsight_docker_backup_result.rc | default('unknown') }});
      output withheld (no_log) because it may include the database DSN.
    quiet: true
  run_once: true
  when: hindsight_docker_schema_exists and hindsight_docker_migration_pending

- name: Refuse to migrate unless the pre-migration backup file is present and non-empty
  ansible.builtin.stat:
    path: "{{ hindsight_docker_migration_backup_dir }}/{{ hindsight_docker_premigration_backup_filename }}"
  register: hindsight_docker_premigration_backup_stat
  run_once: true
  when: hindsight_docker_schema_exists and hindsight_docker_migration_pending

- name: Assert the pre-migration backup succeeded
  ansible.builtin.assert:
    that:
      - hindsight_docker_premigration_backup_stat.stat.exists
      - hindsight_docker_premigration_backup_stat.stat.size > 0
    fail_msg: >-
      hindsight-admin backup did not produce a usable file at
      {{ hindsight_docker_migration_backup_dir }}/{{ hindsight_docker_premigration_backup_filename }}.
    quiet: true
  run_once: true
  when: hindsight_docker_schema_exists and hindsight_docker_migration_pending

- name: Verify the pre-migration backup archive is a valid, restorable zip
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - zipfile
      - -t
      - "{{ hindsight_docker_migration_backup_dir }}/{{ hindsight_docker_premigration_backup_filename }}"
  changed_when: false
  run_once: true
  when: hindsight_docker_schema_exists and hindsight_docker_migration_pending

- name: Run the Hindsight database migration once, using the target image
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network=host
      - -e
      - HINDSIGHT_API_DATABASE_URL
      - -e
      - HINDSIGHT_API_VECTOR_EXTENSION
      - "{{ hindsight_docker_image }}"
      - hindsight-admin
      - run-db-migration
  environment:
    HINDSIGHT_API_DATABASE_URL: "{{ hindsight_docker_db_url }}"
    HINDSIGHT_API_VECTOR_EXTENSION: "{{ hindsight_docker_vector_extension }}"
  register: hindsight_docker_migration_result
  run_once: true
  when: hindsight_docker_migration_pending
  changed_when: "'Running upgrade' in hindsight_docker_migration_result.stderr"
  failed_when: false
  no_log: true
  # 600s vs. a measured ~39s fresh-schema migration in CI (job 108368335106,
  # 2026-09-26) — ~15x margin for a larger production dataset. Raise if a
  # real migration run ever needs longer.
  async: "{{ hindsight_docker_migration_wall_timeout_seconds }}"
  poll: 5

- name: Fail loudly if the database migration did not exit cleanly
  ansible.builtin.assert:
    that:
      - hindsight_docker_migration_result.rc | default(-1) == 0
      - not (hindsight_docker_migration_result.failed | default(false))
    fail_msg: >-
      hindsight-admin run-db-migration exited abnormally
      (rc={{ hindsight_docker_migration_result.rc | default('unknown') }});
      output withheld (no_log) because it may include the database DSN.
    quiet: true
  run_once: true
  when: hindsight_docker_migration_pending
