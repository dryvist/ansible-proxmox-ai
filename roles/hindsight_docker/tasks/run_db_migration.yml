---
# Runs the Hindsight database migration exactly once, using the target
# image, before any replica is redeployed with
# HINDSIGHT_API_RUN_MIGRATIONS_ON_STARTUP=false. Imported from
# playbooks/hindsight.yml pre_tasks (not tasks/main.yml), so a failure here
# is fatal to the whole play rather than recorded as one replica's isolated
# failure.
#
# Takes its own pre-migration backup via the vendored `hindsight-admin
# backup` command and refuses to migrate unless that file exists and is
# non-empty — no human confirmation step. HINDSIGHT_API_DATABASE_URL and
# HINDSIGHT_API_VECTOR_EXTENSION are passed via `environment:` and a bare
# `-e` (no inline value): the DSN never appears in argv/`ps` output on the
# host, and the vector extension matches the compose template's own value
# (run-db-migration reconciles indexes against it).
#
# The backup container runs as root (--user root): the image's default
# user can't write into a bind-mounted host directory that Ansible just
# created, since that directory is owned by whichever user ran this play
# (root, under become) — matching the same non-root/bind-mount conflict
# the compose template's cache volume comment already documents.
#
# A first-ever deploy has no schema yet, so there is nothing to back up
# before run-db-migration creates it from scratch. This is detected
# positively — probing for Alembic's own `alembic_version` tracker table
# (the table run-db-migration itself creates and stamps; confirmed at
# both the v0.9.0 and v0.10.1 vendor tags, same table, no version_table
# override) — rather than by pattern-matching a backup failure message,
# so a real partially-broken schema (some tables present, others missing)
# still takes a backup and still fails the play like any other backup
# failure, instead of being silently skipped.

- name: Ensure the pre-migration backup directory exists
  ansible.builtin.file:
    path: "{{ hindsight_docker_migration_backup_dir }}"
    state: directory
    mode: "0700"
  run_once: true

- name: Install the database client used to probe for an existing schema
  ansible.builtin.apt:
    name: postgresql-client
    state: present
  run_once: true

- name: Probe whether the Alembic migration tracker table already exists
  ansible.builtin.command:
    argv:
      - psql
      - >-
        postgresql://{{ hindsight_docker_db_user }}@{{ hindsight_docker_db_host }}:{{
        hindsight_docker_db_port }}/{{ hindsight_docker_db_name }}
      - -tAc
      - "SELECT to_regclass('public.alembic_version') IS NOT NULL"
  environment:
    # The password never rides argv (visible in /proc/*/cmdline, ps, and
    # audit logs for the probe's lifetime); PGPASSWORD is psql's own
    # env-var credential path.
    PGPASSWORD: "{{ hindsight_docker_db_password }}"
  register: hindsight_docker_schema_probe
  run_once: true
  changed_when: false
  # An inconclusive probe (connection error, unexpected output) must fail
  # the play rather than silently fall through to "no schema, skip the
  # backup" — that would make a transient probe failure indistinguishable
  # from a genuinely fresh database and skip a backup that was needed.
  failed_when: >-
    hindsight_docker_schema_probe.rc != 0
    or (hindsight_docker_schema_probe.stdout | default('') | trim) not in ['t', 'f']

- name: Record whether an existing schema was found
  ansible.builtin.set_fact:
    hindsight_docker_schema_exists: "{{ (hindsight_docker_schema_probe.stdout | trim) == 't' }}"
  run_once: true

- name: Report the pre-migration backup decision
  ansible.builtin.debug:
    msg: >-
      {{ 'Existing schema found (alembic_version present) — taking a
      pre-migration backup.'
      if hindsight_docker_schema_exists
      else 'No existing schema (alembic_version absent) — first deploy,
      nothing to back up before run-db-migration creates it.' }}
  run_once: true

- name: Take a pre-migration database backup
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network=host
      - --user
      - root
      - -e
      - HINDSIGHT_API_DATABASE_URL
      - -v
      - "{{ hindsight_docker_migration_backup_dir }}:/backup"
      - "{{ hindsight_docker_image }}"
      - hindsight-admin
      - backup
      - /backup/pre-migration.zip
  environment:
    HINDSIGHT_API_DATABASE_URL: "{{ hindsight_docker_db_url }}"
  run_once: true
  changed_when: true
  when: hindsight_docker_schema_exists

- name: Refuse to migrate unless the pre-migration backup file is present and non-empty
  ansible.builtin.stat:
    path: "{{ hindsight_docker_migration_backup_dir }}/pre-migration.zip"
  register: hindsight_docker_premigration_backup_stat
  run_once: true
  when: hindsight_docker_schema_exists

- name: Assert the pre-migration backup succeeded
  ansible.builtin.assert:
    that:
      - hindsight_docker_premigration_backup_stat.stat.exists
      - hindsight_docker_premigration_backup_stat.stat.size > 0
    fail_msg: >-
      hindsight-admin backup did not produce a usable file at
      {{ hindsight_docker_migration_backup_dir }}/pre-migration.zip.
    quiet: true
  run_once: true
  when: hindsight_docker_schema_exists

- name: Run the Hindsight database migration once, using the target image
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network=host
      - -e
      - HINDSIGHT_API_DATABASE_URL
      - -e
      - HINDSIGHT_API_VECTOR_EXTENSION
      - "{{ hindsight_docker_image }}"
      - hindsight-admin
      - run-db-migration
  environment:
    HINDSIGHT_API_DATABASE_URL: "{{ hindsight_docker_db_url }}"
    HINDSIGHT_API_VECTOR_EXTENSION: "{{ hindsight_docker_vector_extension }}"
  run_once: true
  changed_when: true
