---
- name: Require an approved immutable target and the entire Hindsight fleet
  ansible.builtin.assert:
    that:
      - hindsight_docker_migration_approved_image == hindsight_docker_image
      - hindsight_docker_image is match('^.+@sha256:[0-9a-f]{64}$')
      - (groups['hindsight_group'] | difference(ansible_play_hosts_all) | length) == 0
    fail_msg: Approved maintenance requires the exact immutable target and every Hindsight inventory member.
    quiet: true
