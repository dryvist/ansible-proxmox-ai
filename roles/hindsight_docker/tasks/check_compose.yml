---
- name: Read the Docker Compose version before Hindsight maintenance
  ansible.builtin.command: docker compose version --short
  register: hindsight_docker_compose_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require Docker Compose support for stopped image staging
  ansible.builtin.assert:
    that:
      - hindsight_docker_compose_version.rc | default(-1) == 0
      - >-
        (hindsight_docker_compose_version.stdout | default('') | trim | regex_replace('^v', ''))
        is version('2.22.0', '>=')
    fail_msg: Docker Compose 2.22.0 or later is required before Hindsight database maintenance.
    quiet: true
