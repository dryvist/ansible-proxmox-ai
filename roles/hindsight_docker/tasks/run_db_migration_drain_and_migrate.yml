---
# Split out of run_db_migration.yml (token budget) — the recoverable
# drain -> backup -> verify -> migrate sequence, imported as this file's
# last task. See run_db_migration.yml's own header for the full B1-B2/
# S1-S5 design; this file is purely the block/rescue split, no new logic.

- name: Drain, back up, verify, and migrate, restoring drained replicas on failure
  block:
    - name: Check whether each replica has already been deployed at least once
      ansible.builtin.stat:
        path: "{{ hindsight_docker_data_dir }}/docker-compose.yml"
      loop: "{{ groups['hindsight_group'] }}"
      delegate_to: "{{ item }}"
      loop_control:
        label: "{{ item }}"
      register: hindsight_docker_compose_exists_check
      run_once: true
      when: hindsight_docker_migration_pending

    - name: Stop the Hindsight containers on every already-deployed replica before a pending migration
      community.docker.docker_compose_v2:
        project_src: "{{ hindsight_docker_data_dir }}"
        state: stopped
      loop: "{{ hindsight_docker_compose_exists_check.results | default([]) }}"
      loop_control:
        loop_var: hindsight_docker_replica_check
        label: "{{ hindsight_docker_replica_check.item | default('') }}"
      delegate_to: "{{ hindsight_docker_replica_check.item }}"
      run_once: true
      # A replica with no compose project yet has nothing running to stop —
      # true on Molecule's scaffold (this runs before the role's own first-ever
      # deploy) and, in production, on any host that has never been deployed
      # despite an existing schema.
      when: >-
        hindsight_docker_migration_pending
        and (hindsight_docker_replica_check.stat.exists | default(false))

    - name: Compute the pre-migration backup filename from the current and target revisions
      ansible.builtin.set_fact:
        # Timestamped AND revision-tagged so a second migration never overwrites
        # the previous one's backup. Off-host copy and retention are out of
        # scope here — a separate backup/export process is responsible for
        # copying this file off the guest and pruning old ones.
        # now(), not ansible_date_time: this play runs with gather_facts: false
        # (the role uses no host facts), and now() needs no fact gathering.
        hindsight_docker_premigration_backup_filename: >-
          pre-migration-{{ hindsight_docker_current_revision_probe.stdout | trim }}-to-{{
          hindsight_docker_target_head_revision }}-{{ now(utc=true, fmt='%Y%m%dT%H%M%S') }}.zip
      run_once: true
      when: hindsight_docker_schema_exists and hindsight_docker_migration_pending

    - name: Take a pre-migration database backup
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network=host
          - --user
          - root
          - -e
          - HINDSIGHT_API_DATABASE_URL
          - -v
          - "{{ hindsight_docker_migration_backup_dir }}:/backup"
          - "{{ hindsight_docker_image }}"
          - hindsight-admin
          - backup
          - "/backup/{{ hindsight_docker_premigration_backup_filename }}"
      environment:
        HINDSIGHT_API_DATABASE_URL: "{{ hindsight_docker_db_url }}"
      register: hindsight_docker_backup_result
      run_once: true
      changed_when: true
      failed_when: false
      no_log: true
      # Sized with margin over measured CI timing (see the migration task's own
      # timeout below); the backup command itself has not yet completed in any
      # CI run against a non-trivial schema, so this ceiling is provisional
      # pending real measured production-scale timing.
      async: "{{ hindsight_docker_backup_wall_timeout_seconds }}"
      poll: 5
      when: hindsight_docker_schema_exists and hindsight_docker_migration_pending

    - name: Fail loudly if the pre-migration backup command did not exit cleanly
      ansible.builtin.assert:
        that:
          - hindsight_docker_backup_result.rc | default(-1) == 0
          - not (hindsight_docker_backup_result.failed | default(false))
        fail_msg: >-
          hindsight-admin backup exited abnormally
          (rc={{ hindsight_docker_backup_result.rc | default('unknown') }});
          output withheld (no_log) because it may include the database DSN.
        quiet: true
      run_once: true
      when: hindsight_docker_schema_exists and hindsight_docker_migration_pending

    - name: Refuse to migrate unless the pre-migration backup file is present and non-empty
      ansible.builtin.stat:
        path: "{{ hindsight_docker_migration_backup_dir }}/{{ hindsight_docker_premigration_backup_filename }}"
      register: hindsight_docker_premigration_backup_stat
      run_once: true
      when: hindsight_docker_schema_exists and hindsight_docker_migration_pending

    - name: Assert the pre-migration backup succeeded
      ansible.builtin.assert:
        that:
          - hindsight_docker_premigration_backup_stat.stat.exists
          - hindsight_docker_premigration_backup_stat.stat.size > 0
        fail_msg: >-
          hindsight-admin backup did not produce a usable file at
          {{ hindsight_docker_migration_backup_dir }}/{{ hindsight_docker_premigration_backup_filename }}.
        quiet: true
      run_once: true
      when: hindsight_docker_schema_exists and hindsight_docker_migration_pending

    - name: Verify the pre-migration backup archive is a valid, restorable zip
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - zipfile
          - -t
          - "{{ hindsight_docker_migration_backup_dir }}/{{ hindsight_docker_premigration_backup_filename }}"
      changed_when: false
      run_once: true
      when: hindsight_docker_schema_exists and hindsight_docker_migration_pending

    - name: Run the Hindsight database migration once, using the target image
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network=host
          - -e
          - HINDSIGHT_API_DATABASE_URL
          - -e
          - HINDSIGHT_API_VECTOR_EXTENSION
          - "{{ hindsight_docker_image }}"
          - hindsight-admin
          - run-db-migration
      environment:
        HINDSIGHT_API_DATABASE_URL: "{{ hindsight_docker_db_url }}"
        HINDSIGHT_API_VECTOR_EXTENSION: "{{ hindsight_docker_vector_extension }}"
      register: hindsight_docker_migration_result
      run_once: true
      when: hindsight_docker_migration_pending
      changed_when: "'Running upgrade' in hindsight_docker_migration_result.stderr"
      failed_when: false
      no_log: true
      # 600s vs. a measured ~39s fresh-schema migration in CI (job 108368335106,
      # 2026-09-26) — ~15x margin for a larger production dataset. Raise if a
      # real migration run ever needs longer.
      async: "{{ hindsight_docker_migration_wall_timeout_seconds }}"
      poll: 5

    - name: Fail loudly if the database migration did not exit cleanly
      ansible.builtin.assert:
        that:
          - hindsight_docker_migration_result.rc | default(-1) == 0
          - not (hindsight_docker_migration_result.failed | default(false))
        fail_msg: >-
          hindsight-admin run-db-migration exited abnormally
          (rc={{ hindsight_docker_migration_result.rc | default('unknown') }});
          output withheld (no_log) because it may include the database DSN.
        quiet: true
      run_once: true
      when: hindsight_docker_migration_pending

  rescue:
    - name: Determine whether the migration command was ever attempted
      ansible.builtin.set_fact:
        hindsight_docker_migration_attempted: "{{ hindsight_docker_migration_result is defined }}"
      run_once: true

    - name: Read the database's current Alembic revision via the vendor CLI (recovery classification)
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network=host
          - -e
          - HINDSIGHT_API_DATABASE_URL
          - -v
          - "{{ hindsight_docker_migration_backup_dir }}/alembic-heads.ini:/tmp/alembic-heads.ini:ro"
          - "{{ hindsight_docker_image }}"
          - alembic
          - -c
          - /tmp/alembic-heads.ini
          - current
      environment:
        HINDSIGHT_API_DATABASE_URL: "{{ hindsight_docker_db_url }}"
      register: hindsight_docker_recovery_revision_probe
      run_once: true
      changed_when: false
      failed_when: false
      when: hindsight_docker_schema_exists and hindsight_docker_migration_attempted

    - name: Determine whether the failed attempt left the schema unchanged
      ansible.builtin.set_fact:
        # The only case treated as definitely safe: migration never even
        # started (drain/backup/integrity failed first). Any failure to
        # cleanly re-read the current revision (bad rc, output that isn't
        # exactly one line — e.g. a branched multi-head schema, the same
        # stdout_lines == 1 fail-closed check every sibling probe in this
        # role already applies — or a line that doesn't exactly match the
        # pre-attempt revision) is treated as "changed" — a restart is
        # never guessed to be safe.
        hindsight_docker_schema_unchanged: >-
          {{ not hindsight_docker_migration_attempted
          or (hindsight_docker_recovery_revision_probe.rc | default(1) == 0
          and (hindsight_docker_recovery_revision_probe.stdout_lines | default([]) | length) == 1
          and (hindsight_docker_recovery_revision_probe.stdout | default('') | trim).split(' ')[0]
          == (hindsight_docker_current_revision_probe.stdout | default('__unreadable__') | trim)) }}
      run_once: true

    - name: Restart every replica this task file stopped, on its current (unchanged) image
      community.docker.docker_compose_v2:
        project_src: "{{ hindsight_docker_data_dir }}"
        state: started
      loop: "{{ hindsight_docker_compose_exists_check.results | default([]) }}"
      loop_control:
        loop_var: hindsight_docker_replica_check
        label: "{{ hindsight_docker_replica_check.item | default('') }}"
      delegate_to: "{{ hindsight_docker_replica_check.item }}"
      run_once: true
      when: >-
        hindsight_docker_schema_unchanged
        and (hindsight_docker_replica_check.stat.exists | default(false))

    - name: Re-raise so the play still fails after recovery
      ansible.builtin.fail:
        msg: >-
          {{ 'hindsight_docker: the pre-migration sequence failed before changing the schema
          — every drained replica was restarted on its current image. See the preceding task
          failure for the root cause.'
          if hindsight_docker_schema_unchanged
          else 'hindsight_docker: the migration failed AFTER changing the schema — replicas
          are deliberately left stopped rather than served against a schema their current
          image may not understand. Restore from '
          ~ (hindsight_docker_premigration_backup_filename | default('the pre-migration backup'))
          ~ ' in ' ~ hindsight_docker_migration_backup_dir ~ " using `hindsight-admin restore`,"
          ~ ' then re-run this playbook to redeploy.' }}
      run_once: true
