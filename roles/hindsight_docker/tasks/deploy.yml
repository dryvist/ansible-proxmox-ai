---
# Hindsight agent-memory deployment (Docker in LXC). One stateless replica per
# hindsight-tagged guest; Traefik load-balances the pool at hindsight.<domain>.

# =============================================================================
# Validation
# =============================================================================

- name: Validate required Hindsight secrets are set
  ansible.builtin.assert:
    that:
      - hindsight_docker_db_password | length > 0
      - hindsight_docker_llm_api_key | length > 0
      - hindsight_docker_cp_access_key | length > 0
      - hindsight_docker_api_key | length > 0
    fail_msg: >-
      Hindsight secrets missing — hindsight_docker_db_password /
      hindsight_docker_cp_access_key / hindsight_docker_api_key resolve
      bao-first from the apps/hindsight KV fields;
      hindsight_docker_llm_api_key resolves its own hindsight_llm_router_key
      field there, mandatory, with no other fallback.
    quiet: true

# Docker itself (docker-ce + compose plugin, LXC-conditional fuse-overlayfs,
# daemon.json) is installed by the docker_engine meta dependency.

# =============================================================================
# Configuration + deploy via Docker Compose. No data dirs beyond the compose
# project dir: the model cache is a named volume (ownership handled by
# Docker) and all real state lives in the ai-VLAN Postgres cluster.
# =============================================================================

- name: Create hindsight project directory
  ansible.builtin.file:
    path: "{{ hindsight_docker_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Assert every secret rendered into the hindsight compose file is present
  ansible.builtin.include_role:
    name: dryvist.homelab.openbao_secrets
    tasks_from: assert_nonempty.yml
  vars:
    openbao_secrets_required_vars:
      - hindsight_docker_db_password
      - hindsight_docker_cp_access_key
      - hindsight_docker_llm_api_key
      - hindsight_docker_api_key

- name: Deploy hindsight docker-compose template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hindsight_docker_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart hindsight

- name: Deploy hindsight via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ hindsight_docker_data_dir }}"
    state: present
  when: hindsight_service_enabled | default(false) | bool

- name: Stage the requested Hindsight image without starting it
  ansible.builtin.import_tasks: stage_stopped.yml
  when: not (hindsight_service_enabled | default(false) | bool)

- name: Apply pending Hindsight handlers before checking the requested state
  ansible.builtin.meta: flush_handlers

# =============================================================================
# Health check — /health is the same endpoint Traefik's pool check uses.
#
# The window is sized for a COLD start, not a warm one. On a fresh guest the
# API initializes its local embedding and reranking models before listening.
# In offline mode their weights must already be available. LLM connection
# checks warn on failure; they are not a readiness guarantee.
# =============================================================================

- name: Wait for hindsight API port to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ hindsight_docker_api_port }}"
    timeout: "{{ hindsight_docker_startup_timeout }}"
  when: hindsight_service_enabled | default(false) | bool

- name: Verify hindsight health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hindsight_docker_api_port }}/health"
    method: GET
    status_code: 200
  register: hindsight_docker_health
  retries: "{{ hindsight_docker_health_retries }}"
  delay: "{{ hindsight_docker_health_delay }}"
  until: hindsight_docker_health.status == 200
  changed_when: false
  when:
    - hindsight_service_enabled | default(false) | bool
    - not ansible_check_mode
