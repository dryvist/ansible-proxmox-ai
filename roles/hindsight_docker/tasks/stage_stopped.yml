---
- name: Pull the approved Hindsight image without starting services
  community.docker.docker_compose_v2_pull:
    project_src: "{{ hindsight_docker_data_dir }}"
    policy: missing

- name: Create the approved Hindsight container without starting it
  ansible.builtin.command:
    argv: [docker, compose, create, --no-build, --pull, never]
    chdir: "{{ hindsight_docker_data_dir }}"
  register: hindsight_docker_staged
  changed_when: >-
    hindsight_docker_staged.stderr is search('(?m)\b(Created|Recreated)\b')

- name: Enforce the stopped state after staging the approved image
  ansible.builtin.import_tasks: contain.yml
