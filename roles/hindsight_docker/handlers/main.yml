---
# Hindsight Docker handlers

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Restart hindsight
  community.docker.docker_compose_v2:
    project_src: "{{ hindsight_docker_data_dir }}"
    state: "{{ 'present' if hindsight_service_enabled | default(false) | bool else 'stopped' }}"
    recreate: "{{ 'always' if hindsight_service_enabled | default(false) | bool else omit }}"
