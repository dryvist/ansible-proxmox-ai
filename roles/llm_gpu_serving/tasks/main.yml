---
- name: Load the registry model identity for each GPU profile
  ansible.builtin.include_tasks: load-registry.yml

- name: Validate the active GPU serving profile
  ansible.builtin.assert:
    that:
      - llm_active_profile in llm_profiles
      - llm_gpu_serving_model_origin_mount_path | length > 0
      - llm_gpu_serving_model_cache_mount_path | length > 0
      - llm_gpu_serving_model_origin_mount_path != llm_gpu_serving_model_cache_mount_path
      - llm_gpu_serving_vllm_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
    fail_msg: >-
      Set llm_active_profile to a declared profile and provide both tofu-published
      model mount paths plus a pinned vLLM version.
    quiet: true

- name: Inspect the tofu-provisioned model mount paths
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - name: origin
      path: "{{ llm_gpu_serving_model_origin_mount_path }}"
    - name: cache
      path: "{{ llm_gpu_serving_model_cache_mount_path }}"
  loop_control:
    label: "{{ item.name }}"
  register: llm_gpu_serving_mount_stats

- name: Assert the tofu-provisioned model mounts exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
    fail_msg: >-
      The tofu-provisioned {{ item.item.name }} model mount at
      {{ item.item.path }} must already exist as a directory.
    quiet: true
  loop: "{{ llm_gpu_serving_mount_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Validate every GPU serving profile
  ansible.builtin.assert:
    that:
      - item.value.engine in ['vllm', 'llama_cpp']
      - item.key in llm_gpu_serving_registry_by_profile
      - item.value.quant in ['bf16', 'fp8', 'nvfp4']
      - item.value.linear_backend in ['auto', 'b12x']
      - item.value.moe_backend in ['auto', 'b12x']
      - item.value.max_model_len | int > 0
      - item.value.max_num_seqs | int > 0
      - item.value.gpu_memory_utilization | float > 0
      - item.value.gpu_memory_utilization | float <= 1
      - not item.value.enable_auto_tool_choice or item.value.tool_call_parser | length > 0
      - item.value.reasoning_parser | length > 0
      - item.value.port | int > 0
      - item.value.engine != 'llama_cpp' or item.value.gguf_file | length > 0
    fail_msg: "GPU serving profile {{ item.key }} is incomplete or invalid."
    quiet: true
  loop: "{{ llm_profiles | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Create the GPU serving system group
  ansible.builtin.group:
    name: "{{ llm_gpu_serving_group }}"
    system: true

- name: Create the GPU serving system user
  ansible.builtin.user:
    name: "{{ llm_gpu_serving_user }}"
    group: "{{ llm_gpu_serving_group }}"
    home: "{{ llm_gpu_serving_home }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: true

- name: Install GPU serving prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gzip
      - libgomp1
      - rsync
      - sudo
      - tar
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create GPU serving directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ llm_gpu_serving_user }}"
    group: "{{ llm_gpu_serving_group }}"
    mode: "0750"
  loop:
    - path: "{{ llm_gpu_serving_data_dir }}"
    - path: "{{ llm_gpu_serving_install_dir }}"
  loop_control:
    label: "{{ item.path }}"

- name: Install uv
  ansible.builtin.shell:
    cmd: "set -o pipefail && curl -LsSf {{ llm_gpu_serving_uv_install_url }} | env UV_INSTALL_DIR=/usr/local/bin sh"
    creates: "{{ llm_gpu_serving_uv_bin }}"
  args:
    executable: /bin/bash

- name: Create the vLLM virtual environment
  ansible.builtin.command:
    argv:
      - "{{ llm_gpu_serving_uv_bin }}"
      - venv
      - --python
      - "{{ llm_gpu_serving_python }}"
      - "{{ llm_gpu_serving_venv }}"
    creates: "{{ llm_gpu_serving_venv }}/bin/python"
  become: true
  become_user: "{{ llm_gpu_serving_user }}"

- name: Install the pinned vLLM build with SM120 b12x kernels
  ansible.builtin.command:
    argv:
      - "{{ llm_gpu_serving_uv_bin }}"
      - pip
      - install
      - --python
      - "{{ llm_gpu_serving_venv }}/bin/python"
      - "vllm[b12x]=={{ llm_gpu_serving_vllm_version }}"
  become: true
  become_user: "{{ llm_gpu_serving_user }}"
  register: llm_gpu_serving_vllm_install
  changed_when: >-
    'Installed' in llm_gpu_serving_vllm_install.stderr or
    'Prepared' in llm_gpu_serving_vllm_install.stderr or
    'Uninstalled' in llm_gpu_serving_vllm_install.stderr
  notify:
    - Stop every other GPU serving profile before switching
    - Start the active GPU serving profile

- name: Inspect the llama.cpp server binary
  ansible.builtin.stat:
    path: "{{ llm_gpu_serving_llamacpp_server_bin }}"
  register: llm_gpu_serving_llamacpp_server_stat

- name: Install the llama.cpp CUDA release binary
  when: not llm_gpu_serving_llamacpp_server_stat.stat.exists
  block:
    - name: Resolve recent llama.cpp release metadata
      ansible.builtin.uri:
        url: "{{ llm_gpu_serving_llamacpp_releases_api }}"
        return_content: true
        status_code: 200
      register: llm_gpu_serving_llamacpp_release

    - name: Select the CUDA release asset by name pattern
      ansible.builtin.set_fact:
        llm_gpu_serving_llamacpp_asset_url: >-
          {{ llm_gpu_serving_llamacpp_release.json
             | map(attribute='assets') | flatten
             | selectattr('name', 'match', llm_gpu_serving_llamacpp_asset_regex)
             | map(attribute='browser_download_url') | first | default('', true) }}

    - name: Assert a matching CUDA asset was found
      ansible.builtin.assert:
        that:
          - llm_gpu_serving_llamacpp_asset_url | length > 0
        fail_msg: >-
          No llama.cpp CUDA release asset matched
          {{ llm_gpu_serving_llamacpp_asset_regex }} in
          {{ llm_gpu_serving_llamacpp_releases_api }}.

    - name: Create a temporary llama.cpp extraction directory
      ansible.builtin.tempfile:
        state: directory
        suffix: llm-gpu-serving
      register: llm_gpu_serving_llamacpp_extract_tmp

    - name: Download and extract the llama.cpp release tarball
      ansible.builtin.unarchive:
        src: "{{ llm_gpu_serving_llamacpp_asset_url }}"
        dest: "{{ llm_gpu_serving_llamacpp_extract_tmp.path }}"
        remote_src: true

    - name: Find llama-server in the CUDA release archive
      ansible.builtin.find:
        paths: "{{ llm_gpu_serving_llamacpp_extract_tmp.path }}"
        patterns: llama-server
        file_type: file
        recurse: true
      register: llm_gpu_serving_llamacpp_server_find

    - name: Assert llama-server was included in the release archive
      ansible.builtin.assert:
        that:
          - llm_gpu_serving_llamacpp_server_find.matched | int > 0
        fail_msg: "No llama-server binary was found in the CUDA release archive."

    - name: Create the llama.cpp install directory
      ansible.builtin.file:
        path: "{{ llm_gpu_serving_llamacpp_install_dir }}"
        state: directory
        owner: "{{ llm_gpu_serving_user }}"
        group: "{{ llm_gpu_serving_group }}"
        mode: "0750"

    - name: Install llama.cpp binaries and shared libraries
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - "{{ llm_gpu_serving_llamacpp_server_find.files[0].path | dirname }}/."
          - "{{ llm_gpu_serving_llamacpp_install_dir }}/"
      changed_when: true
      notify:
        - Stop every other GPU serving profile before switching
        - Start the active GPU serving profile

    - name: Remove the temporary llama.cpp extraction directory
      ansible.builtin.file:
        path: "{{ llm_gpu_serving_llamacpp_extract_tmp.path }}"
        state: absent

- name: Resolve the active profile's registry model
  ansible.builtin.set_fact:
    llm_gpu_serving_active_registry_model: "{{ llm_gpu_serving_registry_by_profile[llm_active_profile] }}"

- name: Resolve active profile model paths
  ansible.builtin.set_fact:
    llm_gpu_serving_active_model_source: >-
      {{ llm_gpu_serving_model_origin_mount_path }}/{{ llm_gpu_serving_active_registry_model.upstream_model_id }}
    llm_gpu_serving_active_model_cache: >-
      {{ llm_gpu_serving_model_cache_mount_path }}/{{ llm_gpu_serving_active_registry_model.upstream_model_id }}
    llm_gpu_serving_health_host: >-
      {{ llm_gpu_serving_listen_host | default(ansible_facts.default_ipv4.address) }}

- name: Inspect the active profile's source model directory
  ansible.builtin.stat:
    path: "{{ llm_gpu_serving_active_model_source }}"
  register: llm_gpu_serving_active_model_source_stat

- name: Assert the active profile's model is present at the origin mount
  ansible.builtin.assert:
    that:
      - llm_gpu_serving_active_model_source_stat.stat.exists
      - llm_gpu_serving_active_model_source_stat.stat.isdir
    fail_msg: >-
      The active profile's model directory must already exist under the
      tofu-provisioned origin mount: {{ llm_gpu_serving_active_model_source }}.
    quiet: true

- name: Create the active profile's local model cache directory
  ansible.builtin.file:
    path: "{{ llm_gpu_serving_active_model_cache }}"
    state: directory
    owner: "{{ llm_gpu_serving_user }}"
    group: "{{ llm_gpu_serving_group }}"
    mode: "0750"

- name: Sync only the active profile's model into the local cache
  ansible.builtin.command:
    argv:
      - rsync
      - --archive
      - --delete
      - --itemize-changes
      - --out-format=%i %n%L
      - "--chown={{ llm_gpu_serving_user }}:{{ llm_gpu_serving_group }}"
      - "{{ llm_gpu_serving_active_model_source }}/"
      - "{{ llm_gpu_serving_active_model_cache }}/"
  register: llm_gpu_serving_cache_sync
  changed_when: llm_gpu_serving_cache_sync.stdout | length > 0
  notify:
    - Stop every other GPU serving profile before switching
    - Start the active GPU serving profile

- name: Render one systemd unit for each GPU serving profile
  ansible.builtin.include_tasks: render-units.yml

- name: Check profile service states and request a switch when they diverge
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - "{{ llm_gpu_serving_unit_prefix }}-{{ item.key }}.service"
  register: llm_gpu_serving_profile_state
  changed_when: >-
    (item.key == llm_active_profile and llm_gpu_serving_profile_state.rc != 0) or
    (item.key != llm_active_profile and llm_gpu_serving_profile_state.rc == 0)
  failed_when: llm_gpu_serving_profile_state.rc not in [0, 3, 4]
  loop: "{{ llm_profiles | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify:
    - Stop every other GPU serving profile before switching
    - Start the active GPU serving profile

- name: Apply pending GPU serving service changes
  ansible.builtin.meta: flush_handlers

- name: Verify the active GPU serving profile is healthy
  ansible.builtin.uri:
    url: "http://{{ llm_gpu_serving_health_host }}:{{ llm_profiles[llm_active_profile].port }}/v1/models"
    status_code: 200
  register: llm_gpu_serving_health
  retries: 30
  delay: 5
  until: llm_gpu_serving_health.status == 200
