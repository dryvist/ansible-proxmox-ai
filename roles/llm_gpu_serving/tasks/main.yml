---
- name: Load shared llama.cpp release settings and require the artifact cache
  ansible.builtin.include_tasks: "{{ role_path | dirname }}/llamacpp_release/tasks/prepare.yml"

- name: Load the registry model identity for each GPU profile
  ansible.builtin.include_tasks: load-registry.yml

- name: Validate GPU serving profiles and cache
  ansible.builtin.include_tasks: validate-profiles.yml

- name: Create the GPU serving system group
  ansible.builtin.group:
    name: "{{ llm_gpu_serving_group }}"
    system: true

- name: Create the GPU serving system user
  ansible.builtin.user:
    name: "{{ llm_gpu_serving_user }}"
    group: "{{ llm_gpu_serving_group }}"
    home: "{{ llm_gpu_serving_home }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: true

- name: Install GPU serving prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gzip
      - libgomp1
      - python3-debian
      - sudo
      - tar
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment: "{{ llamacpp_release_proxy_environment }}"

- name: Install vLLM CUDA helper build prerequisites
  ansible.builtin.apt:
    name:
      - gcc
      - libc6-dev
    state: present
  when: llm_gpu_serving_profiles[llm_active_profile].engine == 'vllm'
  environment: "{{ llamacpp_release_proxy_environment }}"

- name: Install NVIDIA userspace from the host module version
  ansible.builtin.include_role:
    name: nvidia_gpu_guest
    tasks_from: install-nvidia-userspace.yml

- name: Install the CUDA toolkit for runtime kernel compilation
  ansible.builtin.include_tasks: install-cuda-toolkit.yml
  when: llm_gpu_serving_profiles[llm_active_profile].engine == 'vllm'

- name: Create GPU serving directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ llm_gpu_serving_user }}"
    group: "{{ llm_gpu_serving_group }}"
    mode: "0750"
  loop:
    - path: "{{ llm_gpu_serving_data_dir }}"
    - path: "{{ llm_gpu_serving_install_dir }}"
    - path: "{{ llm_gpu_serving_uv_cache_dir }}"
    - path: "{{ llm_gpu_serving_uv_python_install_dir }}"
    - path: "{{ llm_gpu_serving_uv_tool_dir }}"
    - path: "{{ llm_gpu_serving_uv_tool_bin_dir }}"
  loop_control:
    label: "{{ item.path }}"

- name: Read the installed uv version
  ansible.builtin.command:
    argv:
      - "{{ llm_gpu_serving_uv_bin }}"
      - --version
  register: llm_gpu_serving_uv_version_check
  changed_when: false
  failed_when: false

- name: Install the pinned uv version
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail && curl --proto '=https' --tlsv1.2 -LsSf
      {{ llm_gpu_serving_uv_install_url | quote }}
      | env UV_INSTALL_DIR={{ llm_gpu_serving_uv_bin | dirname | quote }} UV_NO_MODIFY_PATH=1 sh
  args:
    executable: /bin/bash
  changed_when: true
  environment: "{{ llamacpp_release_proxy_environment }}"
  when: >-
    (llm_gpu_serving_uv_version_check.stdout | default('')).split()[1:2]
    != [llm_gpu_serving_uv_version]

- name: Install the pinned Hugging Face CLI in the model cache
  ansible.builtin.command:
    argv:
      - "{{ llm_gpu_serving_uv_bin }}"
      - tool
      - install
      - --python
      - "{{ llm_gpu_serving_python }}"
      - "huggingface_hub=={{ llm_gpu_serving_huggingface_hub_version }}"
  become: true
  become_user: "{{ llm_gpu_serving_user }}"
  environment: "{{ llm_gpu_serving_uv_environment }}"
  register: llm_gpu_serving_hf_cli_install
  when: not ansible_check_mode
  changed_when: >-
    'Installed' in (llm_gpu_serving_hf_cli_install.stdout ~ llm_gpu_serving_hf_cli_install.stderr) or
    'Uninstalled' in (llm_gpu_serving_hf_cli_install.stdout ~ llm_gpu_serving_hf_cli_install.stderr) or
    'Prepared' in (llm_gpu_serving_hf_cli_install.stdout ~ llm_gpu_serving_hf_cli_install.stderr)

- name: Create the vLLM virtual environment
  ansible.builtin.command:
    argv:
      - "{{ llm_gpu_serving_uv_bin }}"
      - venv
      - --python
      - "{{ llm_gpu_serving_python }}"
      - "{{ llm_gpu_serving_venv }}"
    creates: "{{ llm_gpu_serving_venv }}/bin/python"
  become: true
  become_user: "{{ llm_gpu_serving_user }}"
  environment: "{{ llm_gpu_serving_uv_environment }}"
  when: llm_gpu_serving_profiles[llm_active_profile].engine == 'vllm'

# A process run as another user inside the venv leaves bytecode the serving user
# cannot remove, and uv then fails replacing the old vLLM.
- name: Keep the vLLM virtual environment owned by the serving user
  ansible.builtin.file:
    path: "{{ llm_gpu_serving_venv }}"
    state: directory
    owner: "{{ llm_gpu_serving_user }}"
    group: "{{ llm_gpu_serving_group }}"
    recurse: true
  become: true
  when: llm_gpu_serving_profiles[llm_active_profile].engine == 'vllm'

- name: Install the pinned vLLM build with SM120 b12x kernels
  ansible.builtin.command:
    argv:
      - "{{ llm_gpu_serving_uv_bin }}"
      - pip
      - install
      - --python
      - "{{ llm_gpu_serving_venv }}/bin/python"
      - "vllm=={{ llm_gpu_serving_vllm_version }}"
      - "b12x=={{ llm_gpu_serving_b12x_version }}"
      - "flashinfer-cubin=={{ llm_gpu_serving_flashinfer_version }}"
      - "flashinfer-jit-cache=={{ llm_gpu_serving_flashinfer_version }}"
      # Both indexes host only FlashInfer packages, at the pinned version.
      - --extra-index-url
      - "{{ llm_gpu_serving_flashinfer_index_url }}"
      - --extra-index-url
      - "{{ llm_gpu_serving_flashinfer_jit_cache_index_url }}"
  become: true
  become_user: "{{ llm_gpu_serving_user }}"
  environment: "{{ llm_gpu_serving_uv_environment }}"
  register: llm_gpu_serving_vllm_install
  when:
    - not ansible_check_mode
    - llm_gpu_serving_profiles[llm_active_profile].engine == 'vllm'
  changed_when: >-
    'Installed' in llm_gpu_serving_vllm_install.stderr or
    'Prepared' in llm_gpu_serving_vllm_install.stderr or
    'Uninstalled' in llm_gpu_serving_vllm_install.stderr
  notify:
    - Stop every other GPU serving profile before switching
    - Start the active GPU serving profile
    - Start selected co-resident GPU serving profiles

- name: Put the vLLM and Hugging Face CLIs on the default PATH
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "/usr/local/bin/{{ item.name }}"
    state: link
  loop:
    - name: vllm
      src: "{{ llm_gpu_serving_venv }}/bin/vllm"
    - name: hf
      src: "{{ llm_gpu_serving_hf_bin }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name != 'vllm' or llm_gpu_serving_profiles[llm_active_profile].engine == 'vllm'

- name: Inspect the llama.cpp server binary
  ansible.builtin.stat:
    path: "{{ llm_gpu_serving_llamacpp_server_bin }}"
  register: llm_gpu_serving_llamacpp_server_stat

- name: Inspect the installed llama.cpp asset marker
  ansible.builtin.stat:
    path: "{{ llm_gpu_serving_llamacpp_asset_marker }}"
  register: llm_gpu_serving_llamacpp_marker_stat

- name: Read the installed llama.cpp asset name
  ansible.builtin.slurp:
    src: "{{ llm_gpu_serving_llamacpp_asset_marker }}"
  register: llm_gpu_serving_llamacpp_marker
  when: llm_gpu_serving_llamacpp_marker_stat.stat.exists

- name: Install the llama.cpp CUDA release binary
  ansible.builtin.include_tasks: install-llamacpp-release.yml

- name: Resolve the active profile's registry model
  ansible.builtin.set_fact:
    llm_gpu_serving_active_registry_model: "{{ llm_gpu_serving_registry_by_profile[llm_active_profile] }}"
    llm_gpu_serving_active_artifact: "{{ llm_gpu_serving_registry_by_profile[llm_active_profile].artifact }}"

- name: Assert the active artifact fits the GPU and guest RAM budgets
  ansible.builtin.include_role:
    name: nvidia_gpu_guest
    tasks_from: assert-profile-fit.yml
  vars:
    nvidia_gpu_guest_active_profile: "{{ llm_active_profile }}"
    nvidia_gpu_guest_profiles: "{{ llm_gpu_serving_profiles }}"
    nvidia_gpu_guest_registry_by_profile: "{{ llm_gpu_serving_registry_by_profile }}"
  when: not (llm_gpu_serving_render_only | default(false) | bool)

- name: Assert the co-resident GPU reserve remains available outside vLLM
  ansible.builtin.assert:
    that:
      - >-
        (nvidia_gpu_guest_fit_gpu_memory_mib | int / 1024)
        * (1 - llm_gpu_serving_profiles[llm_active_profile].gpu_memory_utilization | float)
        >= (llm_gpu_serving_profiles[item].gpu_memory_reserve_gib | float)
      - llm_gpu_serving_profiles[item].max_num_seqs | int == 4
      - llm_gpu_serving_profiles[item].max_model_len | int == 65536
      - llm_gpu_serving_profiles[item].kv_cache_dtype == 'q8_0'
    fail_msg: >-
      Co-resident profile {{ item }} requires {{ llm_gpu_serving_profiles[item].gpu_memory_reserve_gib }} GiB
      outside the vLLM allocation, and must keep four 65,536-token Q8_0 slots.
    quiet: true
  loop: "{{ llm_gpu_serving_co_resident_profiles }}"
  loop_control:
    label: "{{ item }}"
  when:
    - not (llm_gpu_serving_render_only | default(false) | bool)
    - llm_gpu_serving_co_resident_profiles | length > 0

- name: Resolve active profile model paths
  ansible.builtin.set_fact:
    llm_gpu_serving_health_host: >-
      {{ llm_gpu_serving_listen_host | default(ansible_facts.default_ipv4.address) }}

- name: Cache the active profile's registered model artifact
  ansible.builtin.include_tasks: cache-sync.yml
  loop: >-
    {{ [llm_gpu_serving_active_artifact.artifact_id]
       + (llm_gpu_serving_active_artifact.required_artifact_ids | default([])) }}
  loop_control:
    loop_var: llm_gpu_serving_cache_sync_artifact_id
    label: "{{ llm_gpu_serving_cache_sync_artifact_id }}"
  vars:
    llm_gpu_serving_cache_sync_notify_service: true

- name: Cache each selected co-resident profile's registered model artifact
  ansible.builtin.include_tasks: cache-sync.yml
  loop: "{{ llm_gpu_serving_co_resident_profiles }}"
  loop_control:
    loop_var: llm_gpu_serving_cache_sync_profile
    label: "{{ llm_gpu_serving_cache_sync_profile }}"
  vars:
    llm_gpu_serving_cache_sync_artifact_id: >-
      {{ llm_gpu_serving_registry_by_profile[llm_gpu_serving_cache_sync_profile].artifact.artifact_id }}
    llm_gpu_serving_cache_sync_notify_service: true

- name: Retire units for disabled GPU serving profiles
  ansible.builtin.include_tasks: retire-disabled-profile.yml
  loop: "{{ llm_gpu_serving_profiles | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: >-
    not (llm_gpu_serving_render_only | default(false))
    and (not (item.value.enabled | default(true))
         or (item.value.co_resident_only | default(false)
             and item.key not in llm_gpu_serving_co_resident_profiles
             and item.key != llm_active_profile))

- name: Render one systemd unit for each GPU serving profile
  ansible.builtin.include_tasks: render-units.yml

- name: Check profile service states and request a switch when they diverge
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - "{{ llm_gpu_serving_unit_prefix }}-{{ item.key }}.service"
  register: llm_gpu_serving_profile_state
  changed_when: >-
    (((item.key == llm_active_profile or item.key in llm_gpu_serving_co_resident_profiles)
      and (llm_gpu_serving_paused | default(false) | bool)
          == (llm_gpu_serving_profile_state.rc == 0))
     or (item.key != llm_active_profile
         and item.key not in llm_gpu_serving_co_resident_profiles
         and llm_gpu_serving_profile_state.rc == 0))
  failed_when: llm_gpu_serving_profile_state.rc not in [0, 3, 4]
  loop: "{{ llm_gpu_serving_profiles | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value.enabled | default(true)
  notify:
    - Stop every other GPU serving profile before switching
    - Start the active GPU serving profile
    - Start selected co-resident GPU serving profiles

- name: Apply pending GPU serving service changes
  ansible.builtin.meta: flush_handlers

- name: Wait for the active GPU serving profile to answer
  ansible.builtin.include_tasks: health-check.yml
  when: not (llm_gpu_serving_paused | default(false) | bool)

- name: Wait for every selected co-resident GPU profile to answer
  ansible.builtin.uri:
    url: "http://{{ llm_gpu_serving_health_host }}:{{ llm_gpu_serving_profiles[item].port }}/v1/models"
    status_code: 200
  register: llm_gpu_serving_co_resident_health
  retries: "{{ llm_gpu_serving_health_retries }}"
  delay: "{{ llm_gpu_serving_health_delay }}"
  until: llm_gpu_serving_co_resident_health.status == 200
  loop: "{{ llm_gpu_serving_co_resident_profiles }}"
  loop_control:
    label: "{{ item }}"
  when:
    - not ansible_check_mode
    - not (llm_gpu_serving_paused | default(false) | bool)
