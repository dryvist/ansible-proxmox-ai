---
# Publish the active profile's DECLARED serving capacity for node_exporter's
# textfile collector: the slot count and per-slot context the role starts the
# engine with, before any engine-side clamping. For llama.cpp,
# templates/llama-cpp-serve-args.j2 starts llama-server with --ctx-size
# max_model_len x max_num_seqs (line 14) and --parallel max_num_seqs (line
# 15), so the per-slot context the server actually gets is max_model_len — the
# shared context divided by the parallel slots. The vLLM profiles this role
# also serves pass --max-model-len directly per sequence
# (templates/llm-gpu-serving.service.j2). Both values are read from the
# profile map, never restated as literals.
#
# The accelerator label is the router's lane taxonomy, not a serving-side
# invention: the two label variables below are the ones
# llm_router_gpu_profile_accelerators renders from, selected by the same
# llm_gpu_legacy_group membership rule
# (roles/llm_router/defaults/main/21-gpu-profiles.yml). The router's defaults
# are not in this role's scope, so the two files declaring them load here the
# same way tasks/load-registry.yml loads vllm_serving's profile definitions
# cross-role.
- name: Load the router defaults declaring the fast lane's accelerator label
  ansible.builtin.include_vars:
    file: "{{ role_path | dirname }}/llm_router/defaults/main/10-network.yml"
    name: _llm_gpu_serving_router_fast_lane_defaults

- name: Load the router defaults declaring the GPU tier's accelerator label
  ansible.builtin.include_vars:
    file: "{{ role_path | dirname }}/llm_router/defaults/main/21-gpu-profiles.yml"
    name: _llm_gpu_serving_router_gpu_defaults

- name: Check for the node_exporter textfile collector directory
  ansible.builtin.stat:
    path: "{{ llm_gpu_serving_textfile_collector_dir }}"
  register: _llm_gpu_serving_textfile_collector_dir

- name: Write the declared serving slots and context per slot
  # No node_exporter on this guest: skip, never fail the converge. copy stages
  # the content in a temporary file beside the destination and renames it into
  # place, so a scrape never reads a half-written metric file.
  ansible.builtin.copy:
    dest: "{{ llm_gpu_serving_textfile_collector_dir }}/llm_serving_declared.prom"
    content: |
      llm_serving_declared_slots{{ _llm_gpu_serving_metric_labels }} {{ _llm_gpu_serving_slots }}
      llm_serving_declared_context_tokens_per_slot{{ _llm_gpu_serving_metric_labels }} {{ _llm_gpu_serving_context }}
    mode: "0644"
  when: _llm_gpu_serving_textfile_collector_dir.stat.exists
  vars:
    _llm_gpu_serving_profile: "{{ llm_gpu_serving_profiles[llm_active_profile] }}"
    # gpu-secondary on a legacy-group member, gpu-primary otherwise — the rule
    # llm_router_gpu_profile_accelerators applies per profile.
    _llm_gpu_serving_accelerator: >-
      {{ _llm_gpu_serving_router_fast_lane_defaults.llm_router_llm_fast_accelerator
         if inventory_hostname in groups.get('llm_gpu_legacy_group', [])
         else _llm_gpu_serving_router_gpu_defaults.llm_router_gpu_accelerator }}
    _llm_gpu_serving_metric_labels: >-
      {{ '{accelerator="%s",profile="%s",engine="%s"}' | format(
           _llm_gpu_serving_accelerator,
           llm_active_profile,
           _llm_gpu_serving_profile.engine) }}
    # --parallel in templates/llama-cpp-serve-args.j2; --max-num-seqs for this
    # role's vLLM profiles in templates/llm-gpu-serving.service.j2.
    _llm_gpu_serving_slots: >-
      {{ _llm_gpu_serving_profile.max_num_seqs | int }}
    # The shared --ctx-size (max_model_len x max_num_seqs) divided by the
    # --parallel slots (templates/llama-cpp-serve-args.j2, lines 14-15); this
    # role's vLLM profiles get --max-model-len directly, per sequence.
    _llm_gpu_serving_context: >-
      {{ _llm_gpu_serving_profile.max_model_len | int }}
