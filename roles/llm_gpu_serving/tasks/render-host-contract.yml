---
# Renders secret-free host-interim unit contracts for the PVE runner.
# Scope `primary` (default): the one profile marked primary, written to
# llm_gpu_serving_host_contract_unit_path. Scope `all`: every enabled profile,
# one unit file each under llm_gpu_serving_host_contract_unit_dir; only
# llm_active_profile is started, every other profile stays stopped and disabled.
- name: Load the primary GPU profile and artifact registries
  ansible.builtin.include_tasks: load-registry.yml

- name: Select the profiles the contract covers
  ansible.builtin.set_fact:
    llm_gpu_serving_host_primary_profiles: >-
      {{ llm_profiles | dict2items
         | selectattr('value.primary', 'defined')
         | selectattr('value.primary') | list }}
    llm_gpu_serving_host_contract_scope_resolved: "{{ llm_gpu_serving_host_contract_scope | default('primary') }}"
    llm_gpu_serving_host_enabled_profile_names: >-
      {{ llm_profiles | dict2items
         | selectattr('value.enabled', 'defined') | selectattr('value.enabled') | map(attribute='key') | list
         + llm_profiles | dict2items
           | rejectattr('value.enabled', 'defined') | map(attribute='key') | list }}

- name: Validate host contract inputs and profiles
  ansible.builtin.assert:
    that:
      - llm_gpu_serving_host_contract_scope_resolved in ['primary', 'all']
      - >-
        llm_gpu_serving_host_contract_scope_resolved != 'primary'
        or llm_gpu_serving_host_primary_profiles | length == 1
      - llm_gpu_serving_host_model_cache_mount_path is defined
      - llm_gpu_serving_host_model_cache_mount_path is match('^/.+')
      - llm_gpu_serving_host_working_directory is defined
      - llm_gpu_serving_host_working_directory is match('^/.+')
      - llm_gpu_serving_host_bind_host is defined
      - llm_gpu_serving_host_bind_host | string | length > 0
      - llm_gpu_serving_host_contract_vars_path is defined
      - llm_gpu_serving_host_contract_vars_path is match('^/.+')
      - llm_gpu_serving_host_contract_state | default('stopped') in ['started', 'stopped']
      - llm_gpu_serving_host_contract_enabled | default(false) | type_debug == 'bool'
      - >-
        llm_gpu_serving_host_contract_scope_resolved != 'primary'
        or (llm_gpu_serving_host_contract_unit_path is defined
            and llm_gpu_serving_host_contract_unit_path is match('^/.+'))
      - >-
        llm_gpu_serving_host_contract_scope_resolved != 'all'
        or (llm_gpu_serving_host_contract_unit_dir is defined
            and llm_gpu_serving_host_contract_unit_dir is match('^/.+')
            and llm_active_profile in llm_gpu_serving_host_enabled_profile_names)
    fail_msg: >-
      Host contract rendering requires scope primary (one primary profile and
      an absolute unit path) or scope all (an absolute unit directory and an
      enabled active profile), plus valid existing host paths, a bind address,
      and an absolute vars path.
    quiet: true

- name: Select the profile names to render
  ansible.builtin.set_fact:
    llm_gpu_serving_host_contract_profile_names: >-
      {{ [llm_gpu_serving_host_primary_profiles[0].key]
         if llm_gpu_serving_host_contract_scope_resolved == 'primary'
         else llm_gpu_serving_host_enabled_profile_names }}
    llm_gpu_serving_host_contracts: []

- name: Render one host-interim systemd unit per selected profile
  ansible.builtin.include_tasks: render-host-contract-profile.yml
  loop: "{{ llm_gpu_serving_host_contract_profile_names }}"
  loop_control:
    loop_var: llm_gpu_serving_host_contract_profile_name

- name: Write the PVE runner extra-vars contract
  ansible.builtin.copy:
    content: "{{ {'pve_host_systemd_units_contracts': llm_gpu_serving_host_contracts} | to_nice_yaml(indent=2) }}"
    dest: "{{ llm_gpu_serving_host_contract_vars_path }}"
    mode: "0600"
