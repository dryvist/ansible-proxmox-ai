---
- name: Install the CUDA toolkit for runtime kernel compilation
  ansible.builtin.apt:
    name: "{{ llm_gpu_serving_cuda_packages }}"
    state: present
    install_recommends: false
    # The prerequisite cache is enough when the repo task was skipped or unchanged.
    update_cache: "{{ (nvidia_gpu_guest_nvidia_repo | default({})).changed | default(false) }}"
  # Check mode does not write the repository, so its packages cannot resolve yet.
  when:
    - not (ansible_check_mode and (nvidia_gpu_guest_nvidia_repo | default({})).changed | default(false))
  environment: "{{ llamacpp_release_proxy_environment }}"
