---
# Waits for every co-resident profile to answer; on failure shows each unit's
# status and recent journal, redacted, before failing.
- name: Verify every selected co-resident GPU profile is healthy
  when:
    - not ansible_check_mode
    - not (llm_gpu_serving_paused | default(false) | bool)
  block:
    - name: Wait for every selected co-resident GPU profile to answer
      vars:
        llm_gpu_serving_co_resident_health_path: >-
          {{ '/health' if llm_gpu_serving_profiles[item].engine == 'audio_cpp' else '/v1/models' }}
        llm_gpu_serving_co_resident_health_url: >-
          {{ 'http://' ~ llm_gpu_serving_health_host ~ ':' ~ llm_gpu_serving_profiles[item].port
             ~ llm_gpu_serving_co_resident_health_path }}
      ansible.builtin.uri:
        url: "{{ llm_gpu_serving_co_resident_health_url }}"
        status_code: 200
      register: llm_gpu_serving_co_resident_health
      retries: "{{ llm_gpu_serving_health_retries }}"
      delay: "{{ llm_gpu_serving_health_delay }}"
      until: llm_gpu_serving_co_resident_health.status == 200
      loop: "{{ llm_gpu_serving_co_resident_profiles }}"
      loop_control:
        label: "{{ item }}"

    # audio.cpp loads models lazily, so /health answers before any GPU use;
    # one synthesis proves a model loads on the configured backend.
    - name: Synthesize a short phrase on each co-resident audio.cpp profile
      vars:
        llm_gpu_serving_co_resident_tts_models: >-
          {{ llm_gpu_serving_registry_by_profile[item].audio_cpp_models | default([])
             | selectattr('task', 'equalto', 'tts') | map(attribute='id') | list }}
      ansible.builtin.uri:
        url: >-
          {{ 'http://' ~ llm_gpu_serving_health_host ~ ':' ~ llm_gpu_serving_profiles[item].port
             ~ '/v1/audio/speech' }}
        method: POST
        body_format: json
        body:
          model: "{{ llm_gpu_serving_co_resident_tts_models | first }}"
          input: Ready.
          voice: alloy
          response_format: wav
        status_code: 200
        timeout: 300
      loop: "{{ llm_gpu_serving_co_resident_profiles }}"
      loop_control:
        label: "{{ item }}"
      when:
        - llm_gpu_serving_profiles[item].engine == 'audio_cpp'
        - llm_gpu_serving_co_resident_tts_models | length > 0
  rescue:
    - name: Read each co-resident unit status and recent journal
      ansible.builtin.command:
        argv: >-
          {{ item[1] | map('replace', '@unit@', llm_gpu_serving_unit_prefix ~ '-' ~ item[0] ~ '.service') | list }}
      loop: >-
        {{ llm_gpu_serving_co_resident_profiles
           | product([['systemctl', 'status', '@unit@', '--no-pager'],
                      ['journalctl', '-u', '@unit@', '--no-pager', '-n',
                       llm_gpu_serving_health_journal_lines | string]]) | list }}
      register: llm_gpu_serving_co_resident_health_diagnostics
      changed_when: false
      failed_when: false
      loop_control:
        label: "{{ item[0] }}: {{ item[1][0] }}"

    - name: Show each co-resident unit status and recent journal
      ansible.builtin.debug:
        msg: >-
          {{ item.stdout_lines | default([])
             | map('regex_replace', llm_gpu_serving_health_redact_regex, '<redacted>') | list }}
      loop: "{{ llm_gpu_serving_co_resident_health_diagnostics.results }}"
      loop_control:
        label: "{{ item.item[0] }}: {{ item.item[1][0] }}"

    - name: Fail with the co-resident health check outcome
      ansible.builtin.fail:
        msg: >-
          A co-resident GPU serving unit did not answer after
          {{ llm_gpu_serving_health_retries }} attempts {{ llm_gpu_serving_health_delay }}s
          apart; each unit's status and last {{ llm_gpu_serving_health_journal_lines }}
          journal lines are shown above.
