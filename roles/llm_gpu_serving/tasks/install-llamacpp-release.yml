---
- name: Install the llama.cpp CUDA release binary
  when: >-
    not llm_gpu_serving_llamacpp_server_stat.stat.exists
    or not llm_gpu_serving_llamacpp_marker_stat.stat.exists
    or (llm_gpu_serving_llamacpp_marker.content | b64decode | trim)
    != llm_gpu_serving_llamacpp_asset_name
  block:
    - name: Create a temporary llama.cpp extraction directory
      ansible.builtin.tempfile:
        state: directory
        suffix: llm-gpu-serving
      register: llm_gpu_serving_llamacpp_extract_tmp

    - name: Install the downloaded llama.cpp CUDA release
      when: not ansible_check_mode
      block:
        - name: Download the pinned llama.cpp CUDA asset through the cache
          ansible.builtin.include_tasks: "{{ role_path | dirname }}/llamacpp_release/tasks/download.yml"
          vars:
            llamacpp_release_asset_name: "{{ llm_gpu_serving_llamacpp_asset_name }}"
            llamacpp_release_asset_sha256: "{{ llamacpp_release_cuda_sha256 }}"
            llamacpp_release_download_path: >-
              {{ llm_gpu_serving_llamacpp_extract_tmp.path }}/{{ llm_gpu_serving_llamacpp_asset_name }}

        - name: Download the pinned llama.cpp CUDA runtime through the cache
          ansible.builtin.include_tasks: "{{ role_path | dirname }}/llamacpp_release/tasks/download.yml"
          vars:
            llamacpp_release_asset_name: "{{ llm_gpu_serving_llamacpp_cudart_asset_name }}"
            llamacpp_release_asset_sha256: "{{ llamacpp_release_cuda_runtime_sha256 }}"
            llamacpp_release_download_path: >-
              {{ llm_gpu_serving_llamacpp_extract_tmp.path }}/{{ llm_gpu_serving_llamacpp_cudart_asset_name }}

        - name: Extract the pinned llama.cpp release tarball
          ansible.builtin.unarchive:
            src: "{{ llm_gpu_serving_llamacpp_extract_tmp.path }}/{{ llm_gpu_serving_llamacpp_asset_name }}"
            dest: "{{ llm_gpu_serving_llamacpp_extract_tmp.path }}"
            remote_src: true

        - name: Extract the matching CUDA runtime tarball
          ansible.builtin.unarchive:
            src: "{{ llm_gpu_serving_llamacpp_extract_tmp.path }}/{{ llm_gpu_serving_llamacpp_cudart_asset_name }}"
            dest: "{{ llm_gpu_serving_llamacpp_extract_tmp.path }}"
            remote_src: true

        - name: Find the CUDA runtime library in its archive
          ansible.builtin.find:
            paths: "{{ llm_gpu_serving_llamacpp_extract_tmp.path }}"
            patterns: "libcudart.so*"
            recurse: true
          register: llm_gpu_serving_llamacpp_cudart_find

        - name: Find llama-server in the CUDA release archive
          ansible.builtin.find:
            paths: "{{ llm_gpu_serving_llamacpp_extract_tmp.path }}"
            patterns: llama-server
            file_type: file
            recurse: true
          register: llm_gpu_serving_llamacpp_server_find

        - name: Assert llama-server was included in the release archive
          ansible.builtin.assert:
            that:
              - llm_gpu_serving_llamacpp_server_find.matched | int > 0
              - llm_gpu_serving_llamacpp_cudart_find.matched | int > 0
            fail_msg: "The CUDA release archives lack llama-server or libcudart."

        - name: Create the llama.cpp install directory
          ansible.builtin.file:
            path: "{{ llm_gpu_serving_llamacpp_install_dir }}"
            state: directory
            owner: "{{ llm_gpu_serving_user }}"
            group: "{{ llm_gpu_serving_group }}"
            mode: "0750"

        - name: Install llama.cpp binaries, shared libraries and the CUDA runtime
          ansible.builtin.command:
            argv:
              - cp
              - -a
              # Unlink before writing: a running llama-server keeps the old
              # inode until its restart, instead of failing "Text file busy".
              - --remove-destination
              - "{{ item }}/."
              - "{{ llm_gpu_serving_llamacpp_install_dir }}/"
          loop:
            - "{{ llm_gpu_serving_llamacpp_server_find.files[0].path | dirname }}"
            - "{{ llm_gpu_serving_llamacpp_cudart_find.files[0].path | dirname }}"
          changed_when: true
          notify:
            - Stop every other GPU serving profile before switching
            - Start the active GPU serving profile
            - Start selected co-resident GPU serving profiles

        - name: Record the installed llama.cpp asset name
          ansible.builtin.copy:
            content: "{{ llm_gpu_serving_llamacpp_asset_name }}\n"
            dest: "{{ llm_gpu_serving_llamacpp_asset_marker }}"
            owner: "{{ llm_gpu_serving_user }}"
            group: "{{ llm_gpu_serving_group }}"
            mode: "0640"

        - name: Remove the temporary llama.cpp extraction directory
          ansible.builtin.file:
            path: "{{ llm_gpu_serving_llamacpp_extract_tmp.path }}"
            state: absent
    - name: Preview the llama.cpp CUDA release install in check mode
      ansible.builtin.debug:
        msg: >-
          Would install {{ llm_gpu_serving_llamacpp_asset_name }}
          (sha256 {{ llamacpp_release_cuda_sha256 }}) and
          {{ llm_gpu_serving_llamacpp_cudart_asset_name }}
          (sha256 {{ llamacpp_release_cuda_runtime_sha256 }}), tag
          {{ llamacpp_release_tag }}, to {{ llm_gpu_serving_llamacpp_install_dir }}.
      when: ansible_check_mode
