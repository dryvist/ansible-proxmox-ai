---
- name: Inspect the disabled GPU profile unit
  ansible.builtin.stat:
    path: "{{ llm_gpu_serving_systemd_dir }}/{{ llm_gpu_serving_unit_prefix }}-{{ item.key }}.service"
  register: llm_gpu_serving_disabled_profile_unit

- name: Stop and disable the existing disabled GPU profile unit
  ansible.builtin.systemd:
    name: "{{ llm_gpu_serving_unit_prefix }}-{{ item.key }}.service"
    state: stopped
    enabled: false
    daemon_reload: true
  when: llm_gpu_serving_disabled_profile_unit.stat.exists

- name: Remove the disabled GPU profile unit file
  ansible.builtin.file:
    path: "{{ llm_gpu_serving_systemd_dir }}/{{ llm_gpu_serving_unit_prefix }}-{{ item.key }}.service"
    state: absent
  when: llm_gpu_serving_disabled_profile_unit.stat.exists
