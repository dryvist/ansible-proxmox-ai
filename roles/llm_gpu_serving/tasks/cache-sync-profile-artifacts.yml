---
- name: Cache the profile's primary and required model artifacts
  ansible.builtin.include_tasks: cache-sync.yml
  loop: >-
    {{ ([llm_gpu_serving_registry_by_profile[llm_gpu_serving_cache_sync_profile].artifact.artifact_id]
        + (llm_gpu_serving_registry_by_profile[llm_gpu_serving_cache_sync_profile].artifact.required_artifact_ids
           | default([]))
        + (llm_gpu_serving_registry_by_profile[llm_gpu_serving_cache_sync_profile].co_resident_routes
           | default([]) | map(attribute='artifact_id') | list)) | unique | list }}
  loop_control:
    loop_var: llm_gpu_serving_cache_sync_artifact_id
    label: "{{ llm_gpu_serving_cache_sync_artifact_id }}"
  vars:
    llm_gpu_serving_cache_sync_notify_service: true
