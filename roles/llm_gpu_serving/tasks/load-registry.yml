---
- name: Load shared GPU profile references
  ansible.builtin.include_vars:
    file: "{{ llm_gpu_serving_registry_file }}"

- name: Load the GPU matrix profile shard
  ansible.builtin.include_vars:
    file: "{{ llm_gpu_serving_matrix_registry_file }}"

- name: Combine shared GPU profile references
  ansible.builtin.set_fact:
    llm_gpu_serving_registry_profiles: "{{ _llm_registry_gpu + _llm_registry_gpu_matrix }}"

- name: Load shared vLLM profile definitions
  ansible.builtin.include_vars:
    file: "{{ role_path | dirname }}/vllm_serving/defaults/main/10-profiles.yml"

- name: Add the selected vLLM profile to legacy serving
  ansible.builtin.set_fact:
    llm_gpu_serving_profiles: >-
      {{ llm_gpu_serving_profiles
         | combine({llm_active_profile: vllm_serving_profiles[llm_active_profile]
                   | combine({'port': llm_gpu_serving_api_port})}) }}
  when:
    - llm_active_profile not in llm_gpu_serving_profiles
    - llm_active_profile in vllm_serving_profiles
    - >-
      llm_active_profile in (llm_gpu_serving_registry_profiles
                             | map(attribute='profile') | list)

- name: Load campaign model artifacts
  ansible.builtin.include_vars:
    file: "{{ llm_gpu_serving_artifact_registry_file }}"

- name: Load the GLM-5.3-Flash artifact shard
  ansible.builtin.include_vars:
    file: "{{ llm_gpu_serving_glm_artifact_registry_file }}"

- name: Load the NVFP4 sweep artifact shard
  ansible.builtin.include_vars:
    file: "{{ llm_gpu_serving_nvfp4_sweep_artifact_registry_file }}"

- name: Load Stage 0 benchmark artifacts
  ansible.builtin.include_vars:
    file: "{{ llm_gpu_serving_stage0_artifact_registry_file }}"

- name: Load the GPU matrix artifact shard
  ansible.builtin.include_vars:
    file: "{{ llm_gpu_serving_matrix_artifact_registry_file }}"

- name: Combine campaign model artifact shards
  ansible.builtin.set_fact:
    llm_gpu_serving_model_artifacts: >-
      {{ _llm_model_artifacts + _llm_model_artifacts_glm53flash
         + _llm_model_artifacts_nvfp4_sweep + _llm_model_stage0_artifacts
         + _llm_model_artifacts_matrix }}

- name: Index campaign model artifacts by stable id
  ansible.builtin.set_fact:
    llm_gpu_serving_artifacts_by_id: >-
      {{ dict(llm_gpu_serving_model_artifacts | map(attribute='artifact_id')
              | zip(llm_gpu_serving_model_artifacts)) }}

- name: Assert model artifacts have unique stable ids
  ansible.builtin.assert:
    that:
      - llm_gpu_serving_model_artifacts | length > 0
      - llm_gpu_serving_artifacts_by_id | length == llm_gpu_serving_model_artifacts | length
    fail_msg: "The GPU artifact registry shards must contain unique artifact ids."
    quiet: true

- name: Select artifacts included in the pinned model store
  ansible.builtin.set_fact:
    llm_gpu_serving_model_store_artifacts: >-
      {{ llm_gpu_serving_model_artifacts
         | selectattr('model_store', 'defined')
         | selectattr('model_store', 'equalto', true)
         | list }}

- name: Validate pinned model-store artifact metadata
  ansible.builtin.assert:
    that:
      - item.revision is match('^[0-9a-f]{40}$')
      - item.model_store_profile in (llm_gpu_serving_registry_profiles | map(attribute='profile') | list)
      - item.model_store_size_bytes | int > 0
    fail_msg: "Every model-store artifact must declare one pinned revision, profile, and positive size."
    quiet: true
  loop: "{{ llm_gpu_serving_model_store_artifacts }}"
  loop_control:
    label: "{{ item.artifact_id }}"

- name: List distinct repositories in the pinned model store
  ansible.builtin.set_fact:
    llm_gpu_serving_model_store_repositories: >-
      {{ llm_gpu_serving_model_store_artifacts | map(attribute='hf_repo') | unique | list }}

- name: Validate pinned revisions and disjoint selectors for shared repositories
  ansible.builtin.assert:
    that:
      - >-
        (llm_gpu_serving_model_store_repository_artifacts
         | map(attribute='revision') | unique | list | length) == 1
      - >-
        (llm_gpu_serving_model_store_repository_selectors | unique | list | length)
        == (llm_gpu_serving_model_store_repository_selectors | length)
      - >-
        llm_gpu_serving_model_store_repository_artifacts | length == 1
        or (llm_gpu_serving_model_store_repository_selectors
            | select('match', '.*[?*\\[].*') | list | length == 0)
    fail_msg: >-
      Artifacts sharing one model-store repository must use one immutable
      revision and pairwise-disjoint literal include selectors.
    quiet: true
  vars:
    llm_gpu_serving_model_store_repository_artifacts: >-
      {{ llm_gpu_serving_model_store_artifacts
         | selectattr('hf_repo', 'equalto', item) | list }}
    llm_gpu_serving_model_store_repository_selectors: >-
      {{ llm_gpu_serving_model_store_repository_artifacts
         | map(attribute='include_globs') | flatten | list }}
  loop: "{{ llm_gpu_serving_model_store_repositories }}"
  loop_control:
    label: "{{ item }}"

- name: Validate model artifact metadata
  ansible.builtin.assert:
    that:
      - item.artifact_id | length > 0
      - item.hf_repo | length > 0
      - item.include_globs | length > 0
      - item.format | length > 0
      - item.quantization | length > 0
      - item.engines | length > 0
      - item.use in ['serving', 'benchmark-only']
      - item.model_task is not defined or item.model_task | length > 0
      - item.model_task_source is not defined or item.model_task_source in ['model_card', 'inferred']
      - (item.model_task is defined) == (item.model_task_source is defined)
      - item.model_size is not defined or item.model_task is defined
      - >-
        item.use == 'benchmark-only'
        or item.engines | difference(['vllm', 'llama_cpp', 'sglang', 'mlx_lm']) | length == 0
      - item.model_size is not defined or item.model_size | length > 0
      - item.context_window_tokens is not defined or item.context_window_tokens | int > 0
      - >-
        item.required_artifact_ids | default([])
        | difference(llm_gpu_serving_model_artifacts | map(attribute='artifact_id') | list)
        | length == 0
      - item.artifact_id not in (item.required_artifact_ids | default([]))
      - >-
        (item.required_artifact_ids | default([]) | unique | length)
        == (item.required_artifact_ids | default([]) | length)
    fail_msg: "The GPU artifact registry shards contain invalid or duplicate artifact metadata."
    quiet: true
  loop: "{{ llm_gpu_serving_model_artifacts }}"
  loop_control:
    label: "{{ item.artifact_id }}"

- name: Index serving profiles with their model artifacts
  ansible.builtin.set_fact:
    llm_gpu_serving_registry_by_profile: >-
      {%- set ns = namespace(by_profile={}) -%}
      {%- for profile in llm_gpu_serving_registry_profiles
            if profile.profile in llm_gpu_serving_profiles -%}
      {%- set artifact = llm_gpu_serving_artifacts_by_id.get(profile.artifact_id) -%}
      {%- if artifact is not none -%}
      {%- set _ = ns.by_profile.update({profile.profile: profile | combine({
            'artifact': artifact, 'upstream_model_id': artifact.hf_repo
          })}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.by_profile }}

- name: Assert each serving profile resolves to exactly one artifact
  ansible.builtin.assert:
    that:
      - llm_gpu_serving_registry_by_profile | length == llm_gpu_serving_profiles | length
      - llm_gpu_serving_registry_by_profile.keys() | list | sort == llm_gpu_serving_profiles.keys() | list | sort
      - item.value.artifact_id in llm_gpu_serving_artifacts_by_id
      - >-
        item.value.required_artifact_ids | default([])
        | difference(llm_gpu_serving_model_artifacts | map(attribute='artifact_id') | list)
        | length == 0
      - >-
        not (llm_gpu_serving_profiles[item.key].enabled | default(true))
        or (item.value.artifact.use == 'serving'
            and llm_gpu_serving_profiles[item.key].engine in item.value.artifact.engines)
    fail_msg: >-
      Every GPU serving profile must reference exactly one serving artifact with
      matching engine support in the GPU artifact registry shards.
    quiet: true
  loop: "{{ llm_gpu_serving_registry_by_profile | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Assert profile floors are complete and required for servable entries
  ansible.builtin.include_tasks: assert-profile-floors.yml
