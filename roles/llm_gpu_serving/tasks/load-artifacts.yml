---
- name: Load the registered model artifact shards
  ansible.builtin.include_vars:
    dir: "{{ role_path | dirname | dirname }}/llm-models.d"
    files_matching: "{{ llm_gpu_serving_artifact_files_matching | default('.*artifacts.*\\.yml$') }}"
  register: llm_gpu_serving_artifact_shard_load

- name: Combine registered model artifacts
  ansible.builtin.set_fact:
    llm_gpu_serving_model_artifacts: >-
      {{ llm_gpu_serving_artifact_shard_load.ansible_facts | dict2items
         | selectattr('key', 'match', '^_llm_model_(artifacts.*|.*_artifacts)$')
         | sort(attribute='key')
         | map(attribute='value') | flatten }}
