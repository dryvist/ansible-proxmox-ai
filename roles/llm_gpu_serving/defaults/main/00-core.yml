---
# Native GPU model serving. Profile and model values are provisional until the
# benchmark campaign selects the production combinations.

llm_gpu_serving_user: llm-gpu-serving
llm_gpu_serving_group: llm-gpu-serving
llm_gpu_serving_home: /var/lib/llm-gpu-serving
llm_gpu_serving_data_dir: /var/lib/llm-gpu-serving
llm_gpu_serving_install_dir: /opt/llm-gpu-serving
llm_gpu_serving_venv: "{{ llm_gpu_serving_install_dir }}/venv"
llm_gpu_serving_python: "3.12"
llm_gpu_serving_uv_bin: /usr/local/bin/uv
# renovate: datasource=github-releases depName=astral-sh/uv
llm_gpu_serving_uv_version: "0.12.21"
llm_gpu_serving_uv_install_url: "https://astral.sh/uv/{{ llm_gpu_serving_uv_version }}/install.sh"
llm_gpu_serving_systemd_dir: /etc/systemd/system
llm_gpu_serving_unit_prefix: llm-gpu-serving

# A first start loads the model, compiles, and captures CUDA graphs before the
# endpoint answers: 180 x 5 s allows 15 minutes. On failure the role shows the
# unit status and the last journal lines, with token-shaped values redacted.
llm_gpu_serving_health_retries: 180
llm_gpu_serving_health_delay: 5
llm_gpu_serving_health_journal_lines: 80
llm_gpu_serving_health_redact_regex: '(?i)(bearer\s+|api[-_]?key[=\s:]+|token[=\s:]+|\bhf_|\bsk-)[A-Za-z0-9._~+/=-]+'

# The writable local cache comes from target inventory. Missing values stay
# empty so role validation fails instead of guessing a local path.
llm_gpu_serving_model_cache_mount_path: "{{ container_models_cache_mount_path | default('', true) }}"
llm_gpu_serving_model_origin_mount_path: "{{ container_models_origin_mount_path | default('', true) }}"
llm_gpu_serving_model_origin_mount_read_only: >-
  {{ container_models_origin_mount_read_only | default(true, true) | bool }}
llm_gpu_serving_model_cache_path: "{{ llm_gpu_serving_model_cache_mount_path }}/models"
llm_gpu_serving_uv_cache_dir: "{{ llm_gpu_serving_model_cache_mount_path }}/.uv-cache"
llm_gpu_serving_uv_python_install_dir: "{{ llm_gpu_serving_model_cache_mount_path }}/.uv-python"
llm_gpu_serving_uv_tool_dir: "{{ llm_gpu_serving_model_cache_mount_path }}/.uv-tools"
llm_gpu_serving_uv_tool_bin_dir: "{{ llm_gpu_serving_model_cache_mount_path }}/bin"
llm_gpu_serving_uv_environment:
  UV_CACHE_DIR: "{{ llm_gpu_serving_uv_cache_dir }}"
  UV_PYTHON_INSTALL_DIR: "{{ llm_gpu_serving_uv_python_install_dir }}"
  UV_TOOL_DIR: "{{ llm_gpu_serving_uv_tool_dir }}"
  UV_TOOL_BIN_DIR: "{{ llm_gpu_serving_uv_tool_bin_dir }}"

# renovate: datasource=pypi depName=huggingface-hub
llm_gpu_serving_huggingface_hub_version: "2.1.1"
llm_gpu_serving_hf_home: "{{ llm_gpu_serving_home }}/.cache/huggingface"

# Reuse the shared serving port; handlers ensure exactly one profile owns it.
llm_gpu_serving_api_port: "{{ tofu_data.constants.service_ports.llm_fast_api }}"

# renovate: datasource=pypi depName=vllm
llm_gpu_serving_vllm_version: "0.30.0"

# renovate: datasource=pypi depName=b12x
llm_gpu_serving_b12x_version: "1.5.0"

# FlashInfer's prebuilt kernels, at the flashinfer-python version the pinned vLLM
# requires (its requirements/cuda.txt). vLLM's PyPI wheel omits them, so without
# these every FlashInfer op JIT-compiles on first use. The JIT cache is built per
# CUDA series; this is the series of vLLM's torch build.
# renovate: ignore — must equal the flashinfer-python pin of the vLLM version above; bump together.
llm_gpu_serving_flashinfer_version: "0.6.18.post1"
llm_gpu_serving_flashinfer_index_url: https://flashinfer.ai/whl/
llm_gpu_serving_flashinfer_jit_cache_index_url: "{{ llm_gpu_serving_flashinfer_index_url }}cu130"

# CUDA toolkit for kernels that still compile at runtime (FlashInfer, DeepGEMM),
# the package set vLLM's own image installs. Same series as the node's toolkit;
# the guest's vendor repository starts at 13.1.
llm_gpu_serving_cuda_version: "13.2"
llm_gpu_serving_cuda_home: "/usr/local/cuda-{{ llm_gpu_serving_cuda_version }}"
llm_gpu_serving_cuda_packages: >-
  {{ ['cuda-nvcc', 'cuda-cudart', 'cuda-nvrtc', 'cuda-nvrtc-dev', 'cuda-cuobjdump',
      'libcurand-dev', 'libcublas-dev']
     | map('regex_replace', '$', '-' ~ (llm_gpu_serving_cuda_version | replace('.', '-')))
     | list + ['libnuma-dev', 'numactl'] }}

# The router registry owns model ids; serving profiles join to it by profile.
llm_gpu_serving_registry_file: "{{ role_path | dirname | dirname }}/llm-models.d/60-gpu-pro6000.yml"
llm_gpu_serving_artifact_registry_file: "{{ role_path | dirname | dirname }}/llm-models.d/65-gpu-pro6000-artifacts.yml"
llm_gpu_serving_glm_artifact_registry_file: >-
  {{ role_path | dirname | dirname }}/llm-models.d/66-gpu-pro6000-artifacts-glm53flash.yml

llm_gpu_serving_hf_bin: "{{ llm_gpu_serving_uv_tool_bin_dir }}/hf"

# Match the release-binary selection used by llama_cpp, narrowed to Linux x64
# CUDA 13.x assets. The binary archive carries llama-server but not the CUDA
# runtime; the release's `cudart-` twin of the same name carries only
# libcudart/libcublas, and both are installed side by side.
llm_gpu_serving_llamacpp_releases_api: "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=5"
llm_gpu_serving_llamacpp_asset_regex: "^llama-.*-bin-ubuntu-cuda-13[.].*-x64[.]tar[.]gz$"
llm_gpu_serving_llamacpp_install_dir: "{{ llm_gpu_serving_install_dir }}/llama.cpp"
llm_gpu_serving_llamacpp_server_bin: "{{ llm_gpu_serving_llamacpp_install_dir }}/llama-server"
# Names the installed release asset so a changed selection reinstalls.
llm_gpu_serving_llamacpp_asset_marker: "{{ llm_gpu_serving_llamacpp_install_dir }}/.installed-asset"

# NVIDIA userspace (libcuda, nvidia-smi) in the guest. The host owns the kernel
# module and the guest loads none, so this must equal the host driver version
# exactly (the host pin is nvidia_driver_version in the node-side role). Bump
# both together. apt verifies each package against the vendor repository's
# signed metadata, which carries the package checksums.
# renovate: ignore — NVIDIA's apt repo has no Renovate datasource; bump by hand with the host pin.
llm_gpu_serving_nvidia_userspace_version: "595.91.07"
llm_gpu_serving_nvidia_repo_uri: >-
  https://developer.download.nvidia.com/compute/cuda/repos/debian{{
  ansible_facts.distribution_major_version }}/x86_64/
llm_gpu_serving_nvidia_repo_key_url: "{{ llm_gpu_serving_nvidia_repo_uri | trim }}8793F200.pub"
