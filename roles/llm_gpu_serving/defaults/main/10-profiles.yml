---
# The router registry owns model ids. The benchmark campaign finalises context
# lengths, quantization, parser and backend choices, memory limits, and stream
# counts. Profiles join to the registry by name. All share one tofu-owned port.
llm_active_profile: small # noqa var-naming[no-role-prefix]
llm_profiles: # noqa var-naming[no-role-prefix]
  small:
    engine: vllm
    quant: bf16
    linear_backend: auto
    moe_backend: auto
    max_model_len: 32768
    max_num_seqs: 4
    gpu_memory_utilization: 0.75
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    port: "{{ llm_gpu_serving_api_port }}"
    gguf_file: ""
  medium-a:
    engine: vllm
    quant: nvfp4
    linear_backend: b12x
    moe_backend: auto
    max_model_len: 65536
    max_num_seqs: 8
    gpu_memory_utilization: 0.88
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    port: "{{ llm_gpu_serving_api_port }}"
    gguf_file: ""
  medium-b:
    engine: vllm
    quant: nvfp4
    linear_backend: b12x
    moe_backend: b12x
    max_model_len: 262144
    max_num_seqs: 4
    gpu_memory_utilization: 0.90
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    port: "{{ llm_gpu_serving_api_port }}"
    gguf_file: ""
  max:
    engine: vllm
    quant: nvfp4
    linear_backend: b12x
    moe_backend: b12x
    max_model_len: 131072
    max_num_seqs: 1
    gpu_memory_utilization: 0.95
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    port: "{{ llm_gpu_serving_api_port }}"
    gguf_file: ""
