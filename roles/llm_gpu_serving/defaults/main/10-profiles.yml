---
# The artifact registry owns model bytes and quantization. Profiles carry
# runtime serving settings and join to the registry by profile name.
llm_active_profile: small # noqa var-naming[no-role-prefix]
llm_profiles: # noqa var-naming[no-role-prefix]
  small:
    enabled: true
    engine: vllm
    linear_backend: auto
    moe_backend: auto
    max_model_len: 32768
    max_num_seqs: 4
    gpu_memory_utilization: 0.75
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    port: "{{ llm_gpu_serving_api_port }}"
  medium-a:
    enabled: true
    engine: vllm
    linear_backend: b12x
    moe_backend: auto
    max_model_len: 196608
    max_num_seqs: 8
    gpu_memory_utilization: 0.88
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    port: "{{ llm_gpu_serving_api_port }}"
  medium-b:
    enabled: false
    engine: vllm
    linear_backend: b12x
    moe_backend: b12x
    max_model_len: 65536
    max_num_seqs: 4
    gpu_memory_utilization: 0.90
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    port: "{{ llm_gpu_serving_api_port }}"
  max:
    enabled: false
    engine: vllm
    linear_backend: b12x
    moe_backend: b12x
    max_model_len: 131072
    max_num_seqs: 1
    gpu_memory_utilization: 0.95
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    port: "{{ llm_gpu_serving_api_port }}"
