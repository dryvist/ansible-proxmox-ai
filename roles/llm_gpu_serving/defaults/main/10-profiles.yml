---
# The benchmark campaign finalises model ids, context lengths, quantization,
# parser and backend choices, memory limits, and stream counts. All profiles
# share the tofu-owned serving port because only the selected profile runs.
llm_active_profile: small # noqa var-naming[no-role-prefix]
llm_profiles: # noqa var-naming[no-role-prefix]
  small:
    engine: vllm
    model_id: Qwen/Qwen3.5-9B
    quant: bf16
    linear_backend: auto
    moe_backend: auto
    max_model_len: 32768
    max_num_seqs: 4
    gpu_memory_utilization: 0.75
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    served_model_name: llm-gpu-serving
    port: "{{ llm_gpu_serving_api_port }}"
    gguf_file: ""
  medium-a:
    engine: vllm
    model_id: nvidia/Qwen3.8-27B-NVFP4
    quant: nvfp4
    linear_backend: b12x
    moe_backend: auto
    max_model_len: 65536
    max_num_seqs: 8
    gpu_memory_utilization: 0.88
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    served_model_name: llm-gpu-serving
    port: "{{ llm_gpu_serving_api_port }}"
    gguf_file: ""
  medium-b:
    engine: vllm
    model_id: nvidia/Qwen3.6-35B-A3B-NVFP4
    quant: nvfp4
    linear_backend: b12x
    moe_backend: b12x
    max_model_len: 262144
    max_num_seqs: 4
    gpu_memory_utilization: 0.90
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    served_model_name: llm-gpu-serving
    port: "{{ llm_gpu_serving_api_port }}"
    gguf_file: ""
  max:
    engine: vllm
    model_id: nvidia/Qwen3.5-122B-A10B-NVFP4
    quant: nvfp4
    linear_backend: b12x
    moe_backend: b12x
    max_model_len: 131072
    max_num_seqs: 1
    gpu_memory_utilization: 0.95
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    served_model_name: llm-gpu-serving
    port: "{{ llm_gpu_serving_api_port }}"
