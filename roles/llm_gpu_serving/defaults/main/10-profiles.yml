---
# The artifact registry owns model bytes and quantization. Profiles carry
# runtime serving settings and join to the registry by profile name.
# Optional per llama_cpp profile: kv_cache_dtype (--cache-type-k/-v), reasoning_format
# (--reasoning-format), moe_cpu_offload/moe_cpu_layers (--n-cpu-moe or --cpu-moe),
# llamacpp_cache_ram_mib (--cache-ram), and extra_args (appended verbatim).
llm_active_profile: small # noqa var-naming[no-role-prefix]
llm_profiles: # noqa var-naming[no-role-prefix]
  small:
    enabled: true
    engine: llama_cpp
    max_model_len: 8192
    max_num_seqs: 4
    flash_attention: true
    gpu_layers: 99
    port: "{{ llm_gpu_serving_api_port }}"
  small-c4-64k:
    enabled: true
    co_resident_only: true
    engine: llama_cpp
    max_model_len: 65536
    max_num_seqs: 4
    flash_attention: true
    gpu_layers: 99
    kv_cache_dtype: q8_0
    gpu_memory_reserve_gib: 20
    port: "{{ llm_gpu_serving_co_resident_api_port }}"
  small-lfm25-2b6:
    enabled: true
    co_resident_only: true
    engine: llama_cpp
    max_model_len: 65536
    max_num_seqs: 4
    flash_attention: true
    gpu_layers: 99
    kv_cache_dtype: q8_0
    gpu_memory_reserve_gib: 20
    port: "{{ llm_gpu_serving_co_resident_api_port }}"
  small-granite42-3b:
    enabled: true
    co_resident_only: true
    engine: llama_cpp
    max_model_len: 65536
    max_num_seqs: 4
    flash_attention: true
    gpu_layers: 99
    kv_cache_dtype: q8_0
    gpu_memory_reserve_gib: 20
    port: "{{ llm_gpu_serving_co_resident_api_port }}"
  small-lfm25-24b-a2b:
    enabled: true
    co_resident_only: true
    engine: llama_cpp
    max_model_len: 65536
    max_num_seqs: 4
    flash_attention: true
    gpu_layers: 99
    kv_cache_dtype: q8_0
    gpu_memory_reserve_gib: 20
    port: "{{ llm_gpu_serving_co_resident_api_port }}"
  medium-a:
    primary: true
    enabled: true
    engine: vllm
    linear_backend: b12x
    moe_backend: auto
    # Installed beside vLLM in one resolver run; the version is shared with the role install.
    python_packages:
      - "b12x=={{ llm_gpu_serving_b12x_version }}"
    max_model_len: 196608
    max_num_seqs: 8
    gpu_memory_utilization: 0.88
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    port: "{{ llm_gpu_serving_api_port }}"
  # llama_cpp profiles: max_model_len is the per-agent context; the unit sizes
  # llama-server's shared context as max_model_len x max_num_seqs with
  # max_num_seqs parallel slots. The model file comes from the artifact
  # registry (gguf_file), never from here. Tool-call parsing is template-driven
  # (--jinja), so these profiles carry no parser fields.
  medium-b:
    enabled: true
    engine: llama_cpp
    # Eight concurrent agents, like medium-a; the same 262,144-token shared
    # context as four 65,536-token slots.
    max_model_len: 32768
    max_num_seqs: 8
    flash_attention: true
    gpu_layers: 99
    port: "{{ llm_gpu_serving_api_port }}"
  # The 10.18 GiB GGUF leaves about 5.8 GiB of a 16 GiB card for compute
  # buffers and overhead. Q4_0 KV is about 18 KiB/token, or 2.25 GiB at
  # 131,072 tokens, so it stays in VRAM; llama.cpp's default --fit trims
  # unset arguments if buffers run short. mmap/lazy loading keeps
  # file-backed weight pages reclaimable on the host.
  qwen38-27b-131k-1:
    enabled: true
    engine: llama_cpp
    max_model_len: 131072
    max_num_seqs: 1
    flash_attention: true
    gpu_layers: 99
    kv_cache_dtype: q4_0
    extra_args: ["--load-mode", "mmap", "--lazy-mode", "on"]
    port: "{{ llm_gpu_serving_api_port }}"
  # 65,536 prompt tokens plus a 1,024-token output fit in 66,560 tokens.
  # N comes from the pinned GGUF tensor index; the paired weight-byte estimate
  # is admitted by nvidia_gpu_guest/tasks/assert-profile-fit.yml.
  moe1-qwen36-n14-s1:
    enabled: true
    engine: llama_cpp
    max_model_len: 66560
    max_num_seqs: 1
    flash_attention: true
    gpu_layers: auto
    kv_cache_dtype: q8_0
    moe_cpu_offload: ncmoe
    moe_cpu_layers: 14
    moe_gpu_resident_size_bytes: 15322979296
    llamacpp_cache_ram_mib: 1024
    extra_args: ["--load-mode", "mmap", "--lazy-mode", "on"]
    port: "{{ llm_gpu_serving_api_port }}"
  moe1-qwen36-n16-s2:
    enabled: true
    engine: llama_cpp
    max_model_len: 66560
    max_num_seqs: 2
    flash_attention: true
    gpu_layers: auto
    kv_cache_dtype: q8_0
    moe_cpu_offload: ncmoe
    moe_cpu_layers: 16
    moe_gpu_resident_size_bytes: 14349900768
    llamacpp_cache_ram_mib: 1024
    extra_args: ["--load-mode", "mmap", "--lazy-mode", "on"]
    port: "{{ llm_gpu_serving_api_port }}"
  moe1-bolt-n38-s1:
    enabled: true
    engine: llama_cpp
    max_model_len: 66560
    max_num_seqs: 1
    flash_attention: true
    gpu_layers: auto
    kv_cache_dtype: q8_0
    moe_cpu_offload: ncmoe
    moe_cpu_layers: 38
    moe_gpu_resident_size_bytes: 15776808960
    llamacpp_cache_ram_mib: 1024
    extra_args: ["--load-mode", "mmap", "--lazy-mode", "on"]
    port: "{{ llm_gpu_serving_api_port }}"
  moe1-bolt-n40-s2:
    enabled: true
    engine: llama_cpp
    max_model_len: 66560
    max_num_seqs: 2
    flash_attention: true
    gpu_layers: auto
    kv_cache_dtype: q8_0
    moe_cpu_offload: ncmoe
    moe_cpu_layers: 40
    moe_gpu_resident_size_bytes: 15378874368
    llamacpp_cache_ram_mib: 1024
    extra_args: ["--load-mode", "mmap", "--lazy-mode", "on"]
    port: "{{ llm_gpu_serving_api_port }}"
  max:
    enabled: true
    engine: llama_cpp
    max_model_len: 131072
    max_num_seqs: 1
    flash_attention: true
    gpu_layers: 99
    # Memory-mapped weights with the lookup shard loaded lazily, as in the
    # campaign's large-model cells.
    extra_args: ["-lm", "mmap", "-lzm", "on"]
    port: "{{ llm_gpu_serving_api_port }}"
  flash-next-small-128k-8:
    enabled: true
    engine: llama_cpp
    max_model_len: 131072
    max_num_seqs: 8
    flash_attention: true
    gpu_layers: 99
    kv_cache_dtype: q8_0
    port: "{{ llm_gpu_serving_api_port }}"
  nemotron-bolt-64k-16:
    enabled: true
    engine: llama_cpp
    max_model_len: 65536
    max_num_seqs: 16
    flash_attention: true
    gpu_layers: 99
    kv_cache_dtype: q8_0
    port: "{{ llm_gpu_serving_api_port }}"
  nemotron-bolt-256k-24:
    enabled: true
    engine: llama_cpp
    max_model_len: 262144
    max_num_seqs: 24
    flash_attention: true
    gpu_layers: 99
    kv_cache_dtype: q8_0
    port: "{{ llm_gpu_serving_api_port }}"
  glm-flash:
    enabled: true
    engine: llama_cpp
    max_model_len: 8192
    max_num_seqs: 1
    flash_attention: true
    gpu_layers: 99
    port: "{{ llm_gpu_serving_api_port }}"

# Keep the role's runtime map prefixed while preserving the legacy input name.
llm_gpu_serving_profiles: "{{ llm_profiles }}"
