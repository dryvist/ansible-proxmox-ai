---
- name: Stop every other GPU serving profile before switching
  ansible.builtin.systemd:
    name: "{{ llm_gpu_serving_unit_prefix }}-{{ item.key }}.service"
    state: stopped
    enabled: false
    daemon_reload: true
  loop: "{{ llm_profiles | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: not (llm_gpu_serving_render_only | default(false)) and item.key != llm_active_profile

- name: Start the active GPU serving profile
  ansible.builtin.systemd:
    name: "{{ llm_gpu_serving_unit_prefix }}-{{ llm_active_profile }}.service"
    state: restarted
    enabled: true
    daemon_reload: true
  when: not (llm_gpu_serving_render_only | default(false))
