---
- name: Stop every other GPU serving profile before switching
  ansible.builtin.systemd:
    name: "{{ llm_gpu_serving_unit_prefix }}-{{ item }}.service"
    state: stopped
    enabled: false
    daemon_reload: true
  register: llm_gpu_serving_stop_others
  # A profile never switched to has no unit yet; there is nothing to stop.
  failed_when:
    - llm_gpu_serving_stop_others.failed | default(false)
    - "'Could not find the requested service' not in (llm_gpu_serving_stop_others.msg | default(''))"
  # Every installed unit, not only this map's profiles: another engine role's unit or a sweep profile left
  # running otherwise keeps the port and the new profile crash-loops on "Address already in use".
  loop: >-
    {{ llm_gpu_serving_installed_units.files | default([]) | map(attribute='path') | map('basename')
       | map('regex_replace', '^' ~ llm_gpu_serving_unit_prefix ~ '-', '') | map('regex_replace', '[.]service$', '')
       | union(llm_gpu_serving_profiles | list) | list }}
  loop_control:
    label: "{{ item }}"
  when:
    - not (llm_gpu_serving_render_only | default(false))
    - >-
      (llm_gpu_serving_paused | default(false) | bool)
      or (item != llm_active_profile and item not in llm_gpu_serving_co_resident_profiles)

- name: Start the active GPU serving profile
  ansible.builtin.systemd:
    name: "{{ llm_gpu_serving_unit_prefix }}-{{ llm_active_profile }}.service"
    state: "{{ 'stopped' if llm_gpu_serving_paused | default(false) | bool else 'restarted' }}"
    enabled: true
    daemon_reload: true
  when: not (llm_gpu_serving_render_only | default(false))

- name: Start selected co-resident GPU serving profiles
  ansible.builtin.systemd:
    name: "{{ llm_gpu_serving_unit_prefix }}-{{ item }}.service"
    state: "{{ 'stopped' if llm_gpu_serving_paused | default(false) | bool else 'restarted' }}"
    enabled: true
    daemon_reload: true
  loop: "{{ llm_gpu_serving_co_resident_profiles }}"
  loop_control:
    label: "{{ item }}"
  when: not (llm_gpu_serving_render_only | default(false))
