---
# ollama role defaults — Ollama LLM inference with AMD ROCm, in an LXC (CT 167).
#
# GPU device nodes (/dev/kfd, /dev/dri) are passed into the container UPSTREAM by
# ansible-proxmox (role lxc_gpu_features); this role assumes they already exist
# and makes the `ollama` service user able to open them. Install uses the
# official script (which creates the `ollama` user + systemd unit), then overlays
# the ROCm runtime for AMD GPUs. Restart-on-failure is applied DRY by the
# shared systemd_restart_policy role via group_vars (Phase 9), not here.

ollama_install_url: "https://ollama.com/install.sh"
# AMD ROCm runtime overlay (the installer ships CPU/NVIDIA libs only).
ollama_rocm_tarball_url: "https://ollama.com/download/ollama-linux-amd64-rocm.tar.zst"

ollama_user: ollama
# Active-model store — backed by the 120 GB local-zfs mount on CT 167.
ollama_models_dir: /var/lib/ollama

# Bind all interfaces so hermes-chat (Open WebUI) + Traefik reach it on the ai VLAN.
# Port comes from the tofu ports registry (no hardcoded ports — see ip-addressing rule).
ollama_api_port: "{{ tofu_data.constants.service_ports.ollama_api }}"
ollama_listen: "0.0.0.0:{{ ollama_api_port }}"

# AMD RX 6800 = Navi 21 / gfx1030; ROCm needs the gfx-version override for this card.
ollama_hsa_override_gfx_version: "10.3.0"
ollama_flash_attention: "1"
ollama_keep_alive: "30m"
# Derived from ai_llm_concurrency (all.yml), same as every other serving-tier
# cap. It was a bare "1" that happened to equal the single source, so it looked
# correct while being wired to nothing — raising ai_llm_concurrency would have
# scaled every other consumer while Ollama silently stayed at one in-flight
# request.
ollama_num_parallel: "{{ ai_llm_concurrency | int }}"

# GPU device nodes passed into the container by ansible-proxmox lxc_gpu_features.
# The role stats these at runtime and adds the ollama user to whatever groups own
# them, so device access works regardless of how host GIDs map to container groups.
ollama_gpu_device_nodes:
  - /dev/kfd
  - /dev/dri/card0
  - /dev/dri/renderD128

# No model is provisioned here. `hermes4` (Hermes 4 14B, staged via a local
# GGUF + `ollama create`) was removed 2026-09-11: it was never a registered
# llm-models.d/ client_model_id, and nothing in the fabric routes a request to
# this guest's Ollama API — the router's own tiers (llm-fast, llm-4080, the
# Mac serving host) are separate backends, and open_webui/hindsight/etc. all
# request models through the router, never this host directly. Reintroducing a
# model here means adding it to llm-models.d/ AND wiring a router tier to this
# guest's api_port, not just setting a name below.
