---
# Shared pin and upstream asset names for every llama.cpp serving role.
# renovate: datasource=github-releases depName=ggml-org/llama.cpp versioning=semver
llamacpp_release_version: "0.7.0"
# Build ID from the stable release's nightly-tag.txt asset; Renovate tracks the stable release tag.
llamacpp_release_tag: "b11669"
llamacpp_release_download_url: "https://github.com/ggml-org/llama.cpp/releases/download/{{ llamacpp_release_tag }}"
llamacpp_release_cpu_asset: "llama-{{ llamacpp_release_tag }}-bin-ubuntu-x64.tar.gz"
llamacpp_release_cpu_sha256: "cf07c1c112d709bd67e522017471de57ed0ec8bea031d732c5422351c07f65ac"
llamacpp_release_vulkan_asset: "llama-{{ llamacpp_release_tag }}-bin-ubuntu-vulkan-x64.tar.gz"
llamacpp_release_vulkan_sha256: "e8709e5ba6c1b093dea7f3de57f4aba842f9a188fba6b465782d65d6fcfa4d9f"
llamacpp_release_rocm_asset: "llama-{{ llamacpp_release_tag }}-bin-ubuntu-rocm-10.0-x64.tar.gz"
llamacpp_release_rocm_sha256: "02d36f06accd8fdcb2d41078361b21fb2df5d139f169bf4efcb8424a7dbbef01"
llamacpp_release_cuda_asset: "llama-{{ llamacpp_release_tag }}-bin-ubuntu-cuda-13.4-x64.tar.gz"
llamacpp_release_cuda_sha256: "80878473d27278dbe9c38fb7e704f292a51e889d3c28a1e863137cdee1e2ba4e"
llamacpp_release_cuda_runtime_asset: "cudart-llama-{{ llamacpp_release_tag }}-bin-ubuntu-cuda-13.4-x64.tar.gz"
llamacpp_release_cuda_runtime_sha256: "1108bd9300a281e8eabb18d3fa028d4240ecd983f9f90dbbbc3297671016d697"

# The published inventory derives this list from the apt-cache capability tag
# and each cache guest's FQDN. Standard HTTP clients accept one proxy URL.
llamacpp_release_proxy_urls: >-
  {{ (tofu_data | default({})).get('cache_proxy_urls', {}).get('apt_cache', []) }}
llamacpp_release_proxy_url: "{{ llamacpp_release_proxy_urls | first | default('', true) }}"
llamacpp_release_proxy_environment:
  HF_HUB_DISABLE_UPDATE_CHECK: "1"
  http_proxy: "{{ llamacpp_release_proxy_url }}"
  https_proxy: "{{ llamacpp_release_proxy_url }}"
  HTTP_PROXY: "{{ llamacpp_release_proxy_url }}"
  HTTPS_PROXY: "{{ llamacpp_release_proxy_url }}"
