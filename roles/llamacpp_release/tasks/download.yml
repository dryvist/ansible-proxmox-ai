---
- name: Require the declared artifact cache proxy
  ansible.builtin.include_tasks: require-proxy.yml

- name: Download the pinned llama.cpp release asset through the cache
  ansible.builtin.get_url:
    url: "{{ llamacpp_release_download_url }}/{{ llamacpp_release_asset_name }}"
    dest: "{{ llamacpp_release_download_path }}"
    mode: "0644"
  environment: "{{ llamacpp_release_proxy_environment }}"
