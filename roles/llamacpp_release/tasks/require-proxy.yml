---
- name: Require published APT cache endpoints
  ansible.builtin.assert:
    that:
      - llamacpp_release_proxy_urls | length > 0
      - llamacpp_release_proxy_url is match('^http://[^/]+:[0-9]+$')
    fail_msg: >-
      The published inventory must provide cache_proxy_urls.apt_cache before
      external artifact downloads can run.
    quiet: true
