---
llm_model_watch_enabled: false
llm_model_watch_orgs: [Qwen, mlx-community, unsloth, nvidia, bartowski]
# Supply inventory-derived capacities; reserve covers runtime and KV cache.
# Each entry: id, vram_gib, reserve_gib, formats, libraries, quantizations.
llm_model_watch_accelerators: []
llm_model_watch_limit_per_org: 100
llm_model_watch_queue_dir: /var/lib/llm-model-watch/requests
llm_model_watch_webhook_url: "{{ lookup('env', 'LLM_MODEL_WATCH_SLACK_WEBHOOK_URL') }}"
llm_model_watch_environment_file: /etc/llm-model-watch.env
llm_model_watch_playbook_bin: "{{ ansible_playbook_python | dirname }}/ansible-playbook"
