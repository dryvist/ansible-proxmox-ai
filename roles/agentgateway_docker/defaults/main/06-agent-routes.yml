---
# Schema: https://raw.githubusercontent.com/agentgateway/agentgateway/v1.6.0/schema/config.json
# Route policies use apiKey, authorization, and requestHeaderModifier;
# Dify backends use mcp.targets[].mcp.host. Verified 2026-11-06.
# Each entry: {agent: <name>, allowed_callers: [<caller names>]}.
# An A2A target allows the roster agent's a2a_callers when it lists any, else the
# allowed tier; either way only callers that hold a gateway key.
# A supplied roster replaces these defaults; missing entries deny every caller.
agentgateway_docker_agent_roster: >-
  {%- set tier_callers = (ai_callers | default({})) | dict2items
      | selectattr('value.trust_tier', 'equalto', agentgateway_docker_a2a_allowed_tier)
      | map(attribute='key') | select('in', agentgateway_docker_roster_keys) | list -%}
  {%- set roster = [] -%}
  {%- for target in agentgateway_docker_a2a_targets -%}
    {%- set declared = (ai_agents | default({})).get(target.name, {}).get('a2a_callers', []) -%}
    {%- set _ = roster.append({'agent': target.name, 'allowed_callers':
        (declared | select('in', agentgateway_docker_roster_keys) | list) if declared else tier_callers}) -%}
  {%- endfor -%}
  {%- for target in agentgateway_docker_dify_mcp_targets | default([]) -%}
    {%- set _ = roster.append({'agent': target.name, 'allowed_callers': tier_callers}) -%}
  {%- endfor -%}
  {{ roster }}

# Dify-published MCP servers, one per live agent: {name: <agent>, url: <server URL>}.
# URLs are deployment inputs; the role holds no app definitions or prompts.
# Each server is exposed at /agents/<name> with the roster's peer allowlist.
agentgateway_docker_dify_mcp_targets: []
