---
# Schema: https://raw.githubusercontent.com/agentgateway/agentgateway/v1.6.0/schema/config.json
# Route policies use apiKey, authorization, and requestHeaderModifier;
# Dify backends use mcp.targets[].mcp.host. Verified 2026-11-06.
# Roster projection supplied by the agent definitions' deployment pipeline.
# Each entry: {agent: <name>, allowed_callers: [<caller names>]}.
# Missing entries and empty allowlists deny every caller.
agentgateway_docker_agent_roster: []

# Dify-published MCP servers, one per live agent: {name: <agent>, url: <server URL>}.
# URLs are deployment inputs; the role holds no app definitions or prompts.
# Each server is exposed at /agents/<name> with the roster's peer allowlist.
agentgateway_docker_dify_mcp_targets: []
