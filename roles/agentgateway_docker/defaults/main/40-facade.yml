---
# Caller facade — one authenticated MCP route (agentgateway_docker_facade_path)
# that AI harnesses use to reach Vikunja through a single endpoint. Off by
# default. When enabled, the /vikunja route also turns strict and admits only
# the facade callers, so the keyless /vikunja path is closed.
#
# Fail-closed inputs (asserted in tasks/main.yml before the config renders):
# - enabled => callers non-empty, every caller a key of agentgateway_docker_roster_keys,
#   and the Vikunja sidecar enabled with a read token;
# - every target in agentgateway_docker_mcp_targets has an owner in ai_agent_owner
#   or an entry in agentgateway_docker_owner_exceptions.
agentgateway_docker_facade_enabled: false
agentgateway_docker_facade_path: /agents

# Roster agent names allowed to call the facade.
agentgateway_docker_facade_callers: []

# Targets allowed to render without an owner during migration. Each item needs
# a non-empty name, reason and cutover_task. An ownerless target renders with no
# caller auth, so every entry here is a recorded keyless route.
# The published inventory (schema 2.5.0) carries no agents roster, so no target
# has an owner yet. These pre-facade routes keep their current auth until each
# one moves to its specialist owner with a caller-key receipt.
agentgateway_docker_owner_exceptions:
  - name: splunk
    reason: pre-facade route; owner assigned when its specialist lands
    cutover_task: Vikunja 6201
  - name: context7
    reason: pre-facade route; owner assigned when its specialist lands
    cutover_task: Vikunja 6201

# Request headers removed before the facade's backend. Caller credentials never
# reach a backend: each backend holds its own credential. Removal runs after
# apiKey and authorization (see templates/config.yaml.j2, facade route).
agentgateway_docker_caller_credential_headers:
  - authorization
  - proxy-authorization
  - cookie
  - x-agent-key
