---
# =============================================================================
# A2A targets — native Agent2Agent (JSON-RPC) endpoints the gateway fronts on
# the same proxy port. Each gets a prefix-matched route marked `a2a: {}`, so the
# gateway parses the JSON-RPC and rewrites the agent card's `url` to point back
# at itself.
#
# Derived from the published roster: every agent with an `a2a_url` gets
# /a2a/<agent>/. The producer computes that URL from the guest's address and a
# service port, so nothing here names an address. Its host:port is the backend
# and its path is the backend path prefix. Only plain HTTP is accepted, which is
# what the native listeners serve; any other scheme fails the render.
# The backend bearer is the agent's own A2A token: env <AGENT>_A2A_TOKEN, then
# bao_apps_secrets.<agent>_a2a_token (the hermes_agent role reads the same
# names). An agent with no token gets a route with no backend credential.
# =============================================================================
agentgateway_docker_a2a_targets: >-
  {%- set targets = [] -%}
  {%- for name, agent in (ai_agents | default({})) | dictsort -%}
    {%- if agent.a2a_url is defined -%}
      {%- if agent.a2a_url is not match('^http://[^/\\s]+(/\\S*)?$') -%}
        {{ undef('roster agent ' ~ name ~ ' a2a_url must be an http:// URL') }}
      {%- endif -%}
      {%- set key = name | replace('-', '_') -%}
      {%- set token = lookup('env', (key | upper) ~ '_A2A_TOKEN')
          | default((bao_apps_secrets | default({})).get(key ~ '_a2a_token', ''), true) -%}
      {%- set target = {
          'name': name,
          'path_prefix': '/a2a/' ~ name ~ '/',
          'host': agent.a2a_url | regex_replace('^http://([^/]+).*$', '\\1'),
          'backend_path_prefix': agent.a2a_url | regex_replace('^http://[^/]+', '') or '/'} -%}
      {%- if token | length > 0 -%}
        {%- set _ = target.update({'bearer_token': token}) -%}
      {%- endif -%}
      {%- set _ = targets.append(target) -%}
    {%- endif -%}
  {%- endfor -%}
  {{ targets }}
