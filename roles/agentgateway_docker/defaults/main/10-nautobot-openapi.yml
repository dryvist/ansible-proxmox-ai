---
# Native OpenAPI target is opt-in while the GraphQL sidecar remains available.
agentgateway_docker_nautobot_openapi_enabled: false
# Only these GET operations are retained in the OpenAPI schema mounted by the gateway.
agentgateway_docker_nautobot_openapi_operations:
  - dcim_devices_list
  - dcim_devices_retrieve
  - dcim_interfaces_list
  - ipam_ip_addresses_list
  - ipam_ip_addresses_retrieve
  - ipam_prefixes_list
  - ipam_vlans_list
  - virtualization_virtual_machines_list
  - virtualization_virtual_machines_retrieve
  - dcim_racks_list
  - dcim_locations_list
  - circuits_circuits_list
agentgateway_docker_nautobot_openapi_schema_path: /nautobot-openapi.json
agentgateway_docker_nautobot_openapi_schema_file: "{{ agentgateway_docker_data_dir }}/nautobot-openapi.json"
agentgateway_docker_nautobot_openapi_token_path: /nautobot-token
agentgateway_docker_nautobot_openapi_token_file: "{{ agentgateway_docker_data_dir }}/nautobot-token"
agentgateway_docker_nautobot_legacy_env_file: "{{ agentgateway_docker_data_dir }}/nautobot.env"
