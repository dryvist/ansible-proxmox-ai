---
# =============================================================================
# Crawl4AI page-reader MCP — web-page extraction for agents through the
# shared /crawl4ai capability route. The upstream is the Crawl4AI server's own
# MCP SSE endpoint (unclecode/crawl4ai, roles/crawl4ai_docker, port 11235,
# /mcp/sse); no sidecar in this compose stack — the gateway dials the URL
# directly and attaches the upstream bearer token itself, so a caller never
# holds the Crawl4AI credential (facade posture: caller rules + credential
# header stripping before the backend).
#
# Inert-until-inputs: the route renders only when enabled AND both the URL
# and the token are non-empty, so the role converges cleanly before the
# operator points it at a live Crawl4AI guest.
#
# Tool allowlist: route mcpAuthorization admits the single `md` tool (page ->
# markdown); html/screenshot/pdf/execute_js/crawl/ask are denied at the
# gateway and tools/list filters down to `md`. Rendered shape verified
# against the pinned v1.6.0 schema (policies.mcpAuthorization ->
# RuleSet, LocalMcpTarget sse host-as-URI — schema/config.json).
# =============================================================================
agentgateway_docker_crawl4ai_mcp_enabled: false
# Crawl4AI MCP SSE endpoint, e.g. https://crawl4ai.example.com/mcp/sse. A
# deployment input with no vhost default: the Crawl4AI guest's address belongs
# to the deployment, not this role.
agentgateway_docker_crawl4ai_mcp_url: ""
# Bearer token for the upstream /mcp/sse endpoint — the same value
# roles/crawl4ai_docker serves with (crawl4ai_docker_api_token). Never
# printed: the config template task runs no_log. Controller-env fallback
# shape per repo convention; inventory injection may resolve it Bao-first.
agentgateway_docker_crawl4ai_api_token: "{{ lookup('env', 'CRAWL4AI_API_TOKEN') }}"
# Roster callers allowed to use /crawl4ai — the same set the task-tracker
# facade route allows. An unlisted caller is denied; every entry must be a
# key of agentgateway_docker_roster_keys.
agentgateway_docker_crawl4ai_allowed_callers: "{{ agentgateway_docker_facade_callers }}"
