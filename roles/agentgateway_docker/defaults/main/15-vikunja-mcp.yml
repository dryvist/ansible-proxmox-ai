---
# =============================================================================
# Vikunja MCP sidecar — read-only task-board access for EVERY agent (Hermes,
# Claude, Codex) through the shared /vikunja capability route, so the tool is
# wired ONCE at the gateway, not per-agent. The upstream server
# (@democratize-technology/vikunja-mcp) speaks stdio only, so supergateway wraps
# it into Streamable HTTP on the compose network — transport plumbing, same
# posture as the qdrant/docs sidecars. The SIDECAR holds the Vikunja token;
# callers reach /vikunja keyless (same as /memory).
#
# READ-ONLY credential: seed a READ-scoped Vikunja token (a tk_ token from a
# read-only user/scope) — NOT the svc-mcp-rw token. Inert-until-creds: an empty
# token omits both the sidecar service and its route, so the role converges
# cleanly before the operator seeds it (seeding step in the PR body/README).
# =============================================================================
agentgateway_docker_vikunja_mcp_enabled: true
# supergateway = the standard stdio->HTTP shim image (Renovate-tracked).
agentgateway_docker_vikunja_mcp_image: "supercorp/supergateway:4.2.1"
# npm @democratize-technology/vikunja-mcp, launched via npx by supergateway.
agentgateway_docker_vikunja_mcp_version: "0.2.0"
# Compose-network-internal only (supergateway --port); never published, so not
# a tofu pipeline_constant (same as the qdrant/docs sidecar ports).
agentgateway_docker_vikunja_mcp_port: 8002
# supergateway runs stdio->Streamable HTTP --stateful: one vikunja-mcp child
# per MCP session, reaped after this idle timeout. Stateless mode spawns a
# new child for EVERY request, which exhausts the guest's memory.
agentgateway_docker_vikunja_mcp_session_timeout_ms: 300000
# Vikunja instance API base (ends in /api/v1). Override via VIKUNJA_MCP_URL if
# Vikunja is not at this vhost; inert anyway until the read token is seeded.
agentgateway_docker_vikunja_url: >-
  {{ lookup('env', 'VIKUNJA_MCP_URL')
     | default('https://vikunja.' ~ (lookup('env', 'PROXMOX_SUBDOMAIN')
        or undef('PROXMOX_SUBDOMAIN required (Doppler)')) ~ '/api/v1', true) }}
# Bao-first, controller-env fallback — READ-scoped token only. Empty => the
# sidecar and /vikunja route are both omitted.
#
# Field is VIKUNJA_MCP_TOKEN_RO, not VIKUNJA_MCP_TOKEN — ansible-proxmox-apps'
# vikunja role (mcp_token_one.yml) publishes separate RO/RW fields to
# ai/mcp/vikunja (vikunja_service_users: svc-mcp-ro -> VIKUNJA_MCP_TOKEN_RO,
# svc-mcp-rw -> VIKUNJA_MCP_TOKEN_RW), and this route must only ever hold the
# read-scoped one. The bare _TOKEN name never matched either published field,
# so this always resolved empty regardless of whether the secret existed.
agentgateway_docker_vikunja_read_token: >-
  {{ (bao_local_llm_secrets | default({}))['VIKUNJA_MCP_TOKEN_RO']
     | default(lookup('env', 'VIKUNJA_MCP_TOKEN_RO'), true) }}

# Vikunja MCP for the Dify clerk app. This is a separate capability from the
# shared read-only /vikunja route: the service gets its own tasks-scoped API
# token and a second gateway token that Dify presents through the clerk route.
# Both values must be provisioned together at ai/mcp/vikunja; otherwise the
# route is omitted (and a partial pair is refused).
agentgateway_docker_vikunja_clerk_enabled: true
agentgateway_docker_vikunja_clerk_image: >-
  ghcr.io/netadvanced/vikunja-mcp-ng:0.8.0-beta.0@sha256:5b65b7f06ce85e209dd8a2360bfb433588ed0e6bf9b375e97597ed3277daf4ee
agentgateway_docker_vikunja_clerk_port: 8004
agentgateway_docker_vikunja_clerk_secrets_dir: "{{ agentgateway_docker_data_dir }}/vikunja-clerk-secrets"
agentgateway_docker_vikunja_clerk_api_token_file: >-
  {{ agentgateway_docker_vikunja_clerk_secrets_dir }}/vikunja-api-token
agentgateway_docker_vikunja_clerk_http_token_file: >-
  {{ agentgateway_docker_vikunja_clerk_secrets_dir }}/mcp-http-token
agentgateway_docker_vikunja_clerk_config_file: >-
  {{ agentgateway_docker_data_dir }}/vikunja-clerk-config.json
agentgateway_docker_vikunja_clerk_api_token: >-
  {{ (bao_local_llm_secrets | default({})).get('VIKUNJA_MCP_TOKEN_VIKUNJA_CLERK', '') | trim }}
agentgateway_docker_vikunja_clerk_http_token: >-
  {{ (bao_local_llm_secrets | default({})).get('VIKUNJA_MCP_HTTP_TOKEN_VIKUNJA_CLERK', '') | trim }}
agentgateway_docker_vikunja_clerk_allowed_host: >-
  mcp-vikunja-clerk:{{ agentgateway_docker_vikunja_clerk_port }}
