---
# agentgateway Docker deployment.
#
# Installs Docker + Compose on the target LXC (docker_engine meta dependency),
# renders the gateway config from vars (config as code — regenerated every
# converge), and deploys the single agentgateway container via Docker Compose.
# The gateway is stateless: recovery = re-apply the LXC + re-run this role.

- name: Validate that no caller id is in both the roster and the harness registry
  ansible.builtin.assert:
    that:
      - _caller_id_collisions | length == 0
    fail_msg: >-
      Caller ids owned by two sources (agent roster and harness registry):
      {{ _caller_id_collisions | join(', ') }}. Each caller id has exactly one owner.
  vars:
    _caller_id_collisions: "{{ ai_agents | list | intersect(agent_callers_registry | default({}) | list) }}"

# The reader domain is optional in openbao_secrets (roles/openbao_secrets, 11-roster-domains.yml),
# so a skipped domain is absent here rather than an error. Any caller needs it: refuse to
# deploy a gateway that would serve them no keys.
- name: Require the agentgateway-agent-keys domain when gateway callers exist
  ansible.builtin.assert:
    that:
      - "'agentgateway-agent-keys' in (openbao_secrets_by_domain | default({}, true))"
    fail_msg: >-
      OpenBao domain agentgateway-agent-keys was skipped or absent while gateway
      callers exist. Refusing to deploy agentgateway without its reader domain.
  when:
    - (ai_agent_gateway_key_fields | default({}, true)) | length > 0

- name: Validate that every roster agent has a gateway API key
  ansible.builtin.assert:
    that:
      - item.key in (agentgateway_docker_roster_keys | default({}, true))
    fail_msg: "No agentgateway key is available for roster agent {{ item.key }}."
  # Registry callers are exempt: an unseeded leaf leaves the caller keyless, with no bank.
  loop: "{{ ai_agents | default({}, true) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Validate the Hindsight bank ACL inputs
  ansible.builtin.assert:
    that:
      - _hindsight_banks | reject('match', '^[A-Za-z0-9-]+$') | list | length == 0
      - _hindsight_banks | unique | list | length == _hindsight_banks | length
    fail_msg: >-
      Hindsight ACL inputs are invalid: every agent bank id must be unique and
      match ^[A-Za-z0-9-]+$.
  vars:
    _hindsight_banks: "{{ agentgateway_docker_hindsight_agent_banks.values() | list }}"
  when: agentgateway_docker_hindsight_enabled | bool

- name: Report that the Hindsight route is inactive
  ansible.builtin.debug:
    msg: >-
      The /hindsight route is omitted: the Hindsight tenant key
      (bao_apps_secrets.hindsight_api_key) is empty, or no roster agent has a
      gateway key and a trust_tier in the agent roster.
  when:
    - agentgateway_docker_hindsight_enabled | bool
    - agentgateway_docker_hindsight_api_key | length == 0 or agentgateway_docker_hindsight_agent_banks | length == 0

- name: Create agentgateway data directory
  ansible.builtin.file:
    path: "{{ agentgateway_docker_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove the legacy Nautobot env file when its route is inactive
  ansible.builtin.file:
    path: "{{ agentgateway_docker_nautobot_legacy_env_file }}"
    state: absent
  when: >-
    agentgateway_docker_nautobot_openapi_enabled | bool
    or not (agentgateway_docker_nautobot_mcp_enabled | bool)
    or agentgateway_docker_nautobot_read_token | length == 0

- name: Deploy the legacy Nautobot MCP env file
  ansible.builtin.copy:
    content: "NAUTOBOT_READ_TOKEN={{ agentgateway_docker_nautobot_read_token }}"
    dest: "{{ agentgateway_docker_nautobot_legacy_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart agentgateway
  when:
    - not (agentgateway_docker_nautobot_openapi_enabled | bool)
    - agentgateway_docker_nautobot_mcp_enabled | bool
    - agentgateway_docker_nautobot_read_token | length > 0

- name: Remove the native Nautobot token file when its route is inactive
  ansible.builtin.file:
    path: "{{ agentgateway_docker_nautobot_openapi_token_file }}"
    state: absent
  when: >-
    not (agentgateway_docker_nautobot_openapi_enabled | bool)
    or agentgateway_docker_nautobot_read_token | length == 0

- name: Deploy the native Nautobot token file
  ansible.builtin.copy:
    content: "{{ agentgateway_docker_nautobot_read_token }}"
    dest: "{{ agentgateway_docker_nautobot_openapi_token_file }}"
    owner: "65532"
    group: "65532"
    mode: "0400"
  no_log: true
  notify: Restart agentgateway
  when:
    - agentgateway_docker_nautobot_openapi_enabled | bool
    - agentgateway_docker_nautobot_read_token | length > 0

- name: Fetch the Nautobot REST OpenAPI schema
  ansible.builtin.uri:
    url: "{{ agentgateway_docker_nautobot_url }}/api/swagger.json"
    method: GET
    headers:
      Authorization: "Token {{ agentgateway_docker_nautobot_read_token }}"
    return_content: true
    validate_certs: true
    status_code: 200
    timeout: 60
  register: agentgateway_docker_nautobot_openapi_response
  changed_when: false
  # Read-only; a check run needs the live schema to validate operations.
  check_mode: false
  no_log: true
  when:
    - agentgateway_docker_nautobot_openapi_enabled | bool
    - agentgateway_docker_nautobot_read_token | length > 0

- name: Validate the Nautobot OpenAPI allowlist
  ansible.builtin.include_tasks: validate_nautobot_openapi.yml
  when:
    - agentgateway_docker_nautobot_openapi_enabled | bool
    - agentgateway_docker_nautobot_read_token | length > 0

- name: Deploy the filtered Nautobot OpenAPI schema
  ansible.builtin.template:
    src: nautobot-openapi.json.j2
    dest: "{{ agentgateway_docker_nautobot_openapi_schema_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart agentgateway
  when:
    - agentgateway_docker_nautobot_openapi_enabled | bool
    - agentgateway_docker_nautobot_read_token | length > 0

- name: Deploy agentgateway config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ agentgateway_docker_data_dir }}/config.yaml"
    owner: root
    # Roster keys are readable by the gateway's nonroot group only.
    group: "{{ agentgateway_docker_container_gid if agentgateway_docker_roster_keys | length > 0 else 'root' }}"
    mode: "{{ '0640' if agentgateway_docker_roster_keys | length > 0 else '0644' }}"
  no_log: true
  notify: Restart agentgateway

- name: Deploy docs-search MCP server script
  ansible.builtin.copy:
    src: mcp_docs_server.py
    dest: "{{ agentgateway_docker_data_dir }}/mcp_docs_server.py"
    owner: root
    group: root
    mode: "0644"
  notify: Restart agentgateway
  when: agentgateway_docker_docs_mcp_enabled | bool

- name: Deploy Nautobot MCP server script
  ansible.builtin.copy:
    src: mcp_nautobot_server.py
    dest: "{{ agentgateway_docker_data_dir }}/mcp_nautobot_server.py"
    owner: root
    group: root
    mode: "0644"
  notify: Restart agentgateway
  when: agentgateway_docker_nautobot_mcp_enabled | bool

- name: Deploy agentgateway docker-compose template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ agentgateway_docker_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    # 0600: the mcp-docs and mcp-qdrant sidecars' environment embeds the
    # router key, the Qdrant API key, and the Vikunja MCP token.
    mode: "0600"
  no_log: true
  notify: Restart agentgateway

- name: Deploy agentgateway via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ agentgateway_docker_data_dir }}"
    state: present
  register: agentgateway_docker_compose_result
  changed_when: >-
    (agentgateway_docker_compose_result.actions | default([]))
    | selectattr('status', 'in', ['Creating', 'Recreating', 'Pulling', 'Building'])
    | list | length > 0
  no_log: true

# Apply any pending config-change restart before health-checking, so the
# checks validate the NEW config rather than the previous container.
- name: Flush handlers (restart on config change before health check)
  ansible.builtin.meta: flush_handlers

# =============================================================================
# Health check — the image is distroless (no shell), so liveness is verified
# from the LXC, not via an in-container Docker healthcheck.
# =============================================================================

- name: Wait for agentgateway proxy port to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ agentgateway_docker_proxy_port | int }}"
    timeout: 120

- name: Verify agentgateway stats metrics endpoint responds
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ agentgateway_docker_metrics_port }}/metrics"
    method: GET
    status_code: 200
  register: agentgateway_docker_health
  retries: 12
  delay: 5
  until: agentgateway_docker_health.status == 200
  changed_when: false
  when: not ansible_check_mode
