---
# --rm removes the throwaway container when nvidia-smi exits, on success or failure.
- name: Run nvidia-smi in a throwaway container from the pinned sample image
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --name
      - "{{ nvidia_container_toolkit_verify_container_name }}"
      - --runtime=nvidia
      - --gpus
      - all
      - "{{ nvidia_container_toolkit_sample_image }}"
      - nvidia-smi
      - -L
  register: nvidia_container_toolkit_verify
  changed_when: false

- name: Assert the sample container lists at least one GPU
  ansible.builtin.assert:
    that:
      - "'GPU 0:' in nvidia_container_toolkit_verify.stdout"
    fail_msg: >-
      nvidia-smi in the sample container did not list a GPU. Check the NVIDIA
      container toolkit, the Docker NVIDIA runtime and the GPU device nodes in
      this guest.
    quiet: true
