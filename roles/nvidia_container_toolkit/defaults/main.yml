---
# NVIDIA container toolkit from NVIDIA's official apt repository (flat suite).
nvidia_container_toolkit_arch: amd64
nvidia_container_toolkit_repo_uri: "https://nvidia.github.io/libnvidia-container/stable/deb/\
  {{ nvidia_container_toolkit_arch }}"
nvidia_container_toolkit_repo_key_url: https://nvidia.github.io/libnvidia-container/gpgkey

# Pinned package version, installed exactly for the toolkit and its three
# NVIDIA dependencies.
nvidia_container_toolkit_package_version: "1.20.1-1"

# true: the runtime leaves cgroup device access to the container's own configuration.
nvidia_container_toolkit_no_cgroups: true
nvidia_container_toolkit_runtime_config_path: /etc/nvidia-container-runtime/config.toml

nvidia_container_toolkit_cdi_spec_path: /etc/cdi/nvidia.yaml

# Verification image: the image NVIDIA's sample workload runs nvidia-smi from,
# pinned by digest.
nvidia_container_toolkit_sample_image: "ubuntu:24.04@sha256:\
  fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852"
nvidia_container_toolkit_verify_container_name: nvidia-container-toolkit-verify
