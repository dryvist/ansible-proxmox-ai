---
# Use state: present with recreate: always so config-only changes (which
# don't restart unhealthy containers) trigger a full recreate against the
# new compose files. state: restarted only restarts the existing container
# with its old config. Both compose files are named, as in tasks/main.yml.
- name: Restart sim
  community.docker.docker_compose_v2:
    project_src: "{{ sim_docker_data_dir }}"
    files:
      - "{{ sim_docker_compose_file }}"
      - "{{ sim_docker_override_file }}"
    state: present
    recreate: always
  no_log: true
