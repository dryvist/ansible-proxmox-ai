---
- name: Require published collector endpoints
  ansible.builtin.assert:
    that:
      - clickhouse_docker_otelcol_http_port | int > 0
      - clickhouse_docker_otelcol_http_port | int <= 65535
      - clickhouse_docker_otelcol_remote_write_url | length > 0
    fail_msg: Published collector receiver and metrics-store endpoints are required.
  when: clickhouse_docker_otelcol_enabled | bool

- name: Create the Compose project directory
  ansible.builtin.file:
    path: "{{ clickhouse_docker_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the trace metrics collector config
  ansible.builtin.template:
    src: otelcol-config.yml.j2
    dest: "{{ clickhouse_docker_otelcol_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart otel collector
  when: clickhouse_docker_otelcol_enabled | bool
