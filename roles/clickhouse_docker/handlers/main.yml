---
# Use state: present with recreate: always so config-only changes (which don't
# restart healthy containers) trigger a full recreate against the new compose
# file. state: restarted only restarts the existing container with old config.
- name: Restart clickhouse
  community.docker.docker_compose_v2:
    project_src: "{{ clickhouse_docker_data_dir }}"
    state: present
    recreate: always
  no_log: true

- name: Restart otel collector
  community.docker.docker_compose_v2:
    project_src: "{{ clickhouse_docker_data_dir }}"
    services:
      - "{{ clickhouse_docker_otelcol_service }}"
    dependencies: false
    state: present
    recreate: always
  when: clickhouse_docker_otelcol_enabled | bool
