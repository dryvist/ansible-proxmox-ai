---
galaxy_info:
  author: Jacob Evans
  description: >-
    Dedicated ClickHouse server on an LXC container via Docker Compose.
    Serves a Langfuse application database plus read-only access for
    downstream consumers (Grafana, HyperDX, Splunk). The default user is
    locked down — ClickHouse's HTTP interface is unauthenticated by default
    and this guest's firewall scope is broad.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - bookworm
  galaxy_tags:
    - clickhouse
    - datastore
    - observability
    - docker

dependencies:
  # Shared Docker-in-LXC bootstrap (docker-ce + compose plugin, LXC-conditional
  # fuse-overlayfs). No venv: deploys via docker_compose_v2 (CLI).
  - role: docker_engine
    docker_engine_configure_daemon_json: true

collections:
  - community.docker
  - community.general
