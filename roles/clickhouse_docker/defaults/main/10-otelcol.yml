---
# Beta trace-derived metrics, in the existing Compose project.
clickhouse_docker_otelcol_enabled: true
clickhouse_docker_otelcol_image: otel/opentelemetry-collector-contrib:0.165.0
clickhouse_docker_otelcol_service: otel_collector
clickhouse_docker_otelcol_uid: "10001"
clickhouse_docker_otelcol_memory_limit: 512m
clickhouse_docker_otelcol_config: "{{ clickhouse_docker_data_dir }}/otelcol-config.yml"
# Image-standard container port; the published port belongs to tofu constants.
clickhouse_docker_otelcol_http_internal_port: 4318
clickhouse_docker_otelcol_http_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['otel_traces_http']
     | mandatory('tofu_data.constants.service_ports.otel_traces_http missing') }}
# Match the metrics-store address construction used by the trace forwarder.
clickhouse_docker_otelcol_remote_write_url: >-
  http://{{ hostvars['localhost']['tofu_data']['containers']['grafana']['hostname']
     | mandatory('published metrics-store hostname missing') }}.{{
       hostvars['localhost']['tofu_data']['domain']
       | mandatory('tofu_data.domain missing') }}:{{
       hostvars['localhost']['tofu_data']['constants']['service_ports']['victoriametrics']
       | mandatory('tofu_data.constants.service_ports.victoriametrics missing') }}/api/v1/write
