---
# Dedicated ClickHouse server — Docker Compose in its own LXC. It configures
# the application database and read-only access for downstream consumers.
# All literals live here; the template references vars only (DRY).
#
# The OpenTelemetry collector and its OTEL tables are a deliberate follow-up
# — this role deploys the ClickHouse server only.

# =============================================================================
# Container image — pinned exact tag, never a floating minor/major.
# =============================================================================
# ClickHouse stops at 25.12. 26.x is excluded outright — upstream reports
# CORRUPTED_DATA on a 25 -> 26 upgrade. ClickHouse only supports
# one-release-line-at-a-time upgrades across these boundaries, so an older
# deployed line reaches 25.12 by way of 25.8: each hop in
# `clickhouse_docker_upgrade_path` is started and brought healthy in list
# order before the pinned tag is applied (tasks/clickhouse_upgrade.yml). Hops
# at or below the running tag are skipped, so a converged host — or a fresh
# install with nothing running yet — is a no-op.
clickhouse_docker_image_repo: "clickhouse/clickhouse-server"
clickhouse_docker_version: "25.12"
clickhouse_docker_upgrade_path:
  - "25.8"
  - "25.12"
clickhouse_docker_image: >-
  {{ clickhouse_docker_image_repo }}:{{ clickhouse_docker_version }}

clickhouse_docker_container_name: clickhouse
clickhouse_docker_service: clickhouse

# Restart policy applied to the service.
clickhouse_docker_restart_policy: unless-stopped

# =============================================================================
# Persistent state (durable, snapshotted).
# =============================================================================
clickhouse_docker_data_dir: /opt/clickhouse
clickhouse_docker_ch_data_dir: "{{ clickhouse_docker_data_dir }}/data"
clickhouse_docker_ch_logs_dir: "{{ clickhouse_docker_data_dir }}/logs"
clickhouse_docker_users_d_dir: "{{ clickhouse_docker_data_dir }}/users.d"
clickhouse_docker_config_d_dir: "{{ clickhouse_docker_data_dir }}/config.d"
clickhouse_docker_ch_backups_dir: "{{ clickhouse_docker_ch_data_dir }}/backups"
clickhouse_docker_timezone: UTC
clickhouse_docker_log_level: information
clickhouse_docker_system_log_ttl_days: 30
clickhouse_docker_system_log_ttl_tables:
  - text_log
  - query_log
  - trace_log
  - part_log
  - metric_log
  - asynchronous_metric_log

# ClickHouse runs as uid/gid 101 (the image's `clickhouse` user). Because the
# service pins `user: 101:101`, the bind-mounted host dirs must be pre-owned
# by 101 — the root entrypoint chown is bypassed, and an unprivileged LXC
# cannot chown after the fact.
clickhouse_docker_uid: "101"

clickhouse_docker_directories:
  - path: "{{ clickhouse_docker_data_dir }}"
    owner: root
    group: root
  - path: "{{ clickhouse_docker_ch_data_dir }}"
    owner: "{{ clickhouse_docker_uid }}"
    group: "{{ clickhouse_docker_uid }}"
  - path: "{{ clickhouse_docker_ch_backups_dir }}"
    owner: "{{ clickhouse_docker_uid }}"
    group: "{{ clickhouse_docker_uid }}"
    mode: "0750"
  - path: "{{ clickhouse_docker_ch_logs_dir }}"
    owner: "{{ clickhouse_docker_uid }}"
    group: "{{ clickhouse_docker_uid }}"
  - path: "{{ clickhouse_docker_users_d_dir }}"
    owner: "{{ clickhouse_docker_uid }}"
    group: "{{ clickhouse_docker_uid }}"
  - path: "{{ clickhouse_docker_config_d_dir }}"
    owner: root
    group: root

# =============================================================================
# Network — container-internal wire ports (image contracts) and the
# externally-published host ports, pulled from the OpenTofu pipeline_constants
# (DRY: no port literal here). This is a dedicated datastore guest reachable
# from every internal VLAN (matching the pattern used by the other datastore
# guests), so both ports publish on the host rather than staying loopback-only.
# =============================================================================
clickhouse_docker_http_internal_port: 8123
clickhouse_docker_native_internal_port: 9000

_clickhouse_docker_http_port_err: >-
  tofu_data.constants.service_ports.clickhouse_http missing —
  regenerate tofu_inventory.json via
  `tofu output -json ansible_inventory`.
clickhouse_docker_http_port: >-
  {{ hostvars['localhost']['tofu_data']
     ['constants']['service_ports']['clickhouse_http']
     | mandatory(_clickhouse_docker_http_port_err) }}

_clickhouse_docker_native_port_err: >-
  tofu_data.constants.service_ports.clickhouse_native missing —
  regenerate tofu_inventory.json via
  `tofu output -json ansible_inventory`.
clickhouse_docker_native_port: >-
  {{ hostvars['localhost']['tofu_data']
     ['constants']['service_ports']['clickhouse_native']
     | mandatory(_clickhouse_docker_native_port_err) }}

# ToFu publishes this service port when available; 9363 is the role default.
clickhouse_docker_prometheus_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['clickhouse_metrics']
     | default(9363) }}

# The guest's own FQDN, read from the published inventory rather than built
# from parts. `container_ip` is the tofu contract's field for it: DHCP-first
# guests (this one is) carry their resolvable FQDN there (see
# inventory/load_tofu.yml — "DHCP-first guests (tofu contract): `ip` carries
# the FQDN"), so this host's own `container_ip` IS its address, no
# concatenation needed. `ansible_host` is the wrong variable here — it holds
# the NODE's FQDN for guests still on the pct-exec path, not the guest's own.
# Every URL in this role (compose healthcheck, the default-user lockdown
# proof) is built from this variable plus the port variables above — never a
# bare compose service name and never a loopback address; both have been
# found refused for ClickHouse in this estate.
clickhouse_docker_host: >-
  {{ container_ip
     | mandatory('container_ip is empty: the guest is not DHCP-first in the
                  published inventory, so its FQDN cannot be derived') }}
clickhouse_docker_http_endpoint: "http://{{ clickhouse_docker_host }}:{{ clickhouse_docker_http_port }}"

# =============================================================================
# Databases and users
# =============================================================================
# The default user remains disabled independently of the application database.
# The application user comes from the image entrypoint (defined in users.xml,
# full rights, not grantable). Three read-only users cover the downstream
# consumers.
clickhouse_docker_database: default
clickhouse_docker_app_user: langfuse
clickhouse_docker_readonly_users:
  - grafana
  - hyperdx
  - splunk

# LLM conversation store: one database, one table per agent source. Every
# table has the same columns (templates/llm_schema.sql.j2), so a consumer can
# query any source with the same SQL. Tables are created idempotently on every
# converge.
clickhouse_docker_llm_database: llm
clickhouse_docker_llm_tables:
  - claude
  - codex
  - opencode
  - zcode
  - gemini
  - antigravity
  - local_light
  - local_cpu_9b
  - local_gpu
  - local_large
  - local_vllm

# =============================================================================
# Credentials — bao-first, no env fallback. Every value here is secret-valued,
# so it is read ONLY from OpenBao (domain `clickhouse`, KV path ai/clickhouse
# on the secret/ mount — an internal datastore credential, not the
# secrets-external/ mount reserved for internet-reachable services) and never
# falls back to `lookup('env', ...)`.
#
# The `clickhouse` domain remains optional until its AppRole and policy are
# provisioned in ansible-proxmox-apps' roles/openbao. Without its credential,
# `bao_clickhouse_secrets` resolves to an empty dict and mandatory() fails the
# play rather than rendering an empty credential.
clickhouse_docker_app_password: >-
  {{ (bao_clickhouse_secrets | default({})).APP_PASSWORD
     | mandatory('APP_PASSWORD must be set in the environment') }}
clickhouse_docker_grafana_password: >-
  {{ (bao_clickhouse_secrets | default({})).GRAFANA_PASSWORD
     | mandatory('GRAFANA_PASSWORD must be set in the environment') }}
clickhouse_docker_hyperdx_password: >-
  {{ (bao_clickhouse_secrets | default({})).HYPERDX_PASSWORD
     | mandatory('HYPERDX_PASSWORD must be set in the environment') }}
clickhouse_docker_splunk_password: >-
  {{ (bao_clickhouse_secrets | default({})).SPLUNK_PASSWORD
     | mandatory('SPLUNK_PASSWORD must be set in the environment') }}
clickhouse_docker_cribl_password: >-
  {{ (bao_clickhouse_secrets | default({})).CRIBL_PASSWORD
     | mandatory('CRIBL_PASSWORD must be set in the environment') }}

# Ingest user for the LLM database: INSERT only, never SELECT.
clickhouse_docker_cribl_user: cribl

# Read-only user -> password lookup, built from the two lists above so the
# provisioning task loops a single structure instead of three near-duplicate
# tasks.
clickhouse_docker_readonly_credentials:
  grafana: "{{ clickhouse_docker_grafana_password }}"
  hyperdx: "{{ clickhouse_docker_hyperdx_password }}"
  splunk: "{{ clickhouse_docker_splunk_password }}"

# =============================================================================
# Wall feed — word cloud and recent activity for the homelab wall
# =============================================================================
# Two refreshable materialized views (templates/llm_wall.sql.j2) summarise
# the LLM conversation tables for the wall. Two predefined HTTP handlers
# (templates/config.d/wall-handlers.xml.j2) serve them as fixed GET queries
# to the wall_reader user, which reads nothing else. The word cloud has one
# `user` source, built from the role='user' rows of every table below, plus
# one source per table built from that harness's model output.
#
# `content` is the shape of the content column, read from the Cribl pipeline
# that fills the table (ansible-proxmox-apps llm_to_clickhouse_<table>):
#   text   — plain text; the pipeline already joined the message's text parts.
#   blocks — plain text, or a JSON-stringified block list (a single block
#            object is accepted too). Only text blocks count: a typed block
#            counts when its type is 'text', an untyped part (Gemini) when it
#            carries `text` and is not a thought. tool_use, tool_result and
#            thinking blocks never reach the word cloud.
# `output_roles` are the role values the harness writes for model output.
clickhouse_docker_wall_sources:
  - table: claude
    content: blocks
    output_roles: [assistant]
  - table: codex
    content: text
    output_roles: [assistant]
  - table: antigravity
    content: blocks
    output_roles: [assistant, model]
  - table: gemini
    content: blocks
    output_roles: [gemini, model]
  - table: zcode
    content: blocks
    output_roles: [assistant]
  - table: opencode
    content: blocks
    output_roles: [assistant]

clickhouse_docker_wall_words_view: word_cloud
clickhouse_docker_wall_words_refresh: 1 HOUR
clickhouse_docker_wall_words_per_source: 200
clickhouse_docker_wall_word_min_length: 3
clickhouse_docker_wall_word_max_length: 24

clickhouse_docker_wall_recent_view: recent_activity
clickhouse_docker_wall_recent_refresh: 1 MINUTE
clickhouse_docker_wall_recent_rows: 40

clickhouse_docker_wall_words_url: /wall/words
clickhouse_docker_wall_recent_url: /wall/recent

# Text the harness injects into a role='user' row rather than the operator
# typing it. A user text block (or plain-text row) whose start matches one of
# these RE2 patterns is left out of the word cloud: harness wrapper tags
# (<command-name>, <system-reminder>, <environment_context>,
# <user_instructions>), Codex's injected AGENTS.md instructions, and Claude's
# interrupt and local-command markers.
clickhouse_docker_wall_injected_prompt_patterns:
  - '<[a-z_-]+>'
  - '# AGENTS\.md instructions'
  - '\[Request interrupted'
  - 'Caveat: '

# Read-only user for the wall gateway. SELECT on the two views only, and
# these settings as its own fixed user settings (readonly=1 forbids changing
# any of them per query).
clickhouse_docker_wall_reader_user: wall_reader
clickhouse_docker_wall_reader_settings:
  readonly: 1
  max_result_rows: 5000
  max_execution_time: 5
  max_memory_usage: 268435456  # 256 MiB

# Bao-first like every credential above: OpenBao domain `clickhouse`, KV path
# ai/clickhouse-wall. No env fallback.
clickhouse_docker_wall_reader_password: >-
  {{ (bao_clickhouse_secrets | default({})).WALL_READER_PASSWORD
     | mandatory('WALL_READER_PASSWORD must be set in OpenBao') }}

