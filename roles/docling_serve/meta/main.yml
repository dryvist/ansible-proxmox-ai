---
galaxy_info:
  author: Jacob Evans
  description: >-
    docling-serve — document content extraction (PDF/Office -> Markdown with
    layout, table structure and OCR) on an LXC container via Docker Compose.
    Open WebUI's content-extraction engine; born-digital text is extracted
    locally and image pages are OCR'd, with picture description delegated to
    the LiteLLM router's vision model.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - bookworm
  galaxy_tags:
    - ai
    - ocr
    - docling
    - docker

dependencies:
  # Shared Docker-in-LXC bootstrap (docker-ce + compose plugin, LXC-conditional
  # fuse-overlayfs). configure_daemon_json pins the fuse-overlayfs storage
  # driver (required on ZFS-backed LXC).
  - role: docker_engine
    docker_engine_configure_daemon_json: true

collections:
  - community.docker
