---
# A guest can move to this role from another serving unit. That unit holds the
# same port and the card, so it stops before llama-server starts.
- name: Inspect the retired serving units
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop: "{{ llama_cpp_retired_units }}"
  register: llama_cpp_retired_unit_stats

- name: Stop and disable the retired serving units
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ llama_cpp_retired_unit_stats.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Remove the retired serving unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.item }}"
    state: absent
  loop: "{{ llama_cpp_retired_unit_stats.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
