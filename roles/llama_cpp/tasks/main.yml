---
# llama.cpp (llama-server), router mode, on an AMD ROCm/NVIDIA Vulkan/CPU LXC.
# Idempotent. Prereqs (upstream): ansible-proxmox lxc_gpu_features has bound
# /dev/kfd + /dev/dri into this CT (GPU build only). We only need the service
# user to be able to use them.

- name: Install llama.cpp prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - tar
      - gzip
      # OpenMP runtime: the prebuilt llama-server links libgomp.so.1, which
      # the minimal Debian LXC template does not ship.
      - libgomp1
    state: present
    update_cache: true
    cache_valid_time: 3600

# Best-effort ROCm runtime for the container (prebuilt ROCm build links against it).
# Empty by default — a no-op until a validated package list is supplied per host.
- name: Install ROCm runtime packages (GPU build)
  ansible.builtin.apt:
    name: "{{ llama_cpp_rocm_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - llama_cpp_gpu_backend == 'rocm'
    - llama_cpp_rocm_packages | length > 0

# Vulkan loader + the probe used by the visibility gate below.
- name: Install Vulkan runtime packages (vulkan backend)
  ansible.builtin.apt:
    name: "{{ llama_cpp_vulkan_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: llama_cpp_gpu_backend == 'vulkan'

# Model-size guardrails: the absolute llm-fast rule and the per-guest ceiling.
- name: Enforce the model-size guardrails
  ansible.builtin.include_tasks: guards.yml

- name: Create the llama-cpp service group
  ansible.builtin.group:
    name: "{{ llama_cpp_group }}"
    system: true

- name: Create the llama-cpp service user
  ansible.builtin.user:
    name: "{{ llama_cpp_user }}"
    group: "{{ llama_cpp_group }}"
    home: "{{ llama_cpp_data_dir }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: true

- name: Create the install and models directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ llama_cpp_install_dir }}", owner: root, group: root, mode: "0755" }
    - path: "{{ llama_cpp_models_dir }}"
      owner: "{{ llama_cpp_user }}"
      group: "{{ llama_cpp_group }}"
      mode: "0750"

# Device-group resolution plus, on the vulkan backend, the visibility gate that
# stops a silent CPU fallback from shipping as a GPU deployment.
- name: Grant GPU device access and gate the Vulkan backend
  ansible.builtin.include_tasks: gpu_access.yml
  when: llama_cpp_gpu | bool

# --- llama.cpp release (resolve latest, install once) ------------------------
# Presence-guarded: the build tag moves every release, so we install once behind
# the binary's existence and let operators refresh by removing it. The GitHub API
# call only runs on first install, so re-converge does not spend rate limit.
# A binary that exists but cannot resolve its bundled libs (broken/missing
# SONAME symlinks) counts as not installed, so a converge self-heals it.
- name: Check whether the installed llama-server runs
  ansible.builtin.command:
    cmd: "{{ llama_cpp_server_bin }} --version"
  register: llama_cpp_server_check
  changed_when: false
  failed_when: false

- name: Install the llama.cpp release binary
  when: llama_cpp_server_check.rc != 0
  block:
    - name: Resolve recent llama.cpp release metadata
      ansible.builtin.uri:
        url: "{{ llama_cpp_llamacpp_releases_api }}"
        return_content: true
        headers:
          Accept: application/vnd.github+json
      register: llama_cpp_llamacpp_release

    # llama.cpp cuts a release every few hours and CI uploads assets minutes
    # later, so the newest release is routinely asset-less. Scan newest-first
    # across the last few releases and take the first matching asset.
    - name: Select the llama.cpp release asset by name pattern
      ansible.builtin.set_fact:
        llama_cpp_llamacpp_asset_url: >-
          {{ llama_cpp_llamacpp_release.json
             | map(attribute='assets') | flatten
             | selectattr('name', 'match', llama_cpp_llamacpp_asset_regex)
             | map(attribute='browser_download_url') | list
             | first | default('') }}

    - name: Assert a matching llama.cpp asset was found
      ansible.builtin.assert:
        that:
          - llama_cpp_llamacpp_asset_url | length > 0
        fail_msg: >-
          No llama.cpp release asset matched {{ llama_cpp_llamacpp_asset_regex }}
          in {{ llama_cpp_llamacpp_releases_api }} — the asset naming may have changed.

    - name: Create a temporary extraction directory
      ansible.builtin.tempfile:
        state: directory
        suffix: llama-cpp
      register: llama_cpp_extract_tmp

    - name: Download and extract the llama.cpp release tarball
      ansible.builtin.unarchive:
        src: "{{ llama_cpp_llamacpp_asset_url }}"
        dest: "{{ llama_cpp_extract_tmp.path }}"
        remote_src: true

    - name: Locate the extracted llama-server binary
      ansible.builtin.find:
        paths: "{{ llama_cpp_extract_tmp.path }}"
        patterns: llama-server
        file_type: file
        recurse: true
      register: llama_cpp_server_find

    - name: Assert the llama-server binary was found in the archive
      ansible.builtin.assert:
        that:
          - llama_cpp_server_find.matched | int > 0
        fail_msg: "No 'llama-server' binary found in the llama.cpp release archive — the layout may have changed."

    # Flatten the release's bin dir into the install dir so the binary and its
    # bundled .so files share one directory (also LD_LIBRARY_PATH in the unit).
    # cp -a, not ansible.builtin.copy: the release ships SONAME symlinks
    # (libllama-common.so.0 -> libllama-common.so.0.0.NNNN) that copy with
    # remote_src drops, leaving the binary unable to resolve its own libs.
    - name: Install the llama.cpp bin directory contents
      ansible.builtin.command:
        cmd: >-
          cp -a {{ llama_cpp_server_find.files[0].path | dirname }}/.
          {{ llama_cpp_install_dir }}/
      changed_when: true
      notify: Restart llama-server

    - name: Remove the temporary extraction directory
      ansible.builtin.file:
        path: "{{ llama_cpp_extract_tmp.path }}"
        state: absent

# --- Model presence -----------------------------------------------------------
# This guest never downloads model weights: it is told where they are and how
# to load them. The models directory is populated out of band (a read-only
# mount of shared model storage), so a declared GGUF that is not there yet is
# reported and left out of the served set, not fetched and not a failure.
# llama-server's own router mode (--models-dir, below) re-discovers whatever
# is actually present at startup independently — this check exists so a
# missing GGUF is reported clearly at converge time rather than only showing
# up later as an unexplained 404 the first time a caller asks for it.
- name: Check which declared model GGUFs are present
  ansible.builtin.stat:
    path: "{{ llama_cpp_models_dir }}/{{ item.gguf }}"
    get_checksum: false
  loop: "{{ llama_cpp_models }}"
  loop_control:
    label: "{{ item.name }} ({{ item.gguf }})"
  register: llama_cpp_gguf_stat

- name: Serve only the models whose GGUF is present
  ansible.builtin.set_fact:
    llama_cpp_models_present: >-
      {{ llama_cpp_gguf_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}

- name: Report declared models whose GGUF is absent
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }} is declared but {{ llama_cpp_models_dir }}/{{ item.item.gguf }}
      is not present on this guest; llama-server's --models-dir will not
      serve it until the model storage provides it.
  loop: "{{ llama_cpp_gguf_stat.results | rejectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.gguf }})"

# --- Never a local, writable model copy ---------------------------------------
# --models-dir points straight at this mount (the unit below); a converge that
# somehow lands on a plain writable directory instead of the shared read-only
# mount would silently let this guest accumulate its own model copies. Assert
# the mount, don't assume it — the earlier "create the models directory" task
# above would succeed either way, so this is the check that actually notices.
- name: Check the model storage mount options
  ansible.builtin.command:
    cmd: findmnt --noheadings --output OPTIONS --target {{ llama_cpp_models_dir }}
  register: llama_cpp_models_dir_mount
  changed_when: false

- name: Assert the model storage is mounted read-only
  ansible.builtin.assert:
    that:
      - "'ro' in (llama_cpp_models_dir_mount.stdout | trim).split(',')"
    fail_msg: >-
      {{ llama_cpp_models_dir }} is not mounted read-only
      (options: {{ llama_cpp_models_dir_mount.stdout }}). This guest must
      never download or write model weights locally — mount the shared model
      dataset read-only at this path.
    success_msg: "{{ llama_cpp_models_dir }} is a read-only mount."

# --- Service -------------------------------------------------------------------
- name: Deploy the llama-server systemd unit
  ansible.builtin.template:
    src: llama-server.service.j2
    dest: /etc/systemd/system/llama-server.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart llama-server

- name: Enable and start llama-server
  ansible.builtin.systemd:
    name: llama-server
    state: "{{ llama_cpp_service_enabled | ternary('started', 'stopped') }}"
    enabled: "{{ llama_cpp_service_enabled }}"
    daemon_reload: true

- name: Flush handlers so the unit change applies before verification
  ansible.builtin.meta: flush_handlers
  when: llama_cpp_service_enabled

# --- Verify --------------------------------------------------------------------
# Type=simple reports 'active' the instant the process forks; poll until it settles
# so a service that crashes a moment later fails loud here (mirrors roles/agent_exec).
- name: Verify the llama-server service is active
  ansible.builtin.systemd:
    name: llama-server
  register: llama_cpp_service_state
  until: llama_cpp_service_state.status.ActiveState | default('') == 'active'
  retries: 5
  delay: 3
  when: llama_cpp_service_enabled

- name: Verify the llama-server API is listening
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ llama_cpp_api_port }}"
    timeout: 60
  when: llama_cpp_service_enabled
