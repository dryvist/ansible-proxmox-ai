---
# --- GPU device access (clone of roles/ollama; GPU build only) ---------------
# lxc_gpu_features binds the device nodes in with the HOST's group GIDs, which
# rarely match the container's own render/video groups. Instead of forcing GIDs
# (which collides), add the service user to whatever groups actually own the nodes,
# resolved at runtime from the files themselves.
- name: Stat the GPU device nodes to learn their owning groups
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ llama_cpp_gpu_device_nodes }}"
  register: llama_cpp_gpu_dev_stat
  when: llama_cpp_gpu | bool

- name: Assert the GPU device nodes are present (passed in by lxc_gpu_features)
  ansible.builtin.assert:
    that:
      - llama_cpp_gpu_dev_stat.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      One or more GPU device nodes are missing in this container
      ({{ llama_cpp_gpu_device_nodes | join(', ') }}). Run ansible-proxmox
      lxc_gpu_features against this CT first.
  when: llama_cpp_gpu | bool

# --- Vulkan visibility gate ---------------------------------------------------
# Device nodes existing does NOT mean Vulkan can use the card. llama.cpp's
# Vulkan build enumerates devices through the loader and the vendor ICD, and
# when it finds none it does not fail — it serves from the CPU, correctly and
# very slowly. Every cheap signal agrees in that state: the unit is active, the
# port listens, and completions return.
#
# So the fallback is gated here instead, before the service is ever configured:
# vulkaninfo must report at least one physical device. This is the same class of
# check as the >=14B guardrail — cheap at converge, expensive to discover later.
- name: Probe Vulkan device visibility (vulkan backend)
  ansible.builtin.command: vulkaninfo --summary
  register: llama_cpp_vulkaninfo
  changed_when: false
  failed_when: false
  when: llama_cpp_gpu_backend == 'vulkan'

- name: Assert Vulkan can actually see a GPU
  ansible.builtin.assert:
    that:
      - llama_cpp_vulkaninfo.rc == 0
      - "'deviceName' in (llama_cpp_vulkaninfo.stdout | default(''))"
    fail_msg: >-
      vulkaninfo reported no usable Vulkan device (rc={{
      llama_cpp_vulkaninfo.rc | default('n/a') }}). llama.cpp would still start
      and serve — from the CPU, silently — so this is failed here rather than
      shipped. Check that the vendor ICD in /usr/share/vulkan/icd.d matches the
      HOST driver version and that the GPU device nodes above are bound in.
      Output: {{ (llama_cpp_vulkaninfo.stdout | default(''))[:400] }}
      {{ (llama_cpp_vulkaninfo.stderr | default(''))[:200] }}
    success_msg: >-
      Vulkan sees a GPU:
      {{ (llama_cpp_vulkaninfo.stdout | default('')).split('\n')
         | select('search', 'deviceName') | list }}
  when: llama_cpp_gpu_backend == 'vulkan'

- name: Add the llama-cpp user to the GPU device-owning groups
  ansible.builtin.user:
    name: "{{ llama_cpp_user }}"
    groups: "{{ llama_cpp_gpu_dev_stat.results | map(attribute='stat.gr_name') | list | unique }}"
    append: true
  when: llama_cpp_gpu | bool
  notify: Restart llama-swap
