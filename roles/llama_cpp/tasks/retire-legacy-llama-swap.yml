---
- name: Check whether the retired llama-swap unit still exists
  ansible.builtin.stat:
    path: /etc/systemd/system/llama-swap.service
  register: llama_cpp_retired_swap_unit

- name: Stop and disable the retired llama-swap unit
  ansible.builtin.systemd_service:
    name: llama-swap
    state: stopped
    enabled: false
  when: llama_cpp_retired_swap_unit.stat.exists
