---
# Gated on the serve toggle: where the service is deliberately stopped+disabled,
# a config or unit change must not bring it up. "Enable and start llama-server"
# already sets stopped+disabled, but a notified handler runs AFTER that task, and
# `state: restarted` starts a disabled unit (disabled only suppresses autostart).
# Handlers must be top-level tasks to be notifiable — a block's name is never
# registered as a handler name — so the gate lives on each `listen:` member.
# daemon_reload is not lost: that same task reloads unconditionally.
- name: Read service state before restart
  listen: Restart llama-server
  when: llama_cpp_service_enabled
  # A failure before unit deployment still flushes queued notifications.
  ansible.builtin.service_facts:

- name: Restart llama-server when it is serving
  listen: Restart llama-server
  when:
    - llama_cpp_service_enabled
    - ansible_facts.services.get('llama-server.service', {}).get('state', '') == 'running'
  ansible.builtin.systemd:
    name: llama-server
    state: restarted
    daemon_reload: true
