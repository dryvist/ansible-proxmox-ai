---
# Gated on the serve toggle: where the service is deliberately stopped+disabled,
# a config or unit change must not bring it up. "Enable and start llama-swap"
# already sets stopped+disabled, but a notified handler runs AFTER that task, and
# `state: restarted` starts a disabled unit (disabled only suppresses autostart).
# Ungated, editing the template was enough to serve on a host set never to serve.
# daemon_reload is not lost: that same task reloads unconditionally.
- name: Restart llama-swap
  ansible.builtin.systemd:
    name: llama-swap
    state: restarted
    daemon_reload: true
  when: llama_cpp_service_enabled
