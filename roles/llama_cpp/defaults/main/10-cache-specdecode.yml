---
# Split out of defaults/main/00-core.yml to keep both files under the repo's
# per-file token budget (.token-limits.yaml). Load order among defaults/main
# files does not matter.

# --- KV-cache reuse ------------------------------------------------------------
# Repeat requests from the SAME caller should land on a warm cache instead of
# a cold reload — this is what the 4080's per-caller session lock
# (ansible-proxmox-ai's llm_router role, roles/llm_router/defaults/main/
# 57-subagent-lock.yml) exists to make possible: holding the lock across
# several requests is worthless if every request still pays a cold prompt.
#
# --cache-prompt is deliberately NOT rendered here. UNVERIFIED against the
# resolved release (no live host access this PR) — llama.cpp's server has
# kept per-slot prompt-prefix reuse on by default for a long time, and adding
# the flag would be a redundant no-op if that still holds. Confirm with
# `llama-server --help` on the resolved release before adding it back; if it
# proves to still be a real opt-in there, add
# `{{ ('--cache-prompt' if llama_cpp_cache_prompt | bool else '') }}`
# to templates/llama-server.service.j2's ExecStart rather than forcing it on
# unconditionally.
#
# 256: llama.cpp's own long-documented default minimum chunk size for
# cache-shift reuse — small enough to catch a repeated system-prompt/tool-
# schema prefix, large enough that the reuse scan is not itself the cost.
# Re-measure once benchmarking exercises a real workload.
llama_cpp_cache_reuse: 256

# Unset renders NO flag at all — same sentinel idiom as llama_cpp_parallel
# (00-core.yml). UNVERIFIED spellings/semantics this PR (task named
# `--cache-ram` aka `-cram` and `--cache-idle-slots`); confirm against
# `llama-server --help` on the resolved release before setting either on any
# host.
llama_cpp_cache_ram: ~
llama_cpp_cache_idle_slots: false

# -sps/--slot-prompt-similarity is deliberately untouched anywhere in this
# role — no concrete reason to move it off the resolved release's own
# default; do not add a variable for it without one.

# --- Speculative decoding (optional, PATH ONLY) --------------------------------
# TODO(benchmarking): draft/target model choice comes from a separate
# mlx-benchmarks sweep in a different repo/PR, not this one. This wires the
# CONFIG PATH only — every llama_cpp_models entry renders no spec-decode
# flags at all until its own `spec_draft_model` field is set (see
# 00-core.yml's llama_cpp_models list for the field shape).
#
# UNVERIFIED against the resolved release (no live host access this PR): the
# task named `--spec-draft-model` (aka `-md`/`--model-draft`),
# `--spec-draft-n-max`/`--spec-draft-n-min`, and `--spec-type`
# (draft-simple/draft-eagle3/draft-mtp). Confirm all four spellings against
# `llama-server --help` before setting spec_draft_model on any model entry.
llama_cpp_spec_draft_n_max_default: 16
llama_cpp_spec_draft_n_min_default: 5
