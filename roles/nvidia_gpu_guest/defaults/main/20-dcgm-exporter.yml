---
# Tested upstream pair for the native DCGM exporter package service.
# renovate: datasource=github-releases depName=NVIDIA/DCGM
nvidia_gpu_guest_dcgm_version: "4.6.1"
# renovate: datasource=github-releases depName=NVIDIA/dcgm-exporter
nvidia_gpu_guest_dcgm_exporter_version: "4.8.4"
# shortcut: NVIDIA's debian13 repo publishes no datacenter-gpu-manager-exporter, so Debian 13 guests install this one
# file from the debian12 pool. Refresh the filename and sha256 (read from that repo's Packages.gz) whenever
# nvidia_gpu_guest_dcgm_exporter_version changes; the checksum is not renovate-managed.
nvidia_gpu_guest_dcgm_exporter_deb12_filename: datacenter-gpu-manager-exporter_4.8.4.3955-1_amd64.deb
nvidia_gpu_guest_dcgm_exporter_deb12_url: >-
  {{ 'https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64/'
     ~ nvidia_gpu_guest_dcgm_exporter_deb12_filename }}
nvidia_gpu_guest_dcgm_exporter_deb12_sha256: 57dc4cf2cb27994cadc7097985fc33a2f77c894d767a891bb67a25d6e657507e

nvidia_gpu_guest_dcgm_packages:
  - >-
    {{ 'datacenter-gpu-manager-4-cuda'
       ~ nvidia_gpu_guest_cuda_version.split('.')[0]
       ~ '=1:' ~ nvidia_gpu_guest_dcgm_version ~ '*' }}
  - "datacenter-gpu-manager-exporter={{ nvidia_gpu_guest_dcgm_exporter_version }}*"
# The CUDA package depends on an exact core version; apt keeps an installed core at another version unless it is named.
nvidia_gpu_guest_dcgm_core_package: "datacenter-gpu-manager-4-core=1:{{ nvidia_gpu_guest_dcgm_version }}*"
nvidia_gpu_guest_dcgm_collector_csv_path: /etc/dcgm-exporter/default-counters.csv
nvidia_gpu_guest_dcgm_exporter_dropin_path: /etc/systemd/system/nvidia-dcgm-exporter.service.d/override.conf
