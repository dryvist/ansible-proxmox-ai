---
# Engine roles own their profile data. These shared aliases let the common
# inventory, artifact, and cache tasks consume the active role's profile set.
nvidia_gpu_guest_engine: >-
  {{ vllm_serving_engine
     | default(llamacpp_serving_engine | default('', true), true) }}
nvidia_gpu_guest_profiles: >-
  {{ vllm_serving_profiles
     | default(llamacpp_serving_profiles | default({}, true), true) }}
nvidia_gpu_guest_active_profile: >-
  {{ vllm_serving_active_profile
     | default(llamacpp_serving_active_profile | default('', true), true) }}
nvidia_gpu_guest_cache_sync_artifact_id: >-
  {{ vllm_serving_cache_sync_artifact_id
     | default(llamacpp_serving_cache_sync_artifact_id | default('', true), true) }}
nvidia_gpu_guest_cache_sync_notify_service: >-
  {{ vllm_serving_cache_sync_notify_service
     | default(llamacpp_serving_cache_sync_notify_service | default(false, true), true) | bool }}
