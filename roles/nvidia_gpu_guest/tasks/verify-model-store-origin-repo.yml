---
- name: Resolve registered artifacts for the selected model-store repository
  ansible.builtin.set_fact:
    nvidia_gpu_guest_model_store_verify_artifacts: >-
      {{ nvidia_gpu_guest_model_artifacts
         | selectattr('model_store', 'defined')
         | selectattr('model_store', 'equalto', true)
         | selectattr('hf_repo', 'equalto', nvidia_gpu_guest_model_store_verify_repo)
         | list }}

- name: Resolve the pinned revision and include globs for the selected repository
  ansible.builtin.set_fact:
    nvidia_gpu_guest_model_store_verify_artifact: >-
      {{ nvidia_gpu_guest_model_store_verify_artifacts | first | default({}) }}
    nvidia_gpu_guest_model_store_verify_globs: >-
      {{ nvidia_gpu_guest_model_store_verify_artifacts
         | map(attribute='include_globs') | flatten | unique | list }}

- name: Require a pinned registered artifact for the selected model-store repository
  ansible.builtin.assert:
    that:
      - nvidia_gpu_guest_model_store_verify_artifacts | length > 0
      - nvidia_gpu_guest_model_store_verify_artifact.revision is match('^[0-9a-f]{40}$')
      - (nvidia_gpu_guest_model_store_verify_artifacts | map(attribute='revision') | unique | list | length) == 1
      - nvidia_gpu_guest_model_store_verify_globs | length > 0
    fail_msg: "The selected model-store repository must resolve to a pinned registry artifact."
    quiet: true

- name: Verify pinned model-store files against download sidecars
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/files/verify-local-model-store.py
      --root {{ (nvidia_gpu_guest_model_origin_mount_path ~ '/' ~ nvidia_gpu_guest_model_store_verify_repo) | quote }}
      --revision {{ nvidia_gpu_guest_model_store_verify_artifact.revision | quote }}
      --include-globs {{ nvidia_gpu_guest_model_store_verify_globs | to_json | quote }}
  become: true
  become_user: "{{ nvidia_gpu_guest_user }}"
  changed_when: false
