---
# Userspace only: match the host's NVIDIA kernel module version.
# The guest loads no kernel module, so no module or DKMS package is installed.
- name: Assert the guest is a Debian release the vendor repository serves
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
    fail_msg: The NVIDIA userspace install supports Debian guests only.
    quiet: true

- name: Read the host NVIDIA module version from procfs
  ansible.builtin.slurp:
    src: /proc/driver/nvidia/version
  register: nvidia_gpu_guest_host_module_version
  failed_when: false

- name: Assert the host NVIDIA module version is readable
  ansible.builtin.assert:
    that:
      - "'content' in (nvidia_gpu_guest_host_module_version | default({}))"
    fail_msg: >-
      Cannot read /proc/driver/nvidia/version inside this NVIDIA guest; the
      host module version is required to install matching NVIDIA userspace.
    quiet: true

- name: Parse the host NVIDIA module version
  ansible.builtin.set_fact:
    nvidia_gpu_guest_nvidia_userspace_version: >-
      {{ (nvidia_gpu_guest_host_module_version.content | b64decode
          | regex_search('[0-9]+[.][0-9]+[.][0-9]+')) | default('', true) }}

- name: Assert the host NVIDIA module version is parseable
  ansible.builtin.assert:
    that:
      - nvidia_gpu_guest_nvidia_userspace_version | length > 0
    fail_msg: >-
      Could not parse an NVIDIA driver version from
      /proc/driver/nvidia/version; expected a version in N.N.N form.
    quiet: true

- name: Add the NVIDIA apt repository
  ansible.builtin.deb822_repository:
    name: nvidia-cuda
    types: deb
    uris: "{{ nvidia_gpu_guest_nvidia_repo_uri | trim }}"
    suites: /
    signed_by: "{{ nvidia_gpu_guest_nvidia_repo_key_url }}"
    enabled: true
    state: present
  register: nvidia_gpu_guest_nvidia_repo
  environment: "{{ llamacpp_release_proxy_environment }}"

- name: Install the apt pin for the host driver version
  ansible.builtin.apt:
    name: "nvidia-driver-pinning-{{ nvidia_gpu_guest_nvidia_userspace_version }}"
    state: present
    update_cache: true
  environment: "{{ llamacpp_release_proxy_environment }}"

# Packages from one driver release (N.N.N with a 3-digit major) move files
# between each other, so a partial downgrade fails in dpkg. Every installed
# package at another driver version goes into the same transaction as the
# required set.
- name: List installed NVIDIA packages at another driver version
  ansible.builtin.shell: >-
    set -o pipefail;
    dpkg-query -W -f='${db:Status-Abbrev} ${Package} ${Version}\n'
    | awk -v want='{{ nvidia_gpu_guest_nvidia_userspace_version }}-'
    '$1 == "ii" && $2 ~ /nvidia|libcuda|libnv/
    && $3 ~ /^[0-9][0-9][0-9][.][0-9]+[.][0-9]+-/ && index($3, want) != 1 {print $2}'
  args:
    executable: /bin/bash
  register: nvidia_gpu_guest_stale_nvidia_packages
  changed_when: false
  # Read-only; a check run needs the live value to preview package replacement.
  check_mode: false

- name: Install CUDA, nvidia-smi, and Vulkan userspace at the host version
  ansible.builtin.apt:
    name: >-
      {{ (['nvidia-vulkan-icd', 'libcuda1', 'nvidia-driver-cuda']
          + nvidia_gpu_guest_stale_nvidia_packages.stdout_lines)
         | unique
         | map('regex_replace', '$', '=' ~ nvidia_gpu_guest_nvidia_userspace_version ~ '-*')
         | list }}
    state: present
    install_recommends: false
    allow_downgrade: true
  environment: "{{ llamacpp_release_proxy_environment }}"
