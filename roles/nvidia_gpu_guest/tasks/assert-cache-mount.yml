---
# The writable model cache must already be a directory. Every task file that
# creates or changes a path under it includes this file before its first such
# task, so an empty or unmounted path fails before anything is written.
- name: Require a declared writable model cache mount path
  ansible.builtin.assert:
    that:
      - nvidia_gpu_guest_model_cache_mount_path | length > 0
    fail_msg: >-
      The writable local cache mount path must be declared by the target
      inventory before any model-store path is created.
    quiet: true

- name: Inspect the writable model cache mount
  ansible.builtin.stat:
    path: "{{ nvidia_gpu_guest_model_cache_mount_path }}"
  register: nvidia_gpu_guest_cache_mount_stat

- name: Assert the writable model cache mount exists as a directory
  ansible.builtin.assert:
    that:
      - nvidia_gpu_guest_cache_mount_stat.stat.exists
      - nvidia_gpu_guest_cache_mount_stat.stat.isdir
    fail_msg: >-
      The writable local cache at {{ nvidia_gpu_guest_model_cache_mount_path }}
      must already exist as a directory before any model-store path is created.
    quiet: true
