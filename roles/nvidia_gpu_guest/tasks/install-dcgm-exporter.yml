---
- name: Install the compatible pinned DCGM and exporter packages
  ansible.builtin.apt:
    name: "{{ nvidia_gpu_guest_dcgm_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
    allow_downgrade: true
    # The package units start only after our collector file and systemd override exist.
    policy_rc_d: 101
  environment: "{{ llamacpp_release_proxy_environment }}"
  when:
    - not (ansible_check_mode and (nvidia_gpu_guest_nvidia_repo | default({})).changed | default(false))
    - ansible_facts['distribution'] != 'Debian' or ansible_facts['distribution_major_version'] | int < 13

# Debian 13's repo has the DCGM core but not the exporter. The core comes from the same repo as today; the exporter
# is one file from the Debian 12 pool, checksum-pinned in defaults, installed as a local package.
- name: Install the DCGM core package on Debian 13
  ansible.builtin.apt:
    name:
      - "{{ nvidia_gpu_guest_dcgm_core_package }}"
      - "{{ nvidia_gpu_guest_dcgm_packages[0] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
    allow_downgrade: true
    policy_rc_d: 101
  environment: "{{ llamacpp_release_proxy_environment }}"
  when:
    - not (ansible_check_mode and (nvidia_gpu_guest_nvidia_repo | default({})).changed | default(false))
    - ansible_facts['distribution'] == 'Debian'
    - ansible_facts['distribution_major_version'] | int >= 13

- name: Download the pinned Debian 12 DCGM exporter package
  ansible.builtin.get_url:
    url: "{{ nvidia_gpu_guest_dcgm_exporter_deb12_url }}"
    dest: "/var/tmp/{{ nvidia_gpu_guest_dcgm_exporter_deb12_filename }}"
    checksum: "sha256:{{ nvidia_gpu_guest_dcgm_exporter_deb12_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  environment: "{{ llamacpp_release_proxy_environment }}"
  when:
    - not ansible_check_mode
    - ansible_facts['distribution'] == 'Debian'
    - ansible_facts['distribution_major_version'] | int >= 13

- name: Install the pinned Debian 12 DCGM exporter package on Debian 13
  ansible.builtin.apt:
    deb: "/var/tmp/{{ nvidia_gpu_guest_dcgm_exporter_deb12_filename }}"
    state: present
    install_recommends: false
    # The package units start only after our collector file and systemd override exist.
    policy_rc_d: 101
  environment: "{{ llamacpp_release_proxy_environment }}"
  # Check mode does not download the file, so there is nothing to install yet.
  when:
    - not ansible_check_mode
    - ansible_facts['distribution'] == 'Debian'
    - ansible_facts['distribution_major_version'] | int >= 13

- name: Create the DCGM exporter configuration directory
  ansible.builtin.file:
    path: "{{ nvidia_gpu_guest_dcgm_collector_csv_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the upstream default counters with fan speed enabled
  ansible.builtin.copy:
    src: dcgm-exporter-counters.csv
    dest: "{{ nvidia_gpu_guest_dcgm_collector_csv_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart DCGM exporter

- name: Create the DCGM exporter drop-in directory
  ansible.builtin.file:
    path: "{{ nvidia_gpu_guest_dcgm_exporter_dropin_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the DCGM exporter collector override
  ansible.builtin.copy:
    dest: "{{ nvidia_gpu_guest_dcgm_exporter_dropin_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/dcgm-exporter --collectors {{ nvidia_gpu_guest_dcgm_collector_csv_path }}
  notify: Restart DCGM exporter

- name: Enable and start the DCGM host engine
  ansible.builtin.systemd:
    name: nvidia-dcgm.service
    enabled: true
    state: started

- name: Enable and start the DCGM exporter
  ansible.builtin.systemd:
    name: nvidia-dcgm-exporter.service
    daemon_reload: true
    enabled: true
    state: started
