---
- name: Require the registry primary local model in the authenticated router catalog
  ansible.builtin.assert:
    that:
      - next_ai_drawio_docker_default_model in
        (next_ai_drawio_docker_models.json.data | default([]) | map(attribute='id') | list)
    fail_msg: >-
      The registry primary local model is not in the authenticated LiteLLM
      /v1/models catalog.
    quiet: true
  no_log: true

- name: Order the authenticated chat model menu with the registry default first
  ansible.builtin.set_fact:
    next_ai_drawio_docker_chat_model_ids: >-
      {{ ([next_ai_drawio_docker_default_model]
          + (next_ai_drawio_docker_models.json.data | default([])
             | map(attribute='id') | reject('equalto', next_ai_drawio_docker_default_model) | list))
         | unique | list }}
    next_ai_drawio_docker_model_menu: >-
      {{ ([next_ai_drawio_docker_default_model]
          + (next_ai_drawio_docker_models.json.data | default([])
             | map(attribute='id') | reject('equalto', next_ai_drawio_docker_default_model) | list))
         | unique | join(',') }}
  no_log: true
