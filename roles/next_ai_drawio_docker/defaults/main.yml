---
# Next AI Draw.io web UI plus its isolated MCP sidecar.
next_ai_drawio_docker_web_image: >-
  ghcr.io/dayuanjiang/next-ai-draw-io:0.5.1@sha256:e393f1d4d208c523716ce7455cf6f774a1d9b90fe551adae6691afd4e390141b
next_ai_drawio_docker_mcp_image: next-ai-drawio-mcp:4.2.2-0.4.15
next_ai_drawio_docker_mcp_base_image: >-
  ghcr.io/supercorp-ai/supergateway:4.2.2@sha256:5fd78fb79ffce27812313e5da9b3b3d0bc034267e131961f1140f4a4e0179d3a
next_ai_drawio_docker_mcp_package: '@next-ai-drawio/mcp-server@0.4.15'
next_ai_drawio_docker_mcp_bin: /opt/next-ai-drawio-mcp/bin/next-ai-drawio-mcp
next_ai_drawio_docker_data_dir: /opt/next-ai-drawio
next_ai_drawio_docker_web_service: next-ai-drawio
next_ai_drawio_docker_mcp_service: next-ai-drawio-mcp
next_ai_drawio_docker_restart_policy: unless-stopped
next_ai_drawio_docker_listen_host: 0.0.0.0
next_ai_drawio_docker_web_internal_port: 3000
next_ai_drawio_docker_mcp_path: /mcp
next_ai_drawio_docker_default_model: "{{ llm_router_primary_model }}"
next_ai_drawio_docker_model_menu: "{{ next_ai_drawio_docker_default_model }}"
next_ai_drawio_docker_llm_base_url: "{{ ai_orchestration_ollama_base_url }}"
next_ai_drawio_docker_llm_api_key: >-
  {{ (bao_apps_secrets | default({})).get('next_ai_drawio_llm_router_key', '') }}

# Published listeners are owned by tofu-proxmox. Never duplicate their values
# here; a stale inventory artifact fails with a useful message.
_next_ai_drawio_docker_web_port_error: >-
  tofu_data.constants.service_ports.next_ai_drawio_web missing; republish the
  tofu-proxmox ansible_inventory output.
next_ai_drawio_docker_web_port: >-
  {{ hostvars['localhost'].tofu_data.constants.service_ports.next_ai_drawio_web
     | mandatory(_next_ai_drawio_docker_web_port_error) }}
_next_ai_drawio_docker_mcp_port_error: >-
  tofu_data.constants.service_ports.next_ai_drawio_mcp missing; republish the
  tofu-proxmox ansible_inventory output.
next_ai_drawio_docker_mcp_port: >-
  {{ hostvars['localhost'].tofu_data.constants.service_ports.next_ai_drawio_mcp
     | mandatory(_next_ai_drawio_docker_mcp_port_error) }}
