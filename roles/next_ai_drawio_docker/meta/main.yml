---
galaxy_info:
  author: Jacob Evans
  description: >-
    Next AI Draw.io web UI with an isolated Streamable HTTP MCP sidecar,
    connected to the shared LiteLLM router.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - bookworm
  galaxy_tags:
    - ai
    - drawio
    - mcp
    - docker

dependencies:
  - role: docker_engine
    docker_engine_configure_daemon_json: false

collections:
  - community.docker
