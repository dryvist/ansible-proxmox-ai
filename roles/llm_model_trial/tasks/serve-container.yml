---
- name: Bind the controller's validated plan to the candidate guest
  ansible.builtin.include_tasks: prepare.yml

- name: Record the beginning of this candidate run for bounded failure evidence
  ansible.builtin.command:
    argv: [date, -u, "+%Y-%m-%dT%H:%M:%SZ"]
  register: llm_model_trial_started_at
  changed_when: false

- name: Run the candidate container trial and preserve failure evidence
  block:
    - name: Serve the candidate container on the target guest
      ansible.builtin.include_tasks: acquire-and-serve-container.yml
  rescue:
    - name: Save bounded candidate failure evidence
      ansible.builtin.include_tasks: failure-evidence.yml
  always:
    - name: Stop and unlink the candidate container unit
      ansible.builtin.include_tasks: restore-candidate.yml
