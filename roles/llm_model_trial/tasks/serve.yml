---
- name: Require the fixed target and bind the candidate plan before any trial change
  ansible.builtin.include_tasks: prepare.yml

- name: Run the isolated candidate trial and preserve failure evidence
  block:
    - name: Hold the candidate under the trial lock
      ansible.builtin.include_tasks: hold.yml
  rescue:
    - name: Save bounded candidate failure evidence
      ansible.builtin.include_tasks: failure-evidence.yml
  always:
    - name: Restore the baseline and release the trial lock
      ansible.builtin.include_tasks: release.yml
