---
- name: Locate the model policy in the installed homelab collection
  ansible.builtin.set_fact:
    _llm_model_trial_policy_files: >-
      {{ query('ansible.builtin.first_found', {
           'files': ['ansible_collections/dryvist/homelab/roles/llm_model_catalog/files/model-policy.json'],
           'paths': lookup('ansible.builtin.config', 'COLLECTIONS_PATHS'),
           'skip': true}) }}

- name: Load the shared model policy or the explicit role input
  ansible.builtin.set_fact:
    llm_model_trial_policy_data: >-
      {{ ((lookup('ansible.builtin.file', _llm_model_trial_policy_files[0]) | from_json)
          | combine({'_dossier_root': _llm_model_trial_policy_files[0]
                     | dirname | dirname | dirname | dirname}))
         if llm_model_trial_policy | length == 0 and _llm_model_trial_policy_files | length > 0
         else llm_model_trial_policy | combine({'_dossier_root': llm_model_trial_policy_root
               or llm_model_trial_policy.get('_dossier_root', '')}) }}
