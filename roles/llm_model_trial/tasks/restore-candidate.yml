---
- name: Stop the run-scoped candidate unit before restoring the baseline
  ansible.builtin.systemd:
    name: "{{ llm_model_trial_unit_name }}"
    state: stopped
  register: llm_model_trial_stop_result
  failed_when: false

- name: Verify the candidate unit is no longer active
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ llm_model_trial_unit_name }}"]
  register: llm_model_trial_candidate_state
  changed_when: false
  failed_when: false

- name: Remove the run-scoped candidate unit file
  ansible.builtin.file:
    path: "{{ llm_gpu_serving_systemd_dir }}/{{ llm_model_trial_unit_name }}"
    state: absent
  register: llm_model_trial_unit_remove
  failed_when: false

- name: Reload systemd after removing the run-scoped candidate unit
  ansible.builtin.systemd:
    daemon_reload: true
  register: llm_model_trial_daemon_reload
  failed_when: false
