---
llm_model_trial_trusted_authors:
  - nvidia
  - unsloth
  - bartowski
  - ista-daslab
  - mlx-community
  - lmstudio-community
llm_model_trial_minimum_likes: 100
llm_model_trial_minimum_downloads: 10000
llm_model_trial_gguf_minimum_bits: 3
llm_model_trial_engine_rules_version: 1
llm_model_trial_host: "6000"
llm_model_trial_inventory_group: llm_gpu_group
llm_model_trial_port: 10435
llm_model_trial_engine_rules:
  - format: safetensors
    quantization: modelopt_nvfp4
    architecture: qwen3_5
    mtp_head: true
    engine: vllm
    default_context: 65536
    maximum_context: 262144
    maximum_slots: 8
    flags:
      gpu_memory_utilization: "0.85"
      kv_cache_dtype: fp8
      linear_backend: b12x
      moe_backend: auto
      prefix_caching: true
      quantization: modelopt
      reasoning_parser: qwen3
      speculative_config:
        method: mtp
        num_speculative_tokens: 3
  - format: safetensors
    quantization: modelopt_nvfp4
    architecture: qwen3_5
    mtp_head: false
    engine: vllm
    default_context: 65536
    maximum_context: 262144
    maximum_slots: 8
    flags:
      gpu_memory_utilization: "0.85"
      kv_cache_dtype: fp8
      linear_backend: b12x
      moe_backend: auto
      prefix_caching: true
      quantization: modelopt
      reasoning_parser: qwen3
  - format: gguf
    quantization: "*"
    architecture: qwen4exp
    mtp_head: true
    engine: llama_cpp
    default_context: 32768
    maximum_context: 262144
    maximum_slots: 8
    flags:
      flash_attention: true
      gpu_layers: 99
      jinja: true
      metrics: true
  - format: gguf
    quantization: "*"
    architecture: qwen4exp
    mtp_head: false
    engine: llama_cpp
    default_context: 32768
    maximum_context: 262144
    maximum_slots: 8
    flags:
      flash_attention: true
      gpu_layers: 99
      jinja: true
      metrics: true
