---
# Container trial mode. Empty image = the existing single-host vLLM/llama.cpp flow.
# The image must be a digest-pinned OCI reference; validation lives in
# filter_plugins/model_trial_container.py (llm_model_trial_validate_container).
llm_model_trial_container_image: ""
# Container environment: values must not look like secrets (see redact regex).
llm_model_trial_container_env: {}
# vllm serve arguments appended after the model directory.
llm_model_trial_container_args: []
# Inventory group, or one inventory host name, of the guest that runs the candidate. Defaults to the baseline group.
llm_model_trial_target_group: "{{ llm_model_trial_inventory_group }}"
# Safety-net window: the baseline timer restarts the baseline this many minutes after it stops.
llm_model_trial_window_minutes: 60
# Optional fallback endpoint probed for HTTP 200 on /v1/models before the baseline stops. Empty = skip.
llm_model_trial_fallback_probe_url: ""
