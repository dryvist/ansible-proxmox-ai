---
llm_model_trial_requested_engine: "{{ engine | default('auto') }}"
llm_model_trial_requested_context: "{{ context | default(none) }}"
llm_model_trial_requested_slots: "{{ slots | default(none) }}"
llm_model_trial_artifact_dir: /tmp/llm-model-trials
llm_model_trial_lock_path: /run/lock/llm-model-trial-6000.lock
llm_model_trial_lock_timeout_seconds: 7200
llm_model_trial_health_retries: 180
llm_model_trial_health_delay: 5
llm_model_trial_journal_max_lines: 5000
llm_model_trial_redact_regex: '(?i)(bearer\s+|api[-_]?key[=\s:]+|token[=\s:]+|\bhf_|\bsk-)[A-Za-z0-9._~+/=-]+'
