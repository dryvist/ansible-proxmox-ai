---
# fabric_watchdog: probe script + oneshot service + timer. State lives in
# fabric_watchdog_state_dir so alerts fire only on up/down transitions.

# Registry-derived reachability targets: catches an advertised (servable:
# true) serving path whose backend has been switched off entirely elsewhere —
# the converge-time registry assert (llm_router/tasks/assert.yml) only checks
# that the registry is internally consistent, not that a path it advertises
# is still there. Loaded the SAME way the llm_router converge does (see that
# role's registry.yml) — include_role also pulls in llm_router's base-url
# defaults below, so no URL is reconstructed by hand here.
- name: Load the fabric model registry
  ansible.builtin.include_role:
    name: llm_router
    tasks_from: registry.yml
    # Without public, include_role exposes llm_router's defaults only to the
    # included tasks — the base-url lookups below then fail undefined on any
    # host that never runs llm_router itself.
    public: true

- name: Derive the distinct advertised serving tiers
  ansible.builtin.set_fact:
    fabric_watchdog_registry_tiers: >-
      {{ llm_router_model_registry
         | selectattr('servable', 'defined') | selectattr('servable')
         | map(attribute='tier') | unique | list }}

# Maps each tier to its base URL. Deliberately a small, explicit table, not
# itself derived: llm-models.yml is pure data with NO host/port/URL literals
# by design (its own header comment) — those live in the role, selected
# symbolically by tier. A tier missing from this table fails the assert below
# rather than being silently skipped, so a newly advertised
# tier cannot go unmonitored.
- name: Define the known tier to base-URL map
  ansible.builtin.set_fact:
    fabric_watchdog_known_tier_urls:
      large: "{{ llm_router_llm_large_base_url }}"

- name: Assert every advertised tier has a known probe URL
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        fabric_watchdog_registry_tiers
        | difference(fabric_watchdog_known_tier_urls.keys() | list) | length == 0
    fail_msg: >-
      llm-models.yml advertises serving tier(s)
      {{ fabric_watchdog_registry_tiers
         | difference(fabric_watchdog_known_tier_urls.keys() | list) | join(', ') }}
      with no probe URL registered in fabric_watchdog_known_tier_urls
      (roles/fabric_watchdog/tasks/main.yml) — add one so this reachability
      alarm covers it.

# Reuses the SAME probe shape as the existing llm-front-door target: a plain
# GET to the OpenAI-compatible /models listing endpoint, no Authorization
# header. That endpoint never invokes a model, so this costs nothing on the
# contended single-concurrency inference slot; 401 (auth required, nothing
# sent) counts as UP exactly like the existing target, because it proves the
# backend answered at the HTTP layer at all.
- name: Build reachability targets for every advertised serving path
  ansible.builtin.set_fact:
    fabric_watchdog_targets: >-
      {{ fabric_watchdog_targets + [{'name': 'llm-' ~ item,
         'url': fabric_watchdog_known_tier_urls[item] ~ '/models', 'ok_codes': '200 401'}] }}
  loop: "{{ fabric_watchdog_registry_tiers }}"

- name: Create fabric-watchdog state directory
  ansible.builtin.file:
    path: "{{ fabric_watchdog_state_dir }}"
    state: directory
    owner: "{{ fabric_watchdog_user }}"
    group: "{{ fabric_watchdog_group }}"
    mode: "0750"

- name: Render fabric-watchdog probe script
  ansible.builtin.template:
    src: fabric-watchdog.sh.j2
    dest: /usr/local/bin/fabric-watchdog.sh
    owner: root
    group: root
    mode: "0755"

# Invoked by the probe script above, so it inherits that unit's
# EnvironmentFile (the Slack secrets) and its timer cadence without a second
# unit pair to keep in step. Reading one JSON file costs nothing at 2min.
- name: Render the absence-of-success watchdog
  ansible.builtin.template:
    src: cron-success-watchdog.py.j2
    dest: /usr/local/bin/cron-success-watchdog.py
    owner: root
    group: root
    mode: "0755"

- name: Render fabric-watchdog systemd units
  ansible.builtin.template:
    src: "fabric-watchdog.{{ item }}.j2"
    dest: "/etc/systemd/system/fabric-watchdog.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer
  register: fabric_watchdog_units

- name: Enable and start the fabric-watchdog timer
  ansible.builtin.systemd_service:
    name: fabric-watchdog.timer
    enabled: true
    state: started
    daemon_reload: "{{ fabric_watchdog_units.changed }}"
