---
# fabric_watchdog: probe script + oneshot service + timer. State lives in
# fabric_watchdog_state_dir so alerts fire only on up/down transitions.

- name: Create fabric-watchdog state directory
  ansible.builtin.file:
    path: "{{ fabric_watchdog_state_dir }}"
    state: directory
    owner: "{{ fabric_watchdog_user }}"
    group: "{{ fabric_watchdog_group }}"
    mode: "0750"

- name: Render fabric-watchdog probe script
  ansible.builtin.template:
    src: fabric-watchdog.sh.j2
    dest: /usr/local/bin/fabric-watchdog.sh
    owner: root
    group: root
    mode: "0755"

# Invoked by the probe script above, so it inherits its timer cadence without
# a second unit pair to keep in step. Reading one JSON file costs nothing at 2min.
- name: Render the absence-of-success watchdog
  ansible.builtin.template:
    src: cron-success-watchdog.py.j2
    dest: /usr/local/bin/cron-success-watchdog.py
    owner: root
    group: root
    mode: "0755"

# Also invoked by the probe script, as a command target rather than a URL one.
# Runs under the Hermes venv interpreter (see fabric_watchdog_hermes_venv_python)
# because it reports on what THAT environment has installed.
- name: Render the Hindsight dependency-gate probe
  ansible.builtin.template:
    src: hindsight-dep-gate.py.j2
    dest: /usr/local/bin/hindsight-dep-gate.py
    owner: root
    group: root
    mode: "0755"

- name: Render fabric-watchdog systemd units
  ansible.builtin.template:
    src: "fabric-watchdog.{{ item }}.j2"
    dest: "/etc/systemd/system/fabric-watchdog.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer
  register: fabric_watchdog_units

- name: Enable and start the fabric-watchdog timer
  ansible.builtin.systemd_service:
    name: fabric-watchdog.timer
    enabled: true
    state: started
    daemon_reload: "{{ fabric_watchdog_units.changed }}"
