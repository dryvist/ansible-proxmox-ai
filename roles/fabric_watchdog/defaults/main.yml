---
# fabric_watchdog — minutes-level detection of MCP-fabric / LLM-front-door
# outages (2026-07-24 incident: the fabric was down for hours and the only
# signal was Slack going quiet). Runs on the Hermes guest so probes traverse
# exactly the path Hermes uses (VLAN -> Traefik -> pool). Alerts EXACTLY ONCE
# per up/down transition via Slack, reusing the same EnvironmentFile mechanism
# as the hermes brain-watchdog (SLACK_BOT_TOKEN + SLACK_ALLOWED_USERS DM, or
# SLACK_ALERT_CHANNEL when set). Deliberately NOT ntfy/prometheus-backed —
# both live on the node whose loss this watchdog exists to catch.
fabric_watchdog_interval: "2min"
fabric_watchdog_probe_timeout: 8
# Hysteresis before an edge is committed and alerted. Transition-only alerting
# was not enough on its own: with an 8s deadline and no debounce, ONE slow
# response is a transition and its recovery is another, which is how the 13-day
# audit below reached 86 messages including recoveries with no matching DOWN.
#
# 3 down / 2 up at the 2min cadence = ~6 min to page, ~4 min to clear. These
# endpoints sit behind health-checked Traefik pools, so anything shorter reports
# pool churn rather than an outage. Raising the probe timeout instead would only
# trade a fast false DOWN for a slow one — the blip, not the deadline, is the
# problem. Never set either to 1; that restores the un-debounced behaviour.
fabric_watchdog_down_after: 3
fabric_watchdog_up_after: 2
fabric_watchdog_state_dir: /var/lib/fabric-watchdog

# --- Absence-of-success watchdog ---------------------------------------------
# The probes above answer "is the fabric reachable". A fleet whose scheduled
# jobs have all stopped COMPLETING leaves every probe green, and posts an error
# per run that looks exactly like ordinary noise — so a dead fleet and a quiet
# one are indistinguishable. This second half watches the other signal: time
# since each job's last SUCCESSFUL run, which keeps climbing whether the job is
# failing loudly or has stopped firing altogether.
#
# The store the scheduler already maintains; read-only, never written here.
fabric_watchdog_cron_jobs_file: >-
  {{ hermes_agent_hermes_home | default('/var/lib/hermes/.hermes') }}/cron/jobs.json
fabric_watchdog_success_state_path: "{{ fabric_watchdog_state_dir }}/cron-success.json"

# Threshold = this many of the job's OWN cadence with no success. A single
# global threshold cannot serve a fleet mixing quarter-hourly and daily jobs: it
# either pages constantly on the daily ones or never on the frequent ones. 3
# means two whole cycles may be missed before the third is called silence, which
# absorbs one late run and one retry without absorbing a stall.
fabric_watchdog_success_missed_cycles: 3
# Floor: a 1-minute job must not page over ordinary lateness. Ceiling: a daily
# job must not be allowed to sit silent for most of a week (3 x daily = 3 days).
fabric_watchdog_success_floor_minutes: 30
fabric_watchdog_success_ceiling_minutes: 1440
# A total fleet death must arrive as one message, not one per job.
fabric_watchdog_success_fleet_rollup_at: 5
# A store carrying the stop sentinel has deliberately stopped running work, so
# its silence is explained and absence alerts there are suppressed — a guard
# that pages during planned maintenance is one operators learn to dismiss.
# Suppression cannot be unbounded, though, or a pause becomes a way to hide a
# dead fleet: past this long the pause itself is reported instead. Four hours
# sits well clear of an automated drain (bounded far below an hour) while still
# surfacing a forgotten manual pause within the same working day.
fabric_watchdog_success_pause_alert_minutes: 240

fabric_watchdog_user: hermes
fabric_watchdog_group: hermes
# Same .env the hermes gateway + brain-watchdog load (SLACK_* secrets).
fabric_watchdog_env_file: "{{ hermes_agent_hermes_home | default('/var/lib/hermes/.hermes') }}/.env"

# Alert destination. That .env does not define SLACK_ALERT_CHANNEL, so without
# this the script silently falls back to DMing the first SLACK_ALLOWED_USERS
# entry — a destination that moves whenever that list is reordered.
#
# These probes report on Hermes' OWN fabric (the MCP proxy and LLM front door it
# depends on), so a DOWN/recovered transition is Hermes being non-functional, not
# a homelab finding — it belongs in the issues channel. Over the 13-day audit
# these flaps were 86 messages in the work channel, several of them recoveries
# with no matching DOWN. Falls back to the digest channel when unset, then to the
# DM, so an unconfigured id changes nothing.
fabric_watchdog_alert_channel: >-
  {{ hermes_agent_slack_issues_channel
     | default(hermes_agent_digest_slack_channel, true)
     | default('', true) }}

# Probed endpoints. ok_codes are space-separated HTTP codes counted as UP:
# the MCP proxy answers 406 (protocol negotiation rejection) to a plain GET
# when healthy and 502 when the backend pool is gone; llm answers 401 to an
# unauthenticated /v1/models when healthy.
fabric_watchdog_targets:
  - name: mcp-fabric
    url: "https://mcp.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/splunk"
    ok_codes: "200 401 405 406"
  - name: llm-front-door
    url: "https://llm.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/v1/models"
    ok_codes: "200 401"
  # Hindsight (hermes_agent_memory_provider) has no active liveness check of
  # its own: the plugin's is_available() unconditionally returns True in
  # local_external mode (verified 2026-07-31 against the pinned hermes-agent
  # v2026.7.7.2 plugin source — it never actually pings the service), and the
  # converge-time `hermes memory status` probe (verify.yml) is a one-shot,
  # non-fatal check that only runs during a role converge. Between converges,
  # an outage is invisible until someone notices memory recall going quiet —
  # this closes that gap the same way as the other two targets. /health is
  # the same endpoint Traefik's own pool health check uses (hindsight_docker
  # role) and returns {"status":"healthy","database":"connected"} — 200 only.
  - name: hindsight
    url: "https://hindsight.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/health"
    ok_codes: "200"
