---
# Publish declared serving capacity for node_exporter's textfile collector.
# Callers pass one profile name or an ordered profile-name list, the profile
# map, and an engine fallback. Each profile's max_num_seqs and max_model_len
# fields drive the serving arguments: llama.cpp uses the per-slot context times
# the slot count for --ctx-size and the slot count for --parallel, while vLLM
# uses those fields for --max-model-len and --max-num-seqs.
# The accelerator label is this guest's llm_gpu_accelerator, the variable the
# router's llm_router_gpu_profile_accelerators reads for this guest.
- name: Ensure the node_exporter textfile collector directory exists
  block:
    - name: Create the configured node_exporter textfile collector directory
      ansible.builtin.file:
        path: "{{ llm_serving_declared_metrics_textfile_collector_dir }}"
        state: directory
        mode: "0755"
  rescue:
    - name: Fail when the node_exporter textfile collector directory cannot be created
      ansible.builtin.fail:
        msg: >-
          Cannot publish declared serving metrics because the node_exporter textfile collector
          directory '{{ llm_serving_declared_metrics_textfile_collector_dir }}' is missing and
          could not be created. Ensure llm_serving_declared_metrics_textfile_collector_dir names
          the configured collector directory and that it can be created.

- name: Write the declared serving slots and context per slot
  # copy writes the content to a temporary file and renames it over the destination,
  # so a scrape never reads a half-written metric file. Only a rename that crosses a
  # filesystem falls back to copying into a temporary file beside the destination.
  ansible.builtin.copy:
    dest: "{{ llm_serving_declared_metrics_textfile_collector_dir }}/{{ llm_serving_declared_metrics_metric_file }}"
    content: |
      {% for profile_name in llm_serving_declared_metrics_profile_names
           | default([llm_serving_declared_metrics_profile]) %}
      {% set profile = llm_serving_declared_metrics_profiles[profile_name] %}
      {% set engine = profile.engine | default(llm_serving_declared_metrics_engine) %}
      {% set labels = '{accelerator="%s",profile="%s",engine="%s"}' | format(
           llm_gpu_accelerator, profile_name, engine) %}
      {% set slots = profile.max_num_seqs | int %}
      {% set context_tokens = profile.max_model_len | int %}
      llm_serving_declared_slots{{ labels }} {{ slots }}
      llm_serving_declared_context_tokens_per_slot{{ labels }} {{ context_tokens }}
      {% endfor %}
    mode: "0644"
