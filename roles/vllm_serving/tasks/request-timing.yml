---
- name: Create vLLM request timing middleware directory
  ansible.builtin.file:
    path: "{{ vllm_serving_request_timing_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install vLLM request timing middleware
  ansible.builtin.copy:
    src: request_timing.py
    dest: "{{ vllm_serving_request_timing_dir }}/request_timing.py"
    owner: root
    group: root
    mode: "0644"
