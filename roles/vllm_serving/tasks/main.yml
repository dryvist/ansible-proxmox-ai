---
- name: Install shared NVIDIA guest prerequisites
  ansible.builtin.include_role:
    name: nvidia_gpu_guest

- name: Load the shared profile and artifact registry
  ansible.builtin.include_role:
    name: nvidia_gpu_guest
    tasks_from: load-registry.yml

- name: Validate the vLLM profile set
  ansible.builtin.include_tasks: validate-profiles.yml

- name: Install the vLLM build prerequisites
  ansible.builtin.apt:
    name: [gcc, libc6-dev]
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment: "{{ llamacpp_release_proxy_environment }}"

- name: Install the selected vLLM engine
  ansible.builtin.include_tasks: install.yml

- name: Activate and verify the selected vLLM profile
  ansible.builtin.include_tasks: activate.yml
