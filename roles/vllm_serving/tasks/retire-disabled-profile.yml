---
- name: Inspect the disabled GPU profile unit
  ansible.builtin.stat:
    path: "{{ nvidia_gpu_guest_systemd_dir }}/{{ nvidia_gpu_guest_unit_prefix }}-{{ item.key }}.service"
  register: vllm_serving_disabled_profile_unit

- name: Stop and disable the existing disabled GPU profile unit
  ansible.builtin.systemd:
    name: "{{ nvidia_gpu_guest_unit_prefix }}-{{ item.key }}.service"
    state: stopped
    enabled: false
    daemon_reload: true
  when: vllm_serving_disabled_profile_unit.stat.exists

- name: Remove the disabled GPU profile unit file
  ansible.builtin.file:
    path: "{{ nvidia_gpu_guest_systemd_dir }}/{{ nvidia_gpu_guest_unit_prefix }}-{{ item.key }}.service"
    state: absent
  when: vllm_serving_disabled_profile_unit.stat.exists
