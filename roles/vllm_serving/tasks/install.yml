---
- name: Create the vLLM virtual environment
  ansible.builtin.command:
    argv:
      - "{{ nvidia_gpu_guest_uv_bin }}"
      - venv
      - --python
      - "{{ nvidia_gpu_guest_python }}"
      - "{{ nvidia_gpu_guest_venv }}"
    creates: "{{ nvidia_gpu_guest_venv }}/bin/python"
  become: true
  become_user: "{{ nvidia_gpu_guest_user }}"
  environment: "{{ nvidia_gpu_guest_uv_environment }}"

- name: Install the pinned vLLM build with SM120 b12x kernels
  ansible.builtin.command:
    argv:
      - "{{ nvidia_gpu_guest_uv_bin }}"
      - pip
      - install
      - --python
      - "{{ nvidia_gpu_guest_venv }}/bin/python"
      - "vllm=={{ vllm_serving_version }}"
      - "b12x=={{ vllm_serving_b12x_version }}"
      - "flashinfer-cubin=={{ vllm_serving_flashinfer_version }}"
      - "flashinfer-jit-cache=={{ vllm_serving_flashinfer_version }}"
      # Both indexes host only FlashInfer packages, at the pinned version.
      - --extra-index-url
      - "{{ vllm_serving_flashinfer_index_url }}"
      - --extra-index-url
      - "{{ vllm_serving_flashinfer_jit_cache_index_url }}"
  become: true
  become_user: "{{ nvidia_gpu_guest_user }}"
  environment: "{{ nvidia_gpu_guest_uv_environment }}"
  register: vllm_serving_install
  changed_when: >-
    'Installed' in vllm_serving_install.stderr or
    'Prepared' in vllm_serving_install.stderr or
    'Uninstalled' in vllm_serving_install.stderr
  notify:
    - Stop every other GPU serving profile before switching
    - Start the active GPU serving profile

- name: Put the vLLM and Hugging Face CLIs on the default PATH
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "/usr/local/bin/{{ item.name }}"
    state: link
  loop:
    - name: vllm
      src: "{{ nvidia_gpu_guest_venv }}/bin/vllm"
    - name: hf
      src: "{{ nvidia_gpu_guest_hf_bin }}"
  loop_control:
    label: "{{ item.name }}"
