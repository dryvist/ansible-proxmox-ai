---
# node_exporter's textfile collector directory on the serving guest. The
# active profile's declared slots and context per slot publish there
# (tasks/publish-declared-metrics.yml); when the directory is absent
# (node_exporter not installed) the publish skips instead of failing the
# converge.
vllm_serving_textfile_collector_dir: /var/lib/node_exporter/textfile_collector
