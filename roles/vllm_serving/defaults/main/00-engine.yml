---
# vLLM and its compatible SM120/FlashInfer components.
# renovate: datasource=pypi depName=vllm
vllm_serving_version: "0.30.0"
# renovate: datasource=pypi depName=b12x
vllm_serving_b12x_version: "1.5.0"
# renovate: ignore — must equal the flashinfer-python pin of the vLLM version above; bump together.
vllm_serving_flashinfer_version: "0.6.18.post1"
vllm_serving_flashinfer_index_url: https://flashinfer.ai/whl/
vllm_serving_flashinfer_jit_cache_index_url: "{{ vllm_serving_flashinfer_index_url }}cu130"
vllm_serving_cache_sync_notify_service: true

# Benchmark-only telemetry options; these documented variables are not consumed by the role.
# vllm_serving_enable_per_request_metrics: false  # --enable-per-request-metrics
# vllm_serving_per_request_spec_decode_metrics: summary  # --per-request-spec-decode-metrics=summary
# vllm_serving_enable_kv_cache_metrics: false  # --kv-cache-metrics
