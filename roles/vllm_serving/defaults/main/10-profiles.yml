---
vllm_serving_active_profile: "{{ llm_gpu_active_profiles_by_engine.vllm }}"
vllm_serving_profiles_core:
  medium-a:
    enabled: true
    engine: vllm
    linear_backend: b12x
    moe_backend: auto
    max_model_len: 196608
    max_num_seqs: 8
    # Leaves ~14 GiB of the shared card for the pinned small llama.cpp guest.
    gpu_memory_utilization: 0.85
    kv_cache_dtype: auto
    memory_screen_reserve_gib: 10
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    port: '{{ nvidia_gpu_guest_api_port }}'
  qwen38-16k-4-auto:
    <<: &qwen38_sweep_defaults
      <<: &qwen38_sweep_base_defaults
        enabled: true
        engine: vllm
        linear_backend: b12x
        moe_backend: auto
        enable_auto_tool_choice: true
        tool_call_parser: qwen3_xml
        reasoning_parser: qwen3
        port: '{{ nvidia_gpu_guest_api_port }}'
      gpu_memory_utilization: 0.85
      memory_screen_reserve_gib: 10
    max_model_len: 16384
    max_num_seqs: 4
    kv_cache_dtype: auto
  qwen38-16k-1-auto:
    <<: *qwen38_sweep_defaults
    max_model_len: 16384
    max_num_seqs: 1
    kv_cache_dtype: auto
  qwen38-16k-1-fp8:
    <<: *qwen38_sweep_defaults
    max_model_len: 16384
    max_num_seqs: 1
    kv_cache_dtype: fp8
  qwen38-16k-4-fp8:
    <<: *qwen38_sweep_defaults
    max_model_len: 16384
    max_num_seqs: 4
    kv_cache_dtype: fp8
  qwen38-64k-1-auto:
    <<: *qwen38_sweep_defaults
    max_model_len: 65536
    max_num_seqs: 1
    kv_cache_dtype: auto
  qwen38-64k-1-fp8:
    <<: *qwen38_sweep_defaults
    max_model_len: 65536
    max_num_seqs: 1
    kv_cache_dtype: fp8
  qwen38-64k-4-auto:
    <<: *qwen38_sweep_defaults
    max_model_len: 65536
    max_num_seqs: 4
    kv_cache_dtype: auto
  qwen38-64k-4-fp8:
    <<: *qwen38_sweep_defaults
    max_model_len: 65536
    max_num_seqs: 4
    kv_cache_dtype: fp8
  qwen38-16k-8-auto:
    <<: *qwen38_sweep_defaults
    max_model_len: 16384
    max_num_seqs: 8
    kv_cache_dtype: auto
  qwen38-16k-8-fp8:
    <<: *qwen38_sweep_defaults
    max_model_len: 16384
    max_num_seqs: 8
    kv_cache_dtype: fp8
  qwen38-64k-8-auto:
    <<: *qwen38_sweep_defaults
    max_model_len: 65536
    max_num_seqs: 8
    kv_cache_dtype: auto
  qwen38-64k-8-fp8:
    <<: *qwen38_sweep_defaults
    max_model_len: 65536
    max_num_seqs: 8
    kv_cache_dtype: fp8
  # One 8-slot profile per model serves the c = 1/4/8 benchmark cells.
  qwen38-64k-8-fp8-mtp:
    <<: *qwen38_sweep_defaults
    max_model_len: 65536
    max_num_seqs: 8
    quantization: modelopt
    kv_cache_dtype: fp8
    speculative_config: &qwen38_mtp_config
      method: mtp
      num_speculative_tokens: 3
  qwen38-64k-8-fp8-mtp0:
    <<: *qwen38_sweep_defaults
    max_model_len: 65536
    max_num_seqs: 8
    quantization: modelopt
    kv_cache_dtype: fp8
  qwen38-64k-8-fp8-mtp2:
    <<: *qwen38_sweep_defaults
    max_model_len: 65536
    max_num_seqs: 8
    quantization: modelopt
    kv_cache_dtype: fp8
    speculative_config:
      method: mtp
      num_speculative_tokens: 2
  qwen38-64k-8-fp8-mtp4:
    <<: *qwen38_sweep_defaults
    max_model_len: 65536
    max_num_seqs: 8
    quantization: modelopt
    kv_cache_dtype: fp8
    speculative_config:
      method: mtp
      num_speculative_tokens: 4
  qwen38-128k-2-fp8-mtp:
    <<: *qwen38_sweep_defaults
    max_model_len: 131072
    max_num_seqs: 2
    quantization: modelopt
    kv_cache_dtype: fp8
    speculative_config: *qwen38_mtp_config
  qwen38-128k-11-fp8-mtp:
    <<: *qwen38_sweep_defaults
    max_model_len: 131072
    max_num_seqs: 11
    quantization: modelopt
    kv_cache_dtype: fp8
    speculative_config: *qwen38_mtp_config
  # Co-resident small-engine profile. The 24 GiB outside vLLM is reserved for
  # the Q4_K_M model, its four-slot Q8_0 KV cache, and CUDA/runtime headroom.
  qwen38-96k-11-fp8-mtp:
    <<: *qwen38_sweep_base_defaults
    max_model_len: 98304
    max_num_seqs: 11
    gpu_memory_utilization: 0.75
    memory_screen_reserve_gib: 12
    quantization: modelopt
    kv_cache_dtype: fp8
    speculative_config: *qwen38_mtp_config
  qwen38-256k-1-fp8-mtp:
    <<: *qwen38_sweep_defaults
    max_model_len: 262144
    max_num_seqs: 1
    quantization: modelopt
    kv_cache_dtype: fp8
    speculative_config: *qwen38_mtp_config
  qwen38-256k-5-fp8-mtp:
    <<: *qwen38_sweep_defaults
    max_model_len: 262144
    max_num_seqs: 5
    quantization: modelopt
    kv_cache_dtype: fp8
    speculative_config: *qwen38_mtp_config
  qwen38-256k-kvoff0:
    <<: *qwen38_sweep_defaults
    max_model_len: 262144
    max_num_seqs: 5
    quantization: modelopt
    kv_cache_dtype: fp8
    speculative_config: *qwen38_mtp_config
  qwen38-256k-kvoff24:
    <<: *qwen38_sweep_defaults
    max_model_len: 262144
    max_num_seqs: 5
    quantization: modelopt
    kv_cache_dtype: fp8
    speculative_config: *qwen38_mtp_config
    kv_offloading_size: 24
    kv_offloading_backend: native
  qwen38-256k-kvoffmax:
    <<: *qwen38_sweep_defaults
    max_model_len: 262144
    max_num_seqs: 5
    quantization: modelopt
    kv_cache_dtype: fp8
    speculative_config: *qwen38_mtp_config
    kv_offloading_size: 52.81
    kv_offloading_backend: native
  qwen38-64k-16-fp8-mtp:
    <<: *qwen38_sweep_defaults
    max_model_len: 65536
    max_num_seqs: 16
    quantization: modelopt
    kv_cache_dtype: fp8
    speculative_config: *qwen38_mtp_config
  flash-next-64k-8-fp8-mtp:
    <<: &flash_next_mtp_defaults
      # DOES NOT FIT the 96 GB host; the artifact SSOT is disabled until a
      # larger GPU and guest RAM budget are declared.
      enabled: false
      engine: vllm
      linear_backend: b12x
      moe_backend: auto
      enable_auto_tool_choice: true
      tool_call_parser: qwen3_coder
      reasoning_parser: qwen3
      quantization: modelopt
      kv_cache_dtype: fp8
      engram_config:
        cpu_offload: true
      enable_flashinfer_autotune: false
      port: '{{ nvidia_gpu_guest_api_port }}'
    speculative_config: *qwen38_mtp_config
    max_model_len: 65536
    max_num_seqs: 8
    gpu_memory_utilization: 0.97
    memory_screen_reserve_gib: 10
  flash-next-64k-8-fp8-mtp0:
    <<: *flash_next_mtp_defaults
    max_model_len: 65536
    max_num_seqs: 8
    gpu_memory_utilization: 0.97
    memory_screen_reserve_gib: 10
  flash-next-64k-8-fp8-mtp2:
    <<: *flash_next_mtp_defaults
    max_model_len: 65536
    max_num_seqs: 8
    gpu_memory_utilization: 0.97
    memory_screen_reserve_gib: 10
    speculative_config:
      method: mtp
      num_speculative_tokens: 2
  flash-next-64k-8-fp8-mtp4:
    <<: *flash_next_mtp_defaults
    max_model_len: 65536
    max_num_seqs: 8
    speculative_config:
      method: mtp
      num_speculative_tokens: 4
    gpu_memory_utilization: 0.97
    memory_screen_reserve_gib: 10
  flash-next-262k-1-fp8:
    <<: *flash_next_mtp_defaults
    max_model_len: 262144
    max_num_seqs: 1
    gpu_memory_utilization: 0.99
    memory_screen_reserve_gib: 4
    kv_offloading_size: 8
    kv_offloading_backend: native
  flash-next-262k-2-fp8:
    <<: *flash_next_mtp_defaults
    max_model_len: 262144
    max_num_seqs: 2
    gpu_memory_utilization: 0.99
    memory_screen_reserve_gib: 4
    kv_offloading_size: 14
    kv_offloading_backend: native
  qwen38-192k-1-auto:
    <<: *qwen38_sweep_defaults
    max_model_len: 196608
    max_num_seqs: 1
    kv_cache_dtype: auto
  qwen38-192k-1-fp8:
    <<: *qwen38_sweep_defaults
    max_model_len: 196608
    max_num_seqs: 1
    kv_cache_dtype: fp8
  qwen38-192k-4-fp8:
    <<: *qwen38_sweep_defaults
    max_model_len: 196608
    max_num_seqs: 4
    kv_cache_dtype: fp8
  qwen38-196k-4-auto:
    <<: *qwen38_sweep_defaults
    max_model_len: 196608
    max_num_seqs: 4
    kv_cache_dtype: auto
  qwen38-262k-1-auto:
    <<: *qwen38_sweep_defaults
    max_model_len: 262144
    max_num_seqs: 1
    kv_cache_dtype: auto
  qwen38-262k-1-fp8:
    <<: *qwen38_sweep_defaults
    max_model_len: 262144
    max_num_seqs: 1
    kv_cache_dtype: fp8
  qwen38-262k-2-auto:
    <<: *qwen38_sweep_defaults
    max_model_len: 262144
    max_num_seqs: 2
    kv_cache_dtype: auto
  qwen38-262k-2-fp8:
    <<: *qwen38_sweep_defaults
    max_model_len: 262144
    max_num_seqs: 2
    kv_cache_dtype: fp8
vllm_serving_profiles: "{{ vllm_serving_profiles_core | combine(vllm_serving_profiles_specialized) }}"
vllm_serving_engine: vllm
