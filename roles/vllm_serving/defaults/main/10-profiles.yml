---
vllm_serving_active_profile: "{{ llm_gpu_active_profiles_by_engine.vllm }}"
vllm_serving_profiles:
  small:
    enabled: true
    engine: vllm
    linear_backend: auto
    moe_backend: auto
    max_model_len: 32768
    max_num_seqs: 4
    gpu_memory_utilization: 0.75
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    port: '{{ nvidia_gpu_guest_api_port }}'
  medium-a:
    primary: true
    enabled: true
    engine: vllm
    linear_backend: b12x
    moe_backend: auto
    python_packages:
      - b12x=={{ vllm_serving_b12x_version }}
    max_model_len: 196608
    max_num_seqs: 8
    gpu_memory_utilization: 0.88
    enable_auto_tool_choice: true
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    port: '{{ nvidia_gpu_guest_api_port }}'
vllm_serving_engine: vllm
