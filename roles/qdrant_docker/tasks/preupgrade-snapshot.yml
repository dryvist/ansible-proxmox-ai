---
- name: Create Qdrant full-storage pre-upgrade snapshot
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ qdrant_docker_http_port }}/snapshots?wait=true"
    method: POST
    headers:
      api-key: "{{ qdrant_docker_api_key }}"
    status_code: 200
    timeout: "{{ qdrant_docker_preupgrade_snapshot_timeout }}"
    return_content: true
  register: qdrant_docker_preupgrade_snapshot_response
  no_log: true
  when:
    - not ansible_check_mode
    - qdrant_docker_preupgrade_snapshot_enabled | bool
    - qdrant_docker_running_check.stdout != ''
    - qdrant_docker_running_image.stdout != qdrant_docker_image

- name: Report the Qdrant pre-upgrade snapshot name
  ansible.builtin.debug:
    msg: "Created Qdrant pre-upgrade snapshot {{ qdrant_docker_preupgrade_snapshot_response.json.result.name }}"
  when: qdrant_docker_preupgrade_snapshot_response is not skipped
