---
galaxy_info:
  author: JacobPEvans
  description: >-
    Deploy hermes-workspace and mission-control as two independent Docker
    Compose services on one LXC
  license: Apache-2.0
  min_ansible_version: "2.15"

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - jammy
        - noble

  galaxy_tags:
    - hermes
    - docker
    - dashboard
    - ai

dependencies:
  # Shared Docker-in-LXC bootstrap (docker-ce + compose plugin, LXC-conditional
  # fuse-overlayfs). Writes daemon.json with the role's storage driver. No venv:
  # deploys via docker_compose_v2 (CLI).
  - role: docker_engine
    docker_engine_configure_daemon_json: true
    docker_engine_storage_driver: "{{ hermes_ui_docker_storage_driver }}"
