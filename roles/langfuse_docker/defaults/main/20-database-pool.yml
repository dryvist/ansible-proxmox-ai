---
# Postgres connection budget. Each Prisma pool opens at most connection_limit
# connections, and Postgres refuses clients past max_connections. The web pool
# plus one worker pool per worker process must stay below max_connections
# minus 10 reserved connections (enforced by the compose test).
langfuse_docker_postgres_max_connections: 100

# Web serves API and UI requests, which hold a connection briefly.
langfuse_docker_web_db_connection_limit: 20

# One connection per in-flight ingestion job (ingestion plus OTel queues).
langfuse_docker_worker_db_connection_limit: >-
  {{ langfuse_docker_ingestion_queue_concurrency | int
     + langfuse_docker_otel_ingestion_queue_concurrency | int }}

langfuse_docker_web_database_url: >-
  {{ langfuse_docker_database_url }}?connection_limit={{ langfuse_docker_web_db_connection_limit }}
langfuse_docker_worker_database_url: >-
  {{ langfuse_docker_database_url }}?connection_limit={{ langfuse_docker_worker_db_connection_limit }}
