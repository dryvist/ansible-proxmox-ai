---
# ClickHouse stops at 25.12. 26.x is excluded — upstream reports CORRUPTED_DATA
# on a 25 -> 26 upgrade. ClickHouse only supports one-minor-line-at-a-time
# upgrades across these boundaries, so the deployed 24.8 LTS reaches 25.12 by
# way of 25.8: each hop in `langfuse_docker_clickhouse_upgrade_path` is started
# and brought healthy in list order before the pinned tag is applied
# (tasks/clickhouse_upgrade.yml). Hops at or below the running tag are skipped,
# so a converged host is a no-op.
langfuse_docker_clickhouse_image_repo: "clickhouse/clickhouse-server"
langfuse_docker_clickhouse_version: "25.12"
langfuse_docker_clickhouse_upgrade_path:
  - "25.8"
  - "25.12"
langfuse_docker_clickhouse_image: >-
  {{ langfuse_docker_clickhouse_image_repo }}:{{ langfuse_docker_clickhouse_version }}
