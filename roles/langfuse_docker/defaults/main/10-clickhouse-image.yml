---
# ClickHouse upgrades only one release line at a time across boundaries, so
# the deployed 24.8 LTS reaches the pinned tag by way of the hop list: each
# hop in `langfuse_docker_clickhouse_upgrade_path` is started and brought
# healthy in list order before the pinned tag is applied
# (tasks/clickhouse_upgrade.yml). Hops at or below the running tag are
# skipped, so a converged host is a no-op.
langfuse_docker_clickhouse_image_repo: "clickhouse/clickhouse-server"
# renovate: datasource=docker depName=clickhouse/clickhouse-server versioning=docker
langfuse_docker_clickhouse_version: "26.7"
langfuse_docker_clickhouse_upgrade_path:
  - "25.8"
  - "25.12"
langfuse_docker_clickhouse_image: >-
  {{ langfuse_docker_clickhouse_image_repo }}:{{ langfuse_docker_clickhouse_version }}
