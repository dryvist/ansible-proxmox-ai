---
- name: Read native dataset by name
  ansible.builtin.uri:
    url: "{{ langfuse_docker_public_api_url }}/v2/datasets/{{ langfuse_docker_dataset.name | urlencode }}"
    status_code: [200, 404]
  register: langfuse_docker_dataset_read
  retries: 3
  delay: 1
  until: langfuse_docker_dataset_read.status | default(-1) in [200, 404]
  changed_when: false

- name: Create native dataset when absent
  ansible.builtin.uri:
    url: "{{ langfuse_docker_public_api_url }}/v2/datasets"
    method: POST
    body: "{{ langfuse_docker_dataset }}"
    status_code: 200
  when: langfuse_docker_dataset_read.status == 404
  changed_when: true
