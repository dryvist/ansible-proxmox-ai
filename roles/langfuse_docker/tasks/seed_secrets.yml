---
# OpenBao is authoritative. Existing guest files are supplied to the shared
# seed task as caller values so an absent KV field imports the value instead of
# generating a replacement. A stored KV value is never rotated by this role.

- name: Check for existing Langfuse secret files
  ansible.builtin.stat:
    path: "{{ langfuse_docker_data_dir }}/{{ item.file }}"
  loop: "{{ langfuse_docker_generated_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  register: langfuse_docker_secret_stats

- name: Read existing Langfuse secret files for import
  ansible.builtin.slurp:
    src: "{{ langfuse_docker_data_dir }}/{{ item.item.file }}"
  loop: "{{ langfuse_docker_secret_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists
  register: langfuse_docker_secret_slurps
  no_log: true

- name: Initialize Langfuse seed fields
  ansible.builtin.set_fact:
    langfuse_docker_secret_seed_fields: []
  no_log: true

- name: Build Langfuse seed fields from existing files
  ansible.builtin.set_fact:
    langfuse_docker_secret_seed_fields: >-
      {{ langfuse_docker_secret_seed_fields + [{
           'name': item.item.name,
           'length': item.item.length,
           'charset': item.item.charset,
           'value': (_langfuse_existing_file.content | default('') | b64decode | trim)
         }] }}
  vars:
    _langfuse_existing_file: >-
      {{ langfuse_docker_secret_slurps.results
         | selectattr('item.item.name', 'equalto', item.item.name)
         | selectattr('content', 'defined')
         | first | default({}) }}
  loop: "{{ langfuse_docker_secret_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true

- name: Seed Langfuse secrets in OpenBao
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Run the shared generate-if-absent seed task
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ hostvars['localhost'].openbao_secrets_active_addr }}"
        openbao_secrets_seed_mount: "{{ openbao_secrets_kv_mount }}"
        openbao_secrets_seed_path: ai/langfuse
        openbao_secrets_seed_fields: "{{ langfuse_docker_secret_seed_fields }}"
        openbao_secrets_seed_token: "{{ openbao_secrets_converge_writer_token }}"
        openbao_secrets_seed_expected_writer_policy: ansible-converge
        openbao_secrets_seed_check_capabilities: true
        openbao_secrets_seed_revoke_token: false
        openbao_secrets_seed_register: langfuse_docker_secret_seed_result

# The comparison touches secret values, so it is no_log. Only the field names
# leave it, and the failure below prints those names and nothing else.
- name: Initialize the Langfuse secret fields that differ from OpenBao
  ansible.builtin.set_fact:
    langfuse_docker_secret_mismatched_fields: []
  no_log: true

- name: Compare existing Langfuse secret files with OpenBao
  ansible.builtin.set_fact:
    langfuse_docker_secret_mismatched_fields: >-
      {{ langfuse_docker_secret_mismatched_fields + [item.item.item.name] }}
  when:
    - item.content is defined
    - (item.content | b64decode | trim) != langfuse_docker_secret_seed_result[item.item.item.name]
  loop: "{{ langfuse_docker_secret_slurps.results }}"
  loop_control:
    label: "{{ item.item.item.name }}"
  no_log: true

- name: Fail if an existing Langfuse secret file differs from OpenBao
  ansible.builtin.fail:
    msg: >-
      Existing Langfuse secret file does not match OpenBao field(s):
      {{ langfuse_docker_secret_mismatched_fields | join(', ') }}.
  when: langfuse_docker_secret_mismatched_fields | length > 0

- name: Write missing Langfuse secret files from OpenBao
  ansible.builtin.copy:
    dest: "{{ langfuse_docker_data_dir }}/{{ item.item.file }}"
    content: "{{ langfuse_docker_secret_seed_result[item.item.name] }}"
    owner: root
    group: root
    mode: "0600"
    force: false
  loop: "{{ langfuse_docker_secret_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists
  no_log: true

- name: Resolve Langfuse secrets from the OpenBao result
  ansible.builtin.set_fact:
    langfuse_docker_secrets: "{{ langfuse_docker_secret_seed_result }}"
  no_log: true
