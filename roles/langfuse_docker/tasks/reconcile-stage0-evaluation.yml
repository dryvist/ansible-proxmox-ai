---
- name: Require the approved local TypeScript evaluator runtime
  ansible.builtin.assert:
    that:
      - langfuse_docker_code_eval_dispatcher == 'insecure-local'
      - langfuse_docker_code_eval_queue_enabled | bool
    fail_msg: >-
      Stage 0 code evaluators require the approved insecure-local dispatcher
      and the code-evaluation queue.

- name: Fetch the pinned typed-decisions test subset from Hugging Face
  ansible.builtin.uri:
    url: "{{ langfuse_docker_stage0_dataset_api_url }}"
    method: GET
    headers:
      Accept: application/json
    return_content: true
    status_code: 200
    timeout: 30
  register: langfuse_docker_stage0_dataset_rows
  changed_when: false
  no_log: true

- name: Verify the dataset viewer served the pinned revision and subset
  ansible.builtin.assert:
    that:
      - >-
        langfuse_docker_stage0_dataset_rows.x_revision
        == langfuse_docker_stage0_dataset_revision
      - >-
        langfuse_docker_stage0_dataset_rows.json.rows | length
        == langfuse_docker_stage0_dataset_length | int
      - not (langfuse_docker_stage0_dataset_rows.json.partial | default(false) | bool)
      - >-
        langfuse_docker_stage0_dataset_rows.json.num_rows_total | int
        >= langfuse_docker_stage0_dataset_length | int
    fail_msg: >-
      Hugging Face did not serve the pinned typed-decisions test data. Refuse
      to create or update a Langfuse dataset from a different revision.

- name: Read the Stage 0 Langfuse dataset
  ansible.builtin.uri:
    url: >-
      {{ 'http://127.0.0.1:' ~ langfuse_docker_web_port
         ~ '/api/public/v2/datasets/' ~ langfuse_docker_stage0_dataset_name }}
    method: GET
    url_username: "{{ langfuse_docker_init_public_key }}"
    url_password: "{{ langfuse_docker_init_secret_key }}"
    force_basic_auth: true
    return_content: true
    status_code: [200, 404]
  register: langfuse_docker_stage0_dataset
  changed_when: false
  no_log: true

- name: Create the Stage 0 Langfuse dataset when absent
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ langfuse_docker_web_port }}/api/public/v2/datasets"
    method: POST
    url_username: "{{ langfuse_docker_init_public_key }}"
    url_password: "{{ langfuse_docker_init_secret_key }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ langfuse_docker_stage0_dataset_name }}"
      description: >-
        Pinned 20-row test subset for Stage 0 System One evaluation.
      metadata:
        source: "LocalLLaMA/typed-decisions"
        source_revision: "{{ langfuse_docker_stage0_dataset_revision }}"
        source_config: "{{ langfuse_docker_stage0_dataset_config }}"
        source_split: "{{ langfuse_docker_stage0_dataset_split }}"
        source_offset: "{{ langfuse_docker_stage0_dataset_offset }}"
        source_length: "{{ langfuse_docker_stage0_dataset_length }}"
    return_content: true
    status_code: 200
  register: langfuse_docker_stage0_dataset_created
  when: langfuse_docker_stage0_dataset.status == 404
  no_log: true

- name: Require an existing Stage 0 dataset to retain its source pin
  ansible.builtin.assert:
    that:
      - langfuse_docker_stage0_dataset.json.metadata.source_revision == langfuse_docker_stage0_dataset_revision
      - langfuse_docker_stage0_dataset.json.metadata.source_config == langfuse_docker_stage0_dataset_config
      - langfuse_docker_stage0_dataset.json.metadata.source_split == langfuse_docker_stage0_dataset_split
      - langfuse_docker_stage0_dataset.json.metadata.source_offset | int == langfuse_docker_stage0_dataset_offset | int
      - langfuse_docker_stage0_dataset.json.metadata.source_length | int == langfuse_docker_stage0_dataset_length | int
    fail_msg: >-
      The existing Stage 0 dataset uses a different data source or subset.
      Preserve it and review the pin before updating.
  when: langfuse_docker_stage0_dataset.status == 200

- name: Read existing Stage 0 Langfuse dataset items
  ansible.builtin.uri:
    url: >-
      {{ 'http://127.0.0.1:' ~ langfuse_docker_web_port
         ~ '/api/public/dataset-items?datasetName='
         ~ langfuse_docker_stage0_dataset_name ~ '&page=1&limit=100' }}
    method: GET
    url_username: "{{ langfuse_docker_init_public_key }}"
    url_password: "{{ langfuse_docker_init_secret_key }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: langfuse_docker_stage0_existing_items
  changed_when: false
  no_log: true

- name: Verify existing Stage 0 items match the pinned test rows
  ansible.builtin.assert:
    that:
      - >-
        _langfuse_stage0_item_matches | length == 0 or
        (_langfuse_stage0_item_matches[0].input.state == (item.row.state | from_json)
         and _langfuse_stage0_item_matches[0].input.questions == (item.row.questions | from_json)
         and _langfuse_stage0_item_matches[0].expectedOutput == (item.row.gold | from_json))
    fail_msg: >-
      An existing dataset item differs from the pinned Hugging Face row.
      Review the item before changing Langfuse data.
  vars:
    _langfuse_stage0_item_id: "typed-decisions-stage0-{{ item.row.id }}"
    _langfuse_stage0_item_matches: >-
      {{ langfuse_docker_stage0_existing_items.json.data
         | selectattr('id', 'equalto', _langfuse_stage0_item_id) | list }}
  loop: "{{ langfuse_docker_stage0_dataset_rows.json.rows }}"
  loop_control:
    label: "{{ item.row.id }}"

- name: Create missing Stage 0 Langfuse dataset items
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ langfuse_docker_web_port }}/api/public/dataset-items"
    method: POST
    url_username: "{{ langfuse_docker_init_public_key }}"
    url_password: "{{ langfuse_docker_init_secret_key }}"
    force_basic_auth: true
    body_format: json
    body:
      datasetName: "{{ langfuse_docker_stage0_dataset_name }}"
      id: "typed-decisions-stage0-{{ item.row.id }}"
      input:
        state: "{{ item.row.state | from_json }}"
        questions: "{{ item.row.questions | from_json }}"
      expectedOutput: "{{ item.row.gold | from_json }}"
      metadata:
        workflow: "{{ item.row.workflow }}"
        source_dataset: "LocalLLaMA/typed-decisions"
        source_revision: "{{ langfuse_docker_stage0_dataset_revision }}"
        source_split: "{{ langfuse_docker_stage0_dataset_split }}"
    status_code: 200
  loop: "{{ langfuse_docker_stage0_dataset_rows.json.rows }}"
  loop_control:
    label: "{{ item.row.id }}"
  vars:
    _langfuse_stage0_existing_ids: >-
      {{ langfuse_docker_stage0_existing_items.json.data | map(attribute='id') | list }}
  when: ("typed-decisions-stage0-" ~ item.row.id) not in _langfuse_stage0_existing_ids
  no_log: true

- name: Read Stage 0 Langfuse code evaluators
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ langfuse_docker_web_port }}/api/public/v2/evaluators?limit=100"
    method: GET
    url_username: "{{ langfuse_docker_init_public_key }}"
    url_password: "{{ langfuse_docker_init_secret_key }}"
    force_basic_auth: true
    return_content: true
    status_code: 200
  register: langfuse_docker_stage0_evaluators
  changed_when: false
  no_log: true

- name: Read the Stage 0 evaluator source
  ansible.builtin.set_fact:
    langfuse_docker_stage0_evaluator_source: >-
      {{ lookup('file', role_path ~ '/files/evaluators/typed-decisions.ts') }}

- name: Select the Stage 0 typed-decisions evaluator
  ansible.builtin.set_fact:
    langfuse_docker_stage0_evaluator_matches: >-
      {{ langfuse_docker_stage0_evaluators.json.data
         | selectattr('name', 'equalto', langfuse_docker_stage0_evaluator_name) | list }}

- name: Require a single Stage 0 typed-decisions evaluator identity
  ansible.builtin.assert:
    that:
      - langfuse_docker_stage0_evaluator_matches | length <= 1
    fail_msg: >-
      More than one evaluator has the Stage 0 name; reconcile the project
      manually before changing evaluator definitions.

- name: Create the Stage 0 typed-decisions code evaluator when absent
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ langfuse_docker_web_port }}/api/public/v2/evaluators"
    method: POST
    url_username: "{{ langfuse_docker_init_public_key }}"
    url_password: "{{ langfuse_docker_init_secret_key }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ langfuse_docker_stage0_evaluator_name }}"
      description: "{{ langfuse_docker_stage0_evaluator_description }}"
      type: code
      sourceCodeLanguage: TYPESCRIPT
      sourceCode: "{{ langfuse_docker_stage0_evaluator_source }}"
    return_content: true
    status_code: 201
  when: langfuse_docker_stage0_evaluator_matches | length == 0
  no_log: true

- name: Update the Stage 0 typed-decisions evaluator when its source changes
  ansible.builtin.uri:
    url: >-
      {{ 'http://127.0.0.1:' ~ langfuse_docker_web_port
         ~ '/api/public/v2/evaluators/'
         ~ langfuse_docker_stage0_evaluator_matches[0].id }}
    method: PATCH
    url_username: "{{ langfuse_docker_init_public_key }}"
    url_password: "{{ langfuse_docker_init_secret_key }}"
    force_basic_auth: true
    body_format: json
    body:
      type: code
      sourceCodeLanguage: TYPESCRIPT
      sourceCode: "{{ langfuse_docker_stage0_evaluator_source }}"
    return_content: true
    status_code: 200
  when:
    - langfuse_docker_stage0_evaluator_matches | length == 1
    - langfuse_docker_stage0_evaluator_matches[0].sourceCode != langfuse_docker_stage0_evaluator_source
  no_log: true
