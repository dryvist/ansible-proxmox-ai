---
- name: Read native evaluator resource page
  ansible.builtin.uri:
    url: >-
      {{ langfuse_docker_public_api_url }}/v2/{{ langfuse_docker_api_resource }}?limit=100{{
      '&cursor=' ~ (langfuse_docker_api_cursor | urlencode) if langfuse_docker_api_cursor | length else '' }}
    status_code: 200
  register: langfuse_docker_cursor_page
  retries: 3
  delay: 1
  until: langfuse_docker_cursor_page.status | default(-1) == 200
  changed_when: false

- name: Accumulate native evaluator resource page
  ansible.builtin.set_fact:
    langfuse_docker_cursor_rows: "{{ langfuse_docker_cursor_rows + langfuse_docker_cursor_page.json.data }}"
    langfuse_docker_api_cursor: "{{ langfuse_docker_cursor_page.json.meta.cursor | default('', true) }}"

- name: Read remaining native evaluator resource pages
  ansible.builtin.include_tasks: read-native-cursor-page.yml
  when: langfuse_docker_api_cursor | length > 0
