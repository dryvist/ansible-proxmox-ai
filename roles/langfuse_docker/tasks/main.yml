---
# Langfuse v4 Docker deployment.
#
# Installs Docker + Compose on the target LXC, generates (and persists) the
# three application secrets on first run, then deploys langfuse-web +
# langfuse-worker + postgres + clickhouse + redis via Docker Compose with
# bind-mounted data under /opt/langfuse. Blob storage points at the homelab
# RustFS S3 (the bundled MinIO is dropped).
#
# Docker itself (docker-ce + compose plugin, fuse-overlayfs, the fuse-overlayfs
# daemon.json) is installed by the docker_engine meta dependency (meta/main.yml).
# No venv: Langfuse deploys via docker_compose_v2, which uses the docker compose
# CLI (not the docker SDK), so compose runs under the system interpreter.

# =============================================================================
# Langfuse Data Directories
# =============================================================================
# ClickHouse dirs are pre-owned by uid 101 because the service pins user 101:101
# (bypassing the image's root-entrypoint chown). Postgres and Redis dirs stay
# root-owned — those images chown their bind mount via the root entrypoint.

- name: Create Langfuse data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop: "{{ langfuse_docker_directories }}"
  loop_control:
    label: "{{ item.path }}"

# =============================================================================
# Application secrets (generate-once, persist on disk)
# =============================================================================
# NEXTAUTH_SECRET, SALT and ENCRYPTION_KEY must be stable across runs; persist
# each in a root-only file the first time the role runs and reuse it thereafter.
# ENCRYPTION_KEY must be 64 hex chars — SHA-256 of a random string yields exactly
# that; SALT / NEXTAUTH_SECRET accept any high-entropy string.

- name: Check for existing generated Langfuse secrets
  ansible.builtin.stat:
    path: "{{ langfuse_docker_data_dir }}/{{ item.file }}"
  loop: "{{ langfuse_docker_generated_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  register: langfuse_docker_secret_stats

- name: Generate Langfuse secrets (first run only)
  ansible.builtin.copy:
    dest: "{{ langfuse_docker_data_dir }}/{{ item.item.file }}"
    content: >-
      {{ (lookup('community.general.random_string', length=item.item.length,
                 upper=true, lower=true, numbers=true, special=false) | hash('sha256'))
         if item.item.hex
         else lookup('community.general.random_string', length=item.item.length,
                     upper=true, lower=true, numbers=true, special=false) }}
    owner: root
    group: root
    mode: "0600"
  loop: "{{ langfuse_docker_secret_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists
  no_log: true

- name: Read generated Langfuse secrets into memory
  ansible.builtin.slurp:
    src: "{{ langfuse_docker_data_dir }}/{{ item.file }}"
  loop: "{{ langfuse_docker_generated_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  register: langfuse_docker_secret_slurps
  no_log: true

- name: Resolve generated Langfuse secrets into a fact
  ansible.builtin.set_fact:
    langfuse_docker_secrets: "{{ dict(_langfuse_docker_secret_names | zip(_langfuse_docker_secret_values)) }}"
  vars:
    _langfuse_docker_secret_names: "{{ langfuse_docker_generated_secrets | map(attribute='name') | list }}"
    _langfuse_docker_secret_values: >-
      {{ langfuse_docker_secret_slurps.results
         | map(attribute='content') | map('b64decode') | map('trim') | list }}
  no_log: true

# =============================================================================
# Compose Deployment
# =============================================================================

- name: Assert every secret rendered into the Langfuse compose file is present
  ansible.builtin.include_tasks: >-
    {{ role_path }}/../openbao_secrets/tasks/assert_nonempty.yml
  vars:
    openbao_secrets_assert_context: the Langfuse compose file
    openbao_secrets_assert_names:
      - langfuse_docker_postgres_password
      - langfuse_docker_clickhouse_password
      - langfuse_docker_init_public_key
      - langfuse_docker_init_secret_key

# =============================================================================
# ClickHouse step upgrade
# =============================================================================
# ClickHouse must cross one minor line at a time; the deployed LTS cannot jump
# straight to the pinned tag. Walk the path first so the pinned tag is only ever
# reached from its immediate predecessor. Skipped entirely on a fresh install
# (nothing running yet) and on an already-converged host (no pending hops).

# The running tag decides which hops still have to be crossed, so this read is
# load-bearing. It used to carry `failed_when: false`: a failed read yielded an
# empty string, the hop walk was skipped entirely, and the pinned tag was
# templated in directly — bypassing the one-line-at-a-time protection this
# mechanism exists to provide, precisely when something had already gone wrong.
# It now fails closed. "Nothing is running" is a legitimate state on a fresh
# install and is reported explicitly as __none__, so it can no longer be
# confused with a read that failed.
- name: Read the running ClickHouse image tag
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      compose={{ langfuse_docker_data_dir }}/docker-compose.yml;
      [ -f "$compose" ] || { echo __none__; exit 0; };
      cid=$(docker compose -f "$compose" ps -q {{ langfuse_docker_clickhouse_service }}) || exit 1;
      [ -n "$cid" ] || { echo __none__; exit 0; };
      docker inspect -f '{{ '{{' }} .Config.Image {{ '}}' }}' "$cid" | awk -F: '{print $NF}'
  register: langfuse_docker_clickhouse_running
  changed_when: false

- name: Resolve the pending ClickHouse upgrade hops
  ansible.builtin.set_fact:
    langfuse_docker_clickhouse_pending_hops: >-
      {{ []
         if (langfuse_docker_clickhouse_running.stdout | trim) in ['', '__none__']
         else (langfuse_docker_clickhouse_upgrade_path
               | select('version', langfuse_docker_clickhouse_running.stdout | trim, '>')
               | list) }}

# Refuse a path the mechanism cannot walk safely, rather than walking it
# obediently. These check the mis-edits that are actually plausible: a pin
# bumped without extending the path, a hop added past the 26 boundary, or a
# host already running something newer than the pin.
- name: Refuse an unsafe ClickHouse upgrade path
  ansible.builtin.assert:
    that:
      - langfuse_docker_clickhouse_upgrade_path | reject('version', '26', '<') | list | length == 0
      - langfuse_docker_clickhouse_upgrade_path | last == langfuse_docker_clickhouse_version
      - >-
        (langfuse_docker_clickhouse_running.stdout | trim) in ['', '__none__']
        or (langfuse_docker_clickhouse_running.stdout | trim)
           is version(langfuse_docker_clickhouse_version, '<=')
    fail_msg: >-
      The declared ClickHouse upgrade path is not safe to walk. Every hop must
      be below 26 (upstream reports CORRUPTED_DATA on a 25 -> 26 upgrade), the
      path must terminate at the pinned version
      ({{ langfuse_docker_clickhouse_version }}), and the running server
      ({{ langfuse_docker_clickhouse_running.stdout | default('unknown') | trim }})
      must not already be newer than the pin — a downgrade is never safe.
    success_msg: >-
      ClickHouse upgrade path accepted:
      {{ langfuse_docker_clickhouse_upgrade_path | join(' -> ') }}
      (pending: {{ langfuse_docker_clickhouse_pending_hops | join(', ') | default('none', true) }})

# A restore point before the first hop. The archive is taken with the service
# stopped: a copy of a running ClickHouse is crash-consistent, which is fine
# for guest loss but is not a valid rollback point for a version upgrade. The
# hop loop starts the service again, so stopping here costs nothing extra.
#
# It lands on the same mount as the data it copies. That is deliberate and
# sufficient for its purpose — undoing a bad upgrade — and is explicitly not a
# substitute for the guest-level backup, which protects against losing the
# mount itself.
- name: Stop ClickHouse before taking the pre-upgrade archive
  community.docker.docker_compose_v2:
    project_src: "{{ langfuse_docker_data_dir }}"
    services:
      - "{{ langfuse_docker_clickhouse_service }}"
    state: stopped
  when: langfuse_docker_clickhouse_pending_hops | length > 0

- name: Measure the ClickHouse data directory and its free space
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      du -sk {{ langfuse_docker_clickhouse_data_dir }} | awk '{print $1}';
      df -Pk {{ langfuse_docker_data_dir }} | awk 'NR==2 {print $4}'
  register: langfuse_docker_clickhouse_space
  changed_when: false
  when: langfuse_docker_clickhouse_pending_hops | length > 0

- name: Require room for the pre-upgrade archive before touching the data
  ansible.builtin.assert:
    that:
      - (langfuse_docker_clickhouse_space.stdout_lines[1] | int)
        > (langfuse_docker_clickhouse_space.stdout_lines[0] | int)
    fail_msg: >-
      Not enough free space for the pre-upgrade ClickHouse archive:
      the data directory is
      {{ langfuse_docker_clickhouse_space.stdout_lines[0] | default(0) | int // 1024 }} MiB
      and only
      {{ langfuse_docker_clickhouse_space.stdout_lines[1] | default(0) | int // 1024 }} MiB
      are free. Free space or take the archive elsewhere; the upgrade is not
      started without a restore point.
  when: langfuse_docker_clickhouse_pending_hops | length > 0

- name: Archive the stopped ClickHouse data directory
  community.general.archive:
    path: "{{ langfuse_docker_clickhouse_data_dir }}"
    dest: >-
      {{ langfuse_docker_data_dir }}/clickhouse-preupgrade-{{
      langfuse_docker_clickhouse_running.stdout | trim }}.tar.gz
    format: gz
    owner: root
    group: root
    mode: "0600"
    force_archive: true
  when: langfuse_docker_clickhouse_pending_hops | length > 0

- name: Upgrade ClickHouse one release line at a time
  ansible.builtin.include_tasks: clickhouse_upgrade.yml
  vars:
    langfuse_docker_clickhouse_hop: "{{ item }}"
  loop: "{{ langfuse_docker_clickhouse_pending_hops }}"

- name: Deploy Langfuse docker-compose template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ langfuse_docker_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"  # contains datastore passwords + app secrets
  no_log: true
  notify: Restart langfuse

- name: Deploy Langfuse via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ langfuse_docker_data_dir }}"
    state: present
  register: langfuse_docker_compose_result
  changed_when: >-
    (langfuse_docker_compose_result.actions | default([]))
    | selectattr('status', 'in', ['Creating', 'Recreating', 'Pulling', 'Building'])
    | list | length > 0
  no_log: true

# =============================================================================
# Health Check
# =============================================================================
# First boot runs postgres + clickhouse migrations before the web server listens,
# so the port wait and the health poll are both generous.

- name: Wait for Langfuse web port to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ langfuse_docker_web_port }}"
    timeout: 180

- name: Verify Langfuse health endpoint responds
  ansible.builtin.uri:
    # The web container serves its health route under /api/public/health;
    # /api/health is the worker's route and 404s here on both 3.x and 4.x.
    url: "http://127.0.0.1:{{ langfuse_docker_web_port }}/api/public/health"
    method: GET
    status_code: 200
  register: langfuse_docker_health
  retries: 30
  delay: 10
  until: langfuse_docker_health.status == 200
  changed_when: false

- name: Verify Langfuse worker health endpoint responds
  ansible.builtin.uri:
    url: "http://127.0.0.1:3030/api/health?failIfQueueConsumptionStuck=true"
    method: GET
    status_code: 200
  register: langfuse_docker_worker_health
  retries: 30
  delay: 10
  until: langfuse_docker_worker_health.status == 200
  changed_when: false

# =============================================================================
# Headless Provisioning of LLM Provider
# =============================================================================

- name: Provision LiteLLM router in Langfuse
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ langfuse_docker_web_port }}/api/public/llm-connections"
    method: PUT
    url_username: "{{ langfuse_docker_init_public_key }}"
    url_password: "{{ langfuse_docker_init_secret_key }}"
    force_basic_auth: true
    body_format: json
    body:
      provider: "litellm-router"
      adapter: "openai"
      baseURL: "{{ langfuse_docker_router_base_url }}"
      secretKey: >-
        {{
          ai_orchestration_model_api_key |
          default(bao_local_llm_secrets.LLM_ROUTER_MASTER_KEY, true) |
          mandatory('LLM_ROUTER_MASTER_KEY missing: the OpenBao fetch did not
                     supply the router master key for the Langfuse connection')
        }}
    # PUT on this endpoint is an upsert: 200 when it updates an existing
    # connection, 201 when it creates one. Anything else — 401 on a bad init
    # key, 400 on a malformed body, 5xx from a half-started web container — is
    # a real failure. It used to be swallowed by `failed_when: false`, so a
    # Langfuse that never got its router connection still reported success.
    status_code: [200, 201]
  register: langfuse_docker_llm_connection
  changed_when: false
  # The request body carries the router master key.
  no_log: true
  failed_when: langfuse_docker_llm_connection.status not in [200, 201]
