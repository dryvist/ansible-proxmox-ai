---
galaxy_info:
  author: Jacob Evans
  description: >-
    Self-hosted Arize Phoenix (LLM tracing, evals, datasets/experiments,
    prompt playground) on an LXC container via Docker Compose, backed by
    Postgres. An OTLP sink fed by Cribl Stream, peer of Langfuse.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - bookworm
  galaxy_tags:
    - observability
    - llm
    - monitoring
    - docker

dependencies:
  # Shared Docker-in-LXC bootstrap (docker-ce + compose plugin, LXC-conditional
  # fuse-overlayfs). configure_daemon_json pins the fuse-overlayfs storage driver
  # (required on ZFS-backed LXC). No venv: deploys via docker_compose_v2 (CLI).
  - role: docker_engine
    docker_engine_configure_daemon_json: true

collections:
  - community.docker
  - community.general
