---
# Arize Phoenix Docker deployment.
#
# Seeds the session-signing secret in OpenBao (ai/phoenix), keeps an on-guest
# copy, then deploys phoenix + postgres via Docker Compose with the database bind-mounted
# under /opt/phoenix. Docker itself is installed by the docker_engine meta
# dependency (meta/main.yml). No venv: docker_compose_v2 drives the compose
# CLI, not the docker SDK.
#
# Ingest is NOT configured here. Cribl Stream (ansible-proxmox-apps) forks the
# fabric's OTLP traces to this guest's /v1/traces with the ingest API key; the
# key is minted in the Phoenix UI after first boot and seeded into OpenBao
# (ai/phoenix, PHOENIX_INGEST_API_KEY), where the Cribl role reads it.

# =============================================================================
# Data directories
# =============================================================================

- name: Create Phoenix data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop: "{{ phoenix_docker_directories }}"
  loop_control:
    label: "{{ item.path }}"

# =============================================================================
# Application secrets (stored in OpenBao, persisted on disk)
# =============================================================================
# PHOENIX_SECRET must be stable across runs (it signs every session and access
# token). The secret store (ai/phoenix) is the authority: a stored value is never
# replaced. An on-guest copy is imported when the store lacks the field, and is
# rewritten from the store when absent. A value is generated only when neither holds one.

- name: Check for existing Phoenix signing secret
  ansible.builtin.stat:
    path: "{{ phoenix_docker_data_dir }}/.phoenix_secret"
  register: phoenix_docker_secret_stat

- name: Read the Phoenix signing secret into memory
  ansible.builtin.slurp:
    src: "{{ phoenix_docker_data_dir }}/.phoenix_secret"
  register: phoenix_docker_secret_file
  when: phoenix_docker_secret_stat.stat.exists
  no_log: true

- name: Seed the Phoenix signing secret through the shared seed_generated task
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Store PHOENIX_SECRET in ai/phoenix, keeping any stored value
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ hostvars['localhost'].openbao_secrets_active_addr | default('', true) }}"
        openbao_secrets_seed_mount: "{{ openbao_secrets_kv_mount }}"
        openbao_secrets_seed_path: ai/phoenix
        openbao_secrets_seed_fields:
          - name: PHOENIX_SECRET
            length: 48
            charset: alnum
            value: >-
              {{ (phoenix_docker_secret_file.content | default('') | b64decode | trim)
                 if phoenix_docker_secret_stat.stat.exists else '' }}
        openbao_secrets_seed_token: "{{ openbao_secrets_converge_writer_token }}"
        openbao_secrets_seed_expected_writer_policy: ansible-converge
        openbao_secrets_seed_check_capabilities: "{{ not ansible_check_mode }}"
        openbao_secrets_seed_revoke_token: false
        openbao_secrets_seed_register: phoenix_docker_seed_result

- name: Resolve the Phoenix signing secret into a fact
  ansible.builtin.set_fact:
    phoenix_docker_secrets:
      phoenix_secret: "{{ phoenix_docker_seed_result.PHOENIX_SECRET }}"
  no_log: true

- name: Require the on-guest Phoenix signing secret to match the stored value
  ansible.builtin.assert:
    that:
      - (phoenix_docker_secret_file.content | b64decode | trim) == phoenix_docker_secrets.phoenix_secret
    fail_msg: >-
      The on-guest Phoenix signing secret differs from the stored PHOENIX_SECRET field.
      The stored value is authoritative and the guest file was not rewritten.
    quiet: true
  when: phoenix_docker_secret_stat.stat.exists
  no_log: true

- name: Write the on-guest Phoenix signing secret from the stored value when absent
  ansible.builtin.copy:
    dest: "{{ phoenix_docker_data_dir }}/.phoenix_secret"
    content: "{{ phoenix_docker_secrets.phoenix_secret }}"
    owner: root
    group: root
    mode: "0600"
  when: not phoenix_docker_secret_stat.stat.exists
  no_log: true

# =============================================================================
# Compose deployment
# =============================================================================

- name: Assert every secret rendered into the Phoenix compose file is present
  ansible.builtin.include_role:
    name: dryvist.homelab.openbao_secrets
    tasks_from: assert_nonempty.yml
  vars:
    openbao_secrets_required_vars:
      - phoenix_docker_postgres_password
      - phoenix_docker_admin_secret
      - phoenix_docker_default_admin_initial_password

- name: Prepare Phoenix pre-change database dump
  ansible.builtin.import_tasks: predump.yml
  tags: [phoenix_docker_predump]

- name: Deploy Phoenix docker-compose template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ phoenix_docker_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"  # contains the datastore password + app secrets
  no_log: true
  notify: Restart phoenix

- name: Deploy Phoenix via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ phoenix_docker_data_dir }}"
    state: present
  register: phoenix_docker_compose_result
  changed_when: >-
    (phoenix_docker_compose_result.actions | default([]))
    | selectattr('status', 'in', ['Creating', 'Recreating', 'Pulling', 'Building'])
    | list | length > 0
  no_log: true

# One-off app restart for a wedged span queue: -e phoenix_docker_restart=true
- name: Restart the Phoenix app container on request
  community.docker.docker_compose_v2:
    project_src: "{{ phoenix_docker_data_dir }}"
    services: [phoenix]
    state: restarted
  when: phoenix_docker_restart | default(false) | bool

# =============================================================================
# Health check
# =============================================================================
# First boot runs the Postgres migrations before the server listens, so the
# port wait and the health poll are both generous.

- name: Wait for Phoenix web port to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ phoenix_docker_web_port }}"
    timeout: 180

- name: Verify Phoenix health endpoint responds
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ phoenix_docker_web_port }}/healthz"
    method: GET
    status_code: 200
  register: phoenix_docker_health
  retries: 30
  delay: 10
  until: phoenix_docker_health.status == 200
  changed_when: false
  when: not ansible_check_mode

- name: Verify Phoenix Prometheus metrics endpoint responds
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ phoenix_docker_metrics_port }}/metrics"
    method: GET
    status_code: 200
  register: phoenix_docker_metrics_health
  retries: 6
  delay: 5
  until: phoenix_docker_metrics_health.status == 200
  changed_when: false
  when:
    - not ansible_check_mode
    - phoenix_docker_enable_prometheus | bool

# =============================================================================
# Trace retention policy
# =============================================================================
# PHOENIX_DEFAULT_RETENTION_POLICY_DAYS seeds the Default policy row on FIRST
# boot only — the upstream facilitator makes no changes once the row exists —
# so a deployment that booted before the variable was set keeps its old rule.
# Read the live policy through the admin GraphQL API (v21: strawberry schema,
# bearer-authenticated as the system user, which Phoenix treats as admin) and
# walk it down in steps of phoenix_docker_retention_step_days toward
# phoenix_docker_retention_days. Phoenix's hourly TraceDataSweeper applies
# MaxDaysRule with one unbounded DELETE of every trace past the limit (pinned
# source: server/retention.py, db/types/trace_retention.py), so a policy
# lowered straight to the target would purge the whole expired backlog in a
# single sweep. When the live rule carries no effective day limit (maxDays
# 0 or absent), the first step starts from the age in whole days of the
# oldest trace under the policy — Project.startTime resolves to
# min(trace.start_time) in the pinned source (server/api/types/Project.py) —
# minus the step, never below the target. The policy's projects connection
# is a relay connection over an unordered project list (pinned source:
# server/api/types/ProjectTraceRetentionPolicy.py), so the oldest start time
# is read by walking every page of it — a single first: 100 page can miss
# the true oldest and drop the step far past one step's worth of traces.
# The walk is bounded by phoenix_docker_retention_max_project_pages; when
# pages remain after the bound is spent, the converge fails before the
# patch instead of stepping from a partial walk. Raising the limit, or a
# live value already within one step of the target, sets the target directly.

- name: Read the live Phoenix default trace retention policy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ phoenix_docker_web_port }}/graphql"
    method: POST
    headers:
      Authorization: "Bearer {{ phoenix_docker_admin_secret }}"
    body_format: json
    body:
      query: >-
        query DefaultTraceRetentionPolicy {
          defaultProjectTraceRetentionPolicy {
            id
            rule {
              __typename
              ... on TraceRetentionRuleMaxDays {
                maxDays
              }
            }
          }
        }
    status_code: 200
  register: phoenix_docker_retention_current
  changed_when: false
  failed_when: >-
    (phoenix_docker_retention_current.json.errors | default([])) | length > 0
  no_log: true
  when: not ansible_check_mode

- name: Require the live Phoenix default trace retention policy to be readable
  ansible.builtin.assert:
    that:
      - phoenix_docker_retention_current.json.errors is not defined
      - >-
        phoenix_docker_retention_current.json.data.defaultProjectTraceRetentionPolicy.id
        is defined
    fail_msg: Phoenix did not return the default trace retention policy.
    quiet: true
  when: not ansible_check_mode

- name: Seed the project page walk under the default policy when the rule has no day limit
  ansible.builtin.set_fact:
    phoenix_docker_retention_project_start_times: []
    phoenix_docker_retention_projects_cursor: ""
    phoenix_docker_retention_projects_has_next: true
  changed_when: false
  when:
    - not ansible_check_mode
    - >-
      phoenix_docker_retention_current.json.data.defaultProjectTraceRetentionPolicy.rule.maxDays
      | default(0) | int <= 0

- name: Read the oldest trace times under the default policy when the rule has no day limit
  ansible.builtin.include_tasks: retention_project_page.yml
  loop: "{{ range(0, phoenix_docker_retention_max_project_pages | int) | list }}"
  loop_control:
    label: "project page {{ item + 1 }}"
  when:
    - not ansible_check_mode
    - >-
      phoenix_docker_retention_current.json.data.defaultProjectTraceRetentionPolicy.rule.maxDays
      | default(0) | int <= 0

- name: Require the project page walk to have covered every project
  ansible.builtin.assert:
    that:
      - not (phoenix_docker_retention_projects_has_next | default(false) | bool)
    fail_msg: >-
      The project start-time walk reached its page bound with pages still
      unreported, so the first retention step must not be computed from a
      partial walk.
    quiet: true
  when:
    - not ansible_check_mode
    - >-
      phoenix_docker_retention_current.json.data.defaultProjectTraceRetentionPolicy.rule.maxDays
      | default(0) | int <= 0

- name: Compute the retention step toward the configured days
  vars:
    phoenix_docker_retention_live_days: >-
      {{ phoenix_docker_retention_current.json.data.defaultProjectTraceRetentionPolicy.rule.maxDays
      | default(0) | int }}
    phoenix_docker_retention_starts: >-
      {{ phoenix_docker_retention_project_start_times | default([]) }}
    phoenix_docker_retention_oldest_days: >-
      {{ ((now(utc=true)
      - ((phoenix_docker_retention_starts | min
      | regex_replace('\.\d+', '') | regex_replace('Z$', '+00:00'))
      | to_datetime('%Y-%m-%dT%H:%M:%S%z'))).days)
      if phoenix_docker_retention_starts else 0 }}
    phoenix_docker_retention_next_days: >-
      {{ ([phoenix_docker_retention_days | int,
      (phoenix_docker_retention_oldest_days - phoenix_docker_retention_step_days | int)] | max)
      if phoenix_docker_retention_live_days | int <= 0
      else ([phoenix_docker_retention_days | int,
      (phoenix_docker_retention_live_days | int - phoenix_docker_retention_step_days | int)] | max) }}
  ansible.builtin.set_fact:
    phoenix_docker_retention_live_days: "{{ phoenix_docker_retention_live_days }}"
    phoenix_docker_retention_next_days: "{{ phoenix_docker_retention_next_days }}"
  changed_when: false
  when: not ansible_check_mode

- name: Patch the Phoenix default trace retention policy when it differs
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ phoenix_docker_web_port }}/graphql"
    method: POST
    headers:
      Authorization: "Bearer {{ phoenix_docker_admin_secret }}"
    body_format: json
    body: >-
      {{ {'query': phoenix_docker_retention_mutation,
          'variables': {'input': {'id':
          phoenix_docker_retention_current.json.data.defaultProjectTraceRetentionPolicy.id,
          'rule': {'maxDays': {'maxDays':
          phoenix_docker_retention_next_days | int} } } } } }}
    status_code: 200
  register: phoenix_docker_retention_patch
  changed_when: true
  failed_when: >-
    (phoenix_docker_retention_patch.json.errors | default([])) | length > 0
  vars:
    phoenix_docker_retention_mutation: |-
      mutation PatchDefaultTraceRetentionPolicy(
        $input: PatchProjectTraceRetentionPolicyInput!
      ) {
        patchProjectTraceRetentionPolicy(input: $input) {
          node { id }
        }
      }
  no_log: true
  when:
    - not ansible_check_mode
    - >-
      phoenix_docker_retention_next_days | int
      != phoenix_docker_retention_live_days | int

- name: Report the retention step applied to the live policy
  ansible.builtin.debug:
    msg: >-
      Phoenix trace retention maxDays
      {{ 'unlimited' if phoenix_docker_retention_live_days | int <= 0
      else phoenix_docker_retention_live_days | int }}
      -> {{ phoenix_docker_retention_next_days | int }}
      (step {{ phoenix_docker_retention_step_days | int }})
  changed_when: false
  when: phoenix_docker_retention_patch is not skipped
