---
# Arize Phoenix Docker deployment.
#
# Seeds the session-signing secret in OpenBao (ai/phoenix), keeps an on-guest
# copy, then deploys phoenix + postgres via Docker Compose with the database bind-mounted
# under /opt/phoenix. Docker itself is installed by the docker_engine meta
# dependency (meta/main.yml). No venv: docker_compose_v2 drives the compose
# CLI, not the docker SDK.
#
# Ingest is NOT configured here. Cribl Stream (ansible-proxmox-apps) forks the
# fabric's OTLP traces to this guest's /v1/traces with the ingest API key; the
# key is minted in the Phoenix UI after first boot and seeded into OpenBao
# (ai/phoenix, PHOENIX_INGEST_API_KEY), where the Cribl role reads it.

# =============================================================================
# Data directories
# =============================================================================

- name: Create Phoenix data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop: "{{ phoenix_docker_directories }}"
  loop_control:
    label: "{{ item.path }}"

# =============================================================================
# Application secrets (stored in OpenBao, persisted on disk)
# =============================================================================
# PHOENIX_SECRET must be stable across runs (it signs every session and access
# token). The secret store (ai/phoenix) is the authority: a stored value is never
# replaced. An on-guest copy is imported when the store lacks the field, and is
# rewritten from the store when absent. A value is generated only when neither holds one.

- name: Check for existing Phoenix signing secret
  ansible.builtin.stat:
    path: "{{ phoenix_docker_data_dir }}/.phoenix_secret"
  register: phoenix_docker_secret_stat

- name: Read the Phoenix signing secret into memory
  ansible.builtin.slurp:
    src: "{{ phoenix_docker_data_dir }}/.phoenix_secret"
  register: phoenix_docker_secret_file
  when: phoenix_docker_secret_stat.stat.exists
  no_log: true

- name: Seed the Phoenix signing secret through the shared seed_generated task
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Store PHOENIX_SECRET in ai/phoenix, keeping any stored value
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ hostvars['localhost'].openbao_secrets_active_addr | default('', true) }}"
        openbao_secrets_seed_mount: "{{ openbao_secrets_kv_mount }}"
        openbao_secrets_seed_path: ai/phoenix
        openbao_secrets_seed_fields:
          - name: PHOENIX_SECRET
            length: 48
            charset: alnum
            value: >-
              {{ (phoenix_docker_secret_file.content | default('') | b64decode | trim)
                 if phoenix_docker_secret_stat.stat.exists else '' }}
        openbao_secrets_seed_token: "{{ lookup('ansible.builtin.env', 'BAO_TOKEN') }}"
        openbao_secrets_seed_expected_writer_policy: ansible-converge
        openbao_secrets_seed_check_capabilities: "{{ not ansible_check_mode }}"
        openbao_secrets_seed_revoke_token: false
        openbao_secrets_seed_register: phoenix_docker_seed_result

- name: Resolve the Phoenix signing secret into a fact
  ansible.builtin.set_fact:
    phoenix_docker_secrets:
      phoenix_secret: "{{ phoenix_docker_seed_result.PHOENIX_SECRET }}"
  no_log: true

- name: Require the on-guest Phoenix signing secret to match the stored value
  ansible.builtin.assert:
    that:
      - (phoenix_docker_secret_file.content | b64decode | trim) == phoenix_docker_secrets.phoenix_secret
    fail_msg: >-
      The on-guest Phoenix signing secret differs from the stored PHOENIX_SECRET field.
      The stored value is authoritative and the guest file was not rewritten.
    quiet: true
  when: phoenix_docker_secret_stat.stat.exists
  no_log: true

- name: Write the on-guest Phoenix signing secret from the stored value when absent
  ansible.builtin.copy:
    dest: "{{ phoenix_docker_data_dir }}/.phoenix_secret"
    content: "{{ phoenix_docker_secrets.phoenix_secret }}"
    owner: root
    group: root
    mode: "0600"
  when: not phoenix_docker_secret_stat.stat.exists
  no_log: true

# =============================================================================
# Compose deployment
# =============================================================================

- name: Assert every secret rendered into the Phoenix compose file is present
  ansible.builtin.include_role:
    name: dryvist.homelab.openbao_secrets
    tasks_from: assert_nonempty.yml
  vars:
    openbao_secrets_required_vars:
      - phoenix_docker_postgres_password
      - phoenix_docker_admin_secret
      - phoenix_docker_default_admin_initial_password

- name: Prepare Phoenix pre-change database dump
  ansible.builtin.import_tasks: predump.yml
  tags: [phoenix_docker_predump]

- name: Deploy Phoenix docker-compose template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ phoenix_docker_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"  # contains the datastore password + app secrets
  no_log: true
  notify: Restart phoenix

- name: Deploy Phoenix via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ phoenix_docker_data_dir }}"
    state: present
  register: phoenix_docker_compose_result
  changed_when: >-
    (phoenix_docker_compose_result.actions | default([]))
    | selectattr('status', 'in', ['Creating', 'Recreating', 'Pulling', 'Building'])
    | list | length > 0
  no_log: true

# One-off app restart for a wedged span queue: -e phoenix_docker_restart=true
- name: Restart the Phoenix app container on request
  community.docker.docker_compose_v2:
    project_src: "{{ phoenix_docker_data_dir }}"
    services: [phoenix]
    state: restarted
  when: phoenix_docker_restart | default(false) | bool

# =============================================================================
# Health check
# =============================================================================
# First boot runs the Postgres migrations before the server listens, so the
# port wait and the health poll are both generous.

- name: Wait for Phoenix web port to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ phoenix_docker_web_port }}"
    timeout: 180

- name: Verify Phoenix health endpoint responds
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ phoenix_docker_web_port }}/healthz"
    method: GET
    status_code: 200
  register: phoenix_docker_health
  retries: 30
  delay: 10
  until: phoenix_docker_health.status == 200
  changed_when: false
  when: not ansible_check_mode

- name: Verify Phoenix Prometheus metrics endpoint responds
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ phoenix_docker_metrics_port }}/metrics"
    method: GET
    status_code: 200
  register: phoenix_docker_metrics_health
  retries: 6
  delay: 5
  until: phoenix_docker_metrics_health.status == 200
  changed_when: false
  when:
    - not ansible_check_mode
    - phoenix_docker_enable_prometheus | bool
