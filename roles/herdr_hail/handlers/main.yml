---
# Gated like the tasks that notify it. A handler is NOT covered by the
# `when:` on the task that notifies it, and `--skip-tags` does not reach it
# either — so without this the restart fires in an environment that has no
# such unit (a molecule container, or any host where the guest has not been
# converged yet) and fails the play after the template task has already
# succeeded.
- name: Restart herdr-hail
  when: herdr_hail_deploy_enabled | bool
  ansible.builtin.systemd_service:
    name: herdr-hail
    state: restarted
    daemon_reload: true
