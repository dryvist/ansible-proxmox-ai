---
llamaindex_data_dir: /opt/llamaindex

# Route this unit's journal records through the dedicated Cribl Stream input
# published by tofu-proxmox. Without the inventory artifact (for example,
# molecule), no remote route is rendered; with it, a missing source-map port
# fails closed instead of guessing a listener.
llamaindex_syslog_route_enabled: "{{ tofu_data is defined }}"
llamaindex_syslog_rsyslog_config_path: /etc/rsyslog.d/05-llamaindex.conf
llamaindex_syslog_host: "syslog.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
llamaindex_syslog_port: >-
  {{ tofu_data.constants.ai_log_routing.llamaindex.port
     | mandatory('ai_log_routing.llamaindex.port missing from tofu constants') }}
llamaindex_syslog_queue_max_disk_space: 256m

# Embeddings come from the fabric router (OpenAI-compatible); the local
# Ollama sidecar is retired. "embed" is the router's stable ROLE alias
# (roles/llm_router/defaults/main/55-roles.yml declares `- role: embed`,
# resolving to whichever registry entry the `embedding` flag names) — never
# a physical model id, so a future re-target of the embedding model needs no
# change here.
llamaindex_embed_model: "embed"
llamaindex_router_base_url: >-
  https://llm.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  or undef('PROXMOX_SUBDOMAIN required') }}/v1
# Own scoped router key (56-virtual-keys.yml alias: llamaindex) — every
# consumer gets its own key, never the shared master key.
llamaindex_router_api_key: >-
  {{ bao_apps_secrets.llamaindex_llm_router_key
     | mandatory('llamaindex_llm_router_key is not seeded: run the apps openbao provisioning first') }}
llamaindex_qdrant_api_key: >-
  {{ (bao_local_llm_secrets | default({}))['QDRANT_API_KEY']
     | mandatory('QDRANT_API_KEY must be set in the environment') }}
# llamaindex_qdrant_host is injected from hostvars (inventory) and
# llamaindex_qdrant_port from tofu_data.constants at the playbook level
# (deploy orchestration is a tracked follow-up; until then the consuming
# playbook supplies both) to keep the role decoupled from inventory.

# --- RAG indexing ------------------------------------------------------------
# The indexer (index_docs.py) turns the otherwise-idle Qdrant into a queryable
# index. It embeds each source via the router and rebuilds one collection.
llamaindex_qdrant_collection: homelab_docs
# Install + enable the systemd timer that periodically rebuilds the index.
llamaindex_index_enabled: true
# systemd OnCalendar for the refresh timer (daily; off the :00 mark).
llamaindex_index_on_calendar: "*-*-* 06:45:00 UTC"
# Documents to index. Each source has a name, either a `url` or a `path`, and
# a `required` flag (default false). A url source may name a Cloudflare
# Access service-token env pair; the indexer skips that source (non-fatal)
# when the env is absent, so a converge without the token still indexes every
# reachable source — required: false on such a source reflects that it is
# EXPECTED to be skippable, not a promise it will always resolve. A source
# with required: true failing to resolve fails the indexer run instead of
# silently shrinking the index (see tasks/assert_hardening.yml for the
# converge-time half of this, and index_docs.py for the run-time half).
llamaindex_sources:
  - name: public-docs
    url: "https://docs.jacobpevans.com/llms-full.txt"
    required: true
  - name: dryvist-docs
    url: "https://docs.dryvist.com/llms-full.txt"
    cf_access_client_id_env: CF_ACCESS_CLIENT_ID
    cf_access_client_secret_env: CF_ACCESS_CLIENT_SECRET
    required: false
  - name: ai-stack-registry
    path: "{{ llamaindex_data_dir }}/registry.json"
    # Only required when this same role actually renders the file (see
    # llamaindex_registry_enabled below): required: true here when
    # tofu_data is absent (molecule, and any future no-inventory run) would
    # fail every converge on a file the role never promised to create.
    required: "{{ llamaindex_registry_enabled | default(true) and tofu_data is defined }}"
# Render the service-registry doc (ports/endpoints from tofu_data.constants) so
# the index also covers the service registry. Skipped when tofu_data is absent
# (e.g. molecule), leaving the ai-stack-registry source to skip its missing file.
llamaindex_registry_enabled: true

# --- Hardening ----------------------------------------------------------------
# Touched by index_docs.py after each successful (non-dry-run) index build.
# The converge-time probe below (tasks/assert_hardening.yml) fails when this
# file exists and is older than the max age — it does NOT fail when the file
# has never been created, since a brand-new host has no successful run yet.
llamaindex_freshness_sentinel: "{{ llamaindex_data_dir }}/.last_successful_index"
llamaindex_freshness_max_age_hours: 48

# --- Agent-session index -----------------------------------------------------
# This independent incremental index never shares index_docs.py's rebuild path.
# Enable only after the Splunk search token is seeded at apps/llamaindex.
llamaindex_agent_sessions_enabled: false
llamaindex_agent_sessions_collection: agent_sessions
llamaindex_agent_sessions_on_calendar: "*-*-* 06:50:00 UTC"
llamaindex_agent_sessions_config_path: "{{ llamaindex_data_dir }}/agent_sessions.yaml"
llamaindex_agent_sessions_watermark_path: "{{ llamaindex_data_dir }}/agent_sessions-watermarks.json"
llamaindex_splunk_url: ""
llamaindex_splunk_search_token: >-
  {{ bao_apps_secrets.splunk_search_token
     | mandatory('splunk_search_token is not seeded at apps/llamaindex') }}
llamaindex_agent_sessions_harnesses:
  - name: claude
    index: claude
    role_field: message.role
    content_field: message.content
    session_field: session_id
    cwd_field: cwd
  - name: codex
    index: codex
    role_field: message.role
    content_field: message.content
    session_field: session_id
    cwd_field: cwd
  - name: gemini
    index: gemini
    role_field: message.role
    content_field: message.content
    session_field: session_id
    cwd_field: cwd
