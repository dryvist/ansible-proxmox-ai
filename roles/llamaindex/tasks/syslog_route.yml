---
# rsyslog ingests the system journal on Debian. Forward only the indexer unit
# to its dedicated Cribl Stream input; `stop` prevents duplicate catch-all
# shipping to the general OS log index.
- name: Install rsyslog for LlamaIndex log forwarding
  ansible.builtin.apt:
    name: rsyslog
    state: present
    update_cache: false

- name: Deploy the LlamaIndex rsyslog forwarding ruleset
  ansible.builtin.template:
    src: llamaindex-rsyslog.conf.j2
    dest: "{{ llamaindex_syslog_rsyslog_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart llamaindex rsyslog

- name: Validate the full rsyslog configuration
  ansible.builtin.command: rsyslogd -N1
  changed_when: false

- name: Enable and start rsyslog for LlamaIndex
  ansible.builtin.systemd:
    name: rsyslog
    state: started
    enabled: true
