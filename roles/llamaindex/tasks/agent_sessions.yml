---
- name: Require the Splunk search endpoint when agent-session indexing is enabled
  ansible.builtin.assert:
    that:
      - llamaindex_splunk_url | length > 0
    fail_msg: llamaindex_splunk_url must be set when agent-session indexing is enabled

- name: Render the agent-session indexer configuration
  ansible.builtin.template:
    src: llamaindex-agent-sessions.yaml.j2
    dest: "{{ llamaindex_agent_sessions_config_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Deploy the agent-session indexer script
  ansible.builtin.copy:
    src: index_agent_sessions.py
    dest: "{{ llamaindex_data_dir }}/index_agent_sessions.py"
    owner: root
    group: root
    mode: "0750"

- name: Install the agent-session indexing systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - llamaindex-agent-sessions.service
    - llamaindex-agent-sessions.timer

- name: Enable the agent-session indexing timer
  ansible.builtin.systemd:
    name: llamaindex-agent-sessions.timer
    enabled: true
    state: started
    daemon_reload: true
