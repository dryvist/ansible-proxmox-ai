---
# Entire scaler object is published by tofu as constants.llm_cpu_scaler.
# This role MUST NOT restate name, paths, tags, or timing knobs — they are
# derived once in modules/proxmox-stack/constants-llm-cpu-scaler.tf.
#
# Required: tofu_data.constants.llm_cpu_scaler (regenerate inventory if absent).

llm_cpu_scaler: "{{ tofu_data.constants.llm_cpu_scaler | mandatory('tofu_data.constants.llm_cpu_scaler missing — regenerate tofu inventory after the llm_cpu_scaler constants land') }}"

llm_cpu_scaler_router_base_url: "http://127.0.0.1:{{ llm_router_api_port }}"
