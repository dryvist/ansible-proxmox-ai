---
- name: Require the existing caller binding before selecting the facade
  ansible.builtin.assert:
    that:
      - hermes_agent_vikunja_mcp_enabled | bool
      - >-
        hermes_agent_gateway_key_field is string and
        hermes_agent_gateway_key_field | trim | length > 0
      - >-
        (ai_agent_gateway_key_fields | default({}, true)).get(hermes_agent_id, '') is string and
        (ai_agent_gateway_key_fields | default({}, true)).get(hermes_agent_id, '') | trim | length > 0
      - >-
        hermes_agent_gateway_key_field ==
        (ai_agent_gateway_key_fields | default({}, true)).get(hermes_agent_id, '')
      - >-
        (openbao_secrets_by_domain | default({}, true))
        .get(hermes_agent_id, {})
        .get(hermes_agent_gateway_key_field, '') is string and
        (openbao_secrets_by_domain | default({}, true))
        .get(hermes_agent_id, {})
        .get(hermes_agent_gateway_key_field, '') | trim | length > 0
      - >-
        hermes_agent_facade_base_url is string and
        hermes_agent_facade_base_url is match('^https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?$')
    fail_msg: >-
      The Vikunja facade canary requires an enabled client, a valid base URL,
      and the existing identity-bound gateway key.
  when: hermes_agent_facade_canary_enabled | bool
