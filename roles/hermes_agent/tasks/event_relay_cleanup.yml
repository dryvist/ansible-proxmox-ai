---
- name: Gather services for the retired event relay
  ansible.builtin.service_facts:

- name: Stop and disable the retired event relay
  ansible.builtin.systemd_service:
    name: hermes-event-relay.service
    state: stopped
    enabled: false
  when: "'hermes-event-relay.service' in ansible_facts.services"

- name: Remove the retired event relay artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/hermes-event-relay.service
    - /usr/local/libexec/hermes-event-relay.py
    - /usr/local/libexec/hermes_event_relay_dify.py
    - /etc/hermes-event-relay.env
    - /opt/hermes-event-relay
  notify: Reload systemd after event relay cleanup
