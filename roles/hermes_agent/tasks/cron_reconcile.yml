---
# The agentic direct-deliver cron fleet (every recurring report/sweep/digest
# workload, docs-sync included). The Slack channel is never hardcoded: skip
# the whole fleet with a loud warning when NEITHER the shared digest channel
# NOR the general Slack capability gate is satisfied (most entries carry their
# own `deliver:` and do not depend on the shared digest channel).
# `hermes cron create --script` resolves the script inside the job's own Hermes
# home, so a script job homed in a named profile needs its copy there too.
- name: Read which profile homes that run a script job exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ hermes_agent_profile_script_jobs | map(attribute='hermes_home') | unique | list }}"
  register: hermes_agent_profile_script_homes
  check_mode: false

# Only an existing profile home gets a scripts directory: creating the home here
# would mask a missing profile from the direct-batch preflight.
- name: Create the scripts directory of each profile home that runs a script job
  ansible.builtin.file:
    path: "{{ item.item }}/scripts"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
  loop: "{{ hermes_agent_profile_script_homes.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Place each profile script job's script in that profile's scripts directory
  ansible.builtin.copy:
    src: "{{ hermes_agent_hermes_home }}/scripts/{{ item.script }}"
    dest: "{{ item.hermes_home }}/scripts/{{ item.script }}"
    remote_src: true
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
  loop: "{{ hermes_agent_profile_script_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  # A check run on a fresh host has no deployed source script to copy.
  when:
    - >-
      item.hermes_home in (hermes_agent_profile_script_homes.results
      | selectattr('stat.exists') | map(attribute='item') | list)
    - not ansible_check_mode

- name: Warn when Slack is not configured (direct-deliver crons skipped)
  ansible.builtin.debug:
    msg: >-
      Neither hermes_agent_digest_slack_channel nor the Slack bot/app
      token + home channel are set — skipping all
      {{ hermes_agent_direct_cron_jobs_owned | length }} agentic direct-deliver
      crons.
  when:
    - hermes_agent_id != 'pepper'
    - hermes_agent_digest_slack_channel | length == 0
    - >-
      hermes_agent_slack_bot_token | length == 0
      or hermes_agent_slack_app_token | length == 0
      or hermes_agent_slack_home_channel | length == 0

- name: Read the installed cron jobs and desired-state markers once
  ansible.builtin.include_tasks:
    file: cron_reconcile_direct_batch.yml
    apply:
      tags: hermes_crons
  tags: hermes_crons

- name: Read Pepper complete native cron inventory
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_venv_python }}"
      - -c
      - "import json; from cron.jobs import list_jobs; print(json.dumps(list_jobs(include_disabled=True)))"
  args:
    chdir: "{{ hermes_agent_install_dir }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_pepper_native_cron
  changed_when: false
  when: hermes_agent_id == 'pepper'

- name: Find inherited Pepper profile cron stores
  ansible.builtin.find:
    paths: "{{ hermes_agent_hermes_home }}"
    patterns: jobs.json
    recurse: true
  register: hermes_agent_pepper_cron_stores
  when: hermes_agent_id == 'pepper'

- name: Assert Pepper owns only its declared jobs
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        hermes_agent_direct_cron_jobs_owned | map(attribute='name') | sort | list
        == ['pepper-nightly-intake', 'pepper-weekly-digest']
      - >-
        (hermes_agent_pepper_native_cron.stdout | from_json)
        | map(attribute='name') | difference(['pepper-nightly-intake', 'pepper-weekly-digest']) | length == 0
      - >-
        hermes_agent_pepper_cron_stores.files | map(attribute='path')
        | difference([hermes_agent_hermes_home ~ '/cron/jobs.json']) | length == 0
      - >-
        hermes_agent_pepper_digest_deliver | length == 0
        or hermes_agent_pepper_digest_deliver == 'local'
        or (hermes_agent_pepper_digest_deliver is match('^slack:')
            and hermes_agent_slack_bot_token | length > 0
            and hermes_agent_slack_app_token | length > 0)
    fail_msg: Pepper has unmanaged jobs or an unavailable delivery target.
  when: hermes_agent_id == 'pepper'

- name: Read Pepper system crontab
  ansible.builtin.command:
    argv: [crontab, -l, -u, "{{ hermes_agent_user }}"]
  register: hermes_agent_pepper_system_cron
  changed_when: false
  failed_when: hermes_agent_pepper_system_cron.rc not in [0, 1]
  when: hermes_agent_id == 'pepper'

- name: Reject inherited Pepper system crontab entries
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        hermes_agent_pepper_system_cron.stdout_lines | default([])
        | reject('match', '^\s*(#|$)') | list | length == 0
    fail_msg: Pepper requires a fresh cron inventory.
  when: hermes_agent_id == 'pepper'

- name: Reconcile the agentic direct-deliver digest crons
  ansible.builtin.include_tasks:
    file: reconcile_direct_cron.yml
    apply:
      tags: hermes_crons
  tags: hermes_crons
  loop: "{{ hermes_agent_direct_cron_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    hermes_agent_id == 'pepper'
    or hermes_agent_digest_slack_channel | length > 0
    or (hermes_agent_slack_bot_token | length > 0
        and hermes_agent_slack_app_token | length > 0
        and hermes_agent_slack_home_channel | length > 0)

# The gateway ticks every profile home in-process and sends a satellite's Slack
# output through the primary's profile route. A standalone per-profile
# `hermes cron tick` has no adapters, so it fired first and dropped each report
# ("platform 'slack' not configured/enabled"). Remove those crontab entries.
- name: Remove the retired per-profile cron tick triggers
  ansible.builtin.cron:
    name: "hermes-cron-tick-{{ item }}"
    user: "{{ hermes_agent_user }}"
    state: absent
  loop: "{{ hermes_agent_profiles | map(attribute='name') | list }}"

# No daily backfill safety net any more: it existed to re-create a slot-keyed
# Kanban card a missed fire would otherwise drop forever. Recurring work is a
# cron job now (native [SILENT] delivery suppression already handles "nothing
# new to report"), and docs-sync's per-run key means a missed fire is simply a
# card that never got created that week — nothing to backfill.

# The script-fed Splunk status digest: a --no-agent --script cron whose stdout
# (real numbers the script gathered itself) is delivered verbatim to Slack. No
# LLM in the fact path — nothing to poison. Replaces the LLM digest paths.
- name: Reconcile the script-fed Splunk status-digest cron
  ansible.builtin.include_tasks:
    file: reconcile_enqueuer_cron.yml
    apply:
      tags: hermes_crons
  tags: hermes_crons
  vars:
    item:
      name: "{{ hermes_agent_splunk_status_digest_cron_name }}"
      system: splunk
      schedule: "{{ hermes_agent_splunk_status_digest_cron_schedule }}"
      script: "{{ hermes_agent_splunk_status_digest_script_name }}"
      deliver: "slack:{{ hermes_agent_splunk_status_digest_channel }}"
      enabled: >-
        {{ hermes_agent_splunk_status_digest_enabled | bool }}

# The master Kanban digest cron: same --no-agent --script contract. Deliberately
# NOT added to hermes_agent_seeded_cron_names — brain-fleet reconciliation must
# not pause the digest that reports a wedged board.
- name: Reconcile the master Kanban digest cron
  ansible.builtin.include_tasks:
    file: reconcile_enqueuer_cron.yml
    apply:
      tags: hermes_crons
  tags: hermes_crons
  vars:
    item:
      name: "{{ hermes_agent_kanban_digest_cron_name }}"
      schedule: "{{ hermes_agent_kanban_digest_cron_schedule }}"
      script: "{{ hermes_agent_kanban_digest_script_name }}"
      deliver: "slack:{{ hermes_agent_kanban_digest_channel }}"
      enabled: >-
        {{ hermes_agent_kanban_digest_enabled | bool
           and hermes_agent_ops_workload_enabled | bool }}

# Splunk triage, pr-reconcile and repo-crawl reconciles: split to their own
# file (token budget).
- name: Reconcile the Splunk-triage, PR-reconcile and repo-crawl crons
  ansible.builtin.include_tasks:
    file: cron_reconcile_pr_repo_crawl.yml
    apply:
      tags: hermes_crons
  tags: hermes_crons

# Retire the hand-created LLM digest direct cron the script-fed digest replaces:
# pause it (disable-don't-delete) so the two never double-post. `cron list` shows
# only ENABLED jobs, so this is a clean no-op once the job is paused.
- name: List active Hermes crons (to retire the superseded LLM digests)
  ansible.builtin.command: "{{ hermes_agent_bin }} {{ hermes_agent_cli_profile_args | join(' ') }} cron list"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_active_cron_list
  changed_when: false
  check_mode: false
  when: not (ansible_check_mode and (hermes_agent_install.changed | default(false)))
  # Always needed now: pausing the three now-superseded *-v2 crons below
  # (zammad/github/summary) is unconditional, not a staged-rollout toggle.

- name: Pause retired Hermes direct crons
  ansible.builtin.include_tasks:
    file: cron_reconcile_retired_pauses.yml
    apply:
      tags: hermes_crons
  tags: hermes_crons

# The 3 *-v2 crons the reframe duplicates under a bare name.
- name: Pause the direct crons the reframe replaced 1-for-1
  ansible.builtin.command: >-
    {{ hermes_agent_bin }} {{ hermes_agent_cli_profile_args | join(' ') }}
    cron pause {{ item }}
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  loop:
    - zammad-incident-review-v2
    - github-org-triage-v2
    - daily-operator-summary-v2
  when: item in (hermes_agent_active_cron_list.stdout | default(''))

- name: Pause the direct crons declared disabled
  ansible.builtin.include_tasks:
    file: cron_pause_disabled.yml
    apply:
      tags: hermes_crons
  tags: hermes_crons
  when: not ansible_check_mode

# Wired-memory-ceiling trajectory watch (see defaults/main/102-wired-trajectory.yml
# for the full precondition). hermes_agent_wired_trajectory_enabled is false
# until index=mac_perf is confirmed carrying macos-wired-memory events AND that
# confirmation flag is flipped by hand — a disabled job here is skipped
# entirely (no create, no remove), so this stays inert at converge until then.
- name: Reconcile the wired-memory trajectory watch cron
  ansible.builtin.include_tasks:
    file: reconcile_enqueuer_cron.yml
    apply:
      tags: hermes_crons
  tags: hermes_crons
  vars:
    item:
      name: "{{ hermes_agent_wired_trajectory_cron_name }}"
      system: splunk
      schedule: "{{ hermes_agent_wired_trajectory_cron_schedule }}"
      script: "{{ hermes_agent_wired_trajectory_script_name }}"
      deliver: "slack:{{ hermes_agent_wired_trajectory_channel }}"
      enabled: >-
        {{ hermes_agent_wired_trajectory_enabled | bool }}

# Hourly failing-jobs rollup, delivered straight to the issues channel.
- name: Reconcile the cron failure rollup cron
  ansible.builtin.include_tasks:
    file: reconcile_enqueuer_cron.yml
    apply:
      tags: hermes_crons
  tags: hermes_crons
  vars:
    item:
      name: "{{ hermes_agent_cron_failure_rollup_cron_name }}"
      schedule: "{{ hermes_agent_cron_failure_rollup_schedule }}"
      script: "{{ hermes_agent_cron_failure_rollup_script_name }}"
      deliver: "slack:{{ hermes_agent_slack_issues_channel }}"
      enabled: "{{ hermes_agent_cron_failure_rollup_enabled | bool }}"

# Coverage gate for the failure_deliver routing set up above (reconcile_
# direct_cron.yml, reconcile_enqueuer_cron.yml): upstream v2026.9.11 has no
# global/config-level default for failure_deliver (grep confirms `cron/
# jobs.py`, `hermes_cli/config_defaults.py` and `cron/scheduler_delivery.py`
# all resolve it only from the per-job field), so a job this role does not
# create — an operator- or agent-created one via `hermes cron create`
# without --failure-deliver — has NO routing for its own failures and
# silently follows its normal `deliver` target instead. There is no
# `hermes cron list --json`; `cron.jobs.list_jobs()` is called directly
# instead of parsing the human-readable CLI text output.
# Only enforced when failure routing is actually turned on (same "empty
# disables the whole split" precedent as hermes_agent_cron_failure_deliver
# itself) — otherwise this would fail on every converge purely because no
# Slack issues channel is configured, which is a supported, intentional
# state, not drift.
- name: Check every scheduled cron job carries a failure_deliver override
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_venv_python }}"
      - -c
      - |
        from cron.jobs import list_jobs
        missing = [
            j.get("name") or j.get("id")
            for j in list_jobs(include_disabled=True)
            if not (j.get("failure_deliver") or "").strip()
        ]
        print(",".join(missing))
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  args:
    chdir: "{{ hermes_agent_install_dir }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  when: hermes_agent_cron_failure_deliver | length > 0
  register: hermes_agent_failure_deliver_coverage
  changed_when: false
  # Read-only; a check run needs the live value to preview cron policy.
  check_mode: false

- name: Assert every scheduled cron job carries a failure_deliver override
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_agent_failure_deliver_coverage.stdout | trim | length == 0
    fail_msg: >-
      Job(s) with no failure_deliver override:
      {{ hermes_agent_failure_deliver_coverage.stdout | trim }}.
      A failed run on one of these follows its normal deliver target
      instead of the issues channel, because upstream has no
      config-level default for failure_deliver — set --failure-deliver
      on the job (hermes cron edit <name> --failure-deliver ...) or add
      it to this role's job definitions.
  when:
    - hermes_agent_cron_failure_deliver | length > 0
    - not ansible_check_mode
