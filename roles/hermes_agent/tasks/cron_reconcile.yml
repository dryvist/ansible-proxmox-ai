---
# 27 agentic direct-deliver crons (Phase 5 originals + all 18 converted from
# Kanban recurrence, native-cron redesign, including docs-sync — see the PR
# for the assignee/max_runtime/max_retries/outcome-split gap report): every
# recurring report/sweep/digest
# workload. The Slack channel is never hardcoded: skip the whole fleet with a
# loud warning when NEITHER the shared digest channel NOR the general Slack
# capability gate is satisfied (most converted entries carry their own
# `deliver:` and do not depend on the shared digest channel at all).
- name: Warn when Slack is not configured (direct-deliver crons skipped)
  ansible.builtin.debug:
    msg: >-
      Neither hermes_agent_digest_slack_channel nor the Slack bot/app
      token + home channel are set — skipping all
      {{ hermes_agent_direct_cron_jobs_owned | length }} agentic direct-deliver
      crons.
  when:
    - hermes_agent_digest_slack_channel | length == 0
    - >-
      hermes_agent_slack_bot_token | length == 0
      or hermes_agent_slack_app_token | length == 0
      or hermes_agent_slack_home_channel | length == 0

- name: Reconcile the agentic direct-deliver digest crons
  ansible.builtin.include_tasks: reconcile_direct_cron.yml
  loop: "{{ hermes_agent_direct_cron_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    hermes_agent_digest_slack_channel | length > 0
    or (hermes_agent_slack_bot_token | length > 0
        and hermes_agent_slack_app_token | length > 0
        and hermes_agent_slack_home_channel | length > 0)

# See hermes_agent_profile_cron_tick_timeout (defaults) for why this exists:
# a job registered under a named profile's HERMES_HOME needs its OWN ticker,
# since `hermes cron`'s ticker runs in-process inside whichever gateway
# registered it and only the default profile's gateway is persistent.
- name: "Reconcile the profile cron tick trigger for {{ item }}"
  ansible.builtin.cron:
    name: "hermes-cron-tick-{{ item }}"
    user: "{{ hermes_agent_user }}"
    job: >-
      HERMES_HOME={{ hermes_agent_hermes_home }}/profiles/{{ item }}
      timeout {{ hermes_agent_profile_cron_tick_timeout }}
      {{ hermes_agent_bin }} cron tick
      >> {{ hermes_agent_log_directory }}/cron-tick-{{ item }}.log 2>&1
    minute: "*/5"
    state: present
  # Derived from hermes_agent_profiles, not hand-kept: a hardcoded list means
  # a new profile's job is created under its own store and then never ticks —
  # registered, scheduled, silent. The `when` below already skips a profile
  # with no enabled job pointing at it, so deriving adds no stray cron entries.
  loop: "{{ hermes_agent_profiles | map(attribute='name') | list }}"
  when: >-
    hermes_agent_direct_cron_jobs_owned
    | selectattr('hermes_home', 'defined')
    | selectattr('hermes_home', 'search', item)
    | selectattr('enabled') | list | length > 0

# No daily backfill safety net any more: it existed to re-create a slot-keyed
# Kanban card a missed fire would otherwise drop forever. Recurring work is a
# cron job now (native [SILENT] delivery suppression already handles "nothing
# new to report"), and docs-sync's per-run key means a missed fire is simply a
# card that never got created that week — nothing to backfill.

# The script-fed Splunk status digest: a --no-agent --script cron whose stdout
# (real numbers the script gathered itself) is delivered verbatim to Slack. No
# LLM in the fact path — nothing to poison. Replaces the LLM digest paths.
- name: Reconcile the script-fed Splunk status-digest cron
  ansible.builtin.include_tasks: reconcile_enqueuer_cron.yml
  vars:
    item:
      name: "{{ hermes_agent_splunk_status_digest_cron_name }}"
      schedule: "{{ hermes_agent_splunk_status_digest_cron_schedule }}"
      script: "{{ hermes_agent_splunk_status_digest_script_name }}"
      deliver: "slack:{{ hermes_agent_splunk_status_digest_channel }}"
      enabled: >-
        {{ hermes_agent_splunk_status_digest_enabled | bool
           and hermes_agent_ops_workload_enabled | bool }}

# The master Kanban digest cron: same --no-agent --script contract. Deliberately
# NOT added to hermes_agent_seeded_cron_names — brain-fleet reconciliation must
# not pause the digest that reports a wedged board.
- name: Reconcile the master Kanban digest cron
  ansible.builtin.include_tasks: reconcile_enqueuer_cron.yml
  vars:
    item:
      name: "{{ hermes_agent_kanban_digest_cron_name }}"
      schedule: "{{ hermes_agent_kanban_digest_cron_schedule }}"
      script: "{{ hermes_agent_kanban_digest_script_name }}"
      deliver: "slack:{{ hermes_agent_kanban_digest_channel }}"
      enabled: >-
        {{ hermes_agent_kanban_digest_enabled | bool
           and hermes_agent_ops_workload_enabled | bool }}

# The script-fed Splunk triage digests: same --no-agent --script contract as the
# status digest. Their stdout (numbers each script gathered itself) is delivered
# verbatim — no model in the fact path, so no tool-call markup to leak and
# nothing to fabricate. include_tasks re-scopes `item` per iteration, so the
# loop var is built into a fresh dict rather than passed through.
- name: Reconcile the script-fed Splunk triage crons
  ansible.builtin.include_tasks: reconcile_enqueuer_cron.yml
  vars:
    item:
      name: "{{ triage_job.name }}"
      schedule: "{{ triage_job.schedule }}"
      script: "{{ triage_job.name }}.py"
      deliver: "slack:{{ hermes_agent_triage_channel }}"
      enabled: >-
        {{ hermes_agent_triage_enabled | bool
           and hermes_agent_ops_workload_enabled | bool }}
  loop: "{{ hermes_agent_triage_jobs }}"
  loop_control:
    loop_var: triage_job
    label: "{{ triage_job.name }}"

# Retire the hand-created LLM digest direct cron the script-fed digest replaces:
# pause it (disable-don't-delete) so the two never double-post. `cron list` shows
# only ENABLED jobs, so this is a clean no-op once the job is paused.
- name: List active Hermes crons (to retire the superseded LLM digests)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron list"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_active_cron_list
  changed_when: false
  # Always needed now: pausing the three now-superseded *-v2 crons below
  # (zammad/github/summary) is unconditional, not a staged-rollout toggle.

- name: Pause the superseded v3 LLM digest cron (disable-don't-delete)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron pause {{ hermes_agent_superseded_digest_cron_name }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  when:
    - hermes_agent_splunk_status_digest_enabled | bool
    - hermes_agent_superseded_digest_cron_name in (hermes_agent_active_cron_list.stdout | default(''))

# Same disable-don't-delete retirement for each agentic digest a script-fed job
# replaces. A no-op once paused (error-triage was paused by hand to stop the
# markup posts); making it declarative means a converge can never leave both the
# agentic job and its replacement live.
- name: Pause the superseded agentic triage crons (disable-don't-delete)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron pause {{ item.supersedes }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  loop: "{{ hermes_agent_triage_jobs }}"
  loop_control:
    label: "{{ item.supersedes }}"
  when:
    - hermes_agent_triage_enabled | bool
    - item.supersedes in (hermes_agent_active_cron_list.stdout | default(''))

# Retire the agentic anomaly hunt outright — no replacement, because its facts
# are a strict subset of what splunk-status-digest already posts (see defaults).
# The enabled:false in hermes_agent_direct_cron_jobs stops reconcile from
# re-creating it; only this pause stops the cron that already exists on the host.
- name: Pause the retired agentic anomaly-hunt cron (disable-don't-delete)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron pause {{ hermes_agent_retired_anomaly_hunt_cron_name }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  when:
    - hermes_agent_retire_anomaly_hunt | bool
    - hermes_agent_retired_anomaly_hunt_cron_name in (hermes_agent_active_cron_list.stdout | default(''))

# Retire the 6-hourly fabric-status cron: it fails the cadence rule (a cron earns
# its place only as a daily-or-rarer report), and the hourly homelab-ai-fabric-status
# job (now a hermes_agent_direct_cron_jobs entry, native-cron reframe) covers the
# topic. enabled:false stops reconcile from re-creating this job; only this pause
# stops the one already on the guest.
- name: Pause the retired 6-hourly fabric-status cron (disable-don't-delete)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron pause {{ hermes_agent_retired_fabric_status_cron_name }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  when:
    - hermes_agent_retire_fabric_status_v2 | bool
    - hermes_agent_retired_fabric_status_cron_name in (hermes_agent_active_cron_list.stdout | default(''))

# Retire the daily splunk-parsing-quality-v2 cron: its fixed SPL queried the
# proven stale/near-empty `index=network` (see the comment on its
# hermes_agent_direct_cron_jobs entry), so it was confidently omitting real
# data every run, with no memory dedup and no [SILENT] path. The
# splunk-parsing kanban card replaces it 1-for-1 on the same daily cadence.
- name: Pause the retired splunk-parsing-quality-v2 cron (disable-don't-delete)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron pause {{ hermes_agent_retired_splunk_parsing_v2_cron_name }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  when:
    - hermes_agent_retire_splunk_parsing_v2 | bool
    - hermes_agent_retired_splunk_parsing_v2_cron_name in (hermes_agent_active_cron_list.stdout | default(''))

# Retire the 3 *-v2 direct crons the reframe now duplicates 1-for-1 under a
# bare name (zammad-review, github-monitor, daily-summary — same topic, same
# recall/save prompt content, same schedule). disable-don't-delete: enabled:
# false in hermes_agent_direct_cron_jobs stops reconcile from re-creating them;
# only this pause stops the ones already on the guest.
- name: Pause the *-v2 crons the reframe replaces 1-for-1 (disable-don't-delete)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron pause {{ item }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  loop:
    - zammad-incident-review-v2
    - github-org-triage-v2
    - daily-operator-summary-v2
  when: item in (hermes_agent_active_cron_list.stdout | default(''))

# Zammad stale-ticket auto-close cron (disabled by default; see defaults). Closures
# deliver to Slack for auditability. Gated on the auto-close flag AND zammad + slack
# credentials being present.
- name: Reconcile the Zammad stale-ticket auto-close cron
  ansible.builtin.include_tasks: reconcile_enqueuer_cron.yml
  vars:
    item:
      name: "{{ hermes_agent_zammad_autoclose_cron_name }}"
      schedule: "{{ hermes_agent_zammad_autoclose_schedule }}"
      script: "{{ hermes_agent_zammad_autoclose_script_name }}"
      deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
      enabled: >-
        {{ hermes_agent_zammad_autoclose_enabled | bool
           and hermes_agent_ops_workload_enabled | bool
           and hermes_agent_zammad_url | length > 0
           and hermes_agent_zammad_api_token | length > 0
           and hermes_agent_slack_hermes_all_channel | length > 0 }}
