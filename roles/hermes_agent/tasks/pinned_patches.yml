---
# Apply all pinned-source patches before reading them back for verification.
- name: Pinned-source patches — retry/backoff and cron markup guard
  ansible.builtin.import_tasks: patches_retry_and_markup.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_retry_and_markup.yml'] }}"

- name: Pinned-source patches — goal judge timing and failure handling
  # Split out of patches_retry_and_markup.yml (token budget). Independent
  # patch set (different anchors, different file, no shared state), so
  # placement immediately after its former home is the only ordering
  # constraint — preserves this file's position in the overall include
  # sequence exactly.
  ansible.builtin.import_tasks: patches_goal_judge.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_goal_judge.yml'] }}"

- name: Pinned-source patches — cron failure delivery routing
  ansible.builtin.import_tasks: patches_cron_failure_routing.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_cron_failure_routing.yml'] }}"

- name: Pinned-source patches — cron output-validity guard
  ansible.builtin.import_tasks: patches_cron_output_validity.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_cron_output_validity.yml'] }}"

- name: Pinned-source patches — goal mode and protocol violations
  ansible.builtin.import_tasks: patches_goal_mode.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_goal_mode.yml'] }}"

- name: Pinned-source patches — worker-reap process group handling
  ansible.builtin.import_tasks: patches_worker_reap.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_worker_reap.yml'] }}"

- name: Pinned-source patches — external-memory sync logging in run_agent.py
  ansible.builtin.import_tasks: patches_run_agent_memory_sync.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_run_agent_memory_sync.yml'] }}"

- name: Pinned-source patch — widen the truncated provider-error snippet
  ansible.builtin.import_tasks: patches_provider_error_snippet.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_provider_error_snippet.yml'] }}"

- name: Pinned-source patch — hash the prompt in a failed cron run's artifact
  ansible.builtin.import_tasks: patches_cron_failure_artifact.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_cron_failure_artifact.yml'] }}"

- name: Pinned-source patches — per-tick dispatch decision log
  ansible.builtin.import_tasks: patches_dispatch_tick_log.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_dispatch_tick_log.yml'] }}"

- name: Pinned-source patches — opt-in goal mode for native cron jobs
  ansible.builtin.import_tasks: patches_cron_goal_mode.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_cron_goal_mode.yml'] }}"

- name: Pinned-source patches — built-in memory store for cron agents
  ansible.builtin.import_tasks: patches_cron_memory.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_cron_memory.yml'] }}"

- name: Pinned-source patches — aggregate cron wall clock
  ansible.builtin.import_tasks: patches_cron_wall_clock.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_cron_wall_clock.yml'] }}"

# The cron-exit-code patch that used to run here is GONE: upstream's cmd_cron
# is now generated via `_forward_command(..., forward_return=True)`
# (hermes_cli/main.py), which already returns cron_command's exit code to the
# dispatcher. The old regexp anchored on a hand-written `def cmd_cron(args):`
# that no longer exists, so it matched nothing; the assertion in
# patches_verify.yml is retargeted at the upstream forwarding call.

- name: Read back and assert every pinned-source patch actually applied
  ansible.builtin.import_tasks: patches_verify.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_verify.yml'] }}"

- name: Read back and assert every pinned-source patch actually applied (cron/memory/judge half)
  ansible.builtin.import_tasks: patches_verify_cron.yml
  tags: "{{ hermes_agent_entry_point_task_tags['patches_verify_cron.yml'] }}"
