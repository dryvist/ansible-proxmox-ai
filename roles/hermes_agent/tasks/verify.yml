---
# Layer 2 — post-converge verification gate.
#
# Runs after the gateway (re)start settles (main.yml flushes handlers first).
# Proves the brain wiring actually WORKS before the converge is called done: the
# daemon stays up, its journal shows no fatal config rejection, and one real
# tool-call round-trips through the router at the resolved brain. Any failure
# rolls the whole play back with an explicit recovery recipe — none of the
# 2026-07-08 breakages would have reached "converge succeeded" through this gate.
#
# The gate steps live in a block so a failure at ANY step surfaces the same loud
# rollback hint (rescue) instead of a bare task error. The memory-provider report
# below is deliberately OUTSIDE the block: it is best-effort telemetry, not a gate.

- name: Post-converge verification gate
  when: hermes_agent_verify_enabled | bool
  block:
    # Type=simple reports 'active' the instant the daemon forks, so a single
    # check can pass a service that crashes a moment later (exactly how a
    # context-floor rejection dies). Poll until ActiveState settles on 'active'.
    - name: Gate — the Hermes gateway is active and stays up
      ansible.builtin.systemd:
        name: hermes-gateway
      register: hermes_agent_gateway_state
      until: hermes_agent_gateway_state.status.ActiveState | default('') == 'active'
      retries: 5
      delay: 2

    # A second `hermes gateway run` — Studio's auto-spawned child was the
    # 2026-09-02 case — takes the runtime lock and the Slack app token from the
    # unit and SIGTERMs it, so "active" above can be true of the wrong process.
    # Exactly one gateway, and systemd (pid 1) is its parent.
    - name: Gate — exactly one gateway process, owned by systemd
      ansible.builtin.shell: |
        set -o pipefail
        ps -eo pid=,ppid=,args= | awk '$3 ~ /python/ && /\/hermes gateway run/ {print $1, $2}'
      args:
        executable: /bin/bash
      register: hermes_agent_gateway_procs
      changed_when: false
      failed_when: >-
        hermes_agent_gateway_procs.stdout_lines | length != 1
        or (hermes_agent_gateway_procs.stdout_lines[0] | split)[1] != '1'

    - name: Gate — Browser Use Chromium CDP service is active
      ansible.builtin.systemd:
        name: hermes-browser-use-chromium
      register: hermes_agent_browser_use_chromium_state
      until: hermes_agent_browser_use_chromium_state.status.ActiveState | default('') == 'active'
      retries: 5
      delay: 2

    - name: Gate — Browser Use reads Cribl global-secrets documentation
      ansible.builtin.shell: |
        set -euo pipefail
        {{ hermes_agent_install_dir }}/venv/bin/browser-use <<'PY'
        new_tab("https://docs.cribl.io/stream/global-secrets-add-use/")
        wait_for_load()
        text = js("document.body.innerText")
        assert "Global secrets" in text
        assert "<secretFolderId>/<globalSecretId>" in text
        for line in text.splitlines():
            if "Global secrets" in line or "<secretFolderId>/<globalSecretId>" in line:
                print(line.strip())
        PY
      args:
        executable: /bin/bash
      environment:
        HOME: "{{ hermes_agent_home }}"
        HERMES_HOME: "{{ hermes_agent_hermes_home }}"
        BROWSER_USE_HOME: "{{ hermes_agent_browser_use_home }}"
        BH_HOME: "{{ hermes_agent_browser_use_home }}"
        BH_CHROME_PATH: "{{ hermes_agent_chromium_executable }}"
        BU_CDP_URL: "{{ hermes_agent_browser_use_cdp_url }}"
      become: true
      become_user: "{{ hermes_agent_user }}"
      register: hermes_agent_browser_use_cribl_probe
      changed_when: false

    - name: Gate — Browser Use returned the expected Cribl reference syntax
      ansible.builtin.assert:
        quiet: true
        that:
          - "'Global secrets' in hermes_agent_browser_use_cribl_probe.stdout"
          - "'<secretFolderId>/<globalSecretId>' in hermes_agent_browser_use_cribl_probe.stdout"
        fail_msg: >-
          Browser Use could not retrieve the public Cribl global-secrets guide
          through the local CDP browser. Inspect hermes-browser-use-chromium,
          {{ hermes_agent_browser_use_cdp_url }}, and the CLI output above.

    # Bound the read to THIS process start: a bare `-n 200` straddles the
    # restart and re-matches errors the converge just fixed — a false gate
    # failure observed 2026-07-16 (pre-fix "context window below minimum"
    # lines from the old config failed the verify of the config that fixed
    # them). ActiveEnterTimestamp is authoritative for the running unit.
    - name: Read the gateway journal since the restart
      ansible.builtin.shell: >-
        journalctl -u hermes-gateway
        --since "$(systemctl show -p ActiveEnterTimestamp --value hermes-gateway)"
        -n {{ hermes_agent_verify_journal_lines }} --no-pager -o cat
      register: hermes_agent_gateway_journal
      changed_when: false

    - name: Gate — the journal shows no fatal config-rejection lines
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            hermes_agent_gateway_journal.stdout
            | regex_findall(hermes_agent_verify_fatal_log_patterns | join('|'))
            | length == 0
        fail_msg: >-
          The Hermes gateway journal contains a fatal config-rejection line
          (matched one of {{ hermes_agent_verify_fatal_log_patterns | join(', ') }}).
          This is the daemon refusing the rendered config at startup — e.g. a
          context_length below the 64,000 floor, or a brain alias the router does
          not serve. Inspect: journalctl -u hermes-gateway -n
          {{ hermes_agent_verify_journal_lines }}.
        success_msg: Gateway journal is clean of fatal config-rejection lines.

    # `hermes memory status` cannot prove this path in local_external mode:
    # upstream's is_available() returns true without contacting Hindsight. Run
    # one read-only recall through the same pinned client and rendered bank the
    # gateway uses. Empty results are valid; this probe must never retain data.
    - name: Gate — Hindsight performs a read-only recall from this agent bank
      ansible.builtin.command:
        argv:
          - "{{ hermes_agent_venv_python }}"
          - -c
          - |
            import asyncio
            import json
            from hindsight_client import Hindsight

            with open("{{ hermes_agent_hermes_home }}/hindsight/config.json") as config_file:
                config = json.load(config_file)

            async def main():
                client = Hindsight(base_url=config["api_url"])
                await client.arecall(
                    bank_id=config["bank_id"],
                    query="ansible managed Hindsight readiness probe",
                    budget="low",
                    max_tokens=1,
                    types=["observation"],
                )

            asyncio.run(main())
      become: true
      become_user: "{{ hermes_agent_user }}"
      register: hermes_agent_hindsight_recall_probe
      retries: "{{ hermes_agent_verify_probe_retries }}"
      delay: "{{ hermes_agent_verify_probe_delay }}"
      until: hermes_agent_hindsight_recall_probe.rc == 0
      changed_when: false
      when: hermes_agent_memory_provider == 'hindsight'

    # One REAL end-to-end probe: force a tool call through the router at the
    # resolved brain and require a structurally valid tool_call back. This is the
    # exact failure shape of the outage ("Model generated invalid tool call" /
    # empty function.name). Runs on the hermes host itself — the same network
    # path and credential the agent uses — not the controller. no_log hides the
    # bearer token; the separate assert below inspects the (token-free) result.
    - name: Gate — a real tool call round-trips through the router at the brain
      ansible.builtin.uri:
        url: "{{ hermes_agent_model_base_url }}/chat/completions"
        method: POST
        headers:
          Authorization: "Bearer {{ hermes_agent_model_api_key }}"
        body_format: json
        body:
          model: "{{ hermes_agent_model }}"
          messages:
            - role: user
              content: "What is the weather in Paris right now? Use the get_weather tool to find out."
          tools:
            - type: function
              function:
                name: get_weather
                description: Get the current weather for a location.
                parameters:
                  type: object
                  properties:
                    location:
                      type: string
                      description: City name, e.g. "Paris".
                  required:
                    - location
          tool_choice: required
          max_tokens: 256
          stream: false
        timeout: "{{ hermes_agent_verify_probe_timeout }}"
        return_content: true
      register: hermes_agent_verify_probe
      retries: "{{ hermes_agent_verify_probe_retries }}"
      delay: "{{ hermes_agent_verify_probe_delay }}"
      until: hermes_agent_verify_probe.status | default(0) == 200
      # no_log protects the bearer token, which Ansible would otherwise echo in
      # the task invocation on failure; failed_when keeps a non-200 from hard-
      # failing HERE (that would skip the descriptive assert below and leave the
      # operator only the no_log'd, opaque module error). The visible assert next
      # is the actual gate and prints the diagnostic.
      failed_when: false
      no_log: true

    - name: Gate — the probe returned a valid tool call with a non-empty function name
      ansible.builtin.assert:
        quiet: true
        that:
          - hermes_agent_verify_probe.status == 200
          - >-
            (hermes_agent_verify_probe.json.choices[0].message.tool_calls | default([]))
            | map(attribute='function.name') | select('truthy') | list | length > 0
        fail_msg: >-
          The brain at {{ hermes_agent_model_base_url }} (model
          {{ hermes_agent_model }}) did not return a structurally valid tool call
          (HTTP {{ hermes_agent_verify_probe.status | default('?') }}, no non-empty
          function.name). This is the outage signature — invalid/empty tool calls
          from a mis-wired brain (wrong parser, null context, unroutable alias).
        success_msg: "Brain returned a valid tool call ({{ hermes_agent_model }})."

    # Inbound job-submission API (api_server platform), only when the key is
    # seeded: the platform must be listening (health 200 on the guest) AND must
    # refuse unauthenticated submissions (401 on a keyless POST /v1/runs) — the
    # negative half proves the bearer gate is actually on, not just the port.
    - name: Gate — the job-submission API answers its health check
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ hermes_agent_api_server_port }}/health"
        method: GET
      register: hermes_agent_api_health
      retries: "{{ hermes_agent_verify_probe_retries }}"
      delay: "{{ hermes_agent_verify_probe_delay }}"
      until: hermes_agent_api_health.status | default(0) == 200
      when: hermes_agent_api_server_key | length > 0

    - name: Gate — an unauthenticated job submission is refused (401)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ hermes_agent_api_server_port }}/v1/runs"
        method: POST
        body_format: json
        body:
          input: "unauthenticated probe — must be refused"
        status_code: 401
      when: hermes_agent_api_server_key | length > 0

    # A dashboard unit that starts but serves an error body (e.g. the frontend
    # bundle missing) would pass every other check in this file — the bundle
    # assertion in main.yml only proves the file exists on disk, not that the
    # service serves it. Require the actual redirect to the self-hosted auth
    # login: a bare 200 here would mean authentication is not in front of the
    # dashboard at all.
    - name: Gate — the dashboard requires authentication (302 to login)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ hermes_agent_dashboard_port }}/"
        method: GET
        follow_redirects: none
        status_code: 302
      register: hermes_agent_dashboard_probe
      retries: "{{ hermes_agent_verify_probe_retries }}"
      delay: "{{ hermes_agent_verify_probe_delay }}"
      until: hermes_agent_dashboard_probe.status | default(0) == 302
      failed_when: false
      when: hermes_agent_dashboard_enabled | bool

    - name: Gate — the dashboard redirect targets the self-hosted auth login
      ansible.builtin.assert:
        quiet: true
        that:
          - hermes_agent_dashboard_probe.status == 302
          # Compare the PATH, not the raw header. `uri` resolves Location
          # against the request URL, so this arrives absolute
          # (http://127.0.0.1:8080/auth/login?...) even though the server sends
          # the relative form curl -I shows. Anchoring on '^/auth/login' failed
          # a correctly-behaving dashboard on this gate's very first run.
          # urlsplit('path') normalises both forms to /auth/login.
          - (hermes_agent_dashboard_probe.location | default('') | urlsplit('path')) == '/auth/login'
          - "'provider=self-hosted' in (hermes_agent_dashboard_probe.location | default(''))"
        fail_msg: >-
          The Hermes dashboard on port {{ hermes_agent_dashboard_port }} did not
          respond with a 302 redirect to the self-hosted auth login (got HTTP
          {{ hermes_agent_dashboard_probe.status | default('?') }}, location
          {{ hermes_agent_dashboard_probe.location | default('<none>') }}). A bare
          200 here means authentication is not in front of the dashboard — the
          exact "Frontend not built" outage shape this gate exists to catch.
        success_msg: "Dashboard redirects unauthenticated requests to auth login."
      when: hermes_agent_dashboard_enabled | bool

  rescue:
    - name: Verification gate failed — fail loudly with a rollback recipe
      ansible.builtin.fail:
        msg: >-
          Hermes Agent post-converge verification gate FAILED — the brain wiring
          is not serving correctly, so this converge must NOT be trusted in
          production. Roll back to the previous release and re-converge:
          `git checkout $(git describe --tags --abbrev=0)~ && doppler run --
          ansible-playbook -i inventory/hosts.yml playbooks/site.yml --tags
          hermes_agent`. Original failure is in the task output above.

# Best-effort telemetry (NOT a gate): surface the active memory provider so a
# Hindsight first-run hiccup is visible without failing the converge.
- name: Check the active memory provider (non-fatal)
  ansible.builtin.command: "{{ hermes_agent_bin }} memory status"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_memory_status
  changed_when: false
  failed_when: false

# Plain `debug: var: stdout_lines` was silent telemetry in practice: it prints
# the same neutral block whether the command exited 0 or crashed, and nothing
# ever reads it — a Hindsight outage degrades to "no memories" with no signal
# beyond this line (see "Memory resilience" above hermes_agent_hindsight_client_pin
# in defaults/main.yml). This still never fails the converge (no `failed_when`
# added), but it now says HEALTHY/DEGRADED explicitly instead of making a
# human read raw CLI output to judge that themselves. rc != 0 is a hard
# signal (Ansible's own exit-code capture, not a guess). The stdout substring
# match is best-effort: "Memory is not available" is the literal string the
# pinned hermes-agent plugin logs on a failed memory call elsewhere in this
# codebase (tasks/main.yml, hermes-gateway.service.j2) — `memory status` is not
# proven to reuse it, so a miss here is not proof of health, only an unmatched
# guess.
#
# Known, accepted limitation: this is a two-way verdict (HEALTHY/DEGRADED),
# not three-way. It cannot distinguish "the backend is unreachable" from "the
# backend answered but found no memories" — those need OPPOSITE operator
# responses (one is an outage, the other is a normal empty-bank result), and
# `memory status` is a health/provider check, not a recall call, so it likely
# cannot observe "no memories matched" at all. Left as the honest proxy it
# is rather than guessing at a three-way split this probe cannot prove.
- name: Report the active memory provider
  ansible.builtin.debug:
    msg: >-
      Hindsight memory status: {{
        'DEGRADED (rc=' ~ hermes_agent_memory_status.rc ~ ')'
        if hermes_agent_memory_status.rc != 0
        else 'DEGRADED (CLI reported "not available")'
        if hermes_agent_memory_status.stdout is search('not available', ignorecase=True)
        else 'HEALTHY (best-effort: exit 0, no known-bad string)'
      }} — raw output: {{ hermes_agent_memory_status.stdout_lines }}
