---
# The script-fed Splunk status digest gathers the numbers itself via the Splunk
# MCP and prints them; the cron below delivers that stdout verbatim to Slack with
# NO LLM in the fact path (structural anti-fabrication fix, Zammad #17143/#17144).
- name: Deploy the script-fed Splunk status-digest script
  ansible.builtin.template:
    src: splunk-digest.py.j2
    dest: "{{ hermes_agent_hermes_home }}/scripts/{{ hermes_agent_splunk_status_digest_script_name }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

# Same no-LLM-in-the-fact-path shape as the status digest above, one rendered
# script per entry in hermes_agent_triage_jobs (the agentic digests these replace
# leaked raw tool-call markup AND never ran the SPL their prompts specified).
# Deployed regardless of the cron gate so enabling is a one-flag change.
- name: Deploy the script-fed Splunk triage scripts
  ansible.builtin.template:
    src: splunk-triage.py.j2
    dest: "{{ hermes_agent_hermes_home }}/scripts/{{ item.name }}.py"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
  loop: "{{ hermes_agent_triage_jobs }}"
  loop_control:
    label: "{{ item.name }}"

# Wired-memory-ceiling trajectory watch — same no-LLM-in-the-fact-path shape,
# deployed regardless of the enable flag (disable-don't-delete). See
# defaults/main/102-wired-trajectory.yml: the cron stays off until index=mac_perf
# is confirmed to carry data; deploying the script itself is harmless either way.
- name: Deploy the script-fed wired-trajectory watch script
  ansible.builtin.template:
    src: splunk-wired-trajectory.py.j2
    dest: "{{ hermes_agent_hermes_home }}/scripts/{{ hermes_agent_wired_trajectory_script_name }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

# The master Kanban digest: reads kanban.db read-only and reports what the board
# did since its own previous run. No LLM and no network in its fact path, so it
# still reports when the brain is unloaded or wedged — which is when a board goes
# wrong in the first place.
- name: Deploy the master Kanban digest script
  ansible.builtin.template:
    src: kanban-digest.py.j2
    dest: "{{ hermes_agent_hermes_home }}/scripts/{{ hermes_agent_kanban_digest_script_name }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

# --- Vikunja Kanban bridge (operator board -> Hermes board) ------------------
# Makes the operator's Vikunja board the front end for Hermes: READY tasks
# become Kanban cards, the tasks move across their buckets as work starts and
# finishes, and the card's RECORDED result (from kanban.db, no LLM in the
# relay path) is commented back. Deployed regardless of the enable flag so
# turning it on is a one-flag change, same posture as the scripts above.
- name: Deploy the Vikunja Kanban bridge script
  ansible.builtin.template:
    src: vikunja-bridge.py.j2
    dest: "{{ hermes_agent_hermes_home }}/scripts/{{ hermes_agent_vikunja_bridge_script_name }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
  notify: Restart hermes-vikunja-bridge

# 0600 and hermes-owned: this is the only file carrying the write token, which
# is why it is separate from the 0750 script above.
- name: Deploy the Vikunja Kanban bridge environment file
  ansible.builtin.template:
    src: hermes-vikunja-bridge.env.j2
    dest: "{{ hermes_agent_vikunja_bridge_env_file }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0600"
  no_log: true
  notify: Restart hermes-vikunja-bridge

- name: Deploy the Vikunja Kanban bridge systemd unit
  ansible.builtin.template:
    src: hermes-vikunja-bridge.service.j2
    dest: "/etc/systemd/system/{{ hermes_agent_vikunja_bridge_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart hermes-vikunja-bridge
  when: hermes_agent_vikunja_bridge_enabled | bool

# Gated on the token as well as the flag: starting the daemon without a
# credential would only produce a permanent "bridge idle" log line.
- name: Enable and start the Vikunja Kanban bridge
  ansible.builtin.systemd:
    name: "{{ hermes_agent_vikunja_bridge_service }}"
    state: started
    enabled: true
    daemon_reload: true
  when:
    - hermes_agent_vikunja_bridge_enabled | bool
    - hermes_agent_vikunja_bridge_token | length > 0

# Disable-don't-delete: turning the flag off stops the daemon but leaves the
# unit and the ledger in place, so re-enabling resumes tracking the cards that
# were already in flight instead of orphaning them.
- name: Check for a retained Vikunja Kanban bridge unit
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ hermes_agent_vikunja_bridge_service }}.service"
  register: hermes_agent_vikunja_bridge_unit
  when: not (hermes_agent_vikunja_bridge_enabled | bool)

- name: Stop and disable the retained Vikunja Kanban bridge
  ansible.builtin.systemd:
    name: "{{ hermes_agent_vikunja_bridge_service }}"
    state: stopped
    enabled: false
    daemon_reload: true
  when:
    - not (hermes_agent_vikunja_bridge_enabled | bool)
    - hermes_agent_vikunja_bridge_unit.stat.exists | default(false)

# Zammad stale-ticket auto-close, brought under role management (token from .env,
# no hardcoded secret). Cron is gated off by default (see defaults) — the script
# is deployed regardless so enabling is a one-flag change.
- name: Deploy the Zammad stale-ticket auto-close script
  ansible.builtin.template:
    src: zammad-auto-close.py.j2
    dest: "{{ hermes_agent_hermes_home }}/scripts/{{ hermes_agent_zammad_autoclose_script_name }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

# Remove the hand-placed orphan scripts under /var/lib/hermes/scripts/ (a dir
# separate from the managed .hermes/scripts/): the old zammad-auto-close.py
# carried a CLEARTEXT Zammad API token (superseded by the managed template above;
# rotate that token), and issue_tracker.py is an unused, unmanaged SQLite tool.
- name: Remove hand-placed orphan scripts (cleartext-token auto-close + unused tracker)
  ansible.builtin.file:
    path: "{{ hermes_agent_home }}/scripts/{{ item }}"
    state: absent
  loop:
    - zammad-auto-close.py
    - issue_tracker.py

# Hourly cause-grouped rollup of failing cron jobs across every store; the
# standing picture between the per-run failure ladder's posts. No LLM, no
# network. Deployed regardless of the enable flag (disable-don't-delete).
- name: Deploy the cron failure rollup script
  ansible.builtin.template:
    src: cron-failure-rollup.py.j2
    dest: "{{ hermes_agent_hermes_home }}/scripts/{{ hermes_agent_cron_failure_rollup_script_name }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
