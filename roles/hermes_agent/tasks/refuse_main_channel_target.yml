---
# Donna's main channel carries conversation only, so none of her scheduled jobs may
# deliver output, a failure notice or a healthy footer there. The direct and enqueuer
# reconcile files include this per job, after resolving its targets. Each comma-separated
# entry must be empty, a non-posting literal (local, log), or slack:<ID> with an
# upper-case ID other than her home channel. Anything else fails closed.
- name: "Require Donna's Slack home channel for {{ refuse_target_name }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_agent_slack_home_channel | trim | length > 0
    fail_msg: >-
      {{ refuse_target_name }} cannot be checked: Donna has no Slack home channel set.
      Her main channel is the reference point for this rule, so set it where her roster
      entry resolves it. This job was not changed.
  when: (hermes_agent_identity | default('hermes', true)) == 'donna'

- name: "Check Donna's main-channel targets for {{ refuse_target_name }}"
  ansible.builtin.set_fact:
    hermes_agent_refuse_bad: >-
      {%- set entries = ((refuse_deliver ~ ',' ~ refuse_failure ~ ',' ~ refuse_footer).split(',')
         | map('trim') | reject('eq', '') | reject('in', ['local', 'log']) | list) -%}
      {{ (entries | reject('match', '^slack:[A-Z0-9]+$') | list)
         + (entries | select('eq', 'slack:' ~ (hermes_agent_slack_home_channel | upper)) | list) }}
  when: (hermes_agent_identity | default('hermes', true)) == 'donna'

- name: "Find the installed job for {{ refuse_target_name }}"
  ansible.builtin.set_fact:
    # `cron list --all` prints a header line "<id> [state]" above each "Name:" line.
    # The lines are scanned without a regex, so no backslash escapes are needed.
    hermes_agent_refuse_job_id: >-
      {%- set ns = namespace(found='') -%}
      {%- set lines = (hermes_agent_direct_cron_lists | default({})).get(refuse_home, '').splitlines() -%}
      {%- for line in lines -%}
        {%- if line.strip().startswith('Name:') and line.split(':', 1)[1].strip() == refuse_target_name
               and loop.index0 > 0 -%}
          {%- set ns.found = (lines[loop.index0 - 1].split() + ['', ''])[0] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.found | string }}
    hermes_agent_refuse_job_state: >-
      {%- set ns = namespace(found='') -%}
      {%- set lines = (hermes_agent_direct_cron_lists | default({})).get(refuse_home, '').splitlines() -%}
      {%- for line in lines -%}
        {%- if line.strip().startswith('Name:') and line.split(':', 1)[1].strip() == refuse_target_name
               and loop.index0 > 0 -%}
          {%- set ns.found = (lines[loop.index0 - 1].split() + ['', ''])[1]
                | replace('[', '') | replace(']', '') -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.found | string }}
  when: (hermes_agent_identity | default('hermes', true)) == 'donna'

# Stop the installed job from posting before the check fails. It is paused by id, not
# removed. Its desired-state marker is cleared below, so a corrected target recreates
# the job through the existing drift path, and the new job runs.
- name: "Pause the installed job while its target is refused: {{ refuse_target_name }}"
  ansible.builtin.command: >-
    {{ hermes_agent_bin }} {{ hermes_agent_cli_profile_args | join(' ') }}
    cron pause {{ hermes_agent_refuse_job_id }}
  environment:
    HERMES_HOME: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  vars:
    hermes_agent_cli_home: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_refuse_pause
  changed_when: true
  when:
    - (hermes_agent_identity | default('hermes', true)) == 'donna'
    - hermes_agent_refuse_bad | length > 0
    - hermes_agent_refuse_job_id | length > 0
    - hermes_agent_refuse_job_state == 'active'
    - not ansible_check_mode

- name: "Clear the desired-state marker of paused {{ refuse_target_name }}"
  ansible.builtin.file:
    path: "{{ hermes_agent_managed_cron_state_dir }}/{{ refuse_target_name }}.sha256"
    state: absent
  when:
    - hermes_agent_refuse_pause.changed | default(false) | bool
    - not ansible_check_mode

- name: "Refuse Donna's main channel as a target for {{ refuse_target_name }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_agent_refuse_bad | length == 0
    fail_msg: >-
      {{ refuse_target_name }} has a target Donna's main-channel rule does not allow:
      {{ hermes_agent_refuse_bad | join(', ') }}. Each comma-separated entry must be empty,
      local, log, or slack:<ID> with an upper-case ID other than her home channel.
      {{ 'The installed job was paused and no longer posts. '
         if hermes_agent_refuse_pause.changed | default(false) | bool else '' }}
      Correct the declared target and re-run the reconcile; the job is then recreated
      with the corrected target and runs again.
  when: (hermes_agent_identity | default('hermes', true)) == 'donna'
