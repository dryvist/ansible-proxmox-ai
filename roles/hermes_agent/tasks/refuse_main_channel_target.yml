---
# Donna's main channel carries conversation only, so no scheduled job may deliver
# output, a failure notice or a healthy footer there. The direct and enqueuer
# reconcile files include this file with the targets they have resolved, and
# their own `when:` decides whether a job is checked. Each value is a
# comma-separated list, split the way Slack targets are read.
- name: "Refuse Donna's main channel as a target for {{ refuse_target_name }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - main_target not in (refuse_deliver.split(',') | map('trim') | list)
      - main_target not in (refuse_failure.split(',') | map('trim') | list)
      - main_target not in (refuse_footer.split(',') | map('trim') | list)
    fail_msg: >-
      {{ refuse_target_name }} targets Donna's main channel. Scheduled output and
      failure notices belong in her delivery and failure channels, not the main one.
  vars:
    main_target: "slack:{{ hermes_agent_slack_home_channel }}"
  when:
    - (hermes_agent_identity | default('hermes', true)) == 'donna'
    - hermes_agent_slack_home_channel | length > 0
