---
# Per-tick dispatch decision log. Upstream's in-gateway dispatcher logs a
# board only when it spawned something, so a tick that reclaimed, capped,
# guarded or skipped work leaves no trace, and "ready work, nothing spawned"
# surfaces only as the six-tick stuck warning. One INFO line per board per
# tick names every non-zero outcome the DispatchResult already carries.
# Upstream's September 2026 decomposition moved the spawn-result loop this
# helper feeds out of kanban_watchers.py's mixin class into its own module,
# gateway/kanban_watchers_dispatcher.py (_log_spawn_results), verbatim body
# and all. The helper follows it: defining it beside the class it no longer
# lives in and calling it from a different module is a NameError on the
# first tick, not a smaller diff.
- name: Add the dispatch tick line helper
  ansible.builtin.blockinfile:
    path: "{{ hermes_agent_install_dir }}/gateway/kanban_watchers_dispatcher.py"
    marker: "# {mark} ANSIBLE MANAGED BLOCK dispatch tick line"
    insertbefore: '^def _log_spawn_results\('
    block: |
      def _dispatch_tick_line(slug, res):
          """One line naming what a dispatch tick did on a board and why it
          declined; empty when the tick was a no-op so an idle board stays quiet."""
          def _n(name):
              value = getattr(res, name, None)
              if value is None or value is False:
                  return 0
              if isinstance(value, (int, bool)):
                  return int(value)
              try:
                  return len(value)
              except TypeError:
                  return 0
          fields = ("spawned", "reclaimed", "promoted", "crashed", "timed_out", "stale",
                    "auto_blocked", "rate_limited", "skipped_unassigned",
                    "skipped_nonspawnable", "skipped_per_profile_capped",
                    "respawn_guarded", "reconciled_orphans", "skipped_locked")
          counts = {name: _n(name) for name in fields}
          pressure = getattr(res, "memory_pressure", None)
          if not any(counts.values()) and not pressure:
              return ""
          parts = [f"{name}={count}" for name, count in counts.items() if count]
          if pressure:
              parts.append(f"memory_pressure={pressure}")
          reasons = sorted({r for _, r in (getattr(res, "respawn_guarded", None) or ()) if r})
          if reasons:
              parts.append("respawn_reasons=" + ",".join(reasons))
          return f"kanban dispatcher tick [{slug}]: " + " ".join(parts)
  notify: Restart hermes-gateway

- name: Log every dispatch tick outcome, not only spawns
  # The loop moved verbatim into _log_spawn_results (gateway/
  # kanban_watchers_dispatcher.py) — same body, same `return any_spawned`
  # contract the caller in kanban_watchers.py still depends on, which this
  # replace does not touch (it only rewrites the for-loop body, not the
  # function's own header/footer).
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/gateway/kanban_watchers_dispatcher.py"
    regexp: |-
      ^([ \t]*)for slug, res in \(results or \[\]\):
      [ \t]*if res is not None and getattr\(res, "spawned", None\):
      [\s\S]*?len\(res\.auto_blocked\) if hasattr\(res\.auto_blocked, "__len__"\) else 0,
      [ \t]*\)$
    replace: |-
      \g<1>for slug, res in (results or []):
      \g<1>    if res is None:
      \g<1>        continue
      \g<1>    if getattr(res, "spawned", None):
      \g<1>        any_spawned = True
      \g<1>    _tick_line = _dispatch_tick_line(slug, res)
      \g<1>    if _tick_line:
      \g<1>        logger.info("%s", _tick_line)
  notify: Restart hermes-gateway

# The global max_in_progress hold leaves no field on the result, so the
# "ready work, nothing spawned" case is logged from the streak counter: on
# the first idle tick and every tenth after (one line per ~10 min at the
# default 60 s interval).
# Rewritten: upstream restructured the if/else block this used to anchor on
# into a single ternary assignment (`bad_ticks = bad_ticks + 1 if
# ready_pending and not any_spawned else 0`), so there is no `bad_ticks +=
# 1` line left to append a log statement inside. Adds a standalone
# conditional log right after the ternary instead, gated on the exact same
# predicate so it fires on the same ticks the old if-branch would have.
# `max_in_progress` also moved: it is no longer a local in this function,
# only reachable via `dispatcher.settings.max_in_progress`.
- name: Log ready work that nothing was spawned for
  # Idempotent: the negative lookahead skips a converge that already landed
  # this block — without it, a second converge would re-match the
  # unmodified anchor line and duplicate the injected if/logger block.
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/gateway/kanban_watchers.py"
    regexp: |-
      ^([ \t]*)bad_ticks = bad_ticks \+ 1 if ready_pending and not any_spawned else 0$(?!\n\1if ready_pending)
    replace: |-
      \1bad_ticks = bad_ticks + 1 if ready_pending and not any_spawned else 0
      \1if ready_pending and not any_spawned and (bad_ticks == 1 or bad_ticks % 10 == 0):
      \1    logger.info(
      \1        "kanban dispatcher tick: spawnable work ready, nothing spawned "
      \1        "for %d tick(s) (max_in_progress=%s)",
      \1        bad_ticks, dispatcher.settings.max_in_progress,
      \1    )
  notify: Restart hermes-gateway

- name: Read back the dispatcher sources
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ hermes_agent_install_dir }}/gateway/kanban_watchers_dispatcher.py"
    - "{{ hermes_agent_install_dir }}/gateway/kanban_watchers.py"
  register: hermes_agent_dispatch_tick_readback
  changed_when: false

# Keyed on the patched result, not the anchors: a regexp that matches nothing
# reports ok and leaves the source unpatched. The helper and the loop it feeds
# both moved to kanban_watchers_dispatcher.py (2026-09 re-path); the
# ready-work-nothing-spawned line has not moved and is asserted against
# kanban_watchers.py.
- name: Assert the dispatch tick log is wired in
  ansible.builtin.assert:
    quiet: true
    that:
      - "'def _dispatch_tick_line(slug, res):' in hermes_agent_dispatch_tick_dispatcher_source"
      - "'_tick_line = _dispatch_tick_line(slug, res)' in hermes_agent_dispatch_tick_dispatcher_source"
      - "'nothing spawned \"' in hermes_agent_dispatch_tick_watchers_source"
    fail_msg: >-
      The pinned Hermes source changed and the dispatch tick log patches did
      not apply; re-anchor them before converging.
  vars:
    hermes_agent_dispatch_tick_dispatcher_source: >-
      {{ hermes_agent_dispatch_tick_readback.results[0].content | b64decode }}
    hermes_agent_dispatch_tick_watchers_source: >-
      {{ hermes_agent_dispatch_tick_readback.results[1].content | b64decode }}
