---
# Reconcile ONE agentic direct-deliver digest cron (Phase 5). Unlike the
# --no-agent enqueuers (reconcile_enqueuer_cron.yml), the gateway RUNS the
# prompt and delivers the model's final response straight to Slack. Mirrors the
# same create-if-absent + checksum-marker remove/recreate idempotency (the CLI's
# `cron edit` is not relied on — recreate re-pins schedule/prompt/skill/deliver
# deterministically).
#
# item fields: name, schedule, EITHER prompt_file (loaded from the pinned
# catalog) OR prompt_var (name of an already-resolved var, inline or
# catalog-preloaded — same lookup('vars', ...) pattern the retired kanban card
# table used), skill (may be ""), enabled, an optional deliver override
# (defaults to the shared digest channel), and optional channel_when_healthy /
# terse_when_healthy (outcome-based routing — see direct-cron-footer.md.j2).
# A job runs here only if it is enabled AND belongs to THIS agent identity.
# Both halves matter and they are not interchangeable: `enabled: false` alone
# has never removed anything (every task below is gated on it, so a disabled
# job is merely not re-created), which is why an identity that should not own
# a job must reach the explicit removal task further down rather than simply
# being skipped. Skipping would leave a previously-installed job firing on
# that guest forever.
- name: "Direct cron | Decide agent ownership for {{ item.name }}"
  ansible.builtin.set_fact:
    hermes_agent_direct_wanted: >-
      {{ (item.enabled | bool)
         and (hermes_agent_id in
              (item.identities | default(hermes_agent_job_identities_default))) }}

- name: "Direct cron | Resolve deliver target for {{ item.name }}"
  ansible.builtin.set_fact:
    hermes_agent_direct_deliver: "{{ item.deliver | default('slack:' ~ hermes_agent_digest_slack_channel) }}"

- name: "Direct cron | Load prompt + append reporting footer for {{ item.name }}"
  ansible.builtin.set_fact:
    hermes_agent_direct_prompt: >-
      {{ ((lookup('vars', item.prompt_var) if item.prompt_var is defined else
           lookup('ansible.builtin.file', hermes_agent_prompts_path ~ '/'
             ~ item.prompt_file, rstrip=false))
          | regex_replace('(?s)^---\n.*?\n---\n', '') | trim)
         ~ '\n\n' ~
         (lookup('template', role_path ~ '/templates/direct-cron-footer.md.j2',
                 template_vars={'item': item, 'deliver': hermes_agent_direct_deliver}) | trim) }}
  when: hermes_agent_direct_wanted | bool

# --workdir is not cosmetic: read from the pinned hermes-agent v2026.8.3
# source (hermes_cli/subcommands/cron.py) and its own docs (website/docs/
# user-guide/features/cron.md) — "Cron jobs default to running detached from
# any repo ... the terminal / file / code-exec tools run from whatever
# working directory the gateway started in. Pass --workdir ... to change
# that." Omitting it is what put the `review` cron's filesystem tools at
# whatever cwd the ticking process happened to start in rather than
# HERMES_HOME — for the 7 profile-scoped jobs (item.hermes_home set) that
# ticking process is the `*/5 * * * *` crontab trigger, whose cwd is the
# hermes user's plain $HOME, one level above the actual profile home. Pinned
# to the same value already used for the HERMES_HOME env var below, so a
# profile-scoped job's tools land in its own profile home.
- name: "Direct cron | Build create argv for {{ item.name }}"
  ansible.builtin.set_fact:
    hermes_agent_direct_argv: >-
      {{ [hermes_agent_bin, 'cron', 'create', item.schedule,
          hermes_agent_direct_prompt, '--name', item.name]
         + (['--skill', item.skill] if (item.skill | default('') | length > 0) else [])
         + ['--deliver', hermes_agent_direct_deliver,
            '--workdir', item.hermes_home | default(hermes_agent_hermes_home)] }}
  when: hermes_agent_direct_wanted | bool

# Deliberately NOT gated on hermes_agent_direct_wanted: the removal task below
# needs to know whether an unwanted job is currently installed, and that is
# exactly the case where the gate is false. Read-only either way.
- name: "Direct cron | Look up {{ item.name }}"
  ansible.builtin.command: "{{ hermes_agent_bin }} cron list --all"
  environment:
    HERMES_HOME: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_direct_cron_list
  changed_when: false

# Withdraw a job this agent must not run. Without this, scoping a job to
# another identity would only stop it being RE-created: an agent that already
# had it installed would keep firing it indefinitely, which is precisely how a
# second agent ended up duplicating the first agent's duties.
- name: "Direct cron | Remove job not owned by this agent: {{ item.name }}"
  ansible.builtin.command: "{{ hermes_agent_bin }} cron remove {{ item.name }}"
  environment:
    HERMES_HOME: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_direct_cron_withdraw
  # `hermes cron remove` exits 1 on an already-absent job ("... not found"),
  # but absent IS the desired state here — a list-guard race or a substring
  # match in `cron list` output must not abort the play. Fail only on a real
  # removal error; report changed only when something was actually removed.
  changed_when: hermes_agent_direct_cron_withdraw.rc == 0
  failed_when: >-
    hermes_agent_direct_cron_withdraw.rc != 0
    and 'not found' not in hermes_agent_direct_cron_withdraw.stdout
  when:
    - not (hermes_agent_direct_wanted | bool)
    - item.name in (hermes_agent_direct_cron_list.stdout | default(''))

# Drop the desired-state marker too, so a later re-scoping of this job back to
# this agent is seen as absent-and-create rather than unchanged-and-skip.
- name: "Direct cron | Clear desired-state marker for withdrawn {{ item.name }}"
  ansible.builtin.file:
    path: "{{ hermes_agent_managed_cron_state_dir }}/{{ item.name }}.sha256"
    state: absent
  when: not (hermes_agent_direct_wanted | bool)

# 'workdir' is IN the checksum, not just the create argv, so a guest
# converged before --workdir was added sees this as drift and gets its
# existing (no-workdir) job removed and re-created below — a converge is
# what heals an already broken job, not just what stops new ones from
# breaking.
- name: "Direct cron | Calculate desired state for {{ item.name }}"
  ansible.builtin.set_fact:
    hermes_agent_direct_checksum: >-
      {{ {'schedule': item.schedule, 'prompt': hermes_agent_direct_prompt,
          'skill': item.skill | default(''),
          'deliver': hermes_agent_direct_deliver,
          'workdir': item.hermes_home | default(hermes_agent_hermes_home)}
         | to_json | hash('sha256') }}
  when: hermes_agent_direct_wanted | bool

- name: "Direct cron | Check desired-state marker for {{ item.name }}"
  ansible.builtin.copy:
    content: "{{ hermes_agent_direct_checksum }}\n"
    dest: "{{ hermes_agent_managed_cron_state_dir }}/{{ item.name }}.sha256"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  check_mode: true
  register: hermes_agent_direct_marker_probe
  when: hermes_agent_direct_wanted | bool

# A changed marker on an EXISTING job means schedule/prompt/skill/deliver
# drifted: remove it so the create below re-pins the new definition. No drift
# (or a job that does not exist yet) is a no-op here.
- name: "Direct cron | Remove drifted {{ item.name }}"
  ansible.builtin.command: "{{ hermes_agent_bin }} cron remove {{ item.name }}"
  environment:
    HERMES_HOME: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_direct_cron_drift_remove
  # `hermes cron remove` exits 1 on an already-absent job ("... not found"),
  # but absent IS the desired state here — a list-guard race or a substring
  # match in `cron list` output must not abort the play. Fail only on a real
  # removal error; report changed only when something was actually removed.
  changed_when: hermes_agent_direct_cron_drift_remove.rc == 0
  failed_when: >-
    hermes_agent_direct_cron_drift_remove.rc != 0
    and 'not found' not in hermes_agent_direct_cron_drift_remove.stdout
  when:
    - hermes_agent_direct_wanted | bool
    - item.name in (hermes_agent_direct_cron_list.stdout | default(''))
    - hermes_agent_direct_marker_probe.changed | bool

- name: "Direct cron | Create {{ item.name }}"
  ansible.builtin.command:
    argv: "{{ hermes_agent_direct_argv }}"
  environment:
    HERMES_HOME: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  when:
    - hermes_agent_direct_wanted | bool
    - >-
      item.name not in (hermes_agent_direct_cron_list.stdout | default(''))
      or hermes_agent_direct_marker_probe.changed | bool

- name: "Direct cron | Record desired state for {{ item.name }}"
  ansible.builtin.copy:
    content: "{{ hermes_agent_direct_checksum }}\n"
    dest: "{{ hermes_agent_managed_cron_state_dir }}/{{ item.name }}.sha256"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  when: hermes_agent_direct_wanted | bool
