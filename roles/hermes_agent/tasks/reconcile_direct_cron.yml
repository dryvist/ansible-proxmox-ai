---
# Reconcile the direct-deliver crons in hermes_agent_direct_reconcile_jobs
# (Phase 5). Every task loops over the whole list, so a converge costs one task
# per step instead of one per step per job. By default, the gateway RUNS the
# prompt and delivers the model's final response straight to Slack. An item
# with `no_agent: true` runs its script and delivers stdout verbatim. It uses
# the same create-if-absent + checksum-marker remove/recreate idempotency (the
# CLI's `cron edit` is not relied on — recreate re-pins schedule/prompt/skill/
# model/provider/deliver deterministically).
#
# Fields: name, schedule, prompt_file(s) or prompt_var, skill, enabled, optional
# deliver/channel_when_healthy/model/model_provider/script/wall_clock_seconds.
# wall_clock_seconds is consumed by the aggregate scheduler deadline patch;
# without it, jobs use the role's derived shared limit.
# Jobs require enabled + identity ownership. Disabled jobs are not recreated;
# unowned existing jobs are explicitly removed to prevent stale cron execution.
# `no_agent: true` requires a script and omits the prompt and model.
- name: "Direct cron | Validate script-only items"
  ansible.builtin.assert:
    quiet: true
    that:
      - item.script | default('') | length > 0
      - item.enabled_toolsets is not defined
    fail_msg: >-
      A no-agent direct cron requires a script and cannot set enabled_toolsets.
  loop: "{{ hermes_agent_direct_reconcile_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.no_agent | default(false) | bool

# One plan entry per job: ownership, targets, prompt, create argv, checksum,
# installed and drift. Every task below reads hermes_agent_direct_plan.
- name: "Direct cron | Build the plan"
  ansible.builtin.import_tasks: reconcile_direct_cron_plan.yml

# Only a wanted job must find its home listed. A home that does not exist
# holds no installed job, so an unwanted job there has nothing to withdraw;
# a wanted job on a missing home is reported by the batch's fail task.
- name: "Direct cron | Fail when a wanted job's home has no job list"
  ansible.builtin.fail:
    msg: >-
      Hermes direct cron job '{{ item.name }}' is wanted here, but no job list was
      read for '{{ item.hermes_home | default(hermes_agent_hermes_home) }}'.
  loop: "{{ hermes_agent_direct_reconcile_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not (ansible_check_mode and (hermes_agent_install.changed | default(false)))
    - hermes_agent_direct_plan[item.name].wanted | bool
    - >-
      (item.hermes_home | default(hermes_agent_hermes_home))
      not in (hermes_agent_direct_cron_lists | default({}))

# The main-channel rule for each job, on the targets resolved above (defaults,
# the profile remap and channel_when_healthy all count). Only an enabled job
# this agent owns is checked: the plan's guard entry requires it to be wanted.
- name: "Direct cron | Refuse the main channel as a target"
  ansible.builtin.include_tasks:
    file: refuse_main_channel_target.yml
    apply:
      tags: hermes_crons
  tags: hermes_crons
  vars:
    refuse_target_name: "{{ item.name }}"
    refuse_home: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
    refuse_deliver: "{{ hermes_agent_direct_plan[item.name].deliver }}"
    refuse_failure: "{{ hermes_agent_direct_plan[item.name].failure_deliver }}"
    refuse_footer: "{{ item.channel_when_healthy | default('') }}"
  loop: "{{ hermes_agent_direct_reconcile_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  when: hermes_agent_direct_plan[item.name].guard | bool

# Withdraw a job this agent must not run, when it is installed or still has a
# marker. The tasks live in reconcile_direct_cron_withdraw.yml.
- name: "Direct cron | Withdraw jobs not owned by this agent"
  ansible.builtin.include_tasks:
    file: reconcile_direct_cron_withdraw.yml
    apply:
      tags: hermes_crons
  tags: hermes_crons
  vars:
    hermes_agent_direct_wanted: false
    hermes_agent_direct_cron_list:
      stdout: >-
        {{ (hermes_agent_direct_cron_lists | default({}))
           .get(item.hermes_home | default(hermes_agent_hermes_home), '') }}
  loop: "{{ hermes_agent_direct_reconcile_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not (hermes_agent_direct_plan[item.name].wanted | bool)
    - >-
      (hermes_agent_direct_plan[item.name].installed | bool)
      or item.name in (hermes_agent_direct_markers | default({}))

# A changed marker on an EXISTING job means schedule/prompt/skill/model/provider/
# deliver drifted: remove it so the create below re-pins the new definition. No
# drift (or a job that does not exist yet) is a no-op here.
- name: "Direct cron | Remove drifted jobs"
  ansible.builtin.command: >-
    {{ hermes_agent_bin }} {{ hermes_agent_cli_profile_args | join(' ') }}
    cron remove {{ item.name }}
  environment:
    HERMES_HOME: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  vars:
    hermes_agent_cli_home: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  loop: "{{ hermes_agent_direct_reconcile_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  register: hermes_agent_direct_cron_drift_remove
  # `hermes cron remove` exits 1 on an already-absent job ("... not found").
  # A stale list or concurrent remove can produce that result; fail only on a
  # real removal error and report changed only when a job was removed.
  changed_when: hermes_agent_direct_cron_drift_remove.rc == 0
  failed_when: >-
    hermes_agent_direct_cron_drift_remove.rc != 0
    and 'not found' not in hermes_agent_direct_cron_drift_remove.stdout
  when:
    - hermes_agent_direct_plan[item.name].wanted | bool
    - hermes_agent_direct_plan[item.name].installed | bool
    - hermes_agent_direct_plan[item.name].changed | bool
    - not ansible_check_mode

# Installed is the complete Name field from the cached authoritative cron list.
# A substring match can mistake a similarly named job for this one.
- name: "Direct cron | Create jobs"
  ansible.builtin.command:
    argv: "{{ hermes_agent_direct_plan[item.name].argv }}"
  environment:
    HERMES_HOME: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  loop: "{{ hermes_agent_direct_reconcile_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - hermes_agent_direct_plan[item.name].wanted | bool
    - item.enabled_toolsets is not defined
    - >-
      not (hermes_agent_direct_plan[item.name].installed | bool)
      or hermes_agent_direct_plan[item.name].changed | bool

- name: "Direct cron | Create jobs with job-scoped toolsets"
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_venv_python }}"
      - -c
      - >-
        import json,sys; from tools.cronjob_tools import cronjob;
        result=json.loads(cronjob(**json.load(sys.stdin)));
        print(json.dumps(result)); sys.exit(0 if result.get('success') else 1)
    stdin: "{{ hermes_agent_direct_plan[item.name].spec | to_json }}"
  environment:
    HERMES_HOME: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  loop: "{{ hermes_agent_direct_reconcile_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - hermes_agent_direct_plan[item.name].wanted | bool
    - item.enabled_toolsets is defined
    - >-
      not (hermes_agent_direct_plan[item.name].installed | bool)
      or hermes_agent_direct_plan[item.name].changed | bool

# Only when the marker is missing or stale: a matching marker is already the
# desired state, so an unchanged job makes no remote call at all.
- name: "Direct cron | Record desired state"
  ansible.builtin.copy:
    content: "{{ hermes_agent_direct_plan[item.name].checksum }}\n"
    dest: "{{ hermes_agent_managed_cron_state_dir }}/{{ item.name }}.sha256"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  loop: "{{ hermes_agent_direct_reconcile_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - hermes_agent_direct_plan[item.name].wanted | bool
    - hermes_agent_direct_plan[item.name].changed | bool
