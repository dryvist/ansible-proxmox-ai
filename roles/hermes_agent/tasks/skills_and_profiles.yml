---
- name: Ensure the wiki directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_wiki_path }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
  when: hermes_agent_wiki_enabled | bool

- name: Materialize llm-wiki skill
  ansible.builtin.copy:
    src: "{{ hermes_agent_install_dir }}/optional-skills/research/llm-wiki"
    dest: "{{ hermes_agent_hermes_home }}/skills/"
    remote_src: true
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: preserve
  # A check run reads the old checkout, which may not ship this path yet.
  when:
    - hermes_agent_wiki_enabled | bool
    - not (ansible_check_mode and (hermes_agent_install.changed | default(false)))

- name: Materialize upstream github skills
  ansible.builtin.copy:
    src: "{{ hermes_agent_install_dir }}/skills/software-development/github"
    dest: "{{ hermes_agent_hermes_home }}/skills/"
    remote_src: true
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: preserve
  when: not (ansible_check_mode and (hermes_agent_install.changed | default(false)))

# All dryvist skills (docs-pr, github-issues, zammad-incidents, splunk-monitor)
# arrive in one copy from the nix-hermes bundle built above. This deploys
# BEFORE the curriculum and every cron-seeding step, so `cron create --skill
# dryvist/splunk-monitor` (and zammad-incidents delivery references) always
# resolve. splunk-monitor is present even when the monitor fleet is disabled —
# an unreferenced skill on disk is inert.
- name: Deploy the dryvist skills from the nix-hermes bundle
  ansible.builtin.copy:
    src: "{{ hermes_agent_bundle_path }}/skills/dryvist/"
    dest: "{{ hermes_agent_hermes_home }}/skills/dryvist/"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
    directory_mode: "0750"

- name: Deploy the Hermes GitHub issue API skill
  ansible.builtin.copy:
    src: github-issues-api/
    dest: "{{ hermes_agent_hermes_home }}/skills/hermes_agent/github-issues-api/"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
    directory_mode: "0750"

- name: Deploy the official Browser Use skill from the nix-hermes bundle
  ansible.builtin.copy:
    src: "{{ hermes_agent_bundle_path }}/skills/browser-use/"
    dest: "{{ hermes_agent_hermes_home }}/skills/browser-use/"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
    directory_mode: "0750"

- name: Remove the conflicting legacy Zammad skill copy
  ansible.builtin.file:
    path: "{{ hermes_agent_hermes_home }}/skills/research/dryvist-zammad-incidents"
    state: absent

# --- Named operating profiles (see hermes_agent_profiles, defaults/main.yml) --
# Runs AFTER the shared dryvist skills bundle above (so hermes_agent_bundle_path
# is resolved and every profile-scoped skill copy below has a source) and
# BEFORE the Kanban enqueuer crons are reconciled (so a card's --assignee and
# --skill always resolve against a profile that already exists on first
# converge, never a race between the two).
- name: Reconcile named Hermes operating profiles
  ansible.builtin.include_tasks:
    file: profiles.yml
    apply:
      tags: hermes_profiles_env
  tags: hermes_profiles_env
  loop: "{{ hermes_agent_profiles }}"
  loop_control:
    label: "{{ item.name }}"

- name: Record managed profile file checksums after all profile writers
  ansible.builtin.include_tasks: source_guard_record.yml
  when: hermes_agent_source_guard_enabled | bool

# An identity that runs no profiles keeps none in Hermes's scan path. Leftover directories are moved, never deleted.
- name: Find leftover profile directories on an identity that runs no profiles
  ansible.builtin.find:
    paths: "{{ hermes_agent_hermes_home }}/profiles"
    file_type: directory
    recurse: false
  register: _hermes_agent_leftover_profiles
  when: hermes_agent_profiles_forced_off | bool

- name: Ensure the retired profiles directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_retired_profiles_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - hermes_agent_profiles_forced_off | bool
    - _hermes_agent_leftover_profiles.files | default([]) | length > 0

- name: Move leftover profile directories out of the profile scan
  ansible.builtin.command:
    argv:
      - mv
      - --no-target-directory
      - "{{ item.path }}"
      # A UTC suffix keeps a directory that reappears from colliding with an earlier retired copy.
      - "{{ hermes_agent_retired_profiles_dir }}/{{ item.path | basename }}-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"
    removes: "{{ item.path }}"
  loop: "{{ _hermes_agent_leftover_profiles.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: hermes_agent_profiles_forced_off | bool
