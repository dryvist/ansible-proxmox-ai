---
- name: Require an explicit DNS hostname for the restrictive proxy policy
  ansible.builtin.assert:
    that:
      - _hermes_agent_egress_host is string
      - >-
        _hermes_agent_egress_host is
        match('^[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?(?:[.][a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?)+$')
      - _hermes_agent_egress_host is not match('^[0-9.]+$')
    fail_msg: >-
      Pepper egress requires a non-secret DNS hostname in {{ item }};
      configure that inventory variable without a URL, address, credentials or wildcard.

- name: Add the validated hostname to the shared allowlist
  ansible.builtin.set_fact:
    hermes_agent_pepper_egress_domains: >-
      {{ (hermes_agent_pepper_egress_domains + [_hermes_agent_egress_host | lower]) | unique | list }}
