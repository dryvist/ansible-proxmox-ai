---
# enabled: false in defaults stops reconcile re-creating a job; this pause
# stops the copy already on the guest (disable-don't-delete).
- name: Pause the direct crons declared disabled
  ansible.builtin.command: "{{ hermes_agent_bin }} cron pause {{ item.name }}"
  environment:
    HERMES_HOME: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_pause_disabled
  changed_when: not ansible_check_mode and hermes_agent_pause_disabled.rc == 0
  failed_when: >-
    not ansible_check_mode
    and hermes_agent_pause_disabled.rc != 0
    and 'not found' not in hermes_agent_pause_disabled.stdout
  loop: "{{ hermes_agent_direct_cron_jobs | selectattr('enabled', 'defined') | rejectattr('enabled') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - >-
      ((hermes_agent_direct_cron_lists | default({})).get(
        item.hermes_home | default(hermes_agent_hermes_home), '')
      | regex_search('(?m)^[ \\t]*Name:[ \\t]*' ~ (item.name | regex_escape) ~ '[ \\t]*$')) is not none
    - >-
      ((hermes_agent_direct_cron_lists | default({})).get(
        item.hermes_home | default(hermes_agent_hermes_home), '')
      | regex_search('(?m)^.*\\[paused\\].*\\n[ \\t]*Name:[ \\t]*'
                     ~ (item.name | regex_escape) ~ '[ \\t]*$')) is none
