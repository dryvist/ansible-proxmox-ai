---
# Layer 1 — role-wide read-only gates. The identity-bound facade check is first
# because it selects the MCP set rendered by every Hermes config. Brain wiring
# checks follow before any installation or deployment.
- name: Assert facade canary caller binding before converging
  ansible.builtin.import_tasks: assert_facade_canary.yml

- name: Assert brain-wiring contracts before converging
  ansible.builtin.import_tasks: assert.yml
