---
# The guard this failure mode demands: "toolset allowlisted, backend dead" sat
# undetected from first deploy until 2026-07-31, because nothing between the
# converge and a worker's failed tool call ever checked that the web toolset
# could actually answer. Run the upstream backend resolution inside the venv,
# as the hermes user against the deployed config, and FAIL the converge if the
# configured search backend does not resolve as available. Ordered before the
# enqueuer-cron reconcile below on purpose: a converge where search is dead
# stops here and cannot (re-)enable any card that depends on it. Runs the same
# code path the agent runs, so it also breaks loudly if a hermes self-update
# renames these internals — same posture as the source patches above.
- name: Assert the configured web search backend resolves as available
  ansible.builtin.command:
    chdir: "{{ hermes_agent_install_dir }}"
    cmd: >-
      {{ hermes_agent_venv_python }} -c
      "from tools.web_tools import _get_search_backend, _is_backend_available;
      b = _get_search_backend();
      assert _is_backend_available(b), 'web search backend %r unavailable' % b;
      print(b)"
  become: true
  become_user: "{{ hermes_agent_user }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  changed_when: false
  # Read-only; a check run needs the live value to preview web-search readiness.
  check_mode: false

# The splunk-admin fleet ran hourly against a 401ing token for a week (WS1,
# 2026-07-31) because nothing between the converge and a worker's failed tool
# call ever checked that the DELIVERED credential authenticates — the card
# `enabled` gate deliberately excludes the token (fail-to-auth, not
# stay-disabled), so the failure was silent by design. Close that gap at the
# converge with a POST of an MCP initialize to the same gateway route the
# profile dials, from the guest, with the token just delivered — split into a
# hidden probe and a visible assert so a bad status is diagnosable without
# printing the bearer header. The probe accepts 401/403 as well as 200 so an
# auth failure reaches the assert as a real status code instead of an opaque
# no_log module failure, and changed_when: false keeps a read-only probe from
# reporting changed every run. Skipped when the integration is off, the URL
# is unrendered (matches the `mcp_servers.splunk` gate in config.yaml.j2), or
# the token is unseeded (the documented inert posture).
- name: Probe the Splunk MCP token against the gateway route
  ansible.builtin.uri:
    url: "{{ hermes_agent_splunk_mcp_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ hermes_agent_splunk_mcp_token }}"
      Accept: application/json, text/event-stream
    body_format: json
    body:
      jsonrpc: "2.0"
      id: 1
      method: initialize
      params:
        protocolVersion: "2025-03-26"
        capabilities: {}
        clientInfo:
          name: converge-assert
          version: "0"
    status_code:
      - 200
      - 401
      - 403
    timeout: 15
  register: hermes_agent_splunk_mcp_probe
  changed_when: false
  no_log: true
  when:
    - hermes_agent_splunk_mcp_enabled | bool
    - hermes_agent_splunk_mcp_url | length > 0
    - hermes_agent_splunk_mcp_token | length > 0

- name: Assert the Splunk MCP token authenticates against the gateway route
  ansible.builtin.assert:
    that:
      - hermes_agent_splunk_mcp_probe.status == 200
    fail_msg: >-
      Splunk MCP token delivered but the gateway route returned HTTP
      {{ hermes_agent_splunk_mcp_probe.status }} instead of 200 — the
      credential is not authenticating.
    quiet: true
  when:
    - hermes_agent_splunk_mcp_enabled | bool
    - hermes_agent_splunk_mcp_url | length > 0
    - hermes_agent_splunk_mcp_token | length > 0
    - not ansible_check_mode

- name: Find Hermes Kanban database files under the shared home
  ansible.builtin.find:
    paths:
      - "{{ hermes_agent_hermes_home }}"
    patterns: kanban.db
    recurse: true
    hidden: true
    file_type: file
  register: hermes_agent_kanban_db_files
  changed_when: false
  # Read-only; a check run must inspect the live local board-file contract.
  check_mode: false

- name: Warn about Hermes Kanban database copies outside the resolver path
  ansible.builtin.debug:
    msg: >-
      WARNING: Hermes Kanban database copy outside the resolver path:
      {{ item.path }}
  loop: >-
    {{ hermes_agent_kanban_db_files.files
       | rejectattr('path', 'equalto', hermes_agent_hermes_home ~ '/kanban.db')
       | list }}
  loop_control:
    label: "{{ item.path }}"

- name: Assert an existing Hermes Kanban database is at the resolver path
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        hermes_agent_kanban_db_files.matched | int == 0
        or (hermes_agent_hermes_home ~ '/kanban.db') in
        (hermes_agent_kanban_db_files.files | map(attribute='path') | list)
    fail_msg: >-
      Hermes found Kanban database file(s) but none at the resolver path
      {{ hermes_agent_hermes_home }}/kanban.db. Found
      {{ hermes_agent_kanban_db_files.files | map(attribute='path') | list }}.
  # A new home has no database until the first gateway start; preserve that
  # first-deploy pass while rejecting homes that only contain off-path copies.

- name: Stat the Hermes home for each direct-cron skill reference
  ansible.builtin.stat:
    path: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  loop: >-
    {{ hermes_agent_direct_cron_jobs
       | selectattr('skill', 'defined')
       | rejectattr('skill', 'equalto', '')
       | list }}
  loop_control:
    label: "{{ item.name }}: {{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  register: hermes_agent_direct_cron_skill_homes
  changed_when: false
  # Read-only; a check run must inspect the homes selected for reconciliation.
  check_mode: false
  when:
    - hermes_agent_direct_job_wanted | bool
    - >-
      (item.hermes_home | default(hermes_agent_hermes_home))
      in hermes_agent_plugin_homes

- name: Stat every declared direct-cron skill reference
  ansible.builtin.stat:
    path: >-
      {{ (item.hermes_home | default(hermes_agent_hermes_home))
         ~ '/skills/' ~ item.skill ~ '/SKILL.md' }}
  loop: >-
    {{ hermes_agent_direct_cron_skill_homes.results
       | selectattr('stat', 'defined')
       | selectattr('stat.isdir')
       | map(attribute='item')
       | list }}
  loop_control:
    label: "{{ item.name }}: {{ item.skill }}"
  register: hermes_agent_direct_cron_skill_stats
  changed_when: false
  # Read-only; a check run must inspect the deployed skill references.
  check_mode: false

- name: Assert every declared direct-cron skill is installed in its job home
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        hermes_agent_direct_cron_skill_stats.results
        | selectattr('stat.exists', 'equalto', false)
        | list | length == 0
    fail_msg: >-
      Direct-cron jobs reference skills that are not installed in their selected
      Hermes homes: {{ hermes_agent_direct_cron_skill_stats.results
      | selectattr('stat.exists', 'equalto', false)
      | map(attribute='item.name') | list }}.
  when: hermes_agent_direct_cron_skill_stats.results | default([]) | length > 0

- name: Read Vikunja projects for the enabled Hermes bridge
  ansible.builtin.uri:
    url: "{{ hermes_agent_vikunja_bridge_url | regex_replace('/+$', '') }}/api/v1/projects"
    method: GET
    headers:
      Authorization: "Bearer {{ hermes_agent_vikunja_bridge_token }}"
      Accept: application/json
    return_content: true
    status_code: 200
    follow_redirects: none
    use_proxy: false
    timeout: 15
  register: hermes_agent_vikunja_bridge_projects
  changed_when: false
  no_log: true
  # Read-only; a check run must compare the declared bridge contract to Vikunja.
  check_mode: false
  when: hermes_agent_vikunja_bridge_enabled | bool

- name: Assert the enabled Hermes bridge project exists exactly once
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        (hermes_agent_vikunja_bridge_projects.json
         | selectattr('title', 'equalto', hermes_agent_vikunja_bridge_project)
         | list | length) == 1
    fail_msg: >-
      The enabled Hermes bridge project {{ hermes_agent_vikunja_bridge_project }}
      must resolve to exactly one Vikunja project.
  when: hermes_agent_vikunja_bridge_enabled | bool

- name: Read the enabled Hermes bridge project's views
  ansible.builtin.uri:
    url: >-
      {{ hermes_agent_vikunja_bridge_url | regex_replace('/+$', '')
      }}/api/v1/projects/{{ (hermes_agent_vikunja_bridge_projects.json
      | selectattr('title', 'equalto', hermes_agent_vikunja_bridge_project)
      | first).id }}/views
    method: GET
    headers:
      Authorization: "Bearer {{ hermes_agent_vikunja_bridge_token }}"
      Accept: application/json
    return_content: true
    status_code: 200
    follow_redirects: none
    use_proxy: false
    timeout: 15
  register: hermes_agent_vikunja_bridge_views
  changed_when: false
  no_log: true
  check_mode: false
  when: hermes_agent_vikunja_bridge_enabled | bool

- name: Select the enabled Hermes bridge's Kanban view
  ansible.builtin.set_fact:
    hermes_agent_vikunja_bridge_kanban_views: >-
      {{ (hermes_agent_vikunja_bridge_views.json
          | selectattr('view_kind', 'equalto', 3) | list)
         + (hermes_agent_vikunja_bridge_views.json
            | selectattr('view_kind', 'string')
            | selectattr('view_kind', 'match', '(?i)^kanban$') | list) }}
  when: hermes_agent_vikunja_bridge_enabled | bool

- name: Assert the enabled Hermes bridge project has exactly one Kanban view
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_agent_vikunja_bridge_kanban_views | length == 1
    fail_msg: >-
      The enabled Hermes bridge project must have exactly one Kanban view;
      found {{ hermes_agent_vikunja_bridge_kanban_views | length }}.
  when: hermes_agent_vikunja_bridge_enabled | bool

- name: Read the enabled Hermes bridge Kanban view's buckets
  ansible.builtin.uri:
    url: >-
      {{ hermes_agent_vikunja_bridge_url | regex_replace('/+$', '')
      }}/api/v1/projects/{{ (hermes_agent_vikunja_bridge_projects.json
      | selectattr('title', 'equalto', hermes_agent_vikunja_bridge_project)
      | first).id }}/views/{{ (hermes_agent_vikunja_bridge_kanban_views | first).id }}/tasks
    method: GET
    headers:
      Authorization: "Bearer {{ hermes_agent_vikunja_bridge_token }}"
      Accept: application/json
    return_content: true
    status_code: 200
    follow_redirects: none
    use_proxy: false
    timeout: 15
  register: hermes_agent_vikunja_bridge_buckets
  changed_when: false
  no_log: true
  check_mode: false
  when: hermes_agent_vikunja_bridge_enabled | bool

- name: Assert configured Hermes bridge bucket names exist in the Kanban view
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_agent_vikunja_bridge_bucket_ready | trim | length > 0
      - >-
        hermes_agent_vikunja_bridge_bucket_ready
        in hermes_agent_vikunja_bridge_found_bucket_names
    fail_msg: >-
      The required Ready bucket is absent from the Vikunja Kanban view:
      {{ hermes_agent_vikunja_bridge_bucket_ready }}.
    success_msg: The required Ready bucket exists in the Kanban view.
  vars:
    hermes_agent_vikunja_bridge_found_bucket_names: >-
      {{ hermes_agent_vikunja_bridge_buckets.json
         | map(attribute='title') | list }}
  when: hermes_agent_vikunja_bridge_enabled | bool
