---
- name: Ensure the Hermes dashboard unit drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/hermes-dashboard.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the Hermes dashboard journal identifier for rsyslog forwarding
  ansible.builtin.template:
    src: hermes-dashboard-logging.conf.j2
    dest: /etc/systemd/system/hermes-dashboard.service.d/10-logging.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart hermes-dashboard

# Restart=always now lives in the shared unit; remove the
# stale drop-in a prior mechanism left behind (Restart=on-failure, dated Jul 6)
# so it can't override the unit's own policy.
- name: Remove the stale restart-policy drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/hermes-gateway.service.d/99-restart-policy.conf
    state: absent
  notify: Restart hermes-gateway
