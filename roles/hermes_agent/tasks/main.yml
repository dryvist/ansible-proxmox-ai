---
# NousResearch Hermes Agent — native install + headless gateway daemon. Idempotent.
#
# The agent runs arbitrary terminal + web tools, so it runs as a NON-root dedicated
# user; the LXC is the blast-radius boundary. Ansible owns the PLATFORM (user,
# install, config, systemd); the Hermes daemon owns its own app lifecycle
# (`hermes update`) — install once behind a `creates` guard and never pin a moving
# 'latest' (Agy: avoids the self-update vs idempotency conflict).
#
# NOT YET LIVE-VALIDATED (verify on first converge): (a) install.sh running clean
# non-interactively as root on a minimal Debian LXC; (b) `hermes gateway run
# --replace` staying up headless with no messaging platform; (c) Hindsight
# provider init from config.yaml alone (it may need its client package on
# first run).

# Layer 1 — render-time contract assertions. Imported FIRST so a known-bad brain
# config (context below the 64k floor, inverted timeout chain) fails the play
# before anything is installed or deployed. Inherits the play's hermes_agent tag.
- name: Assert brain-wiring contracts before converging
  ansible.builtin.import_tasks: assert.yml

- name: Build the pinned prompt catalog on the controller
  ansible.builtin.command:
    cmd: >-
      nix build --out-link /tmp/hermes-agent-prompts --print-out-paths
      "{{ hermes_agent_prompts_flake_ref }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  run_once: true
  register: hermes_agent_prompts_build
  changed_when: false

- name: Resolve the prompt catalog package path
  ansible.builtin.set_fact:
    hermes_agent_prompts_path: >-
      {{ hermes_agent_prompts_build.stdout_lines | last
         }}/share/ai-llm-prompts/auto-ai-agent

- name: Load active Hermes prompts from the immutable catalog
  ansible.builtin.set_fact:
    # The fabric-status body is the one prompt that needs live topology appended:
    # the catalog is public, so it cannot name an endpoint, and without one the
    # worker invents addresses and reports a healthy fabric as a total outage.
    # See hermes_agent_daily_status_endpoints in defaults for the measurement.
    hermes_agent_daily_status_cron_prompt: >-
      {{ (lookup('ansible.builtin.file', hermes_agent_prompts_path ~ '/'
          ~ hermes_agent_daily_status_cron_prompt_file, rstrip=false)
          | regex_replace('(?s)^---\n.*?\n---\n', '') | trim)
         ~ '\n\n' ~ hermes_agent_daily_status_endpoints | trim }}
    hermes_agent_nightly_wiki_cron_prompt: >-
      {{ lookup('ansible.builtin.file', hermes_agent_prompts_path ~ '/'
         ~ hermes_agent_nightly_wiki_cron_prompt_file, rstrip=false)
         | regex_replace('(?s)^---\n.*?\n---\n', '') | trim }}
    hermes_agent_splunk_triage_cron_prompt: >-
      {{ lookup('ansible.builtin.file', hermes_agent_prompts_path ~ '/'
         ~ hermes_agent_splunk_triage_cron_prompt_file, rstrip=false)
         | regex_replace('(?s)^---\n.*?\n---\n', '') | trim }}
    hermes_agent_splunk_security_cron_prompt: >-
      {{ lookup('ansible.builtin.file', hermes_agent_prompts_path ~ '/'
         ~ hermes_agent_splunk_security_cron_prompt_file, rstrip=false)
         | regex_replace('(?s)^---\n.*?\n---\n', '') | trim }}
    hermes_agent_splunk_parsing_cron_prompt: >-
      {{ lookup('ansible.builtin.file', hermes_agent_prompts_path ~ '/'
         ~ hermes_agent_splunk_parsing_cron_prompt_file, rstrip=false)
         | regex_replace('(?s)^---\n.*?\n---\n', '') | trim }}
    hermes_agent_splunk_deepdive_cron_prompt: >-
      {{ lookup('ansible.builtin.file', hermes_agent_prompts_path ~ '/'
         ~ hermes_agent_splunk_deepdive_cron_prompt_file, rstrip=false)
         | regex_replace('(?s)^---\n.*?\n---\n', '') | trim }}
    hermes_agent_github_monitor_cron_prompt: >-
      {{ lookup('ansible.builtin.file', hermes_agent_prompts_path ~ '/'
         ~ hermes_agent_github_monitor_cron_prompt_file, rstrip=false)
         | regex_replace('(?s)^---\n.*?\n---\n', '') | trim }}
    hermes_agent_webhook_prompt: >-
      {{ lookup('ansible.builtin.file', hermes_agent_prompts_path ~ '/'
         ~ hermes_agent_webhook_prompt_file, rstrip=false)
         | regex_replace('(?s)^---\n.*?\n---\n', '') | trim }}
    hermes_agent_bot_pr_triage_cron_prompt: >-
      {{ lookup('ansible.builtin.file', hermes_agent_prompts_path ~ '/'
         ~ hermes_agent_bot_pr_triage_cron_prompt_file, rstrip=false)
         | regex_replace('(?s)^---\n.*?\n---\n', '') | trim }}
    hermes_agent_docs_sync_cron_prompt: >-
      {{ lookup('ansible.builtin.file', hermes_agent_prompts_path ~ '/'
         ~ hermes_agent_docs_sync_cron_prompt_file, rstrip=false)
         | regex_replace('(?s)^---\n.*?\n---\n', '') | trim }}

# The splunk-digest kanban card that used to write memory key
# "splunk-digest-last" is REMOVED (see defaults, hermes_agent_kanban_cards);
# hermes-splunk-triage's catalog prompt used to recall that key before
# alerting, which was a dangling read once nothing wrote it any more — always
# missed, so the "already covered, don't re-alert" branch could never fire.
# Fixed in the ai-llm-prompts catalog (splunk-triage now recalls its own
# "splunk-triage-last"); this catches a REGRESSION of the same bug — a future
# catalog edit that reintroduces a recall of a key only a removed or paused
# job could ever write — at converge time instead of silently shipping it.
- name: Assert the Splunk triage prompt does not recall a dead job's memory key
  ansible.builtin.assert:
    quiet: true
    that:
      - "'splunk-digest-last' not in hermes_agent_splunk_triage_cron_prompt"
    fail_msg: >-
      hermes_agent_splunk_triage_cron_prompt (from the pinned ai-llm-prompts
      catalog) recalls memory key "splunk-digest-last", which nothing writes
      any more — the splunk-digest kanban card that used to own it is removed
      (see hermes_agent_kanban_cards in defaults/main.yml). A recall of a key
      nothing writes always finds nothing, so any "already covered, don't
      re-alert" branch built on it can never fire. Fix the prompt in
      dryvist/ai-llm-prompts to recall a key a currently-running job actually
      writes (its own, by preference — see splunk-triage-last), then bump
      hermes_agent_prompts_flake_ref to the merge commit.
    success_msg: >-
      hermes_agent_splunk_triage_cron_prompt does not recall the dead
      splunk-digest-last memory key.

- name: Assert every curriculum prompt resolves from the catalog
  ansible.builtin.assert:
    quiet: true
    that:
      - item.id in hermes_agent_curriculum_prompt_files
      - >-
        (hermes_agent_prompts_path ~ '/'
         ~ hermes_agent_curriculum_prompt_files[item.id]) is file
    fail_msg: >-
      Curriculum job '{{ item.id }}' has no prompt in the pinned catalog package.
  loop: "{{ hermes_agent_curriculum.jobs }}"
  loop_control:
    label: "{{ item.id }}"

# update_cache stays false, matching syslog_route.yml below: these guests reach
# internal mirrors only. Refreshing the cache makes every converge depend on the
# apt caching proxy being up, so an unrelated proxy outage hard-fails this play
# even when the packages are already present and nothing would change.
- name: Install role prerequisites (installer + clone)
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - git
      - sudo
      - jq # hermes-brain-sync.sh JSON parsing (OpenBao KV, router /v1/model/info)
    state: present
    update_cache: false

# Fetch the installer from the pinned release tag's immutable raw URL and verify
# its sha256 BEFORE running it — no `curl <url> | bash` of a moving remote script.
# A checksum mismatch (upstream changed the tag, MITM, rug-pull) fails here, loud.
- name: Fetch the pinned Hermes installer (checksum-verified)
  ansible.builtin.get_url:
    url: "{{ hermes_agent_installer_url }}"
    dest: "{{ hermes_agent_installer_path }}"
    checksum: "sha256:{{ hermes_agent_installer_sha256 }}"
    owner: root
    group: root
    mode: "0644"

# Run the VERIFIED local installer (root + play become: true) -> system-wide FHS
# layout: binary /usr/local/bin/hermes, code /usr/local/lib/hermes-agent. Do NOT
# pass --dir: an explicit dir disables the root-FHS auto-layout and drops the
# launcher in /root/.local/bin instead of /usr/local/bin (breaks hermes_agent_bin).
# --branch {{ version }}: the installer git-clones the app at this release TAG
# (`git clone --depth 1 --branch <tag>`), pinning the app checkout too. The
# installer handles its own Python/uv/venv/Node/ripgrep/ffmpeg deps.
# `creates` guard installs once; the Hermes daemon self-updates the app after.
# --skip-setup: the installer's final step is an INTERACTIVE `hermes setup` wizard
# that reads /dev/tty and hangs forever under Ansible (no controlling TTY). We skip
# it and configure declaratively via the config.yaml/.env templates below;
# --non-interactive defaults any remaining prompt instead of blocking.
- name: Install Hermes Agent system-wide (once; daemon self-updates thereafter)
  ansible.builtin.command:
    cmd: >-
      bash {{ hermes_agent_installer_path }}
      --branch {{ hermes_agent_version }} --skip-setup --non-interactive
    creates: "{{ hermes_agent_bin }}"

# The dashboard SPA is NOT shipped down the git-checkout install path. Upstream
# gitignores hermes_cli/web_dist/ and builds it in release CI, so the published
# PyPI wheel carries the bundle but a `--branch <tag>` checkout never does, and
# install.sh runs no frontend build of its own. Result: the dashboard answers
# {"error":"Frontend not built. Run: cd web && npm run build"} on / while every
# /api/* route stays healthy — it looks like an outage and is a missing artifact.
#
# Building alone does not fix it, because two different trees are in play. The
# app is installed as a REGULAR wheel, so hermes_cli/web_server.py resolves its
# default dist as Path(__file__).parent / "web_dist" INSIDE site-packages, while
# `npm run build` writes to the CHECKOUT (web/vite.config.ts outDir
# "../hermes_cli/web_dist"). The build output and the search path never meet.
#
# HERMES_WEB_DIST on the dashboard unit is the seam upstream provides for exactly
# this (their Dockerfile and Nix package both set it). Pointing it at the
# checkout's output is also the durable choice: `hermes update` rebuilds that
# same path via _build_web_ui(PROJECT_ROOT / "web"), so the daemon keeps the
# bundle current after we seed it here, instead of us racing its self-updates.
#
# npm ci is deliberately NOT run: the installer already populated node_modules in
# both the root and the web workspace, and the repo pins a single root
# package-lock.json for an npm workspace, so a lone `npm ci` inside web/ would
# fight that layout.
- name: Build the Hermes dashboard frontend bundle
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ hermes_agent_install_dir }}/web"
    creates: "{{ hermes_agent_web_dist }}/index.html"
  notify: Restart hermes-dashboard

# A build that exits 0 but emits nothing still leaves the dashboard 404ing, and
# the creates guard above would then skip the rebuild forever. Fail the converge
# on the artifact, not on the exit code.
- name: Assert the dashboard bundle exists
  ansible.builtin.stat:
    path: "{{ hermes_agent_web_dist }}/index.html"
  register: hermes_agent_web_dist_stat

- name: Fail when the dashboard bundle is missing
  ansible.builtin.fail:
    msg: >-
      {{ hermes_agent_web_dist }}/index.html is absent after the frontend build.
      The dashboard will serve "Frontend not built" on /. Check that node and npm
      are on PATH in the guest and that {{ hermes_agent_install_dir }}/web
      has its node_modules populated.
  when: not hermes_agent_web_dist_stat.stat.exists

# Upstream bug (NousResearch/hermes-agent, agent/conversation_loop.py):
# the length-continuation and truncated-tool-call retry paths boost
# max_tokens on each retry, but floor the boost ceiling at
# `max(32768, requested_cap)` — so when the configured output cap is set
# below that hardcoded 32768 floor (as `model.max_tokens` was at 8192
# historically), the first truncation retry re-sends a request above the
# ceiling, which a server enforcing a lower per-request limit 400s
# identically ("max_tokens exceeds server limit"), burning all retries and
# surfacing the error instead of completing. The patch holds the boost at the
# configured 8192-token ceiling.
# `agent.max_tokens` is already the user's explicit config-level ceiling;
# treat it as absolute instead of a floor for the boost. Runs every
# converge (idempotent regexp match) because `hermes update` self-updates
# the app out from under this checkout and would silently drop the patch
# otherwise.
- name: Patch hermes-agent retry boost to respect the configured max_tokens ceiling
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/conversation_loop.py"
    regexp: '^(\s*)_tc_boost_cap = max\(32768, _tc_requested_cap or 0\)$'
    replace: '\1_tc_boost_cap = agent.max_tokens if agent.max_tokens else max(32768, _tc_requested_cap or 0)'
  notify: Restart hermes-gateway

- name: Patch hermes-agent length-continuation boost to respect the configured max_tokens ceiling
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/conversation_loop.py"
    regexp: '^(\s*)_boost_cap = max\(32768, _requested_cap or 0\)$'
    replace: '\1_boost_cap = agent.max_tokens if agent.max_tokens else max(32768, _requested_cap or 0)'
  notify: Restart hermes-gateway

# The compressor can retain an end offset computed before tool-message cleanup.
# Clamp it to the current list length so scheduled runs do not abort on IndexError.
- name: Patch hermes-agent context summary scan to use the live message bound
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/context_compressor.py"
    regexp: '^(\s*)for idx in range\(end - 1, start - 1, -1\):$'
    replace: '\1for idx in range(min(end, len(messages)) - 1, start - 1, -1):'
  notify: Restart hermes-gateway

# Pinned Hermes returns four values from judge_goal, while kanban_complete still
# unpacks the former three-value contract. The caught ValueError silently makes
# the completion gate fail open. Keep the installed source consistent until the
# pinned release includes the upstream fix.
- name: Patch Hermes goal completion gate for the four-value judge result
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/tools/kanban_tools.py"
    regexp: '^([ \t]*)verdict, reason, _ = judge_goal\($'
    replace: '\1verdict, reason, _, _ = judge_goal('
  notify: Restart hermes-gateway

- name: Patch Hermes goal judge timeout for the local light tier
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/goals.py"
    regexp: '^DEFAULT_JUDGE_TIMEOUT = [0-9]+(?:\.[0-9]+)?$'
    replace: 'DEFAULT_JUDGE_TIMEOUT = {{ hermes_agent_kanban_goal_judge_timeout_seconds | float }}'
  notify: Restart hermes-gateway

# A judge-call FAILURE is not a judge VERDICT. Upstream judge_goal masks its
# own API errors as ("continue", "judge error: <Type>", ...), so the kanban
# goal loop fires a continuation worker turn and increments turns_used for
# every failed judge call — measured over 7 days, whole 8-turn budgets burned
# in minutes (48% timeouts, 29% routing 404s, 11% 500s) with the worker never
# executing a single tool call. The two patches below teach the loop to tell
# the cases apart: a failed judge call re-polls the card (so a worker that
# completed meanwhile still wins) and retries the judge after the role's flat
# 15s local-backend delay, consuming NO turn; five consecutive failures block
# the card cleanly with a "no worker turns were consumed" reason — sticky
# blocked, i.e. retryable once the backend is healthy — so a total outage can
# never spin the loop forever. Any real verdict resets the counter. The guard
# keys on the exact "judge error: " sentinel judge_goal produces, and the
# assert below pins that producer line too, so upstream drift fails the
# converge loudly instead of silently re-arming the turn burn.
- name: Patch Hermes kanban goal loop to count consecutive judge failures
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/goals.py"
    regexp: '^([ \t]*)nudged_to_finalize = False$(?:\n\1judge_failures = 0)?'
    replace: |-
      \1nudged_to_finalize = False
      \1judge_failures = 0
  notify: Restart hermes-gateway

- name: Patch Hermes kanban goal loop to retry judge errors without burning turns
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/goals.py"
    regexp: |-
      ^([ \t]*)verdict, reason, _parse_failed, _wait = judge_goal\(goal_text, last_response\)$
      \1if verdict == "wait":$
      \1    verdict = "continue"$
      \1_log\(f"kanban goal loop: turn \{turns_used\}/\{max_turns\} verdict=\{verdict\} reason=.*\)$
    replace: |-
      \1verdict, reason, _parse_failed, _wait = judge_goal(goal_text, last_response)
      \1if verdict == "wait":
      \1    verdict = "continue"
      \1if reason.startswith("judge error: "):
      \1    judge_failures += 1
      \1    _log(
      \1        f"kanban goal loop: judge call failed ({judge_failures}/5, "
      \1        f"{reason}); retrying without consuming a turn"
      \1    )
      \1    if judge_failures >= 5:
      \1        try:
      \1            block_fn(
      \1                f"Goal judge unreachable {judge_failures} consecutive times "
      \1                f"({reason}); no worker turns were consumed. Retry the card "
      \1                f"once the judge backend is healthy."
      \1            )
      \1        except Exception as exc:
      \1            _log(f"kanban goal loop: block_fn failed ({exc})")
      \1        return {"outcome": "blocked_judge_unreachable", "turns_used": turns_used, "reason": reason}
      \1    time.sleep(15.0)
      \1    continue
      \1judge_failures = 0
      \1_log(f"kanban goal loop: turn {turns_used}/{max_turns} verdict={verdict} reason={_truncate(reason, 120)}")
  notify: Restart hermes-gateway

- name: Patch Hermes exception retry delay for the local serial backend
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/conversation_loop.py"
    regexp: >-
      ^([ \t]*)wait_time = _retry_after if _retry_after else
      jittered_backoff\(retry_count, base_delay=2\.0, max_delay=60\.0\)$
    replace: '\g<1>wait_time = 15.0'
  notify: Restart hermes-gateway

- name: Patch Hermes invalid-response retry delay for the local serial backend
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/conversation_loop.py"
    regexp: '^([ \t]*)wait_time = jittered_backoff\(retry_count, base_delay=5\.0, max_delay=120\.0\)$'
    replace: '\g<1>wait_time = 15.0'
  notify: Restart hermes-gateway

- name: Disable adaptive rate-limit backoff for the local serial backend
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/conversation_loop.py"
    regexp: >-
      ^([ \t]*)if (?:is_rate_limited|\(is_rate_limited or
      _is_zai_coding_overload\)) and not _retry_after:$
    replace: '\g<1>if False and is_rate_limited and not _retry_after:'
  notify: Restart hermes-gateway

- name: Disable the extra transport-recovery attempt cycle
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/conversation_loop.py"
    regexp: '^([ \t]*)if not _retry\.primary_recovery_attempted and agent\._try_recover_primary_transport\($'
    replace: '\g<1>if False and not _retry.primary_recovery_attempted and agent._try_recover_primary_transport('
  notify: Restart hermes-gateway

# A model that writes its tool call as TEXT (`<function=...>`, `<parameter=...>`)
# instead of issuing it leaves that markup as its entire final response, and cron
# delivery posts it verbatim — garbage in Slack, observed on three separate
# digests. Upstream (NousResearch/hermes-agent) has no notion of this failure, so
# guard it at the one choke point every cron job's output passes through.
#
# NOT a retry: re-running the turn here would run outside the per-job secret scope
# that scheduler.py resets immediately after run_job, which is the exact fault its
# own comment above that block describes. Suppress and name the job instead — the
# raw run is still saved to the job's output file for diagnosis.
#
# blockinfile (not replace) for the helper: its markers make re-inserting on every
# converge idempotent. The call-site replace is idempotent because the rewritten
# line no longer matches its own regexp. Both re-run every converge because
# `hermes update` self-updates the app out from under this checkout and would
# silently drop the patch otherwise.
- name: Patch Hermes cron delivery with a tool-call markup guard
  ansible.builtin.blockinfile:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    marker: "# {mark} ANSIBLE MANAGED BLOCK cron markup guard"
    insertbefore: '^def _deliver_result\('
    block: |
      def _cron_markup_guard(job, output_file, content):
          """Never deliver unparsed tool-call markup to a chat platform.

          Returns the content unchanged, or a diagnostic naming the job when the
          model wrote a tool call as text instead of issuing it.
          """
          if not re.search(r"<(?:function|parameter)=|<tool_call>", content or ""):
              return content
          name = job.get("name", job.get("id", "?"))
          logger.error(
              "Job '%s': final response contained unparsed tool-call markup — "
              "delivery suppressed", name,
          )
          return (
              f":warning: Cron job '{name}' produced unparsed tool-call markup "
              f"instead of a report; its output was suppressed rather than "
              f"delivered. Raw run: {output_file}"
          )


      # Where a run that FAILED goes, instead of the job's own channel. Empty
      # disables the split and leaves every result on its configured target.
      _CRON_ISSUES_TARGET = "{{ hermes_agent_cron_failure_deliver }}"
      # Script-fed crons exit 0 and PRINT their own failure so it gets delivered
      # (see the digest templates) — so `success` is True even though the run
      # failed. They declare it with this prefix instead, the same shape as the
      # existing [SILENT] contract. A marker the script owns, never a keyword
      # match on the text: a successful job REPORTING an error it observed is a
      # finding and must stay on the work surface.
      _CRON_ISSUES_MARKER = "{{ hermes_agent_cron_issues_marker }}"


      def _cron_route(job, success, content):
          """Return (job, content) with failures routed to the issues channel.

          Routes when the runner reports failure, or when a script-fed job
          declared its own failure with the marker prefix. The marker is
          stripped so it never reaches Slack. Never mutates the caller's job.
          """
          declared = content.lstrip().startswith(_CRON_ISSUES_MARKER)
          if declared:
              content = content.lstrip()[len(_CRON_ISSUES_MARKER):].lstrip()
          if (success and not declared) or not _CRON_ISSUES_TARGET:
              return job, content
          logger.info(
              "Job '%s': run failed — routing delivery to the issues channel",
              job.get("name", job.get("id", "?")),
          )
          return {**job, "deliver": _CRON_ISSUES_TARGET}, content
  notify: Restart hermes-gateway

- name: Route cron delivery content through the markup guard
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: >-
      ^([ \t]*)deliver_content = final_response if success else
      _summarize_cron_failure_for_delivery\(job, error\)$
    replace: >-
      \g<1>deliver_content = _cron_markup_guard(job, output_file, final_response
      if success else _summarize_cron_failure_for_delivery(job, error))
  notify: Restart hermes-gateway

- name: Route failed cron deliveries to the issues channel
  # The `success` flag is already in scope at the delivery call, so routing on
  # it needs no new signal and cannot misclassify a healthy job that happens to
  # report an error. Rewrites the call, not the content, so the markup guard
  # above is untouched. Idempotent: the rewritten line no longer matches.
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: >-
      ^([ \t]*)delivery_error = _deliver_result\(job, deliver_content,
      adapters=adapters, loop=loop\)$
    replace: >-
      \g<1>_routed_job, deliver_content = _cron_route(job, success,
      deliver_content)

      \g<1>delivery_error = _deliver_result(_routed_job, deliver_content,
      adapters=adapters, loop=loop)
  notify: Restart hermes-gateway

- name: Patch Hermes auxiliary retry delay for the local serial backend
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/auxiliary_client.py"
    regexp: '^_TRANSIENT_RETRY_BACKOFF_BASE = 1\.0$'
    replace: '_TRANSIENT_RETRY_BACKOFF_BASE = 15.0'
  notify: Restart hermes-gateway

- name: Retry auxiliary rate limits through the bounded transient path
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/auxiliary_client.py"
    regexp: 'return isinstance\(status, int\) and \(status == 408 or 500 <= status < 600\)'
    replace: 'return isinstance(status, int) and (status in (408, 429) or 500 <= status < 600)'
  notify: Restart hermes-gateway

- name: Disable post-budget fallback for the explicit local auxiliary provider
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/auxiliary_client.py"
    regexp: '^([ \t]*)if should_fallback and \(is_auto or is_capacity_error\):$'
    replace: '\g<1>if should_fallback and (is_auto or (is_capacity_error and resolved_provider != "custom")):'
  notify: Restart hermes-gateway

- name: Enable prompt-safe Hermes request size metrics at DEBUG
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/conversation_loop.py"
    regexp: '([ \t]+# Log request details if verbose\n)[ \t]+if agent\.verbose_logging:'
    replace: '\g<1>        if True:'
  notify: Restart hermes-gateway

- name: Enable prompt-safe Hermes token usage metrics at DEBUG
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/conversation_loop.py"
    regexp: '^([ \t]*)(?:if agent\.verbose_logging|if True):\n[ \t]+logging\.debug\(f"Token usage:'
    replace: '                    if True:\n                        logging.debug(f"Token usage:'
  notify: Restart hermes-gateway

# The dispatcher sets HERMES_KANBAN_GOAL_MODE, but the pinned CLI only invokes
# its goal-loop wrapper on the machine-readable quiet path. Without --quiet,
# workers take the ordinary single-query path, return text, and exit rc=0 while
# their card remains running.
- name: Patch Hermes Kanban workers to enter the quiet goal-loop path
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/kanban_db.py"
    regexp: '^([ \t]*)(?:\*\(\["--quiet"\] if task\.goal_mode else \[\]\),\n\1)*"-q", prompt,$'
    replace: |-
      \1*(["--quiet"] if task.goal_mode else []),
      \1"-q", prompt,
  notify: Restart hermes-gateway

# Zammad #17143 item 3: the crash classifier flags a dispatcher worker that
# exited rc=0 with its task still running as a protocol violation, but the
# message did not distinguish "kanban tools were never registered" from "the
# model just didn't call one". A dispatcher-spawned worker ALWAYS has
# HERMES_KANBAN_TASK set before exec (kanban_db._default_spawn — both the goal
# and classic paths go through the one spawner) and the schema gate force-adds
# the kanban toolset on that env (model_tools._compute_tool_definitions), so the
# lifecycle tools are always present. That makes this unambiguously a
# model-did-not-call violation, not a missing toolset — say so, so the operator
# is not sent hunting a registration bug that cannot occur here.
#
# The closing sentence tracks the retry patch below it: while a protocol
# violation forced an immediate give-up, "a plain retry will not help" was the
# operative advice; now that the card gets its own bounded retries, the message
# has to say what actually happens next. The regexp therefore matches EITHER the
# pinned upstream text or the previously-patched text — the source tree is
# installed once behind a `creates` guard, never re-extracted, so a guest
# converged before this change still carries the old sentence and would
# otherwise be unreachable by any patch keyed to pristine source.
- name: Patch Hermes protocol-violation message to name the model-did-not-call case
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/kanban_db.py"
    regexp: |-
      ^([ \t]*)"worker exited cleanly \(rc=0\) without calling "
      \1"kanban_complete or kanban_block(?: — protocol violation"|\. Lifecycle tools are always "
      \1"registered for dispatcher-spawned workers \(HERMES_KANBAN_TASK "
      \1"set\), so this is a model-did-not-call protocol violation, not "
      \1"a missing toolset; a plain retry will not help\.")$
    replace: |-
      \1"worker exited cleanly (rc=0) without calling "
      \1"kanban_complete or kanban_block. Lifecycle tools are always "
      \1"registered for dispatcher-spawned workers (HERMES_KANBAN_TASK "
      \1"set), so this is a model-did-not-call protocol violation, not "
      \1"a missing toolset. The card is retried within its own max_retries "
      \1"budget before it blocks."
  notify: Restart hermes-gateway

# A clean exit with the task still running means the run produced work whose
# outcome was never recorded — the operator may already hold the output while
# the board shows a failure. Upstream forces the breaker to trip on the FIRST
# such exit, so that card can never be attempted again by anything: its status
# is terminal, and the counter is already at the limit that stops
# `recompute_ready` from promoting it back.
#
# Dropping the force hands the decision to the per-card `max_retries`, which is
# the same bounded budget every other failure answers to — a small number of
# attempts, then a block that a human sees. The systemic-fingerprint force is
# deliberately left in place: many workers failing the same way at once is a
# fabric problem, and retrying into it is how a single fault becomes a
# thundering herd against one serving slot.
- name: Patch Hermes protocol-violation crashes to retry within the card budget
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/kanban_db.py"
    regexp: >-
      ^([ \t]*)failure_limit=1 if \(protocol_violation or is_systemic\) else None,$
    replace: \g<1>failure_limit=1 if is_systemic else None,
  notify: Restart hermes-gateway

# An idempotency hit returns before create_task applies new fields. Upgrade only
# active goal-enabled repeats in place so a current-slot card is reconciled
# without mutating completed history or downgrading an existing goal card.
- name: Patch Hermes idempotent create to reconcile goal-mode fields
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/kanban_db.py"
    regexp: |-
      ^([ \t]*)row = conn\.execute\($
      \1    "SELECT id FROM tasks WHERE idempotency_key = \? "$
      \1    "AND status != 'archived' "$
      \1    "ORDER BY created_at DESC LIMIT 1",$
      \1    \(idempotency_key,\),$
      \1\)\.fetchone\(\)$
      \1if row:$
      \1    return row\["id"\]$
    replace: |-
      \1row = conn.execute(
      \1    "SELECT id, status FROM tasks WHERE idempotency_key = ? "
      \1    "AND status != 'archived' "
      \1    "ORDER BY created_at DESC LIMIT 1",
      \1    (idempotency_key,),
      \1).fetchone()
      \1if row:
      \1    if goal_mode and row["status"] in ("triage", "todo", "scheduled", "ready", "blocked", "review"):
      \1        with write_txn(conn):
      \1            conn.execute(
      \1                "UPDATE tasks SET goal_mode = 1, "
      \1                "goal_max_turns = COALESCE(?, goal_max_turns) "
      \1                "WHERE id = ? AND status IN "
      \1                "('triage', 'todo', 'scheduled', 'ready', 'blocked', 'review')",
      \1                (int(goal_max_turns) if goal_max_turns is not None else None, row["id"]),
      \1            )
      \1    return row["id"]
  notify: Restart hermes-gateway

# Auto-recall (the per-turn prefetch injected into context before the model
# sees a message) swallows every failure at DEBUG and returns "" — recall
# silently degrades to "no memories" with no signal distinguishable from
# routine debug noise. Bring it up to the same severity auto-retain's
# equivalent failure already logs at (_writer_loop, a few hundred lines
# below in the same file) so a Hindsight outage is at least searchable in
# Splunk as a warning, not buried in DEBUG chatter. Not a retry — the bar is
# detectability, not resilience; fabric_watchdog (roles/fabric_watchdog)
# covers actual outage alerting.
- name: Patch Hermes auto-recall prefetch failure to log at warning, not debug
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: '^(\s*)logger\.debug\("Hindsight prefetch failed: %s", e, exc_info=True\)$'
    replace: '\1logger.warning("Hindsight prefetch failed: %s", e, exc_info=True)'
  notify: Restart hermes-gateway

- name: Read installed Hermes pinned-source patches
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ hermes_agent_install_dir }}/tools/kanban_tools.py"
    - "{{ hermes_agent_install_dir }}/hermes_cli/kanban_db.py"
    - "{{ hermes_agent_install_dir }}/hermes_cli/goals.py"
    - "{{ hermes_agent_install_dir }}/agent/conversation_loop.py"
    - "{{ hermes_agent_install_dir }}/agent/auxiliary_client.py"
    # Appended, never reordered — the assert below indexes results[] by
    # position, so inserting into the middle would silently re-point every
    # later assertion at the wrong file.
    - "{{ hermes_agent_install_dir }}/agent/context_compressor.py"
    - "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    - "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
  register: hermes_agent_goal_mode_sources
  changed_when: false

- name: Assert installed Hermes pinned-source patches
  vars:
    hermes_agent_goal_completion_source: >-
      {{ hermes_agent_goal_mode_sources.results[0].content | b64decode }}
    hermes_agent_goal_reconcile_source: >-
      {{ hermes_agent_goal_mode_sources.results[1].content | b64decode }}
    hermes_agent_goal_judge_source: >-
      {{ hermes_agent_goal_mode_sources.results[2].content | b64decode }}
    hermes_agent_retry_source: >-
      {{ hermes_agent_goal_mode_sources.results[3].content | b64decode }}
    hermes_agent_auxiliary_source: >-
      {{ hermes_agent_goal_mode_sources.results[4].content | b64decode }}
    hermes_agent_compressor_source: >-
      {{ hermes_agent_goal_mode_sources.results[5].content | b64decode }}
    hermes_agent_cron_scheduler_source: >-
      {{ hermes_agent_goal_mode_sources.results[6].content | b64decode }}
    hermes_agent_hindsight_plugin_source: >-
      {{ hermes_agent_goal_mode_sources.results[7].content | b64decode }}
  ansible.builtin.assert:
    quiet: true
    that:
      - "'verdict, reason, _, _ = judge_goal(' in hermes_agent_goal_completion_source"
      - >-
        hermes_agent_goal_reconcile_source.count(
          '*(["--quiet"] if task.goal_mode else []),'
        ) == 1
      - >-
        hermes_agent_goal_reconcile_source.count(
          '"-q", prompt,'
        ) == 1
      - >-
        'SELECT id, status FROM tasks WHERE idempotency_key = ?'
        in hermes_agent_goal_reconcile_source
      - >-
        'if goal_mode and row["status"] in ("triage", "todo", "scheduled", "ready", "blocked", "review"):'
        in hermes_agent_goal_reconcile_source
      - >-
        'goal_max_turns = COALESCE(?, goal_max_turns)'
        in hermes_agent_goal_reconcile_source
      - >-
        'WHERE id = ? AND status IN'
        in hermes_agent_goal_reconcile_source
      - >-
        "('triage', 'todo', 'scheduled', 'ready', 'blocked', 'review')"
        in hermes_agent_goal_reconcile_source
      # Both halves of the protocol-violation change, asserted separately: the
      # message is what an operator reads, the failure_limit is what actually
      # decides whether the card is ever attempted again, and either landing
      # without the other leaves the two contradicting each other.
      - >-
        'a missing toolset. The card is retried within its own max_retries'
        in hermes_agent_goal_reconcile_source
      - >-
        'failure_limit=1 if is_systemic else None,'
        in hermes_agent_goal_reconcile_source
      - >-
        ('DEFAULT_JUDGE_TIMEOUT = '
         ~ (hermes_agent_kanban_goal_judge_timeout_seconds | float | string))
        in hermes_agent_goal_judge_source
      - "hermes_agent_retry_source.count('wait_time = 15.0') >= 2"
      - >-
        'if False and is_rate_limited and not _retry_after:'
        in hermes_agent_retry_source
      - >-
        'if False and not _retry.primary_recovery_attempted and agent._try_recover_primary_transport('
        in hermes_agent_retry_source
      - >-
        '# Log request details if verbose\n        if True:'
        in hermes_agent_retry_source
      - >-
        'if True:\n                        logging.debug(f"Token usage:'
        in hermes_agent_retry_source
      - >-
        '_TRANSIENT_RETRY_BACKOFF_BASE = 15.0'
        in hermes_agent_auxiliary_source
      - >-
        'status in (408, 429)'
        in hermes_agent_auxiliary_source
      - >-
        'resolved_provider != "custom"'
        in hermes_agent_auxiliary_source
      # `_tc_boost_cap` CONTAINS the substring `_boost_cap`, so a bare
      # `'_boost_cap = agent.max_tokens' in ...` would be satisfied by the
      # _tc_ line alone and pass with the length-continuation patch missing.
      # Count instead: both patched lines match the shorter needle, so 2 is
      # the only value that proves BOTH landed (verified against upstream
      # v2026.7.7.2 — unpatched 0, either patch alone 1, both 2).
      - >-
        hermes_agent_retry_source.count(
          '_tc_boost_cap = agent.max_tokens if agent.max_tokens else max('
        ) >= 1
      - >-
        hermes_agent_retry_source.count(
          '_boost_cap = agent.max_tokens if agent.max_tokens else max('
        ) == 2
      - >-
        'for idx in range(min(end, len(messages)) - 1, start - 1, -1):'
        in hermes_agent_compressor_source
      - >-
        'deliver_content = _cron_markup_guard(job, output_file,'
        in hermes_agent_cron_scheduler_source
      - >-
        '_deliver_result(_routed_job, deliver_content,'
        in hermes_agent_cron_scheduler_source
      - >-
        'registered for dispatcher-spawned workers (HERMES_KANBAN_TASK '
        in hermes_agent_goal_reconcile_source
      - >-
        'logger.warning("Hindsight prefetch failed: %s", e, exc_info=True)'
        in hermes_agent_hindsight_plugin_source
      # The kanban goal loop's judge-error guard: both halves of the patch
      # (counter init + guard reset = exactly 2 occurrences), the bounded
      # blocked outcome, and — critically — the UPSTREAM producer line of the
      # "judge error: " sentinel the guard keys on. If upstream rewords that
      # sentinel, the guard would silently never fire and every judge outage
      # would burn full turn budgets again; pin it so the converge fails
      # loudly instead.
      - >-
        'if reason.startswith("judge error: "):'
        in hermes_agent_goal_judge_source
      - >-
        hermes_agent_goal_judge_source.count('judge_failures = 0') == 2
      - >-
        '"outcome": "blocked_judge_unreachable"'
        in hermes_agent_goal_judge_source
      - >-
        'return "continue", f"judge error: {type(exc).__name__}", False, None'
        in hermes_agent_goal_judge_source
    fail_msg: >-
      The pinned Hermes source changed and one or more required source
      patches were not installed; update the pinned-source patches before
      converging.

# Everything above reads the SOURCE TREE, which is not necessarily the code
# that runs. The venv lives INSIDE the install dir, so
# <install_dir>/agent/conversation_loop.py and
# <install_dir>/venv/lib/python3.*/site-packages/agent/conversation_loop.py are
# two different files, and only the second one is imported once the package is
# installed non-editably. It is installed non-editably: the Slack extra below
# uses `uv pip install "hermes-agent[slack] @ <install_dir>"`, a path install
# rather than `-e`, and uv skips it entirely once the requirement is satisfied.
# So after `hermes update` rewrites the source and the patch tasks re-apply
# themselves, nothing necessarily copies the result into site-packages — and
# the assertion above still passes, having checked a file nothing imports.
#
# This compares the two by checksum. Equal, or no installed copy at all (an
# editable install, where the source tree IS the imported code), means the
# patches are live and every assertion above is meaningful. Different means
# they are not, and the daemon is running unpatched upstream code carrying the
# retry-storm and IndexError bugs those patches exist to fix.
- name: Locate any installed copy of a patched module inside the Hermes venv
  ansible.builtin.find:
    paths: "{{ hermes_agent_install_dir }}/venv/lib"
    patterns: conversation_loop.py
    recurse: true
    get_checksum: true
  register: hermes_agent_installed_module_copies
  changed_when: false

- name: Checksum the patched source the assertions above just verified
  ansible.builtin.stat:
    path: "{{ hermes_agent_install_dir }}/agent/conversation_loop.py"
    checksum_algorithm: sha1
  register: hermes_agent_patched_source

- name: Fail when the patched source is not the code the daemon imports
  vars:
    hermes_agent_installed_checksums: >-
      {{ hermes_agent_installed_module_copies.files | map(attribute='checksum') | list }}
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        hermes_agent_installed_checksums | reject('equalto', hermes_agent_patched_source.stat.checksum)
        | list | length == 0
    fail_msg: >-
      An installed copy of conversation_loop.py under the venv differs from the
      patched source, so the pinned-source patches above are not in the code the
      daemon imports and are silently doing nothing. Reinstall the package from
      the patched source (the path install used for the Slack extra below) so
      the patches reach site-packages, then re-converge. Do not silence this
      assertion — it is the only thing separating "patched" from "looks patched".

- name: Check whether the Hermes OTEL plugin file exists
  ansible.builtin.stat:
    path: "{{ hermes_agent_install_dir }}/plugins/observability/otel/__init__.py"
  register: hermes_agent_otel_plugin

- name: Patch Hermes OTEL spans to carry the configured service name
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/observability/otel/__init__.py"
    regexp: '^(\s*)attrs = \[_attr\(_GEN_AI_SESSION, session_id\), _attr\(_GEN_AI_EXECUTION, exec_id\)\]$'
    replace: >-
      \1attrs = [_attr(_GEN_AI_SESSION, session_id),
      _attr(_GEN_AI_EXECUTION, exec_id),
      _attr("service.name", os.environ.get("OTEL_SERVICE_NAME", "hermes-agent"))]
  notify: Restart hermes-gateway
  when: hermes_agent_otel_plugin.stat.exists

# The base install skips optional messaging-platform extras (they pull in
# platform SDKs like slack-bolt that most converges never need). Without this,
# the gateway logs "Platform 'Slack' requirements not met" and refuses to
# create the Slack adapter even with valid tokens configured. `uv pip install`
# is a no-op re-run when already satisfied; changed_when keys off its own
# "Installed"/"Uninstalled" summary line so idempotency reporting stays honest.
# uv writes that summary to STDERR, not stdout — check stderr (an empty-repo
# reinstall of nothing leaves both blank, correctly reporting ok/unchanged).
- name: Install the Slack platform extra into the Hermes venv
  ansible.builtin.command:
    cmd: >-
      {{ hermes_agent_uv_bin }} pip install
      --python {{ hermes_agent_venv_python }}
      "hermes-agent[slack] @ {{ hermes_agent_install_dir }}"
  register: hermes_agent_slack_extra_install
  changed_when: >-
    'Installed' in hermes_agent_slack_extra_install.stderr
    or 'Uninstalled' in hermes_agent_slack_extra_install.stderr
  when: hermes_agent_slack_bot_token | length > 0 and hermes_agent_slack_app_token | length > 0

# The `web` toolset (web_search/web_extract) resolves its backend through a
# key/package cascade and, with nothing installed, lands on its hardcoded
# firecrawl default with no API key — verified live 2026-07-31 by running the
# detection in the deployed venv: `search_backend: firecrawl, available:
# False`. Every card that said "using the web toolset" was written against a
# capability that never worked here. ddgs (keyless DuckDuckGo, search-only) is
# the one upstream-bundled backend that needs no credential and no service; it
# is an optional dep the base install omits, so install it the same way as the
# Slack extra. Extraction has NO keyless provider upstream — cards read pages
# with curl via the terminal toolset instead (self-hosted Firecrawl via
# FIRECRAWL_API_URL is the follow-up if clean extraction is ever needed).
- name: Install the keyless ddgs web-search backend into the Hermes venv
  ansible.builtin.command:
    cmd: >-
      {{ hermes_agent_uv_bin }} pip install
      --python {{ hermes_agent_venv_python }}
      ddgs
  register: hermes_agent_ddgs_install
  changed_when: >-
    'Installed' in hermes_agent_ddgs_install.stderr
    or 'Uninstalled' in hermes_agent_ddgs_install.stderr
  notify: Restart hermes-gateway
- name: Create the hermes runtime user (HERMES_HOME on the data volume)
  ansible.builtin.user:
    name: "{{ hermes_agent_user }}"
    home: "{{ hermes_agent_home }}"
    system: true
    shell: /bin/bash # the agent's terminal tool needs a real shell
    create_home: true

# The home is a pre-existing ZFS data-volume mount (deployment.json mount_point),
# so `create_home` above is a no-op for it — the dir already exists, owned by
# root:root from the mount. Claim it for the hermes user explicitly, or the agent
# can't write its own $HOME (shell sessions, tool scratch, hermes self-update).
- name: Ensure the hermes home directory is owned by the runtime user
  ansible.builtin.file:
    path: "{{ hermes_agent_home }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

- name: Ensure HERMES_HOME exists
  ansible.builtin.file:
    path: "{{ hermes_agent_hermes_home }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

- name: Ensure managed cron state directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_managed_cron_state_dir }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

- name: Deploy the Hermes secrets file (.env)
  ansible.builtin.template:
    src: hermes-env.j2
    dest: "{{ hermes_agent_hermes_home }}/.env"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0600"
  no_log: true
  notify: Restart hermes-gateway

- name: Deploy the Hermes config.yaml (brain -> LiteLLM router, memory -> Hindsight, budget)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ hermes_agent_hermes_home }}/config.yaml"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  notify: Restart hermes-gateway

# --- nix-hermes content bundle: SOUL.md + the dryvist skills ------------------
# Content is built by the pinned nix-hermes flake ref on the CONTROLLER (the
# only side with nix; the guest never needs it) and byte-copied over. First
# build needs network; the nix store caches re-runs. changed_when: false —
# building never mutates the guest.
- name: Build the nix-hermes content bundle on the controller
  ansible.builtin.command:
    cmd: nix build --no-link --print-out-paths "{{ hermes_agent_bundle_flake_ref }}"
  delegate_to: localhost
  # See assert.yml: the ansible_become connection var outranks the keyword.
  become: false
  vars:
    ansible_become: false
  run_once: true
  register: hermes_agent_bundle_build
  changed_when: false

- name: Resolve the nix-hermes bundle store path
  ansible.builtin.set_fact:
    hermes_agent_bundle_path: "{{ hermes_agent_bundle_build.stdout_lines | last }}"

# SOUL.md = the persona/behavior surface upstream loads FRESH on every message
# (no restart needed) — the role the AGENTS.md chain plays for Claude Code.
# The bundle composes it at BUILD time from the ai-llm-prompts flake input:
# auto-ai-agent/autonomous-base.md + auto-ai-agent/hermes.md, with their OKF
# frontmatter stripped (see nix-hermes lib/bundle.nix). Edit intent in THOSE
# sources. nix-hermes vendors no prompt of its own — the path this comment used
# to name, data/soul/hermes-variant.md, no longer exists, and looking for it
# costs a real detour.
#
# Ansible owns the file; Hermes self-edits MEMORY.md, not SOUL.md, so no
# agent-written state is overwritten. backup:true preserves the pre-management
# content once on first converge.
- name: Deploy the Hermes SOUL.md (shared behavioral base + Hermes variant)
  ansible.builtin.copy:
    src: "{{ hermes_agent_bundle_path }}/SOUL.md"
    dest: "{{ hermes_agent_hermes_home }}/SOUL.md"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0644"
    backup: true
  when: hermes_agent_soul_managed | bool

# USER.md = what Hermes knows about the operator. Upstream loads it alongside
# MEMORY.md (config.yaml sets user_profile_enabled), and BOTH are agent-owned:
# Hermes edits this file as it learns, so a converge that rewrote it would
# silently delete everything the agent had figured out.
#
# force: no is therefore the whole point, and is NOT the SOUL.md pattern above —
# SOUL.md is role-owned and re-copied every run. This seeds the file once, on a
# guest that has none, and never touches it again. The seed carries only what
# the operator has stated directly (working hours, output expectations, the
# write-routing law); everything else Hermes learns and writes itself.
- name: Seed the Hermes operator profile (USER.md) if the agent has none yet
  ansible.builtin.template:
    src: USER.md.j2
    dest: "{{ hermes_agent_hermes_home }}/USER.md"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0644"
    force: false
  when: hermes_agent_seed_user_profile | bool

# --- Hindsight memory: local embedded daemon ---------------------------------
# The provider name in config.yaml is not enough: hindsight defaults to CLOUD
# mode, and with no HINDSIGHT_API_KEY its is_available() is false — every
# memory tool call fails with "Memory is not available" (the recurring digest
# warning). local_embedded needs (a) the hindsight-all package in the venv,
# (b) $HERMES_HOME/hindsight/config.json selecting the mode + the extraction
# LLM (the same router brain), (c) HINDSIGHT_LLM_API_KEY in .env (rendered by
# hermes-env.j2).
# local_embedded needs the full daemon stack (hindsight-all, ~200 MB);
# local_external only needs the pinned HTTP client the plugin drives.
- name: Install the Hindsight stack into the Hermes venv
  ansible.builtin.command:
    cmd: >-
      {{ hermes_agent_uv_bin }} pip install
      --python {{ hermes_agent_venv_python }}
      {{ 'hindsight-all' if hermes_agent_memory_mode == 'local_embedded' else '' }}
      "hindsight-client{{ hermes_agent_hindsight_client_pin }}"
  register: hermes_agent_hindsight_install
  changed_when: >-
    'Installed' in hermes_agent_hindsight_install.stderr
    or 'Uninstalled' in hermes_agent_hindsight_install.stderr
  when: hermes_agent_memory_provider == 'hindsight'
  notify: Restart hermes-gateway

# Measured 2026-08-06: prefetch only delivers memory into the turn 15.4% of
# the time (Splunk, 18d, index=hermes) because prefetch() joins its
# background thread for a HARDCODED 3.0s, decoupled from HINDSIGHT_TIMEOUT —
# no config field feeds it, confirmed by reading the installed source, not
# assumed. Recall is fast in isolation (67-256ms measured) but gets starved:
# every Hindsight operation shares ONE process-global event loop
# (_get_loop()/_run_sync()), so a retain job stuck in its LLM-connection
# retry sequence (measured up to ~2min) blocks recall from even starting.
# The debug log line anchors this to the per-turn prefetch() path only — the
# textually-identical join(timeout=3.0) at shutdown is deliberately left
# alone; extending drain-on-shutdown isn't the fix and isn't user-facing.
# See hermes_agent_hindsight_prefetch_timeout_seconds for the full writeup.
- name: Patch Hindsight prefetch join timeout off the hardcoded 3.0s
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: |-
      ^([ \t]*)logger\.debug\("Prefetch: waiting for background thread to complete"\)$
      \1self\._prefetch_thread\.join\(timeout=3\.0\)$
    replace: |-
      \1logger.debug("Prefetch: waiting for background thread to complete")
      \1self._prefetch_thread.join(timeout={{ hermes_agent_hindsight_prefetch_timeout_seconds | float }})
  when: hermes_agent_memory_provider == 'hindsight'
  notify: Restart hermes-gateway

- name: Ensure the hindsight config dir exists
  ansible.builtin.file:
    path: "{{ hermes_agent_hermes_home }}/hindsight"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
  when: hermes_agent_memory_provider == 'hindsight'

- name: Deploy the hindsight provider config (mode + embedded-daemon LLM)
  ansible.builtin.template:
    src: hindsight-config.json.j2
    dest: "{{ hermes_agent_hermes_home }}/hindsight/config.json"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  notify: Restart hermes-gateway
  when: hermes_agent_memory_provider == 'hindsight'

# --- Guest SSH hardening ------------------------------------------------------
# Flagged by the agent's own security self-audit: password auth was accepted on
# the guest's sshd. Ansible reaches this guest via proxmox_pct_remote (through
# the PVE host), not sshd, so this cannot lock out converges.
- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication\s'
    line: PasswordAuthentication no
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

# --- Cron model-drift recovery ------------------------------------------------
# Unpinned AGENTIC cron jobs snapshot the global default model at creation and
# FAIL CLOSED when model.default later changes (upstream spend guard, hermes-agent
# #44585). Post-migration the seeded fleet is script-only `--no-agent` enqueuers,
# which carry no model_snapshot at all — the `model_snapshot`-defined filter below
# skips them, so this task is a self-correcting no-op for the current fleet. It is
# retained so any future agentic seeded job is still auto-recovered on a repoint:
# remove the drifted job here and let create-if-absent seeding recreate it,
# snapshotting the new model. No drift means nothing is removed (idempotent).
- name: Read the cron job store to detect model-snapshot drift
  ansible.builtin.slurp:
    src: "{{ hermes_agent_hermes_home }}/cron/jobs.json"
  register: hermes_agent_cron_store
  failed_when: false

- name: Remove role-seeded cron jobs whose model snapshot drifted
  ansible.builtin.command: "{{ hermes_agent_bin }} cron remove {{ item }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  # The loop expression is templated before `when` would be evaluated
  # (per-item semantics), so it must be self-safe: default the slurped
  # content to base64("{}") when jobs.json does not exist yet (fresh
  # install) — the loop resolves to [] and the task is a no-op.
  loop: >-
    {{ (hermes_agent_cron_store.content | default('e30=', true) | b64decode | from_json).jobs
       | default([])
       | selectattr('name', 'in', hermes_agent_seeded_cron_names)
       | selectattr('model_snapshot', 'defined')
       | rejectattr('model_snapshot', 'none')
       | rejectattr('model_snapshot', 'equalto', hermes_agent_model)
       | map(attribute='name') | list }}
  changed_when: true

# One-time (but idempotent) migration cleanup: a guest converged before the
# reframe still runs the OLD `<job>-enqueue` `--no-agent --script` crons in
# `hermes cron`'s own job store. The script they ran no longer exists on disk,
# so left in place they would start failing loudly instead of quietly going
# away when the new bare-named agentic cron fleet takes over (see below — the
# reframe made bare names the desired end state again, so this is a one-way
# migration, not a legacy name to keep excluding). Reuses the slurp above;
# self-safe base64("{}") default makes a missing jobs.json a no-op. Empty loop
# after the first converge -> idempotent.
- name: "Remove superseded kanban-enqueuer script crons (native-cron reframe)"
  ansible.builtin.command: "{{ hermes_agent_bin }} cron remove {{ item }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  loop: >-
    {{ (hermes_agent_cron_store.content | default('e30=', true) | b64decode | from_json).jobs
       | default([])
       | map(attribute='name') | list
       | select('in', hermes_agent_superseded_kanban_enqueuer_cron_names) | list }}
  changed_when: true

# The recurring workloads (daily status, operator summary, Zammad review,
# Splunk fleet, GitHub triage, nightly wiki, ...) are agentic direct-deliver
# cron jobs again (reframe: repetitive scheduled work is a cron job, Kanban is
# for genuine discrete tasks — see hermes_agent_direct_cron_jobs below).

- name: Ensure the wiki directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_wiki_path }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
  when: hermes_agent_wiki_enabled | bool

- name: Materialize llm-wiki skill
  ansible.builtin.copy:
    src: "{{ hermes_agent_install_dir }}/skills/research/llm-wiki"
    dest: "{{ hermes_agent_hermes_home }}/skills/"
    remote_src: true
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: preserve
  when: hermes_agent_wiki_enabled | bool

- name: Deploy the GitHub App private key
  ansible.builtin.copy:
    content: "{{ hermes_agent_github_app_private_key }}"
    dest: "{{ hermes_agent_hermes_home }}/github-app.pem"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0600"
  no_log: true
  when: hermes_agent_github_app_private_key | length > 0

- name: Install githubkit into the Hermes venv
  ansible.builtin.command:
    cmd: >-
      {{ hermes_agent_uv_bin }} pip install
      --python {{ hermes_agent_venv_python }}
      'githubkit[auth-app]'
  register: hermes_agent_githubkit_install
  changed_when: >-
    'Installed' in hermes_agent_githubkit_install.stderr
    or 'Uninstalled' in hermes_agent_githubkit_install.stderr
  when: hermes_agent_github_app_private_key | length > 0

- name: Materialize upstream github skills
  ansible.builtin.copy:
    src: "{{ hermes_agent_install_dir }}/skills/github"
    dest: "{{ hermes_agent_hermes_home }}/skills/"
    remote_src: true
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: preserve

# All dryvist skills (docs-pr, github-issues, zammad-incidents, splunk-monitor)
# arrive in one copy from the nix-hermes bundle built above. This deploys
# BEFORE the curriculum and every cron-seeding step, so `cron create --skill
# dryvist/splunk-monitor` (and zammad-incidents delivery references) always
# resolve. splunk-monitor is present even when the monitor fleet is disabled —
# an unreferenced skill on disk is inert.
- name: Deploy the dryvist skills from the nix-hermes bundle
  ansible.builtin.copy:
    src: "{{ hermes_agent_bundle_path }}/skills/dryvist/"
    dest: "{{ hermes_agent_hermes_home }}/skills/dryvist/"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
    directory_mode: "0750"

- name: Remove the conflicting legacy Zammad skill copy
  ansible.builtin.file:
    path: "{{ hermes_agent_hermes_home }}/skills/research/dryvist-zammad-incidents"
    state: absent

# --- Named operating profiles (see hermes_agent_profiles, defaults/main.yml) --
# Runs AFTER the shared dryvist skills bundle above (so hermes_agent_bundle_path
# is resolved and every profile-scoped skill copy below has a source) and
# BEFORE the Kanban enqueuer crons are reconciled (so a card's --assignee and
# --skill always resolve against a profile that already exists on first
# converge, never a race between the two).
- name: Reconcile named Hermes operating profiles
  ansible.builtin.include_tasks: profiles.yml
  loop: "{{ hermes_agent_profiles }}"
  loop_control:
    label: "{{ item.name }}"

# The versioned curriculum (H-9): the graded five-job set the job API
# executes, plus the grading sheet, rubric schema and submission runbook.
# curriculum.yml is the canonical manifest — prompts, order, budgets and each
# job's machine-checkable success_checks (contract-asserted in assert.yml).
# Materialized on the guest so the agent can read its own curriculum (the
# `improve` job reviews it) and so a future recurring eval can execute it
# locally; submissions themselves arrive via the inbound job API.
- name: Deploy the versioned curriculum (manifest, jobs, grading, runbook)
  ansible.builtin.copy:
    src: curriculum/
    dest: "{{ hermes_agent_hermes_home }}/curriculum/"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
    directory_mode: "0750"

- name: Ensure the catalog-backed curriculum jobs directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_hermes_home }}/curriculum/jobs"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

- name: Deploy curriculum prompt bodies from the immutable catalog
  ansible.builtin.copy:
    content: >-
      {{ lookup('ansible.builtin.file', hermes_agent_prompts_path ~ '/'
         ~ hermes_agent_curriculum_prompt_files[item.id], rstrip=false)
         | regex_replace('(?s)^---\n.*?\n---\n', '') }}
    dest: "{{ hermes_agent_hermes_home }}/curriculum/{{ item.prompt_file }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  loop: "{{ hermes_agent_curriculum.jobs }}"
  loop_control:
    label: "{{ item.id }}"

# --- Recurring workload fleet (kanban migration #83; reframed to cron) -------
# Recurring reports/sweeps/digests are agentic direct-deliver cron jobs, not
# Kanban cards — a card is for a genuine discrete unit of work tracked to
# completion on a board (docs-sync, below), not "run this at this time,
# repeatedly". Every job still runs in the gateway's fresh, isolated per-run
# session (eliminating the persistent-cron-session failure class, INC-17120)
# and every converted prompt keeps its existing recall-last / work-the-delta /
# save-fingerprint / [SILENT] structure verbatim — the cron dispatcher natively
# suppresses delivery on a bare `[SILENT]` response. All the skills referenced
# (dryvist/splunk-monitor, dryvist/github-issues, dryvist/zammad-incidents,
# dryvist/docs-pr, llm-wiki) are already materialized above, so a job's
# `--skill` resolves when it runs.
- name: Ensure the Hermes scripts directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_hermes_home }}/scripts"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

# State dir for the script-fed digest's delta fingerprint (last-posted state).
- name: Ensure the Hermes state directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_hermes_home }}/state"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

# The script-fed Splunk status digest gathers the numbers itself via the Splunk
# MCP and prints them; the cron below delivers that stdout verbatim to Slack with
# NO LLM in the fact path (structural anti-fabrication fix, Zammad #17143/#17144).
- name: Deploy the script-fed Splunk status-digest script
  ansible.builtin.template:
    src: splunk-digest.py.j2
    dest: "{{ hermes_agent_hermes_home }}/scripts/{{ hermes_agent_splunk_status_digest_script_name }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

# Same no-LLM-in-the-fact-path shape as the status digest above, one rendered
# script per entry in hermes_agent_triage_jobs (the agentic digests these replace
# leaked raw tool-call markup AND never ran the SPL their prompts specified).
# Deployed regardless of the cron gate so enabling is a one-flag change.
- name: Deploy the script-fed Splunk triage scripts
  ansible.builtin.template:
    src: splunk-triage.py.j2
    dest: "{{ hermes_agent_hermes_home }}/scripts/{{ item.name }}.py"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
  loop: "{{ hermes_agent_triage_jobs }}"
  loop_control:
    label: "{{ item.name }}"

# The master Kanban digest: reads kanban.db read-only and reports what the board
# did since its own previous run. No LLM and no network in its fact path, so it
# still reports when the brain is unloaded or wedged — which is when a board goes
# wrong in the first place.
- name: Deploy the master Kanban digest script
  ansible.builtin.template:
    src: kanban-digest.py.j2
    dest: "{{ hermes_agent_hermes_home }}/scripts/{{ hermes_agent_kanban_digest_script_name }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

# --- Vikunja Kanban bridge (operator board -> Hermes board) ------------------
# Makes the operator's Vikunja board the front end for Hermes: READY tasks
# become Kanban cards, the tasks move across their buckets as work starts and
# finishes, and the card's RECORDED result (from kanban.db, no LLM in the
# relay path) is commented back. Deployed regardless of the enable flag so
# turning it on is a one-flag change, same posture as the scripts above.
- name: Deploy the Vikunja Kanban bridge script
  ansible.builtin.template:
    src: vikunja-bridge.py.j2
    dest: "{{ hermes_agent_hermes_home }}/scripts/{{ hermes_agent_vikunja_bridge_script_name }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
  notify: Restart hermes-vikunja-bridge

# 0600 and hermes-owned: this is the only file carrying the write token, which
# is why it is separate from the 0750 script above.
- name: Deploy the Vikunja Kanban bridge environment file
  ansible.builtin.template:
    src: hermes-vikunja-bridge.env.j2
    dest: "{{ hermes_agent_vikunja_bridge_env_file }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0600"
  no_log: true
  notify: Restart hermes-vikunja-bridge

- name: Deploy the Vikunja Kanban bridge systemd unit
  ansible.builtin.template:
    src: hermes-vikunja-bridge.service.j2
    dest: "/etc/systemd/system/{{ hermes_agent_vikunja_bridge_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart hermes-vikunja-bridge
  when: hermes_agent_vikunja_bridge_enabled | bool

# Gated on the token as well as the flag: starting the daemon without a
# credential would only produce a permanent "bridge idle" log line.
- name: Enable and start the Vikunja Kanban bridge
  ansible.builtin.systemd:
    name: "{{ hermes_agent_vikunja_bridge_service }}"
    state: started
    enabled: true
    daemon_reload: true
  when:
    - hermes_agent_vikunja_bridge_enabled | bool
    - hermes_agent_vikunja_bridge_token | length > 0

# Disable-don't-delete: turning the flag off stops the daemon but leaves the
# unit and the ledger in place, so re-enabling resumes tracking the cards that
# were already in flight instead of orphaning them.
- name: Check for a retained Vikunja Kanban bridge unit
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ hermes_agent_vikunja_bridge_service }}.service"
  register: hermes_agent_vikunja_bridge_unit
  when: not (hermes_agent_vikunja_bridge_enabled | bool)

- name: Stop and disable the retained Vikunja Kanban bridge
  ansible.builtin.systemd:
    name: "{{ hermes_agent_vikunja_bridge_service }}"
    state: stopped
    enabled: false
    daemon_reload: true
  when:
    - not (hermes_agent_vikunja_bridge_enabled | bool)
    - hermes_agent_vikunja_bridge_unit.stat.exists | default(false)

# Zammad stale-ticket auto-close, brought under role management (token from .env,
# no hardcoded secret). Cron is gated off by default (see defaults) — the script
# is deployed regardless so enabling is a one-flag change.
- name: Deploy the Zammad stale-ticket auto-close script
  ansible.builtin.template:
    src: zammad-auto-close.py.j2
    dest: "{{ hermes_agent_hermes_home }}/scripts/{{ hermes_agent_zammad_autoclose_script_name }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

# Remove the hand-placed orphan scripts under /var/lib/hermes/scripts/ (a dir
# separate from the managed .hermes/scripts/): the old zammad-auto-close.py
# carried a CLEARTEXT Zammad API token (superseded by the managed template above;
# rotate that token), and issue_tracker.py is an unused, unmanaged SQLite tool.
- name: Remove hand-placed orphan scripts (cleartext-token auto-close + unused tracker)
  ansible.builtin.file:
    path: "{{ hermes_agent_home }}/scripts/{{ item }}"
    state: absent
  loop:
    - zammad-auto-close.py
    - issue_tracker.py

# The guard this failure mode demands: "toolset allowlisted, backend dead" sat
# undetected from first deploy until 2026-07-31, because nothing between the
# converge and a worker's failed tool call ever checked that the web toolset
# could actually answer. Run the upstream backend resolution inside the venv,
# as the hermes user against the deployed config, and FAIL the converge if the
# configured search backend does not resolve as available. Ordered before the
# enqueuer-cron reconcile below on purpose: a converge where search is dead
# stops here and cannot (re-)enable any card that depends on it. Runs the same
# code path the agent runs, so it also breaks loudly if a hermes self-update
# renames these internals — same posture as the source patches above.
- name: Assert the configured web search backend resolves as available
  ansible.builtin.command:
    chdir: "{{ hermes_agent_install_dir }}"
    cmd: >-
      {{ hermes_agent_venv_python }} -c
      "from tools.web_tools import _get_search_backend, _is_backend_available;
      b = _get_search_backend();
      assert _is_backend_available(b), 'web search backend %r unavailable' % b;
      print(b)"
  become: true
  become_user: "{{ hermes_agent_user }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  changed_when: false

# The splunk-admin fleet ran hourly against a 401ing token for a week (WS1,
# 2026-07-31) because nothing between the converge and a worker's failed tool
# call ever checked that the DELIVERED credential authenticates — the card
# `enabled` gate deliberately excludes the token (fail-to-auth, not
# stay-disabled), so the failure was silent by design. Close that gap at the
# converge with a POST of an MCP initialize to the same gateway route the
# profile dials, from the guest, with the token just delivered — split into a
# hidden probe and a visible assert so a bad status is diagnosable without
# printing the bearer header. The probe accepts 401/403 as well as 200 so an
# auth failure reaches the assert as a real status code instead of an opaque
# no_log module failure, and changed_when: false keeps a read-only probe from
# reporting changed every run. Skipped when the integration is off, the URL
# is unrendered (matches the `mcp_servers.splunk` gate in config.yaml.j2), or
# the token is unseeded (the documented inert posture).
- name: Probe the Splunk MCP token against the gateway route
  ansible.builtin.uri:
    url: "{{ hermes_agent_splunk_mcp_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ hermes_agent_splunk_mcp_token }}"
      Accept: application/json, text/event-stream
    body_format: json
    body:
      jsonrpc: "2.0"
      id: 1
      method: initialize
      params:
        protocolVersion: "2025-03-26"
        capabilities: {}
        clientInfo:
          name: converge-assert
          version: "0"
    status_code:
      - 200
      - 401
      - 403
    timeout: 15
  register: hermes_agent_splunk_mcp_probe
  changed_when: false
  no_log: true
  when:
    - hermes_agent_splunk_mcp_enabled | bool
    - hermes_agent_splunk_mcp_url | length > 0
    - hermes_agent_splunk_mcp_token | length > 0

- name: Assert the Splunk MCP token authenticates against the gateway route
  ansible.builtin.assert:
    that:
      - hermes_agent_splunk_mcp_probe.status == 200
    fail_msg: >-
      Splunk MCP token delivered but the gateway route returned HTTP
      {{ hermes_agent_splunk_mcp_probe.status }} instead of 200 — the
      credential is not authenticating.
    quiet: true
  when:
    - hermes_agent_splunk_mcp_enabled | bool
    - hermes_agent_splunk_mcp_url | length > 0
    - hermes_agent_splunk_mcp_token | length > 0

# docs-sync is the one workload that stays a genuine Kanban task (real signed
# PRs + a secret-scan verification/escalation step — the kind of work a human
# expects tracked to completion on a board, not a report). Per-run idempotency
# key (below), NOT a stable one: accumulating done or blocked docs-sync cards
# is board history, not a bug — see reconcile_kanban_card_cron.yml.
- name: Reconcile the docs-sync Kanban card cron
  ansible.builtin.include_tasks: reconcile_kanban_card_cron.yml
  loop: "{{ hermes_agent_kanban_cards }}"
  loop_control:
    label: "{{ item.job }}"

# 26 agentic direct-deliver crons (Phase 5 originals + the 17 converted from
# Kanban recurrence, native-cron redesign): every recurring report/sweep/digest
# workload. The Slack channel is never hardcoded: skip the whole fleet with a
# loud warning when NEITHER the shared digest channel NOR the general Slack
# capability gate is satisfied (most converted entries carry their own
# `deliver:` and do not depend on the shared digest channel at all).
- name: Warn when Slack is not configured (direct-deliver crons skipped)
  ansible.builtin.debug:
    msg: >-
      Neither hermes_agent_digest_slack_channel nor the Slack bot/app
      token + home channel are set — skipping all
      {{ hermes_agent_direct_cron_jobs | length }} agentic direct-deliver
      crons.
  when:
    - hermes_agent_digest_slack_channel | length == 0
    - >-
      hermes_agent_slack_bot_token | length == 0
      or hermes_agent_slack_app_token | length == 0
      or hermes_agent_slack_home_channel | length == 0

- name: Reconcile the agentic direct-deliver digest crons
  ansible.builtin.include_tasks: reconcile_direct_cron.yml
  loop: "{{ hermes_agent_direct_cron_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    hermes_agent_digest_slack_channel | length > 0
    or (hermes_agent_slack_bot_token | length > 0
        and hermes_agent_slack_app_token | length > 0
        and hermes_agent_slack_home_channel | length > 0)

# No daily backfill safety net any more: it existed to re-create a slot-keyed
# Kanban card a missed fire would otherwise drop forever. Recurring work is a
# cron job now (native [SILENT] delivery suppression already handles "nothing
# new to report"), and docs-sync's per-run key means a missed fire is simply a
# card that never got created that week — nothing to backfill.

# The script-fed Splunk status digest: a --no-agent --script cron whose stdout
# (real numbers the script gathered itself) is delivered verbatim to Slack. No
# LLM in the fact path — nothing to poison. Replaces the LLM digest paths.
- name: Reconcile the script-fed Splunk status-digest cron
  ansible.builtin.include_tasks: reconcile_enqueuer_cron.yml
  vars:
    item:
      name: "{{ hermes_agent_splunk_status_digest_cron_name }}"
      schedule: "{{ hermes_agent_splunk_status_digest_cron_schedule }}"
      script: "{{ hermes_agent_splunk_status_digest_script_name }}"
      deliver: "slack:{{ hermes_agent_splunk_status_digest_channel }}"
      enabled: "{{ hermes_agent_splunk_status_digest_enabled }}"

# The master Kanban digest cron: same --no-agent --script contract. Deliberately
# NOT added to hermes_agent_seeded_cron_names — that list is what a cluster
# window pauses, and this digest has to keep reporting through one.
- name: Reconcile the master Kanban digest cron
  ansible.builtin.include_tasks: reconcile_enqueuer_cron.yml
  vars:
    item:
      name: "{{ hermes_agent_kanban_digest_cron_name }}"
      schedule: "{{ hermes_agent_kanban_digest_cron_schedule }}"
      script: "{{ hermes_agent_kanban_digest_script_name }}"
      deliver: "slack:{{ hermes_agent_kanban_digest_channel }}"
      enabled: "{{ hermes_agent_kanban_digest_enabled }}"

# The script-fed Splunk triage digests: same --no-agent --script contract as the
# status digest. Their stdout (numbers each script gathered itself) is delivered
# verbatim — no model in the fact path, so no tool-call markup to leak and
# nothing to fabricate. include_tasks re-scopes `item` per iteration, so the
# loop var is built into a fresh dict rather than passed through.
- name: Reconcile the script-fed Splunk triage crons
  ansible.builtin.include_tasks: reconcile_enqueuer_cron.yml
  vars:
    item:
      name: "{{ triage_job.name }}"
      schedule: "{{ triage_job.schedule }}"
      script: "{{ triage_job.name }}.py"
      deliver: "slack:{{ hermes_agent_triage_channel }}"
      enabled: "{{ hermes_agent_triage_enabled }}"
  loop: "{{ hermes_agent_triage_jobs }}"
  loop_control:
    loop_var: triage_job
    label: "{{ triage_job.name }}"

# Retire the hand-created LLM digest direct cron the script-fed digest replaces:
# pause it (disable-don't-delete) so the two never double-post. `cron list` shows
# only ENABLED jobs, so this is a clean no-op once the job is paused.
- name: List active Hermes crons (to retire the superseded LLM digests)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron list"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_active_cron_list
  changed_when: false
  # Always needed now: pausing the three now-superseded *-v2 crons below
  # (zammad/github/summary) is unconditional, not a staged-rollout toggle.

- name: Pause the superseded v3 LLM digest cron (disable-don't-delete)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron pause {{ hermes_agent_superseded_digest_cron_name }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  when:
    - hermes_agent_splunk_status_digest_enabled | bool
    - hermes_agent_superseded_digest_cron_name in (hermes_agent_active_cron_list.stdout | default(''))

# Same disable-don't-delete retirement for each agentic digest a script-fed job
# replaces. A no-op once paused (error-triage was paused by hand to stop the
# markup posts); making it declarative means a converge can never leave both the
# agentic job and its replacement live.
- name: Pause the superseded agentic triage crons (disable-don't-delete)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron pause {{ item.supersedes }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  loop: "{{ hermes_agent_triage_jobs }}"
  loop_control:
    label: "{{ item.supersedes }}"
  when:
    - hermes_agent_triage_enabled | bool
    - item.supersedes in (hermes_agent_active_cron_list.stdout | default(''))

# Retire the agentic anomaly hunt outright — no replacement, because its facts
# are a strict subset of what splunk-status-digest already posts (see defaults).
# The enabled:false in hermes_agent_direct_cron_jobs stops reconcile from
# re-creating it; only this pause stops the cron that already exists on the host.
- name: Pause the retired agentic anomaly-hunt cron (disable-don't-delete)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron pause {{ hermes_agent_retired_anomaly_hunt_cron_name }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  when:
    - hermes_agent_retire_anomaly_hunt | bool
    - hermes_agent_retired_anomaly_hunt_cron_name in (hermes_agent_active_cron_list.stdout | default(''))

# Retire the 6-hourly fabric-status cron: it fails the cadence rule (a cron earns
# its place only as a daily-or-rarer report), and the hourly homelab-ai-fabric-status
# job (now a hermes_agent_direct_cron_jobs entry, native-cron reframe) covers the
# topic. enabled:false stops reconcile from re-creating this job; only this pause
# stops the one already on the guest.
- name: Pause the retired 6-hourly fabric-status cron (disable-don't-delete)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron pause {{ hermes_agent_retired_fabric_status_cron_name }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  when:
    - hermes_agent_retire_fabric_status_v2 | bool
    - hermes_agent_retired_fabric_status_cron_name in (hermes_agent_active_cron_list.stdout | default(''))

# Retire the daily splunk-parsing-quality-v2 cron: its fixed SPL queried the
# proven stale/near-empty `index=network` (see the comment on its
# hermes_agent_direct_cron_jobs entry), so it was confidently omitting real
# data every run, with no memory dedup and no [SILENT] path. The
# splunk-parsing kanban card replaces it 1-for-1 on the same daily cadence.
- name: Pause the retired splunk-parsing-quality-v2 cron (disable-don't-delete)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron pause {{ hermes_agent_retired_splunk_parsing_v2_cron_name }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  when:
    - hermes_agent_retire_splunk_parsing_v2 | bool
    - hermes_agent_retired_splunk_parsing_v2_cron_name in (hermes_agent_active_cron_list.stdout | default(''))

# Retire the 3 *-v2 direct crons the reframe now duplicates 1-for-1 under a
# bare name (zammad-review, github-monitor, daily-summary — same topic, same
# recall/save prompt content, same schedule). disable-don't-delete: enabled:
# false in hermes_agent_direct_cron_jobs stops reconcile from re-creating them;
# only this pause stops the ones already on the guest.
- name: Pause the *-v2 crons the reframe replaces 1-for-1 (disable-don't-delete)
  ansible.builtin.command: "{{ hermes_agent_bin }} cron pause {{ item }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  loop:
    - zammad-incident-review-v2
    - github-org-triage-v2
    - daily-operator-summary-v2
  when: item in (hermes_agent_active_cron_list.stdout | default(''))

# Zammad stale-ticket auto-close cron (disabled by default; see defaults). Closures
# deliver to Slack for auditability. Gated on the auto-close flag AND zammad + slack
# credentials being present.
- name: Reconcile the Zammad stale-ticket auto-close cron
  ansible.builtin.include_tasks: reconcile_enqueuer_cron.yml
  vars:
    item:
      name: "{{ hermes_agent_zammad_autoclose_cron_name }}"
      schedule: "{{ hermes_agent_zammad_autoclose_schedule }}"
      script: "{{ hermes_agent_zammad_autoclose_script_name }}"
      deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
      enabled: >-
        {{ hermes_agent_zammad_autoclose_enabled | bool
           and hermes_agent_zammad_url | length > 0
           and hermes_agent_zammad_api_token | length > 0
           and hermes_agent_slack_hermes_all_channel | length > 0 }}

# Restart=always now lives in the unit itself (see the template); remove the
# stale drop-in a prior mechanism left behind (Restart=on-failure, dated Jul 6)
# so it can't override the unit's own policy.
- name: Remove the stale restart-policy drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/hermes-gateway.service.d/99-restart-policy.conf
    state: absent
  notify: Restart hermes-gateway

- name: Deploy the hermes-gateway systemd unit
  ansible.builtin.template:
    src: hermes-gateway.service.j2
    dest: /etc/systemd/system/hermes-gateway.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart hermes-gateway

- name: Deploy the authenticated Hermes Dashboard systemd unit
  ansible.builtin.template:
    src: hermes-dashboard.service.j2
    dest: /etc/systemd/system/hermes-dashboard.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart hermes-dashboard
  when: hermes_agent_dashboard_enabled | bool

- name: Enable and start the Hermes gateway
  ansible.builtin.systemd:
    name: hermes-gateway
    state: started
    enabled: true
    daemon_reload: true

- name: Enable and start the Hermes Dashboard
  ansible.builtin.systemd:
    name: hermes-dashboard
    state: started
    enabled: true
    daemon_reload: true
  when: hermes_agent_dashboard_enabled | bool

# --- Brain-health watchdog ---------------------------------------------------
# A single-deployment brain (ai_default_model) with no fallback + upstream that ALWAYS
# delivers cron failures means a brain outage DMs the operator twice an hour per
# seeded job while nothing pages that the brain is down. This timer probes the
# brain end-to-end and, on a debounced transition, pauses/resumes the seeded
# fleet and alerts once per edge (Slack DM + urgent ntfy). Gated on the Slack
# tokens that seed the spammy fleet in the first place — no fleet, nothing to
# guard. Enabled by default (see defaults/main.yml for why) — the disable path
# below stays in place for hosts that set the flag false.
- name: Check for the retained Hermes brain-health watchdog timer
  ansible.builtin.stat:
    path: /etc/systemd/system/hermes-brain-watchdog.timer
  register: hermes_agent_brain_watchdog_timer_unit
  when: not (hermes_agent_brain_watchdog_enabled | bool)

- name: Stop and disable the Hermes brain-health watchdog timer
  ansible.builtin.systemd:
    name: hermes-brain-watchdog.timer
    state: stopped
    enabled: false
    daemon_reload: true
  when:
    - not (hermes_agent_brain_watchdog_enabled | bool)
    - hermes_agent_brain_watchdog_timer_unit.stat.exists | default(false)

- name: Deploy the Hermes brain-health watchdog script
  ansible.builtin.template:
    src: hermes-brain-watchdog.sh.j2
    dest: "{{ hermes_agent_brain_watchdog_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart hermes-brain-watchdog timer
  when:
    - hermes_agent_brain_watchdog_enabled | bool
    - hermes_agent_slack_bot_token | length > 0
    - hermes_agent_slack_app_token | length > 0

# Who watches the watchdog (stopgap -- see README.md "Watchdog
# self-monitoring"): fired by hermes-brain-watchdog.service's OnFailure= only
# when a probe cycle crashes. Runs as root, independent of the hermes
# user/.env. dest: is a literal, not a role variable, so it never touches
# defaults/main.yml -- keep it in sync with the ExecStart= path in
# templates/hermes-brain-watchdog-alert.service.j2 if either one moves.
- name: Deploy the Hermes brain-health watchdog self-check alert script
  ansible.builtin.template:
    src: hermes-brain-watchdog-alert.sh.j2
    dest: /usr/local/bin/hermes-brain-watchdog-alert.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart hermes-brain-watchdog timer
  when:
    - hermes_agent_brain_watchdog_enabled | bool
    - hermes_agent_slack_bot_token | length > 0
    - hermes_agent_slack_app_token | length > 0

# OnFailure= target for the long-running units (gateway, dashboard,
# vikunja-bridge), which now carry a StartLimit so their Restart=always loop is
# bounded. Deployed unconditionally: those units exist regardless of whether the
# brain watchdog is enabled, so gating this on the watchdog would leave them
# referencing a unit that was never installed. Path is literal, matching the
# ExecStart= in templates/hermes-unit-alert@.service.j2 -- keep them in sync.
- name: Deploy the Hermes per-unit failure alert script
  ansible.builtin.template:
    src: hermes-unit-alert.sh.j2
    dest: /usr/local/bin/hermes-unit-alert.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy the Hermes per-unit failure alert systemd template
  ansible.builtin.template:
    src: "hermes-unit-alert@.service.j2"
    dest: "/etc/systemd/system/hermes-unit-alert@.service"
    owner: root
    group: root
    mode: "0644"

- name: Deploy the Hermes brain-health watchdog systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - hermes-brain-watchdog.service
    - hermes-brain-watchdog.timer
    - hermes-brain-watchdog-alert.service
  notify: Restart hermes-brain-watchdog timer
  when:
    - hermes_agent_brain_watchdog_enabled | bool
    - hermes_agent_slack_bot_token | length > 0
    - hermes_agent_slack_app_token | length > 0

- name: Enable and start the Hermes brain-health watchdog timer
  ansible.builtin.systemd:
    name: hermes-brain-watchdog.timer
    state: started
    enabled: true
    daemon_reload: true
  when:
    - hermes_agent_brain_watchdog_enabled | bool
    - hermes_agent_slack_bot_token | length > 0
    - hermes_agent_slack_app_token | length > 0

# --- Retained optional brain runtime sync ------------------------------------
# Disabled by default while model selection is owned directly by router aliases.
- name: Check for the retained Hermes brain-sync timer
  ansible.builtin.stat:
    path: /etc/systemd/system/hermes-brain-sync.timer
  register: hermes_agent_brain_sync_timer_unit
  when: not (hermes_agent_brain_sync_enabled | bool)

- name: Stop and disable the retained Hermes brain-sync timer
  ansible.builtin.systemd:
    name: hermes-brain-sync.timer
    state: stopped
    enabled: false
    daemon_reload: true
  when:
    - not (hermes_agent_brain_sync_enabled | bool)
    - hermes_agent_brain_sync_timer_unit.stat.exists | default(false)

- name: Ensure the brain-sync state directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_brain_sync_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: hermes_agent_brain_sync_enabled | bool

- name: Seed the brain-sync state file with the converge-time default
  ansible.builtin.copy:
    content: "{{ hermes_agent_model }}\n"
    dest: "{{ hermes_agent_brain_sync_state_file }}"
    owner: root
    group: root
    mode: "0644" # world-readable: the hermes-owned brain-watchdog reads this too
  when: hermes_agent_brain_sync_enabled | bool

- name: Deploy the brain-sync OpenBao credential file (root-only, separate from .env)
  ansible.builtin.template:
    src: hermes-brain-sync.env.j2
    dest: "{{ hermes_agent_brain_sync_env_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: hermes_agent_brain_sync_enabled | bool

- name: Deploy the Hermes brain-sync script
  ansible.builtin.template:
    src: hermes-brain-sync.sh.j2
    dest: "{{ hermes_agent_brain_sync_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart hermes-brain-sync timer
  when: hermes_agent_brain_sync_enabled | bool

- name: Deploy the Hermes brain-sync systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - hermes-brain-sync.service
    - hermes-brain-sync.timer
  notify: Restart hermes-brain-sync timer
  when: hermes_agent_brain_sync_enabled | bool

- name: Enable and start the Hermes brain-sync timer
  ansible.builtin.systemd:
    name: hermes-brain-sync.timer
    state: started
    enabled: true
    daemon_reload: true
  when: hermes_agent_brain_sync_enabled | bool

- name: Ship the hermes unit logs to the dedicated hermes Splunk index
  ansible.builtin.include_tasks: syslog_route.yml
  when: hermes_agent_syslog_route_enabled | bool
  tags: hermes_agent_logging

- name: Flush handlers so config/unit changes apply before verification
  ansible.builtin.meta: flush_handlers

# Layer 2 — post-converge verification gate (gateway up + clean journal + a real
# tool-call probe through the router), with a rollback recipe on any failure.
- name: Verify the brain wiring end-to-end after converge
  ansible.builtin.import_tasks: verify.yml
