---
# NousResearch Hermes Agent — native install + headless gateway daemon. Idempotent.
#
# The agent runs arbitrary terminal + web tools, so it runs as a NON-root dedicated
# user; the LXC is the blast-radius boundary. Ansible owns the PLATFORM (user,
# install, config, systemd); the Hermes daemon owns its own app lifecycle
# (`hermes update`) — install once behind a `creates` guard and never pin a moving
# 'latest' (Agy: avoids the self-update vs idempotency conflict).
#
# NOT YET LIVE-VALIDATED (verify on first converge): (a) install.sh running clean
# non-interactively as root on a minimal Debian LXC; (b) `hermes gateway run
# --replace` staying up headless with no messaging platform; (c) Hindsight
# provider init from config.yaml alone (it may need its client package on
# first run).
#
# The phases below are ORDER-DEPENDENT and the order is the deploy's safety
# property, not a style choice: contracts are asserted before anything installs,
# patches are applied before their assertions verify them, config/content land
# before the units that consume them start, and the verification gate runs LAST
# so a converge that reaches it has actually left a working gateway. Do not
# reorder these includes to group work by tool; group by phase, as here.
#
# Every include below carries a STATIC tag list naming its component
# (hermes_runtime_install, hermes_patches, hermes_profiles_env,
# hermes_content_scripts, hermes_crons, hermes_units_gateways,
# hermes_agent_logging, hermes_delivery_probe). Tags are never rendered from
# a variable: ansible
# resolves static-import tags before role defaults exist, so a rendered tag
# cannot gate the import and the component tag would silently run the whole
# role. `tags: always` appears only where a task truly guards every component;
# each such site says why in its comment. tests/hermes_agent/
# test_component_tag_narrowing.py fails the build when a component tag pulls
# in another component's work again.

- name: Keep operational profiles off the private identity
  ansible.builtin.set_fact:
    hermes_agent_profiles: []
  when: (hermes_agent_identity | default(hermes_agent_id | default('hermes'))) in ['hermes-private', 'pepper']
  # Profiles guard: probe, install, config, cron, and content readers all consume the empty override.
  tags: always

- name: Reject inherited Pepper profile homes before any runtime changes
  ansible.builtin.import_tasks: pepper_profiles.yml
  when: (hermes_agent_identity | default(hermes_agent_id | default('hermes'))) == 'pepper'
  # Identity guard: must precede any component's first guest change.
  tags: always

# Read-only probe mode: report cron delivery routing, then stop this host
# before any converge task (defaults/main/195-delivery-probe.yml).
- name: Probe cron delivery routing and end the host
  when: hermes_agent_delivery_probe_only | bool
  block:
    - name: Read the cron delivery routing fields
      ansible.builtin.import_tasks: delivery_probe.yml
      tags: hermes_delivery_probe

    - name: End the host after the delivery probe
      ansible.builtin.meta: end_host
      tags: hermes_delivery_probe

# Installed before any task below can notify "Restart hermes-gateway". A
# notification queued before a failure in this block still flushes at play end
# when that failure is rescued, so the wrapper must already be on the guest.
- name: Deploy the drain-before-restart wrapper for the gateway unit
  ansible.builtin.template:
    src: hermes-cron-drain-restart.py.j2
    dest: "{{ hermes_agent_cron_drain_restart_script }}"
    owner: root
    group: root
    mode: "0750"
  # Restart guard: must already be on the guest when any component's restart notification flushes.
  tags: always

- name: Assert brain-wiring contracts before converging
  ansible.builtin.import_tasks: assert_wiring.yml
  tags: hermes_runtime_install

- name: Load the pinned prompt catalog for cron and content consumers
  ansible.builtin.import_tasks: prompt_catalog.yml
  tags:
    - hermes_content_scripts
    - hermes_crons
    - hermes_units_gateways

- name: Install Hermes system prerequisites and normalize the checkout refspec
  ansible.builtin.import_tasks: install_prerequisites.yml
  tags: hermes_runtime_install

- name: Install the shared OpenBao AppRole CLI
  ansible.builtin.import_role:
    name: dryvist.homelab.bao_approle_cli
  # github_identity starts hermes-gh-token.service and pepper_vault deploys
  # its refresh script (profiles), brain_sync deploys a fetch script that
  # calls the CLI (units) — their scoped runs need it installed too.
  tags:
    - hermes_runtime_install
    - hermes_profiles_env
    - hermes_units_gateways

- name: Install the pinned Hermes runtime
  ansible.builtin.import_role:
    name: dryvist.ai_agents.hermes_runtime
    tasks_from: install
  vars:
    hermes_runtime_version: "{{ hermes_agent_version }}"
    hermes_runtime_version_tag: "{{ hermes_agent_version_tag }}"
    hermes_runtime_repo_url: "{{ hermes_agent_repo_url }}"
    hermes_runtime_installer_url: "{{ hermes_agent_installer_url }}"
    hermes_runtime_installer_sha256: "{{ hermes_agent_installer_sha256 }}"
    hermes_runtime_installer_path: "{{ hermes_agent_installer_path }}"
    hermes_runtime_install_dir: "{{ hermes_agent_install_dir }}"
    hermes_runtime_bin: "{{ hermes_agent_bin }}"
    hermes_runtime_hermes_home: "{{ hermes_agent_hermes_home }}"
    hermes_runtime_user: "{{ hermes_agent_user }}"
  tags: hermes_runtime_install

- name: Preserve the installer change state for consumer check-mode guards
  ansible.builtin.set_fact:
    hermes_agent_install:
      changed: "{{ not hermes_agent_existing_binary.stat.exists or hermes_runtime_checkout is changed }}"
  tags: hermes_runtime_install

- name: Build and verify the Hermes dashboard bundle
  ansible.builtin.import_tasks: dashboard_build.yml
  tags: hermes_runtime_install

- name: Apply and verify the pinned-source patches
  ansible.builtin.import_tasks: pinned_patches.yml
  tags: hermes_patches

- name: Venv extras (OTEL patch, Slack platform, web-search backend) and the runtime user
  ansible.builtin.import_tasks: venv_extras_and_users.yml
  tags: hermes_runtime_install

# Before config_and_content.yml: Hermes 0.23 browser_exec needs the local
# Chromium settings, and the terminal Browser Use CLI uses the same system
# browser through its loopback-only CDP service.
- name: Chromium and Browser Use CLI (browser tool surfaces)
  ansible.builtin.import_tasks: browser.yml
  tags: hermes_runtime_install

- name: Build the shared Hermes content bundle
  ansible.builtin.import_tasks: bundle_build.yml
  tags:
    - hermes_profiles_env
    - hermes_units_gateways

- name: Prepare Pepper read-only evidence before enabling its MCP server
  ansible.builtin.import_tasks: pepper_vault.yml
  when: hermes_agent_id == 'pepper'
  tags: hermes_profiles_env

- name: Deploy secrets, config.yaml, persona content, and Hindsight provider config
  ansible.builtin.import_tasks: config_and_content.yml
  tags: hermes_profiles_env

- name: Harden guest SSH and remove drifted or superseded seeded crons
  ansible.builtin.import_tasks: ssh_and_cron_drift.yml
  tags: hermes_crons

- name: Materialize skills and reconcile named operating profiles
  ansible.builtin.import_tasks: skills_and_profiles.yml
  tags: hermes_profiles_env

# After skills_and_profiles.yml so every profile home exists. The collection
# installs each plugin's pinned requirements into the Hermes venv and notifies
# the gateway restart handler on change.
- name: Install the pinned Hermes plugins (guardrails, memory provider, Langfuse)
  ansible.builtin.import_role:
    name: dryvist.ai_agents.hermes_runtime
    tasks_from: plugins
  vars:
    hermes_runtime_user: "{{ hermes_agent_user }}"
    hermes_runtime_group: "{{ hermes_agent_user }}"
    hermes_runtime_hermes_home: "{{ hermes_agent_hermes_home }}"
    hermes_runtime_install_dir: "{{ hermes_agent_install_dir }}"
    hermes_runtime_uv_bin: "{{ hermes_agent_uv_bin }}"
    hermes_runtime_gateway_restart_handler: Restart hermes-gateway
    hermes_runtime_plugins: "{{ hermes_agent_plugins }}"
    hermes_runtime_plugin_homes: "{{ hermes_agent_plugin_homes }}"
  tags: hermes_profiles_env

- name: Assert the installed memory and tracing plugins match their pins
  ansible.builtin.import_tasks: assert_plugins.yml
  tags: hermes_profiles_env

# Presence-gated Home Assistant plugin: installed into the homelab-admin profile home only, so the
# default gateway's home never carries its platform manifest. Enabled for that profile alone.
- name: Install the Home Assistant plugin into the homelab-admin profile home
  ansible.builtin.import_role:
    name: dryvist.ai_agents.hermes_runtime
    tasks_from: plugins
  vars:
    hermes_runtime_user: "{{ hermes_agent_user }}"
    hermes_runtime_group: "{{ hermes_agent_user }}"
    hermes_runtime_hermes_home: "{{ hermes_agent_hermes_home }}"
    hermes_runtime_install_dir: "{{ hermes_agent_install_dir }}"
    hermes_runtime_uv_bin: "{{ hermes_agent_uv_bin }}"
    hermes_runtime_gateway_restart_handler: Restart hermes-gateway
    hermes_runtime_plugins: "{{ hermes_agent_plugins_homeassistant }}"
    hermes_runtime_plugin_homes: "{{ hermes_agent_homeassistant_plugin_homes }}"
  when: hermes_agent_homeassistant_enabled | bool
  tags: hermes_profiles_env

- name: GitHub identity — OpenBao-minted tokens behind a gh wrapper
  ansible.builtin.import_tasks: github_identity.yml
  tags: hermes_profiles_env

- name: Deploy the versioned curriculum
  ansible.builtin.import_tasks: curriculum_and_scripts.yml
  tags: hermes_content_scripts

- name: Deploy the script-fed digest/bridge/auto-close scripts and units
  ansible.builtin.import_tasks: script_deploys.yml
  tags: hermes_content_scripts

- name: Pre-reconcile checks — web search, Splunk MCP, Slack configuration
  ansible.builtin.import_tasks: mcp_precheck.yml
  tags: hermes_crons

- name: Reconcile the direct-deliver and script-fed cron fleet
  ansible.builtin.import_tasks: cron_reconcile.yml
  tags: hermes_crons

- name: Deploy the gateway restart wrapper and remove the stale restart drop-in
  ansible.builtin.import_tasks: gateway_and_dashboard_units.yml
  tags: hermes_units_gateways

- name: Deploy and start the Hermes gateway and dashboard units
  ansible.builtin.import_role:
    name: dryvist.ai_agents.hermes_runtime
    tasks_from: units
  vars:
    hermes_runtime_bin: "{{ hermes_agent_bin }}"
    hermes_runtime_user: "{{ hermes_agent_user }}"
    hermes_runtime_group: "{{ hermes_agent_user }}"
    hermes_runtime_uid: "{{ hermes_agent_uid | int }}"
    hermes_runtime_hermes_home: "{{ hermes_agent_hermes_home }}"
    hermes_runtime_environment_file: "{{ hermes_agent_hermes_home }}/.env"
    hermes_runtime_dashboard_web_dist: "{{ hermes_agent_web_dist }}"
    hermes_runtime_dashboard_host: "{{ hermes_agent_dashboard_host }}"
    hermes_runtime_dashboard_port: "{{ hermes_agent_dashboard_port | int }}"
    hermes_runtime_gateway_cmd: "{{ hermes_agent_gateway_cmd }}"
    hermes_runtime_unit_restart_interval_sec: "{{ hermes_agent_unit_restart_interval_sec | int }}"
    hermes_runtime_unit_restart_burst: "{{ hermes_agent_unit_restart_burst | int }}"
    hermes_runtime_restart: always
    hermes_runtime_restart_sec: 5s
    hermes_runtime_systemd_unit_dir: /etc/systemd/system
    hermes_runtime_gateway_unit_path: /etc/systemd/system/hermes-gateway.service
    hermes_runtime_dashboard_unit_path: /etc/systemd/system/hermes-dashboard.service
    hermes_runtime_gateway_restart_handler: Restart hermes-gateway
    hermes_runtime_dashboard_restart_handler: Restart hermes-dashboard
    hermes_runtime_unit_on_failure: hermes-unit-alert@%n.service
    hermes_runtime_gateway_environment: >-
      {{ [
          {'name': 'HERMES_GITHUB_APP_SLUG', 'value': hermes_agent_github_app_slug},
          {'name': 'HERMES_TRUST_BOUNDARY', 'value': hermes_agent_github_trust_boundary_default},
          {'name': 'HERMES_CRON_GOAL_JOBS',
           'value': (hermes_agent_cron_goal_mode_jobs if hermes_agent_id != 'pepper' else []) | join(',')},
          {'name': 'HERMES_CRON_GOAL_MAX_TURNS', 'value': hermes_agent_kanban_goal_max_turns}
         ] + ((hermes_agent_proxy_environment if hermes_agent_id == 'pepper' else {})
              | dict2items(key_name='name', value_name='value')) }}
    # The dashboard resolves its config from the sticky active profile when one is
    # set, and the profile config.yaml carries no dashboard block. The OIDC
    # provider reads these env vars first, so they hold whichever home is resolved.
    hermes_runtime_dashboard_environment:
      - name: HERMES_DASHBOARD_OIDC_ISSUER
        value: "{{ hermes_agent_dashboard_oidc_issuer }}"
      - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
        value: "{{ hermes_agent_dashboard_oidc_client_id }}"
    hermes_runtime_gateway_after_user_manager: true
  tags: hermes_units_gateways

- name: Re-open named blocked Kanban cards
  ansible.builtin.import_tasks: kanban_unblock.yml
  tags: hermes_crons
  when: hermes_agent_kanban_unblock | length > 0

- name: Deploy and start (or stop) the public-review gateway
  ansible.builtin.import_tasks: public_gateway.yml
  tags: hermes_units_gateways

- name: Deploy the co-located third-party web UIs
  ansible.builtin.import_tasks: companion_uis.yml
  tags: hermes_units_gateways

- name: Deploy the brain-health watchdog
  ansible.builtin.import_tasks: brain_watchdog.yml
  tags: hermes_units_gateways

- name: Deploy the optional brain runtime sync
  ansible.builtin.import_tasks: brain_sync.yml
  tags: hermes_units_gateways

- name: Clean up the retired event relay
  ansible.builtin.import_tasks: event_relay_cleanup.yml
  when: hermes_agent_event_relay_cleanup | bool
  tags: hermes_units_gateways

- name: Ship the Hermes logs to the dedicated rsyslog route
  ansible.builtin.import_tasks: syslog_route.yml
  when: hermes_agent_syslog_route_enabled | bool
  tags:
    - hermes_agent_logging
    - hermes_units_gateways

- name: Ship logs, flush handlers, and run the post-converge verification gate
  ansible.builtin.import_tasks: finalize.yml
  tags: hermes_units_gateways

- name: Remove retired runner artifacts after the gateway restart
  ansible.builtin.import_tasks: decommission_retired_runner.yml
  tags: hermes_units_gateways
