---
# NousResearch Hermes Agent — native install + headless gateway daemon. Idempotent.
#
# The agent runs arbitrary terminal + web tools, so it runs as a NON-root dedicated
# user; the LXC is the blast-radius boundary. Ansible owns the PLATFORM (user,
# install, config, systemd); the Hermes daemon owns its own app lifecycle
# (`hermes update`) — install once behind a `creates` guard and never pin a moving
# 'latest' (Agy: avoids the self-update vs idempotency conflict).
#
# NOT YET LIVE-VALIDATED (verify on first converge): (a) install.sh running clean
# non-interactively as root on a minimal Debian LXC; (b) `hermes gateway run
# --replace` staying up headless with no messaging platform; (c) Hindsight
# provider init from config.yaml alone (it may need its client package on
# first run).
#
# The phases below are ORDER-DEPENDENT and the order is the deploy's safety
# property, not a style choice: contracts are asserted before anything installs,
# patches are applied before their assertions verify them, config/content land
# before the units that consume them start, and the verification gate runs LAST
# so a converge that reaches it has actually left a working gateway. Do not
# reorder these includes to group work by tool; group by phase, as here.

- name: Assert brain-wiring contracts before converging
  ansible.builtin.include_tasks: assert_wiring.yml

- name: Load the pinned prompt catalog
  ansible.builtin.include_tasks: prompt_catalog.yml

- name: Install Hermes Agent and build the dashboard bundle
  ansible.builtin.include_tasks: install_and_dashboard.yml

- name: Pinned-source patches — retry/backoff and cron markup guard
  ansible.builtin.include_tasks: patches_retry_and_markup.yml

- name: Pinned-source patches — goal mode and protocol violations
  ansible.builtin.include_tasks: patches_goal_mode.yml

- name: Pinned-source patches — worker reap and memory-sync logging
  ansible.builtin.include_tasks: patches_worker_reap.yml

- name: Pinned-source patches — opt-in goal mode for native cron jobs
  ansible.builtin.include_tasks: patches_cron_goal_mode.yml

- name: Pinned-source patches — built-in memory store for cron agents
  ansible.builtin.include_tasks: patches_cron_memory.yml

- name: Read back and assert every pinned-source patch actually applied
  ansible.builtin.include_tasks: patches_verify.yml

- name: Venv extras (OTEL patch, Slack platform, web-search backend) and the runtime user
  ansible.builtin.include_tasks: venv_extras_and_users.yml

# Before config_and_content.yml: config.yaml leaves browser.backend unset so
# the agent picks up browser_exec by detecting a runnable browser-use CLI. If
# the config landed first, the gateway would restart against a venv that does
# not have one yet and come up with no browser tools.
- name: Chromium and the browser-use CLI (browser_exec tool surface)
  ansible.builtin.include_tasks: browser.yml

- name: Deploy secrets, config.yaml, persona content, and Hindsight provider config
  ansible.builtin.include_tasks: config_and_content.yml

- name: Harden guest SSH and remove drifted or superseded seeded crons
  ansible.builtin.include_tasks: ssh_and_cron_drift.yml

- name: Materialize skills and reconcile named operating profiles
  ansible.builtin.include_tasks: skills_and_profiles.yml

- name: Deploy the versioned curriculum
  ansible.builtin.include_tasks: curriculum_and_scripts.yml

- name: Deploy the script-fed digest/bridge/auto-close scripts and units
  ansible.builtin.include_tasks: script_deploys.yml

- name: Pre-reconcile checks — web search, Splunk MCP, Slack configuration
  ansible.builtin.include_tasks: mcp_precheck.yml

- name: Reconcile the direct-deliver and script-fed cron fleet
  ansible.builtin.include_tasks: cron_reconcile.yml

- name: Deploy and start the gateway and dashboard units
  ansible.builtin.include_tasks: gateway_and_dashboard_units.yml

- name: Deploy the brain-health watchdog
  ansible.builtin.include_tasks: brain_watchdog.yml

- name: Deploy the optional brain runtime sync
  ansible.builtin.include_tasks: brain_sync.yml

- name: Ship logs, flush handlers, and run the post-converge verification gate
  ansible.builtin.include_tasks: finalize.yml
