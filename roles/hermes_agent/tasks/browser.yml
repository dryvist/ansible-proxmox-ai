---
# Browser capability: Hermes 0.23 browser_exec plus the Browser Use CLI on
# every Hermes guest. browser_exec uses Hermes's bundled browser-harness;
# Browser Use remains available through the terminal toolset and its skill,
# attached to the loopback-only CDP service below.
#
# WHY PER-INSTANCE, not a shared browser container. Hermes auto-spawns a local
# Chromium for private/loopback/LAN URLs whatever backend is configured, and
# most of what these agents read IS internal (Splunk, Zammad, Vikunja, Traefik,
# the docs site) — a central browser would not remove the local one, only add a
# second thing to run. A browser session is also per-conversation state
# (cookies, auth, page stack). And the LXC is already the blast-radius boundary
# for the agent's terminal and web tools; moving the browser outside it
# relocates that risk rather than reducing it. Clean EXTRACTION is the part
# worth centralising, and that is Firecrawl — a real service, reached over the
# network.
#
# Identity-agnostic on purpose: the agent identity selects credentials and cron
# jobs, never OS packages. Both guests get the same browser.

# Debian ships Chromium as a real .deb. This matters: on Ubuntu the `chromium`
# package is a snap transitional shim, snapd does not run in an unprivileged
# LXC, and the install would report success while leaving a binary that cannot
# start. The guests are built from the Debian 13 CT template
# (proxmox_ct_template_debian in tofu-proxmox), so the .deb is what is
# installed. Re-check this assertion if the template family ever changes.
- name: Assert the guest is Debian before installing Chromium from apt
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - ansible_facts['distribution'] != 'Ubuntu'
    fail_msg: >-
      Chromium is installed from apt as a real package, which holds on Debian.
      This guest reports {{ ansible_facts['distribution'] }}. On Ubuntu the
      chromium package is a snap shim that cannot run in an unprivileged LXC,
      and the install would succeed while leaving a broken binary. Source
      Chromium another way rather than letting this pass.

# state: latest, deliberately, and it is the only floating version in this
# role. A browser is a security-critical surface reachable by untrusted page
# content, so "whatever the distro currently ships" is the correct target and
# every converge re-asserts it. There is no version string for Renovate to
# own, which is what makes floating safe here rather than invisible: apt is the
# authority and the converge is the refresh.
#
# Installing Chromium from apt gives Hermes and the Browser Use CLI one
# patched system browser rather than a second unmanaged copy in a cache.
- name: Install Chromium and the fonts a headless render needs
  ansible.builtin.apt:
    name:
      - chromium
      # Without these, headless Chromium renders CJK and emoji as blank boxes.
      # A page the agent cannot read is a page it will summarise wrongly.
      - fonts-liberation
      - fonts-noto-color-emoji
      - fonts-noto-cjk
    state: present
    update_cache: true
    cache_valid_time: 3600
  notify: Restart hermes-gateway

# Proves the browser starts, not merely that the package resolved.
# --no-sandbox is required here and is not a weakened check: Chromium's sandbox
# needs user namespaces an unprivileged LXC does not grant, and the container
# is the security boundary instead — already how this guest's terminal and web
# tools are scoped. Upstream surfaces this exact flag as the remedy for
# "Chromium sandbox launch failed".
- name: Verify Chromium actually starts headless as the hermes user
  ansible.builtin.command:
    cmd: >-
      {{ hermes_agent_chromium_executable }}
      --headless {{ hermes_agent_browser_args | join(' ') }} --disable-gpu --dump-dom about:blank
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_chromium_probe
  changed_when: false

# Browser Use is intentionally a terminal CLI, not Hermes's browser-use cloud
# provider. It shares the apt-managed Chromium through the loopback-only CDP
# service below, so no second downloaded browser or cloud credential is needed.
- name: Probe the installed Browser Use CLI version
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_venv_python }}"
      - -c
      - |
        from importlib.metadata import PackageNotFoundError, version
        try:
            print(version("browser-use"))
        except PackageNotFoundError:
            pass
  register: hermes_agent_browser_use_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the official Browser Use CLI into the Hermes venv
  ansible.builtin.command:
    cmd: >-
      {{ hermes_agent_uv_bin }} pip install
      --python {{ hermes_agent_venv_python }}
      "browser-use=={{ hermes_agent_browser_use_version }}"
  register: hermes_agent_browser_use_install
  changed_when: >-
    not ansible_check_mode and (
      'Installed' in hermes_agent_browser_use_install.stderr
      or 'Uninstalled' in hermes_agent_browser_use_install.stderr
    )
  notify: Restart hermes-gateway
  when: (hermes_agent_browser_use_probe.stdout | trim) != hermes_agent_browser_use_version

- name: Create persistent Browser Use state and Chromium profile directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
  loop:
    - "{{ hermes_agent_browser_use_home }}"
    - "{{ hermes_agent_browser_use_home }}/chromium-profile"

- name: Deploy the loopback-only Chromium CDP service for Browser Use
  ansible.builtin.template:
    src: hermes-browser-use-chromium.service.j2
    dest: /etc/systemd/system/hermes-browser-use-chromium.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart hermes-browser-use-chromium

- name: Enable and start the Browser Use Chromium CDP service
  ansible.builtin.systemd:
    name: hermes-browser-use-chromium
    state: started
    enabled: true
    daemon_reload: true

# web_extract's Firecrawl backend imports the SDK lazily, through
# tools.lazy_deps.ensure. That path cannot work in this venv — the same broken
# lazy pip-install the Hindsight client pin already documents (no pip,
# no ensurepip). So the extra is installed explicitly, exactly like ddgs and
# the Slack extra, or every web_extract call fails at import with the config
# looking correct.
- name: Install the Firecrawl SDK into the Hermes venv for web_extract
  ansible.builtin.command:
    cmd: >-
      {{ hermes_agent_uv_bin }} pip install
      --python {{ hermes_agent_venv_python }}
      "firecrawl-py=={{ hermes_agent_firecrawl_py_version }}"
  register: hermes_agent_firecrawl_py_install
  changed_when: >-
    not ansible_check_mode and (
      'Installed' in hermes_agent_firecrawl_py_install.stderr
      or 'Uninstalled' in hermes_agent_firecrawl_py_install.stderr
    )
  when: hermes_agent_firecrawl_enabled | bool
  notify: Restart hermes-gateway
