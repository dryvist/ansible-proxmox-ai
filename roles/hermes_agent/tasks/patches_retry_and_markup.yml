---
# Upstream bug (NousResearch/hermes-agent, agent/conversation_loop.py):
# the length-continuation and truncated-tool-call retry paths boost
# max_tokens on each retry, but floor the boost ceiling at
# `max(32768, requested_cap)` — so when the configured output cap is set
# below that hardcoded 32768 floor (as `model.max_tokens` was at 8192
# historically), the first truncation retry re-sends a request above the
# ceiling, which a server enforcing a lower per-request limit 400s
# identically ("max_tokens exceeds server limit"), burning all retries and
# surfacing the error instead of completing. The patch holds the boost at the
# configured 8192-token ceiling.
# `agent.max_tokens` is already the user's explicit config-level ceiling;
# treat it as absolute instead of a floor for the boost. Runs every
# converge (idempotent regexp match) because `hermes update` self-updates
# the app out from under this checkout and would silently drop the patch
# otherwise.
- name: Patch hermes-agent retry boost to respect the configured max_tokens ceiling
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/conversation_loop.py"
    regexp: '^(\s*)_tc_boost_cap = max\(32768, _tc_requested_cap or 0\)$'
    replace: '\1_tc_boost_cap = agent.max_tokens if agent.max_tokens else max(32768, _tc_requested_cap or 0)'
  notify: Restart hermes-gateway

- name: Patch hermes-agent length-continuation boost to respect the configured max_tokens ceiling
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/conversation_loop.py"
    regexp: '^(\s*)_boost_cap = max\(32768, _requested_cap or 0\)$'
    replace: '\1_boost_cap = agent.max_tokens if agent.max_tokens else max(32768, _requested_cap or 0)'
  notify: Restart hermes-gateway

# The compressor-scan clamp that used to sit here is GONE. It guarded an
# IndexError from a stale `end` offset in `for idx in range(end - 1, start - 1,
# -1):` — a loop upstream has since restructured away entirely (no reverse scan
# over a retained `end` remains in either the pinned release or current
# upstream), so the regexp matched ZERO times. Its assertion below is inverted
# rather than dropped: it now fails if the unbounded reverse scan ever returns.

# The completion-gate arity patch that used to sit here is GONE: the pinned
# release carries the upstream fix it was waiting for. `judge_goal` returns five
# values and kanban_tools unpacks five, so the regexp matched ZERO times against
# both the pinned release and current upstream. Its assertion below is kept and
# retargeted at upstream's own five-value unpack, so a future arity change still
# fails the converge instead of silently restoring the fail-open gate.

- name: Patch Hermes goal judge timeout for the local light tier
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/goals.py"
    regexp: '^DEFAULT_JUDGE_TIMEOUT = [0-9]+(?:\.[0-9]+)?$'
    replace: 'DEFAULT_JUDGE_TIMEOUT = {{ hermes_agent_kanban_goal_judge_timeout_seconds | float }}'
  notify: Restart hermes-gateway

# A judge-call FAILURE is not a judge VERDICT. Upstream judge_goal masks its
# own API errors as ("continue", "judge error: <Type>", ...), so the kanban
# goal loop fires a continuation worker turn and increments turns_used for
# every failed judge call — measured over 7 days, whole 8-turn budgets burned
# in minutes (48% timeouts, 29% routing 404s, 11% 500s) with the worker never
# executing a single tool call. The two patches below teach the loop to tell
# the cases apart: a failed judge call re-polls the card (so a worker that
# completed meanwhile still wins) and retries the judge after the role's flat
# 15s local-backend delay, consuming NO turn; five consecutive failures block
# the card cleanly with a "no worker turns were consumed" reason — sticky
# blocked, i.e. retryable once the backend is healthy — so a total outage can
# never spin the loop forever. Any real verdict resets the counter.
#
# The guard now keys on upstream's own `_transport_failed` return value, not on
# the "judge error: " text it used to string-match. That sentinel pin is exactly
# what drifted: `judge_goal` grew a fifth return value, the four-value anchor
# stopped matching, and the guard went dead while its assertion still passed on
# an unrelated line — judge failures have been burning whole turn budgets again
# ever since. A flag the function returns cannot be reworded out from under the
# guard the way a message can.
- name: Patch Hermes kanban goal loop to count consecutive judge failures
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/goals.py"
    regexp: '^([ \t]*)nudged_to_finalize = False$(?:\n\1judge_failures = 0)?'
    replace: |-
      \1nudged_to_finalize = False
      \1judge_failures = 0
  notify: Restart hermes-gateway

- name: Patch Hermes kanban goal loop to retry judge errors without burning turns
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/goals.py"
    regexp: |-
      ^([ \t]*)verdict, reason, _parse_failed, _wait, _transport_failed = judge_goal\(goal_text, last_response\)$
      \1if verdict == "wait":$
      \1    verdict = "continue"$
      \1_log\(f"kanban goal loop: turn \{turns_used\}/\{max_turns\} verdict=\{verdict\} reason=.*\)$
    replace: |-
      \1verdict, reason, _parse_failed, _wait, _transport_failed = judge_goal(goal_text, last_response)
      \1if verdict == "wait":
      \1    verdict = "continue"
      \1if _transport_failed:
      \1    judge_failures += 1
      \1    _log(
      \1        f"kanban goal loop: judge call failed ({judge_failures}/5, "
      \1        f"{reason}); retrying without consuming a turn"
      \1    )
      \1    if judge_failures >= 5:
      \1        try:
      \1            block_fn(
      \1                f"Goal judge unreachable {judge_failures} consecutive times "
      \1                f"({reason}); no worker turns were consumed. Retry the card "
      \1                f"once the judge backend is healthy."
      \1            )
      \1        except Exception as exc:
      \1            _log(f"kanban goal loop: block_fn failed ({exc})")
      \1        return {"outcome": "blocked_judge_unreachable", "turns_used": turns_used, "reason": reason}
      \1    time.sleep(15.0)
      \1    continue
      \1judge_failures = 0
      \1_log(f"kanban goal loop: turn {turns_used}/{max_turns} verdict={verdict} reason={_truncate(reason, 120)}")
  notify: Restart hermes-gateway

# index=hermes is this fabric's latency telemetry (roles/hermes_agent/docs/splunk.md).
# The worker path emits its own timing — `API call #N: model=... latency=%.1fs`
# from conversation_loop.py — but the goal judge's model call goes out through
# the auxiliary client, which emits no timing at all, so judge latency is
# unmeasurable from the index the rest of the fabric is measured in.
#
# The two patches below time that call at its own call site and log it with the
# SAME `model=` / `latency=` field names, units and `%.1fs` format the worker
# line uses, so a single search covers both paths. Split in two because each
# insertion is a PREFIX to its anchor, which is what makes the
# `(?:...\n\1)*` optional-repeat form self-normalizing: re-running either patch
# over already-patched source rewrites it byte-identically instead of inserting
# a second copy (`hermes update` re-extracts the source, so both re-run every
# converge). The call anchor carries JUDGE_SYSTEM_PROMPT deliberately — the same
# `call_llm(task="goal_judge", ...)` shape also appears in `draft_contract`,
# which is a one-off contract draft, not the per-turn verdict being measured.
- name: Patch Hermes goal judge to time its model call
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/goals.py"
    regexp: |-
      ^([ \t]*)(?:_judge_started = time\.monotonic\(\)\n\1)*resp = call_llm\($
      \1    task="goal_judge",$
      \1    messages=\[$
      \1        \{"role": "system", "content": JUDGE_SYSTEM_PROMPT\},$
    replace: |-
      \1_judge_started = time.monotonic()
      \1resp = call_llm(
      \1    task="goal_judge",
      \1    messages=[
      \1        {"role": "system", "content": JUDGE_SYSTEM_PROMPT},
  notify: Restart hermes-gateway

- name: Patch Hermes goal judge to emit its model call latency
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/goals.py"
    regexp: |-
      ^([ \t]*)(?:logger\.info\($
      \1    "goal judge: API call model=%s latency=%\.1fs",$
      \1    getattr\(resp, "model", None\) or "unknown",$
      \1    time\.monotonic\(\) - _judge_started,$
      \1\)$
      \1)*verdict, reason, parse_failed, wait_directive = _parse_judge_response\(raw\)$
    replace: |-
      \1logger.info(
      \1    "goal judge: API call model=%s latency=%.1fs",
      \1    getattr(resp, "model", None) or "unknown",
      \1    time.monotonic() - _judge_started,
      \1)
      \1verdict, reason, parse_failed, wait_directive = _parse_judge_response(raw)
  notify: Restart hermes-gateway

# A model that writes its tool call as TEXT (`<function=...>`, `<parameter=...>`)
# instead of issuing it leaves that markup as its entire final response, and cron
# delivery posts it verbatim — garbage in Slack, observed on three separate
# digests. Upstream (NousResearch/hermes-agent) has no notion of this failure, so
# guard it at the one choke point every cron job's output passes through.
#
# NOT a retry: re-running the turn here would run outside the per-job secret scope
# that scheduler.py resets immediately after run_job, which is the exact fault its
# own comment above that block describes. Suppress and name the job instead — the
# raw run is still saved to the job's output file for diagnosis.
#
# blockinfile (not replace) for the helper: its markers make re-inserting on every
# converge idempotent. The call-site replace is idempotent because the rewritten
# line no longer matches its own regexp. Both re-run every converge because
# `hermes update` self-updates the app out from under this checkout and would
# silently drop the patch otherwise.
- name: Patch Hermes cron delivery with a tool-call markup guard
  ansible.builtin.blockinfile:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    marker: "# {mark} ANSIBLE MANAGED BLOCK cron markup guard"
    insertbefore: '^def _deliver_result\('
    block: |
      def _cron_markup_guard(job, output_file, content):
          """Never deliver unparsed tool-call markup to a chat platform.

          Returns the content unchanged, or a diagnostic naming the job when the
          model wrote a tool call as text instead of issuing it.
          """
          if not re.search(r"<(?:function|parameter)=|<tool_call>", content or ""):
              return content
          name = job.get("name", job.get("id", "?"))
          logger.error(
              "Job '%s': final response contained unparsed tool-call markup — "
              "delivery suppressed", name,
          )
          return (
              f":warning: Cron job '{name}' produced unparsed tool-call markup "
              f"instead of a report; its output was suppressed rather than "
              f"delivered. Raw run: {output_file}"
          )


      # Where a run that FAILED goes, instead of the job's own channel. Empty
      # disables the split and leaves every result on its configured target.
      _CRON_ISSUES_TARGET = "{{ hermes_agent_cron_failure_deliver }}"
      # Script-fed crons exit 0 and PRINT their failure (`success` is True), so
      # they declare it with this prefix, like [SILENT]. A marker the script
      # owns, never a keyword match: a successful job REPORTING an error it
      # observed is a finding and stays on the work surface.
      _CRON_ISSUES_MARKER = "{{ hermes_agent_cron_issues_marker }}"
      # Escalate-then-quiet ladder (1858/1853): post failures 1, 3, 10, then
      # every 50th. Streak = persisted failure_streak + this run (delivery
      # precedes mark_job_run). The failure is always recorded; only the post
      # is gated. A success resets the streak upstream.
      _CRON_FAILURE_LADDER = (1, 3, 10)
      _CRON_FAILURE_REPEAT_EVERY = 50


      def _cron_failure_streak(job):
          try:
              return int(job.get("failure_streak") or 0) + 1
          except (TypeError, ValueError):
              return 1


      def _cron_failure_on_ladder(streak):
          return streak in _CRON_FAILURE_LADDER or streak % _CRON_FAILURE_REPEAT_EVERY == 0


      def _cron_route(job, success, content):
          """Return (job, content) with failures routed to the issues channel.

          Routes when the runner reports failure, or when a script-fed job
          declared its own failure with the marker prefix. The marker is
          stripped so it never reaches Slack. Never mutates the caller's job.
          A runner failure off the ladder is delivered to `local` (no post).
          """
          declared = content.lstrip().startswith(_CRON_ISSUES_MARKER)
          if declared:
              content = content.lstrip()[len(_CRON_ISSUES_MARKER):].lstrip()
          if (success and not declared) or not _CRON_ISSUES_TARGET:
              return job, content
          name = job.get("name", job.get("id", "?"))
          if not success:
              streak = _cron_failure_streak(job)
              if not _cron_failure_on_ladder(streak):
                  logger.info("Job '%s': failure %d in a row — not posted", name, streak)
                  return {**job, "deliver": "local"}, content
          logger.info("Job '%s': run failed — routed to the issues channel", name)
          return {**job, "deliver": _CRON_ISSUES_TARGET}, content
  notify: Restart hermes-gateway

- name: Route cron delivery content through the markup guard
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    # Upstream split this assignment across four lines and appended the
    # failure-streak nudge, so the old single-line anchor matched nothing.
    # The wrap is unchanged: guard the whole conditional, nudge included.
    regexp: |-
      ^([ \t]*)deliver_content = final_response if success else \(
      [ \t]*_summarize_cron_failure_for_delivery\(job, error\)
      [ \t]*\+ _failure_streak_nudge\(job\)
      [ \t]*\)$
    replace: |-
      \g<1>deliver_content = _cron_markup_guard(job, output_file, final_response if success else (
      \g<1>    _summarize_cron_failure_for_delivery(job, error)
      \g<1>    + _failure_streak_nudge(job)
      \g<1>))
  notify: Restart hermes-gateway

- name: Patch Hermes auxiliary retry delay for the local serial backend
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/auxiliary_client.py"
    regexp: '^_TRANSIENT_RETRY_BACKOFF_BASE = 1\.0$'
    replace: '_TRANSIENT_RETRY_BACKOFF_BASE = 15.0'
  notify: Restart hermes-gateway

- name: Retry auxiliary rate limits through the bounded transient path
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/auxiliary_client.py"
    regexp: 'return isinstance\(status, int\) and \(status == 408 or 500 <= status < 600\)'
    replace: 'return isinstance(status, int) and (status in (408, 429) or 500 <= status < 600)'
  notify: Restart hermes-gateway

- name: Disable post-budget fallback for the explicit local auxiliary provider
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/agent/auxiliary_client.py"
    regexp: '^([ \t]*)if should_fallback and \(is_auto or is_capacity_error\):$'
    replace: '\g<1>if should_fallback and (is_auto or (is_capacity_error and resolved_provider != "custom")):'
  vars:
    hermes_agent_pinned_patch_expected_matches: 2
  notify: Restart hermes-gateway
