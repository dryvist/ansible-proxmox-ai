---
- name: Validate Pepper service endpoints before preparing egress
  ansible.builtin.assert:
    that:
      - item | ansible.builtin.urlsplit('scheme') == 'https'
      - item | ansible.builtin.urlsplit('hostname') | default('', true) | length > 0
      - item | ansible.builtin.urlsplit('username') is none
      - item | ansible.builtin.urlsplit('password') is none
  loop: >-
    {{ [hermes_agent_model_base_url, hermes_agent_youtrack_mcp_url, hermes_agent_github_identity_bao_addr]
       + ([hermes_agent_pepper_vault_repo_url] if hermes_agent_pepper_vault_repo_url | length > 0 else []) }}
  no_log: true

- name: Publish only Pepper service hostnames for the proxy policy
  ansible.builtin.set_fact:
    hermes_agent_pepper_egress_domains: >-
      {{ ([hermes_agent_model_base_url, hermes_agent_youtrack_mcp_url,
           hermes_agent_github_identity_bao_addr, hermes_agent_pepper_vault_repo_url]
          | reject('equalto', '') | map('ansible.builtin.urlsplit', 'hostname')
          | unique | list) }}
  no_log: true

- name: Prepare Pepper's shared proxy wiring
  vars:
    agent_guest_no_proxy: "{{ agent_guest_loopback_no_proxy }}"
  block:
    - name: Configure the existing guest proxy files
      ansible.builtin.include_role:
        name: agent_guest
        tasks_from: proxy
        public: true

    - name: Preserve Pepper's proxy environment for runtime fetches
      ansible.builtin.set_fact:
        hermes_agent_proxy_environment: "{{ agent_guest_proxy_env }}"
