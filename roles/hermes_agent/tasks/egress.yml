---
- name: Derive the shared Pepper endpoint allowlist
  ansible.builtin.import_tasks: egress_domains.yml

- name: Prepare Pepper's shared proxy wiring
  vars:
    agent_guest_no_proxy: "{{ agent_guest_loopback_no_proxy }}"
  block:
    - name: Configure the existing guest proxy files
      ansible.builtin.include_role:
        name: agent_guest
        tasks_from: proxy
        public: true

    - name: Preserve Pepper's proxy environment for runtime fetches
      ansible.builtin.set_fact:
        hermes_agent_proxy_environment: "{{ agent_guest_proxy_env }}"
