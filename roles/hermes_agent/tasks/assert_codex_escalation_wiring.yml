---
# codex_runner_user/codex_runner_mcp_command come from the codex_runner role
# (playbooks/agents.yml includes it with public: true right before this role,
# for exactly this reason), never redefined here. A missing public: true on
# that include, or a play that drops the codex_runner include entirely,
# leaves config.yaml.j2 rendering the escalation MCP entry against an
# undefined var instead of failing loud here first.
- name: Assert the Codex escalation MCP tool's wiring resolved before rendering
  ansible.builtin.assert:
    quiet: true
    that:
      - codex_runner_user is defined
      - codex_runner_user | length > 0
      - codex_runner_mcp_command is defined
      - codex_runner_mcp_command | length > 0
    fail_msg: >-
      codex_runner_user/codex_runner_mcp_command are not defined. The
      codex_runner role must run in this play before hermes_agent, with
      public: true on its include_role.
  when: hermes_agent_codex_mcp_enabled | bool
