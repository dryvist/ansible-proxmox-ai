---
# These patches target the BUNDLED provider path
# (plugins/memory/hindsight/__init__.py under hermes_agent_install_dir), which
# stops existing once hermes_agent_version bumps to the release that replaces
# it with the catalog plugin (vectorize-io/hindsight, subdir
# hindsight-integrations/hermes, pinned by that hermes-agent tag's own
# plugin-catalog/hindsight.yaml — no separate Renovate tracking needed for the
# plugin ref, it travels with hermes_agent_version). At that point these tasks
# must be DELETED, not re-pathed: read at the catalog plugin's v1.0.1 source
# (sha 176f8c2de1369f569c489b831d143b78128b5535) before doing either.
#
# Every Hindsight client call routes through _run_hindsight_operation. Report
# transport/API exceptions there once with a request id and a count field,
# preserve the exception for direct tool callers, and queue the id for the
# next prefetch so Hermes sees an explicit degraded marker. The provider's
# base contract makes prefetch best-effort and sync_turn non-blocking. Async
# retain can also fail after acceptance; detect that in the operation-status
# result and use the same reporting path.
- name: Report Hindsight operation failures through the provider status hook
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: |-
      (?ms)^    def _run_hindsight_operation\(self, operation\):\n.*?(?=^    # -- retain writer thread)
    replace: |2
          def _report_hindsight_failure(self, operation_name, error):
              from uuid import uuid4

              request_id = str(getattr(error, "request_id", None) or uuid4().hex)
              logger.error(
                  "Hindsight operation failed request_id=%s operation=%s "
                  "hindsight_failure_count=1 hindsight_degraded=true error_type=%s",
                  request_id, operation_name, type(error).__name__,
              )
              try:
                  error.hindsight_request_id = request_id
              except Exception:
                  pass
              with self._prefetch_lock:
                  failures = list(getattr(self, "_pending_hindsight_failure_ids", []))
                  failures.append(request_id)
                  self._pending_hindsight_failure_ids = failures
              if callable(getattr(self, "_status_callback", None)):
                  try:
                      self._status_callback(
                          f"Hindsight memory degraded=true request_id={request_id} "
                          f"operation={operation_name}"
                      )
                  except Exception:
                      logger.debug("Hindsight degraded status callback failed request_id=%s", request_id)
              return request_id

          def _run_hindsight_operation(self, operation, *, operation_name="memory"):
              """Run an async client operation; retry one stale embedded connection."""
              try:
                  try:
                      return self._run_sync(operation(self._get_client()))
                  except Exception as exc:
                      text = f"{type(exc).__name__}: {exc}".lower()
                      if self._mode != "local_embedded" or not any(
                          marker in text for marker in _RETRIABLE_CONNECTION_MARKERS
                      ):
                          raise
                      logger.info("Hindsight embedded daemon unavailable; recreating client and retrying once")
                      self._client = None
                      self._client = client = self._get_client()
                  return self._run_sync(operation(client))
              except Exception as exc:
                  is_missing_retain_status = (
                      operation_name == "retain_status"
                      and type(exc).__name__ == "NotFoundException"
                  )
                  if not is_missing_retain_status:
                      self._report_hindsight_failure(operation_name, exc)
                  raise
  notify: Restart hermes-gateway

# Exact source anchors and replacement strings exceed the YAML line limit.
# yamllint disable rule:line-length
- name: Label Hindsight recall API failures
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: '^([ \t]*)resp = self\._run_hindsight_operation\(lambda client: client\.arecall\(\*\*kwargs\)\)$'
    replace: '\1resp = self._run_hindsight_operation(lambda client: client.arecall(**kwargs), operation_name="recall")'
  notify: Restart hermes-gateway

- name: Label Hindsight reflect API failures
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: '^([ \t]*)lambda client: client\.areflect\(bank_id=self\._bank_id, query=query, budget=self\._budget\)$'
    replace: '\1lambda client: client.areflect(bank_id=self._bank_id, query=query, budget=self._budget),\n\1operation_name="reflect",'
  notify: Restart hermes-gateway

- name: Label Hindsight retain API failures
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: '^([ \t]*)return self\._run_hindsight_operation\(lambda client: client\.aretain_batch\(\*\*kwargs\)\)$'
    replace: '\1return self._run_hindsight_operation(lambda client: client.aretain_batch(**kwargs), operation_name="retain")'
  notify: Restart hermes-gateway

- name: Label Hindsight retain-status API failures
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: '^([ \t]*)lambda client: client\.operations\.get_operation_status\(bank_id=bank_id, operation_id=op_id\)$'
    replace: '\1lambda client: client.operations.get_operation_status(bank_id=bank_id, operation_id=op_id),\n\1operation_name="retain_status",'
  notify: Restart hermes-gateway

- name: Report unhandled Hindsight writer failures once
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: '^([ \t]*)logger\.warning\("Hindsight retain failed: %s", exc, exc_info=True\)$'
    replace: '\1if not getattr(exc, "hindsight_request_id", None):\n\1    self._report_hindsight_failure("retain", exc)'
  notify: Restart hermes-gateway

- name: Report server-side Hindsight retain failures after acceptance
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: '^([ \t]*)return str\(getattr\(resp, "status", ""\) or ""\)\.lower\(\) in \{"completed", "failed"\}$'
    replace: |-
      \1status = str(getattr(resp, "status", "") or "").lower()
      \1if status in {"failed", "cancelled"}:
      \1    self._report_hindsight_failure("retain", RuntimeError("server-side retain operation failed"))
      \1    return True
      \1return status == "completed"
  notify: Restart hermes-gateway

- name: Update Hindsight retain-timeout documentation for error reporting
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: '^([ \t]*)join\)\. Trades a possibly-stale recall for liveness; WARNING once per prefetch\."""$'
    replace: '\1join). Trades a possibly-stale recall for liveness; emits one countable ERROR with a degraded marker per unresolved batch."""'
  notify: Restart hermes-gateway

- name: Report unresolved Hindsight retain operations at the prefetch deadline
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: |-
      (?ms)^([ \t]*)logger\.warning\("Prefetch: server retain visibility timed out after.*?\n\1[ \t]+"bounded \(recall may miss the just-completed turn\)", timeout, dropped\)$
    replace: '\1self._report_hindsight_failure("retain_timeout", TimeoutError("server retain visibility timed out"))'
  notify: Restart hermes-gateway

- name: Report Hindsight session-switch flush failures once
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: '^([ \t]*)logger\.warning\("Hindsight flush-on-switch failed: %s", e, exc_info=True\)$'
    replace: '\1if not getattr(e, "hindsight_request_id", None):\n\1    self._report_hindsight_failure("retain", e)'
  notify: Restart hermes-gateway

- name: Return request identifiers for Hindsight tool failures
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: |-
      ^([ \t]*)except Exception as e:\n\1    logger\.warning\("%s failed: %s", tool_name, e, exc_info=True\)\n\1    return tool_error\(f"\{failure\}: \{e\}"\)$
    replace: '\1except Exception as e:\n\1    request_id = getattr(e, "hindsight_request_id", None)\n\1    if not request_id:\n\1        request_id = self._report_hindsight_failure(tool_name, e)\n\1    return tool_error(f"{failure} (request_id={request_id})")'
  notify: Restart hermes-gateway

# Preserve the caller's existing best-effort result while the central
# dispatcher emits the countable ERROR and the next prefetch carries a marker.
- name: Keep failed Hindsight recall best effort without a duplicate debug log
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: |-
      ^([ \t]*)except Exception as e:\n\1    logger\.debug\("Hindsight recall failed: %s", e, exc_info=True\)\n\1    return "", 0$
    replace: '\1except Exception as e:\n\1    if not getattr(e, "hindsight_request_id", None):\n\1        self._report_hindsight_failure("recall", e)\n\1    return "", 0'
  notify: Restart hermes-gateway

- name: Return the queued Hindsight failure marker with prefetch context
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/plugins/memory/hindsight/__init__.py"
    regexp: |-
      (?ms)^    def prefetch\(self, query: str, \*, session_id: str = ""\) -> str:\n.*?(?=^    def recall_status\()
    replace: |2
          def prefetch(self, query: str, *, session_id: str = "") -> str:
              # The MemoryProvider contract keeps recall best-effort: return cached
              # context quickly, while exposing any operation failures explicitly.
              if self._recall_sync:
                  result, count = ("", 0) if self._recall_disabled() else self._do_recall(query)
              else:
                  self._join_prefetch(3.0, log=True)
                  with self._prefetch_lock:
                      result, count = self._prefetch_result, self._prefetch_count
                      self._prefetch_result, self._prefetch_count = "", 0
              with self._prefetch_lock:
                  request_ids = list(getattr(self, "_pending_hindsight_failure_ids", []))
                  self._pending_hindsight_failure_ids = []
              context = self._finish_prefetch(result, count)
              if not request_ids:
                  return context
              degraded = (
                  "[HINDSIGHT_MEMORY_DEGRADED degraded=true request_ids="
                  + ",".join(request_ids)
                  + f" failure_count={len(request_ids)}]"
              )
              return degraded + (chr(10) + context if context else "")
  notify: Restart hermes-gateway
# yamllint enable rule:line-length
