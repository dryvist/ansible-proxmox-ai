---
- name: "Satellite stray migration | Resolve current job {{ item.id }}"
  ansible.builtin.set_fact:
    hermes_agent_satellite_stray_current: >-
      {{ (hermes_agent_satellite_stray_profile_jobs.stdout | from_json
          | selectattr('id', 'equalto', item.id) | list | first) | default({}) }}
    hermes_agent_satellite_stray_primary_names: >-
      {{ hermes_agent_satellite_stray_primary_jobs.stdout | from_json
         | map(attribute='name') | select('string') | list }}

- name: "Satellite stray migration | Remove exact job ID {{ item.id }}"
  ansible.builtin.command:
    argv: ["{{ hermes_agent_bin }}", cron, remove, "{{ item.id }}"]
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}/profiles/homelab-admin"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_satellite_stray_remove
  changed_when: hermes_agent_satellite_stray_remove.rc == 0
  failed_when: >-
    hermes_agent_satellite_stray_remove.rc != 0
    and 'not found' not in hermes_agent_satellite_stray_remove.stdout
  no_log: true
  when:
    - hermes_agent_satellite_stray_current.get('id', '') == item.id
    - hermes_agent_satellite_stray_current.get('name', '') == item.name
    - item.name in hermes_agent_satellite_stray_primary_names

- name: "Satellite stray migration | Report disposition {{ item.id }}"
  ansible.builtin.debug:
    msg: >-
      {{ item.id }} ({{ item.name }}):
      {{ 'removed from homelab-admin'
         if (hermes_agent_satellite_stray_remove.rc | default(1) | int) == 0
         else 'skipped: id absent from homelab-admin'
         if hermes_agent_satellite_stray_current.get('id', '') != item.id
         else 'skipped: id name does not match expected name'
         if hermes_agent_satellite_stray_current.get('name', '') != item.name
         else 'skipped: no primary job has the expected name'
         if item.name not in hermes_agent_satellite_stray_primary_names
         else 'skipped: id disappeared before removal' }}
