---
# Reconcile ONE named Hermes operating profile (see hermes_agent_profiles in
# defaults/main.yml for the concept and the decision rule). Included once per
# entry with `item` = that profile's dict. Idempotent: `hermes profile create`
# is guarded by `creates`, and every file below is a plain Ansible
# template/copy re-render (safe to run every converge).
#
# Order matters: this runs AFTER the shared dryvist skills bundle is deployed
# to the default profile (so hermes_agent_bundle_path is already resolved) and
# BEFORE the Kanban enqueuer crons are reconciled (so a card's --skill and
# --assignee always resolve against a profile that already exists).

# `hermes profile create` always creates under the ROOT HERMES_HOME
# (profiles/<name>/), regardless of which profile is "active" — pointing
# HERMES_HOME at the default root here is therefore correct, not a shortcut.
- name: "Create profile directory for {{ item.name }}"
  ansible.builtin.command:
    cmd: "{{ hermes_agent_bin }} profile create {{ item.name }} --no-skills --no-alias"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  args:
    creates: "{{ hermes_agent_hermes_home }}/profiles/{{ item.name }}"

- name: "Deploy profile config.yaml for {{ item.name }}"
  ansible.builtin.template:
    src: config-profile.yaml.j2
    dest: "{{ hermes_agent_hermes_home }}/profiles/{{ item.name }}/config.yaml"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  vars:
    hermes_agent_profile: "{{ item }}"

- name: "Deploy profile secrets (.env) for {{ item.name }}"
  ansible.builtin.template:
    src: hermes-env-profile.j2
    dest: "{{ hermes_agent_hermes_home }}/profiles/{{ item.name }}/.env"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0600"
  vars:
    hermes_agent_profile: "{{ item }}"
  no_log: true

# Memory: the same standalone Hindsight service as the default profile
# (hermes_agent_memory_api_url), local_external mode. bank_id_template is
# deliberately UNSET (matches the default profile), so a profile uses the static
# bank_id written to its own hindsight/config.json: this agent's identity-derived
# bank_id unless the profile entry sets `memory_bank_id`. Memory is explicitly NOT part of the
# profile isolation boundary (verified against the pinned hindsight plugin
# source: a blank bank_id_template falls back to static bank_id). Different
# agents receive different static bank IDs through hermes_agent_id; profiles
# without `memory_bank_id` share their agent's bank so daily-summary can read a
# moved card's findings without losing continuity. A profile with
# memory_enabled: false (the eval profile) gets no hindsight config at all.
- name: "Ensure the hindsight config dir exists for profile {{ item.name }}"
  ansible.builtin.file:
    path: "{{ hermes_agent_hermes_home }}/profiles/{{ item.name }}/hindsight"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
  when: hermes_agent_memory_provider == 'hindsight' and (item.memory_enabled | default(true) | bool)

- name: "Deploy the hindsight provider config for profile {{ item.name }}"
  ansible.builtin.template:
    src: hindsight-config.json.j2
    dest: "{{ hermes_agent_hermes_home }}/profiles/{{ item.name }}/hindsight/config.json"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  vars:
    hermes_agent_profile_memory_bank_id: "{{ item.memory_bank_id | default(hermes_agent_memory_bank_id) }}"
  when: hermes_agent_memory_provider == 'hindsight' and (item.memory_enabled | default(true) | bool)

# SOUL.md = the shared bundle persona plus this profile's addendum. Profile
# addenda come from the bundle except the orchestrator's own role-local
# template; its Kanban lifecycle addendum also comes from the bundle.
- name: "Deploy composed SOUL.md (shared base + addendum) for profile {{ item.name }}"
  ansible.builtin.copy:
    content: >-
      {{ (lookup('ansible.builtin.file', hermes_agent_bundle_path ~ '/SOUL.md')
          ~ "\n\n" ~
          (lookup('ansible.builtin.file', hermes_agent_bundle_path ~ '/soul/profiles/' ~ item.name ~ '.md')
           if item.soul_addendum_bundle | default(false)
           else lookup('ansible.builtin.template', role_path ~ '/templates/' ~ item.soul_addendum_file))
          ~ ("\n\n" ~ lookup(
              'ansible.builtin.file',
              hermes_agent_bundle_path ~ '/soul/profiles/' ~ item.soul_addendum_bundle_extra_file
            ) if item.soul_addendum_bundle_extra_file is defined else "")) }}
    dest: "{{ hermes_agent_hermes_home }}/profiles/{{ item.name }}/SOUL.md"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0644"
  when: hermes_agent_soul_managed | bool

# Only the bundle skills this profile is scoped to reach — a card's --skill
# only resolves what its assignee actually has materialized under its own
# skills/dryvist/ dir. Only dryvist/* skills ship in the bundle; the role-local
# Hermes API skill and research/llm-wiki are copied by their own tasks below.
- name: "Deploy the scoped dryvist skills for profile {{ item.name }}"
  ansible.builtin.copy:
    src: "{{ hermes_agent_bundle_path }}/skills/{{ hermes_agent_profile_skill }}/"
    dest: "{{ hermes_agent_hermes_home }}/profiles/{{ item.name }}/skills/{{ hermes_agent_profile_skill }}/"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
    directory_mode: "0750"
  when: hermes_agent_profile_skill.startswith('dryvist/')
  loop: "{{ item.skills }}"
  loop_control:
    loop_var: hermes_agent_profile_skill
    label: "{{ hermes_agent_profile_skill }}"

- name: "Deploy the Hermes GitHub issue API skill for profile {{ item.name }}"
  ansible.builtin.copy:
    src: github-issues-api/
    dest: "{{ hermes_agent_hermes_home }}/profiles/{{ item.name }}/skills/hermes_agent/github-issues-api/"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
    directory_mode: "0750"
  when: "'hermes_agent/github-issues-api' in item.skills"

# research/llm-wiki ships from the hermes-agent install itself
# (hermes_agent_install_dir), not the nix-hermes dryvist bundle above, so it
# needs its own copy task — same source tasks/main.yml uses for the default
# profile ("Materialize llm-wiki skill"). Opt-in: only profiles that name it
# in their `skills` list get it materialized; WIKI_PATH (hermes-env-profile.j2)
# is rendered for every profile regardless, since the directory itself is
# shared, non-secret state — but without this task a profile's --skill
# research/llm-wiki still would not resolve.
- name: "Materialize the llm-wiki skill for profile {{ item.name }}"
  ansible.builtin.copy:
    src: "{{ hermes_agent_install_dir }}/skills/research/llm-wiki"
    dest: "{{ hermes_agent_hermes_home }}/profiles/{{ item.name }}/skills/"
    remote_src: true
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: preserve
  when: hermes_agent_wiki_enabled | bool and 'research/llm-wiki' in item.skills
