---
# Withdraw a job this agent must not run. Without this, scoping a job to
# another identity would only stop it being RE-created: an agent that already
# had it installed would keep firing it indefinitely, which is precisely how a
# second agent ended up duplicating the first agent's duties.
- name: "Direct cron | Remove job not owned by this agent: {{ item.name }}"
  ansible.builtin.command: >-
    {{ hermes_agent_bin }} {{ hermes_agent_cli_profile_args | join(' ') }}
    cron remove {{ item.name }}
  environment:
    HERMES_HOME: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  vars:
    hermes_agent_cli_home: "{{ item.hermes_home | default(hermes_agent_hermes_home) }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_direct_cron_withdraw
  # `hermes cron remove` exits 1 on an already-absent job ("... not found").
  # A stale list or concurrent remove can produce that result; fail only on a
  # real removal error and report changed only when a job was removed.
  changed_when: hermes_agent_direct_cron_withdraw.rc == 0
  failed_when: >-
    hermes_agent_direct_cron_withdraw.rc != 0
    and 'not found' not in hermes_agent_direct_cron_withdraw.stdout
  when:
    - not (hermes_agent_direct_wanted | bool)
    - >-
      (hermes_agent_direct_cron_list.stdout | default('')
       | regex_search('(?m)^[ \\t]*Name:[ \\t]*'
                      ~ (item.name | regex_escape) ~ '[ \\t]*$')) is not none
    - not ansible_check_mode

# Drop the desired-state marker too, so a later re-scoping of this job back to
# this agent is seen as absent-and-create rather than unchanged-and-skip.
- name: "Direct cron | Clear desired-state marker for withdrawn {{ item.name }}"
  ansible.builtin.file:
    path: "{{ hermes_agent_managed_cron_state_dir }}/{{ item.name }}.sha256"
    state: absent
  when:
    - not (hermes_agent_direct_wanted | bool)
    - item.name in (hermes_agent_direct_markers | default({}))
