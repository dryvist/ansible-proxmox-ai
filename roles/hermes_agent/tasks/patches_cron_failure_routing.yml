---
# The two call-site patches that used to route BOTH normal and crashed-job
# cron deliveries through _cron_route() to the issues channel are GONE:
# upstream's `_save_compose_deliver` already calls
# `_deliver_result(job, deliver_content, adapters=adapters, loop=loop,
# for_failure=not d.success)` (with the comment "Failure summaries ... honor
# the job's failure_deliver override (NS-788)"), and its own
# `_deliver_crash_failure` already resolves the same lane with
# for_failure=True. Both regexps matched a call shape from before that
# refactor and would have matched zero times against 2026.9.11 — the whole
# routing half of _cron_route (patches_retry_and_markup.yml) is subsumed.
#
# What survives is the one thing upstream cannot see: a script-fed job that
# exits 0 (runner success=True) and declares its own failure by prefixing
# the marker _cron_route strips. Its `for_failure` never picks that up on
# its own, so it needs to be told. Stashes the flag on d.declared_failure
# too (a plain dynamic attribute — _RunDelivery is an un-slotted dataclass),
# not just the local _cron_declared_failure, because bookkeeping code
# further down (_save_compose_deliver's own unresolved_origin check, and
# _finish_completed_run's classify call) reads the SAME for_failure lane
# and would otherwise read the runner's unforced success flag instead —
# ledgering a suppressed-to-local declared failure as "delivered".
- name: Route a self-declared cron failure through _cron_route
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: |-
      ^([ \t]*)\(
      [ \t]*deliver_content, d\.blocked_config, _silent_alert, d\.incident_acked, d\.failure_incident_id,
      [ \t]*\) = _compose_run_delivery\(
      [ \t]*job, success=d\.success, error=d\.error, final_response=final_response,
      [ \t]*output_file=output_file\)$
    replace: |-
      \g<1>(
      \g<1>    deliver_content, d.blocked_config, _silent_alert, d.incident_acked, d.failure_incident_id,
      \g<1>) = _compose_run_delivery(
      \g<1>    job, success=d.success, error=d.error, final_response=final_response,
      \g<1>    output_file=output_file)
      \g<1>job, deliver_content, _cron_declared_failure = _cron_route(job, deliver_content)
      \g<1>d.declared_failure = _cron_declared_failure
  notify: Restart hermes-gateway

- name: Deliver a self-declared cron failure through the failure lane
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    # Same call the assert reads back on; only the for_failure argument
    # changes, so a re-applied patch is a no-op once ` or _cron_declared_failure`
    # is already there.
    regexp: '^([ \t]*)for_failure=not d\.success,$'
    replace: '\g<1>for_failure=not d.success or _cron_declared_failure,'
  notify: Restart hermes-gateway

# unresolved_origin decides whether an "origin" delivery target that
# resolved to nothing gets recorded as such — computed from the SAME
# for_failure lane the delivery call above uses, so a declared failure
# routed to a resolvable failure_deliver target must not be misread as an
# unresolved origin delivery.
- name: Route unresolved_origin through the failure lane for a declared failure
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: |-
      ^([ \t]*)d\.unresolved_origin = \($
      [ \t]*_normalize_deliver_value\(_delivery_lane_value\(job, for_failure=not d\.success\)\) == "origin"$
      [ \t]*and not _resolve_delivery_targets\(job, for_failure=not d\.success\)$
      [ \t]*\)$
    replace: |-
      \1d.unresolved_origin = (
      \1    _normalize_deliver_value(_delivery_lane_value(
      \1        job, for_failure=not d.success or _cron_declared_failure)) == "origin"
      \1    and not _resolve_delivery_targets(
      \1        job, for_failure=not d.success or _cron_declared_failure)
      \1)
  notify: Restart hermes-gateway

# _finish_completed_run classifies the delivery outcome for the run ledger
# from the same for_failure lane, but it runs in a different function than
# _cron_route — d.declared_failure (set above) is what carries the flag
# across that boundary, since the local _cron_declared_failure variable is
# not in scope there.
- name: Route the run-ledger classification through the failure lane for a declared failure
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: >-
      ^([ \t]*)normalized_deliver=_normalize_deliver_value\(_delivery_lane_value\(job,
      for_failure=not d\.success\)\),$
    replace: |-
      \1normalized_deliver=_normalize_deliver_value(_delivery_lane_value(
      \1    job, for_failure=not d.success or getattr(d, "declared_failure", False))),
  notify: Restart hermes-gateway
