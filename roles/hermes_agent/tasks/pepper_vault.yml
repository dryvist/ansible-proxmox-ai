---
- name: Explain why Pepper evidence access is disabled
  ansible.builtin.debug:
    msg: Pepper vault refresh skipped and MCP server disabled; a repository URL and OpenBao AppRole inputs are required.
  when: not (hermes_agent_pepper_vault_enabled | bool)

- name: Check for the Pepper evidence refresh timer
  ansible.builtin.stat:
    path: /etc/systemd/system/hermes-pepper-vault.timer
  register: hermes_agent_pepper_vault_timer
  when: not (hermes_agent_pepper_vault_enabled | bool)

- name: Disable Pepper evidence refresh when credentials are absent
  ansible.builtin.systemd:
    name: hermes-pepper-vault.timer
    state: stopped
    enabled: false
  when:
    - not (hermes_agent_pepper_vault_enabled | bool)
    - hermes_agent_pepper_vault_timer.stat.exists | default(false)

- name: Remove Pepper vault credentials and legacy Git config when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/hermes-pepper-vault.gitconfig
    - "{{ hermes_agent_pepper_vault_env_path }}"
  when: not (hermes_agent_pepper_vault_enabled | bool)

- name: Prepare the Pepper evidence checkout
  when: hermes_agent_pepper_vault_enabled | bool
  become: true
  become_user: root
  block:
    - name: Require credential-free HTTPS endpoints and an absolute evidence path
      ansible.builtin.assert:
        that:
          - hermes_agent_pepper_vault_repo_url is match('^https://[^/@?#]+/[^?#]+$')
          - hermes_agent_pepper_vault_bao_addr is match('^https://[^/?#]+/?$')
          - hermes_agent_pepper_vault_role_id | trim | length > 0
          - hermes_agent_pepper_vault_secret_id | trim | length > 0
          - hermes_agent_pepper_vault_path is match('^/var/lib/pepper-evidence/[A-Za-z0-9_-]+$')
          - hermes_agent_pepper_vault_path | dirname == '/var/lib/pepper-evidence'
      no_log: true

    - name: Install the existing Node.js and npm stdio runtime pattern
      ansible.builtin.apt:
        name: [git, nodejs, npm]
        state: present

    - name: Protect the evidence parent directory
      ansible.builtin.file:
        path: "{{ hermes_agent_pepper_vault_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create the dedicated evidence refresh account
      ansible.builtin.user:
        name: pepper-evidence
        system: true
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin

    # shortcut: the refresh account owns the served checkout, split staging from a root-owned snapshot if that account
    # ever runs anything else.
    - name: Keep the evidence checkout writable only by its refresh account
      ansible.builtin.file:
        path: "{{ hermes_agent_pepper_vault_path }}"
        state: directory
        owner: pepper-evidence
        group: pepper-evidence
        mode: "0755"

    - name: Initialize the evidence checkout without executing repository content
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -c
          - core.hooksPath=/dev/null
          - init
          - --initial-branch=evidence
          - "{{ hermes_agent_pepper_vault_path }}"
        creates: "{{ hermes_agent_pepper_vault_path }}/.git"
      become: true
      become_user: pepper-evidence

    - name: Remove retained HTTP authorization headers from an existing checkout
      ansible.builtin.lineinfile:
        path: "{{ hermes_agent_pepper_vault_path }}/.git/config"
        regexp: '(?i)^\s*extraheader\s*='
        state: absent
      no_log: true

    - name: Remove retained Git credential files from an existing checkout
      ansible.builtin.file:
        path: "{{ hermes_agent_pepper_vault_path }}/.git-credentials"
        state: absent
      no_log: true

    - name: Remove the retained static Git authentication config
      ansible.builtin.file:
        path: /etc/hermes-pepper-vault.gitconfig
        state: absent
      no_log: true

    - name: Deploy Pepper vault AppRole inputs (root-only)
      ansible.builtin.template:
        src: hermes-pepper-vault.env.j2
        dest: "{{ hermes_agent_pepper_vault_env_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Deploy the Git credential helper that reads the one-fetch token
      ansible.builtin.copy:
        src: hermes-pepper-vault-git-credential
        dest: "{{ hermes_agent_pepper_vault_git_credential_helper_path }}"
        owner: root
        group: pepper-evidence
        mode: "0750"

    - name: Deploy the Pepper vault refresh script
      ansible.builtin.template:
        src: hermes-pepper-vault-refresh.sh.j2
        dest: "{{ hermes_agent_pepper_vault_refresh_script_path }}"
        owner: root
        group: pepper-evidence
        mode: "0750"
      no_log: true

    - name: Deploy the Pepper evidence refresh units using the brain-sync pattern
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - hermes-pepper-vault.service
        - hermes-pepper-vault.timer

    - name: Enable the daily Pepper evidence refresh
      ansible.builtin.systemd:
        name: hermes-pepper-vault.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Refresh evidence through the same sandbox used by the timer
      ansible.builtin.systemd:
        name: hermes-pepper-vault.service
        state: started
