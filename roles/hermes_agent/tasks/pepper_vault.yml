---
- name: Explain why Pepper evidence access is disabled
  ansible.builtin.debug:
    msg: Pepper vault skipped and MCP server disabled; the identity view needs both evidence repository inputs.
  when: not (hermes_agent_pepper_vault_enabled | bool)

- name: Check for the Pepper evidence refresh timer
  ansible.builtin.stat:
    path: /etc/systemd/system/hermes-pepper-vault.timer
  register: hermes_agent_pepper_vault_timer
  when: not (hermes_agent_pepper_vault_enabled | bool)

- name: Disable Pepper evidence refresh when credentials are absent
  ansible.builtin.systemd:
    name: hermes-pepper-vault.timer
    state: stopped
    enabled: false
  when:
    - not (hermes_agent_pepper_vault_enabled | bool)
    - hermes_agent_pepper_vault_timer.stat.exists | default(false)

- name: Remove retained evidence refresh credentials when disabled
  ansible.builtin.file:
    path: /etc/hermes-pepper-vault.env
    state: absent
  when: not (hermes_agent_pepper_vault_enabled | bool)

- name: Prepare the Pepper evidence checkout
  when: hermes_agent_pepper_vault_enabled | bool
  become: true
  become_user: root
  block:
    - name: Require a credential-free HTTPS repository URL and an absolute evidence path
      ansible.builtin.assert:
        that:
          - hermes_agent_pepper_vault_repo_url is match('^https://[^/@?#]+/[^?#]+$')
          - hermes_agent_pepper_vault_read_token not in hermes_agent_pepper_vault_repo_url
          - hermes_agent_pepper_vault_path is match('^/[^\n\r%]+$')
          - hermes_agent_pepper_vault_path != '/'
      no_log: true

    - name: Install the existing Node.js and npm stdio runtime pattern
      ansible.builtin.apt:
        name: [git, nodejs, npm]
        state: present

    - name: Protect the evidence parent directory
      ansible.builtin.file:
        path: "{{ hermes_agent_pepper_vault_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Resolve the evidence repository default branch
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - ls-remote
          - --symref
          - "{{ hermes_agent_pepper_vault_repo_url }}"
          - HEAD
      environment: "{{ hermes_agent_pepper_vault_git_environment }}"
      register: hermes_agent_pepper_vault_remote_head
      changed_when: false
      no_log: true

    # Git's environment config applies only to the process, never .git/config.
    - name: Clone or refresh Pepper evidence with the read-only credential
      ansible.builtin.git:
        repo: "{{ hermes_agent_pepper_vault_repo_url }}"
        dest: "{{ hermes_agent_pepper_vault_path }}"
        version: >-
          {{ hermes_agent_pepper_vault_remote_head.stdout_lines[0].split()[1]
             | regex_replace('^refs/heads/', '') }}
        update: true
        force: false
        umask: "0022"
      environment: "{{ hermes_agent_pepper_vault_git_environment }}"
      no_log: true

    - name: Make the evidence checkout root-owned and read-only to Hermes
      ansible.builtin.file:
        path: "{{ hermes_agent_pepper_vault_path }}"
        state: directory
        recurse: true
        follow: false
        owner: root
        group: root
        mode: u=rwX,go=rX

    - name: Store daily refresh authentication outside the evidence checkout
      ansible.builtin.template:
        src: hermes-pepper-vault.env.j2
        dest: /etc/hermes-pepper-vault.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Deploy the Pepper evidence refresh units using the brain-sync pattern
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - hermes-pepper-vault.service
        - hermes-pepper-vault.timer

    - name: Enable the daily Pepper evidence refresh
      ansible.builtin.systemd:
        name: hermes-pepper-vault.timer
        enabled: true
        state: started
        daemon_reload: true
