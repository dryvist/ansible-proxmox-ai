---
# Reconcile ONE OS-crontab entry that fires a native `hermes kanban create`
# directly at its scheduled time. `hermes cron` has no kanban-aware action:
# `--script` always requires a script FILE under ~/.hermes/scripts (verified
# against the installed CLI's --help), and a bare prompt would burn an LLM
# turn per fire, making a deterministic enqueue non-deterministic. So
# recurrence moves to the user's real OS crontab, and the payload is one
# native `kanban create` invocation with no script anywhere.
#
# PER-RUN idempotency key (job name + UTC date at fire time), NOT a stable
# one. Two things ruled a stable key out:
#   1. It requires the model to run `hermes kanban archive` as its last action
#      to free the key for the next fire. If it completes and skips that step
#      — model forgets, max-runtime SIGTERM lands between complete and
#      archive, any flake — the key stays claimed forever and the job goes
#      silently dark: no error, no card, nothing. `hermes kanban complete` has
#      no --archive flag either, so there is no atomic native alternative.
#   2. Accumulating cards on this board is not the bug. What produced the
#      370-card pile-up in the OLD design (kanban migration #83) was a
#      recurring REPORT living on the board at all, blocking on every fire
#      because Splunk had been broken for 13 days — and that pile-up was
#      correct behaviour: it made a two-week outage visible. Reports moved to
#      plain cron jobs (hermes_agent_direct_cron_jobs); a genuine discrete
#      task like this one accumulating cards because it keeps failing is
#      exactly the signal a board exists to preserve. `hermes kanban gc`
#      handles archived-card retention on its own schedule; nothing here
#      depends on a model running a cleanup command.
#
# item fields: job, schedule (plain 5-field cron expression), prompt_var,
# assignee, max_retries, skills, enabled.
- name: "Kanban card cron | Deploy body file for {{ item.job }}"
  ansible.builtin.template:
    src: kanban-card-body.md.j2
    dest: "{{ hermes_agent_hermes_home }}/kanban-bodies/{{ item.job }}.md"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  vars:
    card: "{{ item }}"
  when: item.enabled | bool

# `%` is cron's own newline/argument separator inside a job command, so every
# literal `%` in the appended date has to be escaped as `\%` here — this job
# string lands directly in the crontab, unlike a file where date needs no
# escaping. The SAME `date -u +\%Y-\%m-\%d` also builds the per-run key, so the
# key and the "CURRENT UTC TIME" line the body ends with can never disagree.
- name: "Kanban card cron | Build create command for {{ item.job }}"
  ansible.builtin.set_fact:
    hermes_agent_kanban_cron_job: >-
      HERMES_HOME={{ hermes_agent_hermes_home }} {{ hermes_agent_bin }} kanban
      create '{{ item.title }}' --body "$(cat
      {{ hermes_agent_hermes_home }}/kanban-bodies/{{ item.job }}.md)


      CURRENT UTC TIME: $(date -u +\%Y-\%m-\%dT\%H:\%M:\%SZ). This is the
      clock, not a guess: use it for every date you state." --idempotency-key
      "{{ item.job }}-$(date -u +\%Y-\%m-\%d)"
      {% if item.assignee | length > 0 %}--assignee '{{ item.assignee }}'{% endif %}
      --max-runtime '{{ item.max_runtime }}' --max-retries {{ item.max_retries }}
      {% for skill in item.skills %}--skill '{{ skill }}' {% endfor -%}
      >> {{ hermes_agent_log_directory }}/kanban-cron.log 2>&1
  when: item.enabled | bool

- name: "Kanban card cron | Reconcile crontab entry for {{ item.job }}"
  ansible.builtin.cron:
    name: "kanban-{{ item.job }}"
    user: "{{ hermes_agent_user }}"
    job: "{{ hermes_agent_kanban_cron_job }}"
    minute: "{{ item.schedule.split(' ')[0] }}"
    hour: "{{ item.schedule.split(' ')[1] }}"
    day: "{{ item.schedule.split(' ')[2] }}"
    month: "{{ item.schedule.split(' ')[3] }}"
    weekday: "{{ item.schedule.split(' ')[4] }}"
    state: present
  when: item.enabled | bool
