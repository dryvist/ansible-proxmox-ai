---
# GitHub identity: OpenBao-minted installation tokens behind a gh wrapper.
# Inert unless hermes_agent_github_identity_enabled.
- name: Assert the GitHub identity AppRole credentials are present
  ansible.builtin.assert:
    that:
      - hermes_agent_github_identity_bao_addr | length > 0
      - hermes_agent_github_identity_approles.public.role_id | length > 0
      - hermes_agent_github_identity_approles.public.secret_id | length > 0
      - hermes_agent_github_identity_approles.private.role_id | length > 0
      - hermes_agent_github_identity_approles.private.secret_id | length > 0
      - "'review' in hermes_agent_github_identity_sets"
      - hermes_agent_github_trust_boundary_default in ['public', 'private']
      - hermes_agent_github_guard_internal_suffixes | length > 0
      - hermes_agent_github_guard_private_repos | length > 0
    fail_msg: >-
      hermes_agent_github_identity_enabled is true but an input is missing:
      the public/private AppRole credentials (env
      HERMES_GITHUB_{PUBLIC,PRIVATE}_VAULT_{ROLE,SECRET}_ID),
      hermes_agent_github_identity_bao_addr, the `review` set, a valid
      hermes_agent_github_trust_boundary_default, or the outbound guard lists
      (env HERMES_GH_GUARD_INTERNAL_SUFFIXES / HERMES_GH_GUARD_PRIVATE_REPOS).
      Supply them or leave the flag false.
    quiet: true
  no_log: true
  when: hermes_agent_github_identity_enabled | bool

- name: Install the GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
  when: hermes_agent_github_identity_enabled | bool

- name: Deploy the GitHub token helper
  ansible.builtin.copy:
    src: hermes-gh-token.py
    dest: "{{ hermes_agent_github_identity_helper_path }}"
    owner: root
    group: root
    mode: "0755"
  when: hermes_agent_github_identity_enabled | bool

- name: Deploy the GitHub token helper credentials (root-only)
  ansible.builtin.template:
    src: hermes-gh-token.env.j2
    dest: "{{ hermes_agent_github_identity_env_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: hermes_agent_github_identity_enabled | bool

- name: Deploy the gh wrapper configuration
  ansible.builtin.copy:
    content: >-
      {{ {'real_gh': hermes_agent_github_identity_real_gh,
          'real_git': hermes_agent_github_identity_git,
          'token_dir': hermes_agent_github_identity_token_dir,
          'sets': hermes_agent_github_identity_sets,
          'deny_suffixes': hermes_agent_github_guard_internal_suffixes,
          'private_repos': hermes_agent_github_guard_private_repos} | to_nice_json }}
    dest: /etc/hermes-gh.json
    owner: root
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  when: hermes_agent_github_identity_enabled | bool

- name: Deploy the gh wrapper
  ansible.builtin.copy:
    src: hermes-gh.py
    dest: "{{ hermes_agent_github_identity_shim_path }}"
    owner: root
    group: root
    mode: "0755"
  when: hermes_agent_github_identity_enabled | bool

- name: Deploy the GitHub token refresh units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - hermes-gh-token.service
    - hermes-gh-token.timer
  when: hermes_agent_github_identity_enabled | bool

- name: Mint the GitHub tokens once and start the refresh timer
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: "{{ item.endswith('.timer') }}"
    daemon_reload: true
  loop:
    - hermes-gh-token.service
    - hermes-gh-token.timer
  when: hermes_agent_github_identity_enabled | bool

- name: Remove the retired GitHub App private key
  ansible.builtin.file:
    path: "{{ hermes_agent_hermes_home }}/github-app.pem"
    state: absent
