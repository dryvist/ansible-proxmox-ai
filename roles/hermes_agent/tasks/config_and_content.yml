---
# The .env below pins SSL_CERT_FILE to this bundle, and that pin is only an
# improvement while the file is really there — pointing the runtime at a
# missing bundle would break every outbound HTTPS call on the guest, which is
# strictly worse than the virtualenv-local bundle it replaces. `ca-certificates`
# is installed earlier in this role, so a miss here means the package was
# removed or the distro moved the path, and the operator needs to know that
# before the units are restarted onto it — not after.
- name: Stat the distro CA bundle the runtime will be pinned to
  ansible.builtin.stat:
    path: "{{ hermes_agent_ca_bundle_path }}"
  register: hermes_agent_ca_bundle_stat

- name: Gate — the distro CA bundle exists before it is pinned as SSL_CERT_FILE
  ansible.builtin.assert:
    that:
      - hermes_agent_ca_bundle_stat.stat.exists
      - hermes_agent_ca_bundle_stat.stat.isreg
    fail_msg: >-
      hermes_agent_ca_bundle_path ({{ hermes_agent_ca_bundle_path }}) is not a
      regular file on this guest, so SSL_CERT_FILE cannot be pinned to it.
      Confirm the ca-certificates package is installed, or override
      hermes_agent_ca_bundle_path with this distro's bundle location.
    success_msg: >-
      Distro CA bundle present at {{ hermes_agent_ca_bundle_path }} — safe to
      pin as SSL_CERT_FILE.

# --- nix-hermes content bundle: SOUL.md, skills, and optional limits ---------
# Build on the controller before rendering config so the optional limits file
# can adjust context caps without putting prompt text in SOUL.md.
- name: Build the nix-hermes content bundle on the controller
  ansible.builtin.command:
    cmd: nix build --no-link --print-out-paths "{{ hermes_agent_bundle_flake_ref }}"
  delegate_to: localhost
  # See assert.yml: the ansible_become connection var outranks the keyword.
  become: false
  vars:
    ansible_become: false
  run_once: true
  register: hermes_agent_bundle_build
  changed_when: false
  # Controller-local build; writes only the controller Nix store, never a target.
  check_mode: false

- name: Resolve the nix-hermes bundle store path
  ansible.builtin.set_fact:
    hermes_agent_bundle_path: "{{ hermes_agent_bundle_build.stdout_lines | last }}"

- name: Stat optional bundle context limits on the controller
  ansible.builtin.stat:
    path: "{{ hermes_agent_bundle_path }}/limits.json"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: hermes_agent_context_limits_file
  check_mode: false

- name: Load bundle context limits and apply the role override
  ansible.builtin.set_fact:
    hermes_agent_context_limits: >-
      {{ ((lookup('ansible.builtin.file', hermes_agent_bundle_path ~ '/limits.json') | from_json)
          if hermes_agent_context_limits_file.stat.exists else {})
         | combine(hermes_agent_context_limits_override, recursive=true) }}

- name: Assert the resolved Hermes router key is a non-empty string
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_agent_model_api_key is string
      - hermes_agent_model_api_key | length > 0
    fail_msg: >-
      hermes_agent_model_api_key must be a non-empty string. Seed
      bao_apps_secrets[{{ ('hermes_default_llm_router_key' if hermes_agent_id == 'hermes'
      else (hermes_agent_id | replace('-', '_')) ~ '_llm_router_key') | to_json }}].
  no_log: true

- name: Assert each Hermes profile router key is a non-empty string
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        bao_apps_secrets.get('hermes_' ~ (item.name | replace('-', '_')) ~ '_llm_router_key', '') is string
      - >-
        bao_apps_secrets.get('hermes_' ~ (item.name | replace('-', '_')) ~ '_llm_router_key', '') | length > 0
    fail_msg: >-
      Profile {{ item.name }} router key must be a non-empty string. Seed
      bao_apps_secrets['hermes_{{ item.name | replace('-', '_') }}_llm_router_key'].
  no_log: true
  loop: "{{ hermes_agent_profiles }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert the public gateway router key is non-empty when enabled
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        bao_apps_secrets.get(
        'hermes_' ~ (hermes_agent_github_public_gateway_profile | replace('-', '_')) ~ '_llm_router_key', '') is string
      - >-
        bao_apps_secrets.get(
        'hermes_' ~
        (hermes_agent_github_public_gateway_profile | replace('-', '_')) ~
        '_llm_router_key', '') | length > 0
    fail_msg: >-
      Public gateway router key must be a non-empty string. Seed
      bao_apps_secrets['hermes_{{ hermes_agent_github_public_gateway_profile | replace('-', '_') }}_llm_router_key'].
  no_log: true
  when: hermes_agent_github_route_public_enabled | bool

- name: Deploy the Hermes secrets file (.env)
  ansible.builtin.template:
    src: hermes-env.j2
    dest: "{{ hermes_agent_hermes_home }}/.env"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0600"
  no_log: true
  notify: Restart hermes-gateway

- name: Deploy the Hermes config.yaml (brain -> LiteLLM router, memory -> Hindsight, budget)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ hermes_agent_hermes_home }}/config.yaml"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  # finalize.yml restarts on config digest changes; Hermes rewrites this at runtime.

# SOUL.md = the persona/behavior surface upstream loads FRESH on every message
# (no restart needed) — the role the AGENTS.md chain plays for Claude Code.
# The bundle composes it at BUILD time from the ai-llm-prompts flake input:
# auto-ai-agent/autonomous-base.md + auto-ai-agent/hermes.md, with their OKF
# frontmatter stripped (see nix-hermes lib/bundle.nix). Edit intent in THOSE
# sources. nix-hermes vendors no prompt of its own — the path this comment used
# to name, data/soul/hermes-variant.md, no longer exists, and looking for it
# costs a real detour.
#
# Ansible owns the file; Hermes self-edits MEMORY.md, not SOUL.md, so no
# agent-written state is overwritten. backup:true preserves the pre-management
# content once on first converge.
- name: Deploy the Hermes SOUL.md (shared behavioral base + Hermes variant)
  ansible.builtin.copy:
    src: "{{ hermes_agent_bundle_path }}/SOUL.md"
    dest: "{{ hermes_agent_hermes_home }}/SOUL.md"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0644"
    backup: true
  when: hermes_agent_soul_managed | bool

# USER.md = what Hermes knows about the operator. Upstream loads it alongside
# MEMORY.md (config.yaml sets user_profile_enabled), and BOTH are agent-owned:
# Hermes edits this file as it learns, so a converge that rewrote it would
# silently delete everything the agent had figured out.
#
# force: no is therefore the whole point, and is NOT the SOUL.md pattern above —
# SOUL.md is role-owned and re-copied every run. This seeds the file once, on a
# guest that has none, and never touches it again. The seed carries only what
# the operator has stated directly (working hours, output expectations, the
# write-routing law); everything else Hermes learns and writes itself.
- name: Seed the Hermes operator profile (USER.md) if the agent has none yet
  ansible.builtin.template:
    src: USER.md.j2
    dest: "{{ hermes_agent_hermes_home }}/USER.md"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0644"
    force: false
  when: hermes_agent_seed_user_profile | bool

# The bundle's own plugins (dryvist-guardrails) are staged here for the collection's
# plugins task, which copies them from this guest path into each Hermes home.
- name: Stage the nix-hermes bundle plugins on the guest
  ansible.builtin.copy:
    src: "{{ hermes_agent_bundle_path }}/plugins/"
    dest: "{{ hermes_agent_bundle_guest_dir }}/plugins/"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
    directory_mode: "0750"

# --- Hindsight memory config. The plugin itself is installed by the plugins task in main.yml.

- name: Ensure the hindsight config dir exists
  ansible.builtin.file:
    path: "{{ hermes_agent_hermes_home }}/hindsight"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
  when: hermes_agent_memory_provider == 'hindsight'

- name: Deploy the hindsight provider config (mode + embedded-daemon LLM)
  ansible.builtin.template:
    src: hindsight-config.json.j2
    dest: "{{ hermes_agent_hermes_home }}/hindsight/config.json"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  notify: Restart hermes-gateway
  when: hermes_agent_memory_provider == 'hindsight'

- name: Manage Splunk memory bank extraction mode
  when:
    - hermes_agent_memory_provider == 'hindsight'
    - hermes_agent_splunk_memory_bank_id == 'hermes-splunk'
    - hermes_agent_splunk_memory_retain_extraction_mode | default('') | length > 0
    - hermes_agent_memory_api_url | default('') | length > 0
    - hermes_agent_memory_api_key | default('') | length > 0
  vars:
    hermes_agent_splunk_memory_config_url: >-
      {{ hermes_agent_memory_api_url }}{{ '/v1/default/banks/'
      ~ hermes_agent_splunk_memory_bank_id }}/config
  block:
    - name: Read the Splunk memory bank configuration
      ansible.builtin.uri:
        url: "{{ hermes_agent_splunk_memory_config_url }}"
        method: GET
        headers:
          Authorization: "Bearer {{ hermes_agent_memory_api_key }}"
        status_code: 200
        timeout: 30
      register: hermes_agent_splunk_memory_bank_config
      until: hermes_agent_splunk_memory_bank_config is succeeded
      retries: 2
      delay: 5
      check_mode: false
      changed_when: false
      no_log: true

    - name: Set the Splunk memory bank extraction mode
      ansible.builtin.uri:
        url: "{{ hermes_agent_splunk_memory_config_url }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ hermes_agent_memory_api_key }}"
        body_format: json
        body:
          updates:
            retain_extraction_mode: "{{ hermes_agent_splunk_memory_retain_extraction_mode }}"
        status_code: 200
        timeout: 30
      when:
        - not ansible_check_mode
        - >-
          hermes_agent_splunk_memory_bank_config.json.overrides.get('retain_extraction_mode')
          != hermes_agent_splunk_memory_retain_extraction_mode
      register: hermes_agent_splunk_memory_bank_patch
      until: hermes_agent_splunk_memory_bank_patch is succeeded
      retries: 2
      delay: 5
      changed_when: true
      no_log: true

    - name: Read back the Splunk memory bank extraction mode
      ansible.builtin.uri:
        url: "{{ hermes_agent_splunk_memory_config_url }}"
        method: GET
        headers:
          Authorization: "Bearer {{ hermes_agent_memory_api_key }}"
        status_code: 200
        timeout: 30
      register: hermes_agent_splunk_memory_bank_readback
      until: hermes_agent_splunk_memory_bank_readback is succeeded
      retries: 2
      delay: 5
      check_mode: false
      changed_when: false
      no_log: true

    - name: Assert the Splunk memory bank extraction mode
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            hermes_agent_splunk_memory_bank_readback.json.overrides.retain_extraction_mode
            == hermes_agent_splunk_memory_retain_extraction_mode
          - >-
            hermes_agent_splunk_memory_bank_readback.json.config.retain_extraction_mode
            == hermes_agent_splunk_memory_retain_extraction_mode
      when: not ansible_check_mode
