---
# The base install skips optional messaging-platform extras (they pull in
# platform SDKs like slack-bolt that most converges never need). Without this,
# the gateway logs "Platform 'Slack' requirements not met" and refuses to
# create the Slack adapter even with valid tokens configured. `uv pip install`
# is a no-op re-run when already satisfied; changed_when keys off its own
# "Installed"/"Uninstalled" summary line so idempotency reporting stays honest.
# uv writes that summary to STDERR, not stdout — check stderr (an empty-repo
# reinstall of nothing leaves both blank, correctly reporting ok/unchanged).
#
# Installed by name (the slack extra's three member packages, pinned as the
# tagged pyproject declares them), NOT as ``-e <checkout>[slack]``. The editable
# form re-resolves the whole checkout, and uv then fails on upstream's own
# conflict: hermes-agent needs pillow 13.0.0 while browser-harness 0.1.13 needs
# pillow 12.3.0. Naming the packages keeps the checkout out of resolution, the
# same way the OTLP step does. Bump the pins with hermes_agent_version
# (defaults/main/10-installer-and-bundles.yml).
- name: Probe the Slack platform extra in the Hermes venv
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_venv_python }}"
      - -c
      - import slack_bolt
  register: hermes_agent_slack_extra_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - hermes_agent_slack_bot_token | length > 0
    - hermes_agent_slack_app_token | length > 0

# The closed-client reconnect fix (slackapi/python-slack-sdk#1913) ships upstream from slack-sdk 3.44.1.
- name: Install the Slack platform extra into the Hermes venv
  ansible.builtin.command:
    cmd: >-
      {{ hermes_agent_uv_bin }} pip install
      --python {{ hermes_agent_venv_python }}
      slack-bolt=={{ hermes_agent_slack_bolt_version }}
      slack-sdk=={{ hermes_agent_slack_sdk_version }}
      aiohttp=={{ hermes_agent_slack_aiohttp_version }}
  register: hermes_agent_slack_extra_install
  changed_when: >-
    not ansible_check_mode and (
      'Installed' in hermes_agent_slack_extra_install.stderr
      or 'Uninstalled' in hermes_agent_slack_extra_install.stderr
    )
  when:
    - hermes_agent_slack_bot_token | length > 0
    - hermes_agent_slack_app_token | length > 0
    - >-
      (hermes_agent_slack_extra_probe.rc | default(1)) != 0
      or (hermes_agent_install.changed | default(false) | bool)

# Upstream's OTLP export (monitoring.export.otlp, gateway_health_export) imports
# the OpenTelemetry SDK and the OTLP/HTTP exporter and refuses to start without
# them: the gateway logs "No module named 'opentelemetry.exporter'" at every
# start and exports nothing. Upstream ships them as the optional ``otlp`` extra
# and lazily installs them, but a lazy install cannot run here (non-interactive,
# and this venv cannot service a lazy pip install). They are installed here as
# the same two pinned packages, NOT as ``-e <dir>[otlp]``: uv reinstalls an
# editable on every run, which would report changed and restart the gateway on
# every converge. A satisfied pinned install prints no Installed/Uninstalled
# line, so the gateway restarts only when the packages actually change.
- name: Install the OTLP export packages into the Hermes venv
  ansible.builtin.command:
    cmd: >-
      {{ hermes_agent_uv_bin }} pip install
      --python {{ hermes_agent_venv_python }}
      opentelemetry-sdk=={{ hermes_agent_otlp_sdk_version }}
      opentelemetry-exporter-otlp-proto-http=={{ hermes_agent_otlp_sdk_version }}
  register: hermes_agent_otlp_install
  changed_when: >-
    not ansible_check_mode and (
      'Installed' in hermes_agent_otlp_install.stderr
      or 'Uninstalled' in hermes_agent_otlp_install.stderr
    )
  notify: Restart hermes-gateway
  when: hermes_agent_otel_endpoint | length > 0

# The `web` toolset (web_search/web_extract) resolves its backend through a
# key/package cascade and, with nothing installed, lands on its hardcoded
# firecrawl default with no API key — verified live 2026-07-31 by running the
# detection in the deployed venv: `search_backend: firecrawl, available:
# False`. Every card that said "using the web toolset" was written against a
# capability that never worked here. ddgs (keyless DuckDuckGo, search-only) is
# the one upstream-bundled backend that needs no credential and no service; it
# is an optional dep the base install omits, so install it the same way as the
# Slack extra. ddgs remains SEARCH-only; that has not changed.
#
# Extraction is no longer missing. The follow-up named here — self-hosted
# Firecrawl reached via FIRECRAWL_API_URL — is deployed, so web_extract has a
# real backend and the curl-the-page workaround the cards used is retired. See
# tasks/browser.yml for the browser half and defaults/main/75-browser.yml for
# both. Do not restore the old cascade: an unpinned backend still drifts to the
# keyless firecrawl SaaS default, which is a different service from ours and
# fails every call.
- name: Install the keyless ddgs web-search backend into the Hermes venv
  ansible.builtin.command:
    cmd: >-
      {{ hermes_agent_uv_bin }} pip install
      --python {{ hermes_agent_venv_python }}
      ddgs
  register: hermes_agent_ddgs_install
  changed_when: >-
    not ansible_check_mode and (
      'Installed' in hermes_agent_ddgs_install.stderr
      or 'Uninstalled' in hermes_agent_ddgs_install.stderr
    )
  notify: Restart hermes-gateway
- name: Create the hermes runtime user (HERMES_HOME on the data volume)
  ansible.builtin.user:
    name: "{{ hermes_agent_user }}"
    home: "{{ hermes_agent_home }}"
    system: true
    shell: /bin/bash # the agent's terminal tool needs a real shell
    create_home: true

# The gateway unit from dryvist.ai_agents.hermes_runtime (later in this play)
# orders the gateway after user@<uid>.service — that needs the numeric uid,
# not the name, since systemd's per-user manager unit is instanced by uid.
- name: Look up the hermes user's uid (for the gateway unit's user@<uid>.service ordering)
  ansible.builtin.getent:
    database: passwd
    key: "{{ hermes_agent_user }}"
  register: hermes_agent_user_getent
  failed_when: >-
    hermes_agent_user_getent.failed | default(false)
    and not ansible_check_mode
  changed_when: false
- name: Set hermes_agent_uid fact
  ansible.builtin.set_fact:
    hermes_agent_uid: >-
      {{ (getent_passwd | default({})).get(
        hermes_agent_user, ['', 0, ''])[1] }}

# Upstream's restart-safe cron worker dispatch (v2026.9.11+) launches each due
# job in a transient `systemd-run --user --scope` so the worker survives a
# gateway restart — that requires a reachable user D-Bus session
# (/run/user/<uid>/bus), which a plain `system: true` user never gets: nothing
# starts `user@<uid>.service` for it. Upstream's own guidance for exactly this
# symptom ("cannot create restart-safe systemd scope ... no reachable user
# D-Bus session") is `loginctl enable-linger <user>` (see
# NousResearch/hermes-agent#110628) — linger starts and holds `user@<uid>.service`
# from boot, independent of any login, which is what the scope creation needs.
# `enable-linger` is idempotent and file-marker-based
# (/var/lib/systemd/linger/<user>), so this is safe to run every converge.
- name: Enable systemd user lingering for the hermes user (restart-safe cron dispatch needs a user D-Bus session)
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ hermes_agent_user }}
    creates: /var/lib/systemd/linger/{{ hermes_agent_user }}

# The home is a pre-existing ZFS data-volume mount (deployment.json mount_point),
# so `create_home` above is a no-op for it — the dir already exists, owned by
# root:root from the mount. Claim it for the hermes user explicitly, or the agent
# can't write its own $HOME (shell sessions, tool scratch, hermes self-update).
- name: Ensure the hermes home directory is owned by the runtime user
  ansible.builtin.file:
    path: "{{ hermes_agent_home }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"

# Hermes tightens HERMES_HOME to 0700 at startup.
- name: Ensure HERMES_HOME exists
  ansible.builtin.file:
    path: "{{ hermes_agent_hermes_home }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0700"

- name: Ensure managed cron state directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_managed_cron_state_dir }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0750"
