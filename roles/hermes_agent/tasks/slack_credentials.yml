---
# Resolve the app token before rendering. The bot token is selected by identity
# in inventory; preserve the primary gateway's existing fallback if it is empty.
- name: Read the Hermes Slack app credential
  ansible.builtin.set_fact:
    hermes_agent_slack_app_token: >-
      {{ lookup('community.hashi_vault.hashi_vault',
         'secret/data/platform/ansible/env:SLACK_' ~ (hermes_agent_id | upper) ~ '_APP_TOKEN',
         url=lookup('ansible.builtin.env', 'BAO_ADDR'),
         token=lookup('ansible.builtin.env', 'BAO_TOKEN'),
         validate_certs=true) | default('', true) }}
  no_log: true
  when: hermes_agent_id in ['hermes', 'donna']

- name: Read the existing bot-token fallback when the primary token is empty
  ansible.builtin.set_fact:
    hermes_agent_slack_bot_token: >-
      {{ lookup('community.hashi_vault.hashi_vault',
         'secret/data/platform/ansible/env:SLACK_HERMES_BOT_TOKEN',
         url=lookup('ansible.builtin.env', 'BAO_ADDR'),
         token=lookup('ansible.builtin.env', 'BAO_TOKEN'),
         validate_certs=true) | default('', true) }}
  no_log: true
  when:
    - hermes_agent_id == 'hermes'
    - hermes_agent_slack_bot_token | length == 0

- name: Fail closed when the Hermes Slack credential pair is missing
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_agent_slack_bot_token | length > 0
      - hermes_agent_slack_app_token | length > 0
    fail_msg: >-
      Required Hermes Slack credentials are unavailable; refusing to render
      the runtime environment.
  no_log: true
  when: hermes_agent_id == 'hermes'

- name: Report when the secondary Slack bot token is unavailable
  ansible.builtin.debug:
    msg: >-
      Secondary Slack bot token is missing; omitting SLACK_BOT_TOKEN from the
      rendered environment.
  when:
    - hermes_agent_id == 'donna'
    - hermes_agent_slack_bot_token | length == 0

- name: Fail closed when the secondary Slack app credential is missing
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_agent_slack_app_token | length > 0
    fail_msg: >-
      Secondary Slack app credential is unavailable; refusing to render the
      runtime environment.
  no_log: true
  when: hermes_agent_id == 'donna'
