---
# The Semaphore runner's short-lived BAO_TOKEN can read the runtime
# environment record. Resolve credentials before any Hermes config is
# rendered; an absent value must stop the role before it can blank the guest's
# existing Socket Mode credentials.
- name: Read the Hermes Slack bot and app credentials
  ansible.builtin.set_fact:
    hermes_agent_slack_bot_token: >-
      {{ lookup('community.hashi_vault.hashi_vault',
         'secret/data/platform/ansible/env:SLACK_' ~ (hermes_agent_id | upper) ~ '_BOT_TOKEN',
         url=lookup('ansible.builtin.env', 'BAO_ADDR'),
         token=lookup('ansible.builtin.env', 'BAO_TOKEN'),
         validate_certs=true) | default('', true) }}
    hermes_agent_slack_app_token: >-
      {{ lookup('community.hashi_vault.hashi_vault',
         'secret/data/platform/ansible/env:SLACK_' ~ (hermes_agent_id | upper) ~ '_APP_TOKEN',
         url=lookup('ansible.builtin.env', 'BAO_ADDR'),
         token=lookup('ansible.builtin.env', 'BAO_TOKEN'),
         validate_certs=true) | default('', true) }}
  no_log: true
  when: hermes_agent_id in ['hermes', 'donna']

- name: Fail closed when either Hermes Slack credential is missing
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_agent_slack_bot_token | length > 0
      - hermes_agent_slack_app_token | length > 0
    fail_msg: >-
      Required Hermes Slack credentials are unavailable; refusing to render
      the runtime environment.
  no_log: true
  when: hermes_agent_id in ['hermes', 'donna']
