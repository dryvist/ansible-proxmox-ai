---
# Install and run the two co-located third-party Hermes UIs. See
# defaults/main/52-companion-uis.yml for why they live on the agent guest.
#
# Each is gated on its own flag so a guest can carry one, both, or neither, and
# so a broken upstream release can be switched off without editing the role.

# --- hermes-webui -------------------------------------------------------------
- name: Install and run hermes-webui
  when: hermes_agent_webui_enabled | bool
  block:
    # Pinned to a release TAG and moved on every converge, exactly like the
    # agent checkout. A `creates:`-guarded clone would bind the pin only on a
    # guest's first install and let the app own its version afterwards, which is
    # how the agent itself drifted two releases behind its pin.
    - name: Pin the hermes-webui checkout to its release tag
      ansible.builtin.git:
        repo: "{{ hermes_agent_webui_repo_url }}"
        dest: "{{ hermes_agent_webui_install_dir }}"
        version: "{{ hermes_agent_webui_version_tag }}"
        depth: 1
        force: true
      register: hermes_agent_webui_checkout

    # NO separate bootstrap step. bootstrap.py is not an installer that returns
    # — it resolves dependencies and then BECOMES the server, spawning a
    # detached child when it is not given `--foreground`. Running it here left a
    # server outside every cgroup: it survived the converge, kept answering 200
    # on the UI's port, and so made a unit that had crashlooped to its start
    # limit look healthy from the outside. Nothing downstream could tell the
    # difference.
    #
    # The unit runs bootstrap.py --foreground, so the dependency resolution the
    # old task performed now happens inside the supervised process, where a
    # failure is a failed unit instead of a silent one.
    - name: Install the hermes-webui unit
      ansible.builtin.template:
        src: hermes-webui.service.j2
        dest: /etc/systemd/system/hermes-webui.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart hermes-webui

    - name: Enable and start hermes-webui
      ansible.builtin.systemd_service:
        name: hermes-webui
        enabled: true
        state: started
        daemon_reload: true

    # Restart on a MOVED pin, not on `changed`: `force: true` above rewrites the
    # working tree every run, so the git task reports changed even when the pin
    # has not moved. Comparing the commit is the precise test — the same
    # expression the agent's own installer uses.
    - name: Restart hermes-webui when the checkout moved
      ansible.builtin.systemd_service:
        name: hermes-webui
        state: restarted
      when: hermes_agent_webui_checkout.before != hermes_agent_webui_checkout.after

# --- hermes-studio ------------------------------------------------------------
- name: Install and run hermes-studio
  when: hermes_agent_studio_enabled | bool
  block:
    - name: Fetch the pinned Node runtime for hermes-studio (checksum-verified)
      ansible.builtin.get_url:
        url: >-
          https://nodejs.org/dist/{{ hermes_agent_studio_node_version
          }}/node-{{ hermes_agent_studio_node_version }}-linux-x64.tar.xz
        dest: /tmp/node-{{ hermes_agent_studio_node_version }}.tar.xz
        checksum: "sha256:{{ hermes_agent_studio_node_sha256 }}"
        mode: "0644"

    - name: Create the Node prefix
      ansible.builtin.file:
        path: "{{ hermes_agent_studio_node_prefix }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Version-scoped prefix plus creates: a bump installs the new runtime, a
    # re-run does nothing. Never `state: latest` on a runtime the app pins.
    - name: Unpack the Node runtime
      ansible.builtin.unarchive:
        src: /tmp/node-{{ hermes_agent_studio_node_version }}.tar.xz
        dest: "{{ hermes_agent_studio_node_prefix }}"
        remote_src: true
        extra_opts: ["--strip-components=1"]
        creates: "{{ hermes_agent_studio_node_prefix }}/bin/node"

    - name: Install unzip for the bun release archive
      ansible.builtin.apt:
        name: unzip
        state: present
        update_cache: false

    - name: Fetch the pinned bun release (checksum-verified)
      ansible.builtin.get_url:
        url: >-
          https://github.com/oven-sh/bun/releases/download/{{ hermes_agent_bun_version }}/bun-linux-x64.zip
        dest: /tmp/bun-{{ hermes_agent_bun_version }}.zip
        checksum: "sha256:{{ hermes_agent_bun_sha256 }}"
        mode: "0644"

    - name: Install the bun binary
      ansible.builtin.unarchive:
        src: /tmp/bun-{{ hermes_agent_bun_version }}.zip
        dest: /tmp
        remote_src: true
        creates: /tmp/bun-linux-x64/bun

    - name: Place bun on PATH
      ansible.builtin.copy:
        src: /tmp/bun-linux-x64/bun
        dest: "{{ hermes_agent_bun_install_root }}/bin/bun"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    # Version pinned explicitly rather than `latest`, so a converge cannot
    # silently move the UI. --trust runs the package's postinstalls
    # (agent-browser, protobufjs); bun blocks them by default and the CLI needs
    # its native modules built.
    - name: Install the pinned hermes-studio package with bun
      ansible.builtin.command:
        cmd: >-
          {{ hermes_agent_bun_install_root }}/bin/bun add --global --trust
          {{ hermes_agent_studio_package }}@{{ hermes_agent_studio_version }}
      environment:
        BUN_INSTALL: "{{ hermes_agent_bun_install_root }}"
      register: hermes_agent_studio_install
      changed_when: "'installed' in hermes_agent_studio_install.stdout"

    - name: Create the hermes-studio state directory
      ansible.builtin.file:
        path: "{{ hermes_agent_studio_home }}"
        state: directory
        owner: "{{ hermes_agent_user }}"
        group: "{{ hermes_agent_user }}"
        mode: "0750"

    - name: Install the hermes-studio unit
      ansible.builtin.template:
        src: hermes-studio.service.j2
        dest: /etc/systemd/system/hermes-studio.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart hermes-studio

    - name: Enable and start hermes-studio
      ansible.builtin.systemd_service:
        name: hermes-studio
        enabled: true
        state: started
        daemon_reload: true
