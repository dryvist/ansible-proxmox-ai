---
# Reconcile ONE `--no-agent --script` enqueuer cron (kanban migration, #83).
# Mirrors reconcile_cron_job.yml's create-if-absent + checksum-marker idempotency,
# but for a script-only job: no prompt/agent/model, the positional carries the
# script's argument (the workload selector), and a changed marker triggers a
# remove+recreate (the CLI's `cron edit` flag set for script jobs is not relied
# on — recreate re-pins schedule/selector/script deterministically).
#
# item fields: name, schedule, enabled, script, deliver. Every call site (the
# script-fed Splunk/kanban digests, native-cron reframe) passes these
# explicitly — there is no longer a Kanban-card-derived {job} shape or a
# shared default script, both retired with the per-card enqueuer.
#
# A job is ACTIVE iff its capability gate (item.enabled) is true. A
# disabled job is SKIPPED entirely here — no create, no remove — so a
# converge leaves whatever state the operator last set it to
# (disable-don't-delete).
#
# Ownership is the one exception, and it is judged separately from capability.
# A job this agent identity does not own is actively withdrawn below, because
# "not mine" is a different condition from "my credential is missing": the
# second should survive a converge untouched, the first must not survive at
# all. Both collapse into item.enabled being false, which is why the removal
# path reads hermes_agent_ops_workload_enabled directly instead.
- name: "Enqueuer cron | Effective-active for {{ item.name }}"
  ansible.builtin.set_fact:
    hermes_agent_enqueuer_active: "{{ item.enabled | default(true) | bool }}"

- name: "Enqueuer cron | Resolve fields for {{ item.name }}"
  ansible.builtin.set_fact:
    hermes_agent_enqueuer_name: "{{ item.name }}"
    # Selector is the script's positional arg; empty for scripts that take none
    # (e.g. the status digest).
    hermes_agent_enqueuer_selector: "{{ item.selector | default('') }}"
    hermes_agent_enqueuer_script: "{{ item.script }}"
    # Delivery target: enqueuers keep stdout empty and deliver 'local'; a digest
    # script delivers its stdout verbatim to e.g. slack:<channel>.
    hermes_agent_enqueuer_deliver: "{{ item.deliver | default('local') }}"
  when: hermes_agent_enqueuer_active | bool

# Also runs when the job is inactive-because-unowned: the withdrawal below has
# to know whether anything is installed, and that is exactly the case where the
# active gate is false. Titled from item.name, not the resolved name — "Resolve
# fields" is still gated on active, so the resolved name is undefined here on an
# agent that does not own the job.
- name: "Enqueuer cron | Look up {{ item.name }}"
  ansible.builtin.command: "{{ hermes_agent_bin }} cron list --all"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_enqueuer_cron_list
  changed_when: false
  when: >-
    (hermes_agent_enqueuer_active | bool)
    or not (hermes_agent_ops_workload_enabled | bool)

# Withdraw a job this agent identity does not own. Without this, scoping a job
# away from an identity only stops it being RE-created — an agent that already
# had it installed keeps firing it indefinitely, which is the duplication this
# scoping exists to end. Keyed on item.name, which "Resolve fields" assigns to
# the resolved name verbatim, so it matches what the create path installed.
- name: "Enqueuer cron | Remove job not owned by this agent: {{ item.name }}"
  ansible.builtin.command: "{{ hermes_agent_bin }} cron remove {{ item.name }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  when:
    - not (hermes_agent_ops_workload_enabled | bool)
    - item.name in (hermes_agent_enqueuer_cron_list.stdout | default(''))

# Drop the desired-state marker alongside the withdrawn job so a later
# re-grant recreates from a clean slate rather than matching a stale checksum.
- name: "Enqueuer cron | Clear desired-state marker for withdrawn {{ item.name }}"
  ansible.builtin.file:
    path: "{{ hermes_agent_managed_cron_state_dir }}/{{ item.name }}.sha256"
    state: absent
  when:
    - not (hermes_agent_ops_workload_enabled | bool)
    - item.name in (hermes_agent_enqueuer_cron_list.stdout | default(''))

- name: "Enqueuer cron | Calculate desired state for {{ hermes_agent_enqueuer_name }}"
  ansible.builtin.set_fact:
    hermes_agent_enqueuer_checksum: >-
      {{ {'schedule': item.schedule, 'selector': hermes_agent_enqueuer_selector,
          'script': hermes_agent_enqueuer_script, 'no_agent': true,
          'deliver': hermes_agent_enqueuer_deliver}
         | to_json | hash('sha256') }}
  when: hermes_agent_enqueuer_active | bool

- name: "Enqueuer cron | Check desired-state marker for {{ hermes_agent_enqueuer_name }}"
  ansible.builtin.copy:
    content: "{{ hermes_agent_enqueuer_checksum }}\n"
    dest: "{{ hermes_agent_managed_cron_state_dir }}/{{ hermes_agent_enqueuer_name }}.sha256"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  check_mode: true
  register: hermes_agent_enqueuer_marker_probe
  when: hermes_agent_enqueuer_active | bool

# A changed marker on an EXISTING job means schedule/selector/script drifted:
# remove it so the create below re-pins the new definition. No drift (or a job
# that does not exist yet) is a no-op here.
- name: "Enqueuer cron | Remove drifted {{ hermes_agent_enqueuer_name }}"
  ansible.builtin.command: "{{ hermes_agent_bin }} cron remove {{ hermes_agent_enqueuer_name }}"
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  when:
    - hermes_agent_enqueuer_active | bool
    - hermes_agent_enqueuer_name in (hermes_agent_enqueuer_cron_list.stdout | default(''))
    - hermes_agent_enqueuer_marker_probe.changed | bool

- name: "Enqueuer cron | Create {{ hermes_agent_enqueuer_name }}"
  ansible.builtin.command:
    argv: >-
      {{ [hermes_agent_bin, 'cron', 'create', item.schedule]
         + ([hermes_agent_enqueuer_selector] if (hermes_agent_enqueuer_selector | length > 0) else [])
         + ['--name', hermes_agent_enqueuer_name,
            '--script', hermes_agent_enqueuer_script,
            '--no-agent', '--deliver', hermes_agent_enqueuer_deliver] }}
  environment:
    HERMES_HOME: "{{ hermes_agent_hermes_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  changed_when: true
  when:
    - hermes_agent_enqueuer_active | bool
    - >-
      hermes_agent_enqueuer_name not in (hermes_agent_enqueuer_cron_list.stdout | default(''))
      or hermes_agent_enqueuer_marker_probe.changed | bool

- name: "Enqueuer cron | Record desired state for {{ hermes_agent_enqueuer_name }}"
  ansible.builtin.copy:
    content: "{{ hermes_agent_enqueuer_checksum }}\n"
    dest: "{{ hermes_agent_managed_cron_state_dir }}/{{ hermes_agent_enqueuer_name }}.sha256"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_user }}"
    mode: "0640"
  when: hermes_agent_enqueuer_active | bool
