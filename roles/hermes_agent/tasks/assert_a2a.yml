---
- name: Check A2A inbound token presence without logging its value
  ansible.builtin.set_fact:
    hermes_agent_a2a_inbound_token_present: "{{ hermes_agent_a2a_inbound_token | string | length > 0 }}"
  no_log: true

- name: Require a bearer token when inbound A2A is enabled
  ansible.builtin.assert:
    that:
      - not (hermes_agent_a2a_inbound_enabled | bool) or hermes_agent_a2a_inbound_token_present | bool
    fail_msg: >-
      hermes_agent_a2a_inbound_enabled is true, but the inbound token is empty.
      Set {{ hermes_agent_env_prefix }}_A2A_TOKEN or seed the identity-scoped
      {{ hermes_agent_id | replace('-', '_') }}_a2a_token value in
      bao_apps_secrets before enabling the remote A2A listener.
    success_msg: >-
      Inbound A2A is disabled or has a bearer token configured.
