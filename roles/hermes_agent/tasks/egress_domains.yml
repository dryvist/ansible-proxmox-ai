---
- name: Start the shared hostname projection
  ansible.builtin.set_fact:
    hermes_agent_pepper_egress_domains: []

- name: Validate and project each non-secret Pepper hostname
  vars:
    _hermes_agent_egress_host: >-
      {{ (hermes_agent_egress_inventory | default({}))[item]
         | default(lookup('ansible.builtin.vars', item)) }}
  loop:
    - hermes_agent_pepper_router_host
    - hermes_agent_pepper_youtrack_host
    - hermes_agent_pepper_openbao_host
    - hermes_agent_pepper_vault_host
  ansible.builtin.include_tasks: egress_host.yml
