---
- name: Start the shared hostname projection
  ansible.builtin.set_fact:
    hermes_agent_isolated_egress_domains: []

- name: Validate and project each isolated endpoint hostname
  vars:
    _hermes_agent_egress_research: &egress_research >-
      {{ (hermes_agent_egress_inventory | default({})).hermes_agent_research_enabled
         | default(hermes_agent_research_enabled | default(false)) }}
    _hermes_agent_egress_host: >-
      {{ hermes_agent_egress_host_overrides[item]
         if item in (hermes_agent_egress_host_overrides | default({}))
         else (hermes_agent_egress_inventory | default({}))[item]
              | default(lookup('ansible.builtin.vars', item)) }}
  # The research posture has no client endpoints, so the tracker hostname is not projected.
  loop: >-
    {{ ['hermes_agent_isolated_router_host', 'hermes_agent_isolated_youtrack_host',
        'hermes_agent_isolated_openbao_host']
       | reject('in', ['hermes_agent_isolated_youtrack_host'] if _hermes_agent_egress_research | bool else [])
       | list }}
  ansible.builtin.include_tasks: egress_host.yml

- name: Validate and project each research-posture hostname
  vars:
    _hermes_agent_egress_research: *egress_research
    _hermes_agent_egress_host: "{{ item }}"
  loop: >-
    {{ ((hermes_agent_egress_inventory | default({})).hermes_agent_research_egress_hosts
        | default(hermes_agent_research_egress_hosts | default([])))
       if _hermes_agent_egress_research | bool else [] }}
  ansible.builtin.include_tasks: egress_host.yml

- name: Validate and project each runtime install hostname
  vars:
    _hermes_agent_egress_host: "{{ item }}"
  loop: >-
    {{ (hermes_agent_egress_inventory | default({})).hermes_agent_isolated_install_egress_hosts
       | default(hermes_agent_isolated_install_egress_hosts | default([])) }}
  ansible.builtin.include_tasks: egress_host.yml
