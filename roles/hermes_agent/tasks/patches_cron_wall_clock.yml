---
# A `replace` REPLACEMENT is not a regex — it is a re.sub template. Escapes
# that are valid in the pattern are errors there: `\s` in a replacement raises
# "bad escape \s" at converge time, failing the play on a live guest. Write the
# inserted Python without backslashes (`(.+)` not `\s*(.+)`), and remember that
# `\1` and `\g<n>` ARE meaningful there and will be substituted.
#
# Upstream v2026.8.3 documents HERMES_CRON_TIMEOUT as an inactivity timeout:
# tool calls, API calls, and streamed tokens reset it, so an active retry/tool
# loop can run forever. Keep that useful native stall detector and add the
# missing aggregate deadline around the same run_job monitor. The patch uses
# upstream's own monotonic clock, poll loop, and request_hard_interrupt path.
#
# The hard-timeout raise below names the run's session id for the operator
# reading the failure (the failure artifact keeps no response, so the
# session is the only way to find the transcript). _cron_session_id is a
# run_job local, not visible inside _run_agent_with_watchdog, so it is
# threaded in as its own parameter — cron_session_id below — rather than
# read from a name that does not exist in that scope.
- name: Thread the cron session id into the watchdog function signature
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: >-
      ^(    )agent, prompt: str, job: dict, job_id: str, job_name: str,
      task_id: str, cancel_event,$
    replace: |-
      \1agent, prompt: str, job: dict, job_id: str, job_name: str,
      \1task_id: str, cron_session_id: str, cancel_event,
  notify: Restart hermes-gateway

- name: Pass the cron session id at the watchdog call site
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: >-
      ^([ \t]*)agent, prompt, job, job_id, job_name, scope\.task_id,
      cancel_event,$
    replace: |-
      \1agent, prompt, job, job_id, job_name, scope.task_id,
      \1_cron_session_id, cancel_event,
  notify: Restart hermes-gateway

- name: Add aggregate cron wall-clock helpers
  ansible.builtin.blockinfile:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    marker: "# {mark} ANSIBLE MANAGED BLOCK cron aggregate wall clock"
    insertbefore: '^def run_job\('
    block: |
      def _hermes_cron_wall_timeout_limit():
          """Return the configured aggregate cron deadline, or None when off."""
          managed = float({{ hermes_agent_cron_wall_timeout_seconds | int }})
          raw = os.getenv("HERMES_CRON_WALL_TIMEOUT", "").strip()
          if not raw:
              return managed
          try:
              value = float(raw)
          except (TypeError, ValueError):
              logger.warning(
                  "Invalid HERMES_CRON_WALL_TIMEOUT=%r; using managed %.0fs limit",
                  raw, managed,
              )
              return managed
          return value if value > 0 else None


      def _hermes_cron_wall_clock_expired(started, limit, now=None):
          """Use a monotonic aggregate deadline that activity cannot reset."""
          if limit is None:
              return False
          current = time.monotonic() if now is None else now
          return current - started >= limit


      def _hermes_cron_poll_timeout(started, limit, poll_interval, now=None):
          """Shorten the final poll so the wall clock cannot overshoot."""
          if limit is None:
              return poll_interval
          current = time.monotonic() if now is None else now
          remaining = limit - (current - started)
          return min(poll_interval, max(0.0, remaining))
  notify: Restart hermes-gateway

- name: Resolve the aggregate cron wall clock beside the inactivity timeout
  # Re-anchored: the monitor moved out of run_job into
  # _run_agent_with_watchdog (cron/scheduler.py), losing 4 spaces of
  # indentation (8 -> 4). Content unchanged.
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: |-
      ^    _cron_inactivity_limit = _cron_timeout if _cron_timeout > 0 else None$(?!
          _cron_wall_timeout_limit =)
    replace: "{{ _hermes_cron_limits_block | indent(4, true) }}"
  vars:
    _hermes_cron_limits_block: |-
      _cron_inactivity_limit = _cron_timeout if _cron_timeout > 0 else None
      _cron_wall_timeout_limit = _hermes_cron_wall_timeout_limit()
  notify: Restart hermes-gateway

- name: Start the aggregate cron clock before submitting the conversation
  # Re-anchored: same 8 -> 4 space re-indent as above; content unchanged.
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: '^    _cron_context = contextvars\.copy_context\(\)$'
    replace: "{{ _hermes_cron_pre_submit_block | indent(4, true) }}"
  vars:
    _hermes_cron_pre_submit_block: |-
      _cron_started_monotonic = time.monotonic()
      _cron_context = contextvars.copy_context()  # wall clock starts before submit
  notify: Restart hermes-gateway

- name: Initialize the independent cron timeout result flags
  # Re-anchored: same 8 -> 4 space re-indent as above; content unchanged.
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: '^    _inactivity_timeout = False$(?!\n    _hard_timeout = False)'
    replace: "{{ _hermes_cron_start_block | indent(4, true) }}"
  vars:
    _hermes_cron_start_block: |-
      _inactivity_timeout = False
      _hard_timeout = False
  notify: Restart hermes-gateway

# HIGHEST MIS-ANCHOR RISK in this patch set. Upstream added a decoy: a
# BARE `if _cron_inactivity_limit is None:` now sits inside
# _watch_inactivity (cron/scheduler.py), at the SAME indentation as the
# real gate below, and returns early when true. A regexp that only matched
# the bare condition would hit that decoy FIRST (it appears earlier in the
# file) and silently disable the inactivity watchdog by making it return
# immediately, while this task itself would report a clean, matched
# converge. The real gate also changed shape — upstream added its own
# `and not _is_oneshot and cancel_event is None` terms — so the anchor
# below matches the FULL current condition text, which the decoy's shorter
# text cannot satisfy, rather than trying to re-exclude the decoy by
# position. patches_verify_cron_wall_clock.yml's PR-A-retargeted assertion
# for the decoy's own guard clause doubles as the negative check that this
# patch left it untouched.
- name: Keep polling whenever either cron deadline is enabled
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: >-
      ^(        )if _cron_inactivity_limit is None and not _is_oneshot and
      cancel_event is None:$
    replace: >-
      \1if _cron_inactivity_limit is None and _cron_wall_timeout_limit is None
      and not _is_oneshot and cancel_event is None:
  notify: Restart hermes-gateway

- name: Bound the final cron poll to the exact remaining wall budget
  # Rewritten, not just re-anchored: upstream collapsed the three-line
  # concurrent.futures.wait(...) call this patch inserted a poll-timeout
  # computation ahead of into one line. Same insertion, one anchor.
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: >-
      ^(                )done, _ = concurrent\.futures\.wait\(\{_cron_future\},
      timeout=_POLL_INTERVAL\)$
    replace: |-
      \1_cron_wait_timeout = _hermes_cron_poll_timeout(
      \1    _cron_started_monotonic,
      \1    _cron_wall_timeout_limit,
      \1    _POLL_INTERVAL,
      \1)
      \1done, _ = concurrent.futures.wait(
      \1    {_cron_future}, timeout=_cron_wait_timeout,
      \1)
  notify: Restart hermes-gateway

- name: Enforce the aggregate cron wall clock in the native poll loop
  # Re-anchored: the "# Agent still running — check inactivity." comment
  # this used to anchor after is gone, and _heartbeat_run_claim_if_due() is
  # now the last statement of the poll loop body — insert the check
  # directly after it instead. Negative lookahead makes this idempotent
  # the same way the siblings above are: without it, a second converge
  # against already-patched source (a plain call-site anchor does not
  # care what follows it) inserts a second copy of the check block.
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: >-
      ^(                )_heartbeat_run_claim_if_due\(\)$(?!\n\s*if
      _hermes_cron_wall_clock_expired\()
    replace: |-
      \1_heartbeat_run_claim_if_due()
      {{ _hermes_cron_wall_check_block | indent(16, true) }}
  vars:
    _hermes_cron_wall_check_block: |-
      if _hermes_cron_wall_clock_expired(
          _cron_started_monotonic, _cron_wall_timeout_limit
      ):
          _hard_timeout = True
          break
  notify: Restart hermes-gateway

# The inactivity-comparison guard patch that used to sit here is GONE:
# upstream restructured the inactivity poll onto its own daemon thread
# (`_inactivity_watchdog_loop`) and now guarantees the None case structurally
# rather than needing a guarded comparison — `_watch_inactivity` returns
# immediately when `_cron_inactivity_limit is None`, and the watchdog thread
# is only started when it is not None. The old regexp does not match this
# shape, so the patch was a no-op; the assertion is retargeted at upstream's
# own guard clause so a regression still fails the converge loudly.

- name: Raise the aggregate cron timeout before the inactivity handler
  # Re-anchored: same 8 -> 4 space re-indent as the earlier tasks in this
  # file; the trailing `if _inactivity_timeout is True:` line the block ends
  # on re-creates the matched guard at the new indent level so the
  # already-existing _raise_inactivity_timeout(...) call beneath it (itself
  # untouched by this replace) stays correctly nested.
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: '^    if _inactivity_timeout:$'
    replace: "{{ _hermes_cron_hard_timeout_block | indent(4, true) }}"
  vars:
    # RULE FOR THE NEXT PATCH THAT RAISES SOMETHING NEW: extend
    # _summarize_cron_failure_for_delivery in the SAME change. That classifier
    # matches on substrings, so an error type upstream has never seen does not
    # go unclassified — it silently inherits whichever existing branch its
    # prose happens to match. The TimeoutError below went unclassified for
    # exactly that reason and was delivered for months as a provider timeout
    # with an exhausted fallback chain, sending every reader to the wrong
    # subsystem. A wrong answer that reads as a confident right one.
    _hermes_cron_hard_timeout_block: |-
      if _hard_timeout:
          elapsed = time.monotonic() - _cron_started_monotonic
          logger.error(
              "Job '%s' exceeded aggregate wall clock %.0fs (limit %.0fs)",
              job_name, elapsed, _cron_wall_timeout_limit,
          )
          request_hard_interrupt(agent, "Cron job exceeded hard wall clock")
          # Evidence, not just the verdict: how many model calls the run
          # made, what it was doing when killed, and the session that holds
          # the transcript (the failure artifact keeps no response).
          try:
              _act = agent.get_activity_summary() or {}
          except Exception:
              _act = {}
          _calls = int(_act.get("api_call_count", 0) or 0)
          _since = _act.get("seconds_since_activity")
          _idle = f"{int(_since)}s" if _since is not None else "unknown"
          _doing = str(_act.get("last_activity_desc") or "")[:120]
          raise TimeoutError(
              f"Cron job '{job_name}' exceeded aggregate wall clock "
              f"{int(elapsed)}s (limit {int(_cron_wall_timeout_limit)}s) "
              f"after {_calls} API call(s); last activity {_idle} before the kill"
              f"{': ' + _doing if _doing else ''}; session {cron_session_id}"
          )

      if _inactivity_timeout is True:
  notify: Restart hermes-gateway

# The block above invents an error type upstream has never seen, so upstream's
# delivery classifier cannot recognise it: `_summarize_cron_failure_for_delivery`
# matches on substrings, our TimeoutError says "exceeded aggregate wall clock",
# and nothing in it matches the wall-clock case — so it fell through to the
# provider branches and told the operator a provider timed out and a fallback
# chain was exhausted. No provider was slow and no fallback was attempted: the
# job hit OUR ceiling and we killed it. That sends the reader to the wrong
# subsystem, which upstream's own comment here calls worse than saying nothing.
#
# Anchored on the script-timeout branch and inserted ABOVE it, so this runs
# before any provider matching, exactly as that branch does for the same reason.
- name: Classify local stops and fallback exhaustion in delivered failures
  vars:
    _hermes_cron_wall_clock_classifier: |-
      if "exceeded aggregate wall clock" in lower:
          return (
              f"⚠️ Cron '{job_name}' failed: exceeded its aggregate wall-clock "
              "limit and was stopped. The provider was not at fault and no "
              "fallback was attempted. Full details saved in cron output."
          )

      _fallback_cause = re.search(r"Error doing the fallback:(.+)", text)
      if _fallback_cause:
          return (
              f"⚠️ Cron '{job_name}' failed: every fallback rung refused the "
              f"request. Cause: {_fallback_cause.group(1).strip()}"
          )

      if lower.startswith("script timed out"):
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: '^    if lower\.startswith\("script timed out"\):$'
    replace: "{{ _hermes_cron_wall_clock_classifier | indent(4, true) }}"
  notify: Restart hermes-gateway

# Upstream's advice is correct for a stock deployment and wrong for this one:
# it reads the agent's own config, finds no fallback chain, and tells the
# operator to add one. Our fallbacks live in the router in front of the agent,
# so the agent cannot see them and never will — following this advice would add
# a second, competing chain. Only the no-chain branch is rewritten; when a chain
# IS configured upstream's "exhausted or unavailable" is still exactly right.
- name: Correct the fallback-chain advice for router-fronted deployments
  vars:
    _hermes_cron_fallback_advice: |-
      return (
          "Fallbacks are handled by the router in front of this agent, not in "
          "its own config — check the router's health before adding one here."
      )
  # Re-anchored: upstream reflowed the string from three lines to two
  # ("or set a cron fleet default ..." and "in config.yaml." merged); no
  # wording change, so the replacement text is unchanged.
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: |-
      ^    return \(
              "No fallback chain configured — add one with `hermes fallback add`, "
              "or set a cron fleet default via `cron\.model` \+ `cron\.model_provider` in config\.yaml\."
          \)$
    replace: "{{ _hermes_cron_fallback_advice | indent(4, true) }}"
  notify: Restart hermes-gateway

# The nudge's diagnosis is useful ("failed N runs in a row"); its remedy is
# not. Pausing is offered first-class alongside fixing, and a paused job is
# invisible — no failures, no alerts, nothing to notice — so the cheapest
# response to a noisy job is the one that hides it permanently. Keep the
# streak, drop the pause instruction. `cron.failure_nudge_threshold: 0` would
# have removed the streak signal too, which is the half worth keeping.
- name: Drop the pause suggestion from the repeated-failure nudge
  vars:
    _hermes_cron_nudge_remedy: |-
      "Fix its prompt or config. Pausing hides the failures without fixing "
      "them, so prefer a fix or a deliberate removal."
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/cron/scheduler.py"
    regexp: |-
      ^        f"Fix its prompt/config, or pause it with `hermes cron pause \{job_ref\}` "
              "\(resume/remove also available\) to stop the noise\."$
    replace: "{{ _hermes_cron_nudge_remedy | indent(8, true) }}"
  notify: Restart hermes-gateway
