---
# Upstream's timeout reaper (enforce_max_runtime) and the stale-reclaim path
# (_terminate_reclaimed_worker) both terminate a host-local worker. Upstream
# (v0.22.5) verifies identity with a spawn-time process fingerprint
# (_pid_recycled): a recycled PID is never signalled, and an unverified spawn is
# never signalled by bare number. This role no longer adds its own `ps`-based
# identity check on top of that; the check it used to inject matched only a
# command line containing "chat", which upstream's worker no longer has
# (`-m hermes_cli.kanban_worker_client`), so it would have refused every worker.
#
# Workers are spawned with start_new_session=True, making each worker the leader
# of its own process group, but the reapers signal only the recorded PID, not
# that group. A worker that itself forked a child (MCP server, tool subprocess)
# leaves that child orphaned and running after the top-level PID is gone. The
# group-signal patches below reap that child too.

# A legacy row has no spawn fingerprint, so upstream can never prove its PID is
# still the worker and treats it as never recycled. Signal such a PID only when
# its live command line names the kanban worker client; otherwise skip it and
# log once. Rows with a fingerprint keep upstream's recycled-PID refusal.
- name: Patch Hermes worker-reap legacy-row identity guard before signaling
  ansible.builtin.blockinfile:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/kanban_db_dispatch.py"
    marker: "# {mark} ANSIBLE MANAGED BLOCK worker reap legacy identity guard"
    insertbefore: '^def enforce_max_runtime\('
    block: |
      def _legacy_worker_may_be_signalled(pid, started_at) -> bool:
          """True when a row's PID may be signalled: a fingerprinted row (upstream's
          _pid_recycled decides), or a legacy row whose live command line names the
          kanban worker client. Anything else is skipped and logged once."""
          if started_at is not None:
              return True
          try:
              with open(f"/proc/{int(pid)}/cmdline", "rb") as handle:
                  cmdline = handle.read().decode("utf-8", "replace")
          except OSError:
              cmdline = ""
          if "kanban_worker_client" in cmdline:
              return True
          _kb._log.info(
              "kanban: worker pid %s has no spawn fingerprint and is not a kanban worker; not signalled",
              pid,
          )
          return False
  notify: Restart hermes-gateway

# Never signal PID 0/negative/1 (init) or this gateway process itself
# (dispatch_in_gateway: true runs enforce_max_runtime inside the gateway process,
# so os.getpid() at this call site can be the gateway's own PID).
- name: Patch Hermes worker-reap timeout path to skip init and self PIDs before signaling
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/kanban_db_dispatch.py"
    regexp: >-
      ^([ \t]*)if kill is not None and not \(_kb\._pid_alive\(pid\) and
      _pid_recycled\(pid, started_at\)\):$
    replace: |-
      \1if (
      \1    kill is not None and pid > 1 and pid != os.getpid()
      \1    and not (_kb._pid_alive(pid) and _pid_recycled(pid, started_at))
      \1    and _legacy_worker_may_be_signalled(pid, started_at)
      \1):
  notify: Restart hermes-gateway

# Signal the worker's process group (negative pid), not just the recorded
# PID, so a child process the worker itself spawned is reaped too.
- name: Patch Hermes worker-reap timeout path to signal the worker's process group
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/kanban_db_dispatch.py"
    regexp: '^([ \t]*)kill\(pid, signal\.SIGTERM\)$'
    replace: '\1kill(-pid, signal.SIGTERM)'
  notify: Restart hermes-gateway

# Upstream centralized BOTH escalation call sites (timeout path and
# stale-reclaim path) onto one shared helper, _sigkill(kill, pid)
# (hermes_cli/kanban_db_dispatch.py). Negative pid inside the helper covers both
# call sites at once, closing the same process-group gap for both the timeout
# reaper and the stale-reclaim path in one patch.
- name: Patch Hermes worker-reap SIGKILL escalation to signal the worker's process group
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/kanban_db_dispatch.py"
    regexp: '^([ \t]*)kill\(int\(pid\), getattr\(signal, "SIGKILL", signal\.SIGTERM\)\)$'
    replace: '\1kill(-int(pid), getattr(signal, "SIGKILL", signal.SIGTERM))'
  notify: Restart hermes-gateway

# Never signal PID 0/negative/1 (init) or this gateway process itself. The
# recycled-PID refusal is upstream's (the fingerprint check in
# _terminate_reclaimed_worker); this adds the init and self cases it does not
# cover.
- name: Patch Hermes stale-reclaim worker termination to skip init and self PIDs before signaling
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/kanban_db_dispatch.py"
    regexp: '^([ \t]*)if not pid or pid <= 0 or not claim_lock:$'
    replace: |-
      \1if (
      \1    not pid or pid <= 1 or pid == os.getpid() or not claim_lock
      \1    or not _legacy_worker_may_be_signalled(pid, started_at)
      \1):
  notify: Restart hermes-gateway

# Signal the worker's process group (negative pid), not just the recorded
# PID, so a child process the worker itself spawned is reaped too. Same
# start_new_session=True reasoning as the timeout-path patches above.
- name: Patch Hermes stale-reclaim worker termination to signal the worker's process group
  ansible.builtin.replace:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/kanban_db_dispatch.py"
    regexp: '^([ \t]*)kill\(int\(pid\), signal\.SIGTERM\)$'
    replace: '\1kill(-int(pid), signal.SIGTERM)'
  notify: Restart hermes-gateway

# The stale-reclaim escalation patch that used to sit here is GONE: upstream
# restructured both reapers' SIGKILL escalation onto one shared helper,
# `_sigkill(kill, pid)` (hermes_cli/kanban_db_dispatch.py), so the timeout-path
# escalation patch above and this one now target the same function. Folded
# into a single rewrite of that helper (tracked separately) rather than kept
# as two patches that would both try to edit it.
