---
# Layer 1 — render-time contract assertions for the Hermes Agent brain wiring.
#
# Every production break on 2026-07-08 was a config-level mistake that was
# machine-detectable BEFORE the converge reached the running daemon. These
# asserts encode those invariants and fail the play at the top of the role,
# before any config is deployed — so a known-bad config never converges.
#
# Imported (not included) at the very top of tasks/main.yml so the checks inherit
# the play's `hermes_agent` tag and ALWAYS run with the role they guard, even
# under `--tags hermes_agent`. Read-only; safe in check mode. The two files
# below are imported, not included, for the same reason: import_tasks resolves
# statically and inherits this file's own tag/check-mode contract instead of
# gating on a separate include condition.

- name: Gather mount facts for the roster agent home assertion
  ansible.builtin.setup:
    gather_subset:
      - mounts
  when:
    - hermes_agent_id in (ai_agents | default({}))
    - ansible_mounts is not defined
  changed_when: false

- name: Assert the roster agent home is a dedicated mount point
  ansible.builtin.assert:
    that:
      - >-
        (ansible_mounts | default([])
         | selectattr('mount', 'equalto', hermes_agent_home)
         | list | length) > 0
    fail_msg: >-
      Roster agent home {{ hermes_agent_home }} must be a dedicated mount point.
  when: hermes_agent_id in (ai_agents | default({}))

- name: Resolve and require the managed Slack credential pair
  ansible.builtin.import_tasks: slack_credentials.yml

- name: Assert the inbound A2A listener has a bearer token when enabled
  ansible.builtin.import_tasks: assert_a2a.yml

- name: Assert brain-wiring, goal-mode, and Vikunja bridge contracts
  ansible.builtin.import_tasks: assert_brain_and_bridge.yml

- name: Assert curriculum, tool-policy, and controller-build contracts
  ansible.builtin.import_tasks: assert_curriculum_and_policy.yml

- name: Assert the Codex escalation MCP tool's wiring resolved
  ansible.builtin.import_tasks: assert_codex_escalation_wiring.yml
