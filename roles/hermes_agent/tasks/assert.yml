---
# Layer 1 — render-time contract assertions for the Hermes Agent brain wiring.
#
# Every production break on 2026-07-08 was a config-level mistake that was
# machine-detectable BEFORE the converge reached the running daemon. These
# asserts encode those invariants and fail the play at the top of the role,
# before any config is deployed — so a known-bad config never converges.
#
# Imported (not included) at the very top of tasks/main.yml so the checks inherit
# the play's `hermes_agent` tag and ALWAYS run with the role they guard, even
# under `--tags hermes_agent`. Read-only; safe in check mode.

- name: Assert Hermes Agent brain-wiring contracts hold before converging
  ansible.builtin.assert:
    quiet: true
    that:
      # (1) Hermes Agent HARD context floor. The agent refuses to start against
      #     any model declaring under 64,000 tokens ("below the minimum 64,000
      #     required"); at 60,000 every seeded cron failed on 2026-07-08.
      #     context_length is declared explicitly in config.yaml.j2 because
      #     custom/vLLM providers carry no context catalog Hermes can probe.
      - hermes_agent_model_context_length | int >= 64000
      # (3) Client-is-decider timeout chain. The Hermes stream read timeout must
      #     sit BELOW the router's per-attempt timeout so the CLIENT gives up
      #     first (by design) while the router keeps waiting on a healthy
      #     generation. Both values are the single-source constants in all.yml;
      #     the outermost link (nix-darwin MLX model server guard, 3600s) lives
      #     out of this repo's reach and is not assertable here.
      - hermes_agent_stream_read_timeout | int < ai_router_request_timeout_seconds | int
      # (4) Job-API concurrency cap must be a real cap. Upstream treats 0 as
      #     "cap disabled" — on a single shared serving deployment that means
      #     an unbounded request flood lands directly on the brain, which is
      #     exactly what the cap exists to prevent. Negative values clamp to
      #     0 upstream, so they are equally forbidden.
      - hermes_agent_api_max_concurrent_runs | int >= 1
    fail_msg: >-
      Hermes Agent brain-wiring contract violated (roles/hermes_agent/tasks/assert.yml).
      (1) model.context_length is {{ hermes_agent_model_context_length }}; it must be
      >= 64000 — the Hermes Agent hard floor that rejected 60000 at startup and
      failed every seeded cron on 2026-07-08 (raise hermes_agent_model_context_length).
      (3) stream read timeout is {{ hermes_agent_stream_read_timeout }} and the router
      per-attempt timeout is {{ ai_router_request_timeout_seconds }}; read must be < router
      so the client decides (chain: hermes read < router attempt < nix-darwin server
      guard 3600). Fix the offending value in all.yml / roles/hermes_agent/defaults.
      (4) hermes_agent_api_max_concurrent_runs is
      {{ hermes_agent_api_max_concurrent_runs }}; it must be >= 1 — 0 disables the
      upstream cap entirely and exposes the single shared brain to request floods.
    success_msg: >-
      Hermes Agent brain-wiring contracts hold (context_length
      {{ hermes_agent_model_context_length }} >= 64000; read
      {{ hermes_agent_stream_read_timeout }} < router {{ ai_router_request_timeout_seconds }};
      api cap {{ hermes_agent_api_max_concurrent_runs }} >= 1).

- name: Assert Hermes recurring goal-mode settings are valid
  ansible.builtin.assert:
    quiet: true
    that:
      - not (hermes_agent_kanban_goal_mode | bool) or hermes_agent_kanban_goal_max_turns | int >= 1
      - >-
        not (hermes_agent_kanban_goal_mode | bool)
        or hermes_agent_kanban_goal_judge_model | trim | length > 0
      - >-
        not (hermes_agent_kanban_goal_mode | bool)
        or hermes_agent_kanban_goal_judge_timeout_seconds | int >= 30
    fail_msg: >-
      Goal mode requires a positive hermes_agent_kanban_goal_max_turns and a
      non-empty hermes_agent_kanban_goal_judge_model, and a judge timeout of
      at least 30 seconds.

# Upstream's dispatcher buckets a card whose assignee names no real profile
# as skipped_nonspawnable and NEVER spawns it — a typo'd assignee silently
# sits ready forever with no error anywhere. Converting that into a loud
# converge failure is the whole point of this assert (see hermes_agent_profiles
# in defaults/main.yml for the profile concept).
- name: Assert every Kanban card assignee names a real profile or the default
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        hermes_agent_kanban_cards
        | rejectattr('assignee', 'equalto', '')
        | map(attribute='assignee')
        | reject('in', hermes_agent_profiles | map(attribute='name') | list)
        | list | length == 0
    fail_msg: >-
      One or more hermes_agent_kanban_cards entries name an assignee that is
      not in hermes_agent_profiles. Upstream buckets an unresolvable assignee
      as skipped_nonspawnable and never spawns a worker for it — the card
      would silently sit ready forever. Fix the card's assignee (empty string
      for the default profile) or add the profile to hermes_agent_profiles.
      Cards seen:
      {{ hermes_agent_kanban_cards | map(attribute='job') | list }};
      known profiles: {{ hermes_agent_profiles | map(attribute='name') | list }}.
    success_msg: >-
      Every Kanban card assignee resolves to the default profile or a name in
      hermes_agent_profiles ({{ hermes_agent_profiles | map(attribute='name') | list }}).

# A direct-cron retirement that names a replacement card is a promise: the
# topic stays covered, just through the card instead of the cron. Nothing
# enforced that promise at converge time before this — only
# tests/hermes_agent/test_retired_direct_crons.py checked it, against the raw
# YAML, and only if someone remembered to run pytest. Caught for real:
# `homelab-ai-fabric-status` sat on hermes_agent_kanban_paused_jobs for a
# stretch while its `-v2` cron was being retired in its favour — a paused
# card's enqueuer renders no selector arm
# (kanban-enqueue-recurring.sh.j2), so its still-active `-v2` cron's
# replacement created nothing either, and the topic silently went to zero
# coverage. This is the same invariant, enforced every converge.
- name: Assert every direct-cron retirement's replacement card is enabled and unpaused
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        hermes_agent_direct_cron_jobs
        | selectattr('replaced_by_card', 'defined')
        | selectattr('enabled') | list | length == 0
      - >-
        hermes_agent_direct_cron_jobs
        | selectattr('replaced_by_card', 'defined')
        | rejectattr('replaced_by_card', 'in',
            hermes_agent_kanban_cards | map(attribute='job') | list
            | reject('in', hermes_agent_kanban_paused_jobs) | list)
        | list | length == 0
    fail_msg: >-
      A hermes_agent_direct_cron_jobs retirement is broken. Either it names a
      replaced_by_card while still enabled:true (both paths would post — pick
      one), or its replaced_by_card is not the `job` of a currently-enabled,
      unpaused hermes_agent_kanban_cards entry (a paused card's enqueuer
      renders no selector arm, so nothing creates it — the topic goes
      unreported by both the retired cron and its replacement). Fix the
      card name, unpause it, or set the cron back to enabled:true, in the
      same change. Retirements still enabled:
      {{ hermes_agent_direct_cron_jobs | selectattr('replaced_by_card', 'defined')
         | selectattr('enabled') | map(attribute='name') | list }}.
      Retirements with a dead replacement:
      {{ hermes_agent_direct_cron_jobs | selectattr('replaced_by_card', 'defined')
         | rejectattr('replaced_by_card', 'in',
             hermes_agent_kanban_cards | map(attribute='job') | list
             | reject('in', hermes_agent_kanban_paused_jobs) | list)
         | map(attribute='name') | list }}.
    success_msg: >-
      Every direct-cron retirement names an enabled, unpaused replacement
      card and is itself disabled.

# A profile can carry the Splunk skill while declaring no splunk MCP server,
# and nothing notices. The skill loads, the agent believes it can query Splunk,
# and every SPL call fails at RUNTIME inside a job — visible only as a card
# that produces nothing useful, on the profile that exists precisely to query
# Splunk. tests/hermes_agent/test_profile_contract.py already proves the
# rendered mcp_servers matches the declared `mcp` list, but that is a pytest
# check of SELF-consistency: it never runs during a converge, and it stays
# green for a profile whose `mcp` legitimately dropped `splunk` while the
# skill stayed. This asserts the cross-field invariant instead.
#
# `map(attribute='mcp', default=[])` is deliberate — a profile with the skill
# and NO `mcp` key at all is a violation, not an exemption, and plain
# rejectattr('mcp', ...) would raise on it rather than report it.
# selectattr('skills', 'defined') keeps profiles that declare no skills (a
# legitimate shape) out of the check instead of erroring on them.
- name: Assert every profile carrying the Splunk skill also declares the splunk MCP server
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        hermes_agent_profiles
        | selectattr('skills', 'defined')
        | selectattr('skills', 'contains', 'dryvist/splunk-monitor')
        | map(attribute='mcp', default=[])
        | reject('contains', 'splunk')
        | list | length == 0
    fail_msg: >-
      A profile lists the dryvist/splunk-monitor skill but does not declare
      'splunk' in its mcp list, so its rendered config.yaml will carry the
      skill with no Splunk MCP server behind it and every SPL call will fail
      at runtime. Offending profiles:
      {{ hermes_agent_profiles | selectattr('skills', 'defined')
         | selectattr('skills', 'contains', 'dryvist/splunk-monitor')
         | rejectattr('mcp', 'defined') | map(attribute='name') | list
       + (hermes_agent_profiles | selectattr('skills', 'defined')
         | selectattr('skills', 'contains', 'dryvist/splunk-monitor')
         | selectattr('mcp', 'defined') | rejectattr('mcp', 'contains', 'splunk')
         | map(attribute='name') | list) }}.
    success_msg: >-
      Every profile carrying dryvist/splunk-monitor also declares the splunk
      MCP server.

# Same failure mode as the card assert above, reached by the other door: the
# Vikunja bridge creates cards at RUNTIME, so a typo'd assignee there produces
# skipped_nonspawnable cards for every task the operator files — and the only
# symptom is their board never moving. Caught at converge instead.
- name: Assert the Vikunja bridge card assignee names a real profile or the default
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        hermes_agent_vikunja_bridge_card_assignee | length == 0
        or hermes_agent_vikunja_bridge_card_assignee
           in (hermes_agent_profiles | map(attribute='name') | list)
    fail_msg: >-
      hermes_agent_vikunja_bridge_card_assignee is
      {{ hermes_agent_vikunja_bridge_card_assignee | to_json }}, which is not in
      hermes_agent_profiles. Every card the bridge creates would be bucketed
      skipped_nonspawnable and never run, so the operator's tasks would sit in
      the in-progress column forever with no error. Use an empty string for the
      default profile, or a name in
      {{ hermes_agent_profiles | map(attribute='name') | list }}.
    success_msg: >-
      The Vikunja bridge card assignee resolves to the default profile or a
      known profile.

# A bridge switched on with no credential is a daemon that can only log
# "bridge idle" forever. Fail the converge instead of shipping a no-op service.
- name: Assert the Vikunja bridge has a write token when it is enabled
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_agent_vikunja_bridge_token | length > 0
    fail_msg: >-
      hermes_agent_vikunja_bridge_enabled is true but no Vikunja write token is
      set. Supply HERMES_VIKUNJA_API_TOKEN in the converge environment (Doppler,
      SOPS or OpenBao — the role does not care which). The token must be
      WRITE-scoped on the bridge's project: it moves tasks between buckets,
      which needs the projects/views_buckets_tasks permission, not just task
      read/write. Note this is a SEPARATE credential from ai_runner's
      VIKUNJA_API_TOKEN, deliberately — different guest, different scope.
    success_msg: The Vikunja bridge has a write token.
  when: hermes_agent_vikunja_bridge_enabled | bool

# Curriculum manifest contracts. The manifest is the machine-readable side of
# the graded curriculum; these checks guarantee every job the queue would
# execute has a prompt file that exists, a unique id, and at least one
# machine-checkable success gate — so a manifest edit can never silently ship
# an unexecutable or ungradeable job.
- name: Load the curriculum manifest for contract checks
  ansible.builtin.set_fact:
    hermes_agent_curriculum: >-
      {{ lookup('ansible.builtin.file', role_path ~ '/files/curriculum/curriculum.yml')
         | from_yaml }}

- name: Assert every curriculum job is executable and machine-checkable
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_agent_curriculum.jobs | length > 0
      # Unique ids — duplicate ids would make run results ungradeable.
      - >-
        hermes_agent_curriculum.jobs | map(attribute='id') | list | unique | length
        == hermes_agent_curriculum.jobs | length
      # Every job names the guest-relative prompt file materialized from the catalog.
      - >-
        hermes_agent_curriculum.jobs
        | selectattr('prompt_file', 'undefined') | list | length == 0
      # Every job has at least one machine-checkable success gate.
      - >-
        hermes_agent_curriculum.jobs
        | selectattr('success_checks', 'undefined') | list | length == 0
      - >-
        hermes_agent_curriculum.jobs
        | map(attribute='success_checks', default=[])
        | map('length') | min > 0
    fail_msg: >-
      Curriculum manifest contract violated
      (roles/hermes_agent/files/curriculum/curriculum.yml): every job needs a
      unique id, a prompt_file, and a non-empty success_checks list. Jobs seen:
      {{ hermes_agent_curriculum.jobs | map(attribute='id') | list }}.
    success_msg: >-
      Curriculum manifest contracts hold
      ({{ hermes_agent_curriculum.jobs | length }} jobs, all with prompt files
      and machine-checkable success gates).

# H-17 tool-policy contracts. Negative regression checks: these confirm the
# safety net actually excludes what it exists to exclude, so a future edit
# that quietly re-adds a persistence or injection surface fails the play
# before the config deploys.
- name: Assert the runner-enforced tool policy excludes what it must exclude
  ansible.builtin.assert:
    quiet: true
    that:
      # Every platform allowlist must be a real (non-empty) list — an empty
      # allowlist silently falls back to upstream's platform default, which
      # is the opposite of a policy.
      - hermes_agent_api_server_toolsets | length > 0
      - hermes_agent_cron_toolsets | length > 0
      - hermes_agent_slack_toolsets | length > 0
      # An API-submitted (untrusted-input) run must never be able to schedule
      # persistent jobs, drive a browser, delegate sub-agents, or block on a
      # clarifying question. Cron gets the same envelope. Slack (interactive,
      # allowed-users-gated) is intentionally allowed `clarify` — the
      # headless rationale doesn't apply — but still excluded from the other
      # three: their risk is the capability itself, not the trust level of
      # whoever triggered it.
      - >-
        ['cronjob', 'browser', 'delegation', 'clarify']
        | intersect(hermes_agent_api_server_toolsets) | length == 0
      - >-
        ['cronjob', 'browser', 'delegation', 'clarify']
        | intersect(hermes_agent_cron_toolsets) | length == 0
      - >-
        ['cronjob', 'browser', 'delegation']
        | intersect(hermes_agent_slack_toolsets) | length == 0
      # A toolset cannot be both globally denied and platform-allowlisted:
      # upstream resolves that contradiction by silently dropping the tool,
      # which reads as a mysterious "Unknown tool" at run time. Catch it here.
      - >-
        hermes_agent_disabled_toolsets
        | intersect(hermes_agent_api_server_toolsets) | length == 0
      - >-
        hermes_agent_disabled_toolsets
        | intersect(hermes_agent_cron_toolsets) | length == 0
      - >-
        hermes_agent_disabled_toolsets
        | intersect(hermes_agent_slack_toolsets) | length == 0
    fail_msg: >-
      Hermes tool-policy contract violated (roles/hermes_agent/tasks/assert.yml).
      The api_server/cron/slack allowlists must be non-empty; api_server and
      cron must not contain any of cronjob/browser/delegation/clarify; slack
      must not contain any of cronjob/browser/delegation; and none may
      overlap hermes_agent_disabled_toolsets (api_server:
      {{ hermes_agent_api_server_toolsets }}; cron: {{ hermes_agent_cron_toolsets }};
      slack: {{ hermes_agent_slack_toolsets }};
      denied: {{ hermes_agent_disabled_toolsets }}). Fix the lists in
      roles/hermes_agent/defaults/main.yml.
    success_msg: >-
      Hermes tool-policy contracts hold ({{ hermes_agent_api_server_toolsets | length }}
      api_server toolsets, {{ hermes_agent_cron_toolsets | length }} cron toolsets,
      {{ hermes_agent_slack_toolsets | length }} slack toolsets,
      {{ hermes_agent_disabled_toolsets | length }} globally denied).

# The dryvist skills + SOUL.md come from the pinned nix-hermes bundle, built
# on the CONTROLLER during converge — fail here, before any config deploys,
# when the controller has no nix. (Read-only; safe in check mode.)
- name: Assert the controller has nix for the content-bundle build
  ansible.builtin.command:
    cmd: nix --version
  delegate_to: localhost
  # become must be disabled via the VARIABLE, not just the keyword: group_vars
  # sets the connection var ansible_become: true, and connection vars outrank
  # task keywords — with only the keyword this task sudo-prompts on the
  # controller and kills the converge.
  become: false
  vars:
    ansible_become: false
  run_once: true
  changed_when: false

# Reports which path ai_llm_concurrency resolved through. This is deliberately
# a notice and not a failure: the published artifact legitimately lags a
# constants.tf change until the next apply republishes it, and failing here
# would recreate the very converge outage the fallback exists to prevent. It
# exists so the migration shim in group_vars/all.yml cannot become permanent
# by being invisible — once this stops reporting the fallback, delete the
# shim, this task, and ai_llm_concurrency_from_fallback together.
- name: Report whether serving concurrency came from the published constant
  ansible.builtin.debug:
    msg: >-
      {{
        'ai_llm_concurrency=' ~ (ai_llm_concurrency | int) ~ ' resolved from the ROLLOUT FALLBACK — '
        ~ 'the published inventory artifact has no constants.serving key yet. '
        ~ 'Run an apply to republish it, then remove the fallback in '
        ~ 'inventory/group_vars/all.yml and this task.'
        if (ai_llm_concurrency_from_fallback | bool)
        else 'ai_llm_concurrency=' ~ (ai_llm_concurrency | int)
             ~ ' resolved from the published constant; the rollout fallback is now dead code and should be deleted.'
      }}
  run_once: true
