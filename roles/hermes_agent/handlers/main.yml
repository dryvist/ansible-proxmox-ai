---
# NOT ansible.builtin.systemd state=restarted: the gateway ticks the default
# cron store in-process, so an unconditional restart terminates whatever cron
# jobs are mid-run. The wrapper pauses every cron store, waits for in-flight
# runs to drain (bounded — see defaults/main/31-cron-drain.yml), restarts, and
# releases only the pauses it took. Quiesce and un-quiesce are inside that one
# process so an abort cannot strand the fleet paused, and a play that fails
# before its handler flush never quiesces anything in the first place.
- name: Restart hermes-gateway
  ansible.builtin.command: "{{ hermes_agent_cron_drain_restart_script }}"
  changed_when: true
  register: hermes_agent_drain_restart

# ansible.builtin.command captures stdout instead of printing it, so at default
# verbosity the wrapper's per-store pause decisions, its drain wait and its
# release count were written and then thrown away — the converge showed only
# "changed". A guard whose decisions nobody can see is the failure mode this
# whole change exists to prevent, so echo them. `listen` rather than a second
# notify: the topic fires from the same notifications the restart already
# carries, so no caller has to know this exists.
- name: Report the drain-before-restart decisions
  listen: Restart hermes-gateway
  ansible.builtin.debug:
    var: hermes_agent_drain_restart.stdout_lines
  when: hermes_agent_drain_restart.stdout_lines | default([]) | length > 0

- name: Restart hermes-dashboard
  ansible.builtin.systemd:
    name: hermes-dashboard
    state: restarted
    daemon_reload: true

- name: Restart hermes-webui
  ansible.builtin.systemd:
    name: hermes-webui
    state: restarted
    daemon_reload: true

- name: Restart hermes-studio
  ansible.builtin.systemd:
    name: hermes-studio
    state: restarted
    daemon_reload: true

- name: Restart hermes-browser-use-chromium
  ansible.builtin.systemd:
    name: hermes-browser-use-chromium
    state: restarted
    daemon_reload: true

- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

# The bridge script and env file deploy regardless of the enable flag, and both
# notify this handler, but the unit itself deploys only when the flag is on — so
# on a disabled identity there is no unit to restart.
- name: Restart hermes-vikunja-bridge
  ansible.builtin.systemd:
    name: hermes-vikunja-bridge
    state: restarted
    daemon_reload: true
  when: hermes_agent_vikunja_bridge_enabled | bool

- name: Restart hermes-brain-watchdog timer
  ansible.builtin.systemd:
    name: hermes-brain-watchdog.timer
    state: restarted
    daemon_reload: true

- name: Restart hermes-brain-sync timer
  ansible.builtin.systemd:
    name: hermes-brain-sync.timer
    state: restarted
    daemon_reload: true

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
