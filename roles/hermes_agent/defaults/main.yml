# --- Enqueuer throughput throttle (2026-07-24, Zammad #17143) ------------------
# The single serving slot drains ~2-3 goal cards/hour; the full enqueuer fleet
# out-produced that and wedged the board overnight. Until serving throughput is
# proven higher, only the essential Splunk cards enqueue; the rest are paused
# here. A job on this list is treated as not-active: the enqueuer-cron reconcile
# SKIPS it (so a converge never re-creates or re-enables it — it leaves the
# operator's disabled state untouched, disable-don't-delete) and the shared
# enqueuer script does not render it (so the `all --backfill` safety net cannot
# re-enqueue it either). Lift the throttle by REMOVING a job from this list (and
# re-enabling the safety net) once capacity is confirmed — start with the least
# costly cards. Entries are the card `job` values (and the safety-net cron name)
# by their config-var refs so this list can never drift from the cards table.
# NOT listed (already off for other reasons, so listing them would mislead):
# bot-pr-triage (capability-gated off, no alerts token); anything whose `enabled`
# capability gate is already false. Active set kept on: splunk triage, the
# script-fed status digest (splunk-status-digest), and the ai-news scout
# (canary lift, see below); splunk-parsing (see below, 2026-08-01 swap); the
# LLM splunk-digest card is REMOVED, not paused — see the comment above
# hermes_agent_splunk_status_digest_cron_name.
hermes_agent_kanban_paused_jobs:
  # homelab-ai-fabric-status is deliberately NOT here any more: it is now the
  # replacement for the retired homelab-ai-fabric-status-v2 cron, so it has to
  # actually run. While it was listed, the enqueue script rendered no selector
  # arm for it and its still-active enqueuer cron created nothing.
  - "{{ hermes_agent_nightly_wiki_cron_name }}"
  - "{{ hermes_agent_summary_cron_name }}"
  - "{{ hermes_agent_zammad_review_cron_name }}"
  - "{{ hermes_agent_splunk_security_cron_name }}"
  # splunk-parsing is deliberately NOT here any more (2026-08-01 kanban audit,
  # Zammad-throttle-safe 1-for-1 swap): the direct cron it used to sit behind
  # in priority, splunk-parsing-quality-v2, is retired below — its fixed SPL
  # queried `index=network`, which the triage-digest comment above already
  # proved stale/near-empty, so it was silently omitting the real
  # network-shaped data that lives in `firewall`, every day, with no memory
  # dedup and no [SILENT] path (always posts). This card has the SAME daily
  # cadence (net zero enqueue-rate change), a correct query, memory-backed
  # delta discipline, and posts only when something is actually off — a pure
  # quality win, not a throttle lift.
  - "{{ hermes_agent_splunk_deepdive_cron_name }}"
  - "{{ hermes_agent_github_monitor_cron_name }}"
  - "{{ hermes_agent_docs_sync_cron_name }}"
  - "{{ hermes_agent_kanban_reviewer_job }}"
  - "{{ hermes_agent_anomaly_hunt_cron_name }}"
  - "{{ hermes_agent_docs_study_cron_name }}"
  # ai-news deliberately NOT here (team-lead decision 2026-07-31): the converge
  # assertion above the enqueuer reconcile enforces "web works" structurally —
  # a pause entry is a note, an ordered assertion is a control — and the card
  # reports to the noise channel, so a poor run cannot pollute the work
  # surface. Standing condition: this card is the FIRST thing re-paused if the
  # board wedges again; it is the throttle's canary lift (one 4h card).
  - "{{ hermes_agent_daily_innovation_cron_name }}"
  - "{{ hermes_agent_app_seeding_cron_name }}"
  - "{{ hermes_agent_kanban_safety_net_cron_name }}"
  # fleet-health was LIFTED 2026-08-02 — it was created paused on 2026-08-01
  # and named the recommended next lift; the preconditions it was waiting on
  # are now met and measured, so it is deliberately NOT listed here:
  #   - the brain is stable and fast (consecutive real completions through the
  #     production router alias returning in 0-1s, after the warmup contention
  #     that had been holding the single serving slot was resolved);
  #   - both watchdogs are live ON THE GUEST, not merely configured
  #     (hermes-brain-watchdog.timer and fabric-watchdog.timer each report
  #     enabled AND active), so a brain outage now pauses the fleet by itself.
  # It is the cheapest possible lift: WEEKLY rather than hourly, read-only over
  # `kanban runs`, and its prompt forbids it from proposing or attempting any
  # restart/reconfigure/converge of serving infrastructure. Its prompt also
  # already handles a thin fleet — it is told to say the history is too thin
  # rather than speculate — which is the correct behaviour while most cards
  # remain throttled.
  # RE-PAUSE ORDER if the board wedges: ai-news first (the canary, one 4h
  # card), then this one. Do not lift anything above it until this has run at
  # least twice without adding queue pressure.

# The daily chain-break safety net (#83): one extra `--no-agent --script` cron
# that runs the enqueuer in `all --backfill` mode — re-creates any missing
# current-slot card (idempotent) and unblocks any due-but-still-blocked card
# (the reviewer chain's self-heal). No LLM session, so nothing to poison.
hermes_agent_kanban_safety_net_cron_name: kanban-enqueue-safety-net
hermes_agent_kanban_safety_net_schedule: "33 4 * * *"
hermes_agent_kanban_safety_net_enabled: >-
  {{ hermes_agent_slack_bot_token | length > 0
     and hermes_agent_slack_app_token | length > 0 }}

# Every cron job this role seeds — now the script-only enqueuer fleet
# (`<job>-enqueue` per card) plus the daily safety net. The model-drift recovery
# task (tasks/main.yml) only ever removes jobs on this list, and the brain
# watchdog only pauses/resumes jobs on this list — user/agent jobs are never
# touched. Script (`--no-agent`) jobs carry no model snapshot, so the drift GC's
# `model_snapshot`-defined filter skips them naturally (no guard change needed).
hermes_agent_seeded_cron_names: >-
  {{ (hermes_agent_kanban_cards | map(attribute='job') | list
      | map('regex_replace', '$', '-enqueue') | list)
     + [hermes_agent_kanban_safety_net_cron_name,
        hermes_agent_splunk_status_digest_cron_name,
        hermes_agent_zammad_autoclose_cron_name] }}

# Everything a cluster window must silence, derived — never a second hand-kept
# list. The seeded fleet above is only the `<job>-enqueue` script crons plus
# three named ones; the `*-v2` agentic generation in
# hermes_agent_direct_cron_jobs is NOT in it. Those jobs run the brain and
# deliver straight to Slack, so during a cluster window (brain unloaded off the
# day-proxy) they fail and DM the operator — exactly what
# cluster-hermes-pause.yml exists to prevent, and exactly what it missed.
#
# Observed 2026-07-25: the pause playbook reported failed=0 with the watchdog
# inactive, and five brain-dependent jobs were still `[active]` afterwards
# (splunk-parsing-quality-v2, homelab-ai-fabric-status-v2,
# zammad-incident-review-v2, github-org-triage-v2, daily-operator-summary-v2).
# A green recap certified the pause by proxy: it proved the loop ran over its
# list, never that the list covered the fleet.
#
# Only `enabled` direct jobs are included: the disabled ones are already paused
# and never reconciled, so naming them would just add no-op `cron pause` calls.
hermes_agent_cluster_pause_cron_names: >-
  {{ hermes_agent_seeded_cron_names
     + (hermes_agent_direct_cron_jobs
        | selectattr('enabled', 'defined') | selectattr('enabled')
        | map(attribute='name') | list) }}

# The bare-named agentic crons that #83 replaced with `<job>-enqueue` script
# crons. A guest provisioned before the migration still carries these; the
# seeded/drift GC only matches the NEW `-enqueue` names, so without this
# explicit list the old crons linger and double-fire alongside their enqueuer
# twins (the role's stated "script-only" end state would be false on any
# pre-migration guest). Removed if-present, so it is a no-op on fresh installs
# and on every converge after the first post-migration one. The reviewer job
# `review` had no pre-migration cron, so it is a harmless no-op in this list.
hermes_agent_superseded_agentic_cron_names: >-
  {{ hermes_agent_kanban_cards | map(attribute='job') | list }}

# --- Context7 MCP client (current library/framework docs on demand) ---
# Registers Context7 so Hermes can pull up-to-date, version-specific docs
# mid-task. Bao-first, env fallback (see group_vars); the entry is omitted
# until the API key is set. Dialed through the shared agentgateway MCP plane
# (one governed front door per target; the gateway federates outbound HTTPS
# to Context7) — set the URL back to https://mcp.context7.com/mcp to bypass
# the gateway.
hermes_agent_context7_mcp_enabled: true
hermes_agent_context7_mcp_url: >-
  https://mcp.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN required (Doppler)') }}/context7
hermes_agent_context7_api_key: ""

# --- Qdrant MCP client (persistent vector memory) — REMOVED, see docs MCP ---
# Was `hermes_agent_qdrant_mcp_enabled`/`_url`, registering the generic
# qdrant-store/qdrant-find tools over the `agent_memories` collection. Deleted
# 2026-08: wired into both named profiles' mcp lists since their creation but
# never referenced by any prompt or skill in this repo OR nix-hermes (grepped
# both — zero hits on qdrant-store/qdrant-find/agent_memories outside the
# wiring itself). Hermes already has a real, structured memory system —
# `memory.provider: hindsight` below, shared across every profile — so this
# was a second, undifferentiated store with no guidance on which one to use
# for what: pure confusion risk, not a capability anyone exercised. Re-add it
# (same shape as the docs MCP client below) only alongside an actual skill or
# prompt that tells the agent when to reach for it over Hindsight.

# --- Docs MCP client (RAG search over the estate's homelab_docs index) ---
# Registers the search_docs tool, dialed through the shared agentgateway MCP
# plane (same posture as context7 above: keyless for the caller, the
# gateway's mcp-docs sidecar holds the router credential — see
# agentgateway_docker_docs_mcp_* in the agentgateway_docker role). Defaults ON:
# the gateway /docs route is enabled by default
# (agentgateway_docker_docs_mcp_enabled: true) and the homelab_docs Qdrant
# collection it searches is rebuilt nightly by the llamaindex role
# (llamaindex_index_on_calendar) — this is the estate's only document-
# retrieval index, so leaving it unwired here made it invisible to Hermes.
hermes_agent_docs_mcp_enabled: true
hermes_agent_docs_mcp_url: >-
  https://mcp.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN required (Doppler)') }}/docs

# --- Vikunja MCP client (read-only task board) ---
# Thin pointer to the shared agentgateway /vikunja route — the gateway sidecar
# holds the read token, so this is keyless (same posture as docs/context7).
# DISABLED by default: unlike splunk/docs (whose gateway routes always exist),
# the /vikunja route itself is omitted until the operator seeds the read token
# on the gateway. With this enabled but the route absent, Hermes retries and
# parks on "MCP server 'vikunja' failed initial connection" EVERY session (log
# noise, observed in soak). Flip to true in the same change that seeds the token
# and converges agentgateway so the route is live — same as nautobot below.
hermes_agent_vikunja_mcp_enabled: false
hermes_agent_vikunja_mcp_url: >-
  https://mcp.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN required (Doppler)') }}/vikunja

# --- Vikunja Kanban bridge (operator board -> Hermes board) -------------------
# A poll daemon that makes the operator's Vikunja board drive Hermes: a task in
# the READY bucket becomes a Hermes Kanban card, the task moves across the
# operator's buckets as the card starts and finishes, and the card's recorded
# result is commented back onto the task. Recurring work still comes from the
# enqueuer fleet (#83); this is the on-demand, operator-authored half.
#
# WHY THIS DOES NOT USE THE VIKUNJA MCP ROUTE ABOVE. Every write here — bucket
# move, comment, done — needs a WRITE credential, and the gateway's /vikunja
# route is read-only by construction (the sidecar holds a READ token). Enabling
# hermes_agent_vikunja_mcp_enabled would therefore buy the bridge nothing while
# adding the documented per-session "failed initial connection" park, since the
# route is still not seeded. The bridge talks plain REST with its own token and
# the MCP flag stays false. Flip that flag when the agent should READ the board
# conversationally — a separate decision from this bridge.
#
# SINGLE WRITER. The bridge is the only thing that writes to the operator's
# board: the card body explicitly forbids the worker from touching Vikunja
# itself, so a card's result reaches the operator by exactly one path and two
# surfaces can never disagree.
#
# Disabled by default: it needs an operator-seeded write token AND a Vikunja
# project whose bucket names match the four below. Empty token = inert.
hermes_agent_vikunja_bridge_enabled: false
hermes_agent_vikunja_bridge_service: hermes-vikunja-bridge
hermes_agent_vikunja_bridge_script_name: vikunja-bridge.py
hermes_agent_vikunja_bridge_state_name: vikunja-bridge.json
hermes_agent_vikunja_bridge_env_file: "{{ hermes_agent_hermes_home }}/vikunja-bridge.env"
# FQDN-first Traefik vhost, no port — the address belongs to DNS.
hermes_agent_vikunja_bridge_url: >-
  https://vikunja.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN required (Doppler)') }}
hermes_agent_vikunja_bridge_project: "Hermes"
# Bucket titles on that project's Kanban view. READY is the only REQUIRED one —
# it is where the operator puts work and where intake reads from. The other
# three are optional: a board missing one still gets its result comment, which
# is what actually carries the answer.
hermes_agent_vikunja_bridge_bucket_ready: "Ready"
hermes_agent_vikunja_bridge_bucket_in_progress: "In Progress"
hermes_agent_vikunja_bridge_bucket_done: "Done"
hermes_agent_vikunja_bridge_bucket_blocked: "Blocked"
# An empty label means "every undone task in READY is fair game". A non-empty
# one is a second, explicit opt-in — the safer default posture for a board the
# operator also uses for their own non-Hermes tasks.
hermes_agent_vikunja_bridge_intake_label: "hermes"
hermes_agent_vikunja_bridge_poll_interval_seconds: 60
# Per-tick intake cap. This is a RATE limit, not a concurrency limit: board
# concurrency is already bounded by kanban.max_in_progress (config.yaml), which
# is the single source of truth for how many workers the shared serving
# deployment can carry. This only stops one bulk paste into Vikunja from
# creating fifty cards in a single tick.
hermes_agent_vikunja_bridge_max_intake_per_tick: 3
hermes_agent_vikunja_bridge_card_max_runtime: "45m"
hermes_agent_vikunja_bridge_card_max_retries: 2
# "" leaves the card to kanban.default_assignee; a name here must exist in
# hermes_agent_profiles (asserted in assert.yml).
hermes_agent_vikunja_bridge_card_assignee: ""
# WRITE-scoped Vikunja API token. Deliberately its OWN env var, not the
# VIKUNJA_API_TOKEN that ai_runner reads: that is a different guest needing a
# different scope, and sharing one credential across both would hand each the
# other's permissions. Injection-agnostic per repo convention — Doppler, SOPS
# or OpenBao all satisfy it, the role only sees the environment. Overridden
# bao-first by inventory/group_vars/hermes_agent_group.yml (local-llm domain,
# secret/ai/hermes) — this default is only the last-resort fallback shape.
hermes_agent_vikunja_bridge_token: >-
  {{ lookup('env', 'HERMES_VIKUNJA_API_TOKEN') | default('', true) }}

# --- Nautobot MCP client (read-only SoT) ---
# Thin pointer to the shared agentgateway /nautobot route — the gateway
# sidecar (mcp_nautobot_server.py, agentgateway_docker role) holds the read
# token, so this is keyless (same posture as qdrant/context7). DISABLED by
# default: the route itself renders only once the read-only token exists
# (ansible-proxmox-apps roles/nautobot/tasks/mcp_token.yml, opt-in via
# nautobot_mcp_token_publish_openbao) AND agentgateway_docker has converged
# with it present. With this enabled but the route absent, Hermes retries and
# parks on "MCP server 'nautobot' failed initial connection" EVERY session
# (the same vikunja footgun documented above) — flip to true, and add
# "nautobot" to a profile's mcp list, only after confirming
# https://mcp.<PROXMOX_SUBDOMAIN>/nautobot answers.
hermes_agent_nautobot_mcp_enabled: false
hermes_agent_nautobot_mcp_url: >-
  https://mcp.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN required (Doppler)') }}/nautobot

# --- Escalation (Codex via MCP) ---
# A deliberate, agent-invoked path for problems worth a stronger model or a
# stuck/looping session — NOT automatic on-error retry (that's
# fallback_providers, an upstream Hermes feature intentionally unused here).
# Registers `codex mcp-server` as an MCP tool; tool use is inherently a
# per-call, model-chosen decision, so the agent reaches for this only when it
# judges it worth it, same as any other tool.
#
# Codex runs under a SEPARATE, isolated OS user (codex_runner role,
# colocated on this host) — Hermes invokes it via a single-command sudo
# grant, never gaining filesystem access to that user's ChatGPT-OAuth
# credential. codex_runner_user/codex_runner_mcp_command come from that
# role's defaults (same host, same play — see playbooks/site.yml).
#
# Inert until a human completes the one-time Codex OAuth bootstrap
# (roles/codex_runner/README.md) — the MCP entry renders regardless, and
# simply errors on use until then; the daemon itself is unaffected.
#
# Named after the tool (matching the sibling hermes_agent_splunk_mcp_enabled /
# hermes_agent_context7_mcp_enabled flags above), not the broader "escalation"
# concept — OPENROUTER_API_KEY is already parked as a candidate SECOND
# escalation tool (see README), which will need its own independent flag when
# wired, not a shared one.
hermes_agent_codex_mcp_enabled: true

# --- Layer 2 post-converge verification gate (tasks/verify.yml) --------------
# After the gateway (re)starts, a real end-to-end probe proves the brain wiring
# actually works before the converge is called done — every 2026-07-08 breakage
# was a config mistake that a single tool-call probe (or a journal grep) would
# have surfaced immediately. Disable only where there is no live brain to reach
# (mirrors llamaindex_verify_router); default on for real converges.
hermes_agent_verify_enabled: true
# journalctl tail scanned for fatal config-rejection lines since the restart.
hermes_agent_verify_journal_lines: 200
# Fatal startup/config-rejection substrings Hermes emits when the brain wiring is
# wrong: the context floor rejection ("below the minimum 64,000 required") and an
# unknown/mis-aliased model ("Model <id> does not exist"). Match => gate fails.
hermes_agent_verify_fatal_log_patterns:
  - "below the minimum"
  - "does not exist"
# The live tool-call probe forces a tool call through the router at the resolved
# brain and asserts a structurally valid tool_call comes back (non-empty
# function.name — the exact "invalid tool call" shape of the outage). Generous
# per-attempt timeout: the swap-tier brain may be loading on first hit.
hermes_agent_verify_probe_timeout: 300
hermes_agent_verify_probe_retries: 3
hermes_agent_verify_probe_delay: 10

# --- Brain-health watchdog: stop cron-failure spam during brain outages -------
# The default brain (ai_default_model) is a single-deployment model (llm_router role) with no viable
# fallback, and upstream Hermes ALWAYS delivers a cron failure ("Failed jobs
# always deliver regardless of the [SILENT] marker"). So a brain outage makes the
# stateless seeded fleet fail-and-DM the operator twice an hour per job, while
# nothing pages that the brain is even down (service_deadman watches DNS/Traefik/
# HAProxy/OpenBao, not the LLM fabric). This watchdog closes both gaps: a systemd
# timer probes the brain end-to-end and, on a DEBOUNCED transition, pauses/resumes
# the seeded cron fleet and alerts EXACTLY ONCE per edge. See templates/ +
# tasks/main.yml and the README.
#
# Re-enabled 2026-08-01: Hermes' in-process one-retry policy (goals.py /
# conversation_loop.py patches above) only covers a single flaky call. It does
# nothing when the whole llm-gate Caddy process dies (exit 78/EX_CONFIG, twice
# in one night) and takes BOTH the primary and fallback serving legs down at
# once -- every seeded cron fires, 500s, and DMs the operator on repeat with
# nobody paged that the brain is down. That is exactly the gap this watchdog
# closes; test_brain_watchdog_contract.py pins the pause/resume safety
# properties (debounced edges, streak reset, disableable escalation) that make
# enabling this safe.
hermes_agent_brain_watchdog_enabled: true
hermes_agent_brain_watchdog_script_path: /usr/local/bin/hermes-brain-watchdog.sh
# Probe cadence (systemd OnUnitActiveSec). 60s matches service_deadman.
hermes_agent_brain_watchdog_interval: "60s"
# Per-probe curl deadline. Comfortably covers a warm 1-token completion; a hung or
# unreachable brain trips it and counts as one failure toward the debounce.
hermes_agent_brain_watchdog_probe_timeout: 15
# Hysteresis: consecutive failures before declaring DOWN (pause+alert), and
# consecutive successes before declaring UP (resume+alert). down_after=3 over the
# 60s cadence (~3 min) rides rotation-flip bounces and cold reloads so the
# watchdog never becomes a new source of spam; up_after=2 damps flapping.
# Both are role vars — tune per environment. TRADEOFF: for an INTERMITTENT
# serving-stack wedge (INC-17083: brain briefly recovers then re-freezes), a
# higher up_after (e.g. 4-6) keeps the fleet paused LONGER across brief-recovery
# windows so fewer crons fire at a re-wedging brain — at the cost of slower
# resume after a genuine recovery. Default stays 2 (fast recovery); raise it if
# a flapping-wedge class dominates.
hermes_agent_brain_watchdog_down_after: 3
hermes_agent_brain_watchdog_up_after: 2
# Flap coalescing (2026-07-18): down_after/up_after debounce brief bounces, but
# a genuinely UNSTABLE backend still produces one clean alert per edge — a
# confirmed 31h-unstable backend produced dozens of up/down DM pairs. Once a
# down/up cycle completes, further edges within this cooldown are coalesced
# (counted, cooldown extended) into one eventual summary instead of alerting
# individually. 3600s (60 min) is long enough to absorb a flapping episode
# without swallowing a second, genuinely independent outage hours later.
hermes_agent_brain_watchdog_flap_cooldown_seconds: 3600
# Sustained-flap escalation (INC-17083, 2026-07-19): the coalescer above only
# emits a summary once the brain STABILIZES (flap_summary_check). A wedge that
# flaps for hours without a clean recovery never stabilizes, so no summary ever
# fires and a multi-hour instability is SILENT to the operator — observed live
# as 15 flaps over ~2.5h with zero alert (every edge coalesced). Fix: while
# STILL flapping, fire ONE loud page once the episode crosses either threshold
# below, then re-arm with a long cooldown so a genuine long wedge pages at most
# hourly, not per-flap. Set threshold to 0 to disable.
hermes_agent_brain_watchdog_sustained_flap_threshold: 5       # coalesced flaps, or
hermes_agent_brain_watchdog_sustained_flap_seconds: 1800      # unstable this long (30m)
hermes_agent_brain_watchdog_sustained_flap_rearm_seconds: 3600  # re-page at most hourly
# Urgent page target. Same topic service_deadman pages on ("same feed as other
# homelab outages", operator decision) — the brain is now a keystone.
# FQDN-first: the Traefik-fronted ntfy service name; DHCP/DNS own the address.
# The service lives on the PROXMOX_SUBDOMAIN zone (same zone the working brain
# probe URL uses, hermes_agent_model_base_url). tofu_data.domain rendered the
# bare parent zone instead, where the ntfy vhost has no route/cert — every page
# failed the TLS/connect and was swallowed by the watchdog's `|| true`.
hermes_agent_brain_watchdog_ntfy_topic: "keystone"
hermes_agent_brain_watchdog_ntfy_url: >-
  https://ntfy.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/{{ hermes_agent_brain_watchdog_ntfy_topic }}

# External deadman OK-ping (silent-Mac / LXC-down gap, INC-17114). The ntfy +
# Slack alerts above only fire when THIS watchdog DETECTS a brain outage — they
# run on this LXC, so a powered-off LXC, a masked timer, or a wedged systemd
# silences them with no page at all. So on every healthy probe the watchdog also
# pings an external healthchecks-style deadman; when that ping STOPS (this host
# gone, timer dead, or the brain unreachable — which includes a silent Mac
# serving host), the external service pages on its own. Injection-agnostic: the
# full ping URL is read from the environment (provision a check in the
# healthchecks LXC and export its URL, mirroring the service_deadman
# DEADMAN_HC_URL_* convention). Empty => ping skipped, all other behaviour
# unchanged.
hermes_agent_brain_watchdog_healthcheck_url: >-
  {{ lookup('env', 'DEADMAN_HC_URL_HERMES_BRAIN') | default('', true) }}

# --- Retained optional brain runtime sync ------------------------------------
# Disabled while stable router aliases own model selection. The implementation
# and variables remain available for a future controlled re-enable.
hermes_agent_brain_sync_enabled: false
hermes_agent_brain_sync_script_path: /usr/local/bin/hermes-brain-sync.sh
hermes_agent_brain_sync_env_path: /etc/hermes-brain-sync.env
hermes_agent_brain_sync_state_dir: /etc/hermes-brain-sync
hermes_agent_brain_sync_state_file: "{{ hermes_agent_brain_sync_state_dir }}/current-model"
# Inert while hermes_agent_brain_sync_enabled is false.
hermes_agent_brain_sync_interval: "5min"
hermes_agent_brain_sync_bao_path: ai/public/brain
hermes_agent_brain_sync_bao_field: active_model
hermes_agent_brain_sync_bao_addr: >-
  {{ hostvars['localhost'].openbao_secrets_active_addr
     | default(lookup('env', 'BAO_ADDR'), true) }}
hermes_agent_brain_sync_role_id: "{{ lookup('env', 'AI_PUBLIC_VAULT_ROLE_ID') | default('', true) }}"
hermes_agent_brain_sync_secret_id: "{{ lookup('env', 'AI_PUBLIC_VAULT_SECRET_ID') | default('', true) }}"

# --- Ship all Hermes logs to the dedicated hermes Splunk index -----------------
# Hermes writes both systemd-journal records and files under its private log
# directory. A dedicated rsyslog ruleset forwards both sources over TCP to the
# hermes_agent AI ingest listener -> HAProxy -> Cribl
# Stream (ai_stamp) -> Splunk index=hermes. Mirrors the openbao_audit shipping
# pattern; the ruleset's `stop` keeps hermes lines off any syslog_forwarder
# catch-all so they never also double-ship into index=os.
hermes_agent_syslog_route_enabled: true
# Numbered 05- so the drop-in is evaluated before any 10-forward-cribl.conf
# catch-all rsyslog may render on this guest.
hermes_agent_syslog_rsyslog_config_path: /etc/rsyslog.d/05-hermes-agent.conf
hermes_agent_log_directory: "{{ hermes_agent_hermes_home }}/logs"
hermes_agent_syslog_host: "syslog.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
# hermes_agent AI ingest port from tofu constants. Mandatory (not defaulted):
# the key is new, so no inventory predates it — fail loudly rather than ship to
# a guessed port.
hermes_agent_syslog_port: >-
  {{ tofu_data.constants.ai_log_routing.hermes_agent.port
     | mandatory('ai_log_routing.hermes_agent.port missing from tofu constants') }}
hermes_agent_syslog_queue_max_disk_space: 256m
