# --- Daily operator summary: the home channel's ONE curated post ------------
# 3-tier routing gives the verbose crons the firehose channel; this job is what
# the home channel is FOR now — a once-daily, delta-only rollup across every
# domain Hermes watches. It reads its own recent findings (memory/wiki), not
# the world — no new queries beyond what a claim needs to be current.
hermes_agent_summary_cron_name: daily-summary
# 12:00 UTC — start of the operator's day; the previous 24h of findings are in.
hermes_agent_summary_cron_schedule: "0 12 * * *"
hermes_agent_summary_cron_prompt: >-
  Post the once-daily operator summary to this channel, built from your own
  last-24h cron findings and memory (Splunk, Zammad incidents
  opened/updated/resolved, fabric health, GitHub org findings). For Splunk
  ingest volume specifically, recall memory key "daily-operator-summary-last"
  (saved by the separate daily-operator-summary-v2 job) instead of re-querying
  it yourself — that job already owns per-index event/host counts; do not
  duplicate its Splunk tool calls here. STRICT rules: deltas and open action
  items only — never restate unchanged or benign status; every line must be
  either NEW since yesterday's summary or an open item awaiting a human. Lead
  with anything needing operator action. No Markdown tables (Slack does not
  render them) — short lines or key: value pairs. At most 15 lines. Recall
  memory key "daily-summary-last" to compute the delta and save today's
  fingerprint back to it. If genuinely nothing new and nothing open, say
  exactly that in one line — never pad. Self-check before posting: every line
  is a delta or an open action item — drop anything that is unchanged or
  benign status.

# --- Zammad review: proactive incident lifecycle across ALL queues ----------
# Operator directive 2026-07-18: Hermes proactively READS open Zammad
# incidents (not just its own), proves finished ones complete, enriches open
# ones, resolves what it can prove, and DMs genuinely NEW incidents. The
# working report always posts to the firehose; the DM is reserved for new
# incidents so it stays an urgent-only surface. Gated (in tasks) on the Zammad
# URL + token being set alongside the Slack gates.
hermes_agent_zammad_review_cron_name: zammad-review
# Every 2h at :41 — staggered clear of the other cron minutes (0,7,22,26,52).
hermes_agent_zammad_review_cron_schedule: "41 */2 * * *"
hermes_agent_zammad_review_cron_prompt: >-
  Review open Zammad incidents across ALL groups and queues, not just your
  own. Recall memory key "zammad-review-last" (incident ids + states you saw
  last run) and work the DELTA. For each open incident: (1) check whether
  evidence now proves it complete — verify with your available probes (fabric
  health checks, prior article history), and if proven, RESOLVE the ticket yourself
  with a closing article stating the evidence — never just recommend closing;
  (2) if you find genuinely NEW information or a plausible solution, append
  ONE article with it — never repeat what an earlier article already says;
  (3) leave incidents you cannot advance untouched. If any incident is NEW
  since your last run, DM the operator immediately: one line per incident —
  id, title, severity, why it matters. Then post your working report here:
  what you reviewed, advanced, resolved (with evidence), and skipped. No
  Markdown tables. Self-check before finishing: every article you appended
  carries NEW information not already in the ticket, and every resolution cites
  the evidence that proved it. Save the updated id+state map back to
  "zammad-review-last".

# --- Kanban recurring-task migration (#83, INC-17120) ------------------------
# Directional change: the agentic cron fleet is retired. Every recurring
# workload runs as a Kanban CARD dispatched by the gateway's in-process board
# engine (the kanban: block in config.yaml.j2), so each run is a fresh isolated
# WORKER session — eliminating the persistent-cron-session failure class
# (corrupted compression bookkeeping crash-looping the splunk-* jobs).
#
# Kanban has no native recurrence, and the deployed CLI has no --scheduled-at.
# The recurrence layer is therefore a thin fleet of `cron create --no-agent
# --script` jobs (script-only, NO agent, NO LLM session — nothing to poison)
# that enqueue cards. Each enqueuer fires on the SAME schedule the old agentic
# cron used and emits ONE `kanban create` per slot with an idempotency key
# `<job>-<slot>`, so a double-fire or a backfill re-run never duplicates a card.
# The enqueuer script (templates/kanban-enqueue-recurring.sh.j2) bakes the
# per-card table below in at render time — same pattern as the watchdog's
# seeded-jobs array.
hermes_agent_kanban_enqueue_script_name: kanban-enqueue-recurring.sh

# The self-perpetuating 8h reviewer (#83 design refinement). It runs at
# 00:00/08:00/16:00 UTC (slot s0/s1/s2 = floor(UTC hour / 8)). Its card body
# tells the worker to create the NEXT slot's card as initial_status=blocked so
# it cannot run early; the enqueuer, finding that pre-created blocked card at
# the next slot boundary, unblocks it (the no-`--scheduled-at` adaptation).
hermes_agent_kanban_reviewer_job: review
hermes_agent_kanban_reviewer_schedule: "0 */8 * * *"
hermes_agent_reviewer_card_prompt: >-
  You are the Hermes 8-hour self-review. Cadence: three slots per UTC day at
  00:00, 08:00, 16:00 — slot number N = floor(UTC hour / 8), so s0/s1/s2. Do
  all of the following, then stop. (1) Review the last 8h of Kanban activity:
  list the done, blocked, and triage cards and read `kanban runs` (task-run
  outcomes). Identify anything that failed, is stuck/blocked, or a recurring
  workload that silently did not run. (2) For each real gap, file a follow-up
  card with kanban_create using a STABLE idempotency key
  (followup-<short-slug>-<UTC-date>) so a re-run never duplicates it; attach the
  right skill and a clear body. (3) Post a short digest — the enqueuer footer
  below carries the exact send command and its destination, so do not restate a
  destination here: what ran, what failed or is
  blocked, what you filed — deltas and action items only, no Markdown tables.
  Self-check before posting: every gap in step 2 has a follow-up card, and the
  digest names each one. (4) Continue the chain: compute the NEXT slot key as
  review-<UTC-date>-s<N>
  (after s2, use s0 of the NEXT UTC day) and call kanban_create with that exact
  idempotency-key, the same title as this card, the SAME body as this card, and
  initial_status=blocked{% if hermes_agent_kanban_goal_mode | bool %},
  goal_mode=true, and goal_max_turns={{ hermes_agent_kanban_goal_max_turns }}{% endif %}
  so it cannot run before its slot{% if hermes_agent_kanban_goal_mode | bool %}
  and preserves this card's bounded goal loop{% endif %}. (5) Call
  kanban_complete with a one-line summary and metadata.

# --- Work-supply cards (Track C): give the agent proactive, self-directed work --
# Five recurring Kanban workloads that widen what Hermes does for the operator
# beyond the monitor/triage fleet: hunt the observability unknown-unknowns, study
# the public docs for drift, scout AI news, propose one novel improvement a day,
# and self-retiringly seed the app platforms. Same card contract as every entry
# above (name + schedule + inline prompt_var); enqueued by the same script-only
# `--no-agent` fleet, so each run is a fresh isolated worker session. Minutes are
# staggered clear of the existing cron minutes (0,7,11,22,26,33,37,41,52) so no
# two enqueuers fire in the same minute. Prompts are retrieval-first (recall a
# memory key so a run never re-reports/re-files what it already saw), carry an
# explicit output contract, and end with a self-check. The enqueuer appends the
# shared "post a full report to #hermes-all, then kanban_complete with a one-line
# summary" footer, so the prompts own the WORK, not the delivery mechanics. A
# prompt that already specifies its own Slack post keeps it — the footer says to
# post once, so the two never double-deliver.

# Anomaly hunt: the unknown-unknowns lens the scheduled Splunk/GitHub lenses do
# not cover. Splunk-monitor skill carries the bounded-query safety rails;
# github-issues lets it file confirmed findings.
#
# Audited 2026-08-01 against the script-fed digests that did not exist when
# this card was designed: its own anomaly-hunt-v2 direct-cron twin WAS retired
# outright (see hermes_agent_direct_cron_jobs) because its fixed top-15 SPL
# was a strict subset of splunk-status-digest. This kanban card is NOT the
# same case — checked each of its three hunting axes individually:
# (1) new error signatures overlaps splunk-error-digest's signature
# clustering, and (2)/(3) silent sources / volume anomalies overlap
# splunk-status-digest's ingest-silence and percent-band findings, BUT both
# scripts only watch the two hardcoded `hermes_agent_splunk_digest_expected_indexes`
# (os, firewall); this card hunts across whatever it chooses, and can file a
# kanban_create follow-up card, which a `--no-agent` script cannot. Keep it —
# do not apply the direct-cron retirement here without re-checking that gap.
hermes_agent_anomaly_hunt_cron_name: anomaly-hunt
hermes_agent_anomaly_hunt_cron_schedule: "13 */12 * * *"
hermes_agent_anomaly_hunt_cron_prompt: >-
  You are the Hermes 12-hour anomaly hunt: find the UNKNOWN-unknowns in the
  observability fabric that the scheduled Splunk and GitHub lenses are not
  already looking for. Retrieval first: recall memory key "anomaly-hunt-last"
  (the signatures and sources you already flagged) so you never re-report a
  known issue. Then hunt with BOUNDED queries ONLY (tstats/stats/head, narrow
  time windows — the dryvist/splunk-monitor skill's hard rails apply): (1) NEW
  error signatures absent from your baseline; (2) sources that fell SILENT or
  stopped — a host or sourcetype that reported yesterday and not today, an
  ingest gap; (3) volume anomalies — a source spiking or collapsing. Confirm
  every candidate against a SECOND query before calling it real; one noisy
  sample is not an anomaly. Output contract: for each CONFIRMED new finding,
  file a kanban_create follow-up card (the default-profile reviewer triages
  it from there — this profile carries no GitHub credential) with a
  one-paragraph description and the exact bounded query that shows it, then
  post it to Slack too. DM the operator only for a confirmed HIGH-severity
  finding; otherwise stay quiet. Self-check before finishing: did every finding
  survive a second confirming query, and is it genuinely absent from
  "anomaly-hunt-last"? Drop any that fail. Save the updated signature/source
  fingerprint back to "anomaly-hunt-last". If nothing new is confirmed, say so
  in one line.

# Docs study: read the public docs for drift/gaps/broken claims via the web
# toolset, file at most 2 issues, Slack summary.
hermes_agent_docs_study_cron_name: docs-study
hermes_agent_docs_study_cron_schedule: "43 5 * * *"
hermes_agent_docs_study_cron_prompt: >-
  You are the Hermes daily docs-study pass: read the operator's public
  documentation and find where it has drifted from reality. Retrieval first:
  recall memory key "docs-study-last" (pages and claims you already checked and
  filed) so you do not re-file a known gap, and rotate to a DIFFERENT area each
  run (record which). Find pages with the web_search tool and read them with
  `curl -sL --max-time 30 <url>` in the terminal (web_extract has no backend
  here — only search works); every page you cite must come from a tool result
  THIS run. Study the public documentation site
  and the repository docs it is built from. Look for: claims that no longer
  match how the system behaves, broken or outdated commands and links, missing
  setup steps, and internal contradictions. Verify a suspected drift against a
  SECOND source (the repo, a linked reference) before filing — never file on a
  single reading. Output contract: file at MOST 2 GitHub issues via the
  dryvist/github-issues skill for the highest-value gaps (respect its issue
  caps; if you cannot file, fall back to kanban_create with a stable
  idempotency key docs-<slug>-<UTC-date>). Post a short Slack summary of what
  you studied, what drifted, and what you filed — deltas only, no Markdown
  tables, at most 8 lines. Self-check: is each filed gap backed by two sources
  and absent from "docs-study-last"? Save the updated checked-areas fingerprint
  back to "docs-study-last".

# News scout: read the news and turn it into a few suggestions the operator can
# act on, tuned to their interests. Two design decisions carry this card:
#
# Interests are DERIVED at runtime, not frozen here. The seed list below is the
# static floor; the living profile is the wiki interests note, which each run
# refreshes from what Hermes' own memory shows the operator recently worked on.
# (The previous prompt told the worker to learn from Slack reactions on its
# past posts — impossible: upstream hard-disables the messaging toolset in
# every cron context, so a cron worker can send via the `hermes send` CLI but
# can never read a channel. The learning loop now uses inputs a cron worker
# actually has: memory recall and explicit operator feedback stored there.)
#
# Every reported item must carry a URL that came out of a tool result THIS run.
# The web toolset was silently non-functional for months (no search backend
# installed — see the ddgs install in tasks/main.yml), so this card's old
# "scan major AI sources" instruction was fabrication bait of exactly the
# daily-status-endpoints shape. The prompt now fails loudly when search is
# down instead of letting the model improvise headlines.
hermes_agent_ai_news_cron_name: ai-news
hermes_agent_ai_news_cron_schedule: "17 */4 * * *"
hermes_agent_ai_news_cron_prompt: >-
  You are the Hermes news scout (every 4 hours): read the news and turn it into
  AT MOST 3 suggestions the operator can act on, tuned to their interests.
  Retrieval first: read your interests note at
  {{ hermes_agent_wiki_path }}/ai-news-interests.md — create it from the
  INTEREST SEED below if absent — and recall memory key "ai-news-last"
  (fingerprints of items already reported) so you never repeat one. Refresh the
  note each run: recall from memory what the operator recently worked on or
  asked about, merge those topics in, and note which topics you scouted so runs
  rotate. The seed is the fixed floor; the note is the living profile.
  Scouting: pick the 3-4 note topics closest to recent operator activity and
  search them with the web_search tool. Read a promising result with
  `curl -sL --max-time 30 <url>` in the terminal (web_extract has no backend
  here — only search works). Every candidate MUST carry a URL that appeared
  in a tool result THIS run — if web_search errors or returns nothing, report
  that in one line
  and stop; never substitute a remembered or plausible-looking URL, and never
  report an item you did not retrieve this run. Selection bar (relevance beats
  recency): keep an item ONLY if it connects to a named interest AND you can
  say what the operator could do with it; prefer items from the last few days;
  skip rumor, marketing, funding news, and anything matching "ai-news-last".
  Output contract: each kept item is exactly 3 lines — what happened (with its
  URL), why it matters to THIS estate (name the interest, service, or repo it
  touches), and what you would research or try next. At most 3 items; if
  nothing clears the bar the report is the single line "No news cleared the
  bar this run." If an item is genuinely actionable now against something this
  estate runs (a security advisory for a deployed service, a release that
  fixes a known problem), ALSO file it with kanban_create using idempotency
  key news-<slug>-<UTC-date> so it enters board triage — that, not another
  Slack channel, is how a suggestion becomes work. Self-check: does every item
  carry a this-run URL and an estate-tied "why"? Save the updated fingerprints
  to "ai-news-last" and write the refreshed note.


  {{ hermes_agent_ai_news_interests }}

# The static floor of the interest profile, appended verbatim to the news-scout
# card body. Reviewable and overridable without touching the prompt; host_vars
# may replace it wholesale. PUBLIC-SAFE ONLY: this repo is public, so entries
# are technology and product names already visible in the operator's public
# repos — never hostnames, addresses, or private topology. The living profile
# (the wiki note the prompt maintains) stays on the guest and may hold more.
hermes_agent_ai_news_interests: |-
  INTEREST SEED (static floor — the interests note starts from this and grows):
  - Infrastructure as code: Proxmox VE, OpenTofu/Terraform, Terrakube,
    Ansible, UniFi networking
  - Secrets and identity: OpenBao/Vault, ephemeral credentials, SSH
    certificate authorities
  - Observability and SIEM: Splunk, Cribl Edge/Stream, OpenTelemetry, syslog
    pipelines
  - Local LLM serving: MLX on Apple Silicon, quantization, llama.cpp, LiteLLM
    routing, open-weight model releases (DeepSeek, Qwen, Hermes, Llama)
  - AI agents and tooling: agent frameworks, MCP, Claude Code, Codex, Gemini
    CLI, multi-agent orchestration, agent memory systems
  - Nix: nix-darwin, home-manager, flakes, reproducible dev environments
  - Self-hosted services this estate runs: Traefik, Authelia, Technitium DNS,
    Vikunja, Zammad, Nautobot, Qdrant, PostgreSQL, Plex and the *arr stack
  - Security advisories (CVEs, supply-chain compromises) affecting anything
    above
  - GitHub automation: Actions, Renovate, release-please

# Daily innovation: propose one concrete, genuinely-new improvement per day,
# checked against a wiki log so it never repeats a past proposal.
hermes_agent_daily_innovation_cron_name: daily-innovation
hermes_agent_daily_innovation_cron_schedule: "47 6 * * *"
hermes_agent_daily_innovation_cron_prompt: >-
  You are the Hermes daily-innovation proposer: each run, propose at least ONE
  concrete, novel improvement to how you help the operator run the homelab.
  Retrieval first: read your proposal log at
  {{ hermes_agent_wiki_path }}/innovation-log.md (create it if absent) and
  recall memory key "innovation-last" — your idea MUST be genuinely new, not a
  restatement of a past proposal or an already-open issue or card. Ground it in
  what you have actually observed: your recent cron findings, memory, and the
  gaps in your own workflow (a missing check, a manual step you could automate,
  a better signal). The news scout's recent finds are a first-class source too
  — recall memory key "ai-news-last" and read the interests note at
  {{ hermes_agent_wiki_path }}/ai-news-interests.md; an external development
  that unlocks an estate improvement is exactly the kind of proposal wanted.
  One well-formed proposal beats five vague ones. Output
  contract: write the proposal as a GitHub issue via the dryvist/github-issues
  skill (respect issue caps) OR, if you cannot file, as a Kanban card via
  kanban_create with a stable idempotency key innovation-<slug>-<UTC-date>; the
  proposal states the problem, the concrete change, and how you would verify it
  helped. Append a one-line entry to the innovation log so future runs can see
  it. Post a short Slack summary (the proposal in 2-3 lines). Self-check: is
  this absent from the innovation log AND from open issues and cards? If every
  new idea you formed is a duplicate, say so in one line and propose nothing
  rather than pad. Save the updated fingerprint to "innovation-last".

# App seeding: self-retiring bootstrap of the Langflow + Langfuse platforms. It
# cannot remove its own enqueuer, so it self-gates on a wiki completion marker
# and fast no-ops once both sub-tasks are done.
hermes_agent_app_seeding_cron_name: app-seeding
hermes_agent_app_seeding_cron_schedule: "53 7 * * *"
hermes_agent_app_seeding_cron_prompt: >-
  You are the Hermes app-seeding task (self-retiring): bootstrap the Langflow
  and Langfuse app platforms so they are usable, then stop. FIRST, retrieval:
  read your completion marker at
  {{ hermes_agent_wiki_path }}/app-seeding-done.md. If it records BOTH sub-tasks
  complete, do nothing further — post one line saying app-seeding is already
  done and finish (you cannot remove your own enqueuer, so a fast no-op is how
  you retire). Otherwise, do only the not-yet-done sub-tasks: (1) Langflow —
  create ONE minimal starter flow that calls the fabric router (the
  OpenAI-compatible endpoint at {{ hermes_agent_model_base_url }}) with a
  trivial prompt, and confirm it runs end-to-end. (2) Langfuse — create the
  org and project, then PROPOSE (as a GitHub issue or a Kanban card — do NOT
  wire it live) how homelab LLM traffic should export traces into it. Verify
  each sub-task before marking it done: the flow actually executes, the Langfuse
  project actually exists. Output contract: record each completed sub-task in
  the completion marker with the date and what you did; when BOTH are done,
  write the final "complete" line so future runs no-op. Post a short Slack
  summary of what you seeded this run. Self-check: did you verify each thing you
  marked done, and did you avoid re-doing an already-complete sub-task?


  {{ hermes_agent_app_seeding_endpoints }}

# Appended to the app-seeding card body — the daily-status lesson applied
# before this card ever runs: a worker given tasks but no addresses invents
# them (measured 2026-07-31 on the fabric-status card: every invented probe
# returned 000 and a healthy fabric was reported as a total outage). Bases are
# the Traefik front doors, derived from the same env the services are deployed
# from; never a literal.
hermes_agent_app_seeding_endpoints: |-
  ENDPOINTS — USE EXACTLY THESE, AND NOTHING ELSE. Do not guess, infer, or
  recall a hostname or port from anywhere else; an address not on this list
  is wrong, and a result from one is a fabricated finding rather than
  evidence, however plausible it reads.

    Langflow  https://langflow.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}
    Langfuse  https://langfuse.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}

  Both sit behind the estate auth proxy: an HTTP redirect on first contact
  means the service answered. If an API call needs a credential you do not
  hold, record the sub-task as blocked in the completion marker and say so in
  the Slack summary — never try another hostname or port.

# --- Fleet health: Hermes watching its OWN reliability trend (2026-08-01) -----
# The one gap the 2026-08-01 kanban audit found with no card covering it:
# every existing card watches a DOWNSTREAM system (Splunk, Zammad, GitHub,
# the fabric); nothing watches whether HERMES ITSELF is getting more or less
# reliable at running them. Weekly (not hourly/daily like the monitor fleet —
# a reliability TREND needs a window longer than one throttle-limited board's
# worth of runs to mean anything) and read-only over `kanban runs`; it never
# proposes touching serving infrastructure, only files a follow-up card for a
# human or a separate change to act on. Distinct from the `review` card
# above: `review` catches an operational gap in the last 8h (stuck, blocked,
# silently-not-run); this catches a reliability trend across weeks. Different
# time horizons, not a duplicate.
hermes_agent_fleet_health_cron_name: fleet-health
hermes_agent_fleet_health_cron_schedule: "3 10 * * 1"
hermes_agent_fleet_health_cron_prompt: >-
  You are the Hermes weekly fleet-health pass: look for REGRESSION in your own
  reliability over the last 7 days — not in any downstream system you
  monitor. Retrieval first: recall memory key "fleet-health-last" (the
  per-card outcome counts you saved last week) so you compare against a real
  baseline, not from scratch. Then read `kanban runs` for the window and
  compute, per recurring card, its completed / failed / retried /
  turn-budget-exhausted counts. Flag ONLY a card whose failure or retry rate
  got genuinely worse than the recalled baseline (a single bad run in a
  low-volume card is not a regression) or that produced zero runs when its
  schedule implies it should have run (a silently-stopped enqueuer). For each
  CONFIRMED regression, file one kanban_create follow-up card naming the
  workload, the before/after counts, and cite the exact `kanban runs` rows
  behind them — never assert a regression you cannot point to in that output.
  If the fleet's run history is too thin to say anything meaningful (most
  cards are currently paused under the throughput throttle — see
  hermes_agent_kanban_paused_jobs), say exactly that instead of speculating
  from a handful of runs. You can only observe and file a follow-up card;
  never propose or attempt to restart, reconfigure, or converge any serving
  infrastructure yourself. Self-check before finishing: does every flagged
  regression cite real before/after counts from `kanban runs`, and is the
  baseline genuinely stale-comparable rather than one noisy run? Save this
  week's per-card counts back to "fleet-health-last". If nothing regressed,
  say so in one line.

# --- Named operating profiles (Hermes agent identities) -----------------------
# A profile is a fully independent HERMES_HOME directory (own config.yaml,
# .env, SOUL.md, memory, skills) that a Kanban card selects via its `assignee`
# field below — the dispatcher spawns `hermes -p <assignee> chat ...` with
# HERMES_HOME pointed at that profile's directory, so the assignee is the
# ENTIRE tool/credential envelope the worker runs under (see
# roles/hermes_agent/README.md "Operating profiles"). One shared
# gateway/dispatcher/board serves every profile; there is no per-profile
# gateway, cron store, or Slack bot (tasks/profiles.yml sets
# kanban.dispatch_in_gateway: false in every profile's own config.yaml as a
# belt-and-braces guard against that).
#
# DECISION RULE (the default action for new recurring work): choose a profile
# FIRST. `default` is not the absence of a choice — it is correct only for
# cross-domain, board-meta, or GitHub work, and the card/PR should say why.
# SIEM-shaped work is splunk-admin; incident/infra-shaped work is
# homelab-admin; work that fits neither and is not cross-domain is the signal
# to propose a NEW profile, not to widen an existing one — a profile is scoped
# by what it must NOT reach, not by what it might someday need.
#
# `env` names the .env sections templates/hermes-env-profile.j2 renders with a
# real value; every OTHER credential the template knows about is rendered
# BLANK for this profile (dotenv override=True on load) — that blanking IS the
# isolation mechanism: a spawned worker inherits the gateway process's full
# environment, so simply omitting a line would leave the default profile's
# credential silently readable. `mcp` names the mcp_servers entries
# templates/config-profile.yaml.j2 renders. `skills` are copied from the
# nix-hermes bundle into the profile's own skills/dryvist/ dir — a card's
# --skill only resolves what its assignee actually has.
#
# NOTE: profile isolation is a CONFIG/tool-availability boundary, not an OS
# sandbox — every profile runs as the same `hermes` OS user in the same LXC,
# so a worker with the terminal/file toolset can still read another profile's
# files on disk by hand. The blast-radius boundary is the LXC (see the role
# header comment); a profile boundary keeps a job's ordinary tool calls,
# skills, and prompts scoped to what it is meant to reach — it does not stop a
# deliberately adversarial instruction from reading a sibling profile's .env.
hermes_agent_profiles:
  - name: splunk-admin
    description: Read-only SIEM analyst (bounded SPL, alert + report, no remediation)
    mcp: [splunk, docs]
    env: [slack, splunk]
    skills: [dryvist/splunk-monitor]
    soul_addendum_file: soul-splunk-admin.md.j2
  - name: homelab-admin
    description: Incident lifecycle + fabric health (evidence-before-resolve)
    mcp: [docs]                    # + vikunja/nautobot once their gateway routes go live
    env: [slack, zammad]
    skills: [dryvist/zammad-incidents]
    soul_addendum_file: soul-homelab-admin.md.j2

# One entry per recurring workload. Static fields only (no prompt bodies): the
# body is named by `prompt_var` and resolved from that var at template-render
# time — the catalog prompts (loaded by set_fact in tasks/main.yml) and the
# inline prompts (above) alike — so this list resolves anywhere without needing
# the runtime catalog (the pause/resume playbooks depend on that).
#   job            idempotency-key prefix + `<job>-enqueue` cron-name stem
#   interval_hours slot granularity: 1 -> hourly (%Y-%m-%dT%H), 24 -> daily
#                  (%Y-%m-%d), else date + `-s<floor(hour/interval)>`
#   schedule       the enqueuer cron schedule (== the old agentic schedule)
#   prompt_var     name of the var holding the card body (catalog or inline)
#   assignee       "" (default profile) or a name in hermes_agent_profiles —
#                  see the profiles block above; asserted in assert.yml
#   channel        OPTIONAL Slack destination for this card's report. Omitted or
#                  empty -> the work channel. Set it where a card's output is
#                  categorically not work: fabric health is Hermes' own state
#                  (issues), scouting cards are reading material (noise).
#   terse_when_healthy
#                  OPTIONAL. Inverts the report contract for cards whose channel
#                  must stay quiet: all-healthy collapses to one line, and only
#                  failures get detail. Default false — every other card names
#                  each clean check, because for them a clean check IS the
#                  finding. Only set it where an all-clear carries no information
#                  beyond "still alive".
#   unblock        reviewer only: `kanban unblock` the card after create so a
#                  pre-created blocked next-slot card goes live on time
hermes_agent_kanban_cards:
  # profile: homelab-admin — fabric health is homelab ops
  - job: "{{ hermes_agent_daily_status_cron_name }}"
    title: "Homelab AI fabric status"
    interval_hours: 1
    schedule: "{{ hermes_agent_daily_status_cron_schedule }}"
    prompt_var: hermes_agent_daily_status_cron_prompt
    assignee: homelab-admin
    # Hermes reporting on its OWN fabric is not work output: healthy is the
    # hourly all-clear the operator asked for in-channel, unhealthy is breakage.
    # Both belong on the issues surface, so the channel is never silent.
    channel: "{{ hermes_agent_slack_issues_channel }}"
    terse_when_healthy: true
    max_runtime: "45m"
    max_retries: 2
    skills: []
    unblock: false
    enabled: >-
      {{ hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  # profile: default — wiki is shared default-home state
  - job: "{{ hermes_agent_nightly_wiki_cron_name }}"
    title: "Nightly llm-wiki health pass"
    interval_hours: 24
    schedule: "{{ hermes_agent_nightly_wiki_cron_schedule }}"
    prompt_var: hermes_agent_nightly_wiki_cron_prompt
    assignee: ""
    max_runtime: "30m"
    max_retries: 2
    skills: []
    unblock: false
    enabled: >-
      {{ hermes_agent_wiki_enabled | bool
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  # profile: default — cross-domain rollup, needs visibility across every
  # domain's findings; moving it is blocked on the Hindsight memory-scope
  # question (see roles/hermes_agent/README.md "Operating profiles")
  - job: "{{ hermes_agent_summary_cron_name }}"
    title: "Daily operator summary"
    interval_hours: 24
    schedule: "{{ hermes_agent_summary_cron_schedule }}"
    prompt_var: hermes_agent_summary_cron_prompt
    assignee: ""
    max_runtime: "45m"
    max_retries: 2
    skills: []
    unblock: false
    enabled: >-
      {{ hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  # profile: homelab-admin — incident lifecycle ownership
  - job: "{{ hermes_agent_zammad_review_cron_name }}"
    title: "Zammad incident review"
    interval_hours: 2
    schedule: "{{ hermes_agent_zammad_review_cron_schedule }}"
    prompt_var: hermes_agent_zammad_review_cron_prompt
    assignee: homelab-admin
    max_runtime: "30m"
    max_retries: 2
    skills: [dryvist/zammad-incidents]
    unblock: false
    enabled: >-
      {{ hermes_agent_zammad_url | length > 0
         and hermes_agent_zammad_api_token | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  # profile: splunk-admin — SIEM; the only splunk card active under the throttle
  - job: "{{ hermes_agent_splunk_triage_cron_name }}"
    title: "Splunk triage sweep"
    interval_hours: 1
    schedule: "{{ hermes_agent_splunk_triage_cron_schedule }}"
    prompt_var: hermes_agent_splunk_triage_cron_prompt
    assignee: splunk-admin
    max_runtime: "45m"
    max_retries: 2
    skills: [dryvist/splunk-monitor]
    unblock: false
    enabled: &kanban_splunk_gate >-
      {{ hermes_agent_splunk_monitor_enabled | bool
         and hermes_agent_splunk_mcp_url | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  # profile: splunk-admin — SIEM (throttle-paused; routing-at-rest)
  - job: "{{ hermes_agent_splunk_security_cron_name }}"
    title: "Splunk security lens"
    interval_hours: 6
    schedule: "{{ hermes_agent_splunk_security_cron_schedule }}"
    prompt_var: hermes_agent_splunk_security_cron_prompt
    assignee: splunk-admin
    max_runtime: "45m"
    max_retries: 2
    skills: [dryvist/splunk-monitor]
    unblock: false
    enabled: *kanban_splunk_gate
  # profile: splunk-admin — SIEM (throttle-paused; routing-at-rest)
  - job: "{{ hermes_agent_splunk_parsing_cron_name }}"
    title: "Splunk parsing / data-quality lens"
    interval_hours: 24
    schedule: "{{ hermes_agent_splunk_parsing_cron_schedule }}"
    prompt_var: hermes_agent_splunk_parsing_cron_prompt
    assignee: splunk-admin
    max_runtime: "45m"
    max_retries: 2
    skills: [dryvist/splunk-monitor]
    unblock: false
    enabled: *kanban_splunk_gate
  # profile: splunk-admin — SIEM (throttle-paused; routing-at-rest)
  - job: "{{ hermes_agent_splunk_deepdive_cron_name }}"
    title: "Splunk deep-dive research"
    interval_hours: 24
    schedule: "{{ hermes_agent_splunk_deepdive_cron_schedule }}"
    prompt_var: hermes_agent_splunk_deepdive_cron_prompt
    assignee: splunk-admin
    max_runtime: "45m"
    max_retries: 1
    skills: [dryvist/splunk-monitor]
    unblock: false
    enabled: *kanban_splunk_gate
  # The splunk-digest card that used to sit here is REMOVED, not paused — see
  # the comment above hermes_agent_splunk_status_digest_cron_name.
  # profile: default — GitHub org work; a future github-admin profile, not now
  - job: "{{ hermes_agent_github_monitor_cron_name }}"
    title: "GitHub org triage sweep"
    interval_hours: 6
