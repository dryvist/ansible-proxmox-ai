---
# hermes_agent role — NousResearch Hermes Agent (the autonomous agent), run
# headless 24/7 in a dedicated LXC. NOT the hermes-infer/hermes-chat LLM serving
# stack (that just serves the Hermes-4 *model*). Native install (install.sh
# bundles Python/uv + Node) system-wide as root; the gateway runs as a dedicated
# non-root 'hermes' user whose HERMES_HOME is on a persisted ZFS data volume.
# Restart-on-failure is applied DRY by systemd_restart_policy (Phase 9).

hermes_agent_user: hermes
# Dedicated ZFS data volume mount (deployment.json mount_point). Holds the whole
# agent home — memory, skills, profiles, Kanban DB, sessions, logs — so it is
# snapshotted + replicated pve->pve3.
hermes_agent_home: /var/lib/hermes
hermes_agent_hermes_home: "{{ hermes_agent_home }}/.hermes" # $HERMES_HOME
hermes_agent_managed_cron_state_dir: "{{ hermes_agent_hermes_home }}/managed-cron"
hermes_agent_bin: /usr/local/bin/hermes                     # system-wide install
# install.sh's root-FHS layout: the app checkout (editable install target) and
# its uv-managed venv. uv itself lands only at this root-owned path — the
# installer never symlinks it onto the system PATH.
hermes_agent_install_dir: /usr/local/lib/hermes-agent
hermes_agent_venv_python: "{{ hermes_agent_install_dir }}/venv/bin/python"
hermes_agent_uv_bin: /root/.hermes/bin/uv

# --- Pinned, checksum-verified installer (NO curl|bash of a moving remote script) ---
# Hermes ships as a Python app built from a git checkout (uv venv + editable pip),
# not a released binary — so there is no binary artifact to checksum. What we CAN
# pin is (a) the installer script, fetched from the tag's immutable raw URL and
# sha256-verified, and (b) the app checkout, via the installer's --branch <tag>.
#
# Ansible pins the PLATFORM version for the ONE-TIME install (creates guard on the
# binary); the Hermes daemon self-updates the app thereafter (`hermes update`).
# To move the pinned floor: bump hermes_agent_version AND refresh the sha256
# (curl the URL below, `sha256sum`). A stale checksum fails the converge loudly —
# by design, that is the tamper/rug-pull guard.
hermes_agent_version: "v2026.7.7.2"
hermes_agent_installer_url: >-
  https://raw.githubusercontent.com/NousResearch/hermes-agent/{{
  hermes_agent_version }}/scripts/install.sh
hermes_agent_installer_sha256: "a93c65b01ea392e179cf872e182bd01a2b65c0c15f17833e9f9569033ef10e07"
# Version-stamped so a version bump downloads (and re-verifies) a fresh copy
# instead of reusing a stale cached file.
hermes_agent_installer_path: "/usr/local/lib/hermes-agent-installer-{{ hermes_agent_version }}.sh"

# --- Pinned nix-hermes content bundle (skills + SOUL persona) -----------------
# The dryvist skills and SOUL.md are CONTENT owned by the nix-hermes flake
# (github:dryvist/nix-hermes); the converge builds this pinned ref on the
# CONTROLLER (which has nix) and byte-copies the result to the guest. SOUL.md
# is composed there at build time from ai-assistant-instructions'
# autonomous-base.md + the Hermes variant — no vendored copy to drift.
# Bump the tag deliberately: renovate opens the PR on each nix-hermes release;
# a bad ref fails the converge loudly at the controller build step.
hermes_agent_bundle_flake_ref: "github:dryvist/nix-hermes/nix-hermes-v0.6.0#hermes-bundle"
# --- Pinned prompt catalog (dryvist/ai-llm-prompts) --------------------------
# Supplies every prompt body the reconciles resolve by filename, including the
# 8 hermes-digest-*.md files referenced by hermes_agent_direct_cron_jobs. A
# prompt edit lands in the catalog first; this pin then moves to that merge
# commit, so the converge is the only thing that changes what a job says.
hermes_agent_prompts_flake_ref: >-
  github:dryvist/ai-llm-prompts/b231d16d2d2f0e7edceaf638b247e46e7d7a4c17#auto-ai-agent
hermes_agent_webhook_prompt_file: hermes-inbound-webhook.md
hermes_agent_curriculum_prompt_files:
  orient: hermes-curriculum-orient.md
  reposweep: hermes-curriculum-reposweep.md
  splunk: hermes-curriculum-splunk.md
  apps: hermes-curriculum-apps.md
  improve: hermes-curriculum-improve.md

# --- Brain: the LiteLLM router (the fabric front door, OpenAI-compatible /v1) ---
# Reached by its neutral Traefik FQDN — never a hardcoded IP. The router routes by
# model alias, so the agent just names the model it wants. The api key is the
# router master key, env-sourced (SOPS/Doppler).
# The model comes from the router role alias in inventory/group_vars/all.yml.
# Physical model IDs remain centralized in the router/MLX catalog.
hermes_agent_model: "{{ hermes_brain_model }}"
hermes_agent_model_base_url: "https://llm.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/v1"
hermes_agent_model_api_mode: chat_completions
# Context compression uses the same >=64K-capable router alias as the agent.
hermes_agent_compression_model: "{{ hermes_brain_model }}"
# Session reset policy (see config.yaml.j2 session_reset block): daily boundary
# hour and idle timeout that bound EVERY session's lifetime.
hermes_agent_session_reset_at_hour: 4
hermes_agent_session_reset_idle_minutes: 1440
# The context window Hermes budgets against and compacts under (it compresses at
# hermes_agent_context_compression_threshold * this value). It matches the
# router's served 65,536-token window so compaction begins at 49,152 tokens,
# before LiteLLM's pre-call context check can reject the request.
hermes_agent_model_context_length: 65536
# Match the official MLX server's output cap and preserve input headroom.
hermes_agent_model_max_tokens: 8192
# Hermes classifies the brain endpoint by HOSTNAME STRING, never by DNS
# resolution (agent/model_metadata.py is_local_endpoint: loopback, RFC-1918
# IP literals, container suffixes, dot-less names). Our router base_url is an
# FQDN, so Hermes applies its strict REMOTE-provider timeouts — 120s stream
# read, 180s stale-stream kill — to a local model whose thinking-mode prefill
# on a 20-60K context legitimately exceeds both. Confirmed live 2026-07-08:
# "Stream stale for 180s (threshold 180s) ... Killing connection" followed by
# a 0-char truncated stub that surfaces as "Model generated invalid tool
# call". These overrides restore the values Hermes itself auto-applies to
# endpoints it recognizes as local (read 1800s; stale kept enabled but far
# above any healthy prefill).
# The read value is the innermost link of the fabric-wide timeout chain, so it is
# sourced from the single-source-of-truth constant (all.yml) that the Layer-1
# assert checks against the router's per-attempt timeout — resolves to 1800.
hermes_agent_stream_read_timeout: "{{ ai_stream_read_timeout_seconds }}"
hermes_agent_stream_stale_timeout: 900
# Per-call MCP tool timeout (config_servers.<srv>.timeout). The hermes-agent
# runtime already ENFORCES this bound (tools/mcp_tool._run_on_mcp_loop raises
# TimeoutError at the deadline and returns a clean tool error), but the per-server
# key was undeclared, so it fell back to the 300s default. Declaring it at 180s
# makes a hung-but-connected MCP upstream fail a data card's tool call in 3 min
# instead of 5 — the card then fails/requeues via max_retries + kanban
# failure_limit within its max_runtime, so a dead MCP never freezes the sole
# worker slot indefinitely (Vikunja 815). 180s still allows a legitimately slow
# bounded Splunk search. The brain call is separately bounded by
# hermes_agent_stream_stale_timeout above.
hermes_agent_mcp_tool_timeout_seconds: 180
# The api key IS the LiteLLM router master key; source it from the canonical
# LLM_ROUTER_MASTER_KEY env (same as the llm_router role) so no per-run mapping
# is needed. HERMES_AGENT_MODEL_API_KEY still overrides if explicitly set.
hermes_agent_model_api_key: >-
  {{ lookup('env', 'HERMES_AGENT_MODEL_API_KEY')
     | default(lookup('env', 'LLM_ROUTER_MASTER_KEY'), true) }}

# --- Slack gateway (Socket Mode) ---
# Sourced the same way as the model key: plain env lookup, fed by Doppler at
# converge time (iac-conf-mgmt/prd, where these were added alongside
# LLM_ROUTER_MASTER_KEY). Empty-string defaults keep the role inert — and the
# gateway Slack-free — until all five are actually set.
hermes_agent_slack_bot_token: "{{ lookup('env', 'SLACK_HERMES_BOT_TOKEN') | default('', true) }}"
hermes_agent_slack_app_token: "{{ lookup('env', 'SLACK_HERMES_APP_TOKEN') | default('', true) }}"
hermes_agent_slack_allowed_users: "{{ lookup('env', 'SLACK_MEMBER_ID') | default('', true) }}"
hermes_agent_slack_home_channel: "{{ lookup('env', 'SLACK_HOME_CHANNEL') | default('', true) }}"
hermes_agent_slack_home_channel_name: "{{ lookup('env', 'SLACK_HOME_CHANNEL_NAME') | default('', true) }}"

# 4-channel Slack routing (operator decision 2026-07-31). The previous 3-tier
# scheme collapsed: firehose, digest and hermes_all all resolved to ONE id, so
# every emitter landed in the same channel. A 13-day audit of 1084 messages
# found ~52% of that channel was Hermes reporting its own breakage and ~28% was
# null-result polling, leaving ~10-17% actual work.
#
# The discriminator is the OBSERVATION PATH, never a keyword. Hermes reporting a
# failure it observed is work (#hermes-all / #hermes-splunk); Hermes failing to
# observe is breakage (#hermes-issues). Keyword routing on "error"/"litellm"
# would misroute the most valuable posts in the corpus — Splunk-observed
# litellm errors on the llm-routers are findings, produced by a job that worked.
#
#   #hermes-all     real thinking, work, and findings
#   #hermes-issues  Hermes itself not functional
#   #hermes-splunk  the Splunk digest domain
#   #hermes-noise   "no change since" / heartbeat polls
#
# Every id is an env lookup fed by Doppler at converge time — never hardcoded.
# Each defaults EMPTY and falls back to prior behaviour, so an unset var leaves
# routing exactly as it was rather than silently emptying a channel.
hermes_agent_slack_firehose_channel: "{{ lookup('env', 'SLACK_FIREHOSE_CHANNEL') | default('', true) }}"
hermes_agent_slack_issues_channel: "{{ lookup('env', 'SLACK_HERMES_ISSUES_CHANNEL') | default('', true) }}"
hermes_agent_slack_noise_channel: "{{ lookup('env', 'SLACK_HERMES_NOISE_CHANNEL') | default('', true) }}"

# The prefix a script-fed cron prints to declare that its OWN observation path
# failed. Those scripts deliberately exit 0 and print their failure so it gets
# delivered, so the runner sees success — this is how they say otherwise. ONE
# definition, templated into both the scheduler patch and every script that
# emits it, so the producer and the consumer cannot drift.
hermes_agent_cron_issues_marker: "[ISSUES]"

# Delivery target a FAILED cron run is redirected to, patched into upstream's
# scheduler (tasks/main.yml). Covers both a runner-reported failure and a
# script-fed job that declared its own with the marker above. Empty leaves
# every result on its job's own channel, i.e. previous behaviour.
hermes_agent_cron_failure_deliver: >-
  {{ 'slack:' ~ hermes_agent_slack_issues_channel
     if (hermes_agent_slack_issues_channel | length > 0)
     else '' }}

# --- Agentic direct-deliver digest crons (declarative; Phase 5) --------------
# Nine hand-created "direct deliver" digest jobs, now reconciled by the role
# (tasks/reconcile_direct_cron.yml) instead of being live-patched onto the
# guest. Each is an AGENTIC cron (unlike the --no-agent kanban enqueuers): the
# gateway runs the prompt and delivers the model's final response straight to
# Slack. Bodies live in the pinned ai-llm-prompts catalog (prompt_file), loaded
# and frontmatter-stripped at reconcile time exactly like the *_cron_prompt_file
# vars elsewhere in this file.
#
# The Slack channel is NEVER hardcoded: it comes from this var, and the whole
# reconcile loop is skipped (with a loud warning) when it is empty.
hermes_agent_digest_slack_channel: "{{ lookup('env', 'HERMES_SLACK_DIGEST_CHANNEL') | default('', true) }}"

hermes_agent_direct_cron_jobs:
  # Paused, NEVER reconciled: superseded by the script-fed splunk-security-digest
  # (hermes_agent_triage_jobs). Leaked raw <function=...> markup to Slack twice on
  # 2026-07-24, and never ran the SPL this prompt specifies.
  - name: splunk-security-lens-v2
    schedule: "22 */6 * * *"
    prompt_file: hermes-digest-splunk-security-lens.md
    skill: ""
    enabled: false
  # Paused, NEVER reconciled: superseded by the script-fed splunk-error-triage
  # (hermes_agent_error_triage_cron_name), which pauses this agentic job so the
  # two never double-post. This job delivered raw <function=...> tool-call markup
  # to Slack instead of a report — see hermes_agent_superseded_error_triage_cron_name.
  - name: splunk-error-triage-v2
    schedule: "37 * * * *"
    prompt_file: hermes-digest-splunk-error-triage.md
    skill: ""
    enabled: false
  # RETIRED (2026-08-01 kanban audit), replaced by the splunk-parsing kanban
  # card (same daily cadence — a 1-for-1 swap, not a throughput increase).
  # This job's fixed SPL was `index=os OR index=network | stats count by
  # sourcetype | sort -count | head 15`: `index=network` is the same
  # stale/near-empty index the daily-operator-summary fix above already
  # dropped for `firewall`, so half of every run's table silently omitted the
  # real network-shaped data — a confidently wrong daily post, not just a
  # crude one. It also had no memory dedup and no [SILENT] path, so it always
  # posted regardless of whether anything needed attention. The kanban card
  # sweeps for real data-quality signals (timestamp-extraction failures,
  # line-merge anomalies, new/unknown sourcetypes) with memory-backed delta
  # discipline and posts only when something is actually off.
  - name: splunk-parsing-quality-v2
    schedule: "17 3 * * *"
    prompt_file: hermes-digest-splunk-parsing-quality.md
    skill: ""
    enabled: false
    replaced_by_card: "{{ hermes_agent_splunk_parsing_cron_name }}"
  # RETIRED, not superseded: nothing replaces this job because nothing needs to.
  # Its SPL is `index=* | stats count by index, sourcetype | sort -count | head 15`
  # — the same two group-by fields splunk-status-digest already computes hourly
  # from tstats, over ALL pairs rather than the top 15, and with the host and
  # liveness dimensions on top. Its own `sort -count | head 15` also throws away
  # the long tail, so it cannot surface the "pattern nobody monitors" its prompt
  # asks for; the digest's composition tier reports a new or vanished sourcetype
  # at any volume. The only content it adds is a static top-15 table restated
  # every 12h, which is exactly the boilerplate the per-day novelty contract
  # (#183) exists to stop. See hermes_agent_retire_anomaly_hunt below.
  - name: anomaly-hunt-v2
    schedule: "41 6,18 * * *"
    prompt_file: hermes-digest-anomaly-hunt.md
    skill: ""
    enabled: false
  # RETIRED on cadence: a cron is justified only when it is a genuine daily
  # report over the previous day, or runs LESS often than daily. Everything more
  # frequent belongs on the board, where a fresh worker session per run and the
  # retry/timeout machinery already exist. `3 */6 * * *` is every six hours, so
  # this fails the rule; the four daily `-v2` jobs beside it pass and stay.
  #
  # Its replacement is the `homelab-ai-fabric-status` card (hourly 08-22, so
  # coverage improves rather than degrades). Two things had to be true first, and
  # both are done in this same change — do not split them:
  #   1. The shared card footer now asks for a FULL REPORT, not a one-line
  #      summary. Without that this retirement swaps a report for a sentence.
  #   2. The card was on hermes_agent_kanban_paused_jobs, which meant the
  #      enqueue script rendered NO selector arm for it: the still-active
  #      `homelab-ai-fabric-status-enqueue` cron fired into the `*)` arm and
  #      logged "unknown selector", creating nothing. Verified on the guest —
  #      the last fabric-status card was created 2026-07-24T12 and none since,
  #      while the deployed script carried exactly one arm (splunk-triage). It
  #      is unpaused below, which is what actually restores the coverage.
  # enabled:false only stops reconcile from re-creating it; the `cron pause`
  # task in tasks/main.yml is what stops the job already on the guest.
  - name: homelab-ai-fabric-status-v2
    schedule: "3 */6 * * *"
    prompt_file: hermes-digest-homelab-ai-fabric-status.md
    skill: ""
    enabled: false
    # The kanban card that takes this job's topic over. Asserted by
    # tests/hermes_agent/test_retired_direct_crons.py: a retirement that names a
    # card must leave that card enabled and NOT on the paused list, or the topic
    # goes silent exactly the way this one nearly did.
    replaced_by_card: "{{ hermes_agent_daily_status_cron_name }}"
  - name: zammad-incident-review-v2
    schedule: "9 13 * * *"
    prompt_file: hermes-digest-zammad-incident-review.md
    skill: dryvist/zammad-incidents
    enabled: true
  - name: github-org-triage-v2
    schedule: "26 8 * * *"
    prompt_file: hermes-digest-github-org-triage.md
    skill: dryvist/github-issues
    enabled: true
  - name: daily-operator-summary-v2
    schedule: "31 12 * * *"
    prompt_file: hermes-digest-daily-operator-summary.md
    skill: ""
    enabled: true
  # Paused, NEVER reconciled: superseded by the script-fed splunk-status-digest
  # (hermes_agent_splunk_status_digest_cron_name), which pauses this LLM digest
  # so the two never double-post. enabled:false keeps this reconcile from
  # re-creating or re-enabling it. See hermes_agent_superseded_digest_cron_name.
  - name: splunk-hourly-digest-v3
    schedule: "52 * * * *"
    prompt_file: hermes-splunk-digest.md
    skill: ""
    enabled: false

# #hermes-all: the channel every Kanban worker posts its completion REPORT to
# (kanban migration, #83). Kanban cards have no native delivery channel, so the
# enqueuer appends a footer telling the worker to post to #hermes-all (channel
# <id>) and then kanban_complete.
#
# The footer used to ask for a ONE-LINE summary, which is why the duplicate
# `*-v2` agentic crons could not simply be switched off: those crons post a full
# report, so retiring one would have downgraded its topic from a report to a
# sentence with nothing saying so. The footer now asks for a full report and
# keeps kanban_complete's summary field one line (the board digest reads it), so
# the card path and the cron path deliver the same thing and a `-v2` retirement
# loses nothing.
#
# This is now its own env lookup rather than an alias of the firehose id. While
# it was an alias, #hermes-all could not be made distinct from the firehose by
# configuration alone — which is why every tier collapsed onto one channel.
# Falls back to the firehose id so an unset var reproduces the old behaviour
# exactly. The value belongs ONLY in the enqueuer footer's `hermes send --to`
# argument — never interpolated into prose a worker reads. Cron/Kanban workers
# get no messaging toolset (see hermes_agent_cron_toolsets), so a body that
# names a destination gives the worker nothing to act on and it emits the
# destination as message text instead. Empty (no firehose either) renders an
# empty --to and the send fails loudly, which is the intended failure.
hermes_agent_slack_hermes_all_channel: >-
  {{ lookup('env', 'SLACK_HERMES_ALL_CHANNEL')
     | default(hermes_agent_slack_firehose_channel, true) }}

# Post scheduled (cron) output as FRESH top-level channel messages, not threaded
# replies under one ever-growing root. Each cron run is already an isolated
# session; this makes its Slack surface match. reply_in_thread=false → flat
# top-level posts; cron_continuable_surface=in_channel → those flat posts stay
# continuable (an in-channel reply continues that run's session) with no thread.
# Rendered into config.yaml's platforms.slack block only when Slack is configured.
hermes_agent_slack_reply_in_thread: false
hermes_agent_slack_cron_continuable_surface: in_channel

# Hourly (waking-hours) Slack status report seeded into Hermes' built-in cron
# scheduler. The role creates the job on converge; the gateway starts executing
# it on the next daemon run once the Slack gateway is configured. Runs at the
# top of every hour from 08:00–22:00 local so there is a fresh heartbeat in
# Slack at least once an hour during waking hours even when nothing else fires
# (the var name keeps "daily" for stability — the schedule is the source of
# truth). Keep the prompt cheap: a short status line, no heavy tool fan-out.
#
# Delta discipline (2026-07-18): every fresh session used to re-post the same
# 4 static status lines every single hour even when nothing changed. Memory
# (already an always-available cron toolset) is the reuse target — no new
# state infrastructure — so the job fingerprints its own findings and checks
# them against its last post before deciding how much to say.
hermes_agent_daily_status_cron_name: homelab-ai-fabric-status
# Post once per local waking hour. The queue-recovery acceptance gate verifies
# the full enqueue-to-Slack path during this window.
hermes_agent_daily_status_cron_schedule: "0 8-22 * * *"
hermes_agent_daily_status_cron_prompt_file: hermes-daily-fabric-status.md

# The catalog body names the checks but not a single endpoint, so the worker
# invented them — and every one it invented was wrong. Measured 2026-07-31: it
# curled localhost:8000 and :8001 for an API that listens on
# hermes_agent_api_server_port and a dashboard on hermes_agent_dashboard_port,
# localhost ports for two services that live behind their own FQDNs, and a
# domain that does not resolve at all. Every probe returned 000, so it posted an
# hourly total-outage alarm while the fabric was healthy (mcp 406, llm 401, both
# the documented healthy codes). That card now reports to the issues channel,
# where the operator asked for near-silence, so fabricated alarms are the one
# failure mode that would make the channel worthless.
#
# Endpoints are topology and must never enter the public prompt catalog, so they
# are appended at converge from the same variables the services are deployed
# from. External front doors are deliberately absent: fabric_watchdog probes mcp
# and llm every 2 minutes with proven ok_codes and alerts to this same channel,
# so duplicating them here would only add a slower, less reliable second opinion.
hermes_agent_daily_status_endpoints: |
  PROBE EXACTLY THESE, AND NOTHING ELSE. Every address you need is listed here.
  Do not guess, infer, complete, or recall a hostname or port from anywhere else
  — an address not on this list is wrong, and a result from one is a fabricated
  finding rather than evidence, however plausible it reads.

  Probe each URL with: curl -sS -o /dev/null -w '%{http_code}' <url>

    gateway process   pgrep -fa hermes-gateway
    gateway API       http://localhost:{{ hermes_agent_api_server_port }}/
    dashboard         http://localhost:{{ hermes_agent_dashboard_port }}/
    memory pool       https://hindsight.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/

  Reading the results. Any HTTP status at all — 200, 302, 401, 403, 404 — means
  the service answered, so it is UP; authentication and routing are not health.
  Only 000 means the probe never reached anything, and 000 is reported as a
  "probe failed" observation, never as a service being down. Never escalate a
  single 000: state what you saw and re-check it next run.

  Do NOT probe the MCP fabric or the LLM front door. fabric_watchdog already
  probes both every 2 minutes and alerts to this same channel on each
  transition, so a second opinion here is slower and would double-report.

# --- Inbound webhook receiver (event-driven agent trigger) ------------------
# The `hermes gateway` webhook platform: an HTTP receiver (/webhooks/<name>,
# HMAC-signed) so any homelab agent/system can trigger Hermes without speaking
# A2A. Traefik fronts it as https://hermes.<sub>/webhooks/<name>; the guest
# firewall opens the port from internal only (modules/firewall in terraform-proxmox).
# The adapter binds 0.0.0.0 by default (Traefik reaches it from another guest).
# Port is DRY from the tofu pipeline constant — never a literal. The global HMAC
# secret is bao-first (group_vars) and injected via .env (WEBHOOK_SECRET), never
# config.yaml; the platform only renders when a secret is present (a route with
# no secret and no global secret fails the adapter at startup, by design).
hermes_agent_webhook_enabled: true
hermes_agent_webhook_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['hermes_webhook']
     | mandatory('tofu_data.constants.service_ports.hermes_webhook missing — regenerate tofu_inventory.json') }}

# The interactive Dashboard is a separate process from the queue-driven gateway.
# It is deliberately non-loopback only when its native OIDC guard is configured;
# Traefik then adds the estate-wide forwardAuth gate at the same hostname.
hermes_agent_dashboard_enabled: true
hermes_agent_dashboard_host: 0.0.0.0
hermes_agent_dashboard_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['hermes_dashboard']
     | mandatory('tofu_data.constants.service_ports.hermes_dashboard missing — regenerate tofu_inventory.json') }}
hermes_agent_dashboard_public_url: "https://hermes.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
hermes_agent_dashboard_oidc_issuer: "https://authelia.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
hermes_agent_dashboard_oidc_client_id: hermes-dashboard

# --- Persona: the shared behavioral base (SOUL.md) ----------------------------
# Deploy templates/SOUL.md.j2 (shared autonomous base prompt + Hermes variant,
# vendored from ai-assistant-instructions agentsmd/prompts/autonomous-base.md)
# over the upstream-default persona. Upstream reloads SOUL.md per message.
# Flip false to hand the file back to manual/agent ownership.
hermes_agent_soul_managed: true

# --- Inbound job-submission API (`api_server` platform) ----------------------
# The `hermes gateway` api_server platform: a bearer-authenticated HTTP API
# (POST /v1/runs enqueues an agent run -> 202 + run_id; /api/jobs is cron CRUD;
# GET /health). The SANCTIONED non-exec path to submit work to the agent — the
# webhook above is event-trigger-only (pre-declared routes, no job submission).
# Traefik fronts it as https://hermes-api.<sub>; the guest firewall opens the
# port from internal only (modules/firewall in terraform-proxmox). Enablement is
# key-presence (empty key = platform off, port closed) — the same contract as
# the Slack tokens; upstream also refuses to start the platform without a key.
# Key is bao-first (group_vars); port DRY from the tofu constant. Upstream
# defaults to a loopback bind, so the non-loopback host below only takes effect
# when the key-gated platform renders at all.
hermes_agent_api_server_key: "{{ lookup('env', 'HERMES_API_SERVER_KEY') | default('', true) }}"
hermes_agent_api_server_host: "0.0.0.0"
hermes_agent_api_server_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['hermes_api']
     | mandatory('tofu_data.constants.service_ports.hermes_api missing — regenerate tofu_inventory.json') }}
# Queue hardening: cap in-flight agent runs across ALL of the platform's
# agent-serving endpoints (/v1/runs, /v1/chat/completions, /v1/responses).
# Upstream reads this from config.yaml (gateway.api_server.max_concurrent_runs)
# and refuses over-cap submissions with 429 + Retry-After — the submitter
# retries, nothing stacks unbounded prefills on the shared brain. Upstream's
# default (10) is sized for cloud brains; ours is a SINGLE serving deployment
# the cron fleet already shares, and the serving tier runs one stream well
# but does not batch (measured 2-stream aggregate ~0.71x of single-stream,
# 2026-07-11 bench). 2 = one operator submission + one background/curriculum
# run in flight; anything more waits at the door, not in the GPU queue.
# 0 would disable the cap entirely — assert.yml forbids that.
# Derived from ai_llm_concurrency (all.yml) so this cap scales with the
# serving tier's admitted concurrency; resolves to 2 at the current value of 1.
hermes_agent_api_max_concurrent_runs: "{{ ai_llm_concurrency | int * 2 }}"

# --- Kanban dispatcher bounds (config.yaml `kanban:` block) -------------------
# Upstream (>=v0.13) runs the board dispatcher inside the gateway BY DEFAULT,
# unbounded (dispatch_in_progress/auto_decompose default true, no concurrency
# cap). These caps bound spawned workers against the same single serving
# deployment as the API cap above (same measured-envelope rationale: one
# stream serves well, 2-stream aggregate ~0.71x, beyond that thrash). Workers
# + API runs + the cron fleet all share that envelope — keep the SUM small.
#
# max_in_progress is the SUM cap across every profile combined. Pinned to 1
# (not upstream's 2) because that is today's EFFECTIVE ceiling: with a single
# profile, max_in_progress_per_profile already limits the board to one worker
# in flight. Naming profiles must not silently raise real concurrency just
# because more assignees now exist — with 3 profiles and this left at 2, the
# global cap would newly permit 2 concurrent workers (one each from two
# profiles), a real increase nothing measured. Raising this back to 2 (cross-
# profile overlap at ~0.71x aggregate) is a documented operator decision made
# AFTER the serving tier proves that capacity — never a side effect of adding
# a profile.
# Both derive from ai_llm_concurrency (all.yml) 1:1 (NOT the x2 relationship
# hermes_agent_api_max_concurrent_runs above uses) so this SUM cap stays
# pinned to the per-profile cap until the operator decision above raises it
# explicitly — a straight ai_llm_concurrency reference cannot silently double
# it the way a x2 derivation would.
hermes_agent_kanban_max_in_progress: "{{ ai_llm_concurrency | int }}"
hermes_agent_kanban_max_in_progress_per_profile: "{{ ai_llm_concurrency | int }}"

# Recurring cards use Hermes' goal loop so a worker that forgets its lifecycle
# call gets a bounded continuation/finalization nudge instead of exiting open.
# goal_mode is load-bearing, NOT optional supervision: the finalize fix
# (workers actually calling kanban_complete via the quiet path,
# tasks/main.yml) is gated on task.goal_mode — disabling it reintroduces the
# "worker exits rc=0 while its card stays running" wedge. Keep it on.
# Keep verdict traffic on the same stable router alias as every other Hermes
# inference path.
# The pinned upstream timeout is only 30 seconds; allow a bounded 60-second
# window so a transient local-model stall does not reject a valid completion.
hermes_agent_kanban_goal_mode: true
# Goal-loop turn budget. A healthy card finalizes on its first turn and never
# spends the budget; only a stuck card burns extra judge turns. This was briefly
# trimmed to 2 (collapse the overlapping retry layers toward the dispatcher) when
# the instant-429 storm made every extra turn a guaranteed 429 block-loop. That
# 429 storm was since eliminated at the serving layer (llama-swap concurrencyLimit
# raised), and the soak measured real per-call latency at 2-5 min: with only 2
# turns a card that needs a genuine continuation is handed to dispatcher retry
# before it can finish its own work. 8 gives a stuck-but-progressing card room to
# finalize while the board failure_limit + max_retries still cap a truly wedged
# card. (Matches the operator's soak tuning, made declarative here.)
hermes_agent_kanban_goal_max_turns: 8
# THIS IS THE REAL JUDGE. It is what config.yaml.j2 renders into
# auxiliary.goal_judge.model, and it is DELIBERATELY pinned to the WORKER
# model, not the `goal-judge` router alias — that is a measured blocker, not
# an oversight, and not the same claim as the old "config drift" pin (#162)
# this comment used to defend. Do not re-flip this without re-measuring.
#
# The design intent IS correct (inventory/group_vars/all.yml:156-170 argues it
# well: same-model judging is self-preference bias, and the serving tier's
# one-in-flight-per-model limit makes worker and judge on the same model
# serialize). `hermes_goal_judge_model` there already names the `goal-judge`
# alias for exactly this reason. The gap was never the design — it was that
# `hermes_agent_kanban_goal_judge_model` (THIS var, the one that actually
# reaches inference) never read it. Repointing `hermes_goal_judge_model`
# itself does nothing on its own: it is consumed by exactly one other thing,
# the llm_router compress-death assert, and confusing the two is the
# "differ by a prefix" trap already made once (2026-07-29).
#
# MEASURED 2026-08 (live, brain healthy) why flipping this today would break
# card judgement:
#  - `goal-judge` IS a live, registered alias (present in /v1/models) — not
#    dead config.
#  - A completion through the alias 502s: "No fallback model group found for
#    original model_group=goal-judge ... Available Model Group Fallbacks=None".
#  - Direct to its backend (mlx-community/Qwen3.5-9B-MLX-4bit) on the Studio
#    loopback, 4 attempts over ~13 min: two 429 "Too many requests", two ~197s
#    empty responses. It never returned a completion in that window.
#  - CORRECTION (2026-08-02): an earlier revision of this block cited the
#    Studio warmup log's climbing cold-load times (0.4s, 35.2s, 79.0s, 79.0s,
#    79.3s) as evidence that THIS model — the judge — was being evicted and
#    re-warmed. That attribution was wrong, and it is worth understanding
#    why, because the trap is still live.
#
#    `goal-judge` NAMES TWO DIFFERENT MODELS depending on which system
#    resolves it:
#      * LiteLLM router (roles/llm_router/defaults/main.yml, model_group_alias)
#        maps goal-judge -> llm_router_small_model = Qwen3.5-9B-MLX-4bit.
#        Hermes talks to the ROUTER, so a Hermes judge call lands on the 9B.
#      * llama-swap on the Studio resolves goal-judge from its OWN alias
#        table, where it is one of the WORKER's aliases (verified live:
#        exactly one occurrence of "goal-judge" in the deployed
#        llama-swap.json, in Qwen3.6-35B-A3B-4bit's alias list, ttl=0; the 9B
#        has aliases:null and is reachable only by physical id).
#
#    nix-ai's warmup sends {"model": "goal-judge"} to llama-swap, so those
#    warm timings are the WORKER being repeatedly cold-loaded, not the judge.
#    Their real cause was an uncapped cluster-link stand-down loop force-
#    reloading the resident (Vikunja 1015, Zammad 17184).
#
#    The CONCLUSION below is unaffected — it rests on the router-side
#    measurements above, which were taken through the alias Hermes actually
#    uses — but do not cite the warmup log as judge evidence again.
#  - Root cause: the deployed llama-swap config (nix-ai
#    modules/mlx/llama-swap-topology.nix) has the WORKER
#    (Qwen3.6-35B-A3B-4bit) pinned resident (ttl=0) and the JUDGE
#    (Qwen3.5-9B-MLX-4bit) as the evictable swap-class member (ttl=900) — the
#    opposite of what roles/llm_router/defaults/main.yml's comment claimed
#    ("the 9B is always up for the judge"; corrected there in this same
#    change). A ~79s cold load against
#    hermes_agent_kanban_goal_judge_timeout_seconds (60s) means the FIRST
#    judge call after any eviction fails outright; auxiliary.transient_retries
#    (1) might catch a second attempt, but the measured runs above show it
#    isn't even reliably getting a completion within several retries.
#
# EXACT PRECONDITION to flip this line to "{{ hermes_goal_judge_model }}":
# a nix-ai module change (Phase B, needs darwin-rebuild — NOT something this
# Ansible-only repo can fix), THEN re-measure, THEN this flip and a raised
# hermes_agent_kanban_goal_judge_timeout_seconds land IN THE SAME CHANGE. Do
# not do either half alone:
#  - Raising the timeout WITHOUT the flip is dead config today — the judge
#    still resolves to hermes_agent_model (ttl=0, no cold load), so there is
#    nothing for a raised timeout to protect. Don't add it speculatively.
#  - Flipping WITHOUT a residency fix breaks judging (measured above).
#  - Residency itself is NOT a value flip. Read: nix-ai's
#    alwaysAvailableModels option is documented as an on-demand swap tier
#    BESIDE the one ttl=0 resident — there is no existing option to pin a
#    SECOND model resident. Giving the judge real residency is new nix-ai
#    module/option work, not a config change.
#  - Even a correctly-raised timeout only makes the judge WORK, not FAST: at
#    the ~2-3 goal cards/hour this fabric drains (#162), the judge model
#    will keep evicting between cards on today's ttl=900, so nearly every
#    judge call would still pay the full cold-load tax. Residency is the
#    actual fix for throughput; a timeout raise alone is a correctness
#    patch, not the solution — don't mistake one for the other.
hermes_agent_kanban_goal_judge_model: "{{ hermes_agent_model }}"
hermes_agent_kanban_goal_judge_timeout_seconds: 60
# --- Memory: best self-hostable as of June 2026 (Agy-validated) ---
# Hindsight: local knowledge-graph + multi-strategy retrieval. Runs alongside the
# always-on built-in MEMORY.md/USER.md. The whole HERMES_HOME is the durable surface.
# The provider name alone is NOT enough: hindsight defaults to CLOUD mode, and
# with no HINDSIGHT_API_KEY its is_available() returns false — every memory
# tool call warns "Memory is not available" (the recurring digest warning).
# local_embedded runs the daemon in-guest (hindsight-all, ~200 MB, installed
# below) and needs an LLM for entity extraction — pointed at the same router
# alias the agent brain uses, so memory never adds an external dependency.
hermes_agent_memory_provider: hindsight
# local_external: the plugin dials the standalone HA Hindsight service (two
# stateless replicas behind the Traefik pool) instead of running the embedded
# daemon in-guest. The upstream plugin's mode set is
# {cloud, local_embedded, local_external}; local_external takes api_url (+
# optional api_key — omitted here: the API is unauthenticated inside the
# default-deny firewall). local_embedded remains supported for rollback.
hermes_agent_memory_mode: local_external
hermes_agent_memory_api_url: >-
  https://hindsight.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN required (Doppler)') }}
hermes_agent_memory_llm_model: "{{ hermes_brain_model }}"
# The gateway's hindsight plugin hard-pins this client version and its lazy
# pip-install can never succeed in the venv (no pip/ensurepip) — with
# hindsight-all's newer client resolved, every memory call fails "Memory is
# not available". Pin what the plugin pins; bump with the hermes-agent package.
# Verified 2026-07-31 against the pinned hermes-agent v2026.7.7.2 plugin
# source: _MIN_CLIENT_VERSION == "0.6.1", so this pin exactly satisfies the
# plugin's own >=0.6.1 check and its auto-upgrade-on-mismatch code path (which
# would hit the same broken lazy pip-install) never triggers.
hermes_agent_hindsight_client_pin: "==0.6.1"

# --- Memory resilience: what actually happens when Hindsight is down ---------
# Read directly from the pinned plugin source (plugins/memory/hindsight/
# __init__.py in NousResearch/hermes-agent@v2026.7.7.2) — do not assume
# behavior from upstream docs, they don't describe local_external's failure
# path. Two real gaps, one non-gap:
#  - is_available() is a NO-OP for local_external mode: it unconditionally
#    returns True without ever contacting the service. Hermes has no built-in
#    way to know Hindsight is down short of an actual memory call failing.
#  - Auto-recall (the per-turn prefetch injected into context before the
#    model sees the user's message) runs on a background thread and is
#    genuinely silent on failure: `logger.debug("Hindsight prefetch failed:
#    %s", ...)` and returns "". Recall degrades to "no memories" with no
#    signal to the agent or the operator beyond a DEBUG log line — this is
#    the failure mode fabric_watchdog's new `hindsight` target (see
#    roles/fabric_watchdog/defaults/main.yml) exists to catch actively
#    instead of relying on someone noticing recall going quiet.
#  - Auto-retain (the background writer draining sync_turn's queue) logs
#    failures at WARNING (visible in Splunk at our DEBUG log level) but does
#    not retry and does not propagate — a dropped retain during an outage is
#    permanently lost, not queued for replay.
#  - Non-gap: explicit tool calls (hindsight_recall/_retain/_reflect, when the
#    model invokes them directly) DO surface failures — handle_tool_call
#    catches the exception and returns tool_error(...), which the agent sees
#    as a failed tool call, not silence.
#  - `_run_hindsight_operation`'s one-retry-after-reconnect logic is
#    local_embedded-only (recovers from the embedded daemon's idle-shutdown);
#    it never fires for local_external, so a transient 5xx/timeout against the
#    standalone service gets zero retries anywhere in this call chain.
# All of the above lives in the upstream pip package, not this repo — fixing
# it means patching/forking hermes-agent. The available lever here is making
# an outage IMPOSSIBLE to miss (fabric_watchdog) rather than patching a
# dependency we don't own.

# --- Logging: config.yaml `logging.level` (installed hermes-agent's
# hermes_logging.py reads cfg["logging"]["level"], default "INFO" if unset).
# DEBUG (not the noisier "trace" — hermes-agent has no such level) so the
# rsyslog->Cribl->Splunk index=hermes chain carries pre-error context and
# config-at-point-in-time lines. rsyslog forwards by programname ('hermes'),
# unaffected by log level, so this only raises event volume, not routing —
# index=hermes runs ~1.3k events/4h at INFO; expect a multiple of that at
# DEBUG (Splunk ingestion has headroom; noted here for visibility).
hermes_agent_log_level: DEBUG

# --- Safety: cap the agentic loop so a runaway can't pin the GPU overnight ---
hermes_agent_max_turns: 90

# --- Runner-enforced per-job-class tool policy (H-17) -------------------------
# The RUNNER (upstream toolset resolution), not the prompt, decides which tools
# each job class may load — injected text in a job's input can rewrite
# instructions, but it cannot widen a toolset list the runner never registered.
# Three layers, all plain data rendered into config.yaml; toolset names are the
# upstream configurable keys (hermes_cli/tools_config.py CONFIGURABLE_TOOLSETS,
# verified against the pinned hermes_agent_version):
#
#  1. agent.disabled_toolsets — the GLOBAL deny floor. Applies to every agent
#     the gateway spawns and cannot be widened back by any per-job or
#     per-platform allowlist (upstream layers it on top of per-job lists —
#     cron/scheduler.py, upstream #25752). Entries here are capabilities no
#     job class on this platform uses: media generation/analysis, desktop
#     control, and messaging/media integrations that are not deployed.
#  2. platform_toolsets.api_server — allowlist for API-submitted runs. The
#     API's `input` (and everything a run retrieves) is untrusted text; this
#     bounds what an injected instruction can reach. Deliberately ABSENT:
#     `cronjob` (an injected one-off run must not schedule persistent jobs),
#     `browser` (the widest tool attack surface; the `web` toolset covers
#     research), `delegation` (cost amplification), `kanban` (same cost-
#     amplification shape — an injected run must not file board cards that
#     spawn workers), and `clarify` (headless).
#     Enabled MCP servers (splunk/context7/codex) are layered on by upstream's
#     platform-tools semantics — the allowlist scopes native toolsets only.
#  3. platform_toolsets.cron — allowlist for the scheduled fleet, same shape,
#     PLUS `kanban`: role-authored cron probes may file board cards
#     (kanban_create) for follow-up work they cannot finish in-run — that is
#     the deliberate card-creation surface feeding the bounded dispatcher
#     (kanban: block in config.yaml.j2). The toolset is upstream-opt-in
#     (never included by `all`/`*`), so naming it here is the only grant.
#     Upstream additionally hard-disables cronjob/messaging/clarify in every
#     cron context regardless of this list.
#  4. platform_toolsets.slack — allowlist for the interactive Slack surface
#     (operator-driven, allowed-users gate). Previously UNLISTED, which meant
#     it inherited the upstream platform default minus only the global deny
#     floor — a strictly WIDER envelope than either job class above, including
#     `cronjob`/`browser`/`delegation` that both refuse. Those three exclusion
#     rationales are about the CAPABILITY, not about input being untrusted API
#     text: `cronjob` is a persistence/backdoor risk regardless of who asked,
#     `browser` is the widest attack surface (indirect injection from a
#     fetched page is the same risk whether the fetch was triggered by an API
#     payload or a Slack message), and `delegation` is cost amplification
#     either way. So Slack gets the same base as cron_toolsets (kanban
#     included — the Vikunja bridge already treats operator-driven card
#     creation as sanctioned) PLUS `clarify`: cron/api_server exclude it only
#     because they are headless (no one to answer), which does not apply to
#     an interactive human-in-the-loop surface, and it has no side effect.
hermes_agent_disabled_toolsets:
  - image_gen
  - video_gen
  - video
  - tts
  - x_search
  - computer_use
  - homeassistant
  - spotify
  - discord
  - discord_admin
  - yuanbao
hermes_agent_api_server_toolsets:
  - web
  - terminal
  - file
  - code_execution
  - skills
  - todo
  - memory
  - context_engine
  - session_search
hermes_agent_cron_toolsets: "{{ hermes_agent_api_server_toolsets + ['kanban'] }}"
hermes_agent_slack_toolsets: "{{ hermes_agent_cron_toolsets + ['clarify'] }}"

# Pinned to UTC (workspace policy: no custom timezones), independent of the
# target host's configured zone.
hermes_agent_timezone: "UTC"

# --- Observability: bundled OTLP/HTTP plugin (Cribl Edge fan-out) -----------
hermes_agent_otel_endpoint: "{{ ai_orchestration_otel_endpoint }}"
hermes_agent_otel_service_name: hermes-agent
hermes_agent_otel_timeout: 5

# systemd ExecStart: the long-running gateway daemon. It drives the built-in cron
# scheduler + the Kanban dispatcher even with no messaging platform configured.
# `gateway start` is for interactive/manual use — it shells out to manage its
# own systemd/launchd service and requires root when no user session is
# present ("System gateway start requires root"). `gateway run --replace` is
# the foreground-supervised form the CLI's own --help calls out as "useful for
# systemd" — it runs in-process under our unit instead of trying to manage one.
hermes_agent_gateway_cmd: "{{ hermes_agent_bin }} gateway run --replace"

# --- llm-wiki knowledge base ---
hermes_agent_wiki_enabled: true
hermes_agent_wiki_path: "{{ hermes_agent_home }}/wiki"
hermes_agent_context_compression_enabled: true
hermes_agent_context_compression_threshold: 0.75
hermes_agent_nightly_wiki_cron_name: hermes-nightly-wiki
hermes_agent_nightly_wiki_cron_schedule: "0 2 * * *"
hermes_agent_nightly_wiki_cron_prompt_file: hermes-nightly-wiki-health.md

# --- autonomous GitHub docs-contributor ---
hermes_agent_github_app_id: ""
hermes_agent_github_app_installation_id: ""
hermes_agent_github_app_private_key: ""

# --- GitHub issues + org projects PAT (fine-grained) ---
# Grants read/write GitHub Issues across ALL repos and read/write Projects (v2)
# in the dryvist org — for triaging/creating/updating issues and managing project
# boards. NOT for code commits (that is the signed docs-pr / GitHub App path) and
# NOT for merges. Bao-first (local-llm domain, secret/ai/hermes), env fallback
# (see group_vars); empty until the token is present. The bundled
# dryvist/github-issues skill documents how the agent should use it.
hermes_agent_github_issues_pat: ""

# --- GitHub security-alert read token (for the bot-PR triage job) ---
# Read-only. Reads code-scanning + Dependabot alerts and PR files/diffs across
# all repos (security_events:read, vulnerability_alerts:read, contents:read,
# pull_requests:read). Separate from the issues PAT, which supplies the label
# WRITE. The bot-pr-triage card gates on BOTH tokens. Bao-first, env fallback
# (see group_vars); empty until seeded — the card stays disabled until then.
hermes_agent_github_alerts_token: ""

# --- Splunk MCP client (read/search access to the SIEM) ---
# Registers the Splunk MCP Server as an HTTP MCP server in config.yaml so Hermes
# can query the environment (run_splunk_query, get_indexes, ...) with its own
# scoped token. Dialed through the shared agentgateway MCP plane (one governed
# front door per target; the gateway federates to the Splunk MCP Server), same
# posture as the context7/docs routes below — the URL is the gateway route,
# not a secret. The scoped bearer token stays bao-first (see group_vars) and is
# the remaining credential; empty until seeded, so queries simply fail to
# authenticate until then while the agent still starts cleanly.
hermes_agent_splunk_mcp_enabled: true
hermes_agent_splunk_mcp_url: >-
  https://mcp.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN required (Doppler)') }}/splunk
hermes_agent_splunk_mcp_token: ""

# Zammad ITSM client (dryvist/zammad-incidents skill — the incident-management
# system of record). Bao-first, env fallback (see group_vars). An empty URL or
# token means the skill simply has nothing to call until Zammad is deployed and
# its API token is seeded; the agent still starts cleanly.
hermes_agent_zammad_url: ""
hermes_agent_zammad_api_token: ""

# Zammad stale-ticket auto-close. Brought under role management from a
# hand-placed script (/var/lib/hermes/scripts/zammad-auto-close.py) that carried
# a CLEARTEXT API token and the internal hostname literal — both removed; the
# managed script sources ZAMMAD_URL + ZAMMAD_API_TOKEN from .env at runtime.
# Wired as a --no-agent --script cron but DISABLED by default: it mutates ticket
# state (closes state=new tickets untouched > N days), so enable only after a
# live dry-run confirms the search/close behavior against this Zammad instance.
# The previously-hardcoded token should be rotated. Closures deliver to Slack for
# auditability; the script is silent on a run that closes nothing.
hermes_agent_zammad_autoclose_enabled: false
hermes_agent_zammad_autoclose_cron_name: zammad-auto-close
# Daily at :17 past 05h — staggered clear of the other cron minutes.
hermes_agent_zammad_autoclose_schedule: "17 5 * * *"
hermes_agent_zammad_autoclose_script_name: zammad-auto-close.py
hermes_agent_zammad_autoclose_days: 7

# --- Splunk monitor: 24/7 self-directed SIEM analyst -----------------------
# Seeds a small fleet of Hermes cron jobs, each carrying the dryvist/splunk-monitor
# skill. That skill encodes the HARD query-safety rails (bounded queries only —
# tstats/stats/head, narrow time windows) plus a self-directed investigative
# method: Hermes decides what to hunt for, remembers baselines, and alerts only on
# confirmed anomalies. Every cron job runs in a FRESH isolated agent session, so
# context never builds up run-to-run.
#
# Routing (user decision): anomaly alerts DM the operator, the routine digest
# posts to the Slack home channel. Delivery of anomaly jobs is suppressed
# whenever the run ends in the `[SILENT]` marker (skill contract), so a normal
# run costs zero notifications.
#
# Gated (in tasks) on BOTH the Splunk MCP URL being set (can query) AND the Slack
# tokens being set (can deliver) — a job that can't do both is never created.
hermes_agent_splunk_monitor_enabled: true

# Dedicated channel for the splunk-admin domain. NEVER hardcoded: it comes from
# the environment like every other channel id, and defaults to EMPTY so every
# consumer below falls back to its previous target until an id is configured.
hermes_agent_slack_splunk_channel: >-
  {{ lookup('env', 'SLACK_HERMES_SPLUNK_CHANNEL') | default('', true) }}

# Per-job cron definitions. Prompts stay short — the skill carries the discipline;
# the prompt only sets each run's posture (a lens, not a checklist) and reinforces
# the [SILENT]-unless-anomaly / always-deliver-the-digest delivery contract.
# Minutes are staggered so no two monitoring runs fire in the same minute
# (bounds concurrent load on the shared LLM serving tier).
#
# Cadence calmed 2026-07-16 (operator decision): the old fleet (triage every
# 15 min, security 2x/hr, parsing+digest hourly) generated most of the
# concurrent load on the single serving engine — the load that triggered the
# legacy vllm-mlx batch-scheduler wedge (nix-ai#1234; backend now disabled)
# and the llama-swap 429 bursts.
# Homelab triage does not need 15-minute latency; ~85% fewer LLM calls with
# zero overlapping start minutes.
hermes_agent_splunk_triage_cron_name: splunk-triage
hermes_agent_splunk_triage_cron_schedule: "7 * * * *"
hermes_agent_splunk_triage_cron_prompt_file: hermes-splunk-triage.md

