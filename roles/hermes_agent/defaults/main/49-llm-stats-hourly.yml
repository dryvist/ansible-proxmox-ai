---
# --- Hourly local-LLM stats report -------------------------------------------
# One open-ended agentic direct cron under the splunk-admin profile. The prompt
# carries the whole protocol: sources, "llm-stats:" memory keys, feedback.
#
# Minute 54 is one no other job in this table starts on
# (tests/hermes_agent/test_cron_stagger.py).
hermes_agent_llm_stats_hourly_enabled: true
hermes_agent_llm_stats_hourly_cron_name: llm-stats-hourly
hermes_agent_llm_stats_hourly_cron_schedule: "54 * * * *"
hermes_agent_llm_stats_hourly_cron_prompt: >-
  Hourly local-LLM stats report for the homelab. The cron platform posts this
  run's final response to the Slack channel automatically; that final response
  IS the report. Never call a send or post tool; never end with a status line.
  Report whatever best shows how the local LLM stack is doing right now and how
  that moved over time. You choose the stats; the operator's feedback (below)
  steers what you keep, drop and add.


  WHAT TO LOOK FOR. The LLM router (LiteLLM): requests, tokens in and out,
  error and 429 rate, fallback activity, latency and cost class, split by model
  and by the backend host that served it. The serving backends: which host is
  running which model, throughput, saturation, restarts. Hermes itself: model
  calls, tokens, job outcomes and failures. The hypervisor nodes hosting all of
  it: node health, load, memory, storage, anything degraded. Always show tokens
  over time (this hour against the last 24 hours and against your recalled
  baseline) and name the host behind every number. Prefer the trend and the
  change to a static snapshot, and lead with whatever moved materially.


  WHERE TO LOOK. First recall llm-stats:baselines and llm-stats:sources. Use at
  most 10 splunk_run_query calls in this run; reuse remembered bounded queries
  and query only the highest-value current changes. Use a narrow time window and
  stats or tstats; never run an unbounded search or enumerate every index. After
  two failed calls to splunk_run_query, including timeouts, stop all Splunk
  queries for this run; do not retry with a changed query. Publish a partial
  report using recalled baselines, label them "recalled baseline," and never
  present them as current observations. Include one "Gaps:" line naming
  unavailable current metrics and their needed sources. Never invent a current
  value.


  MEMORY. Never use the built-in `memory` tool in any turn. On a report run,
  at the start make ONE `hindsight_recall` call with a query covering
  "llm-stats:baselines", "llm-stats:sources", "llm-stats:feedback" and
  "llm-stats:last". Baselines hold typical per-model and per-host token rates,
  latencies, error rates and serving hosts; sources hold working queries and
  dead ends; feedback holds dated operator guidance; last holds prior headline
  numbers for deltas. On a report run, save only with ONE `hindsight_retain`
  call before writing the final response, using compact dated entries to update
  these keys and consolidate baselines and sources. The final response (the
  report) is the last thing this run produces. If recall errors or
  times out, do not retry; continue with no baseline, say "no recalled baseline", and
  name memory in "Gaps:". If retain errors, do not retry; mention the failed
  save in "Gaps:". If recall returns nothing, say this is a first run and build
  the baseline.


  TOOL CALLS. Call each tool directly, one tool per call; never batch calls.
  Do not use `execute_code`, `terminal` or file-search tools. Do not use
  `tool_call` batching. Do not look up sourcetypes with a catalog tool; use
  remembered queries.
  Make at most 25 tool calls in total, including memory and Splunk calls. At
  call 20, stop gathering and prepare the final report.


  FEEDBACK. Feedback turns are separate from report runs. Operators react to
  your report or reply in its thread. A later turn
  such as "reaction:added:👍", "reaction:added:👎" or any other emoji, or a
  human reply, is feedback on that report. Make ONE `hindsight_retain` call to
  save a dated "llm-stats:feedback" line naming the sections that report had;
  then answer with one short acknowledgement. A thumbs up means keep doing
  that; a thumbs down or a critical reply means change it. Follow
  "llm-stats:feedback" over these defaults.


  FORMAT. Slack mrkdwn, scannable: a one-line headline with the single most
  important change, then short sections with numbers, host names and deltas,
  then one "Gaps:" line for unavailable current metrics. No preamble, no sign-off,
  no restating this task. Finish within 15 minutes, including automatic report
  delivery and memory updates. Stop querying by minute 10 and reserve the final
  5 minutes to synthesize the report and save memory before writing the final
  response. You only observe and report: never change, restart or reconfigure
  anything.

hermes_agent_direct_cron_jobs_llm_stats:
  - name: "{{ hermes_agent_llm_stats_hourly_cron_name }}"
    system: splunk
    schedule: "{{ hermes_agent_llm_stats_hourly_cron_schedule }}"
    prompt_var: hermes_agent_llm_stats_hourly_cron_prompt
    skill: dryvist/splunk-monitor
    deliver: >-
      slack:{{ hermes_agent_slack_splunk_channel
               | default(hermes_agent_slack_hermes_all_channel, true) }}
    hermes_home: "{{ hermes_agent_hermes_home }}/profiles/splunk-admin"
    enabled: >-
      {{ hermes_agent_llm_stats_hourly_enabled | bool
         and hermes_agent_splunk_monitor_enabled | bool
         and hermes_agent_splunk_mcp_url | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
