---
# --- Hourly local-LLM stats report -------------------------------------------
# One open-ended agentic direct cron under the splunk-admin profile. The prompt
# carries the whole protocol: sources, "llm-stats:" memory keys, feedback.
#
# Minute 54 is one no other job in this table starts on
# (tests/hermes_agent/test_cron_stagger.py).
hermes_agent_llm_stats_hourly_enabled: true
hermes_agent_llm_stats_hourly_cron_name: llm-stats-hourly
hermes_agent_llm_stats_hourly_cron_schedule: "54 * * * *"
hermes_agent_llm_stats_hourly_cron_prompt: >-
  Hourly local-LLM stats report for the homelab. The cron platform posts this
  run's final response to the Slack channel automatically; that final response
  IS the report. Never call a send or post tool; never end with a status line.
  Report whatever best shows how the local LLM stack is doing right now and how
  that moved over time. You choose the stats; the operator's feedback (below)
  steers what you keep, drop and add.


  WHAT TO LOOK FOR. The LLM router (LiteLLM): requests, tokens in and out,
  error and 429 rate, fallback activity, latency and cost class, split by model
  and by the backend host that served it. The serving backends: which host is
  running which model, throughput, saturation, restarts. Hermes itself: model
  calls, tokens, job outcomes and failures. The hypervisor nodes hosting all of
  it: node health, load, memory, storage, anything degraded. Always show tokens
  over time (this hour against the last 24 hours and against your recalled
  baseline) and name the host behind every number. Prefer the trend and the
  change to a static snapshot, and lead with whatever moved materially.


  WHERE TO LOOK. First recall llm-stats:baselines and llm-stats:sources. Run
  these six seed queries first, in order, exactly as written; change only the
  earliest= value or add a narrower where when recalled llm-stats:sources say to.
  Remembered queries may add to them but never replace them. Use at most 10
  splunk_run_query calls in this run. Use a narrow time window; never run an
  unbounded search or enumerate every index. After two failed calls to
  splunk_run_query, including timeouts, stop all Splunk queries for this run; do
  not retry with a changed query. A call that returns zero rows is not a failure;
  only an error counts toward the two-failure stop. Publish a partial report
  using recalled baselines, label them "recalled baseline," and never present
  them as current observations. Include one "Gaps:" line naming unavailable
  current metrics and their needed sources. Never invent a current value.


  SEED QUERIES.
  Q1 freshness per sourcetype: | tstats count AS events latest(_time) AS last_epoch WHERE index=llm earliest=-24h BY
  sourcetype | eval last_seen=strftime(last_epoch,"%F %T"), age_min=floor((now()-last_epoch)/60) | fields sourcetype
  events last_seen age_min | sort 0 - events
  Q2 hourly tokens and requests by model group: search index=llm sourcetype="litellm:proxy" earliest=-24h llm_request
  | dedup _raw | rex field=_raw "litellm\[\d+\]: (?<j>\{.*\})" | spath input=j | eval pt=tonumber(prompt_tokens),
  ct=tonumber(completion_tokens) | bin _time span=1h | stats sum(pt) AS prompt_tokens sum(ct) AS completion_tokens
  count AS requests BY _time model_group | sort 0 - _time model_group | eval hour=strftime(_time,"%m-%d %H:00") |
  fields hour model_group requests prompt_tokens completion_tokens
  Q3 same by serving host with success/failure: search index=llm sourcetype="litellm:proxy" earliest=-24h llm_request
  | dedup _raw | rex field=_raw "litellm\[\d+\]: (?<j>\{.*\})" | spath input=j | eval pt=tonumber(prompt_tokens),
  ct=tonumber(completion_tokens), serving_host=if(isnull(api_base) OR api_base IN
  ("","null"),"(none)",replace(replace(api_base,"^https?://",""),"[:/].*$","")), ok=if(status="success",1,0),
  bad=1-ok | bin _time span=1h | stats sum(ok) AS success sum(bad) AS failure count AS requests sum(pt) AS
  prompt_tokens sum(ct) AS completion_tokens BY _time serving_host | eval
  failure_pct=floor(1000*failure/requests)/10, hour=strftime(_time,"%m-%d %H:00") | sort 0 - _time serving_host |
  fields hour serving_host requests success failure failure_pct prompt_tokens completion_tokens
  Q4 errors by serving host and kind: search index=llm sourcetype="litellm:proxy" earliest=-24h llm_request | dedup
  _raw | rex field=_raw "litellm\[\d+\]: (?<j>\{.*\})" | spath input=j | eval serving_host=if(isnull(api_base) OR
  api_base IN ("","null"),"(none)",replace(replace(api_base,"^https?://",""),"[:/].*$","")) | where error_class!="" |
  eval kind=case(error_class IN ("RateLimitError","RouterRateLimitError"),"429", error_class IN
  ("Timeout","ReadTimeout"),"timeout", true(),"other") | stats count AS errors BY serving_host kind error_class |
  sort 0 - errors
  Q5 which host serves which model group now: search index=llm sourcetype="litellm:proxy" earliest=-1h llm_request |
  dedup _raw | rex field=_raw "litellm\[\d+\]: (?<j>\{.*\})" | spath input=j | where status="success" | eval
  serving_host=if(isnull(api_base) OR api_base IN
  ("","null"),"(none)",replace(replace(api_base,"^https?://",""),"[:/].*$","")) | stats count AS requests
  latest(_time) AS last_epoch BY model_group model serving_host | eval last_seen=strftime(last_epoch,"%T") | sort 0 -
  requests | fields model_group model serving_host requests last_seen
  Q6 Hermes API calls per host, profile and model group: search index=hermes earliest=-24h "API call #" | dedup _raw
  | rex field=_raw "^<\d+>\w+\s+\d+\s+[\d:]+\s+\S+\s+(?<profile>\S+)\s" | rex field=_raw "API call #(?<n>\d+):
  model=(?<model_group>\S+) provider=\S+ in=(?<tok_in>\d+) out=(?<tok_out>\d+)" | where isnotnull(n) | bin _time
  span=1h | stats count AS api_calls sum(tok_in) AS tokens_in sum(tok_out) AS tokens_out BY _time host profile
  model_group | eval hour=strftime(_time,"%m-%d %H:00") | sort 0 - _time host profile model_group | fields hour host
  profile model_group api_calls tokens_in tokens_out
  Per-request records are litellm:proxy lines with syslog-wrapped JSON, so
  fields are not auto-extracted and rex then spath is required. status=success
  in the base search returns zero rows, so filter after spath. On failures,
  api_base is the JSON string "null" and is shown as "(none)". dedup _raw
  removes doubled forwarded lines. Never use round(avg()) or countdistinct/dc
  inside a stats argument list; compute with eval afterwards. A tstats search
  must start with tstats.

  Turn the rows into the report: show prompt and completion tokens per hour for
  the last 24 hours by model group and serving host, comparing this hour with the
  previous 24 hours and the recalled baseline; show failure percentage per
  serving host; count errors split into 429, timeout and other; identify which
  host serves each model group now; and show Hermes API calls per host, profile
  and model group. Keep the "Gaps:" line only for genuinely unavailable metrics,
  never for metrics these queries provide.


  MEMORY. Never use the built-in `memory` tool in any turn. On a report run,
  at the start make ONE `hindsight_recall` call with a query covering
  "llm-stats:baselines", "llm-stats:sources", "llm-stats:feedback" and
  "llm-stats:last". Baselines hold typical per-model and per-host token rates,
  latencies, error rates and serving hosts; sources hold working queries and
  dead ends; feedback holds dated operator guidance; last holds prior headline
  numbers for deltas. On a report run, save only with ONE `hindsight_retain`
  call before writing the final response, using compact dated entries to update
  these keys and consolidate baselines and sources. The final response (the
  report) is the last thing this run produces. If recall errors or
  times out, do not retry; continue with no baseline, say "no recalled baseline", and
  name memory in "Gaps:". If retain errors, do not retry; mention the failed
  save in "Gaps:". If recall returns nothing, say this is a first run and build
  the baseline.


  TOOL CALLS. Call each tool directly, one tool per call; never batch calls.
  Do not use `execute_code`, `terminal` or file-search tools. Do not use
  `tool_call` batching. Do not look up sourcetypes with a catalog tool; use
  remembered queries.
  Make at most 25 tool calls in total, including memory and Splunk calls. At
  call 20, stop gathering and prepare the final report.


  FEEDBACK. Feedback turns are separate from report runs. Operators react to
  your report or reply in its thread. A later turn
  such as "reaction:added:👍", "reaction:added:👎" or any other emoji, or a
  human reply, is feedback on that report. Make ONE `hindsight_retain` call to
  save a dated "llm-stats:feedback" line naming the sections that report had;
  then answer with one short acknowledgement. A thumbs up means keep doing
  that; a thumbs down or a critical reply means change it. Follow
  "llm-stats:feedback" over these defaults.


  FORMAT. Slack mrkdwn, scannable: a one-line headline with the single most
  important change, then short sections with numbers, host names and deltas,
  then one "Gaps:" line for unavailable current metrics. No preamble, no sign-off,
  no restating this task. Finish within 15 minutes, including automatic report
  delivery and memory updates. Stop querying by minute 10 and reserve the final
  5 minutes to synthesize the report and save memory before writing the final
  response. You only observe and report: never change, restart or reconfigure
  anything.

hermes_agent_direct_cron_jobs_llm_stats:
  - name: "{{ hermes_agent_llm_stats_hourly_cron_name }}"
    system: splunk
    schedule: "{{ hermes_agent_llm_stats_hourly_cron_schedule }}"
    prompt_var: hermes_agent_llm_stats_hourly_cron_prompt
    skill: dryvist/splunk-monitor
    deliver: >-
      slack:{{ hermes_agent_slack_splunk_channel
               | default(hermes_agent_slack_hermes_all_channel, true) }}
    hermes_home: "{{ hermes_agent_hermes_home }}/profiles/splunk-admin"
    enabled: >-
      {{ hermes_agent_llm_stats_hourly_enabled | bool
         and hermes_agent_splunk_monitor_enabled | bool
         and hermes_agent_splunk_mcp_url | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
