---
hermes_agent_profiles:
  - name: splunk-admin
    description: Read-only SIEM analyst (bounded SPL, alert + report, no remediation)
    mcp: [splunk, docs]
    env: [splunk]
    skills: [dryvist/splunk-monitor]
    # Optional per-profile Hindsight bank; the default is the agent bank.
    memory_bank_id: "{{ hermes_agent_splunk_memory_bank_id }}"
    toolsets:
      cron: []
    soul_addendum_bundle: true
  - name: homelab-admin
    description: Incident lifecycle + fabric health (evidence-before-resolve)
    mcp: [docs]                     # nautobot once its gateway route goes live
    env: [zammad, homeassistant]
    skills: [dryvist/zammad-incidents]
    # Own bank, not the agent bank that the default profile shares.
    memory_bank_id: "{{ hermes_agent_memory_bank_id ~ '-homelab-admin' }}"
    # Home Assistant plugin and its toolset; each takes effect only while open (155-plugins.yml).
    plugins: [homeassistant]
    enable_toolsets: [homeassistant]
    toolsets:
      cron: []
    soul_addendum_bundle: true
  - name: github-maint
    description: Read-only repository-maintenance analyst (proposals out-of-band, no repo writes)
    # grep: literal code search over public GitHub. Scoped to this profile
    # alone — a repository-maintenance analyst is the one that needs to see how
    # other projects solved something; the SIEM and incident profiles do not,
    # and profiles are bounded by what they must NOT reach.
    mcp: [docs, grep]
    env: [github]
    skills: [dryvist/github-issues]
    # Own bank, not the agent bank that the default profile shares.
    memory_bank_id: "{{ hermes_agent_memory_bank_id ~ '-github-maint' }}"
    toolsets:
      cron: []
    soul_addendum_bundle: true
  - name: tracker-reporter
    description: Read-only tracker reporter (grouped, change-only task and incident summaries)
    # zammad: the router's read-only incident tool server, called with this profile's own router key.
    mcp: [vikunja, zammad]
    env: []
    skills: []
    # Own bank: the reporter remembers what it last said per channel.
    memory_bank_id: "{{ hermes_agent_memory_bank_id ~ '-tracker-reporter' }}"
    toolsets:
      cron: []
    soul_addendum_file: soul-tracker-reporter.md.j2
  - name: vikunja-pm
    description: Vikunja task expert (finds, files, updates, labels, relates and comments on tasks; never deletes)
    # vikunja_write: the router's Vikunja write tier, called with this profile's own router key.
    mcp: [vikunja_write]
    env: []
    skills: []
    memory_bank_id: "{{ hermes_agent_memory_bank_id ~ '-vikunja-pm' }}"
    soul_addendum_file: soul-vikunja-pm.md.j2
    # Served on the gateway A2A listener under /vikunja-pm.
    a2a:
      name: Vikunja task expert
      advertised_toolsets: [vikunja_write]
  - name: youtrack-clerk
    description: Narrow tracker agent for YouTrack requests
    mcp: [youtrack_write]
    locked: true
    feature_gate: llm_router_hermes_youtrack_clerk_key_enabled
    soul_standalone_file: youtrack-clerk.soul.md
    memory_bank_id: "{{ hermes_agent_memory_bank_id ~ '-youtrack-clerk' }}"
  - name: vikunja-clerk
    description: Narrow tracker agent for Vikunja task requests
    # vikunja_clerk: the router's own tier for this profile (tasks, read-only projects and labels, no delete).
    mcp: [vikunja_clerk]
    locked: true
    feature_gate: llm_router_hermes_vikunja_clerk_key_enabled
    soul_standalone_file: vikunja-clerk.soul.md
    memory_bank_id: "{{ hermes_agent_memory_bank_id ~ '-vikunja-clerk' }}"
  - name: zammad-clerk
    description: Narrow tracker agent for Zammad ticket requests
    mcp: [zammad_write]
    locked: true
    feature_gate: llm_router_hermes_zammad_clerk_key_enabled
    soul_standalone_file: zammad-clerk.soul.md
    memory_bank_id: "{{ hermes_agent_memory_bank_id ~ '-zammad-clerk' }}"
  - name: semaphore-converge
    description: Narrow converge agent that previews and runs confirmed Semaphore templates
    mcp: [semaphore_write]
    locked: true
    feature_gate: llm_router_hermes_semaphore_converge_key_enabled
    soul_standalone_file: soul-semaphore-converge.md.j2
  - name: orchestrator
    description: Kanban decomposition and assignment owner; reads the Vikunja backlog to assign work
    mcp: [vikunja, docs]
    env: []
    skills: [hermes_agent/github-issues-api]
    # Own bank, not the agent bank that the default profile shares.
    memory_bank_id: "{{ hermes_agent_memory_bank_id ~ '-orchestrator' }}"
    toolsets:
      cli: [kanban]
      cron: [kanban]
    soul_addendum_file: soul-orchestrator.md.j2
    soul_addendum_bundle_extra_file: kanban-lifecycle.md
  # Isolated evaluation: an external evaluator's synthetic tasks run here and
  # nowhere else. Its only credential beyond its own router key is its
  # API_SERVER_KEY, read from the separate hermes_eval_api_server_key field at
  # apps/hermes-eval. It has no Slack, GitHub, MCP server or skill. Its
  # toolsets are the API-submission allowlist minus
  # terminal, code_execution, file (sibling profiles' .env files share its OS user)
  # and memory. Memory is OFF (memory_enabled: false):
  # config-profile.yaml.j2 renders the built-in provider with memory and the user
  # profile disabled, and profiles.yml writes no Hindsight config for it. Its
  # router key is local-only (56a-consumer-key-support.yml), read from apps/hermes-eval
  # and gated by llm_router_hermes_eval_key_enabled. No cron entry, Kanban
  # assignment or Slack/GitHub credential names this profile.
  - name: eval
    description: Isolated evaluation profile (synthetic tasks only; no memory, cron, board, Slack, GitHub or MCP)
    # Main, compression and auxiliary calls share the key's sole model grant.
    model: "{{ llm_router_review_aliases.local }}"
    mcp: []
    env: [api_server]
    skills: []
    memory_enabled: false
    toolsets:
      cli: [web, skills, todo, context_engine, session_search]
      cron: []
    soul_addendum_file: soul-eval.md.j2
