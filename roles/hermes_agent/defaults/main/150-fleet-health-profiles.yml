# Card-filing Cron jobs declare Kanban in their per-job tool allowlist. Most
# run from the orchestrator profile; credential-bound jobs keep their own
# profile and receive Kanban only for the job that needs to file a card.

# Every `hermes cron`-managed job this role seeds that is NOT agentic (script
# only, no model snapshot) — every agentic job (the whole
# hermes_agent_direct_cron_jobs fleet, including all 18 converted ones) is
# covered by hermes_agent_brain_dependent_cron_names below instead. The
# model-drift recovery task (tasks/main.yml) only ever removes jobs on this
# list — user/agent jobs are never touched.
# Script (`--no-agent`) jobs carry no model snapshot, so the drift GC's
# `model_snapshot`-defined filter skips them naturally (no guard change needed).
hermes_agent_seeded_cron_names: >-
  {{ [hermes_agent_splunk_status_digest_cron_name] }}

# Every brain-dependent cron THIS identity owns, derived rather than
# hand-maintained. The watchdog pauses and resumes this exact set when local
# serving is unavailable, and counts a name missing from the guest's board as a
# failure, so another identity's job must never appear here.
#
# Only `enabled` direct jobs are included: the disabled ones are already
# paused and never reconciled, so naming them would just add no-op
# `cron pause` calls. The seeded status digest is a `system: splunk` job
# (tasks/cron_reconcile.yml) and follows the same owner rule.
hermes_agent_brain_dependent_cron_names: >-
  {%- set splunk_owner = (ai_agent_owner | default({})).get('splunk', '') -%}
  {{ (hermes_agent_seeded_cron_names
      if hermes_agent_id in ([splunk_owner] if splunk_owner else hermes_agent_job_identities_default)
      else [])
     + (hermes_agent_direct_cron_jobs_owned
        | selectattr('enabled', 'defined') | selectattr('enabled')
        | map(attribute='name') | list) }}

# Jobs that now run on another profile's home. A guest converged while the job
# still ran on the default home carries that copy in the default home's cron
# store. The direct-cron reconcile only withdraws a job from the home it declares,
# so the copy is removed here, if present, on every converge.
hermes_agent_moved_off_default_home_cron_names:
  - "{{ hermes_agent_github_monitor_cron_name }}"

# The `<job>-enqueue` `--no-agent --script` crons the native-cron reframe
# replaced with bare-named agentic direct-cron jobs (hermes_agent_direct_cron_jobs
# above) or, for docs-sync, an OS-crontab `kanban create` entry. A guest
# converged before the reframe still carries these in `hermes cron`'s own job
# store; the script they ran no longer exists on disk, so left in place they
# would start failing loudly instead of quietly going away. Removed if-present,
# so it is a no-op on fresh installs and on every converge after the first
# post-reframe one.
hermes_agent_superseded_kanban_enqueuer_cron_names: >-
  {{ ([hermes_agent_daily_status_cron_name, hermes_agent_nightly_wiki_cron_name,
       hermes_agent_summary_cron_name, hermes_agent_zammad_review_cron_name,
       hermes_agent_splunk_triage_cron_name, hermes_agent_splunk_security_cron_name,
       hermes_agent_splunk_parsing_cron_name, hermes_agent_splunk_deepdive_cron_name,
       hermes_agent_github_monitor_cron_name, hermes_agent_bot_pr_triage_cron_name,
       hermes_agent_docs_sync_cron_name, hermes_agent_kanban_reviewer_job,
       hermes_agent_anomaly_hunt_cron_name, hermes_agent_docs_study_cron_name,
       hermes_agent_ai_news_cron_name, hermes_agent_daily_innovation_cron_name,
       hermes_agent_app_seeding_cron_name, hermes_agent_fleet_health_cron_name]
      | map('regex_replace', '$', '-enqueue') | list)
     + ['kanban-enqueue-safety-net'] }}

# Hermes writes last-known-good config copies under each profile backups/config.
hermes_agent_profile_backup_directory_mode: "0750"
# True on an identity that runs no named profiles (tasks/main.yml sets it with the empty profile list).
# Hermes still scans every profiles/<name>/.env, so leftover profile directories move to retired-profiles/.
hermes_agent_profiles_forced_off: false
hermes_agent_retired_profiles_dir: "{{ hermes_agent_hermes_home }}/retired-profiles"
