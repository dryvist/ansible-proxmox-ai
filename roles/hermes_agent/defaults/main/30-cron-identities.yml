---
# --- Agentic direct-deliver digest crons (declarative; Phase 5) --------------
# Nine hand-created "direct deliver" digest jobs, now reconciled by the role
# (tasks/reconcile_direct_cron.yml) instead of being live-patched onto the
# guest. Each is an AGENTIC cron (unlike the --no-agent kanban enqueuers): the
# gateway runs the prompt and delivers the model's final response straight to
# Slack. Bodies live in the pinned ai-llm-prompts catalog (prompt_file), loaded
# and frontmatter-stripped at reconcile time exactly like the *_cron_prompt_file
# vars elsewhere in this file.
#
# The Slack channel is NEVER hardcoded: it comes from this var, and the whole
# reconcile loop is skipped (with a loud warning) when it is empty.
hermes_agent_digest_slack_channel: "{{ hermes_agent_slack_home_channel }}"

# --- Which identities a job belongs to ---------------------------------------
# Empty keeps the role independent of an inventory selection. The inventory
# supplies the model for agentic direct crons; script-only enqueuers do not use it.
hermes_agent_cron_model: ''
hermes_agent_cron_model_provider: custom

# The identity plumbing above scopes an agent's CREDENTIALS and HANDLES (Slack
# app, OpenBao domain, Vikunja project, memory bank, OTel name). It never
# scoped the WORKLOAD, so every hermes_agent guest reconciled the entire
# job table below regardless of who it was. A second agent provisioned as a
# personal assistant therefore came up running the first agent's
# infrastructure and coding duties — GitHub org/PR triage, Splunk digests,
# Zammad review, the kanban reviewer — duplicating that work rather than
# doing its own.
#
# A job now declares the identities it belongs to. The default below is
# deliberately the ORIGINAL ops identity and NOT "everyone": a newly
# provisioned agent must opt in to each duty explicitly, so adding an agent
# can never again silently clone the ops workload. Give a job an explicit
# `identities:` list to share or move it.
hermes_agent_job_identities_default: [hermes]

# A roster owner takes a system-scoped job; without an owner, retain the job's
# existing identities (or the original ops default).
hermes_agent_job_identities: >-
  {{ [ai_agent_owner[item.system]]
     if item.system is defined and item.system in (ai_agent_owner | default({}))
     else item.identities | default(hermes_agent_job_identities_default) }}

# Whether a direct-cron entry runs on THIS agent. The one definition of
# "enabled" for the direct cron table: reconcile_direct_cron.yml decides
# ownership with it, and cron_reconcile_direct_batch.yml reads it to choose
# which profile homes must exist. Evaluated per loop item.
hermes_agent_direct_job_wanted: >-
  {{ (item.enabled | bool)
     and (hermes_agent_id in hermes_agent_job_identities) }}

# Script-fed jobs use the same per-job identity selection. Their reconcile path
# distinguishes an unowned job (withdrawn) from a disabled capability (left
# installed), so identity and capability remain separate decisions.
hermes_agent_ops_workload_enabled: >-
  {{ hermes_agent_id in hermes_agent_job_identities_default }}

# The direct-cron entries THIS agent owns. The reconcile loop deliberately does
# not use this — it must iterate the full table so it can withdraw jobs that
# are installed but no longer owned. This view is for the questions that are
# genuinely about ownership, such as whether a named profile has any job left
# to tick.
hermes_agent_direct_cron_jobs_owned: >-
  {%- set owned = namespace(jobs=[]) -%}
  {%- for job in hermes_agent_direct_cron_jobs -%}
  {%- set identities = ([ai_agent_owner[job.system]]
     if job.system is defined and job.system in (ai_agent_owner | default({}))
     else job.identities | default(hermes_agent_job_identities_default)) -%}
  {%- if hermes_agent_id in identities -%}
  {%- set _ = owned.jobs.append(job) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ owned.jobs }}

# Script jobs this identity owns (cron_reconcile.yml copies only enabled ones) that run in a home other than the
# default one; each needs its script copied into that home (cron_reconcile.yml).
hermes_agent_profile_script_jobs: >-
  {{ hermes_agent_direct_cron_jobs_owned
     | selectattr('script', 'defined') | selectattr('script')
     | selectattr('hermes_home', 'defined')
     | rejectattr('hermes_home', 'equalto', hermes_agent_hermes_home)
     | list }}
