---
# Wired-memory-ceiling TRAJECTORY watch (complements, does not replace, the
# static 0.80 warn / 0.90 critical Splunk saved-search bands a parallel lane
# built for the same wired_ratio field — see ansible-splunk). A static band
# fires when the ratio is ALREADY in trouble; this job watches its slope, so
# it can fire an hour earlier, on approach. Deliberate duplication: a
# deterministic threshold detector and a trend/rate-of-change lens fail in
# different ways, and consolidating them into one search loses whichever
# failure mode the other was covering. Do not "clean this up" later.
#
# A parallel lane is separately wiring a ticketing-system alert action off the
# Splunk saved searches. Hermes already opens tickets directly from its own
# crons; both populations will coexist. `[wired-trajectory]` in the title
# keeps them separable — do not change Hermes' existing ticket-opening
# behavior for this job.
#
# THE HARD CONSTRAINT: index=mac_perf is CURRENTLY EMPTY. Its emitter
# (macos-wired-memory sourcetype) is a new Cribl input that has not converged
# yet. A triage/digest job here follows the same rule as every other job in
# this file (see 101-splunk-digests.yml): IT MUST ONLY POINT AT AN INDEX THAT
# CARRIES DATA. Pointing this at mac_perf today would silently return zero
# rows every run forever — indistinguishable from "all clear" — which is
# exactly the false-green class this whole project exists to close.
#
# So: the script is deployed (disable-don't-delete, one-flag-change posture,
# same as every other job here), but the cron below stays OFF until this flag
# is flipped BY HAND, and only after confirming mac_perf actually carries
# macos-wired-memory events:
#
#   splunk search 'eventcount summarize=false index=mac_perf sourcetype=macos-wired-memory'
#
# (or the tstats equivalent: `| tstats count where index=mac_perf
# sourcetype=macos-wired-memory`). A non-zero count is the ONLY condition that
# justifies flipping this to true. Do not flip it to "unblock testing" or
# because the emitter PR merged — merged is not the same as converged and
# delivering.
hermes_agent_wired_trajectory_mac_perf_confirmed: false

hermes_agent_wired_trajectory_cron_name: wired-trajectory-watch
hermes_agent_wired_trajectory_cron_schedule: "*/15 * * * *"
hermes_agent_wired_trajectory_script_name: splunk-wired-trajectory.py
hermes_agent_wired_trajectory_index: mac_perf
hermes_agent_wired_trajectory_sourcetype: macos-wired-memory
# Lookback for the regression: long enough to average out sampling noise,
# short enough that a slope computed over it is still a useful "right now"
# rate rather than a multi-day average that hides a fresh leak.
hermes_agent_wired_trajectory_window: "-6h"
# Matches the parallel lane's static critical band (0.80 warn / 0.90
# critical) — this job projects time-to-THIS number, it does not invent its
# own threshold.
hermes_agent_wired_trajectory_critical_ratio: 0.90

hermes_agent_wired_trajectory_channel: >-
  {{ hermes_agent_slack_splunk_channel
     | default(hermes_agent_digest_slack_channel, true) }}
hermes_agent_wired_trajectory_enabled: >-
  {{ hermes_agent_wired_trajectory_mac_perf_confirmed | bool
     and hermes_agent_splunk_monitor_enabled | bool
     and hermes_agent_splunk_mcp_url | length > 0
     and hermes_agent_slack_bot_token | length > 0
     and hermes_agent_slack_app_token | length > 0
     and hermes_agent_wired_trajectory_channel | length > 0 }}
