---
# Wired-memory-ceiling TRAJECTORY watch (complements, does not replace, the
# static 0.80 warn / 0.90 critical Splunk saved-search bands a parallel lane
# built for the same wired_ratio field — see ansible-splunk). A static band
# fires when the ratio is ALREADY in trouble; this job watches its slope, so
# it can fire an hour earlier, on approach. Deliberate duplication: a
# deterministic threshold detector and a trend/rate-of-change lens fail in
# different ways, and consolidating them into one search loses whichever
# failure mode the other was covering. Do not "clean this up" later.
#
# A parallel lane is separately wiring a ticketing-system alert action off the
# Splunk saved searches. Hermes already opens tickets directly from its own
# crons; both populations will coexist. `[wired-trajectory]` in the title
# keeps them separable — do not change Hermes' existing ticket-opening
# behavior for this job.
#
# THE HARD CONSTRAINT: a triage/digest job here follows the same rule as every
# other job in this file (see 101-splunk-digests.yml): IT MUST ONLY POINT AT AN
# INDEX THAT CARRIES DATA. Pointing this at an empty index would silently
# return zero rows every run forever — indistinguishable from "all clear" —
# which is exactly the false-green class this whole project exists to close.
#
# The flag below stays OFF until someone confirms BY HAND that mac_perf carries
# the emitter's events:
#
#   | tstats count where index=mac_perf sourcetype="macos:perf:wired_memory"
#
# A non-zero count is the ONLY condition that justifies flipping it to true. Do
# not flip it to "unblock testing" or because the emitter PR merged — merged is
# not the same as converged and delivering.
#
# CONFIRMED 2026-08-23: that query returns 25. The emitter converged onto the
# workstation and mac_perf, which had never held a single event, now receives
# one wired-memory sample per minute.
#
# WATCH THE SOURCETYPE SPELLING. Until this change the default here read
# `macos-wired-memory`, which does not exist. The emitter publishes
# `macos:perf:wired_memory`. Measured the same day: the gate query with the old
# spelling returned 0 while the index held 25 events, and with the correct
# spelling returned 25. Flipping the flag without fixing the spelling would have
# produced precisely the zero-rows-forever failure the paragraph above warns
# about — and the documented verification command would have agreed, because it
# carried the same wrong spelling.
hermes_agent_wired_trajectory_mac_perf_confirmed: true

hermes_agent_wired_trajectory_cron_name: wired-trajectory-watch
hermes_agent_wired_trajectory_cron_schedule: "*/15 * * * *"
hermes_agent_wired_trajectory_script_name: splunk-wired-trajectory.py
hermes_agent_wired_trajectory_index: mac_perf
hermes_agent_wired_trajectory_sourcetype: "macos:perf:wired_memory"
# Lookback for the regression: long enough to average out sampling noise,
# short enough that a slope computed over it is still a useful "right now"
# rate rather than a multi-day average that hides a fresh leak.
hermes_agent_wired_trajectory_window: "-6h"
# Matches the parallel lane's static critical band (0.80 warn / 0.90
# critical) — this job projects time-to-THIS number, it does not invent its
# own threshold.
hermes_agent_wired_trajectory_critical_ratio: 0.90
# The detector posts ONLY when the fitted climb would reach the critical
# ratio within this many hours (Vikunja 1859). Before the gate it posted its
# verdict every run — 88 posts a day, 21 of 21 sampled benign, and it fired
# on falling values too. A step change (a rank or model load) is
# self-resolving and never posts; a stable or falling window never posts. The
# projection window is the lookback: a climb that needs longer than the
# window it was measured over to matter is extrapolation, not evidence.
hermes_agent_wired_trajectory_horizon_hours: 6

hermes_agent_wired_trajectory_channel: >-
  {{ hermes_agent_slack_splunk_channel
     | default(hermes_agent_digest_slack_channel, true) }}
hermes_agent_wired_trajectory_enabled: >-
  {{ hermes_agent_wired_trajectory_mac_perf_confirmed | bool
     and hermes_agent_splunk_monitor_enabled | bool
     and hermes_agent_splunk_mcp_url | length > 0
     and hermes_agent_slack_bot_token | length > 0
     and hermes_agent_slack_app_token | length > 0
     and hermes_agent_wired_trajectory_channel | length > 0 }}
