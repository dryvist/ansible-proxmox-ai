---
# Hourly cause-grouped rollup of every cron job whose last run failed, across
# the default store and every profile store. One post names each failing job
# once, grouped by what failed (HTTP status, wall-clock, budget, ...), and
# repeats only when the failing set changes or the heartbeat elapses. Pairs
# with the per-run failure ladder in patches_retry_and_markup.yml: the ladder
# posts a job's 1st, 3rd, 10th failure; this is the standing picture between.
hermes_agent_cron_failure_rollup_cron_name: cron-failure-rollup
hermes_agent_cron_failure_rollup_schedule: "7 * * * *"
hermes_agent_cron_failure_rollup_script_name: cron-failure-rollup.py
hermes_agent_cron_failure_rollup_state_name: cron-failure-rollup.json
# Repost an unchanged failing set after this many hours; a changed set posts
# at the next tick regardless.
hermes_agent_cron_failure_rollup_heartbeat_hours: 6
hermes_agent_cron_failure_rollup_enabled: >-
  {{ hermes_agent_ops_workload_enabled | bool
     and hermes_agent_slack_issues_channel | length > 0 }}
