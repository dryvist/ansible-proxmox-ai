---
# Once-daily promotion-drift sweep: reports each git-flow repo whose `develop`
# is ahead of `main` with no promotion PR open. Read-only: it opens, labels,
# updates and merges nothing. 13:33 avoids every other daily start.
hermes_agent_promotion_drift_enabled: true
hermes_agent_promotion_drift_cron_name: promotion-drift
hermes_agent_promotion_drift_cron_schedule: "33 13 * * *"

# Appended to hermes_agent_direct_cron_jobs by 43-direct-cron-jobs-core.yml.
# Reads only, through the short-lived GitHub identity.
hermes_agent_direct_cron_jobs_promotion_drift:
  - name: "{{ hermes_agent_promotion_drift_cron_name }}"
    schedule: "{{ hermes_agent_promotion_drift_cron_schedule }}"
    prompt_file: hermes-promotion-drift.md
    skill: hermes_agent/github-issues-api
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: >-
      {{ hermes_agent_promotion_drift_enabled | bool
         and hermes_agent_github_identity_enabled | bool
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
