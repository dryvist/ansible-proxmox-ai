---
# Split out of 43-direct-cron-jobs-core.yml (token budget).
# The router and the Hermes provider renderer both consume this projection of
# the agentic cron names; a no_agent job sends no model request. Normalize to lowercase ASCII and replace each
# non-alphanumeric character with `_`, which keeps every Prometheus suffix valid.
hermes_agent_direct_cron_telemetry: >-
  {%- set _telemetry = namespace(jobs={}) -%}
  {%- for _job in hermes_agent_direct_cron_jobs if not (_job.no_agent | default(false) | bool) -%}
  {%- set _name = _job.name -%}
  {%- set _suffix = _name | lower | regex_replace('[^a-z0-9]', '_') -%}
  {%- set _ = _telemetry.jobs.update({_name: {
       'provider': 'hermes-cron-' ~ _suffix,
       'tag': 'telemetry_job_' ~ _suffix}}) -%}
  {%- endfor -%}
  {{ _telemetry.jobs }}
