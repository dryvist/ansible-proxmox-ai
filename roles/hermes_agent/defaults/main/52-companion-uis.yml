---
# The two most popular third-party Hermes web UIs, co-located on this guest.
#
# They run HERE, on the agent, rather than in a guest of their own — which the
# estate's separate-container default would otherwise require — because neither
# can be separated from the agent it serves:
#   - hermes-webui loads the agent IN-PROCESS, reading HERMES_HOME directly.
#   - hermes-studio reaches it over a loopback bridge / unix socket.
# Only hermes-workspace (the hermes-ui guest) talks HTTP and can live apart.
#
# They are INDEPENDENT upstreams — nesquena/hermes-webui and
# EKKOLearnAI/hermes-studio share nothing but the agent they talk to — so each
# carries its own renovate pin and they bump separately.
#
# Ports come from the published tofu constants, the same way the dashboard and
# gateway ports do, so the guest firewall and the Traefik route cannot disagree
# with what the service actually binds. `mandatory` with no `default` to its
# left on purpose: a default there would swallow the missing key and bind the
# service somewhere nothing routes to.

# --- hermes-webui (nesquena/hermes-webui) -------------------------------------
hermes_agent_webui_enabled: true
hermes_agent_webui_repo_url: "https://github.com/nesquena/hermes-webui.git"
# renovate: datasource=github-tags depName=nesquena/hermes-webui
hermes_agent_webui_version_tag: "v0.52.113"
hermes_agent_webui_install_dir: /usr/local/lib/hermes-webui
hermes_agent_webui_host: 0.0.0.0
hermes_agent_webui_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['hermes_webui']
     | mandatory('tofu_data.constants.service_ports.hermes_webui missing — regenerate tofu_inventory.json') }}

# --- hermes-studio (EKKOLearnAI/hermes-studio, npm: hermes-web-ui) ------------
# Licensed BSL-1.1, not an OSI licence — review its terms before widening use.
hermes_agent_studio_enabled: true
hermes_agent_studio_package: "hermes-web-ui"

# bun, not npm — the estate is bun-first for JavaScript. nixpkgs would come
# first, but these guests are plain Debian LXC with no nix, so that rung does
# not apply without a much larger change.
#
# BUN_INSTALL sets where a --global install links its bins, so pointing it at
# /usr/local puts the CLI on the default PATH as /usr/local/bin/hermes-web-ui.
# The unit previously hardcoded /usr/bin and every start died at 203/EXEC.
hermes_agent_bun_install_root: /usr/local
hermes_agent_studio_bin: "{{ hermes_agent_bun_install_root }}/bin/hermes-web-ui"

# bun ships as a single checksummed binary, the same shape the glance role uses.
# renovate: datasource=github-releases depName=oven-sh/bun
hermes_agent_bun_version: "bun-v1.4.0"
hermes_agent_bun_sha256: "2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452"
# renovate: datasource=npm depName=hermes-web-ui
hermes_agent_studio_version: "0.6.47"
hermes_agent_studio_home: /var/lib/hermes-studio
hermes_agent_studio_host: 0.0.0.0
hermes_agent_studio_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['hermes_studio']
     | mandatory('tofu_data.constants.service_ports.hermes_studio missing — regenerate tofu_inventory.json') }}
