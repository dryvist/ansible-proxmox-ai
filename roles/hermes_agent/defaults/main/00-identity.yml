---
# hermes_agent role — NousResearch Hermes Agent (the autonomous agent), run
# headless 24/7 in a dedicated LXC. NOT the hermes-infer/hermes-chat LLM serving
# stack (that just serves the Hermes-4 *model*). Native install (install.sh
# bundles Python/uv + Node) system-wide as root; the gateway runs as a dedicated
# non-root 'hermes' user whose HERMES_HOME is on a persisted ZFS data volume.
# Restart-on-failure is applied DRY by systemd_restart_policy (Phase 9).

# --- Agent identity: the ONE variable a second agent overrides -----------------
# Set this per host group and every SHARED-SERVICE handle below derives from it:
# Slack env-var names, the memory bank id, the Kanban project and intake label,
# the secret-store field prefix, and the telemetry service name.
#
# What deliberately does NOT derive from it: the OS user, home path, systemd unit
# names, and listening ports. Those are guest-local, and the deployment model is
# one agent per container — so two agents never share a namespace where they
# could collide. Deriving them would be churn that buys no isolation. The
# boundary is: reaches a shared service -> needs the identity; local to the
# guest -> does not.
#
# Every default below is written so that hermes_agent_id: hermes reproduces the
# pre-existing literal EXACTLY. That is the review property — converging the
# existing agent after this change must produce a zero-change diff.
#
# Sourced from hermes_agent_identity, which inventory/load_tofu.yml sets per
# guest from its deployment.json tag. The indirection is NOT stylistic: three
# operational playbooks load THIS FILE through `vars_files` to reuse the seeded
# cron list, and play vars_files outranks inventory host/group vars — so a
# literal here would override the per-guest value and hand one agent the other's
# Slack, Vikunja, OpenBao and memory-bank handles. Resolving through a name this
# file never defines keeps the guest's own value authoritative in that path too.
hermes_agent_id: "{{ hermes_agent_identity | default('hermes', true) }}"

# Same identity, capitalized, for text a HUMAN reads on a shared surface — a
# Vikunja comment, an ntfy push, a Slack alert body. Those cross the same
# boundary as a credential: an agent that signs the other agent's name in the
# operator's own alert feed is misreporting, even though nothing is shared.
# Resolves to "Hermes" for the pre-existing agent, so no message text changes.
hermes_agent_display_name: "{{ hermes_agent_id | capitalize }}"

hermes_agent_user: hermes
# Dedicated ZFS data volume mount (deployment.json mount_point). Holds the whole
# agent home — memory, skills, profiles, Kanban DB, sessions, logs — so it is
# snapshotted + replicated pve->pve3.
hermes_agent_home: /var/lib/hermes
hermes_agent_hermes_home: "{{ hermes_agent_home }}/.hermes" # $HERMES_HOME
hermes_agent_managed_cron_state_dir: "{{ hermes_agent_hermes_home }}/managed-cron"
hermes_agent_bin: /usr/local/bin/hermes                     # system-wide install
# install.sh's root-FHS layout: the app checkout and its uv-managed venv. uv
# itself lands only at this root-owned path — the installer never symlinks it
# onto the system PATH.
#
# The install is REGULAR, not editable: `import agent` / `import hermes_cli`
# resolve into venv/lib/python3.*/site-packages, NOT this checkout. Anything
# that edits a file under this directory expecting to change running behaviour
# is a no-op unless the same edit reaches site-packages.
hermes_agent_install_dir: /usr/local/lib/hermes-agent
hermes_agent_venv_python: "{{ hermes_agent_install_dir }}/venv/bin/python"
hermes_agent_uv_bin: /root/.hermes/bin/uv

# Built dashboard SPA. web/vite.config.ts sets outDir "../hermes_cli/web_dist",
# so a build in the checkout lands here — which is NOT where the installed
# package looks by default. The dashboard unit exports HERMES_WEB_DIST to point
# at it; see the build task in tasks/main.yml for why that indirection exists.
hermes_agent_web_dist: "{{ hermes_agent_install_dir }}/hermes_cli/web_dist"
