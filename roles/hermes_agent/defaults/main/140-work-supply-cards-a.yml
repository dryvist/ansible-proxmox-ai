---
# --- Work-supply cards (Track C): give the agent proactive, self-directed work --
# Five recurring Kanban workloads that widen what Hermes does for the operator
# beyond the monitor/triage fleet: hunt the observability unknown-unknowns, study
# the public docs for drift, scout AI news, propose one novel improvement a day,
# and self-retiringly seed the app platforms. Same card contract as every entry
# above (name + schedule + inline prompt_var); enqueued by the same script-only
# `--no-agent` fleet, so each run is a fresh isolated worker session. Minutes are
# staggered clear of the existing cron minutes (0,7,11,22,26,33,37,41,52) so no
# two enqueuers fire in the same minute. Prompts are retrieval-first (recall a
# memory key so a run never re-reports/re-files what it already saw), carry an
# explicit output contract, and end with a self-check. The enqueuer appends the
# shared "post a full report to #hermes-all, then kanban_complete with a one-line
# summary" footer, so the prompts own the WORK, not the delivery mechanics. A
# prompt that already specifies its own Slack post keeps it — the footer says to
# post once, so the two never double-deliver.

# Anomaly hunt: the unknown-unknowns lens the scheduled Splunk/GitHub lenses do
# not cover. Splunk-monitor skill carries the bounded-query safety rails;
# github-issues lets it file confirmed findings.
#
# Audited 2026-08-01 against the script-fed digests that did not exist when
# this card was designed: its own anomaly-hunt-v2 direct-cron twin WAS retired
# outright (see hermes_agent_direct_cron_jobs) because its fixed top-15 SPL
# was a strict subset of splunk-status-digest. This kanban card is NOT the
# same case — checked each of its three hunting axes individually:
# (1) new error signatures overlaps splunk-error-digest's signature
# clustering, and (2)/(3) silent sources / volume anomalies overlap
# splunk-status-digest's ingest-silence and percent-band findings, BUT both
# scripts only watch the two hardcoded `hermes_agent_splunk_digest_expected_indexes`
# (os, firewall); this card hunts across whatever it chooses, and can file a
# kanban_create follow-up card, which a `--no-agent` script cannot. Keep it —
# do not apply the direct-cron retirement here without re-checking that gap.
# Unchanged in the 2026-08 stagger pass (hours 0,12). Moving it clear of the
# hour-0/hour-12 clusters would need a `*/12` phase that dodges review (hour
# 0), ai-news (hours 0,12, operator-clock-fixed, immovable) and daily-summary
# (hour 12, "start of the operator's day", immovable) all at once, which a
# 2-slot-per-day job cannot do — every offset lands on one of them. Left as
# part of the flagged hour-0/hour-12 residual; see the PR description.
hermes_agent_anomaly_hunt_cron_name: anomaly-hunt
hermes_agent_anomaly_hunt_cron_schedule: "13 */12 * * *"
# Docs study: read the public docs for drift/gaps/broken claims via the web
# toolset, file at most 2 issues, Slack summary.
#
# 06:16, not the old 05:43 (2026-08 stagger pass): secrets-policy-audit
# (120-docs-and-review-crons.yml, 05:31) is only 12 minutes ahead of the old
# time — well inside the ~25-45 minute window a card actually runs for, so
# the two could still be in-flight together against a serving tier that
# admits only 2 concurrent requests (~152s median / ~211s max per call; the
# router's 8x40s retry budget gives ~320s before a caller gives up). 06:16 is
# exactly secrets-policy-audit's start plus 45 minutes. daily-innovation below
# shifts by the same 33 minutes to keep its own 45-minute clearance from this
# job intact.
hermes_agent_docs_study_cron_name: docs-study
hermes_agent_docs_study_cron_schedule: "16 6 * * *"
