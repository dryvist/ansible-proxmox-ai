---
# --- Self-audit: the agent audits its own operation -------------------------
# A scheduled self-correction loop: the worker reads its OWN Slack output back
# (Slack Web API via the terminal toolset + SLACK_BOT_TOKEN, delta-only against
# its memory fingerprint), sweeps Splunk for its own error signatures under the
# splunk-monitor query rails, and proves memory/Hindsight, the cron fleet,
# kanban and both transport paths healthy with per-probe evidence. Findings
# become kanban cards; a subsystem down 2 consecutive runs (or anything
# security-shaped) escalates to Zammad. Clean run = [SILENT].
#
# Split of responsibilities is the house pattern: the PROCEDURES live in the
# dryvist/self-audit skill shipped by the pinned nix-hermes bundle; the POSTURE
# (recall self-audit-last / work the delta / save fingerprint / [SILENT]) lives
# in the pinned ai-llm-prompts catalog (auto-ai-agent/hermes-self-audit.md);
# this file only names and gates the job.
#
# Zammad creds are deliberately NOT in the gate: the skill degrades gracefully
# when they are unset (Slack digest still fires, ticket filing skipped), the
# same contract dryvist/zammad-incidents consumers already follow.
hermes_agent_self_audit_enabled: true
hermes_agent_self_audit_cron_name: self-audit
# 03:29 / 15:29 UTC. Minute :29 is unused across every hour in the fleet; the
# nearest agentic neighbours are 03:15 splunk-parsing (14 min) and 12:31
# daily-operator-summary-v2 (hours away from both fires). Twice-daily so a
# regression the agent caused itself gets a correction card within ~12h.
hermes_agent_self_audit_cron_schedule: "29 3,15 * * *"
hermes_agent_self_audit_cron_prompt_file: hermes-self-audit.md
