---
hermes_agent_direct_cron_jobs_core:

  # --- Converted from Kanban recurrence (native-cron reframe) -----------------
  # Repetitive scheduled report/sweep/digest work, not genuine discrete tasks —
  # see the operator's classification rule in docs/HERMES_OPS.md. Every prompt
  # below is carried verbatim from its retired Kanban card (same var, unchanged
  # text) with its existing recall-last / work-the-delta / save-fingerprint /
  # [SILENT] structure intact; `hermes cron`'s dispatcher natively suppresses
  # delivery on a bare `[SILENT]` response, so nothing new was needed for that.
  - name: "{{ hermes_agent_daily_status_cron_name }}"
    schedule: "{{ hermes_agent_daily_status_cron_schedule }}"
    prompt_var: hermes_agent_daily_status_cron_prompt
    skill: ""
    # `--deliver` posts to exactly one fixed channel — a breaking run posts
    # here (issues); a healthy run self-routes to noise instead via
    # direct-cron-footer.md.j2's channel_when_healthy branch, using the
    # terminal `hermes send` (cron/kanban workers carry the terminal
    # toolset — hermes_agent_cron_toolsets). terse_when_healthy asks for the
    # one-line "All systems operational" shape on that branch.
    deliver: "slack:{{ hermes_agent_slack_issues_channel }}"
    channel_when_healthy: "slack:{{ hermes_agent_slack_noise_channel }}"
    terse_when_healthy: true
    hermes_home: "{{ hermes_agent_hermes_home }}/profiles/homelab-admin"
    enabled: >-
      {{ hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  - name: "{{ hermes_agent_nightly_wiki_cron_name }}"
    schedule: "{{ hermes_agent_nightly_wiki_cron_schedule }}"
    prompt_var: hermes_agent_nightly_wiki_cron_prompt
    skill: ""
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: >-
      {{ hermes_agent_wiki_enabled | bool
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  - name: "{{ hermes_agent_summary_cron_name }}"
    schedule: "{{ hermes_agent_summary_cron_schedule }}"
    prompt_var: hermes_agent_summary_cron_prompt
    skill: ""
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: >-
      {{ hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  - name: "{{ hermes_agent_zammad_review_cron_name }}"
    schedule: "{{ hermes_agent_zammad_review_cron_schedule }}"
    prompt_var: hermes_agent_zammad_review_cron_prompt
    skill: dryvist/zammad-incidents
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    hermes_home: "{{ hermes_agent_hermes_home }}/profiles/homelab-admin"
    enabled: >-
      {{ hermes_agent_zammad_url | length > 0
         and hermes_agent_zammad_api_token | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  - name: "{{ hermes_agent_splunk_triage_cron_name }}"
    schedule: "{{ hermes_agent_splunk_triage_cron_schedule }}"
    prompt_var: hermes_agent_splunk_triage_cron_prompt
    skill: dryvist/splunk-monitor
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    hermes_home: &splunk_home "{{ hermes_agent_hermes_home }}/profiles/splunk-admin"
    enabled: &cron_splunk_gate >-
      {{ hermes_agent_splunk_monitor_enabled | bool
         and hermes_agent_splunk_mcp_url | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  - name: "{{ hermes_agent_splunk_security_cron_name }}"
    schedule: "{{ hermes_agent_splunk_security_cron_schedule }}"
    prompt_var: hermes_agent_splunk_security_cron_prompt
    skill: dryvist/splunk-monitor
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    hermes_home: *splunk_home
    enabled: *cron_splunk_gate
  - name: "{{ hermes_agent_splunk_parsing_cron_name }}"
    schedule: "{{ hermes_agent_splunk_parsing_cron_schedule }}"
    prompt_var: hermes_agent_splunk_parsing_cron_prompt
    skill: dryvist/splunk-monitor
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    hermes_home: *splunk_home
    enabled: *cron_splunk_gate
  - name: "{{ hermes_agent_splunk_deepdive_cron_name }}"
    schedule: "{{ hermes_agent_splunk_deepdive_cron_schedule }}"
    prompt_var: hermes_agent_splunk_deepdive_cron_prompt
    skill: dryvist/splunk-monitor
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    hermes_home: *splunk_home
    enabled: *cron_splunk_gate
  - name: "{{ hermes_agent_github_monitor_cron_name }}"
    schedule: "{{ hermes_agent_github_monitor_cron_schedule }}"
    prompt_var: hermes_agent_github_monitor_cron_prompt
    skill: dryvist/github-issues
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: >-
      {{ hermes_agent_github_monitor_enabled | bool
         and hermes_agent_github_issues_pat | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  - name: "{{ hermes_agent_bot_pr_triage_cron_name }}"
    schedule: "{{ hermes_agent_bot_pr_triage_cron_schedule }}"
    prompt_var: hermes_agent_bot_pr_triage_cron_prompt
    skill: dryvist/github-issues
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: >-
      {{ hermes_agent_bot_pr_triage_enabled | bool
         and hermes_agent_github_alerts_token | length > 0
         and hermes_agent_github_issues_pat | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  # The only GitHub job that runs OUTSIDE the default profile: github-maint
  # carries the read-only token and nothing else, so the read-only contract is
  # the credential rather than the prompt.
  - name: "{{ hermes_agent_github_maint_cron_name }}"
    schedule: "{{ hermes_agent_github_maint_cron_schedule }}"
    prompt_var: hermes_agent_github_maint_cron_prompt
    skill: dryvist/github-issues
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    hermes_home: "{{ hermes_agent_hermes_home }}/profiles/github-maint"
    enabled: >-
      {{ hermes_agent_github_maint_enabled | bool
         and hermes_agent_github_read_token | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  - name: "{{ hermes_agent_kanban_reviewer_job }}"
    schedule: "{{ hermes_agent_kanban_reviewer_schedule }}"
    prompt_var: hermes_agent_reviewer_card_prompt
    skill: ""
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: >-
      {{ hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  - name: "{{ hermes_agent_anomaly_hunt_cron_name }}"
    schedule: "{{ hermes_agent_anomaly_hunt_cron_schedule }}"
    prompt_var: hermes_agent_anomaly_hunt_cron_prompt
    skill: dryvist/splunk-monitor
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    hermes_home: *splunk_home
    enabled: *cron_splunk_gate
  - name: "{{ hermes_agent_docs_study_cron_name }}"
    schedule: "{{ hermes_agent_docs_study_cron_schedule }}"
    prompt_var: hermes_agent_docs_study_cron_prompt
    skill: dryvist/github-issues
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: &cron_slack_gate >-
      {{ hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  - name: "{{ hermes_agent_ai_news_cron_name }}"
    schedule: "{{ hermes_agent_ai_news_cron_schedule }}"
    prompt_var: hermes_agent_ai_news_cron_prompt
    skill: ""
    deliver: "slack:{{ hermes_agent_slack_noise_channel }}"
    enabled: *cron_slack_gate
    # Operator decision 2026-08-16: an AI-news digest is an executive-assistant
    # deliverable, not an ops/coding one — moved from hermes to donna. Without
    # `identities:` a job defaults to [hermes] (hermes_agent_job_identities_default,
    # 30-cron-identities.yml); this explicit override both moves it onto donna
    # AND removes it from hermes in the same converge — reconcile_direct_cron.yml's
    # ownership check is `enabled and identity in identities`, so hermes no
    # longer matches. hermes_agent_slack_noise_channel already resolves
    # per-identity (SLACK_<ID>_NOISE_CHANNEL), so delivery needs no other change.
    identities: [donna]
  - name: "{{ hermes_agent_daily_innovation_cron_name }}"
    schedule: "{{ hermes_agent_daily_innovation_cron_schedule }}"
    prompt_var: hermes_agent_daily_innovation_cron_prompt
    skill: dryvist/github-issues
    deliver: "slack:{{ hermes_agent_slack_noise_channel }}"
    enabled: *cron_slack_gate
  - name: "{{ hermes_agent_app_seeding_cron_name }}"
    schedule: "{{ hermes_agent_app_seeding_cron_schedule }}"
    prompt_var: hermes_agent_app_seeding_cron_prompt
    skill: ""
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: *cron_slack_gate
  - name: "{{ hermes_agent_fleet_health_cron_name }}"
    schedule: "{{ hermes_agent_fleet_health_cron_schedule }}"
    prompt_var: hermes_agent_fleet_health_cron_prompt
    skill: ""
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: *cron_slack_gate
  # The last card off the board (native-cron reframe, 18/18): opens real
  # signed PRs via the docs-pr skill, so it needs the GitHub App credential on
  # top of the shared Slack gate — everything else here is inert without it.
  - name: "{{ hermes_agent_docs_sync_cron_name }}"
    schedule: "{{ hermes_agent_docs_sync_cron_schedule }}"
    prompt_var: hermes_agent_docs_sync_cron_prompt
    skill: dryvist/docs-pr
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: >-
      {{ hermes_agent_docs_sync_enabled | bool
         and hermes_agent_github_app_private_key | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  # Absorbed from the retired estate-briefing cloud routine. Read-only scoring,
  # so the issues PAT is enough — it opens an issue only for a repo whose CI has
  # been failing across runs, which is issue write, never a commit.
  - name: "{{ hermes_agent_repo_scorecard_cron_name }}"
    schedule: "{{ hermes_agent_repo_scorecard_cron_schedule }}"
    prompt_var: hermes_agent_repo_scorecard_cron_prompt
    skill: dryvist/github-issues
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: >-
      {{ hermes_agent_repo_scorecard_enabled | bool
         and hermes_agent_github_issues_pat | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  # Absorbed from the retired repo-audit cloud routine. Needs the alerts token
  # for its contents:read (scanning source) on top of the issues PAT (filing the
  # finding) — same two-token shape as bot-pr-triage above.
  - name: "{{ hermes_agent_secrets_audit_cron_name }}"
    schedule: "{{ hermes_agent_secrets_audit_cron_schedule }}"
    prompt_var: hermes_agent_secrets_audit_cron_prompt
    skill: dryvist/github-issues
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: >-
      {{ hermes_agent_secrets_audit_enabled | bool
         and hermes_agent_github_alerts_token | length > 0
         and hermes_agent_github_issues_pat | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}

# #hermes-all: the channel every Kanban worker posts its completion REPORT to
# (kanban migration, #83). Kanban cards have no native delivery channel, so the
# enqueuer appends a footer telling the worker to post to #hermes-all (channel
# <id>) and then kanban_complete.
#
# The footer used to ask for a ONE-LINE summary, which is why the duplicate
# `*-v2` agentic crons could not simply be switched off: those crons post a full
# report, so retiring one would have downgraded its topic from a report to a
# sentence with nothing saying so. The footer now asks for a full report and
# keeps kanban_complete's summary field one line (the board digest reads it), so
# the card path and the cron path deliver the same thing and a `-v2` retirement
# loses nothing.
#
# This is now its own env lookup rather than an alias of the firehose id. While
# it was an alias, #hermes-all could not be made distinct from the firehose by
# configuration alone — which is why every tier collapsed onto one channel.
# Falls back to the firehose id so an unset var reproduces the old behaviour
# exactly. The value belongs ONLY in the enqueuer footer's `hermes send --to`
# argument — never interpolated into prose a worker reads. Cron/Kanban workers
# get no messaging toolset (see hermes_agent_cron_toolsets), so a body that
# names a destination gives the worker nothing to act on and it emits the
# destination as message text instead. Empty (no firehose either) renders an
# empty --to and the send fails loudly, which is the intended failure.

# Reassembled under the original name: Ansible renders this list concatenation
# at converge time exactly as it would a literal list — split into these three
# parts (assistant-identity, retired -v2 legacy, core recurring) only to keep
# each file under the repo's per-file token budget.
hermes_agent_direct_cron_jobs: >-
  {{ hermes_agent_direct_cron_jobs_assistant
     + hermes_agent_direct_cron_jobs_legacy_v2
     + hermes_agent_direct_cron_jobs_core }}
