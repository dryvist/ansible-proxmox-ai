---
# --- Pepper research posture -------------------------------------------------
# One switch selects what the pepper identity is on a guest. Off: the client
# project-manager wiring (tracker MCP, evidence vault) with native tools limited
# to Kanban. On: web research and local learning (files, skills, built-in
# memory) for the AI-side assistant jobs, with the client wiring off in the same
# render. Other identities are not affected. The two never coexist:
# tasks/assert_brain_and_bridge.yml fails the play when research is on and any
# client wiring is enabled.
hermes_agent_pepper_research_enabled: false
# Native toolsets on the cron and chat surfaces in the research posture. The
# deny floor keeps terminal, code execution, browser and delegation off.
hermes_agent_pepper_research_toolsets:
  - web
  - file
  - skills
  - memory
  - todo
  - session_search
  - kanban
# Extra hostnames the proxy admits in the research posture (search engines,
# gateways). Each is validated as a plain DNS hostname; no wildcard.
hermes_agent_research_egress_hosts: []
