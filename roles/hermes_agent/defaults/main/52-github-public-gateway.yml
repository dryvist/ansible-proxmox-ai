---
# --- Standalone gateway for the github-public webhook route ------------------
# A second gateway process with its own HERMES_HOME serves only the
# github-public route: its own model, no memory, no chat platform and no MCP
# servers. It is deployed, enabled and started only while
# hermes_agent_github_route_public_enabled is true; otherwise it is stopped and
# disabled. Not a hermes_agent_profiles entry.
hermes_agent_github_public_gateway_profile: review-oss
hermes_agent_github_public_gateway_home: >-
  {{ hermes_agent_hermes_home }}/profiles/{{ hermes_agent_github_public_gateway_profile }}
hermes_agent_github_public_gateway_service: hermes-gateway-public
# Its own webhook receiver port; the default gateway keeps hermes_agent_webhook_port.
hermes_agent_github_public_gateway_port: 8645
# Model alias served by the router. Required (non-empty) while the public route
# is enabled; asserted in tasks/script_deploys.yml.
hermes_agent_github_public_gateway_model: ""
# No --replace: the flag targets the running gateway of a HERMES_HOME, and this
# process must never displace the default gateway.
hermes_agent_github_public_gateway_cmd: "{{ hermes_agent_bin }} gateway run"
# Bundle skill (under skills/dryvist/) copied into the gateway's HERMES_HOME.
hermes_agent_github_public_gateway_skill: pr-review
