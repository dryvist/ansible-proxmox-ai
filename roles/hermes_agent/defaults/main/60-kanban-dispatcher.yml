---
# --- Kanban dispatcher bounds (config.yaml `kanban:` block) -------------------
# Upstream (>=v0.13) runs the board dispatcher inside the gateway BY DEFAULT,
# unbounded (dispatch_in_progress/auto_decompose default true, no concurrency
# cap). These caps bound spawned workers against the same single serving
# deployment as the API cap above (same measured-envelope rationale: one
# stream serves well, 2-stream aggregate ~0.71x, beyond that thrash). Workers
# + API runs + the cron fleet all share that envelope — keep the SUM small.
#
# max_in_progress is the SUM cap across every profile combined. Pinned to 1
# (not upstream's 2) because that is today's EFFECTIVE ceiling: with a single
# profile, max_in_progress_per_profile already limits the board to one worker
# in flight. Naming profiles must not silently raise real concurrency just
# because more assignees now exist — with 3 profiles and this left at 2, the
# global cap would newly permit 2 concurrent workers (one each from two
# profiles), a real increase nothing measured. Raising this back to 2 (cross-
# profile overlap at ~0.71x aggregate) is a documented operator decision made
# AFTER the serving tier proves that capacity — never a side effect of adding
# a profile.
# Both derive from ai_llm_concurrency (all.yml) 1:1 (NOT the x2 relationship
# hermes_agent_api_max_concurrent_runs above uses) so this SUM cap stays
# pinned to the per-profile cap until the operator decision above raises it
# explicitly — a straight ai_llm_concurrency reference cannot silently double
# it the way a x2 derivation would.
hermes_agent_kanban_max_in_progress: "{{ ai_llm_concurrency | int }}"
hermes_agent_kanban_max_in_progress_per_profile: "{{ ai_llm_concurrency | int }}"

# Recurring cards use Hermes' goal loop so a worker that forgets its lifecycle
# call gets a bounded continuation/finalization nudge instead of exiting open.
# goal_mode is load-bearing, NOT optional supervision: the finalize fix
# (workers actually calling kanban_complete via the quiet path,
# tasks/main.yml) is gated on task.goal_mode — disabling it reintroduces the
# "worker exits rc=0 while its card stays running" wedge. Keep it on.
# Keep verdict traffic on the same stable router alias as every other Hermes
# inference path.
# The pinned upstream timeout is only 30 seconds; allow a bounded 60-second
# window so a transient local-model stall does not reject a valid completion.
hermes_agent_kanban_goal_mode: true
# Goal-loop turn budget. Role-wide, with NO per-card override — asserted in
# assert.yml, because "give the slow cards more turns" is the intuitive change
# here and it is the wrong one. Two mechanics make it wrong:
#
#   - Each turn re-sends the whole accumulated conversation, so prefill grows
#     with every turn and the total cost of a loop rises roughly with the
#     SQUARE of the budget, not linearly. Against a serving tier that admits
#     one request at a time, prefill IS occupancy: a longer context holds the
#     only slot for longer and everything else queues behind it.
#   - The budget is only ever spent by a card the judge keeps ruling "not
#     done" — that is, a card that is already failing. Cards fail most when
#     the serving tier is saturated, so a bigger budget adds the most load at
#     exactly the moment there is least room for it.
#
# A healthy card finalizes on its first turn and never touches this. 8 is not a
# tuned optimum, it is a backstop, and a card that produced 8 judged-insufficient
# turns wants a different card, not more turns. Note also that a goal turn is a
# whole worker conversation of up to hermes_agent_max_turns tool iterations — so
# THAT is the knob that governs how large any single prompt grows, and it dwarfs
# this one for serving pressure.
hermes_agent_kanban_goal_max_turns: 8
# THIS IS THE REAL JUDGE. It is what config.yaml.j2 renders into
# auxiliary.goal_judge.model, and it is DELIBERATELY pinned to the WORKER
# model, not the `goal-judge` router alias — that is a measured blocker, not
# an oversight, and not the same claim as the old "config drift" pin (#162)
# this comment used to defend. Do not re-flip this without re-measuring.
#
# The design intent IS correct (inventory/group_vars/all.yml:156-170 argues it
# well: same-model judging is self-preference bias, and the serving tier's
# one-in-flight-per-model limit makes worker and judge on the same model
# serialize). `hermes_goal_judge_model` there already names the `goal-judge`
# alias for exactly this reason. The gap was never the design — it was that
# `hermes_agent_kanban_goal_judge_model` (THIS var, the one that actually
# reaches inference) never read it. Repointing `hermes_goal_judge_model`
# itself does nothing on its own: it is consumed by exactly one other thing,
# the llm_router compress-death assert, and confusing the two is the
# "differ by a prefix" trap already made once (2026-07-29).
#
# MEASURED 2026-08 (live, brain healthy) why flipping this today would break
# card judgement:
#  - `goal-judge` IS a live, registered alias (present in /v1/models) — not
#    dead config.
#  - A completion through the alias 502s: "No fallback model group found for
#    original model_group=goal-judge ... Available Model Group Fallbacks=None".
#  - Direct to its backend (mlx-community/Qwen3.5-9B-MLX-4bit) on the Studio
#    loopback, 4 attempts over ~13 min: two 429 "Too many requests", two ~197s
#    empty responses. It never returned a completion in that window.
#  - CORRECTION (2026-08-02): an earlier revision of this block cited the
#    Studio warmup log's climbing cold-load times (0.4s, 35.2s, 79.0s, 79.0s,
#    79.3s) as evidence that THIS model — the judge — was being evicted and
#    re-warmed. That attribution was wrong, and it is worth understanding
#    why, because the trap is still live.
#
#    `goal-judge` NAMES TWO DIFFERENT MODELS depending on which system
#    resolves it:
#      * LiteLLM router (roles/llm_router/defaults/main.yml, model_group_alias)
#        maps goal-judge -> llm_router_small_model = Qwen3.5-9B-MLX-4bit.
#        Hermes talks to the ROUTER, so a Hermes judge call lands on the 9B.
#      * llama-swap on the Studio resolves goal-judge from its OWN alias
#        table, where it is one of the WORKER's aliases (verified live:
#        exactly one occurrence of "goal-judge" in the deployed
#        llama-swap.json, in Qwen3.6-35B-A3B-4bit's alias list, ttl=0; the 9B
#        has aliases:null and is reachable only by physical id).
#
#    nix-ai's warmup sends {"model": "goal-judge"} to llama-swap, so those
#    warm timings are the WORKER being repeatedly cold-loaded, not the judge.
#    Their real cause was an uncapped cluster-link stand-down loop force-
#    reloading the resident (Vikunja 1015, Zammad 17184).
#
#    The CONCLUSION below is unaffected — it rests on the router-side
#    measurements above, which were taken through the alias Hermes actually
#    uses — but do not cite the warmup log as judge evidence again.
#  - Root cause: the deployed llama-swap config (nix-ai
#    modules/mlx/llama-swap-topology.nix) has the WORKER
#    (Qwen3.6-35B-A3B-4bit) pinned resident (ttl=0) and the JUDGE
#    (Qwen3.5-9B-MLX-4bit) as the evictable swap-class member (ttl=900) — the
#    opposite of what roles/llm_router/defaults/main.yml's comment claimed
#    ("the 9B is always up for the judge"; corrected there in this same
#    change). A ~79s cold load against
#    hermes_agent_kanban_goal_judge_timeout_seconds (60s) means the FIRST
#    judge call after any eviction fails outright; auxiliary.transient_retries
#    (1) might catch a second attempt, but the measured runs above show it
#    isn't even reliably getting a completion within several retries.
#
# EXACT PRECONDITION to flip this line to "{{ hermes_goal_judge_model }}":
# a nix-ai module change (Phase B, needs darwin-rebuild — NOT something this
# Ansible-only repo can fix), THEN re-measure, THEN this flip and a raised
# hermes_agent_kanban_goal_judge_timeout_seconds land IN THE SAME CHANGE. Do
# not do either half alone:
#  - Raising the timeout WITHOUT the flip is dead config today — the judge
#    still resolves to hermes_agent_model (ttl=0, no cold load), so there is
#    nothing for a raised timeout to protect. Don't add it speculatively.
#  - Flipping WITHOUT a residency fix breaks judging (measured above).
#  - Residency itself is NOT a value flip. Read: nix-ai's
#    alwaysAvailableModels option is documented as an on-demand swap tier
#    BESIDE the one ttl=0 resident — there is no existing option to pin a
#    SECOND model resident. Giving the judge real residency is new nix-ai
#    module/option work, not a config change.
#  - Even a correctly-raised timeout only makes the judge WORK, not FAST: at
#    the ~2-3 goal cards/hour this fabric drains (#162), the judge model
#    will keep evicting between cards on today's ttl=900, so nearly every
#    judge call would still pay the full cold-load tax. Residency is the
#    actual fix for throughput; a timeout raise alone is a correctness
#    patch, not the solution — don't mistake one for the other.
#
# ADDENDUM (timeout raised 60 -> 150): the warning above is about the MODEL
# pin and still holds unchanged — this change does not touch
# hermes_agent_kanban_goal_judge_model. The TIMEOUT below is raised for a
# separate, independently measured reason: tail latency on hermes_agent_model
# itself (the pinned worker the judge actually calls), NOT the cold-load case
# the warning above describes — that case cannot occur while this var stays
# pinned to hermes_agent_model.
#
# MEASURED (61h, n=4,178 successful primary-model calls): p50 15.7s / p90
# 63.2s / p95 106.2s / p99 425.1s / max 762.5s. The prior 60s timeout sat
# BELOW p90 — roughly 10% of ordinary calls exceeded it with nothing unusual
# happening. Corroborated by an independent measurement over the same
# window: 27 judge APITimeoutErrors against 258 successful verdicts
# (27/285 ~= 9.5%), matching the p90 prediction closely without being derived
# from it.
#
# 150s covers p95 (106.2s, ~42% headroom) without chasing p99/max (425s /
# 762s) — goals.py retries the judge up to 5 times, so this value is paid up
# to 5x per card: 5 * 150s = 750s against the 2700s task budget (~28%).
# Covering the full tail would let one slow judge call burn the whole budget
# by itself; 150s trades a bounded worst case for eliminating the
# ordinary-latency failures the measurement above found.
hermes_agent_kanban_goal_judge_model: "{{ hermes_agent_model }}"
hermes_agent_kanban_goal_judge_timeout_seconds: 150
