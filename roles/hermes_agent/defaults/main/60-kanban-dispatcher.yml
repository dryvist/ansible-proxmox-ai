---
# --- Kanban dispatcher bounds (config.yaml `kanban:` block) -------------------
# Upstream (>=v0.13) runs the board dispatcher inside the gateway BY DEFAULT,
# unbounded (dispatch_in_progress/auto_decompose default true, no concurrency
# cap). These caps bound spawned workers against the same single serving
# deployment as the API cap above (same measured-envelope rationale: one
# stream serves well, 2-stream aggregate ~0.71x, beyond that thrash). Workers
# + API runs + the cron fleet all share that envelope — keep the SUM small.
#
# max_in_progress is the SUM cap across every profile combined. Pinned to 1
# (not upstream's 2) because that is today's EFFECTIVE ceiling: with a single
# profile, max_in_progress_per_profile already limits the board to one worker
# in flight. Naming profiles must not silently raise real concurrency just
# because more assignees now exist — with 3 profiles and this left at 2, the
# global cap would newly permit 2 concurrent workers (one each from two
# profiles), a real increase nothing measured. Raising this back to 2 (cross-
# profile overlap at ~0.71x aggregate) is a documented operator decision made
# AFTER the serving tier proves that capacity — never a side effect of adding
# a profile.
# Both derive from ai_llm_concurrency (all.yml) 1:1 (NOT the x2 relationship
# hermes_agent_api_max_concurrent_runs above uses) so this SUM cap stays
# pinned to the per-profile cap until the operator decision above raises it
# explicitly — a straight ai_llm_concurrency reference cannot silently double
# it the way a x2 derivation would.
hermes_agent_kanban_max_in_progress: "{{ ai_llm_concurrency | int }}"
hermes_agent_kanban_max_in_progress_per_profile: "{{ ai_llm_concurrency | int }}"

# Recurring cards use Hermes' goal loop so a worker that forgets its lifecycle
# call gets a bounded continuation/finalization nudge instead of exiting open.
# goal_mode is load-bearing, NOT optional supervision: the finalize fix
# (workers actually calling kanban_complete via the quiet path,
# tasks/main.yml) is gated on task.goal_mode — disabling it reintroduces the
# "worker exits rc=0 while its card stays running" wedge. Keep it on.
# Keep verdict traffic on the same stable router alias as every other Hermes
# inference path.
# The pinned upstream timeout is only 30 seconds; allow a bounded 60-second
# window so a transient local-model stall does not reject a valid completion.
hermes_agent_kanban_goal_mode: true
# Goal-loop turn budget. Role-wide, with NO per-card override — asserted in
# assert.yml, because "give the slow cards more turns" is the intuitive change
# here and it is the wrong one. Two mechanics make it wrong:
#
#   - Each turn re-sends the whole accumulated conversation, so prefill grows
#     with every turn and the total cost of a loop rises roughly with the
#     SQUARE of the budget, not linearly. Against a serving tier that admits
#     one request at a time, prefill IS occupancy: a longer context holds the
#     only slot for longer and everything else queues behind it.
#   - The budget is only ever spent by a card the judge keeps ruling "not
#     done" — that is, a card that is already failing. Cards fail most when
#     the serving tier is saturated, so a bigger budget adds the most load at
#     exactly the moment there is least room for it.
#
# A healthy card finalizes on its first turn and never touches this. 8 is not a
# tuned optimum, it is a backstop, and a card that produced 8 judged-insufficient
# turns wants a different card, not more turns. Note also that a goal turn is a
# whole worker conversation of up to hermes_agent_max_turns tool iterations — so
# THAT is the knob that governs how large any single prompt grows, and it dwarfs
# this one for serving pressure.
hermes_agent_kanban_goal_max_turns: 8
# THIS IS THE REAL JUDGE. It is what config.yaml.j2 renders into
# auxiliary.goal_judge.model, and since 2026-08-15 it reads the `goal-judge`
# router alias — the design this fabric always intended, unblocked at last.
#
# WHY IT WAS PINNED TO THE WORKER UNTIL NOW. The design intent was never in
# doubt (all.yml argues it well: same-model judging is self-preference bias,
# and two roles on one model serialize against a single serving slot).
# `hermes_goal_judge_model` has named the alias for exactly that reason all
# along. What blocked the flip was residency: `goal-judge` resolved to the 9B,
# which llama-swap held swap-class at ttl=900, and its MEASURED ~79s cold load
# meant the first judge call after any eviction simply failed. At the 2-3 goal
# cards/hour this fabric drains, that was nearly every call. Measured live
# 2026-08: four attempts through the alias over ~13 min returned two 429s and
# two ~197s empty responses — never a completion.
#
# WHAT CHANGED. The serving host went to maxResidentWorkers = 2 (nix-darwin
# 2.36.0), so `goal-judge` now points at Qwen3.6-35B-A3B-4bit, which is pinned
# RESIDENT (ttl=0) and cannot be evicted. Cold load is gone — not shortened,
# gone — and judge and worker are separate resident workers with their own
# slots, so they no longer contend. That was always the stated precondition for
# this flip, and it is a module change that landed, not a value someone raised.
#
# THE TWO-RESOLVER TRAP, now closed — worth keeping, because it cost a
# misdiagnosis once. `goal-judge` is resolved by two independent systems:
#   * the LiteLLM router, from this registry's model_group_alias;
#   * llama-swap on the serving host, from its OWN alias table.
# Those pointed at DIFFERENT models for a while (router -> 9B, llama-swap ->
# the resident worker), so a warmup log showing climbing cold-load times was
# read as evidence about the judge when it was about the worker. They now name
# the same physical model on both sides, by design. If you move the judge, move
# BOTH or the trap reopens.
#
# THE TIMEOUT BELOW IS NOT RE-TUNED HERE, deliberately. 150s was derived from a
# measured distribution of this very model serving as the worker (61h, n=4,178:
# p50 15.7s / p90 63.2s / p95 106.2s), and as the judge it now does strictly
# less work per call — thinking off, short verdicts, no longer sharing a slot.
# So the existing value is if anything conservative, and raising or lowering it
# without a fresh measurement is exactly the speculative change this file has
# refused twice. Re-measure after the flip has run a while, then tune once.
hermes_agent_kanban_goal_judge_model: "{{ hermes_goal_judge_model }}"
hermes_agent_kanban_goal_judge_timeout_seconds: 150
