---
# Hermes v0.22.5 re-homes root HERMES_HOME CLI calls to active_profile unless
# the default profile is explicit. Per-item calls set hermes_agent_cli_home.
hermes_agent_cli_profile_args: >-
  {{ ['--profile', 'default']
     if (hermes_agent_cli_home | default(hermes_agent_hermes_home))
        == hermes_agent_hermes_home else [] }}
