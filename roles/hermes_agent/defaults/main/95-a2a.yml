---
# --- Native agent-to-agent messaging (Hermes A2A) ----------------------------
# Inbound A2A callers use agentgateway's trusted-tier route; the guest firewall
# scopes network access to the gateway. Hermes reads bind and bearer settings
# from its 0600 .env file, and config.yaml carries the listener port.
hermes_agent_a2a_inbound_enabled: true
hermes_agent_a2a_inbound_port: 9901
hermes_agent_a2a_inbound_host: "0.0.0.0"
hermes_agent_a2a_inbound_token: >-
  {{ lookup('env', hermes_agent_env_prefix ~ '_A2A_TOKEN')
     | default(bao_apps_secrets.get(
         (hermes_agent_id | replace('-', '_')) ~ '_a2a_token', ''), true) }}

# Inventory owns peer names, URLs, and credentials. Tokens are written only to
# the managed .env file; config.yaml references their generated env names.
hermes_agent_a2a_peers: []

# Keep the existing Slack output unchanged unless an operator opts in.
hermes_agent_slack_rich_blocks: false
