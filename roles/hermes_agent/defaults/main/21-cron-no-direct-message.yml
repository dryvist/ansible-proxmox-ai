---
# Scheduled output never goes to a direct message. The shared status channel
# (SLACK_STATUS_CHANNEL in the run environment) receives scheduled posts.
hermes_agent_slack_status_channel: "{{ lookup('env', 'SLACK_STATUS_CHANNEL') | default('', true) | trim }}"
# A Slack target whose ID is a direct-message conversation (D...) or a user (U..., W...)
# opens a DM. Every cron deliver and failure-deliver target passes through this
# replacement at plan time, so a DM entry becomes the status channel, or local
# when no status channel is set. Group 1 keeps the entry's leading separator.
hermes_agent_cron_dm_pattern: '(^|,)\s*slack:[DUW][A-Z0-9]+(:[0-9.]+)?\s*(?=,|$)'
hermes_agent_cron_dm_replacement: >-
  \1{{ ('slack:' ~ hermes_agent_slack_status_channel)
       if hermes_agent_slack_status_channel | length > 0 else 'local' }}
