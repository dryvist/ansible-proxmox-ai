---
hermes_agent_credential_canary_cron_name: credential-canary-c6
hermes_agent_credential_canary_cron_schedule: "13 */6 * * *"
hermes_agent_credential_canary_script_name: hermes-credential-canary.py
hermes_agent_credential_canary_profile: homelab-admin

# Names only: the canary checks presence without receiving or reporting values.
# Keep the profile gates aligned with hermes-env-profile.j2 and its includes.
# Slack tokens are intentionally excluded; Slack cron profiles use profile_routes.
hermes_agent_credential_canary_profile_fields: >-
  {%- set ns = namespace(profiles=[]) -%}
  {%- for profile in hermes_agent_profiles -%}
  {%-   set profile_env = profile.env | default([]) -%}
  {%-   set profile_mcp = profile.mcp | default([]) -%}
  {%-   set fields = namespace(values=['HERMES_AGENT_MODEL_API_KEY']) -%}
  {%-   if profile.name == 'eval' and 'api_server' in profile_env -%}
  {%-     set fields.values = fields.values + ['API_SERVER_KEY'] -%}
  {%-   endif -%}
  {%-   if hermes_agent_splunk_access | default(false) | bool and 'splunk' in profile_env -%}
  {%-     set fields.values = fields.values + ['SPLUNK_MCP_TOKEN'] -%}
  {%-   endif -%}
  {%-   if 'zammad' in profile_env -%}
  {%-     set fields.values = fields.values + ['ZAMMAD_API_TOKEN'] -%}
  {%-   endif -%}
  {%-   if 'homeassistant' in profile_env and hermes_agent_homeassistant_enabled | default(false) | bool -%}
  {%-     set fields.values = fields.values + ['HASS_TOKEN'] -%}
  {%-   endif -%}
  {%-   if 'github' in profile_env -%}
  {%-     set fields.values = fields.values + ['GH_PAT_WRITE_PROJECT_ISSUES'] -%}
  {%-   endif -%}
  {%-   if hermes_agent_owned_mcp_slugs | default([]) | length > 0 -%}
  {%-     set owns_mcp = namespace(value=false) -%}
  {%-     for slug in hermes_agent_owned_mcp_slugs -%}
  {%-       if slug in profile_mcp -%}
  {%-         set owns_mcp.value = true -%}
  {%-       endif -%}
  {%-     endfor -%}
  {%-     if owns_mcp.value -%}
  {%-       set fields.values = fields.values + ['HERMES_AGENT_GATEWAY_KEY'] -%}
  {%-     endif -%}
  {%-   endif -%}
  {%-   if hermes_agent_langfuse_enabled | default(false) | bool -%}
  {%-     set fields.values = fields.values + ['HERMES_LANGFUSE_PUBLIC_KEY', 'HERMES_LANGFUSE_SECRET_KEY'] -%}
  {%-   endif -%}
  {%-   if hermes_agent_firecrawl_enabled | default(false) | bool -%}
  {%-     set fields.values = fields.values + ['FIRECRAWL_API_KEY'] -%}
  {%-   endif -%}
  {%-   set profile_a2a_on = hermes_agent_a2a_delegation_enabled | default(false) | bool
         and profile.name != 'eval'
         and profile.name in (hermes_agent_a2a_delegating_profiles | default([])) -%}
  {%-   if profile_a2a_on -%}
  {%-     for peer in hermes_agent_a2a_authorized_peers | default([]) -%}
  {%-       set peer_field = hermes_agent_env_prefix ~ '_PROFILE_A2A_PEER_' ~ loop.index0 ~ '_TOKEN' -%}
  {%-       set fields.values = fields.values + [peer_field] -%}
  {%-     endfor -%}
  {%-   endif -%}
  {%-   set route_required = profile.name == hermes_agent_credential_canary_profile
         or (hermes_agent_slack_profile_channels is mapping
             and profile.name in hermes_agent_slack_profile_channels) -%}
  {%-   set ns.profiles = ns.profiles + [{'name': profile.name, 'fields': fields.values,
                                          'route_required': route_required}] -%}
  {%- endfor -%}
  {{ ns.profiles | to_json }}
