---
# --- Vikunja backlog review + session follow-ups ----------------------------
# Two new agentic direct-cron jobs, declared as data like every other job in
# this role: prompt bodies live in the pinned catalog, with no new script,
# template or unit. Both are advisory: they leave suggestions and never
# change state unless the operator asks them to. Both are gated, so a guest
# without its gate never starts them.
#
# Job 1 (vikunja-backlog-<project>) reviews the operator's Vikunja backlog ONE
# project at a time and leaves a suggestion comment on each task it looks at.
# The Vikunja comments are the only output, so the ten jobs deliver locally
# (deliver/failure_deliver: local, the assistant jobs' pattern in
# 41-direct-cron-jobs-assistant.yml): the vikunja-pm profile has no Slack
# channel on any gateway, so there is no channel to deliver to. They run on the
# vikunja-pm profile, whose mcp is [vikunja_write]: that profile may comment on
# tasks but never deletes, and the prompt refuses every task field change on
# top of that. They are gated on the vikunja-pm profile key
# (llm_router_hermes_vikunja_pm_key_enabled) on the primary gateway
# (hermes_agent_id == 'hermes'), so only the primary guest ever starts them.
# Each project runs every 4 hours on the free odd minutes :21, :51 and :55,
# each on its own hour offset, so the fleet's stagger invariant
# (tests/hermes_agent/test_cron_stagger.py) holds. session-followups takes
# 11:55, an hour no backlog job uses at :55.
#
# Job 2 (session-followups) reads THIS gateway's own past conversations with
# the stock session_search tool and posts the operator requests that were
# never finished. It runs on the root profile exactly like the daily-summary
# job it copies its delivery and its gate from: session_search is part of
# hermes_agent_cron_toolsets, so a cron run may use it with no extra wiring.
hermes_agent_vikunja_backlog_review_enabled: >-
  {{ hermes_agent_id == 'hermes' and llm_router_hermes_vikunja_pm_key_enabled | default(false) | bool }}
# The opening of this prompt is identical for every project, so the ten jobs
# share one catalog prompt; only the trailing PROJECT: line differs.
hermes_agent_vikunja_backlog_review_cron_prompt_file: hermes-vikunja-backlog-review.md
hermes_agent_session_followups_cron_prompt_file: hermes-session-followups.md
hermes_agent_direct_cron_jobs_vikunja_backlog:
  - name: vikunja-backlog-inbox
    schedule: "21 0,4,8,12,16,20 * * *"
    prompt_var: hermes_agent_vikunja_backlog_review_cron_prompt
    prompt_tail: "PROJECT: 40 (Inbox)"
    deliver: local
    failure_deliver: local
    hermes_home: "{{ hermes_agent_hermes_home }}/profiles/vikunja-pm"
    enabled: "{{ hermes_agent_vikunja_backlog_review_enabled }}"
  - name: vikunja-backlog-nix
    schedule: "21 1,5,9,13,17,21 * * *"
    prompt_var: hermes_agent_vikunja_backlog_review_cron_prompt
    prompt_tail: "PROJECT: 42 (nix)"
    deliver: local
    failure_deliver: local
    hermes_home: "{{ hermes_agent_hermes_home }}/profiles/vikunja-pm"
    enabled: "{{ hermes_agent_vikunja_backlog_review_enabled }}"
  - name: vikunja-backlog-proxmox
    schedule: "21 2,6,10,14,18,22 * * *"
    prompt_var: hermes_agent_vikunja_backlog_review_cron_prompt
    prompt_tail: "PROJECT: 43 (proxmox)"
    deliver: local
    failure_deliver: local
    hermes_home: "{{ hermes_agent_hermes_home }}/profiles/vikunja-pm"
    enabled: "{{ hermes_agent_vikunja_backlog_review_enabled }}"
  - name: vikunja-backlog-governance-ci
