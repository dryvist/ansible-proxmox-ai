---
# --- Vikunja backlog review + session follow-ups ----------------------------
# Two new agentic direct-cron jobs, declared as data like every other job in
# this role: one inline prompt per job family, no new script, template or
# unit. Both are advisory — they leave suggestions, never state changes the
# operator did not ask for — and both are gated, so a guest without the
# credentials never starts them.
#
# Job 1 (vikunja-backlog-<project>) reviews the operator's Vikunja backlog ONE
# project at a time and leaves a suggestion comment on each task it looks at.
# It runs on the vikunja-pm profile, whose mcp is [vikunja_write]: that profile
# may comment on tasks but never deletes, and the prompt refuses every task
# field change on top of that. Ten projects, ten different minutes, so the
# fleet's stagger invariant (tests/hermes_agent/test_cron_stagger.py) holds.
#
# Job 2 (session-followups) reads THIS gateway's own past conversations with
# the stock session_search tool and posts the operator requests that were
# never finished. It runs on the root profile exactly like the daily-summary
# job it copies its delivery and its gate from: session_search is part of
# hermes_agent_cron_toolsets, so a cron run may use it with no extra wiring.
hermes_agent_vikunja_backlog_review_enabled: >-
  {{ hermes_agent_slack_bot_token | length > 0
     and hermes_agent_slack_app_token | length > 0
     and 'vikunja-pm' in hermes_agent_slack_profile_deliver_targets }}
# The opening of this prompt is identical for every project, so the ten jobs
# share one cached prefix; only the trailing PROJECT: line differs.
hermes_agent_vikunja_backlog_review_cron_prompt: >-
  You review one Vikunja project, named in the line that starts PROJECT: at the
  end of this prompt. List its open tasks, oldest first. Skip any task that
  already has a comment starting "Backlog review:" from the last 30 days. Take
  at most 8 tasks. For each task you take, post exactly one comment that starts
  "Backlog review:" and gives one or more of: a suggested label taken from the
  project's existing labels; a likely parent or duplicate task by id;
  "close candidate" with the reason; "still valid" with the next concrete
  step. You never change any task field, label, assignee, due date, done
  state or relation, and never delete anything. When no task needs review,
  reply with exactly [SILENT]. Otherwise reply with one line per task: the
  task id and the suggestion.
hermes_agent_session_followups_cron_prompt: >-
  Use the session_search tool to read this gateway's conversations from the
  last 7 days. Find the requests the operator made that were never completed
  or never answered. For each one, give one line: the date, a short quote of
  the request, and what is still missing. Never act on them. When there are
  none, reply with exactly [SILENT].
hermes_agent_direct_cron_jobs_vikunja_backlog:
  - name: vikunja-backlog-inbox
    schedule: "7 * * * *"
    wall_clock_seconds: 2399
    prompt_var: hermes_agent_vikunja_backlog_review_cron_prompt
    prompt_tail: "PROJECT: 40 (Inbox)"
    deliver: "{{ hermes_agent_slack_profile_deliver_targets.get('vikunja-pm', '') }}"
    hermes_home: "{{ hermes_agent_hermes_home }}/profiles/vikunja-pm"
    enabled: "{{ hermes_agent_vikunja_backlog_review_enabled }}"
