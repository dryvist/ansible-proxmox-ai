---
# --- GitHub pull_request webhook routes (/webhooks/<name>) -------------------
# Two routes split by repository.private. Both off by default; while both are
# off the `inbound` demo route renders as before. The private route is served by
# the default gateway, the public route by its own gateway
# (52-github-public-gateway.yml).
hermes_agent_github_route_private_enabled: false
hermes_agent_github_route_private_name: github-private
hermes_agent_github_route_private_profile: ""
hermes_agent_github_route_public_enabled: false
hermes_agent_github_route_public_name: github-public

hermes_agent_github_route_org: dryvist
hermes_agent_github_route_actions: [opened, synchronize, reopened, ready_for_review]
# Events sent by the agent's own App are ignored.
hermes_agent_github_route_bot_login: >-
  {{ hermes_agent_github_app_slug | default('jacobs-hermes-agent', true) }}[bot]
# Drops PRs whose head repository differs from the base repository (forks).
hermes_agent_github_route_script_name: github-route-same-repo.py
# Skill command names are the slug of the skill's frontmatter `name`.
hermes_agent_github_route_skills: [dryvist-pr-review]
hermes_agent_github_route_prompt: >-
  Review pull request #{pull_request.number} in {repository.full_name} at head
  commit {pull_request.head.sha}.
hermes_agent_github_route_toolsets: [terminal, web]
