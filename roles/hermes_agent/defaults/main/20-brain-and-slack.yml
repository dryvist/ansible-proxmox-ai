---
# --- Brain: the LiteLLM router (the fabric front door, OpenAI-compatible /v1) ---
# Reached by its neutral Traefik FQDN — never a hardcoded IP. The router routes by
# model alias, so the agent just names the model it wants. The api key is the
# router master key, env-sourced (SOPS/Doppler).
# The model comes from the router role alias in inventory/group_vars/all.yml.
# Physical model IDs remain centralized in the router/MLX catalog.
hermes_agent_model: "{{ hermes_brain_model }}"
hermes_agent_model_base_url: "https://llm.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/v1"
hermes_agent_model_api_mode: chat_completions
# Context compression uses the same >=64K-capable router alias as the agent.
hermes_agent_compression_model: "{{ hermes_brain_model }}"
# Session reset policy (see config.yaml.j2 session_reset block): daily boundary
# hour and idle timeout that bound EVERY session's lifetime.
hermes_agent_session_reset_at_hour: 4
hermes_agent_session_reset_idle_minutes: 1440
# The context window Hermes budgets against and compacts under (it compresses at
# hermes_agent_context_compression_threshold * this value). It matches the
# router's served 65,536-token window so compaction begins at 49,152 tokens,
# before LiteLLM's pre-call context check can reject the request.
hermes_agent_model_context_length: 65536
# Match the official MLX server's output cap and preserve input headroom.
hermes_agent_model_max_tokens: 8192
# Hermes classifies the brain endpoint by HOSTNAME STRING, never by DNS
# resolution (agent/model_metadata.py is_local_endpoint: loopback, RFC-1918
# IP literals, container suffixes, dot-less names). Our router base_url is an
# FQDN, so Hermes applies its strict REMOTE-provider timeouts — 120s stream
# read, 180s stale-stream kill — to a local model whose thinking-mode prefill
# on a 20-60K context legitimately exceeds both. Confirmed live 2026-07-08:
# "Stream stale for 180s (threshold 180s) ... Killing connection" followed by
# a 0-char truncated stub that surfaces as "Model generated invalid tool
# call". These overrides restore the values Hermes itself auto-applies to
# endpoints it recognizes as local (read 1800s; stale kept enabled but far
# above any healthy prefill).
# The read value is the innermost link of the fabric-wide timeout chain, so it is
# sourced from the single-source-of-truth constant (all.yml) that the Layer-1
# assert checks against the router's per-attempt timeout — resolves to 1800.
hermes_agent_stream_read_timeout: "{{ ai_stream_read_timeout_seconds }}"
hermes_agent_stream_stale_timeout: 900
# Non-streaming counterpart of the stale bound above. Same misclassification,
# same consequence: run_agent._resolved_api_call_stale_timeout_base only
# returns infinity for an endpoint is_local_endpoint recognizes, so an FQDN
# router falls through to the implicit 90s remote default. Under router
# contention a large agent prompt legitimately exceeds it and the call dies
# with "Non-streaming API call timed out after 90s". Setting the upstream
# HERMES_API_CALL_STALE_TIMEOUT escape hatch to the streaming stale value
# keeps both paths on one number and, being explicit, also exempts it from
# the implicit-only wall-clock run-budget cap.
hermes_agent_api_call_stale_timeout: "{{ hermes_agent_stream_stale_timeout }}"
# Upstream HERMES_CRON_TIMEOUT is an inactivity reset, not an aggregate job
# deadline: every API/tool/stream activity refreshes it. Keep that native guard
# below the independent wall clock so a genuinely stalled run is interrupted
# without allowing an active loop to run forever.
hermes_agent_cron_inactivity_timeout_seconds: 1800
# Upstream v2026.8.3 has no aggregate cron deadline. The role's pinned-source
# patch enforces this monotonic wall clock around the complete agent run,
# independently of retries and activity. It must remain below the router's
# per-attempt timeout so Hermes owns the outer job deadline.
#
# `hermes cron`'s ticker is a SINGLE-THREADED SEQUENTIAL POOL per profile
# (installed cron/scheduler.py's _get_sequential_pool: one thread, so
# concurrent jobs can't corrupt each other's os.environ). One job can hold
# that thread for up to this ceiling, so every other job sharing the SAME
# profile's HERMES_HOME goes unserviced for as long as the hold lasts — with
# no error, since the slot is simply never claimed. A flat constant here is a
# guess about how tight the fastest store-mate's cadence is; get that guess
# wrong (as 2300 did against a 15-minute job) and starvation is guaranteed by
# construction, not bad luck: hermes_agent_cron_wall_timeout_seconds MUST stay
# below every job's schedule interval in every profile this value reaches
# (hermes-env-operational.j2 renders it into EVERY profile's .env — Cron is
# per-profile by design, but this scalar is shared across all of them, so it
# has to be safe for whichever profile is currently tightest).
#
# hermes_agent_direct_cron_jobs is the one place that set of schedules is
# centrally listed (defaults/main/43-direct-cron-jobs-core.yml). It does NOT
# cover the separate script-fed enqueuer crons reconciled ad hoc in
# tasks/cron_reconcile.yml (splunk-status-digest, kanban-digest, the
# splunk-error/security digests in hermes_agent_triage_jobs,
# wired-trajectory, zammad-autoclose) — those schedules live in scattered
# per-job vars, not one list, so they are NOT inputs to this formula. The
# tightest of them found while writing this (hermes_agent_wired_trajectory_
# cron_schedule, */15 min) is currently gated off by default; if it or
# another sub-hourly script job is ever enabled, the same starvation risk
# this PR fixes for the agentic list can reappear for it, undetected by this
# formula. Folding the enqueuer schedules in is real follow-up work, not
# something to fake with a stand-in number here.
#
# hermes_agent_cron_min_job_interval_seconds ignores each job's `enabled`
# gate deliberately: gating by it would make the ceiling swing with which
# credentials happen to be configured at converge time, so a job that's only
# capability-gated off today could flip on tomorrow and silently loosen a
# ceiling that's already governing a run in flight. Considering every listed
# schedule, enabled or not, removes that runtime dependency and keeps the
# value computable from static role data alone — conservative (a permanently
# disabled fast job keeps the ceiling tighter than strictly necessary), never
# unsafe.
hermes_agent_cron_min_job_interval_seconds: >-
  {{ (hermes_agent_direct_cron_jobs
      | map(attribute='schedule')
      | map('cron_min_gap_minutes')
      | list | min) * 60 }}
# The operator's core relationship (Vikunja 1906): ceiling MUST be strictly
# below the tightest store-mate cadence, or that job's slot is skipped on
# every hang, guaranteed. Any factor below 1.0 satisfies that on its own —
# once the held job is killed at `ceiling` seconds, the pool is free again
# before the tight job's SECOND upcoming slot, so at most one slot is ever
# lost per hang instead of the unbounded run the old flat constant allowed.
# 0.5, not something closer to 1.0, is a deliberate margin on top of that
# floor, not a measured figure: the wall-clock check itself only runs once
# per poll (_POLL_INTERVAL granularity) and the kill path (raise, unwind,
# executor shutdown) is not instant, and a half-cadence margin absorbs both
# without needing to measure either — while still leaving legitimately more
# run time (30 min at today's schedules) than 2300s ever needed to justify.
hermes_agent_cron_pool_safety_factor: 0.5
# Capped 1s under the router's per-attempt timeout so the Layer-1 assert
# below (`< ai_router_request_timeout_seconds`) holds by construction, not by
# coincidence, however the two independent numbers above happen to compute:
# 1s is the minimum integer margin a strict `<` on whole seconds needs, not a
# tuned value.
hermes_agent_cron_wall_timeout_seconds: >-
  {{ [
       (hermes_agent_cron_min_job_interval_seconds | float
        * hermes_agent_cron_pool_safety_factor) | round(0, 'floor') | int,
       (ai_router_request_timeout_seconds | int) - 1
     ] | min }}
# Per-call MCP tool timeout (config_servers.<srv>.timeout). The hermes-agent
# runtime already ENFORCES this bound (tools/mcp_tool._run_on_mcp_loop raises
# TimeoutError at the deadline and returns a clean tool error), but the per-server
# key was undeclared, so it fell back to the 300s default. Declaring it at 180s
# makes a hung-but-connected MCP upstream fail a data card's tool call in 3 min
# instead of 5 — the card then fails/requeues via max_retries + kanban
# failure_limit within its max_runtime, so a dead MCP never freezes the sole
# worker slot indefinitely (Vikunja 815). 180s still allows a legitimately slow
# bounded Splunk search. The brain call is separately bounded by
# hermes_agent_stream_stale_timeout above.
hermes_agent_mcp_tool_timeout_seconds: 180
# The api key IS the LiteLLM router master key; source it from the canonical
# LLM_ROUTER_MASTER_KEY env (same as the llm_router role) so no per-run mapping
# is needed. HERMES_AGENT_MODEL_API_KEY still overrides if explicitly set.
hermes_agent_model_api_key: >-
  {{ lookup('env', 'HERMES_AGENT_MODEL_API_KEY')
     | default(lookup('env', 'LLM_ROUTER_MASTER_KEY'), true) }}

# --- Slack gateway (Socket Mode) ---
# Sourced the same way as the model key: plain env lookup, fed by Doppler at
# converge time (iac-conf-mgmt/prd, where these were added alongside
# LLM_ROUTER_MASTER_KEY). Empty-string defaults keep the role inert — and the
# gateway Slack-free — until all five are actually set.
# Per-agent by construction: two agents sharing one bot token would each open a
# Socket Mode connection, and the platform round-robins events between them — a
# DM gets answered by whichever connection wins the race, nondeterministically.
# A second agent therefore needs its own app and its own token pair, which is
# what deriving the variable NAME from the identity buys.
hermes_agent_slack_bot_token: >-
  {{ lookup('env', 'SLACK_' ~ (hermes_agent_id | upper) ~ '_BOT_TOKEN') | default('', true) }}
hermes_agent_slack_app_token: >-
  {{ lookup('env', 'SLACK_' ~ (hermes_agent_id | upper) ~ '_APP_TOKEN') | default('', true) }}
# Identity-prefixed var wins when set (Donna's own allowed-user/home-channel);
# otherwise falls back to the original unprefixed var, so hermes_agent_id: hermes
# keeps reading the same Doppler vars it always has (no SLACK_HERMES_* exist).
hermes_agent_slack_allowed_users: >-
  {{ lookup('env', 'SLACK_' ~ (hermes_agent_id | upper) ~ '_MEMBER_ID')
     | default(lookup('env', 'SLACK_MEMBER_ID'), true) | default('', true) }}
hermes_agent_slack_home_channel: >-
  {{ lookup('env', 'SLACK_' ~ (hermes_agent_id | upper) ~ '_HOME_CHANNEL')
     | default(lookup('env', 'SLACK_HOME_CHANNEL'), true) | default('', true) }}
hermes_agent_slack_home_channel_name: >-
  {{ lookup('env', 'SLACK_' ~ (hermes_agent_id | upper) ~ '_HOME_CHANNEL_NAME')
     | default(lookup('env', 'SLACK_HOME_CHANNEL_NAME'), true) | default('', true) }}

# 4-channel Slack routing (operator decision 2026-07-31). The previous 3-tier
# scheme collapsed: firehose, digest and hermes_all all resolved to ONE id, so
# every emitter landed in the same channel. A 13-day audit of 1084 messages
# found ~52% of that channel was Hermes reporting its own breakage and ~28% was
# null-result polling, leaving ~10-17% actual work.
#
# The discriminator is the OBSERVATION PATH, never a keyword. Hermes reporting a
# failure it observed is work (#hermes-all / #hermes-splunk); Hermes failing to
# observe is breakage (#hermes-issues). Keyword routing on "error"/"litellm"
# would misroute the most valuable posts in the corpus — Splunk-observed
# litellm errors on the llm-routers are findings, produced by a job that worked.
#
#   #hermes-all     real thinking, work, and findings
#   #hermes-issues  Hermes itself not functional
#   #hermes-splunk  the Splunk digest domain
#   #hermes-noise   "no change since" / heartbeat polls
#
# Every id is an env lookup fed by Doppler at converge time — never hardcoded.
# Each defaults EMPTY and falls back to prior behaviour, so an unset var leaves
# routing exactly as it was rather than silently emptying a channel.
# Same identity-prefixed-wins, unprefixed-fallback pattern as above.
hermes_agent_slack_firehose_channel: >-
  {{ lookup('env', 'SLACK_' ~ (hermes_agent_id | upper) ~ '_FIREHOSE_CHANNEL')
     | default(lookup('env', 'SLACK_FIREHOSE_CHANNEL'), true) | default('', true) }}
hermes_agent_slack_issues_channel: >-
  {{ lookup('env', 'SLACK_' ~ (hermes_agent_id | upper) ~ '_ISSUES_CHANNEL') | default('', true) }}
hermes_agent_slack_noise_channel: >-
  {{ lookup('env', 'SLACK_' ~ (hermes_agent_id | upper) ~ '_NOISE_CHANNEL') | default('', true) }}

# The prefix a script-fed cron prints to declare that its OWN observation path
# failed. Those scripts deliberately exit 0 and print their failure so it gets
# delivered, so the runner sees success — this is how they say otherwise. ONE
# definition, templated into both the scheduler patch and every script that
# emits it, so the producer and the consumer cannot drift.
hermes_agent_cron_issues_marker: "[ISSUES]"

# Delivery target a FAILED cron run is redirected to, patched into upstream's
# scheduler (tasks/main.yml). Covers both a runner-reported failure and a
# script-fed job that declared its own with the marker above. Empty leaves
# every result on its job's own channel, i.e. previous behaviour.
hermes_agent_cron_failure_deliver: >-
  {{ 'slack:' ~ hermes_agent_slack_issues_channel
     if (hermes_agent_slack_issues_channel | length > 0)
     else '' }}

# Output-validity gate (patches_cron_output_validity.yml): rejects a cron
# run's delivered content when it is too short or reads like an interrupted
# mid-reasoning fragment rather than a finished report, routing it to the
# issues channel above instead of publishing it as a completed success.
# Global kill switch. Default on: a degenerate completion is silently wrong
# by default, never a tradeoff worth defaulting away.
hermes_agent_cron_output_validity_enabled: true
# Default minimum length (characters, after stripping whitespace) a job's
# output must reach. 25 rejects a single word or a short acknowledgement
# ("Interesting", "Done") while clearing genuine one-line findings ("No new
# tickets since last run.").
hermes_agent_cron_min_output_length: 25
# Per-job override, keyed by job name (hermes_agent_direct_cron_jobs' `name`).
# A job whose legitimate output is always short can lower its floor; 0
# exempts that job from the WHOLE gate — length floor AND the truncation
# heuristic — since a job can legitimately end without terminal punctuation
# (a bare URL, a code fence, a table row, a bulleted list).
hermes_agent_cron_min_output_length_overrides: {}
