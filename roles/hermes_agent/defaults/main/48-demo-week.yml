---
# --- Demo-week pulse and Splunk license audit (2026-09-28) --------------------
# Two direct crons added for the CriblCon demo week. Both are inline prompt_var
# jobs (no catalog bump needed) and both follow the shared evidence contract in
# templates/direct-cron-footer.md.j2.
#
# demo-pulse: every 30 minutes inside the demo window (14:00-22:59 UTC,
# Mon-Wed) post ONE short status with real counts and the delta since the last
# pulse. Never [SILENT] inside the window: the point is a visible, always-on
# agent. Disable by flipping hermes_agent_demo_pulse_enabled after the demos.
hermes_agent_demo_pulse_enabled: true
hermes_agent_demo_pulse_cron_name: demo-pulse
hermes_agent_demo_pulse_cron_schedule: "*/30 14-22 * * 1-3"
hermes_agent_demo_pulse_cron_prompt: >-
  You are the Hermes demo pulse. STRICT budget: at most 6 terminal calls,
  curl only, each `curl -sS -m 8`. Recall memory key "demo-pulse:last" first
  (the values you saved on the previous pulse, with its timestamp). Then
  observe, in this order: (1) the LLM router readiness
  https://llm.${PROXMOX_SUBDOMAIN}/health/readiness (report the http code and,
  from the JSON, the number of healthy and unhealthy deployments); (2) the
  tracing service https://langfuse.${PROXMOX_SUBDOMAIN}/api/public/health and
  the Splunk tool route https://mcp.${PROXMOX_SUBDOMAIN}/splunk/health (http
  codes; the status page itself sits behind the SSO gate, so do not call it);
  (3) your own gateway
  https://hermes-api.${PROXMOX_SUBDOMAIN}/health and the memory service
  https://hindsight.${PROXMOX_SUBDOMAIN}/health (http codes); (4) the
  incident queue: https://zammad.${PROXMOX_SUBDOMAIN}/api/v1/tickets/search?query=state.name:open&limit=100
  with header "Authorization: Token token=${ZAMMAD_API_TOKEN}" (count open
  tickets, and how many carry priority "3 high"). Post exactly one report:
  headline line "Demo pulse <UTC time>: N/M services up, R router deployments
  healthy, Z open incidents (H high)", then one line per observation with the
  actual value, then ONE line "Since last pulse (<age of the recalled
  baseline>): <what changed, or 'no change'>". Name every endpoint that was
  down or unreachable. Save the new values under "demo-pulse:last" with the
  current UTC time. Under 15 lines, plain text.

# splunk-license: the license has been exceeded several times recently. Every
# two hours, measure today's ingest against the quota and name the offenders,
# under the Splunk admin profile so the findings share that profile's memory
# bank. Alerts only on a real signal; otherwise a one-line status.
hermes_agent_splunk_license_enabled: true
hermes_agent_splunk_license_cron_name: splunk-license
hermes_agent_splunk_license_cron_schedule: "7 */2 * * *"
hermes_agent_splunk_license_cron_prompt: >-
  You are the Splunk license auditor. Recall memory key "splunk-license:last"
  first (yesterday's and today's numbers you saved, with timestamps). Run
  these bounded searches and nothing else: (1) today's ingest by index:
  `index=_internal source=*license_usage.log* type=Usage earliest=@d
  | stats sum(b) as bytes by idx | sort -bytes | head 10`; (2) today's total
  and the quota: `index=_internal source=*license_usage.log*
  type=RolloverSummary earliest=-1d | head 1 | table _time stack poolsz` and
  `index=_internal source=*license_usage.log* type=Usage earliest=@d | stats
  sum(b) as total_bytes`; (3) warnings: `index=_internal sourcetype=splunkd
  component=LicenseManager (WARN OR ERROR) earliest=-1d | stats count by
  message | sort -count | head 5`; (4) the top sourcetype and host today:
  `index=_internal source=*license_usage.log* type=Usage earliest=@d | stats
  sum(b) as bytes by st, h | sort -bytes | head 5`. Convert bytes to GB with
  one decimal. Headline: "License <used GB>/<quota GB> today (<percent>), <n>
  warnings in 24h" and mark it "LICENSE WARNING" at the start when usage is
  above 80 percent of quota or any warning was logged. Then the top-10 indexes
  with GB, the top-5 sourcetype/host pairs, the warning messages, and one line
  comparing to the recalled baseline (name its age). If a warning is present,
  end with a one-line recommended action (the index or sourcetype to throttle
  first). Save today's numbers under "splunk-license:last". Under 25 lines.
