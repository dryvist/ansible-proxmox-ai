---
# Each store resolves its own key policy, including declaration-level overrides.
hermes_agent_router_key_alias: >-
  {{ 'hermes-' ~ hermes_agent_profile.name if hermes_agent_profile is defined
     else ('hermes-default' if hermes_agent_id == 'hermes' else hermes_agent_id) }}
hermes_agent_client_timeouts: >-
  {{ llm_router_priority_policy_by_tier[
       llm_router_priority_effective_key_tiers.get(
         hermes_agent_router_key_alias, llm_router_priority_default_tier) | string
     ].client_timeouts }}
