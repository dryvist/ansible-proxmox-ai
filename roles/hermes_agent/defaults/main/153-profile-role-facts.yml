---
# Facts a locked profile needs that differ per deployment, keyed by profile
# name: the project it files into, the bot it acts as, a protected label.
# The template appends them after the whole prompt as `agent.system_prompt`,
# so the shared opening stays the same for every profile. The run environment
# supplies one JSON object; invalid JSON fails the converge instead of
# silently dropping every fact. A profile row's own `role_facts` wins.
hermes_agent_profile_role_facts: >-
  {{ lookup('env', 'HERMES_AGENT_PROFILE_ROLE_FACTS') | default('{}', true) | from_json }}
