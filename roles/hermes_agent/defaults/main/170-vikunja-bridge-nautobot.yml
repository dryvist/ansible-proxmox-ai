---
# --- Nautobot MCP client (read-only SoT) ---
# Thin pointer to the shared agentgateway /nautobot route — the gateway
# sidecar (mcp_nautobot_server.py, agentgateway_docker role) holds the read
# token, so this is keyless (same posture as qdrant/context7). DISABLED by
# default: the route itself renders only once the read-only token exists
# (ansible-proxmox-apps roles/nautobot/tasks/mcp_token.yml, opt-in via
# nautobot_mcp_token_publish_openbao) AND agentgateway_docker has converged
# with it present. With this enabled but the route absent, Hermes retries and
# parks on "MCP server 'nautobot' failed initial connection" EVERY session
# (the same vikunja footgun documented above) — flip to true, and add
# "nautobot" to a profile's mcp list, only after confirming
# https://mcp.<PROXMOX_SUBDOMAIN>/nautobot answers.
hermes_agent_nautobot_mcp_enabled: false
hermes_agent_nautobot_mcp_url: >-
  https://mcp.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  or undef('PROXMOX_SUBDOMAIN required (Doppler)') }}/nautobot
