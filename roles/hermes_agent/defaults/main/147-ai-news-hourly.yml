---
# --- Hourly AI model news: one new item per run, to its own channel -----------
# The prompt body lives in the pinned prompt catalog (hermes-pepper-ai-news.md).
# The job belongs to the pepper identity and runs on its default home, so the
# chat session that receives the operator's replies shares its skill and its
# preferences file. It needs the research posture (168-pepper-research.yml) and
# stays disabled until the channel id is supplied.
hermes_agent_ai_news_hourly_enabled: true
hermes_agent_ai_news_hourly_cron_name: ai-news-hourly
hermes_agent_ai_news_hourly_cron_schedule: "7 * * * *"
hermes_agent_ai_news_hourly_channel: >-
  {{ lookup('env', 'SLACK_PEPPER_AI_NEWS_CHANNEL') | default('', true) }}

hermes_agent_direct_cron_jobs_ai_news_hourly:
  - name: "{{ hermes_agent_ai_news_hourly_cron_name }}"
    schedule: "{{ hermes_agent_ai_news_hourly_cron_schedule }}"
    prompt_var: hermes_agent_ai_news_hourly_cron_prompt
    skill: ""
    enabled_toolsets: "{{ hermes_agent_pepper_research_toolsets | difference(['kanban']) }}"
    deliver: "slack:{{ hermes_agent_ai_news_hourly_channel }}"
    identities: [pepper]
    enabled: >-
      {{ hermes_agent_ai_news_hourly_enabled | bool
         and hermes_agent_pepper_research_enabled | bool
         and hermes_agent_ai_news_hourly_channel | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0 }}
