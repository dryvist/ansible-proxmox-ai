---
# Slack report channel per named profile, keyed by profile name. Named
# profiles hold no Slack token (test_profile_slack_single_owner.py), so the
# primary gateway delivers their Slack cron output only through a
# `gateway.profile_routes` entry for that profile; without one, cron preflight
# refuses the job ("delivery platform 'slack' has no gateway credentials").
# A chat_id route also sends that channel's inbound messages to the profile,
# so each profile gets its own channel rather than sharing the home channel.
# Ids come from the agent roster, beside the home channel.
hermes_agent_slack_profile_channels: >-
  {{ (ai_agents | default({})).get(hermes_agent_id, {}).get('slack', {})
     .get('profile_channels', {}) | default({}, true) }}
