---
# Slack report channel per named profile, keyed by profile name. Named
# profiles hold no Slack token (test_profile_slack_single_owner.py), so the
# primary gateway delivers their Slack cron output only through a
# `gateway.profile_routes` entry for that profile; without one, cron preflight
# refuses the job ("delivery platform 'slack' has no gateway credentials").
# A chat_id route also sends that channel's inbound messages to the profile,
# so each profile gets its own channel rather than sharing the home channel.
# Resolved like the home channel: the agent roster first, then the identity's
# OpenBao domain (key SLACK_PROFILE_CHANNELS), then the run environment's
# SLACK_<ID>_PROFILE_CHANNELS. The last two are JSON objects. Invalid JSON
# fails the converge instead of silently dropping every route.
hermes_agent_slack_profile_channels: >-
  {{ (ai_agents | default({})).get(hermes_agent_id, {}).get('slack', {}).get('profile_channels')
     | default((hermes_agent_bao | default({})).get('SLACK_PROFILE_CHANNELS')
               | default(lookup('env', 'SLACK_' ~ hermes_agent_env_prefix ~ '_PROFILE_CHANNELS'), true)
               | default('{}', true) | from_json, true) }}

# Every report channel per profile, as a list. A map value is one channel id
# or a list of them; the first is the profile's default report channel.
hermes_agent_slack_profile_channel_lists: >-
  {%- set ns = namespace(out={}) -%}
  {%- for profile, value in (hermes_agent_slack_profile_channels
       if hermes_agent_slack_profile_channels is mapping else {}).items() -%}
  {%-   set _ = ns.out.update({profile: ([value] if value is string else (value | list))}) -%}
  {%- endfor -%}
  {{ ns.out }}

# The one deliver-target projection used by profile-homed cron jobs. A map
# value is one channel id or a list of them; the target is the profile's
# first (default) report channel.
hermes_agent_slack_profile_deliver_targets: >-
  {%- set ns = namespace(out={}) -%}
  {%- for profile, value in (hermes_agent_slack_profile_channels
       if hermes_agent_slack_profile_channels is mapping else {}).items() -%}
  {%-   set _ = ns.out.update({profile: 'slack:' ~ (value if value is string else value[0])}) -%}
  {%- endfor -%}
  {{ ns.out }}
