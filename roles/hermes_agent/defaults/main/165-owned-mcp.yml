---
hermes_agent_owned_mcp_slugs: >-
  {{ ai_agent_owner | default({})
     | dict2items
     | selectattr('value', 'equalto', hermes_agent_id)
     | map(attribute='key')
     | list }}

# The secrets collection stores this field in the agent's `apps/<agent>-gw` leaf.
hermes_agent_gateway_key_field: >-
  {{ hermes_agent_id | replace('-', '_') ~ '_agentgateway_key' }}
