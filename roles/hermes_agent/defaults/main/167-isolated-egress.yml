---
# The shared projection validates hostnames before rendering the proxy policy.
hermes_agent_isolated_router_host: >-
  {{ (hermes_agent_egress_inventory | default({})).hermes_agent_model_base_url
     | default(hermes_agent_model_base_url) | ansible.builtin.urlsplit('hostname') }}
hermes_agent_isolated_openbao_host: >-
  {{ lookup('env', 'SECRET_STORE_ADDR') | default(lookup('env', 'BAO_ADDR'), true)
     | ansible.builtin.urlsplit('hostname') }}
hermes_agent_isolated_youtrack_host: "{{ hermes_agent_youtrack_mcp_url | ansible.builtin.urlsplit('hostname') }}"
# Runtime install hosts, kept apart from the endpoints above: the code host with its raw and
# release-asset hosts, the Python index and its file host, the vendor asset host and the Node
# distribution host. The isolated guest's installer runs with --skip-browser, so no browser host.
hermes_agent_isolated_install_egress_hosts:
  - github.com
  - raw.githubusercontent.com
  - objects.githubusercontent.com
  - release-assets.githubusercontent.com
  - pypi.org
  - files.pythonhosted.org
  - hermes-assets.nousresearch.com
  - nodejs.org
# egress.yml replaces this on isolated guests; empty for --tags runs that skip agent-egress.yml.
hermes_agent_proxy_environment: {}
