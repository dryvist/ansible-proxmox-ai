---
# Model-routing landscape review: weekly, read-only.
hermes_agent_model_routing_review_enabled: true
hermes_agent_model_routing_review_cron_name: model-routing-review
hermes_agent_model_routing_review_cron_schedule: "59 10 * * 1"
hermes_agent_direct_cron_jobs_recurring_catalog_model_routing_review:
  - name: "{{ hermes_agent_model_routing_review_cron_name }}"
    schedule: "{{ hermes_agent_model_routing_review_cron_schedule }}"
    prompt_var: hermes_agent_model_routing_review_cron_prompt
    skill: ""
    deliver: "{{ hermes_agent_donna_deliver }}"
    failure_deliver: "{{ hermes_agent_donna_failure_deliver }}"
    identities: [donna]
    enabled: >-
      {{ hermes_agent_model_routing_review_enabled | bool
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
