---
# --- Repo crawl: proactive maintenance findings across an allowlisted set ----
# Daily MONITOR-MODE cron (agentic, deliberately NOT --no-agent): a pre-check
# script shallow-checks out each repo in hermes_agent_repo_crawl_repos, runs
# the nix-hermes bundle's dryvist/repo-crawl skill detector, drops findings
# already seen (hash in state), and only wakes the agent (the upstream
# `wakeAgent` gate) when there is something genuinely new AND the bot does not
# already have hermes_agent_repo_crawl_max_open_prs+ open PRs org-wide — never
# pile more findings onto an already-busy review queue. Off by default; the
# repo allowlist defaults empty.
hermes_agent_repo_crawl_enabled: false
hermes_agent_repo_crawl_cron_name: repo-crawl
hermes_agent_repo_crawl_cron_schedule: "17 6 * * *"
hermes_agent_repo_crawl_script_name: hermes-repo-crawl.py
# Each entry: {repo: "owner/name", boundary: "public"|"private"}. Explicit
# per-repo, never auto-detected — the gh wrapper (separately landing) refuses
# a boundary guess it cannot itself verify, and an allowlist the operator
# already curated is the right place to say which boundary each entry is.
hermes_agent_repo_crawl_repos: []
hermes_agent_repo_crawl_max_open_prs: 3
hermes_agent_repo_crawl_skill: dryvist/repo-crawl
# Checked once the agent wakes: `hermes cron create` has no per-job
# environment override, so the prompt is the only lever available here to
# reach a cron-triggered agent run. The default token set is `review` (scoped
# for reading others' PRs); authoring one needs the author set instead.
hermes_agent_repo_crawl_cron_prompt: >-
  New repo-crawl findings are in
  {{ hermes_agent_hermes_home }}/data/repo-crawl/findings.json (this run's
  new, previously-unseen findings only — already-seen ones are pre-filtered
  by hash). Use the repo-crawl skill to triage them and open or update a pull
  request per actionable finding. Before any `gh` call that creates or
  modifies a pull request, export HERMES_GH_TOKEN_SET=author first. Skip a
  finding you cannot act on safely and say why.

# --- markdownlint-cli2 (detect.py check D6 needs it on PATH) -----------------
# renovate: datasource=npm depName=markdownlint-cli2
hermes_agent_markdownlint_cli2_version: "0.23.3"
