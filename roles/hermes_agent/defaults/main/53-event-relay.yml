---
# --- hermes-event-relay ------------------------------------------------------
# Pulls event messages from a configured queue and replays each, re-signed with
# the webhook secret, to the local `github` webhook route. Off by default.
# Queue coordinates come from the environment (secret store). Queue
# credentials are short-lived: the relay reads them at run time from an OpenBao
# assumed-role path with the private-boundary AppRole. Converge fails if the
# relay is enabled without these inputs.
hermes_agent_event_relay_enabled: false
hermes_agent_event_relay_queue_service: >-
  {{ lookup('env', 'HERMES_EVENT_RELAY_QUEUE_SERVICE') | default('', true) }}
hermes_agent_event_relay_queue_url: >-
  {{ lookup('env', 'HERMES_EVENT_RELAY_QUEUE_URL') | default('', true) }}
hermes_agent_event_relay_dlq_url: >-
  {{ lookup('env', 'HERMES_EVENT_RELAY_DLQ_URL') | default('', true) }}
hermes_agent_event_relay_queue_region: >-
  {{ lookup('env', 'HERMES_EVENT_RELAY_QUEUE_REGION') | default('', true) }}
hermes_agent_event_relay_bao_addr: >-
  {{ hostvars['localhost'].openbao_secrets_active_addr
     | default(lookup('env', 'BAO_ADDR'), true) }}
hermes_agent_event_relay_bao_role_id: >-
  {{ lookup('env', hermes_agent_github_vault_env_prefix ~ 'GITHUB_PRIVATE_VAULT_ROLE_ID')
     | default('', true) }}
hermes_agent_event_relay_bao_secret_id: >-
  {{ lookup('env', hermes_agent_github_vault_env_prefix ~ 'GITHUB_PRIVATE_VAULT_SECRET_ID')
     | default('', true) }}
hermes_agent_event_relay_bao_creds_path: aws/sts/hermes-webhook-consumer
# Dead-man ping sent after each stats line; empty = no ping.
hermes_agent_event_relay_healthcheck_url: >-
  {{ lookup('env', 'DEADMAN_HC_URL_HERMES_EVENT_RELAY') | default('', true) }}
hermes_agent_event_relay_stats_seconds: 300
# Events go to <base>/<route>, the route chosen by the payload's
# repository.private (true -> private route and target_base, false -> public
# route and target_base_public, the public-review gateway's receiver).
hermes_agent_event_relay_target_base: http://127.0.0.1:{{ hermes_agent_webhook_port }}/webhooks
hermes_agent_event_relay_target_base_public: >-
  http://127.0.0.1:{{ hermes_agent_github_public_gateway_port }}/webhooks
hermes_agent_event_relay_route_public: github-public
hermes_agent_event_relay_route_private: github-private
hermes_agent_event_relay_venv: /opt/hermes-event-relay
hermes_agent_event_relay_script_path: /usr/local/libexec/hermes-event-relay.py
hermes_agent_event_relay_env_path: /etc/hermes-event-relay.env
# Dify workflow routes, checked before the default route above. A route starts
# one streaming run of a Dify workflow app with its per-app key (sent as a
# Bearer header, never logged) and logs the run id. The base URL and app keys
# come from the environment; a route with an empty base or key is dropped by
# the relay at start. The first matching route wins. Dify input names are the
# keys of `inputs`; each value is a dotted path into the GitHub payload.
hermes_agent_event_relay_dify_base: >-
  {{ lookup('env', 'HERMES_EVENT_RELAY_DIFY_BASE') | default('', true) }}
hermes_agent_event_relay_dify_keys:
  RELAY_DIFY_KEY_CI_FIXER: >-
    {{ lookup('env', 'HERMES_EVENT_RELAY_DIFY_KEY_CI_FIXER') | default('', true) }}
  RELAY_DIFY_KEY_CODE_SIMPLIFIER: >-
    {{ lookup('env', 'HERMES_EVENT_RELAY_DIFY_KEY_CODE_SIMPLIFIER') | default('', true) }}
  RELAY_DIFY_KEY_DOCS_UPDATER: >-
    {{ lookup('env', 'HERMES_EVENT_RELAY_DIFY_KEY_DOCS_UPDATER') | default('', true) }}
  RELAY_DIFY_KEY_DOC_CONTRADICTION_FINDER: >-
    {{ lookup('env', 'HERMES_EVENT_RELAY_DIFY_KEY_DOC_CONTRADICTION_FINDER') | default('', true) }}
hermes_agent_event_relay_routes:
  - name: ci-fixer
    base: "{{ hermes_agent_event_relay_dify_base }}"
    app_key_env: RELAY_DIFY_KEY_CI_FIXER
    timeout: 30
    match:
      event: check_run
      action: completed
      where: {check_run.conclusion: failure}
    inputs:
      repo: repository.full_name
      check_name: check_run.name
      head_sha: check_run.head_sha
      html_url: check_run.html_url
  - name: code-simplifier
    base: "{{ hermes_agent_event_relay_dify_base }}"
    app_key_env: RELAY_DIFY_KEY_CODE_SIMPLIFIER
    timeout: 30
    match:
      event: pull_request
      action: [opened, ready_for_review]
    inputs:
      repo: repository.full_name
      pr: pull_request.number
      head_sha: pull_request.head.sha
  - name: docs-updater
    base: "{{ hermes_agent_event_relay_dify_base }}"
    app_key_env: RELAY_DIFY_KEY_DOCS_UPDATER
    timeout: 30
    match:
      event: pull_request
      action: closed
      where: {pull_request.merged: true}
    inputs:
      repo: repository.full_name
      pr: pull_request.number
      merge_sha: pull_request.merge_commit_sha
  # Disabled until its app key exists: an empty key drops the route at start.
  - name: doc-contradiction-finder
    base: "{{ hermes_agent_event_relay_dify_base }}"
    app_key_env: RELAY_DIFY_KEY_DOC_CONTRADICTION_FINDER
    timeout: 30
    match:
      event: pull_request
      action: closed
      where: {pull_request.merged: true}
    # merged is a Dify text input, so its boolean value is sent as "true" or "false".
    text_inputs: [merged]
    inputs:
      action: action
      merged: pull_request.merged
      org: repository.owner.login
      repo: repository.name
      pr_number: pull_request.number
