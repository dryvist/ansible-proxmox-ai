---
# --- hermes-event-relay ------------------------------------------------------
# Pulls event messages from a configured queue and replays each, re-signed with
# the webhook secret, to the local `github` webhook route. Off by default.
# Every queue coordinate and credential comes from the environment (secret
# store); converge fails if the relay is enabled without them.
hermes_agent_event_relay_enabled: false
hermes_agent_event_relay_queue_service: >-
  {{ lookup('env', 'HERMES_EVENT_RELAY_QUEUE_SERVICE') | default('', true) }}
hermes_agent_event_relay_queue_url: >-
  {{ lookup('env', 'HERMES_EVENT_RELAY_QUEUE_URL') | default('', true) }}
hermes_agent_event_relay_dlq_url: >-
  {{ lookup('env', 'HERMES_EVENT_RELAY_DLQ_URL') | default('', true) }}
hermes_agent_event_relay_queue_region: >-
  {{ lookup('env', 'HERMES_EVENT_RELAY_QUEUE_REGION') | default('', true) }}
hermes_agent_event_relay_access_key_id: >-
  {{ lookup('env', 'HERMES_EVENT_RELAY_ACCESS_KEY_ID') | default('', true) }}
hermes_agent_event_relay_secret_access_key: >-
  {{ lookup('env', 'HERMES_EVENT_RELAY_SECRET_ACCESS_KEY') | default('', true) }}
# Dead-man ping sent after each stats line; empty = no ping.
hermes_agent_event_relay_healthcheck_url: >-
  {{ lookup('env', 'DEADMAN_HC_URL_HERMES_EVENT_RELAY') | default('', true) }}
hermes_agent_event_relay_stats_seconds: 300
# Events go to <base>/<route>, the route chosen by the payload's
# repository.private (true -> private route, otherwise public route).
hermes_agent_event_relay_target_base: http://127.0.0.1:{{ hermes_agent_webhook_port }}/webhooks
hermes_agent_event_relay_route_public: github-public
hermes_agent_event_relay_route_private: github-private
hermes_agent_event_relay_venv: /opt/hermes-event-relay
hermes_agent_event_relay_script_path: /usr/local/libexec/hermes-event-relay.py
hermes_agent_event_relay_env_path: /etc/hermes-event-relay.env
