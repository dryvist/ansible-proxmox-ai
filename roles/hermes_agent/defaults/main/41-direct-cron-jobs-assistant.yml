---
hermes_agent_pepper_digest_allowed_destinations: >-
  {{ ['local']
     + (['slack:' ~ (hermes_agent_slack_home_channel | default('') | trim)]
        if hermes_agent_slack_home_channel | default('') | trim | length > 0 else []) }}
# Output target for every job owned by the donna identity, including the
# recurring ones in 46-*. `local` writes each run's output to the job's own
# directory under the cron output store on the host. Set it to a `slack:<channel>`
# target to deliver to Slack; that target runs only when the identity has a
# connected Slack adapter.
# A job can override it with its own `deliver`.
hermes_agent_donna_deliver: local
# Failure-notice target for the same jobs: a separate alerts channel, never the
# main output channel (inventory group_vars set both for the donna identity).
hermes_agent_donna_failure_deliver: local

hermes_agent_direct_cron_jobs_assistant:
  # --- Assistant-identity duties ---------------------------------------------
  # Scoped by `identities` so the ops agent never picks them up, exactly as the
  # ops jobs below are never picked up by an assistant. Schedules are UTC
  # (hermes_agent_timezone is pinned).
  #
  # STAGGER: every job below shares the gateway's serving tier with the
  # ops-identity fleet in 43-direct-cron-jobs-core.yml and its siblings. The
  # identity scope keeps CREDENTIALS separate, not compute. The tier admits
  # exactly 2 concurrent requests, and a card runs 25-45 minutes, so two cards
  # starting in the same minute can exhaust the router's retry budget.
  # tests/hermes_agent/test_cron_stagger.py resolves every enabled entry in
  # hermes_agent_direct_cron_jobs, this identity's jobs included, and fails on
  # a shared start minute or a recurring job on the board digest tick.
  - name: assistant-pulse
    # Hourly, on an odd minute that starts no other guarded job in any hour.
    schedule: "39 * * * *"
    prompt_var: hermes_agent_assistant_pulse_prompt
    skill: ""
    enabled: true
    identities: [donna]
    deliver: "{{ hermes_agent_donna_deliver }}"
    failure_deliver: "{{ hermes_agent_donna_failure_deliver }}"
  - name: assistant-inbox-groom
    # Mornings, ahead of the 10:57 brief so the brief reads a groomed inbox.
    # Minute 52 starts no other guarded job.
    schedule: "52 10 * * *"
    prompt_var: hermes_agent_assistant_inbox_groom_prompt
    skill: ""
    enabled: true
    identities: [donna]
    deliver: "{{ hermes_agent_donna_deliver }}"
    failure_deliver: "{{ hermes_agent_donna_failure_deliver }}"
  - name: assistant-daily-brief
    # Hourly at :57; local output avoids per-run Slack delivery at this cadence.
    schedule: "57 * * * *"
    prompt_var: hermes_agent_assistant_daily_brief_prompt
    skill: ""
    enabled: true
    identities: [donna]
    deliver: local
    failure_deliver: local
  # Working hours only, and deliberately not hourly: a nudge that arrives
  # constantly is noise, and noise is how a blocker list gets ignored.
  - name: assistant-decision-nudge
    schedule: "53 13,17,21 * * *"
    prompt_var: hermes_agent_assistant_nudge_prompt
    skill: ""
    enabled: true
    identities: [donna]
    deliver: "{{ hermes_agent_donna_deliver }}"
    failure_deliver: "{{ hermes_agent_donna_failure_deliver }}"
  - name: assistant-evening-wrap
    schedule: "10 23 * * *"
    prompt_var: hermes_agent_assistant_evening_wrap_prompt
    skill: ""
    enabled: true
    identities: [donna]
    deliver: "{{ hermes_agent_donna_deliver }}"
    failure_deliver: "{{ hermes_agent_donna_failure_deliver }}"
  - name: assistant-nightly-research
    schedule: "40 2 * * *"
    prompt_var: hermes_agent_assistant_research_prompt
    skill: ""
    enabled: true
    identities: [donna]
    deliver: "{{ hermes_agent_donna_deliver }}"
    failure_deliver: "{{ hermes_agent_donna_failure_deliver }}"
  - name: assistant-task-triage
    schedule: "27 * * * *"
    prompt_var: hermes_agent_assistant_task_triage_prompt
    skill: ""
    enabled: true
    identities: [donna]
    deliver: local
    failure_deliver: local
  - name: assistant-weekly-review
    schedule: "31 15 * * 0"
    prompt_var: hermes_agent_assistant_weekly_review_prompt
    skill: ""
    enabled: true
    identities: [donna]
    deliver: "{{ hermes_agent_donna_deliver }}"
    failure_deliver: "{{ hermes_agent_donna_failure_deliver }}"

  - name: pepper-nightly-intake
    enabled_toolsets: [kanban, youtrack_intake]
    schedule: "17 6 * * *"
    prompt_var: hermes_agent_pepper_intake_prompt
    skill: ""
    enabled: "{{ hermes_agent_pepper_intake_enabled | default(false) | bool }}"
    identities: [pepper]
    deliver: local
    failure_deliver: local
  - name: pepper-weekly-digest
    schedule: "47 7 * * 0"
    prompt_var: hermes_agent_pepper_digest_prompt
    skill: ""
    enabled: "{{ hermes_agent_pepper_digest_deliver | default('') | length > 0 }}"
    identities: [pepper]
    deliver: "{{ hermes_agent_pepper_digest_deliver | default('') }}"
    failure_deliver: local
