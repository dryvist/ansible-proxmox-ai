---
hermes_agent_pepper_vault_path: /var/lib/pepper-evidence/vault
# renovate: datasource=npm depName=@modelcontextprotocol/server-filesystem
hermes_agent_pepper_filesystem_mcp_version: 2.2.0
# The identity view is the only source; never fall back to controller credentials.
hermes_agent_pepper_vault_repo_url: >-
  {{ (hermes_agent_bao | default({})).get('PEPPER_VAULT_REPO_URL', '')
     if hermes_agent_id == 'pepper' else '' }}
hermes_agent_pepper_vault_role_id: >-
  {{ lookup('env', 'PEPPER_VAULT_ROLE_ID') | default('', true)
     if hermes_agent_id == 'pepper' else '' }}
hermes_agent_pepper_vault_secret_id: >-
  {{ lookup('env', 'PEPPER_VAULT_SECRET_ID') | default('', true)
     if hermes_agent_id == 'pepper' else '' }}
hermes_agent_pepper_vault_bao_addr: >-
  {{ hostvars['localhost'].openbao_secrets_active_addr
     | default(lookup('env', 'BAO_ADDR'), true)
     if hermes_agent_id == 'pepper' else '' }}
hermes_agent_pepper_vault_github_token_mount: github-pepper
hermes_agent_pepper_vault_github_token_set: pepper-vault-read
hermes_agent_pepper_vault_env_path: /etc/hermes-pepper-vault.env
hermes_agent_pepper_vault_refresh_script_path: /usr/local/libexec/hermes-pepper-vault-refresh
hermes_agent_pepper_vault_git_credential_helper_path: /usr/local/libexec/hermes-pepper-vault-git-credential
hermes_agent_pepper_vault_enabled: >-
  {{ hermes_agent_id == 'pepper'
     and hermes_agent_pepper_vault_repo_url | trim | length > 0
     and hermes_agent_pepper_vault_bao_addr | trim | length > 0
     and hermes_agent_pepper_vault_role_id | trim | length > 0
     and hermes_agent_pepper_vault_secret_id | trim | length > 0 }}
