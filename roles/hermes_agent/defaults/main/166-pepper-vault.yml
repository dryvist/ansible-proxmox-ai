---
hermes_agent_pepper_vault_path: /var/lib/hermes/evidence/vault
# renovate: datasource=npm depName=@modelcontextprotocol/server-filesystem
hermes_agent_pepper_filesystem_mcp_version: 2.2.0
# The identity view is the only source; never fall back to controller credentials.
hermes_agent_pepper_vault_repo_url: >-
  {{ (hermes_agent_bao | default({})).get('PEPPER_VAULT_REPO_URL', '')
     if hermes_agent_id == 'pepper' else '' }}
hermes_agent_pepper_vault_read_token: >-
  {{ (hermes_agent_bao | default({})).get('PEPPER_VAULT_READ_TOKEN', '')
     if hermes_agent_id == 'pepper' else '' }}
hermes_agent_pepper_vault_enabled: >-
  {{ hermes_agent_id == 'pepper'
     and hermes_agent_pepper_vault_repo_url | trim | length > 0
     and hermes_agent_pepper_vault_read_token | trim | length > 0 }}
hermes_agent_pepper_vault_git_environment:
  GIT_TERMINAL_PROMPT: "0"
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: credential.helper
  GIT_CONFIG_VALUE_0: ""
  GIT_CONFIG_KEY_1: http.extraHeader
  GIT_CONFIG_VALUE_1: >-
    Authorization: Basic {{ ('x-access-token:' ~ hermes_agent_pepper_vault_read_token) | b64encode }}
