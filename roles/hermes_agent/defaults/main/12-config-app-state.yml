---
# Top-level config.yaml keys Hermes writes for its own bookkeeping, in the
# default home and in every profile home. The role does not own them: before
# each config template, tasks/config_app_state.yml reads them from the live file
# and the template renders them back, so a converge never resets them.
# - _config_version: the config migration stamp.
# - _left_core_installed, _left_core_scoped, _left_core_used: plugins moved out
#   of core are installed and scoped once per home; without these keys Hermes
#   repeats that work at the next start.
# - known_plugin_toolsets: the plugin toolsets Hermes recorded per platform.
# monitoring.install_id (the gateway's service.instance.id) is kept the same way.
hermes_agent_config_app_owned_keys:
  - _config_version
  - _left_core_installed
  - _left_core_scoped
  - _left_core_used
  - known_plugin_toolsets
