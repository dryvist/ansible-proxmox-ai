---
# Hostnames only: the proxy policy never consumes the identity's secret view.
hermes_agent_pepper_router_host: >-
  {{ (hermes_agent_egress_inventory | default({})).hermes_agent_model_base_url
     | default(hermes_agent_model_base_url) | ansible.builtin.urlsplit('hostname') }}
hermes_agent_pepper_openbao_host: >-
  {{ lookup('env', 'SECRET_STORE_ADDR') | default(lookup('env', 'BAO_ADDR'), true)
     | ansible.builtin.urlsplit('hostname') }}
# Set these non-secret inventory inputs independently of credential-bearing URLs.
hermes_agent_pepper_youtrack_host: ""
hermes_agent_pepper_vault_host: ""
