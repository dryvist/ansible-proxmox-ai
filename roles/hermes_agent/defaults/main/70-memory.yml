---
# --- Memory: best self-hostable as of June 2026 (Agy-validated) ---
# Hindsight: local knowledge-graph + multi-strategy retrieval. Runs alongside the
# always-on built-in MEMORY.md/USER.md. The whole HERMES_HOME is the durable surface.
# The provider name alone is NOT enough: hindsight defaults to CLOUD mode, and
# with no HINDSIGHT_API_KEY its is_available() returns false — every memory
# tool call warns "Memory is not available" (the recurring digest warning).
# local_embedded runs the daemon in-guest (hindsight-all, ~200 MB, installed
# below) and needs an LLM for entity extraction — pointed at the same router
# alias the agent brain uses, so memory never adds an external dependency.
hermes_agent_memory_provider: hindsight
# local_external: the plugin dials the standalone HA Hindsight service (two
# stateless replicas behind the Traefik pool) instead of running the embedded
# daemon in-guest. The upstream plugin's mode set is
# {cloud, local_embedded, local_external}; local_external takes api_url (+
# optional api_key — omitted here: the API is unauthenticated inside the
# default-deny firewall). local_embedded remains supported for rollback.
hermes_agent_memory_mode: local_external
hermes_agent_memory_api_url: >-
  https://hindsight.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  or undef('PROXMOX_SUBDOMAIN required (Doppler)') }}
hermes_agent_memory_api_key: >-
  {{ bao_apps_secrets.hindsight_api_key
     | mandatory('hindsight_api_key missing from bao_apps_secrets') }}
hermes_agent_memory_llm_model: "{{ hermes_brain_model }}"

# Per-AGENT memory isolation — deliberately not per-profile.
#
# The memory service is multi-tenant by bank: every route is scoped
# /v1/<tenant>/banks/<bank_id>/..., so two agents pointed at ONE deployment stay
# fully separated as long as their bank ids differ. A second agent therefore
# needs no second memory instance, no second database, and no extra container.
#
# This is a static bank_id, NOT bank_id_template, and that is load-bearing:
# tasks/profiles.yml documents an explicit decision to leave the template unset
# so every profile of one agent SHARES a bank. That keeps the default profile
# able to read a moved job's findings and preserves memory continuity when a
# card changes assignee. Setting a {profile} template here would silently
# reverse that decision for the existing agent. Isolate agents, not profiles.
#
# The value matches the plugin's own static default for the existing agent, so
# this is a no-op for it and only takes effect for a differently-named agent.
hermes_agent_memory_bank_id: "{{ hermes_agent_id }}"
# The gateway's hindsight plugin lazily installs its client when it is absent,
# but that path can never succeed in this uv venv (no pip/ensurepip). The role
# therefore installs an explicit, Renovate-managed client pin into the Hermes
# venv and asserts it immediately. The current Hermes v2026.8.3 plugin accepts
# hindsight-client >=0.6.1; the exact pin is this deployment's tested version,
# not a copy of that minimum. Bump it with the Hermes package and keep the
# managed post-install assertion passing.
#
# Split into a bare version plus a derived constraint so Renovate can see it.
# The annotation manager captures whatever follows the colon as the version, so
# an "==0.6.1" literal resolves to nothing on PyPI and the pin stays invisible —
# which is exactly how it sat three minor versions behind unnoticed. Same
# version-plus-derived-string shape the openbao role uses for its plugin pins.
#
# renovate: datasource=pypi depName=hindsight-client
hermes_agent_hindsight_client_version: "0.9.2"
hermes_agent_hindsight_client_pin: "=={{ hermes_agent_hindsight_client_version }}"

# The catalog plugin that will replace the bundled provider above (Hermes
# tags at or after the one whose plugin-catalog/hindsight.yaml points to
# vectorize-io/hindsight's hindsight-integrations/hermes v1.0.1) declares
# `hindsight-client>=0.10.1,<1`. hermes_agent_hindsight_client_version cannot
# reach that floor until PyPI publishes a 0.10.x hindsight-client release —
# 0.9.2 is the newest available as of this comment. hermes_agent_version
# stays on the bundled-provider tag until both that release exists and
# Renovate has opened the version-bump PRs for it; do not hand-bump either
# pin ahead of that.

# --- Memory failure visibility ------------------------------------------------
# Read from the bundled Hindsight provider in the pinned Hermes v2026.9.11.
# In local_external mode is_available() checks configuration only; the
# MemoryProvider contract explicitly forbids a network check there. Recall and
# retain calls instead share _run_hindsight_operation, which now emits one
# prompt-safe ERROR with request_id, operation, hindsight_failure_count=1 and
# hindsight_degraded=true. The request id is included in the next prefetch as
# [HINDSIGHT_MEMORY_DEGRADED ...], so the agent sees failures even when the
# provider's best-effort recall contract returns an empty context. Direct tool
# errors include the same id. Async retain completion failures and unresolved
# retain timeouts use the same reporting path; successful queue acceptance is
# still non-blocking and does not claim durable storage.
#
# Before the patch, _do_recall caught recall/reflect exceptions at DEBUG and
# returned an empty result; writer errors had only a WARNING after sync_turn
# returned; status-poll exceptions were DEBUG-only; and server-side `failed`
# status counted as complete. The source patch also reports these paths. It
# does not change local_external is_available() into a network probe, nor add
# retries: the provider contract says that check must not perform network I/O.
# Explicit tools already returned tool_error; they now also receive the
# request id and share the central ERROR event. The `/version` capability
# probe is separate from recall/retain: failure falls back to legacy document
# ids and is already followed by a warning when append mode is unavailable.
#
# Bundled-provider-only: these source patches target
# plugins/memory/hindsight/__init__.py in the pinned package. Delete their
# Hindsight-specific patch tasks after the catalog plugin cutover, after
# checking the catalog source for equivalent behavior.
hermes_agent_hindsight_prefetch_timeout_seconds: 10

# --- Logging: config.yaml `logging.level` (installed hermes-agent's
# hermes_logging.py reads cfg["logging"]["level"], default "INFO" if unset).
# DEBUG (not the noisier "trace" — hermes-agent has no such level) so the
# rsyslog->Cribl->Splunk index=hermes chain carries pre-error context and
# config-at-point-in-time lines. rsyslog forwards by programname ('hermes'),
# unaffected by log level, so this only raises event volume, not routing —
# index=hermes runs ~1.3k events/4h at INFO; expect a multiple of that at
# DEBUG (Splunk ingestion has headroom; noted here for visibility).
hermes_agent_log_level: DEBUG

# --- Safety: cap the agentic loop so a runaway can't pin the GPU overnight ---
hermes_agent_max_turns: 90
