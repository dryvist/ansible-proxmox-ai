---
# --- Voice learning: weekly correction review, PR for human approval --------
# Runs the dryvist/voice-learn skill (bundled from JacobPEvans/jpe-ai-voice via
# nix-hermes). It reads user correction turns from Splunk, then opens a pull
# request for a human to approve. It never merges.
#
# Monday 10:30 UTC is 06:30 local while the operator is on EDT. Hermes is pinned
# to UTC, so the job moves to 05:30 local when US daylight time ends.
#
# Gated on the Splunk MCP URL (search) and the short-lived GitHub identity (PR
# open). The job stays disabled until both are configured.
hermes_agent_voice_learn_enabled: true
hermes_agent_voice_learn_cron_name: voice-learn
hermes_agent_voice_learn_cron_schedule: "30 10 * * 1"
hermes_agent_voice_learn_cron_prompt: >-
  Run the voice-learn skill for JacobPEvans/jpe-ai-voice and open a pull request
  for human approval.

hermes_agent_direct_cron_jobs_voice_learn:
  - name: "{{ hermes_agent_voice_learn_cron_name }}"
    schedule: "{{ hermes_agent_voice_learn_cron_schedule }}"
    prompt_var: hermes_agent_voice_learn_cron_prompt
    skill: dryvist/voice-learn
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: >-
      {{ hermes_agent_voice_learn_enabled | bool
         and hermes_agent_splunk_mcp_url | length > 0
         and hermes_agent_github_identity_enabled | bool
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
