---
# --- Recurring job catalog additions (W3 program, agents file S1.2/S1.6) -----
# Four new agentic direct-cron jobs. Every prompt is inline here rather than
# pulled from the pinned ai-llm-prompts catalog (reconcile_direct_cron.yml's
# prompt_var is "an already-resolved var, inline or catalog-preloaded" —
# both are first-class), since each is new work with no upstream prompt file
# yet.
#
# blocked-parent-triage-digest and the daily-status lane-count append (see
# 44-slack-and-status-cron-vars.yml / prompt_catalog.yml) both read HERMES'S
# OWN internal kanban.db via the `kanban` tool every cron/kanban worker
# already carries — never the operator's Vikunja board. That is the same
# recompute_ready mechanism behind a real incident where blocked PARENT
# CARDS in Hermes's own queue starved their todo CHILDREN (recompute_ready
# only promotes a child once every parent is done or archived); the
# Vikunja-bridge lanes (PR7,
# roles/hermes_agent/templates/vikunja-bridge.py.j2) are the complementary
# fix on the OPERATOR'S board. No profile has Vikunja read access wired yet
# (docs/operating-profiles.md: "+ Vikunja/Nautobot later" for homelab-admin
# only), so a job reading the operator's board is not buildable today.
#
# backlog-sweeper is scoped to ZAMMAD ONLY for the same reason: "work it in
# the matching profile" across trackers needs Vikunja read access on at least
# one profile, which does not exist yet. Filed as a follow-up rather than
# half-building cross-tracker routing against a tool no profile has.
# Paused (disable-don't-delete) 2026-10-02: low value relative to the other
# recurring jobs on this fleet. enabled:false stops reconcile from re-creating
# it; an already-installed job on a converged guest is paused by hand or by
# the next explicit retirement task, per this role's existing convention.
hermes_agent_pricing_diff_enabled: false
hermes_agent_pricing_diff_cron_name: pricing-diff
hermes_agent_pricing_diff_cron_schedule: "23 7 * * 3"
hermes_agent_blocked_parent_triage_digest_enabled: true
hermes_agent_blocked_parent_triage_digest_cron_name: blocked-parent-triage-digest
hermes_agent_blocked_parent_triage_digest_cron_schedule: "11 8 * * *"
hermes_agent_router_capacity_digest_enabled: true
hermes_agent_router_capacity_digest_cron_name: router-capacity-digest
hermes_agent_router_capacity_digest_cron_schedule: "37 8 * * *"
hermes_agent_backlog_sweep_enabled: true
hermes_agent_backlog_sweep_cron_name: backlog-sweep
hermes_agent_backlog_sweep_cron_schedule: "41 */4 * * *"
# --- GitHub Actions cache health: read-only, github-maint profile ----------
# Same credential shape as github-maint-review below in 110-*.yml: the
# github-maint profile carries only the read-only token
# (hermes_agent_github_read_token, delivered under the GH_PAT_WRITE_PROJECT_ISSUES
# key), so this job physically cannot write to GitHub. Daily at an hour/minute
# clear of every other GitHub job's phase (github-triage 2,8,14,20;
# bot-pr-triage 4,10,16,22; github-maint-review 1,5,9,13,17,21) and of the
# fleet generally (tests/hermes_agent/test_cron_stagger.py).
#
# No memory/delta state: an unresolved quota problem should keep alerting,
# not go quiet after the first report, so this always re-checks and only
# [SILENT]s when neither threshold is breached that day.
hermes_agent_github_cache_stats_enabled: true
hermes_agent_github_cache_stats_cron_name: github-cache-stats
hermes_agent_github_cache_stats_cron_schedule: "47 3 * * *"
# Reassembled into hermes_agent_direct_cron_jobs by
# 43-direct-cron-jobs-core.yml's concatenation.
hermes_agent_direct_cron_jobs_recurring_catalog:
  - name: "{{ hermes_agent_pricing_diff_cron_name }}"
    schedule: "{{ hermes_agent_pricing_diff_cron_schedule }}"
    prompt_var: hermes_agent_pricing_diff_cron_prompt
    skill: ""
    deliver: "{{ hermes_agent_slack_profile_deliver_targets.get('github-maint', '') }}"
    hermes_home: "{{ hermes_agent_hermes_home }}/profiles/github-maint"
    enabled: >-
      {{ hermes_agent_pricing_diff_enabled | bool
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and 'github-maint' in hermes_agent_slack_profile_deliver_targets }}
  - name: "{{ hermes_agent_blocked_parent_triage_digest_cron_name }}"
    schedule: "{{ hermes_agent_blocked_parent_triage_digest_cron_schedule }}"
    prompt_var: hermes_agent_blocked_parent_triage_digest_cron_prompt
    skill: ""
    deliver: "slack:{{ hermes_agent_slack_hermes_all_channel }}"
    enabled: >-
      {{ hermes_agent_blocked_parent_triage_digest_enabled | bool
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and hermes_agent_slack_home_channel | length > 0 }}
  - name: "{{ hermes_agent_router_capacity_digest_cron_name }}"
    system: splunk
    schedule: "{{ hermes_agent_router_capacity_digest_cron_schedule }}"
    prompt_var: hermes_agent_router_capacity_digest_cron_prompt
    skill: dryvist/splunk-monitor
    deliver: "{{ hermes_agent_slack_profile_deliver_targets.get('splunk-admin', '') }}"
    hermes_home: "{{ hermes_agent_hermes_home }}/profiles/splunk-admin"
    enabled: >-
      {{ hermes_agent_router_capacity_digest_enabled | bool
         and hermes_agent_splunk_monitor_enabled | bool
         and hermes_agent_splunk_mcp_url | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and 'splunk-admin' in hermes_agent_slack_profile_deliver_targets }}
  # Withdrawn: exceeds the 1800s wall clock. enabled:false makes
  # reconcile_direct_cron.yml stop re-creating it; the pause task in
  # cron_reconcile.yml stops the one already on the guest.
  - name: "{{ hermes_agent_backlog_sweep_cron_name }}"
    schedule: "{{ hermes_agent_backlog_sweep_cron_schedule }}"
    prompt_var: hermes_agent_backlog_sweep_cron_prompt
    skill: dryvist/zammad-incidents
    deliver: "{{ hermes_agent_slack_profile_deliver_targets.get('homelab-admin', '') }}"
    hermes_home: "{{ hermes_agent_hermes_home }}/profiles/homelab-admin"
    enabled: false
  - name: "{{ hermes_agent_github_cache_stats_cron_name }}"
    schedule: "{{ hermes_agent_github_cache_stats_cron_schedule }}"
    prompt_var: hermes_agent_github_cache_stats_cron_prompt
    skill: ""
    deliver: "{{ hermes_agent_slack_profile_deliver_targets.get('github-maint', '') }}"
    hermes_home: "{{ hermes_agent_hermes_home }}/profiles/github-maint"
    enabled: >-
      {{ hermes_agent_github_cache_stats_enabled | bool
         and hermes_agent_github_read_token | length > 0
         and hermes_agent_slack_bot_token | length > 0
         and hermes_agent_slack_app_token | length > 0
         and 'github-maint' in hermes_agent_slack_profile_deliver_targets }}
