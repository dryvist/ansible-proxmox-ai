---
- name: Assert the relay knows which runtime to drive
  ansible.builtin.assert:
    that:
      - herdr_remote_remotes | length > 0
    fail_msg: >-
      herdr_remote found no host in herdr_group. The relay drives the runtime
      over SSH via HERDR_REMOTES; without it the dashboard renders an empty
      fleet rather than erroring, so this is asserted at converge time instead.
    quiet: true

- name: Assert the relay is not left unauthenticated behind a reachable bind
  ansible.builtin.assert:
    that:
      - herdr_remote_relay_token | length > 0
        or herdr_remote_bind_host in ['127.0.0.1', 'localhost', '::1']
    fail_msg: >-
      herdr_remote binds {{ herdr_remote_bind_host }} with no HERDR_RELAY_TOKEN.
      Upstream only waives the token for loopback origins, so a non-loopback
      bind without one exposes agent approvals to anything that reaches the
      guest past Traefik. Set HERDR_RELAY_TOKEN, or bind loopback.
    quiet: true

- name: Converge the guest from the nix-ai flake
  when: herdr_remote_deploy_enabled | bool
  ansible.builtin.include_role:
    name: nixos_deploy
  vars:
    nixos_deploy_flake_ref: "{{ herdr_remote_flake_ref }}"
    nixos_deploy_host_attr: "{{ herdr_remote_host_attr }}"

- name: Deploy the herdr-remote environment file
  ansible.builtin.template:
    src: herdr-remote-env.j2
    dest: "{{ herdr_remote_env_file }}"
    owner: "{{ herdr_remote_user }}"
    group: "{{ herdr_remote_user }}"
    mode: "0600"
  no_log: true
  notify: Restart herdr-remote

- name: Ensure herdr-remote is running
  ansible.builtin.systemd_service:
    name: herdr-remote
    state: started
    enabled: true
    daemon_reload: true
  when: herdr_remote_deploy_enabled | bool
  tags:
    - molecule-notest

- name: Apply any pending restart before verifying
  ansible.builtin.meta: flush_handlers

- name: Verify the relay is listening
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ herdr_remote_bind_port }}"
    timeout: 30
  when: herdr_remote_deploy_enabled | bool
  tags:
    - molecule-notest
