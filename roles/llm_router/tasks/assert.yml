---
# Layer 1 — render-time contract assertions for the LiteLLM router config.
#
# Guards the "compress-death trap": if the model a consumer requests (the Hermes
# brain, Open WebUI's default) is NOT a first-class large/GPU entry carrying a
# non-null context_window, the request falls through to the "*" wildcard
# passthrough, LiteLLM resolves max_input_tokens to null, and every downstream
# caller compresses its context to death. This is the render-time half of the
# check; the hermes_agent Layer 2 gate proves it end-to-end against the live
# router.
#
# Imported at the top of tasks/main.yml so it inherits the `llm_router` tag and
# always runs with the role. Read-only throughout — but no longer offline: the
# last two imports below reach the network (a DNS lookup, then a model-listing
# GET), and both force themselves to run in check mode rather than reporting a
# check they skipped.

- name: Assert the optional Langfuse callback has a complete key pair
  ansible.builtin.assert:
    quiet: true
    that:
      - (llm_router_langfuse_public_key | length == 0) == (llm_router_langfuse_secret_key | length == 0)
    fail_msg: >-
      Set both LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY, or leave both unset;
      the native callback is enabled only as a complete pair.
    success_msg: Langfuse callback credentials are either both present or both absent.

- name: Assert every brain model consumers request is a tuned router entry (not the wildcard)
  ansible.builtin.assert:
    quiet: true
    that:
      # The fabric default the agent/UI actually request must resolve to a
      # first-class entry with a non-null context_window.
      - _llm_router_required_safe_models | difference(_llm_router_safe_models) | length == 0
      - >-
        llm_router_model_group_aliases | dict2items | map(attribute='value')
        | difference(_llm_router_safe_models + llm_router_hermes_router_ids
                     + llm_router_long_context_alias_ids)
        | length == 0
    fail_msg: >-
      Compress-death trap (roles/llm_router/tasks/assert.yml): model(s)
      [{{ _llm_router_required_safe_models | difference(_llm_router_safe_models) | join(', ') }}]
      are requested as the fabric brain but are NOT first-class large/GPU
      entries with a non-null context_window. They would fall
      through to the "*" wildcard passthrough, LiteLLM would resolve
      max_input_tokens to null, and Hermes/Open WebUI would compress every request
      to death (outage 2026-07-08). Add each as an entry with an explicit
      context_window. Constraint: config.yaml.j2 model_info.max_input_tokens.
    success_msg: >-
      Router brain entries carry real context windows
      ({{ _llm_router_required_safe_models | join(', ') }}).
  vars:
    # Safe set = large/GPU chat model ids with a non-null context_window.
    _llm_router_safe_models: >-
      {{ (llm_router_large_models + llm_router_gpu_models)
         | selectattr('context_window', 'defined')
         | rejectattr('context_window', 'none')
         | map(attribute='client_model_id') | list }}
    # The local complexity router (tier hermes-router) is a virtual entry: it
    # never answers directly, it dispatches to llm_router_routine_model /
    # llm_router_primary_model, which _llm_router_required_safe_models already
    # pins above. Admitted here (not folded into _llm_router_safe_models)
    # only so an alias may target it too — same reasoning as
    # llm_router_alias_pairs in 50-servable.yml. llm_router_hermes_router_ids
    # itself is the role default (50-servable.yml) — the ONE derivation every
    # consumer of this carve-out shares, never re-derived per task.
    # The model ids consumers actually request as a brain: ai_default_model
    # (Open WebUI + fabric default) and hermes_brain_model (Hermes' own brain,
    # decoupled 2026-07-19). Both must be tuned entries with a real
    # context_window or their consumer compresses to death. De-duped so a
    # converge where they point at the same id doesn't double-list.
    # The goal judge is a router ROLE (`judge`) rather than a git alias, so its
    # backing model resolves through the role deployments; a name that is
    # neither falls through unchanged and fails the safe-set check below.
    _llm_router_goal_judge_role_target: >-
      {{ llm_router_role_deployments
         | selectattr('role', 'equalto', hermes_goal_judge_model)
         | map(attribute='model') | list | first | default(hermes_goal_judge_model) }}
    _llm_router_required_safe_models: >-
      {{ [ai_default_model,
          llm_router_primary_model,
          llm_router_routine_model,
          llm_router_model_group_aliases.get(hermes_goal_judge_model, _llm_router_goal_judge_role_target)]
         | unique }}

- name: Assert every consumer alias points at a model the serving host will actually serve
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        llm_router_model_group_aliases | dict2items | map(attribute='value')
        | difference(llm_router_all_servable_models + llm_router_hermes_router_ids
                     + llm_router_long_context_alias_ids)
        | length == 0
      # The servable set must itself be first-class entries, or this assert
      # could be satisfied by a model that then compresses its caller to death.
      - llm_router_all_servable_models | difference(_llm_router_safe_models) | length == 0
    fail_msg: >-
      Unroutable alias (roles/llm_router/tasks/assert.yml): alias target(s)
          [{{ llm_router_model_group_aliases | dict2items | map(attribute='value')
              | difference(llm_router_all_servable_models + llm_router_hermes_router_ids
                           + llm_router_long_context_alias_ids)
          | unique | join(', ') }}]
      are not in the large/GPU servable set
      [{{ llm_router_all_servable_models | join(', ') }}],
      the local complexity router [{{ llm_router_hermes_router_ids | join(', ') }}], or
      the long-context entry [{{ llm_router_long_context_alias_ids | join(', ') }}].
      Each backend must list its profile at its own model endpoint: large-tier
      entries are checked against the Mac serving gate, GPU entries against the
      inventory-backed guest. On 2026-07-28 every large-tier alias was in this
      state at once (hermes-default, tool-calling, goal-judge, interim-brain).
      The complexity router is a deliberate exception: it dispatches to
      llm_router_routine_model / llm_router_primary_model (already pinned safe
      above). Fix any other unroutable target by repointing it at
      llm_router_primary_model / llm_router_small_model — NOT by widening this
      list to match a stale alias.
    success_msg: >-
      All {{ llm_router_model_group_aliases | length }} consumer aliases resolve
      into the large/GPU servable set ({{ llm_router_all_servable_models | join(', ') }}) or
      the local complexity router.
  vars:
    # llm_router_hermes_router_ids is the role default (50-servable.yml).
    _llm_router_safe_models: >-
      {{ (llm_router_large_models + llm_router_gpu_models)
         | selectattr('context_window', 'defined')
         | rejectattr('context_window', 'none')
         | map(attribute='client_model_id') | list }}

# Cardinality guard on the hermes-router carve-out itself: exactly one entry
# today (hermes-default). A second hermes-router-tier entry would silently
# widen every consumer of llm_router_hermes_router_ids (llm_router_alias_pairs,
# both asserts above, test_alias_servable.yml) at once — this forces that
# widening to be a reviewed registry change, not an accident.
- name: Assert the hermes-router alias carve-out has exactly one member
  ansible.builtin.assert:
    quiet: true
    that:
      - llm_router_hermes_router_ids | length == 1
    fail_msg: >-
      llm_router_hermes_router_ids (roles/llm_router/defaults/main/50-servable.yml)
      has {{ llm_router_hermes_router_ids | length }} members
      ({{ llm_router_hermes_router_ids | join(', ') }}), not the expected 1.
      A second hermes-router-tier entry widens the alias/role carve-out
      everywhere it is referenced — review before raising this cardinality.
    success_msg: >-
      Exactly one hermes-router entry carries the alias carve-out
      ({{ llm_router_hermes_router_ids | join(', ') }}).

# Same reason as the hermes-router guard above, shaped differently: unlike
# the hermes-router tier (structurally at most one entry by design),
# llm_router_long_context_alias_ids legitimately gathers every >=1M-context
# ZDR OpenRouter entry the catalog carries (several, today) — the pool is
# meant to be wide. What must stay singular is how many of THEM actually
# declare a stable_alias and so contribute a pair here; a second one doing
# so would silently give the long-context alias name two candidate targets,
# with subelements/dict() picking one by iteration order rather than by a
# reviewed decision.
- name: Assert at most one long-context entry actually carries an alias
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_long_context_alias_pairs | length <= 1
    fail_msg: >-
      {{ _llm_router_long_context_alias_pairs | length }} long-context
      entries ({{ llm_router_long_context_alias_ids | join(', ') }} is the
      full candidate pool) declare a stable_alias at once — the alias name
      picked resolves nondeterministically. Give at most one such entry a
      stable_alias.
    success_msg: >-
      At most one long-context entry carries an alias
      ({{ llm_router_long_context_alias_ids | join(', ') }} candidates).
  vars:
    _llm_router_long_context_alias_pairs: >-
      {{ llm_router_alias_pairs
         | selectattr('0.client_model_id', 'in', llm_router_long_context_alias_ids) | list }}

# Hermes profile-list contract. Its own file so a test can import exactly
# this assert and prove the failure path.
- name: Assert the Hermes profile list resolved before virtual-key seeding
  ansible.builtin.import_tasks: assert-hermes-profile-keys.yml

# Every Hermes profile key must reach its own brain model directly. Its own
# file so a test can import exactly this assert and prove the failure path.
- name: Assert every Hermes profile key can reach hermes_brain_model
  ansible.builtin.import_tasks: assert-hermes-profile-key-brain-model.yml

# Hermes fallback-chain contract. Its own file so a test can import exactly
# this assert and prove each failure mode, rather than restating its
# condition where every other Layer-1 assert also runs.
- name: Assert the Hermes fallback chain is ordered, registry-backed, and depth-bounded
  ansible.builtin.import_tasks: assert-fallback-chain.yml

- name: Assert the admission budget bounds every local rung and 429s hand over at once
  ansible.builtin.import_tasks: assert-admission-budget.yml

- name: Assert the vllm/hermes-local prefill-derived window clears the configured floor
  ansible.builtin.import_tasks: assert-prefill-budget-floor.yml

# Serving-identity contract. Its own file so a test can import exactly these two
# tasks and prove the failure path, rather than re-stating their condition.
- name: Assert the heavy-tier serving identity resolved
  ansible.builtin.import_tasks: assert-serving-identity.yml

# Budget/store coupling. Its own file so a test can import exactly this assert
# and prove it fires, rather than re-stating its condition.
- name: Assert the spend budget is backed
  ansible.builtin.import_tasks: assert-budget-backing.yml

# Backend DNS resolution. Its own file so a test can import exactly this
# assert and prove the failure path. Placed after the cheaper jinja-only
# asserts above (a network round trip on the guest costs more than a
# variable comparison) but before the render-parity check below.
- name: Assert every advertised backend hostname resolves
  ansible.builtin.import_tasks: assert-endpoint-dns.yml

# The registry against the canonical model-role map, and every role chain
# against its egress value. Own files so a test can import exactly one assert
# and prove its failure path.
- name: Assert the registry serves exactly what the role map names
  ansible.builtin.import_tasks: assert-llm-roles.yml

- name: Assert every role chain respects its egress value
  ansible.builtin.import_tasks: assert-egress.yml

# Registry/render parity. LAST, deliberately: it renders the whole config
# template, so every cheaper assert above should have already rejected a bad
# registry before this one pays that cost.
- name: Assert the registry and the rendered config agree in both directions
  ansible.builtin.import_tasks: assert-registry-render-parity.yml

# What the registry CLAIMS is served, against what the endpoints actually list.
# LAST: every assert above compares the registry with itself or with a local
# render, so it costs nothing and should reject a bad registry before this one
# pays for a network round trip. Unreachable endpoints and unseeded credentials
# are reported, never fatal — see the file.
- name: Verify the serving gate and the remote tiers list what the registry claims
  ansible.builtin.import_tasks: verify-servable.yml
