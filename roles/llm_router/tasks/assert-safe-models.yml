---
- name: Assert every brain model consumers request is a tuned router entry (not the wildcard)
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_required_safe_models | difference(_llm_router_safe_models) | length == 0
      - >-
        llm_router_model_group_aliases | dict2items | map(attribute='value')
        | difference(llm_router_all_servable_models + llm_router_long_context_alias_ids
                     + llm_router_direct_route_aliases)
        | length == 0
    fail_msg: >-
      Compress-death trap (roles/llm_router/tasks/assert-safe-models.yml): model(s)
      [{{ _llm_router_required_safe_models | difference(_llm_router_safe_models) | join(', ') }}]
      are requested as the fabric brain but are NOT first-class local
      capability groups with a non-null context_window. They would fall through
      to the optional wildcard passthrough. Add a registry member with the
      required catalog context window.
    success_msg: >-
      Router brain entries carry real context windows
      ({{ _llm_router_required_safe_models | join(', ') }}).
  vars:
    _llm_router_safe_models: >-
      {{ llm_router_capability_members
         | selectattr('context_window', 'defined')
         | rejectattr('context_window', 'none')
         | map(attribute='route_group') | unique | list }}
    _llm_router_required_safe_model_inputs: >-
      {{ [ai_default_model, llm_router_primary_model, llm_router_routine_model,
          hermes_brain_model, hermes_goal_judge_model]
         + (llm_router_role_deployments | map(attribute='model') | list) }}
    _llm_router_required_safe_models: >-
      {%- set ns = namespace(models=[]) -%}
      {%- for name in _llm_router_required_safe_model_inputs -%}
      {%- set role = llm_router_role_deployments | selectattr('role', 'equalto', name) | first | default({}) -%}
      {%- set name = role.model | default(name) -%}
      {%- set target = llm_router_model_group_aliases.get(name, name) -%}
      {%- set groups = llm_router_model_registry
           | selectattr('client_model_id', 'equalto', target)
           | selectattr('route_group', 'defined')
           | map(attribute='route_group') | unique | list -%}
      {%- set ns.models = ns.models + (groups if groups else [target]) -%}
      {%- endfor -%}
      {{ ns.models | unique | list }}
