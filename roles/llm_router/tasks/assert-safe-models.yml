---
- name: Assert required local targets and the drained goal judge use safe router entries
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_required_safe_models | difference(_llm_router_safe_models) | length == 0
      - >-
        (llm_router_gpu_profiles_enabled | bool)
        or (
          _llm_router_goal_judge_group
          == (llm_router_d1_zdr_ladder_groups | first
              | default(llm_router_primary_model, true))
          and _llm_router_goal_judge_group
          in (_llm_router_safe_models + _llm_router_zdr_context_groups)
        )
      - >-
        llm_router_model_group_aliases | dict2items | map(attribute='value')
        | difference(llm_router_all_servable_models + llm_router_long_context_alias_ids
                     + llm_router_direct_route_aliases)
        | length == 0
    fail_msg: >-
      Router safety contract failed: local model(s)
      [{{ _llm_router_required_safe_models | difference(_llm_router_safe_models) | join(', ') }}]
      lack context-window-backed local capability groups; with GPU profiles
      drained, Hermes goal judge [{{ _llm_router_goal_judge_group }}] must equal
      the first context-backed ZDR rung
      [{{ llm_router_d1_zdr_ladder_groups | first
          | default(llm_router_primary_model, true) }}] or local primary.
    success_msg: >-
      Local router targets carry real context windows
      ({{ _llm_router_required_safe_models | join(', ') }}); the drained goal
      judge resolves to the first context-backed ZDR rung.
  vars:
    _llm_router_safe_models: >-
      {{ llm_router_capability_members
         | selectattr('context_window', 'defined')
         | rejectattr('context_window', 'none')
         | map(attribute='route_group') | unique | list }}
    _llm_router_required_safe_model_inputs: >-
      {{ [ai_default_model, llm_router_primary_model, llm_router_routine_model,
          hermes_brain_model]
         + ([hermes_goal_judge_model]
            if (llm_router_gpu_profiles_enabled | bool) else [])
         + (llm_router_role_deployments | map(attribute='model') | list) }}
    _llm_router_required_safe_models: >-
      {%- set ns = namespace(models=[]) -%}
      {%- for name in _llm_router_required_safe_model_inputs -%}
      {%- set role = llm_router_role_deployments | selectattr('role', 'equalto', name) | first | default({}) -%}
      {%- set name = role.model | default(name) -%}
      {%- set target = llm_router_model_group_aliases.get(name, name) -%}
      {%- set groups = llm_router_model_registry
           | selectattr('client_model_id', 'equalto', target)
           | selectattr('route_group', 'defined')
           | map(attribute='route_group') | unique | list -%}
      {%- set ns.models = ns.models + (groups if groups else [target]) -%}
      {%- endfor -%}
      {{ ns.models | unique | list }}
    _llm_router_goal_judge_target: >-
      {{ llm_router_role_deployments
         | selectattr('role', 'equalto', hermes_goal_judge_model)
         | map(attribute='model') | first
         | default(hermes_goal_judge_model, true) }}
    _llm_router_goal_judge_group: >-
      {{ llm_router_model_group_aliases.get(
           _llm_router_goal_judge_target, _llm_router_goal_judge_target) }}
    _llm_router_context_backed_registry_entries: >-
      {{ llm_router_model_registry
         | selectattr('context_window', 'defined')
         | rejectattr('context_window', 'none') | list }}
    _llm_router_context_backed_registry_names: >-
      {{ (_llm_router_context_backed_registry_entries
          | map(attribute='client_model_id') | list)
         + (_llm_router_context_backed_registry_entries
            | selectattr('route_group', 'defined')
            | map(attribute='route_group') | list)
         + (_llm_router_context_backed_registry_entries
            | selectattr('fallback_group', 'defined')
            | map(attribute='fallback_group') | list) }}
    _llm_router_zdr_context_groups: >-
      {{ llm_router_d1_zdr_ladder_groups
         | select('in', _llm_router_context_backed_registry_names) | list }}
