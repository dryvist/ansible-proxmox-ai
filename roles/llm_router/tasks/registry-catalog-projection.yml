---
# Project registry entries through the shared model catalog.
- name: Load the shared model catalog
  ansible.builtin.include_role:
    name: dryvist.homelab.llm_model_catalog
    public: true

- name: Project model limits from the shared catalog
  ansible.builtin.set_fact:
    _llm_router_catalog_projection: >-
      {%- set ns = namespace(entries=[], errors=[]) -%}
      {%- for model in llm_router_model_registry -%}
      {%- if model.enabled_var is defined -%}
      {%- set model = model | combine({
            'enabled': lookup('vars', model.enabled_var, default=false) | bool}) -%}
      {%- endif -%}
      {%- set artifact = llm_router_model_artifacts_by_id.get(model.artifact_id | default(''), {}) -%}
      {%- set overrides = model.catalog_limit_overrides | default([]) -%}
      {%- set allowed_overrides = ['context_window', 'max_output_tokens'] -%}
      {%- set invalid_overrides = overrides | difference(allowed_overrides) -%}
      {%- set missing_overrides = overrides | reject('in', model.keys() | list) | list -%}
      {%- if invalid_overrides | length > 0 or missing_overrides | length > 0 -%}
      {%- set ns.errors = ns.errors + [
        model.client_model_id ~ ': invalid catalog limit overrides '
        ~ ((invalid_overrides + missing_overrides) | unique | list | string)
      ] -%}
      {%- endif -%}
      {%- set matches = namespace(entries=[]) -%}
      {# Prefer the catalog's canonical client id over compatibility aliases.
         A catalog release can add a canonical row while a registry alias is
         still needed for older pins; those must not become two matches. #}
      {%- for candidate in llm_model_catalog_models -%}
      {%- if candidate.name == model.client_model_id -%}
      {%- set matches.entries = matches.entries + [candidate] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if matches.entries | length == 0 -%}
      {%- for candidate in llm_model_catalog_models -%}
      {%- if model.client_model_id in (candidate.aliases | default([]))
            or candidate.name in (model.aliases | default([]))
            or candidate.name in (model.catalog_aliases | default([])) -%}
      {%- set matches.entries = matches.entries + [candidate] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- if matches.entries | length == 0 -%}
      {%- for candidate in llm_model_catalog_models -%}
      {%- if candidate.name == model.upstream_model_id
            or model.upstream_model_id in (candidate.aliases | default([])) -%}
      {%- set matches.entries = matches.entries + [candidate] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- if matches.entries | length == 0 and artifact.gguf_file is defined -%}
      {%- for candidate in llm_model_catalog_models -%}
      {%- if candidate.hf_repo | default('') == artifact.hf_repo
            and candidate.gguf | default('') == artifact.gguf_file -%}
      {%- set matches.entries = matches.entries + [candidate] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- if matches.entries | length != 1
            and not (model.enabled | default(false)) -%}
      {%- set ns.entries = ns.entries + [model] -%}
      {%- elif matches.entries | length != 1 -%}
      {%- set ns.errors = ns.errors + [
        model.client_model_id ~ ': expected one catalog entry, found '
        ~ (matches.entries | length | string)
      ] -%}
      {%- else -%}
      {%- set source = matches.entries[0] -%}
      {%- set target_name = source.catalog_model | default(source.name) -%}
      {%- set targets = llm_model_catalog_models | selectattr('name', 'equalto', target_name) | list -%}
      {%- if targets | length != 1 -%}
      {%- if not (model.enabled | default(false)) -%}
      {%- set ns.entries = ns.entries + [model] -%}
      {%- else -%}
      {%- set ns.errors = ns.errors + [
        model.client_model_id ~ ': catalog target ' ~ target_name
        ~ ' is missing or ambiguous'
      ] -%}
      {%- endif -%}
      {%- else -%}
      {%- set target = targets[0] -%}
      {%- set profile_name = model.catalog_profile | default('') -%}
      {%- set profiles = target.profiles | default({}) -%}
      {%- if profile_name and profile_name not in profiles -%}
      {%- if not (model.enabled | default(false)) -%}
      {%- set ns.entries = ns.entries + [model] -%}
      {%- else -%}
      {%- set ns.errors = ns.errors + [
        model.client_model_id ~ ': catalog profile ' ~ profile_name
        ~ ' is missing from ' ~ target.name
      ] -%}
      {%- endif -%}
      {%- else -%}
      {%- set profile = profiles.get(profile_name, {}) -%}
      {%- set limits = namespace(values={}) -%}
      {%- for field in [
            'context_window', 'max_output_tokens', 'max_parallel_requests',
            'request_timeout', 'stream_timeout', 'max_queue_size', 'queue_size',
            'num_retries', 'allowed_fails', 'cooldown_time'
          ] -%}
      {%- if field in overrides and model[field] is defined -%}
      {%- set _ = limits.values.update({field: model[field]}) -%}
      {%- elif profile[field] is defined -%}
      {%- set _ = limits.values.update({field: profile[field]}) -%}
      {%- elif target[field] is defined -%}
      {%- set _ = limits.values.update({field: target[field]}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set projected = limits.values | combine({
        'catalog_model_name': target.name,
        'catalog_profile_name': profile_name,
        'max_parallel_source': 'registry' if model.max_parallel_requests is defined else 'catalog'
      }) -%}
      {%- if model.max_parallel_requests is defined -%}
      {%- set projected = projected | combine({
            'max_parallel_requests': model.max_parallel_requests | int
          }) -%}
      {%- endif -%}
      {%- set ns.entries = ns.entries + [model | combine(projected)] -%}
      {%- endif -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ {'entries': ns.entries, 'errors': ns.errors} | to_json }}

- name: Assert every enabled registry model resolves to one catalog entry
  ansible.builtin.assert:
    quiet: true
    that:
      - (_llm_router_catalog_projection | from_json).errors | length == 0
    fail_msg: >-
      Every enabled router model must resolve to one homelab-contracts catalog
      entry and that entry's catalog_model target must exist:
      {{ (_llm_router_catalog_projection | from_json).errors }}
    success_msg: >-
      Every enabled router model resolves to the shared catalog; model limits
      are projected from the catalog before rendering.

- name: Replace the raw registry with its catalog limit projection
  ansible.builtin.set_fact:
    llm_router_model_registry: "{{ (_llm_router_catalog_projection | from_json).entries }}"

- name: Project nested co-resident routes from their artifact catalog records
  ansible.builtin.set_fact:
    _llm_router_co_resident_route_projection: >-
      {%- set ns = namespace(entries=[], errors=[]) -%}
      {%- for profile in llm_router_model_registry -%}
      {%- set routes = namespace(entries=[]) -%}
      {%- for route in profile.co_resident_routes | default([]) -%}
      {%- set artifact = llm_router_model_artifacts_by_id.get(route.artifact_id | default(''), {}) -%}
      {%- set matches = namespace(entries=[]) -%}
      {%- for candidate in llm_model_catalog_models
            if artifact.hf_repo is defined and artifact.gguf_file is defined
            and candidate.hf_repo | default('') == artifact.hf_repo
            and candidate.gguf | default('') == artifact.gguf_file -%}
      {%- set matches.entries = matches.entries + [candidate] -%}
      {%- endfor -%}
      {%- if matches.entries | length != 1 -%}
      {%- set ns.errors = ns.errors + [
        route.client_model_id ~ ': expected one artifact-linked catalog entry, found '
        ~ (matches.entries | length | string)
      ] -%}
      {%- set routes.entries = routes.entries + [route] -%}
      {%- else -%}
      {%- set source = matches.entries[0] -%}
      {%- set target_name = source.catalog_model | default(source.name) -%}
      {%- set targets = llm_model_catalog_models | selectattr('name', 'equalto', target_name) | list -%}
      {%- if targets | length != 1 -%}
      {%- set ns.errors = ns.errors + [
        route.client_model_id ~ ': catalog target ' ~ target_name ~ ' is missing or ambiguous'
      ] -%}
      {%- set routes.entries = routes.entries + [route] -%}
      {%- else -%}
      {%- set target = targets[0] -%}
      {%- set profile_name = route.catalog_profile | default('') -%}
      {%- set profiles = target.profiles | default({}) -%}
      {%- if profile_name and profile_name not in profiles -%}
      {%- set ns.errors = ns.errors + [
        route.client_model_id ~ ': catalog profile ' ~ profile_name
        ~ ' is missing from ' ~ target.name
      ] -%}
      {%- set routes.entries = routes.entries + [route] -%}
      {%- else -%}
      {%- set profile = profiles.get(profile_name, {}) -%}
      {%- set limits = namespace(values={}) -%}
      {%- for field in [
            'context_window', 'max_output_tokens', 'max_parallel_requests',
            'request_timeout', 'stream_timeout', 'max_queue_size', 'queue_size',
            'num_retries', 'allowed_fails', 'cooldown_time'
          ] -%}
      {%- if profile[field] is defined -%}
      {%- set _ = limits.values.update({field: profile[field]}) -%}
      {%- elif target[field] is defined -%}
      {%- set _ = limits.values.update({field: target[field]}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set projected = limits.values | combine({
        'upstream_model_id': artifact.hf_repo,
        'catalog_model_name': target.name,
        'catalog_profile_name': profile_name,
        'max_parallel_source': 'catalog'
      }) -%}
      {%- set routes.entries = routes.entries + [route | combine(projected)] -%}
      {%- endif -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set ns.entries = ns.entries + [
        profile | combine({'co_resident_routes': routes.entries})
      ] -%}
      {%- endfor -%}
      {{ {'entries': ns.entries, 'errors': ns.errors} | to_json }}
  when: llm_router_model_registry | selectattr('co_resident_routes', 'defined') | list | length > 0

- name: Assert nested co-resident routes resolve to one catalog entry
  ansible.builtin.assert:
    quiet: true
    that:
      - (_llm_router_co_resident_route_projection | from_json).errors | length == 0
    fail_msg: >-
      Every nested co-resident route must resolve through its registered artifact
      to exactly one model-catalog record:
      {{ (_llm_router_co_resident_route_projection | from_json).errors }}
  when: _llm_router_co_resident_route_projection is defined

- name: Attach catalog projections to nested co-resident routes
  ansible.builtin.set_fact:
    llm_router_model_registry: "{{ (_llm_router_co_resident_route_projection | from_json).entries }}"
  when: _llm_router_co_resident_route_projection is defined

# The policy records repositories. An artifact reference wins because it names
# what this entry serves; a catalog row covers entries with no artifact.
- name: Resolve each entry to the repository that holds its weights
  ansible.builtin.set_fact:
    llm_router_model_registry: >-
      {%- set ns = namespace(entries=[]) -%}
      {%- for model in llm_router_model_registry -%}
      {%- set artifact = llm_router_model_artifacts_by_id.get(model.artifact_id | default(''), {}) -%}
      {%- set rows = llm_model_catalog_models
           | selectattr('name', 'equalto', model.catalog_model_name | default('')) | list -%}
      {%- set row = rows[0] if rows else {} -%}
      {%- set stage0 = row.stage0 | default({}) -%}
      {%- set repo = artifact.hf_repo | default(row.hf_repo | default(
            ((stage0.serving | default({})).converted_artifact | default({})).repo_id | default(
              (stage0.source_checkpoint | default({})).repo_id | default(
                row.name | default(model.upstream_model_id, true), true), true), true), true) -%}
      {%- set ns.entries = ns.entries + [model | combine({'policy_artifact_id': repo})] -%}
      {%- endfor -%}
      {{ ns.entries }}
