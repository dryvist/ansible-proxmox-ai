---
# Deploys the pre-call callback that holds the CI key to chat, Responses and Anthropic
# messages requests at each deployment's own effort.
- name: Deploy the CI effort-pin LiteLLM callback
  ansible.builtin.copy:
    src: callbacks/ci_effort_pin.py
    dest: "{{ llm_router_config_dir }}/ci_effort_pin.py"
    owner: root
    group: "{{ llm_router_group }}"
    mode: "0640"
  notify: Restart litellm
