---
# Escalation-distinctness contract. Its own file so a test can import exactly
# this task and prove it fires, rather than re-stating its condition where the
# two could drift apart. Imported by assert.yml.
#
# ai_escalation_rubric's deep-analysis tier only means anything if it resolves
# to a DIFFERENT model than the broad (default) tier. The broad tier is
# `{{ ai_default_model }}`, which itself resolves from
# bao_ai_public_secrets.active_model with a literal fallback — so when OpenBao
# is unreachable, or when it simply hands back the same id the deep tier names,
# both tiers collapse onto one model. Escalating then returns the model the
# caller already had, with no error anywhere: a caller believes it escalated
# and did not. That silent success is the failure, not the missing secret,
# which is why this warns at render time instead of staying inferable only from
# model behaviour.
#
# A warning rather than an assert, deliberately: the collapse is the CURRENT
# intended state (the deep tier's own model is not served, so it points at the
# resident primary on purpose). Failing the play would only block converges on
# a condition the fabric has already accepted. The operator needs to be able to
# read "escalation is inert" off a log line; they do not need the run stopped.

- name: WARNING — the escalation tier resolves to the default tier's model (escalation is inert)
  ansible.builtin.debug:
    msg: >-
      Escalation collapse (roles/llm_router/tasks/assert-escalation-tier.yml):
      ai_escalation_rubric's deep-analysis tier and its broad (default) tier
      both resolve to {{ _llm_router_escalation_deep_model }}. A task scored
      into the deep tier is answered by the SAME model the broad tier would
      have used, and neither the router nor the caller reports anything — every
      escalation is a no-op that looks like a success. Cause:
      {{ 'bao_ai_public_secrets.active_model resolved to this same id, so the'
         ~ ' collapse is a registry choice, not a credential failure.'
         if _llm_router_bao_active_model | length > 0
         else 'bao_ai_public_secrets.active_model did not resolve (OpenBao'
              ~ ' unreachable, or the ai public domain merged empty), so the'
              ~ ' broad tier took ai_default_model'
              ~ "'s literal fallback and the collapse is a credential-path"
              ~ ' failure.' }}
      Fix by serving a model the deep tier can name and repointing
      ai_escalation_rubric's deep-analysis router_model at it
      (inventory/group_vars/all.yml, llm-models.yml) — not by widening the
      rubric to match the default.
  register: llm_router_escalation_collapse_warning
  when:
    - _llm_router_escalation_deep_tier | length > 0
    - (_llm_router_escalation_deep_tier | first).status | default('') == 'active'
    - _llm_router_escalation_deep_model | length > 0
    - _llm_router_escalation_deep_model == _llm_router_escalation_broad_model
  vars:
    _llm_router_escalation_deep_tier: >-
      {{ ai_escalation_rubric.tiers | default([])
         | selectattr('id', 'equalto', 'deep-analysis') | list }}
    _llm_router_escalation_broad_tier: >-
      {{ ai_escalation_rubric.tiers | default([])
         | selectattr('id', 'equalto', 'broad') | list }}
    # Compared tier-to-tier rather than deep-vs-ai_default_model directly, so
    # the check still measures the real contract if the broad tier is ever
    # repointed away from ai_default_model.
    _llm_router_escalation_deep_model: >-
      {{ (_llm_router_escalation_deep_tier | first | default({}))
         .router_model | default('', true) | trim }}
    _llm_router_escalation_broad_model: >-
      {{ (_llm_router_escalation_broad_tier | first | default({}))
         .router_model | default('', true) | trim }}
    # Kept as the id string, not a bool: a folded-scalar bool round-trips as
    # the string 'False', which is truthy inside the message's own condition.
    _llm_router_bao_active_model: >-
      {{ (bao_ai_public_secrets | default({})).active_model
         | default('', true) | trim }}
