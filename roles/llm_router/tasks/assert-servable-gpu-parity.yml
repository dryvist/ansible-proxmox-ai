---
- name: Assert the Pro6000 guest lists every enabled registry model
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_gpu_unserved | length == 0
      - _llm_router_gpu_unregistered | length == 0
    fail_msg: >-
      Pro6000 model listing disagrees with llm-models.d/60-gpu-pro6000.yml:
      missing upstream id(s) {{ _llm_router_gpu_unserved }}; unregistered
      listed id(s) {{ _llm_router_gpu_unregistered }}.
    success_msg: >-
      The Pro6000 model listing contains exactly the enabled GPU registry ids.
  when: _llm_router_gpu_probe.state == 'verified'
  vars:
    _llm_router_gpu_expected_ids: >-
      {{ llm_router_gpu_models | default([]) | map(attribute='upstream_model_id') | list }}
    _llm_router_gpu_unserved: >-
      {{ _llm_router_gpu_expected_ids | difference(_llm_router_gpu_probe.ids) }}
    _llm_router_gpu_unregistered: >-
      {{ _llm_router_gpu_probe.ids | difference(_llm_router_gpu_expected_ids) }}
