---
# Key creation is idempotent. Existing model allowlists and MCP permissions
# reconcile from the Git seed on every converge; routes and attribution
# other attribution metadata stay UI-owned in `initial` mode and are
# reconciled only by the explicit `rebuild` mode. Required sensitivity tags
# and ZDR tags reconcile in every mode while preserving unrelated live tags.
#
# The router does not MINT these. /key/generate accepts a caller-supplied value,
# so each key is registered with a value generated at the consumer's own tier
# (openbao_generated_app_secrets in ansible-proxmox-apps) and merely READ here —
# reads are pre-authorized, so this needs no write unlock in this repo.
#
# Missing source values render no entry; those keys are skipped.
#
# ORDERING. The apps-domain paths that carry these values are listed in
# inventory/group_vars/all/ as `optional: true`. The apps read
# policy is rendered from the generating repo's seeding map, so a path listed
# here before THAT role has converged is not merely empty, it is ungranted: the
# fetch 403s and fails the whole converge closed, on every router, before this
# role runs. `optional: true` does not cover that — it forgives a 404 (absent
# secret) and still fails a 403 (missing grant), correctly. So a NEW caller's
# path is listed only after the generating side has converged, and `optional`
# is promoted to required after the first successful read.
#
# Model scope is derived from the registry, never hand-listed: a retired alias
# cannot linger in a key's allowlist because it stops being derived.
#
# VALUE FORMAT, diagnosed the hard way (Semaphore task 108, 2026-09-12,
# converge 30aabd67, the FIRST time this task ever ran against a live proxy).
# LiteLLM's /key/generate rejects a caller-supplied `key` that does not start
# with `sk-` and run at least 16 characters (key_management_endpoints.py
# generate_key_fn; MINIMUM_CUSTOM_KEY_LENGTH defaults to 16) — a plain HTTP
# 400, confirmed from the live proxy log: "Invalid key format. LiteLLM
# Virtual Key must start with 'sk-'. Received: <masked>". `no_log: true` on
# the /key/generate task below (needed because the body carries the raw
# value) censored that message down to "the output has been hidden", so
# diagnosing the first occurrence took a log-platform search instead of the
# play recap. The value itself is generated one repo over
# (ansible-proxmox-apps roles/openbao/tasks/seed_generated_app_secret.yml —
# community.general.random_string, no prefix); this role only reads it, so
# it cannot repair the value. assert-seed-key-format.yml can't fix that
# either, but it turns the next occurrence into a message naming the alias
# instead of a second log-platform trip.

- name: Validate privacy grants before standalone consumer seeding
  ansible.builtin.import_tasks: assert-privacy-grants.yml

- name: Validate every key's declared sensitivity class before key reads or writes
  ansible.builtin.assert:
    quiet: true
    that:
      - item.sensitivity_tag | default('&sensitivity:sensitive') in
        ['&sensitivity:pii', '&sensitivity:sensitive', '&sensitivity:public']
    fail_msg: "Key alias {{ item.alias }} must use a supported required sensitivity tag."
  loop: "{{ _llm_router_virtual_keys_without_values }}"
  loop_control:
    label: "{{ item.alias }}"

- name: Validate caller priority tiers before team or key writes
  ansible.builtin.assert:
    quiet: true
    that:
      - item.priority_tier | default(llm_router_priority_default_tier) in [0, 1, 2]
    fail_msg: "Key alias {{ item.alias }} must use priority tier 0, 1, or 2."
  loop: "{{ _llm_router_virtual_keys_without_values }}"
  loop_control:
    label: "{{ item.alias }}"

- name: Seed priority teams before assigning caller keys
  ansible.builtin.import_tasks: seed-priority-teams.yml

- name: Seed validated team grants before creating keys
  ansible.builtin.import_tasks: seed-teams.yml

- name: Read the virtual keys the proxy already carries
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/list?page=1&size=100&return_full_object=true"
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    timeout: "{{ llm_router_seed_request_timeout }}"
  register: llm_router_existing_keys
  # Read-only; a check run needs the live value to preview key reconciliation.
  check_mode: false
  no_log: true

# ROTATION. Once minted, a key's `key` value is a LiteLLM primary identifier —
# there is no "update the value" endpoint — so rotation is delete-then-mint,
# never an in-place PATCH. Off by default (empty list, no-op on every ordinary
# converge): an operator names the aliases to rotate in
# llm_router_rotate_key_aliases right after the OpenBao value has actually
# changed (each key family's own generate play, e.g.
# ansible-proxmox-apps roles/openbao seed_generated_app_secret.yml with
# openbao_seed_rotate_fields set — see that file's header for the matching
# apps-side switch). Deleting here, before the live-alias collection below,
# is what makes the create on this same run re-mint the same alias
# with the value bao_apps_secrets now holds — one converge, no manual step
# in between. `key_aliases` (not `keys`/token) so this never needs the old
# token value, which this role does not otherwise read back.
# A 404 from the delete means the alias is already absent, which is the state
# the rotation wants. Every other non-success status is still an error.
- name: Delete the live key for every alias flagged for rotation
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/delete"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    body_format: json
    body:
      key_aliases: "{{ llm_router_rotate_key_aliases | default([]) }}"
    status_code: [200, 201, 404]
    timeout: "{{ llm_router_seed_request_timeout }}"
  when: (llm_router_rotate_key_aliases | default([]) | length) > 0
  no_log: true

# Re-read after a rotation delete, so the alias(es) just removed above are
# absent from this fact and the create below mints them fresh in the same
# play. Skipped when nothing was deleted — the first read above is already
# current.
#
# Registers onto a TEMP var, never straight onto llm_router_existing_keys: a
# skipped task still overwrites its register: target with a {skipped: true}
# stub that carries no `.json`, which silently emptied every alias match
# below on every ordinary (no-rotation) converge. set_fact does not share
# that failure mode — when its own when: is false it does nothing at all —
# so the next task only replaces the first read when a rotation actually ran.
- name: Re-read the live keys when a rotation delete ran
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/list?page=1&size=100&return_full_object=true"
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    timeout: "{{ llm_router_seed_request_timeout }}"
  register: _llm_router_existing_keys_after_rotation
  when:
    - (llm_router_rotate_key_aliases | default([]) | length) > 0
    - not ansible_check_mode
  no_log: true

- name: Keep the first read when no rotation ran
  ansible.builtin.set_fact:
    llm_router_existing_keys: "{{ _llm_router_existing_keys_after_rotation }}"
  when:
    - (llm_router_rotate_key_aliases | default([]) | length) > 0
    - not ansible_check_mode

# CREATE, only for absent aliases. The complete live-key snapshot read above
# (every page, see seed-key-pages.yml) names each alias the proxy already
# carries; the create below skips those. Keys that already exist are
# reconciled by the policy task at the end of this file, never re-created.
# A 400 whose body says the alias already exists is still tolerated at the
# create, so an alias missing from the snapshot ends as a no-op.
- name: Include every existing key in policy reconciliation
  ansible.builtin.import_tasks: seed-key-pages.yml

- name: Report privacy grants across all existing key pages
  ansible.builtin.import_tasks: report-key-privacy.yml

- name: Assign team ownership to existing teamless keys
  ansible.builtin.import_tasks: reconcile-teamless-keys.yml

- name: Collect the aliases of every key the proxy already carries
  ansible.builtin.set_fact:
    _llm_router_live_key_aliases: >-
      {{ llm_router_existing_keys.json['keys'] | default([])
         | selectattr('key_alias', 'defined')
         | map(attribute='key_alias') | select('string') | list }}
  no_log: true

- name: Assert each seeded value is a valid LiteLLM custom key before minting
  ansible.builtin.import_tasks: assert-seed-key-format.yml
  vars:
    _llm_router_unseeded_keys: "{{ llm_router_virtual_keys | rejectattr('value', 'equalto', '') | list }}"

- name: Create the caller keys that have a seeded value (an existing alias is not a failure)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/generate"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    body_format: json
    body:
      key: "{{ item.value }}"
      key_alias: "{{ item.alias }}"
      team_id: "{{ item.team_id | default(omit) }}"
      models: "{{ item.models }}"
      object_permission: "{{ item.object_permission | default(llm_router_mcp_default_object_permission) }}"
      # Key attribution carries the consumer alias and numeric priority tier.
      # Device, agent, session, and privacy fields come from request metadata.
      metadata: >-
        {%- set _metadata = item.metadata | default({}) -%}
        {%- set _metadata_tags = ((_metadata.get('tags', []) | default([], true) | list)
              + (item.tags | default([]) | list))
              | reject('match', '^([&!])?sensitivity:') | unique | list
              + [item.sensitivity_tag | default('&sensitivity:sensitive')] -%}
        {%- if item.sensitivity_tag | default('&sensitivity:sensitive') != '&sensitivity:public' -%}
        {%- set _metadata_tags = (_metadata_tags | reject('match', '^([&!])?zdr$') | list) + ['&zdr'] -%}
        {%- endif -%}
        {{ _metadata | combine(
          {
            'app': item.alias,
            'tier': item.priority_tier | default(item.tier | default(
              'subscription' if (item.daily_budget | default(0) | float > 0) else 'local')),
          },
          recursive=true,
        ) | combine({'tags': _metadata_tags}, recursive=true)
          | combine((_llm_router_key_trust_metadata | default({})).get(item.alias, {}), recursive=true) }}
      router_settings: "{{ item.router_settings | default(omit) }}"
      allowed_routes: "{{ item.allowed_routes | default(omit) }}"
      rpm_limit: "{{ item.rpm_limit | default(omit) }}"
      max_budget: "{{ item.daily_budget if (item.daily_budget | default(0) | float > 0) else omit }}"
      budget_duration: "{{ '24h' if (item.daily_budget | default(0) | float > 0) else omit }}"
      # The same single 24h window, stated again as budget_limits (litellm
      # 1.98.0 GenerateKeyRequest.budget_limits — confirmed on the pinned tag,
      # litellm/models/team.py BudgetLimitEntry), so the window list carries
      # the daily cap explicitly.
      budget_limits: >-
        {{ [{'budget_duration': '24h', 'max_budget': item.daily_budget | float}]
           if (item.daily_budget | default(0) | float > 0) else omit }}
    status_code: [200, 201, 400]
    timeout: "{{ llm_router_seed_request_timeout }}"
  loop: "{{ llm_router_virtual_keys | rejectattr('value', 'equalto', '') | list }}"
  loop_control:
    label: "{{ item.alias }}"
  when: item.alias not in _llm_router_live_key_aliases
  register: _llm_router_key_generate_result
  failed_when: >-
    not ansible_check_mode
    and _llm_router_key_generate_result.status not in [200, 201]
    and 'already exists' not in
      (_llm_router_key_generate_result.json.error.message | default(''))
  no_log: true

# Reconcile seeded models, MCP permissions, and the router settings a key
# names with router_settings_ref after create; routes and metadata remain rebuild-only so normal
# converges preserve Admin UI edits.
- name: Reconcile seeded caller key policy
  ansible.builtin.import_tasks: reconcile-seeded-key-policy.yml
