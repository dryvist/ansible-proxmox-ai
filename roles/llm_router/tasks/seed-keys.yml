---
# FIRST SEED ONLY, same contract as seed-roles.yml: creates a virtual key when
# the proxy has none by that alias, and never touches one that exists.
#
# The router does not MINT these. /key/generate accepts a caller-supplied value,
# so each key is registered with a value generated at the consumer's own tier
# (openbao_generated_app_secrets in ansible-proxmox-apps) and merely READ here —
# reads are pre-authorized, so this needs no write unlock in this repo.
#
# A consumer whose key is not seeded yet renders no entry and is skipped, so
# this is a no-op until the generating half lands and the two can merge
# independently.
#
# ORDERING. The apps-domain paths that carry these values are listed in
# roles/openbao_secrets/defaults/main/10-domains.yml as `optional: true`. The apps read
# policy is rendered from the generating repo's seeding map, so a path listed
# here before THAT role has converged is not merely empty, it is ungranted: the
# fetch 403s and fails the whole converge closed, on every router, before this
# role runs. `optional: true` does not cover that — it forgives a 404 (absent
# secret) and still fails a 403 (missing grant), correctly. So a NEW caller's
# path is listed only after the generating side has converged, and `optional`
# is promoted to required after the first successful read.
#
# Model scope is derived from the registry, never hand-listed: a retired alias
# cannot linger in a key's allowlist because it stops being derived.
#
# VALUE FORMAT, diagnosed the hard way (Semaphore task 108, 2026-09-12,
# converge 30aabd67, the FIRST time this task ever ran against a live proxy).
# LiteLLM's /key/generate rejects a caller-supplied `key` that does not start
# with `sk-` and run at least 16 characters (key_management_endpoints.py
# generate_key_fn; MINIMUM_CUSTOM_KEY_LENGTH defaults to 16) — a plain HTTP
# 400, confirmed from the live proxy log: "Invalid key format. LiteLLM
# Virtual Key must start with 'sk-'. Received: <masked>". `no_log: true` on
# the /key/generate task below (needed because the body carries the raw
# value) censored that message down to "the output has been hidden", so
# diagnosing the first occurrence took a log-platform search instead of the
# play recap. The value itself is generated one repo over
# (ansible-proxmox-apps roles/openbao/tasks/seed_generated_app_secret.yml —
# community.general.random_string, no prefix); this role only reads it, so
# it cannot repair the value. assert-seed-key-format.yml can't fix that
# either, but it turns the next occurrence into a message naming the alias
# instead of a second log-platform trip.

- name: Read the virtual keys the proxy already carries
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/list?page=1&size=100&return_full_object=true"
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    timeout: "{{ llm_router_seed_request_timeout }}"
  register: llm_router_existing_keys

# ROTATION. Once minted, a key's `key` value is a LiteLLM primary identifier —
# there is no "update the value" endpoint — so rotation is delete-then-mint,
# never an in-place PATCH. Off by default (empty list, no-op on every ordinary
# converge): an operator names the aliases to rotate in
# llm_router_rotate_key_aliases right after the OpenBao value has actually
# changed (each key family's own generate play, e.g.
# ansible-proxmox-apps roles/openbao seed_generated_app_secret.yml with
# openbao_seed_rotate_fields set — see that file's header for the matching
# apps-side switch). Deleting here, before "unseeded keys" is computed below,
# is what makes the very next task on this same run re-mint the same alias
# with the value bao_apps_secrets now holds — one converge, no manual step
# in between. `key_aliases` (not `keys`/token) so this never needs the old
# token value, which this role does not otherwise read back.
- name: Delete the live key for every alias flagged for rotation
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/delete"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    body_format: json
    body:
      key_aliases: "{{ llm_router_rotate_key_aliases | default([]) }}"
    status_code: [200, 201]
    timeout: "{{ llm_router_seed_request_timeout }}"
  when: (llm_router_rotate_key_aliases | default([]) | length) > 0
  no_log: true

# Re-read after a rotation delete, so the alias(es) just removed above are
# absent from this fact and the "unseeded keys" computation below mints them
# fresh in the same play. Skipped when nothing was deleted — the first read
# above is already current.
#
# Registers onto a TEMP var, never straight onto llm_router_existing_keys: a
# skipped task still overwrites its register: target with a {skipped: true}
# stub that carries no `.json`, which silently emptied every alias match
# below on every ordinary (no-rotation) converge. set_fact does not share
# that failure mode — when its own when: is false it does nothing at all —
# so the next task only replaces the first read when a rotation actually ran.
- name: Re-read the live keys when a rotation delete ran
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/list?page=1&size=100&return_full_object=true"
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    timeout: "{{ llm_router_seed_request_timeout }}"
  register: _llm_router_existing_keys_after_rotation
  when: (llm_router_rotate_key_aliases | default([]) | length) > 0
  no_log: true

- name: Keep the first read when no rotation ran
  ansible.builtin.set_fact:
    llm_router_existing_keys: "{{ _llm_router_existing_keys_after_rotation }}"
  when: (llm_router_rotate_key_aliases | default([]) | length) > 0

# CREATE, idempotently. seed-keys.yml used to pre-compute an "unseeded"
# subset from the /key/list read above and mint only that subset — fragile,
# because whatever this task's client-side view of "already live" misses
# (Semaphore tasks 267/277, 2026-09-21: several already-minted aliases kept
# showing as unseeded run after run, for a reason narrower than what
# return_full_object=true fixed in the past) turns into a hard 400 instead
# of the no-op it should be. LiteLLM's own alias-uniqueness constraint at
# /key/generate is already the authoritative "does this exist" check, so
# every virtual key with a seeded value is submitted every run, and a 400
# whose body says the alias already exists is treated as the create having
# nothing left to do, not a failure — this task no longer needs to get the
# live-alias read right to be correct.
- name: Assert each seeded value is a valid LiteLLM custom key before minting
  ansible.builtin.import_tasks: assert-seed-key-format.yml
  vars:
    _llm_router_unseeded_keys: "{{ llm_router_virtual_keys | rejectattr('value', 'equalto', '') | list }}"

- name: Create the caller keys that have a seeded value (an existing alias is not a failure)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/generate"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    body_format: json
    body:
      key: "{{ item.value }}"
      key_alias: "{{ item.alias }}"
      models: "{{ item.models }}"
      allowed_routes: "{{ item.allowed_routes | default(omit) }}"
      rpm_limit: "{{ item.rpm_limit | default(omit) }}"
      max_budget: "{{ item.monthly_budget if (item.monthly_budget | default(0) | float > 0) else omit }}"
      budget_duration: "{{ '7d' if (item.monthly_budget | default(0) | float > 0) else omit }}"
      # A second, tighter window stacked on top of the flat weekly fields
      # above (litellm 1.98.0 GenerateKeyRequest.budget_limits — confirmed on
      # the pinned tag, litellm/models/team.py BudgetLimitEntry): a bad DAY
      # cannot burn the whole week even while the week itself is in budget.
      # Daily figure is the weekly ceiling pro-rated to two days' worth,
      # rounded — not a separate policy number to keep in sync by hand.
      budget_limits: >-
        {{ [{'budget_duration': '24h',
             'max_budget': ((item.monthly_budget | float / 7 * 2) | round | float)},
            {'budget_duration': '7d', 'max_budget': item.monthly_budget | float}]
           if (item.monthly_budget | default(0) | float > 0) else omit }}
    status_code: [200, 201, 400]
    timeout: "{{ llm_router_seed_request_timeout }}"
  loop: "{{ llm_router_virtual_keys | rejectattr('value', 'equalto', '') | list }}"
  loop_control:
    label: "{{ item.alias }}"
  register: _llm_router_key_generate_result
  failed_when: >-
    _llm_router_key_generate_result.status not in [200, 201]
    and 'already exists' not in
      (_llm_router_key_generate_result.json.error.message | default(''))
  no_log: true

# RECONCILE allowed_routes and model names on keys that already exist. Keys
# are minted once and otherwise left alone, so a route allowlist or a model
# name added to a seed entry after the key was minted never reaches the proxy
# on its own — the key keeps 401ing on the route, or 403ing on the model, the
# seed entry now names.
#
# Models are UNIONED with the live list by default (only ever added, never
# removed, so an operator's Admin UI edit survives) — same reason as ever: a
# name added to a seed entry's list after the mint (a new role in
# 55-roles.yml, a new servable model) never reaches an existing key on its
# own, and sending the git list outright would erase a name an operator
# added in the Admin UI.
#
# A key marked `models_authoritative: true` (hindsight, 56-virtual-keys.yml)
# is the deliberate exception: it gets the seeded list VERBATIM, a REPLACE
# rather than a union, because for THAT key the seed is the whole allowlist,
# not a floor — a name granted before the free-only boundary landed
# (`cheap`, the primary model, the `no-default-models` stopgap) must
# actually be revoked, not linger forever alongside the new one. Such a key
# is flagged as changed on drift in EITHER direction (seeded names live
# lacks, OR live names seeded no longer lists) — a narrowing has to reach
# the live key too, not only a widening.
#
# Routes are replaced outright with the seed value, same as before, and only
# for a key that declares allowed_routes at all.
#
# Computed as one list of {alias, body} entries so a key needing either
# change gets exactly one /key/update call carrying both fields, instead of
# one call per field — the diff itself runs once, in Jinja, against the
# single /key/list read above; a key whose live record already matches the
# seed on both fields contributes nothing, so a steady-state converge sends
# no calls here at all.
- name: Compute the route/model update each live key still needs, if any
  ansible.builtin.set_fact:
    _llm_router_key_updates: >-
      {%- set _out = [] -%}
      {%- for _k in (llm_router_virtual_keys
                     | rejectattr('value', 'equalto', '')
                     | selectattr('alias', 'in', _llm_router_live_key_aliases) | list) -%}
      {%- set _live_routes = (llm_router_existing_keys.json['keys'] | default([])
              | selectattr('key_alias', 'equalto', _k.alias)
              | map(attribute='allowed_routes', default=none) | first | default(none)) -%}
      {%- set _live_models = (llm_router_existing_keys.json['keys'] | default([])
              | selectattr('key_alias', 'equalto', _k.alias)
              | map(attribute='models', default=[]) | first | default([])) -%}
      {%- set _authoritative = _k.models_authoritative | default(false) -%}
      {%- set _models_target = _k.models if _authoritative else ((_live_models + _k.models) | unique | list) -%}
      {%- set _models_changed = (_k.models | difference(_live_models) | length > 0)
            or (_authoritative and (_live_models | difference(_k.models) | length > 0)) -%}
      {%- set _routes_changed = (_k.allowed_routes is defined) and (_live_routes != _k.allowed_routes) -%}
      {%- if _models_changed or _routes_changed -%}
      {%- set _body = {'key': _k.value, 'models': _models_target} -%}
      {%- set _body = (_body | combine({'allowed_routes': _k.allowed_routes}))
            if (_k.allowed_routes is defined) else _body -%}
      {%- set _discard = _out.append({'alias': _k.alias, 'body': _body}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ _out }}
  vars:
    _llm_router_live_key_aliases: >-
      {{ llm_router_existing_keys.json['keys'] | default([])
         | selectattr('key_alias', 'defined')
         | map(attribute='key_alias') | select('string') | list }}
  no_log: true

- name: Reconcile route allowlists and model names for live keys that changed
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/update"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    body_format: json
    body: "{{ item.body }}"
    status_code: [200, 201]
    timeout: "{{ llm_router_seed_request_timeout }}"
  loop: "{{ _llm_router_key_updates }}"
  loop_control:
    label: "{{ item.alias }}"
  no_log: true
