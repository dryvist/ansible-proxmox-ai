---
# Reverts every database-stored model deployment Git does not own. A name that
# used to be a DB-only role (tasks/seed-roles.yml) and has since become a
# git-declared alias (llm_router_model_group_aliases, 50-servable.yml — `lead`
# as of A5) must never carry BOTH at once; the same holds for a row that
# shadows a config deployment's name, and for a row no Git declaration tracks
# (an Admin UI addition that was never back-ported). config.yaml.j2 already
# rendered the aliases into the file this converge deployed, so the only
# remaining step is deleting those rows before the pending config-file-changed
# handler restarts the proxy. _llm_router_db_model_reverts (76-drift.yml)
# decides which rows go and why; each is reported before it is deleted.
#
# Reads use /v2/model/info, not /model/info: the v1 endpoint always appends
# one synthetic row per declared alias (copied from its underlying
# deployment, with model_name rewritten to the alias name but model_info.id
# still the UNDERLYING deployment's id), so every declared alias always
# looks "live" there whether or not a real shadowing row exists. /v2/model/info
# returns only real deployments. Only a row with model_info.db_model true — the
# field LiteLLM itself uses to mark a DB-stored deployment — is ever deleted,
# since a config-declared deployment can't be removed via this API; a
# config-declared alias collision is a registry error the final assert catches.
#
# Runs after seed-roles.yml (tasks/main.yml) so a role newly seeded this
# same converge is still caught if it happens to collide with an alias.

- name: Read the model deployments the proxy carries
  ansible.builtin.import_tasks: read-model-rows.yml

- name: Report each database-stored deployment that Git does not own
  ansible.builtin.debug:
    msg: "Reverting {{ item.model_name }}: it {{ item.reason }}."
  loop: "{{ _llm_router_db_model_reverts }}"
  loop_control:
    label: "{{ item.model_name }}"

- name: Delete each reported deployment
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/model/delete"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    body_format: json
    body:
      id: "{{ item.id }}"
    status_code: [200, 201]
    timeout: "{{ llm_router_seed_request_timeout }}"
  loop: "{{ _llm_router_db_model_reverts }}"
  loop_control:
    label: "{{ item.model_name }}"
  no_log: true

# Proves the deletes landed, and that no declared alias name exists as a real
# deployment of any kind. The latter catches a config-declared deployment
# sharing an alias name, which this cleanup cannot remove.
- name: Re-read the model deployments
  ansible.builtin.import_tasks: read-model-rows.yml

- name: Assert no deployment shadows an alias and no reverted row remains
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_still_shadowed | length == 0
      - _llm_router_db_model_reverts | length == 0
    fail_msg: >-
      Alias name(s) [{{ _llm_router_still_shadowed | join(', ') }}] or
      database row(s) [{{ _llm_router_db_model_reverts | map(attribute='model_name') | join(', ') }}]
      still exist after the deletes above
      (roles/llm_router/tasks/retire-role-deployments.yml). Remove the DB
      duplicate or fix the config-declared registry collision, then re-converge.
    success_msg: "Every database-stored deployment is a declared role."
  vars:
    _llm_router_still_shadowed: >-
      {{ (llm_router_model_group_aliases | list)
         | select('in', _llm_router_model_rows | map(attribute='model_name') | list) | list }}
