---
# Every Hermes profile's own config.yaml.j2 renders `model.default` from
# hermes_brain_model directly, so every profile's key must be able to call
# that name whatever its scope, or the profile 403s on its own brain model.
- name: Assert every Hermes profile key can reach hermes_brain_model directly
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_brain_model in item.models
    fail_msg: >-
      {{ item.alias }} is scoped to {{ item.models }}, which does not
      include hermes_brain_model ({{ hermes_brain_model }}).
  loop: "{{ llm_router_virtual_keys | selectattr('alias', 'match', '^hermes-') | list }}"
  loop_control:
    label: "{{ item.alias }}"
