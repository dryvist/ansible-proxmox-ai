---
# Every Hermes profile's own config.yaml.j2 renders `model.default` from
# hermes_brain_model directly. Tier-2 and tier-3 keys hold only their local class scope;
# public keys hold their whole chain, while ZDR keys hold their private scope.
# Local-only profiles hold only the local review alias from the key projection.
- name: Assert each Hermes key can reach the scope allowed by its tier and tags
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        (item.allowed_classes | default([]) == ['local']
         and item.models | intersect(_cloud_groups) | length == 0
         and llm_router_review_aliases.local in item.models)
        if (item.priority_tier | default(1) | int) in [2, 3] else true
      - >-
        (item.models == _llm_router_hermes_required_models)
        if _llm_router_hermes_profile_name in _llm_router_hermes_local_only_profiles
        else true if (item.priority_tier | default(1) | int) in [2, 3]
        else (_llm_router_hermes_required_models | difference(item.models) | length == 0)
    fail_msg: >-
      {% if _llm_router_hermes_profile_name in _llm_router_hermes_local_only_profiles %}
      {{ item.alias }} is scoped to {{ item.models }}, but its local-only
      profile must have exactly {{ _llm_router_hermes_required_models }}.
      {% elif (item.priority_tier | default(1) | int) in [2, 3] %}
      {{ item.alias }} is tier {{ item.priority_tier }} and requires allowed_classes ['local'], no cloud
      groups, and {{ llm_router_review_aliases.local }}; classes={{ item.allowed_classes | default([]) }};
      cloud={{ item.models | intersect(_cloud_groups) }};
      local_alias_present={{ llm_router_review_aliases.local in item.models }}.
      {% else %}
      {{ item.alias }} is scoped to {{ item.models }}, which is missing
      {{ _llm_router_hermes_required_models | difference(item.models) }}
      from the chain allowed by its tags.
      {% endif %}
  loop: "{{ _llm_router_virtual_keys_without_values | selectattr('alias', 'match', '^hermes-') | list }}"
  loop_control:
    label: "{{ item.alias }}"
  vars:
    _llm_router_hermes_profile_name: "{{ item.alias | regex_replace('^hermes-', '') }}"
    _cloud_groups: >-
      {{ llm_router_d1_group_class_by_name | dict2items
         | rejectattr('value', 'equalto', 'local') | map(attribute='key') | list }}
    _llm_router_hermes_required_models: >-
      {{ [llm_router_review_aliases.local]
         if _llm_router_hermes_profile_name in _llm_router_hermes_local_only_profiles
         else (_llm_router_private_zdr_model_scope
               if '&zdr' in (item.tags | default([]))
               else ((_llm_router_directly_callable_ladder_names
                      + llm_router_hermes_default_fallback_chain)
                     | reject('in', _llm_router_agent_excluded_groups) | unique | list)) }}
