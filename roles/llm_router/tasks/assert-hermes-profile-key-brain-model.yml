---
# Every Hermes profile's own config.yaml.j2 renders `model.default` from
# hermes_brain_model directly. A public key must hold its whole chain; the
# private key must hold the local and asserted-ZDR subset its inherited tags
# permit, or a fallback partway through is refused silently. Local-only
# profiles hold only the local review alias declared in the key projection.
- name: Assert each Hermes key can reach the chain allowed by its tags
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        (item.models == _llm_router_hermes_required_models)
        if _llm_router_hermes_profile_name in _llm_router_hermes_local_only_profiles
        else (_llm_router_hermes_required_models | difference(item.models) | length == 0)
    fail_msg: >-
      {% if _llm_router_hermes_profile_name in _llm_router_hermes_local_only_profiles %}
      {{ item.alias }} is scoped to {{ item.models }}, but its local-only
      profile must have exactly {{ _llm_router_hermes_required_models }}.
      {% else %}
      {{ item.alias }} is scoped to {{ item.models }}, which is missing
      {{ _llm_router_hermes_required_models | difference(item.models) }}
      from the chain allowed by its tags.
      {% endif %}
  loop: "{{ _llm_router_virtual_keys_without_values | selectattr('alias', 'match', '^hermes-') | list }}"
  loop_control:
    label: "{{ item.alias }}"
  vars:
    _llm_router_hermes_profile_name: "{{ item.alias | regex_replace('^hermes-', '') }}"
    _llm_router_hermes_required_models: >-
      {{ [llm_router_review_aliases.local]
         if _llm_router_hermes_profile_name in _llm_router_hermes_local_only_profiles
         else (_llm_router_private_zdr_model_scope
               if '&zdr' in (item.tags | default([]))
               else ((_llm_router_directly_callable_ladder_names
                      + llm_router_hermes_default_fallback_chain)
                     | reject('in', _llm_router_agent_excluded_groups) | unique | list)) }}
