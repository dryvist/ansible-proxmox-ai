---
# The Slack MCP server is optional: it exists only while its bot token
# resolves non-empty (llm_router_mcp_slack_enabled, defaults/main/80-mcp.yml).
- name: Report that the Slack MCP server is not rendered
  ansible.builtin.debug:
    msg: >-
      No Slack bot token resolved from the local-llm secrets domain, so the
      Slack MCP server, its key grant and its tool check are skipped.
  when: not (llm_router_mcp_slack_enabled | bool)

- name: Resolve Slack workspace id for the stdio MCP server
  ansible.builtin.import_tasks: resolve-slack-team.yml
  when: llm_router_mcp_slack_enabled | bool
