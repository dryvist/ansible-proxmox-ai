---
# The registry against the canonical model-role map (`llm_roles`, loaded by
# tasks/registry.yml from dryvist.homelab.llm_roles).
#
# The Mac entries in llm-models.d/ stay plain data — the alias generator, the
# retype scan and the Hermes tests read them without Ansible — so the map is
# ENFORCED against them rather than generating them. Without this a map edit
# (a new resident model, a concurrency change) would reach the Macs and leave
# the router advertising a registry that no longer matches what they serve.
#
# A disabled large-tier entry marked `standby: true` is a deliberate temporary
# park while the serving host catches up with its declared resident set. It
# remains catalogued but is removed from the active servable projection.
#
# Fails the converge when:
#   - a mapped model has neither an enabled, servable entry nor a parked entry;
#   - that entry's max_parallel_requests differs from the catalog's limit;
#   - the servable set differs from the server class's resident + swap models;
#   - a role names a model the map does not define.

- name: Assert the registry serves exactly what the role map names
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_roles_unmatched | length == 0
      - _llm_roles_concurrency_drift | length == 0
      - _llm_roles_servable_extra | length == 0
      - _llm_roles_servable_missing | length == 0
      - _llm_roles_dangling | length == 0
    fail_msg: >-
      The registry and the role map (dryvist.homelab.llm_roles) disagree.
      Map models with neither an enabled servable nor a parked large-tier entry:
      {{ _llm_roles_unmatched | join(', ') }}.
      Entries whose max_parallel_requests differs from the catalog:
      {{ _llm_roles_concurrency_drift | join(', ') }}.
      Servable entries the server class does not serve:
      {{ _llm_roles_servable_extra | join(', ') }}.
      Models the server class serves with no servable entry:
      {{ _llm_roles_servable_missing | join(', ') }}.
      Roles naming a model the map does not define:
      {{ _llm_roles_dangling | join(', ') }}.
      Read max_parallel_requests from the shared model catalog.
    success_msg: >-
      Registry matches the role map ({{ llm_roles.models | length }} models,
      {{ llm_roles.roles | length }} roles).
  vars:
    _llm_roles_servable_ids: >-
      {{ (llm_roles.hosts.server.resident + llm_roles.hosts.server.swap)
         | map('extract', llm_roles.models) | map(attribute='id') | unique | list }}
    _llm_roles_entries: >-
      {{ llm_router_large_models | selectattr('servable', 'defined')
         | selectattr('servable') | list }}
    _llm_roles_parked_entries: >-
      {{ llm_router_model_registry | selectattr('tier', 'equalto', 'large')
         | selectattr('enabled', 'equalto', false)
         | selectattr('standby', 'defined') | selectattr('standby') | list }}
    _llm_roles_known_entries: "{{ _llm_roles_entries + _llm_roles_parked_entries }}"
    _llm_roles_parked_ids: >-
      {{ _llm_roles_parked_entries | map(attribute='client_model_id') | list }}
    _llm_roles_unmatched: >-
      {{ llm_roles.models.values() | map(attribute='id')
         | difference(_llm_roles_known_entries | map(attribute='client_model_id') | list) | list }}
    _llm_roles_concurrency_drift: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for m in llm_roles.models.values() -%}
      {%- for e in _llm_roles_known_entries
            if e.client_model_id == m.id
               and (e.max_parallel_requests | default(none))
                   != llm_router_catalog_concurrency_by_id[m.id] -%}
      {%- set ns.out = ns.out + [m.id] -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ns.out }}
    _llm_roles_servable_extra: >-
      {{ llm_router_servable_models | difference(_llm_roles_servable_ids) | list }}
    _llm_roles_servable_missing: >-
      {{ _llm_roles_servable_ids
         | difference(llm_router_servable_models + _llm_roles_parked_ids) | list }}
    _llm_roles_dangling: >-
      {{ llm_roles.roles.values() | map(attribute='model') | reject('none')
         | difference(llm_roles.models.keys() | list) | list }}
