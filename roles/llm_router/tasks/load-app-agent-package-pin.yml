---
- name: Load the existing Vikunja MCP package pin when no role default is in scope
  ansible.builtin.include_vars:
    file: >-
      {{ (_role_dir ~ '/../agentgateway_docker/defaults/main/00-gateway.yml')
         if _role_dir is defined
         else (role_path ~ '/../agentgateway_docker/defaults/main/00-gateway.yml') }}
    name: _llm_router_agentgateway_defaults
  when: agentgateway_docker_vikunja_mcp_version is not defined

- name: Reuse the existing Vikunja MCP package version
  ansible.builtin.set_fact:
    llm_router_app_agent_vikunja_mcp_version: >-
      {{ agentgateway_docker_vikunja_mcp_version
         if agentgateway_docker_vikunja_mcp_version is defined
         else _llm_router_agentgateway_defaults.agentgateway_docker_vikunja_mcp_version }}
  when: llm_router_app_agent_vikunja_mcp_version is not defined
