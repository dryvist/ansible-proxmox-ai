---
# Role targets and fallback order remain UI-owned. Their admission tags follow
# the actual stored target so a UI retarget cannot carry stale privacy classes.
- name: Derive sensitivity and privacy tag updates for existing role targets
  ansible.builtin.set_fact:
    _llm_router_role_policy_sources: >-
      {%- set ns = namespace(updates=[]) -%}
      {%- set _class_tags = (llm_router_deployment_class_by_model.values() | list)
            + ['zdr', 'retains', 'sensitivity:public', 'sensitivity:sensitive', 'sensitivity:pii'] -%}
      {%- for role in llm_router_role_deployments -%}
      {%- for live in _llm_router_roles_for_tag_sync.json.data | default([])
            | selectattr('model_name', 'equalto', role.role) -%}
      {%- if ((live.model_info | default({})).db_model | default(false)) -%}
      {%- set actual = live.litellm_params | default({}) -%}
      {%- set _capability_groups = llm_router_capability_members
            | map(attribute='route_group') | unique | list -%}
      {%- set candidates = namespace(entries=[], params=[]) -%}
      {%- for member in _llm_router_capability_member_params -%}
      {%- if (member.params.model | default('')) == (actual.model | default(''))
            and (member.params.api_base | default('')) == (actual.api_base | default('')) -%}
      {%- set candidates.entries = candidates.entries + [member.entry] -%}
      {%- set candidates.params = candidates.params + [member.params] -%}
      {%- endif -%}
      {%- endfor -%}
      {#- Preserve non-capability targets such as the native Hermes router. -#}
      {%- for entry in _llm_router_role_params | dict2items
            if entry.key not in _capability_groups -%}
      {%- if (entry.value.model | default('')) == (actual.model | default(''))
            and (entry.value.api_base | default('')) == (actual.api_base | default('')) -%}
      {%- set target_entry = (llm_router_registry_enabled
            | selectattr('client_model_id', 'equalto', entry.key) | first | default(none)) -%}
      {%- if target_entry is not none -%}
      {%- set candidates.entries = candidates.entries + [target_entry] -%}
      {%- set candidates.params = candidates.params + [entry.value] -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set policies = namespace(tags=[]) -%}
      {%- for target_entry in candidates.entries -%}
      {%- set entry_tags = llm_router_deployment_tags_by_entry[
            target_entry.client_model_id ~ '|' ~ target_entry.tier] -%}
      {%- set policy_tags = entry_tags | reject('match', '^sensitivity:')
            | reject('match', '^telemetry_') | list -%}
      {%- set sensitivity_tags = (['sensitivity:public', 'sensitivity:sensitive', 'sensitivity:pii']
            if target_entry.tier == 'hermes-router'
            else entry_tags | select('match', '^sensitivity:') | list) -%}
      {%- set signature = (policy_tags + sensitivity_tags) | unique | sort -%}
      {%- if signature not in policies.tags -%}
      {%- set policies.tags = policies.tags + [signature] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if policies.tags | length == 1 -%}
      {%- set target_tags = policies.tags | first -%}
      {%- else -%}
      {#- An unknown or ambiguous UI target is retaining and public-only. -#}
      {%- set target_tags = ['retains', 'sensitivity:public'] -%}
      {%- endif -%}
      {%- set live_tags = actual.tags | default([]) | list -%}
      {%- set desired_tags = ((live_tags | reject('in', _class_tags) | list)
            + target_tags) | unique | list -%}
      {%- set _priority_previous = (live.model_info | default({})).get('priority_policy', {}) -%}
      {%- set projection = lookup('template', (_role_dir | default(role_path))
            ~ '/templates/role-priority-policy.json.j2', template_vars={
              '_priority_role': role, '_priority_params': actual,
              '_priority_tags': desired_tags,
              '_priority_previous': _priority_previous}) | from_json -%}
      {%- set _discard = ns.updates.append({
            'role': role.role, 'live': live, 'entries': projection,
            'transport': candidates.params | first | default({}),
          }) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ns.updates }}
  no_log: true

- name: Require model ids for role tag updates
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_role_policy_sources | selectattr('live.model_info.id', 'undefined') | list | length == 0
      - _llm_router_role_policy_sources | selectattr('live.model_info.id', 'equalto', '') | list | length == 0
    fail_msg: >-
      A role deployment needs its stored model id before LiteLLM tags can be
      reconciled.

- name: Project per-tier role creates and policy updates
  ansible.builtin.import_tasks: prepare-role-priority-updates.yml
