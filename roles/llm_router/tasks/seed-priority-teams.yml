---
- name: Read each priority team's policy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/team/info?team_id={{ item.team_id }}"
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    status_code: [200, 404]
    timeout: "{{ llm_router_seed_request_timeout }}"
  loop: "{{ llm_router_priority_team_settings }}"
  loop_control:
    label: "{{ item.team_id }}"
  register: _llm_router_priority_team_info
  changed_when: false
  check_mode: false
  no_log: true

- name: Create absent priority teams
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/team/new"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    body_format: json
    body:
      team_id: "{{ item.item.team_id }}"
      team_alias: "{{ item.item.team_id }}"
      models: "{{ item.item.models }}"
      router_settings: "{{ llm_router_priority_policy_by_tier[item.item.tier | string].router_settings }}"
      metadata: >-
        {{ item.item.metadata | combine({'tags': llm_router_priority_policy_by_tier[item.item.tier | string].tags}) }}
      object_permission:
        mcp_access_groups: "{{ llm_router_priority_team_mcp_access_groups.get(item.item.team_id, []) }}"
    status_code: [200, 201]
    timeout: "{{ llm_router_seed_request_timeout }}"
  loop: "{{ _llm_router_priority_team_info.results }}"
  loop_control:
    label: "{{ item.item.team_id }}"
  when: item.status == 404
  no_log: true

- name: Reconcile existing priority team tags
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/team/update"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    body_format: json
    body:
      team_id: "{{ item.item.team_id }}"
      models: "{{ item.item.models }}"
      metadata: "{{ _metadata }}"
      router_settings: "{{ _settings }}"
      object_permission:
        mcp_access_groups: "{{ _mcp_groups }}"
    status_code: [200, 201]
    timeout: "{{ llm_router_seed_request_timeout }}"
  vars:
    _mcp_groups: "{{ llm_router_priority_team_mcp_access_groups.get(item.item.team_id, []) | sort }}"
    _live_mcp_groups: >-
      {{ ((item.json.team_info.object_permission | default({}, true)).mcp_access_groups | default([], true)) | sort }}
    _live_metadata: "{{ item.json.team_info.metadata | default({}, true) }}"
    _metadata: "{{ _live_metadata | combine(item.item.metadata) | combine({'tags': _tags}) }}"
    _live_settings: "{{ item.json.team_info.router_settings | default({}, true) }}"
    _settings: >-
      {{ _live_settings | combine(llm_router_priority_policy_by_tier[item.item.tier | string].router_settings) }}
    _tags: >-
      {{ ((_live_metadata.tags | default([], true))
          | reject('match', '^([&!])?tier-[0-9]+$') | list)
         + ['&tier-' ~ item.item.tier] + (['&local'] if item.item.tier == 2 else [])
         | unique | list }}
  loop: "{{ _llm_router_priority_team_info.results }}"
  loop_control:
    label: "{{ item.item.team_id }}"
  when:
    - item.status == 200
    - >-
      _metadata != _live_metadata or _settings != _live_settings or _mcp_groups != _live_mcp_groups or
      (item.json.team_info.models | default([], true) | sort) != (item.item.models | sort)
  no_log: true
