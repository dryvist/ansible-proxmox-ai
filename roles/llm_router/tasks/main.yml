---
# llm_router — a LiteLLM proxy in a plain LXC (no Docker): a Python venv + a systemd
# service. Ansible owns the whole platform (user, venv, config, unit). Idempotent.

# The model registry is the single source for every model name, alias, tier and
# enabled/servable state. Loaded FIRST: every tier view, selector var and alias
# in defaults/main.yml is a projection of it, so the asserts below and the render
# further down both need it in scope.
- name: Load the fabric model registry
  ansible.builtin.import_tasks: registry.yml

# Layer 1 — render-time contract assertions. Imported next so a brain alias that
# would fall through to the null-context wildcard fails the play before the config
# is rendered or the service restarts. Inherits the play's llm_router tag.
- name: Assert brain aliases carry real context windows before converging
  ansible.builtin.import_tasks: assert.yml

- name: Install the Python runtime and git
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the litellm service group
  ansible.builtin.group:
    name: "{{ llm_router_group }}"
    system: true

- name: Create the litellm service user
  ansible.builtin.user:
    name: "{{ llm_router_user }}"
    group: "{{ llm_router_group }}"
    home: "{{ llm_router_home }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: true

- name: Ensure the litellm config directory exists
  ansible.builtin.file:
    path: "{{ llm_router_config_dir }}"
    state: directory
    owner: root
    group: "{{ llm_router_group }}"
    mode: "0750"

# One idempotent task: virtualenv_command builds the venv with the stdlib `venv`
# module (no `virtualenv` pip package on a minimal LXC), then pip populates it.
# Re-runs are no-ops once the packages are present.
- name: Create the venv and install LiteLLM (proxy extras)
  ansible.builtin.pip:
    name: "{{ llm_router_pip_packages }}"
    state: present
    virtualenv: "{{ llm_router_venv }}"
    virtualenv_command: python3 -m venv

# The interpreter minor is the venv's business, not this role's: ask the venv
# where its site-packages is instead of spelling a version into every path.
- name: Resolve the venv's site-packages directory
  ansible.builtin.command:
    argv:
      - "{{ llm_router_venv }}/bin/python"
      - -c
      - import sysconfig; print(sysconfig.get_paths()['purelib'])
  register: llm_router_venv_purelib
  changed_when: false

- name: Record the venv's site-packages directory
  ansible.builtin.set_fact:
    llm_router_site_packages: "{{ llm_router_venv_purelib.stdout | trim }}"

# prisma is a pip package plus a GENERATED client: with a database configured,
# LiteLLM's startup asks prisma for its generated binaries and exits when they
# are absent, so the service crash-loops after the first database-enabled
# deploy. Generation is idempotent and writes into the venv's site-packages;
# the freshness test below makes re-runs free.
# Generation WRITES the resolved schema and the generated modules back into the
# prisma package directory, which pip installed root-owned: without this the
# service user's generate fails with PermissionError on prisma/schema.prisma.
- name: Let the service user write its generated client into the prisma package
  ansible.builtin.file:
    path: "{{ llm_router_site_packages }}/prisma"
    owner: "{{ llm_router_user }}"
    group: "{{ llm_router_group }}"
    recurse: true
  when: llm_router_store_model_in_db | bool

# The generated client embeds the schema it was generated from. A package
# upgrade replaces litellm's schema.prisma but leaves the client in the prisma
# package untouched, so a `creates:` guard on the generated file skips
# regeneration forever after the first install and the proxy starts against a
# client that does not know the new columns. Regenerate whenever the installed
# schema is newer than the generated one, or the generated one is absent
# (`test -nt` is false for a missing first operand).
- name: Check whether the generated prisma client is at least as new as the installed schema
  ansible.builtin.command:
    argv:
      - test
      - "{{ llm_router_site_packages }}/prisma/schema.prisma"
      - -nt
      - "{{ llm_router_site_packages }}/litellm/proxy/schema.prisma"
  register: llm_router_prisma_client_fresh
  changed_when: false
  failed_when: false
  when: llm_router_store_model_in_db | bool

- name: Generate the prisma client the database-backed proxy starts against
  # As the SERVICE USER, from a directory it can read: generation embeds the
  # generating user's engine-cache path into the client, so a root-generated
  # client points the service at binaries it cannot execute, and the proxy
  # crash-loops with "Not connected to the query engine".
  # runuser, not become_user: the guests carry no sudo, and the play already
  # runs as root — runuser drops to the service user without any helper.
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ llm_router_user }}"
      - --
      - env
      - "HOME={{ llm_router_home }}"
      - "XDG_CACHE_HOME={{ llm_router_home }}/.cache"
      - "PATH={{ llm_router_venv }}/bin:/usr/bin:/bin"
      - "{{ llm_router_venv }}/bin/prisma"
      - generate
      - --schema
      - "{{ llm_router_site_packages }}/litellm/proxy/schema.prisma"
    chdir: /tmp
  # Guarded by the freshness test above rather than `creates:` on the engine
  # cache (populated before generation can fail) or on the generated schema
  # (never refreshed by a package upgrade). It runs only when regeneration is
  # due, so every run is a change.
  changed_when: true
  when: llm_router_store_model_in_db | bool and llm_router_prisma_client_fresh.rc != 0
  notify: Restart litellm

# The generated client talks to tables `prisma db push` creates; on a fresh
# database LiteLLM starts but every management endpoint 500s with
# TableNotFoundError. Push is idempotent (in-sync push is a no-op) and needs
# the same service-user environment as generation above.
- name: Sync the proxy schema into the database
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ llm_router_user }}"
      - --
      - env
      - "HOME={{ llm_router_home }}"
      - "XDG_CACHE_HOME={{ llm_router_home }}/.cache"
      - "PATH={{ llm_router_venv }}/bin:/usr/bin:/bin"
      - >-
        DATABASE_URL=postgresql://{{ llm_router_db_user
        }}:{{ llm_router_db_password | urlencode
        }}@{{ llm_router_db_host }}:{{ llm_router_db_port
        }}/{{ llm_router_db_name }}
      - "{{ llm_router_venv }}/bin/prisma"
      - db
      - push
      - --schema
      - "{{ llm_router_site_packages }}/litellm/proxy/schema.prisma"
      - --skip-generate
    chdir: /tmp
  register: llm_router_schema_push
  changed_when: "'already in sync' not in llm_router_schema_push.stdout"
  when: llm_router_store_model_in_db | bool
  no_log: true
  notify: Restart litellm

- name: Assert every secret rendered into the LiteLLM env file is present
  ansible.builtin.include_tasks: >-
    {{ role_path }}/../openbao_secrets/tasks/assert_nonempty.yml
  vars:
    openbao_secrets_assert_context: the LiteLLM env file
    openbao_secrets_assert_names:
      - llm_router_master_key
      - llm_router_llm_large_bearer

- name: Deploy the LiteLLM secrets env file
  ansible.builtin.template:
    src: litellm.env.j2
    dest: "{{ llm_router_env_file }}"
    owner: root
    group: "{{ llm_router_group }}"
    mode: "0640"
  no_log: true
  notify: Restart litellm

# The retired daily-rotation deployment (deleted 2026-07-16) left a config.yaml
# symlink + per-phase configs + flip timers on converged routers; these cleanup
# tasks are idempotent no-ops once a host is clean.
- name: Stat the LiteLLM config path
  ansible.builtin.stat:
    path: "{{ llm_router_config_file }}"
  register: llm_router_config_stat

- name: Drop the retired rotation symlink so the render below writes a real file
  ansible.builtin.file:
    path: "{{ llm_router_config_file }}"
    state: absent
  when: llm_router_config_stat.stat.islnk | default(false)

- name: Remove the retired rotation timers, units, per-phase configs and sentinel
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/litellm-rotate-large.timer
    - /etc/systemd/system/litellm-rotate-large.service
    - /etc/systemd/system/litellm-rotate-optimized.timer
    - /etc/systemd/system/litellm-rotate-optimized.service
    - "{{ llm_router_config_dir }}/config-large.yaml"
    - "{{ llm_router_config_dir }}/config-optimized.yaml"
    - "{{ llm_router_config_dir }}/rotation-paused"
  register: llm_router_rotation_cleanup

# systemd only forgets a deleted unit after a reload; stop is best-effort since
# the timer may already be gone or never deployed.
- name: Stop the retired rotation timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - litellm-rotate-large.timer
    - litellm-rotate-optimized.timer
  failed_when: false
  when:
    - llm_router_rotation_cleanup is changed
    - ansible_virtualization_type | default('') != 'docker'

- name: Reload systemd after removing the rotation units
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - llm_router_rotation_cleanup is changed
    - ansible_virtualization_type | default('') != 'docker'

- name: Deploy the LiteLLM proxy config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ llm_router_config_file }}"
    owner: root
    group: "{{ llm_router_group }}"
    mode: "0640"
  notify: Restart litellm

- name: Resolve the heavy-tier serving apex IP for LiteLLM host pinning
  # Preference order: the published reservation (tofu constants.serving.ip, or
  # the env override) first, controller-side DNS second. DNS stays as a fallback
  # rather than being removed with the literal, because it is a real resolution
  # of the same reservation — the record is generated from the same value — and
  # not a guess. The hostname has no such second authority, which is why its
  # assert in assert.yml is fatal and this one is not.
  ansible.builtin.set_fact:
    llm_router_llm_large_ip: >-
      {{
        llm_large_serving_ip
        | default(lookup('pipe', 'dig +short ' ~ llm_router_llm_large_fqdn ~ ' | head -n1'), true)
        | trim
      }}

- name: Assert the Mac Studio apex resolved for LiteLLM host pinning
  ansible.builtin.assert:
    that:
      - llm_router_llm_large_ip | length > 0
    fail_msg: >-
      Could not resolve {{ llm_router_llm_large_fqdn }} to an IPv4 address for
      the LiteLLM /etc/hosts pin.

- name: Pin the Mac Studio apex in /etc/hosts for LiteLLM
  # Keep a local resolver pin here so the router hosts do not depend on their
  # own DNS path before they can reach the gate.
  ansible.builtin.lineinfile:
    path: /etc/hosts
    owner: root
    group: root
    mode: "0644"
    regexp: >-
      ^{{ llm_router_llm_large_ip | regex_escape }}\s+.*\b{{ llm_router_llm_large_fqdn | regex_escape }}\b
    line: >-
      {{ llm_router_llm_large_ip }}
      {{ llm_router_llm_large_fqdn }}
    create: true
    state: present
  notify: Restart litellm

- name: Deploy the litellm systemd unit
  ansible.builtin.template:
    src: litellm.service.j2
    dest: "/etc/systemd/system/{{ llm_router_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart litellm

- name: Enable and start litellm
  ansible.builtin.systemd:
    name: "{{ llm_router_service }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Flush handlers so config / unit changes apply before verification
  ansible.builtin.meta: flush_handlers

# Type=simple reports 'active' the instant the process forks; poll until it settles
# so a proxy that crashes a moment later fails loud here (mirrors roles/agent_exec).
- name: Verify the litellm service is active
  ansible.builtin.systemd:
    name: "{{ llm_router_service }}"
  register: llm_router_service_state
  until: llm_router_service_state.status.ActiveState | default('') == 'active'
  retries: 5
  delay: 3

# /health/liveliness is unauthenticated by design (LiteLLM load-balancer probe),
# so this confirms the proxy is serving without needing the master key.
#
# The budget is deliberately large. LiteLLM does not bind its listener until it
# has registered every entry in model_list, and that work scales with the list:
# on 2026-07-30 a router with ~30 entries was still emitting register_model
# lines nearly four minutes after systemd reported the unit active. The former
# 5 x 3 s budget gave it fifteen seconds.
#
# Failing here is worse than it looks, which is why the budget matters more than
# the fifteen seconds it used to save. This task is the last one in the role, so
# a host that trips it fails the play, and a failed host ends the run for every
# host behind it in the batch — "NO MORE HOSTS LEFT". On 2026-07-30 that left a
# third router still serving the previous config while the first two had moved
# on, i.e. the fleet silently disagreed with itself about which models the
# aliases resolve to. A slow start read as a broken one, and the cost was
# charged to a host that was never touched.
- name: Verify the LiteLLM liveness endpoint answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/health/liveliness"
    status_code: 200
  register: llm_router_liveness
  until: llm_router_liveness.status == 200
  retries: "{{ llm_router_liveness_retries }}"
  delay: "{{ llm_router_liveness_delay }}"

# Roles are stored in the database and administered in the UI, so this runs only
# where both exist, and only creates what is missing. It is LAST because it
# talks to the proxy this play just started — see the file for the first-seed
# contract that keeps a converge from undoing a UI edit.
- name: Seed the caller-facing roles the first time this proxy carries them
  ansible.builtin.import_tasks: seed-roles.yml
  when:
    - llm_router_db_host | length > 0
    - llm_router_store_model_in_db | bool
