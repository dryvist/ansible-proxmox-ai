---
# llm_router — a LiteLLM proxy in a plain LXC (no Docker): a Python venv + a systemd
# service. Ansible owns the whole platform (user, venv, config, unit). Idempotent.

# The model registry is the single source for every model name, alias, tier and
# enabled/servable state. Loaded FIRST: every tier view, selector var and alias
# in defaults/main.yml is a projection of it, so the asserts below and the render
# further down both need it in scope.
- name: Load the fabric model registry
  ansible.builtin.import_tasks: registry.yml

# This read/write directory check records the per-node subscription gate used
# by the router projections below; resolve it before materializing those
# projections for the assertions and config render.
- name: Record the per-node ChatGPT subscription login (never written here)
  ansible.builtin.import_tasks: chatgpt-auth.yml

# Run the existing registry servable-probe plan before caching any projections;
# entries with `probe_before_render` feed their reachability result back into
# the same enabled-model views used by the config renderer.
- name: Verify registry-declared serving endpoints
  ansible.builtin.import_tasks: verify-servable.yml

# The contract inputs below are lazy Jinja projections of the registry and
# role defaults. Several assertions traverse the same projections in nested
# loops, so materialize the shared inputs once per router before validating
# them. The virtual-key projection can contain credentials; its task is
# no_log.
- name: Materialize the shared router assertion inputs
  ansible.builtin.import_tasks: assertion-inputs.yml

# Layer 1 — render-time contract assertions. Imported next so a brain alias that
# would fall through to the null-context wildcard fails the play before the config
# is rendered or the service restarts. Inherits the play's llm_router tag.
- name: Assert brain aliases carry real context windows before converging
  ansible.builtin.import_tasks: assert.yml

# LiteLLM 1.104 refuses an unset, empty, or publicly known default master key.
# Check before package/service/database work and never echo the secret on error.
- name: Require a safe LiteLLM master key before installing the proxy
  ansible.builtin.assert:
    quiet: true
    that:
      - llm_router_master_key | trim | length > 0
      - llm_router_master_key | trim != 'sk-1234'
    fail_msg: >-
      LiteLLM 1.104 refuses an empty or publicly known master key; rotate the
      configured key through its existing secret lifecycle.
  no_log: true

- name: Install LiteLLM runtime and prepare the database schema
  ansible.builtin.import_tasks: install-runtime.yml

- name: Assert every secret rendered into the LiteLLM env file is present
  ansible.builtin.include_tasks: >-
    {{ role_path }}/../openbao_secrets/tasks/assert_nonempty.yml
  vars:
    openbao_secrets_assert_context: the LiteLLM env file
    openbao_secrets_assert_names:
      - llm_router_master_key
      - llm_router_llm_large_bearer
      - llm_router_mcp_zammad_url
      - llm_router_mcp_zammad_http_token

- name: Settle the optional Slack MCP server
  ansible.builtin.import_tasks: mcp-slack.yml

- name: Deploy the LiteLLM secrets env file
  ansible.builtin.template:
    src: litellm.env.j2
    dest: "{{ llm_router_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart litellm

- name: Remove the retired per-phase rotation before rendering the config
  ansible.builtin.import_tasks: retire-rotation.yml

- name: Remove the retired fast-subagent-lock callback
  ansible.builtin.file:
    path: "{{ llm_router_config_dir }}/fast_subagent_lock.py"
    state: absent
  notify: Restart litellm

# Runtime files, config, and service unit are deployed as one ordered tranche.
- name: Deploy LiteLLM runtime files and service
  ansible.builtin.import_tasks: deploy-runtime.yml

# Read-only probe, initial mode only: rebuild always overwrites regardless of
# what the database holds, so there is nothing for it to decide.
- name: Check whether an operator-editable router_settings row already exists
  ansible.builtin.import_tasks: probe-router-settings.yml
  when:
    - llm_router_db_host | length > 0
    - llm_router_store_model_in_db | bool
    - llm_router_seed_mode == 'initial'

# BEFORE the flush, deliberately: the persisted router_settings row shadows the
# rendered file, so it has to be corrected while the old proxy is still up and
# then picked up by the very restart this flush performs.
#
# Gated by llm_router_seed_mode (defaults/main/45-database.yml): in `initial`
# mode (default) this is skipped once a row already exists, so a converge
# cannot overwrite a Router Settings edit made in the Admin UI. `rebuild`
# always runs — the DR / from-scratch reset.
- name: Keep the database from shadowing the rendered router settings
  ansible.builtin.import_tasks: sync-router-settings.yml
  when:
    - llm_router_db_host | length > 0
    - llm_router_store_model_in_db | bool
    - _llm_router_router_settings_may_seed | bool

- name: Flush handlers so config / unit changes apply before verification
  ansible.builtin.meta: flush_handlers

# Type=simple reports 'active' the instant the process forks; poll until it settles
# so a proxy that crashes a moment later fails loud here (mirrors roles/agent_exec).
- name: Verify the litellm service is active
  ansible.builtin.systemd:
    name: "{{ llm_router_service }}"
  register: llm_router_service_state
  until: llm_router_service_state.status.ActiveState | default('') == 'active'
  retries: 5
  delay: 3

# This task is the last one in the role, so a host that trips it fails the
# play, and a failed host ends the run for every host behind it in the batch —
# "NO MORE HOSTS LEFT". On 2026-07-30 that left a third router still serving
# the previous config while the first two had moved on, i.e. the fleet
# silently disagreed with itself about which models the aliases resolve to.
# A slow start read as a broken one, and the cost was charged to a host that
# was never touched. See verify-liveness.yml for the check itself — imported
# here and from handlers/main.yml, one declaration, not a copy.
- name: Verify the LiteLLM liveness endpoint answers
  ansible.builtin.import_tasks: verify-liveness.yml

# Liveness alone is not the proof: the listener is up before the config is
# loaded, and a config the proxy cannot load leaves /v1/models empty or the
# process in a crash loop that the systemd poll above can miss between
# restarts. A non-empty authenticated model list is what proves THIS member
# serves the rendered config, and it is the gate the rolling play waits on.
- name: Verify this member serves the rendered model list
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/v1/models"
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    status_code: 200
    return_content: true
    timeout: 2
  register: llm_router_models_probe
  until:
    - llm_router_models_probe.status | default(0) == 200
    - (llm_router_models_probe.json.data | default([])) | length > 0
  # Liveness has already established that the listener is accepting requests;
  # 10 two-second attempts with six-second gaps cap this proof at 74 seconds.
  retries: 10
  delay: "{{ llm_router_liveness_delay }}"
  no_log: true

- name: Verify the rendered MCP server tool lists
  ansible.builtin.import_tasks: verify-mcp-tools.yml

# Virtual keys, their budgets, and caller-facing roles (seed-consumers.yml)
# are NOT imported here: they write to the pool's SHARED database, so
# running them once per serial:1 member repeated the same writes three
# times. playbooks/llm-serving.yml runs seed-consumers.yml as its own
# run_once play over the whole pool, right after this rolling converge —
# same reason the journal forwarding route (10-llm-router-syslog.yml) is not
# imported here either: a failure in either one never stops the rollout.
