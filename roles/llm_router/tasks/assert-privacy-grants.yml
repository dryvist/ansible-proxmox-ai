---
- name: Require public privacy class for managed free or retaining grants
  ansible.builtin.assert:
    quiet: true
    that:
      - _violations | length == 0
      - llm_router_default_key_generate_params.models | length > 0
      - llm_router_default_key_generate_params.models | difference(llm_router_zdr_asserted_group_names) | length == 0
      - _default_team | length == 1
      - _default_team[0].models | length > 0
      - _default_team[0].models | difference(llm_router_zdr_asserted_group_names) | length == 0
    fail_msg: >-
      Free, retaining, or unrestricted grants require privacy class public:
      {{ _violations }}. Default keys and the default team must grant only ZDR deployments.
  vars:
    _llm_router_privacy_records: >-
      {{ _llm_router_virtual_keys_without_values + llm_router_default_team_settings
         + [llm_router_default_key_generate_params | combine({'alias': 'default-key'})] }}
    _violations: "{{ lookup('template', llm_router_privacy_grants_template) }}"
    _default_team: >-
      {{ llm_router_default_team_settings | selectattr('team_id', 'equalto', 'default-settings') | list }}
