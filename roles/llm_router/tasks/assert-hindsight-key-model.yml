---
- name: Assert the disabled Hindsight key sentinel cannot name a routed model
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_hindsight_disabled_model_sentinel not in _llm_router_hindsight_registered_names
    fail_msg: >-
      The Hindsight disabled-key sentinel
      [{{ _llm_router_hindsight_disabled_model_sentinel }}] collides with a
      registered client model, route, alias, role, direct route or long-context
      name. Choose a sentinel outside the router's canonical model registry.
    success_msg: The Hindsight disabled-key sentinel is not a registered router name.
  vars:
    _llm_router_hindsight_registered_names: >-
      {{ (llm_router_model_registry | map(attribute='client_model_id') | list)
         + (llm_router_model_registry | selectattr('route_group', 'defined')
            | map(attribute='route_group') | list)
         + (llm_router_model_group_aliases | dict2items | map(attribute='key') | list)
         + (llm_router_model_group_aliases | dict2items | map(attribute='value') | list)
         + (llm_router_role_deployments | map(attribute='role') | list)
         + (llm_router_role_deployments | map(attribute='model') | list)
         + llm_router_registry_enabled_route_names
         + llm_router_direct_route_aliases
         + llm_router_long_context_alias_ids }}
