---
# Required boundary probes, run on every converge after the keys are seeded.
# assert-app-agents.yml has already proven each enabled tier has its key and
# probe target, so nothing here is skipped while a tier is enabled. A disabled
# tier (no app token) renders no server and no key, so there is nothing to call.
- name: Materialize app-agent probe keys and enabled tiers
  ansible.builtin.set_fact:
    _llm_router_app_probe_keys: >-
      {{ dict(_llm_router_agent_keys | map(attribute='alias')
         | zip(_llm_router_agent_keys | map(attribute='value'))) }}
    _llm_router_app_probe_tiers: >-
      {{ _llm_router_app_agent_matrix | selectattr('enabled') | map(attribute='id') | list }}
    _llm_router_app_probe_url: "http://127.0.0.1:{{ llm_router_api_port }}/mcp-rest/tools/call"
  no_log: true
  tags: [llm_router_app_agent_probe]

- name: Call each boundary probe through LiteLLM's MCP REST endpoint
  ansible.builtin.uri:
    url: "{{ _llm_router_app_probe_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ _llm_router_app_probe_keys[item.key] }}"
      Content-Type: application/json
    body_format: json
    body: "{{ item.body }}"
    status_code: [200, 400, 401, 403, 404, 422, 500]
    return_content: true
    timeout: 20
  loop: "{{ _llm_router_app_probe_calls | selectattr('needs', 'subset', _llm_router_app_probe_tiers) | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: _llm_router_app_probe_results
  check_mode: false
  no_log: true
  tags: [llm_router_app_agent_probe]
  vars:
    _llm_router_app_probe_calls:
      - name: read-lists-projects
        needs: [vikunja-read]
        key: vikunja-read
        body: {server_id: vikunja_read, name: vikunja_projects, arguments: {subcommand: list}}
      - name: read-gets-forbidden-project
        needs: [vikunja-read]
        key: vikunja-read
        body:
          server_id: vikunja_read
          name: vikunja_projects
          arguments: {subcommand: get, id: "{{ llm_router_app_agent_probe_vikunja_forbidden_project_id | int }}"}
      - name: read-key-on-write-server
        needs: [vikunja-read, vikunja-write]
        key: vikunja-read
        body: {server_id: vikunja_write, name: vikunja_projects, arguments: {subcommand: list}}
      - name: read-key-on-zammad-server
        needs: [vikunja-read, zammad-write]
        key: vikunja-read
        body: {server_id: zammad_write, name: zammad_get_current_user, arguments: {}}
      - name: write-lists-projects
        needs: [vikunja-write]
        key: vikunja-write
        body: {server_id: vikunja_write, name: vikunja_projects, arguments: {subcommand: list}}
      - name: zammad-write-resolves-self
        needs: [zammad-write]
        key: zammad-write
        body: {server_id: zammad_write, name: zammad_get_current_user, arguments: {}}

- name: Index the probe results by name
  ansible.builtin.set_fact:
    _llm_router_app_probe: >-
      {{ dict(_llm_router_app_probe_results.results | map(attribute='item.name')
         | zip(_llm_router_app_probe_results.results)) }}
  no_log: true
  tags: [llm_router_app_agent_probe]

- name: Try a read-tier task create in a project the read user can see
  ansible.builtin.uri:
    url: "{{ _llm_router_app_probe_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ _llm_router_app_probe_keys['vikunja-read'] }}"
      Content-Type: application/json
    body_format: json
    body:
      server_id: vikunja_read
      name: vikunja_tasks
      arguments:
        subcommand: create
        projectId: "{{ _llm_router_app_probe_read_projects[0].id }}"
        title: Router authorization probe task
        description: Delete on sight; the read tier must not be able to create this.
    status_code: [200, 400, 401, 403, 404, 422, 500]
    return_content: true
    timeout: 20
  register: _llm_router_app_probe_create
  check_mode: false
  when: "'vikunja-read' in _llm_router_app_probe_tiers"
  vars:
    _llm_router_app_probe_read_projects: >-
      {{ (_llm_router_app_probe['read-lists-projects'].json.content[0].text | from_json).data.projects }}
  no_log: true
  tags: [llm_router_app_agent_probe]

- name: Require the read tier to see only allowlisted projects
  ansible.builtin.assert:
    quiet: true
    that:
      - _r.status == 200
      - not (_r.json.isError | default(false))
      - _titles | length > 0
      - _titles | difference(llm_router_app_agent_vikunja_read_allowlist) | length == 0
    fail_msg: The Vikunja read identity sees a project outside its allowlist, or cannot list projects.
  vars:
    _r: "{{ _llm_router_app_probe['read-lists-projects'] }}"
    _titles: "{{ (_r.json.content[0].text | from_json).data.projects | map(attribute='title') | list }}"
  when: "'vikunja-read' in _llm_router_app_probe_tiers"
  no_log: true
  tags: [llm_router_app_agent_probe]

- name: Require the read tier to be denied the non-allowlisted project and every write
  ansible.builtin.assert:
    quiet: true
    that:
      - _get.status != 200 or (_get.json.isError | default(false))
      - _llm_router_app_probe_create.status != 200 or (_llm_router_app_probe_create.json.isError | default(false))
    fail_msg: >-
      The Vikunja read tier read a non-allowlisted project or created a task; delete
      any "Router authorization probe task" and fix the read identity's grants.
  vars:
    _get: "{{ _llm_router_app_probe['read-gets-forbidden-project'] }}"
  when: "'vikunja-read' in _llm_router_app_probe_tiers"
  no_log: true
  tags: [llm_router_app_agent_probe]

- name: Require LiteLLM to refuse the read key on every other tier's server
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_app_probe[item].status == 403
      - _llm_router_app_probe[item].json.detail.error | default('') == 'access_denied'
    fail_msg: LiteLLM let the Vikunja read-tier key call a server outside its grant.
  loop: "{{ ['read-key-on-write-server', 'read-key-on-zammad-server'] | select('in', _llm_router_app_probe) | list }}"
  no_log: true
  tags: [llm_router_app_agent_probe]

- name: Require each write tier to reach its own server
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_app_probe[item].status == 200
      - not (_llm_router_app_probe[item].json.isError | default(false))
    fail_msg: A write-tier key could not use its own MCP server.
  loop: "{{ ['write-lists-projects', 'zammad-write-resolves-self'] | select('in', _llm_router_app_probe) | list }}"
  no_log: true
  tags: [llm_router_app_agent_probe]
