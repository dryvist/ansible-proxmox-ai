---
# Shared roots are separate so render fixtures can reuse them while still
# varying virtual-key declarations in task scope.
#
# Derived inputs are cached under `_llm_router_m_` names. Their role defaults
# (defaults/main/57a-materialized-aliases.yml) alias the live expressions, so
# consumers read the cache and a re-materialization recomputes from current
# inputs. Never set_fact a live name to its own expression: that pins it.
- name: Materialize the router registry and role deployments
  ansible.builtin.set_fact:
    llm_router_registry_enabled: "{{ llm_router_registry_enabled }}"
    llm_router_role_deployments: "{{ llm_router_role_deployments }}"
  no_log: true

- name: Materialize router assertion projections
  ansible.builtin.set_fact:
    llm_router_servable_models: "{{ llm_router_servable_models }}"
    llm_router_gpu_servable_models: "{{ llm_router_gpu_servable_models }}"
    llm_router_all_servable_models: "{{ llm_router_all_servable_models }}"
    llm_router_hermes_router_ids: "{{ llm_router_hermes_router_ids }}"
    llm_router_long_context_alias_ids: "{{ llm_router_long_context_alias_ids }}"
    llm_router_zdr_asserted_group_names: "{{ llm_router_zdr_asserted_group_names }}"
  no_log: true

- name: Materialize the registry credential projection
  ansible.builtin.set_fact:
    _llm_router_m_resolved_credentials: "{{ llm_router_resolved_credentials }}"
  no_log: true

- name: Materialize the Hermes cloud credentialed models
  ansible.builtin.set_fact:
    _llm_router_m_hermes_cloud_models_credentialed: "{{ llm_router_hermes_cloud_models_credentialed }}"
  no_log: true

- name: Materialize Hermes local fallback inputs
  ansible.builtin.set_fact:
    _llm_router_m_hermes_local_fallback_models: "{{ llm_router_hermes_local_fallback_models }}"
    _llm_router_m_hermes_primary_context_window: "{{ llm_router_hermes_primary_context_window }}"
  no_log: true

- name: Materialize Hermes local fallback groups
  ansible.builtin.set_fact:
    _llm_router_m_local_fallback_groups: "{{ llm_router_local_fallback_groups }}"
    _llm_router_m_hermes_local_narrow_groups: "{{ llm_router_hermes_local_narrow_groups }}"
  no_log: true

- name: Materialize the wide Hermes local fallback groups
  ansible.builtin.set_fact:
    _llm_router_m_hermes_local_wide_groups: "{{ llm_router_hermes_local_wide_groups }}"
  no_log: true

- name: Materialize registry retention classes
  ansible.builtin.set_fact:
    _llm_router_m_registry_zdr_by_model: "{{ llm_router_registry_zdr_by_model }}"
  no_log: true

- name: Materialize deployment classes
  ansible.builtin.set_fact:
    _llm_router_m_deployment_class_by_model: "{{ llm_router_deployment_class_by_model }}"
  no_log: true

- name: Materialize paid D1 groups by class
  ansible.builtin.set_fact:
    _llm_router_m_d1_paid_groups_by_class: "{{ llm_router_d1_paid_groups_by_class }}"
  no_log: true

- name: Materialize the D1 rungs by class
  ansible.builtin.set_fact:
    _llm_router_m_d1_rungs_by_class: "{{ llm_router_d1_rungs_by_class }}"
  no_log: true

- name: Materialize the ordered D1 ladder
  ansible.builtin.set_fact:
    _llm_router_m_d1_class_order: "{{ llm_router_d1_class_order }}"
    _llm_router_m_d1_ladder_groups: "{{ llm_router_d1_ladder_groups }}"
  no_log: true

- name: Materialize the Hermes fallback ladder aliases
  ansible.builtin.set_fact:
    _llm_router_m_hermes_cloud_fallback_groups: "{{ llm_router_hermes_cloud_fallback_groups }}"
    _llm_router_m_hermes_default_fallback_chain: "{{ llm_router_hermes_default_fallback_chain }}"
    _llm_router_m_default_fallbacks: "{{ llm_router_default_fallbacks }}"
  no_log: true

- name: Materialize router aliases and the callable fallback ladder
  ansible.builtin.set_fact:
    llm_router_model_group_aliases: "{{ llm_router_model_group_aliases }}"
    _llm_router_directly_callable_ladder_names: "{{ _llm_router_directly_callable_ladder_names }}"
  no_log: true

- name: Materialize the full key scope
  ansible.builtin.set_fact:
    _llm_router_key_scope_all: "{{ _llm_router_key_scope_all }}"
  no_log: true
