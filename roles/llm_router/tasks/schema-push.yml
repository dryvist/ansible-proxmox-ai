---
# Included from main.yml only when the router stores models in the database.
# Apply the migrations the installed litellm-proxy-extras ships before startup,
# forward-only, the way LiteLLM migrates at start: `prisma migrate deploy` never
# drops a table or column the migration history does not, and ignores applied
# migrations newer than the ones shipped, so an older proxy keeps the newer
# schema. Do not disable LiteLLM's startup migration check.

# The service-user environment both Prisma commands run under, DATABASE_URL
# included, so it is set once and never logged.
- name: Build the Prisma command prefix
  ansible.builtin.set_fact:
    llm_router_prisma_prefix:
      - runuser
      - -u
      - "{{ llm_router_user }}"
      - --
      - env
      - "HOME={{ llm_router_home }}"
      - "XDG_CACHE_HOME={{ llm_router_home }}/.cache"
      - "PATH={{ llm_router_venv }}/bin:/usr/bin:/bin"
      - >-
        DATABASE_URL=postgresql://{{ llm_router_db_user
        }}:{{ llm_router_db_password | urlencode
        }}@{{ llm_router_db_host }}:{{ llm_router_db_port
        }}/{{ llm_router_db_name }}
  no_log: true

- name: Ensure the JWT mapping unique index before the push
  ansible.builtin.include_tasks: jwt-unique-index.yml

- name: Sync the proxy schema into the database
  ansible.builtin.command:
    argv: >-
      {{ llm_router_prisma_prefix + [
        llm_router_venv ~ '/bin/prisma', 'migrate', 'deploy',
        '--schema', llm_router_site_packages ~ '/litellm_proxy_extras/schema.prisma'] }}
    chdir: /tmp
  register: llm_router_schema_push
  # The failure is raised by the next task so its output can be shown redacted;
  # this one keeps no_log because its argv carries the database URL.
  failed_when: false
  changed_when: >-
    not ansible_check_mode
    and llm_router_schema_push.rc == 0
    and 'No pending migrations to apply' not in llm_router_schema_push.stdout
  no_log: true
  notify: Restart litellm

- name: Stop on a failed schema push, showing the redacted output
  ansible.builtin.include_tasks: fail-schema-push.yml
  vars:
    failed_step: prisma migrate deploy
    failed_result: "{{ llm_router_schema_push }}"
  when:
    - not ansible_check_mode
    - llm_router_schema_push.rc != 0

- name: Reconcile the Lens tables the push created ahead of the rename migration
  ansible.builtin.include_tasks: lens-rename-repair.yml
