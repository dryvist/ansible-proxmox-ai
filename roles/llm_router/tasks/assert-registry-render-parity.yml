---
# Registry <-> rendered model_list parity, checked in BOTH directions.
#
# The existing asserts all check the registry against ITSELF — an alias points
# at a servable entry, a fallback target is in the servable set. None of them
# compares the registry to what the template actually renders, so a projection
# that silently drops an entry, or renders one nothing backs, passes every
# check and ships.
#
# Two real failures on 2026-08-15 are the same defect mirrored:
#   ADVERTISED BUT DEAD — seven large-tier entries were enabled and offered by
#   the router while the serving host returned 404 for every one. A caller got
#   no answer rather than a degraded one. Fixed by disabling the seven, which
#   does nothing to stop it recurring.
#   ALIVE BUT UNADVERTISED — an entry enabled in the registry, absent from the
#   router's running model list. Anything nominally failing over to it was
#   failing over to something the router does not serve.
#
# This renders the REAL template and diffs it, rather than recomputing the
# expected set from the tier lists. Recomputing would re-implement the
# template's own logic, so a template bug — the most likely source of exactly
# this drift — would agree with itself and pass.
#
# WHAT THIS DOES NOT DO: it does not probe the serving host. It proves the
# registry and the config agree, not that a backend answers. Adding a live
# probe would have caught the seven 404 entries at converge time and is the
# stronger version of this check, but it coples the converge to serving-host
# reachability; do that deliberately, not as a drive-by.

- name: Render the real proxy config so the registry can be diffed against it
  ansible.builtin.set_fact:
    _llm_router_parity_config: >-
      {{ lookup('template', _llm_router_parity_template) | from_yaml }}
  vars:
    # An explicit path, not the bare 'config.yaml.j2' a role-relative lookup
    # would take: a test importing this file directly is not inside the role,
    # so the bare name resolves nowhere and the guard dies before it checks
    # anything. role_path is set during a real converge; _role_dir is what the
    # tests/llm_router playbooks already define for exactly this purpose.
    _llm_router_parity_template: >-
      {{ (role_path | default(_role_dir, true)) }}/templates/config.yaml.j2

- name: Assert the registry and the rendered model_list agree in both directions
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_enabled_unrendered | length == 0
      - _llm_router_switched_off_rendered | length == 0
      - _llm_router_rendered_unregistered | length == 0
      - _llm_router_cloud_fallback_missing_router | length == 0
      - _llm_router_narrow_preferred | length == 0
      - _llm_router_partial_window_groups | length == 0
    fail_msg: >-
      Registry and rendered model_list disagree.
      {% if _llm_router_partial_window_groups | length > 0 %}
      WINDOW ADVERTISED BY SOME MEMBERS ONLY:
      {{ _llm_router_partial_window_groups | join(', ') }} — these model_names
      carry deployments where at least one advertises max_input_tokens and at
      least one does not. A deployment with no window resolves it to null, which
      exempts it from enable_pre_call_checks entirely: an over-long request its
      advertising siblings would have refused is handed to it instead and
      answered from a silently truncated prompt. Give every member its own real
      window, or none of them one.
      {% endif %}
      {% if _llm_router_narrow_preferred | length > 0 %}
      NARROW DEPLOYMENT PREFERRED: {{ _llm_router_narrow_preferred | join(', ') }}
      — these model_names carry more than one deployment, and the one LiteLLM
      picks first (lower `order`) advertises a SMALLER max_input_tokens than a
      sibling it outranks. Order filtering keeps the lowest order still healthy,
      so every request to that name — including a long-context one a wider
      sibling could have served — lands on the narrow deployment and is refused
      or truncated. Give the preferred deployment its sibling's real window, or
      give it a distinct model_name so the two stop sharing a model group.
      {% endif %}
      {% if _llm_router_enabled_unrendered | length > 0 %}
      ENABLED BUT NOT RENDERED: {{ _llm_router_enabled_unrendered | join(', ') }}
      — the registry advertises these but the template renders no deployment,
      so a caller (or a fallback target) naming one reaches nothing.
      {% endif %}
      {% if _llm_router_switched_off_rendered | length > 0 %}
      SWITCHED OFF BUT RENDERED: {{ _llm_router_switched_off_rendered | join(', ') }}
      — llm_router_llm_vllm_enabled is false, yet the config still serves
      names only that tier owns, so the switch does not hold.
      {% endif %}
      {% if _llm_router_cloud_fallback_missing_router | length > 0 %}
      CLOUD FALLBACK NOT RENDERED:
      {{ _llm_router_cloud_fallback_missing_router | join(', ') }}.
      {% endif %}
      {% if _llm_router_rendered_unregistered | length > 0 %}
      RENDERED BUT NOT REGISTERED: {{ _llm_router_rendered_unregistered | join(', ') }}
      — the config serves these under a name no enabled registry entry owns, so
      their config drifts from the registry every time a model changes.
      {% endif %}
      Fix the registry entry or the template projection; do not silence this by
      adding a name to the exemptions below.
    success_msg: >-
      Registry and rendered model_list agree both ways
      ({{ _llm_router_rendered_names | length }} rendered,
      {{ _llm_router_parity_expected | length }} expected).
  vars:
    # Deduplicated: the light tier deliberately renders a CPU and a GPU
    # deployment under ONE model_name, so a raw map would double-count it.
    _llm_router_rendered_names: >-
      {{ _llm_router_parity_config.model_list | default([])
         | map(attribute='model_name') | unique | list }}
    # The provider-key-gated tiers are exempt from enabled-but-unrendered,
    # and this is by design, not an oversight. Those entries are key-gated:
    # config.yaml.j2 renders one only when its provider key is seeded, and
    # "an unseeded model renders no entry at all" is the documented behaviour
    # of the egress allowlist and Hermes cloud path. Without this exemption the
    # check fires false positives on a correct keyless config — and an assert
    # that cries wolf gets disabled, which
    # would cost more than the drift it was added to catch. The other
    # direction below still covers OpenRouter fully: anything rendered under a
    # name no enabled entry owns still fails.
    #
    # VLLM deployments require both the explicit switch and a successful
    # registry-driven /models precheck. Route groups with another active member
    # remain expected when this backend is held out.
    _llm_router_switched_off_names: >-
      {%- set _all = llm_router_registry_enabled | list -%}
      {%- set _held = _all | selectattr('tier', 'in', ['vllm', 'hermes-local'])
           | selectattr('route_group', 'defined') | list -%}
      {%- set _held_names = _held | map(attribute='route_group') | unique | list -%}
      {%- set _other_names = (_all | rejectattr('tier', 'in', ['vllm', 'hermes-local'])
           | selectattr('route_group', 'defined')
           | map(attribute='route_group') | list
           + llm_router_registry_enabled_additional_route_names) | unique | list -%}
      {{ (_held_names | difference(_other_names))
         if (not (llm_router_llm_vllm_enabled | bool)
              or not (llm_router_vllm_precheck_passed | default(false) | bool))
         else [] }}
    _llm_router_parity_expected: >-
      {%- set _entries = llm_router_registry_enabled
           | rejectattr('tier', 'in', ['openrouter', 'opencode', 'hermes-cloud'])
           | selectattr('route_group', 'defined') | list -%}
      {%- set _names = (_entries | map(attribute='route_group') | list
            + llm_router_registry_enabled_additional_route_names) | unique | list -%}
      {{ _names | difference(_llm_router_switched_off_names) | list }}
    _llm_router_enabled_unrendered: >-
      {{ _llm_router_parity_expected | difference(_llm_router_rendered_names) }}
    _llm_router_switched_off_rendered: >-
      {{ _llm_router_switched_off_names | intersect(_llm_router_rendered_names) }}
    # A model_name containing "*" is a wildcard PATTERN, not a model — the
    # LARGE-tier bare "*" passthrough is a pattern, exempt by construction rather
    # than by listing each literal name (a literal list is exactly what silently
    # misses the next wildcard someone adds). Every OTHER rendered name must
    # still be owned by an enabled registry entry, including the OpenRouter
    # allowlisted ones.
    #
    # Hermes agents (defaults/main/36-hermes-agents.yml) are the third
    # legitimate exemption: deliberately tag-derived from the published tofu
    # inventory, not hand-listed in llm-models.d/, so a new agent needs no
    # registry edit. Exempt by construction (the same dict the template
    # iterates), not by name, so this stays correct as agents come and go.
    _llm_router_rendered_unregistered: >-
      {{ _llm_router_rendered_names
         | difference(llm_router_registry_enabled_route_names)
         | difference(llm_router_hermes_agents.keys() | list)
         | reject('search', '\*') | list }}
    _llm_router_cloud_fallback_missing_router: >-
      {{ llm_router_hermes_cloud_fallback_groups
         | difference(_llm_router_rendered_names) }}
    # Several model_names deliberately carry more than one deployment, so this
    # walks the RENDERED list rather than _llm_router_rendered_names above,
    # which is `| unique` precisely to hide those pairs from the name diff.
    #
    # The invariant is NOT "same name, same window" — that is stricter than the
    # hazard and forbids a legitimate shape this repo already relies on. The
    # budgeted groups pair a wide paid member with a narrower LOCAL SURVIVOR,
    # and that is correct because the survivor is the LESS preferred member: it
    # is reached only once the paid one is filtered out by budget.
    #
    # A narrow member may rank first only while enable_pre_call_checks filters
    # deployments by their own max_input_tokens. Without that guard, the lower
    # order captures requests that only a wider sibling can serve.
    #
    # Sentinels make the absent cases compare honestly. A deployment with no
    # max_input_tokens advertises nothing (0), so a preferred member that
    # advertises nothing while its sibling does is a conflict — that is the
    # null-window failure in docs/LLM_MODELS_SCHEMA.md, not an exemption. A
    # deployment with no `order` carries no preference, so it sorts behind
    # every explicit one.
    #
    # The order comparison is <=, not <. Two same-named deployments at the SAME
    # order and different windows are not ranked against each other at all --
    # LiteLLM load-balances across both, so the narrow one takes a share of the
    # traffic and refuses whatever exceeds it. A strict comparison would let
    # that through, and `order` is a registry-settable field, so an entry given
    # a sibling tier's order value reaches it. A deployment never compares
    # against itself here: it would need a window strictly smaller than its
    # own.
    _llm_router_narrow_preferred: >-
      {%- set ns = namespace(bad=[]) -%}
      {%- set _ml = _llm_router_parity_config.model_list | default([]) -%}
      {%- set _prechecks = _llm_router_parity_config.router_settings.enable_pre_call_checks
           | default(false) | bool -%}
      {%- if not _prechecks -%}
      {%- for _name in _ml | map(attribute='model_name') | unique | list -%}
      {%- set _members = _ml | selectattr('model_name', 'equalto', _name) | list -%}
      {%- for _a in _members -%}
      {%- for _b in _members -%}
      {%- if (_a.model_info | default({})).get('max_input_tokens', 0) | int
             < (_b.model_info | default({})).get('max_input_tokens', 0) | int
         and (_a.litellm_params | default({})).get('order', 999999) | int
             <= (_b.litellm_params | default({})).get('order', 999999) | int -%}
      {%- set ns.bad = ns.bad + [_name] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- endif -%}
      {{ ns.bad | unique | list }}
    # The companion to the rule above, and the case it cannot see. A member
    # advertising NO window is not "narrow", it is unbounded: max_input_tokens
    # resolves to null and enable_pre_call_checks skips the deployment, so it
    # absorbs a request every advertising sibling would have refused. Ranking
    # it last does not help — being last is exactly when it gets the request.
    # Uniformly unadvertised is fine and stays fine (the light tier's CPU/GPU
    # pair carries no window on either member); MIXED is the defect.
    _llm_router_partial_window_groups: >-
      {%- set ns = namespace(bad=[]) -%}
      {%- set _ml = _llm_router_parity_config.model_list | default([]) -%}
      {%- for _name in _ml | map(attribute='model_name') | unique | list -%}
      {%- set _members = _ml | selectattr('model_name', 'equalto', _name) | list -%}
      {%- set _counter = namespace(advertised=0) -%}
      {%- for _d in _members -%}
      {%- if (_d.model_info | default({})).get('max_input_tokens') is not none -%}
      {%- set _counter.advertised = _counter.advertised + 1 -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if _counter.advertised > 0 and _counter.advertised < (_members | length) -%}
      {%- set ns.bad = ns.bad + [_name] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.bad }}
