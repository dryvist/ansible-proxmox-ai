---
# Budget/store coupling contract. Its own file so a test can import exactly this
# assert and prove the failure path, rather than restating its condition where
# the two could drift apart. Imported by assert.yml.

- name: Assert a rendered spend budget is backed by a shared store
  ansible.builtin.assert:
    quiet: true
    that:
      # A budget may exist only when a store does. The reverse is fine: a store
      # with no budget is merely unused, not dishonest.
      - not (llm_router_openrouter_budget_limit | default(0) | float > 0)
        or (llm_router_redis_host | default('') | trim | length > 0)
      - not _llm_router_any_deployment_budget
        or (llm_router_redis_host | default('') | trim | length > 0)
    fail_msg: >-
      Provider or deployment spend budget configured with no shared store
      (roles/llm_router/tasks/assert-budget-backing.yml).
      llm_router_openrouter_budget_limit is
      {{ llm_router_openrouter_budget_limit | default(0) }} but
      llm_router_redis_host is empty.
      Budgeted deployments={{ _llm_router_budgeted_groups }}.
      LiteLLM tracks provider and deployment spend in Redis. llm_router_group is a multi-member
      pool converged serial: 1, so with no shared store each member counts only
      its OWN spend: the rendered config would advertise a ceiling that is
      really N times the number written, and every rolling converge would reset
      it. An operator reading that config would believe in a limit that does not
      hold — which is worse than reading no limit at all, and is exactly why the
      earlier unbacked budget was backed out rather than left in.
      Either set llm_router_redis_host (roles/redis) or leave the budget at 0.
    success_msg: >-
      {{ 'Every rendered provider or deployment budget is backed by a shared store.'
         if ((llm_router_openrouter_budget_limit | default(0) | float > 0)
             or _llm_router_any_deployment_budget)
         else 'No spend budget configured; nothing to back.' }}
  vars:
    # Gated on an actual monthly_budget being declared, NOT on any cloud
    # fallback group existing — hermes-cloud-free deliberately has no budget
    # (a free preset has no spend to bound), and the local (hermes-local) tier
    # never carries one either, so neither should force a Redis requirement.
    # default([]) guards a test that imports this file standalone, without
    # ever loading the model registry (test_budget_requires_store.yml) — an
    # ungraceful undefined here breaks fail_msg/success_msg rendering even
    # when the that: clause itself would have passed.
    _llm_router_budgeted_groups: >-
      {{ (llm_router_hermes_cloud_models_credentialed | default([]))
         | selectattr('monthly_budget', 'defined') | map(attribute='route_group') | list }}
    _llm_router_any_deployment_budget: "{{ _llm_router_budgeted_groups | length > 0 }}"

# Per-KEY budgets are a different backing store than provider/deployment
# budgets above: LiteLLM persists a key's spend and max_budget in its own
# Postgres row, not Redis, so a key budget's honesty condition is the router
# database rather than the shared cache. Same shape: reconcile-key-budgets.yml
# is what actually pushes the value, but it is gated on this same
# llm_router_db_host check in main.yml — this assert exists so a config that
# somehow declares a monthly_budget on a virtual key with no database fails
# loudly here too, rather than only via that task silently never running.
- name: Assert a rendered key budget is backed by the router database
  ansible.builtin.assert:
    quiet: true
    that:
      - not _llm_router_any_key_budget
        or (llm_router_db_host | default('') | trim | length > 0)
    fail_msg: >-
      A virtual key declares monthly_budget with no router database configured
      (roles/llm_router/tasks/assert-budget-backing.yml).
      Budgeted key aliases={{ _llm_router_budgeted_key_aliases }}.
      LiteLLM tracks key spend and max_budget in its own database, not Redis;
      with llm_router_db_host empty, seed-keys.yml/reconcile-key-budgets.yml
      never run (main.yml gates both on it), so the budget declared here is
      never actually sent to the proxy. Set llm_router_db_host (roles/postgres)
      or drop monthly_budget from the affected key(s).
    success_msg: >-
      {{ 'Every rendered key budget is backed by the router database.'
         if _llm_router_any_key_budget
         else 'No key budget configured; nothing to back.' }}
  vars:
    # `| float > 0`, never `equalto(0)` — the same numeric coercion
    # seed-keys.yml's own body already uses. A YAML string re-quoting of a
    # Jinja reference (`"{{ _llm_router_key_monthly_budget }}"`, the
    # workstation entries in 56-virtual-keys.yml) can fold that value to the
    # STRING '0' rather than the int/float 0, and `equalto(0)` never matches
    # a string against a number — every such key would then count as
    # budgeted even with no database, defeating this very assert.
    _llm_router_budgeted_key_aliases: >-
      {%- set _out = [] -%}
      {%- for _k in (llm_router_virtual_keys | default([])) -%}
      {%- if (_k.monthly_budget | default(0) | float) > 0 -%}
      {%- set _discard = _out.append(_k.alias) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ _out }}
    _llm_router_any_key_budget: "{{ _llm_router_budgeted_key_aliases | length > 0 }}"

# A key budget at or above the provider's own weekly ceiling defeats the
# reason a per-key cap exists at all: one caller could then drain the whole
# provider budget by itself, which is exactly what per-key budgets are meant
# to prevent. Both are the same 7d period (roles/llm_router/defaults/main/
# 56-virtual-keys.yml), so a plain numeric compare is enough — no separate
# duration check needed.
- name: Assert every key budget sits below the provider's weekly ceiling
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_oversized_key_budgets | length == 0
    fail_msg: >-
      A virtual key's monthly_budget is not below the provider's own weekly
      ceiling (roles/llm_router/tasks/assert-budget-backing.yml).
      Oversized keys={{ _llm_router_oversized_key_budgets }},
      llm_router_openrouter_budget_limit={{ llm_router_openrouter_budget_limit | default(0) }}.
      A key allowed to spend the whole provider ceiling by itself defeats the
      reason per-key budgets exist. Lower the key's monthly_budget in
      56-virtual-keys.yml.
    success_msg: "Every key budget is strictly below the provider's weekly ceiling."
  vars:
    # Same `| float` coercion as _llm_router_budgeted_key_aliases above, for
    # the same reason — a stringified '0' would otherwise be excluded from
    # neither this list nor that one by an equalto/numeric-comparison test.
    _llm_router_oversized_key_budgets: >-
      {%- set _ceiling = llm_router_openrouter_budget_limit | default(0) | float -%}
      {%- set _out = [] -%}
      {%- for _k in (llm_router_virtual_keys | default([])) -%}
      {%- set _budget = _k.monthly_budget | default(0) | float -%}
      {%- if _budget > 0 and _budget >= _ceiling -%}
      {%- set _discard = _out.append(_k.alias) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ _out }}

# Naming a host is not reaching it. roles/redis makes AUTH mandatory and has no
# passwordless branch, so an empty password here does not degrade to an
# unauthenticated connection that happens to work — every LiteLLM call to the
# store is refused. And it is refused SILENTLY: spend reads fall back through
# the DualCache to per-member in-memory counting, which is the exact dishonest
# ceiling the host check above exists to prevent, arrived at by a different
# route. The host leg alone would pass this configuration.
- name: Assert the shared store backing a budget is actually reachable
  ansible.builtin.assert:
    quiet: true
    that:
      - not (llm_router_openrouter_budget_limit | default(0) | float > 0)
        or (llm_router_redis_password | default('') | trim | length > 0)
      - not _llm_router_any_deployment_budget
        or (llm_router_redis_password | default('') | trim | length > 0)
    fail_msg: >-
      Provider or deployment spend budget configured with no store credential
      (roles/llm_router/tasks/assert-budget-backing.yml).
      llm_router_openrouter_budget_limit is
      {{ llm_router_openrouter_budget_limit | default(0) }} against host
      '{{ llm_router_redis_host | default('') }}', but
      llm_router_redis_password is empty — neither the OpenBao field
      secret/ai/llm-router LLM_ROUTER_REDIS_PASSWORD nor the
      LLM_ROUTER_REDIS_PASSWORD env fallback resolved. roles/redis requires
      AUTH, so every spend read and write would be refused and the ceiling
      would silently degrade to per-member counting.
    success_msg: >-
      {{ 'Store credential present, so the ceiling is enforceable.'
         if ((llm_router_openrouter_budget_limit | default(0) | float > 0)
             or _llm_router_any_deployment_budget)
         else 'No spend budget configured; no credential needed.' }}
  vars:
    # default([]) guards a test that imports this file standalone, without
    # ever loading the model registry (test_budget_requires_store.yml) — an
    # ungraceful undefined here breaks fail_msg/success_msg rendering even
    # when the that: clause itself would have passed.
    _llm_router_budgeted_groups: >-
      {{ (llm_router_hermes_cloud_models_credentialed | default([]))
         | selectattr('monthly_budget', 'defined') | map(attribute='route_group') | list }}
    _llm_router_any_deployment_budget: "{{ _llm_router_budgeted_groups | length > 0 }}"
