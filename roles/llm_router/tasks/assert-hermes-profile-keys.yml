---
# Guards the virtual-key seeding below against an empty hermes_agent_profiles
# resolving on this host.
- name: Assert the Hermes profile list actually resolved (not silently empty)
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_agent_profiles | default([]) | length > 0
    fail_msg: >-
      hermes_agent_profiles is empty on this host; the llm_router play must
      load it before seeding virtual keys.
    success_msg: >-
      hermes_agent_profiles resolved with
      {{ hermes_agent_profiles | default([]) | length }} named profile(s).
