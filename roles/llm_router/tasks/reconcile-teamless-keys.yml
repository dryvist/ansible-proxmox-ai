---
- name: Narrow incompatible teamless grants before changing teams
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/update"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    body_format: json
    body:
      key: "{{ item.token }}"
      models: "{{ _default_team_models }}"
    status_code: [200, 201]
    timeout: "{{ llm_router_seed_request_timeout }}"
  loop: "{{ llm_router_existing_keys.json['keys'] | default([]) }}"
  loop_control:
    label: teamless key
  when:
    - not (item.team_id | default(none, true))
    - item.models | default([], true) | difference(_default_team_models) | length > 0
  vars:
    _default_team_models: >-
      {{ (llm_router_default_team_settings
          | selectattr('team_id', 'equalto', llm_router_default_team_id) | first).models }}
  no_log: true

- name: Assign existing teamless keys to the ZDR-only default team
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/update"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    body_format: json
    body:
      key: "{{ item.token }}"
      team_id: "{{ llm_router_default_team_id }}"
    status_code: [200, 201]
    timeout: "{{ llm_router_seed_request_timeout }}"
  loop: "{{ llm_router_existing_keys.json['keys'] | default([]) }}"
  loop_control:
    label: teamless key
  when:
    - not (item.team_id | default(none, true))
    # Seeded callers receive their declared priority team in the shared reconcile.
    - item.key_alias | default('') not in _managed_aliases
  vars:
    _managed_aliases: >-
      {{ llm_router_virtual_keys | rejectattr('value', 'equalto', '') | map(attribute='alias') | list }}
  no_log: true
