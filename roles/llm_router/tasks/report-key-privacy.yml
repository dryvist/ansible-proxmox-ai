---
- name: Identify live nonpublic keys with free or retaining grants
  ansible.builtin.set_fact:
    _llm_router_nonpublic_key_grants: "{{ lookup('template', llm_router_privacy_grants_template) }}"
  vars:
    _llm_router_privacy_records: "{{ llm_router_existing_keys.json['keys'] | default([]) }}"
  no_log: true

- name: Warn about each live key requiring public opt-in
  ansible.builtin.debug:
    msg: >-
      WARNING: key {{ item.alias }} grants {{ item.grants | join(', ') }} without privacy class public.
      Report only; no key was changed by this audit.
  loop: "{{ _llm_router_nonpublic_key_grants }}"
  loop_control:
    label: "{{ item.alias }}"
