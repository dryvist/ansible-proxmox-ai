---
- name: Classify the Pro6000 model-listing probe
  ansible.builtin.set_fact:
    _llm_router_gpu_probe:
      state: >-
        {{ 'not_deployed' if llm_router_gpu_models | default([]) | length == 0
           else ('verified'
                 if ((_llm_router_gpu_models_response | default({}, true)).status
                     | default(0) | int) == 200
                 else ('rejected'
                       if ((_llm_router_gpu_models_response | default({}, true)).status
                           | default(0) | int) in [401, 403]
                       else ('not_found'
                             if ((_llm_router_gpu_models_response | default({}, true)).status
                                 | default(0) | int) == 404
                             else 'unreachable'))) }}
      status: "{{ (_llm_router_gpu_models_response | default({}, true)).status | default(0) | int }}"
      ids: >-
        {{ ((_llm_router_gpu_models_response | default({}, true)).json | default({}, true)).get('data', [])
           | map(attribute='id') | list }}
