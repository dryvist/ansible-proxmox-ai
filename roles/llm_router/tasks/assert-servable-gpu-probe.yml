---
- name: Classify the GPU serving endpoint probes
  ansible.builtin.set_fact:
    _llm_router_gpu_probe:
      state: >-
        {{ 'not_deployed'
           if llm_router_gpu_models | default([]) | length == 0
           else ('verified'
                 if _llm_router_gpu_probe_statuses | reject('equalto', 200) | list | length == 0
                 else ('rejected'
                       if _llm_router_gpu_probe_statuses | intersect([401, 403]) | length > 0
                       else ('not_found' if 404 in _llm_router_gpu_probe_statuses else 'unreachable'))) }}
      status: "{{ _llm_router_gpu_probe_statuses | reject('equalto', 200) | list | first | default(200) }}"
      ids: >-
        {%- set ns = namespace(ids=[]) -%}
        {%- for response in _llm_router_gpu_probe_responses.results | default([]) -%}
        {%- if response.status | default(0) | int == 200 -%}
        {%- set ns.ids = ns.ids + (response.json | default({}, true)).get('data', []) | map(attribute='id') | list -%}
        {%- endif -%}
        {%- endfor -%}
        {{ ns.ids | unique | list }}
  vars:
    _llm_router_gpu_probe_statuses: >-
      {{ _llm_router_gpu_probe_responses.results | default([])
         | map(attribute='status') | map('default', 0) | map('int') | list }}
