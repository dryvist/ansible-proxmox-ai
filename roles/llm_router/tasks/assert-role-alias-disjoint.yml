---
- name: Assert database role and model-group alias names are disjoint
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_role_alias_overlap | length == 0
    fail_msg: >-
      Database role name(s) {{ _llm_router_role_alias_overlap | join(', ') }}
      also appear as model-group aliases. Keep DB roles and registry aliases
      disjoint so the alias retirement task cannot delete a seeded role.
    success_msg: >-
      The {{ _llm_router_role_names | length }} database roles and
      {{ _llm_router_alias_names | length }} model-group aliases are disjoint.
  vars:
    _llm_router_role_names: >-
      {{ llm_router_role_deployments | map(attribute='role') | unique | list }}
    _llm_router_alias_names: "{{ llm_router_model_group_aliases | list }}"
    _llm_router_role_alias_overlap: >-
      {{ _llm_router_role_names | intersect(_llm_router_alias_names) | list }}
