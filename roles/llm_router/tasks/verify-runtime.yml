---
# Type=simple reports 'active' the instant the process forks; poll until it settles
# so a proxy that crashes a moment later fails loud here (mirrors roles/agent_exec).
- name: Verify the litellm service is active
  ansible.builtin.systemd:
    name: "{{ llm_router_service }}"
  register: llm_router_service_state
  until: llm_router_service_state.status.ActiveState | default('') == 'active'
  retries: 5
  delay: 3

# This task is the last one in the role, so a host that trips it fails the
# play, and a failed host ends the run for every host behind it in the batch —
# "NO MORE HOSTS LEFT". On 2026-07-30 that left a third router still serving
# the previous config while the first two had moved on, i.e. the fleet
# silently disagreed with itself about which models the aliases resolve to.
# A slow start read as a broken one, and the cost was charged to a host that
# was never touched. See verify-liveness.yml for the check itself — imported
# here and from handlers/main.yml, one declaration, not a copy.
- name: Verify the LiteLLM liveness endpoint answers
  ansible.builtin.import_tasks: verify-liveness.yml

# Liveness alone is not the proof: the listener is up before the config is
# loaded, and a config the proxy cannot load leaves /v1/models empty or the
# process in a crash loop that the systemd poll above can miss between
# restarts. A non-empty authenticated model list is what proves THIS member
# serves the rendered config, and it is the gate the rolling play waits on.
- name: Verify this member serves the rendered model list
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/v1/models"
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    status_code: 200
    return_content: true
    timeout: 2
  register: llm_router_models_probe
  # Read-only; a check run needs the live value to preview served models.
  check_mode: false
  until:
    - llm_router_models_probe.status | default(0) == 200
    - (llm_router_models_probe.json.data | default([])) | length > 0
  # Liveness has already established that the listener is accepting requests;
  # 10 two-second attempts with six-second gaps cap this proof at 74 seconds.
  retries: 10
  delay: "{{ llm_router_liveness_delay }}"
  no_log: true

- name: Verify the rendered MCP server tool lists
  ansible.builtin.import_tasks: verify-mcp-tools.yml

- name: Read this router's model cost map source status
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/model/cost_map/source"
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    status_code: 200
    timeout: "{{ llm_router_seed_request_timeout }}"
  register: llm_router_model_cost_map_source_status
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Report this router's model cost map source status
  ansible.builtin.debug:
    msg:
      source: "{{ llm_router_model_cost_map_source_status.json.source | default('absent') }}"
      url: "{{ llm_router_model_cost_map_source_status.json.url | default('absent') }}"
      fallback_reason: "{{ llm_router_model_cost_map_source_status.json.fallback_reason | default('absent') }}"
      loaded_at: "{{ llm_router_model_cost_map_source_status.json.loaded_at | default('absent') }}"
      source_revision: "{{ llm_router_model_cost_map_source_status.json.source_revision | default('absent') }}"
      etag: "{{ llm_router_model_cost_map_source_status.json.etag | default('absent') }}"
      model_count: "{{ llm_router_model_cost_map_source_status.json.model_count | default('absent') }}"

- name: Read this router's running LiteLLM version
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}{{ llm_router_readiness_path }}/details"
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    status_code: 200
    timeout: "{{ llm_router_seed_request_timeout }}"
  register: llm_router_running_litellm_version_status
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Report this router's running LiteLLM version
  ansible.builtin.debug:
    msg:
      running_litellm_version: >-
        {{ llm_router_running_litellm_version_status.json.litellm_version
        | default('absent') }}
      pinned_litellm_version: >-
        {{ llm_router_pip_packages
        | select('match', '^litellm.proxy.==')
        | first | split('==') | last }}

- name: Read this router's model info rows
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/model/info"
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    status_code: 200
    timeout: "{{ llm_router_seed_request_timeout }}"
  register: llm_router_model_info_status
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Report this router's model rows by provider and price
  ansible.builtin.debug:
    msg:
      model_rows: >-
        {{ 'absent' if llm_router_model_info_status.json.data is not defined
           or llm_router_model_info_status.json.data | length == 0
           else llm_router_model_info_status.json.data | length | string }}
      hosted_vllm_provider_rows: >-
        {{ 'absent' if llm_router_model_info_status.json.data is not defined
           or llm_router_model_info_status.json.data | length == 0
           else llm_router_model_info_status.json.data
           | map(attribute='model_info.litellm_provider', default='')
           | select('equalto', 'hosted_vllm') | list | length | string }}
      hosted_vllm_prefix_rows: >-
        {{ 'absent' if llm_router_model_info_status.json.data is not defined
           or llm_router_model_info_status.json.data | length == 0
           else llm_router_model_info_status.json.data
           | map(attribute='litellm_params.model', default='')
           | select('match', '^hosted_vllm/') | list | length | string }}
      priced_rows: >-
        {{ 'absent' if llm_router_model_info_status.json.data is not defined
           or llm_router_model_info_status.json.data | length == 0
           else llm_router_model_info_status.json.data
           | map(attribute='model_info.input_cost_per_token', default=0)
           | select('number') | select('gt', 0) | list | length | string }}
      hermes_cloud_rows: >-
        {{ 'absent' if llm_router_model_info_status.json.data is not defined
           or llm_router_model_info_status.json.data | length == 0
           else llm_router_model_info_status.json.data
           | selectattr('model_name', 'in', llm_router_hermes_cloud_models_credentialed
           | map(attribute='route_group') | list) | list | length | string }}
      hermes_cloud_priced_rows: >-
        {{ 'absent' if llm_router_model_info_status.json.data is not defined
           or llm_router_model_info_status.json.data | length == 0
           else llm_router_model_info_status.json.data
           | selectattr('model_name', 'in', llm_router_hermes_cloud_models_credentialed
           | map(attribute='route_group') | list)
           | map(attribute='model_info.input_cost_per_token', default=0)
           | select('number') | select('gt', 0) | list | length | string }}

# Virtual keys, their budgets, and caller-facing roles (seed-consumers.yml)
# are NOT imported here: they write to the pool's SHARED database, so
# running them once per serial:1 member repeated the same writes three
# times. playbooks/llm-serving.yml runs seed-consumers.yml as its own
# run_once play over the whole pool, right after this rolling converge —
# same reason the journal forwarding route (10-llm-router-syslog.yml) is not
# imported here either: a failure in either one never stops the rollout.
