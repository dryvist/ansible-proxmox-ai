---
# Prepare the Git-owned router_settings payload. In `initial` mode with an
# existing row, this payload contains only `fallbacks`; a first seed or
# `rebuild` carries the full rendered settings. The request runs after runtime
# verification on every converge, even when this marker is unchanged.
#
# store_model_in_db gates config reconciliation for EVERY config section, not
# just models. It must stay true for role deployments, so the persisted
# router_settings row cannot shadow this file at startup.
#
# /config/update merges per key and the request wins. This sends only the fields
# Git owns for this seed mode, leaves the credential untouched, and sets the
# retired routing_groups key to an explicit empty list on full seeds.

- name: Read the rendered proxy config back for its router_settings
  ansible.builtin.slurp:
    src: "{{ llm_router_config_file }}"
  register: llm_router_rendered_config

- name: Record the router_settings the database should hold
  ansible.builtin.copy:
    content: "{{ _llm_router_settings_payload | to_nice_json }}\n"
    dest: "{{ llm_router_config_dir }}/.router-settings-synced.json"
    owner: root
    group: root
    mode: "0644"
  register: llm_router_settings_sync_marker
  notify:
    - Restart litellm
    - Wait for LiteLLM liveness before syncing settings
    - Sync router settings into the database
