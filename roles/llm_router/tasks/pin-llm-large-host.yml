---
# Extracted from main.yml (Vikunja token-limit split): resolves and pins the
# heavy-tier serving apex so LiteLLM reaches it without depending on its own
# DNS path. Self-contained (resolve -> assert -> pin), imported by main.yml.

- name: Resolve the heavy-tier serving apex IP for LiteLLM host pinning
  # Preference order: the published reservation (tofu constants.serving.ip, or
  # the env override) first, controller-side DNS second. DNS stays as a fallback
  # rather than being removed with the literal, because it is a real resolution
  # of the same reservation — the record is generated from the same value — and
  # not a guess. The hostname has no such second authority, which is why its
  # assert in assert.yml is fatal and this one is not.
  ansible.builtin.set_fact:
    llm_router_llm_large_ip: >-
      {{
        llm_large_serving_ip
        | default(lookup('pipe', 'dig +short ' ~ llm_router_llm_large_fqdn ~ ' | head -n1'), true)
        | trim
      }}

- name: Assert the Mac Studio apex resolved for LiteLLM host pinning
  ansible.builtin.assert:
    that:
      - llm_router_llm_large_ip | length > 0
    fail_msg: >-
      Could not resolve {{ llm_router_llm_large_fqdn }} to an IPv4 address for
      the LiteLLM /etc/hosts pin.

- name: Read /etc/hosts for the LiteLLM serving-host pin
  ansible.builtin.slurp:
    src: "{{ llm_router_hosts_file | default('/etc/hosts') }}"
  register: _llm_router_hosts_current
  # Only a missing file reads as empty; any other read error stops the pin
  # before it could replace the file with the pin line alone.
  failed_when: >-
    _llm_router_hosts_current.failed | default(false)
    and 'not found' not in (_llm_router_hosts_current.msg | default('') | lower)

# Keep the first line that already maps the current IP exactly as it is, drop
# the serving name from every other line (a line left with no name goes), and
# add the pin only when no current line was kept. Comments are never changed.
# copy writes only on a difference, so a correct pin never restarts LiteLLM.
- name: Pin the Mac Studio apex in /etc/hosts for LiteLLM
  # Keep a local resolver pin here so the router hosts do not depend on their
  # own DNS path before they can reach the gate.
  ansible.builtin.copy:
    dest: "{{ llm_router_hosts_file | default('/etc/hosts') }}"
    owner: "{{ 'root' if (llm_router_hosts_file | default('/etc/hosts')) == '/etc/hosts' else omit }}"
    group: "{{ 'root' if (llm_router_hosts_file | default('/etc/hosts')) == '/etc/hosts' else omit }}"
    mode: "{{ '0644' if (llm_router_hosts_file | default('/etc/hosts')) == '/etc/hosts' else omit }}"
    content: |-
      {% set ns = namespace(lines=[], kept=false) %}
      {% for line in (_llm_router_hosts_current.content | default('') | b64decode).splitlines() %}
      {%   set body = line.split('#', 1)[0] %}
      {%   set fields = body.split() %}
      {%   if fields | length < 2 or llm_router_llm_large_fqdn not in fields[1:] %}
      {%     set ns.lines = ns.lines + [line] %}
      {%   elif fields[0] == llm_router_llm_large_ip and not ns.kept %}
      {%     set ns.lines = ns.lines + [line] %}
      {%     set ns.kept = true %}
      {%   else %}
      {%     set names = fields[1:] | reject('equalto', llm_router_llm_large_fqdn) | list %}
      {%     set comment = line[body | length:] %}
      {%     if names %}
      {%       set ns.lines = ns.lines + [([fields[0]] + names) | join(' ') ~ ((' ' ~ comment) if comment else '')] %}
      {%     endif %}
      {%   endif %}
      {% endfor %}
      {% if not ns.kept %}
      {%   set ns.lines = ns.lines + [llm_router_llm_large_ip ~ ' ' ~ llm_router_llm_large_fqdn] %}
      {% endif %}
      {% for out in ns.lines %}
      {{ out }}
      {% endfor %}
  notify: Restart litellm
