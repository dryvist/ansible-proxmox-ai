---
# The three consumer-seeding steps that talk to the live proxy this play just
# started: virtual keys, their budgets, and caller-facing roles. Split out of
# main.yml (a real seam, not three unrelated tasks bundled to fit a budget) —
# all three are "first-seed against a running database" work with the same
# gate, imported as one block right after the liveness check that proves the
# proxy is up to receive them.

# Load the registry here too, the way registry.yml says every consumer must:
# the key scopes and roles below are projections of it, and this file runs in
# its own play, so it cannot rely on facts the rolling converge left behind
# (that play may be skipped with --skip-tags llm_router_rolling).
- name: Load the fabric model registry for the seeding steps
  ansible.builtin.import_tasks: registry.yml

# Same reason: the subscription rung's presence feeds the model scopes below.
- name: Record whether this node holds the subscription-rung login
  ansible.builtin.import_tasks: chatgpt-auth.yml

# Virtual keys are database records too, and the same first-seed contract
# applies: create what is absent, never touch what exists. Before the roles
# below so a key is registered with the scope it will need by the time anything
# uses it; a consumer whose key value is not seeded yet renders empty and is
# skipped, making this a no-op until then.
- name: Seed the per-caller virtual keys that have a value
  ansible.builtin.import_tasks: seed-keys.yml
  when:
    - llm_router_db_host | length > 0
    - llm_router_store_model_in_db | bool

# The task file only returns existing keys when `seed_mode: rebuild`; in the
# default `initial` mode, new keys already receive their budget at creation.
- name: Resync budgets on virtual keys that declare one
  ansible.builtin.import_tasks: reconcile-key-budgets.yml
  when:
    - llm_router_db_host | length > 0
    - llm_router_store_model_in_db | bool

# Roles are stored in the database and administered in the UI, so this runs only
# where both exist, and only creates what is missing. It is LAST because it
# talks to the proxy this play just started — see the file for the first-seed
# contract that keeps a converge from undoing a UI edit.
- name: Seed the caller-facing roles the first time this proxy carries them
  ansible.builtin.import_tasks: seed-roles.yml
  when:
    - llm_router_db_host | length > 0
    - llm_router_store_model_in_db | bool

# A5: a name that used to be a DB-only role and is now a git-declared alias
# (`lead`) must never carry both at once — see the file for why this needs
# no flag. After seed-roles.yml so a role re-seeded this same converge is
# still caught if it collides with an alias.
- name: Retire any live model deployment shadowed by a declared alias
  ansible.builtin.import_tasks: retire-role-deployments.yml
  when:
    - llm_router_db_host | length > 0
    - llm_router_store_model_in_db | bool

# The schedule is stored in the shared database, so configure it once after
# the other consumer API writes in this run_once play.
- name: Schedule the LiteLLM model cost map reload
  ansible.builtin.import_tasks: price-map-reload.yml

# LiteLLM caps this listing at 100 aliases per page. Keep the first page
# visible and report when its pagination metadata says the listing is partial.
- name: Read the router's live key alias listing
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/aliases?page=1&size=100"
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    status_code: 200
    timeout: "{{ llm_router_seed_request_timeout }}"
  register: llm_router_key_aliases_status
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Report declared and live key aliases
  ansible.builtin.debug:
    msg:
      declared_key_aliases: >-
        {{ llm_router_virtual_keys | rejectattr('value', 'equalto', '')
           | map(attribute='alias') | list | length | string }}
      live_key_aliases: >-
        {{ 'absent' if llm_router_key_aliases_status.json.aliases is not defined
           or llm_router_key_aliases_status.json.aliases is not sequence
           or llm_router_key_aliases_status.json.aliases is string
           or llm_router_key_aliases_status.json.aliases is mapping
           or llm_router_key_aliases_status.json.aliases | select('string') | list | length
           != llm_router_key_aliases_status.json.aliases | length
           else llm_router_key_aliases_status.json.total_count | default('absent') | string }}
      live_undeclared_aliases: >-
        {{ 'absent' if llm_router_key_aliases_status.json.aliases is not defined
           or llm_router_key_aliases_status.json.aliases is not sequence
           or llm_router_key_aliases_status.json.aliases is string
           or llm_router_key_aliases_status.json.aliases is mapping
           or llm_router_key_aliases_status.json.aliases | select('string') | list | length
           != llm_router_key_aliases_status.json.aliases | length
           else (llm_router_key_aliases_status.json.aliases
           | difference(llm_router_virtual_keys | rejectattr('value', 'equalto', '')
           | map(attribute='alias') | list) | list) | to_json }}
      declared_missing_aliases: >-
        {{ 'absent' if llm_router_key_aliases_status.json.aliases is not defined
           or llm_router_key_aliases_status.json.aliases is not sequence
           or llm_router_key_aliases_status.json.aliases is string
           or llm_router_key_aliases_status.json.aliases is mapping
           or llm_router_key_aliases_status.json.aliases | select('string') | list | length
           != llm_router_key_aliases_status.json.aliases | length
           or llm_router_key_aliases_status.json.total_pages is not defined
           or llm_router_key_aliases_status.json.current_page is not defined
           or llm_router_key_aliases_status.json.total_pages | int
           > llm_router_key_aliases_status.json.current_page | int
           else (llm_router_virtual_keys | rejectattr('value', 'equalto', '')
           | map(attribute='alias') | list
           | difference(llm_router_key_aliases_status.json.aliases) | list | length | string) }}
      listing_truncated: >-
        {{ 'absent' if llm_router_key_aliases_status.json.total_pages is not defined
           or llm_router_key_aliases_status.json.current_page is not defined
           else 'true' if llm_router_key_aliases_status.json.total_pages | int
           > llm_router_key_aliases_status.json.current_page | int else 'false' }}
