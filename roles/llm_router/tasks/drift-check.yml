---
# Read-only inspection after the shared consumer-seeding play. The only POST
# below targets the existing alert webhook; no LiteLLM mutation endpoint is
# called here.
- name: Compare live router state with the rendered Git baseline
  when:
    - llm_router_db_host | default('', true) | length > 0
    - llm_router_store_model_in_db | default(false) | bool
  block:
    - name: Read the first page of live virtual keys
      ansible.builtin.uri:
        url: >-
          {{ 'http://127.0.0.1:' ~ llm_router_api_port ~ '/key/list?page=1'
             ~ '&size=' ~ llm_router_drift_key_page_size
             ~ '&return_full_object=true&include_team_keys=true&include_created_by_keys=true' }}
        method: GET
        headers:
          Authorization: "Bearer {{ llm_router_master_key }}"
        status_code: 200
        return_content: true
        timeout: "{{ llm_router_seed_request_timeout }}"
      register: _llm_router_drift_keys_page_1
      no_log: true

    - name: Read remaining virtual-key pages
      ansible.builtin.uri:
        url: >-
          {{ 'http://127.0.0.1:' ~ llm_router_api_port ~ '/key/list?page=' ~ item
             ~ '&size=' ~ llm_router_drift_key_page_size
             ~ '&return_full_object=true&include_team_keys=true&include_created_by_keys=true' }}
        method: GET
        headers:
          Authorization: "Bearer {{ llm_router_master_key }}"
        status_code: 200
        return_content: true
        timeout: "{{ llm_router_seed_request_timeout }}"
      loop: "{{ range(2, (_llm_router_drift_keys_page_1.json.total_pages | default(1) | int) + 1) | list }}"
      loop_control:
        label: "page {{ item }}"
      register: _llm_router_drift_key_pages
      when: (_llm_router_drift_keys_page_1.json.total_pages | default(1) | int) > 1
      no_log: true

    - name: Read live router settings
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ llm_router_api_port }}/router/settings"
        method: GET
        headers:
          Authorization: "Bearer {{ llm_router_master_key }}"
        status_code: 200
        return_content: true
        timeout: "{{ llm_router_seed_request_timeout }}"
      register: _llm_router_drift_router_settings
      no_log: true

    - name: Read live UI settings
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ llm_router_api_port }}/get/ui_settings"
        method: GET
        headers:
          Authorization: "Bearer {{ llm_router_master_key }}"
        status_code: 200
        return_content: true
        timeout: "{{ llm_router_seed_request_timeout }}"
      register: _llm_router_drift_ui_settings
      no_log: true

    - name: Read the rendered router config baseline
      ansible.builtin.slurp:
        src: "{{ llm_router_config_file }}"
      register: _llm_router_drift_rendered_config
      no_log: true

    - name: Keep only key aliases and policy flags from the live key records
      ansible.builtin.set_fact:
        _llm_router_drift_live_keys: >-
          {%- set ns = namespace(pages=[_llm_router_drift_keys_page_1.json], keys=[]) -%}
          {%- for page in (_llm_router_drift_key_pages.results | default([])) -%}
          {%- set ns.pages = ns.pages + [page.json] -%}
          {%- endfor -%}
          {%- for page in ns.pages -%}
          {%- for key in (page.keys | default([])) -%}
          {%- if key.key_alias is defined and key.key_alias is not none and (key.key_alias | string | length) > 0 -%}
          {%- set flags = {
            'models': key.models | default([], true),
            'allowed_routes': key.allowed_routes | default([], true),
            'max_budget': key.max_budget | default(none),
            'budget_duration': key.budget_duration | default(none),
            'budget_limits': key.budget_limits | default([], true),
            'rpm_limit': key.rpm_limit | default(none),
            'tpm_limit': key.tpm_limit | default(none),
            'router_settings': key.router_settings | default({}, true),
            'metadata_tags': (key.metadata | default({}, true)).get('tags', []) | default([], true),
            'object_permission': key.object_permission | default({}, true)
          } -%}
          {%- set ns.keys = ns.keys + [{'alias': key.key_alias, 'flags': flags}] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ ns.keys }}
      no_log: true

    - name: Keep only seeded key aliases and flags from the Git baseline
      ansible.builtin.set_fact:
        _llm_router_drift_expected_keys: >-
          {%- set ns = namespace(keys=[], workstation_aliases=(
            _llm_router_workstation_virtual_keys | default([]) | map(attribute='alias') | list)) -%}
          {%- for key in llm_router_virtual_keys -%}
          {%- if (key.value | default('', true) | string | length) > 0 -%}
          {%- set monthly = key.monthly_budget | default(0) | float -%}
          {%- set flags = {
            'models': key.models | default([], true),
            'allowed_routes': key.allowed_routes | default([], true),
            'max_budget': monthly if monthly > 0 else none,
            'budget_duration': '7d' if monthly > 0 else none,
            'budget_limits': ([
              {'budget_duration': '24h', 'max_budget': ((monthly / 7 * 2) | round | float)},
              {'budget_duration': '7d', 'max_budget': monthly}
            ] if monthly > 0 else []),
            'rpm_limit': key.rpm_limit | default(none),
            'tpm_limit': key.tpm_limit | default(none),
            'router_settings': key.router_settings | default({}, true),
            'metadata_tags': key.tags | default([], true),
            'object_permission': key.object_permission
              | default(llm_router_mcp_default_object_permission)
          } -%}
          {%- set git_file = llm_router_drift_workstation_key_git_file
            if key.alias in ns.workstation_aliases else llm_router_drift_key_git_file -%}
          {%- set ns.keys = ns.keys + [{'alias': key.alias, 'flags': flags, 'git_file': git_file}] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.keys }}
      no_log: true

    - name: Build the rendered router and UI setting baselines
      ansible.builtin.set_fact:
        _llm_router_drift_expected_settings: >-
          {%- set config = _llm_router_drift_rendered_config.content | b64decode | from_yaml -%}
          {%- set router_settings = config.router_settings | default({}, true)
            | dict2items | rejectattr('key', 'equalto', 'redis_password') | items2dict
            | combine({'routing_groups': []}) -%}
          {{ [
            {
              'name': 'router setting',
              'git_file': llm_router_drift_router_settings_git_file,
              'expected': router_settings,
              'live': (_llm_router_drift_router_settings.json.current_values | default({}, true)
                | dict2items | rejectattr('key', 'equalto', 'redis_password') | items2dict)
            },
            {
              'name': 'UI setting',
              'git_file': llm_router_drift_ui_settings_git_file,
              'expected': llm_router_ui_settings_baseline,
              'live': _llm_router_drift_ui_settings.json.values | default({}, true)
            }
          ] }}
      no_log: true

    - name: Compare sanitized live state with the Git baselines
      ansible.builtin.import_tasks: drift-compare.yml

    - name: Require the configured router alert path when drift exists
      ansible.builtin.fail:
        msg: >-
          Router drift was found for {{ _llm_router_drift_messages | map(attribute='item') | join('; ') }}
          but llm_router_alert_webhook_url is empty.
      when:
        - _llm_router_drift_messages | length > 0
        - llm_router_alert_webhook_url | default('') | trim | length == 0

    - name: Send one alert-path notification per drifted item
      ansible.builtin.uri:
        url: "{{ llm_router_alert_webhook_url ~ '?template=yes&message=%7B%7B.text%7D%7D' }}"
        method: POST
        headers:
          Content-Type: application/json
        body_format: json
        body:
          text: "{{ item.text }}"
        status_code: [200, 201, 202]
        timeout: "{{ llm_router_seed_request_timeout }}"
      loop: "{{ _llm_router_drift_messages }}"
      loop_control:
        label: "{{ item.item }}"
      when: _llm_router_drift_messages | length > 0
      no_log: true
