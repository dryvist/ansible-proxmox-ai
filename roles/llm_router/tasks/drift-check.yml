---
# Read-only inspection after the shared consumer-seeding play. The only POST
# below targets the existing alert webhook; no LiteLLM mutation endpoint is
# called here.
- name: Compare live router state with the rendered Git baseline
  when:
    - llm_router_db_host | default('', true) | length > 0
    - llm_router_store_model_in_db | default(false) | bool
  block:
    - name: Read the first page of live virtual keys
      ansible.builtin.uri:
        url: >-
          {{ 'http://127.0.0.1:' ~ llm_router_api_port ~ '/key/list?page=1'
             ~ '&size=' ~ llm_router_drift_key_page_size
             ~ '&return_full_object=true&include_team_keys=true&include_created_by_keys=true' }}
        method: GET
        headers:
          Authorization: "Bearer {{ llm_router_master_key }}"
        status_code: 200
        return_content: true
        timeout: "{{ llm_router_seed_request_timeout }}"
      register: _llm_router_drift_keys_page_1
      # Read-only; a check run needs the live value to preview key drift.
      check_mode: false
      no_log: true

    - name: Read remaining virtual-key pages
      ansible.builtin.uri:
        url: >-
          {{ 'http://127.0.0.1:' ~ llm_router_api_port ~ '/key/list?page=' ~ item
             ~ '&size=' ~ llm_router_drift_key_page_size
             ~ '&return_full_object=true&include_team_keys=true&include_created_by_keys=true' }}
        method: GET
        headers:
          Authorization: "Bearer {{ llm_router_master_key }}"
        status_code: 200
        return_content: true
        timeout: "{{ llm_router_seed_request_timeout }}"
      loop: "{{ range(2, (_llm_router_drift_keys_page_1.json.total_pages | default(1) | int) + 1) | list }}"
      loop_control:
        label: "page {{ item }}"
      register: _llm_router_drift_key_pages
      # Read-only; a check run needs the live value to preview every key page.
      check_mode: false
      when: (_llm_router_drift_keys_page_1.json.total_pages | default(1) | int) > 1
      no_log: true

    - name: Read live router settings
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ llm_router_api_port }}/router/settings"
        method: GET
        headers:
          Authorization: "Bearer {{ llm_router_master_key }}"
        status_code: 200
        return_content: true
        timeout: "{{ llm_router_seed_request_timeout }}"
      register: _llm_router_drift_router_settings
      # Read-only; a check run needs the live value to preview router settings.
      check_mode: false
      no_log: true

    - name: Read live UI settings
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ llm_router_api_port }}/get/ui_settings"
        method: GET
        headers:
          Authorization: "Bearer {{ llm_router_master_key }}"
        status_code: 200
        return_content: true
        timeout: "{{ llm_router_seed_request_timeout }}"
      register: _llm_router_drift_ui_settings
      # Read-only; a check run needs the live value to preview UI settings.
      check_mode: false
      no_log: true

    - name: Read the rendered router config baseline
      ansible.builtin.slurp:
        src: "{{ llm_router_config_file }}"
      register: _llm_router_drift_rendered_config
      no_log: true

    - name: Read the live model deployments for the role report
      ansible.builtin.import_tasks: read-model-rows.yml

    # Roles are Admin-UI owned once seeded (55-roles.yml), so role drift is
    # reported here and never reverted or alerted.
    - name: Read the live fallback order of each declared role
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ llm_router_api_port }}/fallback/{{ item.role }}?fallback_type=general"
        headers:
          Authorization: "Bearer {{ llm_router_master_key }}"
        status_code: [200, 404]
        timeout: "{{ llm_router_seed_request_timeout }}"
      loop: "{{ _llm_router_drift_live_roles }}"
      loop_control:
        label: "{{ item.role }}"
      register: _llm_router_drift_role_fallbacks
      # Read-only; a check run needs the live value to preview role ladders.
      check_mode: false
      no_log: true

    - name: Report each live role that differs from its seed
      ansible.builtin.debug:
        msg: "{{ _llm_router_drift_role_report }}"
      when: _llm_router_drift_role_report | length > 0

    - name: Project the live key records
      ansible.builtin.import_tasks: drift-live-keys.yml

    - name: Keep only seeded key aliases and flags from the Git baseline
      ansible.builtin.import_tasks: drift-expected-keys.yml

    - name: Build the rendered router and UI setting baselines
      ansible.builtin.set_fact:
        _llm_router_drift_expected_settings: >-
          {%- set config = _llm_router_drift_rendered_config.content | b64decode | from_yaml -%}
          {%- set router_settings = config.router_settings | default({}, true)
            | dict2items | rejectattr('key', 'equalto', 'redis_password') | items2dict
            | combine({'routing_groups': []}) -%}
          {{ [
            {
              'name': 'router setting',
              'git_file': llm_router_drift_router_settings_git_file,
              'expected': router_settings,
              'live': (_llm_router_drift_router_settings.json.current_values | default({}, true)
                | dict2items | rejectattr('key', 'equalto', 'redis_password') | items2dict)
            },
            {
              'name': 'UI setting',
              'git_file': llm_router_drift_ui_settings_git_file,
              'expected': llm_router_ui_settings_baseline,
              'live': _llm_router_drift_ui_settings.json['values'] | default({}, true)
            }
          ] }}
      no_log: true

    - name: Compare sanitized live state with the Git baselines
      ansible.builtin.import_tasks: drift-compare.yml

    - name: Group sanitized drift findings into bounded per-file messages
      ansible.builtin.set_fact:
        _llm_router_drift_batches: >-
          {{ _llm_router_drift_messages | drift_notification_batches }}
      no_log: true

    - name: Fail visibly when a sanitized drift finding exceeds the alert limit
      ansible.builtin.fail:
        msg: >-
          One or more sanitized router drift findings exceed the 3500-byte
          notification limit; no drift alert was sent.
      when: _llm_router_drift_batches.oversized | length > 0

    - name: Require the configured router alert path when drift exists
      ansible.builtin.fail:
        msg: >-
          Router drift was found for {{ _llm_router_drift_batches.messages | map(attribute='item') | join('; ') }}
          but llm_router_alert_webhook_url is empty.
      when:
        - _llm_router_drift_batches.messages | length > 0
        - llm_router_alert_webhook_url | default('') | trim | length == 0

    - name: Send bounded per-file alert-path notifications for router drift
      ansible.builtin.uri:
        url: "{{ llm_router_alert_webhook_url ~ '?template=yes&message=%7B%7B.text%7D%7D' }}"
        method: POST
        headers:
          Content-Type: application/json
        body_format: json
        body:
          text: "{{ item.text }}"
        status_code: [200, 201, 202]
        timeout: "{{ llm_router_seed_request_timeout }}"
      loop: "{{ _llm_router_drift_batches.messages }}"
      loop_control:
        label: "{{ item.item }}"
      when: _llm_router_drift_batches.messages | length > 0
      no_log: true
