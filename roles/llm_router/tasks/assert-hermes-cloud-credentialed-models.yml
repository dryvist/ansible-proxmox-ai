---
- name: Identify seeded and unseeded enabled Hermes cloud models omitted from the projection
  ansible.builtin.set_fact:
    _llm_router_hermes_cloud_credential_gate_results: >-
      {%- set secrets = bao_local_llm_secrets | default({}, true) -%}
      {%- set rendered_ids = _llm_router_m_hermes_cloud_models_credentialed
           | map(attribute='client_model_id') | list -%}
      {%- set ns = namespace(failures=[], unseeded=[]) -%}
      {%- for model in (_llm_router_m_registry_enabled
           | selectattr('tier', 'equalto', 'hermes-cloud')
           | selectattr('credential_env', 'defined') | list) -%}
      {%- if model.client_model_id not in rendered_ids -%}
      {%- set key_field = model.get('key_field', model.credential_env) -%}
      {%- set api_base_declared = model.api_base_field is defined -%}
      {%- set api_base_field = model.get('api_base_field', '') -%}
      {%- set key_value = (secrets.get(key_field, '')
           | default(lookup('env', model.credential_env), true) | string | trim) -%}
      {%- set api_base_value = (secrets.get(api_base_field, '')
           | default(lookup('env', api_base_field), true) | string | trim)
           if api_base_declared else '' -%}
      {%- set key_field_present = (key_field in secrets)
           or (lookup('env', model.credential_env) | default('', true) | string | trim | length > 0) -%}
      {%- set key_field_empty = key_value | length == 0 -%}
      {%- set api_base_field_present = api_base_declared and (
           api_base_field in secrets
           or (lookup('env', api_base_field) | default('', true) | string | trim | length > 0)) -%}
      {%- set api_base_field_empty = api_base_declared and api_base_value | length == 0 -%}
      {%- set failed_gates = (['key'] if not (
           _llm_router_m_resolved_credentials.get(model.credential_env, '') | length > 0
           or (model.provider == 'chatgpt'
               and (llm_router_chatgpt_auth_file_present | default(false) | bool))) else [])
           + (['api_base'] if api_base_declared
               and _llm_router_m_resolved_api_bases.get(model.client_model_id, '') | length == 0 else []) -%}
      {%- set fields = [key_field] + ([api_base_field] if api_base_declared else []) -%}
      {%- if key_value | length > 0 or api_base_value | length > 0 -%}
      {%- set failure = {
           'client_model_id': model.client_model_id,
           'failed_gates': failed_gates,
           'key_field': key_field,
           'key_field_present': key_field_present,
           'key_field_empty_after_trim': key_field_empty,
           'api_base_field_declared': api_base_declared,
           'api_base_field': api_base_field,
           'api_base_field_present': api_base_field_present,
           'api_base_field_empty_after_trim': api_base_field_empty
         } -%}
      {%- set ns.failures = ns.failures + [failure] -%}
      {%- else -%}
      {%- set ns.unseeded = ns.unseeded + [{
           'client_model_id': model.client_model_id,
           'fields': fields
         }] -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ {'failures': ns.failures, 'unseeded': ns.unseeded} }}
  no_log: true

- name: Materialize seeded and unseeded Hermes cloud model diagnostics
  ansible.builtin.set_fact:
    _llm_router_hermes_cloud_credential_gate_failures: >-
      {{ _llm_router_hermes_cloud_credential_gate_results.failures }}
    _llm_router_hermes_cloud_unseeded_models: >-
      {{ _llm_router_hermes_cloud_credential_gate_results.unseeded }}
  no_log: true

- name: Warn for unseeded enabled Hermes cloud models omitted from the projection
  ansible.builtin.debug:
    msg: "{{ item.client_model_id }} not rendered: {{ item.fields | join(', ') }} not seeded"
  loop: "{{ _llm_router_hermes_cloud_unseeded_models }}"
  loop_control:
    label: "{{ item.client_model_id }}"
  register: _llm_router_hermes_cloud_credential_warnings

- name: Assert seeded enabled Hermes cloud models remain in the projection
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_hermes_cloud_credential_gate_failures | length == 0
    fail_msg: >-
      Enabled Hermes cloud model(s) with seeded fields are absent from the
      credentialed model list:
      {% for item in _llm_router_hermes_cloud_credential_gate_failures %}
      {{ item.client_model_id }} failed gate(s)
      [{{ item.failed_gates | join(', ') }}]; key field {{ item.key_field }}
      present={{ item.key_field_present | string | lower }}
      empty_after_trim={{ item.key_field_empty_after_trim | string | lower }}
      {% if item.api_base_field_declared %}; api_base field
      {{ item.api_base_field }} present={{ item.api_base_field_present | string | lower }}
      empty_after_trim={{ item.api_base_field_empty_after_trim | string | lower }}
      {% endif %}{% if not loop.last %}; {% endif %}
      {% endfor %}
