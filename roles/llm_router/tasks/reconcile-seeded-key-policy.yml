---
# Trace defaults reconcile additively in every mode. The required sensitivity
# tag also reconciles in every mode; other existing UI tags are preserved.
# MCP server access and model allowlists are Git-owned in every mode. Model
# lists are projections of the registry-derived seed, so a converge replaces
# each existing seeded key's list with that exact baseline. In `initial` mode,
# routes and other attribution metadata remain UI-owned and are only reported
# by drift-check.yml. `rebuild` explicitly reconciles those other fields too.
#
# A seed entry may explicitly set `models_authoritative: false` to retain the
# additive behavior for an intentional UI-owned extension. Every current entry
# defaults to authoritative, so retired names are removed and new
# registry-derived names reach existing keys on the next converge.
#
# In rebuild mode routes are replaced outright with the seed value, and only
# for a key that declares allowed_routes at all. Object permissions are always
# replaced with the seeded value.
#
# Computed as one list of {alias, body} entries so a key needing a change gets
# exactly one /key/update call carrying its changed policy fields — the diff
# itself runs once, in Jinja, against the single /key/list read above.
- name: Compute the key policy update each live key still needs, if any
  ansible.builtin.set_fact:
    _llm_router_key_updates: >-
      {%- set _out = [] -%}
      {%- for _k in (llm_router_virtual_keys
                     | rejectattr('value', 'equalto', '')
                     | selectattr('alias', 'in', _llm_router_live_key_aliases) | list) -%}
      {#- The outer default()'s `, true` form also fires on a live record whose
         allowed_routes/models key is PRESENT but JSON null (map(attribute=...,
         default=...) only substitutes for a MISSING key), so null compares the
         same as missing instead of crashing the difference() calls below. -#}
      {%- set _live_routes = (llm_router_existing_keys.json['keys'] | default([])
              | selectattr('key_alias', 'equalto', _k.alias)
              | map(attribute='allowed_routes', default=none) | first | default(none, true)) -%}
      {%- set _live_models = (llm_router_existing_keys.json['keys'] | default([])
              | selectattr('key_alias', 'equalto', _k.alias)
              | map(attribute='models', default=[]) | first | default([], true)) -%}
      {%- set _authoritative = _k.models_authoritative | default(true) -%}
      {%- set _models_target = _k.models if _authoritative else ((_live_models + _k.models) | unique | list) -%}
      {%- set _models_changed = ((_live_models | sort) != (_models_target | sort))
            if _authoritative else (_k.models | difference(_live_models) | length > 0) -%}
      {%- set _routes_changed = (_k.allowed_routes is defined) and (_live_routes != _k.allowed_routes) -%}
      {%- set _live_metadata = (llm_router_existing_keys.json['keys'] | default([])
              | selectattr('key_alias', 'equalto', _k.alias)
              | map(attribute='metadata', default={}) | first | default({}, true)) -%}
      {%- set _live_permission = (llm_router_existing_keys.json['keys'] | default([])
              | selectattr('key_alias', 'equalto', _k.alias)
              | map(attribute='object_permission', default={}) | first | default({}, true)) -%}
      {%- set _permission_target = _k.object_permission
              | default(llm_router_mcp_default_object_permission) -%}
      {%- set _live_tags = _live_metadata.get('tags', []) | default([], true) | list -%}
      {%- set _sensitivity_tag = _k.sensitivity_tag | default('&sensitivity:sensitive') -%}
      {%- set _desired_tags = (_live_tags | reject('match', '^([&!])?sensitivity:') | list)
            + [_sensitivity_tag] -%}
      {%- set _live_sensitivity_tags = _live_tags | select('match', '^([&!])?sensitivity:') | list -%}
      {%- set _metadata_target = (_k.metadata | default({})) | combine({
              'app': _k.alias,
              'tier': (_k.tier | default('local' if (_k.monthly_budget | default(0) | float == 0) else 'subscription')),
              'tags': _desired_tags,
            }, recursive=true) -%}
      {#- Additive only: an operator-set or request-time metadata field this
         seed knows nothing about must survive a reconcile untouched, so
         "changed" means the seeded fields alone differ from what's already
         live. -#}
      {%- set _metadata_changed = (_live_metadata | combine(_metadata_target)) != _live_metadata -%}
      {%- set _trace_target = dict(_metadata_target.items()
            | selectattr('0', 'in', ['trace_defaults', 'trace_required']) | list) -%}
      {%- set _trace_changed = (_live_metadata | combine(_trace_target, recursive=true)) != _live_metadata -%}
      {%- set _sensitivity_changed = _live_sensitivity_tags != [_sensitivity_tag] -%}
      {%- set _permission_changed = _live_permission != _permission_target -%}
      {%- set _rebuild_fields_changed = (_models_changed or _routes_changed or _metadata_changed) -%}
      {%- if _permission_changed or _trace_changed or _sensitivity_changed or (_authoritative and _models_changed)
            or (llm_router_seed_mode == 'rebuild' and _rebuild_fields_changed) -%}
      {%- set _body = {'key': _k.value, 'object_permission': _permission_target} -%}
      {%- if _trace_changed or _sensitivity_changed -%}
      {%- set _initial_metadata_target = _trace_target | combine({'tags': _desired_tags}, recursive=true) -%}
      {%- set _initial_live_metadata = _live_metadata | combine(_initial_metadata_target, recursive=true) -%}
      {%- set _body = _body | combine({'metadata': _initial_live_metadata}) -%}
      {%- endif -%}
      {%- if llm_router_seed_mode == 'rebuild' -%}
      {%- set _body = _body | combine({'models': _models_target}) -%}
      {%- set _body = (_body | combine({'allowed_routes': _k.allowed_routes}))
            if (_k.allowed_routes is defined) else _body -%}
      {%- set _body = _body | combine({'metadata': (_live_metadata | combine(_metadata_target, recursive=true))}) -%}
      {%- elif _authoritative and _models_changed -%}
      {%- set _body = _body | combine({'models': _models_target}) -%}
      {%- endif -%}
      {%- set _discard = _out.append({'alias': _k.alias, 'body': _body}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ _out }}
  vars:
    _llm_router_live_key_aliases: >-
      {{ llm_router_existing_keys.json['keys'] | default([])
         | selectattr('key_alias', 'defined')
         | map(attribute='key_alias') | select('string') | list }}
  no_log: true

- name: Reconcile caller policy for live keys that changed
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/update"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    body_format: json
    body: "{{ item.body }}"
    status_code: [200, 201]
    timeout: "{{ llm_router_seed_request_timeout }}"
  loop: "{{ _llm_router_key_updates }}"
  loop_control:
    label: "{{ item.alias }}"
  no_log: true
