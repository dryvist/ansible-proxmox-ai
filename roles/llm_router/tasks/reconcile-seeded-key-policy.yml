---
# MCP server access is Git-owned in every mode because it is a security
# boundary: existing keys are narrowed or granted their declared server list
# on every converge. In `initial` mode, models, routes, and attribution
# metadata remain UI-owned and are only reported by drift-check.yml. `rebuild`
# explicitly reconciles those other fields too.
#
# In rebuild mode models are UNIONED with the live list by default (only ever
# added, never removed, so an operator's Admin UI edit survives) — same reason: a
# name added to a seed entry's list after the mint (a new role in
# 55-roles.yml, a new servable model) never reaches an existing key on its
# own, and sending the git list outright would erase a name an operator
# added in the Admin UI.
#
# A key marked `models_authoritative: true` (hindsight, 56-virtual-keys.yml)
# is the deliberate exception: it gets the seeded list VERBATIM, a REPLACE
# rather than a union, because for THAT key the seed is the whole allowlist,
# not a floor — a name granted before the free-only boundary landed
# (`cheap`, the primary model, the `no-default-models` stopgap) must
# actually be revoked, not linger forever alongside the new one. Such a key
# is flagged as changed on drift in EITHER direction (seeded names live
# lacks, OR live names seeded no longer lists) — a narrowing has to reach
# the live key too, not only a widening.
#
# In rebuild mode routes are replaced outright with the seed value, and only
# for a key that declares allowed_routes at all. Object permissions are always
# replaced with the seeded value.
#
# Computed as one list of {alias, body} entries in `rebuild` mode so a key
# needing a change gets exactly one /key/update call carrying its changed
# policy fields — the diff itself runs once, in Jinja, against the single
# /key/list read above.
- name: Compute the key policy update each live key still needs, if any
  ansible.builtin.set_fact:
    _llm_router_key_updates: >-
      {%- set _out = [] -%}
      {%- for _k in (llm_router_virtual_keys
                     | rejectattr('value', 'equalto', '')
                     | selectattr('alias', 'in', _llm_router_live_key_aliases) | list) -%}
      {#- The outer default()'s `, true` form also fires on a live record whose
         allowed_routes/models key is PRESENT but JSON null (map(attribute=...,
         default=...) only substitutes for a MISSING key), so null compares the
         same as missing instead of crashing the difference() calls below. -#}
      {%- set _live_routes = (llm_router_existing_keys.json['keys'] | default([])
              | selectattr('key_alias', 'equalto', _k.alias)
              | map(attribute='allowed_routes', default=none) | first | default(none, true)) -%}
      {%- set _live_models = (llm_router_existing_keys.json['keys'] | default([])
              | selectattr('key_alias', 'equalto', _k.alias)
              | map(attribute='models', default=[]) | first | default([], true)) -%}
      {%- set _authoritative = _k.models_authoritative | default(false) -%}
      {%- set _models_target = _k.models if _authoritative else ((_live_models + _k.models) | unique | list) -%}
      {%- set _models_changed = (_k.models | difference(_live_models) | length > 0)
            or (_authoritative and (_live_models | difference(_k.models) | length > 0)) -%}
      {%- set _routes_changed = (_k.allowed_routes is defined) and (_live_routes != _k.allowed_routes) -%}
      {%- set _live_metadata = (llm_router_existing_keys.json['keys'] | default([])
              | selectattr('key_alias', 'equalto', _k.alias)
              | map(attribute='metadata', default={}) | first | default({}, true)) -%}
      {%- set _live_permission = (llm_router_existing_keys.json['keys'] | default([])
              | selectattr('key_alias', 'equalto', _k.alias)
              | map(attribute='object_permission', default={}) | first | default({}, true)) -%}
      {%- set _permission_target = _k.object_permission
              | default(llm_router_mcp_default_object_permission) -%}
      {%- set _metadata_target = (_k.metadata | default({})) | combine({
              'app': _k.alias,
              'tier': (_k.tier | default('local' if (_k.monthly_budget | default(0) | float == 0) else 'subscription')),
            }, recursive=true) -%}
      {#- Additive only (same union-not-overwrite stance as models above): an
         operator-set or request-time metadata field this seed knows nothing
         about must survive a reconcile untouched, so "changed" means the
         seeded fields alone differ from what's already live. -#}
      {%- set _metadata_changed = (_live_metadata | combine(_metadata_target)) != _live_metadata -%}
      {%- set _permission_changed = _live_permission != _permission_target -%}
      {%- set _rebuild_fields_changed = (_models_changed or _routes_changed or _metadata_changed) -%}
      {%- if _permission_changed or (llm_router_seed_mode == 'rebuild' and _rebuild_fields_changed) -%}
      {%- set _body = {'key': _k.value, 'object_permission': _permission_target} -%}
      {%- if llm_router_seed_mode == 'rebuild' -%}
      {%- set _body = _body | combine({'models': _models_target}) -%}
      {%- set _body = (_body | combine({'allowed_routes': _k.allowed_routes}))
            if (_k.allowed_routes is defined) else _body -%}
      {%- set _body = _body | combine({'metadata': (_live_metadata | combine(_metadata_target, recursive=true))}) -%}
      {%- endif -%}
      {%- set _discard = _out.append({'alias': _k.alias, 'body': _body}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ _out }}
  vars:
    _llm_router_live_key_aliases: >-
      {{ llm_router_existing_keys.json['keys'] | default([])
         | selectattr('key_alias', 'defined')
         | map(attribute='key_alias') | select('string') | list }}
  no_log: true

- name: Reconcile caller policy for live keys that changed
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/key/update"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    body_format: json
    body: "{{ item.body }}"
    status_code: [200, 201]
    timeout: "{{ llm_router_seed_request_timeout }}"
  loop: "{{ _llm_router_key_updates }}"
  loop_control:
    label: "{{ item.alias }}"
  no_log: true
