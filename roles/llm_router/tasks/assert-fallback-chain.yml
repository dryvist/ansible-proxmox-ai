---
- name: Assert the shared D1 class ladder is ordered and complete
  ansible.builtin.assert:
    quiet: true
    that:
      - llm_router_d1_class_order == ['sub', 'local', 'paid-zdr', 'free', 'retains']
      - llm_router_hermes_cloud_fallback_groups == llm_router_d1_ladder_groups
      - llm_router_hermes_default_fallback_chain == llm_router_d1_ladder_groups
      - llm_router_hermes_default_fallback_chain | unique | length == llm_router_hermes_default_fallback_chain | length
      - >-
        llm_router_hermes_default_fallback_chain
        == (llm_router_d1_class_order | map('extract', llm_router_d1_rungs_by_class) | flatten | unique | list)
      - llm_router_d1_ladder_groups | difference(_llm_router_d1_declared_groups) | length == 0
      - _llm_router_zai_is_last | bool
      - llm_router_hermes_default_fallback_chain | length <= llm_router_max_fallbacks | int
      - _llm_router_unescaped_narrow_groups | length == 0
    fail_msg: >-
      D1 ladder drifted: class order={{ llm_router_d1_class_order }},
      ladder={{ llm_router_hermes_default_fallback_chain }},
      undeclared={{ llm_router_d1_ladder_groups | difference(_llm_router_d1_declared_groups) }},
      unescaped narrow local groups={{ _llm_router_unescaped_narrow_groups }}.
    success_msg: >-
      D1 class ladder is complete and ordered:
      {{ llm_router_hermes_default_fallback_chain | join(' -> ') }}.
  vars:
    _llm_router_d1_declared_groups: >-
      {{ llm_router_d1_class_order
         | map('extract', llm_router_d1_rungs_by_class) | flatten | unique | list }}
    _llm_router_zai_is_last: >-
      {{ llm_router_zai_groups | length == 0
         or (llm_router_hermes_default_fallback_chain | last) == (llm_router_zai_groups | last) }}
    _llm_router_escaped_narrow_groups: >-
      {%- set ns = namespace(groups=[]) -%}
      {%- for _entry in llm_router_context_window_fallbacks -%}
      {%- set ns.groups = ns.groups + (_entry.keys() | list) -%}
      {%- endfor -%}
      {{ ns.groups | unique | list }}
    _llm_router_unescaped_narrow_groups: >-
      {%- set ns = namespace(groups=[]) -%}
      {%- for _model in llm_router_registry_enabled -%}
      {%- set _group = _model.fallback_group
            | default(_model.route_group | default(_model.client_model_id, true), true) -%}
      {%- if llm_router_context_window_wider_groups | length > 0
            and _group in llm_router_hermes_local_narrow_groups
            and _group in llm_router_hermes_default_fallback_chain
            and _group not in _llm_router_escaped_narrow_groups -%}
      {%- set ns.groups = ns.groups + [_group] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.groups | unique | list }}
