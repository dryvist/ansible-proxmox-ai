---
- name: Assert Hermes cloud route groups have valid price classes and ranks
  ansible.builtin.assert:
    quiet: true
    that:
      - item.get('price_class', '') in ['free', 'paid', 'subscription']
      - item.get('route_rank') is integer
      - >-
        (item.get('price_class') == 'subscription')
        == (item.get('subscription', false) | bool)
    fail_msg: >-
      Hermes cloud entry {{ item.get('client_model_id', '(unknown)') }} needs
      a valid price_class, integer route_rank, and a matching subscription
      marker.
  loop: >-
    {{ llm_router_model_registry
       | selectattr('tier', 'equalto', 'hermes-cloud')
       | selectattr('route_group', 'defined') | list }}
