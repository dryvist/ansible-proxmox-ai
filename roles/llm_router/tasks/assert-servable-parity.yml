---
# The adjudication half of the servable probe — pure comparison over results
# verify-servable.yml registered. No network, no credential, no module that
# can fail on its own, so tests/llm_router/test_servable_probe.yml drives every
# branch from hand-built fixtures, including the ones that must FAIL.
#
# THREE OUTCOMES PER PROBE, AND THEY ARE NOT INTERCHANGEABLE:
#   verified    — the endpoint answered and its listing was compared.
#   rejected    — it answered 401/403. The credential exists but no longer
#                 works (a rotation), which is neither "absent" nor "down".
#                 Reported, never fatal: a converge must not be blocked by a
#                 key that expired somewhere else.
#   unreachable — anything else. The serving host can be asleep, rebooting or
#                 off the network; an optional tier can be unseeded entirely.
#                 "Cannot check" is never "check failed".
# The report below names each one separately, because a skip that reads like a
# pass is how a check quietly stops running. A green converge where every
# probe skipped is the failure mode this reporting is designed against.

- name: Classify every model-listing probe this converge performed
  ansible.builtin.set_fact:
    _llm_router_gate_probe:
      state: >-
        {{ 'verified' if (_llm_router_gate_models.status | default(0) | int) == 200
           else ('rejected'
                 if (_llm_router_gate_models.status | default(0) | int) in [401, 403]
                 else 'unreachable') }}
      status: "{{ _llm_router_gate_models.status | default(0) | int }}"
      ids: >-
        {{ (_llm_router_gate_models.json | default({}, true)).get('data', [])
           | map(attribute='id') | list }}
    _llm_router_remote_probe_results: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for r in _llm_router_remote_models.results | default([]) -%}
      {%- set st = r.status | default(0) | int -%}
      {%- set served = (r.json | default({}, true)).get('data', []) | map(attribute='id') | list -%}
      {%- set ns.out = ns.out + [{
            'endpoint': r.item.endpoint,
            'labels': r.item.labels,
            'expected': r.item.models,
            'status': st,
            'state': 'verified' if st == 200
                     else ('rejected' if st in [401, 403] else 'unreachable'),
            'missing': r.item.models | difference(served)}] -%}
      {%- endfor -%}
      {{ ns.out }}

# BEFORE the asserts, deliberately: a converge the probe fails should still
# show what was and was not checked, and a debug task after a failing assert
# never runs.
# A machine-readable verdict, not only a printed one. The debug below renders
# from it, and tests/llm_router/test_servable_probe.yml asserts on it — which
# is what makes "skipped because unreachable" provable as a SKIP rather than
# inferred from a converge that happened not to fail.
- name: Summarise which probes verified, which were refused, and which never ran
  ansible.builtin.set_fact:
    _llm_router_probe_report:
      gate: "{{ _llm_router_gate_probe.state }}"
      gate_ids: "{{ _llm_router_gate_probe.ids }}"
      verified: >-
        {{ _llm_router_remote_probe_results | selectattr('state', 'equalto', 'verified')
           | map(attribute='endpoint') | list }}
      rejected: >-
        {{ _llm_router_remote_probe_results | selectattr('state', 'equalto', 'rejected')
           | map(attribute='endpoint') | list }}
      unreachable: >-
        {{ _llm_router_remote_probe_results | selectattr('state', 'equalto', 'unreachable')
           | map(attribute='endpoint') | list }}
      no_credential: >-
        {{ llm_router_remote_probes | rejectattr('has_credential')
           | map(attribute='endpoint') | list }}
      unsupported: "{{ llm_router_probe_unsupported_tiers }}"

# BEFORE the asserts, deliberately: a converge the probe fails should still show
# what was and was not checked, and a debug task after a failing assert never
# runs.
- name: Report what the servable probe checked, skipped, and could not check
  ansible.builtin.debug:
    msg:
      - >-
        Serving gate: {{ _llm_router_probe_report.gate }}
        (HTTP {{ _llm_router_gate_probe.status }}) —
        {{ ('compared ' ~ (llm_router_servable_models | length) ~ ' servable registry entr(ies) against '
            ~ (_llm_router_probe_report.gate_ids | length) ~ ' served id(s): '
            ~ (_llm_router_probe_report.gate_ids | join(', ')))
           if _llm_router_probe_report.gate == 'verified'
           else 'NOT CHECKED, so the registry claim that ['
                ~ (llm_router_servable_models | join(', ')) ~ '] is served stands unverified' }}
      - "Remote endpoints verified: {{ _llm_router_probe_report.verified | join(', ') | default('none', true) }}"
      - >-
        Remote endpoints NOT CHECKED, credential refused (401/403):
        {{ _llm_router_probe_report.rejected | join(', ') | default('none', true) }}
      - >-
        Remote endpoints NOT CHECKED, unreachable:
        {{ _llm_router_probe_report.unreachable | join(', ') | default('none', true) }}
      - >-
        Remote endpoints NOT CHECKED, no credential resolved:
        {{ _llm_router_probe_report.no_credential | join(', ') | default('none', true) }}
      - >-
        Tiers with no model listing this role can parse:
        {{ _llm_router_probe_report.unsupported | join(', ') | default('none', true) }}
  changed_when: false

- name: Assert the serving gate serves exactly the models the registry claims
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_unserved | length == 0
      - _llm_router_unregistered | length == 0
    fail_msg: >-
      Registry and serving gate disagree
      (roles/llm_router/tasks/assert-servable-parity.yml).
      {{ ('Claimed servable but NOT served: [' ~ (_llm_router_unserved | join(', ')) ~ ']. '
          ~ 'A request naming one of these gets HTTP 404 — no answer, not a degraded '
          ~ 'one; that is the 2026-07-28 outage, where every consumer alias 404ed at '
          ~ 'once. Fix by moving servable/serving_role onto an entry the gate really '
          ~ 'serves, never by widening the claim to match a stale alias. ')
         if _llm_router_unserved | length > 0 else '' }}
      {{ ('Served but absent from the enabled registry: ['
          ~ (_llm_router_unregistered | join(', ')) ~ ']. The registry is meant to be '
          ~ 'the complete statement of what this fabric serves, so a model answering '
          ~ 'under a name it does not carry is drift — register the entry or stop '
          ~ 'serving it.')
         if _llm_router_unregistered | length > 0 else '' }}
    success_msg: >-
      Serving gate confirms all {{ llm_router_servable_models | length }} servable
      registry entries, and serves nothing the registry does not carry.
  when: _llm_router_gate_probe.state == 'verified'
  vars:
    _llm_router_unserved: >-
      {{ llm_router_servable_models | difference(_llm_router_gate_probe.ids) }}
    # Both id forms are permitted: the registry's client-facing id and the id
    # the backend itself knows. They are the same value on the large tier, and
    # accepting both keeps this direction honest for any tier where they differ.
    _llm_router_unregistered: >-
      {{ _llm_router_gate_probe.ids
         | difference((llm_router_registry_enabled | map(attribute='client_model_id') | list)
                      + (llm_router_registry_enabled | map(attribute='upstream_model_id') | list)) }}

- name: Assert every registered remote id appears in its provider's own listing
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_remote_absent | length == 0
    fail_msg: >-
      Registered model id(s) absent from the provider's own listing
      (roles/llm_router/tasks/assert-servable-parity.yml):
      {{ _llm_router_remote_absent | join('; ') }}.
      The endpoint answered and does not offer them, so every request naming one
      fails at the provider rather than here. An id read from third-party
      documentation rather than from this endpoint is the usual cause — correct
      the registry entry against what the listing above actually returned.
    success_msg: >-
      {{ _llm_router_remote_checked | length }} remote endpoint(s) confirm every
      registered id they answer for.
  vars:
    _llm_router_remote_checked: >-
      {{ _llm_router_remote_probe_results | selectattr('state', 'equalto', 'verified') | list }}
    _llm_router_remote_absent: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for r in _llm_router_remote_checked | selectattr('missing') -%}
      {%- set ns.out = ns.out + [r.endpoint ~ ' does not offer ' ~ (r.missing | join(', '))] -%}
      {%- endfor -%}
      {{ ns.out }}
