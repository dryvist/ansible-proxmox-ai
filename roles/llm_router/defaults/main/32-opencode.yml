---
# --- OpenCode Go subscription tier -------------------------------------------
# Provider topology for the subscription tier. The models themselves, and why
# the set is the size it is, live in llm-models.d/35-opencode.yml.
#
# WHAT `order` DOES, AND DOES NOT DO. LiteLLM's order filter ranks deployments
# WITHIN one model_name group and nowhere else; across two differently-named
# groups it decides nothing, and the router falls back to its ordinary
# selection. The tier prefix in the registry means no deployment here shares a
# name with a metered one, so today this value changes no routing decision at
# all. It is recorded as a band so a future model group that does contain both
# a local and a remote member has a consistent scale to place them on:
#   01-19 local backends  20-39 subscriptions  40-69 unallocated
#   70-99 metered APIs
# Making subscription-before-metered actually happen needs a shared model group
# per role, which is a routing change and not this file's job. Do not read this
# value as a preference the router currently honours.

llm_router_opencode_base_url: "https://opencode.ai/zen/go/v1"
llm_router_opencode_credential_env: "OPENCODE_API_KEY"
llm_router_opencode_default_order: 20
llm_router_opencode_rpm: 60
llm_router_opencode_tpm: 500000
llm_router_opencode_max_parallel_requests: 4
