---
_llm_router_role_seed_policy: >-
  {%- set out = {} -%}
  {%- for role in llm_router_role_deployments -%}
  {%- set _priority_params = _llm_router_role_params[role.model]
        | combine(role.litellm_params | default({}), recursive=true) -%}
  {%- set _priority_tags = _llm_router_role_params[role.model].tags
        | reject('match', '^telemetry_') | list -%}
  {%- set projection = lookup('template', (_role_dir | default(role_path))
        ~ '/templates/role-priority-policy.json.j2', template_vars={
          '_priority_role': role, '_priority_params': _priority_params,
          '_priority_tags': _priority_tags}) | from_json -%}
  {%- set _ = out.update({role.role: projection}) -%}
  {%- endfor -%}
  {{ out }}

_llm_router_role_tier_entries: >-
  {%- set entries = [] -%}
  {%- for role in llm_router_role_deployments -%}
  {%- for policy in _llm_router_role_seed_policy[role.role] -%}
  {%- set _ = entries.append(role | combine(policy)) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ entries }}

_llm_router_role_entries_to_create: >-
  {{ _llm_router_role_tier_entries
     | selectattr('role', 'in', _llm_router_roles_to_create | map(attribute='role') | list) | list }}

_llm_router_role_entries_to_rebuild: >-
  {{ _llm_router_role_tier_entries
     | selectattr('role', 'in', _llm_router_roles_to_rebuild | map(attribute='role') | list) | list }}
