---
# =============================================================================
# PostgreSQL backing store for the router's LEARNED ROUTING STATE.
#
# The Adaptive Router is a multi-armed bandit: it classifies each request and
# tracks a quality estimate per model x request-type from satisfaction signals.
# LiteLLM keeps those estimates in Postgres and loads them at startup. With no
# database the router still serves every request — it just forgets on every
# restart and silently falls back to cold-start priors. That is the dangerous
# failure: a router permanently reverted to guesses behaves exactly like a
# working one, and nothing surfaces it.
#
# Shares the ai-VLAN cluster that already backs Hindsight (postgres_ai_group in
# ansible-proxmox-apps) rather than taking its own: this is a low-volume
# metadata store, and that cluster already carries the estate's DR standard —
# pg_dump timers, pgBackRest PITR, and off-node archive pulls.
#
# EMPTY BY DEFAULT, the same contract as the Redis spend store above: the role
# must converge honestly on a deployment with no database rather than render a
# DATABASE_URL pointing at nothing. inventory/group_vars/llm_router_group.yml
# turns it on by setting the host.
llm_router_db_host: ""
# Port and identity are non-secret. The port comes from the published inventory
# contract, never a literal — same treatment as the Redis port.
llm_router_db_port: >-
  {{ tofu_data['constants']['service_ports']['postgres_default']
     | mandatory('tofu_data.constants.service_ports.postgres_default missing — regenerate the published inventory') }}
llm_router_db_name: litellm
llm_router_db_user: litellm
# bao-first with an env fallback, identical shape to llm_router_redis_password.
# Generated at source in ansible-proxmox-apps
# (openbao_generated_app_secrets.llm-router) and read by BOTH ends from the same
# apps/llm-router field, so the login this role dials and the role the Postgres
# converge creates cannot drift apart.
llm_router_db_password: >-
  {{ bao_apps_secrets.llm_router_db_password
     | mandatory('llm_router_db_password was not supplied to this role') }}

# LiteLLM sets NO default idle-connection lifetime, so a pooled connection can
# sit idle until the server or a stateful firewall drops it, and the next
# request fails on a connection the client still believes is open. Bounding the
# idle lifetime below any such timeout makes the client recycle first.
llm_router_db_max_idle_connection_lifetime: 60

# Database-backed model storage, for ROLE DEPLOYMENTS ONLY.
#
# store_model_in_db is INDEPENDENT of adaptive routing. Adaptive routing needs
# the database for quality estimates; this additionally lets the database hold
# model entries alongside the ones config.yaml renders. LiteLLM keeps the two
# sets separate: a config-file entry stays owned by the converge and is
# read-only in the Admin UI, and a database entry is owned by whoever last
# edited it there.
#
# That separation is what makes this safe for the registry-is-SSOT
# architecture, and the split is deliberate:
#   llm-models.d/ is the CATALOG — which physical models exist, what they cost,
#   what context each serves. It stays in git, renders into config.yaml, and the
#   render-parity assert still proves the two agree.
#   The database holds only ROLE DEPLOYMENTS — the stable names callers request
#   (see 55-roles.yml) and the order each falls back through. Those change on
#   the timescale of an afternoon, and a git round-trip per change is the cost
#   this exists to remove.
# tasks/seed-roles.yml writes a role once, when it is absent, and never again;
# a converge cannot overwrite an edit made in the UI.
#
# Declared explicitly rather than left to LiteLLM's default so the decision is
# visible in a diff. Gated on llm_router_db_host like everything else here: with
# no database the roles are simply unseeded, not half-configured.
llm_router_store_model_in_db: true

# Admin UI sign-in. LiteLLM serves the UI at /ui and reads exactly these two
# variables from the environment; without them the UI is unreachable and the
# role deployments could only be edited by curl. bao-first with an env fallback,
# the same shape as llm_router_db_password above, and emitted only alongside
# DATABASE_URL — there is nothing to administer without a database.
llm_router_ui_username: litellm-admin
#
# MANDATORY, like llm_router_master_key and unlike the optional-store variables
# above. An empty password does not disable the UI, it renders a blank
# credential on the one surface that can repoint every role — a converge that
# succeeds while leaving that open is worse than one that stops. The whole
# database block is already gated on llm_router_db_host, so a deployment with
# no database never evaluates this.
llm_router_ui_password: >-
  {{ bao_apps_secrets.llm_router_ui_password
     | default(lookup('env', 'LLM_ROUTER_UI_PASSWORD'), true)
     | mandatory('llm_router_ui_password must be seeded (bao apps/llm-router) when a
       router database is configured — it guards the admin UI that owns role routing') }}

# Per-request spend logs are ON, and the retention plan the previous setting
# demanded is immediately below.
#
# THESE WERE BOTH true. The recorded reason was not "logs are unwanted" — it
# was "the table has no retention policy, so it grows without bound to buy
# telemetry this fabric already has". Both halves of that have since been
# tested and only the first still holds, so it is answered rather than ignored:
#
#   Unbounded growth — ANSWERED. The pinned release has a native retention job
#   (maximum_spend_logs_retention_period below), verified in its source. The
#   original comment names no such setting and treats a retention plan as
#   something that would have to be built, so the choice it was weighing was
#   logs-versus-a-hand-rolled-cleanup-timer. Against a setting it is a
#   different trade. (Which release first shipped the job is NOT established
#   here — only that the one this role installs has it.)
#
#   "Telemetry this fabric already has" — DID NOT HOLD. Redis carries running
#   spend counters, not a per-request record, so it cannot attribute a request
#   to a deployment. The otel callback was the thing that could, and its export
#   to the collector has been failing continuously (see README "Observability"),
#   which is invisible precisely because a dropped span leaves nothing behind.
#   The estate has therefore had NO durable per-request record at all, which is
#   what makes the local-vs-remote serving share unmeasurable.
#
# What the row buys, per LiteLLM_SpendLogs in the pinned schema: `model` and
# `model_group` (the name asked for), `model_id` + `api_base` (the deployment
# actually selected, which is the local-or-remote answer), `status`
# success/failure, `metadata.user_api_key_alias` (the caller), token counts and
# request_duration_ms. Nothing else in this fabric records the selected
# deployment.
llm_router_disable_spend_logs: false
# Failures need a row for the same reason successes do. disable_error_logs is
# not a second table here: LiteLLM's failure hook returns EARLY when it is true
# (_ProxyDBLogger._should_track_errors_in_db), so a failed request writes no
# spend-log row at all. Left true, every rate-limited and errored request is
# simply missing, and a success rate computed from the remainder is 100% by
# construction — the exact shape of wrongness that reads like a healthy fabric.
llm_router_disable_error_logs: false

# Retention, which is what makes the two settings above affordable.
#
# 30 days: the serving-share metric is reported weekly (README
# "Observability"), so a month holds four reports plus the month-over-month
# comparison, and nothing reads a spend row older than that. Raising it is a
# storage decision, not a correctness one.
#
# Row cost is bounded, not open-ended: prompts and responses are redacted
# (llm_router_store_prompts_in_spend_logs below), and a failure row's
# error_message and traceback are each capped at LiteLLM's
# MAX_STRING_LENGTH_PROMPT_IN_DB (2048 chars). A success row is well under 1 KB
# and a worst-case failure row a few KB, so a 30-day window on this proxy's
# arrival rate stays in the hundreds of megabytes on a cluster already sized
# for Hindsight.
llm_router_spend_logs_retention_period: 30d
# Cleanup cadence. LiteLLM defaults this to 1d when absent; it is declared so
# the decision is visible in a diff, like store_model_in_db above. The job only
# schedules at all when the period above is set.
llm_router_spend_logs_retention_interval: 1d

# Prompts and responses stay OUT of the row. This is LiteLLM's own default, and
# it is declared anyway for two reasons: it is the difference between a
# sub-kilobyte row and a multi-kilobyte one, which is the whole retention
# arithmetic above; and it is the one setting whose silent upstream flip would
# put every prompt this fabric serves into a shared database. A default is not
# a decision until it is written down.
llm_router_store_prompts_in_spend_logs: false

# The router_settings the converge pushes back into the database so the
# persisted row cannot shadow the rendered file. Derived from the rendered
# config rather than a hand-listed key set, minus the credential (never sent
# through the update endpoint) and with the retired routing group forced empty.
_llm_router_settings_payload: >-
  {{ (llm_router_rendered_config.content | b64decode | from_yaml).router_settings
     | default({}, true)
     | dict2items | rejectattr('key', 'equalto', 'redis_password') | items2dict
     | combine({'routing_groups': []}) }}
