---
# Optional direct trace export to the self-hosted Langfuse server, through
# LiteLLM's `langfuse_otel` callback (OTLP over HTTP to the server's
# /api/public/otel route). It reuses the OpenTelemetry packages already
# pinned in llm_router_pip_packages; no Langfuse SDK is installed. The callback
# is listed, and its env lines are rendered, only while both keys resolve
# non-empty in the local-llm secrets domain. Neither key is in any assert.
llm_router_langfuse_public_key: >-
  {{ (bao_local_llm_secrets | default({})).get('LANGFUSE_PUBLIC_KEY', '') }}
llm_router_langfuse_secret_key: >-
  {{ (bao_local_llm_secrets | default({})).get('LANGFUSE_SECRET_KEY', '') }}
llm_router_langfuse_host: "https://langfuse.{{ llm_router_subdomain }}"
llm_router_langfuse_enabled: >-
  {{ (llm_router_langfuse_public_key | default('') | trim | length) > 0
     and (llm_router_langfuse_secret_key | default('') | trim | length) > 0 }}
