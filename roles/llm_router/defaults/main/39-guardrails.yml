---
# Guardrails the proxy declares in its own config.yaml, so every router loads
# one definition from the repo rather than from a database row. Rendered by
# templates/guardrails.yaml.j2. Each litellm_params key below is one the
# litellm 1.106.4 content filter reads. Error handling uses LiteLLM defaults.
llm_router_guardrails:
  - guardrail_name: "Prompt Injection: Data Exfiltration"
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call
      default_on: true
      # No role is exempt: system, user, assistant and tool content, and
      # tool-call arguments, are all scanned, including system messages a client
      # sends.
      categories:
        - category: prompt_injection_data_exfiltration
          enabled: true
          action: BLOCK
          severity_threshold: medium
