---
# Hermes AGENTS as router deployments — not to be confused with 35-hermes-cloud,
# which is about the models a Hermes agent CALLS. This file is the reverse: it
# publishes each running agent as something callable THROUGH the router.
#
# Why here rather than in llm-models.d/: that file is the hand-curated model
# registry, deliberately pure data with no host or URL literals. The agent set
# is not hand-curated — it is whatever guests carry the `hermes-agent` tag, and
# tofu already derives and publishes exactly that as `hermes_agents`. Listing
# agents by hand here would reintroduce the drift the tag-driven publisher was
# built to remove: a second place to forget when an agent is added.
#
# What this buys: Open WebUI (and Dify, and LangFlow, and every other consumer
# already pointed at the router) gains one selectable model per agent with no
# change of its own. A Hermes agent's dashboard is machine-level and has no
# fleet view, so before this the only way to reach a second agent was a second
# hostname and a second login.

# One entry per agent guest, straight from the published inventory. Absent or
# empty when the inventory predates the hermes_agents key, which renders the
# whole block away rather than failing — an older artifact must still converge.
llm_router_hermes_agents: "{{ tofu_data.hermes_agents | default({}, true) }}"

# Each agent's gateway checks the API_SERVER_KEY its OWN identity writes
# (hermes_agent_group 00-agent-settings.yml). The default identity reads the
# shared HERMES_API_SERVER_KEY field; every other identity reads
# <IDENTITY>_API_SERVER_KEY from its own secret/ai/<identity> domain. So the
# router keeps one bearer per identity: a deployment that sends another
# identity's key answers 401 on selection.
#
# Published agent (model name) -> identity. The published inventory carries no
# identity, so it is named here. An agent with no entry gets no deployment
# (fail closed) rather than being sent a key its gateway would reject.
llm_router_hermes_agent_identities:
  hermes-agent: hermes
  hermes-private: hermes-private
  hermes-donna: donna

# Sourced from OpenBao first, falling back to the environment, matching how the
# other provider credentials in this role resolve. The donna domain is fetched
# only when its AppRole is supplied to the converge; otherwise the env fallback
# applies. Field names are LITERAL: openbao_secrets merges the KV subtree
# verbatim, so a lowercase key silently misses and that agent is not rendered.
llm_router_hermes_identity_bearers:
  hermes: >-
    {{ bao_local_llm_secrets['HERMES_API_SERVER_KEY']
       | default(lookup('env', 'HERMES_API_SERVER_KEY'), true)
       | default('', true) }}
  # The private identity's own domain first. If that domain was not fetched to
  # this converge, fall back to the shared bearer it was always sent, so it stays
  # rendered exactly as before rather than dropping out of the router.
  hermes-private: >-
    {{ ((openbao_secrets_by_domain | default({}, true)).get('hermes-private', {}))
         .get('HERMES_PRIVATE_API_SERVER_KEY', '')
       | default(lookup('env', 'HERMES_PRIVATE_API_SERVER_KEY'), true)
       | default(bao_local_llm_secrets['HERMES_API_SERVER_KEY']
                 | default(lookup('env', 'HERMES_API_SERVER_KEY'), true), true)
       | default('', true) }}
  donna: >-
    {{ ((openbao_secrets_by_domain | default({}, true)).get('donna', {})).get('DONNA_API_SERVER_KEY', '')
       | default(lookup('env', 'DONNA_API_SERVER_KEY'), true)
       | default('', true) }}

# An agent is an agentic loop that shells tools and can chain many calls before
# it answers, so it needs a far longer ceiling than a plain completion. This is
# deliberately its own knob and not the shared request timeout.
llm_router_hermes_agent_timeout: 1800

# Advertised context. The agent manages its own history and compaction, so this
# only has to be large enough that the router's pre-call check does not reject
# a normal request. Kept modest on purpose rather than claiming a window the
# backing model may not have.
llm_router_hermes_agent_context_window: 131072
