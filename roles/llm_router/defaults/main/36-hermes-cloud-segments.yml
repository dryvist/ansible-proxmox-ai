---
# The three new fallback segments A3 adds (opencode_sub, or_zdr_paid split,
# free_zdrless), split out of 35-hermes-cloud.yml which hit the repo's
# per-file token budget (.token-limits.yaml) once these were added. Loaded
# alongside it — load order among defaults/main files does not matter,
# only the dependency each var expresses in its own Jinja.

# The cloud-only set splits on its explicit registry price class. Keeping that
# class separate from price metadata prevents an absent accounting rate from
# changing a rung's routing segment.
# Entries marked `hermes_chain: false` (the Codex rungs) are ladder rungs
# only: they never join the brain's own chain, which keeps its order.
llm_router_hermes_cloud_paid_groups: >-
  {%- set ns = namespace(groups=[]) -%}
  {%- for m in llm_router_hermes_cloud_models_credentialed
       | selectattr('price_class', 'equalto', 'paid')
       | rejectattr('hermes_chain', 'defined')
       | rejectattr('review_private_only', 'defined') -%}
  {%- set group = m.fallback_group | default(m.route_group) -%}
  {%- if group not in ns.groups -%}
  {%- set ns.groups = ns.groups + [group] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.groups }}
# A `price_class: subscription` entry is neither paid nor free —
# 58-review-roles.yml places it between the two. The subscription marker stays
# on each entry as an agreeing provider fact. The provider API-key rung behind
# it, ladder-only as well:
llm_router_hermes_cloud_subscription_groups: >-
  {%- set ns = namespace(groups=[]) -%}
  {%- for m in llm_router_hermes_cloud_models_credentialed
       | selectattr('price_class', 'equalto', 'subscription')
       | rejectattr('review_private_only', 'defined') -%}
  {%- set group = m.fallback_group | default(m.route_group) -%}
  {%- if group not in ns.groups -%}
  {%- set ns.groups = ns.groups + [group] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.groups }}
llm_router_hermes_cloud_api_key_groups: >-
  {%- set ns = namespace(groups=[]) -%}
  {%- for m in llm_router_hermes_cloud_models_credentialed
       | selectattr('hermes_chain', 'defined') | rejectattr('subscription', 'defined') -%}
  {%- set group = m.fallback_group | default(m.route_group) -%}
  {%- if group not in ns.groups -%}
  {%- set ns.groups = ns.groups + [group] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.groups }}
llm_router_hermes_cloud_free_groups: >-
  {%- set ns = namespace(groups=[]) -%}
  {%- for m in llm_router_hermes_cloud_models_credentialed
       | selectattr('price_class', 'equalto', 'free') -%}
  {%- set group = m.fallback_group | default(m.route_group) -%}
  {%- if group not in ns.groups -%}
  {%- set ns.groups = ns.groups + [group] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.groups }}

# OpenCode Go subscription tier as a fallback segment, opencode_sub. Keyed off
# client_model_id, not fallback_group/route_group: llm-models.d/35-opencode.yml
# deliberately carries neither (the opencode/ prefix already keeps each entry
# its own model_name group, so there is nothing to dedupe against). Credential
# gate mirrors llm_router_hermes_cloud_models_credentialed exactly — every
# gated tier resolves its own key_field/credential_env the same way.
llm_router_opencode_fallback_groups: >-
  {%- set ns = namespace(models=[]) -%}
  {%- for m in llm_router_opencode_models -%}
  {%- set key = llm_router_resolved_credentials.get(m.credential_env, '') -%}
  {%- if key | length > 0 -%}
  {%- set ns.models = ns.models + [m.client_model_id] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.models }}

# free_zdrless: the final ZDRless free segment before the shared non-ZDR
# continuation. A DELIBERATE, NARROW exception to
# the "OpenRouter's general tier is never part of any fallback chain"
# boundary 30-openrouter.yml states for the metered allowlist — that boundary
# protects the brain from a flaky general-purpose model degrading it; a
# genuinely free (`:free`-suffixed) id carries no such risk beyond what
# hermes-cloud-free already accepts, and this segment exists so the chain has
# a low-cost rung even when hermes-cloud-free's own upstream is down. No ZDR
# claim is made for these ids — that is what "zdrless" names — so they sit
# after every local and asserted-ZDR rung. The original Hermes ladder's
# non-ZDR continuation follows them. The private Hermes key
# excludes these deployments through tag filtering. Same credential
# (OPENROUTER_API_KEY) as the rest of the general tier.
llm_router_openrouter_free_groups: >-
  {%- set ns = namespace(models=[]) -%}
  {%- for m in llm_router_openrouter_models
       | selectattr('client_model_id', 'match', '.*:free$') -%}
  {%- set key = llm_router_resolved_credentials.get(m.credential_env, '') -%}
  {%- if key | length > 0 -%}
  {%- set ns.models = ns.models + [m.client_model_id] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.models }}
