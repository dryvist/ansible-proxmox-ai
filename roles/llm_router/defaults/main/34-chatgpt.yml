---
# --- chatgpt/ subscription rungs --------------------------------------------
# The shared chatgpt/ subscription rung and its API-key sibling use this id
# (llm-models.d/40-hermes-cloud.yml).
llm_router_chatgpt_model: gpt-5.3-codex
# The CI review-only chatgpt/ deployment (codex-ci-model) uses this id, a
# chatgpt/ entry in the pinned litellm catalog; switch to the next Luna id here
# once the pinned litellm catalogs it.
llm_router_ci_luna_model: gpt-5.6-luna
# The CI review-only deployment is emitted only with the per-node login.
llm_router_ci_luna_groups: >-
  {{ llm_router_hermes_cloud_models_credentialed
     | selectattr('review_private_only', 'defined')
     | map(attribute='route_group') | list }}
# The login is a per-node file under the service user; the proxy owns it and
# the converge never writes it (tasks/chatgpt-auth.yml only creates the
# directory and records whether a login is present).
llm_router_chatgpt_token_dir: "{{ llm_router_config_dir }}/chatgpt"
# Set by tasks/chatgpt-auth.yml at converge; a render outside the converge
# (tests) sets it explicitly to model a logged-in node. This is the chatgpt
# rung's whole credential gate (35-hermes-cloud.yml
# llm_router_hermes_cloud_models_credentialed): a per-node login file, never
# a store field.
llm_router_chatgpt_auth_file_present: false
