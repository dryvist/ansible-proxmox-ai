---
# Untrusted-tier caller keys (metadata trust_tier "untrusted", written by
# tasks/seed-keys.yml) have each request's message text classified by a local
# model before routing. Anything but a bare "public" label is refused with 403
# (files/callbacks/untrusted_classify.py). Trusted keys are never classified.
llm_router_untrusted_classify_enabled: true
# The small capability's route group, not a literal: it names the local model
# the registry renders for that group, and the group is in
# llm_router_light_lane_local_only_names, so a failed classify cannot spill to a
# remote route. If the group is not rendered, every untrusted request is refused.
llm_router_untrusted_classify_model: "{{ llm_router_small_capability_name }}"
# This proxy's own OpenAI-compatible route on loopback. The call authenticates with
# the master key, which carries no trust_tier, so the classify call is never
# itself classified.
llm_router_untrusted_classify_url: "http://127.0.0.1:{{ llm_router_api_port }}/v1/chat/completions"
# Only this many characters of request text reach the classifier.
llm_router_untrusted_classify_max_chars: 16000
llm_router_untrusted_classify_timeout_seconds: 10
