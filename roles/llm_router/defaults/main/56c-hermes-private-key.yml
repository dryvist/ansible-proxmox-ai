---
# The private Hermes key has a distinct generated apps-domain value and a
# deployment tag boundary. Its caller model is only the Hermes entrypoint;
# 59-key-scopes.yml widens this to local and asserted-ZDR groups.
_llm_router_hermes_private_virtual_keys:
  - alias: hermes-private
    value: "{{ bao_apps_secrets.hermes_private_llm_router_key | default('', true) }}"
    models: "{{ [hermes_brain_model] }}"
    models_authoritative: true
    zdr_only: true
    tags: ['&zdr', '!free', '!retains']
    router_settings:
      enable_tag_filtering: true
    object_permission:
      mcp_access_groups: [hub-public, hub-homelab-read, hub-private-write]
    monthly_budget: "{{ _llm_router_key_monthly_budget }}"
