---
# One routed key per target consumer; missing source fields keep keys disabled.
_llm_router_target_virtual_keys:
  - alias: claude-code
    owner_filter: false  # D1: preserve workstation MCP access pending operator decision.
    value: "{{ bao_apps_secrets.claude_code_llm_router_key | default('', true) }}"
    enabled: "{{ (bao_apps_secrets | default({})).get('claude_code_llm_router_key', '') | string | length > 0 }}"
    allowed_classes: "{{ _llm_router_consumer_classes_standard }}"
    models: "{{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model]
                 + llm_router_d1_standard_key_groups }}"
    models_authoritative: true
    object_permission:
      mcp_servers: "{{ _llm_router_trusted_hub_servers }}"
      agents: [hermes-private, hermes-public]
    daily_budget: "{{ _llm_router_key_daily_budget }}"
  - alias: codex
    owner_filter: false  # D1: preserve workstation MCP access pending operator decision.
    value: "{{ bao_apps_secrets.codex_llm_router_key | default('', true) }}"
    enabled: "{{ (bao_apps_secrets | default({})).get('codex_llm_router_key', '') | string | length > 0 }}"
    allowed_classes: "{{ _llm_router_consumer_classes_standard }}"
    models: "{{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model]
                 + llm_router_d1_standard_key_groups }}"
    models_authoritative: true
    object_permission:
      mcp_servers: "{{ _llm_router_trusted_hub_servers }}"
      agents: [hermes-private, hermes-public]
      mcp_tool_search_enabled: true
    daily_budget: "{{ _llm_router_key_daily_budget }}"
  - alias: agy
    owner_filter: false  # D1: preserve workstation MCP access pending operator decision.
    value: "{{ (bao_apps_secrets | default({})).get('agy_llm_router_key', '') }}"
    enabled: "{{ (bao_apps_secrets | default({})).get('agy_llm_router_key', '') | string | length > 0 }}"
    allowed_classes: "{{ _llm_router_consumer_classes_standard }}"
    models: "{{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model]
                 + llm_router_d1_standard_key_groups }}"
    models_authoritative: true
    object_permission:
      mcp_servers: "{{ _llm_router_trusted_hub_servers }}"
      agents: [hermes-private, hermes-public]
      mcp_tool_search_enabled: true
    daily_budget: "{{ _llm_router_key_daily_budget }}"
  - alias: judge
    value: "{{ (bao_apps_secrets | default({})).get('judge_llm_router_key', '') }}"
    enabled: "{{ (bao_apps_secrets | default({})).get('judge_llm_router_key', '') | string | length > 0 }}"
    allowed_classes: [local]
    models: "{{ [llm_router_small_model, llm_router_small_capability_name, 'judge'] | unique | list }}"
    models_authoritative: true
    tags: ['&zdr', '!free', '!retains', '&local']
    router_settings:
      enable_tag_filtering: true
  - alias: "{{ (llm_router_role_deployments
                | selectattr('litellm_params.turn_off_message_logging', 'defined')
                | first).role }}"
    value: "{{ (bao_apps_secrets | default({})).get('recorder_llm_router_key', '') }}"
    enabled: "{{ (bao_apps_secrets | default({})).get('recorder_llm_router_key', '') | string | length > 0 }}"
    allowed_classes: [local]
    models: "{{ [llm_router_small_model, llm_router_small_capability_name,
                 (llm_router_role_deployments
                  | selectattr('litellm_params.turn_off_message_logging', 'defined')
                  | first).role] | unique | list }}"
    models_authoritative: true
    tags: ['&zdr', '!free', '!retains', '&local']
    router_settings:
      enable_tag_filtering: true
  - alias: hermes-private
    value: "{{ (bao_apps_secrets | default({})).get('hermes_private_llm_router_key', '') }}"
    enabled: "{{ (bao_apps_secrets | default({})).get('hermes_private_llm_router_key', '') | string | length > 0 }}"
    allowed_classes: "{{ _llm_router_consumer_classes_zdr }}"
    models: "{{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model]
                 + llm_router_d1_zdr_key_groups
                 + [llm_router_review_aliases.local] }}"
    models_authoritative: true
    zdr_only: true
    daily_budget: "{{ _llm_router_hermes_profile_daily_budget }}"
    tags: ['&zdr', '!free', '!retains']
    object_permission:
      mcp_servers: [context7, grep, docs, splunk, vikunja_ro, nautobot, memory, vikunja, zammad]
      mcp_access_groups: [hub-public, hub-homelab-read]
    router_settings:
      enable_tag_filtering: true
  - alias: donna
    value: "{{ (bao_apps_secrets | default({})).get('donna_llm_router_key', '') }}"
    enabled: "{{ (bao_apps_secrets | default({})).get('donna_llm_router_key', '') | string | length > 0 }}"
    allowed_classes: "{{ _llm_router_consumer_classes_zdr }}"
    models: "{{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model]
                 + llm_router_d1_zdr_key_groups
                 + [llm_router_review_aliases.local] }}"
    models_authoritative: true
    tags: ['&zdr', '!free', '!retains']
    object_permission:
      mcp_servers: [context7, grep, docs, splunk, vikunja_ro]
    daily_budget: "{{ _llm_router_hermes_profile_daily_budget }}"
    router_settings:
      enable_tag_filtering: true
  - alias: zcode
    value: "{{ (bao_apps_secrets | default({})).get('zcode_llm_router_key', '') }}"
    enabled: >-
      {{ (bao_apps_secrets | default({})).get('zcode_llm_router_key', '') | string | length > 0
         and (bao_apps_secrets | default({})).get('ZCODE_ROUTER_KEY', '')
             == (bao_apps_secrets | default({})).get('zcode_llm_router_key', '') }}
    allowed_classes: "{{ _llm_router_consumer_classes_all }}"
    models: "{{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model]
                 + llm_router_d1_all_key_groups }}"
    models_authoritative: true
    object_permission:
      mcp_access_groups: [hub-public]
    daily_budget: "{{ _llm_router_key_daily_budget }}"
  - alias: opencode
    value: "{{ bao_apps_secrets.opencode_llm_router_key | default('', true) }}"
    enabled: >-
      {{ (bao_apps_secrets | default({})).get('opencode_llm_router_key', '') | string | length > 0
         and (bao_apps_secrets | default({})).get('OPENCODE_ROUTER_KEY', '')
             == (bao_apps_secrets | default({})).get('opencode_llm_router_key', '') }}
    allowed_classes: [local]
    models: "{{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model,
                 llm_router_embedding_model, llm_router_ocr_model] }}"
    models_authoritative: true
    tags: ['&zdr', '!free', '!retains', '&local']
    object_permission:
      mcp_access_groups: [hub-public]
    router_settings:
      enable_tag_filtering: true
    daily_budget: "{{ _llm_router_key_daily_budget }}"
  - alias: qwen-code
    value: "{{ bao_apps_secrets.qwen_code_llm_router_key | default('', true) }}"
    enabled: >-
      {{ (bao_apps_secrets | default({})).get('qwen_code_llm_router_key', '') | string | length > 0
         and (bao_apps_secrets | default({})).get('QWEN_CODE_ROUTER_KEY', '')
             == (bao_apps_secrets | default({})).get('qwen_code_llm_router_key', '') }}
    allowed_classes: [local]
    models: "{{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model,
                 llm_router_embedding_model, llm_router_ocr_model] }}"
    models_authoritative: true
    tags: ['&zdr', '!free', '!retains', '&local']
    object_permission:
      mcp_access_groups: [hub-public]
    router_settings:
      enable_tag_filtering: true
    daily_budget: "{{ _llm_router_key_daily_budget }}"
  - alias: claude-llm
    value: "{{ (bao_apps_secrets | default({})).get('claude_llm_router_key', '') }}"
    enabled: "{{ (bao_apps_secrets | default({})).get('claude_llm_router_key', '') | string | length > 0 }}"
    allowed_classes: [local, sub, paid-zdr]
    models: "{{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model]
                 + llm_router_d1_zdr_key_groups }}"
    models_authoritative: true
    tags: ['&zdr', '!free', '!retains']
    router_settings:
      enable_tag_filtering: true
    daily_budget: 10.0
  - alias: claude-ocg
    value: "{{ (bao_apps_secrets | default({})).get('claude_ocg_router_key', '') }}"
    enabled: "{{ (bao_apps_secrets | default({})).get('claude_ocg_router_key', '') | string | length > 0 }}"
    allowed_classes: [sub]
    models: >-
      {{ llm_router_opencode_models
         | selectattr('client_model_id', 'match', '^go-')
         | map(attribute='client_model_id') | list }}
    models_authoritative: true
  - alias: sandbox-agent
    value: "{{ (bao_apps_secrets | default({})).get('router_key', '') }}"
    enabled: "{{ (bao_apps_secrets | default({})).get('router_key', '') | string | length > 0 }}"
    allowed_classes: "{{ _llm_router_consumer_classes_all }}"
    models: "{{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model]
                 + (llm_router_d1_all_key_groups
                    | difference(_llm_router_sandbox_agent_excluded_groups)) }}"
    models_authoritative: true
    daily_budget: 1.0
