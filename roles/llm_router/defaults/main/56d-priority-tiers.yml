---
llm_router_priority_tiers:
  - {tier: 0, team_id: tier-0, priority: 1}
  - {tier: 1, team_id: tier-1, priority: 10}
  - {tier: 2, team_id: tier-2, priority: 20}

llm_router_tier_2_timeout_seconds: >-
  {{ ai_tier_2_router_request_timeout_seconds | default(
       (ai_tier_2_wait_timeout_seconds | default(43200) | int)
       + (ai_router_request_timeout_seconds | default(2400) | int)) }}
llm_router_tier_2_keepalive_seconds: 15

# Keys can declare priority_tier; otherwise this input maps consumer aliases.
llm_router_priority_key_tiers:
  home-assistant: 0
  open-webui: 0
  grafana: 0
  claude-code: 0
  codex: 0
  claude-llm: 0
  claude-ocg: 0
  hermes-default: 0
  hermes-private: 0
  donna: 0
  github-actions: 1
  github-actions-ci-fix: 1
  github-actions-pr-review: 1
  github-actions-oss: 1
  alerts: 1
  zammad: 1
  batch: 2
  evals: 2
  digests: 2
  judge: 2
  langfuse: 2
  langflow: 2
  hindsight: 2
  llamaindex: 2
  hermes-eval: 2

llm_router_priority_default_tier: 1

llm_router_priority_effective_key_tiers: >-
  {%- set out = llm_router_priority_key_tiers.copy() -%}
  {%- for key in _llm_router_declared_virtual_keys -%}
  {%- set _ = out.update({key.alias: key.priority_tier | default(
        llm_router_priority_key_tiers.get(key.alias, llm_router_priority_default_tier))}) -%}
  {%- endfor -%}
  {{ out }}

# Shared projection for key creation, reconciliation, and DB role deployments.
llm_router_priority_policy_by_tier: >-
  {%- set out = {} -%}
  {%- set client_timeout = ai_tier_2_client_timeout_seconds | default(
        (ai_tier_2_wait_timeout_seconds | default(43200) | int)
        + (ai_stream_read_timeout_seconds | default(1800) | int)) -%}
  {%- for tier in llm_router_priority_tiers -%}
  {%- set settings = {'enable_tag_filtering': true} -%}
  {%- if tier.tier == 2 -%}
  {%- set settings = settings | combine({'fallbacks': [],
        'context_window_fallbacks': [], 'content_policy_fallbacks': [],
        'timeout': llm_router_tier_2_timeout_seconds}) -%}
  {%- endif -%}
  {%- set _ = out.update({tier.tier | string: {
        'tier': tier.tier, 'priority': tier.priority,
        'client_timeouts': (dict.fromkeys(['read', 'stale', 'api_stale'], client_timeout)
                            if tier.tier == 2 else {}),
        'tags': ['&' ~ tier.team_id] + (['&local'] if tier.tier == 2 else []),
        'router_settings': settings}}) -%}
  {%- endfor -%}
  {{ out }}
