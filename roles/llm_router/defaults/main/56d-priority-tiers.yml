---
llm_router_priority_tiers:
  - {tier: 0, team_id: tier-0, priority: 1}
  - {tier: 1, team_id: tier-1, priority: 10}
  - {tier: 2, team_id: tier-2, priority: 20}

# MCP access groups each priority team allows: the union of what its keys declare.
# LiteLLM refuses a key update that requests a group its team does not allow.
llm_router_priority_team_mcp_access_groups: >-
  {%- set ns = namespace(groups={}) -%}
  {%- for key in _llm_router_virtual_keys_without_values -%}
  {%- set _requested = (key.object_permission | default({}, true)).get('mcp_access_groups', []) | default([], true) -%}
  {%- set _ = ns.groups.update({key.team_id: (ns.groups.get(key.team_id, []) + _requested) | unique | sort | list}) -%}
  {%- endfor -%}
  {{ ns.groups }}

llm_router_tier_2_timeout_seconds: >-
  {{ ai_tier_2_router_request_timeout_seconds | default(
       (ai_tier_2_wait_timeout_seconds | default(43200) | int)
       + (ai_router_request_timeout_seconds | default(2400) | int)) }}
llm_router_tier_2_keepalive_seconds: 15

# Keys can declare priority_tier; otherwise this input maps consumer aliases.
llm_router_priority_key_tiers:
  home-assistant: 0
  open-webui: 0
  grafana: 0
  claude-code: 0
  codex: 0
  claude-llm: 0
  claude-ocg: 0
  hermes-default: 0
  hermes-private: 0
  donna: 0
  github-actions: 1
  github-actions-ci-fix: 1
  github-actions-pr-review: 1
  github-actions-oss: 1
  alerts: 1
  zammad: 1
  batch: 2
  evals: 2
  digests: 2
  judge: 2
  langfuse: 2
  langflow: 2
  hindsight: 2
  llamaindex: 2
  hermes-eval: 2
  # The named profiles that host the scheduled cron fleet (roles/hermes_agent
  # 150-fleet-health-profiles.yml; the eval profile is already tier 2 above).
  # None of them serves interactive traffic — the chat front door is the
  # default store's gateway and every named profile renders without a Slack
  # socket or dashboard — so tier 2 is what their jobs already are, made
  # structural: the keys join the tier-2 team (&tier-2 + &local), serve only
  # local-class deployments, and inherit the tier-2 policy's emptied fallback
  # maps and long timeouts. The same projection is what
  # hermes_agent_client_timeouts (roles/hermes_agent 21-client-priority.yml)
  # reads, so those stores also pick up the tier-2 client wait budgets.
  # The cron jobs pin a local group through hermes_agent_cron_model
  # (inventory/group_vars/all/00-core.yml). That group's own chain may reach
  # cloud; these keys' local-only classes and emptied fallbacks keep every
  # cron call on a tier-2 local candidate.
  hermes-splunk-admin: 2
  hermes-homelab-admin: 2
  hermes-github-maint: 2
  hermes-orchestrator: 2

llm_router_priority_default_tier: 1

llm_router_priority_effective_key_tiers: >-
  {%- set out = llm_router_priority_key_tiers.copy() -%}
  {%- for key in _llm_router_declared_virtual_keys -%}
  {%- set _ = out.update({key.alias: key.priority_tier | default(
        llm_router_priority_key_tiers.get(key.alias, llm_router_priority_default_tier))}) -%}
  {%- endfor -%}
  {{ out }}

# Shared projection for key creation, reconciliation, and DB role deployments.
llm_router_priority_policy_by_tier: >-
  {%- set out = {} -%}
  {%- set client_timeout = ai_tier_2_client_timeout_seconds | default(
        (ai_tier_2_wait_timeout_seconds | default(43200) | int)
        + (ai_stream_read_timeout_seconds | default(1800) | int)) -%}
  {%- for tier in llm_router_priority_tiers -%}
  {%- set settings = {'enable_tag_filtering': true} -%}
  {%- if tier.tier == 2 -%}
  {%- set settings = settings | combine({'fallbacks': [],
        'context_window_fallbacks': [], 'content_policy_fallbacks': [],
        'timeout': llm_router_tier_2_timeout_seconds}) -%}
  {%- endif -%}
  {%- set _ = out.update({tier.tier | string: {
        'tier': tier.tier, 'priority': tier.priority,
        'client_timeouts': (dict.fromkeys(['read', 'stale', 'api_stale'], client_timeout)
                            if tier.tier == 2 else {}),
        'tags': ['&' ~ tier.team_id] + (['&local'] if tier.tier == 2 else []),
        'router_settings': settings}}) -%}
  {%- endfor -%}
  {{ out }}
