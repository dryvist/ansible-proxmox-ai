---
# --- Z.ai overflow tier (llm-models.d/45-zai.yml) ---------------------------
# An OpenAI-compatible SaaS endpoint on one provider key (ZAI_API_KEY,
# roles/openbao_secrets 10-domains.yml). Reachable as the terminal rungs of
# `review-oss` (55-roles.yml) AND, since the 2026-09-20 shared-continuation
# decision, as a segment of every chain llm_router_hermes_default_fallback_chain
# feeds (35-hermes-cloud.yml) — the primary group, every servable id, every
# alias. No longer review-oss-exclusive; tests/llm_router/test_review_roles.yml
# states the narrower rule that survives (never in a role_deployments chain
# OTHER than review-oss, never in default_fallbacks).
# The GLM Coding Plan is served only at /api/coding/paas/v4 — the plain
# /api/paas/v4 path is pay-as-you-go and 429s "insufficient balance" for a
# key that only holds a coding-plan subscription. Every registered model
# (the free and metered tiers alike) answers on the coding endpoint, so one
# base URL covers the whole zai tier — no per-model split needed.
llm_router_zai_base_url: "https://api.z.ai/api/coding/paas/v4"
llm_router_zai_rpm: 60
llm_router_zai_tpm: 500000
llm_router_zai_max_parallel_requests: 4
llm_router_zai_request_timeout_seconds: 120
# Credentialed ids in registry order: the free tier first, the metered one
# last, so the pair is walked cheapest-first.
llm_router_zai_groups: >-
  {%- set ns = namespace(ids=[]) -%}
  {%- for m in llm_router_zai_models -%}
  {%- set key = llm_router_resolved_credentials.get(m.credential_env, '') -%}
  {%- if key | length > 0 -%}
  {%- set ns.ids = ns.ids + [m.client_model_id] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.ids }}
