---
# --- Z.ai overflow tier (llm-models.d/45-zai.yml) ---------------------------
# An OpenAI-compatible SaaS endpoint on one provider key (ZAI_API_KEY,
# roles/openbao_secrets 10-domains.yml). Reachable ONLY as the terminal rungs
# of `review-oss` (55-roles.yml): never a job path, never in any other
# role, segment or chain — tests/llm_router/test_review_roles.yml holds that.
# The GLM Coding Plan is served only at /api/coding/paas/v4 — the plain
# /api/paas/v4 path is pay-as-you-go and 429s "insufficient balance" for a
# key that only holds a coding-plan subscription. Every registered model
# (the free and metered tiers alike) answers on the coding endpoint, so one
# base URL covers the whole zai tier — no per-model split needed.
llm_router_zai_base_url: "https://api.z.ai/api/coding/paas/v4"
# Deployments served on a flat-rate/subscription api_base have no marginal
# per-call cost — the plan's own quota is the real ceiling, not a dollar
# figure LiteLLM computes from input_cost_per_token/output_cost_per_token
# (which the coding plan doesn't actually charge). A per-deployment
# max_budget on one of these is meaningless and, worse, an outright false
# cutoff once litellm's SPEND estimate (not real spend) crosses it — exactly
# what happened 2026-09-20: zai-glm-5.3-flash's registry-declared
# monthly_budget: 1.67 tripped on estimated spend while the operator's real
# Z.ai plan usage sat in the single digits. ONE list, so a second flat-rate
# base (a future plan) joins this rule instead of a fresh skip condition
# hand-added at every place model-list*.yaml.j2 renders max_budget.
llm_router_flat_rate_api_bases:
  - "{{ llm_router_zai_base_url }}"
llm_router_zai_rpm: 60
llm_router_zai_tpm: 500000
llm_router_zai_max_parallel_requests: 4
llm_router_zai_request_timeout_seconds: 120
# Credentialed ids in registry order: the free tier first, the metered one
# last, so the pair is walked cheapest-first.
llm_router_zai_groups: >-
  {%- set ns = namespace(ids=[]) -%}
  {%- for m in llm_router_zai_models -%}
  {%- set key = bao_local_llm_secrets[m.key_field]
       | default(lookup('env', m.credential_env), true) -%}
  {%- if key | trim | length > 0 -%}
  {%- set ns.ids = ns.ids + [m.client_model_id] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.ids }}
