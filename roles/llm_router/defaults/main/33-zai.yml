---
# --- Z.ai overflow tier (llm-models.d/45-zai.yml) ---------------------------
# An OpenAI-compatible SaaS endpoint on one provider key (ZAI_API_KEY,
# roles/openbao_secrets 10-domains.yml). Reachable ONLY as the terminal rungs
# of `review-oss` (55-roles.yml): never a job path, never in any other
# role, segment or chain — tests/llm_router/test_review_roles.yml holds that.
llm_router_zai_base_url: "https://api.z.ai/api/paas/v4"
llm_router_zai_rpm: 60
llm_router_zai_tpm: 500000
llm_router_zai_max_parallel_requests: 4
llm_router_zai_request_timeout_seconds: 120
# Credentialed ids in registry order: the free tier first, the metered one
# last, so the pair is walked cheapest-first.
llm_router_zai_groups: >-
  {%- set ns = namespace(ids=[]) -%}
  {%- for m in llm_router_zai_models -%}
  {%- set key = bao_local_llm_secrets[m.key_field]
       | default(lookup('env', m.credential_env), true) -%}
  {%- if key | trim | length > 0 -%}
  {%- set ns.ids = ns.ids + [m.client_model_id] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.ids }}
