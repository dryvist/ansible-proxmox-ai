_llm_router_m_hermes_router_ids: "{{ _llm_router_hermes_router_ids_source }}"
_llm_router_m_long_context_alias_ids: "{{ _llm_router_long_context_alias_ids_source }}"
_llm_router_m_zdr_asserted_group_names: "{{ _llm_router_zdr_asserted_group_names_source }}"
_llm_router_m_model_group_aliases: "{{ _llm_router_model_group_aliases_source }}"
_llm_router_m_directly_callable_ladder_names: "{{ _llm_router_directly_callable_ladder_names_source }}"
