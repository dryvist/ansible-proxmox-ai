---
# Live aliases for the materialized router inputs. tasks/assertion-roots.yml
# caches each derived value under its `_llm_router_m_` name with set_fact, once
# per evaluation. A caller that never materializes reads the live expression
# through these aliases, so it always sees current inputs. Nothing pins the live
# names, so a re-materialization recomputes from current inputs, not a stale copy.
_llm_router_m_resolved_credentials: "{{ llm_router_resolved_credentials }}"
_llm_router_m_hermes_local_fallback_models: "{{ llm_router_hermes_local_fallback_models }}"
_llm_router_m_hermes_primary_context_window: "{{ llm_router_hermes_primary_context_window }}"
_llm_router_m_local_fallback_groups: "{{ llm_router_local_fallback_groups }}"
_llm_router_m_hermes_local_narrow_groups: "{{ llm_router_hermes_local_narrow_groups }}"
_llm_router_m_hermes_local_wide_groups: "{{ llm_router_hermes_local_wide_groups }}"
_llm_router_m_registry_zdr_by_model: "{{ llm_router_registry_zdr_by_model }}"
_llm_router_m_deployment_class_by_model: "{{ llm_router_deployment_class_by_model }}"
_llm_router_m_d1_paid_groups_by_class: "{{ llm_router_d1_paid_groups_by_class }}"
_llm_router_m_d1_rungs_by_class: "{{ llm_router_d1_rungs_by_class }}"
_llm_router_m_d1_class_order: "{{ llm_router_d1_class_order }}"
_llm_router_m_d1_ladder_groups: "{{ llm_router_d1_ladder_groups }}"
_llm_router_m_hermes_cloud_fallback_groups: "{{ llm_router_hermes_cloud_fallback_groups }}"
_llm_router_m_hermes_default_fallback_chain: "{{ llm_router_hermes_default_fallback_chain }}"
_llm_router_m_default_fallbacks: "{{ llm_router_default_fallbacks }}"
_llm_router_m_hermes_cloud_models_credentialed: "{{ llm_router_hermes_cloud_models_credentialed }}"
