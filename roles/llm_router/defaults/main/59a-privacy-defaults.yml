---
llm_router_privacy_grants_template: >-
  {{ (role_path | default(_role_dir, true)) }}/templates/privacy-grant-violations.yaml.j2

llm_router_default_team_id: default-settings

llm_router_default_key_generate_params:
  team_id: "{{ llm_router_default_team_id }}"
  models: "{{ ([llm_router_primary_model] + llm_router_d1_standard_key_groups) | unique | list }}"
  metadata:
    tags: ['&zdr', '&sensitivity:sensitive']

# Team model access is seeded through /team/new and /team/update.
llm_router_default_team_settings:
  - team_id: "{{ llm_router_default_team_id }}"
    models: "{{ llm_router_default_key_generate_params.models }}"
    metadata:
      tags: "{{ llm_router_default_key_generate_params.metadata.tags + llm_router_priority_policy_by_tier['1'].tags }}"
    router_settings: "{{ llm_router_priority_policy_by_tier['1'].router_settings }}"
