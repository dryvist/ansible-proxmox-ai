---
llm_router_privacy_grants_template: >-
  {{ (role_path | default(_role_dir, true)) }}/templates/privacy-grant-violations.yaml.j2

llm_router_default_team_id: default-settings

# Priority teams share the registry's ZDR scope unless their input declares models.
# Each team and its -public twin also carry the role names their member keys are
# scoped to: LiteLLM checks the team allowlist as well as the key, and a role is a
# DB deployment, never a rendered group. They also carry the direct and speech route
# names their member keys hold, which no ZDR group names. The key scope stays the
# per-key limit.
llm_router_priority_team_settings: >-
  {%- set out = [] -%}
  {%- for team in llm_router_priority_tiers -%}
  {%- set metadata = team.metadata | default({}) -%}
  {%- if team.privacy_class is defined -%}
  {%- set metadata = metadata | combine({'privacy_class': team.privacy_class}) -%}
  {%- endif -%}
  {%- set _member_models = _llm_router_virtual_keys_without_values | default([]) | selectattr('team_id', 'defined')
        | selectattr('team_id', 'in', [team.team_id, team.team_id ~ '-public'])
        | map(attribute='models', default=[]) | flatten | unique | list -%}
  {%- set _member_roles = (_member_models | select('in', (llm_router_role_deployments | map(attribute='role') | list)
        + llm_router_direct_route_aliases
        + (llm_router_gpu_audio_models | map(attribute='client_model_id') | list))
        | list) if _member_models else [] -%}
  {%- set _ = out.append(team | combine({
        'models': ((team.models | default(llm_router_zdr_asserted_group_names)) + _member_roles) | unique | list,
        'metadata': metadata})) -%}
  {%- set _ = out.append(team | combine({
        'team_id': team.team_id ~ '-public', 'privacy_class': 'public',
        'models': (llm_router_zdr_asserted_group_names + llm_router_zdr_unasserted_terminal_rungs + _member_roles)
                  | unique | list,
        'metadata': metadata | combine({'privacy_class': 'public'})})) -%}
  {%- endfor -%}
  {{ out }}

llm_router_default_key_generate_params:
  team_id: "{{ llm_router_default_team_id }}"
  models: "{{ ([llm_router_primary_model] + llm_router_d1_standard_key_groups) | unique | list }}"
  metadata:
    tags: ['&zdr', '&sensitivity:sensitive']

# Team model access is seeded through /team/new and /team/update.
llm_router_default_team_settings:
  - team_id: "{{ llm_router_default_team_id }}"
    models: "{{ llm_router_default_key_generate_params.models }}"
    metadata:
      tags: "{{ llm_router_default_key_generate_params.metadata.tags + llm_router_priority_policy_by_tier['1'].tags }}"
    router_settings: "{{ llm_router_priority_policy_by_tier['1'].router_settings }}"
