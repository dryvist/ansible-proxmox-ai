---
# --- THE MODEL REGISTRY (single source for every model name) -----------------
# Model names, aliases, tiers and enabled/servable state are written ONCE, in
# the repo-root llm-models.d/ registry. Per-model numeric limits are loaded
# from homelab-contracts and projected onto those entries by registry.yml.
# This file carries only topology the catalog deliberately does not know about
# — base URLs, ports, bearer env names.
#
# One file per tier rather than one file for everything: an agent changing the
# NVIDIA rung reads 30-local-gpu.yml, not every cloud entry as well. Each slice
# declares its own list; the concatenation below is the registry, and its ORDER
# is the rendered order, so a new slice is added here deliberately rather than
# picked up by whatever the directory listing happens to return.
#
# Loaded by tasks/main.yml before the asserts and the render. Anything else that
# needs these vars (tests, CI) loads the same dir; nothing re-types a model id.
llm_router_registry_dir: "{{ role_path | dirname | dirname }}/llm-models.d"

# One fail-closed switch for the Pro6000 profiles; false here for every
# consumer. inventory/group_vars/llm_router_group.yml turns it on for the router
# pool exactly when the inventory has a host in llm_gpu_group.
llm_router_gpu_profiles_enabled: false

llm_router_model_registry: >-
  {{ _llm_registry_large + _llm_registry_light + _llm_registry_cpu_pool
     + _llm_registry_local_gpu
     + (llm_router_gpu_profile_registry | default(_llm_registry_gpu))
     + _llm_registry_opencode + _llm_registry_hermes_cloud
     + _llm_registry_openrouter + _llm_registry_zai }}

# Only active entries reach the rendered config or any derived contract. The
# GPU candidates stay hidden until the single switch above is true; when active,
# the projection includes only llm_active_profile because one endpoint serves
# one selected profile at a time.
# cpu-moe / cpu-9b also require inventory-backed api_base URLs — without them
# the template renders nothing and registry/render parity fails loudly.
llm_router_registry_enabled: >-
  {%- set ns = namespace(out=[]) -%}
  {%- set backends = llm_router_cpu_pool_backend_urls_by_tier | default({}) -%}
  {%- for m in llm_router_model_registry -%}
  {%- if m.tier == 'gpu' -%}
  {%- if llm_router_gpu_profiles_enabled | bool
       and (groups['llm_gpu_group'] | default([]) | length) > 0
       and m.profile == (llm_active_profile | default('')) -%}
  {%- set ns.out = ns.out + [m | combine({'enabled': true, 'servable': true})] -%}
  {%- endif -%}
  {%- elif m.enabled -%}
  {%- if m.tier in ['cpu-moe', 'cpu-9b']
       and (backends[m.tier] | default([]) | length) == 0 -%}
  {%- else -%}
  {%- set ns.out = ns.out + [m] -%}
  {%- endif -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.out }}

# Values a credential can resolve to that are NEVER a real credential, however
# non-empty they render: "local" is the placeholder every local
# OpenAI-compatible backend convention uses for OPENAI_API_KEY (opencode,
# Codex CLI tooling, etc.), and an ambient shell/session that happens to set
# it lands in the SAME `lookup('env', m.credential_env)` fallback every
# provider credential below falls through to when its OpenBao path is
# unseeded — indistinguishable from a real key until the provider's own 401.
# One list, not a per-provider check, because the failure mode is generic:
# ANY credential_env could someday collide with a locally-common placeholder.
llm_router_credential_placeholder_values:
  - local

# ONE resolution for every registry entry that declares a credential_env —
# bao_local_llm_secrets first, the ansible-controller's own environment as
# the fallback, in that order, exactly as every provider file used to
# recompute inline. Keyed by credential_env (not client_model_id): several
# models can share one provider key, and this dict is the single place that
# decides whether that key is actually present, so it is built once here
# rather than re-derived at each of the nine call sites that used to run
# this same three-line expression themselves. Rejects an empty resolution
# AND a placeholder one (above) — a credentialed-tier gate that only checked
# non-empty would treat that placeholder as a live key.
llm_router_resolved_credentials: >-
  {%- set ns = namespace(map={}) -%}
  {%- for m in llm_router_registry_enabled | selectattr('credential_env', 'defined') | list -%}
  {%- if m.credential_env not in ns.map -%}
  {%- set _raw = (bao_local_llm_secrets[m.key_field]
        | default(lookup('env', m.credential_env), true) | trim) -%}
  {%- if (_raw | length > 0) and (_raw not in llm_router_credential_placeholder_values) -%}
  {%- set _discard = ns.map.update({m.credential_env: _raw}) -%}
  {%- endif -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.map }}

# --- Model groups (tier views over the registry) ------------------------------
# Each view is the enabled registry entries for one tier, in registry order.
# The templates iterate these; the entries themselves are registry dicts
# (client_model_id / upstream_model_id / provider / context_window / ...), so a
# model id is never re-typed here.
#
# large: registered under the backend's OWN model id (the serving gate lists
# models under their full MLX repo ids) — no alias names. One deployment each,
# bearer-authed, no cross-tier fallback.
llm_router_large_models: >-
  {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'large') | list }}
# opencode: flat-rate $10/mo subscription tier. Sunk cost exhausted before metered API tiers.
llm_router_opencode_models: >-
  {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'opencode') | list }}
# zai: the Z.ai overflow pair, reachable ONLY through `review-oss`
# (55-roles.yml); no segment or chain derives from this tier.
llm_router_zai_models: >-
  {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'zai') | list }}
# light: the llama-server --models-preset section names, served as-is. Each becomes a CPU
# `llm-light` deployment, plus a same-name GPU `llm-fast` deployment only when
# llm_router_llm_fast_enabled is true — that toggle is what decides whether the
# tier is a load-balanced pair or a single deployment with no standby.
llm_router_light_models: >-
  {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'light') | list }}
# cpu-moe / cpu-9b: CPU llama.cpp pool; each id renders two deployments
# (-50 warm, -51 on demand). Scaler owns LXC power for -51 and both 9B guests.
llm_router_cpu_moe_models: >-
  {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'cpu-moe') | list }}
llm_router_cpu_9b_models: >-
  {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'cpu-9b') | list }}
# vllm: served by the NVIDIA/CUDA guest. Its own tier rather than a `light`
# entry, because the light tier renders a GPU+CPU deployment PAIR sharing a
# model name, and no second backend serves these weights — rendering the pair
# would advertise a standby that does not exist.
# Empty while llm_router_llm_vllm_enabled is false (10-network.yml): the tier
# then renders no deployment and contributes no fallback rung.
llm_router_vllm_models: >-
  {{ (llm_router_registry_enabled | selectattr('tier', 'equalto', 'vllm') | list)
     if llm_router_llm_vllm_enabled | bool else [] }}
# Pro6000: separate physical GPU serving tier. It is inventory-gated like the
# CPU pool so this proxy never advertises a backend without a tofu-tagged host.
llm_router_gpu_models: >-
  {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'gpu') | list }}
llm_router_gpu_profile_aliases: >-
  {%- set ns = namespace(out=[]) -%}
  {%- for m in llm_router_model_registry | selectattr('tier', 'equalto', 'gpu') | list -%}
  {%- set ns.out = ns.out + (m.stable_aliases | default([])) -%}
  {%- endfor -%}
  {{ ns.out }}
llm_router_gpu_models_by_profile: >-
  {%- set ns = namespace(out={}) -%}
  {%- for m in llm_router_gpu_models -%}
  {%- set _ = ns.out.update({m.profile: m.client_model_id}) -%}
  {%- endfor -%}
  {{ ns.out }}
llm_router_gpu_model_aliases_by_profile: >-
  {%- set ns = namespace(out={}) -%}
  {%- for m in llm_router_gpu_models -%}
  {%- for alias in m.stable_aliases | default([]) -%}
  {%- set _ = ns.out.update({m.profile: alias}) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ ns.out }}
llm_router_gpu_small_model: "{{ llm_router_gpu_models_by_profile.get('small', llm_router_routine_model) }}"
llm_router_gpu_medium_a_model: "{{ llm_router_gpu_models_by_profile.get('medium-a', llm_router_primary_model) }}"
llm_router_gpu_medium_b_model: "{{ llm_router_gpu_models_by_profile.get('medium-b', llm_router_hermes_local_4080_id) }}"
llm_router_gpu_max_model: "{{ llm_router_gpu_models_by_profile.get('max', llm_router_primary_model) }}"
# The complexity router targets tagged physical deployments. Stable aliases are
# for callers that select a profile directly; LiteLLM's auto-router needs each
# tier target to resolve to a tagged model-list entry.
llm_router_hermes_gpu_fast_target: >-
  {{ llm_router_gpu_models_by_profile.get('small', llm_router_routine_model) }}
llm_router_hermes_gpu_medium_target: >-
  {{ llm_router_gpu_models_by_profile.get('medium-a', llm_router_primary_model) }}
# hermes-local: a Hermes-fallback-chain rung over a tier's backend that is
# ALSO reachable directly under its own tier/id (e.g. the 4080 vllm guest).
# Rendered alongside that physical tier (same api_base/api_key — see
# config.yaml.j2), but kept a separate tier key so it can carry its own
# fail-fast litellm_params/model_info and opt into the fallback chain without
# duplicating or re-aliasing the physical entry. NOT credential-gated like the
# hermes-cloud tiers below — it is local, not paid egress.
# Empty while llm_router_llm_vllm_enabled is false, with the vllm tier above.
llm_router_hermes_local_models: >-
  {{ (llm_router_registry_enabled | selectattr('tier', 'equalto', 'hermes-local') | list)
     if llm_router_llm_vllm_enabled | bool else [] }}
# The single hermes-local-tier entry (hermes-local-4080), the primary target of
# the fast/subagent/cheap/review DB roles (55-roles.yml). Read from the enabled
# registry rather than the switch-gated view above, so the role rows keep a
# catalogued target while the tier is off; the role seed creates a role only
# once its target is live, as for any other unrendered rung (seed-roles.yml).
llm_router_hermes_local_4080_id: >-
  {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'hermes-local')
     | map(attribute='client_model_id') | list | first }}

# The SAME prefill-derived cap model-list.yaml.j2 applies to every
# vllm/hermes-local deployment: the smaller of the context window and what
# this card can prefill inside the local-rung first-byte budget — computed
# ONCE here so a role pointed at the same backend (55-roles.yml
# _llm_router_role_model_info) can never advertise a bigger window than the
# physical deployment does. Falls back to the raw context_window with no vllm
# host inventoried, same as the template's own no-inventory fallback.
#
# The multiplier is llm_router_local_stream_timeout_seconds (the local-rung
# first-byte/TTFT budget, 40-routing.yml), never
# llm_router_admission_budget_seconds (the busy-slot no-queueing/retry-handoff
# budget) — the two bound different things. llm-models.d/30-local-gpu.yml's
# own litellm_params.stream_timeout for this same deployment stays on
# llm_router_admission_budget_seconds, a separate bound tested by
# test_gpu_rung_admission_matches_backend.yml.
#
# llm_router_prefill_window_floor_tokens (below) is the minimum every entry
# here must clear; roles/llm_router/tasks/assert-prefill-budget-floor.yml
# enforces it.
llm_router_prefill_window_floor_tokens: 2048
_llm_router_vllm_max_input_tokens_by_model: >-
  {%- set ns = namespace(out={}) -%}
  {%- set _vllm_hosts = groups['llm_vllm_group'] | default([]) -%}
  {#- Read from the enabled registry, not the switch-gated views above: a light-tier
      sibling (embedding, reranker) keeps the window it advertises today when the tier is off. -#}
  {%- for m in llm_router_registry_enabled | selectattr('tier', 'in', ['vllm', 'hermes-local']) -%}
  {%- set _cap = ([m.context_window,
        hostvars[_vllm_hosts[0]].llama_cpp_prefill_tokens_per_second | int
          * llm_router_local_stream_timeout_seconds | int] | min)
        if (_vllm_hosts | length > 0) else m.context_window -%}
  {%- set ns.out = ns.out | combine({m.client_model_id: _cap}) -%}
  {%- endfor -%}
  {{ ns.out }}

# Names owned by enabled registry entries after applying an optional route_group.
# Multiple provider deployments may intentionally share one route group.
#
# `free` / `free-zdrless` is the same sharing mechanism under a boolean
# instead of a string: an entry marked `in_free_route: true` contributes
# `free` only when it is a subscription or explicitly ZDR; an absent ZDR
# field goes to `free-zdrless`.
#
# stable_aliases are deliberately NOT folded in here. An alias renders into
# router_settings.model_group_alias and never becomes a model_list entry, so it
# can never appear among the rendered names this set is diffed against —
# including it would only widen the exemption and let a genuinely unregistered
# deployment name slip past the rendered-but-not-registered direction.
llm_router_registry_enabled_route_names: >-
  {%- set ns = namespace(names=[]) -%}
  {%- for m in llm_router_registry_enabled -%}
  {%- set ns.names = ns.names + [m.route_group | default(m.client_model_id)] -%}
  {%- if m.in_free_route | default(false) -%}
  {%- set _free_name = 'free' if (m.subscription | default(false) or m.tier == 'opencode'
        or m.zero_data_retention | default(false)) else 'free-zdrless' -%}
  {%- if _free_name not in ns.names -%}
  {%- set ns.names = ns.names + [_free_name] -%}
  {%- endif -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.names | unique | list }}
