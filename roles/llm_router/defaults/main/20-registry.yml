---
# --- THE MODEL REGISTRY (single source for every model name) -----------------
# Model names, aliases, tiers and enabled/servable state are written ONCE, in
# the repo-root llm-models.d/ registry. Per-model numeric limits are loaded
# from homelab-contracts and projected onto those entries by registry.yml.
# This file carries only topology the catalog deliberately does not know about
# — base URLs, ports, bearer env names.
#
# One or more files per tier rather than one file for everything: an agent
# changing the NVIDIA rung reads 30-local-gpu.yml, not every cloud entry as
# well. Each slice declares its own list; the concatenation below is the
# registry, and its ORDER is the rendered order, so a new slice is added here
# deliberately rather than picked up by whatever the directory listing returns.
#
# Loaded by tasks/main.yml before the asserts and the render. Anything else that
# needs these vars (tests, CI) loads the same dir; nothing re-types a model id.
llm_router_registry_dir: "{{ role_path | dirname | dirname }}/llm-models.d"

# One fail-closed switch for the Pro6000 profiles; false here for every
# consumer. inventory/group_vars/all/ turns it on when a host belongs to
# llm_gpu_group, so both the router and secret-prefetch play see the switch.
llm_router_gpu_profiles_enabled: false

# Studio participation is enabled by default, subject to the load-and-serve gate.
llm_router_studio_profiles_enabled: true

# The small lane remains opt-in and requires the pre-render serving probe.
llm_router_4080_profiles_enabled: false

llm_router_model_registry: >-
  {{ _llm_registry_large + _llm_registry_large_disabled
     + _llm_registry_large_disabled_continued
     + _llm_registry_light + _llm_registry_cpu_pool
     + _llm_registry_local_gpu
     + (llm_router_gpu_profile_registry | default(_llm_registry_gpu))
     + _llm_registry_opencode + _llm_registry_opencode_go_catalog_a
     + _llm_registry_opencode_go_catalog_b + _llm_registry_hermes_cloud
     + _llm_registry_openrouter }}

# One record per llm_gpu_group member: the profile it serves, the co-resident
# profiles it adds, its endpoint host, and its serving port (the member's
# port key or explicit port, else the light lane port). Each member is read from
# its own inventory, so no single member stands in for the group. A member with
# llm_router_gpu_member: false serves through another tier and renders nothing here.
_llm_router_gpu_members_source: >-
  {%- set ns = namespace(out=[]) -%}
  {%- for host in groups.get('llm_gpu_group', [])
       if hostvars[host].get('llm_router_gpu_member', true) | bool -%}
  {%- set ns.out = ns.out + [{
        'host': host,
        'endpoint_host': host ~ '.' ~ llm_router_apex_domain,
        'port': (tofu_data.constants.service_ports[hostvars[host].llm_gpu_serving_api_port_key]
                 if hostvars[host].llm_gpu_serving_api_port_key is defined
                 else hostvars[host].get('llm_gpu_serving_api_port', llm_router_light_port)) | int,
        'active': hostvars[host].get('llm_active_profile', llm_active_profile | default('')),
        'co_resident': hostvars[host].get('llm_gpu_serving_co_resident_profiles', [])}] -%}
  {%- endfor -%}
  {{ ns.out }}
llm_router_gpu_members: "{{ _llm_router_m_gpu_members }}"
llm_router_gpu_active_profiles: "{{ llm_router_gpu_members | map(attribute='active') | list }}"
llm_router_gpu_co_resident_profiles: >-
  {{ llm_router_gpu_members | map(attribute='co_resident') | flatten | unique | list }}

# Audio routes have their own inventory opt-in because Ada is intentionally
# excluded from the ordinary GPU member pool. Only a host explicitly marked
# for audio and declaring speech as a co-resident profile contributes here.
_llm_router_gpu_audio_members_source: >-
  {%- set ns = namespace(out=[]) -%}
  {%- for host in groups.get('llm_gpu_group', [])
       if hostvars[host].get('llm_router_gpu_audio_member', false) | bool
       and 'speech' in hostvars[host].get('llm_gpu_serving_co_resident_profiles', []) -%}
  {%- set _port = (tofu_data.constants.service_ports[hostvars[host].llm_gpu_serving_api_port_key]
        if hostvars[host].llm_gpu_serving_api_port_key is defined
        else hostvars[host].get('llm_gpu_serving_api_port', llm_router_light_port)) | int -%}
  {%- set ns.out = ns.out + [{
        'host': host,
        'endpoint_host': host ~ '.' ~ llm_router_apex_domain,
        'serving_port': _port,
        'speech_port': _port + 1,
        'accelerator': hostvars[host].llm_gpu_accelerator,
        'active': hostvars[host].get('llm_active_profile', llm_active_profile | default('')),
        'co_resident': hostvars[host].get('llm_gpu_serving_co_resident_profiles', [])}] -%}
  {%- endfor -%}
  {{ ns.out }}
llm_router_gpu_audio_members: "{{ _llm_router_gpu_audio_members_source }}"

# Only active entries reach the rendered config or any derived contract. The
# GPU candidates stay hidden until the single switch above is true; when active,
# the projection includes the active profile and explicitly selected
# co-resident profiles, each on its own port.
# cpu-moe / cpu-9b also require inventory-backed api_base URLs — without them
# the template renders nothing and registry/render parity fails loudly.
_llm_router_registry_enabled_source: >-
  {%- set ns = namespace(out=[]) -%}
  {%- set backends = llm_router_cpu_pool_backend_urls_by_tier | default({}) -%}
  {%- for m in llm_router_model_registry -%}
  {%- if m | llm_model_policy_allowed(llm_model_trial_policy_data | default({}), llm_router_local_registry_tiers) -%}
  {%- if m.tier == 'gpu' -%}
  {%- if m.profile == 'speech' -%}
  {%- if (m.mode | default('')) in ['audio_transcription', 'audio_speech']
       and llm_router_gpu_profiles_enabled | bool
       and llm_router_4080_profiles_enabled | bool
       and (llm_router_gpu_audio_members | length) > 0
       and 'speech' in (llm_router_gpu_audio_members | map(attribute='co_resident') | flatten | unique | list) -%}
  {%- set ns.out = ns.out + [m | combine({'enabled': true, 'servable': true})] -%}
  {%- endif -%}
  {%- elif llm_router_gpu_profiles_enabled | bool
       and (groups['llm_gpu_group'] | default([]) | length) > 0
       and m.route_group is defined
       and (m.profile in llm_router_gpu_active_profiles
            or m.profile in llm_router_gpu_co_resident_profiles) -%}
  {%- set ns.out = ns.out + [m | combine({'enabled': true, 'servable': true})] -%}
  {%- endif -%}
  {%- elif m.tier == 'vllm' -%}
  {%- if m.enabled | bool
       and llm_router_llm_vllm_enabled | bool -%}
  {%- set ns.out = ns.out + [m] -%}
  {%- endif -%}
  {%- elif m.enabled -%}
  {%- if m.tier in ['cpu-moe', 'cpu-9b']
       and (backends[m.tier] | default([]) | length) == 0 -%}
  {%- else -%}
  {%- set ns.out = ns.out + [m] -%}
  {%- endif -%}
  {%- endif -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.out }}
llm_router_registry_enabled: "{{ _llm_router_m_registry_enabled }}"

# One shared denylist for benchmark-only identities and every name that could
# route to them. Admin model-list rendering still uses the full registry.
llm_router_benchmark_only_model_names: >-
  {%- set ns = namespace(names=[]) -%}
  {%- for entry in llm_router_registry_enabled
        if entry.benchmark_only | default(false) | bool -%}
  {%- set ns.names = ns.names + [entry.client_model_id] -%}
  {%- if entry.route_group is defined -%}
  {%- set ns.names = ns.names + [entry.route_group] -%}
  {%- endif -%}
  {%- if entry.fallback_group is defined -%}
  {%- set ns.names = ns.names + [entry.fallback_group] -%}
  {%- endif -%}
  {%- set ns.names = ns.names + (entry.stable_aliases | default([]))
        + (entry.direct_route_aliases | default([])) -%}
  {%- endfor -%}
  {{ ns.names | unique | list }}
