---
# Each app owns its process shape once; tier rows select the token field and
# tools. The Vikunja entity tools multiplex read and write subcommands, so the
# read tier relies on its app-scoped token to deny writes.
llm_router_app_agent_apps:
  vikunja:
    command: /usr/bin/npx
    args:
      - --yes
      - "@democratize-technology/vikunja-mcp@{{ llm_router_app_agent_vikunja_mcp_version }}"
    url_env: VIKUNJA_URL
    url_field: VIKUNJA_MCP_URL
    token_env: VIKUNJA_API_TOKEN
  zammad:
    command: "{{ llm_router_mcp_zammad_command }}"
    args: "{{ llm_router_mcp_zammad_args }}"
    url_env: ZAMMAD_URL
    url_field: ZAMMAD_MCP_URL
    token_env: ZAMMAD_HTTP_TOKEN
  # The tracker serves its own remote MCP endpoint, so the address is derived, not stored.
  youtrack:
    transport: http
    url: "https://youtrack.{{ llm_router_subdomain }}/mcp"
    token_env: YOUTRACK_MCP_TOKEN
  # Semaphore UI runs the Ansible converges. The address is derived; its API
  # path is added by the server.
  semaphore:
    command: "{{ llm_router_venv }}/bin/uvx"
    args:
      - --from
      - "semaphore-mcp=={{ llm_router_app_agent_semaphore_mcp_version }}"
      - semaphore-mcp
    url: "https://semaphore.{{ llm_router_subdomain }}"
    url_env: SEMAPHORE_URL
    token_env: SEMAPHORE_API_TOKEN

# renovate: datasource=pypi depName=semaphore-mcp
llm_router_app_agent_semaphore_mcp_version: "1.0.6"

llm_router_app_agent_tiers:
  - id: vikunja-read
    app: vikunja
    tier: read
    token_field: VIKUNJA_AGENT_READ_TOKEN
    allowed_tools:
      - vikunja_tasks
      - vikunja_projects
      - vikunja_labels
      - vikunja_filters
  - id: vikunja-write
    app: vikunja
    tier: write
    token_field: VIKUNJA_AGENT_WRITE_TOKEN
    allowed_tools:
      - vikunja_tasks
      - vikunja_projects
      - vikunja_labels
      - vikunja_filters
  # The Hermes vikunja-clerk profile's own tier: a dedicated token with no delete action and read-only
  # projects and labels. Saved filters stay out; they live in the MCP server's memory.
  - id: vikunja-clerk
    app: vikunja
    tier: write
    token_field: VIKUNJA_AGENT_CLERK_TOKEN
    allowed_tools:
      - vikunja_tasks
      - vikunja_projects
      - vikunja_labels
  - id: zammad-write
    app: zammad
    tier: write
    token_field: ZAMMAD_AGENT_WRITE_TOKEN
    allowed_tools:
      - zammad_get_current_user
      - zammad_search_tickets
      - zammad_get_ticket
      - zammad_create_ticket
      - zammad_update_ticket
      - zammad_add_article
      - zammad_add_ticket_tag
  - id: youtrack-write
    app: youtrack
    tier: write
    token_field: YOUTRACK_AGENT_WRITE_TOKEN
    # Clerk v1 (search, read, comment, log work, tag, link, KB read): no create, field
    # update or article write, so closing an issue has no tool path. Later slices add them.
    allowed_tools:
      - search_issues
      - get_issue
      - get_issue_comments
      - add_issue_comment
      - get_issue_fields_schema
      - find_projects
      - get_project
      - find_user
      - link_issues
      - manage_issue_tags
      - log_work
      - get_saved_issue_searches
      - get_current_user
      - search_articles
      - get_article
  # Runs existing templates and reads their logs. The server's create, update,
  # delete, key, user, restart and bulk-stop tools stay out; the Semaphore user
  # behind the token holds only the task_runner role.
  - id: semaphore-write
    app: semaphore
    tier: write
    token_field: SEMAPHORE_AGENT_WRITE_TOKEN
    allowed_tools:
      - list_projects
      - list_templates
      - get_template
      - list_tasks
      - filter_tasks
      - get_task
      - get_task_raw_output
      - get_waiting_tasks
      - get_latest_failed_task
      - analyze_task_failure
      - run_task
      - stop_task

# Tiers whose keys may only go to roster entries with trust_tier trusted.
llm_router_app_agent_trusted_tiers: [write, admin]

# Required while the Vikunja read tier is enabled (tasks/assert-app-agents.yml):
# a project outside the read user's allowlist, set in inventory, and the
# allowlisted project IDs the apps converge publishes beside the read token.
llm_router_app_agent_probe_vikunja_forbidden_project_id: ""
llm_router_app_agent_vikunja_read_allowlist: >-
  {{ ((openbao_secrets_by_domain | default({}, true))
      .get('app-agent-vikunja-read', {})).get('VIKUNJA_AGENT_READ_ALLOWLIST', '[]')
     | default('[]', true) | from_json | map('int') | list }}

# Private resolved credentials are only consumed by the process env template
# and key permission projection. Public docs derive names and fields only.
# A tier is on only with its token and a key holder: its own roster entry, or
# a locked Hermes profile. A token nobody holds a key for leaves the tier off.
_llm_router_app_agent_matrix: >-
  {%- set ns = namespace(rows=[]) -%}
  {%- set _profile_servers = hermes_agent_profiles | default([])
        | selectattr('locked', 'defined') | selectattr('locked')
        | map(attribute='mcp') | flatten | list -%}
  {%- for tier in llm_router_app_agent_tiers -%}
  {%- set app = llm_router_app_agent_apps[tier.app] -%}
  {%- set holder = 'roster' if tier.id in (ai_agents | default({}))
        else ('profile' if (tier.id | replace('-', '_')) in _profile_servers else '') -%}
  {%- set reader_domain = 'app-agent-' ~ tier.id -%}
  {%- set reader_secrets = (openbao_secrets_by_domain | default({}, true)).get(reader_domain, {}) -%}
  {%- set token = reader_secrets.get(tier.token_field, '')
       | default('', true) | string | trim -%}
  {%- set token_env_key = 'LLM_ROUTER_APP_' ~ (tier.id | upper | regex_replace('[^A-Z0-9]', '_')) ~ '_TOKEN' -%}
  {%- set url_env_key = 'LLM_ROUTER_APP_' ~ (tier.id | upper | regex_replace('[^A-Z0-9]', '_')) ~ '_URL' -%}
  {%- set row = tier | combine(app, recursive=true) | combine({
        'server_id': tier.id | replace('-', '_'),
        'reader_domain': reader_domain,
        'token_value': token,
        'token_env_key': token_env_key,
        'url_env_key': url_env_key,
        'url_value': (app.url if app.url is defined
                      else (bao_local_llm_secrets | default({}, true)).get(app.url_field, ''))
          | default('', true) | string | trim,
        'holder': holder,
        'enabled': token | length > 0 and holder | length > 0,
      }, recursive=true) -%}
  {%- set ns.rows = ns.rows + [row] -%}
  {%- endfor -%}
  {{ ns.rows }}

# Tier id -> the router key of the locked profile that holds it. The boundary
# probes call a profile-held tier with this key.
_llm_router_app_agent_profile_holder_keys: >-
  {%- set out = {} -%}
  {%- for row in _llm_router_app_agent_matrix | selectattr('holder', 'equalto', 'profile') -%}
  {%- set _keys = _llm_router_hermes_profile_keys | selectattr('enabled')
        | selectattr('object_permission.mcp_servers', 'equalto', [row.server_id]) | list -%}
  {%- if _keys -%}{%- set _ = out.update({row.id: _keys[0].value}) -%}{%- endif -%}
  {%- endfor -%}
  {{ out }}

# The committed Markdown table is a projection of the same tier rows used by
# the templates and keys. It deliberately contains no resolved credentials.
llm_router_app_agent_matrix_markdown: |-
  # App-agent matrix

  Generated from `llm_router_app_agent_tiers`; a test fails when this file drifts.
  {% for row in llm_router_app_agent_tiers %}

  ## {{ row.id }}

  - App: {{ row.app }}
  - Tier: {{ row.tier }}
  - MCP server: {{ row.id | replace('-', '_') }}
  - OpenBao token field: {{ row.token_field }}
  {% if llm_router_app_agent_apps[row.app].transport | default('stdio') == 'http' %}
  - Transport: HTTP
  {% endif %}
  - Allowed tools:
  {% for tool in row.allowed_tools %}
    - {{ tool }}
  {% endfor %}
  {% endfor %}
