---
# A key scoped to a ROLE must also reach every group that role's chain walks:
# the proxy checks the key's model list for the fallback target too, so a key
# holding only `review-private` is refused the moment the 4080 hands over.
# Derived from llm_router_role_deployments, never listed: a chain edit widens
# the keys with it. seed-keys.yml mints and reconciles from this list.
#
# A key DECLARING hermes_brain_model's entry point gets the same treatment,
# widened to _llm_router_directly_callable_ladder_names (56-virtual-keys.yml)
# rather than a role's model + fallbacks — a named Hermes profile key that
# only ever names the entry point still needs the whole chain, since a
# request through it walks every hop the same as the full-scope key does.
# Checked against the key's OWN declared list, before role-widening below —
# a key that only reaches the entry point transitively, as one rung of a
# role's own chain (e.g. review-private's own last-resort fallback), is not
# thereby granted the rest of a chain it was never scoped to call directly.
#
# A key marked `zdr_only: true` then has every group backed by a
# zero_data_retention: false registry entry removed from that widened list.
# enforce_fallback_model_access re-checks the key on every hop, so a chain
# rung the key does not hold is refused, never reached: the key, not the
# caller, guarantees its traffic only lands on ZDR backends.
llm_router_virtual_keys: >-
  {%- set out = [] -%}
  {%- for k in _llm_router_declared_virtual_keys -%}
  {%- set ns = namespace(models=k.models | list) -%}
  {%- if k.models | select('in', _llm_router_directly_callable_ladder_names) | list | length > 0 -%}
  {%- set ns.models = ns.models + _llm_router_directly_callable_ladder_names -%}
  {%- endif -%}
  {%- for d in llm_router_role_deployments if d.role in k.models -%}
  {%- set ns.models = ns.models + [d.model] + (d.fallbacks | list) -%}
  {%- endfor -%}
  {%- if k.zdr_only | default(false) -%}
  {%- set ns.models = ns.models | reject('in', llm_router_zdr_false_group_names) | list -%}
  {%- endif -%}
  {%- set _ = out.append(k | combine({'models': ns.models | unique | list})) -%}
  {%- endfor -%}
  {{ out }}

# Every group name backed by a zero_data_retention: false registry entry,
# named the way the rendered model list names it (model-list-free.yaml.j2
# for the free route, fallback_group/route_group/client_model_id otherwise).
# Same derivation tests/llm_router/test_hindsight_key_zdr_isolation.yml uses.
llm_router_zdr_false_group_names: >-
  {%- set ns = namespace(names=[]) -%}
  {%- for m in llm_router_registry_enabled
        if (m.zero_data_retention is defined) and not m.zero_data_retention -%}
  {%- set ns.names = ns.names + [m.client_model_id,
        'free-zdrless' if (m.in_free_route | default(false))
        else (m.fallback_group | default(m.route_group, true) | default(m.client_model_id, true))] -%}
  {%- endfor -%}
  {{ ns.names | unique | list }}
