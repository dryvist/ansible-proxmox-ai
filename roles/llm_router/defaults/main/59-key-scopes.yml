---
# A key scoped to a ROLE must also reach every group that role's chain walks.
# Consumer keys may declare allowed_classes; those add only the catalog-backed
# rungs in those classes, and role chains are reduced to the same class set.
#
# An entry-point key gets its own allowed class rungs; a key that only reaches
# an entry point transitively through a role is not widened to unrelated rungs.
#
# Deployment tags follow the registry tier and privacy evidence. Local tiers
# are ZDR by construction; every other deployment needs an explicit registry
# assertion to carry `zdr`. An absent field is never a ZDR assertion.
# Aggregate after every declaration file has loaded. `56-virtual-keys.yml`
# precedes the split workstation declarations alphabetically, so placing this
# here avoids an order-dependent undefined value in include_vars dir.
_llm_router_declared_virtual_keys: >-
  {{ _llm_router_hermes_profile_keys + _llm_router_static_virtual_keys
     + _llm_router_target_virtual_keys
     + (_llm_router_workstation_virtual_keys
        | map('combine', {'owner_filter': false}) | list)
     + _llm_router_agent_keys }}

# Names are declared before their OpenBao sources exist, but the create loop
# sees only enabled keys. This projection drives the contract and report.
llm_router_disabled_virtual_keys: >-
  {{ ((_llm_router_declared_virtual_keys
       | selectattr('enabled', 'defined')
       | rejectattr('enabled', 'truthy') | map(attribute='alias') | list)) | unique | list }}

llm_router_local_registry_tiers: [local-large, light, vllm, gpu, hermes-local, cpu-moe, cpu-9b]
llm_router_registry_zdr_by_model: >-
  {%- set ns = namespace(states={}) -%}
  {%- set _as_of = llm_router_opencode_zdr_as_of
        | default(now(utc=true, fmt='%Y-%m-%d')) | string -%}
  {%- for m in llm_router_registry_enabled -%}
  {%- set _expiry = m.zero_data_retention_expires | default('') | string -%}
  {%- set _zdr = (m.zero_data_retention | default(false) | bool)
        or (_expiry | length > 0 and _as_of <= _expiry) -%}
  {%- set _ = ns.states.update({m.client_model_id: _zdr}) -%}
  {%- endfor -%}
  {{ ns.states }}

llm_router_deployment_class_by_model: >-
  {%- set ns = namespace(classes={}) -%}
  {%- set _zdr_by_model = _llm_router_m_registry_zdr_by_model -%}
  {%- for m in llm_router_registry_enabled -%}
  {%- set _class = 'local' if m.tier in llm_router_local_registry_tiers
        else 'sub' if (m.subscription | default(false) or m.tier == 'opencode')
        else 'free' if (m.in_free_route | default(false)
                        or m.client_model_id.endswith(':free'))
        else 'paid-zdr' if _zdr_by_model[m.client_model_id]
        else 'retains' -%}
  {%- set _ = ns.classes.update({m.client_model_id: _class}) -%}
  {%- endfor -%}
  {{ ns.classes }}

# The first tag is the deployment's single class. `zdr` is evidence, separate
# from cost class; non-ZDR subscription/free deployments also carry `retains`
# so a negative tag constraint can reject them without changing that class.
# Sensitivity tags are a separate routing dimension: every physical rung
# accepts public data, only local or explicitly-ZDR non-free rungs accept
# sensitive data, and only local rungs accept PII. Virtual auto-router entries
# carry all three classes so LiteLLM can select a class-compatible physical
# deployment after its native classifier chooses a tier.
llm_router_deployment_tags_by_model: >-
  {%- set ns = namespace(tags={}) -%}
  {%- set _class_by_model = _llm_router_m_deployment_class_by_model -%}
  {%- set _zdr_by_model = _llm_router_m_registry_zdr_by_model -%}
  {%- for m in llm_router_registry_enabled -%}
  {%- set _class = _class_by_model[m.client_model_id] -%}
  {%- set _tags = [_class] -%}
  {%- if _class == 'local' or (_class != 'free' and _zdr_by_model[m.client_model_id]) -%}
  {%- set _tags = _tags + ['zdr'] -%}
  {%- elif _class in ['sub', 'free'] -%}
  {%- set _tags = _tags + ['retains'] -%}
  {%- endif -%}
  {%- set _tags = _tags + ['sensitivity:public'] -%}
  {%- if _class == 'local' -%}
  {%- set _tags = _tags + ['sensitivity:sensitive', 'sensitivity:pii'] -%}
  {%- elif _class != 'free' and _zdr_by_model[m.client_model_id] -%}
  {%- set _tags = _tags + ['sensitivity:sensitive'] -%}
  {%- endif -%}
  {%- set _ = ns.tags.update({m.client_model_id: _tags}) -%}
  {%- endfor -%}
  {{ ns.tags }}

# Full rendered tags are keyed by model and registry tier: one client model can
# have physical deployments in multiple local tiers (for example, light and
# vLLM), and those must not collapse into one telemetry tier. Policy tags stay
# in the model-only map above; these registry-entry tags add telemetry labels.
llm_router_deployment_tags_by_entry: >-
  {%- set ns = namespace(tags={}) -%}
  {%- set _class_by_model = _llm_router_m_deployment_class_by_model -%}
  {%- set _tags_by_model = llm_router_deployment_tags_by_model -%}
  {%- for m in llm_router_registry_enabled -%}
  {%- set _class = _class_by_model[m.client_model_id] -%}
  {%- set _billing_class = 'subscription' if _class == 'sub'
        else 'free' if _class == 'free'
        else 'local' if _class == 'local'
        else 'paid' -%}
  {%- set _tags = _tags_by_model[m.client_model_id]
        + ['telemetry_tier_' ~ m.tier,
           'telemetry_billing_class_' ~ _billing_class] -%}
  {%- set _ = ns.tags.update({m.client_model_id ~ '|' ~ m.tier: _tags}) -%}
  {%- endfor -%}
  {%- if llm_router_large_passthrough_enabled | bool -%}
  {%- set _ = ns.tags.update({'*|local-large': ['local', 'zdr',
        'sensitivity:public', 'sensitivity:sensitive', 'sensitivity:pii',
        'telemetry_tier_local-large', 'telemetry_billing_class_local']}) -%}
  {%- endif -%}
  {{ ns.tags }}

# Every group name backed by a zero_data_retention: false registry entry,
# named by its fallback_group, route_group, or client_model_id.
# Same derivation tests/llm_router/test_hindsight_key_zdr_isolation.yml uses.
llm_router_zdr_false_group_names: >-
  {%- set ns = namespace(names=[]) -%}
  {%- for m in llm_router_registry_enabled
        if ((m.zero_data_retention is defined or m.zero_data_retention_expires is defined)
            and not _llm_router_m_registry_zdr_by_model[m.client_model_id]) -%}
  {%- set ns.names = ns.names + [m.client_model_id,
        m.fallback_group | default(m.route_group, true) | default(m.client_model_id, true)] -%}
  {%- endfor -%}
  {{ ns.names | unique | list }}

# Every group name whose entries are local or explicitly ZDR and are not in
# the free class. Any missing or false cloud assertion is retaining. Names are
# spelled the way the rendered model list spells them (client id, route group,
# fallback group).
_llm_router_zdr_asserted_group_names_source: >-
  {%- set ns = namespace(ok=[], bad=[]) -%}
  {%- for m in llm_router_registry_enabled -%}
  {%- set _names = [m.client_model_id] + ([m.route_group] if m.route_group is defined else [])
        + ([m.fallback_group] if m.fallback_group is defined else []) -%}
  {%- if (m.tier in llm_router_local_registry_tiers or m.tier == 'hermes-router'
          or _llm_router_m_registry_zdr_by_model[m.client_model_id])
        and _llm_router_m_deployment_class_by_model[m.client_model_id] != 'free' -%}
  {%- set ns.ok = ns.ok + _names -%}
  {%- else -%}
  {%- set ns.bad = ns.bad + _names -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.ok | difference(ns.bad) | unique | list }}
llm_router_zdr_asserted_group_names: "{{ _llm_router_m_zdr_asserted_group_names }}"

# Groups a private Hermes key may name or reach. Keep the original Hermes
# entrypoint and its aliases, in-estate models, and registry groups whose every deployment has
# asserted ZDR. Exclude free and retaining classes even when a free provider
# accepts an OpenRouter `zdr:true` request.
_llm_router_private_zdr_model_scope: >-
  {%- set _tags_by_model = llm_router_deployment_tags_by_model -%}
  {%- set _zdr_asserted_groups = llm_router_zdr_asserted_group_names -%}
  {%- set _zdr_false_groups = llm_router_zdr_false_group_names -%}
  {%- set _zdr_unasserted = llm_router_zdr_unasserted_terminal_rungs -%}
  {%- set ns = namespace(names=[hermes_brain_model]
        + (llm_router_model_group_aliases | dict2items
           | selectattr('value', 'equalto', hermes_brain_model)
           | map(attribute='key') | list)) -%}
  {%- for m in llm_router_registry_enabled -%}
  {%- set _tags = _tags_by_model[m.client_model_id] -%}
  {%- if 'zdr' in _tags and 'free' not in _tags and 'retains' not in _tags -%}
  {%- set ns.names = ns.names + [m.client_model_id] -%}
  {%- if m.route_group is defined
        and (m.tier in llm_router_local_registry_tiers or m.route_group in _zdr_asserted_groups) -%}
  {%- set ns.names = ns.names + [m.route_group] -%}
  {%- endif -%}
  {%- if m.fallback_group is defined
        and (m.tier in llm_router_local_registry_tiers or m.fallback_group in _zdr_asserted_groups) -%}
  {%- set ns.names = ns.names + [m.fallback_group] -%}
  {%- endif -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.names | unique
     | reject('in', _zdr_false_groups + _zdr_unasserted)
     | list }}

# All registry/fallback names that are not safe for a ZDR-only key, including
# free-class names even when a free provider has a ZDR assertion.
llm_router_zdr_unasserted_terminal_rungs: >-
  {%- set ns = namespace(names=llm_router_external_terminal_rungs | list) -%}
  {%- set _zdr_by_model = _llm_router_m_registry_zdr_by_model -%}
  {%- set _class_by_model = _llm_router_m_deployment_class_by_model -%}
  {%- for m in llm_router_registry_enabled -%}
  {%- set _names = [m.client_model_id] + ([m.route_group] if m.route_group is defined else [])
        + ([m.fallback_group] if m.fallback_group is defined else []) -%}
  {%- if (m.tier not in llm_router_local_registry_tiers and not _zdr_by_model[m.client_model_id])
        or _class_by_model[m.client_model_id] == 'free' -%}
  {%- set ns.names = ns.names + _names -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.names | reject('in', llm_router_zdr_asserted_group_names) | unique | list }}
