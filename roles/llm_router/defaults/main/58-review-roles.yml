---
# EXTERNAL TERMINAL RUNGS, cost order, credential-gated: the subscription
# rung, then every paid cloud rung in registry order — ending on the provider
# API-key rung (codex-api). Every chat ladder below ends with this list, and
# router_settings.default_fallbacks carries it for any name that has no
# ladder of its own, so no request can dead-end on a busy local rung.
#
# The FREE cloud rungs are derived here but sit in NO ladder: measured on the
# log platform, a free endpoint refuses the ladder's requests on the
# provider's parameter and data-policy filters, gates agentic callers, and
# the free key hits its daily cap — a rung that answers 404/403 every time
# only spends the walk. Keep them out until a rung is measured answering.
llm_router_external_free_rungs: >-
  {{ (llm_router_hermes_cloud_free_groups + llm_router_openrouter_free_groups) | unique | list }}
llm_router_external_paid_rungs: >-
  {{ (llm_router_hermes_cloud_paid_groups + llm_router_hermes_cloud_api_key_groups) | unique | list }}
# The subscription rung (36-hermes-cloud-segments.yml) sits between free and
# paid: a metered rung is reached only after the subscription answers 429.
llm_router_external_subscription_rungs: "{{ llm_router_hermes_cloud_subscription_groups | unique | list }}"
llm_router_external_terminal_rungs: >-
  {{ llm_router_external_subscription_rungs + llm_router_external_paid_rungs }}
llm_router_default_fallbacks: "{{ llm_router_external_terminal_rungs }}"

# ONE variable for the whole shared external continuation (2026-09-20
# operator decision, 35-hermes-cloud.yml): the Z.ai pair, the ZDR paid
# OpenRouter group, then the subscription/API-key terminal every chain
# already ends in — exactly the four things the operator named, NOT
# llm_router_external_terminal_rungs' full paid segment (that also carries
# hermes-cloud-alibaba/hermes-cloud-gemini, a separate, older
# provider-diverse-value feature with no relation to this continuation).
# Filtering llm_router_hermes_cloud_paid_groups down to the one matching
# name, rather than typing 'hermes-cloud-openrouter' as a fresh literal,
# keeps this credential-gated the same way every other member already is —
# renders empty the moment OPENROUTER_HERMES_KEY is unseeded.
#
# ORDER MATTERS beyond membership: 37-fallback-entry-points.yml's chain
# composition still references llm_router_zai_groups directly for the
# pre-free_zdrless slot (unaffected here); 58-review-roles.yml's own
# `llm_router_external_rung_own_fallbacks` below walks THIS list to derive
# each external rung's own fallback entry as "the remainder after itself" —
# so a member missing from this list, or reordered, changes the escape path
# litellm 1.98's nested fallback takes for that rung when IT fails.
llm_router_shared_external_continuation: >-
  {{ (llm_router_zai_groups
      + (llm_router_hermes_cloud_paid_groups | select('equalto', 'hermes-cloud-openrouter') | list)
      + llm_router_external_subscription_rungs
      + llm_router_hermes_cloud_api_key_groups) | unique | list }}

# THE FIX for litellm 1.98's nested-fallback-follows-the-failed-rung's-own-
# chain behavior (router.py::async_function_with_fallbacks): once a walk is
# UNDER an external rung's own name (e.g. it was reached as review-oss's
# second attempt, or as hermes-default's chain advanced to it), a further
# failure on THAT rung consults the rung's OWN key in the fallbacks map, not
# the chain that reached it. Before this fix every non-local group's own key
# pointed at [llm_router_primary_model] (config.yaml.j2's per-group loop) —
# correct for an ordinary cloud rung (a request the primary refused for a
# non-size reason CAN often be served by the primary), but wrong for a
# member of the shared external continuation specifically: the primary is
# capped narrower than these rungs exist to serve in the first place (that
# is why the caller escalated past it), so pointing back at it just re-hits
# the same cap. The correct continuation is what is left of THIS list after
# the failing rung, so the walk keeps escalating instead of doubling back.
#
# One dict, keyed by rung name, built by index rather than hand-listed pairs
# — a future member added to llm_router_shared_external_continuation gets
# its own correct tail automatically, with no second place to update.
llm_router_external_rung_own_fallbacks: >-
  {%- set ns = namespace(map={}) -%}
  {%- for _name in llm_router_shared_external_continuation -%}
  {%- set _idx = llm_router_shared_external_continuation.index(_name) -%}
  {%- set _discard = ns.map.update({_name: llm_router_shared_external_continuation[_idx + 1 :]}) -%}
  {%- endfor -%}
  {{ ns.map }}

# ALL of config.yaml.j2's per-group entries, one lookup — a continuation
# member gets its own remainder above, every other non-local group keeps the
# pre-existing "recovers to local" default. Kept as its own var (rather than
# a ternary inline in the template) purely to keep that template's per-file
# token budget clear.
llm_router_hermes_own_fallback_by_group: >-
  {%- set ns = namespace(map={}) -%}
  {%- for _group in llm_router_hermes_default_fallback_chain
        if not _group.startswith('hermes-local') -%}
  {%- set _discard = ns.map.update({_group:
        llm_router_external_rung_own_fallbacks[_group]
        if _group in llm_router_external_rung_own_fallbacks
        else [llm_router_primary_model]}) -%}
  {%- endfor -%}
  {{ ns.map }}

# REVIEW ROLES — local first, always. `review-oss` overflows to the Z.ai
# pair (33-zai.yml) — still no free rung (see above) — and, if the pair
# itself fails (both members busy, or the paid member's plan/quota is
# exhausted), on to the same paid terminal every other public chain ends
# in. That escape is a single conditional, not a hand-appended list: it
# fires only when the chain's own last rung is not already one of
# llm_router_external_terminal_rungs, so a chain that already ends in a
# subscription/paid rung (subagent/fast/judge/cheap above) is untouched,
# and review-oss stops escaping the moment its own terminal changes to
# something already covered.
# `review-private` may leave the estate ONLY for the Codex rungs: the
# subscription first, the API key last — no OpenRouter, no free tier, no
# Z.ai, ever. Until a Codex rung is credentialed it renders local-only and
# fails fast; tests/llm_router/test_review_roles.yml states both contracts.
_llm_router_review_oss_chain: >-
  {%- set _chain = [llm_router_primary_model] + llm_router_zai_groups -%}
  {{ _chain + (llm_router_external_paid_rungs
               if (_chain | length > 1
                   and _chain[-1] not in llm_router_external_terminal_rungs)
               else []) }}
_llm_router_review_private_chain: >-
  {{ [llm_router_primary_model] + llm_router_external_subscription_rungs
     + llm_router_hermes_cloud_api_key_groups }}
