---
# EXTERNAL TERMINAL RUNGS, cost order, credential-gated: the subscription
# rung, then every paid cloud rung in registry order — ending on the provider
# API-key rung (codex-api). Every chat ladder below ends with this list, and
# router_settings.default_fallbacks carries it for any name that has no
# ladder of its own, so no request can dead-end on a busy local rung.
#
# The FREE cloud rungs are derived here but sit in NO ladder: measured on the
# log platform, a free endpoint refuses the ladder's requests on the
# provider's parameter and data-policy filters, gates agentic callers, and
# the free key hits its daily cap — a rung that answers 404/403 every time
# only spends the walk. Keep them out until a rung is measured answering.
llm_router_external_free_rungs: >-
  {{ (llm_router_hermes_cloud_free_groups + llm_router_openrouter_free_groups) | unique | list }}
llm_router_external_paid_rungs: >-
  {{ (llm_router_hermes_cloud_paid_groups + llm_router_hermes_cloud_api_key_groups) | unique | list }}
# The subscription rung (36-hermes-cloud-segments.yml) sits between free and
# paid: a metered rung is reached only after the subscription answers 429.
llm_router_external_subscription_rungs: "{{ llm_router_hermes_cloud_subscription_groups | unique | list }}"
llm_router_external_terminal_rungs: >-
  {{ llm_router_external_subscription_rungs + llm_router_external_paid_rungs }}
llm_router_default_fallbacks: "{{ _llm_router_m_d1_ladder_groups }}"

# Names with no same-modality external rung to escape to: the two DB-seeded
# "fail FAST" roles (55-roles.yml) plus the git-registry group behind the
# embedding one (a caller can name either). An EXACT fallbacks entry
# short-circuits default_fallbacks in litellm's get_fallback_model_group, so
# a busy/failed call under one of these names never walks the five-rung chat
# ladder above — cross-modality errors an embedding/OCR failure has no
# business paying for, at chat-ladder latency and, for codex-api, spend.
#
# These groups fail fast rather than falling through to the chat fallback
# ladder, because chat and embedding/OCR requests are different modalities.
llm_router_cross_modality_fail_fast_names: >-
  {%- set _groups = [llm_router_embedding_model, llm_router_ocr_model] -%}
  {%- set _aliases = llm_router_model_group_aliases | dict2items
       | selectattr('value', 'in', _groups) | map(attribute='key') | list -%}
  {{ (_groups + _aliases) | unique | list }}

# Every role seeded with an empty fallback list (55-roles.yml) is a caller that
# explicitly wants NO external rung ever, local backend up or down. The same
# short-circuit mechanism as the cross-modality
# names above, but a different reason: not another modality. Derived from the
# role rows rather than typed, so a new empty-fallback role can never be left
# on default_fallbacks (the DB record alone does not stop it: LiteLLM consults
# default_fallbacks for any name with no exact `fallbacks` key). `light` and
# its registry synonyms use the same exact empty-list entry so local exhaustion
# cannot spill into a shared remote chain.
llm_router_light_lane_local_only_names: >-
  {{ ((llm_router_model_group_aliases | dict2items
       | selectattr('key', 'in', dict(light='', fast='', cheap='') | list)
       | map(attribute='key') | list)
      + [llm_router_small_capability_name]) | unique | list }}
llm_router_local_only_fail_fast_names: >-
  {{ ((llm_router_role_deployments
       | selectattr('fallbacks', 'equalto', [])
       | map(attribute='role')
       | reject('in', llm_router_cross_modality_fail_fast_names) | list)
      + llm_router_light_lane_local_only_names
      + (llm_router_ci_luna_groups | default([]))) | unique | list }}

# A role whose chain is non-empty but entirely local (its GPU rung and routine
# rung) is written into the config with that exact chain, the same way the
# fail-fast roles above are, so its local-only property does not depend on the
# seeded fallback record alone. Keys are role names; values are the chains.
# Written only while the GPU route is active: with it inactive the rendered
# config is unchanged, and the fail-fast entries and seeded chains apply.
llm_router_local_only_chains: >-
  {%- set ns = namespace(out={}) -%}
  {%- for d in llm_router_role_deployments
       if llm_router_vllm_medium_route_enabled | bool
          and (d.fallbacks | length > 0)
          and (d.fallbacks | reject('in', llm_router_zdr_asserted_group_names) | list | length == 0) -%}
  {%- set _discard = ns.out.update({d.role: d.fallbacks}) -%}
  {%- endfor -%}
  {{ ns.out }}

# THE FIX for litellm 1.98's nested-fallback-follows-the-failed-rung's-own-
# chain behavior (router.py::async_function_with_fallbacks): once a walk is
# UNDER a group's own name (e.g. hermes-default's chain advanced to it, or
# it was reached as review-oss's second attempt), a further failure on THAT
# group consults the group's OWN key in the fallbacks map, not the chain
# that reached it. Before this fix every non-local group's own key pointed
# at [llm_router_primary_model] (config.yaml.j2's per-group loop) — wrong
# for ANY group in the chain, not only the shared external continuation:
# the interactive caller's first hop past the primary is often
# hermes-cloud-alibaba-routine, and an Alibaba 429 walking its old [primary] entry
# hit the identical cap, one rung earlier.
#
# GENERALIZED: own(X), for every rung X in llm_router_hermes_default_fallback_chain,
# is that same chain's tail after X. Local rungs stay in the tail now that D1
# places subscriptions before on-prem deployments.
#
# ZDR: a group that is ALSO one of the caller-typed entry points
# (llm_router_zdr_entry_point_names, 37-fallback-entry-points.yml) drops the
# retaining free segment from its own tail too, same rule config.yaml.j2
# already applies to every entry point's ladder — a rung promising no data
# leaves the network must never fall through to one making no such promise.
# One dict, built by index rather than hand-listed pairs, keyed by every
# group the chain actually contains — a chain member added or reordered in
# 35-hermes-cloud.yml gets its own correct tail with no second place to
# update, and config.yaml.j2's per-group loop (its only consumer, plus the
# context-window escape below) needs no `else [primary]` branch at all.
_llm_router_hermes_own_fallback_by_group_source: >-
  {%- set ns = namespace(map={}) -%}
  {%- set _chain = _llm_router_m_hermes_default_fallback_chain -%}
  {%- for _group in _chain -%}
  {%- set _idx = _chain.index(_group) -%}
  {%- set _tail = _chain[_idx + 1 :] | list -%}
  {%- if _group in llm_router_zdr_asserted_group_names -%}
  {%- set _tail = _tail | reject('in', llm_router_zdr_unasserted_terminal_rungs) | list -%}
  {%- endif -%}
  {%- set _discard = ns.map.update({_group: _tail}) -%}
  {%- endfor -%}
  {{ ns.map }}
llm_router_hermes_own_fallback_by_group: "{{ _llm_router_m_hermes_own_fallback_by_group }}"

# Keys of the above whose own tail is non-empty — the ones that need a
# context_window_fallbacks escape too (37-fallback-entry-points.yml) and the
# ones a provider-scoped render must still key (test_hermes_provider_keys.yml).
llm_router_chain_groups_with_own_tail: >-
  {{ llm_router_hermes_own_fallback_by_group | dict2items
     | selectattr('value') | map(attribute='key') | list }}

# REVIEW ROLES — `review-oss` starts local and continues through the paid
# terminal rungs. The terminal check prevents appending a second copy when
# the local head already ends on a terminal rung.
# `review-private` may leave the estate only for the CI Luna subscription
# group. It is credential-gated and excluded from shared fallback ladders.
# Stable aliases have independent fallback keys because LiteLLM resolves the
# typed name before its model-group alias. Keep each review chain explicit.
llm_router_review_aliases: >-
  {%- set ns = namespace(aliases={}) -%}
  {%- for _scope in ['local', 'oss', 'private'] -%}
  {%- set _alias = llm_router_model_group_aliases | dict2items
       | selectattr('key', 'match', '^review-.*' ~ _scope ~ '$')
       | map(attribute='key') | first -%}
  {%- set _discard = ns.aliases.update({_scope: _alias}) -%}
  {%- endfor -%}
  {{ ns.aliases }}
llm_router_review_local_fallback_groups: >-
  {{ _llm_router_m_d1_rungs_by_class['local']
     | reject('equalto', llm_router_primary_model) | list }}
llm_router_review_oss_chain: >-
  {%- set _chain = llm_router_review_local_fallback_groups -%}
  {%- set _chain = _chain + llm_router_opencode_fallback_groups -%}
  {#- With no distinct local rung, start at paid rather than indexing an empty chain. -#}
  {{ _chain + (llm_router_external_paid_rungs
               if (_chain | length == 0
                   or _chain[-1] not in llm_router_external_terminal_rungs)
               else []) }}
llm_router_review_private_chain: >-
  {{ llm_router_review_local_fallback_groups + llm_router_ci_luna_groups }}
llm_router_review_local_chain: >-
  {{ llm_router_review_local_fallback_groups }}

# Lane chains project the existing registry classes. Subscription rows enter
# only through their credential-gated registry projection. `long` shares the
# standard chain until a long-context ZDR rung is registered.
llm_router_standard_fallback_chain: >-
  {{ llm_router_d1_zdr_ladder_groups }}
llm_router_critical_fallback_chain: >-
  {{ (llm_router_hermes_cloud_subscription_groups
      + llm_router_d1_rungs_by_class['paid-zdr']) | unique | list }}
# Lane names a caller may request, limited to the names the router serves as
# entry points. The response-header callback (files/callbacks/lane_header.py)
# and the lane-walk probe key both read this list.
# Keep this order: standard, light, critical, long.
llm_router_lane_names: >-
  {{ dict(standard='', light='', critical='', long='').keys()
     | select('in', llm_router_entry_point_names) | list }}
llm_router_entry_point_fallback_overrides: >-
  {%- set ns = namespace(map={
        llm_router_review_aliases.local: llm_router_review_local_chain,
        llm_router_review_aliases.oss: llm_router_review_oss_chain,
        llm_router_review_aliases.private: llm_router_review_private_chain}) -%}
  {#- `medium` (the primary route group) is not listed: local-only scoped keys
      hold it, and tests/llm_router/test_local_first_by_order.yml requires every
      override to be covered by each key naming it. It keeps its prior chain. -#}
  {%- for _name in dict(standard='', default='', long='').keys()
        | select('in', llm_router_entry_point_names) -%}
  {%- set _target = llm_router_model_group_aliases.get(_name, _name) -%}
  {%- set _chain = llm_router_standard_fallback_chain
        | reject('equalto', _target) | list -%}
  {%- set _discard = ns.map.update({_name: _chain}) -%}
  {%- endfor -%}
  {%- for _name in dict(critical='', large='', best='').keys()
        | select('in', llm_router_entry_point_names) -%}
  {%- set _target = llm_router_model_group_aliases.get(_name, _name) -%}
  {%- set _chain = llm_router_critical_fallback_chain
        | reject('equalto', _target) | list -%}
  {%- set _discard = ns.map.update({_name: _chain}) -%}
  {%- endfor -%}
  {{ ns.map }}

# The rendered fallback map is shared with explicitly scoped virtual keys.
# Keeping its entries here lets a key replace one entry without rebuilding the
# global list or changing the order in which the config template writes it.
_llm_router_fallback_map_source: >-
  {%- set ns = namespace(map={}) -%}
  {%- set _default_chain = _llm_router_m_hermes_default_fallback_chain -%}
  {%- set _modality_names = llm_router_cross_modality_fail_fast_names -%}
  {%- set _local_names = llm_router_local_only_fail_fast_names -%}
  {%- set _overrides = llm_router_entry_point_fallback_overrides -%}
  {%- set _aliases = llm_router_model_group_aliases -%}
  {%- set _zdr_names = llm_router_zdr_entry_point_names -%}
  {%- set _zdr_terminal = llm_router_zdr_unasserted_terminal_rungs -%}
  {%- if _default_chain | length > 0 -%}
  {%- set _own = llm_router_hermes_own_fallback_by_group -%}
  {%- for _group in _default_chain -%}
  {%- set _discard = ns.map.update({_group: _overrides.get(_group, _own[_group])}) -%}
  {%- endfor -%}
  {%- for _name in _modality_names -%}
  {%- set _discard = ns.map.update({_name: []}) -%}
  {%- endfor -%}
  {%- for _name in _local_names -%}
  {%- set _discard = ns.map.update({_name: []}) -%}
  {%- endfor -%}
  {%- for _name, _chain in llm_router_local_only_chains.items() -%}
  {%- set _discard = ns.map.update({_name: _chain}) -%}
  {%- endfor -%}
  {%- if llm_router_context_window_wider_groups | length > 0
        or _overrides | length > 0 -%}
  {%- for _name in llm_router_entry_point_names -%}
  {%- if _name not in _default_chain
        and _name not in _modality_names
        and _name not in _local_names -%}
  {%- set _target = _aliases.get(_name, _name) -%}
  {%- set _chain = _overrides.get(
    _name, _default_chain | reject('equalto', _name) | reject('equalto', _target) | list) -%}
  {%- if _name in _zdr_names and _name not in _overrides -%}
  {%- set _chain = _chain | reject('in', _zdr_terminal) | list -%}
  {%- endif -%}
  {%- set _discard = ns.map.update({_name: _chain}) -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endif -%}
  {%- endif -%}
  {{ ns.map }}
llm_router_fallback_map: "{{ _llm_router_m_fallback_map }}"

# Each scoped CI key gets the complete shared map, with only its primary
# capability entry replaced by that key's declared review chain.
llm_router_review_key_fallbacks: >-
  {%- set ns = namespace(private=[], oss=[]) -%}
  {%- set _primary = llm_router_primary_model -%}
  {%- set _private = llm_router_review_private_chain -%}
  {%- set _oss = llm_router_review_oss_chain -%}
  {%- for _name, _chain in llm_router_fallback_map.items() -%}
  {%- set _private_chain = _private if _name == _primary else _chain -%}
  {%- set _oss_chain = _oss if _name == _primary else _chain -%}
  {%- set _discard = ns.private.append({_name: _private_chain}) -%}
  {%- set _discard = ns.oss.append({_name: _oss_chain}) -%}
  {%- endfor -%}
  {{ {'private': ns.private, 'oss': ns.oss} }}

llm_router_review_key_router_settings: >-
  {%- set _fallbacks = llm_router_review_key_fallbacks -%}
  {%- set _aliases = llm_router_model_group_aliases -%}
  {{ {
    'private': {'model_group_alias': _aliases, 'fallbacks': _fallbacks.private},
    'oss': {'model_group_alias': _aliases, 'fallbacks': _fallbacks.oss},
  } }}
