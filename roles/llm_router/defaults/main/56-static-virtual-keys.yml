---
# The one capability the hindsight key may call; the inventory binds it to
# hindsight_retain_model.
llm_router_hindsight_key_model: "{{ llm_router_small_capability_name }}"
_llm_router_hindsight_disabled_model_sentinel: no-default-models

# Static, one-off callers — a literal list here is fine for a fixed set of
# named tools, as opposed to the profile set above, which is genuinely
# derived from another role's data.
_llm_router_static_virtual_keys:
  - alias: open-webui
    value: "{{ bao_apps_secrets.open_webui_llm_router_key | default('', true) }}"
    models: "{{ _llm_router_key_scope_all }}"
    # Full model scope, so it needs the same budget every other full-scope key
    # carries — see assert-budget-backing.yml's full-scope-key assert.
    daily_budget: "{{ _llm_router_key_daily_budget }}"
  # Langfuse's own "litellm-router" LLM connection (llm-connections API):
  # its playground/eval/replay features let an operator pick any model, the
  # same human-facing shape open-webui's key has.
  - alias: langfuse
    value: "{{ bao_apps_secrets.langfuse_llm_router_key | default('', true) }}"
    models: "{{ _llm_router_key_scope_all }}"
    daily_budget: "{{ _llm_router_key_daily_budget }}"
  # Direct inference routes use their own scoped key. Intentionally no
  # daily_budget: repeatable tests should not consume a caller budget.
  - alias: inference-direct-only
    value: >-
      {{ (bao_apps_secrets | default({})).get(
           llm_router_key_catalog_facts.llm_router_key_catalog_source.inference_direct_only_field, '') }}
    enabled: >-
      {{ (bao_apps_secrets | default({})).get(
           llm_router_key_catalog_facts.llm_router_key_catalog_source.inference_direct_only_field, '')
         | string | length > 0 and llm_router_direct_route_aliases | length > 0 }}
    allowed_classes: [local]
    models: "{{ llm_router_direct_route_aliases }}"
    models_authoritative: true
    tags: ['&local', '&zdr', '!free', '!retains']
    metadata:
      purpose: benchmark
    router_settings:
      enable_tag_filtering: true
  # Graph workers use local chat and embedding capabilities only.
  - alias: langgraph
    value: "{{ bao_apps_secrets.langgraph_llm_router_key | default('', true) }}"
    allowed_classes: [local]
    models: "{{ [llm_router_small_model, llm_router_embedding_model] }}"
    models_authoritative: true
  # n8n's LiteLLM Request node, scoped to the local small capability.
  - alias: n8n
    value: "{{ bao_apps_secrets.n8n_llm_router_key | default('', true) }}"
    allowed_classes: [local]
    models: "{{ [llm_router_small_model] }}"
    models_authoritative: true
  # agentgateway's docs-search MCP tool (agentgateway_docker_docs_mcp_*):
  # embedding calls only, no chat/completion access.
  - alias: agentgateway
    value: "{{ bao_apps_secrets.agentgateway_llm_router_key | default('', true) }}"
    models: "{{ [llm_router_embedding_model] }}"
    models_authoritative: true
  # Dify's registered model providers (dify_docker_llm_models) name ids this
  # router does not advertise (a pre-existing mismatch, not fixed here), so a
  # scope built from those names would be unreachable under any key. Full
  # scope is the only shape that doesn't narrow Dify below what it already
  # has on the master key today — same shape as open-webui/langfuse, another
  # admin-managed UI where an operator picks the model.
  - alias: dify
    value: "{{ bao_apps_secrets.dify_llm_router_key | default('', true) }}"
    models: "{{ _llm_router_key_scope_all }}"
    daily_budget: "{{ _llm_router_key_daily_budget }}"
  # llamaindex's RAG indexer (llamaindex_embed_model): embedding calls only.
  - alias: llamaindex
    value: "{{ bao_apps_secrets.llamaindex_llm_router_key | default('', true) }}"
    models: "{{ [llm_router_embedding_model] }}"
    models_authoritative: true
  # Hindsight's background retain (fact extraction) scope: exactly one
  # capability (llm_router_hindsight_key_model); the ZDR/local tags and
  # per-hop key check remain in force.
  - alias: hindsight
    value: "{{ bao_apps_secrets.hindsight_llm_router_key | default('', true) }}"
    allowed_classes: [local]
    models: >-
      {{ [llm_router_hindsight_key_model]
         if (hindsight_service_enabled | default(false) | bool)
         else [_llm_router_hindsight_disabled_model_sentinel] }}
    models_authoritative: true
    tags: ['&zdr', '!free', '!retains']
    router_settings:
      enable_tag_filtering: true
    # 2 replicas × 1 retain slot (HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT) × 60 calls/min (calls >= 1 s) = 120 RPM.
    rpm_limit: 120
  # The metrics scraper. /metrics is authenticated by default and this proxy
  # keeps it that way (60-ops.yml), so the scrape needs a key that nothing else
  # would otherwise issue. Same contract as the two above: the value is
  # generated in the apps domain and merely read here, so this entry is a no-op
  # until that half lands and the scrape config on the observability side is
  # handed the same value.
  #
  # NOT `models: []`. On a key an EMPTY list means ALL models
  # (auth_checks.py, `len(models) == 0` -> all_model_access), so a metrics-only
  # key written the obvious way would be a full-access key with a friendly
  # alias. The sentinel is a non-matching, non-empty allowlist: any
  # completion request is refused.
  #
  # /metrics is an ADMIN-ONLY route for a virtual key unless the key carries
  # `allowed_routes` naming it (route_checks.py, litellm 1.98.0) — without
  # this list the key 401s on every scrape with "Only proxy admin can be
  # used", which a scraper reports as no data. Both spellings: the proxy
  # 307s /metrics to /metrics/ and the check is on the path as requested.
  - alias: prometheus-scrape
    value: "{{ bao_apps_secrets.prometheus_llm_router_key | default('', true) }}"
    models: "{{ ['no-default-models'] }}"
    allowed_classes: [local]
    models_authoritative: true
    allowed_routes: ["/metrics", "/metrics/"]
  # The dashboard reads the active local capabilities through /v2/model/info.
  - alias: glance
    value: "{{ bao_apps_secrets.glance_llm_router_key | default('', true) }}"
    allowed_classes: [local]
    models: "{{ [llm_router_primary_model, llm_router_small_model] }}"
    models_authoritative: true
    allowed_routes: ["/health", "/health/", "/v2/model/info", "/v2/model/info/"]
  # The docs site's scheduled router snapshot reads /v2/model/info for every
  # servable deployment and every seeded role, so its models are both lists. Same read-only routes and
  # apps-domain contract as glance: no-op until seeded, cannot complete a request.
  - alias: docs-router-snapshot
    value: "{{ bao_apps_secrets.docs_router_snapshot_llm_router_key | default('', true) }}"
    models: >-
      {{ (llm_router_all_servable_models
          + (llm_router_role_deployments | map(attribute='role') | list)) | unique | list }}
    allowed_routes: ["/health", "/health/", "/v2/model/info", "/v2/model/info/"]
  # Zammad's AI provider is scoped to the local small capability.
  - alias: zammad
    value: "{{ bao_apps_secrets.zammad_llm_router_key | default('', true) }}"
    allowed_classes: [local]
    models: "{{ [llm_router_small_model] }}"
    models_authoritative: true
  # Private CI: the local capabilities and their ordinary registry aliases, the
  # private and local review aliases, and the review-only CI Luna group. No
  # subscription, paid, free or retaining class is granted, so private source
  # leaves the estate only for CI Luna (58-review-roles.yml).
  # The live model list is replaced with these declared entry points on every
  # converge; old names retire from the key when the Git seed changes.
  - alias: github-actions
    value: "{{ bao_apps_secrets.github_actions_llm_router_key | default('', true) }}"
    allowed_classes: [local]
    models: >-
      {{ ([llm_router_small_model, llm_router_primary_model, llm_router_large_model,
           llm_router_review_aliases.private, llm_router_review_aliases.local]
          + llm_router_ci_local_model_aliases + llm_router_ci_luna_groups)
         | unique | list }}
    models_authoritative: true
    router_settings_ref: private
  # Event-driven automation keys are isolated by flow and the local medium
  # capability, and carry a stable trace identity.
  - alias: github-actions-ci-fix
    value: "{{ bao_apps_secrets.github_actions_ci_fix_llm_router_key | default('', true) }}"
    allowed_classes: [local]
    models: "{{ [llm_router_primary_model] }}"
    models_authoritative: true
    tags: ['&zdr', '!free', '!retains', '&local']
    metadata:
      trace_defaults:
        agent_flow: ci-failure-fixer
        agent_trigger: workflow_run
    router_settings:
      enable_tag_filtering: true
  - alias: github-actions-pr-review
    value: "{{ bao_apps_secrets.github_actions_pr_review_llm_router_key | default('', true) }}"
    allowed_classes: [local]
    models: >-
      {{ ([llm_router_primary_model, llm_router_review_aliases.private]
          + llm_router_review_local_chain) | unique | list }}
    models_authoritative: true
    tags: ['&zdr', '!free', '!retains', '&local']
    metadata:
      trace_defaults:
        agent_flow: pr-review-responder
        agent_trigger: review-event
    router_settings:
      enable_tag_filtering: true
  # CI, open-source repositories: the public review alias, the medium
  # capability it resolves to, and the groups its chain walks, which are the
  # local rungs and then the paid terminal rungs.
  # Its value is an apps-domain secret (github-actions-oss) behind the same
  # switch that fetches it (openbao_secrets 10-domains.yml); off or unseeded,
  # the key is not minted.
  - alias: github-actions-oss
    value: >-
      {{ bao_apps_secrets.github_actions_oss_llm_router_key | default('', true)
         if llm_router_oss_ci_key_enabled | default(false) | bool else '' }}
    models: >-
      {{ ([llm_router_review_aliases.oss, llm_router_primary_model]
          + llm_router_review_oss_chain) | unique | list }}
    models_authoritative: true
    router_settings_ref: oss
    sensitivity_tag: '&sensitivity:public'
  - alias: raycast
    value: "{{ bao_apps_secrets.raycast_llm_router_key | default('', true) }}"
    models: "{{ _llm_router_key_scope_all }}"
    daily_budget: "{{ _llm_router_key_daily_budget }}"
  - alias: cursor
    value: "{{ bao_apps_secrets.cursor_llm_router_key | default('', true) }}"
    models: "{{ _llm_router_key_scope_all }}"
    daily_budget: "{{ _llm_router_key_daily_budget }}"
  # Local proxy for the three local chat capabilities.
  - alias: litellm-local
    value: "{{ bao_apps_secrets.litellm_local_llm_router_key | default('', true) }}"
    allowed_classes: [local]
    models: "{{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model,
                 llm_router_embedding_model, llm_router_ocr_model] }}"
    models_authoritative: true
    tags: ['&zdr', '!free', '!retains', '&local']
    router_settings:
      enable_tag_filtering: true
