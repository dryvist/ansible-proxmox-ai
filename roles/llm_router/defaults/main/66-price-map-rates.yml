---
# Derive the public pricing catalog tag from the package pin that owns the
# installed LiteLLM behavior. Tests and operators may supply a local snapshot.
llm_router_price_map_rates_url: >-
  {{ 'https://raw.githubusercontent.com/BerriAI/litellm/v'
     ~ (llm_router_pip_packages
        | select('match', '^litellm' ~ ('[' | regex_escape) ~ 'proxy' ~ (']' | regex_escape) ~ '==')
        | first | split('==') | last)
     ~ '/model_prices_and_context_window.json' }}
llm_router_price_map_rates_file: ""

# The fetched upstream file must be large enough to reject an empty or partial
# response; an explicit local override may be a small test fixture or snapshot.
llm_router_price_map_rates_document_valid_when: >-
  hostvars.get('localhost', {}).get('_llm_router_price_map_rates_document') is mapping
  and hostvars.get('localhost', {}).get('_llm_router_price_map_rates_document') | length > 0
  and (llm_router_price_map_rates_file | trim | length > 0
       or hostvars.get('localhost', {}).get('_llm_router_price_map_rates_document') | length > 1000)

llm_router_price_rates: {}
