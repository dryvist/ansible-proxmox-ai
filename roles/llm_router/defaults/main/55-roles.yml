---
# The role database only holds the caller roles whose per-role request
# parameters cannot be represented by a model_group_alias.
llm_router_embedding_model: >-
  {{ (llm_router_registry_enabled | selectattr('embedding', 'defined')
      | selectattr('embedding') | first).route_group }}
llm_router_ocr_model: >-
  {{ (llm_router_registry_enabled | selectattr('serving_role', 'defined')
      | selectattr('serving_role', 'equalto', 'ocr')
      | map(attribute='route_group') | first) | default('', true) }}
# Embed is always registered; OCR is absent when no enabled registry entry
# serves it. Consumers share this filtered projection instead of repeating it.
llm_router_optional_capability_models: >-
  {{ [llm_router_embedding_model, llm_router_ocr_model]
     | select('string') | reject('equalto', '') | unique | list }}

_llm_router_role_deployments_source:
  - role: judge
    model: "{{ llm_router_small_model }}"
    fallbacks: "{{ llm_router_d1_zdr_ladder_groups }}"
    litellm_params:
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  - role: recorder
    model: "{{ llm_router_small_model }}"
    fallbacks: []
    litellm_params:
      turn_off_message_logging: true
  - role: recorder-medium
    key_alias: recorder
    model: "{{ llm_router_primary_model }}"
    fallbacks: []
    litellm_params:
      turn_off_message_logging: true
llm_router_role_deployments: "{{ _llm_router_m_role_deployments }}"

llm_router_seed_request_timeout: 30

_llm_router_roles_to_create: >-
  {{ llm_router_role_deployments
     | rejectattr('role', 'in', _llm_router_live_models)
     | selectattr('model', 'in', _llm_router_live_models) | list }}
_llm_router_roles_to_rebuild: >-
  {{ (llm_router_role_deployments
      | selectattr('role', 'in', _llm_router_live_models)
      | selectattr('model', 'in', _llm_router_live_models) | list)
     if llm_router_seed_mode == 'rebuild' else [] }}
