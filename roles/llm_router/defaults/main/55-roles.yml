---
# The role database only holds the caller roles whose per-role request
# parameters cannot be represented by a model_group_alias.
llm_router_embedding_model: >-
  {{ (llm_router_registry_enabled | selectattr('embedding', 'defined')
      | selectattr('embedding') | first).route_group }}
llm_router_ocr_model: >-
  {%- set _ocr_entries = (llm_router_capability_members
      | selectattr('serving_role', 'defined')
      | selectattr('serving_role', 'equalto', 'ocr') | list) -%}
  {%- set _ocr_fallback = (_ocr_entries | map(attribute='route_group') | first)
      | default('', true) -%}
  {%- if llm_roles is defined
        and llm_roles.roles is defined
        and llm_roles.roles.ocr is defined
        and llm_roles.roles.ocr.model is defined
        and llm_roles.models is defined
        and llm_roles.roles.ocr.model in llm_roles.models -%}
  {%- set _ocr_model_id = llm_roles.models[llm_roles.roles.ocr.model].id -%}
  {%- set _ocr_role_entry = (_ocr_entries
      | selectattr('catalog_model_name', 'defined')
      | selectattr('catalog_model_name', 'equalto', _ocr_model_id)
      | first) | default(none) -%}
  {{ _ocr_role_entry.route_group if _ocr_role_entry is not none else _ocr_fallback }}
  {%- else -%}
  {{ _ocr_fallback }}
  {%- endif -%}
# Embed is always registered; OCR is absent when no active registry entry
# serves it. Consumers share this filtered projection instead of repeating it.
llm_router_optional_capability_models: >-
  {{ [llm_router_embedding_model, llm_router_ocr_model]
     | select('string') | reject('equalto', '') | unique | list }}

_llm_router_role_deployments_source:
  - role: judge
    model: "{{ llm_router_small_model }}"
    fallbacks: "{{ llm_router_d1_zdr_ladder_groups }}"
    litellm_params:
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  - role: recorder
    model: "{{ llm_router_small_model }}"
    fallbacks: []
    litellm_params:
      turn_off_message_logging: true
  - role: fast-subagent
    model: "{{ llm_router_small_model }}"
    fallbacks: "{{ llm_router_d1_zdr_ladder_groups }}"
    litellm_params: {}
  - role: large
    model: "{{ llm_router_primary_serving_model }}"
    fallbacks: ["{{ llm_router_primary_model }}"]
    litellm_params: {}
  - role: recorder-medium
    key_alias: recorder
    model: "{{ llm_router_primary_model }}"
    fallbacks: []
    litellm_params:
      turn_off_message_logging: true
  # The delegation sensitivity judge: one local member, no fallback, no message logging.
  - role: sensitivity
    model: "{{ llm_router_hermes_local_4080_id }}"
    fallbacks: []
    litellm_params:
      turn_off_message_logging: true
llm_router_role_deployments: "{{ _llm_router_m_role_deployments }}"

llm_router_seed_request_timeout: 30

# A physical target is seedable only while its capability group is live. This
# keeps exact-member roles aligned with the same rendered-entry gate as aliases.
_llm_router_role_available_targets: >-
  {{ ((_llm_router_live_models | default([]))
      + (llm_router_capability_members
         | selectattr('route_group', 'in', _llm_router_live_models | default([]))
         | map(attribute='client_model_id') | list))
     | unique | list }}
_llm_router_roles_to_create: >-
  {{ llm_router_role_deployments
     | rejectattr('role', 'in', _llm_router_live_models)
     | selectattr('model', 'in', _llm_router_role_available_targets) | list }}
# Live roles to delete and recreate from Git in `initial` mode, by name, for one
# converge (-e '{"llm_router_rebuild_roles": ["judge"]}'). `rebuild` recreates every live role.
llm_router_rebuild_roles: []
_llm_router_roles_to_rebuild: >-
  {{ llm_router_role_deployments
     | selectattr('role', 'in', _llm_router_live_models)
     | selectattr('model', 'in', _llm_router_role_available_targets)
     | selectattr('role', 'in', llm_router_role_deployments | map(attribute='role') | list
                  if llm_router_seed_mode == 'rebuild' else llm_router_rebuild_roles)
     | list }}
