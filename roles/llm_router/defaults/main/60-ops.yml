---
# Post-restart wait for the proxy to start serving. Generous on purpose:
# LiteLLM registers every model_list entry before it binds, so startup scales
# with the list — measured at nearly four minutes for ~30 entries — and the
# task that consumes this is the last in the role, so tripping it fails the
# play and strands every host queued behind the failure (see tasks/main.yml).
# 40 x 6 s = 240 s, comfortably past the observed worst case while still
# bounded.
llm_router_liveness_retries: 40
llm_router_liveness_delay: 6

# --- Secrets (from runtime env) -----------------------------------------------
# Mandatory, fail-loud (mirrors the ai_orchestration group_vars pattern).
llm_router_master_key: >-
  {{ lookup('env', 'LLM_ROUTER_MASTER_KEY')
     or undef('LLM_ROUTER_MASTER_KEY must be set') }}
llm_router_llm_large_bearer: >-
  {{ lookup('env', 'LLM_LARGE_BEARER_TOKEN')
     or undef('LLM_LARGE_BEARER_TOKEN must be set') }}
# The GPU/CPU light backends need no auth; a placeholder keeps the OpenAI client happy.
llm_router_light_api_key: "sk-noauth"

# --- Observability -------------------------------------------------------
# Current path: Prometheus fallback-event counters (below) plus LITELLM_LOG
# (further down) for the per-request routing trail. Fallback events, as
# counters rather than prose.
#
# The router emits a dedicated event on every fallback, carrying the model group
# ORIGINALLY asked for alongside the one that ended up serving. Exactly one
# shipped integration consumes those events, and it turns each into a labelled
# counter. Nothing else in this proxy records that pairing: the per-request row
# carries only the deployment that served (see
# docs/LLM_ROUTER_OBSERVABILITY.md, "Identifying a fallback"), so without this
# "did a fallback chain run" is unanswerable from stored data in either
# direction — which is exactly the state this fabric was in.
#
# Chosen over raising the log level because it is volume-independent: one
# counter increment per fallback rather than lines per request, and it survives
# any later logging change. The two are complements, not alternatives — the
# scoped log level below gives the per-request trail this cannot.
#
# The metrics endpoint is AUTHENTICATED by default in this release
# (require_auth_for_metrics_endpoint). Deliberately not disabled: the counters
# carry model names and key aliases, and the proxy is fronted by an ingress that
# can carry a credential. A scraper needs a key, exactly like any other client.
llm_router_prometheus_enabled: true

# Alert sink topic on the shared notification hub. Empty by default so the
# alerting block below renders only when explicitly turned on. Inventory-
# derived the same way as hermes_agent_brain_watchdog_ntfy_url
# (ansible-proxmox-ai's hermes_agent role) — PROXMOX_SUBDOMAIN plus a topic
# name — never a raw full-URL secret read straight from the environment.
llm_router_alert_webhook_topic: ""
llm_router_alert_webhook_url: >-
  {{ ('https://ntfy.' ~ lookup('env', 'PROXMOX_SUBDOMAIN') ~ '/' ~ llm_router_alert_webhook_topic)
     if (llm_router_alert_webhook_topic | trim | length > 0) else '' }}
llm_router_alert_types:
  - budget_alerts
  - fallback_reports
  - cooldown_deployment
  - db_exceptions

# Level for LiteLLM's own three loggers, rendered as LITELLM_LOG in the
# EnvironmentFile. Every routing decision — which rung was tried, whether a
# chain was entered, which deployment was selected — is logged at INFO, and at
# import LiteLLM sets NO level on those loggers (_logging.py:353-360 attaches a
# handler, nothing calls setLevel), so they inherit the root's WARNING and the
# whole routing trail was dropped at the logger while the log looked busy.
#
# LITELLM_LOG=INFO is the supported fix. It is read twice, and both readings
# matter: at import it sets the threshold of the handler LiteLLM attaches
# (_logging.py:137-143; default DEBUG, so it never blocked INFO and it carries
# the secret-redaction filter), and at proxy init the not-debug branch of
# initialize() calls setLevel(INFO) on exactly the three named loggers
# (proxy_server.py:7416-7433) — not on every library. Cost: the proxy and
# package loggers emit INFO too, roughly one line per request, not payload
# dumps. Set WARNING to return to the previous silence.
#
# NOT a --log_config dictConfig. A non-incremental dictConfig REMOVES every
# existing handler from any logger it names (logging/config.py,
# common_logger_config), whether or not it supplies handlers. Naming the
# router logger there strips the handler LiteLLM attached — and the redaction
# filter on it — so records fall to lastResort, which admits WARNING and above
# only and redacts nothing. A dictConfig here must own the handler and
# re-install both filters explicitly, or it must not name these loggers.
#
# Debug is refused: --detailed_debug and set_verbose raise EVERY logger to
# DEBUG, which on a proxy that carries prompts is a data-exposure change.
llm_router_log_level: INFO

# --- The serving-share metric, on a schedule (tasks/serving-share.yml) --------
# One JSON line per run, to the journal, from the query in
# templates/serving-share.sql.j2 — the definition lives THERE, once; the
# observability doc explains it and points at it. Daily over a trailing 7-day
# window: the target is weekly, and a daily sample of a weekly window shows a
# bad day as a step instead of losing it inside one sample.
llm_router_serving_share_query_file: "{{ llm_router_config_dir }}/serving-share.sql"
llm_router_serving_share_syslog_identifier: llm-serving-share
# Off the hour so it does not stack on the proxy's own daily retention sweep.
llm_router_serving_share_on_calendar: "*-*-* 04:23:00"

# Whether the routers carry the llm-fast (GPU) deployments. False while the
# GPU host is frozen (see llama_cpp_service_enabled): the firewall DROPs
# traffic to the dead backend, so a shuffled request hangs the full client
# timeout instead of failing over — routing to it at all is worse than
# serving CPU-only. Flip together with the llm-fast unfreeze.
llm_router_llm_fast_enabled: true

# Large-tier passthrough: expose EVERY model the serving gate advertises,
# not just the tuned entries above. Exposure policy is blocklist-shaped and
# enforced at the source — the serving host auto-registers every downloaded,
# memory-fitting MLX model minus its declarative blocklist (nix-ai
# programs.mlx.discover.blocklist) — so adding a model to the fleet is a
# download, and removing one is a blocklist entry; the router never needs a
# per-model edit. llm_router_large_models stays as the tuned set (exact-match
# registrations win over the wildcard).
llm_router_large_passthrough_enabled: true

# Admission cap on EVERY LOCAL tier (large, large-standby, light, vLLM and the
# Hermes local leg), so the router QUEUES excess work
# instead of firing it at a backend that will refuse it.
#
# Without this the local deployments carry no rpm/tpm/max_parallel_requests at
# all (only the OpenRouter egress tier did), so LiteLLM admitted every inbound
# request immediately and forwarded it to an mlx-lm-server that accepts a
# bounded number of in-flight requests and 429s the rest INSTANTLY.
#
# THE BACKEND SERVES ONE AT A TIME. Read from the serving gate's /running on
# 2026-09-02, every resident large-tier worker is launched with
# `--decode-concurrency 1 --prompt-concurrency 1` — not the 2 this comment
# previously recorded from the 2026-08-15 measurement. Do not re-derive the
# overcommit arithmetic below from the older number. Measured 2026-08-15 over 6h:
# 12,201.6 s of model time against 43,200 slot-seconds = ~28% utilisation,
# while 51-234 requests per hour were rejected. The tier was never busy; it was
# UNBUFFERED, and bursty arrivals lost. Every agent-mode Hermes cron had been
# dying on its first call since 2026-08-07 (Zammad AI/LLM Serving).
#
# Why a rejection is invisible on the usual dashboards, which is why this ran
# for eight days: a refused request occupies no slot and emits no latency row,
# so exactly the traffic that is failing is absent from utilisation and latency
# stats. Do not read "low utilisation" here as headroom.
#
# PER-INSTANCE, exactly like the OpenRouter ceilings above — and for a stronger
# reason than convention. LiteLLM implements max_parallel_requests as an
# `asyncio.Semaphore` cached `local_only=True` (router_utils/
# client_initalization_utils.py), so it is an in-process gate that AWAITS, and
# it CANNOT be shared across the pool via the redis store. The redis-backed
# parallel limiter is a different mechanism that REJECTS rather than queues
# ("a rejected request never occupies a slot"), so it would only move the 429
# one hop upstream. Queueing and pool-wide coordination are not simultaneously
# available for this control; queueing is the one worth having.
#
# Consequence, stated rather than discovered: llm_router_group is a three-member
# pool, so the estate-wide in-flight ceiling is 3x this number. At 1 that is 3
# against a backend admitting ONE — a 2-over overcommit, not the 1-over this
# comment claimed while it assumed a 2-slot backend. 1 is still the right value
# because it is the smallest integer available; the residual overcommit is a
# property of the pool size, and closing it needs a pool-wide gate that QUEUES,
# which LiteLLM does not offer (see the per-instance note above). Each member
# still queues its own excess, which converts the great majority of instant
# rejections into waits. RAISING THIS IS NOT A CAPACITY IMPROVEMENT: at 2 the
# pool admits 6 at a 1-slot backend, which is the original defect with extra
# steps.
#
# Trading latency for completion is the intended direction on this tier: its
# stated objective is accuracy over throughput, and a queued request waits while
# a rejected one kills a job outright.
llm_router_local_max_parallel_requests: 1

# Same control for the zero-config passthrough tier, kept SEPARATE because the
# tradeoff differs. LiteLLM keys the semaphore per deployment and the wildcard
# is ONE deployment fronting every untuned model, so a single value serialises
# them against each other: a long document-OCR decode can hold the slot a small
# on-demand model wanted. Accepted, because the alternative is this tier
# flooding the same backend the tuned brain and judge depend on.
#
# 2 rather than 1: these are on-demand, bursty, mostly single-stream jobs, and
# unlike the tuned tier there is no long-running agent conversation to protect.
# Set to 0 to omit the cap entirely and restore unbounded passthrough.
llm_router_passthrough_max_parallel_requests: 2
