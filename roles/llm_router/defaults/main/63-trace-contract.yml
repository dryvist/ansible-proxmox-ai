---
# Attribution is key-owned; request-specific session/run values remain caller-owned.
# Native enforced_params is Enterprise in LiteLLM 1.104.0, so the existing
# request_metrics pre-call hook validates benchmark variables instead.
llm_router_trace_environment: production
llm_router_benchmark_trace_fields:
  - engine
  - profile
  - quant
  - kv_dtype
  - ctx_per_slot
  - slots
  - concurrency
  - power_limit
  - thinking
  - suite
  - dataset
  - run_id
llm_router_trace_fields:
  - client
  - runtime
  - runner
  - purpose
  - tier
  - environment
  - release
  - session_id
  - trace_user_id
  - trace_name
  - generation_name
  - tool_category
  - tool_name
llm_router_trace_span_metadata_keys: >-
  {{ (llm_router_trace_fields + llm_router_benchmark_trace_fields)
     | map('regex_replace', '^', 'requester_metadata.') | list }}
