---
# Internal subdomain (pve.<apex>), never hardcoded — the derived model endpoints
# and the Langfuse host are built from it.
llm_router_subdomain: >-
  {{ lookup('env', 'PROXMOX_SUBDOMAIN') or undef('PROXMOX_SUBDOMAIN required') }}

# --- Ports (DRY from the tofu ports registry; no hardcodes) ------------------
# The proxy's own listen port + the backend tiers' ports. Hard-required like
# every other role's port so a missing constant fails loud rather than guessing.
# NOTE: service_ports.llm_router_api and service_ports.llm_fast_api are added by
# the parallel terraform-proxmox constants PR — this role depends on both.
llm_router_api_port: "{{ tofu_data.constants.service_ports.llm_router_api }}"
llm_router_light_port: "{{ tofu_data.constants.service_ports.llm_fast_api }}"
# llm-large speaks the Ollama-compatible API on the standard Ollama port.
llm_router_large_port: "{{ tofu_data.constants.service_ports.ollama_api }}"

# --- Backend base URLs (derived; never a hardcoded IP) -----------------------
llm_router_llm_fast_base_url: "http://llm-fast.{{ llm_router_subdomain }}:{{ llm_router_light_port }}/v1"
llm_router_llm_light_base_url: "http://llm-light.{{ llm_router_subdomain }}:{{ llm_router_light_port }}/v1"

# CPU pool — api_base from tofu inventory `ip`. Tag vocabulary is
# constants.llm_cpu_scaler.tags — never restated here. One map keyed by registry
# tier; absent scaler / no matching containers → empty lists (registry_enabled
# then drops those tiers).
llm_router_cpu_pool_backend_urls_by_tier: >-
  {%- set ns = namespace(out={}) -%}
  {%- set scaler = tofu_data.constants.llm_cpu_scaler | default({}) -%}
  {%- set tags = scaler.tags | default({}) -%}
  {%- set containers = tofu_data.containers | default({}) -%}
  {%- set port = llm_router_light_port | string -%}
  {%- for attr, tier in [('moe', 'cpu-moe'), ('nine_b', 'cpu-9b')] -%}
  {%- set urls_ns = namespace(urls=[]) -%}
  {%- set tag = tags[attr] | default('', true) -%}
  {%- if tag -%}
  {%- for name, c in containers.items() | sort -%}
  {%- if tag in (c.tags | default([])) -%}
  {%- set urls_ns.urls = urls_ns.urls + ['http://' ~ c.ip ~ ':' ~ port ~ '/v1'] -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endif -%}
  {%- set _ = ns.out.update({tier: urls_ns.urls}) -%}
  {%- endfor -%}
  {{ ns.out }}
llm_router_cpu_moe_backend_urls: >-
  {{ llm_router_cpu_pool_backend_urls_by_tier['cpu-moe'] | default([]) }}
llm_router_cpu_9b_backend_urls: >-
  {{ llm_router_cpu_pool_backend_urls_by_tier['cpu-9b'] | default([]) }}

# This deployment's admission cap, read from the SAME variable the serving
# host's llama_cpp role uses for -np/--parallel and llama-swap's
# concurrencyLimit (inventory/group_vars/llm_cpu_pool_group.yml,
# llama_cpp_parallel — mandatory there, no default here either). Not a
# separately-set literal: the router and the backend it fronts would
# otherwise be two numbers that can drift apart the moment either changes.
# hostvars carries group_vars for every inventory host regardless of which
# play targets it, so this resolves even when the current play never touches
# llm_cpu_pool_group.
#
# Falls back to the tier-wide default (same idiom as
# _llm_router_spend_store_present above) only when the group has no member at
# all — an isolated template render (a unit test against localhost, no real
# inventory) rather than a real converge, where the group always has the
# member that makes it exist.
llm_router_cpu_pool_max_parallel_requests: >-
  {{ hostvars[(groups['llm_cpu_pool_group'] | default([]))[0]].llama_cpp_parallel
     if (groups['llm_cpu_pool_group'] | default([]) | length > 0)
     else llm_router_local_max_parallel_requests }}

# The NVIDIA/CUDA serving guest (vLLM). Same serving-API port as the light tier
# — the port names the protocol, and the HOST is what distinguishes the backend,
# so a second constant for the same OpenAI API would be a second place to keep
# in sync for no gain.
#
# Single deployment, deliberately: there is no CPU standby for this model. vLLM
# serves ONE model per instance, so a drain-to-CPU pair like the light tier's
# would need a second backend actually serving the same weights, and none
# exists. A failure here surfaces as that model being unavailable rather than
# silently degrading to something slower and different.
llm_router_llm_vllm_enabled: true
# APEX-level, unlike the llm-fast and llm-light URLs above, and the difference
# is not cosmetic — it is the difference between resolving and not.
#
# technitium_dns publishes A records under the subdomain ONLY for guests that
# carry a declared address. Leased guests are skipped there deliberately: their
# address lives in the DHCP lease, the gateway answers for its own lease-table
# clients, and publishing a second copy in a second system is the drift that
# addressing model exists to prevent. So a leased guest resolves at
# `<hostname>.<apex>` and NOT at `<hostname>.<subdomain>`.
#
# llm-fast and llm-light are network-tier guests with declared addresses, so the
# subdomain form works for them. This guest is leased, so it does not — and
# copying their pattern here is exactly the mistake that shipped. Measured from
# a router guest: the sibling backends resolve under the subdomain, this one
# resolves only at the apex and returns no record under the subdomain.
#
# The failure mode is worth naming, because nothing reported it. The router
# advertised the model in /v1/models and every request to it failed with
# "OpenAIException - Connection error" and no fallback group, while the backend
# itself was healthy — a TCP connect to its serving port succeeded and an HTTP
# request to the apex name returned 200. An entry that is advertised while its
# upstream cannot be resolved looks identical to a working one from the model
# list alone.
llm_router_llm_vllm_base_url: "http://llm-4080.{{ llm_router_apex_domain }}:{{ llm_router_light_port }}/v1"
# This deployment's admission cap (used by both the vLLM tier and the
# hermes-local-4080 leg over it) — same idiom and same reason as
# llm_router_cpu_pool_max_parallel_requests above: read from the guest's own
# llama_cpp_parallel (inventory/group_vars/llm_vllm_group.yml) via hostvars,
# never a separately-set literal. Same isolated-render fallback too.
llm_router_llm_vllm_max_parallel_requests: >-
  {{ hostvars[(groups['llm_vllm_group'] | default([]))[0]].llama_cpp_parallel
     if (groups['llm_vllm_group'] | default([]) | length > 0)
     else llm_router_local_max_parallel_requests }}
# The large-tier gate (a caddy TLS front on the Mac Studio, apex-level cert via
# Route53 DNS-01) reverse-proxies to the host's llama-swap. It has always been
# addressed apex-level (one label under the subdomain's parent), because the
# ACME client locates the hosted zone by stripping a single label — an
# <alias>.<subdomain> name fails the TLS handshake (no SNI cert).
#
# The host is reached by its OWN permanent name, not a floating `llm-large`
# service alias. The alias needed a *second* DNS record published + maintained
# by something outside this fabric; on 2026-07-06 that record silently vanished
# (resolved fine at 21:51, NXDOMAIN by 22:42) and every brain request 500'd with
# ClientConnectorDNSError — a single point of failure with no benefit while there
# is exactly one serving host. Its own `<serving-host>.<apex>` record — the name
# resolved from constants.serving.host — is that canonical record (stable, also
# its SSH name) and is on the very same caddy cert, so it satisfies
# the apex-cert constraint identically with no extra record to keep alive.
# (Restoring/decoupling behind an alias again is a DNS follow-up, not a router
# concern — see PR notes.)
llm_router_apex_domain: "{{ llm_router_subdomain | split('.', 1) | last }}"
# Host comes from the `llm_large_serving_host` single source (all.yml), which
# now reads tofu-proxmox's published constants.serving.host rather than a value
# committed here — so the name is not a literal repeated across roles OR across
# repositories. Still its own permanent per-host record, NOT the floating alias
# (see above).
llm_router_llm_large_host: "{{ llm_large_serving_host }}"
llm_router_llm_large_fqdn: "{{ llm_router_llm_large_host }}.{{ llm_router_apex_domain }}"
llm_router_llm_large_base_url: "https://{{ llm_router_llm_large_fqdn }}:{{ llm_router_large_port }}/v1"
# --- Standby brain backend (default OFF) -------------------------------------
# A SAME-MODEL, SAME-CONTEXT failover sibling for the default brain, addressing
# the single-Studio brain SPOF (Zammad INC-17080: a Studio reboot takes the sole
# large-tier backend unreachable, so Hermes' brain-watchdog pauses the cron
# fleet). This is NOT a cross-tier alias: the standby serves the IDENTICAL model
# id at the IDENTICAL context window, so it fails over without the
# smaller-context "poison the caller" failure the no-cross-tier-fallback rule
# guards against (a smaller-context fallback is still forbidden).
#
# Default empty = DISABLED: with no URL set, the rendered config.yaml is
# byte-identical to today (no standby deployment, no extra env var). To enable:
#   1. Provide a second backend serving the identical model and context.
#   2. Set llm_router_llm_large_standby_base_url to its /v1 URL and
#      seed llm_router_llm_large_standby_bearer (OpenBao, same pattern).
#
# WIRED CEILING — both hosts are pinned to the SAME iogpu.wired_limit_mb
# (102400, measured on both 2026-07-24). This is deliberate: it matches the
# memory the MacBook makes available, and the Studio runs the same number on
# purpose — accepting unused memory there — to keep the two hosts identical and
# the setup simple. Raising the Studio later is a possible future, NOT the
# current design; do not treat a higher ceiling as a prerequisite for anything
# here. Unbounded wired previously wedged a host (INC-17076), which is why the
# ceiling is enforced rather than advisory.
#
# The enforcement wiring landed in nix-darwin #1769 and both hosts are rebuilt
# on it (both on darwin-system 26.05.adda04f, verified 2026-07-24), so that
# prerequisite is SATISFIED. OptiQ+shard coexistence must still be validated
# EMPIRICALLY under the deployed ceiling, not assumed.
# Dedicated standby port. A Nix literal rather than a tofu service constant;
# the standalone agent and its gate must agree before enabling the URL below.
llm_router_llm_large_standby_port: 11442
# DEFAULT EMPTY = DISABLED: with no URL the standby block is skipped and the
# rendered config.yaml/litellm.env are byte-identical to today (verified by
# render). Merging this PR is therefore behavior-neutral — nothing changes on
# converge until the URL below is set. To ACTIVATE (one line), only after both:
# (a) the standalone :11442 OptiQ agent exists and is live-validated.
# (b) the wired ceiling is deployed — SATISFIED; see the wired-ceiling note above.
# Then set this to the large FQDN + standby port /v1 URL — converging while (a)
# is unmet routes hermes-brain failover at a port that does not exist yet.
llm_router_llm_large_standby_base_url: ""
# Same bearer as the llm-large gate (the OptiQ site shares its token + cert).
llm_router_llm_large_standby_bearer: "{{ llm_router_llm_large_bearer }}"
