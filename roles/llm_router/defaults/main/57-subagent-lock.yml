---
# --- SESSION LOCK for the RTX 4080's single llama.cpp slot --------------------
# templates/callbacks/fast_subagent_lock.py.j2 — a LiteLLM custom callback,
# registered in litellm_settings.callbacks (config.yaml.j2) only alongside a
# configured spend store (llm_router_redis_host), the same gate the Redis
# block in config.yaml.j2 already uses — the lock has nowhere to live without
# it. Deployed by tasks/main.yml next to config.yaml.
#
# WHY reject-fast, not a queue: llama.cpp serves this card with exactly one
# in-flight slot (llama_cpp_parallel: 1, inventory/group_vars/
# llm_vllm_group.yml — the KV cache is one unified buffer, so more slots
# would divide capacity, not add concurrency). A second caller queuing behind
# the first would tie up a router worker for the ~190-300s this rung can take
# (llm-models.d/30-local-gpu.yml); refusing it immediately with Retry-After
# lets the caller's own fallback chain move on instead.
#
# WHY the lock covers three names, not one. llama-server's router mode keeps
# only ONE model loaded at a time on this card (--models-max 1,
# roles/llama_cpp/templates/llama-server.service.j2) and TWO client-facing
# registry entries share it (tier: vllm — qwen3.8-27b, qwen3-coder-30b), plus
# the hermes-local-4080 fallback rung onto the same weights (tier:
# hermes-local). Any one of the three evicts the KV cache another was
# building, so gating the lock on a single alias (as first scoped) would have
# left the other two free to thrash a cache the lock was supposed to protect.
# Derived from the registry by tier rather than hand-listed, so a future
# vllm-tier entry on this card is covered automatically — see
# tests/llm_router/test_fast_subagent_lock.py for the assumption this filter
# makes about tier naming staying single-guest.
#
# `fast-gpu` (55-roles.yml) is UNIONED IN, not registry-derived — it is a DB
# role name, not a registered client_model_id, but it targets this exact
# backend and must be treated identically for lock purposes: same hard 429
# on contention as the three names above, deliberately NOT the redirect
# behaviour the ROLE_NAMES set below gives fast/subagent (see the note there
# for why a redirect would defeat fast-gpu's whole purpose).
llm_router_subagent_lock_model_ids: >-
  {{ (llm_router_registry_enabled
      | selectattr('tier', 'in', ['vllm', 'hermes-local'])
      | map(attribute='client_model_id') | list)
     + ['fast-gpu'] }}

# The only release path GUARANTEED to fire — an unattended Hermes caller that
# crashes or times out must not hold the lock forever. X-Subagent-Release is a
# courtesy on top of this, never a substitute (fast_subagent_lock.py.j2).
llm_router_subagent_lock_ttl_seconds: 300

llm_router_subagent_lock_key: "subagent:4080:lock"
llm_router_subagent_lock_release_header: x-subagent-release

# The single hermes-local-tier entry (currently exactly one: hermes-local-4080)
# — derived rather than hand-listed for the same reason the gated set above
# is, and reused as the `fast`/`subagent` DB roles' primary target in
# 55-roles.yml so that file carries no registry literal either.
llm_router_hermes_local_4080_id: >-
  {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'hermes-local')
     | map(attribute='client_model_id') | list | first }}

# --- fast/subagent role-call redirect-on-contention ---------------------------
# See 55-roles.yml for the chain these two DB roles share and why. A caller
# naming one of these role names directly reaches fast_subagent_lock.py.j2
# under the role's OWN name (a DB-seeded role is a first-class LiteLLM
# model_group with its own deployments, not a config alias substituted before
# the callback runs) — contention on one of these redirects the request onto
# the chain's first fallback rung instead of rejecting it, UNLIKE a direct
# call naming hermes-local-4080/qwen3.8-27b/qwen3-coder-30b, which still gets
# the hard 429 (local-subagents' "429 = wait" contract for those names is
# unchanged). See fast_subagent_lock.py.j2 and its module docstring for why
# this is a template-time redirect target rather than a live lookup of the
# role's own DB-stored fallback order (UI-reorderability tradeoff, documented
# there).
#
# `fast-gpu` is DELIBERATELY NOT in this set — it is unioned into
# llm_router_subagent_lock_model_ids above instead, so it gets the hard 429
# a direct caller gets, never a redirect. Its whole purpose is letting a
# caller detect 4080 contention and run its OWN fallback sequence; a silent
# redirect here would answer from a different model without the caller ever
# knowing the 4080 was busy, defeating that.
llm_router_subagent_lock_role_names:
  - fast
  - subagent
  - cheap
  - review-oss
  - review-private

# --- SECOND GATE: the Mac Studio backend ---------------------------------------
# Same reject-fast/redirect-fast idea as the 4080 gate above, ported to the
# large tier's servable ids (fast_subagent_lock.py.j2 — a second, independent
# lock, own Redis key, so studio contention and 4080 contention never block
# each other). WHY THIS EXISTS: llm_router_local_max_parallel_requests /
# each entry's own max_parallel_requests (llm-models.d/10-large.yml) is a
# LiteLLM Router-internal asyncio.Semaphore, acquired with a plain `async
# with` — no timeout wraps that acquire (litellm 1.102.0 router.py
# `_acompletion`) — so a second caller against a busy studio entry QUEUES
# indefinitely at the Router layer instead of failing over, the same defect
# the 4080 gate was built to avoid. Every local admission var in
# 40-routing.yml (llm_router_local_request_timeout_seconds,
# llm_router_admission_budget_seconds) only bounds the HTTP call made AFTER
# a slot is acquired; none of them reach this wait. Confirmed against
# litellm==1.102.0 source, not merely inferred from the docs.
#
# Derived by tier + serving_role, same pattern as llm_router_primary_model
# et al. (50-servable.yml) — a future large-tier role stays covered without
# a hand-edit here. Also includes the hermes-router tier (hermes-default and
# its `default` alias): it dispatches EVERY call straight onto primary/
# routine (its complexity_router_config, model-list.yaml.j2) with no
# deployment of its own, so a caller naming it directly reaches the exact
# same contention a direct primary/routine caller would — and it is how
# every interactive consumer (Open WebUI, Raycast, Claude Code, OpenCode)
# actually reaches the studio, not the raw ids/aliases. Never
# max_parallel_requests-bearing itself, so it is excluded from the capacity
# derivation below.
llm_router_studio_lock_model_ids: >-
  {{ (llm_router_registry_enabled
      | selectattr('tier', 'equalto', 'large')
      | selectattr('serving_role', 'defined')
      | selectattr('serving_role', 'in', ['primary', 'routine', 'small', 'ocr'])
      | map(attribute='client_model_id') | list)
     + (llm_router_registry_enabled
        | selectattr('tier', 'equalto', 'large')
        | selectattr('serving_role', 'defined')
        | selectattr('serving_role', 'in', ['primary', 'routine', 'small', 'ocr'])
        | selectattr('stable_aliases', 'defined')
        | map(attribute='stable_aliases') | list | sum(start=[]))
     + (llm_router_registry_enabled
        | selectattr('tier', 'equalto', 'hermes-router')
        | map(attribute='client_model_id') | list)
     + (llm_router_registry_enabled
        | selectattr('tier', 'equalto', 'hermes-router')
        | selectattr('stable_aliases', 'defined')
        | map(attribute='stable_aliases') | list | sum(start=[])) }}

# The 4080 gate covers three ids that share ONE physical llama.cpp process —
# gating each independently would be wrong (freeing one lets the others
# thrash the same KV cache it was supposed to protect). The studio's four
# ids do NOT share that constraint the same way (primary + routine are two
# separate resident processes, maxResidentWorkers=2, and can genuinely run
# concurrently) — a single shared lock key here is a DELIBERATE
# simplification, not a discovered fact: it trades some of that real
# concurrency (a busy primary now also holds off an idle routine/small/ocr
# call) for one lock to reason about, matching the operator's stated
# "never wait on a busy local rung" priority over throughput. Capacity is
# read from the registry's own fact (never a new literal) and asserted
# uniform below; split into one lock per model id (or a counting semaphore
# above capacity 1) if that tradeoff ever measures worse than the wait it
# replaces.
llm_router_studio_lock_capacity: >-
  {{ (llm_router_registry_enabled
      | selectattr('tier', 'equalto', 'large')
      | selectattr('serving_role', 'defined')
      | selectattr('serving_role', 'in', ['primary', 'routine', 'small', 'ocr'])
      | map(attribute='max_parallel_requests') | unique | list) }}

llm_router_studio_lock_key: "subagent:studio:lock"

# Role calls that redirect around studio contention instead of queuing on the
# Router's own semaphore. `judge` is ADDED here (never part of the 4080 gate
# — its primary target is the routine studio id directly, it never touches
# the 4080 at all) alongside the five roles the 4080 gate already redirects,
# since every one of them can land on the studio: the five either overflow
# there from the 4080 gate (ROLE_REDIRECT_TARGET = llm_router_primary_model),
# or (judge) target it directly.
llm_router_studio_lock_role_names:
  - fast
  - subagent
  - cheap
  - review-oss
  - review-private
  - judge

# Per-role first NON-LOCAL rung to redirect onto when the studio is busy —
# "local" meaning either lock's own gated set, so a role whose chain visits
# the 4080 then the studio (fast/subagent/cheap/review-oss/review-private) or
# the studio directly (judge, via its routine/small pair) skips straight to
# the first rung neither lock covers: review-oss -> its Z.ai pair,
# review-private -> its first Codex rung, fast/subagent/cheap/judge -> the
# shared external terminal rungs. A role with NO non-local rung at all
# (fast-gpu, embed, ocr) is simply absent from this map — fast-gpu never
# reaches the studio gate (its chain is `[]`, the 4080 alone), and embed/ocr
# aren't in llm_router_studio_lock_role_names, so the callback's fallback for
# "role gated but nothing to redirect to" (queue, today's behaviour) never
# actually fires for any role currently listed; kept as a defensive no-op in
# the callback rather than an assumption a future role addition could
# silently violate.
llm_router_studio_role_overflow_targets: >-
  {%- set ns = namespace(map={}) -%}
  {%- set _local_ids = (llm_router_subagent_lock_model_ids + llm_router_studio_lock_model_ids) | unique | list -%}
  {%- for rd in llm_router_role_deployments -%}
  {%- if rd.role in llm_router_studio_lock_role_names -%}
  {%- set _chain = [rd.model] + (rd.fallbacks | default([]) | list) -%}
  {%- set _non_local = _chain | reject('in', _local_ids) | list -%}
  {%- if _non_local | length > 0 -%}
  {%- set _ = ns.map.update({rd.role: _non_local[0]}) -%}
  {%- endif -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.map }}

# Per-DIRECT-CALLER (not role) first NON-LOCAL rung — a busy studio must
# never hard-fail a direct interactive caller the way the 4080 hard-fails a
# direct subagent-lock caller: the 4080's lock is an exclusive-session
# semantic for one developer's own GPU, but the studio is the shared brain
# every interactive caller (hermes-default, Open WebUI, Raycast, Claude
# Code, OpenCode) reaches, and a pre-call-hook exception bypasses the
# Router's own fallback engine entirely (see fast_subagent_lock.py.j2's
# module docstring) — a second interactive user must be handed onward, not
# handed a raw 429.
#
# SAME DERIVATION SHAPE AS THE RENDERED ROUTER CONFIG, not a new concept:
# config.yaml.j2 already gives every entry point (`llm_router_entry_point_names`)
# and hermes-default itself their OWN fallback chain in router_settings.fallbacks
# — `llm_router_hermes_default_fallback_chain`, minus the name itself (a no-op
# for every studio id/alias/hermes-default, since none of them are ever a
# member of their own chain), minus the free OpenRouter rung for a ZDR entry
# point. This map just picks that SAME chain's first entry outside both
# locks' combined ids, so an overflowing direct caller lands exactly where
# the Router's own ordinary fallback walk would have sent it next anyway.
llm_router_studio_direct_overflow_targets: >-
  {%- set ns = namespace(map={}) -%}
  {%- set _local_ids = (llm_router_subagent_lock_model_ids + llm_router_studio_lock_model_ids) | unique | list -%}
  {%- for _name in llm_router_studio_lock_model_ids -%}
  {%- set _chain = llm_router_hermes_default_fallback_chain | reject('equalto', _name) | list -%}
  {%- if _name in llm_router_zdr_entry_point_names -%}
  {%- set _chain = _chain | reject('in', llm_router_openrouter_free_groups) | list -%}
  {%- endif -%}
  {%- set _non_local = _chain | reject('in', _local_ids) | list -%}
  {%- if _non_local | length > 0 -%}
  {%- set _ = ns.map.update({_name: _non_local[0]}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.map }}
