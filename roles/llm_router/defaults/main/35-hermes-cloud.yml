---
# Hermes-only local complexity routing and paid provider fallbacks. Physical
# local model groups stay unchanged, so Hindsight/Open WebUI callers retain a
# local-only contract. Cloud groups render only when their exact credential is
# present and the shared Redis budget store is configured.
llm_router_hermes_virtual_models: >-
  {{ llm_router_registry_enabled
     | selectattr('tier', 'equalto', 'hermes-router') | list }}
llm_router_hermes_cloud_router_models: >-
  {{ llm_router_registry_enabled
     | selectattr('tier', 'equalto', 'hermes-cloud-router') | list }}
llm_router_hermes_cloud_models: >-
  {{ llm_router_registry_enabled
     | selectattr('tier', 'equalto', 'hermes-cloud') | list }}

llm_router_hermes_cloud_rpm: 12
llm_router_hermes_cloud_tpm: 500000
llm_router_hermes_cloud_max_parallel_requests: 2
llm_router_hermes_cloud_monthly_budget_period: 1mo

# Credentialed projection is the only enabled cloud inventory. Registry order
# owns provider preference, and one key is shared by all models for a provider.
llm_router_hermes_cloud_models_credentialed: >-
  {%- set ns = namespace(models=[]) -%}
  {%- for m in llm_router_hermes_cloud_models -%}
  {%- set key = bao_local_llm_secrets[m.key_field]
       | default(lookup('env', m.credential_env), true) -%}
  {%- if key | trim | length > 0 -%}
  {%- set ns.models = ns.models + [m] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.models }}

# Virtual provider routers use the same provider credential gate as their
# physical tier deployments. They hold no API key themselves; the selected
# routine/agentic deployment is the only provider call.
llm_router_hermes_cloud_router_models_credentialed: >-
  {%- set ns = namespace(models=[]) -%}
  {%- for m in llm_router_hermes_cloud_router_models -%}
  {%- set key = bao_local_llm_secrets[m.key_field]
       | default(lookup('env', m.credential_env), true) -%}
  {%- if key | trim | length > 0 -%}
  {%- set ns.models = ns.models + [m] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.models }}

# Local (non-cloud, non-credential-gated) fallback groups, registry order. A
# local leg has no credential to gate on, and filtering it the way the cloud
# projection filters would silently render nothing.
llm_router_local_fallback_groups: >-
  {%- set ns = namespace(groups=[]) -%}
  {%- for m in llm_router_hermes_local_models -%}
  {%- set group = m.fallback_group | default(m.route_group) -%}
  {%- if group not in ns.groups -%}
  {%- set ns.groups = ns.groups + [group] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.groups }}

# Pure cloud (credential-gated) fallback groups, registry order. Kept as its
# own var — not just inlined into the combined one below — because
# assert-budget-backing.yml needs a way to ask "is there a PAID leg" without
# the local leg (which is never budgeted) tripping it, and because the assert
# in assert.yml wants to check the combined chain's exact composition
# (local-then-cloud) against its two parts independently.
llm_router_hermes_cloud_only_fallback_groups: >-
  {%- set ns = namespace(groups=[]) -%}
  {%- for m in llm_router_hermes_cloud_models_credentialed -%}
  {%- set group = m.fallback_group | default(m.route_group) -%}
  {%- if group not in ns.groups -%}
  {%- set ns.groups = ns.groups + [group] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.groups }}

# NOTE ON NAMING: the hermes_cloud_* names below are historical. They now
# build the WHOLE post-primary Hermes fallback chain, hermes-local legs
# included, not only credential-gated cloud ones — kept unrenamed per the
# repo's existing "vllm" tier-name precedent (a rename here would churn the
# tests for no functional gain).
#
# Local legs are free, on-network attempts, so they go as early as they can
# usefully be tried. That is NOT unconditionally first: a leg narrower than the
# primary cannot serve what the primary just refused, so placing one ahead of a
# rung that can spends an attempt — and a unit of the shared max_fallbacks
# budget — on a rung that was never going to answer. Under the default policy
# below, only WIDE local legs lead; narrow ones go last. If every local leg is
# narrow, no local leg is first.
#
# Order is composed by concatenation, never a re-sort — a plain `+` preserves
# each side's own registry order within its half.
# Window of the primary. A fallback rung narrower than this cannot rescue a
# request the primary refused for any reason OTHER than size -- the request was
# always going to be too big for it.
llm_router_hermes_primary_context_window: >-
  {{ (llm_router_registry_enabled
      | selectattr('client_model_id', 'equalto', llm_router_primary_model)
      | map(attribute='context_window') | list | first) | default(0) }}

# Local fallback groups split by whether they can serve what the primary was
# handling. A NARROW leg (smaller window than the primary) is the failure this
# split exists to prevent:
#
#   primary 429s (a RATE error, not a size error) -> the ordinary `fallbacks`
#   chain engages -> the next rung is a narrow leg -> the request is oversized
#   for THAT leg -> pre-call checks raise ContextWindowExceededError, and that
#   rung is spent without ever having been able to answer.
#
# CORRECTED against litellm 1.98.0. This block previously said the context
# error is treated as terminal, that the whole chain dies there, and that
# `context_window_fallbacks` "is not consulted for an error raised by a
# fallback leg". All three are false:
#
#   * the map IS consulted, keyed on the failing LEG's own name;
#   * a re-raise there is caught by the enclosing walk, which ADVANCES;
#   * max_fallbacks is read only at run_async_fallback ENTRY
#     (fallback_event_handlers.py:317), never inside its loop — so it bounds
#     how deep NESTED chains descend and can never cut a top-level chain short.
#
# That last point rules out a cause an earlier revision of this comment
# offered. An overflow observed 2026-09-01 against a 32768 leg, with wider
# cloud rungs listed but not reached, was NOT budget exhaustion: those rungs
# sit at the top level of hermes-default's chain, which the budget cannot
# truncate. Two causes remain un-excluded, and either fits the symptom:
#
#   * a DEPTH-0 raise on a partial map (router.py:6413-6414). The caller typed
#     hermes-default; the map existed for the narrow leg but hermes-default was
#     not yet a key in what the router had LOADED, so the primary's own
#     overflow re-raised before the ordinary chain was ever entered — "every
#     rung listed, none reached" is exactly that;
#   * the router was not running the rendered file. router_settings persisted
#     in the database shadowed the file until tasks/sync-router-settings.yml
#     made the render authoritative, and that landed 2026-09-02 — one day
#     after. "Verified present in the deployed config" described the file,
#     not the row.
#
# The narrow/wide split below is still worth keeping: a narrow leg in front
# cannot answer, so it costs an attempt and a unit of depth for nothing.
llm_router_hermes_local_narrow_groups: >-
  {%- set ns = namespace(groups=[]) -%}
  {%- for m in llm_router_hermes_local_models -%}
  {%- set group = m.fallback_group | default(m.route_group) -%}
  {%- if (m.context_window | default(0) | int)
         < (llm_router_hermes_primary_context_window | int)
     and group not in ns.groups -%}
  {%- set ns.groups = ns.groups + [group] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.groups }}

llm_router_hermes_local_wide_groups: >-
  {%- set ns = namespace(groups=[]) -%}
  {%- for group in llm_router_local_fallback_groups -%}
  {%- if group not in llm_router_hermes_local_narrow_groups
     and group not in ns.groups -%}
  {%- set ns.groups = ns.groups + [group] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.groups }}

# WHICH POLICY: there is a genuine tradeoff and litellm cannot resolve it per
# request, because a fallback chain is a static ordering while "does this rung
# fit" depends on the request.
#
#   true  (default) -- narrow local legs go LAST, behind the cloud rungs. The
#     chain then always reaches something that can serve the request. Cost: a
#     SMALL fallback request that a narrow local leg could have served now
#     tries a cloud rung first, so some traffic leaves the network that did
#     not before. The first cloud rung is the free one, so this is not a
#     spend change, it is an egress change.
#
#   false -- registry order, narrow legs first. Keeps every fallback local for
#     as long as possible. Cost: a request larger than a narrow leg's window
#     spends that rung and a unit of the shared depth budget for nothing
#     before the chain reaches a rung that can answer.
#
# Defaulted to true because the goal this router serves states the chain "must
# actually fall back, with one always-alive cheap rung" -- a chain that burns
# its early rungs on legs that cannot answer is falling back late and with
# less depth left for the rungs that can. Flip it if local-only egress
# outranks chain completion for this estate.
llm_router_hermes_narrow_legs_last: true

# THREE SEGMENTS, AND "LAST" MEANS LAST IN THE COMPOSED CHAIN.
#
# The order is local_wide + cloud_only + local_narrow. Anyone who needs a rung
# in ABSOLUTE last position — a rung that must only ever be reached once
# everything else has failed — will reach for a re-sort inside cloud_only, and
# it will look like it worked. It does not: local_narrow is appended after
# cloud_only, so a rung sorted last WITHIN the cloud segment is still tried
# before every narrow local leg.
#
# Measured, pushing one group to the end of cloud_only:
#   [alibaba, gemini, openrouter, <the rung>, hermes-local-4080]
#
# Absolute-last therefore needs a FOURTH segment appended after local_narrow,
# not a re-sort of an existing one. Composition is by concatenation precisely
# so segments stay independently orderable; add the segment rather than
# re-sorting, and the property survives a later change to any other segment.
llm_router_hermes_cloud_fallback_groups: >-
  {%- if llm_router_hermes_narrow_legs_last | bool -%}
  {{ llm_router_hermes_local_wide_groups
     + llm_router_hermes_cloud_only_fallback_groups
     + llm_router_hermes_local_narrow_groups }}
  {%- else -%}
  {{ llm_router_local_fallback_groups + llm_router_hermes_cloud_only_fallback_groups }}
  {%- endif -%}

# LiteLLM's global 429 retry policy exists for a name with nowhere to fall
# back to. A matching model-group policy takes precedence over it for that
# name alone (router_utils/get_retry_from_policy.py:32-33, litellm 1.98.0), so
# enumerate every name that DOES carry a chain: each chain rung, each
# credential-backed provider router, each entry-point name that
# 37-fallback-entry-points.yml keys, and the complexity router itself. Every
# one of them then makes one attempt
# and hands a busy slot to its chain immediately, instead of sleeping on it
# for up to rate_limit_retries x retry_after first. "Busy" is not a failure
# worth a back-off when a chain exists to absorb it — local or paid alike.
#
# Only when the cloud-only groups render, because that is the only condition
# under which an entry-point name has a chain at all: with no credentialed
# rung its zero-retry entry would strip the sleep and leave nothing behind it.
llm_router_hermes_cloud_zero_retry_groups: >-
  {%- set ns = namespace(groups=[]) -%}
  {%- for group in llm_router_hermes_cloud_fallback_groups -%}
  {%- if group not in ns.groups -%}
  {%- set ns.groups = ns.groups + [group] -%}
  {%- endif -%}
  {%- endfor -%}
  {%- for m in llm_router_hermes_local_models + llm_router_hermes_cloud_models_credentialed -%}
  {%- if m.route_group not in ns.groups -%}
  {%- set ns.groups = ns.groups + [m.route_group] -%}
  {%- endif -%}
  {%- endfor -%}
  {%- if llm_router_hermes_cloud_only_fallback_groups | length > 0 -%}
  {%- for name in llm_router_entry_point_names -%}
  {%- if name not in ns.groups -%}
  {%- set ns.groups = ns.groups + [name] -%}
  {%- endif -%}
  {%- endfor -%}
  {#- The complexity router itself: the name that carries almost all traffic.
      A busy local slot under it IS the overflow condition, so it hands to its
      chain at once rather than sleeping on the slot first. -#}
  {%- for m in llm_router_hermes_virtual_models -%}
  {%- set name = m.route_group | default(m.client_model_id) -%}
  {%- if name not in ns.groups -%}
  {%- set ns.groups = ns.groups + [name] -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endif -%}
  {{ ns.groups }}

# The full post-primary Hermes chain: local legs then cloud groups, in
# registry order (llm_router_hermes_cloud_fallback_groups builds both halves
# despite its name — see the NOTE ON NAMING above). Verified against the
# registry independently in roles/llm_router/tasks/assert.yml.
llm_router_hermes_default_fallback_chain: >-
  {{ llm_router_hermes_cloud_fallback_groups }}

# Cloud groups that carry a spend ceiling, and therefore need a local survivor
# member so budget exhaustion filters down to local instead of emptying the
# group and raising. Derived, not listed: a new budgeted entry gets its
# survivor automatically. See the LOCAL SURVIVOR block in model-list.yaml.j2.
llm_router_hermes_cloud_budgeted_groups: >-
  {{ llm_router_hermes_cloud_models_credentialed
     | selectattr('monthly_budget', 'defined')
     | map(attribute='route_group') | unique | list }}
