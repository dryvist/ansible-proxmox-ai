---
# Optional emergency egress for Hermes. This role exposes one fixed provider
# deployment only when its single provider credential is available. The
# registry remains the source of the model identifier and capability limits.
llm_router_openrouter_models: >-
  {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'openrouter') | list }}
llm_router_openrouter_api_key: >-
  {{ bao_local_llm_secrets.OPENROUTER_API_KEY
     | default(lookup('env', 'OPENROUTER_API_KEY'), true) }}
llm_router_openrouter_enabled: "{{ llm_router_openrouter_api_key | trim | length > 0 }}"

# These are admission controls, not a spend limit. The provider key is also
# configured with its own daily cap; the shared LiteLLM budget below provides a
# second estate-wide guard when Redis is available.
llm_router_openrouter_rpm: 12
llm_router_openrouter_tpm: 500000
llm_router_openrouter_max_parallel_requests: 2
llm_router_openrouter_budget_limit: 0
llm_router_openrouter_budget_period: 1d

# The hard OpenRouter route must not be substituted by an upstream provider.
llm_router_openrouter_allow_fallbacks: false
llm_router_openrouter_data_collection: deny

# Shared storage is optional. A provider budget is never rendered without it.
llm_router_redis_host: ""
llm_router_redis_port: "{{ tofu_data.constants.service_ports.redis_default }}"
llm_router_redis_password: >-
  {{ bao_local_llm_secrets.LLM_ROUTER_REDIS_PASSWORD
     | default(lookup('env', 'LLM_ROUTER_REDIS_PASSWORD'), true) }}
