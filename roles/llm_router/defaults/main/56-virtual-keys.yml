---
# --- PER-CALLER VIRTUAL KEYS -------------------------------------------------
# One key per caller class instead of every consumer sharing the master key.
# Buys per-caller attribution in the spend logs and revocation of one tool
# without rotating everything.
#
# `monthly_budget` (this role's own field name) becomes /key/generate's
# `max_budget` + `budget_duration: 7d` in tasks/seed-keys.yml and gets
# resynced onto an already-minted key by tasks/reconcile-key-budgets.yml —
# model_max_budget is the one LiteLLM field this stays away from: it is
# enterprise-licensed and the API rejects it, but a flat max_budget with
# budget_duration is a plain field this deployment honors (probed live:
# POST /key/generate with both set returns 200). Budget-exhaustion recovery
# below the key ceiling is still the local survivor member in each budgeted
# group (model-list.yaml.j2) — the key budget is an outer per-caller cap, not
# a substitute for that. assert-budget-backing.yml extends to require the
# router database before any key here carries a monthly_budget, the same way
# it already requires Redis before a provider budget.
#
# Values are generated at the consumer's own tier and read here, never minted
# by this role — see tasks/seed-keys.yml. An unseeded consumer renders an
# empty value and is skipped, so this list is safe to carry before the
# generating half exists. The Hermes cron fleet's OWN inbound key (as opposed
# to the per-profile keys below, which are outbound to the router) is absent
# for a different reason — its credential lives in the local-llm domain, not
# apps.
#
# Scopes are DERIVED from the registry rather than hand-listed. A retired
# alias cannot linger in a key's allowlist because it stops being derived.

# Everything a human chat UI may select: every servable model, every stable
# alias, and every running agent.
# Self-arms the same way llm_router_openrouter_budget_limit does: honestly
# 0 (and so filtered out everywhere as "no budget") until the router
# database is actually in the inventory, so no key here ever advertises a
# ceiling assert-budget-backing.yml would then have to fail the build over.
#
# HALF of llm_router_openrouter_budget_limit (the provider's own 14.0/week
# cap in inventory/group_vars/llm_router_group.yml), same 7d period,
# deliberately — one consumer must not be ABLE to drain the whole provider
# ceiling by itself. assert-budget-backing.yml enforces the inequality so
# the two numbers cannot drift apart unnoticed.
_llm_router_key_monthly_budget: >-
  {{ 7.0 if (llm_router_db_host | default('') | trim | length > 0) else 0 }}

# Role names (55-roles.yml) ADDED so a full-scope key can actually call
# `fast`/`subagent`/etc — those are DB-seeded model_groups distinct from the
# alias map above, and a key whose models list omits a name that role
# resolves to cannot reach it at all. Every existing full-scope key
# (codex, cursor, opencode, claude-code, open-webui, raycast) picks this up
# automatically on the next converge; no per-key edit needed.
_llm_router_key_scope_all: >-
  {{ (llm_router_servable_models
      + (llm_router_model_group_aliases | list)
      + (llm_router_hermes_agents | list)
      + (llm_router_role_deployments | map(attribute='role') | list)) | unique | list }}

# One key per Hermes operating profile (roles/hermes_agent
# defaults/main/150-fleet-health-profiles.yml `hermes_agent_profiles`), plus
# the implicit `default` profile every card without an explicit assignee
# runs under. DERIVED, not hand-listed: a profile renamed or retired there
# stops being a key alias without a second edit here. `coder` (Vikunja 3085)
# is not a real profile yet, so it is not yet a key — it appears the first
# render after that profile is added, with no further edit to this file.
_llm_router_hermes_profile_names: >-
  {{ ['default'] + (hermes_agent_profiles | default([]) | map(attribute='name') | list) }}

# `default` gets the full human chat scope — it is the cross-domain/board-meta/
# write-bearing catch-all profile. Every named profile is bounded to
# cheap/embed the same way langgraph is below: none of splunk-admin/
# homelab-admin/github-maint carry a lead-tier job.
_llm_router_hermes_profile_keys: >-
  {%- set _items = [] -%}
  {%- for _name in _llm_router_hermes_profile_names -%}
  {%- set _discard = _items.append({
        'alias': 'hermes-' ~ _name,
        'value': bao_apps_secrets.get('hermes_' ~ (_name | replace('-', '_')) ~ '_llm_router_key', ''),
        'models': (_llm_router_key_scope_all if _name == 'default' else ['cheap', 'embed']),
        'monthly_budget': _llm_router_key_monthly_budget,
      }) -%}
  {%- endfor -%}
  {{ _items }}

# Static, one-off callers — a literal list here is fine for a fixed set of
# named tools, as opposed to the profile set above, which is genuinely
# derived from another role's data.
_llm_router_static_virtual_keys:
  - alias: open-webui
    value: "{{ bao_apps_secrets.open_webui_llm_router_key | default('', true) }}"
    models: "{{ _llm_router_key_scope_all }}"
    # Full model scope, so it needs the same budget every other full-scope key
    # carries — see assert-budget-backing.yml's full-scope-key assert.
    monthly_budget: "{{ _llm_router_key_monthly_budget }}"
  # Graph workers do trivial classification and embedding only — no lead tier.
  - alias: langgraph
    value: "{{ bao_apps_secrets.langgraph_llm_router_key | default('', true) }}"
    models: "{{ ['cheap', 'embed'] }}"
  # n8n's LiteLLM Request node (roles/n8n_docker/templates/docker-compose.yml.j2
  # LITELLM_ROUTER_*), scoped to the `cheap` role — n8n_docker_seed_model
  # names this same role.
  - alias: n8n
    value: "{{ bao_apps_secrets.n8n_llm_router_key | default('', true) }}"
    models: "{{ ['cheap'] }}"
  # Hindsight's background retain (fact extraction) scope: the standalone
  # `free` -> `free-zdrless` pair (model-list-free.yaml.j2). Both names
  # are granted: general_settings.enforce_fallback_model_access
  # re-checks the calling key's own allow-list on every fallback hop
  # (litellm/router_utils/fallback_event_handlers.py,
  # _is_fallback_target_authorized), so a key scoped to `free` alone
  # would have the `free` -> `free-zdrless` hop refused outright.
  # `free-zdrless`'s own fallback entry is empty and terminal, so
  # granting it here widens nothing past that boundary.
  # `models_authoritative: true` makes seed-keys.yml REPLACE the live
  # key's model list every run instead of the usual add-only union, so a
  # name granted before this boundary landed cannot linger.
  - alias: hindsight
    value: "{{ bao_apps_secrets.hindsight_llm_router_key | default('', true) }}"
    models: "{{ ['free', 'free-zdrless'] }}"
    rpm_limit: 60
    models_authoritative: true
  # The metrics scraper. /metrics is authenticated by default and this proxy
  # keeps it that way (60-ops.yml), so the scrape needs a key that nothing else
  # would otherwise issue. Same contract as the two above: the value is
  # generated in the apps domain and merely read here, so this entry is a no-op
  # until that half lands and the scrape config on the observability side is
  # handed the same value.
  #
  # NOT `models: []`. On a key an EMPTY list means ALL models
  # (auth_checks.py, `len(models) == 0` -> all_model_access), so a metrics-only
  # key written the obvious way would be a full-access key with a friendly
  # alias. The sentinel is a non-matching, non-empty allowlist: any
  # completion request is refused.
  #
  # /metrics is an ADMIN-ONLY route for a virtual key unless the key carries
  # `allowed_routes` naming it (route_checks.py, litellm 1.98.0) — without
  # this list the key 401s on every scrape with "Only proxy admin can be
  # used", which a scraper reports as no data. Both spellings: the proxy
  # 307s /metrics to /metrics/ and the check is on the path as requested.
  - alias: prometheus-scrape
    value: "{{ bao_apps_secrets.prometheus_llm_router_key | default('', true) }}"
    models: "{{ ['no-default-models'] }}"
    allowed_routes: ["/metrics", "/metrics/"]
  # Zammad's AI provider (custom_open_ai), scoped to the `cheap` role —
  # zammad_ai_model names this same role.
  - alias: zammad
    value: "{{ bao_apps_secrets.zammad_llm_router_key | default('', true) }}"
    models: "{{ ['cheap'] }}"
  # CI, PRIVATE repositories: the `review-private` role only (55-roles.yml —
  # local rungs then the Codex rungs, nothing else). The value is generated in
  # the apps domain and merely read here; revoking CI's access is one key.
  # The live key's model list is reconciled by union (seed-keys.yml), so the
  # roles it carried before (cheap, subagent, fast, judge) stay until removed
  # in the Admin UI once every CI caller has moved to the review roles.
  - alias: github-actions
    value: "{{ bao_apps_secrets.github_actions_llm_router_key | default('', true) }}"
    models: "{{ ['review-private'] }}"
  # CI, open-source repositories: the `review-oss` role only — local rungs, the
  # free external rungs, then the Z.ai pair. Its value is a separate apps-
  # domain secret (github-actions-oss) behind the same switch that fetches
  # it (openbao_secrets 10-domains.yml); off or unseeded, the key is not minted.
  - alias: github-actions-oss
    value: >-
      {{ bao_apps_secrets.github_actions_oss_llm_router_key | default('', true)
         if llm_router_oss_ci_key_enabled | default(false) | bool else '' }}
    models: "{{ ['review-oss'] }}"
  # Workstation clients. Previously deliberately absent for lack of a
  # converge-delivered secret path; each now gets a weekly-budgeted key on the
  # same no-op-until-seeded contract as every entry above.
  - alias: opencode
    value: "{{ bao_apps_secrets.opencode_llm_router_key | default('', true) }}"
    models: "{{ _llm_router_key_scope_all }}"
    monthly_budget: "{{ _llm_router_key_monthly_budget }}"
  - alias: raycast
    value: "{{ bao_apps_secrets.raycast_llm_router_key | default('', true) }}"
    models: "{{ _llm_router_key_scope_all }}"
    monthly_budget: "{{ _llm_router_key_monthly_budget }}"
  - alias: codex
    value: "{{ bao_apps_secrets.codex_llm_router_key | default('', true) }}"
    models: "{{ _llm_router_key_scope_all }}"
    monthly_budget: "{{ _llm_router_key_monthly_budget }}"
  - alias: cursor
    value: "{{ bao_apps_secrets.cursor_llm_router_key | default('', true) }}"
    models: "{{ _llm_router_key_scope_all }}"
    monthly_budget: "{{ _llm_router_key_monthly_budget }}"
  # Claude Code. Reads ANTHROPIC_AUTH_TOKEN (bearer) against
  # ANTHROPIC_BASE_URL — the nix-ai consumer side (modules/claude/
  # settings-env.nix, per the A5 note in 55-roles.yml) is the same
  # apps/<tool> -> settings-env.nix wiring codex/cursor/opencode already use;
  # this role only mints and exposes the value.
  - alias: claude-code
    value: "{{ bao_apps_secrets.claude_code_llm_router_key | default('', true) }}"
    models: "{{ _llm_router_key_scope_all }}"
    monthly_budget: "{{ _llm_router_key_monthly_budget }}"

# The declared list; llm_router_virtual_keys (59-key-scopes.yml) widens each
# key's `models` with every group in its roles' chains.
_llm_router_declared_virtual_keys: "{{ _llm_router_static_virtual_keys + _llm_router_hermes_profile_keys }}"

# On-demand rotation switch for tasks/seed-keys.yml: empty on every ordinary
# converge. Names the alias(es) above whose live key should be deleted and
# re-minted this run, after ansible-proxmox-apps has already regenerated the
# matching *_llm_router_key OpenBao value (its own
# openbao_seed_rotate_fields switch) — e.g.
# -e llm_router_rotate_key_aliases=['n8n'].
llm_router_rotate_key_aliases: []
