---
# --- Routing behaviour -------------------------------------------------------
# Load-balance across same-name deployments; cool a failed one down so traffic
# drains to its sibling (GPU -> CPU). No cross-tier fallbacks.
llm_router_routing_strategy: simple-shuffle
llm_router_allowed_fails: 2
llm_router_cooldown_time: 30
# Forward each request to the MLX backend once. This governs GENUINE failures
# only — a 429 means the backend never started the work, so it is retried under
# the separate rate-limit policy below rather than counted here.
# request_timeout_seconds bounds a single attempt; large-tier generations can
# legitimately run for minutes, so this is generous, not a tight SLA.
# Timeout chain — each OUTER layer outlives the inner one, so no intermediate
# guard kills a still-healthy generation and the CLIENT is the sole decider:
#   MLX model server guard 3600s (nix-darwin) > router attempt 2400s >
#   Hermes client stream read 1800s.
# 2400 (was 1200, was 300): guards are set to realistic ceilings on the
# assumption the request almost always completes even at unusually high
# limits. A 32k-token large-tier generation runs ~1560s at 21 tok/s and longer
# when requests batch; the old 300s server guard masked everything (proven
# cause of the 18:27 UTC cron failures) and 1200 here would have been the next
# binding kill. At 2400 the router now sits ABOVE the client's 1800s ceiling,
# so the client times out first (by design) while the router waits — and
# below the 3600s server guard.
# The per-attempt timeout is the MIDDLE link of the fabric-wide timeout chain
# (server guard > this > Hermes client read), so it is sourced from the
# single-source-of-truth constant (all.yml) the Layer-1 assert checks — resolves
# to 2400.
# DELIBERATELY 0 — this is failover timing, not a missing retry budget.
#
# LiteLLM engages the `fallbacks` chain only AFTER num_retries is exhausted, so
# 0 means a failed primary hands over to the next model group immediately.
# Raising it delays every failover by up to
# llm_router_retry_max_delay_seconds (pinned to 40s alongside the rate-limit
# path). test_goal_mode_contract pins this value for that reason.
#
# Keep same-provider 5xx retries at zero until the controlled retry test proves
# their interaction with fallbacks and the external wall-clock ceiling.
llm_router_num_retries: 0
llm_router_request_timeout_seconds: "{{ ai_router_request_timeout_seconds }}"

# --- ADMISSION BUDGET: never hold for a model that is already busy ----------
# A rung at capacity is handed over, not waited on. Both local gates reject an
# over-capacity request with a 429 in milliseconds, and with zero rate-limit
# retries that 429 IS the hand-off; the retry budget a LOCAL rung may spend on
# admission — retries x backoff — fits inside this many seconds.
# tasks/assert-admission-budget.yml and tests/llm_router/
# test_admission_budget_and_ladder.yml hold the product to this figure, so a
# future retry bump cannot widen it.
llm_router_admission_budget_seconds: 15
# First-byte bound on every local rung, for the ADMITTED request whose backend
# never starts answering (a hung or wedged slot, not a busy one — busy is the
# instant 429 above). First byte on a local rung is the prefill: at the
# measured ~160-275 s time-to-first-token for a ~26k-token prompt on the
# studio 27B, 90 keeps prompts up to roughly the 10k-token class local and
# hands longer ones to cloud. It must stay BELOW the ingress's response-header
# timeout (ai_ingress_response_header_timeout_seconds, 120) or the caller sees
# a 504 before the fallback can fire; the assert holds that inequality. The
# whole-call `timeout` is separate and stays generation-sized.
llm_router_local_stream_timeout_seconds: 90
# Attempts per local rung before handing over: none. A failed or stalled
# local rung is handed to the ladder, and the budget assert bounds the product.
llm_router_local_num_retries: 0
# Cloud groups with several members (38-zero-retry-groups.yml,
# llm_router_multi_member_cloud_groups) retry this many times so a 429 from
# one member lands on the next; it is spent against the same admission budget.
llm_router_cloud_group_retries: 2
# Timeout retries router-wide (retry_policy.TimeoutErrorRetries). A retry
# policy entry REPLACES a deployment's own num_retries for that error type
# (router_utils/get_retry_from_policy.py, litellm 1.98.0), so this is the
# retry count every local rung actually gets on a stalled first byte. Zero:
# a stalled rung is handed over, not re-asked.
llm_router_timeout_retries: 0
# Rate limits are absorbed HERE, not by the caller. The serving tier admits one
# in-flight request per model (llama-swap concurrencyLimit) and rejects the rest
# instantly — its own option doc names this router as the layer that "absorbs
# 429s via its retry policy". Passing the 429 straight through instead (the
# previous 0/0 setting) made that contract a no-op: on 2026-07-24 the
# homelab-ai-fabric-status-v2 cron died outright because a 3m31s generation held
# the slot while the caller's entire tolerance was one 15-second retry. A 429 is
# "the slot is busy", never "the work is impossible", so it must not be fatal.
#
# TWO WAYS TO ABSORB IT, chosen per group name. A name that carries a fallback
# chain hands the busy slot to the chain at once — its
# model_group_retry_policy entry zeroes this figure (config.yaml.j2), and the
# chain, not a sleep, is what keeps the 429 from reaching the caller. That is
# every chain rung, every provider router, and every entry-point name
# (37-fallback-entry-points.yml). The sleeping tolerance below applies only to
# a name with no chain to hand over to. Same guarantee, different mechanism.
#
# Tolerance = rate_limit_retries x retry_after_seconds. 8 x 40s ~= 320s, sized
# above the longest slot occupancy actually observed in that incident (211s) with
# margin. Rejections cost microseconds, so the retry loop spends only the sleeps;
# the budget still fits under the client's 1800s read ceiling with ~1480s left
# for the generation itself.
# ZERO since the admission rule above: a 429 is the hand-off signal. Every
# name that can be asked for carries a ladder (fallbacks below, plus
# router_settings.default_fallbacks for any that does not), so the request
# moves to the next rung in the same call instead of sleeping on the busy one.
# The tolerance arithmetic the comment above describes is retired with it.
llm_router_rate_limit_retries: 0
# Minimum sleep between rate-limit retries (LiteLLM router_settings.retry_after).
# LiteLLM boxes each backoff into [retry_after, MAX_RETRY_DELAY]; the ceiling
# defaults to 8s and would silently clamp this, so the service env pins
# MAX_RETRY_DELAY to the same value (see llm_router_retry_max_delay_seconds).
# Waiting whole tens of seconds is correct here: the blocker is a multi-minute
# generation, so sub-second exponential backoff just burns attempts.
#
# Resolves to the all.yml constant (was a bare 40) so the brain watchdog's probe
# deadline can be asserted against it from roles/hermes_agent — the two roles
# never share a play, so a role-local literal was unassertable. Value unchanged;
# raise it in all.yml, and expect the hermes_agent assert to demand the probe
# timeout move with it.
# Minimum backoff before a retry. Sourced from the all.yml constant so the
# brain watchdog's probe deadline can be asserted against it from
# roles/hermes_agent (the two never share a play). Small since the admission
# rule: a 429 is never retried on the same rung, so this only sizes the
# backoff before a timeout retry, inside the 15 s budget.
llm_router_retry_after_seconds: "{{ ai_router_retry_after_seconds }}"
# Raises LiteLLM's global backoff ceiling so retry_after is not clamped. Only the
# rate-limit path retries at all (num_retries is 0 and no other error type has a
# retry policy), so this has no other blast radius.
llm_router_retry_max_delay_seconds: "{{ llm_router_retry_after_seconds }}"
# Rate-limit failures do not cool down the otherwise healthy deployment.
llm_router_rate_limit_allowed_fails: 1000
# Timeouts are judged against the SAME counter those 429s fill. litellm keeps
# one failure counter per deployment for the router-level policy
# (cooldown_handlers.py:404-408 passes no per-type suffix; :587-594 keys the
# counter by deployment alone, TTL = cooldown_time, 30s here) while looking
# the allowance up per exception type (router.py:12142-12148). So the figure
# a timeout is compared against is not "timeouts in the window" but "failures
# of ANY type in the window, plus this one". With no timeout allowance that
# comparison falls to the generic allowed_fails of 2: a deployment that has
# taken two busy-slot 429s in the last 30s is parked by its first timeout.
#
# 100 is derived from what the counter can actually hold, not from timeouts:
#
#   * Timeouts cannot cluster. Every bound in this role is >= 120s and the
#     local tiers admit one or two in-flight requests, so one deployment can
#     produce at most a couple of timeouts per 30s window. Any figure above
#     that is reached only through 429 inflation, which is the case this
#     exists to absorb — a slow rung finishing near its bound is expected
#     behaviour, not a broken deployment.
#   * It stays far below the rate-limit allowance on purpose. A timeout IS a
#     stronger signal than a 429, and a deployment whose shared counter has
#     climbed past 100 in 30s is under a rejection storm no single slot
#     explains; parking it then is the right call.
#   * It is an order of magnitude above the 429s one router instance can
#     accumulate against one deployment in 30s at the arrival rates this
#     estate has measured, so a healthy-but-busy slot is not parked by its
#     first timeout.
#
# Deployments that set their own cooldown_time: 0 (the local GPU rung) never
# reach this path at all; this governs the large tier and the cloud rungs.
llm_router_timeout_allowed_fails: 100
