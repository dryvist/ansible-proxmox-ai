---
# Project the exact model/API parameters used by every active capability member.
# Role seeding takes the first member below; tag reconciliation checks all of them.
_llm_router_capability_member_params: >-
  {%- set ns = namespace(members=[]) -%}
  {%- for m in llm_router_capability_members -%}
  {%- set upstream = m.litellm_model_name | default(m.provider ~ '/' ~ m.upstream_model_id) -%}
  {%- set params = {
        'model': upstream,
        'tags': llm_router_deployment_tags_by_entry[m.client_model_id ~ '|' ~ m.tier]} -%}
  {%- if m.tier == 'local-large' -%}
  {%- set _ = params.update({'api_base': llm_router_llm_large_base_url,
        'api_key': 'os.environ/LLM_LARGE_BEARER_TOKEN', 'use_chat_completions_api': true}) -%}
  {%- elif m.tier == 'light' -%}
  {%- set _ = params.update({'api_base': llm_router_llm_light_base_url,
        'api_key': llm_router_light_api_key, 'use_chat_completions_api': true}) -%}
  {%- elif m.tier == 'cpu-9b' or m.tier == 'cpu-moe' -%}
  {%- set _ = params.update({'api_base': llm_router_cpu_pool_backend_urls_by_tier[m.tier][0],
        'api_key': llm_router_light_api_key, 'use_chat_completions_api': true}) -%}
  {%- elif m.tier == 'vllm' -%}
  {%- set _ = params.update({'api_base': llm_router_llm_vllm_base_url,
        'api_key': llm_router_light_api_key, 'use_chat_completions_api': true}) -%}
  {%- elif m.tier == 'gpu' -%}
  {%- set _ = params.update({'api_base': llm_router_gpu_profile_base_urls.get(
        m.profile, llm_router_llm_gpu_base_url),
        'api_key': llm_router_light_api_key, 'use_chat_completions_api': true}) -%}
  {%- endif -%}
  {%- set _ = params.update({
        'num_retries': [m.num_retries | default(llm_router_local_num_retries),
                        llm_router_local_num_retries] | min,
        'stream_timeout': [m.stream_timeout | default(llm_router_local_stream_timeout_seconds),
                           llm_router_local_stream_timeout_seconds] | min,
        'timeout': [m.request_timeout | default(llm_router_local_request_timeout_seconds),
                    llm_router_local_request_timeout_seconds] | min}) -%}
  {%- if m.max_parallel_requests is defined -%}
  {%- set _ = params.update({'max_parallel_requests': m.max_parallel_requests}) -%}
  {%- endif -%}
  {%- if m.order is defined -%}
  {%- set _ = params.update({'order': m.order}) -%}
  {%- endif -%}
  {%- set ns.members = ns.members + [{'entry': m, 'params': params}] -%}
  {%- endfor -%}
  {{ ns.members }}

# DB-seeded roles copy the first rendered member of their capability group.
# The selected member is order-aware and carries the same upstream parameters
# and admission bounds as its model_list deployment.
_llm_router_role_params: >-
  {%- set ns = namespace(params={}) -%}
  {%- for member in _llm_router_capability_member_params -%}
  {%- set group = member.entry.route_group -%}
  {%- if group not in ns.params -%}
  {%- set _ = ns.params.update({group: member.params}) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.params }}

_llm_router_role_model_info: >-
  {%- set ns = namespace(info={}) -%}
  {%- for m in llm_router_capability_members -%}
  {%- if m.route_group not in ns.info -%}
  {%- if m.embedding | default(false) -%}
  {%- set _ = ns.info.update({m.route_group: {'mode': 'embedding', 'allow_fail_open': true}}) -%}
  {%- elif m.context_window is defined -%}
  {%- set _ = ns.info.update({m.route_group: {
        'mode': 'chat', 'allow_fail_open': true,
        'max_input_tokens': _llm_router_vllm_max_input_tokens_by_model[m.client_model_id]
                             if m.client_model_id in _llm_router_vllm_max_input_tokens_by_model
                             else m.context_window,
        'max_tokens': m.max_output_tokens | default(m.context_window)}}) -%}
  {%- else -%}
  {%- set _ = ns.info.update({m.route_group: {'mode': 'chat', 'allow_fail_open': true}}) -%}
  {%- endif -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.info }}
