---
# llm_router role defaults — a LiteLLM proxy (the fabric's single OpenAI-compatible
# front door) on each guest tagged `llm-router`. Native install: a Python venv +
# systemd, config at /etc/litellm/config.yaml. Fronted by Traefik at
# https://llm.<subdomain>. Physical backends have one deployment entry each;
# stable consumer role names resolve through model_group_alias below.
#
# Serving tiers reached through this one proxy:
#   local-large — the mlx-community/* models on the neutral `llm-large` runner
#           (bearer auth). One deployment each; no cross-tier fallback.
#   light — qwen3-4b / embeddings. The CPU `llm-light` deployment always
#           renders; the GPU `llm-fast` one renders only when
#           llm_router_llm_fast_enabled is true. With that false there is ONE
#           deployment per model name and no standby. With both, they share a
#           model_name and LiteLLM load-balances and cools down the pair.
#   gpu   — registry profiles on the inventory-backed Pro6000 guest.
#
# Restart-on-failure is native to the unit this role owns. The shared
# systemd_restart_policy role is not present in this repository's immutable
# homelab-contracts pin, so an external-drop-in claim would not be enforceable.

llm_router_user: litellm
llm_router_group: litellm
llm_router_home: /var/lib/litellm
llm_router_venv: /opt/litellm-venv
llm_router_service: litellm
llm_router_config_dir: /etc/litellm
llm_router_config_file: "{{ llm_router_config_dir }}/config.yaml"
llm_router_env_file: "{{ llm_router_config_dir }}/litellm.env"

# Installed into the venv (state: present — pinned by the ecosystem, never here,
# except prisma, which is pinned below because its ecosystem pin is only a floor).
# OTel spans go through the shared Cribl collector; its configured outputs own
# the Langfuse and Phoenix fan-out.
llm_router_pip_packages:
  # Retry/fallback, timeout, complexity routing, rate-limit enforcement and
  # provider-budget behavior are configured against the pinned stable release.
  # 1.104.0 adds fail-closed startup Prisma migration checks by default. The
  # role reconciles the package schema before service start, then leaves that
  # check enabled so LiteLLM can validate/adopt the existing schema history.
  # renovate: datasource=pypi depName=litellm
  - "litellm[proxy]==1.104.0"
  # LiteLLM's own uv.lock pins this exact version. Its published proxy
  # extra permits FastAPI <1, which currently resolves 0.141.1; that release
  # removed get_flat_dependant while LiteLLM still imports it, so a fresh venv
  # crashes before the proxy CLI can start. Keep the upstream-tested lock value
  # until LiteLLM removes that import or tightens its published constraint.
  - "fastapi==0.136.3"
  # LiteLLM's database client, and the reason its auth-error handler can tell a
  # DB outage from a bad key: that handler unconditionally `import prisma`s, but
  # litellm[proxy] no longer pulls prisma, so a missing install turned every
  # rejected/absent key into a 500 instead of a 401. It was added for that alone
  # while this proxy was database-less. It now also carries real traffic — the
  # role deployments and their fallback order live in Postgres (45-database.yml)
  # — so it is a functional dependency, not only an import the handler needs to
  # resolve.
  # Pinned, not floating: litellm 1.104.0 (proxy/db/prisma_client.py) reads and
  # writes `_Prisma__engine`, the name-mangled engine attribute of the 0.11.x
  # generated client. prisma 0.14.0 and 0.15.0 dropped that attribute, so an
  # unpinned install resolved to 0.15.0 and every database-backed start raised
  # "'Prisma' object has no attribute '_Prisma__engine'". 0.11.0 is also the
  # lower bound litellm declares for its prisma requirement.
  # renovate: datasource=pypi depName=prisma
  - "prisma==0.11.0"
  # LiteLLM's migration runner takes a Postgres advisory lock through psycopg
  # (litellm_proxy_extras/migration_lock.py) before it applies the schema at
  # startup. Neither litellm[proxy] nor prisma pulls it, so a database-backed
  # proxy exits with ModuleNotFoundError before it ever listens. The binary
  # extra bundles libpq, so no system package is needed in the guest.
  - "psycopg[binary]"
  # Backs the fallback-event counters (60-ops.yml). litellm[proxy] does NOT
  # pull it: upstream declares prometheus-client under its separate
  # `proxy-runtime` extra, not `proxy`, so enabling the callback without this
  # line raises ImportError at startup rather than merely skipping the metrics.
  # Range copied from upstream's own declaration rather than pinned here, so
  # this tracks what LiteLLM tests against instead of a number chosen locally.
  - "prometheus-client>=0.20.0,<1.0"
  # uvx is LiteLLM 1.104's allowlisted stdio runner for the Zammad MCP server.
  # Pin it so a fresh environment cannot change the runner during converge.
  # renovate: datasource=pypi depName=uv
  - "uv==0.12.23"
  - opentelemetry-api
  - opentelemetry-sdk
  - opentelemetry-exporter-otlp
  # OTel v2's nested trace needs this to capture the FastAPI/auth/DB spans
  # around the LLM call span; without it only the LLM call span renders.
  - opentelemetry-instrumentation-fastapi
