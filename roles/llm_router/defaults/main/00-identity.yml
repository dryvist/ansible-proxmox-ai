---
# llm_router role defaults — a LiteLLM proxy (the fabric's single OpenAI-compatible
# front door) on each guest tagged `llm-router`. Native install: a Python venv +
# systemd, config at /etc/litellm/config.yaml. Fronted by Traefik at
# https://llm.<subdomain>. Physical backends have one deployment entry each;
# stable consumer role names resolve through model_group_alias below.
#
# Serving tiers reached through this one proxy:
#   local-large — the mlx-community/* models on the neutral `llm-large` runner
#           (bearer auth). One deployment each; no cross-tier fallback.
#   light — qwen3-4b / embeddings. The CPU `llm-light` deployment always
#           renders; the GPU `llm-fast` one renders only when
#           llm_router_llm_fast_enabled is true. With that false there is ONE
#           deployment per model name and no standby. With both, they share a
#           model_name and LiteLLM load-balances and cools down the pair.
#   gpu   — registry profiles on the inventory-backed Pro6000 guest.
#
# Restart-on-failure is native to the unit this role owns. The shared
# systemd_restart_policy role is not present in this repository's immutable
# homelab-contracts pin, so an external-drop-in claim would not be enforceable.

llm_router_user: litellm
llm_router_group: litellm
llm_router_home: /var/lib/litellm
llm_router_venv: /opt/litellm-venv
llm_router_service: litellm
llm_router_config_dir: /etc/litellm
llm_router_config_file: "{{ llm_router_config_dir }}/config.yaml"
llm_router_env_file: "{{ llm_router_config_dir }}/litellm.env"

# Package requirements live in the Renovate-managed source beside the compiled
# hash lock; this list supports the role's version lookups and Prisma repair.
# OTel spans go through the shared Cribl collector; its configured outputs own
# the Langfuse and Phoenix fan-out.
llm_router_pip_packages: >-
  {{ lookup('file', (role_path | default((playbook_dir | dirname | dirname) ~ '/roles/llm_router'))
     ~ '/files/requirements.in')
     | regex_findall('(?m)^[^\s#][^\r\n]+') }}

# uvx is the standalone stdio runner used by LiteLLM's MCP configuration.
# Install its pin separately from the proxy dependency lock.
# renovate: datasource=pypi depName=uv
llm_router_uv_package: "uv==0.13.5"
