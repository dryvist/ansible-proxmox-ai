---
# Per-workstation local-proxy keys. Split out of 56-virtual-keys.yml for the
# per-file token budget; concatenated into _llm_router_declared_virtual_keys
# there, so they seed and widen exactly like every static key.
_llm_router_workstation_virtual_keys:
  # The primary workstation's local proxy, separate from the shared
  # litellm-local key so its spend and requests carry their own alias and it
  # can be revoked alone. `zdr_only` (59-key-scopes.yml) strips every
  # zero_data_retention: false group from the widened chain: everything this
  # proxy forwards must stay on a zero-data-retention backend.
  # `models_authoritative` so a live key granted a ZDR-false name before this
  # boundary loses it on the next converge.
  - alias: litellm-local-workstation
    value: "{{ bao_apps_secrets.litellm_local_workstation_llm_router_key | default('', true) }}"
    models: "{{ ['subagent', 'fast', 'fast-gpu', 'cheap', 'recorder'] }}"
    zdr_only: true
    models_authoritative: true
    monthly_budget: "{{ _llm_router_key_monthly_budget }}"
