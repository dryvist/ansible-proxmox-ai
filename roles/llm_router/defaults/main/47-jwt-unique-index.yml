---
# Unique index LiteLLM 1.104.0 adds to LiteLLM_JWTKeyMapping, created by the role
# before `prisma db push` so the push finds nothing to change and needs no
# --accept-data-loss.
#
# Definition: litellm/proxy/schema.prisma (1.104.0), model LiteLLM_JWTKeyMapping:
#   @@unique([jwt_issuer, jwt_claim_name, jwt_claim_value])
# Name: Prisma's default unique-index rule, prisma-engines
# psl/psl-core/src/datamodel_connector/constraint_names.rs
# (ConstraintNames::unique_index_name, index_name_impl) with the PostgreSQL
# identifier limit of 63 bytes (postgres_datamodel_connector.rs):
#   {table}_{columns joined by _}, cut to 63 - len("_key") = 59 bytes when it
#   is 59 or longer, then "_key" appended.
# Here the joined name is exactly 63 bytes, so it is cut to 59 bytes, giving
# the name below. tests/llm_router/test_jwt_unique_index.yml re-derives it.
llm_router_jwt_mapping_table: LiteLLM_JWTKeyMapping
llm_router_jwt_unique_columns:
  - jwt_issuer
  - jwt_claim_name
  - jwt_claim_value
llm_router_jwt_unique_index: LiteLLM_JWTKeyMapping_jwt_issuer_jwt_claim_name_jwt_claim_v_key
