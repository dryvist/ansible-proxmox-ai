---
# A `zdr_only` key also holds the whole private ZDR scope: local tiers and
# asserted-ZDR groups, so a fallback partway through is never refused.
# A key whose tags require `&zdr` is narrowed to groups that have no retaining
# or free member. LiteLLM applies the inherited tag constraint on every hop;
# enforce_fallback_model_access remains the second layer on the model list.
llm_router_virtual_keys: >-
  {%- set _ci_only_groups = llm_router_registry_enabled
        | selectattr('review_private_only', 'defined')
        | map(attribute='route_group') | list -%}
  {%- set _declared_keys = _llm_router_declared_virtual_keys -%}
  {%- set _rungs_by_class = _llm_router_m_d1_rungs_by_class -%}
  {%- set _zdr_rungs_by_class = llm_router_d1_zdr_rungs_by_class -%}
  {%- set _group_class_by_name = llm_router_d1_group_class_by_name -%}
  {%- set _role_deployments = llm_router_role_deployments -%}
  {%- set _zdr_unasserted = llm_router_zdr_unasserted_terminal_rungs -%}
  {%- set _zdr_false_groups = llm_router_zdr_false_group_names -%}
  {%- set _litellm_release = (llm_router_pip_packages
        | select('match', '^litellm\\[') | first).split('==')[-1] -%}
  {%- set out = [] -%}
  {%- for k in _declared_keys
       if (k.enabled is not defined or k.enabled | bool) -%}
  {%- set _classes = k.allowed_classes | default([]) -%}
  {%- set _zdr_only = '&zdr' in (k.tags | default([])) -%}
  {%- set _rungs = namespace(models=[]) -%}
  {%- for _class in (_classes if not (k.models_authoritative | default(false) | bool) else []) -%}
  {%- set _class_rungs = (_zdr_rungs_by_class[_class]
                           if _zdr_only and _class in ['local', 'sub', 'paid-zdr']
                           else [] if _zdr_only
                           else _rungs_by_class[_class]) -%}
  {%- set _rungs.models = _rungs.models + _class_rungs -%}
  {%- endfor -%}
  {%- set ns = namespace(models=(k.models | list) + (_rungs.models if _classes | length > 0 else [])) -%}
  {%- for d in _role_deployments if d.role in k.models -%}
  {%- set ns.models = ns.models + [d.model] + (d.fallbacks | list) -%}
  {%- endfor -%}
  {%- set _filtered = [] -%}
  {%- for _name in ns.models | unique | list -%}
  {%- set _name_class = _group_class_by_name.get(_name) -%}
  {%- if (not _classes or _name_class is none or _name_class in _classes)
        and (k.alias == 'github-actions' or _name not in _ci_only_groups)
        and (not _zdr_only or _name not in _zdr_unasserted) -%}
  {%- set _discard = _filtered.append(_name) -%}
  {%- endif -%}
  {%- endfor -%}
  {%- set ns.models = _filtered -%}
  {%- if k.zdr_only | default(false) -%}
  {%- set _stripped = _zdr_false_groups + _zdr_unasserted -%}
  {%- set ns.models = (ns.models + _llm_router_private_zdr_model_scope)
        | reject('in', _stripped) | list -%}
  {%- elif _zdr_only -%}
  {%- set _stripped = _zdr_unasserted -%}
  {%- set ns.models = ns.models | reject('in', _stripped) | list -%}
  {%- endif -%}
  {%- set _purpose = (k.metadata | default({})).get(
        'purpose', 'benchmark' if k.alias == 'inference-direct-only' else 'live') -%}
  {%- set _permissions = k.object_permission
        | default(llm_router_mcp_default_object_permission) -%}
  {%- if _permissions.mcp_servers is defined and k.owner_filter | default(true) -%}
  {%- set _owned_elsewhere = ai_agent_owner | default({}) | dict2items
        | rejectattr('value', 'equalto', k.alias) | map(attribute='key') | list -%}
  {%- set _permissions = _permissions | combine({'mcp_servers':
        _permissions.mcp_servers | reject('in', _owned_elsewhere) | list}, recursive=true) -%}
  {%- endif -%}
  {%- set _key = k | dict2items
        | rejectattr('key', 'equalto', 'owner_filter') | items2dict -%}
  {%- set _sensitivity_tag = k.sensitivity_tag | default('&sensitivity:sensitive') -%}
  {%- set _ = out.append(_key | combine({
        'models': ns.models | unique | list,
        'sensitivity_tag': _sensitivity_tag,
        'object_permission': _permissions,
        'metadata': {'trace_defaults': {
          'client': k.alias,
          'runner': (k.metadata | default({})).get('runner', k.alias),
          'runtime': (k.metadata | default({})).get('runtime', k.alias),
          'purpose': _purpose,
          'tier': (k.metadata | default({})).get('tier', k.tier | default('local')),
          'environment': 'benchmark' if _purpose == 'benchmark' else llm_router_trace_environment,
          'release': _litellm_release,
        } | combine((k.metadata | default({})).get('trace_defaults', {})),
        'trace_required': llm_router_benchmark_trace_fields},
      }, recursive=true)) -%}
  {%- endfor -%}
  {{ out }}
