---
# --- THE SERVABLE SET + consumer aliases (projected from the registry) --------
# The Mac large-tier serving host holds a bounded set of models warm (nix-ai
# llama-swap-topology.nix, sized by maxResidentWorkers — TWO since 2026-08-14,
# one deliberate and one routine), plus a small evictable swap tier beside them.
# Every other catalogued model is deliberately demoted to `disabledModels`, and
# a request naming one gets a 404 — by design, so a caller can never be answered
# by a resident's weights under another model's name.
#
# Which means an alias pointing anywhere outside this set is not "slightly
# stale", it is UNROUTABLE. Measured 2026-07-28 against the live gate, before
# any shared definition existed: hermes-default, goal-judge and
# every other consumer alias ALL returned 404 — every consumer alias at once, because the
# alias map and the serving host's enabled set had no common source. It stayed
# invisible while llama-swap still grafted disabled ids onto the resident
# (Hermes was answered by a model nobody selected); nix-ai#1441 removed that
# graft and the 404s surfaced.
#
# Serving-side changes are recorded in ONE place — the registry's `servable`
# flag and, for the Mac tier, its `serving_role`. GPU profiles use their own
# inventory-backed `/models` probe. Selectors and aliases derive from those
# registry entries; `llm_router_all_servable_models` feeds the alias assert.
# Repointing the Mac primary means moving `serving_role: primary` to another
# registry entry and nothing else.
#
# `servable` is NOT `enabled`: enabled means the router offers the id at all
# (every enabled entry is), servable means the selected backend is expected to
# answer for it. The Mac tier uses `serving_role`; GPU profiles are a separate
# inventory-backed class. Conflating the two is what
# produces a 404 instead of an answer. Counts are deliberately not written here
# — a number in a comment is the first thing to go stale.
#
# Capability names and aliases are projections of registry route_group and
# stable_aliases. The role selectors use serving_role / embedding metadata.
# Keep catalogued capability names for the existing gated tiers, while an OCR
# group is advertised only when an active OCR entry supplies it.
_llm_router_capability_names_source: >-
  {%- set _entries = llm_router_model_registry
        | selectattr('tier', 'in', llm_router_local_registry_tiers)
        | selectattr('route_group', 'defined') | list -%}
  {%- set _ocr_groups = _entries | selectattr('serving_role', 'defined')
        | selectattr('serving_role', 'equalto', 'ocr')
        | map(attribute='route_group') | list -%}
  {%- set _enabled_ocr_groups = llm_router_capability_members
        | selectattr('tier', 'in', llm_router_local_registry_tiers)
        | selectattr('serving_role', 'defined')
        | selectattr('serving_role', 'equalto', 'ocr')
        | map(attribute='route_group') | list -%}
  {{ (_entries | map(attribute='route_group') | list)
     | difference(_ocr_groups | difference(_enabled_ocr_groups)
                  + llm_router_agent_only_groups) | unique | list }}
llm_router_capability_names: "{{ _llm_router_m_capability_names }}"
_llm_router_declared_primary: >-
  {{ llm_router_registry_enabled | selectattr('serving_role', 'defined')
     | selectattr('serving_role', 'equalto', 'primary') | first }}
# Only eligible, context-backed chat deployments can replace an excluded lane.
_llm_router_safe_local_models_source: >-
  {{ llm_router_capability_members
     | selectattr('route_group', 'in',
         [_llm_router_declared_primary.route_group, llm_router_small_capability_name])
     | selectattr('context_window', 'defined')
     | rejectattr('context_window', 'none') | list }}
llm_router_safe_local_models: "{{ _llm_router_m_safe_local_models }}"
# Another member of the declared primary's route group keeps the primary capability.
_llm_router_primary_local_model_source: >-
  {{ (llm_router_safe_local_models
      | selectattr('client_model_id', 'equalto', _llm_router_declared_primary.client_model_id)
      | first)
     | default(llm_router_safe_local_models
               | selectattr('route_group', 'equalto', _llm_router_declared_primary.route_group)
               | first)
     | default(llm_router_safe_local_models | first
               | default(_llm_router_declared_primary)) }}
_llm_router_primary_local_model: "{{ _llm_router_m_primary_local_model }}"
llm_router_primary_large_model: "{{ _llm_router_primary_local_model.route_group }}"
llm_router_large_model: >-
  {{ (llm_router_registry_enabled | selectattr('serving_role', 'defined')
      | selectattr('serving_role', 'equalto', 'large') | first
      | default({'route_group': llm_router_primary_large_model}, true)).route_group }}
llm_router_primary_model: >-
  {{ llm_router_primary_large_model }}
# The physical registry entry whose window backs the default route.
llm_router_primary_serving_model: >-
  {{ _llm_router_primary_local_model.client_model_id }}
# The small capability's own route group, rendered or not.
llm_router_small_capability_name: >-
  {{ (llm_router_model_registry | selectattr('tier', 'equalto', 'vllm') | first).route_group }}
# The small capability while a deployment renders it; otherwise the primary
# capability, so routine callers never name a group the router does not serve.
llm_router_small_model: >-
  {{ llm_router_small_capability_name
     if llm_router_small_capability_name in llm_router_rendered_capability_names
     else llm_router_primary_large_model }}
llm_router_routine_model: >-
  {{ llm_router_small_model }}
# The physical ids the Mac serving gate must list: what the parity assert
# (tasks/assert-servable-parity.yml) compares against the gate's own listing.
_llm_router_servable_models_source: >-
  {{ llm_router_registry_enabled | selectattr('servable', 'defined')
     | selectattr('servable') | selectattr('tier', 'equalto', 'local-large')
     | map(attribute='client_model_id') | list }}
llm_router_servable_models: "{{ _llm_router_m_servable_models }}"
# The capability names those entries (and the other servable tiers) route
# through; the alias, key-scope and fallback projections read this set.
llm_router_servable_route_groups: >-
  {%- set ns = namespace(groups=[]) -%}
  {%- for m in llm_router_registry_enabled
       | selectattr('servable', 'defined')
       | selectattr('servable')
       | rejectattr('tier', 'equalto', 'vllm') -%}
  {%- if not (m.benchmark_only | default(false) | bool)
        and m.client_model_id not in (llm_router_benchmark_only_model_names | default([]))
        and m.route_group is defined and m.route_group is not none
        and m.route_group not in (llm_router_benchmark_only_model_names | default([])) -%}
  {%- if m.route_group not in ns.groups -%}
  {%- set ns.groups = ns.groups + [m.route_group] -%}
  {%- endif -%}
  {%- endif -%}
  {%- endfor -%}
  {%- for m in llm_router_vllm_models
       | selectattr('servable', 'defined')
       | selectattr('servable') -%}
  {%- if not (m.benchmark_only | default(false) | bool)
        and m.client_model_id not in (llm_router_benchmark_only_model_names | default([]))
        and m.route_group is defined and m.route_group is not none
        and m.route_group not in (llm_router_benchmark_only_model_names | default([])) -%}
  {%- if m.route_group not in ns.groups -%}
  {%- set ns.groups = ns.groups + [m.route_group] -%}
  {%- endif -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.groups }}
# The Pro6000 is served by its own inventory-backed endpoint, not the Mac
# large-tier gate. Keep its checked set separate and combine only for routing.
_llm_router_gpu_servable_models_source: >-
  {{ llm_router_gpu_models | selectattr('servable', 'defined')
     | selectattr('servable') | map(attribute='route_group')
     | reject('in', llm_router_benchmark_only_model_names) | unique | list }}
llm_router_gpu_servable_models: "{{ _llm_router_m_gpu_servable_models }}"
llm_router_opencode_stable_alias_entries: >-
  {{ (llm_router_opencode_models
      | selectattr('stable_aliases', 'defined')
      | rejectattr('client_model_id', 'in', llm_router_benchmark_only_model_names) | list)
     if (_llm_router_m_resolved_credentials.get('OPENCODE_API_KEY', '')
         | string | length > 0) else [] }}
llm_router_opencode_stable_alias_targets: >-
  {{ llm_router_opencode_stable_alias_entries
     | map(attribute='client_model_id') | list }}
llm_router_gpu_co_resident_models: >-
  {{ llm_router_gpu_models
     | selectattr('profile', 'in', llm_router_gpu_co_resident_profiles) | list }}
_llm_router_all_servable_models_source: >-
  {{ (llm_router_servable_route_groups + llm_router_gpu_servable_models
      + llm_router_opencode_stable_alias_targets) | unique
     | reject('in', llm_router_benchmark_only_model_names)
     | reject('equalto', none) | list }}
llm_router_all_servable_models: "{{ _llm_router_m_all_servable_models }}"

# Background health checks send REAL test requests to every deployment — on the
# single-slot tiers (large + standby: llama-swap; fast + light: llama-server
# router mode) each probe spawns or evicts the target model, and with 3
# routers probing every model this both
# churns VRAM constantly and (pre swap-groups) triple-loaded the 16 GB card and
# hard-hung the GPU host. Passive recovery (allowed_fails + cooldown_time)
# already re-admits drained deployments, so active probing stays off there —
# see config.yaml.j2's model_info.disable_background_health_check on those
# deployments.
#
# Per-deployment exclusion via model_info.disable_background_health_check is
# present in LiteLLM 1.104.0's background-probe filter. The GPU profiles also
# disable active probes because loading several heavy models can churn memory;
# it is safe to turn ON for tiers that do not swap: the dedicated vLLM guest
# and credential-gated remote SaaS legs.
llm_router_background_health_checks: true
llm_router_health_check_interval: 300
