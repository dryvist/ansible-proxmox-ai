---
# --- THE SERVABLE SET + consumer aliases (projected from the registry) --------
# The Mac large-tier serving host holds a bounded set of models warm (nix-ai
# llama-swap-topology.nix, sized by maxResidentWorkers — TWO since 2026-08-14,
# one deliberate and one routine), plus a small evictable swap tier beside them.
# Every other catalogued model is deliberately demoted to `disabledModels`, and
# a request naming one gets a 404 — by design, so a caller can never be answered
# by a resident's weights under another model's name.
#
# Which means an alias pointing anywhere outside this set is not "slightly
# stale", it is UNROUTABLE. Measured 2026-07-28 against the live gate, before
# any shared definition existed: hermes-default, tool-calling, goal-judge and
# interim-brain ALL returned 404 — every consumer alias at once, because the
# alias map and the serving host's enabled set had no common source. It stayed
# invisible while llama-swap still grafted disabled ids onto the resident
# (Hermes was answered by a model nobody selected); nix-ai#1441 removed that
# graft and the 404s surfaced.
#
# Serving-side changes are recorded in ONE place — the registry's `servable`
# flag and, for the Mac tier, its `serving_role`. GPU profiles use their own
# inventory-backed `/models` probe. Selectors and aliases derive from those
# registry entries; `llm_router_all_servable_models` feeds the alias assert.
# Repointing the Mac primary means moving `serving_role: primary` to another
# registry entry and nothing else.
#
# `servable` is NOT `enabled`: enabled means the router offers the id at all
# (every enabled entry is), servable means the selected backend is expected to
# answer for it. The Mac tier uses `serving_role`; GPU profiles are a separate
# inventory-backed class. Conflating the two is what
# produces a 404 instead of an answer. Counts are deliberately not written here
# — a number in a comment is the first thing to go stale.
#
# The primary/routine/small/ocr projections below read the canonical role map
# (`llm_roles`, dryvist.homelab.llm_roles, loaded by tasks/registry.yml):
# roles best/fast/small/ocr -> the model each names -> that model's id, which
# is the entry's client_model_id. tasks/assert-llm-roles.yml holds the registry
# to the same map, so a model the map names but the registry lacks fails the
# converge rather than a lookup here.
llm_router_primary_large_model: >-
  {{ llm_roles.models[llm_roles.roles.best.model].id }}
llm_router_primary_model: >-
  {{ llm_router_vllm_medium_route_alias
     if llm_router_vllm_medium_route_enabled | bool
     else llm_router_primary_large_model }}
# The small tier: judge/trivial work, normally cross-family to the primary
# (user decision 2026-07-28 — concurrency belongs to the largest accurate
# model). If its mapped entry is parked, use the active primary until rebuild.
# See the registry for the cold-load caveat: servable does not mean pre-loaded.
llm_router_small_model: >-
  {%- set _model = llm_roles.models[llm_roles.roles.small.model].id -%}
  {{ _model if _model in llm_router_servable_models else llm_router_primary_large_model }}
# The routine tier follows the mapped fast model while it is actively servable.
# A parked model falls back to the active primary until its host is rebuilt.
llm_router_routine_model: >-
  {%- set _model = llm_roles.models[llm_roles.roles.fast.model].id -%}
  {{ _model if _model in llm_router_servable_models else llm_router_primary_large_model }}
llm_router_servable_models: >-
  {{ llm_router_registry_enabled | selectattr('servable', 'defined')
     | selectattr('servable') | selectattr('tier', 'equalto', 'large')
     | map(attribute='client_model_id') | list }}
# The Pro6000 is served by its own inventory-backed endpoint, not the Mac
# large-tier gate. Keep its checked set separate and combine only for routing.
llm_router_gpu_servable_models: >-
  {{ llm_router_gpu_models | selectattr('servable', 'defined')
     | selectattr('servable') | map(attribute='client_model_id') | list }}
llm_router_all_servable_models: >-
  {{ (llm_router_servable_models + llm_router_gpu_servable_models) | unique | list }}

# Stable consumer role names come from each registry entry's `stable_aliases`.
# Aliases carry no deployment configuration; each resolves to one physical
# model_list entry in the combined large/GPU servable set. While the GPU primary
# route is active, the canonical best-role alias follows that route and its
# fallback entry gives the Mac primary as its next rung.
#
# The hermes-router tier's enabled entries, with a real context window —
# the SOLE derivation of this carve-out. tasks/assert.yml (both asserts) and
# tests/llm_router/test_alias_servable.yml reference this var rather than
# re-deriving it, so the carve-out can only ever mean one thing.
llm_router_hermes_router_ids: >-
  {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'hermes-router')
     | selectattr('context_window', 'defined') | rejectattr('context_window', 'none')
     | map(attribute='client_model_id') | list }}
llm_router_auto_router_model: "{{ llm_router_hermes_router_ids | first }}"

# OpenRouter candidates for long-context requests and the retained legacy
# fallback. Only an explicit zero_data_retention assertion qualifies; a missing
# field is retaining.
llm_router_long_context_alias_ids: >-
  {%- set _candidates = llm_router_registry_enabled
        | selectattr('tier', 'equalto', 'openrouter')
        | selectattr('context_window', 'defined')
        | selectattr('context_window', '>=', 1000000) | list -%}
  {{ (_candidates | selectattr('zero_data_retention', 'defined')
      | selectattr('zero_data_retention') | list)
     | map(attribute='client_model_id') | list }}

# SERVABLE ENTRIES, plus the hermes-router tier and the long-context
# carve-out, ONLY. A static model_group_alias is subject to the two asserts
# in tasks/assert.yml: its target must be in the servable set (or one of the
# two named carve-outs) and must carry a real context window (hermes-router
# and long-context are each individually exempted there). Roles that target
# the hermes-router are rendered as aliases; other non-alias role names are
# seeded into the router database (tasks/seed-roles.yml). The hermes-router
# and long-context tiers are admitted alongside `servable` (not folded into
# it) because `servable` means "the serving host will answer for this id
# directly" and neither ever does — the complexity router dispatches locally,
# and the long-context entry is a remote paid OpenRouter model. Adding either
# to `servable` itself would corrupt llm_router_servable_models and the
# verify-servable probe (2026-07-28).
#
# `fast` and `cheap` target the complexity router, so they are rendered as
# aliases and old DB rows are retired by tasks/retire-role-deployments.yml.
# `judge`/`embed`/`ocr` remain database-seeded roles. GPU profiles are excluded
# until the profile switch activates them; the primary role alias then follows
# the shared route, while the other aliases retain their own targets.
llm_router_alias_pairs: >-
  {%- set ns = namespace(pairs=[]) -%}
  {%- set _entries = ((llm_router_registry_enabled | selectattr('servable', 'defined')
       | selectattr('servable') | list)
      + (llm_router_registry_enabled | selectattr('tier', 'defined')
         | selectattr('tier', 'equalto', 'hermes-router') | list)
      + (llm_router_registry_enabled
         | selectattr('client_model_id', 'in', llm_router_long_context_alias_ids) | list)) -%}
  {%- for _entry in _entries | selectattr('stable_aliases', 'defined') -%}
  {%- for _alias in _entry.stable_aliases -%}
  {%- if _entry.client_model_id != llm_router_vllm_medium_model
        or _alias != llm_router_vllm_medium_route_alias
        or llm_router_vllm_medium_route_enabled | bool -%}
  {%- set _target = _entry -%}
  {%- if _alias in llm_router_primary_route_fallback_aliases -%}
  {%- set _target = llm_router_vllm_medium_route_models | first -%}
  {%- endif -%}
  {%- set ns.pairs = ns.pairs + [[_target, _alias]] -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ ns.pairs }}
llm_router_model_group_aliases: >-
  {{ dict(llm_router_alias_pairs | map(attribute=1)
          | zip(llm_router_alias_pairs | map(attribute=0)
                | map(attribute='client_model_id')))
     | combine(llm_router_auto_router_role_aliases) }}
llm_router_auto_router_role_aliases: >-
  {%- set ns = namespace(aliases={}) -%}
  {%- for role in llm_router_role_deployments
       if role.model == llm_router_auto_router_model -%}
  {%- set _ = ns.aliases.update({role.role: role.model}) -%}
  {%- endfor -%}
  {{ ns.aliases }}


# Background health checks send REAL test requests to every deployment — on the
# single-slot tiers (large + standby: llama-swap; fast + light: llama-server
# router mode) each probe spawns or evicts the target model, and with 3
# routers probing every model this both
# churns VRAM constantly and (pre swap-groups) triple-loaded the 16 GB card and
# hard-hung the GPU host. Passive recovery (allowed_fails + cooldown_time)
# already re-admits drained deployments, so active probing stays off there —
# see config.yaml.j2's model_info.disable_background_health_check on those
# deployments.
#
# Per-deployment exclusion via model_info.disable_background_health_check is
# present in LiteLLM 1.104.0's background-probe filter. The GPU profiles also
# disable active probes because loading several heavy models can churn memory;
# it is safe to turn ON for tiers that do not swap: the dedicated vLLM guest
# and credential-gated remote SaaS legs.
llm_router_background_health_checks: true
llm_router_health_check_interval: 300
