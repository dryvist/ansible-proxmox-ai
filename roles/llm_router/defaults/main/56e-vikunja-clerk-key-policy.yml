---
# Keep all per-role clerk routing and grants behind one opt-in. The static data
# below is also the source for each key's narrower model grant and alias map.
llm_router_hermes_vikunja_clerk_variants_enabled: false
_llm_router_vikunja_clerk_default_key_aliases:
  agent-vikunja-clerk: agent-vikunja-clerk-inbox
_llm_router_vikunja_clerk_outside_trusted:
  aliases:
    agent-vikunja-clerk: agent-vikunja-clerk-untrusted
  models: [agent-vikunja-clerk-untrusted]
_llm_router_vikunja_clerk_roles:
  workstation:
    aliases: {agent-vikunja-clerk: agent-vikunja-clerk-workstation}
    models: [agent-vikunja-clerk-workstation, agent-youtrack-clerk, agent-zammad-clerk, agent-vikunja-windows]
  hermes:
    aliases: {agent-vikunja-clerk: agent-vikunja-clerk-hermes}
    models: [agent-vikunja-clerk-hermes, agent-vikunja-triage, agent-vikunja-nightly, agent-vikunja-windows]
  pepper:
    aliases: {agent-vikunja-clerk: agent-vikunja-clerk-pepper}
    models: [agent-vikunja-clerk-pepper]
  untrusted:
    aliases: {agent-vikunja-clerk: agent-vikunja-clerk-untrusted}
    models: [agent-vikunja-clerk-untrusted]
  jobs:
    aliases: {agent-vikunja-clerk: agent-vikunja-clerk-jobs}
    models: [agent-vikunja-clerk-jobs, agent-vikunja-windows]
  inbox:
    aliases: {agent-vikunja-clerk: agent-vikunja-clerk-inbox}
    models: [agent-vikunja-clerk-inbox]
_llm_router_vikunja_clerk_key_roles:
  hermes-default: hermes
  # This shared local proxy cannot distinguish its clients, so keep it inbox-only.
  litellm-local-workstation: inbox
  claude-code: workstation
  codex: workstation
  pepper: pepper
_llm_router_vikunja_clerk_acceptance:
  key_alias: evals
  aliases:
    agent-vikunja-clerk: agent-vikunja-clerk-acceptance
    agent-vikunja-triage: agent-vikunja-triage-acceptance
    agent-vikunja-nightly: agent-vikunja-nightly-acceptance
    agent-vikunja-windows: agent-vikunja-windows-acceptance
  models:
    - agent-vikunja-clerk-acceptance
    - agent-vikunja-triage-acceptance
    - agent-vikunja-nightly-acceptance
    - agent-vikunja-windows-acceptance
_llm_router_vikunja_clerk_excluded_key_aliases:
  - github-actions
  - github-actions-ci-fix
  - github-actions-pr-review
  - github-actions-oss
  - openhands
llm_router_vikunja_clerk_key_policy: >-
  {{ {'enabled': llm_router_hermes_vikunja_clerk_variants_enabled | bool,
      'default_aliases': _llm_router_vikunja_clerk_default_key_aliases,
      'outside_trusted': _llm_router_vikunja_clerk_outside_trusted,
      'roles': _llm_router_vikunja_clerk_roles,
      'key_roles': _llm_router_vikunja_clerk_key_roles,
      'acceptance': _llm_router_vikunja_clerk_acceptance,
      'excluded_key_aliases': _llm_router_vikunja_clerk_excluded_key_aliases} }}
# Every clerk model that a role grant, the acceptance grant or the default map names.
_llm_router_vikunja_clerk_managed_models: >-
  {{ (_llm_router_vikunja_clerk_outside_trusted.models
      + _llm_router_vikunja_clerk_acceptance.models
      + (_llm_router_vikunja_clerk_acceptance.aliases.keys() | list)
      + (_llm_router_vikunja_clerk_default_key_aliases.keys() | list)
      + (_llm_router_vikunja_clerk_roles.values() | map(attribute='models') | flatten))
     | unique | list }}
