---
# llm_router role defaults — a LiteLLM proxy (the fabric's single OpenAI-compatible
# front door) on each guest tagged `llm-router`. Native install: a Python venv +
# systemd, config at /etc/litellm/config.yaml. Fronted by Traefik at
# https://llm.<subdomain>. Physical backends have one deployment entry each;
# stable consumer role names resolve through model_group_alias below.
#
# Two tiers, both reached through this one proxy:
#   large — the mlx-community/* models on the neutral `llm-large` runner
#           (bearer auth). One deployment each; no cross-tier fallback.
#   light — qwen3-4b / embeddings. TWO deployments per model name: the GPU
#           `llm-fast` box AND the CPU `llm-light` standby, same model_name.
#           LiteLLM load-balances the pair and cools a failed deployment
#           down, so a GPU outage drains to CPU automatically.
#
# Restart-on-failure is applied DRY by the shared systemd_restart_policy role via
# group_vars, not here.

llm_router_user: litellm
llm_router_group: litellm
llm_router_home: /var/lib/litellm
llm_router_venv: /opt/litellm-venv
llm_router_service: litellm
llm_router_config_dir: /etc/litellm
llm_router_config_file: "{{ llm_router_config_dir }}/config.yaml"
llm_router_env_file: "{{ llm_router_config_dir }}/litellm.env"

# Installed into the venv (state: present — pinned by the ecosystem, never here).
# The opentelemetry exporter backs the single OTLP logging callback below.
# No direct langfuse SDK: LiteLLM's "langfuse" callback needs the v2 SDK
# (pip resolves v3, which errors on init), and Langfuse ingestion already
# arrives via the designed OTLP -> Cribl Edge fan-out path.
llm_router_pip_packages:
  - "litellm[proxy]"
  # LiteLLM's auth-error handler unconditionally `import prisma`s to classify
  # whether a failed request is a DB outage, but litellm[proxy] no longer pulls
  # prisma. On this DB-less proxy the import raised ModuleNotFoundError, turning
  # every rejected/absent key into a 500 instead of a 401 (masking real auth
  # failures as opaque errors). We use no database; prisma is present only so the
  # handler's isinstance checks resolve and it returns the correct 401.
  - prisma
  - opentelemetry-api
  - opentelemetry-sdk
  - opentelemetry-exporter-otlp

# Internal subdomain (pve.<apex>), never hardcoded — the derived model endpoints
# and the Langfuse host are built from it.
llm_router_subdomain: >-
  {{ lookup('env', 'PROXMOX_SUBDOMAIN') | mandatory('PROXMOX_SUBDOMAIN required') }}

# --- Ports (DRY from the tofu ports registry; no hardcodes) ------------------
# The proxy's own listen port + the two backend tiers' ports. Hard-required like
# every other role's port so a missing constant fails loud rather than guessing.
# NOTE: service_ports.llm_router_api and service_ports.llm_fast_api are added by
# the parallel terraform-proxmox constants PR — this role depends on both.
llm_router_api_port: "{{ tofu_data.constants.service_ports.llm_router_api }}"
llm_router_light_port: "{{ tofu_data.constants.service_ports.llm_fast_api }}"
# llm-large speaks the Ollama-compatible API on the standard Ollama port.
llm_router_large_port: "{{ tofu_data.constants.service_ports.ollama_api }}"
# The gate's second TLS site fronting the two-Mac cluster endpoint (mlx-lm
# rank 0); live only while a cluster window is up.
llm_router_cluster_port: "{{ tofu_data.constants.service_ports.llm_night_api }}"

# --- Backend base URLs (derived; never a hardcoded IP) -----------------------
llm_router_llm_fast_base_url: "http://llm-fast.{{ llm_router_subdomain }}:{{ llm_router_light_port }}/v1"
llm_router_llm_light_base_url: "http://llm-light.{{ llm_router_subdomain }}:{{ llm_router_light_port }}/v1"
# The large-tier gate (a caddy TLS front on the Mac Studio, apex-level cert via
# Route53 DNS-01) reverse-proxies to the host's llama-swap. It has always been
# addressed apex-level (one label under the subdomain's parent), because the
# ACME client locates the hosted zone by stripping a single label — an
# <alias>.<subdomain> name fails the TLS handshake (no SNI cert).
#
# The host is reached by its OWN permanent name, not a floating `llm-large`
# service alias. The alias needed a *second* DNS record published + maintained
# by something outside this fabric; on 2026-07-06 that record silently vanished
# (resolved fine at 21:51, NXDOMAIN by 22:42) and every brain request 500'd with
# ClientConnectorDNSError — a single point of failure with no benefit while there
# is exactly one serving host. `jevans-ms.<apex>` is that host's canonical record
# (stable, also its SSH name) and is on the very same caddy cert, so it satisfies
# the apex-cert constraint identically with no extra record to keep alive.
# (Restoring/decoupling behind an alias again is a DNS follow-up, not a router
# concern — see PR notes.)
llm_router_apex_domain: "{{ llm_router_subdomain | split('.', 1) | last }}"
# Host comes from the `llm_large_serving_host` single source (all.yml,
# env-overridable) so the Studio's name is not a literal repeated across roles —
# still its own permanent per-host record, NOT the floating alias (see above).
llm_router_llm_large_host: "{{ llm_large_serving_host }}"
llm_router_llm_large_fqdn: "{{ llm_router_llm_large_host }}.{{ llm_router_apex_domain }}"
llm_router_llm_large_base_url: "https://{{ llm_router_llm_large_fqdn }}:{{ llm_router_large_port }}/v1"

# --- Standby brain backend (default OFF) -------------------------------------
# A SAME-MODEL, SAME-CONTEXT failover sibling for the default brain, addressing
# the single-Studio brain SPOF (Zammad INC-17080: a Studio reboot takes the sole
# large-tier backend unreachable, so Hermes' brain-watchdog pauses the cron
# fleet). This is NOT a cross-tier alias: the standby serves the IDENTICAL model
# id at the IDENTICAL context window, so it fails over without the
# smaller-context "poison the caller" failure the no-cross-tier-fallback rule
# guards against (a smaller-context fallback is still forbidden).
#
# TOPOLOGY = DEDICATED-PORT (lifecycle-e2e, 2026-07-19). The cluster-join
# quiesce boots out the main llama-swap agent (:11434). This retained standby
# design is inert and must remain disabled while the legacy vllm-mlx backend is
# disabled.
#
# Default empty = DISABLED: with no URL set, the rendered config.yaml is
# byte-identical to today (no standby deployment, no extra env var). To enable:
#   1. nix: OptiQ resident + a dedicated exempt launchd agent/gated port that
#      cluster-join's reap + zero-proc guard + watcher unload all EXCLUDE
#      (lifecycle-e2e, sequenced after PR #1285 settles).
#   2. Set llm_router_llm_large_standby_base_url to that port's /v1 URL and
#      seed llm_router_llm_large_standby_bearer (OpenBao, same pattern).
#
# WIRED CEILING — both hosts are pinned to the SAME iogpu.wired_limit_mb
# (102400, measured on both 2026-07-24). This is deliberate: it matches the
# memory the MacBook makes available, and the Studio runs the same number on
# purpose — accepting unused memory there — to keep the two hosts identical and
# the setup simple. Raising the Studio later is a possible future, NOT the
# current design; do not treat a higher ceiling as a prerequisite for anything
# here. Unbounded wired previously wedged a host (INC-17076), which is why the
# ceiling is enforced rather than advisory.
#
# The enforcement wiring landed in nix-darwin #1769 and both hosts are rebuilt
# on it (both on darwin-system 26.05.adda04f, verified 2026-07-24), so that
# prerequisite is SATISFIED. OptiQ+shard coexistence must still be validated
# EMPIRICALLY under the deployed ceiling (cluster-join's INC-17075 swap guard
# must pass), not assumed.
# Dedicated exempt-OptiQ port = 11442 (lifecycle-e2e contract 2026-07-19). A NIX
# LITERAL, not a tofu constant — the :1144x gate-site ports are nix literals
# (cluster = clusterUpstreamPort 11440); the standalone OptiQ agent binds
# 127.0.0.1:11442 and llm-gate fronts a THIRD gated site optiqUpstreamPort 11442
# with the SAME bearer + cert as llm-large/cluster. Firm for now; e2e may bump to
# 11450 for port-range margin and will confirm when the nix agent PR lands.
llm_router_llm_large_standby_port: 11442
# DEFAULT EMPTY = DISABLED: with no URL the standby block is skipped and the
# rendered config.yaml/litellm.env are byte-identical to today (verified by
# render). Merging this PR is therefore behavior-neutral — nothing changes on
# converge until the URL below is set. To ACTIVATE (one line), only after both:
# (a) the standalone :11442 OptiQ agent exists (nix, lifecycle-e2e) — STILL
#     UNMET: no such launchd agent on either host, and :11442 is closed on both
#     (verified 2026-07-24).
# (b) the wired ceiling is deployed — SATISFIED; see the wired-ceiling note above.
# Then set this to the large FQDN + standby port /v1 URL — converging while (a)
# is unmet routes hermes-brain failover at a port that does not exist yet.
llm_router_llm_large_standby_base_url: ""
# Same bearer as the llm-large gate (the OptiQ site shares its token + cert).
llm_router_llm_large_standby_bearer: "{{ llm_router_llm_large_bearer }}"

# --- Model groups ------------------------------------------------------------
# large: each entry is registered under the backend's OWN model id (the
# serving gate lists models under their full MLX repo ids) — no alias names.
# One deployment each, bearer-authed.
# context_window on EVERY entry = the backend's EFFECTIVE SERVING window —
# what its KV-cache budget (nix-ai catalog cacheMemoryMb) sustains — NOT the
# model's native max_position_embeddings. This value is the fabric's explicit
# input enforcement through enable_pre_call_checks and sizes client behavior:
# Hermes auto-compaction triggers at 75% of it.
# Advertising native windows (previously 262144) let agent sessions grow far
# past the serving ceiling and die mid-stream (Metal buffer exhaustion)
# instead of compacting. The resident brain gets 65536 (16 GB KV; 113K single-stream
# validated, 65K leaves 4-way-concurrency headroom); the small-cache tiers
# get 32768. Native windows for reference: gpt-oss 131072, Qwen3* 262144.
# LiteLLM has no built-in entry for these mlx-community backend ids, so an
# unset context_window resolves max_input_tokens to null — clients that read
# that (e.g. Hermes, OpenWebUI) fall back to a near-zero context guess and
# compress every request to death (see config.yaml.j2 for the failure mode).
llm_router_large_models:
  - { backend: mlx-community/gpt-oss-120b-MXFP4-Q8, context_window: 32768 }
  - { backend: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit, context_window: 32768 }
  # THE RESIDENT (llm_router_primary_model). 65536, not the 32768 it carried
  # until 2026-07-28: that was the SWAP-class figure, and this model is resident.
  # Its resident profile in nix-ai catalog-data.nix is provisioned
  # cacheMemoryMb = 16384 with maxRequestTokens = 65536, and the catalog comment
  # states 65536 "avoids the 32768 truncation/retry death-loop". Advertising half
  # the real window does not protect anything — it just makes Hermes auto-compact
  # at 24.5K (75% of 32768) when ~49K is actually available.
  - { backend: mlx-community/Qwen3.6-35B-A3B-4bit, context_window: 65536 }
  # THE SMALL TIER (llm_router_small_model) — the on-demand 9B that stays
  # servable beside the resident (nix-ai alwaysAvailableModels) and never evicts
  # it. A first-class entry because goal-judge points here, and an alias target
  # with no context_window falls through the "*" wildcard to a null
  # max_input_tokens and compresses its caller to death. 32768 is the small-cache
  # tier figure, matching the swap flags it loads under.
  - { backend: mlx-community/Qwen3.5-9B-MLX-4bit, context_window: 32768 }
  # OptiQ-4bit: the agentic-bench-winning brain (ai_default_model, all.yml). A
  # first-class entry — NOT passthrough — so the default model carries an
  # explicit max_input_tokens: the wildcard "*" entry below sets none, and a
  # null there makes Hermes/OpenWebUI fall back to a near-zero context guess and
  # compress every request to death.
  #
  # extra_body.repetition_penalty: the anti-repetition-loop fix. In long agentic
  # sessions this brain emitted ~37 IDENTICAL tool calls per turn (Hermes dedups
  # + executes once, the model re-emits next turn, the task never advances). The
  # 20/20-clean agentic bench and the looping production sessions differ only in
  # sampling. A gentle 1.05 repetition penalty directly taxes verbatim
  # re-emission while staying mild enough to preserve tool-call JSON validity.
  # extra_body carries it through the router to the MLX model server.
  # repetition_penalty. (temperature is deliberately NOT pinned here: 0.7 would
  # merely restate the engine fallback the loop already runs under. If 1.05 is
  # insufficient, the next lever is to match the clean bench's sampling —
  # temperature ~1.0 / presence_penalty 0.0 — added to this same extra_body.)
  - backend: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }
    # Standby target for cluster windows: OptiQ is the hermes-brain (PR #59) and
    # the only brain that stays resident beside the shard. Renders a second
    # same-name deployment ONLY when llm_router_llm_large_standby_base_url is set
    # (default empty = inert). See the standby var block above for the
    # dedicated-port topology + the wired-ceiling safety gate.
    standby: true
  # Qwen3-Next-80B Thinking: served from the nix-ai catalog swap tier, loaded
  # on demand — the escalation rubric's deep-analysis tier (ai_escalation_rubric,
  # all.yml) requests it by this real id. Block style (not the flow one-liner
  # above) only to stay under the 120-char limit.
  - backend: mlx-community/Qwen3-Next-80B-A3B-Thinking-4bit
    context_window: 32768
    extra_body: { repetition_penalty: 1.05 }
  # Instruct sibling: the fleet brain (ai_default_model) since 2026-07-17 —
  # agentic-bench winner, resident on the serving host with a 65536 window
  # (also Hermes' compression model, which hard-requires >=64K).
  - backend: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }
  # Hermes' stable default target. The 65,536-token input contract passed a
  # direct production-profile mlx_lm probe before this alias was enabled.
  - backend: mlx-community/Qwen3.5-9B-OptiQ-4bit
    context_window: 65536
  # Resident serialized goal judge.
  - backend: mlx-community/Qwen3.6-27B-mxfp4
    context_window: 65536
  # The two-Mac cluster brain (JACCL pipeline across Studio + MacBook,
  # ~256 GB combined), served by mlx-lm rank 0 behind the gate's :11440 TLS
  # site — a DIFFERENT port on the same host, hence the per-entry api_base
  # override. Reachable only while a cluster window is up (cable in); normal
  # serving on :11434 quiesces during windows, so this entry is what keeps a
  # brain reachable then. Same bearer token as the main gate site.
  - backend: mlx-community/GLM-4.7-REAP-50-mxfp4
    api_base: "https://{{ llm_router_llm_large_fqdn }}:{{ llm_router_cluster_port }}/v1"
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }
# Consumer role aliases are defined only in llm_router_model_group_aliases.
# light: the llama-swap model names, served as-is. Each becomes two same-name
# deployments (llm-fast GPU + llm-light CPU) in the rendered config.
# `embedding: true` marks the entry as an embeddings model_group.
llm_router_light_models:
  - { backend: qwen3-4b }
  - { backend: embeddings, embedding: true }

# --- OpenRouter egress tier (paid-SaaS; one key per MODEL) --------------------
# OpenRouter-hosted models, served under their REAL upstream ids. NEVER part
# of any fallback chain — a flaky/rate-limited upstream must not be able to
# degrade the local brain; consumers opt in by requesting the id explicitly.
# Key model (deliberate): ONE OpenRouter API key PER MODEL, irrespective of
# which harness/caller makes the request. key_field names the per-model field
# in OpenBao ai/saas/openrouter — canonically secrets-external/ai/saas/
# openrouter (an internet-reachable SaaS credential), dual-mounted with the
# internal secret/ai/saas/openrouter path during the migration (fetched into
# bao_local_llm_secrets by the openbao_secrets pre-play via the
# ai-saas-openrouter policy leaf; env fallback
# OPENROUTER_API_KEY_<KEY_FIELD upper-snaked>). An entry whose key is
# not seeded renders nothing (inert-until-creds), so the list is safe to
# extend ahead of key seeding. context_window is the model's real serving
# window (never null — the compress-death rule applies to every entry).
llm_router_openrouter_models:
  # Free endpoint: rate-limited, and NVIDIA logs prompt/session data on the
  # :free variant — never send confidential material through this model.
  - model: nvidia/nemotron-3-ultra-550b-a55b:free
    key_field: nvidia-nemotron-3-ultra-550b-a55b-free
    context_window: 1000000
  # Cheap paid egress: efficiency-optimized MoE, $0.09/$0.18 per 1M tokens.
  - model: deepseek/deepseek-v4-flash
    key_field: deepseek-deepseek-v4-flash
    context_window: 1000000

# --- OpenRouter dynamic tier: any current upstream model, budget-gated -------
# Operator disclosure 2026-07-19: the ai/saas/openrouter keys (now
# secrets-external/ai/saas/openrouter) are ACCOUNT-WIDE
# (the per-model field names were a naming-level guardrail, not a technical
# one). The real permission model is now explicit policy: Hermes' persona +
# dryvist/openrouter-models skill (deliberate escalation only, hard $1.00/day
# memory-tracked budget, :free rules) — so this wildcard exposes the full
# current OpenRouter catalog as `openrouter/<exact-upstream-id>` without a
# per-model router edit. Tuned entries above still win on exact match; the
# local `*` catch-all is untouched (bare ids still route to local serving).
# Reuses an existing seeded key field; disable to fall back to tuned-only.
llm_router_openrouter_wildcard_enabled: true
llm_router_openrouter_wildcard_key_field: deepseek-deepseek-v4-flash

# --- Routing behaviour -------------------------------------------------------
# Load-balance across same-name deployments; cool a failed one down so traffic
# drains to its sibling (GPU -> CPU). No cross-tier fallbacks.
llm_router_routing_strategy: simple-shuffle
llm_router_allowed_fails: 2
llm_router_cooldown_time: 30
# Forward each request to the MLX backend once. This governs GENUINE failures
# only — a 429 means the backend never started the work, so it is retried under
# the separate rate-limit policy below rather than counted here.
# request_timeout_seconds bounds a single attempt; large-tier generations can
# legitimately run for minutes, so this is generous, not a tight SLA.
# Timeout chain — each OUTER layer outlives the inner one, so no intermediate
# guard kills a still-healthy generation and the CLIENT is the sole decider:
#   MLX model server guard 3600s (nix-darwin) > router attempt 2400s >
#   Hermes client stream read 1800s.
# 2400 (was 1200, was 300): guards are set to realistic ceilings on the
# assumption the request almost always completes even at unusually high
# limits. A 32k-token large-tier generation runs ~1560s at 21 tok/s and longer
# when requests batch; the old 300s server guard masked everything (proven
# cause of the 18:27 UTC cron failures) and 1200 here would have been the next
# binding kill. At 2400 the router now sits ABOVE the client's 1800s ceiling,
# so the client times out first (by design) while the router waits — and
# below the 3600s server guard.
# The per-attempt timeout is the MIDDLE link of the fabric-wide timeout chain
# (server guard > this > Hermes client read), so it is sourced from the
# single-source-of-truth constant (all.yml) the Layer-1 assert checks — resolves
# to 2400.
llm_router_num_retries: 0
llm_router_request_timeout_seconds: "{{ ai_router_request_timeout_seconds }}"
# Rate limits are absorbed HERE, not by the caller. The serving tier admits one
# in-flight request per model (llama-swap concurrencyLimit) and rejects the rest
# instantly — its own option doc names this router as the layer that "absorbs
# 429s via its retry policy". Passing the 429 straight through instead (the
# previous 0/0 setting) made that contract a no-op: on 2026-07-24 the
# homelab-ai-fabric-status-v2 cron died outright because a 3m31s generation held
# the slot while the caller's entire tolerance was one 15-second retry. A 429 is
# "the slot is busy", never "the work is impossible", so it must not be fatal.
#
# Tolerance = rate_limit_retries x retry_after_seconds. 8 x 40s ~= 320s, sized
# above the longest slot occupancy actually observed in that incident (211s) with
# margin. Rejections cost microseconds, so the retry loop spends only the sleeps;
# the budget still fits under the client's 1800s read ceiling with ~1480s left
# for the generation itself.
llm_router_rate_limit_retries: 8
# Minimum sleep between rate-limit retries (LiteLLM router_settings.retry_after).
# LiteLLM boxes each backoff into [retry_after, MAX_RETRY_DELAY]; the ceiling
# defaults to 8s and would silently clamp this, so the service env pins
# MAX_RETRY_DELAY to the same value (see llm_router_retry_max_delay_seconds).
# Waiting whole tens of seconds is correct here: the blocker is a multi-minute
# generation, so sub-second exponential backoff just burns attempts.
llm_router_retry_after_seconds: 40
# Raises LiteLLM's global backoff ceiling so retry_after is not clamped. Only the
# rate-limit path retries at all (num_retries is 0 and no other error type has a
# retry policy), so this has no other blast radius.
llm_router_retry_max_delay_seconds: "{{ llm_router_retry_after_seconds }}"
# Rate-limit failures do not cool down the otherwise healthy deployment.
llm_router_rate_limit_allowed_fails: 1000

# --- THE SERVABLE SET (single source for every alias) ------------------------
# The serving host runs llama-swap in SINGLE-MODEL mode (nix-ai
# llama-swap-topology.nix): exactly ONE physical id is servable, plus a small
# always-available swap tier beside it. Every other catalogued model is
# deliberately demoted to `disabledModels`, and a request naming one gets a 404
# — by design, so a caller can never be answered by the resident's weights under
# another model's name.
#
# Which means an alias pointing anywhere outside this set is not "slightly
# stale", it is UNROUTABLE. Measured 2026-07-28 against the live gate, before
# this block existed: hermes-default, tool-calling, goal-judge and interim-brain
# ALL returned 404 — every consumer alias at once, because the alias map and the
# serving host's enabled set had no shared definition. It stayed invisible while
# llama-swap still grafted disabled ids onto the resident (Hermes was answered by
# a model nobody selected); nix-ai#1441 removed that graft and the 404s surfaced.
#
# So the two values below are the ONE place a serving-side change is recorded,
# every alias derives from them, and llm_router_servable_models feeds the assert
# that refuses a converge if any alias escapes the set. Repointing the serving
# host means editing these two lines and nothing else.
llm_router_primary_model: mlx-community/Qwen3.6-35B-A3B-4bit
# The always-available small tier: judge//trivial work, and the only model that
# may differ from the primary (user decision 2026-07-28 — the 9B is always up for
# the judge, concurrency belongs to the largest accurate model). Cross-family to
# the primary, which is also what an LLM judge should be.
llm_router_small_model: mlx-community/Qwen3.5-9B-MLX-4bit
llm_router_servable_models:
  - "{{ llm_router_primary_model }}"
  - "{{ llm_router_small_model }}"

# Stable consumer role names. Aliases carry no deployment configuration; each
# points to exactly one physical model_list entry above — and now, only ever at
# a member of the servable set above.
llm_router_model_group_aliases:
  hermes-default: "{{ llm_router_primary_model }}"
  tool-calling: "{{ llm_router_primary_model }}"
  # The judge runs on the small tier, NOT the worker's model. Same-model judging
  # is self-preference bias by construction, and it also made worker and judge
  # contend for one serving slot.
  goal-judge: "{{ llm_router_small_model }}"
  # Interim Hermes-brain candidate: a stable handle so hermes_brain_model (or
  # secret/ai/public/brain) can repoint in one line. It tracks the primary rather
  # than naming its own model — a second physical id here is exactly the drift
  # this block exists to prevent.
  interim-brain: "{{ llm_router_primary_model }}"
# Background health checks send REAL test requests to every deployment — on the
# llama-swap fast tier each probe spawns the target model, and with 3 routers
# probing every model this both churns VRAM constantly and (pre swap-groups)
# triple-loaded the 16 GB card and hard-hung the GPU host. Passive recovery
# (allowed_fails + cooldown_time) already re-admits drained deployments, so
# active probing stays OFF by default.
llm_router_background_health_checks: false
llm_router_health_check_interval: 300

# --- Secrets (from runtime env) -----------------------------------------------
# Mandatory, fail-loud (mirrors the ai_orchestration group_vars pattern).
llm_router_master_key: >-
  {{ lookup('env', 'LLM_ROUTER_MASTER_KEY')
     | mandatory('LLM_ROUTER_MASTER_KEY must be set') }}
llm_router_llm_large_bearer: >-
  {{ lookup('env', 'LLM_LARGE_BEARER_TOKEN')
     | mandatory('LLM_LARGE_BEARER_TOKEN must be set') }}
# The GPU/CPU light backends need no auth; a placeholder keeps the OpenAI client happy.
llm_router_light_api_key: "sk-noauth"

# --- Observability -----------------------------------------------------------
# OTLP traces only. Cribl Edge is the OTLP/HTTP receiver (base URL; the
# exporter appends the signal path) and fans the spans out to Langfuse (and
# Splunk) — the router holds no Langfuse credentials.
llm_router_otel_http_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['otel_traces_http'] }}
llm_router_otel_endpoint: "http://cribl-edge.{{ llm_router_subdomain }}:{{ llm_router_otel_http_port }}"

# Whether the routers carry the llm-fast (GPU) deployments. False while the
# GPU host is frozen (see llama_cpp_service_enabled): the firewall DROPs
# traffic to the dead backend, so a shuffled request hangs the full client
# timeout instead of failing over — routing to it at all is worse than
# serving CPU-only. Flip together with the llm-fast unfreeze.
llm_router_llm_fast_enabled: true

# Large-tier passthrough: expose EVERY model the serving gate advertises,
# not just the tuned entries above. Exposure policy is blocklist-shaped and
# enforced at the source — the serving host auto-registers every downloaded,
# memory-fitting MLX model minus its declarative blocklist (nix-ai
# programs.mlx.discover.blocklist) — so adding a model to the fleet is a
# download, and removing one is a blocklist entry; the router never needs a
# per-model edit. llm_router_large_models stays as the tuned set (exact-match
# registrations win over the wildcard).
llm_router_large_passthrough_enabled: true

# Daily brain rotation + night-cluster deployment shapes were deleted
# 2026-07-16 (no-op since both phases served the same model; night cluster not
# provisioned). The default brain is a real model id served directly (no
# alias). Night-cluster shape, if it returns, rebuilds against this static
# config (old design: tasks/rotation.yml + docs/BRAIN_ROTATION.md at 97ae96a).
