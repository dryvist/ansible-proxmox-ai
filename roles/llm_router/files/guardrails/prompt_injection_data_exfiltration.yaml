---
category_name: prompt_injection_data_exfiltration
description: Blocks explicit transfers of sensitive data to external destinations
default_action: BLOCK
phrase_patterns:
  - >-
    (?ix)\b(?:send|post|upload|publish|forward|email|transmit|encode|exfiltrate|export|copy|paste|push|share)\b
    (?:(?!\\n)(?!(?<!\bdr)(?<!\bmr)(?<!\bms)(?<!\bst)(?<!\bmrs)(?<!\bprof)
    \.["')\]]{0,4}(?:\s|$))[^!?;\n\r\v\f\x85\u2028\u2029]){0,200}\b(?:
    training\s+(?:data|set|examples)
    |internal\s+(?:data|information)
    |database\s+(?:contents|records)
    |user\s+(?:data|records|information)
    |personal\s+data
    |private\s+(?:information|data)
    |confidential\s+(?:data|information)
    |sensitive\s+(?:data|information)
    |customer\s+(?:data|records)
    |employee\s+(?:data|records)
    |credentials?
    |passwords?
    |api[\s_-]?keys?
    |access[\s_-]?tokens?
    |secret\s+keys?
    |encryption\s+keys?
    |private\s+keys?
    |session\s+tokens?
    |authentication\s+tokens?
    |model\s+(?:weights|parameters)
    |source\s+code
    |proprietary\s+code
    |intellectual\s+property
    )\b(?:(?!\\n)(?!(?<!\bdr)(?<!\bmr)(?<!\bms)(?<!\bst)(?<!\bmrs)(?<!\bprof)
    \.["')\]]{0,4}(?:\s|$))[^!?;\n\r\v\f\x85\u2028\u2029]){0,200}\b(?:to|into|at)\s{0,200}(?:
    https?://
    |ftp://
    |[a-z0-9._%+-]{1,64}@(?:[a-z0-9-]{1,63}\.){1,20}[a-z]{2,63}
    |(?:[a-z0-9-]{1,63}\.){0,20}webhook\b
    |pastebin\b
    |(?:external|third[- ]party|public)\s+(?:server|service|endpoint|url)\b
    )
  # Allow one bounded semicolon continuation or explicitly numbered step only
  # when it names the sensitive item first, then transfers it to an external sink.
  - >-
    (?ix)\b(?:
    training\s+(?:data|set|examples)
    |internal\s+(?:data|information)
    |database\s+(?:contents|records)
    |user\s+(?:data|records|information)
    |personal\s+data
    |private\s+(?:information|data)
    |confidential\s+(?:data|information)
    |sensitive\s+(?:data|information)
    |customer\s+(?:data|records)
    |employee\s+(?:data|records)
    |credentials?
    |passwords?
    |api[\s_-]?keys?
    |access[\s_-]?tokens?
    |secret\s+keys?
    |encryption\s+keys?
    |private\s+keys?
    |session\s+tokens?
    |authentication\s+tokens?
    |model\s+(?:weights|parameters)
    |source\s+code
    |proprietary\s+code
    |intellectual\s+property
    )\b(?:(?!\\n)[^.!?;\n\r\v\f\x85\u2028\u2029]){0,200}
    (?:;[ \t]{1,40}(?:then[ \t]+)?|\.[ \t]{1,40}step[ \t]+\d{1,3}[ \t]*:[ \t]*)
    \b(?:send|post|upload|publish|forward|email|transmit|encode|exfiltrate|export|copy|paste|push|share)\b
    [ \t]{1,40}\b(?:them|it)\b
    (?:(?!\\n)[^.!?;\n\r\v\f\x85\u2028\u2029]){0,120}
    \b(?:to|into|at)[ \t]{0,200}(?:
    https?://
    |ftp://
    |[a-z0-9._%+-]{1,64}@(?:[a-z0-9-]{1,63}\.){1,20}[a-z]{2,63}
    |(?:[a-z0-9-]{1,63}\.){0,20}webhook\b
    |pastebin\b
    |(?:external|third[- ]party|public)\s+(?:server|service|endpoint|url)\b
    )
  # A closed parenthetical may carry the sensitive-data mention and end in `!`.
  - >-
    (?ix)\b(?:send|post|upload|publish|forward|email|transmit|encode|exfiltrate|export|copy|paste|push|share)\b
    (?:(?!\\n)[^.!?;\n\r\v\f\x85\u2028\u2029]){0,200}
    \((?:(?!\\n)[^()\n\r]){0,120}\b(?:
    training\s+(?:data|set|examples)
    |internal\s+(?:data|information)
    |database\s+(?:contents|records)
    |user\s+(?:data|records|information)
    |personal\s+data
    |private\s+(?:information|data)
    |confidential\s+(?:data|information)
    |sensitive\s+(?:data|information)
    |customer\s+(?:data|records)
    |employee\s+(?:data|records)
    |credentials?
    |passwords?
    |api[\s_-]?keys?
    |access[\s_-]?tokens?
    |secret\s+keys?
    |encryption\s+keys?
    |private\s+keys?
    |session\s+tokens?
    |authentication\s+tokens?
    |model\s+(?:weights|parameters)
    |source\s+code
    |proprietary\s+code
    |intellectual\s+property
    )\b(?:(?!\\n)[^()\n\r]){0,40}![ \t]{0,12}\)
    (?:(?!\\n)[^.!?;\n\r\v\f\x85\u2028\u2029]){0,200}
    \b(?:to|into|at)[ \t]{0,200}(?:
    https?://
    |ftp://
    |[a-z0-9._%+-]{1,64}@(?:[a-z0-9-]{1,63}\.){1,20}[a-z]{2,63}
    |(?:[a-z0-9-]{1,63}\.){0,20}webhook\b
    |pastebin\b
    |(?:external|third[- ]party|public)\s+(?:server|service|endpoint|url)\b
    )
  # The parenthetical may explain the sensitive item's source after its name.
  - >-
    (?ix)\b(?:send|post|upload|publish|forward|email|transmit|encode|exfiltrate|export|copy|paste|push|share)\b
    (?:(?!\\n)[^.!?;\n\r\v\f\x85\u2028\u2029]){0,200}
    \b(?:
    training\s+(?:data|set|examples)
    |internal\s+(?:data|information)
    |database\s+(?:contents|records)
    |user\s+(?:data|records|information)
    |personal\s+data
    |private\s+(?:information|data)
    |confidential\s+(?:data|information)
    |sensitive\s+(?:data|information)
    |customer\s+(?:data|records)
    |employee\s+(?:data|records)
    |credentials?
    |passwords?
    |api[\s_-]?keys?
    |access[\s_-]?tokens?
    |secret\s+keys?
    |encryption\s+keys?
    |private\s+keys?
    |session\s+tokens?
    |authentication\s+tokens?
    |model\s+(?:weights|parameters)
    |source\s+code
    |proprietary\s+code
    |intellectual\s+property
    )\b(?:(?!\\n)[^.!?;\n\r\v\f\x85\u2028\u2029]){0,100}
    \((?:(?!\\n)[^()\n\r]){0,120}![ \t]{0,12}\)
    (?:(?!\\n)[^.!?;\n\r\v\f\x85\u2028\u2029]){0,200}
    \b(?:to|into|at)[ \t]{0,200}(?:
    https?://
    |ftp://
    |[a-z0-9._%+-]{1,64}@(?:[a-z0-9-]{1,63}\.){1,20}[a-z]{2,63}
    |(?:[a-z0-9-]{1,63}\.){0,20}webhook\b
    |pastebin\b
    |(?:external|third[- ]party|public)\s+(?:server|service|endpoint|url)\b
    )
