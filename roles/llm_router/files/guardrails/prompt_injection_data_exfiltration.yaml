---
category_name: prompt_injection_data_exfiltration
description: Blocks explicit transfers of sensitive data to external destinations
default_action: BLOCK
phrase_patterns:
  - >-
    (?ix)
    (?:\A\s*|\n\s*|\\n\s*|[.!?;:]\s+|[-*]\s+|\b(?:and|or|but|then|also|please|now|just|finally|next)\s+)
    (?:send|post|upload|publish|forward|email|transmit|encode|exfiltrate|export)[ \t]+
    (?:(?:the|this|that|these|those|my|your|our|their|its|all|any|each|a|an)[ \t]+)?
    (?:[\w-]+[ \t]+)?
    (?:
    training\s+(?:data|set|examples)
    |internal\s+(?:data|information)
    |database\s+(?:contents|records)
    |user\s+(?:data|records|information)
    |personal\s+data
    |private\s+(?:information|data)
    |confidential\s+(?:data|information)
    |sensitive\s+(?:data|information)
    |customer\s+(?:data|records)
    |employee\s+(?:data|records)
    |credentials?
    |passwords?
    |api[\s_-]?keys?
    |access[\s_-]?tokens?
    |secret\s+keys?
    |encryption\s+keys?
    |private\s+keys?
    |session\s+tokens?
    |authentication\s+tokens?
    |model\s+(?:weights|parameters)
    |source\s+code
    |proprietary\s+code
    |intellectual\s+property
    )\b
    [^.\n]{0,160}
    \b(?:to|into|at)[ \t]*(?:
    https?://
    |ftp://
    |[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}
    |(?:[a-z0-9-]+\.)*webhook\b
    |pastebin\b
    |(?:external|third[- ]party|public)[ \t]+(?:server|service|endpoint|url)\b
    )
