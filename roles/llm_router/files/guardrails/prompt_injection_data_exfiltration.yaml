category_name: prompt_injection_data_exfiltration
description: Blocks explicit transfers of sensitive data to external destinations
default_action: BLOCK
phrase_patterns:
  - '(?i)\b(?:send|post|upload|publish|forward|email|transmit|encode|exfiltrate|export)\b.{0,200}\b(?:training (?:data|set|examples)|internal (?:data|information)|database (?:contents|records)|user (?:data|records|information)|personal data|private (?:information|data)|confidential (?:data|information)|sensitive (?:data|information)|customer (?:data|records)|employee (?:data|records)|credentials?|passwords?|api[\s_-]?keys?|access[\s_-]?tokens?|secret keys?|encryption keys?|private keys?|session tokens?|authentication tokens?|model weights|model parameters|source code|proprietary code|intellectual property)\b.{0,200}\b(?:to|into|at)\s*(?:https?://|ftp://|[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}|(?:[a-z0-9-]+\.)*webhook\b|pastebin\b|(?:external|third[- ]party|public)\s+(?:server|service|endpoint|url)\b)'
