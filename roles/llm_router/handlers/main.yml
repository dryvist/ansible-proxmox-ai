---
# DEFINED FIRST ON PURPOSE. Handlers run in definition order, not notification
# order, so this corrects the shadowing config row while the old proxy is still
# up and the restart below then boots from it.
- name: Sync router settings into the database
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_api_port }}/config/update"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_router_master_key }}"
    body_format: json
    body:
      router_settings: "{{ _llm_router_settings_payload }}"
    status_code: [200, 201]
    timeout: "{{ llm_router_seed_request_timeout }}"
  no_log: true

- name: Restart litellm
  ansible.builtin.systemd:
    name: "{{ llm_router_service }}"
    state: restarted
    daemon_reload: true
