---
# Handlers run in definition order, not notification order, so this reflects
# the real dependency chain: restart onto the new config file first, wait for
# the proxy to actually come back up, THEN correct the shadowing DB row —
# never against a proxy that's still down or still serving the old config.
- name: Restart litellm
  ansible.builtin.systemd:
    name: "{{ llm_router_service }}"
    state: restarted
    daemon_reload: true

- name: Wait for LiteLLM liveness before syncing settings
  ansible.builtin.import_tasks: ../tasks/verify-liveness.yml

- name: Sync router settings into the database
  ansible.builtin.import_tasks: ../tasks/sync-router-settings-request.yml

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
