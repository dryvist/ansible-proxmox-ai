---
# Generate the llm-router Redis password exactly once.  The existing secret may
# be a multi-field bundle, so this must be an atomic read/merge/CAS-write rather
# than a blind put.  Every task that can hold the password or writer token is
# no_log.

- name: Detect whether a fetched or fallback Redis password is already usable
  ansible.builtin.set_fact:
    openbao_secrets_redis_password_present: >-
      {{ (openbao_secrets_redis_fetched_password is string
          and (openbao_secrets_redis_fetched_password | trim | length > 0))
         or (openbao_secrets_redis_password_fallback is string
             and (openbao_secrets_redis_password_fallback | trim | length > 0)) }}
    openbao_secrets_redis_publish_fallback: >-
      {{ not (openbao_secrets_redis_fetched_password is string
              and (openbao_secrets_redis_fetched_password | trim | length > 0))
         and openbao_secrets_redis_password_fallback is string
         and (openbao_secrets_redis_password_fallback | trim | length > 0) }}
  delegate_to: localhost
  delegate_facts: true
  connection: local
  become: false
  vars:
    ansible_become: false
    openbao_secrets_redis_fetched_password: >-
      {{ (hostvars['localhost'].openbao_secrets_by_domain
          | default({})).get('local-llm', {})
         .get(openbao_secrets_redis_password_field, '') }}
  no_log: true

# Consumer defaults use Ansible's `default(..., true)`, which treats an empty
# string as missing but not a whitespace-only string. Materializing the already
# validated fallback here gives every consumer the same strict semantics.
- name: Publish the validated Redis fallback into the local-llm accumulator
  ansible.builtin.set_fact:
    openbao_secrets_by_domain: >-
      {{ hostvars['localhost'].openbao_secrets_by_domain
         | combine({'local-llm':
             hostvars['localhost'].openbao_secrets_by_domain
             .get('local-llm', {})
             | combine({openbao_secrets_redis_password_field:
                        openbao_secrets_redis_password_fallback})}) }}
  delegate_to: localhost
  delegate_facts: true
  connection: local
  become: false
  vars:
    ansible_become: false
  when: hostvars['localhost'].openbao_secrets_redis_publish_fallback | bool
  no_log: true

- name: Seed the missing Redis password with an exact-path writer
  when: not (hostvars['localhost'].openbao_secrets_redis_password_present | bool)
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
    openbao_secrets_redis_data_path: >-
      {{ openbao_secrets_kv_mount }}/data/{{ openbao_secrets_redis_password_path }}
    openbao_secrets_redis_metadata_path: >-
      {{ openbao_secrets_kv_mount }}/metadata/{{ openbao_secrets_redis_password_path }}
  no_log: true
  block:
    - name: Initialize writer failure tracking
      ansible.builtin.set_fact:
        openbao_secrets_redis_seed_failed: false
        openbao_secrets_redis_seed_failed_task: ""
        openbao_secrets_redis_revoke_failed: false
      delegate_facts: true

    - name: Execute the authorized Redis password seed
      block:
        - name: Require the human-authorized Redis writer token
          ansible.builtin.assert:
            that:
              - openbao_secrets_redis_writer_token | length > 0
            fail_msg: >-
              LLM_ROUTER_REDIS_PASSWORD is absent and LLM_ROUTER_WRITE_BAO_TOKEN
              is unavailable; obtain a one-converge llm-router-write token
              through the llm-router-write AppRole before retrying.

        - name: Look up the Redis writer token identity
          community.hashi_vault.vault_read:
            url: "{{ hostvars['localhost'].openbao_secrets_active_addr }}"
            auth_method: token
            token: "{{ openbao_secrets_redis_writer_token }}"
            path: auth/token/lookup-self
            validate_certs: "{{ openbao_secrets_validate_certs }}"
          register: openbao_secrets_redis_writer_identity

        - name: Validate the short-lived Redis writer identity
          ansible.builtin.include_tasks: assert_redis_writer_identity.yml

        - name: Check the writer token's exact Redis secret capabilities
          community.hashi_vault.vault_write:
            url: "{{ hostvars['localhost'].openbao_secrets_active_addr }}"
            auth_method: token
            token: "{{ openbao_secrets_redis_writer_token }}"
            path: sys/capabilities-self
            data:
              paths:
                - "{{ openbao_secrets_redis_data_path }}"
                - "{{ openbao_secrets_redis_metadata_path }}"
            validate_certs: "{{ openbao_secrets_validate_certs }}"
          register: openbao_secrets_redis_writer_capabilities
          changed_when: false

        - name: Validate exact Redis data and metadata capabilities
          ansible.builtin.include_tasks: assert_redis_writer_capabilities.yml

        - name: Read the current llm-router bundle and KV metadata
          community.hashi_vault.vault_kv2_get:
            url: "{{ hostvars['localhost'].openbao_secrets_active_addr }}"
            auth_method: token
            token: "{{ openbao_secrets_redis_writer_token }}"
            engine_mount_point: "{{ openbao_secrets_kv_mount }}"
            path: "{{ openbao_secrets_redis_password_path }}"
            validate_certs: "{{ openbao_secrets_validate_certs }}"
          register: openbao_secrets_redis_current

        - name: Recheck the password after the authoritative writer read
          ansible.builtin.set_fact:
            openbao_secrets_redis_password_present: >-
              {{ openbao_secrets_redis_authoritative_password is string
                 and (openbao_secrets_redis_authoritative_password | trim | length > 0) }}
          vars:
            openbao_secrets_redis_authoritative_password: >-
              {{ openbao_secrets_redis_current.secret
                 .get(openbao_secrets_redis_password_field, '') }}
          delegate_facts: true

        # Another writer may have seeded the password after the read-side
        # prefetch but before this authoritative read. Consume that winner and
        # do not rotate it.
        - name: Publish a password found by the authoritative writer read
          ansible.builtin.include_tasks: publish_redis_authoritative_winner.yml
          when: hostvars['localhost'].openbao_secrets_redis_password_present | bool

        - name: Generate 32 cryptographic random bytes as lowercase hex
          ansible.builtin.command:
            argv:
              - openssl
              - rand
              - -hex
              - "32"
          register: openbao_secrets_redis_generated
          changed_when: false
          when: not (hostvars['localhost'].openbao_secrets_redis_password_present | bool)

        - name: Validate the generated Redis password shape
          ansible.builtin.assert:
            that:
              - openbao_secrets_redis_generated.stdout is match('^[0-9a-f]{64}$')
          when: not (hostvars['localhost'].openbao_secrets_redis_password_present | bool)

        - name: CAS-write the merged llm-router bundle
          community.hashi_vault.vault_kv2_write:
            url: "{{ hostvars['localhost'].openbao_secrets_active_addr }}"
            auth_method: token
            token: "{{ openbao_secrets_redis_writer_token }}"
            engine_mount_point: "{{ openbao_secrets_kv_mount }}"
            path: "{{ openbao_secrets_redis_password_path }}"
            cas: "{{ openbao_secrets_redis_current.metadata.version | int }}"
            data: >-
              {{ openbao_secrets_redis_current.secret
                 | combine({openbao_secrets_redis_password_field:
                            openbao_secrets_redis_generated.stdout}) }}
            validate_certs: "{{ openbao_secrets_validate_certs }}"
          register: openbao_secrets_redis_write
          when: not (hostvars['localhost'].openbao_secrets_redis_password_present | bool)

        # Publish only after the CAS write succeeds. A CAS conflict fails the
        # module and never reaches this task, so no stale generated password can
        # leak into the consumer fact.
        - name: Add the seeded password to the local-llm secret accumulator
          ansible.builtin.set_fact:
            openbao_secrets_by_domain: >-
              {{ hostvars['localhost'].openbao_secrets_by_domain
                 | combine({'local-llm':
                     hostvars['localhost'].openbao_secrets_by_domain
                     .get('local-llm', {})
                     | combine({openbao_secrets_redis_password_field:
                                openbao_secrets_redis_generated.stdout})}) }}
          delegate_facts: true
          when: not (hostvars['localhost'].openbao_secrets_redis_password_present | bool)

      rescue:
        - name: Record the primary Redis seed failure
          ansible.builtin.set_fact:
            openbao_secrets_redis_seed_failed: true
            openbao_secrets_redis_seed_failed_task: >-
              {{ ansible_failed_task.name | default('unknown writer task') }}
          delegate_facts: true

      always:
        - name: Revoke the ephemeral Redis writer token
          when: openbao_secrets_redis_writer_token | length > 0
          block:
            - name: Self-revoke the ephemeral Redis writer token
              community.hashi_vault.vault_write:
                url: "{{ hostvars['localhost'].openbao_secrets_active_addr }}"
                auth_method: token
                token: "{{ openbao_secrets_redis_writer_token }}"
                path: auth/token/revoke-self
                validate_certs: "{{ openbao_secrets_validate_certs }}"

          rescue:
            - name: Record Redis writer token revocation failure
              ansible.builtin.set_fact:
                openbao_secrets_redis_revoke_failed: true
              delegate_facts: true

            - name: Report Redis writer token revocation failure
              ansible.builtin.debug:
                msg: >-
                  SECURITY WARNING: LLM_ROUTER_WRITE_BAO_TOKEN self-revocation
                  failed; it remains usable only until its enforced 600-second
                  TTL expires.
              no_log: false

        - name: Propagate a primary Redis seed failure after revocation
          ansible.builtin.fail:
            msg: >-
              llm-router Redis password seed failed in
              {{ hostvars['localhost'].openbao_secrets_redis_seed_failed_task }}.
              Writer token revocation
              {{ 'was not required because no writer token was supplied'
                 if openbao_secrets_redis_writer_token | length == 0
                 else ('also failed; see the security warning above'
                       if hostvars['localhost'].openbao_secrets_redis_revoke_failed
                       else 'completed') }}.
          when: hostvars['localhost'].openbao_secrets_redis_seed_failed | bool
          no_log: false

        - name: Fail when only Redis writer token revocation failed
          ansible.builtin.fail:
            msg: >-
              LLM_ROUTER_WRITE_BAO_TOKEN self-revocation failed; the seed
              completed, but the token remains usable until its enforced
              600-second TTL expires.
          when:
            - not (hostvars['localhost'].openbao_secrets_redis_seed_failed | bool)
            - hostvars['localhost'].openbao_secrets_redis_revoke_failed | bool
          no_log: false
