---
# One local-llm secret from openbao_secrets_local_llm_seed_specs, included once
# per entry with local_llm_secret set. Runs once on the controller (the caller's
# include carries run_once).
#
# A stored value is never rewritten. A missing value takes a valid env fallback
# with no write, or else is generated and written by the shared seed_generated
# task, which needs this entry's short-lived writer token. The final value is
# published into the local-llm accumulator the calling play reads.

- name: Read the stored local-llm value for this secret
  ansible.builtin.set_fact:
    openbao_secrets_local_llm_stored: >-
      {{ (hostvars['localhost'].openbao_secrets_by_domain | default({}))
         .get('local-llm', {}).get(local_llm_secret.field, '') }}
  no_log: true

- name: Decide whether the stored value is usable and the env fallback is usable
  ansible.builtin.set_fact:
    openbao_secrets_local_llm_stored_present: >-
      {{ openbao_secrets_local_llm_stored is string
         and (openbao_secrets_local_llm_stored | trim | length > 0) }}
    openbao_secrets_local_llm_fallback_usable: >-
      {{ local_llm_secret.fallback is string
         and (local_llm_secret.fallback | trim | length > 0) }}
  no_log: true

- name: Use a valid env fallback for an absent local-llm secret without a write
  ansible.builtin.set_fact:
    openbao_secrets_local_llm_seed_result: "{{ {local_llm_secret.field: local_llm_secret.fallback} }}"
  when:
    - not (openbao_secrets_local_llm_stored_present | bool)
    - openbao_secrets_local_llm_fallback_usable | bool
  no_log: true

- name: Generate and write an absent local-llm secret through the shared seed_generated task
  when:
    - not (openbao_secrets_local_llm_stored_present | bool)
    - not (openbao_secrets_local_llm_fallback_usable | bool)
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Seed the secret with the shared task, writer token revoked on exit
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ hostvars['localhost'].openbao_secrets_active_addr }}"
        openbao_secrets_seed_mount: "{{ openbao_secrets_kv_mount }}"
        openbao_secrets_seed_path: "{{ local_llm_secret.path }}"
        openbao_secrets_seed_fields:
          - name: "{{ local_llm_secret.field }}"
            length: 64
            charset: hex
        openbao_secrets_seed_token: "{{ local_llm_secret.writer_token }}"
        openbao_secrets_seed_expected_writer_policy: "{{ local_llm_secret.writer_policy }}"
        openbao_secrets_seed_writer_max_ttl: "{{ local_llm_secret.writer_max_ttl | int }}"
        openbao_secrets_seed_check_capabilities: "{{ not ansible_check_mode }}"
        openbao_secrets_seed_revoke_token: "{{ local_llm_secret.writer_token | length > 0 }}"
        openbao_secrets_seed_register: openbao_secrets_local_llm_seed_result

- name: Add the reconciled local-llm secret value to the controller accumulator
  ansible.builtin.set_fact:
    openbao_secrets_by_domain: >-
      {{ hostvars['localhost'].openbao_secrets_by_domain
         | combine({'local-llm':
             hostvars['localhost'].openbao_secrets_by_domain.get('local-llm', {})
             | combine(openbao_secrets_local_llm_seed_result)}) }}
  when: not (openbao_secrets_local_llm_stored_present | bool)
  delegate_to: localhost
  delegate_facts: true
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
