---
- name: Require exact Redis data and metadata capabilities
  ansible.builtin.assert:
    that:
      - >-
        (openbao_secrets_redis_writer_capabilities.data.data
         .get(openbao_secrets_redis_data_path, []) | sort)
        == ['create', 'read', 'update']
      - >-
        (openbao_secrets_redis_writer_capabilities.data.data
         .get(openbao_secrets_redis_metadata_path, []) | sort)
        == ['read']
    fail_msg: >-
      LLM_ROUTER_WRITE_BAO_TOKEN must have exactly create/read/update on
      secret/data/ai/llm-router and exactly read on
      secret/metadata/ai/llm-router.
