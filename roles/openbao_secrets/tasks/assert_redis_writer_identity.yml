---
- name: Require an exact short-lived nonrenewable writer identity
  ansible.builtin.assert:
    that:
      - >-
        (openbao_secrets_redis_writer_identity.data.data.policies | sort)
        == ['default', 'llm-router-write']
      - >-
        openbao_secrets_redis_writer_identity.data.data
        .get('identity_policies', []) | length == 0
      - >-
        not (openbao_secrets_redis_writer_identity.data.data.renewable | bool)
      - openbao_secrets_redis_writer_identity.data.data.orphan | bool
      - openbao_secrets_redis_writer_identity.data.data.ttl | int > 0
      - >-
        openbao_secrets_redis_writer_identity.data.data.ttl | int
        <= openbao_secrets_redis_writer_max_ttl_seconds | int
    fail_msg: >-
      LLM_ROUTER_WRITE_BAO_TOKEN must carry exactly default + llm-router-write,
      have no identity policies, be nonrenewable and orphaned, and have 1-600
      seconds remaining TTL.
