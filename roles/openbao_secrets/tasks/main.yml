---
# Driver: loops openbao_secrets_domains, fetching each domain's KV subtree via
# its OWN AppRole (see fetch_domain.yml) and accumulating the results into
# openbao_secrets_by_domain, keyed by domain name. Runs ONCE on the
# controller (delegate_to localhost, run_once); the calling playbook then
# publishes each domain's dict into its own `bao_<domain>_secrets` fact per
# host (mirrors how `tofu_data` is published in inventory/load_tofu.yml).
# SKIPS CLEANLY when BAO_ADDR is unset, so pre-migration converges keep
# working on env/SOPS secrets.

- name: Decide whether OpenBao is configured at all
  ansible.builtin.set_fact:
    openbao_secrets_configured: "{{ openbao_secrets_bao_addr_candidates | length > 0 }}"

- name: Report that OpenBao is not configured (env/SOPS fallback in effect)
  ansible.builtin.debug:
    msg: >-
      No OpenBao endpoint (BAO_ADDR unset and no openbao-tagged nodes in the tofu
      inventory) — openbao_secrets is skipping entirely; every domain falls back
      to env/SOPS secrets. Set BAO_ADDR plus each domain's role_id/secret_id
      envs to source that domain's secrets from OpenBao.
  run_once: true
  when: not openbao_secrets_configured

# Client failover: probe the ordered candidate endpoints ONCE on the controller
# and pin the first that is reachable + unsealed (health 200, standbyok — a
# standby forwards to the active peer). This is what removes the single-node
# dependency: openbao-01 down -> openbao-02 answers, ingress down -> a per-node
# endpoint answers. If NONE answers, active_addr stays empty and the role skips
# to env/SOPS (a total-OpenBao outage must not hard-fail every converge).
# ansible_become: false on the delegated tasks below is REQUIRED — Ansible
# inherits the play's become: true on delegated tasks regardless of
# task-level become, which fails with "sudo: a password is required" on the
# controller (same gotcha documented in roles/openbao, roles/minio,
# roles/object_storage, roles/cribl_packs). These are unauthenticated GETs
# and local set_facts — none need root.
- name: Probe OpenBao endpoints for a live, unsealed one (client failover)
  ansible.builtin.uri:
    url: "{{ item }}/v1/sys/health?standbyok=true&perfstandbyok=true"
    method: GET
    validate_certs: "{{ openbao_secrets_validate_certs }}"
    timeout: 5
  loop: "{{ openbao_secrets_bao_addr_candidates }}"
  loop_control:
    label: "{{ item }}"
  register: openbao_secrets_health
  failed_when: false
  changed_when: false
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  # /v1/sys/health is public + unauthenticated (no secret in URL or response), so
  # NOT no_log: keep it visible for troubleshooting DNS/TLS/connectivity failover.
  when: openbao_secrets_configured

- name: Pin the first reachable OpenBao endpoint for this run
  ansible.builtin.set_fact:
    openbao_secrets_active_addr: >-
      {{ (openbao_secrets_health.results
          | selectattr('status', 'defined')
          | selectattr('status', 'equalto', 200)
          | map(attribute='item') | list | first) | default('', true) }}
  delegate_to: localhost
  delegate_facts: true
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  when: openbao_secrets_configured

- name: Decide whether a usable OpenBao endpoint was found
  ansible.builtin.set_fact:
    openbao_secrets_active: "{{ (hostvars['localhost'].openbao_secrets_active_addr | default('', true)) | length > 0 }}"

- name: Report no OpenBao endpoint answered (env/SOPS fallback in effect)
  ansible.builtin.debug:
    msg: >-
      OpenBao is configured but none of {{ openbao_secrets_bao_addr_candidates }}
      answered /v1/sys/health unsealed — skipping OpenBao for this run; every
      domain falls back to env/SOPS secrets. This is the DR degrade path, not a
      hard failure.
  run_once: true
  when:
    - openbao_secrets_configured
    - not openbao_secrets_active

# delegate_facts is REQUIRED, not optional: set_fact + delegate_to + run_once
# WITHOUT delegate_facts writes the fact to the play's hosts, NOT to localhost,
# so hostvars['localhost'].openbao_secrets_by_domain (how the calling play reads
# it back) would be undefined and every domain would publish empty secrets.
# Verified empirically against ansible-core 2.21.
- name: Initialize the per-domain secrets accumulator
  ansible.builtin.set_fact:
    openbao_secrets_by_domain: {}
  delegate_to: localhost
  delegate_facts: true
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  when: openbao_secrets_active

# community.hashi_vault.vault_login declares supports_check_mode but SHORT-
# CIRCUITS under --check: it returns {'auth': {'client_token': None}} instead
# of actually authenticating. That null token flows into vault_kv2_get in
# fetch_domain.yml, every read fails (swallowed by failed_when: false and
# no_log: true), every domain merges empty, and every downstream presence
# assertion trips — indistinguishable from a genuinely missing credential.
# Warn loudly here so a --check run is never misread as "credentials are
# missing" when the real cause is check mode itself.
- name: WARNING — OpenBao fetch is inert under --check (every bao value will be empty)
  ansible.builtin.debug:
    msg: >-
      --check mode: community.hashi_vault.vault_login cannot actually
      authenticate under check mode (it returns a null client_token), so
      every OpenBao read in this role fails and every bao_<domain>_secrets
      fact merges empty. Any downstream assertion about a missing OpenBao-
      sourced value (e.g. "no Vikunja write token is set") is expected in
      --check and does NOT mean the credential is actually missing. Run
      without --check to validate OpenBao-sourced values for real.
  run_once: true
  when:
    - openbao_secrets_active
    - ansible_check_mode

- name: Fetch each domain's secrets from OpenBao (delegated to the controller)
  when: openbao_secrets_active
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  vars:
    ansible_become: false
  block:
    - name: Fetch each configured domain's secrets from OpenBao
      ansible.builtin.include_tasks: fetch_domain.yml
      loop: "{{ openbao_secrets_domains }}"
      loop_control:
        loop_var: openbao_domain
        label: "{{ openbao_domain.name }}"

# The API key must exist before the calling play publishes the local-llm fact
# to Hermes.  This include is a no-op when the key is already non-empty.  Its
# write lane accepts only an explicitly supplied, short-lived hermes-write
# token and a KV-v2 CAS update; standing read and runner identities stay out.
- name: Reconcile the generated Hermes API key before secret consumption
  ansible.builtin.include_tasks: seed_hermes_api_key.yml
  when:
    - openbao_secrets_active
    - >-
      'local-llm' in
      (hostvars['localhost'].openbao_secrets_by_domain | default({}))
  run_once: true
