---
# openbao_secrets role defaults. Full pattern (bao-first resolution, the
# FAIL-LOUD contract, its two deliberate no-op exceptions, and what every
# consumer role must match) lives in README.md — these files are config, not
# the essay. Split by topic: 00-connection.yml (endpoint, mounts, writer
# tokens, failover) and 10-domains.yml (which domains and paths are fetched,
# and which may resolve empty).

# Shared connection inputs.
openbao_secrets_bao_addr: "{{ lookup('env', 'BAO_ADDR') | default('', true) }}"
# TLS terminates at the OpenBao Traefik ingress (a real cert), so verify by
# default; override only for a direct-to-node http bootstrap endpoint.
openbao_secrets_validate_certs: true
openbao_secrets_kv_mount: secret
openbao_secrets_ai_api_key_mount: >-
  {{ lookup('ansible.builtin.env', 'OPENBAO_AI_API_KEY_MOUNT')
     | default(openbao_secrets_kv_mount, true) }}
openbao_secrets_ai_api_key_path_prefix: >-
  {{ lookup('ansible.builtin.env', 'OPENBAO_AI_API_KEY_PATH_PREFIX')
     | default('ai/saas', true) }}

# Hermes' inbound job API is key-presence gated.  The read-side local-llm
# AppRole cannot seed the key.  A human-authorized, short-lived token carrying
# only the hermes-write policy may be supplied for the missing-key converge;
# the ordinary runner BAO_TOKEN is deliberately never a fallback.
openbao_secrets_hermes_writer_token: >-
  {{ lookup('env', 'HERMES_WRITE_BAO_TOKEN') | default('', true) }}
openbao_secrets_hermes_api_key_fallback: >-
  {{ lookup('env', 'HERMES_API_SERVER_KEY') | default('', true) }}
openbao_secrets_hermes_writer_max_ttl_seconds: 600
openbao_secrets_hermes_api_key_path: ai/hermes
openbao_secrets_hermes_api_key_field: HERMES_API_SERVER_KEY

# The llm-router Redis password is generate-if-absent, same shape as the Hermes
# key above.  The read-side local-llm AppRole cannot seed it.  A human-authorized,
# short-lived token carrying only the llm-router-write policy may be supplied for
# the missing-password converge; the ordinary runner BAO_TOKEN is deliberately
# never a fallback.
openbao_secrets_redis_writer_token: >-
  {{ lookup('env', 'LLM_ROUTER_WRITE_BAO_TOKEN') | default('', true) }}
openbao_secrets_redis_password_fallback: >-
  {{ lookup('env', 'LLM_ROUTER_REDIS_PASSWORD') | default('', true) }}
openbao_secrets_redis_writer_max_ttl_seconds: 600
openbao_secrets_redis_password_path: ai/llm-router
openbao_secrets_redis_password_field: LLM_ROUTER_REDIS_PASSWORD
# Client failover across the OpenBao nodes: probe an ordered candidate list and
# use the first reachable endpoint. See README for the full ordering + rationale.
openbao_secrets_openbao_api_port: "{{ tofu_data['constants']['service_ports']['openbao_api'] | default(8200) }}"
openbao_secrets_node_addrs: >-
  {{ tofu_data['containers'] | default({}) | dict2items
     | selectattr('value.tags', 'defined')
     | selectattr('value.tags', 'contains', 'openbao')
     | map(attribute='value.ip', default='') | reject('equalto', '')
     | map('regex_replace', '^(.+)$', 'http://\1:' ~ (openbao_secrets_openbao_api_port | string))
     | list }}
openbao_secrets_bao_addr_candidates: >-
  {{ (([openbao_secrets_bao_addr] if openbao_secrets_bao_addr | length > 0 else [])
      + openbao_secrets_node_addrs) | unique }}
