---
# Each roster identity gets its own AppRole domain; fetch_domain.yml derives its
# OPENBAO_APPROLE_<NAME>_ROLE_ID/_SECRET_ID variables from the domain name.
# The agentgateway-agent-keys reader domain covers every gateway caller
# (`ai_callers`: roster agents plus released-registry harnesses), one
# apps/<caller>-gw leaf each.
openbao_secrets_optional_domains: >-
  {%- set optional_domains = _openbao_secrets_static_optional_domains.copy() -%}
  {%- if ai_agents | default({}) -%}
    {%- set _ = optional_domains.append('llm-router-agent-keys') -%}
  {%- endif -%}
  {%- if ai_callers | default({}) -%}
    {%- set _ = optional_domains.append('agentgateway-agent-keys') -%}
  {%- endif -%}
  {{ optional_domains }}

# Remove owned MCP paths from static legacy domains before adding roster domains.
openbao_secrets_domains: >-
  {%- set owners = ai_agent_owner | default({}) -%}
  {%- set domains = [] -%}
  {%- for domain in _openbao_secrets_static_domains -%}
    {%- set paths = [] -%}
    {%- for path in domain.paths -%}
      {%- set kv_path = path.path if path is mapping else path -%}
      {%- if not (kv_path.startswith('ai/mcp/') and kv_path[7:] in owners) -%}
        {%- set _ = paths.append(path) -%}
      {%- endif -%}
    {%- endfor -%}
    {%- set legacy_domain = domain.copy() -%}
    {%- set _ = legacy_domain.update({'paths': paths}) -%}
    {%- set _ = domains.append(legacy_domain) -%}
  {%- endfor -%}
  {%- set agents = ai_agents | default({}) -%}
  {%- set router_paths = [] -%}
  {%- set gateway_paths = [] -%}
  {%- for agent_name, agent in agents.items() -%}
    {%- set paths = ['ai/' ~ agent_name, 'apps/' ~ agent_name, 'apps/' ~ agent_name ~ '-gw'] -%}
    {%- set _ = router_paths.append('apps/' ~ agent_name) -%}
    {%- for slug in agent.owns | default([]) -%}
      {%- set _ = paths.append('ai/mcp/' ~ slug) -%}
    {%- endfor -%}
    {%- set _ = domains.append({'name': agent_name, 'paths': paths, 'required': true}) -%}
  {%- endfor -%}
  {%- for caller_name in ai_callers | default({}) -%}
    {#- A registry caller's leaf may not be seeded yet: a 404 leaves it keyless, so it gets no bank. -#}
    {%- set leaf = 'apps/' ~ caller_name ~ '-gw' -%}
    {%- set _ = gateway_paths.append(leaf if caller_name in agents else {'path': leaf, 'optional': true}) -%}
  {%- endfor -%}
  {%- if agents -%}
    {%- set _ = domains.append({'name': 'llm-router-agent-keys', 'paths': router_paths}) -%}
  {%- endif -%}
  {%- if gateway_paths -%}
    {%- set _ = domains.append({'name': 'agentgateway-agent-keys', 'paths': gateway_paths}) -%}
  {%- endif -%}
  {{ domains }}
