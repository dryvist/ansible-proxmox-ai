---
# openbao_secrets role defaults — a controller-side pre-play that logs in to
# OpenBao, once per resource-domain identity, and reads that domain's KV
# subtree into a per-domain fact (`bao_<domain>_secrets`, hyphens become
# underscores — e.g. `local-cloud` -> `bao_local_cloud_secrets`). Consumer
# roles then read bao-first, and a SECRET-valued one carries no fallback:
#   X: "{{ bao_<domain>_secrets.X | mandatory('X missing from OpenBao') }}"
# Only non-secret values (URLs, ports, hostnames, model names, channel ids,
# feature flags) may keep an env/default fallback.
#
# Each domain authenticates with its OWN least-privilege AppRole (see
# terraform-proxmox docs/SECRETS_HIERARCHY.md) rather than one broad shared
# identity — a domain's credentials only ever unlock that domain's KV subtree.
#
# FAIL-LOUD CONTRACT
# -----------------
# An empty secret is never a safe outcome: consumers render these values into
# live configuration, and a converge that writes an empty password over a
# working one is silent, immediate damage. So the role fails rather than
# degrading, with exactly two deliberate exceptions:
#
#   1. BAO_ADDR unset AND no openbao-tagged node in the tofu inventory — the
#      whole role no-ops. This is "OpenBao is not part of this converge at
#      all", an explicit operator choice, not a failure to reach it.
#   2. A domain named in `openbao_secrets_optional_domains` — an explicit,
#      reviewable declaration that this domain's AppRole is not provisioned
#      yet and its consumers tolerate absent values.
#
# Everything else is a hard failure:
#   - OpenBao is configured but NO candidate endpoint answers /v1/sys/health
#     unsealed (single endpoints being down is still tolerated — the probe
#     fails over across the candidate list).
#   - A required domain's role_id/secret_id envs are not both set.
#   - Any KV read errors (403, 404, connection). Reads are no longer
#     `failed_when: false`.
#
# Under --check the login and KV reads run FOR REAL (check_mode: false — they
# change no state), so a check run resolves genuine values and the templates
# diff correctly instead of against blanks. The seed/publish tasks write and
# still honor check mode.
#
# Consumers must match this contract: a secret-valued variable uses
# `| mandatory('...')`, never `| default(lookup('env', ...), true)`, and any
# role that renders a password/key/token into a file includes
# `openbao_secrets/tasks/assert_nonempty.yml` over the variable names it is
# about to write.

# Domains allowed to resolve empty instead of failing the play. The contract
# default is an empty list; each entry below is a TODO to DELETE as soon as
# that domain's AppRole + policy land (see the per-domain notes further down),
# not a permanent exemption.
# A single PATH may also be declared optional, independently of its domain, by
# giving its mapping form `optional: true` (see ai-runner's vendor keys below).
# A 404 on such a path is skipped with a visible warning naming the path; a 403
# — which means the credential is wrong, not the secret absent — and every other
# error still fail. Only the mapping path form supports the flag; a bare string
# path is always required.
openbao_secrets_optional_domains:
  - ai-public   # AppRole/policy on secret/data/ai/public/* not provisioned yet
  - ai-runner   # CIDR-bound runner AppRole not provisioned yet
  - hermes      # HERMES_VAULT_ROLE_ID/SECRET_ID not in Doppler yet
  - donna       # second agent identity, features presence-gated off until seeded

# Shared connection inputs.
openbao_secrets_bao_addr: "{{ lookup('env', 'BAO_ADDR') | default('', true) }}"
# TLS terminates at the OpenBao Traefik ingress (a real cert), so verify by
# default; override only for a direct-to-node http bootstrap endpoint.
openbao_secrets_validate_certs: true
openbao_secrets_kv_mount: secret
openbao_secrets_ai_api_key_mount: >-
  {{ lookup('ansible.builtin.env', 'OPENBAO_AI_API_KEY_MOUNT')
     | default(openbao_secrets_kv_mount, true) }}
openbao_secrets_ai_api_key_path_prefix: >-
  {{ lookup('ansible.builtin.env', 'OPENBAO_AI_API_KEY_PATH_PREFIX')
     | default('ai/saas', true) }}

# Hermes' inbound job API is key-presence gated.  The read-side local-llm
# AppRole cannot seed the key.  A human-authorized, short-lived token carrying
# only the hermes-write policy may be supplied for the missing-key converge;
# the ordinary runner BAO_TOKEN is deliberately never a fallback.
openbao_secrets_hermes_writer_token: >-
  {{ lookup('env', 'HERMES_WRITE_BAO_TOKEN') | default('', true) }}
openbao_secrets_hermes_api_key_fallback: >-
  {{ lookup('env', 'HERMES_API_SERVER_KEY') | default('', true) }}
openbao_secrets_hermes_writer_max_ttl_seconds: 600
openbao_secrets_hermes_api_key_path: ai/hermes
openbao_secrets_hermes_api_key_field: HERMES_API_SERVER_KEY

# The llm-router Redis password is generate-if-absent, same shape as the Hermes
# key above.  The read-side local-llm AppRole cannot seed it.  A human-authorized,
# short-lived token carrying only the llm-router-write policy may be supplied for
# the missing-password converge; the ordinary runner BAO_TOKEN is deliberately
# never a fallback.
openbao_secrets_redis_writer_token: >-
  {{ lookup('env', 'LLM_ROUTER_WRITE_BAO_TOKEN') | default('', true) }}
openbao_secrets_redis_password_fallback: >-
  {{ lookup('env', 'LLM_ROUTER_REDIS_PASSWORD') | default('', true) }}
openbao_secrets_redis_writer_max_ttl_seconds: 600
openbao_secrets_redis_password_path: ai/llm-router
openbao_secrets_redis_password_field: LLM_ROUTER_REDIS_PASSWORD
# Client failover across the OpenBao nodes: probe an ordered candidate list and
# use the first reachable endpoint. See README for the full ordering + rationale.
openbao_secrets_openbao_api_port: "{{ tofu_data['constants']['service_ports']['openbao_api'] | default(8200) }}"
openbao_secrets_node_addrs: >-
  {{ tofu_data['containers'] | default({}) | dict2items
     | selectattr('value.tags', 'defined')
     | selectattr('value.tags', 'contains', 'openbao')
     | map(attribute='value.ip', default='') | reject('equalto', '')
     | map('regex_replace', '^(.+)$', 'http://\1:' ~ (openbao_secrets_openbao_api_port | string))
     | list }}
openbao_secrets_bao_addr_candidates: >-
  {{ (([openbao_secrets_bao_addr] if openbao_secrets_bao_addr | length > 0 else [])
      + openbao_secrets_node_addrs) | unique }}

# One entry per resource-domain identity this Ansible converge fetches for.
# Each domain's role_id/secret_id come from its own env vars — sourced from
# the operator's keychain-backed resolver on macOS, or a root-only systemd
# credential on Linux (never a shared/broad credential). Add a domain here as
# new consumer roles are wired to read bao-first; each needs a matching
# AppRole + policy in ansible-proxmox-apps' roles/openbao
# (`openbao_approles`/`openbao_policies`) — the OpenBao server config stays
# in that repo; this repo only CONSUMES the local-llm domain.
openbao_secrets_domains:
  # Apps domain — non-Hermes-identity app credentials generated at source by
  # ansible-proxmox-apps' roles/openbao, next to the other app DB/auth
  # credentials this repo's Docker-in-LXC roles consume.
  - name: apps
    role_id_env: APPS_VAULT_ROLE_ID
    secret_id_env: APPS_VAULT_SECRET_ID
    paths:
      - apps/hindsight  # hindsight_db_password, hindsight_cp_access_key (+ replication)
      - apps/llm-router # llm_router_db_password — the router's login on the same
                        #   ai-VLAN Postgres cluster Hindsight uses. Generated at
                        #   source by ansible-proxmox-apps' roles/openbao, and read
                        #   there too (postgres_ai_group.yml) so one field serves
                        #   both ends and they cannot drift. NOT the same path as
                        #   ai/llm-router, which carries the Redis password.
      - apps/hermes-ui  # hermes_ui_workspace_password, hermes_ui_hermes_api_token,
                        #   hermes_ui_mission_control_auth_user/_auth_pass
      - apps/open-webui # open_webui_llm_router_key, generated at source in
                        #   apps' openbao role, registered by seed-keys.yml.
      - apps/langgraph  # langgraph_llm_router_key, same contract.
  # Public (non-secret) fabric coordination data — mirrors the "non-secret
  # coordination path" precedent in tofu-proxmox's SECRETS_HIERARCHY.md
  # (secret/platform/terrakube/main). Read-only, own least-privilege AppRole
  # (NOT local-llm's broader ai/* grant): this is the one domain whose
  # role_id/secret_id is also handed to CONSUMER GUESTS (hermes_agent,
  # open_webui — see their *_brain_sync_* vars) for a runtime systemd-timer
  # poll, so it must stay narrowly scoped to non-secret data even though
  # local-llm's existing ai/* policy would technically also cover this path —
  # a guest holding a live, reusable copy of local-llm's credential could
  # pull every OTHER ai/* secret (Langfuse/Langflow DB passwords, GitHub App
  # key, ...) it does not otherwise have, not just the ones already baked
  # into its own .env. Needs a companion AppRole + read-only policy on
  # secret/data/ai/public/* in ansible-proxmox-apps' roles/openbao
  # (openbao_approles/openbao_policies) before this domain resolves live.
  - name: ai-public
    role_id_env: AI_PUBLIC_VAULT_ROLE_ID
    secret_id_env: AI_PUBLIC_VAULT_SECRET_ID
    paths:
      - ai/public/brain  # active_model — the runtime fabric-brain override;
                          #   see inventory/group_vars/all.yml (ai_default_model)
                          #   and roles/hermes_agent + roles/open_webui brain-sync.
  # AI runner domain — the headless job-runner guests (ai_runner role, WS7A).
  # Own least-privilege AppRole, CIDR-bound to the runner guest's fixed IP (the
  # secret_id is bound to that guest's reservation). Reads only the queue token
  # + the third-party model-provider keys the runner needs — NOT local-llm's
  # broad ai/* grant. Needs a matching CIDR-bound AppRole + read-only policy on
  # these paths in ansible-proxmox-apps' roles/openbao (openbao_approles/
  # openbao_policies) before it resolves live; until then it no-ops (role_id/
  # secret_id envs unset) and the role falls back to env secrets.
  - name: ai-runner
    role_id_env: AI_RUNNER_VAULT_ROLE_ID
    secret_id_env: AI_RUNNER_VAULT_SECRET_ID
    paths:
      - ai/vikunja          # VIKUNJA_API_TOKEN — the dispatch-queue credential
      # optional: these two vendor keys are seeded only when the paid-provider
      # feature is enabled, so the path legitimately does not exist yet. A 404
      # is skipped with a visible warning; a 403 or any other error still
      # fails. Verified 404 against the live store 2026-09-02.
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/anthropic"  # ANTHROPIC_API_KEY
        optional: true
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/openai"     # OPENAI_API_KEY
        optional: true
  # Hermes' own least-privilege AppRole (policy `hermes`, path-exact on
  # ai/hermes — NOT local-llm's broader ai/* grant), already provisioned
  # server-side. NOT YET CONSUMED: every ai/hermes field
  # (HERMES_VIKUNJA_API_TOKEN, GH_PAT_WRITE_PROJECT_ISSUES,
  # HERMES_GITHUB_APP_*, ...) is still read via local-llm's broader grant
  # above (see hermes_agent's group_vars). Migrate one field at a time by
  # pointing its group_vars override at bao_hermes_secrets.<FIELD> once
  # HERMES_VAULT_ROLE_ID/SECRET_ID are provisioned in Doppler — same
  # skip-cleanly semantics as every other domain here in the meantime.
  - name: hermes
    role_id_env: HERMES_VAULT_ROLE_ID
    secret_id_env: HERMES_VAULT_SECRET_ID
    paths:
      - ai/hermes  # HERMES_VIKUNJA_API_TOKEN, and the rest of ai/hermes
                   #   once their consumers migrate off local-llm's grant
  # Second agent identity, same shape as `hermes` above. Deliberately NOT given
  # a fallback onto local-llm's ai/* grant: that grant can read ai/hermes, so
  # falling back would hand this agent the FIRST agent's Slack, Vikunja and
  # GitHub credentials. Absent creds resolve empty and each feature stays off
  # (see roles/hermes_agent/defaults, every integration is presence-gated).
  - name: donna
    role_id_env: DONNA_VAULT_ROLE_ID
    secret_id_env: DONNA_VAULT_SECRET_ID
    paths:
      - ai/donna
  - name: local-llm
    role_id_env: LOCAL_LLM_VAULT_ROLE_ID
    secret_id_env: LOCAL_LLM_VAULT_SECRET_ID
    paths:
      - ai/llm         # LLM_ROUTER_MASTER_KEY, LLM_LARGE_BEARER_TOKEN (single seeded KV path)
      - ai/llm-router  # LLM_ROUTER_REDIS_PASSWORD — the shared spend store's
                       #   AUTH credential, read by BOTH roles/redis (templated
                       #   into requirepass) and roles/llm_router (handed to
                       #   LiteLLM). One field, so the two ends cannot drift.
                       #   Every path in a domain merges into one flat dict, so
                       #   the key resolves regardless of which path holds it;
                       #   it lives here rather than in ai/llm to keep the
                       #   router's store credential separable later.
      - ai/qdrant      # QDRANT_API_KEY
      - ai/open-webui  # OPEN_WEBUI_SECRET_KEY, OPEN_WEBUI_OPENAI_API_KEY
      - ai/hermes      # GH_PAT_WRITE_PROJECT_ISSUES, HERMES_GITHUB_APP_{ID,INSTALLATION_ID,
                       #   PRIVATE_KEY}.
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/openrouter"  # OPENROUTER_API_KEY
      # optional: llm_router_hermes_cloud_models_credentialed drops a
      # provider whose key is absent, and emits no env line for it.
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/gemini"      # GEMINI_API_KEY
        optional: true
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/alibaba"     # DASHSCOPE_API_KEY
        optional: true
      - ai/mcp/splunk  # SPLUNK_MCP_URL, SPLUNK_MCP_TOKEN; merged into the same
                       #   bao_local_llm_secrets fact consumed by Hermes
      - ai/mcp/zammad  # ZAMMAD_MCP_URL, ZAMMAD_MCP_TOKEN; authoritative incident API pair
      # NAUTOBOT_MCP_URL, NAUTOBOT_MCP_TOKEN — read-only IPAM/DCIM token from
      # ansible-proxmox-apps' roles/nautobot, published opt-in. optional:
      # an empty token omits the sidecar and the /nautobot route.
      - mount: "{{ openbao_secrets_kv_mount }}"
        path: ai/mcp/nautobot
        optional: true
      - ai/langfuse    # LANGFUSE_{POSTGRES_PASSWORD,CLICKHOUSE_PASSWORD,REDIS_AUTH,
                       #   S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,PUBLIC_KEY,SECRET_KEY,
                       #   INIT_USER_EMAIL,INIT_USER_PASSWORD} — fully seeded 2026-07-05
      - ai/langflow    # LANGFLOW_{SUPERUSER,SUPERUSER_PASSWORD,DB_PASSWORD}
      - ai/dify        # DIFY_SECRET_KEY — the session/credential-protection key.
                       #   PROMOTED from the running guest, never regenerated: a
                       #   fresh value cannot decrypt what the existing value
                       #   encrypted, and nothing reports an error when that
                       #   happens. Operator-seeded like its ai/* siblings.
