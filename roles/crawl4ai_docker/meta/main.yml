---
galaxy_info:
  author: Jacob Evans
  description: >-
    Crawl4AI self-hosted web crawling API using the upstream Docker image and
    Compose deployment.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - bookworm
  galaxy_tags:
    - ai
    - crawl4ai
    - docker

dependencies:
  # Shared Docker-in-LXC bootstrap (Docker CE and the Compose plugin).
  - role: docker_engine
    docker_engine_configure_daemon_json: true

collections:
  - community.docker
