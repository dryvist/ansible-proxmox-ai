---
- name: Start detached Laya fine-tuning
  block:
    - name: Remove any stale fine-tune staging directory
      ansible.builtin.file:
        path: "{{ laya_systemone_finetune_staging_dir }}"
        state: absent
      become: true

    - name: Create the private fine-tune staging directory
      ansible.builtin.file:
        path: "{{ laya_systemone_finetune_staging_dir }}"
        state: directory
        owner: "{{ laya_systemone_user }}"
        group: "{{ laya_systemone_group }}"
        mode: "0700"
      become: true

    - name: Read the GPU peer serving unit state before training
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - "{{ laya_systemone_finetune_gpu_peer_unit }}"
      delegate_to: "{{ laya_systemone_finetune_gpu_peer_host }}"
      register: laya_systemone_finetune_gpu_peer_state
      changed_when: false
      failed_when: laya_systemone_finetune_gpu_peer_state.rc not in [0, 3]
      when:
        - laya_systemone_finetune_device == 'cuda'
        - laya_systemone_finetune_gpu_peer_host | length > 0

    - name: Record whether the GPU peer serving unit was active
      ansible.builtin.set_fact:
        laya_systemone_finetune_gpu_peer_was_active: "{{ laya_systemone_finetune_gpu_peer_state.rc == 0 }}"
        laya_systemone_finetune_gpu_peer_restore_required: false
      when:
        - laya_systemone_finetune_device == 'cuda'
        - laya_systemone_finetune_gpu_peer_host | length > 0

    - name: Persist the GPU peer state for the collect run
      ansible.builtin.copy:
        content: >-
          {{ {'gpu_peer_was_active':
              laya_systemone_finetune_gpu_peer_was_active | default(false) | bool} | to_json }}
        dest: "{{ laya_systemone_finetune_dispatch_state_path }}"
        owner: "{{ laya_systemone_user }}"
        group: "{{ laya_systemone_group }}"
        mode: "0600"
      become: true

    - name: Record that persisted dispatch state is available for collection
      ansible.builtin.set_fact:
        laya_systemone_finetune_dispatch_state_created: true

    - name: Stop Laya to free the guest GPU for fine-tuning
      ansible.builtin.systemd:
        name: laya-systemone.service
        state: stopped
      when: laya_systemone_finetune_unit_stat.stat.exists
      no_log: true

    - name: Stop the active GPU peer serving unit for training
      ansible.builtin.systemd:
        name: "{{ laya_systemone_finetune_gpu_peer_unit }}"
        state: stopped
      delegate_to: "{{ laya_systemone_finetune_gpu_peer_host }}"
      when: laya_systemone_finetune_gpu_peer_was_active | default(false) | bool

    - name: Launch the Laya training command as a detached systemd job
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit={{ laya_systemone_finetune_unit }}
          - --service-type=exec
          - --no-block
          - --quiet
          - --uid={{ laya_systemone_user }}
          - --gid={{ laya_systemone_group }}
          - --property=RuntimeMaxSec={{ laya_systemone_finetune_train_timeout_seconds }}
          - --property=ExecStopPost=+/usr/bin/systemctl start laya-systemone.service
          - --property=StandardOutput=journal
          - --property=StandardError=journal
          - --setenv=HF_HUB_OFFLINE=1
          - --setenv=TRANSFORMERS_OFFLINE=1
          - "{{ laya_systemone_venv }}/bin/laya-train"
          - --data
          - "{{ laya_systemone_finetune_train_path }}"
          - --base
          - "{{ laya_systemone_finetune_base_path }}"
          - --eval-data
          - "{{ laya_systemone_finetune_eval_path }}"
          - --out
          - "{{ laya_systemone_finetune_staging_dir }}"
          - --text-column
          - "{{ laya_systemone_finetune_text_column }}"
          - --label-column
          - "{{ laya_systemone_finetune_label_column }}"
          - --epochs
          - "{{ laya_systemone_finetune_epochs | string }}"
          - --target-error
          - "{{ laya_systemone_finetune_target_error | string }}"
          - --seed
          - "{{ laya_systemone_finetune_seed | string }}"
          - --device
          - "{{ laya_systemone_finetune_device }}"
      register: laya_systemone_finetune_dispatch_result
      become: true
      changed_when: true
      no_log: true
  rescue:
    - name: Check whether systemd accepted the detached fine-tune job
      ansible.builtin.include_tasks: finetune-read-job-state.yml

    - name: Record an unsafe fine-tune dispatch state
      ansible.builtin.set_fact:
        laya_systemone_finetune_failed: true
        laya_systemone_finetune_failure_class: >-
          {{ 'service-recovery'
             if laya_systemone_finetune_job_state_result.unreachable | default(false)
             else 'unknown-state' }}
      when: not laya_systemone_finetune_job_state_valid | bool

    - name: Record a failed fine-tune dispatch
      ansible.builtin.set_fact:
        laya_systemone_finetune_failed: true
        laya_systemone_finetune_failure_class: dispatch
      when:
        - laya_systemone_finetune_job_state_valid | bool
        - not laya_systemone_finetune_job_running | bool

    - name: Restore services after a dispatch that did not start
      ansible.builtin.include_tasks: finetune-restore-services.yml
      when:
        - laya_systemone_finetune_job_state_valid | bool
        - not laya_systemone_finetune_job_running | bool

    - name: Restore the GPU peer after an unreachable dispatch-state probe
      ansible.builtin.include_tasks: finetune-restore-peer.yml
      when:
        - not laya_systemone_finetune_job_state_valid | bool
        - laya_systemone_finetune_job_state_result.unreachable | default(false)

    - name: Determine whether failed dispatch recovery can release its state
      ansible.builtin.set_fact:
        laya_systemone_finetune_dispatch_cleanup_safe: >-
          {{ not (laya_systemone_finetune_dispatch_state_created | default(false) | bool)
             or (laya_systemone_finetune_recovery_cleanup_ready | default(false) | bool
                 and not (laya_systemone_finetune_gpu_peer_state.failed | default(false))
                 and not (laya_systemone_finetune_gpu_peer_state.unreachable | default(false))
                 and not (laya_systemone_finetune_job_state_result.unreachable | default(false))) }}

    - name: Remove the lock after failed dispatch recovery succeeds
      ansible.builtin.file:
        path: "{{ laya_systemone_finetune_dispatch_lock_path }}"
        state: absent
      register: laya_systemone_finetune_dispatch_lock_remove
      become: true
      when: laya_systemone_finetune_dispatch_cleanup_safe | bool
      ignore_errors: true
      ignore_unreachable: true

    - name: Remove state after releasing the lock for failed dispatch
      ansible.builtin.file:
        path: "{{ laya_systemone_finetune_dispatch_state_path }}"
        state: absent
      register: laya_systemone_finetune_dispatch_state_remove
      become: true
      when:
        - laya_systemone_finetune_dispatch_cleanup_safe | bool
        - not laya_systemone_finetune_dispatch_lock_remove.failed | default(false)
        - not laya_systemone_finetune_dispatch_lock_remove.unreachable | default(false)
      ignore_errors: true
      ignore_unreachable: true

    - name: Record that safe dispatch recovery released the lock
      ansible.builtin.set_fact:
        laya_systemone_finetune_dispatch_lock_released: true
      when:
        - laya_systemone_finetune_dispatch_lock_remove is defined
        - not laya_systemone_finetune_dispatch_lock_remove.failed | default(false)
        - not laya_systemone_finetune_dispatch_lock_remove.unreachable | default(false)
        - laya_systemone_finetune_dispatch_state_remove is defined
        - not laya_systemone_finetune_dispatch_state_remove.failed | default(false)
        - not laya_systemone_finetune_dispatch_state_remove.unreachable | default(false)

    - name: Report a failed fine-tune dispatch
      ansible.builtin.include_tasks: finetune-report-failure.yml
      when: laya_systemone_finetune_failed | default(false) | bool

    - name: Report that systemd accepted the detached fine-tune job
      ansible.builtin.debug:
        msg: Laya fine-tune job is active or complete; collect its result in a separate run.
      when:
        - laya_systemone_finetune_job_state_valid | bool
        - laya_systemone_finetune_job_running | bool

- name: Report the detached fine-tune job launch
  ansible.builtin.debug:
    msg: Laya fine-tune job was dispatched; collect its result in a separate run.
  when: not laya_systemone_finetune_failed | default(false) | bool
