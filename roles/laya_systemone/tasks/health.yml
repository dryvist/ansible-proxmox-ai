---
- name: Wait for Laya health to return successfully
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ laya_systemone_port }}/health"
    status_code: 200
    timeout: "{{ laya_systemone_health_timeout_seconds }}"
  register: laya_systemone_health
  timeout: "{{ laya_systemone_health_task_timeout_seconds }}"
  retries: "{{ laya_systemone_health_retries }}"
  delay: "{{ laya_systemone_health_delay }}"
  until: laya_systemone_health.status | default(0) == 200
