---
- name: Gather GPU peer network facts for its health check
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - network
  delegate_to: "{{ laya_systemone_finetune_gpu_peer_host }}"
  delegate_facts: true
  when: >-
    laya_systemone_finetune_gpu_peer_was_active | default(false) | bool
    or laya_systemone_finetune_gpu_peer_restore_required | default(false) | bool
  ignore_errors: true
  ignore_unreachable: true
  register: laya_systemone_finetune_gpu_peer_setup
  no_log: true

- name: Start the GPU peer serving unit after fine-tuning
  ansible.builtin.systemd:
    name: "{{ laya_systemone_finetune_gpu_peer_unit }}"
    state: started
  delegate_to: "{{ laya_systemone_finetune_gpu_peer_host }}"
  when: >-
    laya_systemone_finetune_gpu_peer_was_active | default(false) | bool
    or laya_systemone_finetune_gpu_peer_restore_required | default(false) | bool
  register: laya_systemone_finetune_gpu_peer_start
  ignore_errors: true
  ignore_unreachable: true
  no_log: true

- name: Wait for GPU peer serving health after fine-tuning
  ansible.builtin.uri:
    url: "{{ laya_systemone_finetune_gpu_peer_health_url }}"
    status_code: 200
    timeout: "{{ laya_systemone_finetune_health_timeout_seconds }}"
  delegate_to: "{{ laya_systemone_finetune_gpu_peer_host }}"
  register: laya_systemone_finetune_gpu_peer_health
  retries: "{{ laya_systemone_finetune_health_retries }}"
  delay: "{{ laya_systemone_finetune_health_delay_seconds }}"
  until: laya_systemone_finetune_gpu_peer_health.status | default(0) == 200
  when: >-
    laya_systemone_finetune_gpu_peer_was_active | default(false) | bool
    or laya_systemone_finetune_gpu_peer_restore_required | default(false) | bool
  ignore_errors: true
  ignore_unreachable: true
  no_log: true
