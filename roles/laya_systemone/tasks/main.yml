---
# Every action needs it: this role's defaults read nvidia_gpu_guest_* values.
- name: Install shared NVIDIA guest prerequisites
  ansible.builtin.include_role:
    name: nvidia_gpu_guest
    # public: this role's defaults read nvidia_gpu_guest_* values after the include.
    public: true

- name: Converge the Laya serving runtime when fine-tuning is not selected
  when: not laya_systemone_finetune_enabled | bool
  block:
    - name: Create the Laya virtual environment
      ansible.builtin.command:
        argv:
          - "{{ nvidia_gpu_guest_uv_bin }}"
          - venv
          - --python
          - "{{ laya_systemone_python }}"
          - "{{ laya_systemone_venv }}"
        creates: "{{ laya_systemone_venv }}/bin/python"
      become: true
      become_user: "{{ laya_systemone_user }}"
      environment: "{{ nvidia_gpu_guest_uv_environment }}"

    - name: Install the pinned Laya HTTP server with a driver-compatible CUDA torch wheel
      ansible.builtin.command:
        argv:
          - "{{ nvidia_gpu_guest_uv_bin }}"
          - pip
          - install
          - --python
          - "{{ laya_systemone_venv }}/bin/python"
          - --torch-backend=auto
          - "laya[serve]=={{ laya_systemone_version }}"
      become: true
      become_user: "{{ laya_systemone_user }}"
      environment: "{{ nvidia_gpu_guest_uv_environment }}"
      register: laya_systemone_install
      when: not ansible_check_mode
      changed_when: >-
        'Installed' in laya_systemone_install.stderr or
        'Prepared' in laya_systemone_install.stderr or
        'Uninstalled' in laya_systemone_install.stderr
      notify: Restart Laya systemd service

    # Gate the start: a CPU-only torch build would serve silently on the CPU.
    - name: Probe CUDA from the installed Laya torch build
      ansible.builtin.command:
        argv:
          - "{{ laya_systemone_venv }}/bin/python"
          - -c
          - "import torch; print(torch.cuda.is_available())"
      become: true
      become_user: "{{ laya_systemone_user }}"
      environment: "{{ nvidia_gpu_guest_uv_environment }}"
      register: laya_systemone_torch_cuda
      changed_when: false
      when: not ansible_check_mode

    - name: Assert the installed Laya torch build can use CUDA before the service starts
      ansible.builtin.assert:
        quiet: true
        that:
          - laya_systemone_torch_cuda.stdout | trim == 'True'
        fail_msg: >-
          The installed torch build does not see a CUDA device. Laya is not started.
      when: not ansible_check_mode

    - name: Render the Laya service environment and systemd unit
      ansible.builtin.include_tasks: render-unit.yml

    - name: Apply pending Laya service changes
      ansible.builtin.meta: flush_handlers

    - name: Ensure the Laya service is enabled and running
      ansible.builtin.systemd:
        name: laya-systemone.service
        state: started
        enabled: true
        daemon_reload: true
      no_log: true

    - name: Verify Laya health after the serving converge
      ansible.builtin.include_tasks:
        file: health.yml
        apply:
          tags:
            - laya_systemone
            - llm
            - ai
      tags:
        - laya_systemone
        - llm
        - ai

    - name: Verify Laya computes on the card
      ansible.builtin.include_tasks:
        file: assert-gpu.yml
        apply:
          tags:
            - laya_systemone
            - llm
            - ai
      # The uri module does not run in check mode, so no device can be read.
      when: not ansible_check_mode
      tags:
        - laya_systemone
        - llm
        - ai

- name: Validate the fine-tune action
  ansible.builtin.assert:
    that:
      - laya_systemone_finetune_action in ['dispatch', 'collect']
    fail_msg: >-
      Fine-tune mode needs -e laya_systemone_finetune_action=dispatch or collect
      with -e laya_systemone_finetune_enabled=true. Never set
      laya_systemone_finetune_enabled in inventory: it keeps every serving
      converge on this branch.
    quiet: true
  when: laya_systemone_finetune_enabled | bool

- name: Dispatch the detached Laya fine-tune job
  ansible.builtin.include_tasks:
    file: finetune.yml
    apply:
      tags:
        - laya_systemone
        - laya_systemone_finetune
        - llm
        - ai
  when:
    - laya_systemone_finetune_enabled | bool
    - laya_systemone_finetune_action == 'dispatch'
  tags:
    - laya_systemone
    - laya_systemone_finetune
    - llm
    - ai

- name: Collect a detached Laya fine-tune job
  ansible.builtin.include_tasks:
    file: finetune-collect.yml
    apply:
      tags:
        - laya_systemone
        - laya_systemone_finetune
        - llm
        - ai
  when:
    - laya_systemone_finetune_enabled | bool
    - laya_systemone_finetune_action == 'collect'
  tags:
    - laya_systemone
    - laya_systemone_finetune
    - llm
    - ai
