---
- name: Classify an incomplete or unreachable service recovery
  ansible.builtin.set_fact:
    laya_systemone_finetune_recovery_failed: >-
      {{ (laya_systemone_finetune_services_ready is defined
          and not laya_systemone_finetune_services_ready | bool)
         or (laya_systemone_finetune_recovery_cleanup_ready is defined
             and not laya_systemone_finetune_recovery_cleanup_ready | bool)
         or (laya_systemone_finetune_dispatch_state_stat is defined
             and laya_systemone_finetune_dispatch_state_stat.unreachable | default(false))
         or (laya_systemone_finetune_dispatch_state_file is defined
             and laya_systemone_finetune_dispatch_state_file.unreachable | default(false))
         or (laya_systemone_finetune_job_state_result is defined
             and laya_systemone_finetune_job_state_result.unreachable | default(false))
         or (laya_systemone_finetune_dispatch_lock_create is defined
             and laya_systemone_finetune_dispatch_lock_create.unreachable | default(false))
         or (laya_systemone_finetune_dispatch_result is defined
             and laya_systemone_finetune_dispatch_result.unreachable | default(false))
         or (laya_systemone_finetune_gpu_peer_recovery_probe is defined
             and (laya_systemone_finetune_gpu_peer_recovery_probe.unreachable | default(false)
                  or laya_systemone_finetune_gpu_peer_recovery_probe.failed | default(false)
                  or (laya_systemone_finetune_gpu_peer_recovery_probe.rc | default(0)) not in [0, 3]))
         or (laya_systemone_finetune_gpu_peer_state is defined
             and (laya_systemone_finetune_gpu_peer_state.failed | default(false)
                  or laya_systemone_finetune_gpu_peer_state.unreachable | default(false)))
         or (laya_systemone_finetune_gpu_peer_setup is defined
             and (laya_systemone_finetune_gpu_peer_setup.failed | default(false)
                  or laya_systemone_finetune_gpu_peer_setup.unreachable | default(false)))
         or (laya_systemone_finetune_gpu_peer_start is defined
             and (laya_systemone_finetune_gpu_peer_start.failed | default(false)
                  or laya_systemone_finetune_gpu_peer_start.unreachable | default(false)))
         or (laya_systemone_finetune_gpu_peer_health is defined
             and (laya_systemone_finetune_gpu_peer_health.failed | default(false)
                  or laya_systemone_finetune_gpu_peer_health.unreachable | default(false)))
         or (laya_systemone_finetune_current_before_recovery is defined
             and laya_systemone_finetune_current_before_recovery.unreachable | default(false))
         or (laya_systemone_finetune_previous_before_recovery is defined
             and laya_systemone_finetune_previous_before_recovery.unreachable | default(false))
         or (laya_systemone_finetune_restore_previous is defined
             and laya_systemone_finetune_restore_previous.unreachable | default(false))
         or (laya_systemone_finetune_laya_version is defined
             and laya_systemone_finetune_laya_version.unreachable | default(false))
         or (laya_systemone_finetune_manifest_before is defined
             and laya_systemone_finetune_manifest_before.unreachable | default(false))
         or (laya_systemone_finetune_staging_model_stat is defined
             and laya_systemone_finetune_staging_model_stat.unreachable | default(false))
         or (laya_systemone_finetune_staging_config_stat is defined
             and laya_systemone_finetune_staging_config_stat.unreachable | default(false))
         or (laya_systemone_finetune_current_before_promotion is defined
             and laya_systemone_finetune_current_before_promotion.unreachable | default(false))
         or (laya_systemone_finetune_promoted_unit_stat is defined
             and laya_systemone_finetune_promoted_unit_stat.unreachable | default(false))
         or (laya_systemone_finetune_paths_after_failed_promotion is defined
             and laya_systemone_finetune_paths_after_failed_promotion.unreachable | default(false))
         or (laya_systemone_finetune_unit_stat is defined
             and (laya_systemone_finetune_unit_stat.failed | default(false)
                  or laya_systemone_finetune_unit_stat.unreachable | default(false)))
         or (laya_systemone_finetune_service_start is defined
             and (laya_systemone_finetune_service_start.failed | default(false)
                  or laya_systemone_finetune_service_start.unreachable | default(false)))
         or (laya_systemone_finetune_health is defined
             and (laya_systemone_finetune_health.failed | default(false)
                  or laya_systemone_finetune_health.unreachable | default(false)))
         or (laya_systemone_finetune_job_stop is defined
             and (laya_systemone_finetune_job_stop.failed | default(false)
                  or laya_systemone_finetune_job_stop.unreachable | default(false)))
         or (laya_systemone_finetune_job_reset is defined
             and (laya_systemone_finetune_job_reset.failed | default(false)
                  or laya_systemone_finetune_job_reset.unreachable | default(false)))
         or (laya_systemone_finetune_dispatch_state_remove is defined
             and (laya_systemone_finetune_dispatch_state_remove.failed | default(false)
                  or laya_systemone_finetune_dispatch_state_remove.unreachable | default(false)))
         or (laya_systemone_finetune_dispatch_lock_remove is defined
             and (laya_systemone_finetune_dispatch_lock_remove.failed | default(false)
                  or laya_systemone_finetune_dispatch_lock_remove.unreachable | default(false))) }}

- name: Apply the service recovery failure classification
  ansible.builtin.set_fact:
    laya_systemone_finetune_failed: >-
      {{ laya_systemone_finetune_failed | default(false) | bool
         or laya_systemone_finetune_recovery_failed | bool }}
    laya_systemone_finetune_failure_class: >-
      {{ laya_systemone_finetune_failure_class | default('service-recovery')
         if laya_systemone_finetune_failed | default(false) | bool
         else ('service-recovery' if laya_systemone_finetune_recovery_failed | bool else 'unknown') }}

- name: Report the fine-tuning failure without exposing dataset output
  ansible.builtin.fail:
    msg: >-
      Laya fine-tuning failed ({{ laya_systemone_finetune_failure_class | default('unknown') }});
      {% if laya_systemone_finetune_recovery_failed | default(false) | bool %}
      service recovery is incomplete and dispatch state remains available for retry.
      {% else %}
      service recovery completed where configured services were required.
      {% endif %}
  when: laya_systemone_finetune_failed | default(false) | bool
