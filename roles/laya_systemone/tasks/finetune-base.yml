---
- name: Download the pinned Laya base checkpoint when missing or unverified
  ansible.builtin.command:
    argv:
      - "{{ laya_systemone_venv }}/bin/python"
      - -c
      - |
        import json
        import os
        import shutil
        from huggingface_hub import snapshot_download
        from laya.revisions import resolve_revision, verify_digests

        repo_id = os.environ["LAYA_BASE_REPOSITORY"]
        revision = os.environ["LAYA_BASE_REVISION"]
        base_dir = os.environ["LAYA_BASE_DIRECTORY"]
        expected = json.loads(os.environ["LAYA_BASE_SHA256"])
        if resolve_revision(repo_id, "reviewed") != revision:
            raise SystemExit("Laya base revision does not match the reviewed pin.")
        try:
            verify_digests(base_dir, expected)
            print("verified")
        except (OSError, ValueError):
            shutil.rmtree(base_dir, ignore_errors=True)
            snapshot_download(repo_id=repo_id, revision=revision, local_dir=base_dir,
                              allow_patterns=sorted(expected))
            print("downloaded")
  environment:
    LAYA_BASE_REPOSITORY: "{{ laya_systemone_finetune_base }}"
    LAYA_BASE_REVISION: "{{ laya_systemone_finetune_base_revision }}"
    LAYA_BASE_DIRECTORY: "{{ laya_systemone_finetune_base_path }}"
    LAYA_BASE_SHA256: >-
      {{ laya_systemone_finetune_base_sha256
      | items2dict(key_name='path', value_name='sha256')
      | to_json }}
  register: laya_systemone_finetune_base_fetch
  become: true
  become_user: "{{ laya_systemone_user }}"
  changed_when: "'downloaded' in laya_systemone_finetune_base_fetch.stdout"
  no_log: true

- name: Verify the pinned Laya base checkpoint before training
  ansible.builtin.command:
    argv:
      - "{{ laya_systemone_venv }}/bin/python"
      - -c
      - |
        import json
        import os
        from laya.revisions import resolve_revision, verify_digests

        try:
            if resolve_revision(os.environ["LAYA_BASE_REPOSITORY"], "reviewed") != os.environ["LAYA_BASE_REVISION"]:
                raise ValueError
            verify_digests(os.environ["LAYA_BASE_DIRECTORY"], json.loads(os.environ["LAYA_BASE_SHA256"]))
        except Exception:
            raise SystemExit("Pinned Laya base checkpoint verification failed.") from None
  environment:
    LAYA_BASE_REPOSITORY: "{{ laya_systemone_finetune_base }}"
    LAYA_BASE_REVISION: "{{ laya_systemone_finetune_base_revision }}"
    LAYA_BASE_DIRECTORY: "{{ laya_systemone_finetune_base_path }}"
    LAYA_BASE_SHA256: >-
      {{ laya_systemone_finetune_base_sha256
      | items2dict(key_name='path', value_name='sha256')
      | to_json }}
    HF_HUB_OFFLINE: "1"
  become: true
  become_user: "{{ laya_systemone_user }}"
  changed_when: false
  no_log: true
