---
# The GPU peer restarts first, from the dispatch state, so a lost connection to
# this guest cannot leave the peer stopped.
- name: Gather GPU peer network facts for its health check
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - network
  delegate_to: "{{ laya_systemone_finetune_gpu_peer_host }}"
  delegate_facts: true
  when: laya_systemone_finetune_gpu_peer_was_active | default(false) | bool
  ignore_unreachable: true
  register: laya_systemone_finetune_gpu_peer_setup
  no_log: true

- name: Start the GPU peer serving unit after fine-tuning
  ansible.builtin.systemd:
    name: "{{ laya_systemone_finetune_gpu_peer_unit }}"
    state: started
  delegate_to: "{{ laya_systemone_finetune_gpu_peer_host }}"
  when: laya_systemone_finetune_gpu_peer_was_active | default(false) | bool
  register: laya_systemone_finetune_gpu_peer_start
  ignore_errors: true
  ignore_unreachable: true
  no_log: true

- name: Check whether the Laya systemd unit is present for recovery
  ansible.builtin.stat:
    path: "{{ laya_systemone_unit_path }}"
  register: laya_systemone_finetune_unit_stat
  ignore_unreachable: true

- name: Start Laya after GPU fine-tuning
  ansible.builtin.systemd:
    name: laya-systemone.service
    state: started
  when: laya_systemone_finetune_unit_stat.stat.exists | default(false)
  register: laya_systemone_finetune_service_start
  ignore_errors: true
  no_log: true
  ignore_unreachable: true

- name: Wait for Laya health after GPU fine-tuning
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ laya_systemone_port }}/health"
    status_code: 200
  register: laya_systemone_finetune_health
  retries: "{{ laya_systemone_finetune_health_retries }}"
  delay: "{{ laya_systemone_finetune_health_delay_seconds }}"
  until: laya_systemone_finetune_health.status | default(0) == 200
  when: laya_systemone_finetune_unit_stat.stat.exists | default(false)
  ignore_errors: true
  no_log: true
  ignore_unreachable: true

- name: Wait for GPU peer serving health after fine-tuning
  ansible.builtin.uri:
    url: "{{ laya_systemone_finetune_gpu_peer_health_url }}"
    status_code: 200
  delegate_to: "{{ laya_systemone_finetune_gpu_peer_host }}"
  register: laya_systemone_finetune_gpu_peer_health
  retries: "{{ laya_systemone_finetune_health_retries }}"
  delay: "{{ laya_systemone_finetune_health_delay_seconds }}"
  until: laya_systemone_finetune_gpu_peer_health.status | default(0) == 200
  when: laya_systemone_finetune_gpu_peer_was_active | default(false) | bool
  ignore_errors: true
  ignore_unreachable: true
  no_log: true

- name: Stop the completed transient fine-tune unit
  ansible.builtin.systemd:
    name: "{{ laya_systemone_finetune_unit }}"
    state: stopped
  register: laya_systemone_finetune_job_stop
  failed_when: false
  when: laya_systemone_finetune_job_load_state | default('not-found') != 'not-found'
  no_log: true
  ignore_unreachable: true

- name: Reset the completed transient fine-tune unit state
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - "{{ laya_systemone_finetune_unit }}"
  register: laya_systemone_finetune_job_reset
  changed_when: false
  failed_when: false
  when: laya_systemone_finetune_job_load_state | default('not-found') != 'not-found'
  ignore_unreachable: true
