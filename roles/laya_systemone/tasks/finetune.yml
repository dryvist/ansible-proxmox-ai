---
- name: Validate the opt-in fine-tune configuration
  ansible.builtin.assert:
    that:
      - laya_systemone_finetune_name is string
      - laya_systemone_finetune_name | length > 0
      - laya_systemone_finetune_name is match('^[a-z0-9][a-z0-9._-]*$')
      - laya_systemone_finetune_name not in ['auto', 'english', 'multilingual', 'typed-decisions']
      - laya_systemone_finetune_bucket is string
      - laya_systemone_finetune_bucket | length > 0
      - laya_systemone_finetune_train_key is string
      - laya_systemone_finetune_train_key | length > 0
      - laya_systemone_finetune_train_sha256 is match('^[A-Fa-f0-9]{64}$')
      - laya_systemone_finetune_eval_key is string
      - laya_systemone_finetune_eval_key | length > 0
      - laya_systemone_finetune_eval_sha256 is match('^[A-Fa-f0-9]{64}$')
      - laya_systemone_finetune_base is string
      - laya_systemone_finetune_base | length > 0
      - laya_systemone_finetune_root is match('^/')
      - laya_systemone_finetune_root | regex_search("'") is none
      - laya_systemone_finetune_root | regex_search("[\r\n]") is none
    fail_msg: Laya fine-tuning requires a safe model name, object keys, checksums, and root path.
    quiet: true

- name: Create the fine-tune data and model directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ laya_systemone_user }}"
    group: "{{ laya_systemone_group }}"
    mode: "0700"
  loop:
    - "{{ laya_systemone_finetune_root }}"
    - "{{ laya_systemone_finetune_root }}/datasets"
    - "{{ laya_systemone_finetune_root }}/models"
  become: true

- name: Check the current model directory before recovering an interrupted promotion
  ansible.builtin.stat:
    path: "{{ laya_systemone_finetune_model_dir }}"
  register: laya_systemone_finetune_current_before_recovery
  become: true

- name: Check for a previous model left by an interrupted promotion
  ansible.builtin.stat:
    path: "{{ laya_systemone_finetune_model_dir }}.prev"
  register: laya_systemone_finetune_previous_before_recovery
  become: true

- name: Restore the previous model when an interrupted promotion left no current model
  ansible.builtin.command:
    argv:
      - mv
      - -T
      - --
      - "{{ laya_systemone_finetune_model_dir }}.prev"
      - "{{ laya_systemone_finetune_model_dir }}"
  when:
    - laya_systemone_finetune_previous_before_recovery.stat.isdir | default(false)
    - not laya_systemone_finetune_current_before_recovery.stat.exists
  become: true
  changed_when: true
  no_log: true

- name: Remove a stale previous model when the current model is present
  ansible.builtin.file:
    path: "{{ laya_systemone_finetune_model_dir }}.prev"
    state: absent
  when:
    - laya_systemone_finetune_previous_before_recovery.stat.exists
    - laya_systemone_finetune_current_before_recovery.stat.exists
  become: true

- name: Read the installed Laya version for fine-tune reuse
  ansible.builtin.command:
    argv:
      - "{{ laya_systemone_venv }}/bin/python"
      - -c
      - import laya; print(laya.__version__)
  register: laya_systemone_finetune_laya_version
  changed_when: false
  check_mode: false

- name: Read the fine-tune completion manifest
  ansible.builtin.slurp:
    src: "{{ laya_systemone_finetune_model_dir }}/finetune-manifest.json"
  register: laya_systemone_finetune_manifest_before
  failed_when: false
  changed_when: false

- name: Initialize the parsed fine-tune manifest as missing
  ansible.builtin.set_fact:
    laya_systemone_finetune_manifest: {}

- name: Parse the existing fine-tune completion manifest
  when: laya_systemone_finetune_manifest_before.content is defined
  block:
    - name: Decode the existing fine-tune completion manifest
      ansible.builtin.set_fact:
        laya_systemone_finetune_manifest: >-
          {{ laya_systemone_finetune_manifest_before.content | b64decode | from_json }}
  rescue:
    - name: Treat an invalid fine-tune completion manifest as missing
      ansible.builtin.set_fact:
        laya_systemone_finetune_manifest: {}

- name: Check whether the Laya systemd unit is present
  ansible.builtin.stat:
    path: "{{ laya_systemone_unit_path }}"
  register: laya_systemone_finetune_unit_stat

- name: Download and train the fine-tuned checkpoint when its manifest is stale
  when:
    - not ansible_check_mode
    - >-
      (laya_systemone_finetune_manifest.name | default('') != laya_systemone_finetune_name)
      or (laya_systemone_finetune_manifest.train_sha256 | default('')
      != laya_systemone_finetune_train_sha256 | lower)
      or (laya_systemone_finetune_manifest.eval_sha256 | default('')
      != laya_systemone_finetune_eval_sha256 | lower)
      or (laya_systemone_finetune_manifest.epochs | default(none)
      != laya_systemone_finetune_epochs | int)
      or (laya_systemone_finetune_manifest.text_column | default('')
      != laya_systemone_finetune_text_column)
      or (laya_systemone_finetune_manifest.label_column | default('')
      != laya_systemone_finetune_label_column)
      or (laya_systemone_finetune_manifest.target_error | default(none)
      != laya_systemone_finetune_target_error | float)
      or (laya_systemone_finetune_manifest.seed | default(none)
      != laya_systemone_finetune_seed | int)
      or (laya_systemone_finetune_manifest.base | default('')
      != laya_systemone_finetune_base)
      or (laya_systemone_finetune_manifest.laya_version | default('')
      != laya_systemone_finetune_laya_version.stdout | trim)
  block:
    - name: Require the shared OpenBao AppRole configuration
      ansible.builtin.fail:
        msg: BAO_ADDR and the shared CONVERGE_ROLE_ID / CONVERGE_SECRET_ID identity must be configured.
      when: >-
        laya_systemone_finetune_bao_addr | length == 0
        or laya_systemone_finetune_bao_role_id | length == 0
        or laya_systemone_finetune_bao_secret_id | length == 0
      no_log: true

    - name: Install the AWS CLI used for RustFS object reads
      ansible.builtin.apt:
        name: awscli
        state: present
        update_cache: true

    - name: Read the scoped RustFS credential from OpenBao
      no_log: true
      block:
        - name: Log in with the shared converge AppRole
          community.hashi_vault.vault_login:
            url: "{{ laya_systemone_finetune_bao_addr }}"
            auth_method: approle
            role_id: "{{ laya_systemone_finetune_bao_role_id }}"
            secret_id: "{{ laya_systemone_finetune_bao_secret_id }}"
            validate_certs: "{{ laya_systemone_finetune_bao_validate_certs }}"
          register: laya_systemone_finetune_bao_login
          delegate_to: localhost
          become: false
          vars:
            ansible_become: false
          check_mode: false
          no_log: true

        - name: Read the scoped RustFS credential
          community.hashi_vault.vault_kv2_get:
            url: "{{ laya_systemone_finetune_bao_addr }}"
            auth_method: token
            token: "{{ laya_systemone_finetune_bao_login.login.auth.client_token }}"
            engine_mount_point: "{{ laya_systemone_finetune_bao_kv_mount }}"
            path: "{{ laya_systemone_finetune_bao_kv_path }}"
            validate_certs: "{{ laya_systemone_finetune_bao_validate_certs }}"
          register: laya_systemone_finetune_bao_secret
          delegate_to: localhost
          become: false
          vars:
            ansible_become: false
          check_mode: false
          no_log: true

        - name: Map the scoped RustFS credential fields
          ansible.builtin.set_fact:
            laya_systemone_finetune_s3_access_key_id: >-
              {{ laya_systemone_finetune_bao_secret.secret.AWS_ACCESS_KEY_ID | default('', true) }}
            laya_systemone_finetune_s3_secret_access_key: >-
              {{ laya_systemone_finetune_bao_secret.secret.AWS_SECRET_ACCESS_KEY | default('', true) }}
            laya_systemone_finetune_s3_region: >-
              {{ laya_systemone_finetune_bao_secret.secret.AWS_REGION | default('', true) }}
            laya_systemone_finetune_s3_endpoint: >-
              {{ laya_systemone_finetune_bao_secret.secret.AWS_ENDPOINT_URL | default('', true) }}
          no_log: true
      always:
        - name: Revoke the OpenBao token used to read the RustFS credential
          community.hashi_vault.vault_write:
            url: "{{ laya_systemone_finetune_bao_addr }}"
            auth_method: token
            token: "{{ laya_systemone_finetune_bao_login.login.auth.client_token }}"
            path: auth/token/revoke-self
            data: {}
            validate_certs: "{{ laya_systemone_finetune_bao_validate_certs }}"
          delegate_to: localhost
          become: false
          vars:
            ansible_become: false
          when:
            - laya_systemone_finetune_bao_login is defined
            - laya_systemone_finetune_bao_login.login is defined
          check_mode: false
          register: laya_systemone_finetune_bao_revoke
          ignore_errors: true
          no_log: true

    - name: Warn when the temporary OpenBao token was not revoked
      ansible.builtin.debug:
        msg: The temporary OpenBao token was not revoked and remains valid until its TTL expires.
      when: laya_systemone_finetune_bao_revoke is failed

    - name: Require all scoped RustFS credential fields
      ansible.builtin.assert:
        that:
          - laya_systemone_finetune_s3_access_key_id | length > 0
          - laya_systemone_finetune_s3_secret_access_key | length > 0
          - laya_systemone_finetune_s3_region | length > 0
          - laya_systemone_finetune_s3_endpoint | length > 0
        fail_msg: The scoped RustFS credential is missing a required S3 field.
        quiet: true
      no_log: true

    - name: Check the existing training CSV checksum before download
      ansible.builtin.stat:
        path: "{{ laya_systemone_finetune_train_path }}"
        checksum_algorithm: sha256
      register: laya_systemone_finetune_train_existing_stat
      become: true

    - name: Download the training CSV when missing or corrupt
      ansible.builtin.command:
        argv:
          - aws
          - --endpoint-url
          - "{{ laya_systemone_finetune_s3_endpoint }}"
          - s3
          - cp
          - "s3://{{ laya_systemone_finetune_bucket }}/{{ laya_systemone_finetune_train_key }}"
          - "{{ laya_systemone_finetune_train_path }}.download"
      when: >-
        not laya_systemone_finetune_train_existing_stat.stat.exists
        or laya_systemone_finetune_train_existing_stat.stat.checksum | default('')
        != laya_systemone_finetune_train_sha256 | lower
      environment:
        AWS_ACCESS_KEY_ID: "{{ laya_systemone_finetune_s3_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ laya_systemone_finetune_s3_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ laya_systemone_finetune_s3_region }}"
      become: true
      become_user: "{{ laya_systemone_user }}"
      changed_when: true
      no_log: true

    - name: Check the downloaded training CSV checksum
      ansible.builtin.stat:
        path: "{{ laya_systemone_finetune_train_path }}.download"
        checksum_algorithm: sha256
      register: laya_systemone_finetune_train_download_stat
      when: >-
        not laya_systemone_finetune_train_existing_stat.stat.exists
        or laya_systemone_finetune_train_existing_stat.stat.checksum | default('')
        != laya_systemone_finetune_train_sha256 | lower
      become: true

    - name: Verify the downloaded training CSV checksum
      ansible.builtin.assert:
        that:
          - laya_systemone_finetune_train_download_stat.stat.exists
          - laya_systemone_finetune_train_download_stat.stat.checksum == laya_systemone_finetune_train_sha256 | lower
        fail_msg: The downloaded training CSV does not match its configured SHA-256 checksum.
        quiet: true
      when: laya_systemone_finetune_train_download_stat is not skipped
      no_log: true

    - name: Move the verified training CSV into place
      ansible.builtin.command:
        argv:
          - mv
          - -fT
          - --
          - "{{ laya_systemone_finetune_train_path }}.download"
          - "{{ laya_systemone_finetune_train_path }}"
      when: laya_systemone_finetune_train_download_stat is not skipped
      become: true
      changed_when: true
      no_log: true

    - name: Check the existing validation CSV checksum before download
      ansible.builtin.stat:
        path: "{{ laya_systemone_finetune_eval_path }}"
        checksum_algorithm: sha256
      register: laya_systemone_finetune_eval_existing_stat
      become: true

    - name: Download the validation CSV when missing or corrupt
      ansible.builtin.command:
        argv:
          - aws
          - --endpoint-url
          - "{{ laya_systemone_finetune_s3_endpoint }}"
          - s3
          - cp
          - "s3://{{ laya_systemone_finetune_bucket }}/{{ laya_systemone_finetune_eval_key }}"
          - "{{ laya_systemone_finetune_eval_path }}.download"
      when: >-
        not laya_systemone_finetune_eval_existing_stat.stat.exists
        or laya_systemone_finetune_eval_existing_stat.stat.checksum | default('')
        != laya_systemone_finetune_eval_sha256 | lower
      environment:
        AWS_ACCESS_KEY_ID: "{{ laya_systemone_finetune_s3_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ laya_systemone_finetune_s3_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ laya_systemone_finetune_s3_region }}"
      become: true
      become_user: "{{ laya_systemone_user }}"
      changed_when: true
      no_log: true

    - name: Check the downloaded validation CSV checksum
      ansible.builtin.stat:
        path: "{{ laya_systemone_finetune_eval_path }}.download"
        checksum_algorithm: sha256
      register: laya_systemone_finetune_eval_download_stat
      when: >-
        not laya_systemone_finetune_eval_existing_stat.stat.exists
        or laya_systemone_finetune_eval_existing_stat.stat.checksum | default('')
        != laya_systemone_finetune_eval_sha256 | lower
      become: true

    - name: Verify the downloaded validation CSV checksum
      ansible.builtin.assert:
        that:
          - laya_systemone_finetune_eval_download_stat.stat.exists
          - laya_systemone_finetune_eval_download_stat.stat.checksum == laya_systemone_finetune_eval_sha256 | lower
        fail_msg: The downloaded validation CSV does not match its configured SHA-256 checksum.
        quiet: true
      when: laya_systemone_finetune_eval_download_stat is not skipped
      no_log: true

    - name: Move the verified validation CSV into place
      ansible.builtin.command:
        argv:
          - mv
          - -fT
          - --
          - "{{ laya_systemone_finetune_eval_path }}.download"
          - "{{ laya_systemone_finetune_eval_path }}"
      when: laya_systemone_finetune_eval_download_stat is not skipped
      become: true
      changed_when: true
      no_log: true

    - name: Set private ownership and permissions on the CSV files
      ansible.builtin.file:
        path: "{{ item }}"
        state: file
        owner: "{{ laya_systemone_user }}"
        group: "{{ laya_systemone_group }}"
        mode: "0600"
      loop:
        - "{{ laya_systemone_finetune_train_path }}"
        - "{{ laya_systemone_finetune_eval_path }}"
      become: true

    - name: Read the training CSV checksum
      ansible.builtin.stat:
        path: "{{ laya_systemone_finetune_train_path }}"
        checksum_algorithm: sha256
      register: laya_systemone_finetune_train_stat

    - name: Verify the training CSV checksum
      ansible.builtin.assert:
        that:
          - laya_systemone_finetune_train_stat.stat.exists
          - laya_systemone_finetune_train_stat.stat.checksum == laya_systemone_finetune_train_sha256 | lower
        fail_msg: The training CSV does not match its configured SHA-256 checksum.
        quiet: true
      no_log: true

    - name: Read the validation CSV checksum
      ansible.builtin.stat:
        path: "{{ laya_systemone_finetune_eval_path }}"
        checksum_algorithm: sha256
      register: laya_systemone_finetune_eval_stat

    - name: Verify the validation CSV checksum
      ansible.builtin.assert:
        that:
          - laya_systemone_finetune_eval_stat.stat.exists
          - laya_systemone_finetune_eval_stat.stat.checksum == laya_systemone_finetune_eval_sha256 | lower
        fail_msg: The validation CSV does not match its configured SHA-256 checksum.
        quiet: true
      no_log: true

    - name: Remove any stale fine-tune staging directory
      ansible.builtin.file:
        path: "{{ laya_systemone_finetune_staging_dir }}"
        state: absent
      become: true

    - name: Create the private fine-tune staging directory
      ansible.builtin.file:
        path: "{{ laya_systemone_finetune_staging_dir }}"
        state: directory
        owner: "{{ laya_systemone_user }}"
        group: "{{ laya_systemone_group }}"
        mode: "0700"
      become: true

    - name: Stop Laya to free the guest GPU for fine-tuning
      ansible.builtin.systemd:
        name: laya-systemone.service
        state: stopped
      when: laya_systemone_finetune_unit_stat.stat.exists
      no_log: true

    - name: Train the Laya model from the verified CSV files
      ansible.builtin.command:
        argv:
          - "{{ laya_systemone_venv }}/bin/laya-train"
          - --data
          - "{{ laya_systemone_finetune_train_path }}"
          - --base
          - "{{ laya_systemone_finetune_base }}"
          - --eval-data
          - "{{ laya_systemone_finetune_eval_path }}"
          - --out
          - "{{ laya_systemone_finetune_staging_dir }}"
          - --text-column
          - "{{ laya_systemone_finetune_text_column }}"
          - --label-column
          - "{{ laya_systemone_finetune_label_column }}"
          - --epochs
          - "{{ laya_systemone_finetune_epochs | string }}"
          - --target-error
          - "{{ laya_systemone_finetune_target_error | string }}"
          - --seed
          - "{{ laya_systemone_finetune_seed | string }}"
          - --device
          - cuda
      become: true
      become_user: "{{ laya_systemone_user }}"
      changed_when: true
      no_log: true

    - name: Check the staged model.safetensors file
      ansible.builtin.stat:
        path: "{{ laya_systemone_finetune_staging_dir }}/model.safetensors"
      register: laya_systemone_finetune_staging_model_stat

    - name: Check the staged rl_agent_config.json file
      ansible.builtin.stat:
        path: "{{ laya_systemone_finetune_staging_dir }}/rl_agent_config.json"
      register: laya_systemone_finetune_staging_config_stat

    - name: Validate staged checkpoint files before promotion
      ansible.builtin.assert:
        that:
          - laya_systemone_finetune_staging_model_stat.stat.exists
          - laya_systemone_finetune_staging_model_stat.stat.isreg
          - laya_systemone_finetune_staging_model_stat.stat.size | int > 0
          - laya_systemone_finetune_staging_config_stat.stat.exists
          - laya_systemone_finetune_staging_config_stat.stat.isreg
        fail_msg: Laya fine-tuning did not produce a complete checkpoint.
        quiet: true

    - name: Write the fine-tune completion manifest into staging
      ansible.builtin.copy:
        content: >-
          {{ {'name': laya_systemone_finetune_name,
              'train_sha256': laya_systemone_finetune_train_sha256 | lower,
              'eval_sha256': laya_systemone_finetune_eval_sha256 | lower,
              'epochs': laya_systemone_finetune_epochs | int,
              'text_column': laya_systemone_finetune_text_column,
              'label_column': laya_systemone_finetune_label_column,
              'target_error': laya_systemone_finetune_target_error | float,
              'seed': laya_systemone_finetune_seed | int,
              'base': laya_systemone_finetune_base,
              'laya_version': laya_systemone_finetune_laya_version.stdout | trim} | to_json }}
        dest: "{{ laya_systemone_finetune_staging_dir }}/finetune-manifest.json"
        owner: "{{ laya_systemone_user }}"
        group: "{{ laya_systemone_group }}"
        mode: "0600"
      become: true

    - name: Promote the validated fine-tuned model atomically
      block:
        - name: Check the current model directory before promotion
          ansible.builtin.stat:
            path: "{{ laya_systemone_finetune_model_dir }}"
          register: laya_systemone_finetune_current_before_promotion
          become: true

        - name: Rename the current model directory to .prev
          ansible.builtin.command:
            argv:
              - mv
              - -T
              - --
              - "{{ laya_systemone_finetune_model_dir }}"
              - "{{ laya_systemone_finetune_model_dir }}.prev"
          when: laya_systemone_finetune_current_before_promotion.stat.exists
          become: true
          changed_when: true
          no_log: true

        - name: Move the validated staging directory into place
          ansible.builtin.command:
            argv:
              - mv
              - -T
              - --
              - "{{ laya_systemone_finetune_staging_dir }}"
              - "{{ laya_systemone_finetune_model_dir }}"
          become: true
          changed_when: true
          no_log: true
      rescue:
        - name: Check model paths after a failed promotion
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "{{ laya_systemone_finetune_model_dir }}"
            - "{{ laya_systemone_finetune_model_dir }}.prev"
          register: laya_systemone_finetune_paths_after_failed_promotion
          become: true

        - name: Restore the previous model after a failed promotion
          ansible.builtin.command:
            argv:
              - mv
              - -T
              - --
              - "{{ laya_systemone_finetune_model_dir }}.prev"
              - "{{ laya_systemone_finetune_model_dir }}"
          when:
            - laya_systemone_finetune_paths_after_failed_promotion.results[1].stat.isdir | default(false)
            - not laya_systemone_finetune_paths_after_failed_promotion.results[0].stat.exists
          become: true
          register: laya_systemone_finetune_restore_previous
          changed_when: laya_systemone_finetune_restore_previous.rc == 0
          failed_when: false
          no_log: true

        - name: Fail the promotion with a sanitized message
          ansible.builtin.fail:
            msg: Laya fine-tuning failed; service start was attempted where a unit was present.

    - name: Remove the previous model after successful promotion
      ansible.builtin.file:
        path: "{{ laya_systemone_finetune_model_dir }}.prev"
        state: absent
      become: true
  rescue:
    - name: Record the fine-tuning failure for sanitized reporting
      ansible.builtin.set_fact:
        laya_systemone_finetune_failed: true
  always:
    - name: Start Laya after GPU fine-tuning
      ansible.builtin.systemd:
        name: laya-systemone.service
        state: started
      when: laya_systemone_finetune_unit_stat.stat.exists | default(false)
      register: laya_systemone_finetune_service_start
      ignore_errors: true
      no_log: true

- name: Report the fine-tuning failure without exposing dataset output
  ansible.builtin.fail:
    msg: Laya fine-tuning failed; service start was attempted where a unit was present.
  when: >-
    laya_systemone_finetune_failed | default(false)
    or (laya_systemone_finetune_service_start is defined
        and laya_systemone_finetune_service_start is failed)

- name: Check whether the fine-tuned model directory exists
  ansible.builtin.stat:
    path: "{{ laya_systemone_finetune_model_dir }}"
  register: laya_systemone_finetune_model_dir_stat
