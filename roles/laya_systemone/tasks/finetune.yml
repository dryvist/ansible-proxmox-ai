---
- name: Validate the opt-in fine-tune configuration
  ansible.builtin.assert:
    that:
      - laya_systemone_finetune_name is string
      - laya_systemone_finetune_name | length > 0
      - laya_systemone_finetune_name is match('^[a-z0-9][a-z0-9._-]*$')
      - laya_systemone_finetune_name not in ['auto', 'english', 'multilingual', 'typed-decisions']
      - laya_systemone_finetune_bucket is string
      - laya_systemone_finetune_bucket | length > 0
      - laya_systemone_finetune_train_key is string
      - laya_systemone_finetune_train_key | length > 0
      - laya_systemone_finetune_train_sha256 is match('^[A-Fa-f0-9]{64}$')
      - laya_systemone_finetune_eval_key is string
      - laya_systemone_finetune_eval_key | length > 0
      - laya_systemone_finetune_eval_sha256 is match('^[A-Fa-f0-9]{64}$')
      - laya_systemone_finetune_root is match('^/')
      - laya_systemone_finetune_root | regex_search("'") is none
      - laya_systemone_finetune_root | regex_search("[\r\n]") is none
    fail_msg: Laya fine-tuning requires a safe model name, object keys, checksums, and root path.
    quiet: true

- name: Create the fine-tune data and model directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ laya_systemone_user }}"
    group: "{{ laya_systemone_group }}"
    mode: "0700"
  loop:
    - "{{ laya_systemone_finetune_root }}"
    - "{{ laya_systemone_finetune_root }}/datasets"
    - "{{ laya_systemone_finetune_root }}/models"
  become: true

- name: Check whether the fine-tuned checkpoint already exists
  ansible.builtin.stat:
    path: "{{ laya_systemone_finetune_model_dir }}/model.safetensors"
  register: laya_systemone_finetune_checkpoint_before

- name: Download and train the fine-tuned checkpoint when it is missing
  when:
    - not ansible_check_mode
    - not laya_systemone_finetune_checkpoint_before.stat.exists
  block:
    - name: Require the shared OpenBao AppRole configuration
      ansible.builtin.fail:
        msg: BAO_ADDR and the shared CONVERGE_ROLE_ID / CONVERGE_SECRET_ID identity must be configured.
      when: >-
        laya_systemone_finetune_bao_addr | length == 0
        or laya_systemone_finetune_bao_role_id | length == 0
        or laya_systemone_finetune_bao_secret_id | length == 0

    - name: Install the AWS CLI used for RustFS object reads
      ansible.builtin.apt:
        name: awscli
        state: present
        update_cache: true

    - name: Read the scoped RustFS credential from OpenBao
      no_log: true
      block:
        - name: Log in with the shared converge AppRole
          community.hashi_vault.vault_login:
            url: "{{ laya_systemone_finetune_bao_addr }}"
            auth_method: approle
            role_id: "{{ laya_systemone_finetune_bao_role_id }}"
            secret_id: "{{ laya_systemone_finetune_bao_secret_id }}"
            validate_certs: "{{ laya_systemone_finetune_bao_validate_certs }}"
          register: laya_systemone_finetune_bao_login
          delegate_to: localhost
          become: false
          vars:
            ansible_become: false
          check_mode: false

        - name: Read the scoped RustFS credential
          community.hashi_vault.vault_kv2_get:
            url: "{{ laya_systemone_finetune_bao_addr }}"
            auth_method: token
            token: "{{ laya_systemone_finetune_bao_login.login.auth.client_token }}"
            engine_mount_point: "{{ laya_systemone_finetune_bao_kv_mount }}"
            path: "{{ laya_systemone_finetune_bao_kv_path }}"
            validate_certs: "{{ laya_systemone_finetune_bao_validate_certs }}"
          register: laya_systemone_finetune_bao_secret
          delegate_to: localhost
          become: false
          vars:
            ansible_become: false
          check_mode: false

        - name: Map the scoped RustFS credential fields
          ansible.builtin.set_fact:
            laya_systemone_finetune_s3_access_key_id: >-
              {{ laya_systemone_finetune_bao_secret.secret.AWS_ACCESS_KEY_ID | default('', true) }}
            laya_systemone_finetune_s3_secret_access_key: >-
              {{ laya_systemone_finetune_bao_secret.secret.AWS_SECRET_ACCESS_KEY | default('', true) }}
            laya_systemone_finetune_s3_region: >-
              {{ laya_systemone_finetune_bao_secret.secret.AWS_REGION | default('', true) }}
            laya_systemone_finetune_s3_endpoint: >-
              {{ laya_systemone_finetune_bao_secret.secret.AWS_ENDPOINT_URL | default('', true) }}
      always:
        - name: Revoke the OpenBao token used to read the RustFS credential
          community.hashi_vault.vault_write:
            url: "{{ laya_systemone_finetune_bao_addr }}"
            auth_method: token
            token: "{{ laya_systemone_finetune_bao_login.login.auth.client_token }}"
            path: auth/token/revoke-self
            data: {}
            validate_certs: "{{ laya_systemone_finetune_bao_validate_certs }}"
          delegate_to: localhost
          become: false
          vars:
            ansible_become: false
          when:
            - laya_systemone_finetune_bao_login is defined
            - laya_systemone_finetune_bao_login.login is defined
          check_mode: false
          register: laya_systemone_finetune_bao_revoke
          ignore_errors: true
          no_log: true

    - name: Warn when the temporary OpenBao token was not revoked
      ansible.builtin.debug:
        msg: The temporary OpenBao token was not revoked and remains valid until its TTL expires.
      when: laya_systemone_finetune_bao_revoke is failed

    - name: Require all scoped RustFS credential fields
      ansible.builtin.assert:
        that:
          - laya_systemone_finetune_s3_access_key_id | length > 0
          - laya_systemone_finetune_s3_secret_access_key | length > 0
          - laya_systemone_finetune_s3_region | length > 0
          - laya_systemone_finetune_s3_endpoint | length > 0
        fail_msg: The scoped RustFS credential is missing a required S3 field.
        quiet: true
      no_log: true

    - name: Download the labeled training and validation CSV files
      ansible.builtin.command:
        argv:
          - aws
          - --endpoint-url
          - "{{ laya_systemone_finetune_s3_endpoint }}"
          - s3
          - cp
          - "s3://{{ laya_systemone_finetune_bucket }}/{{ item.key }}"
          - "{{ item.path }}"
        creates: "{{ item.path }}"
      loop:
        - key: "{{ laya_systemone_finetune_train_key }}"
          path: "{{ laya_systemone_finetune_train_path }}"
        - key: "{{ laya_systemone_finetune_eval_key }}"
          path: "{{ laya_systemone_finetune_eval_path }}"
      environment:
        AWS_ACCESS_KEY_ID: "{{ laya_systemone_finetune_s3_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ laya_systemone_finetune_s3_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ laya_systemone_finetune_s3_region }}"
      become: true
      become_user: "{{ laya_systemone_user }}"
      no_log: true

    - name: Set private ownership and permissions on the CSV files
      ansible.builtin.file:
        path: "{{ item }}"
        state: file
        owner: "{{ laya_systemone_user }}"
        group: "{{ laya_systemone_group }}"
        mode: "0600"
      loop:
        - "{{ laya_systemone_finetune_train_path }}"
        - "{{ laya_systemone_finetune_eval_path }}"
      become: true

    - name: Read the training CSV checksum
      ansible.builtin.stat:
        path: "{{ laya_systemone_finetune_train_path }}"
        checksum_algorithm: sha256
      register: laya_systemone_finetune_train_stat

    - name: Verify the training CSV checksum
      ansible.builtin.assert:
        that:
          - laya_systemone_finetune_train_stat.stat.exists
          - laya_systemone_finetune_train_stat.stat.checksum == laya_systemone_finetune_train_sha256 | lower
        fail_msg: The training CSV does not match its configured SHA-256 checksum.
        quiet: true
      no_log: true

    - name: Read the validation CSV checksum
      ansible.builtin.stat:
        path: "{{ laya_systemone_finetune_eval_path }}"
        checksum_algorithm: sha256
      register: laya_systemone_finetune_eval_stat

    - name: Verify the validation CSV checksum
      ansible.builtin.assert:
        that:
          - laya_systemone_finetune_eval_stat.stat.exists
          - laya_systemone_finetune_eval_stat.stat.checksum == laya_systemone_finetune_eval_sha256 | lower
        fail_msg: The validation CSV does not match its configured SHA-256 checksum.
        quiet: true
      no_log: true

    - name: Check whether the Laya systemd unit is present
      ansible.builtin.stat:
        path: "{{ laya_systemone_unit_path }}"
      register: laya_systemone_finetune_unit_stat

    - name: Fine-tune the Laya checkpoint on the guest GPU
      block:
        - name: Stop Laya to free the guest GPU for fine-tuning
          ansible.builtin.systemd:
            name: laya-systemone.service
            state: stopped
          when: laya_systemone_finetune_unit_stat.stat.exists
          no_log: true

        - name: Train the Laya model from the verified CSV files
          ansible.builtin.command:
            argv:
              - "{{ laya_systemone_venv }}/bin/laya-train"
              - --data
              - "{{ laya_systemone_finetune_train_path }}"
              - --eval-data
              - "{{ laya_systemone_finetune_eval_path }}"
              - --out
              - "{{ laya_systemone_finetune_model_dir }}"
              - --text-column
              - "{{ laya_systemone_finetune_text_column }}"
              - --label-column
              - "{{ laya_systemone_finetune_label_column }}"
              - --epochs
              - "{{ laya_systemone_finetune_epochs | string }}"
              - --target-error
              - "{{ laya_systemone_finetune_target_error | string }}"
              - --seed
              - "{{ laya_systemone_finetune_seed | string }}"
              - --device
              - cuda
            creates: "{{ laya_systemone_finetune_model_dir }}/model.safetensors"
          become: true
          become_user: "{{ laya_systemone_user }}"
          no_log: true
      rescue:
        - name: Restore Laya after a fine-tuning failure
          ansible.builtin.systemd:
            name: laya-systemone.service
            state: started
          when: laya_systemone_finetune_unit_stat.stat.exists
          no_log: true

        - name: Report the fine-tuning failure without exposing dataset output
          ansible.builtin.fail:
            msg: Laya fine-tuning failed; the previous service was restored where a unit was present.

- name: Start Laya after GPU fine-tuning
  ansible.builtin.systemd:
    name: laya-systemone.service
    state: started
  when:
    - not ansible_check_mode
    - laya_systemone_finetune_unit_stat is defined
    - laya_systemone_finetune_unit_stat.stat.exists
    - not laya_systemone_finetune_checkpoint_before.stat.exists
  no_log: true

- name: Check whether the fine-tuned model directory exists
  ansible.builtin.stat:
    path: "{{ laya_systemone_finetune_model_dir }}"
  register: laya_systemone_finetune_model_dir_stat
