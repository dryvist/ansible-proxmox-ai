---
- name: Read the Laya fine-tune systemd unit state
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState,ActiveState,SubState,Result,ExecMainStatus
      - "{{ laya_systemone_finetune_unit }}"
  register: laya_systemone_finetune_job_state_result
  changed_when: false
  # Capture errors so dispatch and collect can fail closed after peer recovery.
  failed_when: false
  ignore_unreachable: true

- name: Parse the Laya fine-tune systemd unit state
  ansible.builtin.set_fact:
    laya_systemone_finetune_job_load_state: >-
      {{ ((laya_systemone_finetune_job_state_result.stdout_lines | default([]))
          | select('match', '^LoadState=') | list | first | default('LoadState=unknown'))
         | regex_replace('^LoadState=', '') }}
    laya_systemone_finetune_job_active_state: >-
      {{ ((laya_systemone_finetune_job_state_result.stdout_lines | default([]))
          | select('match', '^ActiveState=') | list | first | default('ActiveState=unknown'))
         | regex_replace('^ActiveState=', '') }}
    laya_systemone_finetune_job_sub_state: >-
      {{ ((laya_systemone_finetune_job_state_result.stdout_lines | default([]))
          | select('match', '^SubState=') | list | first | default('SubState=unknown'))
         | regex_replace('^SubState=', '') }}
    laya_systemone_finetune_job_result: >-
      {{ ((laya_systemone_finetune_job_state_result.stdout_lines | default([]))
          | select('match', '^Result=') | list | first | default('Result=unknown'))
         | regex_replace('^Result=', '') }}
    laya_systemone_finetune_job_exit_status: >-
      {{ ((laya_systemone_finetune_job_state_result.stdout_lines | default([]))
          | select('match', '^ExecMainStatus=') | list | first | default('ExecMainStatus=unknown'))
         | regex_replace('^ExecMainStatus=', '') }}

- name: Validate the Laya fine-tune systemd unit state
  ansible.builtin.set_fact:
    laya_systemone_finetune_job_state_valid: >-
      {{ laya_systemone_finetune_job_state_result.rc | default(1) == 0
         and laya_systemone_finetune_job_load_state != 'unknown'
         and laya_systemone_finetune_job_active_state != 'unknown' }}
    laya_systemone_finetune_job_running: >-
      {{ laya_systemone_finetune_job_state_result.rc | default(1) == 0
         and laya_systemone_finetune_job_load_state != 'unknown'
         and laya_systemone_finetune_job_active_state
         in ['active', 'activating', 'deactivating', 'reloading']
         and laya_systemone_finetune_job_sub_state != 'exited' }}
