---
laya_systemone_heldout_key: ""
laya_systemone_heldout_sha256: ""
laya_systemone_heldout_models: >-
  {{ ([laya_systemone_finetune_name] if laya_systemone_finetune_enabled | bool else []) + ['english'] }}
laya_systemone_heldout_path: >-
  {{ laya_systemone_finetune_dataset_dir }}/{{ laya_systemone_heldout_sha256 }}.csv
laya_systemone_heldout_results_dir: "{{ laya_systemone_finetune_root }}/heldout-results"
laya_systemone_heldout_results_prefix: eval/heldout
laya_systemone_heldout_results_bao_kv_path: rustfs/system1/rw
laya_systemone_heldout_batch_size: 16
laya_systemone_heldout_request_timeout_seconds: 60
# The phase budgets total 530 seconds, including scoring's final async poll.
laya_systemone_heldout_total_budget_seconds: 530
laya_systemone_heldout_health_budget_seconds: 20
laya_systemone_heldout_setup_budget_seconds: 90
laya_systemone_heldout_run_budget_seconds: 365
laya_systemone_heldout_upload_budget_seconds: 35
laya_systemone_heldout_orchestration_budget_seconds: 15
laya_systemone_heldout_module_timeout_seconds: 2
laya_systemone_heldout_command_timeout_seconds: 5
laya_systemone_heldout_network_timeout_seconds: 15
laya_systemone_heldout_rustfs_request_timeout_seconds: 5
laya_systemone_heldout_awscli_install_timeout_seconds: 15
laya_systemone_heldout_run_timeout_seconds: 360
laya_systemone_heldout_run_poll_seconds: 5
laya_systemone_heldout_health_retries: 2
laya_systemone_heldout_health_delay_seconds: 1
laya_systemone_heldout_health_timeout_seconds: 5
laya_systemone_heldout_script_path: "{{ laya_systemone_finetune_root }}/bin/heldout_eval.py"
laya_systemone_heldout_error_path: "{{ laya_systemone_heldout_result_path }}.error"
