---
laya_systemone_user: "{{ nvidia_gpu_guest_user }}"
laya_systemone_group: "{{ nvidia_gpu_guest_group }}"
laya_systemone_install_dir: "{{ nvidia_gpu_guest_install_dir }}/laya-systemone"
laya_systemone_venv: "{{ laya_systemone_install_dir }}/venv"
laya_systemone_python: "{{ nvidia_gpu_guest_python }}"
laya_systemone_systemd_dir: "{{ nvidia_gpu_guest_systemd_dir }}"
laya_systemone_unit_path: "{{ laya_systemone_systemd_dir }}/laya-systemone.service"
laya_systemone_env_dir: /etc/laya-systemone
laya_systemone_env_file: "{{ laya_systemone_env_dir }}/laya.env"
laya_systemone_listen_host: 0.0.0.0
laya_systemone_port: 8000
laya_systemone_revision: 55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851
# Commit pinned by laya 0.4.6's reviewed table; update together with laya_systemone_version.
laya_systemone_max_loaded: 1
laya_systemone_max_token_budget: 512
laya_systemone_health_retries: "{{ nvidia_gpu_guest_health_retries }}"
laya_systemone_health_delay: "{{ nvidia_gpu_guest_health_delay }}"
laya_systemone_api_key: "{{ lookup('ansible.builtin.env', 'LLM_LAYA_API_KEY') }}"

# renovate: datasource=pypi depName=laya
laya_systemone_version: "0.4.9"
