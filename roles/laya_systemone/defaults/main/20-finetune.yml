---
laya_systemone_finetune_enabled: false
laya_systemone_finetune_name: ""
laya_systemone_finetune_bucket: system1
laya_systemone_finetune_bao_kv_path: rustfs/system1/ro
laya_systemone_finetune_train_key: ""
laya_systemone_finetune_train_sha256: ""
# This validation CSV is for laya-train evaluation, not a benchmark held-out set.
laya_systemone_finetune_eval_key: ""
laya_systemone_finetune_eval_sha256: ""
laya_systemone_finetune_text_column: text
laya_systemone_finetune_label_column: label
laya_systemone_finetune_epochs: 4
laya_systemone_finetune_target_error: 0.10
laya_systemone_finetune_seed: 0
laya_systemone_finetune_root: /var/lib/laya-systemone
laya_systemone_finetune_model_dir: "{{ laya_systemone_finetune_root }}/models/{{ laya_systemone_finetune_name }}"
laya_systemone_finetune_dataset_dir: "{{ laya_systemone_finetune_root }}/datasets"
laya_systemone_finetune_train_path: >-
  {{ laya_systemone_finetune_dataset_dir }}/{{ laya_systemone_finetune_train_sha256 }}.csv
laya_systemone_finetune_eval_path: >-
  {{ laya_systemone_finetune_dataset_dir }}/{{ laya_systemone_finetune_eval_sha256 }}.csv

# OpenBao AppRole settings follow the shared converge identity used by RustFS consumers.
laya_systemone_finetune_bao_addr: "{{ lookup('ansible.builtin.env', 'BAO_ADDR') | default('', true) }}"
laya_systemone_finetune_bao_role_id: >-
  {{ lookup('ansible.builtin.env', 'CONVERGE_ROLE_ID')
     | default(lookup('ansible.builtin.env', 'OPENBAO_APPROLE_ANSIBLE_ROLE_ID'), true) }}
laya_systemone_finetune_bao_secret_id: >-
  {{ lookup('ansible.builtin.env', 'CONVERGE_SECRET_ID')
     | default(lookup('ansible.builtin.env', 'OPENBAO_APPROLE_ANSIBLE_SECRET_ID'), true) }}
laya_systemone_finetune_bao_validate_certs: true
laya_systemone_finetune_bao_kv_mount: secret
