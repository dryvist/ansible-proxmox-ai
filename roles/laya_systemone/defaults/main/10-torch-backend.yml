---
# CUDA torch backends, newest first: the ones uv --torch-backend accepts (cu118 and newer) and PyTorch
# publishes wheels for (cu120, cu122, cu123 and cu125 have none, checked 2026-11-10). min_driver is the
# Linux x86_64 driver of each CUDA minor's newest update.
# Source: NVIDIA CUDA Toolkit Release Notes, "CUDA Toolkit and Corresponding Driver Versions":
# https://docs.nvidia.com/cuda/archive/13.2.0/cuda-toolkit-release-notes/ (13.x rows);
# https://docs.nvidia.com/cuda/cuda-toolkit-release-notes/ (12.x rows).
laya_systemone_torch_backends:
  - backend: cu132
    min_driver: "595.45.04"
  - backend: cu130
    min_driver: "580.95.05"
  - backend: cu129
    min_driver: "575.57.08"
  - backend: cu128
    min_driver: "570.124.06"
  - backend: cu126
    min_driver: "560.35.05"
  - backend: cu124
    min_driver: "550.54.15"
  - backend: cu121
    min_driver: "530.30.02"
  - backend: cu118
    min_driver: "520.61.05"

# The newest backend the host driver supports. Empty when none does; the converge then fails
# rather than installing a CPU torch build.
laya_systemone_torch_backend: >-
  {{ laya_systemone_torch_backends
     | selectattr('min_driver', 'version', nvidia_gpu_guest_nvidia_userspace_version, '<=')
     | map(attribute='backend') | list | first | default('', true) }}
