---
# Thin by design. This role installs nothing: the herdr server, the agent CLIs
# and the systemd unit all come from nix-ai's nixosModules.herdr, converged by
# the shared nixos_deploy role. What is left is the handful of values NixOS
# cannot know — per-guest secrets and endpoints — delivered the way every other
# agent guest in this repo gets them: an EnvironmentFile at 0600, never the
# Nix store, which is world-readable.

herdr_server_flake_ref: "github:dryvist/nix-ai/main"
herdr_server_host_attr: herdr

herdr_server_user: herdr
herdr_server_state_dir: /var/lib/herdr
herdr_server_env_file: "{{ herdr_server_state_dir }}/.env"

# Model access for the agent CLIs, through the estate's LiteLLM front door.
# Same shape hermes_agent uses: a name, never an address.
herdr_server_model_base_url: "https://llm.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/v1"
herdr_server_model_api_key: >-
  {{ lookup('env', 'HERDR_MODEL_API_KEY')
     | default(lookup('env', 'LLM_ROUTER_MASTER_KEY'), true) | default('', true) }}

# Agent credentials. Empty-string defaults keep the guest inert rather than
# half-configured: a CLI with no credential simply cannot start a session,
# which is a clearer failure than one that starts and silently cannot call out.
herdr_server_anthropic_api_key: >-
  {{ lookup('env', 'HERDR_ANTHROPIC_API_KEY') | default('', true) }}
herdr_server_openai_api_key: >-
  {{ lookup('env', 'HERDR_OPENAI_API_KEY') | default('', true) }}

# Extra KEY: value pairs written verbatim into the EnvironmentFile.
herdr_server_extra_env: {}

# Gate for environments where the guest is not a real NixOS host: the
# controller-side nixos-rebuild and the systemd management below both assume
# one. Molecule sets this false and exercises the render surface instead, which
# is this repo's stated convention for network- and platform-dependent tasks.
# A tag alone would not do: `include_role` still runs, and a skipped inner task
# is easy to get wrong. An explicit variable is unambiguous.
herdr_server_deploy_enabled: true

# ---------------------------------------------------------------------------
# herdr-hail — the two-way Slack bridge.
#
# It runs HERE, on the runtime guest, not on one of its own. Upstream ships it
# as a herdr PLUGIN: it reads herdr's control socket directly and advertises
# "no tunnel, no relay server" as its advantage over the web dashboard, which
# is only true when it is local to the server it watches. nix-ai's
# services.herdr.hail runs it as a companion unit next to herdr.service; this
# role supplies the half NixOS cannot know.
#
# Identity-prefixed lookups, same convention as hermes_agent's SLACK_<ID>_*:
# herdr needs its OWN Slack app, because two Socket Mode connections sharing a
# bot token get round-robin event delivery and each drops half.
herdr_server_hail_env_file: "{{ herdr_server_state_dir }}/hail.env"

# Empty-string defaults keep the bridge inert until the tokens exist, rather
# than crash-looping a unit against a missing credential.
herdr_server_hail_slack_bot_token: >-
  {{ lookup('env', 'SLACK_HERDR_BOT_TOKEN') | default('', true) }}
herdr_server_hail_slack_app_token: >-
  {{ lookup('env', 'SLACK_HERDR_APP_TOKEN') | default('', true) }}
herdr_server_hail_slack_channel: >-
  {{ lookup('env', 'SLACK_HERDR_CHANNEL') | default('', true) }}

# Who may reply into a pane. An allowlist, not a convenience: a reply is
# executed in a live agent's terminal.
herdr_server_hail_slack_allowed_users: >-
  {{ lookup('env', 'SLACK_HERDR_MEMBER_ID')
     | default(lookup('env', 'SLACK_MEMBER_ID'), true) | default('', true) }}

herdr_server_hail_extra_env: {}

# Where nix-ai's unit pins the control socket. Restated here only so the verify
# probe below can point at it; changing it here changes nothing on the guest.
herdr_server_socket_path: /run/herdr/herdr.sock
