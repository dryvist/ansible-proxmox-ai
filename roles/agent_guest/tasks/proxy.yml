---
- name: Configure guest-wide proxy wiring
  ansible.builtin.import_tasks: proxy_guest.yml
  when: agent_guest_proxy_system_wide | bool

- name: Configure service-scoped proxy wiring
  when: not (agent_guest_proxy_system_wide | bool)
  block:
    - name: Remove the role-managed guest-wide proxy files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ agent_guest_apt_proxy_conf }}"
        - "{{ agent_guest_profile_proxy_script }}"
        - "{{ agent_guest_systemd_proxy_conf }}"
        - "{{ agent_guest_npm_prefix }}/etc/npmrc"
      notify: Re-exec systemd for the proxy environment

    - name: Render the proxy environment for explicit service consumers
      ansible.builtin.template:
        src: proxy/runtime.env.j2
        dest: "{{ agent_guest_proxy_environment_file }}"
        owner: root
        group: root
        mode: "0644"

# The system-wide DefaultEnvironment drop-in requires a re-exec, including
# when removing it during a switch to service-scoped wiring.
- name: Flush handlers so systemd carries the proxy before anything installs
  ansible.builtin.meta: flush_handlers
