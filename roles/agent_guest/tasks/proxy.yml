---
# Egress proxy wiring. Runs BEFORE toolchain.yml: that file's first task is an
# apt update, and on an `ai-proxied` guest nothing reaches a repo, the npm
# registry or GitHub except through squid.
#
# Ansible's own fetchers (apt, get_url, unarchive, npm) read the process
# environment, not these files — main.yml sets agent_guest_proxy_env on the
# toolchain include for that. These four cover everything that runs later:
# apt on its own, the login shell, every systemd unit, and npm.

- name: Configure apt to use the egress proxy
  ansible.builtin.copy:
    content: |
      {{ ansible_managed | comment }}
      Acquire::http::Proxy "{{ agent_guest_proxy_url }}";
      Acquire::https::Proxy "{{ agent_guest_proxy_url }}";
    dest: "{{ agent_guest_apt_proxy_conf }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure the login-shell proxy environment
  ansible.builtin.copy:
    content: |
      {{ ansible_managed | comment }}
      {% for key, value in agent_guest_proxy_env | dictsort %}
      export {{ key }}="{{ value }}"
      {% endfor %}
    dest: "{{ agent_guest_profile_proxy_script }}"
    owner: root
    group: root
    mode: "0644"

# systemd services do not read /etc/environment or /etc/profile.d, so the
# system-wide default environment is its own drop-in. daemon-reload does not
# pick this up — only a re-exec does.
- name: Configure the system-wide systemd proxy environment
  ansible.builtin.copy:
    content: |
      {{ ansible_managed | comment }}
      [Manager]
      DefaultEnvironment={% for key, value in agent_guest_proxy_env | dictsort %}"{{ key }}={{ value }}" {% endfor %}

    dest: "{{ agent_guest_systemd_proxy_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: Re-exec systemd for the proxy environment

# npm reads the prefix-scoped npmrc for globally installed packages, which is
# the prefix toolchain.yml installs the three agent CLIs into.
- name: Configure npm to use the egress proxy
  ansible.builtin.copy:
    content: |
      {{ ansible_managed | comment }}
      proxy={{ agent_guest_proxy_url }}
      https-proxy={{ agent_guest_proxy_url }}
      noproxy={{ agent_guest_no_proxy }}
    dest: "{{ agent_guest_npm_prefix }}/etc/npmrc"
    owner: root
    group: root
    mode: "0644"

- name: Flush handlers so systemd carries the proxy before anything installs
  ansible.builtin.meta: flush_handlers
