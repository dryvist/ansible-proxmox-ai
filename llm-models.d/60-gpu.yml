---
# Shared router profiles reference artifact shards for model bytes/quantization.
# Regular limits follow max_num_seqs; medium-a/sweeps admit 64 and queue in-engine.
# Only llm_active_profile renders. test_gpu_registry.py checks admission limits.
_llm_registry_gpu:
  - client_model_id: gpu-small
    artifact_id: qwen35-9b-nvfp4
    provider: openai
    tier: gpu
    profile: small
    enabled: false
    servable: false
    # max_model_len includes output; advertise the remaining input window.
    context_window: 24576
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 4
    num_retries: 0
    hints:
      speed: quick
      quality: routine
      best_for: [judge, classification, quick-review]
      caveats: [benchmark-provisional]
    stable_aliases: [local-fast]

  - client_model_id: gpu-medium-a
    artifact_id: qwen38-27b-nvfp4
    provider: openai
    tier: gpu
    profile: medium-a
    enabled: false
    servable: false
    # The measured 196,608-token limit includes the output budget.
    context_window: 188416
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 64
    num_retries: 0
    hints:
      speed: moderate
      quality: strong
      best_for: [review, reasoning, deliberate-edit]
    # First alias is the shared primary route; local-medium remains the
    # profile-specific Hermes selector.
    stable_aliases: [qwen3.8-27b, local-medium]

  - client_model_id: gpu-medium-b
    artifact_id: qwen38-27b-ud-q4-k-m
    provider: openai
    tier: gpu
    profile: medium-b
    enabled: false
    servable: false
    # The 32,768-token slot includes the reserved output budget.
    context_window: 24576
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 8
    num_retries: 0
    hints:
      speed: quick
      quality: strong
      best_for: [subagent, coding, tool-use]

  # A catalogued 16 GB llama.cpp candidate; inventory and router selection
