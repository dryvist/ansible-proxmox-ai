---
# Shared router profiles reference artifact shards for model bytes/quantization.
# Regular limits follow max_num_seqs; medium-a/sweeps admit 64 and queue in-engine.
# The active profile and selected co-resident profiles render. test_gpu_registry.py checks admission limits.
_llm_registry_gpu:
  - <<: &gpu_registry_defaults
      provider: hosted_vllm
      tier: gpu
      enabled: false
      servable: false
      num_retries: 0
    client_model_id: gpu-small
    artifact_id: qwen35-9b-q4-k-m
    profile: small
    route_group: small
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    order: 2
    # max_model_len includes output; advertise the remaining input window.
    context_window: 6144
    max_output_tokens: 2048
    max_parallel_requests: 4
    hints:
      speed: quick
      quality: routine
      best_for: [judge, classification, quick-review]
      caveats: [benchmark-provisional]

  - <<: *gpu_registry_defaults
    client_model_id: gpu-small-c4-64k
    artifact_id: qwen35-9b-q4-k-m
    profile: small-c4-64k
    catalog_profile: small-c4-64k
    route_group: small
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    co_resident_only: true
    order: 1
    context_window: 32768
    max_output_tokens: 32768
    max_parallel_requests: 4
