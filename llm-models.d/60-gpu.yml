---
# Candidate shared GPU profiles. Model bytes and quantization live once in
# the artifact shards; these router entries reference artifact ids and keep
# only the client-facing profile contract.
#
# Regular profiles admit at most their serving profile's max_num_seqs.
# medium-a and sweep entries admit up to 64 in-flight requests while engine
# slots queue excess work. tests/llm_router/test_gpu_registry.py pins this
# split. The router renders only the active profile's entry, so its limit
# follows llm_active_profile on the next router converge.
_llm_registry_gpu:
  - client_model_id: gpu-small
    artifact_id: qwen35-9b-nvfp4
    provider: openai
    tier: gpu
    profile: small
    enabled: false
    servable: false
    # The serving profile's 32,768-token max_model_len includes the reserved
    # output budget; advertise the remaining input window to LiteLLM.
    context_window: 24576
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 4
    num_retries: 0
    hints:
      speed: fast
      quality: routine
      best_for: [judge, classification, quick-review]
      caveats: [benchmark-provisional]
    stable_aliases: [local-fast]

  - client_model_id: gpu-medium-a
    artifact_id: qwen38-27b-nvfp4
    provider: openai
    tier: gpu
    profile: medium-a
    enabled: false
    servable: false
    # The measured max_model_len is 196,608 including the advertised output
    # budget; context_window is the effective input window served by vLLM.
    context_window: 188416
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 64
    num_retries: 0
    hints:
      speed: medium
      quality: strong
      best_for: [review, reasoning, deliberate-edit]
    stable_aliases: [local-medium]

  - client_model_id: gpu-medium-b
    artifact_id: qwen38-27b-ud-q4-k-m
    provider: openai
    tier: gpu
    profile: medium-b
    enabled: false
    servable: false
    # The 32,768-token slot includes the reserved output budget.
    context_window: 24576
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 8
    num_retries: 0
    hints:
      speed: fast
      quality: strong
      best_for: [subagent, coding, tool-use]

  # A catalogued 16 GB llama.cpp candidate; inventory and router selection
  # stay unchanged until the guest moves to the shared engine role.
