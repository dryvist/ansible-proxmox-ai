---
# Credential-gated cloud rungs in the Hermes fallback chain.
# One slice of the model registry; see llm-models.d/README.md.
_llm_registry_hermes_cloud:
  # The free rung of the Hermes chain, and a CONCRETE id rather than the
  # server-side preset this used to name. The preset resolved to a single
  # upstream that the provider's data policy excluded, so the rung could not be
  # served at all and no retry or cooldown could clear it. A concrete id is
  # checkable from this repo; a dashboard-side preset is not, which is why the
  # breakage was invisible here. context_window is the EFFECTIVE SERVING window
  # advertised to callers, not the upstream's real (larger) one.
  #
  # NO zero_data_retention OVERRIDE, deliberately: this upstream satisfies the
  # strict default the role renders for every other entry. Verified 2026-09-11
  # by calling it under that exact policy — provider training denied AND zero
  # retention required — with 10 of 10 attempts served. The old entry's
  # free-tier-retains-prompts caveat is gone for the same reason: it described
  # the previous upstream and would now overstate the exposure, and a caveat
  # that overstates is still a wrong caveat.
  #
  # Every zero-priced upstream that satisfies that strict policy resolved to
  # the SAME provider on 2026-09-11. So a second free rung would add retry
  # depth but not provider independence — they would fail together. Worth
  # knowing before one is added; it is not a failure mode of this entry, which
  # measured clean, so it is recorded here rather than as a caveat.
  # `in_free_route: true` marks membership in the standalone free-route
  # model group (roles/llm_router/templates/model-list-free.yaml.j2), a
  # second deployment alongside this entry's own untouched ladder
  # registration.
  - client_model_id: hermes-cloud-free
    upstream_model_id: inclusionai/ling-3.0-flash-vl:free
    litellm_model_name: openrouter/inclusionai/ling-3.0-flash-vl:free
    provider: openrouter
    tier: hermes-cloud
    route_group: hermes-cloud-free
    fallback_group: hermes-cloud-free
    in_free_route: true
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # Sized from a MEASURED full-length generation: 8192 output tokens in 58 s
    # on 2026-09-11. This BOUNDS THE ATTEMPT; it does not promise the
    # generation — a slower draw from the same upstream is meant to fail over
    # here rather than hold the chain, so a timeout seen in the logs is this
    # working, not a value to raise. Still ~20x tighter than the tier default,
    # which is sized for long LOCAL generations. Paired so the streaming path —
    # the one this chain's callers actually use — is bounded too.
    request_timeout: &free_timeout 120
    stream_timeout: *free_timeout
    hints:
      speed: fast
      quality: strong
      best_for: [summarize, reasoning]
      measured: { tok_s: 140, date: 2026-09-11, source: openrouter-probe }

  # Hermes value fallbacks; one credential per provider.
  - client_model_id: hermes-cloud-alibaba
    upstream_model_id: complexity_router
    litellm_model_name: auto_router/complexity_router
    provider: auto_router
    tier: hermes-cloud-router
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    routine_model: hermes-cloud-alibaba-routine
    agentic_model: hermes-cloud-alibaba-agentic
    credential_env: DASHSCOPE_API_KEY
    key_field: DASHSCOPE_API_KEY

  - client_model_id: hermes-cloud-alibaba-qwen3.5-flash
    upstream_model_id: qwen3.5-flash
    litellm_model_name: dashscope/qwen3.5-flash
    provider: dashscope
    tier: hermes-cloud
    route_group: hermes-cloud-alibaba-routine
    fallback_group: hermes-cloud-alibaba
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.0000001
    output_cost_per_token: 0.0000004
    credential_env: DASHSCOPE_API_KEY
    key_field: DASHSCOPE_API_KEY
    api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    monthly_budget: 1.665

  - client_model_id: hermes-cloud-alibaba-qwen3.6-flash
    upstream_model_id: qwen3.6-flash
    litellm_model_name: dashscope/qwen3.6-flash
    provider: dashscope
    tier: hermes-cloud
    route_group: hermes-cloud-alibaba-agentic
    fallback_group: hermes-cloud-alibaba
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.00000025
    output_cost_per_token: 0.0000015
    credential_env: DASHSCOPE_API_KEY
    key_field: DASHSCOPE_API_KEY
    api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    monthly_budget: 1.665

  - client_model_id: hermes-cloud-gemini
    upstream_model_id: complexity_router
    litellm_model_name: auto_router/complexity_router
    provider: auto_router
    tier: hermes-cloud-router
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    routine_model: hermes-cloud-gemini-routine
    agentic_model: hermes-cloud-gemini-agentic
    credential_env: GEMINI_API_KEY
    key_field: GEMINI_API_KEY

  - client_model_id: hermes-cloud-gemini-3.5-flash-lite
    upstream_model_id: gemini-3.5-flash-lite
    litellm_model_name: gemini/gemini-3.5-flash-lite
    provider: gemini
    tier: hermes-cloud
    route_group: hermes-cloud-gemini-routine
    fallback_group: hermes-cloud-gemini
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.0000003
    output_cost_per_token: 0.0000025
    credential_env: GEMINI_API_KEY
    key_field: GEMINI_API_KEY
    monthly_budget: 1.665

  - client_model_id: hermes-cloud-gemini-3.7-flash
    upstream_model_id: gemini-3.7-flash
    litellm_model_name: gemini/gemini-3.7-flash
    provider: gemini
    tier: hermes-cloud
    route_group: hermes-cloud-gemini-agentic
    fallback_group: hermes-cloud-gemini
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.00000075
    output_cost_per_token: 0.00000375
    credential_env: GEMINI_API_KEY
    key_field: GEMINI_API_KEY
    monthly_budget: 1.665

  # Dedicated Hermes OpenRouter key, distinct from OPENROUTER_API_KEY (the
  # free rung above and the general openrouter tier in 50-openrouter.yml).
  # Keeps this paid rung's spend attributable and revocable without also
  # cutting the free rung or the general tier.
  - client_model_id: hermes-cloud-openrouter-kimi-k2.6
    upstream_model_id: moonshotai/kimi-k2.6
    litellm_model_name: openrouter/moonshotai/kimi-k2.6
    provider: openrouter
    tier: hermes-cloud
    route_group: hermes-cloud-openrouter
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.0000006
    output_cost_per_token: 0.00000341
    credential_env: OPENROUTER_HERMES_KEY
    key_field: OPENROUTER_HERMES_KEY
    monthly_budget: 1.67

  - client_model_id: hermes-cloud-openrouter-glm-5.2
    upstream_model_id: z-ai/glm-5.2
    litellm_model_name: openrouter/z-ai/glm-5.2
    provider: openrouter
    tier: hermes-cloud
    route_group: hermes-cloud-openrouter
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.0000007308
    output_cost_per_token: 0.000002297
    credential_env: OPENROUTER_HERMES_KEY
    key_field: OPENROUTER_HERMES_KEY
    monthly_budget: 1.67

  # SUBSCRIPTION RUNG: LiteLLM's native chatgpt/ provider (OAuth device-code
  # login per router node into CHATGPT_TOKEN_DIR; the converge never touches
  # that file — roles/llm_router/README.md "Subscription rung"). Sits after
  # the local rungs in `review-private` and after every free external rung in
  # the other chat ladders, always BEFORE any metered rung: a metered rung is
  # reached only once this one answers with the rate-limit class (any 429 —
  # the provider raises no dedicated usage-limit error). `subscription: true`
  # keeps it out of the free segment despite carrying no per-token price.
  # Rendered only on a node that holds a login. Responses-native: the proxy
  # bridges chat completions to it, never the reverse. The model id is ONE
  # variable (llm_router_chatgpt_model, 35-hermes-cloud.yml) — the operator's
  # "Luna" is not a chatgpt/ catalog id today (see that variable's note).
  # Reasoning effort is the highest the Responses path accepts.
  - client_model_id: codex-subscription-model
    upstream_model_id: "{{ llm_router_chatgpt_model }}"
    litellm_model_name: "chatgpt/{{ llm_router_chatgpt_model }}"
    provider: chatgpt
    tier: hermes-cloud
    route_group: codex-subscription
    enabled: true
    subscription: true
    mode: responses
    context_window: 128000
    max_output_tokens: 128000
    # No key: credentialed by the per-node login file (35-hermes-cloud.yml,
    # llm_router_chatgpt_auth_file_present). These two fields satisfy the
    # schema and name nothing that resolves.
    credential_env: CHATGPT_LOGIN_FILE
    key_field: CHATGPT_LOGIN_FILE
    zero_data_retention: false
    reasoning_effort: xhigh
    # `hermes_chain: false` keeps this OUT of llm_router_hermes_cloud_paid_groups
    # (the ZDR-paid segment) despite carrying `subscription: true` — it is
    # picked up explicitly instead, once, as the shared terminal segment
    # every chain ends in (35-hermes-cloud.yml llm_router_hermes_cloud_
    # fallback_groups, via llm_router_external_subscription_rungs,
    # 58-review-roles.yml). No ZDR claim, so it sits after free_zdrless.
    hermes_chain: false
    request_timeout: 300
    # First-byte bound: a node whose login needs the device-code flow blocks
    # the request while it polls; this turns that hold into a hand-over to
    # the API-key rung inside the admission budget. Same base variable the
    # local rungs use (llm-models.d/30-local-gpu.yml) rather than a second
    # copy of the number.
    stream_timeout: "{{ llm_router_admission_budget_seconds }}"

  # TERMINAL PAID RUNG of every chat ladder (55-roles.yml): the provider's
  # own API-key endpoint, deliberately LAST in the paid segment so every
  # cheaper metered rung is tried first. Renders only when its credential
  # resolves (roles/openbao_secrets 10-domains.yml declares the path). This
  # upstream makes no ZDR claim; it is the rung that is guaranteed to answer,
  # not a ZDR one, and sits behind every ZDR rung for that reason.
  - client_model_id: codex-api-model
    upstream_model_id: "{{ llm_router_chatgpt_model }}"
    litellm_model_name: "openai/{{ llm_router_chatgpt_model }}"
    provider: openai
    tier: hermes-cloud
    route_group: codex-api
    enabled: true
    mode: responses
    context_window: 272000
    max_output_tokens: 128000
    input_cost_per_token: 0.00000175
    output_cost_per_token: 0.000014
    credential_env: OPENAI_API_KEY
    key_field: OPENAI_API_KEY
    zero_data_retention: false
    reasoning_effort: xhigh
    # `hermes_chain: false` keeps this OUT of llm_router_hermes_cloud_paid_groups
    # (the ZDR-paid segment) — picked up explicitly instead, once, as the
    # last rung of the shared terminal segment every chain ends in
    # (35-hermes-cloud.yml llm_router_hermes_cloud_fallback_groups, via
    # llm_router_hermes_cloud_api_key_groups, 58-review-roles.yml). No ZDR
    # claim, so it sits after free_zdrless, last of all.
    hermes_chain: false
    monthly_budget: 1.67
    request_timeout: 300
    stream_timeout: 90
