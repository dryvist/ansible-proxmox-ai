    output_cost_per_token: 0.00000375
    credential_env: GEMINI_API_KEY
    key_field: GEMINI_API_KEY
    monthly_budget: 1.665

  # Dedicated Hermes OpenRouter key, distinct from OPENROUTER_API_KEY (the
  # free rung above and the general openrouter tier in 50-openrouter.yml).
  # Keeps this paid rung's spend attributable and revocable without also
  # cutting the free rung or the general tier.
  - client_model_id: hermes-cloud-openrouter-kimi-k2.6
    upstream_model_id: moonshotai/kimi-k2.6
    litellm_model_name: openrouter/moonshotai/kimi-k2.6
    provider: openrouter
    tier: hermes-cloud
    route_group: hermes-cloud-openrouter
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    input_cost_per_token: 0.0000006
    output_cost_per_token: 0.00000341
    credential_env: OPENROUTER_HERMES_KEY
    key_field: OPENROUTER_HERMES_KEY
    monthly_budget: 1.67

  - client_model_id: hermes-cloud-openrouter-glm-5.2
