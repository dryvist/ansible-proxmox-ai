---
# Credential-gated cloud rungs in the Hermes fallback chain.
# One slice of the model registry; see llm-models.d/README.md.
_llm_registry_hermes_cloud:
  # `@preset/best-free` is server-side (OpenRouter dashboard) — never write a
  # concrete id here. Naming/alias rationale: docs/LLM_MODELS_REGISTRY_NOTES.md.
  # context_window is the EFFECTIVE SERVING window advertised to callers, not
  # the preset's real (larger) one.
  - client_model_id: hermes-cloud-free
    upstream_model_id: '@preset/best-free'
    litellm_model_name: openrouter/@preset/best-free
    provider: openrouter
    tier: hermes-cloud
    route_group: hermes-cloud-free
    fallback_group: hermes-cloud-free
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # False here (true elsewhere) — operator decision: ZDR would exclude the
    # very upstream this free rung exists to reach. NOT the cause of the
    # intermittent upstream 429s (measured separately per provider). Details:
    # docs/LLM_MODELS_REGISTRY_NOTES.md.
    zero_data_retention: false
    hints:
      speed: medium
      quality: strong
      best_for: [summarize, reasoning]
      caveats: [free-tier-retains-prompts]

  # Hermes value fallbacks; one credential per provider.
  - client_model_id: hermes-cloud-alibaba
    upstream_model_id: complexity_router
    litellm_model_name: auto_router/complexity_router
    provider: auto_router
    tier: hermes-cloud-router
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    routine_model: hermes-cloud-alibaba-routine
    agentic_model: hermes-cloud-alibaba-agentic
    credential_env: DASHSCOPE_API_KEY
    key_field: DASHSCOPE_API_KEY

  - client_model_id: hermes-cloud-alibaba-qwen3.5-flash
