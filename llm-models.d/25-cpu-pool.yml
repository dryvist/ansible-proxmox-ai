---
# CPU inference pool — MoE and 9B tiers on AVX-512 hosts.
# Each tier is rendered as two same-name LiteLLM deployments (instances -50
# and -51); the scaler starts/stops the second instance on demand.
_llm_registry_cpu_pool:
  - client_model_id: qwen3.6-35b-a3b
    upstream_model_id: qwen3.6-35b-a3b
    provider: openai
    tier: cpu-moe
    enabled: true
    context_window: 8192
    hints:
      speed: slow
      quality: strong
      best_for: [reasoning, review, classify]
      caveats: [serial-lane]

  - client_model_id: qwen3.5-9b
    upstream_model_id: qwen3.5-9b
    provider: openai
    tier: cpu-9b
    enabled: true
    context_window: 8192
    hints:
      speed: medium
      quality: routine
      best_for: [classify, extract]
      caveats: [serial-lane]

  # Same embedder + reranker as llm-models.d/30-local-gpu.yml's vllm-tier
  # entries, on this CPU pool as the failover rung — byte-identical
  # GGUF/quant/context_window on both sides so the served embedding
  # dimension never drifts between rungs (llama_cpp_models in
  # inventory/group_vars/llm_cpu_9b_group.yml). context_window here is
  # optional (model-list-cpu-pool.yaml.j2 gates it), set anyway to match the
  # GPU-side entry and this tier's own qwen3.5-9b sibling above.
  #
  # No `embedding: true` — same reasoning as the vllm-tier entries: that field
  # is the sole, currently-singular selector for the existing `embed` role
  # (roles/llm_router/defaults/main/55-roles.yml), and a second true value
  # anywhere in the registry would make its `| first` result order-dependent.
  # No `rerank` role exists yet. Both ids are reachable only by their own
  # client_model_id until a role/alias is added on purpose.
  - client_model_id: bge-m3
    upstream_model_id: bge-m3
    provider: openai
    tier: cpu-9b
    enabled: true
    context_window: 8192

  - client_model_id: bge-reranker-v2-m3
    upstream_model_id: bge-reranker-v2-m3
    provider: openai
    tier: cpu-9b
    enabled: true
    context_window: 8192
