---
# CPU inference pool — MoE and 9B tiers on AVX-512 hosts.
# Each tier is rendered as two same-name LiteLLM deployments (instances -50
# and -51); the scaler starts/stops the second instance on demand.
_llm_registry_cpu_pool:
  - client_model_id: qwen3.6-35b-a3b
    upstream_model_id: qwen3.6-35b-a3b
    provider: openai
    tier: cpu-moe
    enabled: true
    context_window: 8192
    hints:
      speed: slow
      quality: strong
      best_for: [reasoning, review, classify]
      caveats: [serial-lane]

  - client_model_id: qwen3.5-9b
    upstream_model_id: qwen3.5-9b
    provider: openai
    tier: cpu-9b
    enabled: true
    context_window: 8192
    hints:
      speed: medium
      quality: routine
      best_for: [classify, extract]
      caveats: [serial-lane]
