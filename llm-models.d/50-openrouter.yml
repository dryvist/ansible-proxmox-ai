---
# OpenRouter egress tier (paid SaaS).
# One slice of the model registry; see llm-models.d/README.md.
_llm_registry_openrouter:
  # ── OpenRouter egress tier (paid SaaS) ──────────────────────────────────────
  # Explicit opt-in allowlist, one shared provider credential. `best-free` was
  # a callable handle for the same server-side preset the free rung used to
  # name.
  #
  # DISABLED, and the cause is in the preset itself rather than in anything
  # this repo renders. A preset carries its OWN provider policy and its own
  # short model list, both edited where the preset lives. This one requires
  # zero retention and refuses provider training, and its list has narrowed to
  # upstreams that cannot satisfy that: one was delisted by the provider, and
  # the only one left is a free upstream, which by definition trains on what it
  # is sent. So the preset resolves to nothing and returns not-found — from any
  # tier, whatever this repo sends. Verified 2026-09-11 by reading the preset's
  # own stored configuration and the live catalog.
  #
  # That is also why nothing here could have caught it: the preset was edited
  # elsewhere, so it stopped being servable with no change in this repo. The
  # chain's free rung no longer depends on it — 40-hermes-cloud.yml names a
  # concrete upstream verified against the same policy.
  #
  # Re-enabling is therefore NOT an allowlist flip and NOT a rendering change:
  # the preset has to be given a model that satisfies its own policy first. Do
  # that only if a preset-shaped handle is wanted again for its own sake; the
  # capability it used to provide is already covered.
  - client_model_id: best-free
    upstream_model_id: '@preset/best-free'
    litellm_model_name: openrouter/@preset/best-free
    provider: openrouter
    tier: openrouter
    enabled: false
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY

  # `in_free_route: true` marks membership in the standalone free-route
  # model group (roles/llm_router/templates/model-list-free.yaml.j2), a
  # second deployment alongside this entry's own untouched ladder
  # registration.
  - client_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    upstream_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    provider: openrouter
    tier: openrouter
    in_free_route: true
    enabled: true
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # Explicit, not the field's own default (true): this upstream makes no
    # ZDR claim, which is exactly why it is eligible ONLY for the terminal
    # free_zdrless fallback segment (35-hermes-cloud.yml) and never the
    # or_zdr_paid one.
    zero_data_retention: false
    hints:
      speed: medium
      quality: strong
      best_for: [summarize, reasoning]
      # Free tier: the provider retains what it is sent. Public or synthetic
      # material only.
      caveats: [free-tier-retains-prompts]

  # OLD (2026-10-07); DeepSeek V4 MoE with compressed sparse attention;
  # released 2026-04-24 and updated 2026-07-31. Open weights, MIT;
  # 284B total / 13B active; native MXFP4. Target-local quant fit is
  # unverified. DeepSeek V4.1-Flash (2026-09-10) is the new CED generation,
  # 552B total / 8B prefill / 16B decode; OpenRouter API is available.
  # DeepSeek retired V4 Flash and maps its legacy API id to V4.1-Flash.
  # Evidence: https://api-docs.deepseek.com/updates/
  # https://deepseek.com/en/news/v4-preview/
  # https://deepseek.com/en/news/deepseek-v4-1-flash/
  # https://openrouter.ai/deepseek/deepseek-v4.1-flash
  - client_model_id: deepseek/deepseek-v4-flash
    upstream_model_id: deepseek/deepseek-v4-flash
    provider: openrouter
    tier: openrouter
    enabled: false
    lifecycle: old
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # OpenRouter request-level `zdr: true` (provider routing).
    zero_data_retention: true
    hints:
      speed: fast
      quality: frontier
      best_for: [code-edit, review, reasoning]
      caveats: [paid-counts-against-the-daily-ceiling]

  # MiniMax M2.5 (released 2026-02-12) is retained below as OLD.
  # Facts: MiniMax-M2 sparse MoE architecture; M2.5 version; open weights yes;
  # 230B total (HF metadata: 229B) / 10B active.
  # Local quant sizes: UNVERIFIED; this hosted route references no local artifact.
  # M3 successor: MSA, released 2026-06-01, ~428B (HF metadata: 427B) / 23B active.
  # Keep the id catalogued for history, but disabled so it cannot be routed.
  # Evidence: https://www.minimaxi.com/blog/minimax-m25
  # https://huggingface.co/MiniMaxAI/MiniMax-M2.5
  # https://www.minimax.io/blog/minimax-m3
  # https://huggingface.co/MiniMaxAI/MiniMax-M3
  # https://artificialanalysis.ai/models/comparisons/minimax-m3-vs-minimax-m2-7
  - client_model_id: minimax/minimax-m2.5
    upstream_model_id: minimax/minimax-m2.5
    provider: openrouter
    tier: openrouter
    # OLD (2026-10-07); released 2026-02-12; superseded_by: minimax/minimax-m3 (2026-06-01).
    enabled: false
    lifecycle: old
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # OpenRouter request-level `zdr: true` (provider routing).
    zero_data_retention: true
    hints:
      speed: fast
      quality: strong
      best_for: [summarize, extract]
      caveats: [paid-counts-against-the-daily-ceiling]

  # Was the `ox-alpha` stealth entry. That testing period ended and the provider
  # now 404s it, naming this model as what it actually was — so this is a
  # repoint to the graduated id, not a new selection. Context, output ceiling
  # and prices below are read from the provider's own catalog, not carried over
  # from the stealth entry.
  #
  # Now on the shared OpenRouter credential: the separate key existed to keep
  # the stealth provider's spend and retention separable, and there is no
  # separate provider any more.
  # A5 (2026-09-12): was the `subagent` ROLE's own target (seeded into the
  # database, see 55-roles.yml history); this entry carries `long` instead —
  # the ≥1M-context, explicitly ZDR
  # OpenRouter entry, admitted into llm_router_alias_pairs via the
  # llm_router_long_context_alias_ids carve-out (50-servable.yml).
  # Superseded (55-roles.yml, fast/subagent local-first chain): `subagent`
  # and the new `fast` role now target hermes-local-4080 first and reach this
  # entry as their terminal fallback rung, both directly (the >200k window
  # this alias carries) and via context_window_fallbacks for a request too
  # large for the chain's narrower rungs — not the small/cheap local tier.
  # `fast-gpu` (55-roles.yml), a third, narrower role targeting only the
  # 4080 with no fallback at all, never reaches this entry either way.
  - client_model_id: z-ai/glm-5.3-flash
    upstream_model_id: z-ai/glm-5.3-flash
    litellm_model_name: openrouter/z-ai/glm-5.3-flash
    provider: openrouter
    tier: openrouter
    enabled: true
    input_cost_per_token: 0.00000015
    output_cost_per_token: 0.0000005
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # OpenRouter request-level `zdr: true` (provider routing).
    zero_data_retention: true
    stable_aliases:
      - long
    hints:
      speed: fast
      quality: strong
      best_for: [summarize, extract, code-edit, long-context]
      caveats: [paid-counts-against-the-daily-ceiling]

  - client_model_id: minimax/minimax-m3
    upstream_model_id: minimax/minimax-m3
    provider: openrouter
    tier: openrouter
    enabled: true
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # OpenRouter request-level `zdr: true` (provider routing).
    zero_data_retention: true
    hints:
      speed: medium
      quality: strong
      best_for: [long-context, summarize]
      caveats: [paid-counts-against-the-daily-ceiling]

  # OpenRouter's own router endpoints, under the names callers request. Not
  # `:free`-suffixed, so they never join the Hermes fallback chain. Limits come
  # from the shared catalog entry of the same name.
  - client_model_id: openrouter/free
    upstream_model_id: openrouter/free
    provider: openrouter
    tier: openrouter
    enabled: true
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    zero_data_retention: false

  - client_model_id: openrouter/auto
    upstream_model_id: openrouter/auto
    provider: openrouter
    tier: openrouter
    enabled: true
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    zero_data_retention: false
