---
# OpenRouter egress tier (paid SaaS).
# One slice of the model registry; see llm-models.d/README.md.
_llm_registry_openrouter:
  # ── OpenRouter egress tier (paid SaaS) ──────────────────────────────────────
  # `in_free_route` supplies the cost-class projection, separate from this
  # provider's own model id.
  - client_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    upstream_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    provider: openrouter
    tier: openrouter
    in_free_route: true
    enabled: true
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # Explicit, not the field's own default (true): this upstream makes no
    # ZDR claim, which is exactly why it is eligible ONLY for the terminal
    # free_zdrless fallback segment (35-hermes-cloud.yml) and never the
    # or_zdr_paid one.
    zero_data_retention: false
    hints:
      speed: moderate
      quality: strong
      best_for: [summarize, reasoning]
      # Free tier: the provider retains what it is sent. Public or synthetic
      # material only.
      caveats: [free-tier-retains-prompts]

  # OLD (2026-10-07); DeepSeek V4 MoE with compressed sparse attention;
  # released 2026-04-24 and updated 2026-07-31. Open weights, MIT;
  # 284B total / 13B active; native MXFP4. Target-local quant fit is
  # unverified. DeepSeek V4.1-Flash (2026-09-10) is the new CED generation,
  # 552B total / 8B prefill / 16B decode; OpenRouter API is available.
  # DeepSeek retired V4 Flash and maps its legacy API id to V4.1-Flash.
  # Evidence: https://api-docs.deepseek.com/updates/
  # https://deepseek.com/en/news/v4-preview/
  # https://deepseek.com/en/news/deepseek-v4-1-flash/
  # https://openrouter.ai/deepseek/deepseek-v4.1-flash
  - client_model_id: deepseek/deepseek-v4-flash
    upstream_model_id: deepseek/deepseek-v4-flash
    provider: openrouter
    tier: openrouter
    enabled: false
    lifecycle: old
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # OpenRouter request-level `zdr: true` (provider routing).
    zero_data_retention: true
    hints:
      speed: quick
      quality: frontier
      best_for: [code-edit, review, reasoning]
      caveats: [paid-counts-against-the-daily-ceiling]

  # MiniMax M2.5 (released 2026-02-12) is retained below as OLD.
  # Facts: MiniMax-M2 sparse MoE architecture; M2.5 version; open weights yes;
  # 230B total (HF metadata: 229B) / 10B active.
  # Local quant sizes: UNVERIFIED; this hosted route references no local artifact.
  # M3 successor: MSA, released 2026-06-01, ~428B (HF metadata: 427B) / 23B active.
  # Keep the id catalogued for history, but disabled so it cannot be routed.
  # Evidence: https://www.minimaxi.com/blog/minimax-m25
  # https://huggingface.co/MiniMaxAI/MiniMax-M2.5
  # https://www.minimax.io/blog/minimax-m3
  # https://huggingface.co/MiniMaxAI/MiniMax-M3
  # https://artificialanalysis.ai/models/comparisons/minimax-m3-vs-minimax-m2-7
  - client_model_id: minimax/minimax-m2.5
    upstream_model_id: minimax/minimax-m2.5
    provider: openrouter
    tier: openrouter
    # OLD (2026-10-07); released 2026-02-12; superseded_by: minimax/minimax-m3 (2026-06-01).
    enabled: false
    lifecycle: old
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # OpenRouter request-level `zdr: true` (provider routing).
    zero_data_retention: true
    hints:
      speed: quick
      quality: strong
      best_for: [summarize, extract]
      caveats: [paid-counts-against-the-daily-ceiling]

  # Was the `ox-alpha` stealth entry. That testing period ended and the provider
  # now 404s it, naming this model as what it actually was — so this is a
  # repoint to the graduated id, not a new selection. Context, output ceiling
  # and prices below are read from the provider's own catalog, not carried over
  # from the stealth entry.
  #
  # Now on the shared OpenRouter credential: the separate key existed to keep
  # the stealth provider's spend and retention separable, and there is no
  # separate provider any more.
  # Capability names select a deployment by registry order. Local endpoints
  # are discovered from their inventory groups; this provider entry remains
  # available through its registered route and fallback policy.
  - client_model_id: z-ai/glm-5.3-flash
    upstream_model_id: z-ai/glm-5.3-flash
    litellm_model_name: openrouter/z-ai/glm-5.3-flash
    provider: openrouter
    tier: openrouter
    enabled: true
    input_cost_per_token: 0.0000000232
    output_cost_per_token: 0.0000012
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # OpenRouter request-level `zdr: true` (provider routing).
    zero_data_retention: true
    hints:
      speed: quick
      quality: strong
      best_for: [summarize, extract, code-edit, long-context]
      caveats: [paid-counts-against-the-daily-ceiling]

  - client_model_id: minimax/minimax-m3
    upstream_model_id: minimax/minimax-m3
    provider: openrouter
    tier: openrouter
    enabled: true
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    # OpenRouter request-level `zdr: true` (provider routing).
    zero_data_retention: true
    hints:
      speed: moderate
      quality: strong
      best_for: [long-context, summarize]
      caveats: [paid-counts-against-the-daily-ceiling]

  # OpenRouter's own router endpoints, under the names callers request. Explicit
  # name only: `ladder: false` keeps them out of every fallback ladder (see
  # 57-ladder.yml). Limits come from the shared catalog entry of the same name.
  - client_model_id: openrouter/free
    upstream_model_id: openrouter/free
    provider: openrouter
    tier: openrouter
    enabled: true
    ladder: false
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    zero_data_retention: false

  - client_model_id: openrouter/auto
    upstream_model_id: openrouter/auto
    provider: openrouter
    tier: openrouter
    enabled: true
    ladder: false
    credential_env: OPENROUTER_API_KEY
    key_field: OPENROUTER_API_KEY
    zero_data_retention: false
