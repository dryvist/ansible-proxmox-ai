---
# Candidate Pro6000 profiles. Model bytes and quantization live once in
# 65-gpu-pro6000-artifacts.yml; these router entries reference the selected
# artifact ids and keep only the client-facing profile contract.
_llm_registry_gpu_pro6000:
  - client_model_id: gpu-small
    artifact_id: qwen35-9b-nvfp4
    provider: openai
    tier: gpu
    profile: small
    enabled: false
    servable: false
    # The serving profile's 32,768-token max_model_len includes the reserved
    # output budget; advertise the remaining input window to LiteLLM.
    context_window: 24576
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 1
    num_retries: 0
    hints:
      speed: fast
      quality: routine
      best_for: [judge, classification, quick-review]
      caveats: [benchmark-provisional]
    stable_aliases: [local-fast]

  - client_model_id: gpu-medium-a
    artifact_id: qwen38-27b-nvfp4
    provider: openai
    tier: gpu
    profile: medium-a
    enabled: false
    servable: false
    # The measured max_model_len is 196,608 including the advertised output
    # budget; context_window is the effective input window served by vLLM.
    context_window: 188416
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 1
    num_retries: 0
    hints:
      speed: medium
      quality: strong
      best_for: [review, reasoning, deliberate-edit]
    stable_aliases: [local-medium]

  - client_model_id: gpu-medium-b
    artifact_id: qwen38-27b-ud-iq3-xxs
    provider: openai
    tier: gpu
    profile: medium-b
    enabled: false
    servable: false
    context_window: 32768
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 1
    num_retries: 0
    hints:
      speed: fast
      quality: strong
      best_for: [subagent, coding, tool-use]

  - client_model_id: gpu-max
    artifact_id: flash-next-iq3-s
    provider: openai
    tier: gpu
    profile: max
    enabled: false
    servable: false
    context_window: 32768
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 1
    num_retries: 0
    hints:
      speed: slow
      quality: frontier
      best_for: [long-context, agentic-multi-turn, hard-problems]
