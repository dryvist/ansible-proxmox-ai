---
# Candidate Pro6000 GPU profiles. All model ids and limits are placeholders
# finalised by the benchmark campaign. For each profile, context_window is the
# engine max_model_len and is rendered unchanged as LiteLLM max_input_tokens.
# The profiles remain disabled until llm_router_gpu_profiles_enabled is flipped
# by a later profile-switch change.
#
# New profiles use num_retries: 0 so a failed or busy profile hands off
# immediately to the existing role fallback. Existing retry and cooldown
# defaults are unchanged.
_llm_registry_gpu_pro6000:
  - client_model_id: gpu-small
    upstream_model_id: Qwen/Qwen3.5-9B
    provider: openai
    tier: gpu
    profile: small
    enabled: false
    servable: false
    context_window: 65536
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 1
    num_retries: 0
    hints:
      speed: fast
      quality: routine
      best_for: [judge, classification, quick-review]
      caveats: [benchmark-placeholder]

  - client_model_id: gpu-medium-a
    upstream_model_id: nvidia/Qwen3.8-27B-NVFP4
    provider: openai
    tier: gpu
    profile: medium-a
    enabled: false
    servable: false
    context_window: 65536
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 1
    num_retries: 0
    hints:
      speed: medium
      quality: strong
      best_for: [review, reasoning, deliberate-edit]

  - client_model_id: gpu-medium-b
    upstream_model_id: nvidia/Qwen3.6-35B-A3B-NVFP4
    provider: openai
    tier: gpu
    profile: medium-b
    enabled: false
    servable: false
    context_window: 65536
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 1
    num_retries: 0
    hints:
      speed: fast
      quality: strong
      best_for: [subagent, coding, tool-use]

  - client_model_id: gpu-max
    upstream_model_id: nvidia/Qwen3.5-122B-A10B-NVFP4
    provider: openai
    tier: gpu
    profile: max
    enabled: false
    servable: false
    context_window: 32768
    max_output_tokens: 8192
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_parallel_requests: 1
    num_retries: 0
    hints:
      speed: slow
      quality: frontier
      best_for: [long-context, agentic-multi-turn, hard-problems]
