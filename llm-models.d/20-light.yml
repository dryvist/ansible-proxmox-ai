---
# Light tier: GPU + CPU standby pairs sharing a model name.
# One slice of the model registry; see llm-models.d/README.md.
_llm_registry_light:
  # ── light tier ──────────────────────────────────────────────────────────────
  # llama-server --models-preset section names, served as-is. Each becomes TWO same-name
  # deployments (GPU + CPU standby); LiteLLM load-balances and cools a failed
  # one down — a GPU outage drains to CPU automatically.
  - client_model_id: qwen3-4b
    upstream_model_id: qwen3-4b
    provider: openai
    tier: light
    enabled: true
    hints:
      speed: fast
      quality: routine
      best_for: [classify, extract]
      caveats: [smoke-tested-only]

  - client_model_id: embeddings
    upstream_model_id: embeddings
    provider: openai
    tier: light
    enabled: true
    embedding: true
    # `embed` is deliberately NOT added as a stable_alias here yet: same
    # common-word collision class as `judge`/`cheap`/`ocr` (A5 PR notes,
    # tests/llm_router/test_registry_retype_scan.py), on top of which this
    # entry is tier: light, not large, and `servable: true` here would break
    # the invariant in roles/llm_router/tasks/assert.yml that every servable
    # model is a large-tier entry with a real context_window.

  # Embedder/reranker CPU failover for llm-models.d/30-local-gpu.yml's
  # vllm-tier bge-m3/bge-reranker-v2-m3 (the 4080). NOT llm_cpu_9b_group —
  # that group's tag has no guest in the desired state today, so it is empty
  # and cannot serve anything. llm_fast_group (tags llm-fast/llm-light)
  # already carries the read-only shared models mount and runs on different
  # nodes from the 4080.
  #
  # SAME client_model_id as the vllm-tier entries, deliberately — one model,
  # one client name, failover expressed as order within the shared
  # model_name (tests/llm_router/test_local_first_by_order.yml), never a
  # second name for the same weights. context_window reads the SAME base var
  # the vllm-tier entries use (llm-models.d/30-local-gpu.yml,
  # _llm_registry_bge_m3_context_window /
  # _llm_registry_bge_reranker_v2_m3_context_window) — same GGUF, same ctx,
  # one number.
  #
  # max_input_tokens for THIS tier's rendered deployment is projected in
  # roles/llm_router/templates/model-list-light.yaml.j2 from the same
  # _llm_router_vllm_max_input_tokens_by_model map the vllm tier itself uses
  # (roles/llm_router/defaults/main/20-registry.yml), keyed by
  # client_model_id — not a separate light-tier derivation, and not the raw
  # context_window: the vllm tier's number is capped by the 4080's prefill
  # throughput within the admission budget, and every deployment sharing this
  # model_name must advertise the SAME number or assert-registry-render-parity.yml's
  # window checks correctly refuse it (verified locally: reusing the id
  # without this projection failed WINDOW ADVERTISED BY SOME MEMBERS ONLY /
  # NARROW DEPLOYMENT PREFERRED). No `embedding: true` — that field is the
  # sole, currently-singular selector for the existing `embed` role
  # (roles/llm_router/defaults/main/55-roles.yml), and a second true value
  # anywhere in the registry would make its `| first` result order-dependent.
  # No `rerank` role exists yet.
  - client_model_id: bge-m3
    upstream_model_id: bge-m3
    provider: openai
    tier: light
    enabled: true
    context_window: "{{ _llm_registry_bge_m3_context_window }}"

  - client_model_id: bge-reranker-v2-m3
    upstream_model_id: bge-reranker-v2-m3
    provider: openai
    tier: light
    enabled: true
    context_window: "{{ _llm_registry_bge_reranker_v2_m3_context_window }}"
