---
# Light tier: GPU + CPU standby pairs sharing a model name.
# One slice of the model registry; see llm-models.d/README.md.
_llm_registry_light:
  # ── light tier ──────────────────────────────────────────────────────────────
  # llama-server --models-preset section names, served as-is. Each becomes TWO same-name
  # deployments (GPU + CPU standby); LiteLLM load-balances and cools a failed
  # one down — a GPU outage drains to CPU automatically.
  - client_model_id: qwen3-4b
    upstream_model_id: qwen3-4b
    provider: openai
    tier: light
    enabled: true
    hints:
      speed: fast
      quality: routine
      best_for: [classify, extract]
      caveats: [smoke-tested-only]

  - client_model_id: embeddings
    upstream_model_id: embeddings
    provider: openai
    tier: light
    enabled: true
    embedding: true
    # `embed` is deliberately NOT added as a stable_alias here yet: same
    # common-word collision class as `judge`/`cheap`/`ocr` (A5 PR notes,
    # tests/llm_router/test_registry_retype_scan.py), on top of which this
    # entry is tier: light, not large, and `servable: true` here would break
    # the invariant in roles/llm_router/tasks/assert.yml that every servable
    # model is a large-tier entry with a real context_window.

  # Embedder/reranker CPU failover for llm-models.d/30-local-gpu.yml's
  # vllm-tier bge-m3/bge-reranker-v2-m3 (the 4080). NOT llm_cpu_9b_group —
  # that group's tag has no guest in the desired state today, so it is empty
  # and cannot serve anything. llm_fast_group (tags llm-fast/llm-light)
  # already carries the read-only shared models mount and runs on different
  # nodes from the 4080.
  #
  # DELIBERATELY a DIFFERENT client_model_id than the vllm-tier entries, not
  # the same one — tried that first and it failed
  # assert-registry-render-parity.yml locally (WINDOW ADVERTISED BY SOME
  # MEMBERS ONLY / NARROW DEPLOYMENT PREFERRED): the vllm tier's
  # max_input_tokens comes from
  # roles/llm_router/defaults/main/20-registry.yml's
  # _llm_router_vllm_max_input_tokens_by_model, which projects ONLY vllm-tier
  # entries — the light tier has no equivalent projection, so a shared
  # model_name would carry one deployment advertising a window and one not,
  # which the parity guard correctly refuses. Making the two rungs share one
  # caller-facing name (with the window projection extended to cover light
  # too) is the "router aliases" step, deferred until after L0a-2 — until
  # then this is served under its own name, reachable only by its own
  # client_model_id, same GGUF/quant/context_window as the vllm-tier pair so
  # the served embedding dimension is identical whenever the alias does land
  # (llama_cpp_models in inventory/group_vars/llm_fast_group.yml). No
  # `embedding: true` — that field is the sole, currently-singular selector
  # for the existing `embed` role
  # (roles/llm_router/defaults/main/55-roles.yml), and a second true value
  # anywhere in the registry would make its `| first` result order-dependent.
  # No `rerank` role exists yet.
  - client_model_id: bge-m3-light
    upstream_model_id: bge-m3-light
    provider: openai
    tier: light
    enabled: true
    context_window: 8192

  - client_model_id: bge-reranker-v2-m3-light
    upstream_model_id: bge-reranker-v2-m3-light
    provider: openai
    tier: light
    enabled: true
    context_window: 8192
