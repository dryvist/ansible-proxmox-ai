---
# llama-swap light tier: GPU + CPU standby pairs sharing a model name.
# One slice of the model registry; see llm-models.d/README.md.
_llm_registry_light:
  # ── light tier ──────────────────────────────────────────────────────────────
  # llama-swap model names, served as-is. Each becomes TWO same-name
  # deployments (GPU + CPU standby); LiteLLM load-balances and cools a failed
  # one down — a GPU outage drains to CPU automatically.
  - client_model_id: qwen3-4b
    upstream_model_id: qwen3-4b
    provider: openai
    tier: light
    enabled: true
    hints:
      speed: fast
      quality: routine
      best_for: [classify, extract]
      caveats: [smoke-tested-only]

  - client_model_id: embeddings
    upstream_model_id: embeddings
    provider: openai
    tier: light
    enabled: true
    embedding: true
    # `embed` is deliberately NOT added as a stable_alias here yet:
    # llm_router_role_deployments (55-roles.yml) already seeds a live DB role
    # named `embed` pointing at this entry — same collision as `judge`/`cheap`
    # in 10-large.yml; A5 retires the DB roles and adds all three git aliases
    # in the same converge. Also, this entry is tier: light, not large — even
    # collision aside, `servable: true` here would break the invariant in
    # roles/llm_router/tasks/assert.yml that every servable model is a
    # large-tier entry with a real context_window.
