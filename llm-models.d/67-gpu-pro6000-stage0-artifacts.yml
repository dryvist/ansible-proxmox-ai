---
# Stage 0 assets are separate from the primary serving and model-store artifact slice.
_llm_model_stage0_artifacts:
  - artifact_id: embeddinggemma-2-stage0
    hf_repo: google/embeddinggemma-2
    revision: 914f7f89142e33e77833254d9c9b90c3cef7303b
    include_globs: ["*"]
    format: safetensors
    quantization: BF16
    license: apache-2.0
    model_task: feature-extraction
    model_task_source: model_card
    context_window_tokens: 8192
    engines: [vllm]
    use: benchmark-only

  - artifact_id: opendecider-qwen3-4b-base-stage0
    hf_repo: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    include_globs: ["*"]
    format: safetensors
    quantization: BF16
    license: apache-2.0
    model_task: text-generation
    model_task_source: model_card
    context_window_tokens: 4096
    engines: [vllm]
    use: benchmark-only

  - artifact_id: opendecider-small-stage0
    hf_repo: manjunathshiva/opendecider-small
    revision: 15ecdbe7b2ecf8bd2ed897e4968f816836ac8ad7
    include_globs: ["*"]
    format: safetensors
    quantization: LoRA adapter
    license: apache-2.0
    model_task: zero-shot-classification
    model_task_source: model_card
    context_window_tokens: 4096
    required_artifact_ids: [opendecider-qwen3-4b-base-stage0]
    engines: [vllm]
    use: benchmark-only

  - artifact_id: opendecider-small-td-stage0
    hf_repo: manjunathshiva/opendecider-small-td
    revision: 07ebb9b6903442a439b7b84cb47f96d5f47b21a0
    include_globs: ["*"]
    format: safetensors
    quantization: LoRA adapter
    license: apache-2.0
    model_task: zero-shot-classification
    model_task_source: model_card
    context_window_tokens: 4096
    required_artifact_ids: [opendecider-qwen3-4b-base-stage0]
    engines: [vllm]
    use: benchmark-only
