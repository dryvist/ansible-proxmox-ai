---
# OpenCode Go entries for the homelab-contracts v5.47.0 model catalog.
# Enabled once the catalog lists the name; see llm-models.d/35-opencode.yml.
_llm_registry_opencode_go_catalog_a:
  - client_model_id: go-deepseek-pro
    upstream_model_id: deepseek-v4-pro
    provider: openai
    tier: opencode
    in_free_route: true
    enabled: true
    catalog_limit_overrides: [context_window, max_output_tokens]
    context_window: 616000
    max_output_tokens: 384000
    rpm: 20
    tpm: 150000
    credential_env: OPENCODE_API_KEY
    key_field: OPENCODE_API_KEY
    # ZDR only until the vendor agreement end (docs page, monthly renewal).
    zero_data_retention_expires: "{{ llm_router_opencode_deepseek_zdr_expiry }}"

  - client_model_id: go-glm-5.2
    upstream_model_id: glm-5.2
    provider: openai
    tier: opencode
