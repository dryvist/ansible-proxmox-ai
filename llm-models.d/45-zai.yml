---
# Z.ai overflow pair — the TERMINAL rungs of the `review-oss` role
# (roles/llm_router/defaults/main/55-roles.yml) AND, since the 2026-09-20
# shared-continuation decision, a segment of the primary group's own chain
# (roles/llm_router/defaults/main/35-hermes-cloud.yml
# llm_router_hermes_cloud_fallback_groups). An OpenAI-compatible SaaS
# endpoint on one provider key, declared in roles/openbao_secrets
# 10-domains.yml (`<ai_api_key_prefix>/zai`, ZAI_API_KEY, optional until
# seeded): an unseeded key renders no entry. Free tier first, metered tier
# last.
_llm_registry_zai:
  - client_model_id: zai-glm-4.5-flash
    upstream_model_id: glm-4.5-flash
    provider: openai
    tier: zai
    enabled: true
    context_window: 128000
    max_output_tokens: 16384
    credential_env: ZAI_API_KEY
    key_field: ZAI_API_KEY
    zero_data_retention: false
    hints:
      speed: fast
      quality: routine
      best_for: [review, summarize]
      caveats: [free-tier-retains-prompts]

  - client_model_id: zai-glm-5.3-flash
    upstream_model_id: glm-5.3-flash
    provider: openai
    tier: zai
    enabled: true
    context_window: 200000
    max_output_tokens: 16384
    input_cost_per_token: 0.0000002
    output_cost_per_token: 0.0000011
    credential_env: ZAI_API_KEY
    key_field: ZAI_API_KEY
    zero_data_retention: false
    monthly_budget: 1.67
    hints:
      speed: fast
      quality: strong
      best_for: [review, reasoning]
