---
# Campaign model files are defined once here. Serving profiles and benchmark
# runbooks select these stable artifact ids; neither repeats Hub repositories,
# file filters, formats, or quantization.
_llm_model_artifacts:
  - artifact_id: mimo-9b-nvfp4-mtp
    hf_repo: ycui7/MiMo-V2.6-Distill-Qwen-9B-NVFP4-MTP
    include_globs: ["*"]
    format: safetensors
    quantization: NVFP4+MTP
    model_size: small
    serving_profile: small
    context_window_tokens: 262144
    engines: [vllm]
    tool_call_parser: mimo
    reasoning_parser: mimo
    use: serving

  - artifact_id: qwen38-27b-nvfp4
    hf_repo: nvidia/Qwen3.8-27B-NVFP4
    include_globs: ["*"]
    format: safetensors
    quantization: NVFP4/FP8
    model_size: medium
    serving_profile: medium-a
    context_window_tokens: 196608
    engines: [vllm]
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    use: serving

  - artifact_id: mimo-9b-bf16-reference
    hf_repo: XiaomiMiMo/MiMo-V2.6-Distill-Qwen-9B
    include_globs: ["*"]
    format: safetensors
    quantization: BF16
    engines: [vllm]
    use: benchmark-only

  - artifact_id: mimo-9b-mlx-optiq-4bit
    hf_repo: mlx-community/MiMo-V2.6-Distill-Qwen-9B-OptiQ-4bit
    include_globs: ["*"]
    format: MLX
    quantization: OptiQ-4bit
    model_size: small
    serving_profile: small
    context_window_tokens: 262144
    engines: [mlx_lm]
    use: benchmark-only

  - artifact_id: qwen38-27b-mlx-4bit
    hf_repo: mlx-community/Qwen3.8-27B-4bit
    include_globs: ["*"]
    format: MLX
    quantization: 4-bit
    model_size: medium
    serving_profile: medium-a
    context_window_tokens: 196608
    engines: [mlx_lm]
    use: benchmark-only

  - artifact_id: qwen36-35b-a3b-mlx-4bit
    hf_repo: mlx-community/Qwen3.6-35B-A3B-4bit
    include_globs: ["*"]
    format: MLX
    quantization: 4-bit
    model_size: medium-b
    serving_profile: medium-b
    context_window_tokens: 262144
    engines: [mlx_lm]
    use: benchmark-only

  - artifact_id: flash-next-mlx-oq5e-mtp
    hf_repo: mlx-community/Qwen3.8-Flash-Next-Uncensored-oQ5e-mtp
    include_globs: ["*"]
    format: MLX
    quantization: oQ5e+MTP
    model_size: large
    serving_profile: max
    context_window_tokens: 262144
    engines: [mlx_lm]
    use: benchmark-only

  - artifact_id: mimo-9b-q4-k-m
    hf_repo: bartowski/MiMo-V2.6-Distill-Qwen-9B-GGUF
    include_globs: ["MiMo-V2.6-Distill-Qwen-9B-Q4_K_M.gguf"]
    format: GGUF
    quantization: Q4_K_M
    model_size: small
    serving_profile: small
    context_window_tokens: 262144
    engines: [llama_cpp]
    use: benchmark-only

  - artifact_id: qwen38-27b-ud-iq3-xxs
    hf_repo: unsloth/Qwen3.8-27B-GGUF
    include_globs: ["Qwen3.8-27B-UD-IQ3_XXS.gguf"]
    format: GGUF
    quantization: UD-IQ3_XXS
    model_size: medium
    serving_profile: medium-a
    context_window_tokens: 196608
    engines: [llama_cpp]
    use: benchmark-only

  - artifact_id: flash-next-iq3-s
    hf_repo: ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF
    include_globs: ["IQ3_S/*"]
    format: GGUF
    quantization: IQ3_S
    model_size: large
    context_window_tokens: 262144
    engines: [llama_cpp]
    use: benchmark-only

  - artifact_id: flash-next-nvfp4
    hf_repo: primitive-ai/Qwen3.8-Flash-Next-NVFP4
    include_globs: ["*"]
    format: safetensors
    quantization: NVFP4
    model_size: large
    serving_profile: max
    context_window_tokens: 262144
    requires_live_kv_pool: true
    required_artifact_ids: [flash-next-ple-nvfp4]
    engines: [vllm]
    use: benchmark-only

  - artifact_id: flash-next-ple-nvfp4
    hf_repo: primitive-ai/Qwen3.8-Flash-Next-PLE-quant
    include_globs:
      - worker_image_quant.py
      - ple_layer_quant.py
      - connector_mrv2.py
      - ples_nvfp4/*
    format: PLE sidecar
    quantization: NVFP4
    engines: [vllm]
    use: benchmark-only

  - artifact_id: flash-next-mtp-q8-0
    hf_repo: unsloth/Qwen3.8-Flash-Next-GGUF
    include_globs: [MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf]
    format: GGUF
    quantization: Q8_0 MTP sidecar
    engines: [llama_cpp]
    use: benchmark-only
