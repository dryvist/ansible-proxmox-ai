---
# ── OpenCode Go flat-rate subscription tier ──────────────────────────────────
# One slice of the model registry; see llm-models.d/README.md.
#
# Flat-rate subscription, not metered egress: the marginal price of a token on
# this tier is not a meaningful number, so NO input_cost_per_token /
# output_cost_per_token appears below. Those fields are real USD list prices
# (docs/LLM_MODELS_SCHEMA.md) and a literal 0 there would be a lie in the
# direction that matters — spend reporting would show the tier as free rather
# than as a fixed monthly line item, and cost-based routing would rank it below
# every genuinely-free rung.
#
# ONE ENTRY PER UPSTREAM. The banned pattern this registry exists to kill is a
# second deployment that re-types a physical entry's window, tier and provider
# under an alias-shaped name; every such name drifts from the backend the next
# time the model changes. A consumer-facing short name belongs in
# `stable_aliases` (zero deployment configuration), never in a second entry.
#
# The `opencode/` prefix on every client_model_id is load-bearing, not cosmetic.
# Two of these upstreams are also reachable through the metered OpenRouter tier
# under the vendor's own id, with an 8-10x larger serving window. A shared
# model_name would put both under one LiteLLM model group, where the lower
# `order` wins deployment selection — so the NARROW subscription deployment
# would capture every request to that name, including the long-context
# `subagent` role. The prefix makes that collision structurally impossible.
#
# Provider topology (api_base, credential_env, default order) is inherited from
# roles/llm_router/defaults/main/32-opencode.yml — nothing topology-shaped here.
#
# `hints` are deliberately partial. speed/quality are stated only where this
# repo already carries a judgement for the same upstream (the OpenRouter tier's
# entries for the two shared models); the other two upstreams get the caveat
# alone rather than an invented decode class. `best_for` drops `long-context`
# even where the sibling claims it: that claim belongs to the 1M-token
# deployment, not to this 131072 one.
_llm_registry_opencode:
  - client_model_id: opencode/deepseek-v4.1-flash
    upstream_model_id: deepseek-v4.1-flash
    provider: openai
    tier: opencode
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    hints:
      caveats: [flat-rate-subscription-shared-quota]

  - client_model_id: opencode/qwen3.8-max
    upstream_model_id: qwen3.8-max
    provider: openai
    tier: opencode
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    hints:
      caveats: [flat-rate-subscription-shared-quota]

  # speed/quality carried from this upstream's metered sibling
  # (50-openrouter.yml). best_for drops long-context: that belongs to the
  # sibling's window, not to this one.
  - client_model_id: opencode/glm-5.3-flash
    upstream_model_id: glm-5.3-flash
    provider: openai
    tier: opencode
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    hints:
      speed: fast
      quality: strong
      best_for: [summarize, extract, code-edit]
      caveats: [flat-rate-subscription-shared-quota]

  - client_model_id: opencode/minimax-m3
    upstream_model_id: minimax-m3
    provider: openai
    tier: opencode
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    hints:
      speed: medium
      quality: strong
      best_for: [summarize]
      caveats: [flat-rate-subscription-shared-quota]
