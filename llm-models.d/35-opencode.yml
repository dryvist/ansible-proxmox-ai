---
# ── OpenCode Go subscription tier ─────────────────────────────────────────────
# One slice of the model registry; see llm-models.d/README.md.
#
# COST. A flat monthly fee, not metered egress, so the marginal price of a
# token here is not a number and NO input_cost_per_token /
# output_cost_per_token appears below. Those fields are real USD list prices
# (docs/LLM_MODELS_SCHEMA.md); a literal 0 would report the tier as free in
# spend accounting and rank it alongside genuinely free rungs.
#
# The provider's DOCUMENTED DEFAULT at the subscription's usage ceiling is to
# refuse a request rather than bill for it, which is what would let this tier
# serve as a zero-marginal-cost rung. That behaviour is an ACCOUNT SETTING we
# do not control from this repo: overflow to a pay-as-you-go balance is an
# opt-in console toggle, and the balance behind it auto-reloads once enabled.
# So the property is external and checkable, never structural. Anyone relying
# on it should confirm the toggle is still off; if it is ever turned on, this
# tier needs a rendered budget ceiling the way the metered tier has one.
#
# ONE ENTRY PER UPSTREAM. The banned pattern this registry exists to kill is a
# second deployment that re-types a physical entry's window, tier and provider
# under an alias-shaped name; every such name drifts from the backend the next
# time the model changes. A consumer-facing short name belongs in
# `stable_aliases` (zero deployment configuration), never in a second entry,
# and no entry here carries a `route_group` for the same reason.
#
# THE `opencode/` PREFIX IS LOAD-BEARING. Both upstreams below are also
# reachable through the metered tier under the vendor's own id, at a different
# window. A shared model_name would put both under one LiteLLM model group,
# where deployments are ranked against each other and the group behaves as its
# smallest member. The prefix makes that collision structurally impossible, and
# assert-registry-render-parity.yml fails the converge if one is reintroduced.
#
# CONTEXT WINDOWS ARE A DELIBERATE CONSERVATIVE FLOOR, NOT A MEASUREMENT.
# `context_window` means the EFFECTIVE SERVING window of this endpoint, which
# is not the model's native limit and may be capped below it. Third-party
# documentation suggests both models serve considerably more than the values
# below, and that documentation is not this endpoint, so it is deliberately not
# copied in here. The failure modes are asymmetric: advertising smaller than
# reality only under-uses the model, while advertising larger than reality is
# how a caller sends a context nothing can read (outage 2026-07-08). Raising
# these requires the endpoint's own model listing, which needs the tier's
# credential.
#
# NOT REGISTERED, DELIBERATELY. Two further ids were proposed for this tier —
# `deepseek-v4.1-flash` and `qwen3.8-max` — and neither appears in any
# published catalog; the nearest real names differ by a version suffix and by a
# tier that appears not to exist. They are absent rather than `enabled: false`
# on purpose: a disabled entry is still a claim that the name is real, and an
# unserved name does not degrade, it returns 404 (incident 2026-07-28, four
# consumer aliases 404ing at once). Adding either needs one thing — a query
# against this endpoint's own model listing, which needs the credential.
#
# Provider topology (api_base, credential_env, rate caps) is inherited from
# roles/llm_router/defaults/main/32-opencode.yml — nothing topology-shaped here.
#
# `hints` speed/quality are carried from each upstream's metered sibling in
# 50-openrouter.yml, the only judgement this repo already holds for them.
# `best_for` drops `long-context` even where a sibling claims it: that claim
# belongs to the sibling's window, not to the floor advertised here.
_llm_registry_opencode:
  - client_model_id: opencode/glm-5.3-flash
    upstream_model_id: glm-5.3-flash
    provider: openai
    tier: opencode
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    hints:
      speed: fast
      quality: strong
      best_for: [summarize, extract, code-edit]
      caveats: [subscription-shared-quota, conservative-advertised-window]

  - client_model_id: opencode/minimax-m3
    upstream_model_id: minimax-m3
    provider: openai
    tier: opencode
    enabled: true
    context_window: 131072
    max_output_tokens: 8192
    hints:
      speed: medium
      quality: strong
      best_for: [summarize]
      caveats: [subscription-shared-quota, conservative-advertised-window]
