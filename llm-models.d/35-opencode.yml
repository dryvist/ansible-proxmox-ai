---
# ── OpenCode Go subscription tier ─────────────────────────────────────────────
# One slice of the model registry; see llm-models.d/README.md.
#
# SOURCES. The canonical OpenCode Go page is
# https://opencode.ai/v2/docs/console/go/#usage-limits. It is the source for the
# model set, the per-model zero-data-retention status (its Privacy table), and
# the usage limits. The per-model context and output limits in this file come
# from the models endpoint, https://opencode.ai/inference/go/v1/models (read
# 2026-11-03), because the docs page does not publish context windows. Where the
# docs page and an entry disagree, the page wins.
#
# COST. A flat monthly fee, not metered egress, so the marginal price of a
# token here is not a number and no per-token rate fields appear below. Those
# fields carry accounting rates (docs/LLM_MODELS_SCHEMA.md); a literal 0 would
# report the tier as free in spend accounting and rank it alongside genuinely
# free rungs.
#
# The provider's DOCUMENTED DEFAULT at the subscription's usage ceiling is to
# refuse a request rather than bill for it, which is what would let this tier
# serve as a zero-marginal-cost rung. That behaviour is an ACCOUNT SETTING we
# do not control from this repo: overflow to a pay-as-you-go balance is an
# opt-in console toggle, and the balance behind it auto-reloads once enabled.
# So the property is external and checkable, never structural. Anyone relying
# on it should confirm the toggle is still off; if it is ever turned on, this
# tier needs a rendered budget ceiling the way the metered tier has one.
#
# CONSOLE PRIVACY GATES. Two models refuse requests until an owner enables them
# in the OpenCode console under Settings › Privacy: DeepSeek V4.1 Flash and V4
# Pro need the Global region, and Muse Spark 1.2 and 1.3 need "Allow paid
# endpoints that train on request data". The registry cannot set these.
#
# ONE ENTRY PER UPSTREAM. The banned pattern this registry exists to kill is a
# second deployment that re-types a physical entry's window, tier and provider
# under an alias-shaped name; every such name drifts from the backend the next
# time the model changes. A consumer-facing short name belongs in
# `stable_aliases` (zero deployment configuration), never in a second entry,
# and no entry here carries a `route_group` for the same reason.
#
# CLIENT IDS ARE LOAD-BEARING. The `opencode/` and `go-` client ids expose the
# subscription endpoints under their registered model names, distinct from
# metered deployments. Sandbox-only models have no alias or route group.
# assert-registry-render-parity.yml checks that registered groups render.
#
# The API's `limit.context` is the combined context; this registry's
# `context_window` is the safe input ceiling after reserving `max_output_tokens`
# (or the published input cap where the API gives one). These explicit provider
# limits override the generic model-catalog defaults for Go entries.
#
# `grok-4.7` and `kimi-k2.7-code` are not registered: the API publishes a
# context equal to the output limit, which leaves no safe input window. MiMo-V2.5
# and MiMo-V2.5-Pro are on the docs page but not in the models API, so no limits
# are published for them and they are not registered.
#
# `qwen3.8-max` is registered from the docs page and the models API.
#
# Provider topology (api_base, rate caps) is inherited from
# roles/llm_router/defaults/main/32-opencode.yml — nothing topology-shaped here.
# The credential NAME is not topology: like every other credential-gated tier,
# each entry declares its own `credential_env` and `key_field`, so the env and
# probe projections read them off the entry exactly as they do for the metered
# tiers and nothing has to special-case this one.
#
# `hints` speed/quality are carried from each upstream's metered sibling in
# 50-openrouter.yml when that entry exists; no hints are inferred otherwise.
# `best_for` drops `long-context` even where a sibling claims it: that claim
# belongs to the sibling's window, not to the floor advertised here.
# `in_free_route` supplies the cost-class projection, separate from this
# provider's own model id.
_llm_registry_opencode:
  - client_model_id: opencode/minimax-m3
    upstream_model_id: minimax-m3
    provider: openai
    tier: opencode
    in_free_route: true
    enabled: true
    catalog_limit_overrides: [context_window, max_output_tokens]
    context_window: 868928
    max_output_tokens: 131072
    rpm: 20
    tpm: 150000
    credential_env: OPENCODE_API_KEY
    key_field: OPENCODE_API_KEY
    # OpenCode Go 0-day retention contract (docs privacy table, checked 2026-11-03).
    zero_data_retention: true
    hints:
      speed: moderate
      quality: strong
      best_for: [summarize]
      caveats: [subscription-shared-quota, conservative-advertised-window]

  - client_model_id: go-kimi-k3
    upstream_model_id: kimi-k3
    provider: openai
    tier: opencode
    in_free_route: true
    enabled: true
    catalog_limit_overrides: [context_window, max_output_tokens]
    context_window: 917504
    max_output_tokens: 131072
    rpm: 20
    tpm: 150000
    credential_env: OPENCODE_API_KEY
    key_field: OPENCODE_API_KEY
    # OpenCode Go 0-day retention contract (docs privacy table, checked 2026-11-03).
    zero_data_retention: true

  - client_model_id: go-mimo-flash
    upstream_model_id: mimo-v2.6-flash
    provider: openai
    tier: opencode
    in_free_route: true
    enabled: true
    catalog_limit_overrides: [context_window, max_output_tokens]
    context_window: 917504
    max_output_tokens: 131072
    tags: [sandbox-only]
    rpm: 20
    tpm: 150000
    credential_env: OPENCODE_API_KEY
    key_field: OPENCODE_API_KEY
    # OpenCode Go 0-day retention contract (docs privacy table, checked 2026-11-03).
    zero_data_retention: true

  - client_model_id: go-deepseek-flash
    upstream_model_id: deepseek-v4.1-flash
    provider: openai
    tier: opencode
    in_free_route: true
    enabled: true
    catalog_limit_overrides: [context_window, max_output_tokens]
    context_window: 616000
    max_output_tokens: 384000
    tags: [sandbox-only]
    rpm: 20
    tpm: 150000
    credential_env: OPENCODE_API_KEY
    key_field: OPENCODE_API_KEY
    # ZDR only until the vendor agreement end (docs page, monthly renewal).
    zero_data_retention_expires: "{{ llm_router_opencode_deepseek_zdr_expiry }}"

  - client_model_id: opencode/longcat-2.5-preview-free
    upstream_model_id: longcat-2.5-preview-free
    provider: openai
    tier: opencode
    in_free_route: true
    enabled: false
    rpm: 20
    tpm: 150000
    credential_env: OPENCODE_API_KEY
    key_field: OPENCODE_API_KEY
    # Not on the docs page; disabled. Kept non-ZDR until verified.
    zero_data_retention: false

  - client_model_id: opencode/cat-jam-free
    upstream_model_id: cat-jam-free
    provider: openai
    tier: opencode
    in_free_route: true
    enabled: false
    rpm: 20
    tpm: 150000
    credential_env: OPENCODE_API_KEY
    key_field: OPENCODE_API_KEY
    # Not on the docs page; disabled. Kept non-ZDR until verified.
    zero_data_retention: false

  - client_model_id: opencode/muse-spark-1.3-contributor
    upstream_model_id: muse-spark-1.3-contributor
    provider: openai
    tier: opencode
    in_free_route: true
    enabled: true
    catalog_limit_overrides: [context_window, max_output_tokens]
    context_window: 917504
    max_output_tokens: 131072
    api_mode: responses
    rpm: 20
    tpm: 150000
    credential_env: OPENCODE_API_KEY
    key_field: OPENCODE_API_KEY
    # OpenCode Go docs privacy table: model training on request data, not ZDR.
    zero_data_retention: false
