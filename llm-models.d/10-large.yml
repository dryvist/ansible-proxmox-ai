---
# Mac serving tier plus the local complexity router that fronts it.
# One slice of the model registry; see llm-models.d/README.md.
_llm_registry_large:
  # ── large tier ──────────────────────────────────────────────────────────────
  # A servable entry's own `max_parallel_requests` mirrors that model's host
  # effectiveConcurrency (nix-ai programs.mlx.modelConcurrencyLimits) — the
  # in-flight ceiling the serving gate actually launched that worker with, so
  # the router never offers a backend more than it admits. Absent, an entry
  # falls back to the tier-wide llm_router_local_max_parallel_requests
  # (roles/llm_router/defaults/main/60-ops.yml) instead — set explicitly here
  # because it is per-MODEL truth, not a router policy choice, and a future
  # concurrency change on one host (a nix-ai edit) should be a one-line bump
  # here, not a router-wide default change that silently affects every other
  # model too. Disabled = unadvertised until normal registry probes pass.
  - client_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    upstream_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    provider: openai
    tier: large
    enabled: false
    context_window: 32768

  # NOT SERVED (404, verified 2026-08-14) — re-enable once a backend answers.
  - client_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 32768
    hints:
      speed: fast
      quality: strong
      best_for: [code-edit, refactor, boilerplate]
      # Malformed tool calls under agentic load (RANKINGS.md: 0-67% valid at
      # concurrency 4, multi-turn degrades at round 1). Single-stream it is
      # clean and the fastest coder measured here. Delegate code edits one at
      # a time; do not make it the tool-calling brain.
      caveats: [tool-calls-degrade-above-one-stream]
      measured: { tok_s: 136.7, date: 2026-07-11, source: mlx-benchmarks }

  # Primary model; selection rationale: docs/.
  - client_model_id: mlx-community/Qwen3.8-27B-4bit
    upstream_model_id: mlx-community/Qwen3.8-27B-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    servable: true
    # Mirrors this host's effectiveConcurrency (nix-ai) as of 2026-09-02:
    # every resident large-tier worker runs --decode-concurrency 1
    # --prompt-concurrency 1 (roles/llm_router/defaults/main/60-ops.yml).
    max_parallel_requests: 1
    serving_role: primary
    stable_aliases:
      - tool-calling
      - interim-brain
      - best
      # A5: git synonym of `best`, replacing the DB-only `lead` role (its
      # entry in llm_router_role_deployments, 55-roles.yml, is removed in
      # the same change) — both names already targeted this same entry, so
      # the swap changes nothing a caller of either name observes.
      - lead
    hints:
      speed: slow
      quality: strong
      best_for: [review, reasoning, deliberate-edit]
      caveats: [long-prefill]
      measured: { tok_s: 17.7, date: 2026-08-30, source: mlx-benchmarks }

  # THE ROUTINE TIER — second warm model, resident beside the primary; also
  # the universal judge since 2026-08-15. docs/LLM_MODELS_REGISTRY_NOTES.md.
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 65536
    servable: true
    # Mirrors this host's effectiveConcurrency (nix-ai) as of 2026-09-02:
    # every resident large-tier worker runs --decode-concurrency 1
    # --prompt-concurrency 1 (roles/llm_router/defaults/main/60-ops.yml).
    max_parallel_requests: 1
    serving_role: routine
    stable_aliases:
      - goal-judge
    # `judge` is deliberately NOT added here yet: llm_router_role_deployments
    # (55-roles.yml) already seeds a live DB role named `judge` pointing at
    # this same entry, and unlike `lead`/`ocr` this collision is NOT purely
    # cosmetic to fix — "judge" (and cheap/embed/ocr, tried in the same A5
    # pass) also collides with common-word literals throughout
    # tests/hermes_agent/*.py (goal-mode cron fixtures, assignee defaults)
    # that have nothing to do with this registry, discovered via
    # test_registry_retype_scan.py exploding on the attempt. Fixing that is a
    # cross-cutting rename sweep outside this PR's scope — see the PR body
    # and Vikunja follow-up.
    hints:
      speed: fast
      quality: strong
      best_for: [summarize, extract, classify, judge, tool-calling]
      measured: { tok_s: 56.0, date: 2026-09-01, source: mlx-benchmarks }

  # THE SMALL TIER — on-demand 9B, trivial-task tier an hourly note-capture
  # pipe calls by id (held goal-judge until 2026-08-15). docs/LLM_MODELS_REGISTRY_NOTES.md.
  - client_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    provider: openai
    tier: large
    enabled: true
    context_window: 32768
    servable: true
    # Mirrors this host's effectiveConcurrency (nix-ai) as of 2026-09-02:
    # every resident large-tier worker runs --decode-concurrency 1
    # --prompt-concurrency 1 (roles/llm_router/defaults/main/60-ops.yml).
    max_parallel_requests: 1
    serving_role: small
    # `fast` and `cheap` are deliberately NOT added here yet. The
    # tests/hermes_agent job-name collision `fast` originally had is fixed
    # (renamed to "watchdog-fast"), but a SECOND, unrelated collision
    # surfaced once it entered the protected alias set:
    # tests/llm_router/test_registry_hints_projection.yml's own
    # `_hint_speeds: [fast, medium, slow]` vocabulary fixture (hints.speed,
    # a different field, same word) — genuinely unavoidable without renaming
    # that vocabulary. `cheap` collides the same way `judge`/`embed`/`ocr`
    # do (common words in tests/hermes_agent/*.py unrelated to this
    # registry). All four deferred together; see the A5 PR body.
    # `subagent` retargets onto THIS entry at the role_deployments layer
    # (55-roles.yml — same target as `cheap`, was a dedicated ≥1M-context
    # OpenRouter entry, now `long`, llm-models.d/50-openrouter.yml) but is
    # not added as a stable_alias yet either, for the same reason.
    hints:
      speed: fast
      quality: routine
      best_for: [classify, extract, short-summary]
      # The 32k window above is enforced pre-call: a large transcript is
      # refused here rather than truncated. Send it a slice, not a session.
      caveats: [small-window]
      measured: { tok_s: 68.5, date: 2026-07-11, source: mlx-benchmarks }

  - client_model_id: mlx-community/Unlimited-OCR-bf16
    upstream_model_id: mlx-community/Unlimited-OCR-bf16
    provider: openai
    tier: large
    enabled: true
    context_window: 32768
    servable: true
    # Mirrors this host's effectiveConcurrency (nix-ai) as of 2026-09-02:
    # every resident large-tier worker runs --decode-concurrency 1
    # --prompt-concurrency 1 (roles/llm_router/defaults/main/60-ops.yml).
    max_parallel_requests: 1
    serving_role: ocr
    stable_aliases:
      - Unlimited OCR
    # `ocr` is deliberately NOT added here yet. Unlike `lead` (a pure
    # naming-transport swap, safe to do unconditionally — see 55-roles.yml),
    # `serving_role: ocr` on THIS SAME entry already spells the literal
    # 'ocr' in llm_router_ocr_model's own selectattr('serving_role',
    # 'equalto', 'ocr') (55-roles.yml) — a structural field collision the
    # retype scan correctly flags the moment 'ocr' also becomes a protected
    # alias value, on top of the same common-word collisions `judge` hit.
    # Deferred with them.
    hints:
      speed: medium
      quality: routine
      best_for: [ocr]

  # Context/sampling data retained while disabled.
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }
    standby: true
    hints:
      speed: fast
      quality: strong
      best_for: [tool-calling, agentic-multi-turn, judge]
      # Leads the agentic grid (100% valid, clean 20/20) ONLY with thinking on
      # and the repetition-penalty guardrail above; with production sampling
      # defaults the 4-bit quant degenerates into repetition loops.
      caveats: [needs-thinking-on, needs-repetition-penalty]

  # NOT SERVED — re-enable once a backend serves this id and checks pass.
  - client_model_id: mlx-community/Qwen3-Next-80B-A3B-Thinking-4bit
    upstream_model_id: mlx-community/Qwen3-Next-80B-A3B-Thinking-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 32768
    extra_body: { repetition_penalty: 1.05 }

  # NOT SERVED (404, verified 2026-08-14) — formerly ai_default_model; re-enable once a backend answers.
  - client_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 65536
    extra_body: { repetition_penalty: 1.05 }

  # Both below: NOT SERVED (404, verified 2026-08-14) — re-enable once a backend answers.
  - client_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: false
    context_window: 65536

  - client_model_id: mlx-community/Qwen3.6-27B-mxfp4
    upstream_model_id: mlx-community/Qwen3.6-27B-mxfp4
    provider: openai
    tier: large
    enabled: false
    context_window: 65536

  # Local complexity router; targets derive from serving_role entries.
  - client_model_id: hermes-default
    upstream_model_id: complexity_router
    litellm_model_name: auto_router/complexity_router
    provider: auto_router
    tier: hermes-router
    enabled: true
    context_window: 65536
    max_output_tokens: 8192
    # Not `servable` (it dispatches, it never answers directly) — admitted as
    # an alias target by llm_router_alias_pairs' hermes-router carve-out, see
    # roles/llm_router/defaults/main/50-servable.yml.
    stable_aliases:
      - default
