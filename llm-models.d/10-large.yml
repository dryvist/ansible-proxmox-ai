---
# Mac serving tier plus the local complexity router that fronts it.
# One slice of the model registry; see llm-models.d/README.md.
_llm_registry_large:
  # ── large tier ──────────────────────────────────────────────────────────────
  # Per-model concurrency and context/output caps come from the shared
  # homelab-contracts catalog. Disabled = unadvertised until normal registry
  # probes pass.
  - client_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    upstream_model_id: mlx-community/gpt-oss-120b-MXFP4-Q8
    provider: openai
    tier: large
    enabled: false

  # OLD (2026-10-07); Qwen3 coder generation is superseded by the runnable Qwen4Exp generation.
  # Facts: architecture `qwen3_moe`; released 2025-07-22; open weights yes, Apache-2.0;
  # 30.5B total / 3.3B active. Runnable quant: MLX 4-bit 17.2 GB.
  # Successor: Qwen3.8-Flash-Next (2026-08-26), Qwen4Exp, 125B main + 51B n-gram =
  # 176B per QwenLM; HF model-size metadata says 180B; 6B active.
  # MLX OptiQ 2-bit 80.8 GB with SSD streaming.
  # Evidence: https://huggingface.co/Qwen/Qwen3-Coder-30B-A3B-Instruct
  # https://huggingface.co/mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
  # https://huggingface.co/mlx-community/Qwen3.8-Flash-Next-OptiQ-2bit
  - client_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: false
    lifecycle: old
    hints:
      speed: fast
      quality: strong
      best_for: [code-edit, refactor, boilerplate]
      # Malformed tool calls under agentic load (RANKINGS.md: 0-67% valid at
      # concurrency 4, multi-turn degrades at round 1). Single-stream it is
      # clean and the fastest coder measured here. Delegate code edits one at
      # a time; do not make it the tool-calling brain.
      caveats: [tool-calls-degrade-above-one-stream]
      measured: { tok_s: 136.7, date: 2026-07-11, source: mlx-benchmarks }

  # OLD (2026-10-07); formerly the primary model in this route.
  # Facts: architecture `qwen3_5` hybrid dense; Qwen3.8 generation; released 2026-08-14;
  # open weights yes, Apache-2.0; 27B (HF size metadata: 28B).
  # Runnable quant: MLX 4-bit 16.1 GB (loaded).
  # Successor: Qwen3.8-Flash-Next, Qwen4Exp (2026-08-26), 125B main + 51B n-gram =
  # 176B per QwenLM (HF metadata: 180B) / 6B active; MLX OptiQ 2-bit 80.8 GB
  # with SSD streaming and mlx-optiq >= 0.5.14.
  # Evidence: https://github.com/QwenLM/Qwen3.8/blob/main/README.md
  # https://huggingface.co/Qwen/Qwen3.8-27B
  # https://huggingface.co/mlx-community/Qwen3.8-27B-4bit
  # https://huggingface.co/mlx-community/Qwen3.8-Flash-Next-OptiQ-2bit
  - client_model_id: mlx-community/Qwen3.8-27B-4bit
    upstream_model_id: mlx-community/Qwen3.8-27B-4bit
    provider: openai
    tier: large
    enabled: false
    lifecycle: old
    servable: true
    # Mirrors this host's effectiveConcurrency (nix-ai) as of 2026-09-02:
    # every resident large-tier worker runs --decode-concurrency 1
    # --prompt-concurrency 1 (roles/llm_router/defaults/main/60-ops.yml).
    serving_role: primary
    stable_aliases:
      - tool-calling
      - interim-brain
      - best
      - lead
      # Temporary bridge while the mapped routine model is parked. Move this
      # alias back with the routine model after the serving-host rebuild.
      - goal-judge
    hints:
      speed: slow
      quality: strong
      best_for: [review, reasoning, deliberate-edit]
      caveats: [long-prefill]
      measured: { tok_s: 17.7, date: 2026-08-30, source: mlx-benchmarks }

  # Parked until the serving-host rebuild publishes the declared resident
  # model. The `standby` state keeps this catalogued while it is unavailable.
  - client_model_id: mlx-community/MiMo-V2.6-Distill-Qwen-9B-OptiQ-4bit
    upstream_model_id: mlx-community/MiMo-V2.6-Distill-Qwen-9B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: false
    serving_role: routine
    standby: true
    hints:
      speed: fast
      quality: routine
      best_for: [classify, extract, short-summary, judge]
      # The 32k window is enforced pre-call: a large transcript is refused
      # here rather than truncated. Send it a slice, not a session.
      caveats: [small-window]

  # Retired from the Mac serving set by the canonical role map; kept disabled
  # so the id stays catalogued until the synonym release ends.
  # OLD (2026-10-07); Qwen3.6 is superseded by the runnable Qwen4Exp generation.
  # Facts: architecture `qwen3_5_moe`; released 2026-04-16; open weights yes, Apache-2.0;
  # 35B total / 3B active. Runnable quant: MLX 4-bit 20.4 GB; OptiQ 4-bit 24.7 GB.
  # Successor: Qwen3.8-Flash-Next (2026-08-26), Qwen4Exp, 125B main + 51B n-gram =
  # 176B per QwenLM (HF metadata: 180B) / 6B active;
  # MLX OptiQ 2-bit 80.8 GB with SSD streaming.
  # Evidence: https://huggingface.co/Qwen/Qwen3.6-35B-A3B
  # https://huggingface.co/mlx-community/Qwen3.8-Flash-Next-OptiQ-2bit
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-4bit
    provider: openai
    tier: large
    enabled: false
    lifecycle: old

  # OLD (2026-10-07); Qwen3.5 is superseded by the runnable Qwen4Exp generation.
  # Facts: architecture `qwen3_5` hybrid dense; released 2026-03-02; open weights yes,
  # Apache-2.0; 9B. Runnable quant: MLX 4-bit 5.95 GB (former served variant).
  # Successor: Qwen3.8-Flash-Next (2026-08-26), Qwen4Exp, 125B main + 51B n-gram =
  # 176B per QwenLM (HF metadata: 180B) / 6B active;
  # MLX OptiQ 2-bit 80.8 GB with SSD streaming.
  # Evidence: https://github.com/QwenLM/Qwen3.8/blob/main/README.md
  # https://huggingface.co/Qwen/Qwen3.5-9B
  # https://huggingface.co/mlx-community/Qwen3.8-Flash-Next-OptiQ-2bit
  - client_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    provider: openai
    tier: large
    enabled: false
    lifecycle: old

  - client_model_id: mlx-community/Unlimited-OCR-bf16
    upstream_model_id: mlx-community/Unlimited-OCR-bf16
    provider: openai
    tier: large
    enabled: true
    servable: true
    # Mirrors this host's effectiveConcurrency (nix-ai) as of 2026-09-02:
    # every resident large-tier worker runs --decode-concurrency 1
    # --prompt-concurrency 1 (roles/llm_router/defaults/main/60-ops.yml).
    serving_role: ocr
    stable_aliases:
      - Unlimited OCR
    # `ocr` is deliberately NOT added here yet. Unlike `lead` (a pure
    # naming-transport swap, safe to do unconditionally — see 55-roles.yml),
    # `serving_role: ocr` on THIS SAME entry already spells the literal
    # 'ocr' in llm_router_ocr_model's own selectattr('serving_role',
    # 'equalto', 'ocr') (55-roles.yml) — a structural field collision the
    # retype scan correctly flags the moment 'ocr' also becomes a protected
    # alias value, on top of the same common-word collisions `judge` hit.
    # Deferred with them.
    hints:
      speed: medium
      quality: routine
      best_for: [ocr]

  # OLD (2026-10-07); Qwen3.6 is superseded by the runnable Qwen4Exp generation.
  # Facts: architecture `qwen3_5_moe`; released 2026-04-16; open weights yes, Apache-2.0;
  # 35B total / 3B active. Runnable quant: MLX 4-bit 20.4 GB; OptiQ 4-bit 24.7 GB.
  # Successor: Qwen3.8-Flash-Next (2026-08-26), Qwen4Exp, 125B main + 51B n-gram =
  # 176B per QwenLM (HF metadata: 180B) / 6B active;
  # MLX OptiQ 2-bit 80.8 GB with SSD streaming.
  # Evidence: https://huggingface.co/Qwen/Qwen3.6-35B-A3B
  # https://huggingface.co/mlx-community/Qwen3.8-Flash-Next-OptiQ-2bit
  - client_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: false
    lifecycle: old
    extra_body: { repetition_penalty: 1.05 }
    standby: true
    hints:
      speed: fast
      quality: strong
      best_for: [tool-calling, agentic-multi-turn, judge]
      # Leads the agentic grid (100% valid, clean 20/20) ONLY with thinking on
      # and the repetition-penalty guardrail above; with production sampling
      # defaults the 4-bit quant degenerates into repetition loops.
      caveats: [needs-thinking-on, needs-repetition-penalty]

  # OLD (2026-10-07); Qwen3-Next is superseded by Qwen3.8-Flash-Next's Qwen4Exp generation.
  # Facts: architecture Qwen3-Next MoE; released 2025-09-11; open weights yes, Apache-2.0;
  # 80B total / 3B active.
  # Runnable quant: MLX 4-bit, 44.8 GB. Successor: Qwen3.8-Flash-Next-OptiQ-2bit,
  # Qwen4Exp (2026-08-26, open weights, 176B per QwenLM / 180B HF metadata, 6B active),
  # MLX OptiQ 2-bit, 80.8 GB.
  # Successor runtime: mlx-optiq >= 0.5.14, `optiq serve`, SSD streaming.
  # Evidence: https://qwen.ai/blog?id=qwen3-next
  # https://huggingface.co/mlx-community/Qwen3.8-Flash-Next-OptiQ-2bit
  - client_model_id: mlx-community/Qwen3-Next-80B-A3B-Thinking-4bit
    upstream_model_id: mlx-community/Qwen3-Next-80B-A3B-Thinking-4bit
    provider: openai
    tier: large
    enabled: false
    lifecycle: old
    extra_body: { repetition_penalty: 1.05 }

  # OLD (2026-10-07); Qwen3-Next is superseded by Qwen3.8-Flash-Next's Qwen4Exp generation.
  # Facts: architecture Qwen3-Next MoE; released 2025-09-11; open weights yes, Apache-2.0;
  # 80B total / 3B active.
  # Runnable quant: MLX 4-bit, 44.8 GB. Successor: Qwen3.8-Flash-Next-OptiQ-2bit,
  # Qwen4Exp (2026-08-26, open weights, 176B per QwenLM / 180B HF metadata, 6B active),
  # MLX OptiQ 2-bit, 80.8 GB.
  # Successor runtime: mlx-optiq >= 0.5.14, `optiq serve`, SSD streaming.
  # Evidence: https://qwen.ai/blog?id=qwen3-next
  # https://huggingface.co/mlx-community/Qwen3.8-Flash-Next-OptiQ-2bit
  - client_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    upstream_model_id: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    provider: openai
    tier: large
    enabled: false
    lifecycle: old
    extra_body: { repetition_penalty: 1.05 }

  # OLD (2026-10-07); Qwen3.5 is superseded by the runnable Qwen4Exp generation.
  # Facts: architecture `qwen3_5` hybrid dense; released 2026-03-02; open weights yes,
  # Apache-2.0; 9B. Runnable quant: MLX 4-bit 5.95 GB. This OptiQ ID is 404
  # as of 2026-08-14; an OptiQ quant size/runnable artifact is unverified.
  # Successor: Qwen3.8-Flash-Next (2026-08-26), Qwen4Exp, 125B main + 51B n-gram =
  # 176B per QwenLM (HF metadata: 180B) / 6B active;
  # MLX OptiQ 2-bit 80.8 GB with SSD streaming.
  # This OptiQ registry ID was not served (404, verified 2026-08-14).
  - client_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    upstream_model_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    provider: openai
    tier: large
    enabled: false
    lifecycle: old

  # OLD (2026-10-07); Qwen3.6 is superseded by the runnable Qwen4Exp generation.
  # Facts: architecture `qwen3_5`; released 2026-04-22; open weights yes, Apache-2.0; 27B dense.
  # Runnable quant: MLX 4-bit 16.1 GB, OptiQ 4-bit 20.0 GB, MXFP4 15.3 GB.
  # Successor: Qwen3.8-Flash-Next (2026-08-26), Qwen4Exp, 125B main + 51B n-gram =
  # 176B per QwenLM (HF metadata: 180B) / 6B active;
  # MLX OptiQ 2-bit 80.8 GB with SSD streaming.
  # Evidence: https://huggingface.co/Qwen/Qwen3.6-27B
  # https://huggingface.co/mlx-community/Qwen3.8-Flash-Next-OptiQ-2bit
  - client_model_id: mlx-community/Qwen3.6-27B-mxfp4
    upstream_model_id: mlx-community/Qwen3.6-27B-mxfp4
    provider: openai
    tier: large
    enabled: false
    lifecycle: old

  # Declared in the shared server swap set, but their Stage 0 inference
  # engines are not router backends. Keep them parked until they are routable.
  - client_model_id: nativ-community/embeddinggemma-2-mxfp8
    upstream_model_id: nativ-community/embeddinggemma-2-mxfp8
    provider: openai
    tier: large
    enabled: false
    standby: true

  - client_model_id: manjunathshiva/opendecider-nano
    upstream_model_id: manjunathshiva/opendecider-nano
    provider: openai
    tier: large
    enabled: false
    standby: true

  - client_model_id: convaiinnovations/laya-typed-decisions
    upstream_model_id: convaiinnovations/laya-typed-decisions
    provider: openai
    tier: large
    enabled: false
    standby: true

  # Local complexity router; targets derive from serving_role entries.
  - client_model_id: hermes-default
    upstream_model_id: complexity_router
    litellm_model_name: auto_router/complexity_router
    provider: auto_router
    tier: hermes-router
    enabled: true
    # Not `servable` (it dispatches, it never answers directly) — admitted as
    # an alias target by llm_router_alias_pairs' hermes-router carve-out, see
    # roles/llm_router/defaults/main/50-servable.yml.
    stable_aliases:
      - default
      - auto
