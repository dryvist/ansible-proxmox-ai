---
# The dedicated small-capability endpoint. Its client name comes from
# route_group; the backend model id and quant are registry/catalog inputs.
_llm_registry_local_gpu:
  # Eligibility requires an explicit input and the pre-render serving probe.
  - client_model_id: qwen3.5-9b
    upstream_model_id: qwen3.5-9b
    artifact_id: qwen35-9b-q4-k-m
    catalog_profile: small-c4-64k
    provider: openai
    tier: vllm
    enabled: false
    enabled_var: llm_router_4080_profiles_enabled
    servable: true
    route_group: small
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    order: 1
    probe_before_render: true
    first_byte_timeout: 10
    hints:
      speed: moderate
      quality: routine
      best_for: [classification, coding, tool-use]
