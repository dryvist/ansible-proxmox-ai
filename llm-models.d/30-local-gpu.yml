---
# The NVIDIA guest, and the Hermes fallback rung over the same backend.
# One slice of the model registry; see llm-models.d/README.md.
_llm_registry_local_gpu:
  # ── NVIDIA GPU tier ─────────────────────────────────────────────────────────
  # Tier key stays `vllm` (names the ROUTER TIER/URL, not the engine) — this
  # guest serves via llama.cpp on Vulkan, not vLLM; no vLLM role exists (see
  # inventory/group_vars/llm_vllm_group.yml for why Vulkan serves it). Must
  # match llama-swap's name in inventory/group_vars/llm_vllm_group.yml.
  # Window/timeout anchors; guest derives too. Why: llm_vllm_group.yml.
  - client_model_id: qwen3.8-27b
    upstream_model_id: qwen3.8-27b
    provider: openai
    tier: vllm
    enabled: true
    context_window: &ctx4080 32768
    hints:
      speed: slow
      quality: strong
      best_for: [review, reasoning]
      # Serial lane on one card: no batching, one measured completion ~190 s.
      caveats: [serial-lane]

  # THE CODING RUNG on the same card, added BESIDE the general model rather
  # than replacing it: the entry above is the Hermes chain's local rung and
  # answers general work, and swapping a coder in there would have degraded
  # every non-coding fallback to buy coding throughput. The card serves one
  # model at a time and llama-swap swaps between them.
  #
  # 16384, not the 32768 above, and that is arithmetic rather than caution.
  # This model bears KV on all 48 layers at 96 KiB/token against the dense
  # entry's 64 KiB, so the same window would cost a gigabyte more KV on top of
  # ~900 MiB more weights — against a card with 2307 MiB free at the measured
  # 32768 cell. Half the window keeps it inside the envelope that was actually
  # measured. RAISE IT ONLY BEHIND A FRESH MEASUREMENT on the card, and if it
  # does not fit at all, step the quant to UD-Q2_K_XL and record the number
  # that forced it — never cut the window to hide an OOM.
  - client_model_id: qwen3-coder-30b
    upstream_model_id: qwen3-coder-30b
    provider: openai
    tier: vllm
    enabled: true
    context_window: 16384
    hints:
      speed: medium
      quality: strong
      best_for: [code-edit, refactor, boilerplate]
      # Serial lane on one card (no batching), and this model's tool calls
      # degrade beyond a single stream. Both point the same way: one request
      # at a time.
      caveats: [serial-lane, tool-calls-degrade-above-one-stream]

  # Local backup rung in the Hermes chain, same backend as the vllm entry.
  # tier: hermes-local, NOT vllm — load-bearing: the cloud projection drops
  # entries with no credential, and a local leg has none. Details: docs/LLM_MODELS_REGISTRY_NOTES.md.
  # NO fallback chain of its own, deliberately. This is a RUNG inside
  # hermes-default's chain, not an entry point: when it fails, the chain that
  # named it moves to the next rung, and giving it one here would nest a second
  # chain inside the first, drawing on the same shared max_fallbacks budget.
  #
  # The router logs "No fallback model group found for original
  # model_group=hermes-local-4080" on each failure. THAT LINE MEANS TWO
  # DIFFERENT THINGS AND CANNOT TELL YOU WHICH. It is emitted at every fallback
  # depth, and it records none:
  #
  #   * at depth > 0 (reached as a rung) the raise that follows is caught by
  #     the enclosing walk, which advances — the design working, not a gap;
  #   * at depth 0 (something called this id DIRECTLY) the same raise is
  #     terminal and the caller gets the error.
  #
  # So the line's presence is not evidence either way, and "give it a chain only
  # if something starts calling it directly" is a condition this log cannot
  # reveal. To separate them, count the "Falling back to model_group =
  # hermes-local-4080" line that precedes every rung attempt and never precedes
  # a direct call, or read the x-litellm-attempted-fallbacks response header.
  # Both are INFO-level, so confirm the proxy's log level admits INFO before
  # reading a zero count as an answer.
  #
  # This rung is SLOW, not hung. One measured completion came back in ~190 s,
  # and the request/stream timeouts below bound it at 300 s, after which the
  # chain moves on. A caller that gives up sooner than that will see no answer
  # from this rung and should not read that as a hang.
  - client_model_id: hermes-local-4080
    upstream_model_id: qwen3.8-27b
    provider: openai
    tier: hermes-local
    route_group: hermes-local-4080
    fallback_group: hermes-local-4080
    enabled: true
    context_window: *ctx4080
    num_retries: 0
    request_timeout: &to4080 300
    stream_timeout: *to4080
    allowed_fails: 50
    # 0 is the intent, not the observed behaviour: the proxy still parks this
    # deployment 30s after repeated timeouts, self-clearing. Do not widen
    # allowed_fails instead — it was never the binding constraint.
    cooldown_time: 0
    hints:
      speed: slow
      quality: strong
      best_for: [review, reasoning]
      caveats: [serial-lane]
