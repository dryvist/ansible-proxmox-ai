---
# The dedicated small-capability endpoint. Its client name comes from
# route_group; the backend model id and quant are registry/catalog inputs.
_llm_registry_local_gpu:
  # Eligibility requires an explicit input and the pre-render serving probe.
  - client_model_id: qwen3.5-9b-4080
    upstream_model_id: qwen3.5-9b-4080
    artifact_id: qwen35-9b-q4-k-m
    catalog_profile: small-c2-32k
    provider: openai
    tier: vllm
    enabled: false
    enabled_var: llm_router_4080_profiles_enabled
    servable: true
    route_group: small
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    order: 1
    probe_before_render: true
    # Admission probe timeout only (52-probe.yml, verify-servable.yml); stream_timeout is set separately.
    first_byte_timeout: 30
    hints:
      speed: moderate
      quality: routine
      best_for: [classification, coding, tool-use]

  - client_model_id: glm-ocr
    upstream_model_id: glm-ocr
    artifact_id: glm-ocr-q8-0
    provider: openai
    tier: vllm
    enabled: true
    servable: true
    serving_role: ocr
    supports_vision: true
    route_group: glm-ocr
    order: 1
    catalog_limit_overrides: [context_window]
    context_window: 16384
    input_cost_per_token: 0
    output_cost_per_token: 0
    probe_before_render: true
    first_byte_timeout: 30
    hints:
      speed: moderate
      quality: routine
      best_for: ["dense-layout image text"]
