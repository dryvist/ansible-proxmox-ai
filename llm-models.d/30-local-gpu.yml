---
# The dedicated small-capability endpoint. Its client name comes from
# route_group; the backend model id and quant are registry/catalog inputs.
_llm_registry_local_gpu:
  - client_model_id: mimo-9b
    upstream_model_id: mimo-9b
    artifact_id: mimo-9b-q4-k-m
    provider: openai
    tier: vllm
    enabled: true
    servable: true
    route_group: small
    order: 1
    stable_aliases:
      - fast
      - cheap
      - goal-judge
    probe_before_render: true
    first_byte_timeout: 10
    hints:
      speed: moderate
      quality: routine
      best_for: [classification, coding, tool-use]
