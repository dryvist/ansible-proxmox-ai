---
- name: Validate release proxy endpoints from published inventory
  hosts: localhost
  gather_facts: false
  vars:
    tofu_data: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../inventory_load/tofu_inventory.json') | from_json }}
  tasks:
    - name: Load the shared release settings
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/llamacpp_release/defaults/main/00-release.yml"

    - name: Require the published endpoint list
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../roles/llamacpp_release/tasks/require-proxy.yml"

    - name: Verify both FQDN endpoints and the client proxy value
      ansible.builtin.assert:
        that:
          - llamacpp_release_proxy_urls | length == 2
          - llamacpp_release_proxy_urls[0] == 'http://cache-a.example.com:3142'
          - llamacpp_release_proxy_urls[1] == 'http://cache-b.example.com:3142'
          - llamacpp_release_proxy_url == llamacpp_release_proxy_urls[0]
          - llamacpp_release_proxy_environment.https_proxy == llamacpp_release_proxy_urls[0]
        quiet: true
