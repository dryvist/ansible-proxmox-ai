---
# FIXTURE — deliberately broken, never loaded by a play.
#
# A known-positive control for the regression scan in
# ../test_env_guards_actually_fire.yml. The scan asserts the real tree contains
# zero dead guards; on its own, that assertion also passes when the scan is
# broken and searches nothing. Pointing the same command at this file proves the
# pattern and the tooling still match a guard that IS dead.
#
# Both spellings below, because the multi-line form is the one a single-line
# grep misses and the one most real sites used.
fixture_single_line: "{{ lookup('env', 'FIXTURE_UNSET_A') | mandatory('never fires') }}"
fixture_multi_line: >-
  {{ lookup('env', 'FIXTURE_UNSET_B')
     | mandatory('never fires either') }}
