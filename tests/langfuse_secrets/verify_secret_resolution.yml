---
# Contract: the values that decrypt Langfuse's stored data resolve
# secret-store-first, fall back to the guest's own files, and NEVER silently
# resolve to empty.
#
# Offline and render-time on purpose. The failure this guards is invisible at
# runtime — an empty or freshly generated key produces a stack that starts, a
# UI that loads, and stored credentials that can never be read again, with no
# error raised anywhere. A live probe would report it healthy.
- name: Verify Langfuse application-secret resolution
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    langfuse_docker_generated_secrets:
      - { name: nextauth_secret, file: .nextauth_secret, length: 48, hex: false }
      - { name: salt, file: .salt, length: 48, hex: false }
      - { name: encryption_key, file: .encryption_key, length: 32, hex: true }

    # Stand-in for the slurp results: the on-guest files. `salt` is deliberately
    # absent (an unreadable path is expected when the store supplies the value).
    langfuse_test_slurps:
      results:
        - item: { name: nextauth_secret }
          content: "ZnJvbS1ndWVzdC1uZXh0YXV0aA=="   # from-guest-nextauth
        - item: { name: salt }
        - item: { name: encryption_key }
          content: "ZnJvbS1ndWVzdC1lbmNyeXB0aW9u"   # from-guest-encryption

    # The store supplies salt and encryption_key; nextauth_secret is not stored.
    langfuse_docker_secret_overrides:
      nextauth_secret: ""
      salt: "from-store-salt"
      encryption_key: "from-store-encryption"

  tasks:
    - name: Reset the resolved-secret accumulator
      ansible.builtin.set_fact:
        langfuse_docker_secrets: {}

    - name: Resolve each secret (same expression as the role)
      ansible.builtin.set_fact:
        langfuse_docker_secrets: >-
          {{ langfuse_docker_secrets | combine({item.item.name: _langfuse_docker_resolved}) }}
      vars:
        _langfuse_docker_override: >-
          {{ langfuse_docker_secret_overrides[item.item.name] | default('', true) }}
        _langfuse_docker_resolved: >-
          {{ _langfuse_docker_override
             if _langfuse_docker_override | length > 0
             else (item.content | default('') | b64decode | trim) }}
      loop: "{{ langfuse_test_slurps.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Assert the store wins and the guest file is the fallback
      ansible.builtin.assert:
        that:
          # Stored value present -> it wins, even when a guest file also exists.
          - langfuse_docker_secrets.encryption_key == 'from-store-encryption'
          # Stored value present, no guest file -> still resolves.
          - langfuse_docker_secrets.salt == 'from-store-salt'
          # No stored value -> the guest's existing value is preserved, NOT
          # replaced. This is the case that must never mint something new.
          - langfuse_docker_secrets.nextauth_secret == 'from-guest-nextauth'
        fail_msg: "resolved: {{ langfuse_docker_secrets }}"
        success_msg: "store-first with guest fallback confirmed"
        quiet: true

    - name: Assert every declared secret resolved non-empty
      ansible.builtin.assert:
        that:
          - langfuse_docker_secrets[item.name] | default('', true) | length > 0
        fail_msg: "'{{ item.name }}' resolved empty"
        quiet: true
      loop: "{{ langfuse_docker_generated_secrets }}"
      loop_control:
        label: "{{ item.name }}"

    # The guard itself must fail when it should. Without this the suite above
    # passes just as happily against a role that resolves everything to empty.
    - name: Resolve with neither a stored value nor a guest file
      ansible.builtin.set_fact:
        langfuse_test_empty: >-
          {{ ('' if ('' | length > 0) else ('' | default('') | b64decode | trim)) }}

    - name: Assert that case is detected as empty, not passed over
      ansible.builtin.assert:
        that:
          - langfuse_test_empty | default('', true) | length == 0
        fail_msg: >-
          A secret with no stored value and no guest file did not resolve empty,
          so the role's non-empty assert would never fire.
        quiet: true
