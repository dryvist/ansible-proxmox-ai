---
# The serving-floor contract: a declared floor is complete, and a registry
# entry marked servable must carry one.
- name: Verify the profile floor assertions
  hosts: localhost
  gather_facts: false
  vars:
    _complete_floor:
      concurrency: 8
      input_len: 8192
      output_len: 256
      min_tok_s_per_agent: 20
      max_ttft_p90_ms: 8000
      evidence: accepted-measurement-reference
  tasks:
    - name: Declare the profiles under test
      ansible.builtin.set_fact:
        llm_profiles:
          alpha: {}
        llm_gpu_serving_registry_by_profile:
          alpha:
            servable: false
    - name: A profile without a floor and a registry entry that is not servable pass
      ansible.builtin.include_role:
        name: llm_gpu_serving
        tasks_from: assert-profile-floors.yml

    - name: Declare the profiles under test
      ansible.builtin.set_fact:
        llm_profiles:
          alpha:
            floor: "{{ _complete_floor }}"
        llm_gpu_serving_registry_by_profile:
          alpha:
            servable: true
    - name: A complete floor on a servable entry passes
      ansible.builtin.include_role:
        name: llm_gpu_serving
        tasks_from: assert-profile-floors.yml

    - name: A servable entry without a floor is refused
      block:
        - name: Declare the profiles under test
          ansible.builtin.set_fact:
            llm_profiles:
              alpha: {}
            llm_gpu_serving_registry_by_profile:
              alpha:
                servable: true
        - name: Include the floor assertions
          ansible.builtin.include_role:
            name: llm_gpu_serving
            tasks_from: assert-profile-floors.yml
        - name: Fail when the assertion did not refuse
          ansible.builtin.fail:
            msg: A servable entry without a floor was accepted.
      rescue:
        - name: Require the floor message
          ansible.builtin.assert:
            that: "'is not set' in ansible_failed_result.results[0].msg"
            quiet: true

    - name: A floor missing the measured TTFT bound is refused
      block:
        - name: Declare the profiles under test
          ansible.builtin.set_fact:
            llm_profiles:
              alpha:
                floor: >-
                  {{ _complete_floor | dict2items
                     | rejectattr('key', 'equalto', 'max_ttft_p90_ms') | items2dict }}
            llm_gpu_serving_registry_by_profile:
              alpha:
                servable: false
        - name: Include the floor assertions
          ansible.builtin.include_role:
            name: llm_gpu_serving
            tasks_from: assert-profile-floors.yml
        - name: Fail when the assertion did not refuse
          ansible.builtin.fail:
            msg: A partial floor was accepted.
      rescue:
        - name: Require the incomplete-floor message
          ansible.builtin.assert:
            that: "'incomplete' in ansible_failed_result.results[0].msg"
            quiet: true

    - name: A floor with no evidence reference is refused
      block:
        - name: Declare the profiles under test
          ansible.builtin.set_fact:
            llm_profiles:
              alpha:
                floor: "{{ _complete_floor | combine({'evidence': ''}) }}"
            llm_gpu_serving_registry_by_profile:
              alpha:
                servable: false
        - name: Include the floor assertions
          ansible.builtin.include_role:
            name: llm_gpu_serving
            tasks_from: assert-profile-floors.yml
        - name: Fail when the assertion did not refuse
          ansible.builtin.fail:
            msg: A floor without evidence was accepted.
      rescue:
        - name: Require the incomplete-floor message
          ansible.builtin.assert:
            that: "'incomplete' in ansible_failed_result.results[0].msg"
            quiet: true
