---
# CI check for inventory/load_tofu.yml: loads the committed sample fixture
# (pinned via TOFU_INVENTORY_PATH) and asserts the tag -> group mapping,
# tofu_data propagation, and the hostname fact all behave.
#
# Run locally:
#   TOFU_INVENTORY_PATH=$PWD/tests/inventory_load/tofu_inventory.json \
#     ansible-playbook tests/inventory_load/verify_inventory.yml \
#     -i inventory/hosts.yml -c local

- name: Load inventory under test
  import_playbook: ../../inventory/load_tofu.yml

- name: Verify inventory groups and facts
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
  tasks:
    - name: Assert every AI tag mapped to its group
      ansible.builtin.assert:
        that:
          - "'qdrant' in groups['qdrant_group']"
          - "'llamaindex' in groups['llamaindex_group']"
          - "'llm-router-1' in groups['llm_router_group']"
          - "'llm-fast' in groups['llm_fast_group']"
          - "'hermes-agent' in groups['hermes_agent_group']"
          - "'open-webui' in groups['open_webui_group']"
          - "'langfuse' in groups['langfuse_group']"
          - "'phoenix' in groups['phoenix_group']"
          - "'agentgateway' in groups['agentgateway_group']"
          - "'dify' in groups['dify_group']"
          - "'dify' in groups['ai_orchestration_group']"
          - "'squid' in groups['squid_group']"
          - "'hermes-ui' in groups['hermes_ui_group']"
          - groups['lxc_containers'] | length == 15
        fail_msg: "tag -> group mapping in inventory/load_tofu.yml is broken"

    - name: Assert tofu_data was propagated to a dynamic host
      ansible.builtin.assert:
        that:
          - hostvars['qdrant'].tofu_data is defined
          - hostvars['qdrant'].tofu_data.constants.vector_db_ports.qdrant_http == '6333'
          - hostvars['qdrant'].tofu_data.domain == 'example.com'
        fail_msg: "tofu_data was not propagated to dynamically-added hosts"

    - name: Assert the hostname fact and derived connection vars
      ansible.builtin.assert:
        that:
          - hostvars['hermes-agent'].hostname == 'hermes-agent'
          # ssh-override guest: direct ssh to its own FQDN, not the node
          - hostvars['hermes-agent'].ansible_host == 'hermes-agent.example.com'
          - hostvars['hermes-agent'].ansible_connection == 'ssh'
          - hostvars['hermes-agent'].container_ip == 'hermes-agent.example.com'
          - hostvars['hermes-agent'].container_reserved_ip == '192.0.2.15'
          # ssh-override guest: llm-router-1 (of the llm-router-1/2/3 set)
          - hostvars['llm-router-1'].ansible_host == 'llm-router-1.example.com'
          - hostvars['llm-router-1'].ansible_connection == 'ssh'
          # non-override guest: pct-exec-via-node stays the default, and it
          # keeps its proxmox_vmid (regression: only ssh-connected guests omit it)
          - hostvars['qdrant'].ansible_host == 'proxmox1.example.com'
          - hostvars['qdrant'].ansible_connection == 'community.proxmox.proxmox_pct_remote'
          - hostvars['qdrant'].proxmox_vmid == 101101
          # tag-allowlist guest with a distinct fqdn: fqdn wins over the raw ip
          - hostvars['llm-vllm-1'].ansible_connection == 'ssh'
          - hostvars['llm-vllm-1'].ansible_host == 'llm-vllm-1.example.com'
          - hostvars['llm-vllm-1'].proxmox_vmid is not defined
          # tofu-proxmox contract field (ansible_connection: ssh), non-qualifying
          # tags: both fixture guests declare ssh, but *.example.com never
          # resolves in CI, so the real wait_for probe genuinely times out for
          # both and load_tofu_ssh_ready excludes them. Both fall back to
          # pct_remote with the node-derived host, exactly like a guest with
          # no contract field at all — the probe gate must never hand
          # Ansible an ssh connection nothing answers.
          - hostvars['contract-ssh-1'].ansible_connection == 'community.proxmox.proxmox_pct_remote'
          - hostvars['contract-ssh-1'].ansible_host == 'proxmox1.example.com'
          - hostvars['contract-ssh-1'].proxmox_vmid == 101114
          - hostvars['contract-ssh-2'].ansible_connection == 'community.proxmox.proxmox_pct_remote'
          - hostvars['contract-ssh-2'].ansible_host == 'proxmox1.example.com'
          - hostvars['contract-ssh-2'].proxmox_vmid == 101115
        fail_msg: "per-host facts (hostname/ansible_host/container_*) are wrong"

    - name: Assert the tofu-published models mount path fact
      ansible.builtin.assert:
        that:
          - hostvars['llm-fast'].container_models_mount_path == '/var/lib/llm'
          - hostvars['qdrant'].container_models_mount_path == ''
        fail_msg: >-
          container_models_mount_path must carry tofu's published
          containers[*].models_mount_path for a guest that has one, and an
          empty string (never a stale default) for a guest that does not.
