---
- name: Verify empty and populated agent rosters preserve legacy host identity
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
    roster_fixture:
      roster-test:
        container: squid
        hostname: roster-test.example.com
        display: Roster Test
        purpose: Inventory fixture
        owns: [fixture-system]
        router_key_class: standard
  tasks:
    - name: Add an explicit empty roster to the fixture
      ansible.builtin.set_fact:
        tofu_data: "{{ tofu_data | combine({'agents': {}}) }}"

    - name: Reapply inventory projection with an empty roster
      ansible.builtin.import_tasks: ../../inventory/load_tofu/add_lxc_host_inventory.yml

    - name: Assert an empty roster leaves legacy groups and identity unchanged
      ansible.builtin.assert:
        that:
          - groups['hermes_agent_group'] | sort == ['hermes-agent']
          - hostvars['hermes-agent'].hermes_agent_identity == 'hermes'

    - name: Add a fixture roster entry for an untagged container
      ansible.builtin.set_fact:
        tofu_data: "{{ tofu_data | combine({'agents': roster_fixture}) }}"

    - name: Reapply inventory projection with the populated roster
      ansible.builtin.import_tasks: ../../inventory/load_tofu/add_lxc_host_inventory.yml

    - name: Propagate the populated roster to its fixture host
      ansible.builtin.set_fact:
        tofu_data: "{{ tofu_data }}"
      delegate_to: squid
      delegate_facts: true

    - name: Assert the roster binds its container to its agent identity
      ansible.builtin.assert:
        that:
          - "'squid' in groups['hermes_agent_group']"
          - "'squid' in groups['managed_secrets_group']"
          - hostvars['squid'].hermes_agent_identity == 'roster-test'
          - hostvars['hermes-agent'].hermes_agent_identity == 'hermes'
          - hostvars['squid'].ai_agent_by_container['squid'] == 'roster-test'
          - hostvars['squid'].ai_agent_owner['fixture-system'] == 'roster-test'
          - "hostvars['squid'].ai_callers['roster-test'] == {'trust_tier': ''}"
          - hostvars['squid'].ai_agent_gateway_key_fields['roster-test'] == 'roster_test_agentgateway_key'

    - name: Add a synthetic Pepper guest with both required tags
      ansible.builtin.set_fact:
        tofu_data: >-
          {{ tofu_data | combine({'containers': tofu_data.containers | combine({
               'fixture-pepper': tofu_data.containers['hermes-agent']
                 | combine({'tags': ['hermes-agent', 'hermes-pepper']})})}) }}

    - name: Project the Pepper fixture into inventory
      ansible.builtin.import_tasks: ../../inventory/load_tofu/add_lxc_host_inventory.yml

    - name: Pepper resolves to its own identity in the Hermes connection group
      ansible.builtin.assert:
        quiet: true
        that:
          - hostvars['fixture-pepper'].hermes_agent_identity == 'pepper'
          - "'fixture-pepper' in groups['hermes_agent_group']"

    - name: Add a synthetic isolated guest bound to a roster agent
      ansible.builtin.set_fact:
        tofu_data: >-
          {{ tofu_data | combine({
               'agents': tofu_data.agents | combine({'iso-agent': roster_fixture['roster-test']
                 | combine({'container': 'fixture-isolated', 'hostname': 'iso-agent.example.com', 'owns': []})}),
               'containers': tofu_data.containers | combine({
                 'fixture-isolated': tofu_data.containers['hermes-agent']
                   | combine({'tags': ['hermes-agent', 'hermes-isolated']})})}) }}

    - name: Project the isolated fixture into inventory
      ansible.builtin.import_tasks: ../../inventory/load_tofu/add_lxc_host_inventory.yml

    - name: An isolated guest takes its roster identity and the isolated posture
      ansible.builtin.assert:
        quiet: true
        that:
          - hostvars['fixture-isolated'].hermes_agent_identity == 'iso-agent'
          - hostvars['fixture-isolated'].hermes_agent_isolated | bool
          - hostvars['fixture-pepper'].hermes_agent_isolated | bool
          - not (hostvars['hermes-agent'].hermes_agent_isolated | bool)
          - "'fixture-isolated' in groups['hermes_agent_group']"

    - name: Add a synthetic GPU guest that declares its lane
      ansible.builtin.set_fact:
        tofu_data: >-
          {{ tofu_data | combine({'containers': tofu_data.containers | combine({
               'fixture-gpu-lane': tofu_data.containers['hermes-agent']
                 | combine({'tags': ['llm-gpu'], 'llm_gpu_accelerator': 'gpu-primary'})})}) }}

    - name: Project the GPU lane fixture into inventory
      ansible.builtin.import_tasks: ../../inventory/load_tofu/add_lxc_host_inventory.yml

    - name: A declared GPU lane outranks the legacy group's label
      ansible.builtin.assert:
        quiet: true
        that:
          - "'fixture-gpu-lane' in groups['llm_gpu_legacy_group']"
          - hostvars['fixture-gpu-lane'].llm_gpu_accelerator == 'gpu-primary'

    - name: Reject an isolated guest the roster does not name
      block:
        - name: Add an isolated guest with no roster agent
          ansible.builtin.set_fact:
            tofu_data: >-
              {{ tofu_data | combine({'containers': tofu_data.containers | combine({
                   'fixture-isolated-orphan': tofu_data.containers['hermes-agent']
                     | combine({'tags': ['hermes-agent', 'hermes-isolated']})})}) }}
        - name: Attempt the orphan projection
          ansible.builtin.include_tasks: ../../inventory/load_tofu/add_lxc_host_inventory.yml
        - name: Record an incorrectly accepted orphan
          ansible.builtin.set_fact:
            _isolated_orphan_accepted: true
      rescue:
        - name: Confirm the identity tag guard refused the orphan
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Reject conflicting or unrecognized Hermes identity markers'
        - name: Drop the orphan fixture
          ansible.builtin.set_fact:
            tofu_data: >-
              {{ tofu_data | combine({'containers': tofu_data.containers | dict2items
                 | rejectattr('key', 'equalto', 'fixture-isolated-orphan') | items2dict}, recursive=false) }}

    - name: Confirm the orphan isolated guest was refused
      ansible.builtin.assert:
        that:
          - not (_isolated_orphan_accepted | default(false))

    - name: Reject conflicting Pepper identity markers
      block:
        - name: Pollute Pepper with a second identity marker
          ansible.builtin.set_fact:
            tofu_data: >-
              {{ tofu_data | combine({'containers': tofu_data.containers | combine({
                   'fixture-pepper': tofu_data.containers['fixture-pepper']
                     | combine({'tags': ['hermes-agent', 'hermes-pepper', 'hermes-donna']})})}) }}
        - name: Attempt conflicting identity projection
          ansible.builtin.include_tasks: ../../inventory/load_tofu/add_lxc_host_inventory.yml
        - name: Record an incorrectly accepted identity conflict
          ansible.builtin.set_fact:
            _pepper_conflict_accepted: true
      rescue:
        - name: Confirm the identity tag guard rejected the projection
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Reject conflicting or unrecognized Hermes identity markers'

    - name: Confirm conflicting identity tags were refused
      ansible.builtin.assert:
        that:
          - not (_pepper_conflict_accepted | default(false))
