---
# Pins the dify_docker web API URL contract: SSR uses the Compose API service,
# while browser-facing console and app requests keep the public Traefik URL.
#
# Run from the repository root with PROXMOX_SUBDOMAIN set:
#   ansible-playbook tests/dify_docker/test_compose_ssr_api_url.yml -i localhost, -c local
- name: Verify the dify_docker server-side and browser API URLs
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
    _template: "{{ playbook_dir }}/../../roles/dify_docker/templates/docker-compose.yml.j2"
  tasks:
    - name: Load shared wait and execution budgets
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../inventory/group_vars/all/00-core.yml"

    - name: Load the role defaults as they ship
      ansible.builtin.import_tasks: _load_defaults.yml

    - name: Set fixture values for secrets and external configuration
      ansible.builtin.set_fact:
        ai_agent_default_concurrency: 2
        ai_orchestration_otel_endpoint: "http://otel.example.invalid:4318"
        dify_docker_data_dir: /tmp/dify-ssr-api-render
        dify_docker_web_port: "38080"
        dify_docker_postgres_port: "35432"
        dify_docker_redis_port: "36379"
        dify_docker_secret_key: fixture-secret-key
        dify_docker_db_password: fixture-db-password
        dify_docker_redis_password: fixture-redis-password
        dify_docker_sandbox_api_key: fixture-sandbox-key
        dify_docker_weaviate_api_key: fixture-weaviate-key
        dify_docker_plugin_daemon_key: fixture-plugin-daemon-key
        dify_docker_inner_api_key: fixture-inner-api-key
        dify_docker_agent_api_token: fixture-agent-api-token
        dify_docker_agent_server_secret_key: fixture-agent-server-secret
        dify_docker_agent_local_sandbox_auth_token: fixture-agent-sandbox-token
        dify_docker_model_endpoint_url: "http://llm.example.invalid/v1"
        dify_docker_model_api_key: fixture-model-api-key

    - name: Render the Compose document
      ansible.builtin.set_fact:
        _rendered: "{{ lookup('ansible.builtin.template', _template) | from_yaml }}"

    - name: Render the SSRF proxy configuration
      ansible.builtin.set_fact:
        _ssrf_squid: >-
          {{ lookup('ansible.builtin.template', playbook_dir ~
             '/../../roles/dify_docker/templates/squid.conf.j2') }}

    - name: Render the dedicated Agent SSRF proxy configuration
      ansible.builtin.set_fact:
        _agent_squid: >-
          {{ lookup('ansible.builtin.template', playbook_dir ~
             '/../../roles/dify_docker/templates/squid-agent.conf.j2') }}

    - name: Apply batch runtime defaults to every Celery participant
      ansible.builtin.assert:
        quiet: true
        that:
          - _rendered.services[item].environment.WORKFLOW_MAX_EXECUTION_TIME == '45600'
          - _rendered.services[item].environment.WORKFLOW_MAX_EXECUTION_STEPS == '5000'
          - _rendered.services[item].environment.CELERY_BROKER_VISIBILITY_TIMEOUT == '49200'
          - _rendered.services[item].environment.GUNICORN_TIMEOUT == '45600'
          - _rendered.services[item].environment.PLUGIN_DAEMON_TIMEOUT == '45600'
          - _rendered.services[item].environment.CELERY_WORKER_AMOUNT == '2'
          - _rendered.services[item].environment.CELERY_AUTO_SCALE == 'false'
          - _rendered.services[item].environment.ENABLE_WORKFLOW_SCHEDULE_POLLER_TASK == 'true'
          - _rendered.services[item].environment.ENABLE_TRIGGER_PROVIDER_REFRESH_TASK == 'true'
          - _rendered.services[item].environment.TRIGGER_URL == _rendered.services['web'].environment.APP_API_URL
      loop: [api, worker, worker_beat]

    - name: Share the Dify 1.19 Ops trace queue across API, workers, and Beat
      ansible.builtin.assert:
        quiet: true
        that:
          - _rendered.services[item].environment.OPS_TRACE_QUEUE == 'ops_trace_v2'
          - _rendered.services[item].environment.OPS_TRACE_EXPORT_MAX_ATTEMPTS == '6'
          - _rendered.services[item].environment.ENABLE_TRACE_PAYLOAD_SWEEP_TASK == 'true'
          - _rendered.services[item].environment.APP_PACKAGE_MAX_WORKFLOW_TOOLS == '20'
          - _rendered.services[item].environment.GUNICORN_KEEP_ALIVE == '10'
      loop: [api, worker, worker_beat]

    - name: Export native telemetry with full sampling on API and plugin services
      ansible.builtin.assert:
        quiet: true
        that:
          - _rendered.services[item].environment.ENABLE_OTEL == 'true'
          - _rendered.services[item].environment.OTEL_EXPORTER_TYPE == 'otlp'
          - _rendered.services[item].environment.OTLP_BASE_ENDPOINT == ai_orchestration_otel_endpoint
          - _rendered.services[item].environment.OTEL_EXPORTER_OTLP_PROTOCOL == 'http/protobuf'
          - _rendered.services[item].environment.OTEL_SAMPLING_RATE == '1.0'
      loop: [api, worker, worker_beat, plugin_daemon]

    - name: Export Agent platform spans and native app-attributed trajectories
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _rendered.services['agent_backend'].environment.OTEL_EXPORTER_OTLP_ENDPOINT
            == ai_orchestration_otel_endpoint
          - _rendered.services['agent_backend'].environment.OTEL_EXPORTER_OTLP_PROTOCOL == 'http/protobuf'
          - _rendered.services['agent_backend'].environment.DIFY_AGENT_TRAJECTORY_ENABLED == 'true'
          - >-
            _rendered.services['agent_backend'].environment.DIFY_AGENT_TRAJECTORY_OTLP_TRACES_ENDPOINT
            == ai_orchestration_otel_endpoint ~ '/v1/traces'
          - _rendered.services['agent_backend'].environment.DIFY_AGENT_TRAJECTORY_INCLUDE_CONTENT == 'false'
          - _rendered.services['agent_backend'].environment.LOGFIRE_CONSOLE == 'false'

    - name: Apply the batch plugin budget to daemon execution and callbacks
      ansible.builtin.assert:
        quiet: true
        that:
          - _rendered.services['plugin_daemon'].environment.PLUGIN_MAX_EXECUTION_TIMEOUT == '45600'
          - _rendered.services['plugin_daemon'].environment.DIFY_INVOCATION_CONNECTION_IDLE_TIMEOUT == '45600'
          - _rendered.services['plugin_daemon'].environment.DIFY_BACKWARDS_INVOCATION_READ_TIMEOUT == '45600000'
          - >-
            'proxy_read_timeout 45600s;' in lookup('ansible.builtin.template', playbook_dir ~
            '/../../roles/dify_docker/templates/nginx-default.conf.j2')
          - >-
            'proxy_send_timeout 45600s;' in lookup('ansible.builtin.template', playbook_dir ~
            '/../../roles/dify_docker/templates/nginx-default.conf.j2')

    - name: Persist Redis queued messages on its data mount
      ansible.builtin.assert:
        quiet: true
        that:
          - "'--appendonly yes' in _rendered.services['redis'].command"
          - "(dify_docker_data_dir ~ '/redis:/data') in _rendered.services['redis'].volumes"

    - name: Route native webhook requests to the API
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            ('location /triggers {\n        proxy_pass http://api:' ~ dify_docker_api_port ~ ';')
            in lookup('ansible.builtin.template', playbook_dir ~
            '/../../roles/dify_docker/templates/nginx-default.conf.j2')

    - name: Allow only the internal webhook origin through the SSRF proxy
      ansible.builtin.assert:
        quiet: true
        that:
          - "'acl dst_dify_trigger dstdomain nginx' in _ssrf_squid"
          - "'acl path_trigger_webhook urlpath_regex -i ^/triggers/webhook/' in _ssrf_squid"
          # The origin is the internal trigger base's host, so an override cannot
          # drift from the squid allow; the default host is a real Compose service.
          - "'nginx' in _rendered.services"
          # The carve-out precedes the private-destination deny: nginx resolves
          # to a Compose address that deny would otherwise refuse.
          - >-
            _ssrf_squid.index('http_access allow dst_dify_trigger path_trigger_webhook')
            < _ssrf_squid.index('http_access deny to_private_networks')
          # The origin is never allowed without the webhook path prefix.
          - >-
            _ssrf_squid.splitlines() | select('match', '^http_access allow dst_dify_trigger')
            | list == ['http_access allow dst_dify_trigger path_trigger_webhook']
          # Every private range stays denied and no blanket allow exists.
          - "'dst 10.0.0.0/8' in _ssrf_squid"
          - "'dst 172.16.0.0/12' in _ssrf_squid"
          - "'dst 192.168.0.0/16' in _ssrf_squid"
          - "'http_access deny to_private_networks' in _ssrf_squid.splitlines()"
          - "'http_access allow all' not in _ssrf_squid.splitlines()"
          - "_ssrf_squid.splitlines() | select('match', '^http_access ') | list | last == 'http_access deny all'"

    - name: SSR uses the internal API while browser URLs remain public
      ansible.builtin.assert:
        quiet: true
        that:
          - _rendered.services['web'].environment.SERVER_CONSOLE_API_URL == 'http://api:5001'
          - _rendered.services['web'].environment.CONSOLE_API_URL == 'https://dify.pve.example.test'
          - _rendered.services['web'].environment.APP_API_URL == 'https://dify.pve.example.test'
        fail_msg: >-
          The web service must route server-side console API requests to the
          internal Compose API and retain public browser API URLs.

    - name: Agent backend and local sandbox use authenticated Dify 1.19 runtime wiring
      ansible.builtin.assert:
        quiet: true
        that:
          - _rendered.services['api'].environment.AGENT_BACKEND_BASE_URL == 'http://agent_backend:5050'
          - _rendered.services['api'].environment.AGENT_BACKEND_API_TOKEN == 'fixture-agent-api-token'
          - _rendered.services['api'].environment.RESPECT_XFORWARD_HEADERS_ENABLED == 'true'
          - _rendered.services['api'].environment.get('PASSWORD_PEPPER') is none
          - _rendered.services['worker'].environment.get('PASSWORD_PEPPER') is none
          - _rendered.services['worker'].environment.AGENT_BACKEND_BASE_URL == 'http://agent_backend:5050'
          - _rendered.services['worker'].environment.AGENT_BACKEND_API_TOKEN == 'fixture-agent-api-token'
          - "'agent_backend' in _rendered.services['api'].depends_on"
          - "'agent_backend' in _rendered.services['worker'].depends_on"
          - >-
            _rendered.services['agent_backend'].environment.DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN
            == 'fixture-agent-sandbox-token'
          - _rendered.services['agent_backend'].environment.DIFY_AGENT_API_TOKEN == 'fixture-agent-api-token'
          - >-
            _rendered.services['agent_backend'].environment.DIFY_AGENT_SERVER_SECRET_KEY
            == 'fixture-agent-server-secret'
          - _rendered.services['local_sandbox'].command[-1] == '--require-auth-token'
          - _rendered.services['local_sandbox'].environment.SHELLCTL_AUTH_TOKEN == 'fixture-agent-sandbox-token'
          - "'dify_agent_local_sandbox_home:/home/dify' in _rendered.services['local_sandbox'].volumes"
          - "'dify_agent_local_sandbox_workspace:/workspace' in _rendered.services['local_sandbox'].volumes"
          - _rendered.services['agent_ssrf_proxy'].image == _rendered.services['ssrf_proxy'].image
          - _rendered.services['agent_backend'].networks == ['default', 'agent_sandbox_network']
          - _rendered.services['local_sandbox'].networks == ['agent_sandbox_network', 'local_sandbox_proxy_network']
          - _rendered.services['agent_ssrf_proxy'].networks == ['default', 'local_sandbox_proxy_network']
          - _rendered.services['agent_ssrf_proxy'].volumes | length == 1
          - _rendered.services['agent_ssrf_proxy'].volumes[0].endswith(':/etc/squid/squid.conf:ro')
          - _rendered.networks['agent_sandbox_network'].internal
          - _rendered.networks['local_sandbox_proxy_network'].internal
          - "'http_access allow dst_agent_backend path_agent_stub' in _agent_squid"
          - "'http_access allow dst_dify_api path_files' in _agent_squid"
          - "'http_access deny to_private_networks' in _agent_squid"
          # Every ssrf_proxy private-destination ACL is inherited by the Agent proxy.
          - >-
            (lookup('ansible.builtin.template', playbook_dir ~ '/../../roles/dify_docker/templates/squid.conf.j2')
             .splitlines() | select('match', '^acl to_private_networks dst ') | list
             | difference(_agent_squid.splitlines())) == []
          - _agent_squid.splitlines() | select('match', '^acl to_private_networks dst ') | list | length >= 14
          # Only the inherited Compose-network clients may use the Agent proxy; everything else is denied.
          - >-
            (lookup('ansible.builtin.template', playbook_dir ~ '/../../roles/dify_docker/templates/squid.conf.j2')
             .splitlines() | select('match', '^acl client_localnet src ') | list
             | difference(_agent_squid.splitlines())) == []
          - "_agent_squid.splitlines() | select('match', '^http_access ') | list | last == 'http_access deny all'"
          - "'http_access allow all' not in _agent_squid.splitlines()"
        fail_msg: >-
          Dify 1.19 Agent services must use non-empty auth, an isolated local
          sandbox network, and the existing pinned Squid image.

    - name: Preserve an existing PASSWORD_PEPPER when configured
      ansible.builtin.set_fact:
        dify_docker_password_pepper: fixture-password-pepper

    - name: Render Compose with the existing PASSWORD_PEPPER
      ansible.builtin.set_fact:
        _rendered_with_password_pepper: "{{ lookup('ansible.builtin.template', _template) | from_yaml }}"

    - name: Keep PASSWORD_PEPPER on the API and worker when configured
      ansible.builtin.assert:
        quiet: true
        that:
          - _rendered_with_password_pepper.services['api'].environment.PASSWORD_PEPPER == 'fixture-password-pepper'
          - _rendered_with_password_pepper.services['worker'].environment.PASSWORD_PEPPER == 'fixture-password-pepper'

    - name: Supply runtime input overrides
      ansible.builtin.set_fact:
        dify_docker_workflow_max_execution_time: 50000
        dify_docker_workflow_max_execution_steps: 7500
        dify_docker_plugin_max_execution_timeout: 45000
        dify_docker_celery_worker_amount: 3
        dify_docker_workflow_schedule_poller_enabled: false
        dify_docker_trigger_provider_refresh_enabled: false
        dify_docker_trigger_url: "https://triggers.example.invalid"
        dify_docker_internal_trigger_url: "http://dify:80"
        dify_docker_otel_endpoint: "https://cribl.example.invalid"
        dify_docker_otel_sampling_rate: 0.25
        dify_docker_redis_appendonly: false

    - name: Render runtime overrides
      ansible.builtin.set_fact:
        _overridden: "{{ lookup('ansible.builtin.template', _template) | from_yaml }}"

    - name: Render the SSRF proxy configuration under overrides
      ansible.builtin.set_fact:
        _overridden_squid: >-
          {{ lookup('ansible.builtin.template', playbook_dir ~
             '/../../roles/dify_docker/templates/squid.conf.j2') }}

    - name: Keep the public TRIGGER_URL out of the SSRF proxy carve-out
      ansible.builtin.assert:
        quiet: true
        that:
          # The squid origin follows dify_docker_internal_trigger_url, not the
          # public trigger URL: the internal override moves the allow.
          - "'acl dst_dify_trigger dstdomain dify' in _overridden_squid"
          - "'dstdomain triggers.example.invalid' not in _overridden_squid"
          - "'http_access deny to_private_networks' in _overridden_squid.splitlines()"

    - name: Honor runtime inputs across API and Celery services
      ansible.builtin.assert:
        quiet: true
        that:
          - _overridden.services[item].environment.WORKFLOW_MAX_EXECUTION_TIME == '50000'
          - _overridden.services[item].environment.WORKFLOW_MAX_EXECUTION_STEPS == '7500'
          - _overridden.services[item].environment.CELERY_BROKER_VISIBILITY_TIMEOUT == '53600'
          - _overridden.services[item].environment.GUNICORN_TIMEOUT == '50000'
          - _overridden.services[item].environment.PLUGIN_DAEMON_TIMEOUT == '45000'
          - _overridden.services['plugin_daemon'].environment.PLUGIN_MAX_EXECUTION_TIMEOUT == '45000'
          - _overridden.services['plugin_daemon'].environment.DIFY_INVOCATION_CONNECTION_IDLE_TIMEOUT == '45000'
          - _overridden.services['plugin_daemon'].environment.DIFY_BACKWARDS_INVOCATION_READ_TIMEOUT == '45000000'
          - _overridden.services[item].environment.CELERY_WORKER_AMOUNT == '3'
          - _overridden.services[item].environment.GRAPH_ENGINE_MAX_WORKERS == '2'
          - _overridden.services[item].environment.ENABLE_WORKFLOW_SCHEDULE_POLLER_TASK == 'false'
          - _overridden.services[item].environment.ENABLE_TRIGGER_PROVIDER_REFRESH_TASK == 'false'
          - _overridden.services[item].environment.TRIGGER_URL == dify_docker_trigger_url
          - "'--appendonly no' in _overridden.services['redis'].command"
      loop: [api, worker, worker_beat]

    - name: Honor telemetry endpoint and sampling inputs across API and plugin services
      ansible.builtin.assert:
        quiet: true
        that:
          - _overridden.services[item].environment.OTLP_BASE_ENDPOINT == dify_docker_otel_endpoint
          - _overridden.services[item].environment.OTEL_SAMPLING_RATE == '0.25'
      loop: [api, worker, worker_beat, plugin_daemon]

    - name: Derive both Agent exporters from the overridden collector endpoint
      ansible.builtin.assert:
        quiet: true
        that:
          - _overridden.services['agent_backend'].environment.OTEL_EXPORTER_OTLP_ENDPOINT == dify_docker_otel_endpoint
          - >-
            _overridden.services['agent_backend'].environment.DIFY_AGENT_TRAJECTORY_OTLP_TRACES_ENDPOINT
            == dify_docker_otel_endpoint ~ '/v1/traces'

    - name: Supply an explicit broker visibility timeout
      ansible.builtin.set_fact:
        dify_docker_celery_broker_visibility_timeout: 60000

    - name: Render the explicit broker visibility timeout
      ansible.builtin.set_fact:
        _broker_overridden: "{{ lookup('ansible.builtin.template', _template) | from_yaml }}"

    - name: Honor the explicit broker visibility timeout on every Celery participant
      ansible.builtin.assert:
        quiet: true
        that:
          - _broker_overridden.services[item].environment.CELERY_BROKER_VISIBILITY_TIMEOUT == '60000'
      loop: [api, worker, worker_beat]
