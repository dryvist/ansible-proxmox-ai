---
# Pins the dify_docker SSRF proxy carve-out for rotation webhook dispatch: only
# the internal trigger origin, on its own port, for one webhook id path, passes
# before the private-destination deny.
#
# Run from the repository root with PROXMOX_SUBDOMAIN set:
#   ansible-playbook tests/dify_docker/test_ssrf_trigger_carveout.yml -i localhost, -c local
- name: Verify the dify_docker SSRF proxy webhook carve-out
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
    _template: "{{ playbook_dir }}/../../roles/dify_docker/templates/docker-compose.yml.j2"
  tasks:
    - name: Load shared wait and execution budgets
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../inventory/group_vars/all/00-core.yml"

    - name: Load the role defaults as they ship
      ansible.builtin.import_tasks: _load_defaults.yml

    - name: Set fixture values for secrets and external configuration
      ansible.builtin.import_tasks: _fixtures.yml

    - name: Render the Compose document
      ansible.builtin.set_fact:
        _rendered: "{{ lookup('ansible.builtin.template', _template) | from_yaml }}"

    - name: Render the SSRF proxy configuration
      ansible.builtin.set_fact:
        _ssrf_squid: >-
          {{ lookup('ansible.builtin.template', playbook_dir ~
             '/../../roles/dify_docker/templates/squid.conf.j2') }}

    - name: Allow only the internal webhook origin through the SSRF proxy
      ansible.builtin.assert:
        quiet: true
        that:
          - "'acl dst_dify_trigger dstdomain nginx' in _ssrf_squid"
          # The port follows the internal trigger base's own port; the default
          # base carries :80 explicitly.
          - "'acl port_dify_trigger port 80' in _ssrf_squid"
          # One webhook id path, end anchored: a bare prefix would let nginx
          # resolve a proxied dot segment onto another location.
          - "'acl path_trigger_webhook urlpath_regex -i ^/triggers/webhook/[A-Za-z0-9_-]+$' in _ssrf_squid"
          - "'acl path_trigger_webhook urlpath_regex -i ^/triggers/webhook/' not in _ssrf_squid.splitlines()"
          - "'http_access allow dst_dify_trigger port_dify_trigger path_trigger_webhook' in _ssrf_squid"
          # The origin is the internal trigger base's host, so an override cannot
          # drift from the squid allow; the default host is a real Compose service.
          - "'nginx' in _rendered.services"
          # The carve-out precedes the private-destination deny: nginx resolves
          # to a Compose address that deny would otherwise refuse.
          - >-
            _ssrf_squid.index('http_access allow dst_dify_trigger')
            < _ssrf_squid.index('http_access deny to_private_networks')
          # The origin is never allowed without its port and the webhook id path.
          - >-
            _ssrf_squid.splitlines() | select('match', '^http_access allow dst_dify_trigger')
            | list == ['http_access allow dst_dify_trigger port_dify_trigger path_trigger_webhook']
          # Every private range stays denied and no blanket allow exists.
          - _ssrf_squid.splitlines() | select('match', '^acl to_private_networks dst ') | list | length >= 8
          - "'http_access deny to_private_networks' in _ssrf_squid.splitlines()"
          - "'http_access allow all' not in _ssrf_squid.splitlines()"
          - "_ssrf_squid.splitlines() | select('match', '^http_access ') | list | last == 'http_access deny all'"

    - name: Match the rendered webhook path ACL against real and traversal paths
      vars:
        _webhook_path_pattern: >-
          {{ _ssrf_squid | regex_findall('^acl path_trigger_webhook urlpath_regex -i (.*)$',
             multiline=True) | first }}
      ansible.builtin.assert:
        quiet: true
        that:
          - _webhook_path_pattern.endswith('$')
          - "'/triggers/webhook/abc123' is match(_webhook_path_pattern)"
          - "'/triggers/webhook/../e/x' is not match(_webhook_path_pattern)"
          - "'/triggers/webhook/a/b' is not match(_webhook_path_pattern)"
          - "'/triggers/webhook/%2e%2e' is not match(_webhook_path_pattern)"

    - name: Point the internal trigger base at another Compose service
      ansible.builtin.set_fact:
        dify_docker_trigger_url: "https://triggers.example.invalid"
        dify_docker_internal_trigger_url: "http://dify"

    - name: Render the SSRF proxy configuration under overrides
      ansible.builtin.set_fact:
        _overridden_squid: >-
          {{ lookup('ansible.builtin.template', playbook_dir ~
             '/../../roles/dify_docker/templates/squid.conf.j2') }}

    - name: Keep the public TRIGGER_URL out of the SSRF proxy carve-out
      ansible.builtin.assert:
        quiet: true
        that:
          # The squid origin follows dify_docker_internal_trigger_url, not the
          # public trigger URL: the internal override moves the allow, and a
          # portless base falls back to the origin's default port 80.
          - "'acl dst_dify_trigger dstdomain dify' in _overridden_squid"
          - "'acl port_dify_trigger port 80' in _overridden_squid"
          - "'http_access allow dst_dify_trigger port_dify_trigger path_trigger_webhook' in _overridden_squid"
          - "'dstdomain triggers.example.invalid' not in _overridden_squid"
          - "'http_access deny to_private_networks' in _overridden_squid.splitlines()"
