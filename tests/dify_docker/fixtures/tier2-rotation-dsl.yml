---
# Test fixture shaped like the tier2-rotation catalog DSL: every roster agent
# ships an EMPTY <AGENT>_TRIGGER_URL/<AGENT>_WEBHOOK_ID variable pair that the
# deployment must seed. The agent names are representative, not the real
# roster — the rotation wiring derives the agent set from these paired
# variables, never from a hard-coded agent list. The rotation knobs and the
# unpaired LEGACY_TRIGGER_URL exist to prove the derivation wires only paired
# agent variables.
kind: app
version: 0.1.5
app:
  name: tier2-rotation
  mode: advanced-chat
workflow:
  environment_variables:
    - id: 58d3f7a1-9c2b-4e6f-8a70-b1d2e3f4a5b6
      name: ROTATION_SPEED
      value: '3'
      value_type: string
    - id: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
      name: ROTATION_OFFSET
      value: '0'
      value_type: string
    - id: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
      name: ROTATION_PAUSED
      value: 'false'
      value_type: string
    - id: 8b9c0d1e-2f3a-4b5c-9d6e-7f8a9b0c1d2e
      name: AI_NEWS_TRIGGER_URL
      value: ''
      value_type: string
    - id: 9c0d1e2f-3a4b-4c5d-8e6f-7a8b9c0d1e2f
      name: AI_NEWS_WEBHOOK_ID
      value: ''
      value_type: secret
    - id: a09c1e2f-3b4c-4d5e-9f6a-7b8c9d0e1f2a
      name: CODE_REVIEW_TRIGGER_URL
      value: ''
      value_type: string
    - id: b10d2f3a-4c5d-4e6f-8a7b-8c9d0e1f2a3b
      name: CODE_REVIEW_WEBHOOK_ID
      value: ''
      value_type: secret
    - id: c21e3a4b-5d6e-4f7a-9b8c-9d0e1f2a3b4c
      name: INCIDENT_BRIEF_TRIGGER_URL
      value: ''
      value_type: string
    - id: d32f4b5c-6e7f-4a8b-8c9d-0e1f2a3b4c5d
      name: INCIDENT_BRIEF_WEBHOOK_ID
      value: ''
      value_type: secret
    - id: e43a5c6d-7f8a-4b9c-9d0e-1f2a3b4c5d6e
      name: LEGACY_TRIGGER_URL
      value: ''
      value_type: string
