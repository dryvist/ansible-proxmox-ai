---
# Fixture values for secrets and external configuration, shared by the dify_docker
# render test playbooks.
- name: Set fixture values for secrets and external configuration
  ansible.builtin.set_fact:
    ai_agent_default_concurrency: 2
    ai_orchestration_otel_endpoint: "http://otel.example.invalid:4318"
    dify_docker_data_dir: /tmp/dify-ssr-api-render
    dify_docker_web_port: "38080"
    dify_docker_postgres_port: "35432"
    dify_docker_redis_port: "36379"
    dify_docker_secret_key: fixture-secret-key
    dify_docker_db_password: fixture-db-password
    dify_docker_redis_password: fixture-redis-password
    dify_docker_sandbox_api_key: fixture-sandbox-key
    dify_docker_weaviate_api_key: fixture-weaviate-key
    dify_docker_plugin_daemon_key: fixture-plugin-daemon-key
    dify_docker_inner_api_key: fixture-inner-api-key
    dify_docker_agent_api_token: fixture-agent-api-token
    dify_docker_agent_server_secret_key: fixture-agent-server-secret
    dify_docker_agent_local_sandbox_auth_token: fixture-agent-sandbox-token
    dify_docker_model_endpoint_url: "http://llm.example.invalid/v1"
    dify_docker_model_api_key: fixture-model-api-key
