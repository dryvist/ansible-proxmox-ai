---
# Pins the dify_docker db_password.yml contract against a real postgres:
#   1. No running db service (first boot): the re-assert is skipped.
#   2. Running db: the role password becomes the configured value, proven by a
#      TCP login with the new password and a refused login with the old one.
#
# Needs docker. Run (from the REPO ROOT):
#   ansible-playbook tests/dify_docker/test_db_password.yml -i localhost, -c local
- name: Verify the dify_docker database password re-assert
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
    dify_docker_data_dir: "{{ lookup('env', 'RUNNER_TEMP') | default('/tmp', true) }}/dify_docker_db_pw"
    dify_docker_db_user: dify
    dify_docker_db_name: dify
    _old: fixture-old-password
    _new: fixture-new-password
  tasks:
    - name: Create the compose project directory
      ansible.builtin.file:
        path: "{{ dify_docker_data_dir }}"
        state: directory
        mode: "0700"

    - name: Write a db-only compose file
      ansible.builtin.copy:
        dest: "{{ dify_docker_data_dir }}/docker-compose.yml"
        mode: "0600"
        content: |
          services:
            db:
              image: postgres:15-alpine
              environment:
                POSTGRES_USER: {{ dify_docker_db_user }}
                POSTGRES_PASSWORD: {{ _old }}
                POSTGRES_DB: {{ dify_docker_db_name }}
              healthcheck:
                test: ["CMD", "pg_isready", "-U", "{{ dify_docker_db_user }}"]
                interval: 2s
                retries: 30

    - name: Run the re-assert with no db running
      ansible.builtin.include_tasks: ../../roles/dify_docker/tasks/db_password.yml
      vars:
        dify_docker_db_password: "{{ _new }}"

    - name: Assert the first-boot case skipped
      ansible.builtin.assert:
        that:
          - dify_docker_db_running.stdout | trim | length == 0

    - name: Start the db
      ansible.builtin.command:
        cmd: docker compose up -d --wait db
        chdir: "{{ dify_docker_data_dir }}"
      changed_when: true

    - name: Run the re-assert with the db running
      ansible.builtin.include_tasks: ../../roles/dify_docker/tasks/db_password.yml
      vars:
        dify_docker_db_password: "{{ _new }}"

    - name: Log in over TCP with each password
      ansible.builtin.command:
        cmd: >-
          docker compose exec -T -e PGPASSWORD={{ item }} db
          psql -h 127.0.0.1 -U {{ dify_docker_db_user }} -d {{ dify_docker_db_name }} -tAc 'select 1'
        chdir: "{{ dify_docker_data_dir }}"
      loop: ["{{ _new }}", "{{ _old }}"]
      register: _logins
      changed_when: false
      failed_when: false

    - name: Assert only the new password is accepted
      ansible.builtin.assert:
        that:
          - _logins.results[0].rc == 0
          - _logins.results[1].rc != 0

    - name: Remove the db
      ansible.builtin.command:
        cmd: docker compose down -v
        chdir: "{{ dify_docker_data_dir }}"
      changed_when: true
