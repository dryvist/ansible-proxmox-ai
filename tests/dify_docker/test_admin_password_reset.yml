---
# Pins the dify_docker login_with_reset.yml contract: a login that succeeds
# outright never touches the account, and a login refused with 401 gets one
# native password reset (fed on stdin) then one retry, using whatever the
# retry actually returned.
#
# Standing up real Dify (db + redis + api + migrations + an already
# provisioned admin) isn't practical here, so the console login and the
# `docker compose exec` reset are both stubbed: a tiny stdlib HTTP server in
# place of Dify's login endpoint, and a fake `docker` on PATH in place of the
# real CLI. Everything else — the ansible.builtin.uri call, its status
# handling, the retry wiring, no_log — is the real task file, unmodified.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/dify_docker/test_admin_password_reset.yml -i localhost, -c local
- name: Verify the dify_docker login/password-reset contract
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
    fixtures_dir: "{{ playbook_dir }}/fixtures"
    work_dir: "{{ lookup('env', 'RUNNER_TEMP') | default('/tmp', true) }}/dify_docker_login_reset"
    dify_docker_admin_email: fixture-admin@example.com
    dify_docker_admin_password: fixture-password
    dify_docker_data_dir: "{{ work_dir }}"
    scenario_a_port: 18321
    scenario_b_port: 18322
  tasks:
    - name: Create the work directory
      ansible.builtin.file:
        path: "{{ work_dir }}"
        state: directory
        mode: "0700"

    - name: Make the fake docker CLI executable
      ansible.builtin.file:
        path: "{{ fixtures_dir }}/docker"
        mode: "0755"

    # --- Scenario A: the login succeeds outright, reset must not run --------
    - name: "Scenario A: pre-mark the account as already correct"
      ansible.builtin.file:
        path: "{{ work_dir }}/a_login_ok"
        state: touch
        mode: "0600"

    - name: "Scenario A: start the fake login server"
      ansible.builtin.shell:
        cmd: >-
          nohup python3 {{ fixtures_dir }}/fake_login_server.py
          {{ work_dir }}/a_login_ok {{ scenario_a_port }}
          > {{ work_dir }}/a_server.log 2>&1 & echo $!
      register: _server_a
      changed_when: false

    - name: "Scenario A: wait for it to accept connections"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ scenario_a_port }}"
        timeout: 10

    - name: "Scenario A: run the real login-with-reset task file"
      environment:
        PATH: "{{ fixtures_dir }}:{{ lookup('env', 'PATH') }}"
        RESET_INVOKED_MARKER: "{{ work_dir }}/a_reset_invoked"
      block:
        - name: "Scenario A: include login_with_reset.yml"
          ansible.builtin.include_tasks: ../../roles/dify_docker/tasks/login_with_reset.yml
          vars:
            dify_docker_web_port: "{{ scenario_a_port }}"

    - name: "Scenario A: stop the fake login server"
      ansible.builtin.command: kill {{ _server_a.stdout | trim }}
      failed_when: false
      changed_when: false

    - name: "Scenario A: assert the login succeeded without a reset"
      ansible.builtin.assert:
        that:
          - dify_docker_console_login.status == 200
          - (work_dir ~ '/a_reset_invoked') is not exists

    # --- Scenario B: the login is refused, reset fixes it, retry succeeds ---
    - name: "Scenario B: start the fake login server (account not yet correct)"
      ansible.builtin.shell:
        cmd: >-
          nohup python3 {{ fixtures_dir }}/fake_login_server.py
          {{ work_dir }}/b_login_ok {{ scenario_b_port }}
          > {{ work_dir }}/b_server.log 2>&1 & echo $!
      register: _server_b
      changed_when: false

    - name: "Scenario B: wait for it to accept connections"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ scenario_b_port }}"
        timeout: 10

    - name: "Scenario B: run the real login-with-reset task file"
      environment:
        PATH: "{{ fixtures_dir }}:{{ lookup('env', 'PATH') }}"
        RESET_INVOKED_MARKER: "{{ work_dir }}/b_reset_invoked"
        LOGIN_OK_MARKER: "{{ work_dir }}/b_login_ok"
      block:
        - name: "Scenario B: include login_with_reset.yml"
          ansible.builtin.include_tasks: ../../roles/dify_docker/tasks/login_with_reset.yml
          vars:
            dify_docker_web_port: "{{ scenario_b_port }}"

    - name: "Scenario B: stop the fake login server"
      ansible.builtin.command: kill {{ _server_b.stdout | trim }}
      failed_when: false
      changed_when: false

    - name: "Scenario B: assert one reset ran and the retry succeeded"
      ansible.builtin.assert:
        that:
          - dify_docker_console_login.status == 200
          - (work_dir ~ '/b_reset_invoked') is exists

    - name: Remove the work directory
      ansible.builtin.file:
        path: "{{ work_dir }}"
        state: absent
