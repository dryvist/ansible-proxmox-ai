---
# Each optional KV path (roles/openbao_secrets 10-domains.yml), and where its
# absence is tolerated. Read by ../test_optional_paths_are_gated.yml; adding an
# optional path without adding it here fails that test's completeness assert.
_gated_optional_paths:
  # Dropped from llm_router_hermes_cloud_models_credentialed, so no model
  # and no env line renders. Covered end to end by
  # tests/llm_router/test_hermes_provider_keys.yml.
  "ai/saas/anthropic": llm_router cloud-model credential gate
  "ai/saas/openai": llm_router cloud-model credential gate
  "ai/saas/gemini": llm_router cloud-model credential gate
  "ai/saas/alibaba": llm_router cloud-model credential gate
  # The Z.ai overflow pair (llm-models.d/45-zai.yml) renders only with
  # its key; without it review-oss stops at the free external rungs.
  "ai/saas/zai": llm_router cloud-model credential gate
  # OpenCode Go tier; see test_free_route_credential_gate_order.yml.
  "ai/saas/opencode": llm_router cloud-model credential gate
  # An empty token omits the sidecar service and the /nautobot route.
  "ai/mcp/nautobot": agentgateway_docker_nautobot_read_token gate
  # The memory sidecar and /memory route wait for the scoped JWT.
  "ai/mcp/qdrant": agentgateway_docker_qdrant_memory_mcp_api_key gate
  # Not yet seeded; phoenix_docker resolves its own values by env and the
  # Cribl role reads the ingest key. Drop this entry once seeded.
  "ai/phoenix": no bao-fact consumer in this repo
  # Per-caller router keys: an empty value is rejected by seed-keys.yml,
  # so an absent path registers nothing. Rendered both ways below.
  "apps/github-actions": llm_router virtual-key empty-value gate
  "apps/github-actions-oss": llm_router virtual-key empty-value gate
  "apps/github-actions-ci-fix": llm_router virtual-key empty-value gate
  "apps/github-actions-pr-review": llm_router virtual-key empty-value gate
  "apps/open-webui": llm_router virtual-key empty-value gate
  "apps/langgraph": llm_router virtual-key empty-value gate
  "apps/agentgateway": llm_router virtual-key empty-value gate
  "apps/dify": llm_router virtual-key empty-value gate
  "apps/llamaindex": llm_router virtual-key empty-value gate
  "apps/langfuse": llm_router virtual-key empty-value gate
  "apps/benchmark": llm_router GPU benchmark key feature gate
  "apps/n8n": llm_router virtual-key empty-value gate
  "apps/zammad": llm_router virtual-key empty-value gate
  "apps/opencode": llm_router virtual-key empty-value gate
  "apps/raycast": llm_router virtual-key empty-value gate
  "apps/codex": llm_router virtual-key empty-value gate
  "apps/cursor": llm_router virtual-key empty-value gate
  "apps/claude-code": llm_router virtual-key empty-value gate
  "apps/litellm-local": llm_router virtual-key empty-value gate
  "apps/litellm-local-workstation": llm_router virtual-key empty-value gate
  "apps/hermes-default": llm_router virtual-key empty-value gate
