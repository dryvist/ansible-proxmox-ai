---
- name: Prove the production Langfuse include uses the controller without inherited become
  vars:
    ansible_become: true
    ansible_become_exe: /usr/bin/false
    orchestration_plays: >-
      {{ lookup('ansible.builtin.file',
                playbook_dir ~ '/../../playbooks/ai-orchestration.yml')
         | from_yaml }}
    langfuse_key_play: >-
      {{ orchestration_plays
         | selectattr('name', 'equalto', 'Configure Langfuse LLM observability') | first }}
    langfuse_key_task: >-
      {{ langfuse_key_play.tasks
         | selectattr('name', 'equalto', 'Provision Langfuse project API keys for Hermes agents')
         | first }}
    langfuse_key_include: "{{ langfuse_key_task['ansible.builtin.include_role'] }}"
  block:
    - name: Require the production include's controller settings and override
      ansible.builtin.assert:
        that:
          - langfuse_key_include.apply.delegate_to == 'localhost'
          - langfuse_key_include.apply.become == false
          - langfuse_key_task.vars.ansible_become == false

    - name: Confirm production apply settings alone inherit the failing become variable
      block:
        - name: Run fixture with the production apply settings and no variable override
          ansible.builtin.include_role:
            name: langfuse_project_keys_controller_probe
            apply:
              delegate_to: "{{ langfuse_key_include.apply.delegate_to }}"
              become: "{{ langfuse_key_include.apply.become }}"
              tags: []
          tags: []
      rescue:
        - name: Record that inherited become was attempted
          ansible.builtin.set_fact:
            langfuse_probe_inherited_become_failed: true

    - name: Require the apply-only probe to have failed
      ansible.builtin.assert:
        that:
          - langfuse_probe_inherited_become_failed | default(false) | bool

    - name: Run fixture with the production apply settings and controller override
      ansible.builtin.include_role:
        name: langfuse_project_keys_controller_probe
        apply:
          delegate_to: "{{ langfuse_key_include.apply.delegate_to }}"
          become: "{{ langfuse_key_include.apply.become }}"
          tags: []
      vars:
        ansible_become: "{{ langfuse_key_task.vars.ansible_become }}"
      tags: []
