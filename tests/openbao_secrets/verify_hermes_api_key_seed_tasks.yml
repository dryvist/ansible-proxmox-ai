---
# Task body for ../verify_hermes_api_key_seed.yml. Pins the caller wiring and the
# shared seed_generated arguments, then runs two fixture lanes that need no
# OpenBao endpoint: a stored key is kept, and an absent key takes its env
# fallback with no write.

- name: Assert the local OpenBao role copy is absent
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../roles/openbao_secrets"
  register: openbao_secrets_local_role

- name: Require the local OpenBao role copy to be absent
  ansible.builtin.assert:
    that:
      - not openbao_secrets_local_role.stat.exists

- name: Assert the seed task files replaced by the shared seed_generated task are gone
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../roles/openbao_secrets/tasks/{{ item }}"
  become: false
  vars:
    ansible_become: false
  loop:
    - seed_hermes_api_key.yml
    - seed_redis_password.yml
    - assert_hermes_writer_identity.yml
    - assert_hermes_writer_capabilities.yml
    - assert_redis_writer_identity.yml
    - assert_redis_writer_capabilities.yml
    - publish_hermes_authoritative_winner.yml
    - publish_redis_authoritative_winner.yml
  register: openbao_secrets_removed_seed_files

- name: Require the replaced seed task files to be absent
  ansible.builtin.assert:
    that:
      - openbao_secrets_removed_seed_files.results | selectattr('stat.exists') | list | length == 0
    fail_msg: The seed task files replaced by seed_generated must be deleted.

- name: Pin the controller loop over every local-llm spec, gated on the fetched domain
  ansible.builtin.assert:
    that:
      - seed_reconcile_block.run_once | bool
      - (seed_reconcile_block.when | join(' ')) is search('openbao_secrets_active')
      - (seed_reconcile_block.when | join(' ')) is search("'local-llm' in")
      - seed_reconcile_loop['ansible.builtin.include_tasks'] == 'tasks/openbao_secrets_seed_local_llm.yml'
      - "'openbao_secrets_local_llm_seed_specs' in seed_reconcile_loop.loop"
      - seed_reconcile_loop.loop_control.loop_var == 'local_llm_secret'
  vars:
    seed_prefetch_play: >-
      {{ seed_main_file
         | selectattr('name', 'equalto',
                      'Pre-fetch resource-domain secrets from OpenBao')
         | first }}
    seed_reconcile_block: >-
      {{ seed_prefetch_play.tasks
         | selectattr('name', 'equalto',
                      'Reconcile the generated local-llm secrets before secret consumption')
         | first }}
    seed_reconcile_loop: "{{ seed_reconcile_block.block | first }}"

- name: Pin the per-secret call to the shared seed_generated task and its contract arguments
  ansible.builtin.assert:
    that:
      - seed_call_block.delegate_to == 'localhost'
      - seed_call_block.no_log | bool
      - seed_call_module.name == 'dryvist.homelab.openbao_secrets'
      - seed_call_module.tasks_from == 'seed_generated'
      - seed_call_vars.openbao_secrets_seed_fields | length == 1
      - seed_call_vars.openbao_secrets_seed_fields[0].length == 64
      - seed_call_vars.openbao_secrets_seed_fields[0].charset == 'hex'
      - "'local_llm_secret.field' in seed_call_vars.openbao_secrets_seed_fields[0].name"
      - "'local_llm_secret.path' in seed_call_vars.openbao_secrets_seed_path"
      - "'local_llm_secret.writer_token' in seed_call_vars.openbao_secrets_seed_token"
      - "'local_llm_secret.writer_policy' in seed_call_vars.openbao_secrets_seed_expected_writer_policy"
      - "'local_llm_secret.writer_max_ttl' in seed_call_vars.openbao_secrets_seed_writer_max_ttl"
      - "'ansible_check_mode' in seed_call_vars.openbao_secrets_seed_check_capabilities"
      - "'local_llm_secret.writer_token' in seed_call_vars.openbao_secrets_seed_revoke_token"
      - seed_call_vars.openbao_secrets_seed_register == 'openbao_secrets_local_llm_seed_result'
  vars:
    seed_call_block: >-
      {{ seed_task_file
         | selectattr('name', 'equalto',
                      'Generate and write an absent local-llm secret through the shared seed_generated task')
         | first }}
    seed_call_task: "{{ seed_call_block.block | first }}"
    seed_call_module: "{{ seed_call_task['ansible.builtin.include_role'] }}"
    seed_call_vars: "{{ seed_call_task.vars }}"

- name: Pin the two local-llm specs to their writer policies, tokens and TTLs
  ansible.builtin.assert:
    that:
      - >-
        seed_defaults.openbao_secrets_local_llm_seed_specs
        | map(attribute='writer_policy') | list == ['hermes-write', 'llm-router-write']
      - "'openbao_secrets_hermes_writer_token' in seed_defaults.openbao_secrets_local_llm_seed_specs[0].writer_token"
      - "'openbao_secrets_redis_writer_token' in seed_defaults.openbao_secrets_local_llm_seed_specs[1].writer_token"
      - "'HERMES_WRITE_BAO_TOKEN' in seed_defaults.openbao_secrets_hermes_writer_token"
      - "'LLM_ROUTER_WRITE_BAO_TOKEN' in seed_defaults.openbao_secrets_redis_writer_token"
      - "\"lookup('env', 'BAO_TOKEN')\" not in seed_defaults.openbao_secrets_hermes_writer_token"
      - seed_defaults.openbao_secrets_hermes_writer_max_ttl_seconds == 600
      - seed_defaults.openbao_secrets_redis_writer_max_ttl_seconds == 600

- name: Set a fetched local-llm Hermes key with a sibling field
  ansible.builtin.set_fact:
    openbao_secrets_by_domain:
      local-llm:
        HERMES_API_SERVER_KEY: "  existing-valid-key  "
        sibling: preserve-me
  delegate_to: localhost
  delegate_facts: true

- name: Reconcile a stored Hermes key with no writer token and no endpoint
  ansible.builtin.include_tasks: ../../playbooks/tasks/openbao_secrets_seed_local_llm.yml
  vars:
    local_llm_secret:
      label: hermes
      path: ai/hermes
      field: HERMES_API_SERVER_KEY
      fallback: ""
      writer_token: ""
      writer_policy: hermes-write
      writer_max_ttl: 600

- name: Assert a stored Hermes key is kept verbatim with no writer token and no write
  ansible.builtin.assert:
    that:
      - hostvars['localhost'].openbao_secrets_by_domain['local-llm'].HERMES_API_SERVER_KEY == '  existing-valid-key  '
      - hostvars['localhost'].openbao_secrets_by_domain['local-llm'].sibling == 'preserve-me'

- name: Set a local-llm accumulator with no Hermes key
  ansible.builtin.set_fact:
    openbao_secrets_by_domain:
      local-llm:
        sibling: preserve-me
  delegate_to: localhost
  delegate_facts: true

- name: Publish a valid env fallback for an absent Hermes key without a write
  ansible.builtin.include_tasks: ../../playbooks/tasks/openbao_secrets_seed_local_llm.yml
  vars:
    local_llm_secret:
      label: hermes
      path: ai/hermes
      field: HERMES_API_SERVER_KEY
      fallback: valid-ambient-key
      writer_token: ""
      writer_policy: hermes-write
      writer_max_ttl: 600

- name: Assert the env fallback reaches the accumulator with no writer token and the sibling survives
  ansible.builtin.assert:
    that:
      - hostvars['localhost'].openbao_secrets_by_domain['local-llm'].HERMES_API_SERVER_KEY == 'valid-ambient-key'
      - hostvars['localhost'].openbao_secrets_by_domain['local-llm'].sibling == 'preserve-me'
