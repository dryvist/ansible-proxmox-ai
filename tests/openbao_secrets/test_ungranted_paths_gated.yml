---
# The apps read policy has no grant for some router-key buckets yet, and a
# denied read fails the whole domain fetch even for an optional path. Each such
# path must stay out of the effective fetch list until its flag flips.
- name: Verify ungranted apps paths are fetched only when their flag is on
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../inventory/group_vars/all.yml
  vars:
    _secrets_role_dir: "{{ playbook_dir }}/../../roles/openbao_secrets"
    _ungranted: [apps/recorder, apps/judge]
    _apps_path: "{{ playbook_dir }}/../../inventory/group_vars/all.yml"
  tasks:
    - name: Load the declared domains
      ansible.builtin.include_vars:
        dir: "{{ _secrets_role_dir }}/defaults/main"

    - name: With the shipped flags none of the ungranted paths is fetched
      ansible.builtin.assert:
        quiet: true
        that:
          - not llm_router_recorder_key_enabled
          - not llm_router_judge_key_enabled
          - llm_router_hermes_orchestrator_key_enabled
          - "'apps/hermes-orchestrator' in _fetched"
          - llm_router_docs_router_snapshot_key_enabled
          - "'apps/docs-router-snapshot' in _fetched"
          - "'apps/donna' in _fetched"
          - _ungranted | intersect(_fetched) | length == 0
          - _ungranted | difference(_declared) | length == 0
          - "'apps/agy' in _fetched"
          - "'apps/zcode' in _fetched"
        fail_msg: "fetched={{ _fetched }}"
      vars:
        _apps: "{{ (openbao_secrets_domains | selectattr('name', 'equalto', 'apps') | first).paths }}"
        _declared: "{{ _apps | select('mapping') | map(attribute='path') | list }}"
        _fetched: >-
          {{ (_apps | select('mapping') | rejectattr('enabled', 'defined') | list
              + _apps | selectattr('enabled', 'defined') | selectattr('enabled') | list)
             | map(attribute='path') | list }}

    - name: With every flag true every gated path is fetched
      ansible.builtin.assert:
        quiet: true
        that:
          - _ungranted | difference(_fetched) | length == 0
        fail_msg: "fetched={{ _fetched }}"
      vars:
        llm_router_recorder_key_enabled: true
        llm_router_judge_key_enabled: true
        _apps: "{{ (openbao_secrets_domains | selectattr('name', 'equalto', 'apps') | first).paths }}"
        _fetched: >-
          {{ (_apps | select('mapping') | rejectattr('enabled', 'defined') | list
              + _apps | selectattr('enabled', 'defined') | selectattr('enabled') | list)
             | map(attribute='path') | list }}

    # A path only the router reads is fetched only when a router is in the run,
    # so a GPU-only limit never needs a grant on it.
    - name: Add a router pool member to the in-memory inventory
      ansible.builtin.add_host:
        name: llm-router-test
        groups: llm_router_group

    # set_fact outranks the include_vars-loaded role default; task vars do not.
    - name: Select the run limit llm-router-test,localhost with the shipped grant flag
      ansible.builtin.set_fact:
        openbao_secrets_limit_pattern: "llm-router-test,localhost"

    - name: A router in the run leaves the sandbox-agent path out until its grant is declared
      ansible.builtin.assert:
        quiet: true
        that:
          - not openbao_secrets_sandbox_agent_read_granted
          - "'apps/sandbox-agent' not in _fetched"
        fail_msg: "limit={{ openbao_secrets_limit_pattern }} fetched={{ _fetched }}"
      vars:
        _apps: "{{ (openbao_secrets_domains | selectattr('name', 'equalto', 'apps') | first).paths }}"
        _fetched: >-
          {{ (_apps | select('mapping') | rejectattr('enabled', 'defined') | list
              + _apps | selectattr('enabled', 'defined') | selectattr('enabled') | list)
             | map(attribute='path') | list }}

    # set_fact outranks the include_vars-loaded role default; task vars do not.
    - name: Declare the sandbox-agent read grant and select the run limit localhost
      ansible.builtin.set_fact:
        openbao_secrets_sandbox_agent_read_granted: true
        openbao_secrets_limit_pattern: "localhost"

    - name: A limit without a router leaves the sandbox-agent path out
      ansible.builtin.assert:
        quiet: true
        that:
          - "'apps/sandbox-agent' not in _fetched"
        fail_msg: "limit={{ openbao_secrets_limit_pattern }} fetched={{ _fetched }}"
      vars:
        _apps: "{{ (openbao_secrets_domains | selectattr('name', 'equalto', 'apps') | first).paths }}"
        _fetched: >-
          {{ (_apps | select('mapping') | rejectattr('enabled', 'defined') | list
              + _apps | selectattr('enabled', 'defined') | selectattr('enabled') | list)
             | map(attribute='path') | list }}

    # set_fact outranks the include_vars-loaded role default; task vars do not.
    - name: Select the run limit llm-router-test,localhost
      ansible.builtin.set_fact:
        openbao_secrets_limit_pattern: "llm-router-test,localhost"

    - name: A limit with a router fetches the sandbox-agent path
      ansible.builtin.assert:
        quiet: true
        that:
          - "'apps/sandbox-agent' in _fetched"
        fail_msg: "limit={{ openbao_secrets_limit_pattern }} fetched={{ _fetched }}"
      vars:
        _apps: "{{ (openbao_secrets_domains | selectattr('name', 'equalto', 'apps') | first).paths }}"
        _fetched: >-
          {{ (_apps | select('mapping') | rejectattr('enabled', 'defined') | list
              + _apps | selectattr('enabled', 'defined') | selectattr('enabled') | list)
             | map(attribute='path') | list }}

    # set_fact outranks the include_vars-loaded role default; task vars do not.
    - name: Select the run limit all
      ansible.builtin.set_fact:
        openbao_secrets_limit_pattern: "all"

    - name: A run without a limit fetches the sandbox-agent path
      ansible.builtin.assert:
        quiet: true
        that:
          - "'apps/sandbox-agent' in _fetched"
        fail_msg: "limit={{ openbao_secrets_limit_pattern }} fetched={{ _fetched }}"
      vars:
        _apps: "{{ (openbao_secrets_domains | selectattr('name', 'equalto', 'apps') | first).paths }}"
        _fetched: >-
          {{ (_apps | select('mapping') | rejectattr('enabled', 'defined') | list
              + _apps | selectattr('enabled', 'defined') | selectattr('enabled') | list)
             | map(attribute='path') | list }}
