---
# The apps read policy has no grant for some router-key buckets yet, and a
# denied read fails the whole domain fetch even for an optional path. Each such
# path must stay out of the effective fetch list until its flag flips.
- name: Verify ungranted apps paths are fetched only when their flag is on
  hosts: localhost
  gather_facts: false
  # vars_files, not include_vars: include_vars binds the shipped flags above the
  # per-task overrides in the "every flag true" assertion below.
  vars_files:
    - ../../inventory/group_vars/all/00-core.yml
    - ../../inventory/group_vars/all/openbao_secrets/00-seed-vars.yml
    - ../../inventory/group_vars/all/openbao_secrets/10-domains-identities.yml
    - ../../inventory/group_vars/all/openbao_secrets/10-domains.yml
    - ../../inventory/group_vars/all/openbao_secrets/11-roster-domains.yml
  vars:
    _ungranted: [apps/recorder, apps/judge, apps/hermes-tracker-reporter]
    _apps_path: "{{ playbook_dir }}/../../inventory/group_vars/all/openbao_secrets/11-roster-domains.yml"
    _apps: "{{ (openbao_secrets_domains | selectattr('name', 'equalto', 'apps') | first).paths }}"
    _drawio_path: "{{ _apps | select('mapping') | selectattr('path', 'equalto', 'apps/next-ai-drawio') | first }}"
    # add_host only mutates the play-scoped inventory; the shipped gate is a
    # Jinja expression on the play-start group count, so this mirror proves the
    # single-host invariant against the synthetic fixture below.
    _ungranted_drawio_enabled: >-
      {{ (groups.get('next_ai_drawio_group', []) | length == 1)
         and (openbao_secrets_active_groups | default([])
              | intersect(['next_ai_drawio_group', 'llm_router_group']) | length > 0)
         | bool }}
  tasks:
    - name: Draw.io stays out when the untagged inventory has no app group
      ansible.builtin.assert:
        quiet: true
        that:
          - _drawio_path.optional | bool
          - not (_ungranted_drawio_enabled | bool)
      vars:
        openbao_secrets_active_groups: [llm_router_group]

    - name: Add a synthetic Draw.io inventory host
      run_once: true
      ansible.builtin.add_host:
        name: fixture-next-ai-drawio
        groups: next_ai_drawio_group

    - name: Only Draw.io and LiteLLM converge scopes fetch the Draw.io leaf
      ansible.builtin.assert:
        quiet: true
        that:
          - (_ungranted_drawio_enabled | bool) == item.enabled
      vars:
        openbao_secrets_active_groups: "{{ item.groups }}"
      loop:
        - { groups: [unrelated_fixture_group], enabled: false }
        - { groups: [next_ai_drawio_group], enabled: true }
        - { groups: [llm_router_group], enabled: true }

    - name: Add a second synthetic Draw.io inventory host
      run_once: true
      ansible.builtin.add_host:
        name: fixture-next-ai-drawio-extra
        groups: next_ai_drawio_group

    - name: Draw.io stays out when its inventory group has multiple hosts
      ansible.builtin.assert:
        quiet: true
        that:
          - not (_ungranted_drawio_enabled | bool)
      vars:
        openbao_secrets_active_groups: [llm_router_group]

    - name: With the shipped flags none of the ungranted paths is fetched
      ansible.builtin.assert:
        quiet: true
        that:
          - not llm_router_recorder_key_enabled
          - not llm_router_judge_key_enabled
          - not llm_router_hermes_tracker_reporter_key_enabled
          - llm_router_hermes_vikunja_pm_key_enabled
          - "'apps/hermes-vikunja-pm' in _fetched"
          - llm_router_hermes_orchestrator_key_enabled
          - "'apps/hermes-orchestrator' in _fetched"
          - "'apps/pepper' in _fetched"
          - llm_router_docs_router_snapshot_key_enabled
          - "'apps/docs-router-snapshot' in _fetched"
          - "'apps/donna' in _fetched"
          - _ungranted | intersect(_fetched) | length == 0
          - _ungranted | difference(_declared) | length == 0
          - "'apps/agy' in _fetched"
          - "'apps/zcode' in _fetched"
        fail_msg: "fetched={{ _fetched }}"
      vars:
        _declared: "{{ _apps | select('mapping') | map(attribute='path') | list }}"
        _fetched: >-
          {{ (_apps | select('mapping') | rejectattr('enabled', 'defined') | list
              + _apps | selectattr('enabled', 'defined') | selectattr('enabled') | list)
             | map(attribute='path') | list }}

    - name: With every flag true every gated path is fetched
      ansible.builtin.assert:
        quiet: true
        that:
          - _ungranted | difference(_fetched) | length == 0
        fail_msg: "fetched={{ _fetched }}"
      vars:
        llm_router_pepper_key_enabled: true
        llm_router_recorder_key_enabled: true
        llm_router_judge_key_enabled: true
        llm_router_hermes_tracker_reporter_key_enabled: true
        _fetched: >-
          {{ (_apps | select('mapping') | rejectattr('enabled', 'defined') | list
              + _apps | selectattr('enabled', 'defined') | selectattr('enabled') | list)
             | map(attribute='path') | list }}

    - name: The sandbox tracker path is never declared for any limit; the router key path is optional
      ansible.builtin.assert:
        quiet: true
        that:
          - "'apps/sandbox-agent' not in _declared"
          - _sandbox_router_paths | length == 1
          - _sandbox_router_path.optional | bool
          - _sandbox_router_path.enabled is not defined
        fail_msg: "declared={{ _declared }}"
        success_msg: "Only the optional sandbox-agent router-key path is declared."
      vars:
        _declared: "{{ _apps | select('mapping') | map(attribute='path') | list }}"
        _sandbox_router_paths: >-
          {{ _apps | select('mapping')
             | selectattr('path', 'equalto', 'apps/sandbox-agent-router') | list }}
        _sandbox_router_path: "{{ _sandbox_router_paths | first }}"
