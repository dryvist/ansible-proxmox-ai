---
- name: Verify the local-llm seed contract through the shared seed_generated task
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    seed_main_file: >-
      {{ lookup('ansible.builtin.file',
                playbook_dir ~ '/../../playbooks/site.yml')
         | from_yaml }}
    seed_task_file: >-
      {{ lookup('ansible.builtin.file',
                playbook_dir ~ '/../../playbooks/tasks/openbao_secrets_seed_local_llm.yml')
         | from_yaml }}
    seed_defaults: >-
      {{ lookup('ansible.builtin.file',
                playbook_dir ~ '/../../inventory/group_vars/all/openbao_secrets/00-seed-vars.yml')
         | from_yaml }}
  tasks:
    - name: Verify the local-llm seed contract
      ansible.builtin.import_tasks: verify_hermes_api_key_seed_tasks.yml
