---
- name: Verify the local-llm seed contract through the shared seed_generated task
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    seed_main_file: >-
      {{ lookup('ansible.builtin.file',
                playbook_dir ~ '/../../roles/openbao_secrets/tasks/main.yml')
         | from_yaml }}
    seed_task_file: >-
      {{ lookup('ansible.builtin.file',
                playbook_dir ~ '/../../roles/openbao_secrets/tasks/seed_local_llm_secret.yml')
         | from_yaml }}
    seed_defaults: >-
      {{ lookup('ansible.builtin.file',
                playbook_dir ~ '/../../roles/openbao_secrets/defaults/main/00-connection.yml')
         | from_yaml }}
  tasks:
    - name: Verify the local-llm seed contract
      ansible.builtin.import_tasks: verify_hermes_api_key_seed_tasks.yml
