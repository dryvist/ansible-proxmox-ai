---
- name: Continuously advance the Hermes bundle version
  ansible.builtin.uri:
    url: "{{ openbao_test_addr }}/v1/secret/data/ai/hermes"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_test_root_token }}"
    body_format: json
    body:
      data:
        HERMES_API_SERVER_KEY: ""
        sibling: "race-{{ item }}"
    status_code: [200, 204]
    validate_certs: false
  loop: "{{ range(0, 20) | list }}"
  no_log: true
