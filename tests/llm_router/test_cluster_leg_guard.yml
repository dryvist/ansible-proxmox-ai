---
# Pins the cluster-leg reachability guard from
# roles/llm_router/tasks/assert-cluster-leg.yml.
#
# WHY THIS TEST EXISTS. llm-models.yml's `servable` field is a manually
# asserted claim, never derived from or validated against anything — that is
# what let the GLM-4.7 cluster entry stay marked servable: true for a month
# after both hosts' clusterMode.enable went false on 2026-08-05, so every
# fallback attempt against it was a guaranteed 502. A registry entry alone
# proves nothing about this guard: it has to fail loudly the moment a
# cluster-tier entry claims servable: true while
# llm_router_cluster_leg_available says the leg is de-wired, not just render a
# config that happens to still look fine.
#
# Both halves describe WIRING — whether the cluster leg exists as a failover
# target — never whether a window is up this minute. The scenarios below are
# therefore "wired" and "de-wired", and no scenario models window state,
# because window state is not an input to the render: LiteLLM picks the live
# leg per request.
#
# Where llm_router_cluster_leg_available is overridden below it is done with
# set_fact, never a plain vars: block on the import_tasks call — "Load the role
# defaults as they ship" loads that variable's own shipped default via
# include_vars, which outranks both play vars and task vars of the same
# name (Ansible variable precedence), so anything weaker gets silently
# clobbered back to it. set_fact is the lowest tier that reliably wins.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_cluster_leg_guard.yml -i localhost, -c local
- name: Verify the cluster-leg reachability guard and its failure path
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main.yml"

    # --- 1. The shipped state, whichever way it currently sits, is coherent ---
    # Deliberately overrides nothing: the guard runs against the committed
    # llm-models.yml and the committed llm_router_cluster_leg_available
    # default together, so the two halves of the flip can never be committed
    # out of step in either direction. Scenarios 2 and 3 below pin the guard's
    # actual behaviour with explicit set_fact overrides.
    - name: Assert the guard passes against the repo's own committed state
      block:
        - name: Load the fabric model registry the way the converge does
          ansible.builtin.include_role:
            name: llm_router
            tasks_from: registry.yml

        - name: Import the cluster-leg guard
          ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/assert-cluster-leg.yml"
      rescue:
        - name: Fail because the two halves of the flip disagree as committed
          ansible.builtin.fail:
            msg: >-
              The guard rejected the repo's own committed state
              (llm_router_cluster_leg_available:
              {{ llm_router_cluster_leg_available }}). The GLM-4.7 entry's
              servable in llm-models.yml and that default must move together —
              fix whichever one is stale, not this test.

    # --- 2. The drift the guard exists to catch: servable true, leg de-wired ---
    - name: "Prove a stale servable: true fails the guard when the leg is de-wired"
      block:
        - name: "Simulate a registry where the cluster entry still claims servable: true"
          ansible.builtin.set_fact:
            llm_router_registry_enabled:
              - client_model_id: mlx-community/GLM-4.7-REAP-50-mxfp4
                serving_role: cluster
                servable: true

        - name: Force the cluster leg de-wired for this scenario
          ansible.builtin.set_fact:
            llm_router_cluster_leg_available: false

        - name: Import the cluster-leg guard
          ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/assert-cluster-leg.yml"

        - name: "Fail because the guard admitted a stale servable: true"
          ansible.builtin.fail:
            msg: >-
              tasks/assert-cluster-leg.yml PASSED with a cluster-tier entry
              claiming servable: true while llm_router_cluster_leg_available
              is false. That guard is the only thing standing between the
              registry silently drifting from what the role believes is
              reachable — exactly the bug that kept GLM-4.7 advertised for a
              month.
      rescue:
        - name: Confirm the guard failed for the servable/reachable drift specifically
          ansible.builtin.assert:
            quiet: true
            that:
              - "'Servable/reachable drift' in (ansible_failed_result.msg | default(''))"
              - "'GLM-4.7' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              The guard failed, but not for the reason expected — got:
              {{ ansible_failed_result.msg | default('(no message)') }}
            success_msg: "Guard correctly rejects servable: true with the cluster leg de-wired."

    # --- 3. The paired state that must pass: servable: true, leg wired ---
    - name: Simulate a registry where servable true is paired with a wired leg
      ansible.builtin.set_fact:
        llm_router_registry_enabled:
          - client_model_id: mlx-community/GLM-4.7-REAP-50-mxfp4
            serving_role: cluster
            servable: true

    - name: Force the cluster leg wired for this scenario
      ansible.builtin.set_fact:
        llm_router_cluster_leg_available: true

    - name: Import the cluster-leg guard
      ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/assert-cluster-leg.yml"
