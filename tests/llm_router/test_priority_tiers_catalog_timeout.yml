---
# Covers the active GPU profile catalog request timeout.
# Run from the repo root:
#   ansible-playbook tests/llm_router/test_priority_tiers_catalog_timeout.yml -i localhost, -c local
- name: Verify the active GPU profile catalog timeout projection
  hosts: localhost
  gather_facts: false
  vars_files:
    - policy_fixture.yml
    - ../../inventory/group_vars/all/02-gpu-accelerator.yml
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
        llm_cpu_scaler:
          tags:
            nine_b: fixture-cpu-small
      containers:
        cpu-fixture:
          ip: 127.0.0.1
          tags: [fixture-cpu-small]
    bao_local_llm_secrets:
      OPENAI_API_KEY: fixture-openai
      GEMINI_API_KEY: fixture-gemini
      DASHSCOPE_API_KEY: fixture-dashscope
      OPENROUTER_API_KEY: fixture-openrouter
      CHATGPT_LOGIN_FILE: /dev/null
    bao_apps_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: localhost
    llm_router_subdomain: example.test
    llm_router_master_key: sk-fixture-master
    llm_router_llm_large_bearer: fixture-bearer
    llm_router_llm_fast_base_url: http://localhost:10434/v1
    llm_router_llm_large_base_url: http://localhost:11434/v1
    llm_router_llm_light_base_url: http://localhost:10434/v1
    llm_router_llm_vllm_base_url: http://localhost:10434/v1
    llm_router_large_passthrough_enabled: true
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    _llm_router_test_catalog_request_timeout_seconds: 123
    hermes_brain_model: medium
    hermes_goal_judge_model: judge
    hindsight_retain_model: qwen3-4b
  tasks:
    - name: Add an inventory-backed profile backend
      ansible.builtin.add_host:
        name: llm-gpu-fixture
        groups: llm_gpu_group
        ansible_connection: local
        llm_gpu_accelerator: "{{ llm_gpu_accelerator_primary }}"
        llm_active_profile: medium-a

    - name: Load role defaults
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load registry projections through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Enable each local deployment path in the fixture
      ansible.builtin.set_fact:
        llm_router_gpu_profiles_enabled: true
        llm_router_llm_vllm_enabled: true
        llm_router_vllm_precheck_passed: true
        llm_router_llm_fast_enabled: true
        llm_router_llm_large_standby_base_url: http://localhost:12434/v1
        llm_active_profile: medium-a

    - name: Materialize the enabled GPU profile before adding timeout fixture
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Give the active GPU profile a catalog request timeout
      ansible.builtin.set_fact:
        llm_router_gpu_models: >-
          {%- set ns = namespace(models=[]) -%}
          {%- for model in llm_router_gpu_models -%}
          {%- if model.profile == llm_active_profile -%}
          {%- set ns.models = ns.models + [model | combine({
                'request_timeout': _llm_router_test_catalog_request_timeout_seconds})] -%}
          {%- else -%}
          {%- set ns.models = ns.models + [model] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.models }}

    - name: Refresh projections for the complete fixture
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Render the complete router configuration
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: Tier two renders the active GPU profile timeout fixture at its local cap
      ansible.builtin.assert:
        quiet: true
        that:
          - _fixture_timeout_models | length == 1
          - _fixture_timeout_model.get('request_timeout', -1) | int == _llm_router_test_catalog_request_timeout_seconds
          - _catalog_timeout_routes | length == 1
          - >-
            _catalog_timeout_routes | map(attribute='litellm_params.timeout') | list
            == [[_fixture_timeout_model.get('request_timeout', -1) | int,
                 llm_router_local_request_timeout_seconds | int] | min]
        fail_msg: >-
          Tier-two deployment for {{ _fixture_timeout_model.get('route_group', '<missing>') }} must render
          its catalog request_timeout of {{ _fixture_timeout_model.get('request_timeout', '<missing>') }}
          seconds capped at {{ llm_router_local_request_timeout_seconds }} seconds.
        success_msg: >-
          Tier two renders the active profile's catalog request_timeout fixture within the local cap.
      vars:
        _fixture_timeout_models: >-
          {{ llm_router_gpu_models
             | selectattr('profile', 'equalto', llm_active_profile)
             | selectattr('request_timeout', 'defined') | list }}
        _fixture_timeout_model: "{{ _fixture_timeout_models | first | default({}) }}"
        _fixture_timeout_upstream: >-
          {{ _fixture_timeout_model.get('litellm_model_name')
             | default(_fixture_timeout_model.get('provider', '') ~ '/'
                       ~ _fixture_timeout_model.get('upstream_model_id', ''), true) }}
        _catalog_timeout_routes: >-
          {{ _config.model_list
             | selectattr('model_name', 'equalto', _fixture_timeout_model.get('route_group', '<missing>'))
             | selectattr('litellm_params.model', 'equalto', _fixture_timeout_upstream)
             | selectattr('litellm_params.tags', 'contains', 'tier-2')
             | selectattr('litellm_params.api_base', 'equalto',
                         llm_router_gpu_profile_base_urls[llm_active_profile]) | list }}
