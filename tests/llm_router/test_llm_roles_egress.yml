---
# Owns ONE contract: each role chain respects its `egress` value in the
# canonical role map (dryvist.homelab.llm_roles), and the registry matches the
# map. Positive: the shipped chains pass, and `recorder` holds home-lab rungs
# only with message logging off. Negative: a recorder chain with a cloud rung,
# an unasserted rung on the judge chain, and a registry whose concurrency drifts
# from the map each fail the converge-time asserts.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_llm_roles_egress.yml -i localhost, -c local
- name: Verify role chains respect their egress value
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    bao_apps_secrets: {}
    bao_local_llm_secrets: {}
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
        llm_cpu_scaler:
          tags:
            nine_b: fixture-cpu-small
      containers:
        cpu-fixture:
          ip: 127.0.0.1
          tags: [fixture-cpu-small]
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Set a successful precheck result for the small capability fixture
      ansible.builtin.set_fact:
        llm_router_vllm_precheck_passed: true

    - name: Load the fabric model registry and role map the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: The shipped chains and registry pass both asserts
      ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/{{ item }}"
      loop: [assert-llm-roles.yml, assert-egress.yml]

    - name: Resolve the small role-map model through its capability projection
      ansible.builtin.set_fact:
        _small_capability_deployment: >-
          {{ llm_router_capability_members
             | selectattr('route_group', 'equalto', llm_router_small_model)
             | selectattr('catalog_model_name', 'equalto',
                 llm_roles.models[llm_roles.roles.small.model].id)
             | first }}

    - name: The client-facing small capability uses active registry members
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_routine_model == llm_router_small_model
          - llm_router_small_model != llm_router_primary_model
          - _small_members | length > 0
          - _mapped_fast_model not in llm_router_servable_models
      vars:
        _mapped_fast_model: "{{ _small_capability_deployment.catalog_model_name }}"
        _small_members: >-
          {{ llm_router_capability_members
             | selectattr('route_group', 'equalto', llm_router_small_model) | list }}
      when: _mapped_fast_model not in llm_router_servable_models

    - name: The recorder holds home-lab rungs only, no cloud rung, no message logging
      ansible.builtin.assert:
        quiet: true
        that:
          - _recorder.litellm_params.turn_off_message_logging
          - _recorder.fallbacks == []
          - _judge.model == llm_router_routine_model
          - _judge.fallbacks == llm_router_d1_zdr_ladder_groups
          - _recorder.model == llm_router_small_model
          - _recorder_role_name not in _workstation_key.models
          - _recorder_key.models == [llm_router_small_model,
              llm_router_small_capability_name, _recorder_role_name] | unique | list
          - llm_router_zdr_asserted_group_names | intersect(llm_router_zdr_false_group_names) | length == 0
          - "'hermes-cloud-openrouter' in llm_router_zdr_asserted_group_names"
          - llm_router_zdr_unasserted_terminal_rungs | intersect(llm_router_zdr_asserted_group_names) | length == 0
      vars:
        _judge: "{{ llm_router_role_deployments | selectattr('role', 'equalto', 'judge') | first }}"
        _recorder_role_name: >-
          {{ (llm_router_role_deployments
              | selectattr('litellm_params.turn_off_message_logging', 'defined') | first).role }}
        _recorder: "{{ llm_router_role_deployments | selectattr('role', 'equalto', _recorder_role_name) | first }}"
        _recorder_key: >-
          {{ _llm_router_declared_virtual_keys
             | selectattr('alias', 'equalto', _recorder_role_name) | first }}
        _workstation_key: >-
          {{ llm_router_virtual_keys
             | selectattr('alias', 'equalto', 'litellm-local-workstation') | first }}

    - name: Resolve the parameterized recorder role name from its role settings
      ansible.builtin.set_fact:
        _llm_router_recorder_role_name: >-
          {{ (llm_router_role_deployments
              | selectattr('litellm_params.turn_off_message_logging', 'defined')
              | first).role }}

    # POSITIVE: a GPU-tier rung is on-estate, not cloud. The estate tier list in
    # assert-egress.yml must carry `gpu`, or every GPU rung on an estate role
    # reads as cloud. A copy of the first GPU-tier registry entry, renamed to a
    # fixture id, stands in for a real deployment so the test proves the tier,
    # not a registry name.
    - name: A GPU-tier rung passes the estate assert
      block:
        - name: Add a fixture GPU-tier registry entry
          ansible.builtin.set_fact:
            llm_router_registry_enabled: >-
              {{ llm_router_registry_enabled
                 + [llm_router_model_registry
                    | selectattr('tier', 'equalto', 'gpu') | first
                    | combine({'client_model_id': 'fixture-gpu-rung',
                               'route_group': 'fixture-gpu-rung',
                               'enabled': true, 'servable': true})] }}

        - name: Put the fixture GPU rung on the judge chain
          ansible.builtin.set_fact:
            llm_router_role_deployments: >-
              {{ (llm_router_role_deployments | rejectattr('role', 'equalto', 'judge') | list)
                 + [{'role': 'judge', 'model': llm_router_routine_model, 'fallbacks': ['fixture-gpu-rung']}] }}

        - name: Run the egress assert
          ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-egress.yml"

    # NEGATIVE: a cloud rung on the recorder chain must fail the egress assert.
    - name: Add a cloud rung to the recorder chain
      ansible.builtin.set_fact:
        llm_router_role_deployments: >-
          {{ (llm_router_role_deployments | rejectattr('role', 'equalto', _llm_router_recorder_role_name) | list)
             + [(llm_router_role_deployments
                 | selectattr('role', 'equalto', _llm_router_recorder_role_name) | first
                 | combine({'model': llm_router_small_model,
                 'fallbacks': [llm_router_routine_model, llm_router_zdr_false_group_names | first]}))] }}

    - name: Refresh cached router projections after fixture input changes [llm-roles-egress-1]
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: The cloud rung is refused
      block:
        - name: Run the egress assert
          ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-egress.yml"
        - name: Fail if the assert let it through
          ansible.builtin.fail:
            msg: a recorder chain with a cloud rung passed the egress assert
      rescue:
        - name: The failure names the recorder rung
          ansible.builtin.assert:
            quiet: true
            that:
              - >-
                (_llm_router_recorder_role_name ~ ' ('
                ~ llm_roles.roles[_llm_router_recorder_role_name].egress ~ ')')
                in ansible_failed_result.msg

    # NEGATIVE: a restricted role may not reach a non-ZDR cloud rung. The
    # judge's egress comes from the role map, so the test follows the policy.
    - name: The judge role is egress-restricted in the role map
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_roles.roles.judge.egress in ['none', 'estate', 'zdr']

    # NEGATIVE: a ZDR role may not reach an unasserted external rung without a ZDR key.
    - name: Add an unasserted rung to the judge chain
      ansible.builtin.set_fact:
        llm_router_role_deployments: >-
          {{ (llm_router_role_deployments | rejectattr('role', 'equalto', 'judge') | list)
             + [{'role': 'judge', 'model': llm_router_routine_model,
                 'fallbacks': [llm_router_small_model, llm_router_zdr_false_group_names | first]}] }}

    - name: Refresh cached router projections after fixture input changes [llm-roles-egress-2]
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: The unasserted rung on the judge role is refused
      block:
        - name: Run the egress assert
          ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-egress.yml"
        - name: Fail if the assert let it through
          ansible.builtin.fail:
            msg: a judge chain with an unasserted external rung passed the egress assert
      rescue:
        - name: The failure names the judge rung
          ansible.builtin.assert:
            quiet: true
            that:
              - >-
                ('judge (' ~ llm_roles.roles.judge.egress ~ ')')
                in ansible_failed_result.msg

    # NEGATIVE: registry concurrency drifting from the catalog fails.
    - name: Drift the routine entry's concurrency from the catalog
      ansible.builtin.set_fact:
        _shipped_model_registry: "{{ llm_router_model_registry }}"
        llm_router_model_registry: >-
          {%- set _target_id = llm_roles.models[llm_roles.roles.small.model].id -%}
          {%- set ns = namespace(entries=[]) -%}
          {%- for entry in llm_router_model_registry -%}
          {%- if (entry.catalog_model_name | default('')) == _target_id
                and entry.max_parallel_source | default('catalog') == 'catalog' -%}
          {%- set ns.entries = ns.entries + [entry | combine({
                'max_parallel_requests': (entry.max_parallel_requests | int) + 1})] -%}
          {%- else -%}
          {%- set ns.entries = ns.entries + [entry] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.entries }}

    - name: Refresh cached router projections after fixture input changes [llm-roles-egress-3]
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: The drift is refused
      block:
        - name: Run the role-map assert
          ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-llm-roles.yml"
        - name: Fail if the assert let it through
          ansible.builtin.fail:
            msg: concurrency drift passed the role-map assert
      rescue:
        - name: The failure names the drift
          ansible.builtin.assert:
            quiet: true
            that:
              - "'max_parallel_requests differs from the catalog' in ansible_failed_result.msg"
      always:
        - name: Restore the shipped model registry
          ansible.builtin.set_fact:
            llm_router_model_registry: "{{ _shipped_model_registry }}"

    # NEGATIVE: a disabled map model must carry the explicit standby marker.
    - name: Remove parked markers and disable the selected capability deployment
      ansible.builtin.set_fact:
        llm_router_model_registry: >-
          {%- set ns = namespace(entries=[]) -%}
          {%- for entry in llm_router_model_registry -%}
          {%- set changes = {'standby': false} -%}
          {%- if entry.client_model_id == _small_capability_deployment.client_model_id -%}
          {%- set changes = changes | combine({'enabled': false, 'servable': false}) -%}
          {%- endif -%}
          {%- set ns.entries = ns.entries + [entry | combine(changes)] -%}
          {%- endfor -%}
          {{ ns.entries }}

    - name: Refresh cached router projections after fixture input changes [llm-roles-egress-4]
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: An unmarked disabled map model is refused
      block:
        - name: Run the role-map assert
          ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-llm-roles.yml"
        - name: Fail if the assert let the unmarked state through
          ansible.builtin.fail:
            msg: disabled map model without standby marker passed the role-map assert
      rescue:
        - name: The failure names the unmatched model
          ansible.builtin.assert:
            quiet: true
            that:
              - _mapped_fast_model in ansible_failed_result.msg
          vars:
            _mapped_fast_model: "{{ _small_capability_deployment.catalog_model_name }}"
