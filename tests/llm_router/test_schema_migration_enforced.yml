---
# Pins DISABLE_SCHEMA_UPDATE=True in the DATABASE_URL block of
# roles/llm_router/templates/litellm.env.j2. The role's own step
# (tasks/schema-push.yml) is the one owner of the schema, so the service never
# migrates at startup, on an upgrade, a downgrade or an unplanned restart.
#
# Run (from the REPO ROOT — self-contained):
#   ansible-playbook tests/llm_router/test_schema_migration_enforced.yml -i localhost, -c local

- name: Verify the startup schema update is disabled with a database
  hosts: localhost
  gather_facts: false
  vars_files:
    - policy_fixture.yml
    - ../../inventory/group_vars/all/02-gpu-accelerator.yml
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the catalog-backed model registry
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml
        public: true

    - name: Load the real router group_vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../inventory/group_vars/llm_router_group.yml"

    - name: Load the estate group_vars the role defaults derive from
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/../../inventory/group_vars/all"

    - name: Stub the tofu inventory data and the bao secret maps
      ansible.builtin.set_fact:
        llm_router_master_key: dummy-render-check
        llm_router_llm_large_bearer: dummy-render-check
        ai_subdomain: pve.example.test
        tofu_data:
          domain: example.com
          constants:
            service_ports: { llm_router_api: 4000, otel_traces_http: 4318, postgres_default: 5432 }
        bao_local_llm_secrets: {}
        bao_apps_secrets:
          llm_router_db_password: dummy-render-check
        llm_router_db_host: postgres-ai.pve.example.test

    - name: Refresh cached router projections after fixture input changes [schema-migration-enforced-1]
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Render the real env file
      ansible.builtin.set_fact:
        _env: "{{ lookup('template', _role_dir ~ '/templates/litellm.env.j2') }}"

    - name: The db-backed env disables the service's startup schema update
      ansible.builtin.assert:
        quiet: true
        that:
          - _env is search('(?m)^DATABASE_URL=')
          - _env is search('(?m)^DISABLE_SCHEMA_UPDATE=True$')
          - _env is not search('(?m)^ENFORCE_PRISMA_MIGRATION_CHECK=')
        fail_msg: >-
          Expected DATABASE_URL with DISABLE_SCHEMA_UPDATE=True. Real render:\n{{ _env }}
        success_msg: The role owns the schema; the service never migrates at startup.

- name: Verify migration environment is absent with no database
  hosts: localhost
  gather_facts: false
  vars_files:
    - policy_fixture.yml
    - ../../inventory/group_vars/all/02-gpu-accelerator.yml
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
  tasks:
    - name: Start this play with no facts carried over from the previous one
      ansible.builtin.meta: clear_facts
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the catalog-backed model registry
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml
        public: true

    - name: Load the real router group_vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../inventory/group_vars/llm_router_group.yml"

    - name: Load the estate group_vars the role defaults derive from
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/../../inventory/group_vars/all"

    - name: Stub the tofu inventory data with NO database configured
      ansible.builtin.set_fact:
        llm_router_master_key: dummy-render-check
        llm_router_llm_large_bearer: dummy-render-check
        ai_subdomain: pve.example.test
        tofu_data:
          domain: example.com
          constants:
            service_ports: { llm_router_api: 4000, otel_traces_http: 4318 }
        bao_local_llm_secrets: {}
        bao_apps_secrets: {}
        llm_router_db_host: ""

    - name: Refresh cached router projections after fixture input changes [schema-migration-enforced-2]
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Render the real env file
      ansible.builtin.set_fact:
        _env: "{{ lookup('template', _role_dir ~ '/templates/litellm.env.j2') }}"

    - name: No database or migration enforcement line renders without a database
      ansible.builtin.assert:
        quiet: true
        that:
          - _env is not search('(?m)^DATABASE_URL=')
          - _env is not search('(?m)^ENFORCE_PRISMA_MIGRATION_CHECK=')
          - _env is not search('(?m)^DISABLE_SCHEMA_UPDATE=')
        fail_msg: >-
          With no database configured, the rendered litellm.env still carries
          a schema-management line. Real render:\n{{ _env }}
        success_msg: No database, so no schema-management line renders.
