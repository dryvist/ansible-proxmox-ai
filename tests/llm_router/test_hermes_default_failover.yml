---
# With no provider credential, the complexity router advertises only the
# local fallback (hermes-local-4080, not credential-gated) and no cloud
# fallback route that could be selected but not authenticated.
- name: Verify Hermes stays local when provider credentials are absent
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: mlx-community/Qwen3.8-27B-4bit
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    # assert-endpoint-dns.yml (part of the render-time assertions below) does a
    # real getent lookup on every advertised backend host. This fixture's
    # llm_router_subdomain is the RFC 2606 reserved pve.example.test, which by
    # design never resolves — point the base URLs at localhost so the guard
    # checks its own logic against a host every runner actually resolves,
    # rather than testing network reachability this suite never intended to
    # exercise.
    - name: Point advertised backend URLs at a host this runner can resolve
      ansible.builtin.set_fact:
        llm_router_llm_fast_base_url: "http://localhost:10434/v1"
        llm_router_llm_light_base_url: "http://localhost:10434/v1"
        llm_router_llm_large_base_url: "https://localhost:11434/v1"
        llm_router_llm_vllm_base_url: "http://localhost:10434/v1"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Run the role's render-time assertions
      ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/assert.yml"

    - name: Render and parse the real proxy config
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}

    - name: Hermes auto-routes locally and advertises no unseeded fallback
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_hermes_default_fallback_chain == ['hermes-local-4080']
          - "_config.router_settings.fallbacks == [{'hermes-default': ['hermes-local-4080']}]"
          - _config.router_settings.max_fallbacks | int == 1
          - _cloud_models | length == 0
          - _hermes_router.litellm_params.model == 'auto_router/complexity_router'
          - _hermes_router.litellm_params.complexity_router_config.tiers.SIMPLE
            == llm_router_routine_model
          - _hermes_router.litellm_params.complexity_router_config.tiers.MEDIUM
            == llm_router_routine_model
          - _hermes_router.litellm_params.complexity_router_config.tiers.COMPLEX
            == llm_router_primary_model
          - _hermes_router.litellm_params.complexity_router_config.tiers.REASONING
            == llm_router_primary_model
        fail_msg: >-
          Hermes must complexity-route only between the two resident models and
          advertise only the local fallback when provider credentials are
          absent. Got fallback={{ _config.router_settings.fallbacks | default([]) }},
          cloud={{ _cloud_models }}.
        success_msg: "Hermes auto-routing stays local-only (plus the local fallback) without provider credentials"
      vars:
        _cloud_models: >-
          {{ _config.model_list
             | selectattr('model_name', 'match', '^hermes-cloud-') | list }}
        _hermes_router: >-
          {{ _config.model_list
             | selectattr('model_name', 'equalto', 'hermes-default') | first }}
