---
# The cluster path is deliberately absent. Hermes must fail over only to
# enabled, locally servable models until an approved cloud credential causes a
# cloud value group to render.
- name: Verify Hermes local failover excludes abandoned targets
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          llm_cluster_api: 11440
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: mlx-community/Qwen3.8-27B-4bit
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Run the role's render-time assertions
      ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/assert.yml"

    - name: Render and parse the real proxy config
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}

    - name: Hermes fails over only through the two enabled local tiers
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_hermes_default_fallback_chain
            == [llm_router_routine_model, llm_router_small_model]
          - _rendered_chain == [llm_router_routine_model, llm_router_small_model]
          - _cluster_models | length == 0
        fail_msg: >-
          Hermes' fallback chain must contain only the resident routine model
          and the small last resort while cloud credentials are absent. Got
          {{ _rendered_chain }}; abandoned cluster deployments:
          {{ _cluster_models }}.
        success_msg: "Hermes local failover excludes the abandoned cluster path"
      vars:
        _rendered_chain: >-
          {{ _config.router_settings.fallbacks
             | selectattr('hermes-default', 'defined')
             | map(attribute='hermes-default') | flatten }}
        _cluster_models: >-
          {{ _config.model_list
             | selectattr('litellm_params.api_base', 'defined')
             | selectattr('litellm_params.api_base', 'search', ':11440/')
             | map(attribute='model_name') | list }}
