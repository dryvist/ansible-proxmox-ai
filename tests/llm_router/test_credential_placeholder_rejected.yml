---
# A credential that resolves to a local-backend placeholder value (see
# llm_router_credential_placeholder_values) must behave exactly like an absent
# credential: the rung renders no deployment and the proxy environment never
# carries the value. Seeding the placeholder through bao_local_llm_secrets
# exercises the same resolution path an ambient environment value takes.

- name: Verify a placeholder credential value never credentials a rung
  hosts: localhost
  gather_facts: false
  vars_files:
    - policy_fixture.yml
    - ../../inventory/group_vars/all/02-gpu-accelerator.yml
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Set example-only values for required render inputs
      ansible.builtin.set_fact:
        llm_router_subdomain: pve.example.test
        llm_router_master_key: sk-test-master
        llm_router_llm_large_bearer: test-bearer-token

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Seed the OpenAI credential as the local-backend placeholder
      ansible.builtin.set_fact:
        bao_local_llm_secrets:
          OPENAI_API_KEY: local
          OPENROUTER_HERMES_KEY: local

    - name: Refresh cached router projections after fixture input changes [credential-placeholder-rejected-1]
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Re-evaluate the Hermes cloud projections with the placeholder seeded
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

    - name: Render and parse the real proxy config and environment
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}
        _environment: >-
          {{ lookup('template', _role_dir ~ '/templates/litellm.env.j2') }}

    - name: The placeholder never resolves as a credential
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_resolved_credentials.get('OPENAI_API_KEY', '') == ''
          - llm_router_resolved_credentials.get('OPENROUTER_HERMES_KEY', '') == ''
        fail_msg: >-
          llm_router_resolved_credentials still resolved a key from the literal
          placeholder "local" — llm_router_credential_placeholder_values
          (20-registry.yml) must reject it.

    - name: The codex-api rung never renders on a placeholder credential
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _config.model_list
            | selectattr('model_name', 'equalto', 'codex-api')
            | list | length == 0
        fail_msg: >-
          codex-api rendered a deployment even though its only credential
          was the "local" placeholder — an unwired rung must never render.

    - name: The proxy's own environment never carries the placeholder as a real key
      ansible.builtin.assert:
        quiet: true
        that:
          - "'OPENAI_API_KEY=' not in _environment"
          - "'OPENROUTER_HERMES_KEY=' not in _environment"
        fail_msg: >-
          litellm.env.j2 emitted a key from a rejected placeholder value —
          it must be omitted exactly as an absent credential is.

    - name: Find enabled Hermes cloud rows using the OpenRouter credential
      ansible.builtin.set_fact:
        _placeholder_hermes_cloud_models: >-
          {{ _llm_router_m_registry_enabled
             | selectattr('tier', 'equalto', 'hermes-cloud')
             | selectattr('enabled', 'equalto', true)
             | selectattr('credential_env', 'equalto', 'OPENROUTER_HERMES_KEY')
             | list }}

    - name: Check the enabled Hermes cloud credential gate with the placeholder
      ansible.builtin.include_tasks: >-
        {{ _role_dir }}/tasks/assert-hermes-cloud-credentialed-models.yml

    - name: The placeholder leaves enabled Hermes cloud rows unseeded
      ansible.builtin.assert:
        quiet: true
        that:
          - _placeholder_hermes_cloud_models | length > 0
          - >-
            (_llm_router_hermes_cloud_credential_gate_failures
             | selectattr('client_model_id', 'in', _placeholder_hermes_cloud_models
                 | map(attribute='client_model_id') | list)
             | list | length) == 0
          - >-
            (_llm_router_hermes_cloud_unseeded_models
             | selectattr('client_model_id', 'in', _placeholder_hermes_cloud_models
                 | map(attribute='client_model_id') | list)
             | list | length) == (_placeholder_hermes_cloud_models | length)
        fail_msg: >-
          An enabled Hermes cloud row with a rejected placeholder key must be
          treated as unseeded, not as an assertion failure.
