---
# A credential that resolves to a local-backend placeholder value (see
# llm_router_credential_placeholder_values) must behave exactly like an absent
# credential: the rung renders no deployment and the proxy environment never
# carries the value. Seeding the placeholder through bao_local_llm_secrets
# exercises the same resolution path an ambient environment value takes.

- name: Verify a placeholder credential value never credentials a rung
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Seed the OpenAI credential as the local-backend placeholder
      ansible.builtin.set_fact:
        bao_local_llm_secrets:
          OPENAI_API_KEY: local

    - name: Re-evaluate the Hermes cloud projections with the placeholder seeded
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

    - name: Render and parse the real proxy config and environment
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}
        _environment: >-
          {{ lookup('template', _role_dir ~ '/templates/litellm.env.j2') }}

    - name: The placeholder never resolves as a credential
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_resolved_credentials.get('OPENAI_API_KEY', '') == ''
        fail_msg: >-
          llm_router_resolved_credentials still resolved OPENAI_API_KEY from
          the literal placeholder "local" — llm_router_credential_placeholder_values
          (20-registry.yml) must reject it.

    - name: The codex-api rung never renders on a placeholder credential
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _config.model_list
            | selectattr('model_name', 'equalto', 'codex-api')
            | list | length == 0
        fail_msg: >-
          codex-api rendered a deployment even though its only credential
          was the "local" placeholder — an unwired rung must never render.

    - name: The proxy's own environment never carries the placeholder as a real key
      ansible.builtin.assert:
        quiet: true
        that:
          - "'OPENAI_API_KEY=' not in _environment"
        fail_msg: >-
          litellm.env.j2 emitted OPENAI_API_KEY from a rejected placeholder
          value — it must be omitted exactly as an absent credential is.
