---
# Pins llm_router_llm_vllm_enabled (roles/llm_router/defaults/main/10-network.yml)
# as a switch for the WHOLE vllm / hermes-local tier, not only for its
# deployment block.
#
# WHY THIS TEST EXISTS. The switch used to gate the model-list block and the
# DNS guard and nothing else. Turning it off therefore left the registry
# advertising names the template no longer rendered, and the converge failed
# in assert-registry-render-parity.yml instead of converging. Every other
# contract test runs with the switch at its default, so none of them could
# see that: a green CI said nothing about the one setting a router actually
# flips while the guest behind the tier is absent. This runs the fully
# credentialed render AND the role's whole assert chain with the switch off,
# the way a converge does, and proves the guard still fires when the switch
# does not hold.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_vllm_tier_switch.yml -i localhost, -c local

- name: With the tier switched off the router renders none of it and every render-time contract passes
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    _vllm_tier_enabled: false
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: hermes-default
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Produce the fully credentialed render with the tier off (runs the whole assert chain)
      ansible.builtin.import_tasks: tasks/credentialed_render.yml

    - name: Nothing only the tier owns renders, and nothing else is lost
      ansible.builtin.assert:
        quiet: true
        that:
          # ANTI-VACUITY: the switch has something to remove, and something it
          # must leave alone. A registry with no tier-only names would pass
          # every check below while proving nothing.
          - _tier_only_names | length > 0
          - _shared_names | length > 0
          - _rendered_names | intersect(_tier_only_names) | length == 0
          # Exact tokens, not substrings: no fallback chain, retry policy or
          # alias in router_settings may still name a rung the proxy no longer
          # serves.
          - _settings_tokens | intersect(_tier_only_names) | length == 0
          # The light-tier siblings of the shared names keep rendering.
          - _shared_names | difference(_rendered_names) | length == 0
          - llm_router_vllm_models | length == 0
          - llm_router_hermes_local_models | length == 0
          - llm_router_local_fallback_groups | length == 0
          # The DB roles keep a catalogued target: the seed asserts it against
          # this set, and creates a role only once that target is live.
          - llm_router_hermes_local_4080_id in llm_router_registry_enabled_route_names
          - llm_router_hermes_local_4080_id in (llm_router_role_deployments | map(attribute='model') | list)
        fail_msg: >-
          With llm_router_llm_vllm_enabled false the router must serve none of
          the names only the vllm / hermes-local tiers own
          ({{ _tier_only_names | join(', ') }}) and keep the names a light-tier
          sibling also owns ({{ _shared_names | join(', ') }}). Rendered
          tier-only: {{ _rendered_names | intersect(_tier_only_names) }};
          named in router_settings: {{ _settings_tokens | intersect(_tier_only_names) }};
          shared names missing: {{ _shared_names | difference(_rendered_names) }}.
        success_msg: >-
          Tier off: {{ _tier_only_names | length }} tier-only names are gone from the
          render and router_settings, {{ _shared_names | length }} shared names still render.
      vars:
        _tier_names: >-
          {{ llm_router_registry_enabled | selectattr('tier', 'in', ['vllm', 'hermes-local'])
             | map(attribute='client_model_id') | unique | list }}
        _other_names: >-
          {{ llm_router_registry_enabled | rejectattr('tier', 'in', ['vllm', 'hermes-local'])
             | map(attribute='client_model_id') | unique | list }}
        _tier_only_names: "{{ _tier_names | difference(_other_names) }}"
        _shared_names: "{{ _tier_names | intersect(_other_names) }}"
        _rendered_names: "{{ _config.model_list | map(attribute='model_name') | unique | list }}"
        _settings_tokens: >-
          {{ _config.router_settings | to_json | regex_findall('"([^"]+)"') | unique | list }}

- name: With the tier on, the same fixture renders everything the tier owns
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    _vllm_tier_enabled: true
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: hermes-default
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Produce the fully credentialed render with the tier on
      ansible.builtin.import_tasks: tasks/credentialed_render.yml

    - name: Every name the tier owns renders, so the off-switch play above removed something real
      ansible.builtin.assert:
        quiet: true
        that:
          - _tier_names | length > 0
          - _tier_names | difference(_rendered_names) | length == 0
          - llm_router_vllm_models | length > 0
          - llm_router_hermes_local_models | length > 0
          - llm_router_local_fallback_groups | length > 0
        fail_msg: >-
          With llm_router_llm_vllm_enabled true the tier's names
          ({{ _tier_names | join(', ') }}) must all render; missing:
          {{ _tier_names | difference(_rendered_names) }}.
        success_msg: "Tier on: all {{ _tier_names | length }} tier names render."
      vars:
        _tier_names: >-
          {{ llm_router_registry_enabled | selectattr('tier', 'in', ['vllm', 'hermes-local'])
             | map(attribute='client_model_id') | unique | list }}
        _rendered_names: "{{ _config.model_list | map(attribute='model_name') | unique | list }}"

- name: The guard fails loud when a switched-off tier still renders
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: hermes-default
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Load the role defaults and registry the way the converge does
      ansible.builtin.import_tasks: tasks/parity_setup.yml

    - name: Switch the tier off
      ansible.builtin.set_fact:
        llm_router_llm_vllm_enabled: false

    - name: Prove the guard catches a tier-only name that renders anyway
      block:
        # A stand-in config that serves one name only the tier owns, handed to
        # the guard in place of the real template — the shape of a template
        # that stopped honouring the switch.
        - name: Make a scratch directory for the stand-in config
          ansible.builtin.tempfile:
            state: directory
            prefix: vllm-switch-
          register: _scratch

        - name: Write a stand-in config that serves a tier-only name
          ansible.builtin.copy:
            content: "model_list:\n  - model_name: {{ _leaked_name }}\n"
            dest: "{{ _scratch.path }}/config.yaml.j2"
            mode: "0600"
          vars:
            _leaked_name: >-
              {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'hermes-local')
                 | map(attribute='client_model_id') | first }}

        - name: Point the guard at the stand-in config
          ansible.builtin.set_fact:
            _llm_router_parity_template: "{{ _scratch.path }}/config.yaml.j2"

        - name: Run the parity guard against the leaking config
          ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/assert-registry-render-parity.yml"

        - name: Fail because the guard admitted a switched-off tier that still renders
          ansible.builtin.fail:
            msg: >-
              The parity guard PASSED with llm_router_llm_vllm_enabled false
              while the config still served a name only the vllm / hermes-local
              tiers own. That is a switch that does not hold.
      rescue:
        - name: Confirm the guard failed for the switched-off-but-rendered reason specifically
          ansible.builtin.assert:
            quiet: true
            that:
              - "'SWITCHED OFF BUT RENDERED: ' ~ _leaked_name in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              The guard failed, but not for the expected reason — got:
              {{ ansible_failed_result.msg | default('(no message)') }}
            success_msg: "Guard correctly rejects a switched-off tier that still renders."
          vars:
            _leaked_name: >-
              {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'hermes-local')
                 | map(attribute='client_model_id') | first }}
      always:
        # set_fact outranks the guard's own task vars, so the stand-in would
        # follow this host into any later play; restore the real path and drop
        # the scratch directory whether or not the assertion above held.
        - name: Point the guard back at the real config template
          ansible.builtin.set_fact:
            _llm_router_parity_template: "{{ _role_dir }}/templates/config.yaml.j2"

        - name: Remove the scratch directory
          ansible.builtin.file:
            path: "{{ _scratch.path }}"
            state: absent
          when: (_scratch | default({})).path | default('') | length > 0
