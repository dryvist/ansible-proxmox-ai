---
- name: Verify capability aliases preserve sensitivity scopes and fallback chains
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets:
      CHATGPT_LOGIN_FILE: /dev/null
      DASHSCOPE_API_KEY: fixture-dashscope
      GEMINI_API_KEY: fixture-gemini
      OPENAI_API_KEY: fixture-openai
      OPENCODE_API_KEY: fixture-opencode
      OPENROUTER_API_KEY: fixture-openrouter
      OPENROUTER_HERMES_KEY: fixture-hermes-openrouter
    bao_apps_secrets:
      hermes_default_llm_router_key: sk-fixture-hermes-public
      github_actions_oss_llm_router_key: sk-fixture-github-actions-oss
    llm_router_oss_ci_key_enabled: true
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: fixture-large-bearer
    llm_router_llm_fast_base_url: http://localhost:10434/v1
    llm_router_llm_light_base_url: http://localhost:10434/v1
    llm_router_llm_large_base_url: http://localhost:11434/v1
    llm_router_llm_vllm_base_url: http://localhost:10434/v1
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_agent_identity: hermes
    hermes_brain_model: medium
    hermes_goal_judge_model: judge
    hindsight_retain_model: qwen3-4b
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Render the fully credentialed config
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: Capability aliases do not create duplicate model-list deployments
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_model_group_aliases.auto == llm_router_primary_model
          - llm_router_model_group_aliases[_hermes_default_alias] == llm_router_primary_model
          - _medium_deployments | length > 0
          - _medium_orders | unique | length == _medium_orders | length
          - _complexity_router_entries | length == 0
          - _legacy_deployments | length == 0
        fail_msg: >-
          aliases={{ llm_router_model_group_aliases }},
          medium orders={{ _medium_orders }}, legacy entries={{ _legacy_deployments }}
        success_msg: "Transitional aliases resolve to the medium capability without duplicate deployments."
      vars:
        _hermes_default_alias: >-
          {{ _llm_router_hermes_profile_keys
             | selectattr('alias', 'search', '-default$')
             | map(attribute='alias') | first }}
        _medium_deployments: >-
          {{ _config.model_list
             | selectattr('model_name', 'equalto', llm_router_primary_model) | list }}
        _medium_orders: "{{ _medium_deployments | map(attribute='litellm_params.order') | list }}"
        _complexity_router_entries: >-
          {{ _config.model_list
             | selectattr('litellm_params.complexity_router_config', 'defined') | list }}
        _legacy_deployments: >-
          {{ _config.model_list | selectattr('model_name', 'in', ['auto', _hermes_default_alias]) | list }}

    - name: Hermes defaults to sensitive while an explicitly public key stays public
      ansible.builtin.assert:
        quiet: true
        that:
          - _hermes_key.alias == _hermes_default_alias
          - _hermes_key.sensitivity_tag == '&sensitivity:sensitive'
          - _public_key.sensitivity_tag == '&sensitivity:public'
          - llm_router_primary_model in _hermes_key.models
          - "'medium' in _public_key.models"
          - _fallback == _expected_fallback
          - _fallback | length > 0
          - _fallback | intersect(llm_router_zdr_unasserted_terminal_rungs) | length == 0
          - llm_router_hermes_default_fallback_chain | difference(_hermes_key.models) | length == 0
        fail_msg: >-
          Hermes sensitivity={{ _hermes_key.sensitivity_tag }},
          public sensitivity={{ _public_key.sensitivity_tag }} fallback={{ _fallback }}
        success_msg: >-
          Hermes defaults to sensitive; the explicit public key remains public and the Hermes ladder is scoped.
      vars:
        _hermes_default_alias: >-
          {{ _llm_router_hermes_profile_keys
             | selectattr('alias', 'search', '-default$')
             | map(attribute='alias') | first }}
        _hermes_key: "{{ llm_router_virtual_keys | selectattr('alias', 'equalto', _hermes_default_alias) | first }}"
        _public_key: "{{ llm_router_virtual_keys | selectattr('alias', 'equalto', 'github-actions-oss') | first }}"
        _fallback: >-
          {{ _config.router_settings.fallbacks
             | selectattr('medium', 'defined')
             | map(attribute='medium') | first }}
        _expected_fallback: >-
          {{ llm_router_d1_ladder_groups[
               llm_router_d1_ladder_groups.index(llm_router_d1_auto_initial_group) + 1:]
             | reject('in', llm_router_zdr_unasserted_terminal_rungs) | list }}
