---
- name: Verify ZDR filtering on capability fallback hops
  hosts: localhost
  gather_facts: false
  vars_files:
    - ladder_keys_fixture.yml
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
  tasks:
    - name: Prepare role-backed rendered contract
      ansible.builtin.import_tasks: tasks/prepare_ladder_keys.yml
    - name: Every ZDR-only key and fallback hop excludes unasserted deployments
      ansible.builtin.assert:
        quiet: true
        that:
          - _zdr_keys | length >= 2
          - _zdr_filter_mismatches | length == 0
          - _bad_zdr_keys | length == 0
          - _zdr_entry_names | difference(_zdr_fallback_names) | length == 0
          - _zdr_fallback_targets | intersect(_active_zdr_unasserted_terminal_rungs) | length == 0
          - _zdr_fallback_targets | difference(_deployment_group_names) | length == 0
          - >-
            llm_router_opencode_retaining_fallback_groups
            | intersect(llm_router_d1_zdr_rungs_by_class['sub']) | length == 0
          - llm_router_opencode_zdr_fallback_groups | difference(llm_router_d1_zdr_rungs_by_class['sub']) | length == 0
          - _unsafe_deployment_rows | length == 0
          - _complexity_router_rows | length == 0
          - >-
            (llm_router_d1_rungs_by_class['free']
             + llm_router_d1_rungs_by_class['retains'])
            | difference(_active_zdr_unasserted_terminal_rungs) | length == 0
        fail_msg: >-
          ZDR keys or fallback hops can reach an unasserted deployment:
          keys={{ _bad_zdr_keys }}, missing filter tags={{ _zdr_filter_mismatches }},
          fallback={{ _zdr_fallback_targets
          | intersect(_active_zdr_unasserted_terminal_rungs) }},
          untagged={{ _unsafe_deployment_rows }}.
        success_msg: "ZDR keys reach only rendered, explicitly ZDR tagged capability and paid groups."
      vars:
        _zdr_keys: >-
          {{ _active_virtual_keys | selectattr('tags', 'defined')
             | selectattr('tags', 'contains', '&zdr') | list }}
        _zdr_filter_mismatches: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for _key in _zdr_keys -%}
          {%- if '!free' not in _key.tags or '!retains' not in _key.tags
                or not (_key.router_settings.enable_tag_filtering | default(false) | bool) -%}
          {%- set ns.rows = ns.rows + [_key.alias] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.rows }}
        _bad_zdr_keys: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for _key in _zdr_keys -%}
          {%- if _key.models | intersect(_active_zdr_unasserted_terminal_rungs) | length > 0 -%}
          {%- set ns.rows = ns.rows + [_key.alias] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.rows }}
        _fallback_pairs: >-
          {{ _config.router_settings.fallbacks | map('dict2items') | flatten }}
        _zdr_entry_names: "{{ llm_router_zdr_entry_point_names | unique | list }}"
        _zdr_fallback_pairs: >-
          {{ _fallback_pairs | selectattr('key', 'in', _zdr_entry_names) | list }}
        _zdr_fallback_names: "{{ _zdr_fallback_pairs | map(attribute='key') | unique | list }}"
        _zdr_fallback_targets: >-
          {{ _zdr_fallback_pairs | map(attribute='value') | flatten | unique | list }}
        _deployment_group_names: >-
          {{ _config.model_list | map(attribute='model_name') | unique | list }}
        _unsafe_deployment_rows: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for _row in _config.model_list
                if _row.model_name in _zdr_fallback_targets -%}
          {%- set _tags = _row.litellm_params.tags | default([]) -%}
          {%- if 'zdr' not in _tags or 'free' in _tags or 'retains' in _tags -%}
          {%- set ns.rows = ns.rows + [_row.model_name] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.rows }}
        _complexity_router_rows: >-
          {{ _config.model_list
             | selectattr('litellm_params.complexity_router_config', 'defined') | list }}
