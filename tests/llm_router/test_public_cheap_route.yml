---
- name: Verify sandbox-only OpenCode model names
  hosts: localhost
  gather_facts: false
  vars_files:
    - policy_fixture.yml
    - ../../inventory/group_vars/all/02-gpu-accelerator.yml
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    llm_router_opencode_zdr_as_of: "2026-12-01"
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the shared router fixture
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/ladder_keys_fixture.yml"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Give router projection fixtures their trusted caller tier
      ansible.builtin.import_tasks: tasks/trust_fixture_callers.yml

    - name: Add the fixture sandbox key and keep the large tier gated off
      ansible.builtin.set_fact:
        bao_apps_secrets: >-
          {{ (bao_apps_secrets | default({})) | combine({
            'sandbox_agent_router_llm_router_key': 'fixture-sandbox-agent'}) }}
        llm_router_llm_vllm_enabled: false
        llm_router_vllm_precheck_passed: false
      no_log: true

    - name: Refresh the router projections
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Render router config
      ansible.builtin.set_fact:
        _render_config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"
        _render_keys: "{{ llm_router_virtual_keys }}"

    - name: Derive sandbox OpenCode model ids from the registry
      ansible.builtin.set_fact:
        _sandbox_model_ids: >-
          {%- set ns = namespace(ids=[]) -%}
          {%- for model in llm_router_registry_enabled
                if (model.tier | default('')) == 'opencode'
                   and 'sandbox-only' in (model.tags | default([])) -%}
          {%- set ns.ids = ns.ids + [model.client_model_id] -%}
          {%- endfor -%}
          {{ ns.ids | unique | list }}

    - name: Check the sandbox route is isolated from class and other key scopes
      ansible.builtin.assert:
        quiet: true
        that:
          - _sandbox_model_ids | length > 0
          - _sandbox_model_ids | difference(_sandbox_only_names) | length == 0
          - _sandbox_model_ids | difference(_sandbox_key.models) | length == 0
          - _other_keys_with_route | length == 0
          - _class_scopes_with_route | length == 0
        fail_msg: >-
          sandbox models={{ _sandbox_model_ids }}, sandbox key={{ _sandbox_key.models }},
          other keys={{ _other_keys_with_route }}, class scopes={{ _class_scopes_with_route }}.
        success_msg: >-
          Registry-derived sandbox model ids are granted only to sandbox-agent,
          outside all, standard, ZDR, and local class scopes.
      vars:
        _sandbox_only_names: "{{ llm_router_sandbox_only_model_ids }}"
        _sandbox_key: >-
          {{ _llm_router_declared_virtual_keys
             | selectattr('alias', 'equalto', 'sandbox-agent') | first }}
        _other_keys_with_route: >-
          {%- set ns = namespace(keys=[]) -%}
          {%- for key in _llm_router_declared_virtual_keys
                if key.alias != 'sandbox-agent'
                   and (key.models | intersect(_sandbox_model_ids) | length > 0) -%}
          {%- set ns.keys = ns.keys + [key.alias] -%}
          {%- endfor -%}
          {{ ns.keys }}
        _class_scopes: >-
          {{ {
            'all': llm_router_d1_all_key_groups,
            'standard': llm_router_d1_standard_key_groups,
            'zdr': llm_router_d1_zdr_key_groups,
            'local': _llm_router_local_agent_groups,
          } }}
        _class_scopes_with_route: >-
          {%- set ns = namespace(scopes=[]) -%}
          {%- for scope in _class_scopes | dict2items -%}
          {%- if scope.value | intersect(_sandbox_model_ids) | length > 0 -%}
          {%- set ns.scopes = ns.scopes + [scope.key] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.scopes }}

    - name: Check the rendered OpenCode model ids and retention boundary
      ansible.builtin.assert:
        quiet: true
        that:
          - _go_entries | length > 0
          - _go_entries | selectattr('tags', 'contains', 'sandbox-only') | list | length == _go_entries | length
          - _go_entries | selectattr('route_group', 'defined') | list | length == 0
          - _target_rows | length == _go_entries | length
          - _target_rows | map(attribute='model_name') | sort | list == _sandbox_model_ids | sort | list
          - >-
            _target_rows | selectattr('litellm_params.tags', 'defined')
            | selectattr('litellm_params.tags', 'contains', 'sensitivity:public')
            | list | length == _target_rows | length
          - _opencode_glm_entries | length == 0
          - _legacy_alias_token not in (_render_config | to_json)
          - _disabled_opencode_models | length > 0
          - >-
            _disabled_opencode_models | map(attribute='client_model_id') | list
            | intersect(_render_config.model_list | map(attribute='model_name') | list) | length == 0
          - >-
            _disabled_opencode_upstream_names | intersect(_render_config.model_list
              | map(attribute='litellm_params.model') | list) | length == 0
          - _expired_model_ids | length > 0
          - _sandbox_key.sensitivity_tag == '&sensitivity:public'
          - _expired_model_ids | difference(_sandbox_key.models) | length == 0
          - _expired_model_ids | intersect(llm_router_d1_zdr_rungs_by_class['sub']) | length == 0
          - _expired_model_ids | intersect(_llm_router_private_zdr_model_scope) | length == 0
          - _expired_rows | length == _expired_model_ids | length
          - >-
            _expired_rows | selectattr('litellm_params.tags', 'contains', 'retains')
            | list | length == _expired_rows | length
          - >-
            _expired_rows | selectattr('litellm_params.tags', 'contains', 'sensitivity:public')
            | list | length == _expired_rows | length
          - >-
            _expired_rows | selectattr('litellm_params.tags', 'contains', 'sensitivity:sensitive')
            | list | length == 0
        fail_msg: >-
          Go entries={{ _go_entries }}, rendered targets={{ _target_rows }},
          expired={{ _expired_rows }}.
        success_msg: >-
          Sandbox OpenCode model ids render directly; expired-ZDR entries stay
          available only to the public sandbox lane.
      vars:
        _sandbox_key: >-
          {{ _render_keys
             | selectattr('alias', 'equalto', 'sandbox-agent') | first }}
        _go_entries: >-
          {{ llm_router_registry_enabled
             | selectattr('tier', 'equalto', 'opencode')
             | selectattr('tags', 'defined') | selectattr('tags', 'contains', 'sandbox-only')
             | selectattr('enabled', 'truthy') | list }}
        _target_rows: >-
          {{ _render_config.model_list
             | selectattr('model_name', 'in', _sandbox_model_ids) | list }}
        _opencode_glm_entries: >-
          {{ _go_entries | selectattr('client_model_id', 'search', '(?i)glm') | list
             + (_go_entries | selectattr('upstream_model_id', 'search', '(?i)glm') | list) }}
        _expired_models: >-
          {{ _go_entries | selectattr('zero_data_retention_expires', 'defined') | list }}
        _expired_model_ids: "{{ _expired_models | map(attribute='client_model_id') | list }}"
        _expired_rows: >-
          {{ _render_config.model_list
             | selectattr('model_name', 'in', _expired_model_ids) | list }}
        _legacy_alias_token: '"public-cheap"'
        _disabled_opencode_models: >-
          {{ llm_router_model_registry | selectattr('tier', 'equalto', 'opencode')
             | rejectattr('enabled') | list }}
        _disabled_opencode_upstream_names: >-
          {%- set ns = namespace(names=[]) -%}
          {%- for model in _disabled_opencode_models -%}
          {%- set ns.names = ns.names + [model.litellm_model_name
                | default(model.provider ~ '/' ~ model.upstream_model_id)] -%}
          {%- endfor -%}
          {{ ns.names }}
