---
- name: Verify the sandbox-only public cheap route groups OpenCode Go models
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the shared router fixture
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/ladder_keys_fixture.yml"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Add the fixture sandbox key and keep the large tier gated off
      ansible.builtin.set_fact:
        bao_apps_secrets: >-
          {{ (bao_apps_secrets | default({})) | combine({
            'sandbox_agent_router_llm_router_key': 'fixture-sandbox-agent'}) }}
        llm_router_llm_vllm_enabled: false
        llm_router_vllm_precheck_passed: false
      no_log: true

    - name: Refresh the router projections
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Render config and effective virtual keys
      ansible.builtin.set_fact:
        _render_config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"
        _render_keys: "{{ llm_router_virtual_keys }}"

    - name: Find sandbox-only aliases and their rendered targets
      ansible.builtin.set_fact:
        _sandbox_only_aliases: "{{ llm_router_sandbox_only_aliases }}"
        _alias_targets: >-
          {%- set ns = namespace(targets=[]) -%}
          {%- for m in llm_router_model_registry
                if m.enabled and m.stable_aliases is defined
                   and (m.stable_aliases | intersect(llm_router_sandbox_only_aliases) | length > 0) -%}
          {%- set _group = m.route_group | default(m.client_model_id) -%}
          {%- if _group not in ns.targets -%}
          {%- set ns.targets = ns.targets + [_group] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.targets }}

    - name: Find enabled OpenCode deployments in each public group
      ansible.builtin.set_fact:
        _go_entries: >-
          {{ llm_router_opencode_models
             | selectattr('route_group', 'defined')
             | selectattr('route_group', 'in', _alias_targets)
             | list }}

    - name: The public cheap alias resolves to the ordered OpenCode Go group with public-data tags
      ansible.builtin.assert:
        quiet: true
        that:
          - _sandbox_only_aliases | length > 0
          - _expected_sandbox_aliases == _sandbox_only_aliases
          - >-
            _render_config.router_settings.model_group_alias.keys() | list
            | intersect(_sandbox_only_aliases) | length
            == _sandbox_only_aliases | length
          - _alias_targets == _expected_alias_targets
          - _go_entries | length == _expected_go_entries | length
          - >-
            _go_entries | map(attribute='client_model_id') | sort | list
            == _expected_go_entries | map(attribute='client_model_id') | sort | list
          - _go_entries | selectattr('order', 'defined') | map(attribute='order') | list | sort == _expected_orders
          - _go_entries | selectattr('tags', 'contains', 'sandbox-only') | list | length == _go_entries | length
          - _target_rows | length == _expected_go_entries | length
          - _rendered_order_rows == _registry_order_rows
          - _public_tagged_targets | length == _target_rows | length
          - _alias_rows | length == 0
          - _disabled_opencode_models | length > 0
          - >-
            _disabled_opencode_models | map(attribute='client_model_id') | list
            | intersect(_go_entries | map(attribute='client_model_id') | list) | length == 0
          - >-
            _disabled_opencode_model_names | intersect(_render_config.model_list
              | map(attribute='model_name') | list) | length == 0
          - >-
            _disabled_opencode_upstream_names | intersect(_render_config.model_list
              | map(attribute='litellm_params.model') | list) | length == 0
          - _retry_policy.RateLimitErrorRetries | int >= 1
        fail_msg: >-
          sandbox aliases={{ _sandbox_only_aliases }}, targets={{ _alias_targets }},
          Go entries={{ _go_entries }}, rendered targets={{ _target_rows }}.
        success_msg: >-
          The sandbox-only route resolves each ordered OpenCode Go registry deployment,
          uses the rendered 429 retry policy, and excludes disabled upstreams.
      vars:
        _expected_sandbox_aliases: >-
          {%- set ns = namespace(aliases=[]) -%}
          {%- for m in llm_router_model_registry
                if m.enabled and m.in_free_route | default(false) | bool
                   and 'sandbox-only' in m.tags | default([])
                   and m.stable_aliases is defined -%}
          {%- set ns.aliases = ns.aliases + m.stable_aliases -%}
          {%- endfor -%}
          {{ ns.aliases | unique | list }}
        _expected_alias_targets: >-
          {%- set ns = namespace(targets=[]) -%}
          {%- for m in llm_router_model_registry
                if m.enabled and m.stable_aliases is defined
                   and (m.stable_aliases | intersect(_sandbox_only_aliases) | length > 0) -%}
          {%- set ns.targets = ns.targets + [m.route_group | default(m.client_model_id)] -%}
          {%- endfor -%}
          {{ ns.targets | unique | list }}
        _expected_go_entries: >-
          {{ llm_router_opencode_models
             | selectattr('route_group', 'defined')
             | selectattr('route_group', 'in', _expected_alias_targets) | list }}
        _expected_orders: >-
          {{ _expected_go_entries | map(attribute='order') | map('int') | sort | list }}
        _registry_order_rows: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for m in _expected_go_entries -%}
          {%- set ns.rows = ns.rows + [[m.order | int,
                m.litellm_model_name | default(m.provider ~ '/' ~ m.upstream_model_id)]] -%}
          {%- endfor -%}
          {{ ns.rows | sort }}
        _rendered_order_rows: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for d in _target_rows -%}
          {%- set ns.rows = ns.rows + [[d.litellm_params.order | int,
                d.litellm_params.model]] -%}
          {%- endfor -%}
          {{ ns.rows | sort }}
        _target_rows: >-
          {{ _render_config.model_list
             | selectattr('model_name', 'in', _alias_targets) | list }}
        _public_tagged_targets: >-
          {{ _target_rows
             | selectattr('litellm_params.tags', 'defined')
             | selectattr('litellm_params.tags', 'contains', 'sensitivity:public') | list }}
        _alias_rows: >-
          {{ _render_config.model_list
             | selectattr('model_name', 'in', _sandbox_only_aliases) | list }}
        _disabled_opencode_models: >-
          {{ llm_router_model_registry | selectattr('tier', 'equalto', 'opencode')
             | rejectattr('enabled') | list }}
        _disabled_opencode_model_names: >-
          {{ _disabled_opencode_models | map(attribute='client_model_id') | list }}
        _disabled_opencode_upstream_names: >-
          {%- set ns = namespace(names=[]) -%}
          {%- for m in _disabled_opencode_models -%}
          {%- set ns.names = ns.names + [m.litellm_model_name
                | default(m.provider ~ '/' ~ m.upstream_model_id)] -%}
          {%- endfor -%}
          {{ ns.names }}
        _retry_policy: >-
          {{ _render_config.router_settings.model_group_retry_policy[_alias_targets | first] }}

    - name: The sandbox virtual key is the only key granted the public route alias
      ansible.builtin.assert:
        quiet: true
        that:
          - _sandbox_key.models | intersect(_sandbox_only_aliases) | length == _sandbox_only_aliases | length
          - _keys_with_alias | length == 1
          - _keys_with_alias[0].alias == 'sandbox-agent'
        fail_msg: >-
          aliases={{ _sandbox_only_aliases }}, keys={{ _keys_with_alias | map(attribute='alias') | list }}.
        success_msg: "Only sandbox-agent can request the public route alias."
      vars:
        _sandbox_key: >-
          {{ _render_keys | selectattr('alias', 'equalto', 'sandbox-agent') | first }}
        _keys_with_alias: >-
          {%- set ns = namespace(keys=[]) -%}
          {%- for key in _render_keys
                if (key.models | intersect(_sandbox_only_aliases) | length > 0) -%}
          {%- set ns.keys = ns.keys + [key] -%}
          {%- endfor -%}
          {{ ns.keys }}
