---
# A live role is seeded only while it is absent. In `initial` mode a role whose
# target or model_info differs from Git survives a seed run unchanged: it is
# neither created, deleted nor recreated (tasks/drift-check.yml reports it).
# Only `rebuild` deletes and recreates every live role. Uses the projections
# tasks/seed-roles.yml loops over, as they ship in defaults/main/55-roles.yml.
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_role_model_info_reconcile.yml -i localhost, -c local

- name: Seed only absent roles; leave every existing role alone outside rebuild
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the registry as the router role does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml
        public: true

    - name: Model a live role on a non-Git target, a live role with a stale window, and an absent role
      ansible.builtin.set_fact:
        llm_router_seed_mode: initial
        llm_router_role_deployments:
          - {role: retargeted-in-ui, model: "{{ llm_router_hermes_local_4080_id }}", fallbacks: []}
          - {role: stale-window, model: "{{ llm_router_hermes_local_4080_id }}", fallbacks: []}
          - {role: absent-role, model: "{{ llm_router_hermes_local_4080_id }}", fallbacks: []}
        _llm_router_live_models:
          - retargeted-in-ui
          - stale-window
          - "{{ llm_router_hermes_local_4080_id }}"

    - name: Assert initial mode creates only the absent role and rebuilds nothing
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_roles_to_create | map(attribute='role') | list == ['absent-role']
          - _llm_router_roles_to_rebuild == []

    - name: Switch to rebuild mode
      ansible.builtin.set_fact:
        llm_router_seed_mode: rebuild

    - name: Assert rebuild mode re-seeds every live role
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_roles_to_rebuild | map(attribute='role') | sort == ['retargeted-in-ui', 'stale-window']

- name: The seed tasks loop only over the shipped projections
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
  tasks:
    - name: Read tasks/seed-roles.yml
      ansible.builtin.slurp:
        src: "{{ _role_dir }}/tasks/seed-roles.yml"
      register: _seed_roles_source

    - name: Assert every create and delete loop uses a projection
      ansible.builtin.assert:
        quiet: true
        that:
          - (_text | regex_findall('loop:.*_llm_router_roles_to_create')) | length == 2
          - (_text | regex_findall('loop:.*_llm_router_roles_to_rebuild')) | length == 3
          - "(_text | regex_findall('url. .*/model/(new|delete)')) | length == 3"
          - "(_text | regex_findall('seed_model.: item[.]model')) | length == 2"
      vars:
        _text: "{{ _seed_roles_source.content | b64decode }}"
