---
# A backend switch removes only that deployment. The capability name remains
# live when another registry member serves it, so parity stays group-based.
- name: Verify the vLLM switch keeps the CPU member but removes the vLLM backend
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
        llm_cpu_scaler:
          tags:
            nine_b: fixture-cpu-small
      containers:
        cpu-fixture:
          ip: 127.0.0.1
          tags: [fixture-cpu-small]
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Load the role defaults and registry the way the converge does
      ansible.builtin.import_tasks: tasks/parity_setup.yml

    - name: Switch off the vLLM deployment
      ansible.builtin.set_fact:
        llm_router_llm_vllm_enabled: false

    - name: Refresh the router projections with vLLM disabled
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Render the switched-off config
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: Registry parity still holds at the capability group boundary
      ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/assert-registry-render-parity.yml"

    - name: Small stays served by CPU while the vLLM backend is absent
      ansible.builtin.assert:
        quiet: true
        that:
          - _cpu_small | length > 0
          - _vllm_small | length == 0
          - llm_router_vllm_models | length == 0
        fail_msg: >-
          Switching vLLM off must remove its deployment while leaving the
          CPU-backed small capability available.
      vars:
        _cpu_small: >-
          {{ _config.model_list | selectattr('model_name', 'equalto', llm_router_small_model)
             | selectattr('litellm_params.api_base', 'equalto', llm_router_cpu_9b_backend_urls[0]) | list }}
        _vllm_small: >-
          {{ _config.model_list | selectattr('model_name', 'equalto', llm_router_small_model)
             | selectattr('litellm_params.api_base', 'equalto', llm_router_llm_vllm_base_url) | list }}

    - name: Build a synthetic vLLM-only registry member
      ansible.builtin.set_fact:
        _synthetic_vllm_member: >-
          {{ (llm_router_registry_enabled | selectattr('tier', 'equalto', 'vllm') | first)
             | combine({'route_group': 'fixture-vllm-only'}) }}

    - name: Plant an exclusive vLLM route despite the disabled projection
      ansible.builtin.set_fact:
        llm_router_registry_enabled: "{{ llm_router_registry_enabled + [_synthetic_vllm_member] }}"
        # Model a template regression that routes a vLLM entry through a live list.
        llm_router_large_models: "{{ llm_router_large_models + [_synthetic_vllm_member] }}"

    - name: Refresh the projections for the synthetic switched-off route
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Render the synthetic switched-off route
      ansible.builtin.set_fact:
        _synthetic_config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}

    - name: Confirm the synthetic vLLM-only route was rendered
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _synthetic_config.model_list
            | selectattr('model_name', 'equalto', _synthetic_vllm_member.route_group) | list | length > 0

    - name: Require the guard to reject a switched-off exclusive vLLM route
      block:
        - name: Check parity for the synthetic switched-off route
          ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/assert-registry-render-parity.yml"

        - name: Fail when the guard accepts the switched-off route
          ansible.builtin.fail:
            msg: "The parity guard accepted a switched-off vLLM-only route."
      rescue:
        - name: Confirm the guard reported the switched-off rendered route
          ansible.builtin.assert:
            quiet: true
            that:
              - "'SWITCHED OFF BUT RENDERED' in ansible_failed_result.msg"
            fail_msg: >-
              Expected the switched-off rendered route failure, got:
              {{ ansible_failed_result.msg | default('no failure message') }}
