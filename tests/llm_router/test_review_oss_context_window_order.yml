---
# Transitional model-group aliases inherit the fallback order of their
# registry target, with the target removed to prevent a self-cycle.
- name: Verify capability alias fallback ordering
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
        llm_cpu_scaler:
          tags:
            nine_b: fixture-cpu-small
      containers:
        cpu-fixture:
          ip: 127.0.0.1
          tags: [fixture-cpu-small]
    bao_apps_secrets: {}
    bao_local_llm_secrets:
      OPENROUTER_API_KEY: fixture-openrouter
      OPENROUTER_HERMES_KEY: fixture-hermes
      OPENAI_API_KEY: fixture-openai
    llm_router_subdomain: "pve.example.test"
    llm_large_serving_host: llm-large
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_router_retry_after_seconds: 2
    hermes_goal_judge_model: judge
    hermes_brain_model: "{{ llm_router_primary_model }}"
    hindsight_retain_model: "{{ llm_router_small_model }}"
  tasks:
    - name: Load the role defaults and registry
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load registry projections
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Re-evaluate credentialed cloud projections
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

    - name: Render the config without contacting serving endpoints
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: Index the rendered fallback map
      ansible.builtin.set_fact:
        _fallback_pairs: "{{ _config.router_settings.fallbacks | map('dict2items') | flatten }}"

    - name: Every alias has an ordered fallback entry without its target or itself
      ansible.builtin.assert:
        quiet: true
        that:
          - _aliases | length > 0
          - _fallback_pairs | map(attribute='key') | unique | length == _fallback_pairs | length
          - _missing | length == 0
          - _mismatched | length == 0
        fail_msg: "missing={{ _missing }}, mismatched={{ _mismatched }}"
      vars:
        _aliases: >-
          {{ (llm_router_model_group_aliases | dict2items)
             | rejectattr('key', 'in', llm_router_direct_route_aliases) | list }}
        _fallback_map: >-
          {{ dict(_fallback_pairs | map(attribute='key')
                  | zip(_fallback_pairs | map(attribute='value'))) }}
        _missing: "{{ _aliases | map(attribute='key') | difference(_fallback_map.keys()) | list }}"
        _mismatched: >-
          {%- set ns = namespace(bad=[]) -%}
          {%- for pair in _aliases -%}
          {%- set name = pair.key -%}
          {%- set target = pair.value -%}
          {%- set expected = llm_router_entry_point_fallback_overrides.get(
                name, llm_router_hermes_default_fallback_chain
                | reject('equalto', name) | reject('equalto', target) | list) -%}
          {%- if name in llm_router_zdr_entry_point_names
                and name not in llm_router_entry_point_fallback_overrides -%}
          {%- set expected = expected | reject('in', llm_router_zdr_unasserted_terminal_rungs) | list -%}
          {%- endif -%}
          {%- if name in (llm_router_cross_modality_fail_fast_names
                           + llm_router_local_only_fail_fast_names) -%}
          {%- set expected = [] -%}
          {%- endif -%}
          {%- if _fallback_map.get(name, none) != expected -%}
          {%- set ns.bad = ns.bad + [name] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.bad }}
