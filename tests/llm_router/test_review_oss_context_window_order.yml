---
# Split from test_review_roles.yml (2026-09-20, token budget) — see that
# file's header for the review-role contract this pins one clause of:
# review-oss's context_window_fallbacks entry must equal its own chain minus
# local rungs, IN ORDER. 37-fallback-entry-points.yml must build it with
# `reject('in', _local) | list`, not the set-based `difference`, which
# reorders non-deterministically per PYTHONHASHSEED.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_review_oss_context_window_order.yml -i localhost, -c local
- name: Verify review-oss's context-window escape order
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_apps_secrets:
      github_actions_llm_router_key: sk-fixture-gha
      github_actions_oss_llm_router_key: sk-fixture-gha-oss
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: "pve.example.test"
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
    bao_local_llm_secrets:
      OPENROUTER_API_KEY: sk-or-fixture
      OPENROUTER_HERMES_KEY: sk-orh-fixture
      OPENAI_API_KEY: sk-oa-fixture
      ZAI_API_KEY: sk-zai-fixture
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the fabric model registry the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    # include_vars loads the role default (false) as a host fact, which
    # outranks a play var: model a logged-in node with a fact of the same rank.
    - name: Model a node that holds a ChatGPT login
      ansible.builtin.set_fact:
        llm_router_chatgpt_auth_file_present: true

    - name: Run the role's own admission-budget assert
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: assert-admission-budget.yml

    - name: Render config.yaml.j2 with every credential present
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: Note the review-oss deployment
      ansible.builtin.set_fact:
        _public: "{{ llm_router_role_deployments | selectattr('role', 'equalto', 'review-oss') | first }}"

    - name: Review-oss context-window escape is deterministic and in declared order
      ansible.builtin.assert:
        quiet: true
        that:
          - _cwf_review_oss | length > 0
          - _cwf_review_oss == _expected_review_oss_cwf
        fail_msg: >-
          context_window_fallbacks[review-oss] must equal review-oss's own
          chain minus its local rungs, IN ORDER
          (37-fallback-entry-points.yml must use `reject('in', _local) |
          list`, not the set-based `difference`, which reorders
          non-deterministically per PYTHONHASHSEED). Rendered:
          {{ _cwf_review_oss }}. Expected: {{ _expected_review_oss_cwf }}.
        success_msg: "context_window_fallbacks[review-oss] == {{ _cwf_review_oss }}, in declared order"
      vars:
        _local_rungs: "{{ llm_router_local_fallback_groups + [llm_router_primary_model] + llm_router_servable_models }}"
        _expected_review_oss_cwf: "{{ _public.fallbacks | reject('in', _local_rungs) | list }}"
        _cwf_review_oss: >-
          {{ (_config.router_settings.context_window_fallbacks
              | map('dict2items') | flatten
              | selectattr('key', 'equalto', 'review-oss')
              | map(attribute='value') | list | first) | default([]) }}
