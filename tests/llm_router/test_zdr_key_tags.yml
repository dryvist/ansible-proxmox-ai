---
- name: Verify ZDR-only and sensitivity key tags
  hosts: localhost
  gather_facts: false
  vars_files:
    - policy_fixture.yml
    - ../../inventory/group_vars/all/02-gpu-accelerator.yml
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets:
      CHATGPT_LOGIN_FILE: /dev/null
      DASHSCOPE_API_KEY: fixture-dashscope
      GEMINI_API_KEY: fixture-gemini
      OPENAI_API_KEY: fixture-openai
      OPENCODE_API_KEY: fixture-opencode
      OPENROUTER_API_KEY: fixture-openrouter
      OPENROUTER_HERMES_KEY: fixture-hermes-openrouter
    bao_apps_secrets:
      hindsight_llm_router_key: sk-fixture-hindsight
      litellm_local_llm_router_key: sk-fixture-litellm-local
      litellm_local_workstation_llm_router_key: sk-fixture-workstation
      hermes_default_llm_router_key: sk-fixture-hermes-private
      hermes_private_llm_router_key: sk-fixture-hermes-private-only
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: fixture-large-bearer
    llm_router_llm_fast_base_url: http://localhost:10434/v1
    llm_router_llm_light_base_url: http://localhost:10434/v1
    llm_router_llm_large_base_url: http://localhost:11434/v1
    llm_router_llm_vllm_base_url: http://localhost:10434/v1
    hermes_agent_identity: donna
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hermes_goal_judge_model: judge
    hindsight_retain_model: qwen3-4b
    _seed_keys_file: "{{ _role_dir }}/tasks/seed-keys.yml"
    _key_policy_file: "{{ _role_dir }}/tasks/reconcile-seeded-key-policy.yml"
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Render the fully credentialed config
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: The ZDR-only key aliases carry per-hop tag filtering and cannot list unsafe rungs
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_seed_mode == 'initial'
          - _zdr_keys | length == 10
          - >-
            _zdr_keys | map(attribute='alias') | sort
            == [
              'dify', 'github-actions-ci-fix', 'github-actions-pr-review',
              (
                _llm_router_hermes_profile_keys
                | selectattr('alias', 'search', '-default$')
                | map(attribute='alias') | first
              ),
              'hermes-private', 'hindsight', 'langfuse',
              'litellm-local', 'litellm-local-workstation', 'openhands'
            ]
          - _bad_keys | length == 0
        fail_msg: >-
          ZDR key aliases={{ _zdr_keys | map(attribute='alias') | list }}
          unsafe={{ _bad_keys }}
        success_msg: "All ten ZDR-only keys require ZDR, exclude free, and enable tag filtering."

      vars:
        _zdr_keys: >-
          {%- set ns = namespace(keys=[]) -%}
          {%- for k in llm_router_virtual_keys if '&zdr' in (k.tags | default([])) -%}
          {%- set ns.keys = ns.keys + [k] -%}
          {%- endfor -%}
          {{ ns.keys }}
        _bad_keys: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for k in _zdr_keys -%}
          {%- set _unsafe = k.models | intersect(llm_router_zdr_unasserted_terminal_rungs) -%}
          {%- if '!free' not in (k.tags | default([]))
                or not (k.router_settings.enable_tag_filtering | default(false) | bool)
                or (_unsafe | length > 0) -%}
          {%- set ns.rows = ns.rows + [k.alias ~ ':' ~ (_unsafe | string)] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.rows }}

    - name: The dify key calls the local-only medium recorder role through an empty fallback chain
      ansible.builtin.assert:
        quiet: true
        that:
          - "'recorder-medium' in _dify.models"
          - llm_router_primary_model in _dify.models
          - "'recorder-medium' in llm_router_local_only_fail_fast_names"
          - _role.model == llm_router_primary_model
          - _role.fallbacks == []
          - _role.litellm_params.turn_off_message_logging is sameas true
          - _rendered_chain == []
        fail_msg: "dify models={{ _dify.models }}, role={{ _role }}, rendered chain={{ _rendered_chain }}"
        success_msg: "dify reaches recorder-medium on the medium capability with no fallback."
      vars:
        _dify: "{{ llm_router_virtual_keys | selectattr('alias', 'equalto', 'dify') | first }}"
        _role: "{{ llm_router_role_deployments | selectattr('role', 'equalto', 'recorder-medium') | first }}"
        _rendered_chain: >-
          {{ _config.router_settings.fallbacks | map('dict2items') | flatten
             | selectattr('key', 'equalto', 'recorder-medium') | map(attribute='value') | first }}

    - name: The automated langfuse and dify keys cannot reach a zero_data_retention false group
      ansible.builtin.assert:
        quiet: true
        that:
          - _automated_keys | length == 2
          - _retaining_reach | length == 0
          - _judge_reach | length == 0
        fail_msg: >-
          automated keys={{ _automated_keys | map(attribute='alias') | list }}
          reaching zero_data_retention false groups={{ _retaining_reach }},
          naming the judge role={{ _judge_reach }}
        success_msg: "langfuse and dify reach no zero_data_retention false group and no judge role."
      vars:
        _automated_keys: >-
          {%- set ns = namespace(keys=[]) -%}
          {%- for k in llm_router_virtual_keys if k.alias in ['langfuse', 'dify'] -%}
          {%- set ns.keys = ns.keys + [k] -%}
          {%- endfor -%}
          {{ ns.keys }}
        _retaining_reach: >-
          {%- set ns = namespace(aliases=[]) -%}
          {%- for k in _automated_keys
                if (k.models | intersect(llm_router_zdr_false_group_names) | length) > 0 -%}
          {%- set ns.aliases = ns.aliases + [k.alias] -%}
          {%- endfor -%}
          {{ ns.aliases }}
        _judge_reach: >-
          {%- set ns = namespace(aliases=[]) -%}
          {%- for k in _automated_keys if 'judge' in k.models -%}
          {%- set ns.aliases = ns.aliases + [k.alias] -%}
          {%- endfor -%}
          {{ ns.aliases }}

    - name: Read the create and reconcile key request definitions
      ansible.builtin.set_fact:
        _create_metadata_source: >-
          {{ (lookup('file', _seed_keys_file) | from_yaml
              | selectattr('name', 'search', 'Create the caller keys')
              | first)['ansible.builtin.uri']['body']['metadata'] }}
        _create_router_settings_source: >-
          {{ (lookup('file', _seed_keys_file) | from_yaml
              | selectattr('name', 'search', 'Create the caller keys')
              | first)['ansible.builtin.uri']['body']['router_settings'] }}
        _reconcile_expression: >-
          {{ (lookup('file', _key_policy_file) | from_yaml
              | selectattr('name', 'equalto', 'Compute the key policy update each live key still needs, if any')
              | first)['ansible.builtin.set_fact']['_llm_router_key_updates'] }}
        _update_body_source: >-
          {{ (lookup('file', _key_policy_file) | from_yaml
              | selectattr('name', 'equalto', 'Reconcile caller policy for live keys that changed')
              | first)['ansible.builtin.uri']['body'] }}

    - name: The create body carries filters and reconciliation enforces sensitivity
      ansible.builtin.assert:
        quiet: true
        that:
          - "'item.tags' in _create_metadata_source"
          - "'item.sensitivity_tag' in _create_metadata_source"
          - "'item.router_settings | default(omit)' in _create_router_settings_source"
          - "'item.tags' not in _reconcile_expression"
          - "'_sensitivity_tag' in _reconcile_expression"
          - "'_sensitivity_changed' in _reconcile_expression"
          - "'router_settings_ref' in _reconcile_expression"
          - "'_k.priority_tier is defined' in _reconcile_expression"
          - "'_restored_settings = _live_router_settings.copy()' in _reconcile_expression"
          - "'_restored_settings if _policy' in _reconcile_expression"
          - "\"llm_router_seed_mode == 'rebuild'\" in _reconcile_expression"
          - "'router_settings' not in _update_body_source"
        fail_msg: >-
          create metadata={{ _create_metadata_source }}, create settings={{ _create_router_settings_source }},
          reconcile={{ _reconcile_expression }}, update body={{ _update_body_source }}
        success_msg: "Sensitivity and priority policy reconcile in every mode while unrelated live settings persist."
