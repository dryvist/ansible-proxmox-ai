---
# OpenCode Go requires an x-opencode-session header on every request. Covers
# the standalone subscription-tier deployments (model-list-opencode.yaml.j2).
#
# Deliberately does NOT touch, assert on, or reuse
# tests/llm_router/tasks/credentialed_render.yml — that shared fixture feeds
# ~20 other contract tests, several of which assert exact chain/deployment
# composition, and seeding OPENCODE_API_KEY there would shift what all of
# them see. This test owns its own minimal, OpenCode-only fixture instead,
# the same shape test_opencode_only_entry_points.yml already uses.
- name: Verify OpenCode deployments carry their configured session header
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Load the catalog-backed model registry
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml
        public: true

    - name: Configure the shared budget store
      ansible.builtin.set_fact:
        llm_router_redis_host: redis.example.test
        llm_router_redis_password: test-only-not-a-real-password

    - name: Seed only the OpenCode credential
      ansible.builtin.set_fact:
        bao_local_llm_secrets:
          OPENCODE_API_KEY: test-opencode-subscription-key

    - name: Re-evaluate the Hermes cloud projections and new segments
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"
        - "{{ _role_dir }}/defaults/main/36-hermes-cloud-segments.yml"

    - name: Render the config
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: Every registered OpenCode deployment renders, with no retired free routes
      ansible.builtin.assert:
        quiet: true
        that:
          - _standalone_opencode | length == llm_router_opencode_models | length
          - _go_deployments | length == 2
          - _go_api_mismatches | length == 0
          - _retired_free_routes | length == 0
      vars:
        _standalone_opencode: >-
          {{ _config.model_list
             | selectattr('model_name', 'in', llm_router_opencode_models
                          | map(attribute='client_model_id') | list) | list }}
        _retired_free_routes: >-
          {{ _config.model_list | selectattr('model_name', 'in', ['free', 'free-zdrless']) | list }}
        _go_deployments: >-
          {{ _standalone_opencode
             | selectattr('model_name', 'match', '^go-') | list }}
        _go_api_mismatches: >-
          {%- set ns = namespace(bad=[]) -%}
          {%- for d in _go_deployments -%}
          {%- set m = llm_router_opencode_models
                | selectattr('client_model_id', 'equalto', d.model_name) | first -%}
          {%- if d.litellm_params.api_base != llm_router_opencode_base_url
                or d.litellm_params.model != (m.provider ~ '/' ~ m.upstream_model_id)
                or not (d.litellm_params.use_chat_completions_api | bool) -%}
          {%- set ns.bad = ns.bad + [d.model_name] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.bad }}

    - name: Every OpenCode deployment carries its per-deployment x-opencode-session value
      ansible.builtin.assert:
        quiet: true
        that:
          - _header_mismatches | length == 0
          - _go_deployments | length == 2
          - _go_api_mismatches | length == 0
        fail_msg: >-
          OpenCode Go requires x-opencode-session on every request. Standalone
          deployments with an unexpected value: {{ _header_mismatches }}.
          Fix: model-list-opencode.yaml.j2 (litellm_params.extra_headers).
        success_msg: >-
          All {{ _standalone_opencode | length }} OpenCode deployments carry
          the configured x-opencode-session value.
      vars:
        _standalone_opencode: >-
          {{ _config.model_list
             | selectattr('model_name', 'in', llm_router_opencode_models
                          | map(attribute='client_model_id') | list) | list }}
        _header_mismatches: >-
          {%- set ns = namespace(bad=[]) -%}
          {%- for d in _standalone_opencode -%}
          {%- set _hdr = (d.litellm_params.extra_headers | default({})).get('x-opencode-session', '') -%}
          {%- set _expected = llm_router_opencode_session_prefix ~ '-'
                ~ (d.model_name | regex_replace('/', '-')) -%}
          {%- if _hdr != _expected -%}
          {%- set ns.bad = ns.bad + [d.model_name] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.bad }}
        _go_deployments: >-
          {{ _standalone_opencode
             | selectattr('model_name', 'match', '^go-') | list }}
        _go_api_mismatches: >-
          {%- set ns = namespace(bad=[]) -%}
          {%- for d in _go_deployments -%}
          {%- set m = llm_router_opencode_models
                | selectattr('client_model_id', 'equalto', d.model_name) | first -%}
          {%- if d.litellm_params.api_base != llm_router_opencode_base_url
                or d.litellm_params.model != (m.provider ~ '/' ~ m.upstream_model_id)
                or not (d.litellm_params.use_chat_completions_api | bool) -%}
          {%- set ns.bad = ns.bad + [d.model_name] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.bad }}
