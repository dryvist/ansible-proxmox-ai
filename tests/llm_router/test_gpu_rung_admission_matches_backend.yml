---
# The router and the serving role must derive the GPU models' limits from the
# same catalog rows. This fixture supplies a host value derived from those rows
# so the serving-side guard and rendered router values can be compared.
#
# Run (from the REPO ROOT — the registry load resolves the llm_router role
# through ansible.cfg's cwd-relative roles_path):
#   ansible-playbook tests/llm_router/test_gpu_rung_admission_matches_backend.yml -i localhost, -c local
- name: Verify GPU router limits derive from the shared catalog
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
        llm_cpu_scaler:
          tags:
            nine_b: fixture-cpu-small
      containers:
        cpu-fixture:
          ip: 127.0.0.1
          tags: [fixture-cpu-small]
        serving-fixture:
          fqdn: serving-fixture.internal.example.test
          tags: []
        gpu-fixture:
          fqdn: gpu-fixture.internal.example.test
          tags: []
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the fabric model registry the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Load the actual GPU serving group variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../inventory/group_vars/llm_vllm_group.yml"

    - name: Set the render's test subdomain after loading role defaults
      ansible.builtin.set_fact:
        llm_router_subdomain: "pve.internal.example.test"

    - name: Set vLLM availability from the enabled registry entries
      ansible.builtin.set_fact:
        llm_router_llm_vllm_enabled: >-
          {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'vllm')
             | list | length > 0 }}
        llm_router_vllm_precheck_passed: >-
          {{ llm_router_registry_enabled | selectattr('tier', 'equalto', 'vllm')
             | list | length > 0 }}

    - name: Refresh cached router projections after fixture input changes [gpu-rung-admission-matches-backend-1]
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Run the serving role's catalog and preset guards
      ansible.builtin.include_role:
        name: llama_cpp
        tasks_from: guards.yml
      when: llama_cpp_models | length > 0

    - name: The serving process parallelism is an inventory setting
      ansible.builtin.assert:
        quiet: true
        that:
          - _catalog_models | length == llama_cpp_catalog_lookup_names | length
          - llama_cpp_parallel | int > 0
          - llm_router_vllm_models | length == llama_cpp_models | length
          - llm_router_vllm_models | map(attribute='client_model_id') | list
            == llama_cpp_models | map(attribute='name') | list
        fail_msg: >-
          inventory/group_vars/llm_vllm_group.yml must declare the single
          process parallelism that both llama-server and the router consume.
      vars:
        _catalog_models: >-
          {%- set ns = namespace(models=[]) -%}
          {%- for model in llm_model_catalog_models -%}
          {%- if model.name in llama_cpp_catalog_lookup_names
                or (model.aliases | default([])
                    | intersect(llama_cpp_catalog_lookup_names) | length > 0) -%}
          {%- set ns.models = ns.models + [model] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.models }}
        _registry_members: "{{ llm_router_vllm_models }}"

    - name: Read the serving group's catalog-derived parallelism
      ansible.builtin.set_fact:
        _vllm_parallel: "{{ llama_cpp_parallel | int }}"

    - name: Add the synthetic vLLM guest with inventory serving parallelism
      ansible.builtin.add_host:
        name: serving-fixture
        groups: llm_vllm_group
        llama_cpp_parallel: "{{ _vllm_parallel }}"
        llama_cpp_prefill_tokens_per_second: 120

    - name: Add a separate synthetic GPU backend
      ansible.builtin.add_host:
        name: gpu-fixture
        groups: llm_gpu_group

    - name: Render the real config.yaml.j2 template into a string
      ansible.builtin.set_fact:
        _rendered_config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') }}"

    - name: Parse the rendered config as YAML
      ansible.builtin.set_fact:
        _config: "{{ _rendered_config | from_yaml }}"

    - name: The disabled GPU tier leaves the CPU small route in place
      ansible.builtin.assert:
        quiet: true
        that:
          - not llm_router_llm_vllm_enabled | bool
          - llm_router_vllm_models | length == 0
          - llm_router_small_model == llm_router_small_capability_name
          - _small_members | length == 1
          - _small_members | map(attribute='litellm_params.order') | map('int') | list == [3]
          - _small_members | map(attribute='litellm_params.api_base') | list == llm_router_cpu_9b_backend_urls
          - llm_router_model_group_aliases.fast == llm_router_small_model
          - llm_router_model_group_aliases.cheap == llm_router_small_model
          - llm_router_model_group_aliases['goal-judge'] == llm_router_small_model
        fail_msg: >-
          The disabled GPU tier must retain the registry-backed CPU small member
          and its stable aliases; members={{ _small_members }}.
      vars:
        _small_members: >-
          {{ _config.model_list
             | selectattr('model_name', 'equalto', llm_router_small_model) | list }}

    - name: Select the 4080 capability deployments
      ansible.builtin.set_fact:
        _gpu_deployments: >-
          {{ _config.model_list
             | selectattr('litellm_params.api_base', 'defined')
             | selectattr('litellm_params.api_base', 'equalto', llm_router_llm_vllm_base_url)
             | list }}
      when: llm_router_vllm_models | length > 0

    - name: Set the GPU deployment list empty when vLLM is disabled
      ansible.builtin.set_fact:
        _gpu_deployments: []
      when: llm_router_vllm_models | length == 0

    - name: The rendered GPU rung matches the enabled registry selection
      ansible.builtin.assert:
        quiet: true
        that:
          - _gpu_deployments | length == llm_router_vllm_models | length
        fail_msg: >-
          The rendered GPU deployments do not match the enabled vLLM registry
          selection.
      when: llm_router_vllm_models | length > 0

    - name: A disabled vLLM tier leaves no guest model preset
      ansible.builtin.assert:
        quiet: true
        that:
          - not llm_router_llm_vllm_enabled | bool
          - llm_router_vllm_models | length == 0
          - llama_cpp_catalog_lookup_names | length == 0
          - llama_cpp_models | length == 0
        success_msg: The disabled vLLM tier has no guest model preset.
      when: llm_router_vllm_models | length == 0

    - name: The vLLM endpoint uses its published FQDN and other zones stay unchanged
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            llm_router_llm_vllm_base_url
            == 'http://' ~ tofu_data.containers[groups['llm_vllm_group'][0]].fqdn
            ~ ':' ~ (llm_router_light_port | string) ~ '/v1'
          - >-
            llm_router_llm_gpu_base_url
            == 'http://' ~ groups['llm_gpu_group'][0] ~ '.' ~ llm_router_apex_domain
            ~ ':' ~ (llm_router_light_port | string) ~ '/v1'
          - >-
            llm_router_llm_gpu_co_resident_base_url
            == 'http://' ~ groups['llm_gpu_group'][0] ~ '.' ~ llm_router_apex_domain
            ~ ':' ~ ((llm_router_light_port | int + 1) | string) ~ '/v1'
          - >-
            llm_router_llm_fast_base_url
            == 'http://llm-fast.' ~ llm_router_subdomain
            ~ ':' ~ (llm_router_light_port | string) ~ '/v1'
          - >-
            llm_router_llm_light_base_url
            == 'http://llm-light.' ~ llm_router_subdomain
            ~ ':' ~ (llm_router_light_port | string) ~ '/v1'
        success_msg: >-
          The vLLM endpoint uses its published FQDN; other endpoints retain
          their existing zones.

    - name: Every GPU-rung deployment's max_parallel_requests equals the serving process value
      ansible.builtin.assert:
        quiet: true
        that:
          - _mismatched | length == 0
        fail_msg: >-
          {{ _mismatched }} rendered max_parallel_requests that disagrees with
          the serving process setting.
        success_msg: >-
          All {{ _gpu_deployments | length }} GPU-rung deployment(s) match
          the serving process setting.
      vars:
        _mismatched: >-
          {%- set ns = namespace(out=[]) -%}
          {%- for rendered in _gpu_deployments -%}
          {%- if rendered.litellm_params.max_parallel_requests | int
                != llama_cpp_parallel | int -%}
          {%- set ns.out = ns.out + [rendered.model_name] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.out }}
