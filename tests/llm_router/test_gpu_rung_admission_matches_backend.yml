---
# The router and the serving role must derive the GPU models' limits from the
# same catalog rows. This fixture supplies a host value derived from those rows
# so the serving-side guard and rendered router values can be compared.
#
# Run (from the REPO ROOT — the registry load resolves the llm_router role
# through ansible.cfg's cwd-relative roles_path):
#   ansible-playbook tests/llm_router/test_gpu_rung_admission_matches_backend.yml -i localhost, -c local
- name: Verify GPU router limits derive from the shared catalog
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: "pve.example.test"
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: hermes-default
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the fabric model registry the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Load the actual GPU serving group variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../inventory/group_vars/llm_vllm_group.yml"

    - name: Run the serving role's catalog and preset guards
      ansible.builtin.include_role:
        name: llama_cpp
        tasks_from: guards.yml

    - name: The serving parallelism resolves from every GPU model's catalog row
      ansible.builtin.assert:
        quiet: true
        that:
          - _catalog_models | length == llama_cpp_catalog_lookup_names | length
          - _catalog_models | rejectattr('max_parallel_requests', 'defined') | list | length == 0
          - >-
            llama_cpp_parallel | int
            == (_catalog_models | map(attribute='max_parallel_requests') | map('int') | min)
        fail_msg: >-
          inventory/group_vars/llm_vllm_group.yml must derive its server
          parallelism from every served model's max_parallel_requests value.
      vars:
        _catalog_models: >-
          {{ llm_model_catalog_models
             | selectattr('name', 'in', llama_cpp_catalog_lookup_names) | list }}

    - name: Read the serving group's catalog-derived parallelism
      ansible.builtin.set_fact:
        _vllm_parallel: "{{ llama_cpp_parallel | int }}"

    - name: Add the synthetic GPU guest with catalog-derived serving parallelism
      ansible.builtin.add_host:
        name: serving-fixture
        groups: llm_vllm_group
        llama_cpp_parallel: "{{ _vllm_parallel }}"
        llama_cpp_prefill_tokens_per_second: 120

    - name: Render the real config.yaml.j2 template into a string
      ansible.builtin.set_fact:
        _rendered_config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') }}"

    - name: Parse the rendered config as YAML
      ansible.builtin.set_fact:
        _config: "{{ _rendered_config | from_yaml }}"

    - name: Select the vLLM-tier and hermes-local-4080 deployments
      ansible.builtin.set_fact:
        _gpu_deployments: >-
          {{ _config.model_list
             | selectattr('litellm_params.api_base', 'defined')
             | selectattr('litellm_params.api_base', 'equalto', llm_router_llm_vllm_base_url)
             | list }}

    - name: The test is not vacuous — the GPU rung actually rendered
      ansible.builtin.assert:
        quiet: true
        that:
          - _gpu_deployments | length > 0
        fail_msg: >-
          No GPU-rung deployments rendered — the fixture inventory or the
          registry is broken, not the derivation this test checks.

    - name: The vLLM backend URL follows the inventory guest name
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_llm_vllm_base_url == 'http://serving-fixture.example.test:10434/v1'
        success_msg: The vLLM endpoint follows its inventory member and the configured API port.

    - name: Every GPU-rung deployment's max_parallel_requests equals its catalog value
      ansible.builtin.assert:
        quiet: true
        that:
          - _mismatched | length == 0
        fail_msg: >-
          {{ _mismatched }} rendered max_parallel_requests that disagrees with
          the corresponding shared catalog-backed registry entry.
        success_msg: >-
          All {{ _gpu_deployments | length }} GPU-rung deployment(s) match
          their catalog values.
      vars:
        _mismatched: >-
          {%- set ns = namespace(out=[]) -%}
          {%- for rendered in _gpu_deployments -%}
          {%- set source_matches = (llm_router_vllm_models + llm_router_hermes_local_models)
                | selectattr('client_model_id', 'equalto', rendered.model_name)
                | list -%}
          {%- if source_matches | length != 1
                or rendered.litellm_params.max_parallel_requests | int
                != source_matches[0].max_parallel_requests | int -%}
          {%- set ns.out = ns.out + [rendered.model_name] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.out }}
