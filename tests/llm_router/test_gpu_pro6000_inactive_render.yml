---
- name: Verify inactive profiles stay out while the dedicated small route remains
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_apps_secrets: {}
    bao_local_llm_secrets: {}
    llm_router_subdomain: "pve.example.test"
    llm_large_serving_host: llm-large
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    llm_router_llm_gpu_base_url: "http://localhost:10434/v1"
    llm_router_llm_vllm_base_url: "http://localhost:10434/v1"
    ai_router_request_timeout_seconds: 2400
    ai_router_retry_after_seconds: 2
    hermes_goal_judge_model: judge
    hermes_brain_model: "{{ llm_router_primary_model }}"
    hindsight_retain_model: "{{ llm_router_small_model }}"
  tasks:
    - name: Add a synthetic inventory GPU member
      ansible.builtin.add_host:
        name: llm-gpu-fixture
        groups: llm_gpu_group
        ansible_connection: local

    - name: Load role defaults and registry
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load registry projections
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Keep profile gating off and supply a synthetic successful 4080 precheck
      ansible.builtin.set_fact:
        llm_router_gpu_profiles_enabled: false
        llm_router_llm_vllm_enabled: true
        llm_router_vllm_precheck_passed: true
        llm_active_profile: medium-a

    - name: Render the proxy config without external calls
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: Only the registry-probed local small deployment remains active
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_gpu_models | length == 0
          - _config.model_list | selectattr('model_info.profile', 'defined') | list | length == 0
          - _small_members | length == 1
          - _small_members[0].litellm_params.order | int == 1
          - _medium_members | length == 1
          - _medium_members[0].litellm_params.order | int == 2
          - _config.router_settings.model_group_alias == llm_router_model_group_aliases
        fail_msg: >-
          active profiles={{ llm_router_gpu_models }}, small={{ _small_members }},
          medium={{ _medium_members }}
      vars:
        _small_members: >-
          {{ _config.model_list | selectattr('model_name', 'equalto', llm_router_small_model) | list }}
        _medium_members: >-
          {{ _config.model_list | selectattr('model_name', 'equalto', llm_router_primary_model) | list }}
