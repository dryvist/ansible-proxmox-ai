---
- name: Register an isolated local fixture host
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add the fixture host without inherited connection vars
      ansible.builtin.add_host:
        name: pin-test-runner
        groups: llm_router_pin_test
        ansible_connection: local
        ansible_become: false

- name: Reconcile serving-host pins in hosts fixtures
  hosts: llm_router_pin_test
  gather_facts: false
  vars:
    ansible_become: false
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    llm_large_serving_ip: "192.0.2.20"
    llm_router_llm_large_fqdn: router-pin-fixture.example.test
    _pin_fqdn_pattern: >-
      (?<!\S){{ llm_router_llm_large_fqdn | regex_escape }}(?=[\s#]|$)
    _pin_cases:
      - name: Replace a stale serving-host entry
        before: |
          192.0.2.19 router-pin-fixture.example.test
          192.0.2.30 unrelated-fixture.example.test
        preserved_line: 192.0.2.30 unrelated-fixture.example.test
      - name: Remove duplicate stale serving-host entries
        before: |
          192.0.2.18 router-pin-fixture.example.test
          192.0.2.19 router-pin-fixture.example.test
          192.0.2.30 unrelated-fixture.example.test
        preserved_line: 192.0.2.30 unrelated-fixture.example.test
      - name: Replace a stale serving-host entry with an inline comment
        before: |
          198.51.100.14 router-pin-fixture.example.test # stale serving-host pin
          192.0.2.30 unrelated-fixture.example.test
        preserved_line: 192.0.2.30 unrelated-fixture.example.test
      - name: Preserve other names on a stale serving-host mapping
        before: |
          203.0.113.17 short.example.test router-pin-fixture.example.test other.example.test # shared mapping
          192.0.2.30 unrelated-fixture.example.test
        # Quoted: an unquoted " #" would start a YAML comment.
        preserved_line: "203.0.113.17 short.example.test other.example.test # shared mapping"
      - name: Preserve an unrelated host line
        before: |
          192.0.2.31 unrelated-fixture.example.test
        preserved_line: 192.0.2.31 unrelated-fixture.example.test
      - name: Keep a current serving-host pin unchanged
        before: |
          192.0.2.20 router-pin-fixture.example.test
          192.0.2.30 unrelated-fixture.example.test
        preserved_line: 192.0.2.30 unrelated-fixture.example.test
        unchanged: true
      - name: Rewrite a current serving-host pin that carries an inline comment
        before: |
          192.0.2.20 router-pin-fixture.example.test # pinned by hand
          192.0.2.30 unrelated-fixture.example.test
        preserved_line: 192.0.2.30 unrelated-fixture.example.test
      - name: Keep a comment line that names the serving host
        before: |
          # 198.51.100.14 router-pin-fixture.example.test
          192.0.2.30 unrelated-fixture.example.test
        preserved_line: "# 198.51.100.14 router-pin-fixture.example.test"
      - name: Remove the serving name when it comes first on a shared line
        before: |
          203.0.113.18 router-pin-fixture.example.test other.example.test
        preserved_line: 203.0.113.18 other.example.test
  tasks:
    - name: Run each serving-host pin fixture
      ansible.builtin.include_tasks: tasks/pin_llm_large_host_case.yml
      loop: "{{ _pin_cases }}"
      loop_control:
        loop_var: pin_case
        label: "{{ pin_case.name }}"

  handlers:
    - name: Restart litellm
      ansible.builtin.debug:
        msg: Fixture run queued the router restart handler.
