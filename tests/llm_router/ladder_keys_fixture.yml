---
hermes_agent_profiles:
  - name: splunk-admin
  - name: homelab-admin
  - name: github-maint
bao_local_llm_secrets:
  CHATGPT_LOGIN_FILE: /dev/null
  DASHSCOPE_API_KEY: fixture-dashscope
  GEMINI_API_KEY: fixture-gemini
  OPENAI_API_KEY: fixture-openai
  OPENCODE_API_KEY: fixture-opencode
  OPENROUTER_API_KEY: fixture-openrouter
  OPENROUTER_HERMES_KEY: fixture-hermes-openrouter
  SLACK_BOT_TOKEN: fixture-slack
  ZAI_API_KEY: fixture-zai
bao_apps_secrets:
  claude_code_llm_router_key: fixture-claude-code
  codex_llm_router_key: fixture-codex
  hermes_default_llm_router_key: fixture-hermes-default
  hermes_splunk_admin_llm_router_key: fixture-hermes-splunk
  hermes_homelab_admin_llm_router_key: fixture-hermes-homelab
  hermes_github_maint_llm_router_key: fixture-hermes-github
  hindsight_llm_router_key: fixture-hindsight
  litellm_local_llm_router_key: fixture-local
  litellm_local_workstation_llm_router_key: fixture-workstation
