---
- name: Verify roster router keys and owned MCP projection
  hosts: localhost
  gather_facts: false
  vars_files:
    - ladder_keys_fixture.yml
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    llm_router_subdomain: pve.example.test
  tasks:
    - name: Reuse the pinned Vikunja MCP package version
      ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/load-app-agent-package-pin.yml"

    - name: Prepare role-backed rendered contract
      ansible.builtin.import_tasks: tasks/prepare_ladder_keys.yml

    - name: Enable legacy and workstation fixture keys
      ansible.builtin.set_fact:
        bao_apps_secrets: >-
          {{ bao_apps_secrets | combine({
            'hermes_private_llm_router_key': 'fixture-hermes-private',
            'donna_llm_router_key': 'fixture-donna',
            'agy_llm_router_key': 'fixture-agy'
          }) }}
      no_log: true

    - name: Refresh the router projections with legacy key values
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Reject roster agents with no router key value
      vars:
        ai_agents:
          example-missing:
            router_key_class: standard
        ai_agent_owner: {}
        openbao_secrets_by_domain: {}
      block:
        - name: Refresh the router projections for the missing-key case
          ansible.builtin.include_role:
            name: llm_router
            tasks_from: assertion-inputs.yml

        - name: Materialize the required roster key
          ansible.builtin.set_fact:
            _missing_agent_keys: "{{ _llm_router_agent_keys }}"

        - name: Fail if a missing roster key was accepted
          ansible.builtin.fail:
            msg: "The missing roster router key was accepted."
      rescue:
        - name: Require the missing-key failure from the roster projection
          ansible.builtin.assert:
            quiet: true
            that:
              - "'Router key missing for roster agent example-missing' in ansible_failed_result.msg"

    - name: Materialize empty-roster declarations and rendered keys
      vars:
        ai_agents: {}
        ai_agent_owner: {}
        openbao_secrets_by_domain: {}
      block:
        - name: Refresh the router projections for the empty roster
          ansible.builtin.include_role:
            name: llm_router
            tasks_from: assertion-inputs.yml

        - name: Materialize the empty roster
          ansible.builtin.set_fact:
            _empty_agent_keys: "{{ _llm_router_agent_keys }}"

        - name: Render the empty-roster key projection once
          ansible.builtin.set_fact:
            _empty_virtual_keys: "{{ llm_router_virtual_keys }}"
          vars:
            _llm_router_agent_keys: "{{ _empty_agent_keys }}"
          no_log: true

        - name: Preserve every projected permission with an empty roster
          ansible.builtin.assert:
            quiet: true
            that:
              - _empty_agent_keys == []
              - >-
                (_empty_virtual_keys | selectattr('alias', 'equalto', 'hermes-private')
                 | first).object_permission.mcp_servers
                == ['context7', 'grep', 'docs', 'splunk', 'vikunja_ro', 'nautobot',
                    'memory', 'vikunja', 'zammad']
              - >-
                (_empty_virtual_keys | selectattr('alias', 'equalto', 'donna')
                 | first).object_permission.mcp_servers
                == ['context7', 'grep', 'docs', 'splunk', 'vikunja_ro']
              - >-
                (_empty_virtual_keys | selectattr('alias', 'equalto', 'claude-code')
                 | first).object_permission.mcp_servers
                == ['context7', 'grep', 'docs', 'splunk', 'vikunja_ro', 'nautobot',
                    'memory', 'hindsight', 'vikunja', 'zammad']
              - >-
                (_empty_virtual_keys | selectattr('alias', 'equalto', (_llm_router_hermes_profile_keys | first).alias)
                 | first).object_permission.mcp_servers
                == ['context7', 'grep', 'docs', 'splunk', 'vikunja_ro', 'zammad', 'slack']
              - _empty_virtual_keys | selectattr('owner_filter', 'defined') | list | length == 0

    - name: Filter roster-owned MCP servers while preserving D1 keys
      vars:
        ai_agents:
          example-owner:
            container: example-owner
            hostname: example-owner.example.com
            display: Example owner
            purpose: Fixture owner
            owns: [splunk]
            router_key_class: zdr
          example-standard:
            container: example-standard
            hostname: example-standard.example.com
            display: Example standard
            purpose: Fixture standard agent
            owns: []
            router_key_class: standard
          example-local:
            container: example-local
            hostname: example-local.example.com
            display: Example local agent
            purpose: Fixture local-only agent
            owns: []
            router_key_class: local
          example-all:
            container: example-all
            hostname: example-all.example.com
            display: Example all-class agent
            purpose: Fixture all-class agent
            owns: []
            router_key_class: all
        ai_agent_owner: {splunk: example-owner}
        openbao_secrets_by_domain:
          llm-router-agent-keys:
            example_owner_llm_router_key: fixture-owner-key
            example_standard_llm_router_key: fixture-standard-key
            example_local_llm_router_key: fixture-local-key
            example_all_llm_router_key: fixture-all-key
      block:
        - name: Trust the ownership fixture callers over the shared fixture
          ansible.builtin.set_fact:
            ai_callers: >-
              {{ ai_callers | combine({
                   'example-owner': {'trust_tier': _llm_router_trusted_caller_tiers | first},
                   'example-standard': {'trust_tier': _llm_router_trusted_caller_tiers | first},
                   'example-local': {'trust_tier': _llm_router_trusted_caller_tiers | first},
                   'example-all': {'trust_tier': _llm_router_trusted_caller_tiers | first}
                 }) }}

        - name: Refresh the router projections for the ownership fixture
          ansible.builtin.include_role:
            name: llm_router
            tasks_from: assertion-inputs.yml

        - name: Give the workstation fixture a hub server
          ansible.builtin.set_fact:
            _llm_router_workstation_virtual_keys: >-
              {{ _llm_router_workstation_virtual_keys
                 | map('combine', {'object_permission': {'mcp_servers': ['splunk']}}, recursive=true)
                 | list }}

        - name: Refresh the router projections after adding the workstation server
          ansible.builtin.include_role:
            name: llm_router
            tasks_from: assertion-inputs.yml

        - name: Materialize the roster keys
          ansible.builtin.set_fact:
            _roster_agent_keys: "{{ _llm_router_agent_keys }}"
          no_log: true

        - name: Render the roster key projection once
          ansible.builtin.set_fact:
            _roster_virtual_keys: "{{ llm_router_virtual_keys }}"
          vars:
            _llm_router_agent_keys: "{{ _roster_agent_keys }}"
          no_log: true

        - name: Verify roster scopes and projected MCP permissions
          ansible.builtin.assert:
            quiet: true
            that:
              - >-
                _roster_agent_keys | map(attribute='alias') | list
                == ['example-owner', 'example-standard', 'example-local', 'example-all']
              - _owner.allowed_classes == ['local', 'sub', 'paid-zdr']
              - _standard.allowed_classes == ['local', 'sub', 'paid-zdr', 'free']
              - _local.allowed_classes == _llm_router_consumer_classes_local
              - _local.models == _expected_local_models
              - _expected_local_models | length == 4
              - _local.models | intersect(_non_local_registry_names) | length == 0
              - _local.metadata.router_key_class == 'agent'
              - _local.metadata.tags == ['agent-priority']
              - _local.router_settings.enable_tag_filtering | bool
              - _standard.metadata.tags is not defined
              - _all_agent.metadata.tags is not defined
              - _all_agent.allowed_classes == ['local', 'sub', 'paid-zdr', 'free', 'retains']
              - >-
                _roster_virtual_keys | selectattr('alias', 'in', _roster_agent_keys | map(attribute='alias') | list)
                | selectattr('metadata.router_key_class', 'equalto', 'agent') | list | length == 4
              - _agent_key_projections | length >= 4
              - >-
                _agent_key_projections | map(attribute='models') | flatten
                | intersect(_agent_forbidden_registry_names) | length == 0
              - >-
                _agent_forbidden_registry_names | difference(_llm_router_agent_excluded_groups)
                | length == 0
              - >-
                _llm_router_agent_excluded_groups | difference(_agent_forbidden_registry_names)
                | length == 0
              - >-
                _roster_virtual_keys | selectattr('alias', 'in', _roster_agent_keys | map(attribute='alias') | list)
                | selectattr('metadata.tags', 'defined') | list | length == 1
              - >-
                _workstation_keys | selectattr('metadata.tags', 'defined')
                | list | length == 0
              - >-
                _agent_twins
                | selectattr('litellm_params.extra_body.priority', 'equalto', 10)
                | list | length == _agent_twins | length
              - _agent_twins | selectattr('litellm_params.tags', 'contains', 'default') | list | length == 0
              - _interactive_defaults | length > 0
              - _interactive_defaults | selectattr('litellm_params.extra_body.priority', 'defined') | list | length == 0
              - llm_router_agent_only_groups | length > 0
              - llm_router_agent_only_groups | difference(_owner.models) | length == 0
              - llm_router_agent_only_groups | difference(_standard.models) | length == 0
              - llm_router_agent_only_groups | difference(_all_agent.models) | length == 0
              - >-
                llm_router_agent_only_groups
                | intersect(_workstation_keys | map(attribute='models') | flatten) | length == 0
              - _owner.daily_budget == _llm_router_hermes_profile_daily_budget
              - _standard.daily_budget == _llm_router_hermes_profile_daily_budget
              - _owner.tags == ['&zdr', '!free', '!retains']
              - _owner.router_settings.enable_tag_filtering | bool
              - _owner.object_permission.mcp_servers == _expected_hub_servers
              - _standard.object_permission.mcp_servers == _expected_non_owner_servers
              - >-
                (_roster_virtual_keys | selectattr('alias', 'equalto', 'hermes-private')
                 | first).object_permission.mcp_servers
                == ['context7', 'grep', 'docs', 'vikunja_ro', 'nautobot', 'memory',
                    'vikunja', 'zammad']
              - >-
                (_roster_virtual_keys | selectattr('alias', 'equalto', 'donna')
                 | first).object_permission.mcp_servers
                == ['context7', 'grep', 'docs', 'vikunja_ro']
              - >-
                _roster_virtual_keys | selectattr('alias', 'match', '^hermes-')
                | map(attribute='object_permission.mcp_servers') | flatten
                | select('equalto', 'splunk') | list | length == 0
              - _hermes_profile_keys | length > 0
              - >-
                _hermes_profile_keys
                | selectattr('metadata.router_key_class', 'equalto', 'agent')
                | list | length == _hermes_profile_keys | length
              - >-
                _hermes_profile_keys
                | selectattr('metadata.tags', 'equalto', ['agent-priority'])
                | list | length == _hermes_profile_keys | length
              - >-
                _hermes_profile_keys
                | selectattr('router_settings.enable_tag_filtering', 'defined')
                | selectattr('router_settings.enable_tag_filtering', 'equalto', true)
                | list | length == _hermes_profile_keys | length
              - >-
                _workstation_keys | map(attribute='alias') | sort
                == ['agy', 'claude-code', 'codex', 'litellm-local-workstation']
              - _cli_keys | map(attribute='object_permission.mcp_servers') | list == [_expected_hub_servers] * 3
              - >-
                (_workstation_keys | selectattr('alias', 'equalto', 'litellm-local-workstation')
                 | first).object_permission.mcp_servers == ['splunk']
              - _roster_virtual_keys | selectattr('owner_filter', 'defined') | list | length == 0
            fail_msg: >-
              Roster ownership was not applied in the shared key projection:
              local groups={{ _expected_local_models }};
              agent-only groups={{ llm_router_agent_only_groups }}.
          vars:
            _expected_hub_servers:
              - context7
              - grep
              - docs
              - splunk
              - vikunja_ro
              - nautobot
              - memory
              - hindsight
              - vikunja
              - zammad
            _expected_non_owner_servers:
              - context7
              - grep
              - docs
              - vikunja_ro
              - nautobot
              - memory
              - hindsight
              - vikunja
              - zammad
            _owner: "{{ _roster_virtual_keys | selectattr('alias', 'equalto', 'example-owner') | first }}"
            _standard: "{{ _roster_virtual_keys | selectattr('alias', 'equalto', 'example-standard') | first }}"
            _local: "{{ _roster_virtual_keys | selectattr('alias', 'equalto', 'example-local') | first }}"
            _all_agent: "{{ _roster_virtual_keys | selectattr('alias', 'equalto', 'example-all') | first }}"
            _expected_local_models: >-
              {{ ([llm_router_small_capability_name, llm_router_primary_model]
                  + llm_router_agent_only_groups + [llm_router_embedding_model])
                 | unique | list }}
            _agent_key_projections: >-
              {{ _roster_virtual_keys
                 | selectattr('metadata.router_key_class', 'defined')
                 | selectattr('metadata.router_key_class', 'equalto', 'agent') | list }}
            _hermes_profile_keys: >-
              {{ _roster_virtual_keys
                 | selectattr('alias', 'in', _llm_router_hermes_profile_names
                   | map('regex_replace', '^', 'hermes-') | list) | list }}
            _agent_forbidden_registry_names: >-
              {%- set ns = namespace(names=[]) -%}
              {%- for m in llm_router_registry_enabled
                    if (m.subscription | default(false) | bool)
                       or (m.price_class | default('') == 'subscription')
                       or m.client_model_id.split('/')[-1].startswith(('codex-', 'claude-'))
                       or (m.route_group | default('')).startswith(('codex-', 'claude-'))
                       or (m.fallback_group | default('')).startswith(('codex-', 'claude-'))
                       or (m.stable_aliases | default([])
                           | select('match', '^(codex|claude)-') | list | length > 0) -%}
              {%- set ns.names = ns.names + [m.client_model_id]
                    + ([m.route_group] if m.route_group is defined else [])
                    + ([m.fallback_group] if m.fallback_group is defined else [])
                    + (m.stable_aliases | default([])) -%}
              {%- endfor -%}
              {{ ns.names | unique | list }}
            _non_local_registry_names: >-
              {%- set ns = namespace(names=[]) -%}
              {%- for m in llm_router_model_registry
                    if m.tier not in llm_router_local_registry_tiers -%}
              {%- set ns.names = ns.names + [m.client_model_id]
                    + ([m.route_group] if m.route_group is defined else [])
                    + ([m.fallback_group] if m.fallback_group is defined else [])
                    + (m.stable_aliases | default([])) -%}
              {%- endfor -%}
              {{ ns.names | unique | list }}
            _workstation_keys: >-
              {{ _roster_virtual_keys
                 | selectattr('alias', 'in', ['claude-code', 'codex', 'agy',
                                               'litellm-local-workstation']) | list }}
            _agent_twins: >-
              {{ _config.model_list
                 | selectattr('model_name', 'in', _local.models)
                 | selectattr('litellm_params.tags', 'contains', _local.metadata.tags[0]) | list }}
            _interactive_defaults: >-
              {{ _config.model_list
                 | selectattr('model_name', 'in', _local.models)
                 | selectattr('litellm_params.tags', 'contains', 'default') | list }}
            _cli_keys: >-
              {{ _roster_virtual_keys
                 | selectattr('alias', 'in', ['claude-code', 'codex', 'agy']) | list }}

    - name: Set the app-agent roster, keys, and per-tier app credentials
      ansible.builtin.set_fact:
        ai_agents:
          vikunja-read: {router_key_class: standard}
          vikunja-write: {router_key_class: standard}
          zammad-write: {router_key_class: standard}
        ai_agent_owner:
          vikunja-read: vikunja-read
          vikunja-write: vikunja-write
          zammad-write: zammad-write
        openbao_secrets_by_domain:
          llm-router-agent-keys:
            vikunja_read_llm_router_key: fixture-vikunja-read-key
            vikunja_write_llm_router_key: fixture-vikunja-write-key
            zammad_write_llm_router_key: fixture-zammad-write-key
        bao_local_llm_secrets: >-
          {{ bao_local_llm_secrets | combine({
            'VIKUNJA_MCP_URL': 'fixture-vikunja-url',
            'VIKUNJA_AGENT_READ_TOKEN': 'fixture-vikunja-read-token',
            'VIKUNJA_MCP_TOKEN_RW': 'fixture-vikunja-write-token',
            'ZAMMAD_MCP_URL': 'fixture-zammad-url',
            'ZAMMAD_AGENT_WRITE_TOKEN': 'fixture-zammad-write-token'
          }) }}
      no_log: true

    - name: Refresh the key projection with the app-agent roster
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Materialize app-agent roster keys and the ownership-filtered virtual keys
      ansible.builtin.set_fact:
        _app_agent_roster_keys: "{{ _llm_router_agent_keys }}"
        _app_agent_projected_keys: "{{ llm_router_virtual_keys }}"
      no_log: true

    - name: Keep each app-agent key on exactly its owned tier server
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _app_agent_roster_keys | map(attribute='alias') | sort
            == (llm_router_app_agent_tiers | map(attribute='id') | list | sort)
          - >-
            _app_agent_projected_keys | selectattr('alias', 'equalto', 'vikunja-read')
            | map(attribute='object_permission.mcp_servers') | first == ['vikunja_read']
          - >-
            _app_agent_projected_keys | selectattr('alias', 'equalto', 'vikunja-write')
            | map(attribute='object_permission.mcp_servers') | first == ['vikunja_write']
          - >-
            _app_agent_projected_keys | selectattr('alias', 'equalto', 'zammad-write')
            | map(attribute='object_permission.mcp_servers') | first == ['zammad_write']
          - >-
            _app_agent_projected_keys | selectattr('alias', 'in',
              llm_router_app_agent_tiers | map(attribute='id') | list)
            | map(attribute='object_permission.mcp_servers') | flatten
            | intersect(_llm_router_trusted_hub_servers) | length == 0
        fail_msg: The roster name or MCP ownership filter widened an app-agent grant.
      no_log: true

    - name: Remove only the Vikunja read app token from the fixture
      ansible.builtin.set_fact:
        bao_local_llm_secrets: "{{ bao_local_llm_secrets | combine({'VIKUNJA_AGENT_READ_TOKEN': ''}) }}"
      no_log: true

    - name: Refresh key and server projections after the read app token disappears
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: assertion-inputs.yml

    - name: Materialize the fail-closed key and generated server without its app token
      ansible.builtin.set_fact:
        _app_agent_missing_token_key: >-
          {{ llm_router_virtual_keys | selectattr('alias', 'equalto', 'vikunja-read') | first }}
        _app_agent_missing_token_servers: >-
          {{ lookup('ansible.builtin.template', _role_dir ~ '/templates/mcp-servers.yaml.j2')
             | from_yaml }}
      no_log: true

    - name: Omit the server and default-deny the matching roster key without its app token
      ansible.builtin.assert:
        quiet: true
        that:
          - _app_agent_missing_token_key.object_permission.mcp_servers == ['no-mcp-servers']
          - "'vikunja-read' not in _app_agent_missing_token_servers.mcp_servers"
        fail_msg: An absent Vikunja read token must remove its server and deny its roster key.
      no_log: true
