---
- name: Verify roster router keys and owned MCP projection
  hosts: localhost
  gather_facts: false
  vars_files:
    - ladder_keys_fixture.yml
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
  tasks:
    - name: Prepare role-backed rendered contract
      ansible.builtin.import_tasks: tasks/prepare_ladder_keys.yml

    - name: Enable legacy and workstation fixture keys
      ansible.builtin.set_fact:
        bao_apps_secrets: >-
          {{ bao_apps_secrets | combine({
            'hermes_private_llm_router_key': 'fixture-hermes-private',
            'donna_llm_router_key': 'fixture-donna',
            'agy_llm_router_key': 'fixture-agy'
          }) }}
      no_log: true

    - name: Refresh the router projections with legacy key values
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Reject roster agents with no router key value
      vars:
        ai_agents:
          example-missing:
            router_key_class: standard
        ai_agent_owner: {}
        openbao_secrets_by_domain: {}
      block:
        - name: Refresh the router projections for the missing-key case
          ansible.builtin.include_role:
            name: llm_router
            tasks_from: assertion-inputs.yml

        - name: Materialize the required roster key
          ansible.builtin.set_fact:
            _missing_agent_keys: "{{ _llm_router_agent_keys }}"

        - name: Fail if a missing roster key was accepted
          ansible.builtin.fail:
            msg: "The missing roster router key was accepted."
      rescue:
        - name: Require the missing-key failure from the roster projection
          ansible.builtin.assert:
            quiet: true
            that:
              - "'Router key missing for roster agent example-missing' in ansible_failed_result.msg"

    - name: Materialize empty-roster declarations and rendered keys
      vars:
        ai_agents: {}
        ai_agent_owner: {}
        openbao_secrets_by_domain: {}
      block:
        - name: Refresh the router projections for the empty roster
          ansible.builtin.include_role:
            name: llm_router
            tasks_from: assertion-inputs.yml

        - name: Materialize the empty roster
          ansible.builtin.set_fact:
            _empty_agent_keys: "{{ _llm_router_agent_keys }}"

        - name: Render the empty-roster key projection once
          ansible.builtin.set_fact:
            _empty_virtual_keys: "{{ llm_router_virtual_keys }}"
          vars:
            _llm_router_agent_keys: "{{ _empty_agent_keys }}"
          no_log: true

        - name: Preserve every projected permission with an empty roster
          ansible.builtin.assert:
            quiet: true
            that:
              - _empty_agent_keys == []
              - >-
                (_empty_virtual_keys | selectattr('alias', 'equalto', 'hermes-private')
                 | first).object_permission.mcp_servers
                == ['context7', 'grep', 'docs', 'splunk', 'vikunja_ro', 'nautobot',
                    'memory', 'vikunja', 'zammad']
              - >-
                (_empty_virtual_keys | selectattr('alias', 'equalto', 'donna')
                 | first).object_permission.mcp_servers
                == ['context7', 'grep', 'docs', 'splunk', 'vikunja_ro']
              - >-
                (_empty_virtual_keys | selectattr('alias', 'equalto', 'claude-code')
                 | first).object_permission.mcp_servers
                == ['context7', 'grep', 'docs', 'splunk', 'vikunja_ro', 'nautobot',
                    'memory', 'hindsight', 'vikunja', 'zammad']
              - >-
                (_empty_virtual_keys | selectattr('alias', 'equalto', (_llm_router_hermes_profile_keys | first).alias)
                 | first).object_permission.mcp_servers
                == ['context7', 'grep', 'docs', 'splunk', 'vikunja_ro', 'zammad', 'slack']
              - _empty_virtual_keys | selectattr('owner_filter', 'defined') | list | length == 0

    - name: Filter roster-owned MCP servers while preserving D1 keys
      vars:
        ai_agents:
          example-owner:
            container: example-owner
            hostname: example-owner.example.com
            display: Example owner
            purpose: Fixture owner
            owns: [splunk]
            router_key_class: zdr
          example-standard:
            container: example-standard
            hostname: example-standard.example.com
            display: Example standard
            purpose: Fixture standard agent
            owns: []
            router_key_class: standard
        ai_agent_owner: {splunk: example-owner}
        openbao_secrets_by_domain:
          llm-router-agent-keys:
            example_owner_llm_router_key: fixture-owner-key
            example_standard_llm_router_key: fixture-standard-key
      block:
        - name: Trust the ownership fixture callers over the shared fixture
          ansible.builtin.set_fact:
            ai_callers: >-
              {{ ai_callers | combine({
                   'example-owner': {'trust_tier': _llm_router_trusted_caller_tiers | first},
                   'example-standard': {'trust_tier': _llm_router_trusted_caller_tiers | first}
                 }) }}

        - name: Refresh the router projections for the ownership fixture
          ansible.builtin.include_role:
            name: llm_router
            tasks_from: assertion-inputs.yml

        - name: Give the workstation fixture a hub server
          ansible.builtin.set_fact:
            _llm_router_workstation_virtual_keys: >-
              {{ _llm_router_workstation_virtual_keys
                 | map('combine', {'object_permission': {'mcp_servers': ['splunk']}}, recursive=true)
                 | list }}

        - name: Refresh the router projections after adding the workstation server
          ansible.builtin.include_role:
            name: llm_router
            tasks_from: assertion-inputs.yml

        - name: Materialize the roster keys
          ansible.builtin.set_fact:
            _roster_agent_keys: "{{ _llm_router_agent_keys }}"
          no_log: true

        - name: Render the roster key projection once
          ansible.builtin.set_fact:
            _roster_virtual_keys: "{{ llm_router_virtual_keys }}"
          vars:
            _llm_router_agent_keys: "{{ _roster_agent_keys }}"
          no_log: true

        - name: Verify roster scopes and projected MCP permissions
          ansible.builtin.assert:
            quiet: true
            that:
              - _roster_agent_keys | map(attribute='alias') | list == ['example-owner', 'example-standard']
              - _owner.allowed_classes == ['local', 'sub', 'paid-zdr']
              - _standard.allowed_classes == ['local', 'sub', 'paid-zdr', 'free']
              - _owner.daily_budget == _llm_router_hermes_profile_daily_budget
              - _standard.daily_budget == _llm_router_hermes_profile_daily_budget
              - _owner.tags == ['&zdr', '!free', '!retains']
              - _owner.router_settings.enable_tag_filtering | bool
              - _owner.object_permission.mcp_servers == _expected_hub_servers
              - _standard.object_permission.mcp_servers == _expected_non_owner_servers
              - >-
                (_roster_virtual_keys | selectattr('alias', 'equalto', 'hermes-private')
                 | first).object_permission.mcp_servers
                == ['context7', 'grep', 'docs', 'vikunja_ro', 'nautobot', 'memory',
                    'vikunja', 'zammad']
              - >-
                (_roster_virtual_keys | selectattr('alias', 'equalto', 'donna')
                 | first).object_permission.mcp_servers
                == ['context7', 'grep', 'docs', 'vikunja_ro']
              - >-
                _roster_virtual_keys | selectattr('alias', 'match', '^hermes-')
                | map(attribute='object_permission.mcp_servers') | flatten
                | select('equalto', 'splunk') | list | length == 0
              - >-
                _workstation_keys | map(attribute='alias') | sort
                == ['agy', 'claude-code', 'codex', 'litellm-local-workstation']
              - _cli_keys | map(attribute='object_permission.mcp_servers') | list == [_expected_hub_servers] * 3
              - >-
                (_workstation_keys | selectattr('alias', 'equalto', 'litellm-local-workstation')
                 | first).object_permission.mcp_servers == ['splunk']
              - _roster_virtual_keys | selectattr('owner_filter', 'defined') | list | length == 0
            fail_msg: "Roster ownership was not applied in the shared key projection."
          vars:
            _expected_hub_servers:
              - context7
              - grep
              - docs
              - splunk
              - vikunja_ro
              - nautobot
              - memory
              - hindsight
              - vikunja
              - zammad
            _expected_non_owner_servers:
              - context7
              - grep
              - docs
              - vikunja_ro
              - nautobot
              - memory
              - hindsight
              - vikunja
              - zammad
            _owner: "{{ _roster_virtual_keys | selectattr('alias', 'equalto', 'example-owner') | first }}"
            _standard: "{{ _roster_virtual_keys | selectattr('alias', 'equalto', 'example-standard') | first }}"
            _workstation_keys: >-
              {{ _roster_virtual_keys
                 | selectattr('alias', 'in', ['claude-code', 'codex', 'agy',
                                               'litellm-local-workstation']) | list }}
            _cli_keys: >-
              {{ _roster_virtual_keys
                 | selectattr('alias', 'in', ['claude-code', 'codex', 'agy']) | list }}
