---
- name: Verify profile deployments join the same capability groups by order
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_apps_secrets: {}
    bao_local_llm_secrets: {}
    llm_router_subdomain: "pve.example.test"
    llm_large_serving_host: llm-large
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    llm_router_llm_gpu_base_url: "http://localhost:10434/v1"
    llm_router_llm_vllm_base_url: "http://localhost:10434/v1"
    ai_router_request_timeout_seconds: 2400
    ai_router_retry_after_seconds: 2
    hermes_goal_judge_model: judge
    llm_router_llm_fast_base_url: "http://localhost:10434/v1"
    llm_router_llm_light_base_url: "http://localhost:10434/v1"
    hermes_brain_model: "{{ llm_router_primary_model }}"
    hindsight_retain_model: "{{ llm_router_small_model }}"
  tasks:
    - name: Add a synthetic inventory GPU member
      ansible.builtin.add_host:
        name: llm-gpu-fixture
        groups: llm_gpu_group
        ansible_connection: local

    - name: Load role defaults and registry
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load registry projections
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Enable profile and precheck projections for the render fixture
      ansible.builtin.set_fact:
        llm_router_gpu_profiles_enabled: true
        llm_router_llm_vllm_enabled: true
        llm_router_vllm_precheck_passed: true
        llm_active_profile: medium-a

    - name: Render the medium capability with its Pro and Mac members
      ansible.builtin.set_fact:
        _medium_config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: The medium capability orders Pro first and Mac second
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_gpu_models | length == 1
          - llm_router_gpu_models[0].route_group == llm_router_primary_model
          - llm_router_gpu_models[0].order | int == 1
          - _medium_members | length == 2
          - _medium_members | map(attribute='litellm_params.order') | map('int') | sort == [1, 2]
          - _small_members | length == 2
          - _small_members | map(attribute='litellm_params.order') | map('int') | sort == [1, 2]
          - _gpu_small_members | length == 1
          - _profile_deployments | length == 2
          - >-
            _profile_deployments | map(attribute='litellm_params.max_parallel_requests')
            | map('int') | sum == llm_router_gpu_models[0].max_parallel_requests | int
          - _profile_deployments | selectattr('litellm_params.max_parallel_requests', 'equalto', 4) | list | length == 1
          - llm_router_model_group_aliases.values() | select('equalto', llm_router_primary_model) | list | length > 0
          - llm_router_gpu_profile_aliases | length == 0
        fail_msg: "medium capability members={{ _medium_members }}"
      vars:
        _medium_members: >-
          {{ _medium_config.model_list
             | selectattr('model_name', 'equalto', llm_router_primary_model) | list }}
        _small_members: >-
          {{ _medium_config.model_list
             | selectattr('model_name', 'equalto', llm_router_small_capability_name) | list }}
        _gpu_small_members: >-
          {{ _small_members
             | selectattr('model_info.profile', 'defined')
             | selectattr('model_info.profile', 'equalto', llm_active_profile) | list }}
        _profile_deployments: >-
          {{ _medium_config.model_list
             | selectattr('model_info.profile', 'defined')
             | selectattr('model_info.profile', 'equalto', llm_active_profile) | list }}

    - name: Select the small profile and render its same-name member pair
      ansible.builtin.set_fact:
        llm_active_profile: small

    - name: Render the small capability with both assigned members
      ansible.builtin.set_fact:
        _small_config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: The 4080 and enabled Pro small profile share the small capability
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_gpu_models | length == 1
          - llm_router_gpu_models[0].route_group == llm_router_small_model
          - llm_router_gpu_models[0].order | int == 2
          - _small_members | length == 2
          - _small_members | map(attribute='litellm_params.order') | map('int') | sort == [1, 2]
          - _profile_deployments | length == 1
          - >-
            _profile_deployments | map(attribute='litellm_params.max_parallel_requests')
            | map('int') | sum == llm_router_gpu_models[0].max_parallel_requests | int
          - >-
            _vllm_entry.litellm_params.max_parallel_requests | int
            == llm_router_gpu_models[0].max_parallel_requests | int
        fail_msg: "small capability members={{ _small_members }}"
      vars:
        _small_members: >-
          {{ _small_config.model_list
             | selectattr('model_name', 'equalto', llm_router_small_model) | list }}
        _profile_deployments: >-
          {{ _small_config.model_list
             | selectattr('model_info.profile', 'defined')
             | selectattr('model_info.profile', 'equalto', llm_active_profile) | list }}
        _vllm_entry: >-
          {{ _small_members
             | selectattr('litellm_params.order', 'equalto', llm_router_gpu_models[0].order)
             | first }}

    - name: Preserve GPU-first behavior through capability aliases
      ansible.builtin.import_tasks: tasks/gpu_first_rung_contract.yml
