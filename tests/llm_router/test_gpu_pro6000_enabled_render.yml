    test(llm_router): assert the small group's single 4080 rung and slot-sized caps
    
    The small-capability render contract now counts exactly one 4080
    deployment per priority tier (first, at the lane's two-slot cap, equal
    to the registry's projected limit) and exactly one RTX 6000 small
    deployment per tier at the second order.

