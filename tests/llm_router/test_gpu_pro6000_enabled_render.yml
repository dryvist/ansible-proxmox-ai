---
# The enabled profile render, imported with the inactive-profile contract.
- name: Verify the explicitly enabled Pro6000 profile render
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    _enable_gpu_profiles: true
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          redis_default: 6379
    bao_local_llm_secrets: {}
    # Exercise the inventory's runtime model override with a synthetic alias:
    # it must follow the shared primary route without revealing the live value.
    bao_ai_public_secrets:
      active_model: "{{ llm_router_primary_registry_aliases | first }}"
    ai_default_model: >-
      {{ bao_ai_public_secrets.active_model
         | default(llm_router_primary_model, true) }}
    # Match the router fleet group so the existing vLLM model name cannot
    # collide with the shared route alias.
    llm_router_llm_vllm_enabled: false
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: "{{ llm_router_hermes_router_ids | first }}"
    llm_active_profile: medium-a
    hindsight_retain_model: "{{ llm_router_light_models | map(attribute='client_model_id') | first }}"
    hermes_goal_judge_model: judge
  tasks:
    - name: Add the fixture member used by the enabled backend projection
      ansible.builtin.add_host:
        name: llm-gpu-fixture
        groups: llm_gpu_group
        ansible_connection: local

    - name: Load defaults and registry for the enabled render
      ansible.builtin.import_tasks: tasks/parity_setup.yml

    - name: Load the sanitized benchmark app-field fixture
      ansible.builtin.include_vars: fixtures/openbao-benchmark-app.yml

    - name: Enable profiles and configure only render fixtures
      ansible.builtin.set_fact:
        llm_router_gpu_profiles_enabled: "{{ _enable_gpu_profiles | default(false) | bool }}"
        llm_router_llm_vllm_enabled: false
        llm_router_vllm_medium_enabled: true
        bao_local_llm_secrets:
          OPENROUTER_API_KEY: test-openrouter-provider-key
          OPENROUTER_HERMES_KEY: test-openrouter-hermes-provider-key
          GEMINI_API_KEY: test-gemini-provider-key
          DASHSCOPE_API_KEY: test-dashscope-provider-key
          OPENAI_API_KEY: test-openai-provider-key
          ZAI_API_KEY: test-zai-provider-key
        llm_router_llm_fast_base_url: "http://localhost:10434/v1"
        llm_router_llm_light_base_url: "http://localhost:10434/v1"
        llm_router_llm_large_base_url: "https://localhost:11434/v1"
        llm_router_llm_vllm_base_url: "http://localhost:10434/v1"
        llm_router_llm_gpu_base_url: "http://localhost:10434/v1"

    - name: Load the production Hermes selector without replacing test fixtures
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../inventory/group_vars/all.yml"
        name: _production_group_vars

    - name: Evaluate the production Hermes selector with profiles enabled
      ansible.builtin.set_fact:
        _production_hermes_brain_model: "{{ _production_group_vars.hermes_brain_model }}"

    - name: Re-evaluate credentialed cloud projections for the config render
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

    - name: Load Hermes profiles for the full render
      ansible.builtin.import_tasks: "{{ _role_dir }}/../../playbooks/tasks/load_hermes_profiles.yml"
      vars:
        _hermes_agent_role_dir: "{{ _role_dir }}/../hermes_agent"

    - name: Render the proxy config with GPU profiles enabled
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: Save the auto-router tier targets for the switch-off comparison
      ansible.builtin.set_fact:
        _auto_router_tiers_enabled: >-
          {{ (_config.model_list | selectattr('model_name', 'equalto', hermes_brain_model)
              | first).litellm_params.complexity_router_config.tiers }}
        _auto_router_initial_enabled: >-
          {{ (_config.model_list | selectattr('model_name', 'equalto', hermes_brain_model)
              | first).litellm_params.complexity_router_config.default_model }}

    - name: Collect the rendered GPU deployments
      ansible.builtin.set_fact:
        _gpu_ids: "{{ llm_router_gpu_models | map(attribute='client_model_id') | list }}"
        _gpu_rendered: >-
          {{ _config.model_list | selectattr('model_name', 'in',
               llm_router_gpu_models | map(attribute='client_model_id') | list) | list }}
        _gpu_aliases: >-
          {{ llm_router_gpu_profile_aliases }}

    # Keep the engine profile maps separate; the router's selected profile
    # comes from the engine selector and the shared per-engine profile map.
    - name: Load shared NVIDIA guest defaults for engine profile projections
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/../nvidia_gpu_guest/defaults/main"

    - name: Load vLLM engine defaults for the shared profile map
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/../vllm_serving/defaults/main/00-engine.yml"

    - name: Load llama.cpp engine defaults for the shared profile map
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/../llamacpp_serving/defaults/main/00-engine.yml"

    - name: Load vLLM profiles for the router admission contract
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/../vllm_serving/defaults/main/10-profiles.yml"
        name: _vllm_defaults

    - name: Load llama.cpp profiles for the router admission contract
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/../llamacpp_serving/defaults/main/10-profiles.yml"
        name: _llamacpp_defaults

    - name: Combine engine-owned profile maps for the router contract
      ansible.builtin.set_fact:
        _serving_profiles: >-
          {{ _vllm_defaults.vllm_serving_profiles
             | combine(_llamacpp_defaults.llamacpp_serving_profiles) }}

    - name: Assert the selected profile renders with registry-owned limits and zero cost
      ansible.builtin.assert:
        quiet: true
        that:
          - _gpu_rendered | length == 1
          - _gpu_ids | length == 1
          - _gpu_ids == [llm_router_gpu_medium_a_model]
          - _gpu_rendered[0].model_info.profile == llm_active_profile
          - item.model_info.profile == _registry_entry.profile
          - item.model_info.max_input_tokens | int == _registry_entry.context_window | int
          - item.litellm_params.input_cost_per_token | float == 0
          - item.litellm_params.output_cost_per_token | float == 0
          - item.model_info.disable_background_health_check is true
          - item.litellm_params.api_base == 'http://localhost:10434/v1'
          # Keep the router admission cap at least as high as the engine's
          # active sequence limit; the sweep separately tests request concurrency.
          - item.litellm_params.max_parallel_requests | int == _registry_entry.max_parallel_requests | int
          - >-
            item.litellm_params.max_parallel_requests | int
            >= _serving_profiles[llm_active_profile].max_num_seqs | int
        fail_msg: "Rendered GPU deployment {{ item.model_name }} differs from its registry limits."
      loop: "{{ _gpu_rendered }}"
      loop_control:
        label: "{{ item.model_name }}"
      vars:
        _registry_entry: >-
          {{ llm_router_gpu_models | selectattr('client_model_id', 'equalto',
               item.model_name) | first }}

    - name: Capture non-empty virtual keys selected by seed-keys
      ansible.builtin.set_fact:
        _seeded_virtual_keys: >-
          {{ llm_router_virtual_keys | rejectattr('value', 'equalto', '') | list }}

    - name: Capture the seeded benchmark key
      ansible.builtin.set_fact:
        _benchmark_seed_entry: >-
          {{ _seeded_virtual_keys | selectattr('alias', 'equalto', 'benchmark') | first }}

    - name: Benchmark key enables only with its seeded value and GPU profile
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_gpu_profiles_enabled | bool
          - llm_router_gpu_models | length > 0
          - _benchmark_seed_entry.value == bao_apps_secrets.benchmark_llm_router_key
          - _benchmark_seed_entry.value | length > 0
          - _benchmark_seed_entry.models == (_gpu_ids | list)
          - _seeded_virtual_keys | selectattr('alias', 'equalto', 'benchmark') | list | length == 1
          - _seeded_virtual_keys | selectattr('alias', 'match', '^program-') | list | length == 0

    - name: Assert every Hermes profile key can resolve each active GPU model alias
      ansible.builtin.assert:
        quiet: true
        that:
          - _gpu_ids | difference(_hermes_profile_scopes) | length == 0
          - _gpu_aliases | length == 3
          - _gpu_aliases | difference(_hermes_profile_scopes) | length == 0
          - >-
            _production_hermes_brain_model ==
            llm_router_gpu_model_aliases_by_profile[llm_active_profile]
          - _production_hermes_brain_model in _gpu_aliases
          - _production_hermes_brain_model in _hermes_profile_scopes
          - llm_router_primary_model == llm_router_vllm_medium_route_alias
          - ai_default_model == (llm_router_primary_registry_aliases | first)
          - llm_router_model_group_aliases[ai_default_model] == llm_router_vllm_medium_model
          - llm_router_model_group_aliases[llm_router_vllm_medium_route_alias] == llm_router_vllm_medium_model
          - _primary_large_aliases | length > 0
          - >-
            _primary_large_aliases | difference(_primary_large_aliases_targeted)
            == (llm_router_primary_route_fallback_aliases
                | intersect(_primary_large_aliases))
          - _primary_large_aliases_targeted | length > 0
          - _config.model_list | selectattr('model_name', 'equalto', llm_router_vllm_medium_model) | list | length == 1
          - >-
            _config.model_list
            | selectattr('model_name', 'equalto', llm_router_primary_large_model)
            | list | length == 1
          - llm_router_model_group_aliases['local-medium'] == llm_router_gpu_medium_a_model
          - "'local-fast' not in llm_router_model_group_aliases"
          - >-
            _config.model_list | selectattr('model_name', 'in', _gpu_aliases)
            | list | length == 0
      vars:
        _primary_large_aliases: >-
          {{ llm_router_registry_enabled
             | selectattr('client_model_id', 'equalto', llm_router_primary_large_model)
             | map(attribute='stable_aliases') | first }}
        _primary_large_aliases_targeted: >-
          {{ llm_router_model_group_aliases | dict2items
             | selectattr('value', 'equalto', llm_router_primary_large_model)
             | map(attribute='key') | list }}
        _hermes_profile_scopes: >-
          {{ _llm_router_hermes_profile_keys | map(attribute='models')
             | flatten | unique | list }}

    - name: Hermes complexity router targets physical profiles and retains its fallback chain
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _hermes_router.litellm_params.complexity_router_config.tiers.SIMPLE
            == llm_router_gpu_small_model
          - >-
            _hermes_router.litellm_params.complexity_router_config.tiers.MEDIUM
            == llm_router_gpu_small_model
          - >-
            _hermes_router.litellm_params.complexity_router_config.tiers.COMPLEX
            == llm_router_gpu_medium_a_model
          - >-
            _hermes_router.litellm_params.complexity_router_config.tiers.REASONING
            == llm_router_gpu_medium_a_model
          - _hermes_router.litellm_params.complexity_router_config.default_model == llm_router_gpu_medium_a_model
          - llm_router_hermes_cloud_only_fallback_groups | length > 0
          - >-
            llm_router_hermes_cloud_only_fallback_groups
            | difference(_fallback_by_name[hermes_brain_model]) | length == 0
          - >-
            _fallback_by_name[hermes_brain_model]
            == (llm_router_hermes_default_fallback_chain
                | reject('equalto', llm_router_d1_auto_initial_group) | list)
          - _fallback_by_name[llm_router_vllm_medium_route_alias] == [llm_router_primary_large_model]
          - _fallback_by_name[ai_default_model] == [llm_router_primary_large_model]
          - _active_gpu_aliases | length == llm_router_primary_route_fallback_aliases | length + 1
          - _active_gpu_aliases | difference(_fallback_by_name.keys() | list) | length == 0
          - _active_gpu_aliases | difference(_context_fallback_by_name.keys() | list) | length == 0
          - llm_router_local_fallback_groups | first == llm_router_vllm_medium_model
          - llm_router_hermes_local_wide_groups | first == llm_router_vllm_medium_model
          - llm_router_d1_rungs_by_class['local'] | first == llm_router_vllm_medium_model
          - _fallback_by_name[llm_router_vllm_medium_model] | first == llm_router_primary_large_model
          - >-
            _active_gpu_aliases | reject('in', llm_router_primary_route_fallback_aliases)
            | select('in', _fallback_by_name)
            | map('extract', _fallback_by_name)
            | select('equalto', _expected_alias_chain)
            | list | length == (_active_gpu_aliases
                | reject('in', llm_router_primary_route_fallback_aliases) | list | length)
          - >-
            llm_router_primary_route_fallback_aliases
            | map('extract', _fallback_by_name) | unique | list
            == [[llm_router_primary_large_model]]
      vars:
        _hermes_router: >-
          {{ _config.model_list | selectattr('model_name', 'equalto', hermes_brain_model) | first }}
        _active_gpu_aliases: >-
          {{ llm_router_model_group_aliases | dict2items
             | selectattr('value', 'in', _gpu_ids)
             | map(attribute='key') | list }}
        _fallback_by_name: >-
          {{ dict(_config.router_settings.fallbacks | map('dict2items') | flatten
                  | map(attribute='key') | zip(_config.router_settings.fallbacks
                    | map('dict2items') | flatten | map(attribute='value'))) }}
        _context_fallback_by_name: >-
          {{ dict(_config.router_settings.context_window_fallbacks | map('dict2items') | flatten
                  | map(attribute='key') | zip(_config.router_settings.context_window_fallbacks
                    | map('dict2items') | flatten | map(attribute='value'))) }}
        _expected_alias_chain: >-
          {{ llm_router_hermes_default_fallback_chain
             | reject('in', llm_router_zdr_unasserted_terminal_rungs)
             | reject('equalto', llm_router_vllm_medium_model) | list }}

    - name: Assert the judge and subagent use GPU profiles only in the enabled render
      ansible.builtin.assert:
        quiet: true
        that:
          - _judge.model == llm_router_routine_model
          - _judge.fallbacks | length == 0
          - _subagent.model == llm_router_gpu_medium_b_model
          - _subagent.model == llm_router_hermes_local_4080_id
          - llm_router_hermes_local_4080_id not in _subagent.fallbacks
      vars:
        _judge: "{{ llm_router_role_deployments | selectattr('role', 'equalto', 'judge') | first }}"
        _subagent: "{{ llm_router_role_deployments | selectattr('role', 'equalto', 'subagent') | first }}"

    - name: Assert the benchmark key is scoped to GPU profiles and has no budget
      ansible.builtin.assert:
        quiet: true
        that:
          - _benchmark_seed_entry.models | sort == _gpu_ids | sort
          - _benchmark_seed_entry.monthly_budget is not defined
          - "'&zdr' in _benchmark_seed_entry.tags"

    - name: Run the primary brain guard against the enabled rendered route
      ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-safe-models.yml"

    - name: Disable only the Pro6000 primary-route rung
      ansible.builtin.set_fact:
        llm_router_vllm_medium_enabled: false

    - name: Render the proxy config with the primary-route rung disabled
      ansible.builtin.set_fact:
        _config_route_disabled: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: Index fallback settings from the switch-off config
      ansible.builtin.set_fact:
        _fallback_by_name_route_disabled: >-
          {{ dict(_config_route_disabled.router_settings.fallbacks | map('dict2items') | flatten
                  | map(attribute='key') | zip(_config_route_disabled.router_settings.fallbacks
                    | map('dict2items') | flatten | map(attribute='value'))) }}

    - name: Assert switch-off removes the primary route rung and preserves scorer targets
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_primary_model == llm_router_primary_large_model
          - ai_default_model == (llm_router_primary_registry_aliases | first)
          - llm_router_model_group_aliases[ai_default_model] == llm_router_primary_large_model
          - llm_router_vllm_medium_route_models | length == 0
          - llm_router_vllm_medium_model not in llm_router_local_fallback_groups
          - >-
            llm_router_vllm_medium_model not in
            (llm_router_hermes_local_fallback_models
             | map(attribute='client_model_id') | list)
          - llm_router_vllm_medium_route_alias not in llm_router_model_group_aliases
          - llm_router_vllm_medium_route_alias not in _config_route_disabled.router_settings.model_group_alias
          - _primary_large_aliases | length > 0
          - _primary_large_aliases | difference(_primary_large_aliases_targeted) | length == 0
          - llm_router_vllm_medium_route_alias not in _fallback_by_name_route_disabled
          - _fallback_by_name_route_disabled[llm_router_primary_large_model] | length > 0
          - _auto_router_tiers_enabled == _hermes_router_route_disabled.litellm_params.complexity_router_config.tiers
          - >-
            _auto_router_initial_enabled
            == _hermes_router_route_disabled.litellm_params.complexity_router_config.default_model
        fail_msg: "The route switch must restore the Mac primary and keep auto-router targets unchanged."
      vars:
        _primary_large_aliases: >-
          {{ llm_router_registry_enabled
             | selectattr('client_model_id', 'equalto', llm_router_primary_large_model)
             | map(attribute='stable_aliases') | first }}
        _primary_large_aliases_targeted: >-
          {{ llm_router_model_group_aliases | dict2items
             | selectattr('value', 'equalto', llm_router_primary_large_model)
             | map(attribute='key') | list }}
        _hermes_router_route_disabled: >-
          {{ _config_route_disabled.model_list
             | selectattr('model_name', 'equalto', hermes_brain_model) | first }}

    - name: Run the primary brain guard against the switch-off rendered route
      ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-safe-models.yml"

    - name: Load the sanitized live router target-output fixture
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../fixtures/llm-router-target-output.yml"
        name: _real_router_target

    - name: Project aliased model context from the live router output
      ansible.builtin.set_fact:
        _real_router_large_models: >-
          {{ (_real_router_large_models | default([]))
             + [{'client_model_id': item.model_name,
                 'context_window': item.model_info.max_input_tokens}] }}
      loop: "{{ _real_router_target.model_list }}"
      when: item.model_name in (_real_router_target.router_settings.model_group_alias.values() | list)

    - name: Run the primary brain guard against sanitized live router output
      ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-safe-models.yml"
      vars:
        ai_default_model: "{{ _real_router_target.primary_alias }}"
        llm_router_primary_model: "{{ _real_router_target.primary_alias }}"
        llm_router_routine_model: "{{ _real_router_target.goal_judge_alias }}"
        hermes_goal_judge_model: "{{ _real_router_target.goal_judge_alias }}"
        llm_router_large_models: "{{ _real_router_large_models }}"
        llm_router_gpu_models: []
        llm_router_model_group_aliases: "{{ _real_router_target.router_settings.model_group_alias }}"
        llm_router_role_deployments: []
        llm_router_hermes_router_ids: []
        llm_router_long_context_alias_ids: []

    - name: Select the small profile for the registry projection check
      ansible.builtin.set_fact:
        llm_active_profile: small

    - name: Evaluate the production Hermes selector for the small profile
      ansible.builtin.set_fact:
        _production_hermes_brain_model_small: "{{ _production_group_vars.hermes_brain_model }}"

    - name: Project only the 9B profile when the fast profile is selected
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_gpu_models | length == 1
          - llm_router_gpu_models[0].profile == llm_active_profile
          - >-
            llm_router_gpu_models[0].max_parallel_requests | int
            == _serving_profiles[llm_active_profile].max_num_seqs | int
          - llm_router_model_group_aliases['local-fast'] == llm_router_gpu_small_model
          - "'local-medium' not in llm_router_model_group_aliases"
          - _production_hermes_brain_model_small == 'local-fast'
