---
# Every credential field a registry entry names (key_field, api_base_field) must
# come from a path the router's local-llm OpenBao domain reads. A field with no
# read path renders the entry empty and silently drops it from the router.
#
# Run: ansible-playbook tests/llm_router/test_router_credential_fields_read.yml -i localhost, -c local
- name: Verify the local-llm domain reads every registry credential field
  hosts: localhost
  gather_facts: false
  vars:
    _identities_file: "{{ playbook_dir }}/../../inventory/group_vars/all/openbao_secrets/10-domains-identities.yml"
    openbao_secrets_ai_api_key_mount: secret
    openbao_secrets_ai_api_key_path_prefix: ai/saas
    # Field -> the OpenBao leaf that holds it.
    _field_paths:
      OPENROUTER_API_KEY: secret/ai/saas/openrouter
      OPENROUTER_HERMES_KEY: secret/ai/saas/openrouter
      OPENCODE_API_KEY: secrets-external/ai/saas/opencode
      GEMINI_API_KEY: secret/ai/saas/gemini
      DASHSCOPE_API_KEY: secret/ai/saas/alibaba
      OPENAI_API_KEY: secret/ai/saas/openai
      QWEN_API_TOKEN: secrets-external/ai/saas/qwencloud
      QWEN_URL_OPENAI: secrets-external/ai/saas/qwencloud
    # Credentialed by a per-node login file, not a KV field.
    _file_fields: [CHATGPT_LOGIN_FILE]
  tasks:
    - name: Load the OpenBao domain declarations
      ansible.builtin.include_vars:
        file: "{{ _identities_file }}"
        name: _identity_defaults

    - name: Every registry credential field maps to a leaf the local-llm domain reads
      ansible.builtin.assert:
        quiet: true
        that:
          - _fields | length > 0
          - _unmapped | length == 0
          - _unread | length == 0
        fail_msg: >-
          Fields with no declared leaf: {{ _unmapped }}. Leaves the local-llm
          domain does not read: {{ _unread }}. Add the leaf to _field_paths and
          its mount+path to the local-llm domain in 10-domains-identities.yml.
      vars:
        # Raw text: the entries template role variables this play does not load.
        _registry_files: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/../../llm-models.d/*.yml') | sort }}"
        _registry_text: "{{ query('ansible.builtin.file', *_registry_files) | join('\n') }}"
        _fields: >-
          {{ _registry_text | regex_findall('(?:key_field|api_base_field): *([A-Z0-9_]+)')
             | unique | reject('in', _file_fields) | list }}
        _unmapped: "{{ _fields | reject('in', _field_paths) | list }}"
        _local_llm_domain: >-
          {{ _identity_defaults._openbao_secrets_static_domains_identities
             | selectattr('name', 'equalto', 'local-llm') | first }}
        # A path without a mount reads the default KV mount.
        _read_leaves: >-
          {%- set out = [] -%}
          {%- for p in _local_llm_domain.paths -%}
          {%- if p is mapping -%}
          {%- set _ = out.append((p.mount | default('secret')) ~ '/' ~ p.path) -%}
          {%- else -%}
          {%- set _ = out.append('secret/' ~ p) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}
        _unread: >-
          {{ _fields | select('in', _field_paths) | map('extract', _field_paths)
             | unique | reject('in', _read_leaves) | list }}
