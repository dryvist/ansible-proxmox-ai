---
# A fallback rung narrower than the primary cannot rescue a request the primary
# refused for a NON-size reason. Reached as a rung, it raises
# ContextWindowExceededError before doing any work; litellm consults
# context_window_fallbacks under the LEG's name, and with or without an entry
# the enclosing walk ADVANCES (assert-fallback-chain.yml, 35-hermes-cloud.yml,
# 37-fallback-entry-points.yml carry the source citations). So a narrow leg
# ahead of the wider rungs does not kill the chain — it spends one attempt and
# one unit of the shared depth budget on a rung that could never have
# answered, every time.
#
# An earlier version of this header said the leg aborted the whole chain and
# that the map is not consulted for a fallback leg. Both were wrong against
# the pinned source; the ordering rule survives on the cheaper, true reason.
#
# This test pins the ordering rule and BOTH policies, so a future edit cannot
# silently put a rung that cannot answer in front of one that can.
- name: Verify narrow local fallback legs are ordered behind the wider rungs
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    # Credentials present ON PURPOSE. The subscription, paid-ZDR, and free
    # classes must render so the ordering assertion exercises the complete D1
    # ladder rather than passing over a local-only chain.
    bao_local_llm_secrets:
      CHATGPT_LOGIN_FILE: /dev/null
      OPENROUTER_API_KEY: test-openrouter-provider-key
      GEMINI_API_KEY: test-gemini-provider-key
      DASHSCOPE_API_KEY: test-dashscope-provider-key
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: test-master-key
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: hermes-default
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    # Load the same normalized registry as the router, including catalog
    # limits and role-map projection.
    - name: Load the catalog-backed model registry
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml
        public: true

    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Model a node that holds a ChatGPT login
      ansible.builtin.set_fact:
        llm_router_chatgpt_auth_file_present: true

    - name: The primary must advertise a window, or the split is meaningless
      ansible.builtin.assert:
        that:
          - (llm_router_hermes_primary_context_window | int) > 0
        fail_msg: >-
          llm_router_hermes_primary_context_window resolved to 0, so every leg
          compares as wide and the narrow/wide split silently does nothing.

    - name: Every narrow leg really is narrower than the primary
      ansible.builtin.assert:
        that:
          - >-
            llm_router_hermes_local_models
            | selectattr('fallback_group', 'defined')
            | selectattr('fallback_group', 'in', llm_router_hermes_local_narrow_groups)
            | rejectattr('context_window', 'defined')
            | list | length == 0
        fail_msg: >-
          A leg was classified narrow without declaring context_window. An
          undeclared window defaults to 0 and would classify a WIDE leg as
          narrow, demoting a perfectly good local rung behind cloud egress.

    - name: Local class follows sub and precedes paid ZDR under D1
      vars:
        _chain: "{{ llm_router_hermes_default_fallback_chain }}"
      ansible.builtin.assert:
        that:
          - llm_router_d1_rungs_by_class['sub'] | length > 0
          - llm_router_d1_rungs_by_class['paid-zdr'] | length > 0
          - llm_router_hermes_local_narrow_groups | length > 0
          - >-
            llm_router_d1_ladder_groups.index(llm_router_d1_rungs_by_class['sub'] | first)
            < llm_router_d1_ladder_groups.index(llm_router_d1_rungs_by_class['local'] | first)
          - >-
            llm_router_d1_ladder_groups.index(llm_router_d1_rungs_by_class['local'] | last)
            < llm_router_d1_ladder_groups.index(llm_router_d1_rungs_by_class['paid-zdr'] | first)
        fail_msg: >-
          The class order is not subscription, local, then paid ZDR. Chain: {{ _chain }}

    - name: The canonical chain contains every D1 class rung
      ansible.builtin.assert:
        that:
          - >-
            llm_router_hermes_default_fallback_chain
            == llm_router_d1_ladder_groups
        fail_msg: >-
          The canonical chain no longer matches the full ordered D1 class ladder.

    - name: Record the resulting order
      ansible.builtin.debug:
        msg: "chain: {{ llm_router_hermes_default_fallback_chain }}"

    # The converge-time guard rejects a chain that moves local behind paid.
    - name: The converge-time assert rejects a D1 class-order violation
      block:
        - name: Import the assert with paid ZDR before local
          ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-fallback-chain.yml"
          vars:
            llm_router_hermes_default_fallback_chain: >-
              {{ (llm_router_d1_rungs_by_class['sub']
                  + llm_router_d1_rungs_by_class['paid-zdr']
                  + llm_router_d1_rungs_by_class['local']
                  + llm_router_d1_rungs_by_class['free']
                  + llm_router_d1_rungs_by_class['retains']) | unique | list }}
        - name: Reaching here means the guard did not fire
          ansible.builtin.fail:
            msg: >-
              assert-fallback-chain.yml ACCEPTED paid ZDR before local.
      rescue:
        - name: Confirm it failed for the ordering reason, not an unrelated one
          ansible.builtin.assert:
            that:
              - "'D1 ladder drifted' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              The assert failed, but not on the ordering clause. Actual:
              {{ ansible_failed_result.msg | default('(no msg)') }}
            success_msg: Converge-time D1 order guard fires as designed.
