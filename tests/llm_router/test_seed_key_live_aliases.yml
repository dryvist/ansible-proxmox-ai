---
# Pins the fix for Semaphore task 180 (2026-09-13): LiteLLM's /key/list
# defaults to returning "keys" as a list of token STRINGS, not objects
# (litellm 1.98.0 key_management_endpoints.py list_keys/_list_key_helper —
# return_full_object defaults to False). seed-keys.yml's
# _llm_router_live_key_aliases expression only ever finds an alias on an
# OBJECT entry, so a string-shaped response always renders [], every
# previously seeded alias looks unseeded, and /key/generate 400s with
# "Unique key aliases across all keys are required." This proves the
# expression yields the real aliases against a full-object response (the
# shape seed-keys.yml now requests with return_full_object=true) and still
# yields [] against the old string-shaped response, documenting the bug it
# fixed.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_seed_key_live_aliases.yml -i localhost, -c local

- name: The live-alias expression finds aliases in a full-object /key/list response
  hosts: localhost
  gather_facts: false
  vars:
    llm_router_existing_keys:
      json:
        keys:
          - key_alias: langgraph
            token: hash1
          - token: hash2
    _llm_router_live_key_aliases: >-
      {{ llm_router_existing_keys.json['keys'] | default([])
         | selectattr('key_alias', 'defined')
         | map(attribute='key_alias') | select('string') | list }}
  tasks:
    - name: Assert only the aliased entry is found
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_live_key_aliases == ['langgraph']
        fail_msg: "Expected ['langgraph'], got {{ _llm_router_live_key_aliases }}"

- name: The live-alias expression yields no aliases against the old token-string response
  hosts: localhost
  gather_facts: false
  vars:
    llm_router_existing_keys:
      json:
        keys: ["hash1", "hash2"]
    _llm_router_live_key_aliases: >-
      {{ llm_router_existing_keys.json['keys'] | default([])
         | selectattr('key_alias', 'defined')
         | map(attribute='key_alias') | select('string') | list }}
  tasks:
    - name: Assert the string-shaped response finds nothing (the bug fixed by requesting return_full_object=true)
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_live_key_aliases == []
        fail_msg: "Expected [], got {{ _llm_router_live_key_aliases }}"

- name: The create failure expression treats an existing alias as success, not failure
  hosts: localhost
  gather_facts: false
  # Pins the real fix for Semaphore tasks 267/277 (2026-09-21): mint every
  # virtual key with a seeded value every run, and let LiteLLM's own
  # alias-uniqueness check at /key/generate be the "does this exist" answer
  # instead of a fragile client-side pre-filter. A 400 whose body says the
  # alias already exists means the create has nothing left to do; any other
  # non-2xx is still a real failure. Uses the exact failed_when expression
  # seed-keys.yml runs, against the real error body LiteLLM 1.102.0 returns
  # (confirmed on the live proxy: {"error":{"message":"Key with alias 'X'
  # already exists. Unique key aliases across all keys are required.", ...}}).
  vars:
    _llm_router_key_generate_result_exists:
      status: 400
      json:
        error:
          message: "Key with alias 'claude-code' already exists. Unique key aliases across all keys are required."
    _llm_router_key_generate_result_other_400:
      status: 400
      json:
        error:
          message: "Invalid key format. LiteLLM Virtual Key must start with 'sk-'."
    _llm_router_key_generate_result_created:
      status: 200
      json:
        key: "sk-whatever"
  tasks:
    - name: Assert an alias-exists 400 does not fail
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            not (_llm_router_key_generate_result_exists.status not in [200, 201]
            and 'already exists' not in
              (_llm_router_key_generate_result_exists.json.error.message | default('')))
        fail_msg: "An alias-exists 400 was treated as a failure"

    - name: Assert a different 400 still fails
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            (_llm_router_key_generate_result_other_400.status not in [200, 201]
            and 'already exists' not in
              (_llm_router_key_generate_result_other_400.json.error.message | default('')))
        fail_msg: "A non-alias-exists 400 was NOT treated as a failure"

    - name: Assert a real 200 does not fail
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            not (_llm_router_key_generate_result_created.status not in [200, 201]
            and 'already exists' not in
              (_llm_router_key_generate_result_created.json.error.message | default('')))
        fail_msg: "A successful create was treated as a failure"

- name: Verify seed-keys.yml mints every seeded key unconditionally and tolerates an existing alias
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
  tasks:
    - name: Read the seed-keys.yml source
      ansible.builtin.slurp:
        src: "{{ _role_dir }}/tasks/seed-keys.yml"
      register: _seed_keys_source_create

    - name: Assert the create loop is not gated by a pre-filtered "unseeded" list, and accepts an alias-exists 400
      ansible.builtin.assert:
        quiet: true
        that:
          - "'rejectattr(''alias'', ''in''' not in (_seed_keys_source_create.content | b64decode)"
          - "'status_code: [200, 201, 400]' in (_seed_keys_source_create.content | b64decode)"
          - "'already exists' in (_seed_keys_source_create.content | b64decode)"
        fail_msg: >-
          seed-keys.yml's key-generate loop went back to pre-filtering by a
          client-side live-alias read — that read has been wrong more than
          once for a reason narrower than pagination (Semaphore tasks
          267/277) and turned an already-existing alias into a hard failure
          instead of the no-op /key/generate's own uniqueness check already
          treats it as.

- name: Verify seed-keys.yml requests the full-object shape /key/list needs to expose key_alias
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
  tasks:
    - name: Read the seed-keys.yml source
      ansible.builtin.slurp:
        src: "{{ _role_dir }}/tasks/seed-keys.yml"
      register: _seed_keys_source

    - name: Assert the /key/list call carries return_full_object=true
      ansible.builtin.assert:
        quiet: true
        that:
          - "'return_full_object=true' in (_seed_keys_source.content | b64decode)"
        fail_msg: >-
          seed-keys.yml's /key/list request dropped return_full_object=true —
          without it "keys" is token strings and every seeded alias is
          re-created, 400ing on /key/generate.
