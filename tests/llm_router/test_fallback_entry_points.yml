---
# Every name a caller can type for the primary must carry a fallback chain,
# with a context-window escape whenever its chain has a wider reachable rung.
# The depth budget must cover the whole rendered map rather than one chain.
#
# WHY THE MAPS ARE CHECKED TOGETHER. LiteLLM looks both maps up under the model
# name AS TYPED, with a plain string match and no alias resolution first
# (model_group_alias resolves below the fallback handler). So an alias inherits
# nothing from the id it points at. And the two maps fail in opposite
# directions: a missing `fallbacks` key just means no chain, but a key missing
# from a `context_window_fallbacks` map that EXISTS makes an oversize request
# terminal there, with no fall-through to the ordinary map — whereas no map at
# all would fall through. A name with a wider reachable target needs its escape
# entry; a constrained chain with no wider target has no useful escape.
#
# The ZDR-ladder and wider-escape checks over these same rendered maps live in
# test_fallback_zdr_and_escape.yml — split out to stay under the per-file
# token budget, not because the contract differs.
- name: Verify every primary entry-point name is keyed in both fallback maps
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    # Derived, never typed: the registry is the single source for every id.
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Produce the fully credentialed render
      ansible.builtin.import_tasks: tasks/credentialed_render.yml

    # THE EXPECTED NAME SET IS BUILT INDEPENDENTLY of the defaults' own
    # entry-point expression: from the RENDERED model_group_alias (every alias
    # the proxy actually advertises) plus the registry's servable-id projection.
    # Asserting against llm_router_entry_point_names itself would only prove the
    # template copied that var faithfully, not that the var covers every name.
    - name: Every servable id and rendered alias has its applicable entry-point maps
      ansible.builtin.assert:
        quiet: true
        that:
          # ANTI-VACUITY FIRST. Every check below is a subset test, and a
          # derivation that resolves empty passes all of them over nothing.
          # The input that would slip through a weaker guard: a registry with
          # ONLY the primary servable and no aliases — then "every servable id"
          # and "every alias" are each exercised over a single name or none.
          # So: the set is non-empty, holds the primary, holds at least one
          # alias, and holds at least one servable id that is NOT the primary.
          - _entry_points | length > 1
          - llm_router_primary_model in _entry_points
          - _rendered_aliases | length > 0
          - _servable_non_primary | length > 0
          - _fallback_keys | length > 0
          - _cwf_keys | length > 0
          # THE CONTRACT.
          - _entry_points | difference(_fallback_keys) | length == 0
          - _escape_entry_points | difference(_cwf_keys) | length == 0
          - llm_router_cross_modality_fail_fast_names | intersect(_cwf_keys) | length == 0
          - llm_router_context_window_no_wider_entry_points | intersect(_cwf_keys) | length == 0
          # Entry-point chains target the primary's ladder. The primary is a
          # valid rung for other names, while each entry point must exclude
          # its own name and resolved alias target to prevent a self-cycle.
          - _entry_point_targets | length > 0
          - _entry_point_reentries | length == 0
          - >-
            _entry_point_targets
            | difference(llm_router_hermes_default_fallback_chain)
            | length == 0
        fail_msg: >-
          Every entry point must have a fallback entry, and every chat entry
          point with a wider target must have a context-window escape. Cross-modality names must
          have no chat escape. Expected names: {{ _entry_points }}. Missing a
          fallback chain: {{ _entry_points | difference(_fallback_keys) }}.
          Missing a context-window escape:
          {{ _escape_entry_points | difference(_cwf_keys) }}.
          Unexpected cross-modality escapes:
          {{ llm_router_cross_modality_fail_fast_names | intersect(_cwf_keys) }}.
          Entry-point targets: {{ _entry_point_targets }}.
        success_msg: >-
          All {{ _entry_points | length }} typeable names have their
          modality-appropriate fallback and context-window entries.
      vars:
        _rendered_aliases: >-
          {{ _config.router_settings.model_group_alias | default({}) | list }}
        _servable_non_primary: >-
          {{ llm_router_all_servable_models | reject('equalto', llm_router_primary_model) | list }}
        _entry_points: >-
          {{ (llm_router_all_servable_models + _rendered_aliases) | unique | list }}
        _escape_entry_points: >-
          {{ _entry_points | difference(llm_router_cross_modality_fail_fast_names)
             | difference(llm_router_context_window_no_wider_entry_points) }}
        _fallback_keys: >-
          {{ _config.router_settings.fallbacks
             | map('dict2items') | flatten | map(attribute='key') | list }}
        _cwf_keys: >-
          {{ _config.router_settings.context_window_fallbacks | default([])
             | map('dict2items') | flatten | map(attribute='key') | list }}
        _entry_point_targets: >-
          {{ _config.router_settings.fallbacks
             | map('dict2items') | flatten
             | selectattr('key', 'in', _entry_points)
             | map(attribute='value') | flatten | unique | list }}
        _entry_point_reentries: >-
          {%- set ns = namespace(names=[]) -%}
          {%- for pair in (_config.router_settings.fallbacks
                | map('dict2items') | flatten)
                if pair.key in _entry_points -%}
          {%- set _target = llm_router_model_group_aliases.get(pair.key, pair.key) -%}
          {%- if pair.key in pair.value or _target in pair.value -%}
          {%- set ns.names = ns.names + [pair.key] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.names }}

    # THE EXACT-MATCH CASE the subset check above cannot catch: a rung
    # dropped from an entry point's own chain still passes "every target is
    # IN the D1 ladder" (a subset relation), so EVERY rendered alias gets
    # pinned to its exact ordered override or default tail. Strict ZDR aliases
    # lose unasserted default rungs; aliases to the auto-router skip its first
    # rung (see config.yaml.j2).
    - name: Every alias carries its exact configured fallback chain
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_hermes_default_fallback_chain | length > 0
          - _rendered_aliases | length > 0
          - _mismatched_aliases | length == 0
        fail_msg: >-
          Alias fallback target(s) must equal their explicit chain or the D1
          class ladder tail. Mismatched: {{ _mismatched_aliases }}.
        success_msg: >-
          All {{ _rendered_aliases | length }} aliases carry their full
          configured ladder in order.
      vars:
        # Task-level vars do not carry across tasks — re-derived here rather
        # than assumed present from the earlier task's own vars block.
        _rendered_aliases: >-
          {{ _config.router_settings.model_group_alias | default({}) | list }}
        _fallbacks_by_key: >-
          {{ dict(_config.router_settings.fallbacks
                  | map('dict2items') | flatten
                  | map(attribute='key')
                  | zip(_config.router_settings.fallbacks
                        | map('dict2items') | flatten
                        | map(attribute='value'))) }}
        _mismatched_aliases: >-
          {%- set ns = namespace(bad=[]) -%}
          {%- for alias in _rendered_aliases -%}
          {%- set _target = llm_router_model_group_aliases.get(alias, alias) -%}
          {%- set _expected = llm_router_entry_point_fallback_overrides.get(
                alias, llm_router_hermes_default_fallback_chain
                | reject('equalto', alias) | reject('equalto', _target) | list) -%}
          {%- if alias in llm_router_zdr_entry_point_names
                and alias not in llm_router_entry_point_fallback_overrides -%}
          {%- set _expected = _expected | reject('in', llm_router_zdr_unasserted_terminal_rungs) | list -%}
          {%- endif -%}
          {%- if alias in (llm_router_cross_modality_fail_fast_names
                            + llm_router_local_only_fail_fast_names) -%}
          {%- set _expected = [] -%}
          {%- endif -%}
          {%- if (_fallbacks_by_key[alias] | default([])) != _expected -%}
          {%- set ns.bad = ns.bad + [alias ~ ': expected=' ~ (_expected | string)
                ~ ', actual=' ~ ((_fallbacks_by_key[alias] | default([])) | string)] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.bad }}
