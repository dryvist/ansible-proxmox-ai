---
# Split out of test_hermes_cloud_value.yml when that file crossed its per-file
# token budget: the remedy is a split along a real seam, never a raised budget.
- name: Verify one credential per provider and the strict OpenRouter policy
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Produce the fully credentialed render
      ansible.builtin.import_tasks: tasks/credentialed_render.yml

    - name: One provider key each and strict OpenRouter policy are rendered
      ansible.builtin.assert:
        quiet: true
        that:
          - _environment | regex_findall('(?m)^OPENROUTER_API_KEY=') | length == 1
          - _environment | regex_findall('(?m)^OPENROUTER_HERMES_KEY=') | length == 1
          # Each provider key line renders only while an enabled route consumes
          # its credential_env, so the per-provider counts track the enabled
          # routes (the Alibaba and Gemini routes are disabled until their
          # OpenBao key paths exist).
          - >-
            _environment | regex_findall('(?m)^GEMINI_API_KEY=') | length
            == (1 if 'GEMINI_API_KEY' in _emitted_provider_api_keys else 0)
          - >-
            _environment | regex_findall('(?m)^DASHSCOPE_API_KEY=') | length
            == (1 if 'DASHSCOPE_API_KEY' in _emitted_provider_api_keys else 0)
          - _provider_api_keys | difference(_allowed_provider_api_keys) | length == 0
          - _provider_api_keys | sort == _allowed_provider_api_keys | sort
          - _registry_provider_api_keys | sort == _allowed_registry_provider_api_keys | sort
          - _openrouter_models | length > 0
          - _openrouter_models | length == _registry_openrouter_members | length
          - _bad_openrouter_policy | length == 0
          - _bad_openrouter_price | length == 0
          - _bad_openrouter_flags | length == 0
        fail_msg: >-
          Cloud credentials must be one per provider and every OpenRouter model
          must carry the strict endpoint policy; provider-specific key counts or
          policy fields drifted.
        success_msg: >-
          Exactly one key per provider; OpenRouter model access is constrained
          by exact model ids, price, parameter, collection, and ZDR policy.
      vars:
        # OPENROUTER_HERMES_KEY breaks the *_API_KEY* naming convention on
        # purpose (operator-assigned OpenBao field name, see
        # llm-models.d/40-hermes-cloud.yml); matched by an explicit second
        # alternative rather than widening to a bare `_KEY=` pattern, which
        # would also catch LLM_ROUTER_MASTER_KEY.
        _provider_api_keys: >-
          {{ _environment
             | regex_findall('(?m)^([A-Z0-9_]*API_KEY[A-Z0-9_]*|OPENROUTER_HERMES_KEY)=')
             | unique | list }}
        _registry_provider_api_keys: >-
          {{ llm_router_hermes_cloud_models | rejectattr('provider', 'equalto', 'chatgpt')
             | map(attribute='credential_env') | unique | list }}
        # The provider keys the render emits: the credential_env of every
        # enabled openrouter/opencode entry and credentialed Hermes-cloud entry
        # whose credential resolved — exactly the loop litellm.env.j2 emits, so
        # the allowed set tracks the enabled routes.
        _emitted_provider_api_keys: >-
          {%- set ns = namespace(keys=[]) -%}
          {%- for m in (llm_router_openrouter_models + llm_router_opencode_models
                        + llm_router_hermes_cloud_models_credentialed) -%}
          {%- if m.credential_env not in ns.keys
                 and _llm_router_m_resolved_credentials.get(m.credential_env, '') | length > 0 -%}
          {%- set ns.keys = ns.keys + [m.credential_env] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.keys }}
        _allowed_provider_api_keys: "{{ _emitted_provider_api_keys }}"
        # The hermes-cloud tier's only OpenRouter entry consumes the dedicated
        # OPENROUTER_HERMES_KEY, so the tier-scoped set drops OPENROUTER_API_KEY
        # even though the full environment still renders it for the general
        # openrouter tier's own :free entries.
        _allowed_registry_provider_api_keys: >-
          {{ _allowed_provider_api_keys | reject('equalto', 'OPENROUTER_API_KEY') | list }}
        # The group's OpenRouter members, counted from the registry rather than typed.
        _registry_openrouter_members: >-
          {{ llm_router_hermes_cloud_models
             | selectattr('route_group', 'equalto', _openrouter_group)
             | selectattr('provider', 'equalto', 'openrouter') | list }}
        # OpenRouter deployments in that group, matched on the provider prefix.
        _openrouter_models: >-
          {{ _config.model_list
             | selectattr('model_name', 'equalto', _openrouter_group)
             | selectattr('litellm_params.model', 'match', '^openrouter/') | list }}
        _openrouter_group: >-
          {{ llm_router_hermes_cloud_models
             | selectattr('provider', 'equalto', 'openrouter')
             | map(attribute='route_group') | unique | first }}
        _bad_openrouter_policy: >-
          {{ _openrouter_models
             | rejectattr('litellm_params.extra_body.provider.sort', 'equalto', 'price')
             | map(attribute='model_name') | list }}
        _bad_openrouter_price: >-
          {{ (_openrouter_models
              | rejectattr('litellm_params.extra_body.provider.max_price.prompt', 'equalto', 0.75)
              | map(attribute='model_name') | list)
             + (_openrouter_models
                | rejectattr('litellm_params.extra_body.provider.max_price.completion', 'equalto', 4.0)
                | map(attribute='model_name') | list) }}
        _bad_openrouter_flags: >-
          {{ (_openrouter_models
              | rejectattr('litellm_params.extra_body.provider.require_parameters', 'equalto', true)
              | map(attribute='model_name') | list)
             + (_openrouter_models
                | rejectattr('litellm_params.extra_body.provider.allow_fallbacks', 'equalto', true)
                | map(attribute='model_name') | list)
             + (_openrouter_models
                | rejectattr('litellm_params.extra_body.provider.data_collection', 'equalto', 'deny')
                | map(attribute='model_name') | list)
             + (_openrouter_models
                | rejectattr('litellm_params.extra_body.provider.zdr', 'equalto', true)
                | map(attribute='model_name') | list) }}
