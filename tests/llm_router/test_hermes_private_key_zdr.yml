---
# Pins both Hermes keys to their intended routing boundaries. The private key
# has only the local and asserted-ZDR ladder; the original retains the full
# chain.
#
# Run from the repository root:
#   ansible-playbook tests/llm_router/test_hermes_private_key_zdr.yml -i localhost, -c local
- name: Verify Hermes private and public router key scopes
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    _hermes_agent_role_dir: "{{ playbook_dir }}/../../roles/hermes_agent"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets:
      OPENROUTER_API_KEY: test-openrouter-provider-key
      OPENCODE_API_KEY: test-opencode-provider-key
      OPENAI_API_KEY: test-openai-provider-key
    bao_apps_secrets:
      hermes_default_llm_router_key: sk-fixture-hermes-default
      hermes_splunk_admin_llm_router_key: sk-fixture-hermes-splunk-admin
      hermes_homelab_admin_llm_router_key: sk-fixture-hermes-homelab-admin
      hermes_github_maint_llm_router_key: sk-fixture-hermes-github-maint
      hermes_orchestrator_llm_router_key: sk-fixture-hermes-orchestrator
      hermes_private_llm_router_key: sk-fixture-hermes-private
      donna_llm_router_key: sk-fixture-donna
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: "pve.example.test"
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Load the inventory-selected Hermes cron model
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../inventory/group_vars/all.yml"
        name: _cron_inventory

    - name: Load the Hermes profile names the router consumer defaults use
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../../playbooks/tasks/load_hermes_profiles.yml"

    - name: Load the cron model role defaults
      ansible.builtin.include_vars:
        file: "{{ _hermes_agent_role_dir }}/defaults/main/30-cron-identities.yml"
        name: _hermes_cron_role_defaults

    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the fabric model registry the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Resolve the rendered keys and model classes once
      ansible.builtin.set_fact:
        _hermes_private_test_keys: "{{ llm_router_virtual_keys }}"
        _hermes_cron_test_keys: >-
          {{ _llm_router_hermes_profile_keys
             + (llm_router_virtual_keys
                | selectattr('alias', 'in', ['hermes-private', 'donna']) | list) }}
        _retaining_names: >-
          {{ llm_router_deployment_tags_by_model | dict2items
             | selectattr('value', 'contains', 'retains') | map(attribute='key')
             | difference(llm_router_hermes_router_ids) | list }}
        _free_names: >-
          {{ llm_router_deployment_tags_by_model | dict2items
             | selectattr('value', 'contains', 'free') | map(attribute='key') | list }}
        _hermes_public_test_chain: "{{ llm_router_hermes_default_fallback_chain }}"

    - name: Assert the private key is scoped to local and asserted-ZDR models
      ansible.builtin.assert:
        quiet: true
        that:
          - _private.zdr_only
          - _private.models_authoritative
          - _private.tags == ['&zdr', '!free', '!retains']
          - _private.router_settings.enable_tag_filtering
          - _private.models | difference(_llm_router_private_zdr_model_scope) | length == 0
          - _private.models | intersect(llm_router_zdr_false_group_names) | length == 0
          - _private.models | intersect(llm_router_zdr_unasserted_terminal_rungs) | length == 0
          - _private.models | intersect(_free_names) | length == 0
          - _private.models | intersect(_retaining_names) | length == 0
          - _private.models | length > 1
          - _llm_router_private_zdr_model_scope | difference(_private.models) | length == 0
          - _local_registry_names | length > 0
          - _local_registry_names | difference(_private.models) | length == 0
          - _asserted_zdr_cloud_names | length > 0
          - _asserted_zdr_cloud_names | difference(_private.models) | length == 0
          - _donna.models | difference(_llm_router_private_zdr_model_scope) | length == 0
          - _donna.models | length < _private.models | length
          - _private.daily_budget == _llm_router_hermes_profile_daily_budget
          - _private.object_permission.mcp_access_groups == ['hub-public', 'hub-homelab-read']
          - _private.object_permission.agents is not defined
        fail_msg: >-
          hermes-private models={{ _private.models }} free={{ _free_names }}
          retaining={{ _retaining_names }}
        success_msg: "hermes-private={{ _private.models }}"
      vars:
        _private: "{{ _hermes_private_test_keys | selectattr('alias', 'equalto', 'hermes-private') | first }}"
        _donna: "{{ _hermes_private_test_keys | selectattr('alias', 'equalto', 'donna') | first }}"
        _local_registry_names: >-
          {{ llm_router_registry_enabled
             | selectattr('tier', 'in', llm_router_local_registry_tiers)
             | selectattr('route_group', 'defined')
             | map(attribute='route_group') | unique | list }}
        _asserted_zdr_cloud_names: >-
          {%- set ns = namespace(names=[]) -%}
          {%- for m in llm_router_registry_enabled
                if m.tier not in llm_router_local_registry_tiers
                and llm_router_registry_zdr_by_model[m.client_model_id] -%}
          {%- set ns.names = ns.names + [m.client_model_id]
                + ([m.route_group] if m.route_group is defined else [])
                + ([m.fallback_group] if m.fallback_group is defined else []) -%}
          {%- endfor -%}
          {{ ns.names | unique | list }}

    - name: Assert the original key retains the full ladder
      ansible.builtin.assert:
        quiet: true
        that:
          - _public.models | intersect(_retaining_names) | length > 0
          - _hermes_public_test_chain | difference(_public.models) | length == 0
        fail_msg: >-
          hermes-default models={{ _public.models }} chain={{ _hermes_public_test_chain }}
        success_msg: >-
          hermes-default retains non-ZDR access; chain={{ _hermes_public_test_chain }}
      vars:
        _public: >-
          {{ _hermes_private_test_keys | selectattr('alias', 'equalto',
             (_llm_router_hermes_profile_keys | selectattr('alias', 'search', '-default$')
              | map(attribute='alias') | first)) | first }}

    # The caps are honestly 0 until the router database is in the inventory,
    # so give it one here and render the keys again.
    - name: Give the router a database so the key budgets are not zero
      ansible.builtin.set_fact:
        llm_router_db_host: db.example.test

    - name: Assert every Hermes key carries the Hermes daily cap
      ansible.builtin.assert:
        quiet: true
        that:
          - _hermes_caps | unique == [2.0]
          - _hermes_caps | length == _hermes_aliases | length
        fail_msg: "hermes aliases={{ _hermes_aliases }} caps={{ _hermes_caps }}"
        success_msg: "Hermes keys cap at {{ _hermes_caps | unique }} per 24h"
      vars:
        _hermes_aliases: >-
          {{ _llm_router_hermes_profile_keys | map(attribute='alias') | list
             + ['hermes-private', 'donna'] }}
        _hermes_caps: >-
          {{ llm_router_virtual_keys | selectattr('alias', 'in', _hermes_aliases)
             | map(attribute='daily_budget') | map('float') | list }}

    - name: Assert every Hermes key can call the local cron model
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_review_aliases.local in item.models
        fail_msg: "{{ item.alias }} cannot call the local Hermes cron model"
      loop: "{{ _hermes_cron_test_keys }}"
      loop_control:
        label: "{{ item.alias }}"

    - name: Assert the local cron model's chain stays on local rungs
      ansible.builtin.assert:
        quiet: true
        that:
          # Large now aliases the primary, so it cannot be a distinct local fallback rung.
          - llm_router_d1_rungs_by_class['local'] == [llm_router_primary_model]
          - llm_router_review_local_chain == []
        fail_msg: >-
          review-local chain={{ llm_router_review_local_chain }}
          local rungs={{ llm_router_d1_rungs_by_class['local'] }}

    - name: Define a direct cron job with no per-job model
      ansible.builtin.set_fact:
        _hermes_cron_test_job:
          name: model-default-contract
          schedule: "*/5 * * * *"

    - name: Resolve the cron job's effective model and provider
      ansible.builtin.set_fact:
        _hermes_cron_test_model: >-
          {{ _hermes_cron_test_job.model
             | default(_cron_inventory.hermes_agent_cron_model) }}
        _hermes_cron_test_provider: >-
          {{ _hermes_cron_test_job.model_provider
             | default(_hermes_cron_role_defaults.hermes_agent_cron_model_provider) }}

    - name: Render the model and provider argv for that direct cron job
      ansible.builtin.set_fact:
        _hermes_cron_test_argv: >-
          {{ (['--model', _hermes_cron_test_model]
              if _hermes_cron_test_model | length > 0 else [])
             + (['--provider', _hermes_cron_test_provider]
                if _hermes_cron_test_model | length > 0 else []) }}
        _hermes_cron_reconcile_source: >-
          {{ lookup('ansible.builtin.file',
                    _hermes_agent_role_dir ~ '/tasks/reconcile_direct_cron.yml') }}

    - name: Assert a model-less direct cron renders the inventory model and the reconcile uses it
      ansible.builtin.assert:
        quiet: true
        that:
          - _hermes_cron_test_argv[0] == '--model'
          - _hermes_cron_test_argv[1] == _cron_inventory.hermes_agent_cron_model
          - _hermes_cron_test_argv[2] == '--provider'
          - _hermes_cron_test_argv[3] == _hermes_cron_role_defaults.hermes_agent_cron_model_provider
          - "'item.model | default(hermes_agent_cron_model)' in _hermes_cron_reconcile_source"
          - "\"'--model', hermes_agent_direct_model\" in _hermes_cron_reconcile_source"
          - "\"'model': hermes_agent_direct_model\" in _hermes_cron_reconcile_source"
        fail_msg: >-
          cron model argv={{ _hermes_cron_test_argv }}
          inventory={{ _cron_inventory.hermes_agent_cron_model }}
