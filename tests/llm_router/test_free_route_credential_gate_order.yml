---
# Pins the fix for a live incident (2026-09-23): model-list-free.yaml.j2
# looped over every free-route candidate and used `loop.index` as `order`,
# but only rendered a deployment when its credential resolved non-empty --
# so a SKIPPED entry (missing credential) still consumed an order slot, and
# the next real deployment inherited whatever index was left over. With
# OPENCODE_API_KEY unseeded, the two OpenCode Go entries (order 1, 2 by
# registry position) were skipped and the sole surviving OpenRouter :free
# entry rendered at order 3 instead of 1.
#
# Fix: filter the candidate list by credential presence BEFORE the loop, so
# `loop.index` only ever counts deployments that actually render.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_free_route_credential_gate_order.yml \
#     -i localhost, -c local

- name: With the subscription credential unseeded, the surviving free deployment starts at order 1
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Seed the OpenRouter credential only -- OpenCode stays unseeded
      ansible.builtin.set_fact:
        bao_local_llm_secrets:
          OPENROUTER_API_KEY: test-openrouter-provider-key

    - name: Render the config with the subscription credential unseeded
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}

    - name: Assert exactly one free deployment, at order 1 (no gap left by a skipped entry)
      ansible.builtin.assert:
        quiet: true
        that:
          - _free_deployments | length == 1
          - _free_deployments[0].litellm_params.order == 1
        fail_msg: >-
          Expected exactly one 'free' deployment at order 1; got
          {{ _free_deployments | map(attribute='litellm_params.order') | list }}
          for {{ _free_deployments | map(attribute='model_name') | list }} on
          model {{ _free_deployments | map(attribute='litellm_params.model') | list }}.
          A skipped (unseeded) credential must never consume an order slot.
        success_msg: "The one seeded free deployment renders at order 1."
      vars:
        _free_deployments: "{{ _config.model_list | selectattr('model_name', 'equalto', 'free') | list }}"

- name: With the subscription credential seeded too, OpenCode leads free at orders 1 and 2
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Seed the subscription credential and the OpenRouter provider key
      ansible.builtin.set_fact:
        bao_local_llm_secrets:
          OPENCODE_API_KEY: test-opencode-subscription-key
          OPENROUTER_API_KEY: test-openrouter-provider-key

    - name: Render the config with the subscription credential present
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}

    - name: Assert OpenCode leads free at orders 1 and 2, no gap before the next tier
      ansible.builtin.assert:
        quiet: true
        that:
          - _free_deployments | length == (_registry_opencode_free_count + 1)
          - _free_orders == (_expected_opencode_orders + [_registry_opencode_free_count + 1])
        fail_msg: >-
          Expected {{ _registry_opencode_free_count }} OpenCode deployment(s)
          at orders {{ _expected_opencode_orders }} followed by one more
          deployment at order {{ _registry_opencode_free_count | int + 1 }};
          got orders {{ _free_orders }} for
          {{ _free_deployments | map(attribute='litellm_params.model') | list }}.
        success_msg: "OpenCode leads the free route with a contiguous order sequence."
      vars:
        _free_deployments: >-
          {{ _config.model_list | selectattr('model_name', 'equalto', 'free') | list
             | sort(attribute='litellm_params.order') }}
        _free_orders: "{{ _free_deployments | map(attribute='litellm_params.order') | list }}"
        _registry_opencode_free_count: >-
          {{ (llm_router_opencode_models | selectattr('in_free_route', 'defined')
             | selectattr('in_free_route') | list | length) | int }}
        _expected_opencode_orders: "{{ range(1, _registry_opencode_free_count | int + 1) | list }}"
