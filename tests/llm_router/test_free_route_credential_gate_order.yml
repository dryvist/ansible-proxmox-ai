---
# The old `free` and `free-zdrless` client groups were removed. Free/subscription
# eligibility remains registry metadata, while callers reach only the provider
# names explicitly granted by their key.
- name: Retired free client names never enter the local caller contract
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets:
      OPENROUTER_API_KEY: fixture-openrouter-key
    bao_apps_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hindsight_retain_model: small
    hermes_goal_judge_model: judge
  tasks:
    - name: Load defaults and the registry
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through its role task
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Render without the subscription credential
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: Retired client groups are absent from deployments, aliases, keys and fallbacks
      ansible.builtin.assert:
        quiet: true
        that:
          - _retired_names | intersect(_model_names) | length == 0
          - _retired_names | intersect(llm_router_model_group_aliases.keys() | list) | length == 0
          - _retired_names | intersect(llm_router_registry_enabled_route_names) | length == 0
          - _retired_names | intersect(_key_models) | length == 0
          - _retired_names | intersect(_fallback_targets) | length == 0
          - _opencode_deployments | length == 0
        fail_msg: >-
          retired={{ _retired_names }}, deployments={{ _model_names }},
          key models={{ _key_models }}, fallback targets={{ _fallback_targets }}
        success_msg: >-
          Retired client names are absent; the subscription deployments remain
          gated while their credential is absent.
      vars:
        _retired_names: [free, free-zdrless]
        _model_names: "{{ _config.model_list | map(attribute='model_name') | unique | list }}"
        _key_models: "{{ llm_router_virtual_keys | map(attribute='models') | flatten | unique | list }}"
        _fallback_targets: >-
          {{ _config.router_settings.fallbacks | map('dict2items') | flatten
             | map(attribute='value') | flatten | unique | list }}
        _opencode_group_names: "{{ llm_router_opencode_models | map(attribute='client_model_id') | list }}"
        _opencode_deployments: >-
          {{ _config.model_list | selectattr('model_name', 'in', _opencode_group_names) | list }}

- name: The OpenCode subscription exposes its registry client groups when credentialed
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets:
      OPENCODE_API_KEY: fixture-opencode-key
    bao_apps_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hindsight_retain_model: small
    hermes_goal_judge_model: judge
  tasks:
    - name: Load defaults and the registry
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through its role task
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Render with the subscription credential
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: Each subscription client group renders exactly one registry deployment
      ansible.builtin.assert:
        quiet: true
        that:
          - _deployed_names | sort == _expected_names | sort
          - _deployments | length == _expected_names | length
          - _deployments | rejectattr('litellm_params.api_key', 'defined') | list | length == 0
          - (['free', 'free-zdrless'] | intersect(_all_model_names)) | length == 0
        fail_msg: >-
          expected={{ _expected_names }}, deployed={{ _deployed_names }},
          entries={{ _deployments }}
        success_msg: OpenCode deployments follow their registry client names and credential gate.
      vars:
        _expected_names: "{{ llm_router_opencode_models | map(attribute='client_model_id') | list }}"
        _deployments: >-
          {{ _config.model_list | selectattr('model_name', 'in', _expected_names) | list }}
        _deployed_names: "{{ _deployments | map(attribute='model_name') | unique | list }}"
        _all_model_names: "{{ _config.model_list | map(attribute='model_name') | unique | list }}"
