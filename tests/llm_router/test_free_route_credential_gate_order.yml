---
# Pins the fix for a live incident (2026-09-23): model-list-free.yaml.j2
# looped over every free-route candidate and used `loop.index` as `order`,
# but only rendered a deployment when its credential resolved non-empty --
# so a SKIPPED entry (missing credential) still consumed an order slot, and
# the next real deployment inherited whatever index was left over. With
# OPENCODE_API_KEY unseeded, the two OpenCode Go entries (order 1, 2 by
# registry position) were skipped and the sole surviving OpenRouter :free
# entry rendered at order 3 instead of 1.
#
# Fix: filter the candidate list by credential presence BEFORE the loop, so
# `loop.index` only ever counts deployments that actually render.
#
# hermes-cloud-free (2026-09-23, upstream withdrew its model) was the only
# non-OpenCode ZDR-true `in_free_route` member, so the two scenarios below
# changed: with OpenCode unseeded, `free` now has no candidate left at all
# (the first scenario), and with OpenCode seeded, `free` is entirely its
# members -- production's actual state, since OpenCode is credentialed live.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_free_route_credential_gate_order.yml \
#     -i localhost, -c local

- name: With no ZDR-true free candidate credentialed, `free` renders empty without breaking free-zdrless
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Seed the OpenRouter credential only -- OpenCode stays unseeded
      ansible.builtin.set_fact:
        bao_local_llm_secrets:
          OPENROUTER_API_KEY: test-openrouter-provider-key

    - name: Render the config with the subscription credential unseeded
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}

    - name: With no free candidate credentialed, `free` is absent and free-zdrless is untouched
      ansible.builtin.assert:
        quiet: true
        that:
          # `free` has no deployment at all -- OpenCode is the only other
          # in_free_route member and it is unseeded here. A model_name with
          # zero deployments answers "model not found" to a direct caller; it
          # is never reached through router_settings.fallbacks, since that
          # dict is only consulted after an EXISTING deployment's call fails,
          # not as a way to discover a model_name in the first place.
          - _free_deployments | length == 0
          # The static `free: [free-zdrless]` fallback entry (config.yaml.j2)
          # still renders -- it does not conditionally drop when `free` is
          # empty -- but it stays harmless: nothing can call an unlisted
          # model_name to trigger it, and its target is real and populated.
          - _free_fallback_entry | length == 1
          - _free_zdrless_deployments | length > 0
        fail_msg: >-
          Expected zero 'free' deployments and a still-populated
          'free-zdrless'; got free={{ _free_deployments | map(attribute='litellm_params.model') | list }}
          free-zdrless={{ _free_zdrless_deployments | map(attribute='litellm_params.model') | list }}
          fallback_entry={{ _free_fallback_entry }}.
        success_msg: >-
          'free' correctly renders with no deployments; 'free-zdrless' and its
          own fallback entry are unaffected.
      vars:
        _free_deployments: "{{ _config.model_list | selectattr('model_name', 'equalto', 'free') | list }}"
        _free_zdrless_deployments: >-
          {{ _config.model_list | selectattr('model_name', 'equalto', 'free-zdrless') | list }}
        _free_fallback_entry: "{{ _config.router_settings.fallbacks | selectattr('free', 'defined') | list }}"

- name: With the subscription credential seeded too, `free` is entirely OpenCode's members in order
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Seed the subscription credential and the OpenRouter provider key
      ansible.builtin.set_fact:
        bao_local_llm_secrets:
          OPENCODE_API_KEY: test-opencode-subscription-key
          OPENROUTER_API_KEY: test-openrouter-provider-key

    - name: Render the config with the subscription credential present
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}

    - name: Assert `free` is exactly the OpenCode members, contiguous from order 1
      ansible.builtin.assert:
        quiet: true
        that:
          # OpenCode is the only remaining non-opencode-tier-excluded ZDR-true
          # in_free_route member since hermes-cloud-free was disabled
          # (2026-09-23, upstream withdrew its model) -- production's actual
          # state, since OpenCode is credentialed live. No trailing rung.
          - _free_deployments | length == _registry_opencode_free_count
          - _free_orders == _expected_opencode_orders
        fail_msg: >-
          Expected exactly {{ _registry_opencode_free_count }} OpenCode
          deployment(s) at orders {{ _expected_opencode_orders }} and nothing
          else; got orders {{ _free_orders }} for
          {{ _free_deployments | map(attribute='litellm_params.model') | list }}.
        success_msg: "'free' is exactly OpenCode's members, in a contiguous order sequence."
      vars:
        _free_deployments: >-
          {{ _config.model_list | selectattr('model_name', 'equalto', 'free') | list
             | sort(attribute='litellm_params.order') }}
        _free_orders: "{{ _free_deployments | map(attribute='litellm_params.order') | list }}"
        _registry_opencode_free_count: >-
          {{ (llm_router_opencode_models | selectattr('in_free_route', 'defined')
             | selectattr('in_free_route') | list | length) | int }}
        _expected_opencode_orders: "{{ range(1, _registry_opencode_free_count | int + 1) | list }}"
