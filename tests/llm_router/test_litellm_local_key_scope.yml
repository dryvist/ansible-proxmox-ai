---
- name: Verify the local keys expose only the local capabilities
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_apps_secrets:
      litellm_local_llm_router_key: sk-fixture-litellm-local
      litellm_local_workstation_llm_router_key: sk-fixture-workstation
      opencode_llm_router_key: sk-fixture-opencode
      OPENCODE_ROUTER_KEY: sk-fixture-opencode
      qwen_code_llm_router_key: sk-fixture-qwen-code
      QWEN_CODE_ROUTER_KEY: sk-fixture-qwen-code
    bao_local_llm_secrets: {}
    llm_router_subdomain: pve.example.test
    llm_large_serving_host: llm-large
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    hermes_brain_model: "{{ llm_router_primary_model }}"
    hindsight_retain_model: "{{ llm_router_small_model }}"
  tasks:
    - name: Load defaults and the model registry
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load registry projections
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Local proxy and app keys expose all capabilities without cloud names
      ansible.builtin.assert:
        quiet: true
        that:
          - _keys | length == 4
          - _keys | selectattr('allowed_classes', 'equalto', ['local']) | list | length == 4
          - _keys | map(attribute='models') | list | unique | first | sort == _capability_names | sort
          - _keys | map(attribute='models') | flatten | intersect(_cloud_groups) | length == 0
          - _keys | selectattr('models_authoritative', 'truthy') | list | length == 4
          - _keys | selectattr('tags', 'equalto', ['&zdr', '!free', '!retains', '&local']) | list | length == 4
          - _keys | selectattr('router_settings.enable_tag_filtering', 'equalto', true) | list | length == 4
        fail_msg: "local keys={{ _keys }} cloud groups={{ _cloud_groups }}"
      vars:
        _capability_names: >-
          {{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model,
              llm_router_embedding_model, llm_router_ocr_model] | unique | list }}
        _keys: >-
          {{ llm_router_virtual_keys
             | selectattr('alias', 'in', ['litellm-local', 'litellm-local-workstation',
                                          'opencode', 'qwen-code']) | list }}
        _cloud_groups: >-
          {{ llm_router_d1_group_class_by_name | dict2items
             | rejectattr('value', 'equalto', 'local') | map(attribute='key') | list }}
