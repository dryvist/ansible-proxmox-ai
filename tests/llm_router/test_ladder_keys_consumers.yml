---
- name: Verify the consumer key declarations and scopes
  hosts: localhost
  gather_facts: false
  vars_files:
    - ladder_keys_fixture.yml
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
  tasks:
    - name: Seed only the generated Claude router key fixtures
      ansible.builtin.set_fact:
        bao_apps_secrets: >-
          {{ (bao_apps_secrets | default({})) | combine({
            'claude_llm_router_key': 'fixture-claude-llm',
            'claude_ocg_router_key': 'fixture-claude-ocg'}) }}
      no_log: true

    - name: Prepare role-backed rendered contract
      ansible.builtin.import_tasks: tasks/prepare_ladder_keys.yml

    - name: Include the new target keys in this contract check
      ansible.builtin.set_fact:
        _target_aliases: "{{ _target_aliases + ['claude-llm', 'claude-ocg', 'sandbox-agent'] }}"
        _enabled_target_aliases: "{{ _enabled_target_aliases + ['claude-llm', 'claude-ocg'] }}"

    - name: Every consumer is declared once with its table class scope
      ansible.builtin.assert:
        quiet: true
        that:
          - _declared_target_aliases | sort == _target_aliases | sort
          - _declared_target_aliases | length == _target_aliases | length
          - _active_target_aliases | sort == _enabled_target_aliases | sort
          - _active_target_aliases | length == _enabled_target_aliases | length
          - >-
            llm_router_disabled_virtual_keys | intersect(_target_aliases) | sort
            == ['agy', 'donna', 'hermes-private', 'judge', 'opencode', 'qwen-code',
                'recorder', 'sandbox-agent', 'zcode']
          - _class_scope_mismatches | length == 0
          - _class_model_mismatches | length == 0
          - _target_model_mismatches | length == 0
          - _target_budget_mismatches | length == 0
          - _strict_tag_mismatches | length == 0
          - _mcp_permission_mismatches | length == 0
          - _config.general_settings.enforce_fallback_model_access == true
          - hermes_brain_model == llm_router_primary_model
          - hermes_brain_model in (_config.model_list | map(attribute='model_name') | list)
        fail_msg: >-
          Consumer declarations={{ _class_scope_mismatches }}, model scope={{ _class_model_mismatches }},
          MCP scope={{ _mcp_permission_mismatches }}.
        success_msg: "Target key scopes, budgets, and fallback access render as declared."
      vars:
        _declared_target_aliases: >-
          {{ _llm_router_declared_virtual_keys | selectattr('alias', 'in', _target_aliases)
             | map(attribute='alias') | list }}
        _active_target_aliases: >-
          {{ _active_virtual_keys | selectattr('alias', 'in', _target_aliases)
             | map(attribute='alias') | list }}
        _class_scope_mismatches: >-
          {%- set _recorder = (llm_router_role_deployments
                | selectattr('litellm_params.turn_off_message_logging', 'defined') | first).role -%}
          {%- set _standard = ['sub', 'local', 'paid-zdr', 'free'] -%}
          {%- set _all = ['sub', 'local', 'paid-zdr', 'free', 'retains'] -%}
          {%- set _zdr = ['sub', 'local', 'paid-zdr'] -%}
          {%- set ns = namespace(rows=[]) -%}
          {%- for _key in _llm_router_declared_virtual_keys
                if _key.alias in _target_aliases -%}
          {%- set _want = _standard if _key.alias in ['claude-code', 'codex', 'agy']
                else _zdr if _key.alias == 'claude-llm'
                else ['sub'] if _key.alias == 'claude-ocg'
                else ['local'] if _key.alias in ['judge', _recorder, 'opencode', 'qwen-code']
                else _zdr if _key.alias in ['hermes-private', 'donna']
                else _all -%}
          {%- if _key.allowed_classes | list != _want -%}
          {%- set ns.rows = ns.rows + [_key.alias] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.rows }}
        _target_model_mismatches: >-
          {%- set _claude_llm = _llm_router_declared_virtual_keys
                | selectattr('alias', 'equalto', 'claude-llm') | first -%}
          {%- set _claude_ocg = _llm_router_declared_virtual_keys
                | selectattr('alias', 'equalto', 'claude-ocg') | first -%}
          {%- set _sandbox = _llm_router_declared_virtual_keys
                | selectattr('alias', 'equalto', 'sandbox-agent') | first -%}
          {%- set _go_groups = llm_router_opencode_models
                | selectattr('client_model_id', 'match', '^go-')
                | map(attribute='client_model_id') | list -%}
          {%- set _sandbox_expected = ([llm_router_small_model, llm_router_primary_model,
                llm_router_large_model] + (llm_router_d1_all_key_groups
                | difference(_llm_router_sandbox_agent_excluded_groups))) | unique | list -%}
          {{ (['claude-llm'] if _claude_llm.models | unique | sort !=
                ([llm_router_small_model, llm_router_primary_model, llm_router_large_model]
                 + llm_router_d1_zdr_key_groups) | unique | sort else [])
             + (['claude-ocg'] if _claude_ocg.models | sort != _go_groups | sort else [])
             + (['sandbox-agent'] if _sandbox.models | unique | sort != _sandbox_expected | sort
                or (_sandbox.models | intersect(_llm_router_sandbox_agent_excluded_groups) | length > 0)
                else []) }}
        _target_budget_mismatches: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for _alias, _budget in {'claude-llm': 10.0, 'sandbox-agent': 1.0}.items() -%}
          {%- set _key = _llm_router_declared_virtual_keys
                | selectattr('alias', 'equalto', _alias) | first -%}
          {%- if _key.daily_budget | float != _budget -%}
          {%- set ns.rows = ns.rows + [_alias] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set _claude_ocg = _llm_router_declared_virtual_keys
                | selectattr('alias', 'equalto', 'claude-ocg') | first -%}
          {%- if _claude_ocg.daily_budget is defined -%}
          {%- set ns.rows = ns.rows + ['claude-ocg'] -%}
          {%- endif -%}
          {{ ns.rows }}
        _class_model_mismatches: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for _key in _active_virtual_keys
                if _key.alias in _target_aliases and _key.allowed_classes is defined -%}
          {%- for _name in _key.models -%}
          {%- set _class = llm_router_d1_group_class_by_name.get(_name) -%}
          {%- if _class is not none and _class not in _key.allowed_classes -%}
          {%- set ns.rows = ns.rows + [_key.alias ~ ':' ~ _name] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ ns.rows }}
        _strict_tag_mismatches: >-
          {%- set _recorder = (llm_router_role_deployments
                | selectattr('litellm_params.turn_off_message_logging', 'defined') | first).role -%}
          {%- set _specs = [
                {'alias': 'judge', 'tags': ['&zdr', '!free', '!retains', '&local']},
                {'alias': _recorder, 'tags': ['&zdr', '!free', '!retains', '&local']},
                {'alias': 'hermes-private', 'tags': ['&zdr', '!free', '!retains']},
                {'alias': 'donna', 'tags': ['&zdr', '!free', '!retains']},
                {'alias': 'claude-llm', 'tags': ['&zdr', '!free', '!retains']}] -%}
          {%- set ns = namespace(rows=[]) -%}
          {%- for _spec in _specs -%}
          {%- set _key = _llm_router_declared_virtual_keys
                | selectattr('alias', 'equalto', _spec.alias) | first -%}
          {%- if _spec.tags | difference(_key.tags | default([])) | length > 0
                or not (_key.router_settings.enable_tag_filtering | default(false) | bool) -%}
          {%- set ns.rows = ns.rows + [_spec.alias] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.rows }}
        _expected_mcp_permissions:
          claude-code:
            mcp_servers: [context7, grep, docs, splunk, vikunja_ro, nautobot, memory, hindsight, vikunja, zammad]
            agents: [hermes-private, hermes-public]
          codex:
            mcp_servers: [context7, grep, docs, splunk, vikunja_ro, nautobot, memory, hindsight, vikunja, zammad]
            agents: [hermes-private, hermes-public]
            mcp_tool_search_enabled: true
          agy:
            mcp_servers: [context7, grep, docs, splunk, vikunja_ro, nautobot, memory, hindsight, vikunja, zammad]
            agents: [hermes-private, hermes-public]
            mcp_tool_search_enabled: true
          judge: {}
          recorder: {}
          hermes-default:
            mcp_servers: [context7, grep, docs, splunk, vikunja_ro, zammad, slack]
          hermes-splunk-admin:
            mcp_servers: [docs, splunk, zammad, slack]
          hermes-homelab-admin:
            mcp_servers: [docs, vikunja_ro, nautobot, zammad, slack]
          hermes-github-maint:
            mcp_servers: [grep, docs, zammad, slack]
          hermes-orchestrator:
            mcp_servers: [docs, vikunja, zammad, slack]
          hermes-private:
            mcp_servers: [context7, grep, docs, splunk, vikunja_ro, nautobot, memory, vikunja, zammad]
            mcp_access_groups: [hub-public, hub-homelab-read]
          donna:
            mcp_servers: [context7, grep, docs, splunk, vikunja_ro]
          zcode:
            mcp_access_groups: [hub-public]
          opencode:
            mcp_access_groups: [hub-public]
          qwen-code:
            mcp_access_groups: [hub-public]
        _mcp_permission_mismatches: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for _alias in _target_aliases -%}
          {%- set _key = _llm_router_declared_virtual_keys
                | selectattr('alias', 'equalto', _alias) | first -%}
          {%- set _expected = _expected_mcp_permissions.get(_alias, {}) -%}
          {%- if _key.object_permission | default({}) != _expected -%}
          {%- set ns.rows = ns.rows + [_alias] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.rows }}

    - name: Sandbox keys wait for matching generated source fields
      ansible.builtin.assert:
        quiet: true
        that:
          - "'opencode' in llm_router_disabled_virtual_keys"
          - "'qwen-code' in llm_router_disabled_virtual_keys"
          - "'zcode' in llm_router_disabled_virtual_keys"
          - _source_gate_aliases | sort == ['opencode', 'qwen-code', 'sandbox-agent', 'zcode']
        fail_msg: "A sandbox key must remain disabled until its own delivery field exists."
        success_msg: "Sandbox keys stay disabled while their matching delivery fields are absent."
      vars:
        _source_gate_aliases: >-
          {{ _llm_router_declared_virtual_keys
             | selectattr('alias', 'in', ['opencode', 'qwen-code', 'sandbox-agent', 'zcode'])
             | rejectattr('enabled', 'truthy') | map(attribute='alias') | list }}

    - name: Model the peer-provisioned sandbox fields with the existing consumer values
      ansible.builtin.set_fact:
        bao_apps_secrets: >-
          {{ (bao_apps_secrets | default({})) | combine({
            'zcode_llm_router_key': 'fixture-zcode',
            'ZCODE_ROUTER_KEY': 'fixture-zcode',
            'OPENCODE_ROUTER_KEY': 'fixture-opencode',
            'QWEN_CODE_ROUTER_KEY': 'fixture-qwen-code',
            'router_key': 'fixture-sandbox-agent'}) }}
      no_log: true

    - name: Refresh the virtual-key projection after sandbox delivery
      vars:
        llm_router_zdr_unasserted_terminal_rungs: "{{ _active_zdr_unasserted_terminal_rungs }}"
      ansible.builtin.set_fact:
        _active_virtual_keys: "{{ llm_router_virtual_keys }}"

    - name: Matching sandbox fields enable exactly their existing router keys
      ansible.builtin.assert:
        quiet: true
        that:
          - _enabled_delivery_aliases | sort == ['opencode', 'qwen-code', 'sandbox-agent', 'zcode']
          - _delivery_values['opencode'] == bao_apps_secrets['OPENCODE_ROUTER_KEY']
          - _delivery_values['qwen-code'] == bao_apps_secrets['QWEN_CODE_ROUTER_KEY']
          - _delivery_values['zcode'] == bao_apps_secrets['ZCODE_ROUTER_KEY']
          - _delivery_values['sandbox-agent'] == bao_apps_secrets['router_key']
          - _delivery_values['opencode'] != _delivery_values['zcode']
          - _delivery_values['opencode'] != _delivery_values['qwen-code']
          - _delivery_values['qwen-code'] != _delivery_values['zcode']
        fail_msg: "Sandbox delivery must reuse its matching per-consumer key value."
        success_msg: "Each sandbox delivery field activates only its matching consumer key."
      vars:
        _delivery_aliases: [opencode, qwen-code, sandbox-agent, zcode]
        _enabled_delivery_aliases: >-
          {{ _active_virtual_keys | selectattr('alias', 'in', _delivery_aliases)
             | map(attribute='alias') | list }}
        _delivery_values: >-
          {{ dict(_active_virtual_keys | selectattr('alias', 'in', _delivery_aliases)
             | map(attribute='alias') | zip(_active_virtual_keys
             | selectattr('alias', 'in', _delivery_aliases)
             | map(attribute='value'))) }}
