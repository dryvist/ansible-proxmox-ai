---
- name: Supply a local probe plan independent of the previous play's defaults
  ansible.builtin.set_fact:
    llm_router_probe_prechecks:
      - {tier: local-large, model: fixture-studio, route_name: fixture-medium}
      - {tier: vllm, model: fixture-small, route_name: fixture-small}

- name: Exercise admission with successful and failed completions
  ansible.builtin.include_tasks: tasks/serving_precheck_case.yml
  loop:
    - name: both lanes serve
      studio: {status: 200, json: {choices: [{index: 0}]}}
      small: {status: 200, json: {choices: [{index: 0}]}}
      expected: [local-large, vllm]
    - name: Studio unreachable after a prior success
      studio: {status: -1}
      small: {status: 200, json: {choices: [{index: 0}]}}
      expected: [vllm]
    - name: Small completion fails after a prior success
      studio: {status: 200, json: {choices: [{index: 0}]}}
      small: {status: 503}
      expected: [local-large]
    - name: Listing alone admits neither lane
      studio: {skipped: true}
      small: {skipped: true}
      expected: []
    - name: Successful HTTP without choices admits neither lane
      studio: {status: 200, json: {choices: []}}
      small: {status: 200, json: {data: [{id: fixture-small}]}}
      expected: []
    - name: Missing response bodies admit neither lane
      studio: {status: 200}
      small: {status: 200, json: null}
      expected: []
    - name: Invalid choices admit neither lane
      studio: {status: 200, json: {choices: invalid}}
      small: {status: 200, json: {choices: null}}
      expected: []
  loop_control:
    loop_var: probe_case
    label: "{{ probe_case.name }}"

- name: Add another planned Studio model without a completion result
  ansible.builtin.set_fact:
    llm_router_probe_prechecks: >-
      {{ llm_router_probe_prechecks + [
         {'tier': 'local-large', 'model': 'fixture-second-studio', 'route_name': 'fixture-large'}] }}

- name: Admit the small lane while the Studio has an unchecked model
  ansible.builtin.include_tasks: tasks/serving_precheck_case.yml
  vars:
    probe_case:
      studio: {status: 200, json: {choices: [{index: 0}]}}
      small: {status: 200, json: {choices: [{index: 0}]}}
      expected: [vllm]

- name: Plan a second small-tier lane that never answers
  ansible.builtin.set_fact:
    llm_router_probe_prechecks:
      - {tier: local-large, model: fixture-studio, route_name: fixture-medium}
      - {tier: vllm, model: fixture-small, route_name: fixture-small}
      - {tier: vllm, model: fixture-ocr, route_name: fixture-ocr}

- name: Admit the answering small lane while its sibling is absent
  ansible.builtin.include_tasks: tasks/serving_precheck_case.yml
  vars:
    probe_case:
      studio: {status: 200, json: {choices: [{index: 0}]}}
      small: {status: 200, json: {choices: [{index: 0}]}}
      expected: [local-large, vllm]

- name: Confirm only the silent small-tier lane is held out
  ansible.builtin.assert:
    quiet: true
    that:
      - llm_router_vllm_precheck_held_models == ['fixture-ocr']
