---
- name: Supply authorized role callers through the real key projection
  ansible.builtin.set_fact:
    _llm_router_declared_virtual_keys:
      - alias: judge
        models: [judge]
      - alias: recorder
        models: [recorder, recorder-medium]
      - alias: open-webui
        models: [recorder, recorder-medium]

- name: Resolve effective role caller tiers
  ansible.builtin.set_fact:
    _llm_router_m_virtual_keys: "{{ _llm_router_virtual_keys_source }}"

- name: Project DB role creation through the shared tier policy
  ansible.builtin.set_fact:
    _role_seed: "{{ _llm_router_role_seed_policy }}"

- name: DB-seeded tier tags and patience follow each role's consumer key
  ansible.builtin.assert:
    quiet: true
    that:
      - "'tier-2' in _role_seed.judge.params.tags"
      - _role_seed.judge.params.timeout == llm_router_tier_2_timeout_seconds
      - _role_seed.judge.params.stream_timeout == llm_router_tier_2_timeout_seconds
      - _role_seed.judge.params.keepalive_seconds == llm_router_tier_2_keepalive_seconds
      - _role_seed.judge.params.extra_body.priority == llm_router_priority_policy_by_tier['2'].priority
      - not _role_seed.judge.params.extra_body.chat_template_kwargs.enable_thinking
      - "'tier-1' in _role_seed.recorder.params.tags"
      - "'tier-0' in _role_seed.recorder.params.tags"
      - "'tier-1' in _role_seed['recorder-medium'].params.tags"
      - "'tier-0' in _role_seed['recorder-medium'].params.tags"
      - _role_seed.recorder.params.turn_off_message_logging

- name: Model the DB readback with its provenance and a UI-owned parameter
  ansible.builtin.set_fact:
    _llm_router_roles_for_tag_sync:
      json:
        data:
          - model_name: judge
            litellm_params: "{{ _role_seed.judge.params
              | combine({'temperature': 0.25, 'api_key': 'fixture-redacted-key'}) }}"
            model_info:
              id: judge-fixture
              db_model: true
              priority_policy: "{{ _role_seed.judge.provenance }}"
    llm_router_priority_key_tiers: "{{ llm_router_priority_key_tiers | combine({'judge': 0}) }}"

- name: Resolve the transitioned caller tier
  ansible.builtin.set_fact:
    _llm_router_m_virtual_keys: "{{ _llm_router_virtual_keys_source }}"

- name: Reconcile a DB role from tier 2 to tier 0
  ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/prepare-role-tag-updates.yml"

- name: DB role transitions restore execution bounds and preserve custom parameters
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_role_tag_updates | length == 1
      - "'tier-0' in _update.params.tags"
      - "'tier-2' not in _update.params.tags"
      - _update.params.model == _role_seed.judge.params.model
      - _update.params.temperature == 0.25
      - not _update.params.extra_body.chat_template_kwargs.enable_thinking
      - _update.params.extra_body.priority == llm_router_priority_policy_by_tier['0'].priority
      - _update.params.timeout == _role_seed.judge.provenance.settings_before.timeout.value
      - _update.params.keepalive_seconds == 0
      - "'api_key' not in _update.patch"
      - "'model' not in _update.patch"
      - "'temperature' not in _update.patch"
  vars:
    _update: "{{ _llm_router_role_tag_updates | first }}"

- name: Model the transitioned role readback
  ansible.builtin.set_fact:
    _llm_router_roles_for_tag_sync:
      json:
        data:
          - model_name: judge
            litellm_params: "{{ (_llm_router_role_tag_updates | first).params }}"
            model_info: "{{ (_llm_router_role_tag_updates | first).model_info }}"

- name: Recompute the transitioned DB role policy
  ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/prepare-role-tag-updates.yml"

- name: DB role tier transitions are idempotent
  ansible.builtin.assert:
    quiet: true
    that:
      - _llm_router_role_tag_updates == []

- name: Restore the consumer map after the transition fixture
  ansible.builtin.set_fact:
    llm_router_priority_key_tiers: "{{ llm_router_priority_key_tiers | combine({'judge': 2}) }}"

- name: Resolve the restored caller tier
  ansible.builtin.set_fact:
    _llm_router_m_virtual_keys: "{{ _llm_router_virtual_keys_source }}"

- name: Model an unrecognized UI target on a tier 2 role
  ansible.builtin.set_fact:
    _llm_router_roles_for_tag_sync:
      json:
        data:
          - model_name: judge
            litellm_params: "{{ _role_seed.judge.params | combine({'model': 'fixture/unknown-target'}) }}"
            model_info:
              id: judge-fixture
              db_model: true
              priority_policy: "{{ _role_seed.judge.provenance }}"

- name: Reconcile the UI retarget through the same role policy
  ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/prepare-role-tag-updates.yml"

- name: A tier 2 UI retarget never acquires local or tier 2 deployment permission
  ansible.builtin.assert:
    quiet: true
    that:
      - "'tier-2' not in _update.params.tags"
      - "'local' not in _update.params.tags"
      - "'retains' in _update.params.tags"
      - _update.params.model == 'fixture/unknown-target'
      - _update.params.keepalive_seconds == 0
      - "'model' not in _update.patch"
  vars:
    _update: "{{ _llm_router_role_tag_updates | first }}"

- name: Verify explicit caller overrides and shared role tier admission
  ansible.builtin.import_tasks: priority_role_callers.yml
