---
- name: Supply completion results without contacting a serving endpoint
  ansible.builtin.set_fact:
    _llm_router_completion_precheck_responses:
      results:
        - "{{ probe_case.studio | combine({'item': llm_router_probe_prechecks[0]}) }}"
        - "{{ probe_case.small | combine({'item': llm_router_probe_prechecks[1]}) }}"

- name: Apply the role's real local admission judge
  ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-serving-prechecks.yml"

- name: Confirm each lane follows its own completion result
  ansible.builtin.assert:
    quiet: true
    that:
      - llm_router_studio_precheck_passed == ('local-large' in probe_case.expected)
      - llm_router_vllm_precheck_passed == ('vllm' in probe_case.expected)
      - _llm_router_serving_precheck_passed_tiers | sort == probe_case.expected | sort
