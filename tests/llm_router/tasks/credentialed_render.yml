---
# Shared contract helper for the FULLY CREDENTIALED render: fixture setup,
# the role's own render-time asserts, and a parsed `_config` / `_environment`.
#
# Import with `ansible.builtin.import_tasks` after the play's own vars. The
# play owns host values and timeouts; the shared setup helper owns the test
# render inputs. Tests that need a rendered config without the converge-time
# DNS and model-list probes can import the setup helper directly.
- name: Load the shared credentialed-render inputs
  ansible.builtin.import_tasks: credentialed_render_setup.yml

- name: Run the role's render-time assertions
  ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/assert.yml"

- name: Render and parse the real proxy config and environment
  ansible.builtin.set_fact:
    _config: >-
      {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}
    _environment: >-
      {{ lookup('template', _role_dir ~ '/templates/litellm.env.j2') }}
