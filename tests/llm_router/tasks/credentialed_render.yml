---
# Shared setup for every contract test that asserts on the FULLY CREDENTIALED
# render: defaults, registry, budget store, one credential per API provider,
# the role's own render-time asserts, and a parsed `_config` / `_environment`.
#
# Import with `ansible.builtin.import_tasks` after the play's own vars. The
# play still owns its fixture vars (tofu_data, subdomain, master key, bearer,
# timeouts); this file owns only the steps that were being repeated verbatim
# across the credentialed tests, so a change to how a credentialed render is
# produced happens once.

- name: Load the role defaults as they ship
  ansible.builtin.include_vars:
    dir: "{{ _role_dir }}/defaults/main"

- name: Configure the shared budget store
  ansible.builtin.set_fact:
    llm_router_redis_host: redis.example.test
    llm_router_redis_password: test-only-not-a-real-password

# assert-endpoint-dns.yml (part of the render-time assertions below) does a
# real resolver lookup on every advertised backend host. The fixture subdomain is
# the RFC 2606 reserved pve.example.test, which by design never resolves —
# point the base URLs at localhost so the guard checks its own logic against a
# host every runner actually resolves, rather than testing network
# reachability this suite never intended to exercise.
- name: Point advertised backend URLs at a host this runner can resolve
  ansible.builtin.set_fact:
    llm_router_llm_fast_base_url: "http://localhost:10434/v1"
    llm_router_llm_light_base_url: "http://localhost:10434/v1"
    llm_router_llm_large_base_url: "https://localhost:11434/v1"
    llm_router_llm_vllm_base_url: "http://localhost:10434/v1"

- name: Load the model registry through the role
  ansible.builtin.include_role:
    name: llm_router
    tasks_from: registry.yml

- name: Seed exactly one credential per API provider
  ansible.builtin.set_fact:
    bao_local_llm_secrets:
      OPENROUTER_API_KEY: test-openrouter-provider-key
      OPENROUTER_HERMES_KEY: test-openrouter-hermes-provider-key
      GEMINI_API_KEY: test-gemini-provider-key
      DASHSCOPE_API_KEY: test-dashscope-provider-key

# The credential-derived defaults were evaluated before the set_fact above;
# reload this one defaults file exactly as a real play would evaluate it after
# Phase 0 publishes bao_local_llm_secrets.
- name: Re-evaluate the Hermes cloud projections with provider credentials
  ansible.builtin.include_vars:
    file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

- name: Run the role's render-time assertions
  ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/assert.yml"

- name: Render and parse the real proxy config and environment
  ansible.builtin.set_fact:
    _config: >-
      {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}
    _environment: >-
      {{ lookup('template', _role_dir ~ '/templates/litellm.env.j2') }}
