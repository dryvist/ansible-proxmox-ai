---
# The sensitivity role targets one capability member, not a group: its seed
# params and model info resolve from that member, and it seeds only while the
# member's group is live.
- name: A member-targeted role resolves its seed params and model info and seeds while its group is live
  ansible.builtin.assert:
    quiet: true
    that:
      - _member_role.model == _member.entry.client_model_id
      - _llm_router_role_params[_member_role.model] == _member.params
      - _llm_router_role_model_info[_member_role.model].mode == 'chat'
      - _llm_router_role_model_info[_member_role.model].max_input_tokens | int > 0
      - _member_role.role in (_llm_router_roles_to_create | map(attribute='role') | list)
    fail_msg: "role={{ _member_role }}, member={{ _member.entry.client_model_id | default('none') }}"
  vars:
    _member_role: "{{ llm_router_role_deployments | selectattr('role', 'equalto', 'sensitivity') | first }}"
    _member: >-
      {{ _llm_router_capability_member_params
         | selectattr('entry.client_model_id', 'equalto', llm_router_hermes_local_4080_id) | first }}
    _llm_router_live_models: ["{{ _member.entry.route_group }}"]

- name: A member-targeted role is not seeded while its group is not live
  ansible.builtin.assert:
    quiet: true
    that:
      - "'sensitivity' not in (_llm_router_roles_to_create | map(attribute='role') | list)"
  vars:
    _llm_router_live_models: []
