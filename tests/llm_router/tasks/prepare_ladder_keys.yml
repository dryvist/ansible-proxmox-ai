---
- name: Load role defaults and catalog-derived registry
  ansible.builtin.include_vars:
    dir: "{{ _role_dir }}/defaults/main"

- name: Model a successful 4080 reachability precheck without making a request
  ansible.builtin.set_fact:
    llm_router_llm_vllm_enabled: true
    llm_router_vllm_precheck_passed: true

- name: Resolve the registry through the role
  ansible.builtin.include_role:
    name: llm_router
    tasks_from: registry.yml

- name: Model a node that holds a ChatGPT login
  ansible.builtin.set_fact:
    llm_router_chatgpt_auth_file_present: true

- name: Materialize the ZDR terminal-rung projection once
  ansible.builtin.set_fact:
    _active_zdr_unasserted_terminal_rungs: "{{ llm_router_zdr_unasserted_terminal_rungs }}"

- name: Materialize the active virtual-key projection once
  vars:
    llm_router_zdr_unasserted_terminal_rungs: "{{ _active_zdr_unasserted_terminal_rungs }}"
  ansible.builtin.set_fact:
    _active_virtual_keys: "{{ llm_router_virtual_keys }}"

- name: Render the credentialed router contract
  vars:
    llm_router_virtual_keys: "{{ _active_virtual_keys }}"
    llm_router_zdr_unasserted_terminal_rungs: "{{ _active_zdr_unasserted_terminal_rungs }}"
  ansible.builtin.set_fact:
    _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"
    _target_aliases: >-
      {{ ['claude-code', 'codex', 'agy', 'judge', 'recorder', 'hermes-private', 'donna',
          'zcode', 'opencode'] + (_llm_router_hermes_profile_names
          | map('regex_replace', '^', 'hermes-') | list) }}
    _enabled_target_aliases: >-
      {{ ['claude-code', 'codex'] + (_llm_router_hermes_profile_names
          | map('regex_replace', '^', 'hermes-') | list) }}
