---
# One disabled-vLLM state for test_small_capability_fallback.yml (_vllm_on).
- name: Set the vllm rung state
  ansible.builtin.set_fact:
    llm_router_llm_vllm_enabled: "{{ _vllm_on }}"
    llm_router_vllm_precheck_passed: "{{ _vllm_on }}"
    llm_router_llm_vllm_base_url: "http://localhost:10434/v1"

- name: Load the registry through the role task
  ansible.builtin.include_role:
    name: llm_router
    tasks_from: registry.yml

- name: Materialize the full key scope for this capability state
  ansible.builtin.set_fact:
    _small_case_key_scope_all: "{{ _llm_router_key_scope_all }}"
  no_log: true

- name: Refresh router projections with this capability's key scope
  vars:
    _llm_router_key_scope_all: "{{ _small_case_key_scope_all }}"
  ansible.builtin.include_role:
    name: llm_router
    tasks_from: assertion-inputs.yml

- name: Materialize the router projections for this capability state
  vars:
    _llm_router_key_scope_all: "{{ _small_case_key_scope_all }}"
  ansible.builtin.set_fact:
    _small_case_virtual_keys: "{{ llm_router_virtual_keys }}"
    _small_case_role_deployments: "{{ llm_router_role_deployments }}"
    _small_case_model_group_aliases: "{{ llm_router_model_group_aliases }}"
    _small_case_capability_names: "{{ llm_router_capability_names }}"
    _small_case_entry_point_names: "{{ llm_router_entry_point_names }}"
    _small_case_zdr_entry_point_names: "{{ llm_router_zdr_entry_point_names }}"
  no_log: true

- name: Render the router configuration
  ansible.builtin.set_fact:
    _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

- name: Capture rendered names and key projections
  ansible.builtin.set_fact:
    _rendered_names: >-
      {{ _config.model_list | map(attribute='model_name') | unique | list }}
    _small_group: >-
      {{ llm_router_small_capability_name }}
    _small_members: >-
      {{ _config.model_list
         | selectattr('model_name', 'equalto', llm_router_small_capability_name) | list }}
    _key_grants: >-
      {{ _small_case_virtual_keys | rejectattr('alias', 'equalto', 'hindsight')
         | map(attribute='models') | flatten | unique | list }}
    _hindsight_models: "{{ (_small_case_virtual_keys | selectattr('alias', 'equalto', 'hindsight') | first).models }}"
    _hindsight_allowed_classes: >-
      {{ (_small_case_virtual_keys | selectattr('alias', 'equalto', 'hindsight') | first).allowed_classes }}
    _hindsight_tags: >-
      {{ (_small_case_virtual_keys | selectattr('alias', 'equalto', 'hindsight') | first).tags }}
    _hindsight_models_authoritative: >-
      {{ (_small_case_virtual_keys
          | selectattr('alias', 'equalto', 'hindsight') | first).models_authoritative }}
    _small_capability_local_key_names: >-
      {{ ['litellm-local-workstation',
          (_small_case_role_deployments
           | selectattr('litellm_params.turn_off_message_logging', 'defined')
           | first).role] }}
    _small_role_models: "{{ _small_case_role_deployments | map(attribute='model') | list }}"

- name: Capture the affected local consumer keys
  ansible.builtin.set_fact:
    _small_capability_local_keys: >-
      {{ _small_case_virtual_keys
         | selectattr('alias', 'in', _small_capability_local_key_names) | list }}

- name: Name the capability groups this converge does not render
  ansible.builtin.set_fact:
    _unrendered_capabilities: "{{ _small_case_capability_names | difference(_rendered_names) }}"

- name: Assert the small capability selector follows the rung
  ansible.builtin.assert:
    quiet: true
    that:
      - not (_vllm_on | bool)
      - llm_router_vllm_models | length == 0
      - _small_group in _rendered_names
      - llm_router_small_model == _small_group
      - llm_router_small_model in _rendered_names
      - _small_group not in _small_case_model_group_aliases
      - _small_case_model_group_aliases | length == llm_router_alias_pairs | length
      - _small_case_model_group_aliases.fast == _small_group
      - _small_case_model_group_aliases.cheap == _small_group
      - _small_case_model_group_aliases['goal-judge'] == _small_group
      - _small_members | length == 1
      - _small_members | map(attribute='litellm_params.order') | map('int') | list == [3]
      - _small_members | map(attribute='litellm_params.api_base') | list == llm_router_cpu_9b_backend_urls
      - _small_group in _small_case_entry_point_names
      - _small_group in _small_case_zdr_entry_point_names
      - _small_role_models | length > 0
      - _small_role_models | difference([llm_router_small_model]) | length == 0
    fail_msg: >-
      vllm={{ _vllm_on }}: small members={{ _small_members }}, aliases={{ _small_case_model_group_aliases }}.

- name: Assert aliases and key grants name rendered capabilities
  ansible.builtin.assert:
    quiet: true
    that:
      - _small_case_model_group_aliases.values() | list | difference(_rendered_names) | length == 0
      - _bad_key_grants | length == 0
    fail_msg: >-
      vllm={{ _vllm_on }}: unrendered {{ _unrendered_capabilities }}; alias
      targets {{ _small_case_model_group_aliases.values() | list | unique }};
      key grants naming them {{ _bad_key_grants }}.
  vars:
    _small_alias_key_grant_exception: >-
      {{ [llm_router_small_capability_name]
         if (llm_router_small_capability_name not in _rendered_names
             and _small_case_model_group_aliases.get(llm_router_small_capability_name)
                 == llm_router_primary_large_model
             and llm_router_primary_large_model in _rendered_names
             and llm_router_primary_large_model in _small_case_capability_names)
         else [] }}
    _bad_key_grants: >-
      {{ (_key_grants | intersect(_unrendered_capabilities))
         | difference(_small_alias_key_grant_exception) }}

- name: Assert the ZDR-isolated hindsight key names the stable small capability
  ansible.builtin.assert:
    quiet: true
    that:
      - _hindsight_models == [_small_group]
      - _hindsight_allowed_classes == ['local']
      - _hindsight_tags == ['&zdr', '!free', '!retains']
      - _hindsight_models_authoritative | bool
    fail_msg: >-
      vllm={{ _vllm_on }}: hindsight={{ _hindsight_models }},
      classes={{ _hindsight_allowed_classes }}, tags={{ _hindsight_tags }}.

- name: Assert local consumer keys advertise the stable small capability name
  ansible.builtin.assert:
    quiet: true
    that:
      - _small_capability_local_keys | length == _small_capability_local_key_names | length
      - _small_capability_local_keys | map(attribute='allowed_classes') | unique | list == [['local']]
      - _small_capability_local_keys | selectattr('models', 'contains', _small_group) | list | length
        == _small_capability_local_key_names | length
    fail_msg: >-
      local key scopes={{ _small_capability_local_keys | map(attribute='models') | list }};
      expected {{ _small_group }} on every local key.

# The judge key reaches the ZDR ladder, so it is not local-only, but it still
# names the stable small capability first.
- name: Assert the judge key advertises the stable small capability name
  ansible.builtin.assert:
    quiet: true
    that:
      - _small_group in (_small_case_virtual_keys | selectattr('alias', 'equalto', 'judge') | first).models
    fail_msg: "judge key scope lacks {{ _small_group }}."

- name: Run the role's required-brain assert
  ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-safe-models.yml"

- name: Assert a key scoped only to the small selector resolves to a served model
  ansible.builtin.assert:
    quiet: true
    that:
      - _small_only_keys | length > 0
      - >-
        _small_only_keys | map(attribute='models') | flatten | unique
        | difference(_rendered_names + (_small_case_model_group_aliases.keys() | list))
        | length == 0
    fail_msg: >-
      vllm={{ _vllm_on }}: small-only keys {{ _small_only_keys | map(attribute='alias') | list }}
      name {{ _small_only_keys | map(attribute='models') | flatten | unique }}; rendered {{ _rendered_names }}.
  vars:
    _small_only_keys: >-
      {{ _small_case_virtual_keys
         | selectattr('models', 'equalto', [llm_router_small_model]) | list }}
