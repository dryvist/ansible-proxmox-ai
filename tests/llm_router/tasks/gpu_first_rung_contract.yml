---
# Preserve the capability equivalents of the former GPU-first role contracts.
- name: Render the active capability configuration
  ansible.builtin.set_fact:
    _capability_config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

- name: Review aliases follow medium while task role names stay out of aliases
  ansible.builtin.assert:
    quiet: true
    that:
      - llm_router_model_group_aliases[llm_router_review_aliases.oss]
        == llm_router_primary_model
      - llm_router_model_group_aliases[llm_router_review_aliases.private]
        == llm_router_primary_model
      - llm_router_model_group_aliases[llm_router_review_aliases.local]
        == llm_router_primary_model
      - llm_router_model_group_aliases['subagent'] == llm_router_primary_model
      - hermes_goal_judge_model not in llm_router_model_group_aliases
      - _recorder.role not in llm_router_model_group_aliases
      # The retired large target now resolves to the primary group.
      - llm_router_model_group_aliases[llm_router_review_aliases.private]
        == llm_router_large_model
    fail_msg: "review and task alias targets={{ llm_router_model_group_aliases }}"
  vars:
    _recorder: >-
      {{ llm_router_role_deployments
         | selectattr('litellm_params.turn_off_message_logging', 'defined') | first }}

- name: Review aliases keep their capability-specific local and cloud tails
  ansible.builtin.assert:
    quiet: true
    that:
      - _fb[llm_router_review_aliases.oss] == llm_router_review_oss_chain
      - _fb[llm_router_review_aliases.private] == llm_router_review_private_chain
      - _fb[llm_router_review_aliases.local] == llm_router_review_local_chain
      - llm_router_external_free_rungs
        | intersect(_fb[llm_router_review_aliases.private]) | length == 0
      - (llm_router_external_paid_rungs + llm_router_external_subscription_rungs)
        | intersect(_fb[llm_router_review_aliases.private]) | length == 0
      - llm_router_ci_luna_groups
        | difference(_fb[llm_router_review_aliases.private]) | length == 0
      - _fb[llm_router_primary_model]
        | difference(llm_router_zdr_asserted_group_names) | length == 0
    fail_msg: "fallbacks by name={{ _fb }}"
  vars:
    _fb: >-
      {{ dict(_capability_config.router_settings.fallbacks | map('dict2items') | flatten
              | map(attribute='key') | zip(_capability_config.router_settings.fallbacks
                | map('dict2items') | flatten | map(attribute='value'))) }}

- name: Parameterized database roles keep their per-role request settings
  ansible.builtin.assert:
    quiet: true
    that:
      - _roles['judge'].model == llm_router_small_capability_name
      - _roles['judge'].fallbacks == llm_router_d1_zdr_ladder_groups
      - _roles['judge'].litellm_params.extra_body.chat_template_kwargs.enable_thinking == false
      - _recorder.model == llm_router_small_capability_name
      - _recorder.fallbacks == []
      - _recorder.litellm_params.turn_off_message_logging == true
    fail_msg: "parameterized roles={{ _roles }}"
  vars:
    _roles: "{{ dict(llm_router_role_deployments | map(attribute='role') | zip(llm_router_role_deployments)) }}"
    _recorder: >-
      {{ llm_router_role_deployments
         | selectattr('litellm_params.turn_off_message_logging', 'defined') | first }}

- name: GPU routing targets resolve to rendered capability groups
  ansible.builtin.assert:
    quiet: true
    that:
      - llm_router_hermes_gpu_fast_target == llm_router_small_model
      - llm_router_hermes_gpu_medium_target == llm_router_primary_model
      - _gpu_targets | difference(_rendered_capabilities) | length == 0
    fail_msg: "GPU targets={{ _gpu_targets }} rendered={{ _rendered_capabilities }}"
  vars:
    _gpu_targets: >-
      {{ [llm_router_hermes_gpu_fast_target, llm_router_hermes_gpu_medium_target] }}
    _rendered_capabilities: >-
      {{ _capability_config.model_list | map(attribute='model_name') | unique | list
         | intersect([llm_router_small_model, llm_router_primary_model]) }}

- name: CI keys can reach the medium capability and only the private key can reach CI Luna
  ansible.builtin.assert:
    quiet: true
    that:
      - llm_router_primary_model in _keys['github-actions']
      - llm_router_primary_model in _keys['github-actions-ci-fix']
      - llm_router_primary_model in _keys['github-actions-pr-review']
      - llm_router_primary_model in _keys['github-actions-oss']
      - llm_router_ci_luna_groups | difference(_keys['github-actions']) | length == 0
      - llm_router_ci_luna_groups | intersect(_keys['github-actions-oss']) | length == 0
    fail_msg: >-
      CI key scopes={{ _keys | dict2items | selectattr('key', 'match', 'github-actions') | list }}
  vars:
    _keys: >-
      {{ dict(llm_router_virtual_keys | map(attribute='alias')
              | zip(llm_router_virtual_keys | map(attribute='models'))) }}
