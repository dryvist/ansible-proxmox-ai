---
# Shared setup for ../test_registry_render_parity.yml — loads the role's real
# defaults and registry exactly the way the converge does, so the guard under
# test sees the shipping projections rather than a hand-written fixture.

- name: Load the role defaults as they ship
  ansible.builtin.add_host:
    name: llm-gpu-fixture
    groups: llm_gpu_group
    ansible_connection: local

- name: Load the role defaults as they ship
  ansible.builtin.include_vars:
    dir: "{{ _role_dir }}/defaults/main"

- name: Load the fabric model registry the way the converge does
  ansible.builtin.include_role:
    name: llm_router
    tasks_from: registry.yml

- name: Load the serving group's canonical inputs for its inventory fixture
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../inventory/group_vars/llm_vllm_group.yml"
    name: _vllm_fixture_vars

- name: Add an inventory-backed serving fixture when the play has no serving member
  ansible.builtin.add_host:
    name: serving-fixture
    groups: llm_vllm_group
    ansible_connection: local
    llama_cpp_prefill_tokens_per_second: "{{ _vllm_fixture_vars.llama_cpp_prefill_tokens_per_second }}"
  when: groups['llm_vllm_group'] | default([]) | length == 0
