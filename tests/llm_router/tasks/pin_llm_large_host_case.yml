---
- name: Exercise one serving-host pin fixture
  block:
    - name: Create a temporary hosts fixture
      ansible.builtin.tempfile:
        state: file
        suffix: .hosts
      register: _pin_hosts_fixture

    - name: Seed the hosts fixture
      ansible.builtin.copy:
        dest: "{{ _pin_hosts_fixture.path }}"
        content: "{{ pin_case.before }}"
        mode: "0644"

    - name: Run the serving-host pin tasks against the fixture
      ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/pin-llm-large-host.yml"
      vars:
        llm_router_hosts_file: "{{ _pin_hosts_fixture.path }}"

    - name: Read the reconciled hosts fixture
      ansible.builtin.set_fact:
        _pin_hosts_lines: "{{ lookup('file', _pin_hosts_fixture.path).splitlines() }}"

    - name: Collect the uncommented lines that map the serving name
      ansible.builtin.set_fact:
        _pin_fqdn_lines: >-
          {{ _pin_hosts_lines | reject('match', '\s*#') | select('search', _pin_fqdn_pattern) | list }}

    - name: Run the serving-host pin tasks again on the reconciled fixture
      ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/pin-llm-large-host.yml"
      vars:
        llm_router_hosts_file: "{{ _pin_hosts_fixture.path }}"

    - name: Verify one current serving-host mapping and the preserved host line
      ansible.builtin.assert:
        quiet: true
        that:
          - _pin_fqdn_lines | length == 1
          - _pin_fqdn_lines[0].split()[0] == '192.0.2.20'
          - pin_case.preserved_line in _pin_hosts_lines
          - not (pin_case.unchanged | default(false)) or _pin_hosts_lines == pin_case.before.splitlines()
          # A second run on a reconciled file changes nothing, so it never restarts LiteLLM.
          - lookup('file', _pin_hosts_fixture.path).splitlines() == _pin_hosts_lines
        fail_msg: >-
          The hosts fixture does not contain one current serving-host mapping
          with the unrelated line preserved, or a second run changed it.
  always:
    - name: Remove the temporary hosts fixture
      ansible.builtin.file:
        path: "{{ _pin_hosts_fixture.path }}"
        state: absent
      when: _pin_hosts_fixture.path is defined
