commit 8a61bef9625098011a91d350ca07e6f8f1191c7f
Author: nix-agent-sandbox <agent@users.noreply.github.com>
Date:   Mon Nov 9 01:30:12 2026 +0000

    fix(llm_router): render the small lane's endpoint as one lower-case api_base
    
    Lower-case llm_router_llm_vllm_base_url at its single derivation, so the
    4080 deployment family renders one canonical api_base string whatever
    case the published inventory label carries; the router keys deployments
    by that string, so a case variant of the same endpoint renders as a
    second deployment.
    
    The Pro6000 small-capability render test now derives the URL from a
    mixed-case fixture member (the base-URL override is gone) and asserts
    the lower-case form and that the rendered small group carries exactly
    that one api_base.

diff --git a/roles/llm_router/defaults/main/10-network.yml b/roles/llm_router/defaults/main/10-network.yml
index 85358ac..0534828 100644
--- a/roles/llm_router/defaults/main/10-network.yml
+++ b/roles/llm_router/defaults/main/10-network.yml
@@ -97,9 +97,16 @@ llm_router_vllm_medium_enabled: true
 # request to the apex name returned 200. An entry that is advertised while its
 # upstream cannot be resolved looks identical to a working one from the model
 # list alone.
+# Lower-case, deliberately. DNS matches a name case-insensitively, but the
+# router keys a deployment by its api_base STRING, so the same endpoint
+# rendered under two cases is two deployments — the exact duplicate observed
+# on the live router for this lane. The published guest label carries mixed
+# case, so the URL is normalized at its single derivation and every render
+# emits the one canonical lower-case form (the same case-insensitive
+# treatment pin-llm-large-host.yml applies to the serving apex pin).
 llm_router_llm_vllm_base_url: >-
-  {{ 'http://' ~ groups['llm_vllm_group'][0] ~ '.' ~ llm_router_apex_domain
-     ~ ':' ~ (llm_router_light_port | string) ~ '/v1'
+  {{ ('http://' ~ groups['llm_vllm_group'][0] ~ '.' ~ llm_router_apex_domain
+      ~ ':' ~ (llm_router_light_port | string) ~ '/v1') | lower
      if (groups['llm_vllm_group'] | default([]) | length > 0) else '' }}
 llm_router_llm_vllm_accelerator: "{{ llm_router_llm_fast_accelerator }}"
 # shortcut: mirrors laya_systemone_port's role default; move both to a tofu service_ports constant when one exists.
diff --git a/tests/llm_router/tasks/pro6000_small_fallback_case.yml b/tests/llm_router/tasks/pro6000_small_fallback_case.yml
index fa47d90..622b7e6 100644
--- a/tests/llm_router/tasks/pro6000_small_fallback_case.yml
+++ b/tests/llm_router/tasks/pro6000_small_fallback_case.yml
@@ -9,6 +9,12 @@
       - _small_4080 | map(attribute='litellm_params.order') | map('int') | unique | list == [1]
       - _small_6000 | length > 0
       - _small_6000 | map(attribute='litellm_params.order') | map('int') | unique | list == [2]
+      # One endpoint, rendered in its single lower-case form: a case variant
+      # of the same host is a second deployment to the router, not an alias.
+      - _small_4080 | map(attribute='litellm_params.api_base') | unique | list
+        == [llm_router_llm_vllm_base_url]
+      - llm_router_llm_vllm_base_url not match '[A-Z]'
+      - llm_router_llm_vllm_base_url == 'http://llm-vllm-fixture-4080.example.test:10434/v1'
       - llm_router_studio_small_fallback_route in llm_router_direct_route_aliases
       - _small_fallback_map[llm_router_small_capability_name] == [llm_router_studio_small_fallback_route]
       - _small_fallback_map[llm_router_studio_small_fallback_route] == []
