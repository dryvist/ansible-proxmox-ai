---
# Each registry entry supplies ZDR, including retaining free presets.
- name: Each egress deployment's zdr flag matches its registry declaration
  ansible.builtin.assert:
    quiet: true
    that:
      - _zdr_missing | length == 0
      - _zdr_mismatches | length == 0
    fail_msg: >-
      Rendered zdr is missing for {{ _zdr_missing }} or does not match the registry
      for {{ _zdr_mismatches }}.
      zero_data_retention must be explicit: a missing value and false both
      render zdr: false.
    success_msg: >-
      all {{ _zdr_checked | length }} guarded egress deployment(s) render
      the zdr flag their registry entry declares
  vars:
    # Registry entry keyed by the name the template renders as model_name,
    # so the comparison needs no second spelling of either side.
    _zdr_expected: >-
      {%- set ns = namespace(d={}) -%}
      {%- for m in llm_router_registry_enabled
            | selectattr('provider', 'equalto', 'openrouter') -%}
      {%- set ns.d = ns.d | combine({
            (m.route_group | default(m.client_model_id)):
              (m.zero_data_retention | default(false) | bool)}) -%}
      {%- endfor -%}
      {{ ns.d }}
    # Only rendered provider-guard deployments; wildcards covered above.
    _zdr_checked: >-
      {{ _config.model_list
         | selectattr('litellm_params.extra_body.provider.zdr', 'defined')
         | rejectattr('model_name', 'search', '\*')
         | selectattr('model_name', 'in', _zdr_expected.keys() | list)
         | list }}
    _zdr_missing: >-
      {{ (_zdr_expected.keys() | list)
         | difference(_zdr_checked | map(attribute='model_name') | list) }}
    _zdr_mismatches: >-
      {%- set ns = namespace(bad=[]) -%}
      {%- for d in _zdr_checked -%}
      {%- if d.litellm_params.extra_body.provider.zdr
             | bool != _zdr_expected[d.model_name] -%}
      {%- set ns.bad = ns.bad + [d.model_name ~ ' (rendered ' ~
            d.litellm_params.extra_body.provider.zdr ~ ', registry says ' ~
            _zdr_expected[d.model_name] ~ ')'] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.bad }}

- name: Every enabled OpenRouter role param carries the registry ZDR flag
  ansible.builtin.assert:
    quiet: true
    that:
      - _role_zdr_mismatches | length == 0
    fail_msg: >-
      Role params are missing or misstate zero_data_retention for
      {{ _role_zdr_mismatches }}.
    success_msg: >-
      all {{ _role_zdr_checked }} enabled OpenRouter role params carry the
      ZDR flag declared by their registry entries
  vars:
    _role_zdr_checked: >-
      {{ llm_router_registry_enabled
         | selectattr('tier', 'equalto', 'openrouter') | list | length }}
    _role_zdr_mismatches: >-
      {%- set ns = namespace(bad=[]) -%}
      {%- for m in llm_router_registry_enabled
            | selectattr('tier', 'equalto', 'openrouter') -%}
      {%- set _expected = m.zero_data_retention | default(false) | bool -%}
      {%- set _actual = _llm_router_role_params.get(m.client_model_id, {})
            .get('extra_body', {})
            .get('provider', {})
            .get('zdr', none) -%}
      {%- if _actual is none or (_actual | bool) != _expected -%}
      {%- set ns.bad = ns.bad + [m.client_model_id] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.bad }}
