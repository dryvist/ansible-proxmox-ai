---
- name: Render the pinned MCP servers with least-privilege tools
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    _app_agent_read_allowlist_ids: [64]
    # The shape load_hermes_profiles.yml publishes for an enabled locked profile.
    hermes_agent_profiles:
      - {name: youtrack-clerk, locked: true, mcp: [youtrack_write]}
      - name: vikunja-clerk
        locked: true
        mcp: [vikunja_clerk]
        feature_gate: llm_router_hermes_vikunja_clerk_key_enabled
      - {name: semaphore-converge, locked: true, mcp: [semaphore_write]}
    # Roster entries hold the read/write and Zammad tiers; locked profiles hold Vikunja clerk and YouTrack.
    ai_agents:
      vikunja-read: {router_key_class: standard}
      vikunja-write: {router_key_class: standard, trust_tier: trusted}
      zammad-write: {router_key_class: standard, trust_tier: trusted}
    _tofu_fixture:
      constants:
        service_ports:
          llm_router_api: 4000
          next_ai_drawio_mcp: 3071
      hermes_agents:
        hermes-agent:
          api_url: "http://hermes.example.invalid/v1"
          model_name: hermes-agent
    openbao_secrets_by_domain:
      app-agent-vikunja-read:
        VIKUNJA_AGENT_READ_TOKEN: fixture-vikunja-read-token
        VIKUNJA_AGENT_READ_ALLOWLIST: "{{ _app_agent_read_allowlist_ids | to_json }}"
      app-agent-vikunja-write:
        VIKUNJA_AGENT_WRITE_TOKEN: fixture-vikunja-write-token
      app-agent-vikunja-clerk:
        VIKUNJA_AGENT_CLERK_TOKEN: fixture-vikunja-clerk-token
      app-agent-zammad-write:
        ZAMMAD_AGENT_WRITE_TOKEN: fixture-zammad-write-token
      app-agent-youtrack-write:
        YOUTRACK_AGENT_WRITE_TOKEN: fixture-youtrack-write-token
      app-agent-semaphore-write:
        SEMAPHORE_AGENT_WRITE_TOKEN: fixture-semaphore-write-token
  tasks:
    - name: Add the fixture guest selected by the production inventory tag
      ansible.builtin.add_host:
        name: next-ai-drawio-fixture
        groups: next_ai_drawio_group
        container_ip: 192.0.2.55

    - name: Set isolated OpenBao fixtures for the server and app keys
      ansible.builtin.set_fact:
        tofu_data: "{{ _tofu_fixture }}"
        llm_router_mcp_next_ai_drawio_port_ready: true
        bao_apps_secrets:
          next_ai_drawio_llm_router_key: fixture-next-ai-drawio-key
          hermes_youtrack_clerk_api_server_key: fixture-clerk-api-server-key
          hermes_youtrack_clerk_llm_router_key: fixture-clerk-router-key
          hermes_vikunja_clerk_llm_router_key: fixture-vikunja-clerk-router-key
          hermes_semaphore_converge_llm_router_key: fixture-converge-router-key
        bao_local_llm_secrets:
          ZAMMAD_MCP_URL: test-zammad-url
          ZAMMAD_MCP_TOKEN: test-zammad-token
          VIKUNJA_MCP_URL: fixture-vikunja-url
          VIKUNJA_MCP_TOKEN_RW: fixture-vikunja-interactive-token
          SLACK_BOT_TOKEN: test-slack-token
      no_log: true

    - name: Load the router defaults
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Reuse the pinned Vikunja MCP package version
      ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/load-app-agent-package-pin.yml"

    - name: Render the locked profile deployment
      ansible.builtin.set_fact:
        _clerk_deployments: >-
          {{ lookup('ansible.builtin.template', _role_dir ~ '/templates/model-list-hermes-agents.yaml.j2')
             | from_yaml }}
      no_log: true

    - name: Publish the clerk through its multiplexed profile route
      ansible.builtin.assert:
        quiet: true
        that:
          - _clerk_deployment.model_name == 'agent-youtrack-clerk'
          - _clerk_deployment.litellm_params.model == 'hosted_vllm/youtrack-clerk'
          - _clerk_deployment.litellm_params.api_base == 'http://hermes.example.invalid/p/youtrack-clerk/v1'
          - _clerk_deployment.litellm_params.api_key == 'os.environ/HERMES_AGENT_BEARER_TOKEN_YOUTRACK_CLERK'
          - _clerk_deployment.litellm_params.num_retries == 0
          - _clerk_deployment.model_info.disable_background_health_check == true
          - >-
            ['local', 'zdr', 'sensitivity:public', 'sensitivity:sensitive', 'sensitivity:pii']
            | difference(_clerk_deployment.litellm_params.tags) | length == 0
        fail_msg: The clerk deployment must use its own profile prefix, bearer, and local-sensitive tags.
      vars:
        _clerk_deployment: >-
          {{ _clerk_deployments | selectattr('model_name', 'equalto', 'agent-youtrack-clerk') | first }}
      no_log: true

    - name: Render only the MCP server block from the production template
      ansible.builtin.set_fact:
        _mcp_servers: >-
          {{ lookup('ansible.builtin.template', _role_dir ~ '/templates/mcp-servers.yaml.j2')
             | from_yaml }}
        _environment_template: "{{ lookup('ansible.builtin.file', _role_dir ~ '/templates/litellm.env.j2') }}"
        _config_template: "{{ lookup('ansible.builtin.file', _role_dir ~ '/templates/config.yaml.j2') }}"
        _main_tasks: "{{ lookup('ansible.builtin.file', _role_dir ~ '/tasks/main.yml') | from_yaml }}"
        _resolve_tasks: "{{ lookup('ansible.builtin.file', _role_dir ~ '/tasks/resolve-slack-team.yml') | from_yaml }}"
        _verify_tasks: "{{ lookup('ansible.builtin.file', _role_dir ~ '/tasks/verify-mcp-tools.yml') | from_yaml }}"
        _probe_tasks: >-
          {{ lookup('ansible.builtin.file', _role_dir ~ '/tasks/verify-app-agent-probe.yml') | from_yaml }}
        _matrix_file: "{{ lookup('ansible.builtin.file', _role_dir ~ '/files/app-agents/MATRIX.md') }}"
      no_log: true

    - name: Simulate an unavailable Draw.io listener
      ansible.builtin.set_fact:
        llm_router_mcp_next_ai_drawio_port_ready: false

    - name: Render MCP servers with the optional Draw.io server disabled
      ansible.builtin.set_fact:
        _mcp_servers_disabled: >-
          {{ lookup('ansible.builtin.template', _role_dir ~ '/templates/mcp-servers.yaml.j2')
             | from_yaml }}

    - name: Restore Draw.io listener readiness for the remaining assertions
      ansible.builtin.set_fact:
        llm_router_mcp_next_ai_drawio_port_ready: true

    - name: Keep credentials in the OpenBao projection and root-only unit environment
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_mcp_zammad_url == 'test-zammad-url'
          - llm_router_mcp_zammad_http_token == 'test-zammad-token'
          - llm_router_mcp_slack_bot_token == 'test-slack-token'
          - "'LLM_ROUTER_ZAMMAD_URL=' in _environment_template"
          - "'LLM_ROUTER_ZAMMAD_HTTP_TOKEN=' in _environment_template"
          - "'LLM_ROUTER_SLACK_BOT_TOKEN=' in _environment_template"
          - "'LLM_ROUTER_NEXT_AI_DRAWIO_MCP_API_KEY=' not in _environment_template"
          - "'LITELLM_ENABLE_MCP_STDIO=true' in _environment_template"
          - "'LITELLM_ENABLE_MCP_STDIO' not in _config_template"
          - "'test-zammad-token' not in (_mcp_servers | to_json)"
          - "'test-slack-token' not in (_mcp_servers | to_json)"
          - "'fixture-next-ai-drawio-key' not in (_mcp_servers | to_json)"
          - "'fixture-youtrack-write-token' not in (_mcp_servers | to_json)"
          - "('youtrack.' ~ llm_router_subdomain) not in (_mcp_servers | to_json)"
          - "'drawio' not in (_mcp_servers_disabled.mcp_servers | to_json)"
        fail_msg: The MCP credentials or stdio switch escaped their process environment boundary.
      no_log: true

    - name: Restrict server tools and package versions at the proxy boundary
      ansible.builtin.assert:
        quiet: true
        that:
          - _mcp_servers.mcp_servers.zammad.transport == 'stdio'
          - _mcp_servers.mcp_servers.zammad.command == (llm_router_venv ~ '/bin/uvx')
          - _mcp_servers.mcp_servers.zammad.args[0] == '--with'
          - _mcp_servers.mcp_servers.zammad.server_id == llm_router_mcp_zammad_server_id
          - _mcp_servers.mcp_servers.zammad.allow_all_keys == false
          - _mcp_servers.mcp_servers.zammad.allowed_tools == ['zammad_search_tickets', 'zammad_get_ticket']
          - _mcp_servers.mcp_servers.zammad.env.ZAMMAD_URL == 'os.environ/LLM_ROUTER_ZAMMAD_URL'
          - _mcp_servers.mcp_servers.zammad.env.ZAMMAD_HTTP_TOKEN == 'os.environ/LLM_ROUTER_ZAMMAD_HTTP_TOKEN'
          - "'v1.1.0' in _mcp_servers.mcp_servers.zammad.args | join(' ')"
          - "'mcp<2' in _mcp_servers.mcp_servers.zammad.args"
          - _mcp_servers.mcp_servers.slack.transport == 'stdio'
          - _mcp_servers.mcp_servers.slack.server_id == llm_router_mcp_slack_server_id
          - _mcp_servers.mcp_servers.slack.allow_all_keys == false
          - >-
            _mcp_servers.mcp_servers.slack.allowed_tools
            == ['slack_list_channels', 'slack_get_channel_history', 'slack_get_thread_replies']
          - _mcp_servers.mcp_servers.slack.env.SLACK_BOT_TOKEN == 'os.environ/LLM_ROUTER_SLACK_BOT_TOKEN'
          - _mcp_servers.mcp_servers.slack.env.SLACK_TEAM_ID == 'os.environ/LLM_ROUTER_SLACK_TEAM_ID'
          - _mcp_servers.mcp_servers.slack.args == ['--yes', '@modelcontextprotocol/server-slack@2025.4.25']
          - _mcp_servers.mcp_servers.drawio.transport == 'http'
          - _mcp_servers.mcp_servers.drawio.server_id == 'drawio'
          - _mcp_servers.mcp_servers.drawio.url == 'http://192.0.2.55:3071/mcp'
          - _mcp_servers.mcp_servers.drawio.auth_type == 'none'
          - _mcp_servers.mcp_servers.drawio.auth_value is not defined
          - _mcp_servers.mcp_servers.drawio.static_headers is not defined
          - _mcp_servers.mcp_servers.drawio.allow_all_keys == false
          - >-
            _mcp_servers.mcp_servers.drawio.allowed_tools
            == ['start_session', 'create_new_diagram', 'edit_diagram', 'get_diagram',
                'get_drawing_guide', 'get_shape_library']
          - "'stdio' != _mcp_servers.mcp_servers.drawio.transport"
          - _mcp_servers.mcp_servers.youtrack_write.transport == 'http'
          - _mcp_servers.mcp_servers.youtrack_write.allowed_tools | select('search', 'delete') | list | length == 0
        fail_msg: MCP server config did not match the pinned, read-only contract.

    - name: Assert app servers match the matrix
      ansible.builtin.import_tasks: assert_app_servers_match_matrix.yml

    - name: Match each enabled app server to its tier row
      ansible.builtin.import_tasks: assert_app_server_tier_rows.yml

    - name: Keep the env file root-only and scope-check Slack credentials without logging them
      ansible.builtin.assert:
        quiet: true
        that:
          - _env_task['ansible.builtin.template'].owner == 'root'
          - _env_task['ansible.builtin.template'].group == 'root'
          - _env_task['ansible.builtin.template'].mode == '0600'
          - _auth_task.no_log == true
          - _scope_task.no_log == true
          - "'channels:read' in (_scope_task['ansible.builtin.assert'].that | to_json)"
          - "'channels:history' in (_scope_task['ansible.builtin.assert'].that | to_json)"
          - "'x_oauth_scopes' in (_scope_task['ansible.builtin.assert'].that | to_json)"
          - "'== [' not in (_scope_task['ansible.builtin.assert'].that | to_json)"
        fail_msg: The deployment credential boundary or Slack scope preflight changed.
      vars:
        _env_task: >-
          {{ _main_tasks | selectattr('name', 'equalto', 'Deploy the LiteLLM secrets env file') | first }}
        _auth_task: >-
          {{ _resolve_tasks | selectattr('name', 'equalto',
             'Call Slack auth.test with the OpenBao bot token') | first }}
        _scope_task: >-
          {{ _resolve_tasks | selectattr('name', 'equalto', 'Require a successful Slack identity response') | first }}

    - name: Verify the post-restart MCP tools/list probes fail closed without logging responses
      ansible.builtin.assert:
        quiet: true
        that:
          - _zammad_check['ansible.builtin.uri'].get('method', 'GET') == 'GET'
          - "'/mcp-rest/tools/list?server_id=' in _zammad_check['ansible.builtin.uri'].url"
          - "'llm_router_mcp_zammad_server_id' in _zammad_check['ansible.builtin.uri'].url"
          - _zammad_check.no_log == true
          - "'llm_router_mcp_zammad_allowed_tools' in (_zammad_check.until | to_json)"
          - "'json.tools' in (_zammad_check.until | to_json)"
          - _slack_check['ansible.builtin.uri'].get('method', 'GET') == 'GET'
          - "'/mcp-rest/tools/list?server_id=' in _slack_check['ansible.builtin.uri'].url"
          - "'llm_router_mcp_slack_server_id' in _slack_check['ansible.builtin.uri'].url"
          - _slack_check.no_log == true
          - "'llm_router_mcp_slack_allowed_tools' in (_slack_check.until | to_json)"
          - "'json.tools' in (_slack_check.until | to_json)"
          - _drawio_check['ansible.builtin.uri'].get('method', 'GET') == 'GET'
          - "'/mcp-rest/tools/list?server_id=' in _drawio_check['ansible.builtin.uri'].url"
          - "'llm_router_mcp_next_ai_drawio_server_id' in _drawio_check['ansible.builtin.uri'].url"
          - _drawio_check.no_log == true
          - "'llm_router_mcp_next_ai_drawio_allowed_tools' in (_drawio_check.until | to_json)"
          - "'llm_router_next_ai_drawio_router_key' in (_required_key_task | to_json)"
          - _required_key_task.no_log == true
          - "'wait_for' in (_port_probe_task | to_json)"
          - "'llm_router_mcp_next_ai_drawio_activation_enabled' in (_port_probe_task.when | to_json)"
          - "'llm_router_mcp_next_ai_drawio_port_ready' in (_port_ready_task | to_json)"
        fail_msg: The restart-time MCP tools/list check stopped enforcing the exact read-only tool contract.
      vars:
        _zammad_check: >-
          {{ _verify_tasks | selectattr('name', 'equalto',
             'Verify the Zammad MCP server exposes exactly its configured tools') | first }}
        _slack_check: >-
          {{ _verify_tasks | selectattr('name', 'equalto',
             'Verify the Slack MCP server exposes exactly its configured tools') | first }}
        _drawio_check: >-
          {{ _verify_tasks | selectattr('name', 'equalto',
             'Verify the Next AI Draw.io MCP server exposes exactly its configured tools') | first }}
        _required_key_task: >-
          {{ _main_tasks | selectattr('name', 'equalto',
             'Require the Draw.io router key before the app guest is served') | first }}
        _port_probe_task: >-
          {{ _main_tasks | selectattr('name', 'equalto',
             'Probe the Draw.io MCP listener from the router network path') | first }}
        _port_ready_task: >-
          {{ _main_tasks | selectattr('name', 'equalto',
             'Record Draw.io MCP listener readiness for registration') | first }}
