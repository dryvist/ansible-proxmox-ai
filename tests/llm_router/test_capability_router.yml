---
- name: Verify the capability API and registry alias projection
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
        llm_cpu_scaler:
          tags:
            nine_b: alias-test-cpu-9b
      containers:
        alias-test-cpu-9b:
          ip: localhost
          tags: [alias-test-cpu-9b]
    bao_apps_secrets: {}
    _fixture_subdomain: "pve.example.test"
    llm_large_serving_host: llm-large
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_default_model: "{{ llm_router_primary_model }}"
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    llm_router_vllm_first_byte_timeout_seconds: 40
    hermes_brain_model: "{{ llm_router_primary_model }}"
    hindsight_retain_model: "{{ llm_router_small_model }}"
    hermes_goal_judge_model: "{{ llm_router_small_model }}"
    bao_local_llm_secrets: {}
  tasks:
    - name: Load the role defaults
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Set the fixture subdomain after loading the role defaults
      ansible.builtin.set_fact:
        llm_router_subdomain: "{{ _fixture_subdomain }}"

    - name: Set a fixture precheck result for the local capability render
      ansible.builtin.set_fact:
        llm_router_llm_vllm_enabled: true
        llm_router_vllm_precheck_passed: true
        llm_router_llm_vllm_base_url: "http://localhost:10434/v1"

    - name: Load the registry through the role task
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Run the registry alias and unique-order guards
      ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-capabilities.yml"

    - name: Render model and alias names from the same registry views
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"
        _capabilities: "{{ llm_router_capability_names | unique | list }}"
        _registry_local_capability_names: >-
          {{ llm_router_registry_enabled
             | selectattr('tier', 'in', llm_router_local_registry_tiers)
             | selectattr('route_group', 'defined')
             | map(attribute='route_group') | unique | list }}
        _aliases: "{{ llm_router_model_group_aliases }}"
        _alias_pairs: "{{ llm_router_alias_pairs }}"

    - name: Capture the rendered small capability members
      ansible.builtin.set_fact:
        _small_members: >-
          {{ _config.model_list
             | selectattr('model_name', 'equalto', llm_router_small_model) | list }}

    - name: Capture the rendered capability model names
      ansible.builtin.set_fact:
        _rendered_capability_names: >-
          {{ _config.model_list | map(attribute='model_name') | unique
             | intersect(_capabilities) | list }}

    # `large` resolves to the primary route group; the three trial groups are
    # additional registry-backed local capabilities.
    - name: Expose the registry capabilities and aliases
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_large_model == llm_router_primary_model
          - _capabilities | length == 7
          - _capabilities | symmetric_difference(_expected_capabilities) | length == 0
          - _registry_local_capability_names | difference(_capabilities) | length == 0
          - _rendered_capability_names | symmetric_difference(_registry_local_capability_names) | length == 0
          - _small_members | length == 1
          - _small_members | map(attribute='litellm_params.order') | map('int') | list == [3]
          - _small_members | map(attribute='litellm_params.api_base') | list == llm_router_cpu_9b_backend_urls
          - _aliases | length == 12 + llm_router_direct_route_aliases | length
          - _aliases | length == _alias_pairs | length
          - _aliases.keys() | symmetric_difference(_expected_aliases) | length == 0
          - _aliases.keys() | difference(_config.router_settings.model_group_alias.keys()) | length == 0
          - _config.router_settings.model_group_alias.keys() | difference(_aliases.keys()) | length == 0
          - >-
            _aliases.keys() | intersect(_config.model_list | map(attribute='model_name')
            | unique | list) == llm_router_direct_route_aliases
          - _aliases.values() | difference(_capabilities + llm_router_direct_route_aliases) | length == 0
          - >-
            _registry_local_capability_names
            | difference(_config.model_list | map(attribute='model_name') | unique | list)
            | length == 0
          - >-
            llm_router_max_fallbacks | int
            == llm_router_fallback_target_names | length
            + llm_router_capability_order_retarget_count | int
          - >-
            llm_router_role_deployments | map(attribute='role')
            | difference(llm_router_database_role_chain_names) | length == 0
          - llm_router_enforce_fallback_model_access | bool
        fail_msg: >-
          capability names={{ _capabilities }}, aliases={{ _aliases }},
          small members={{ _small_members }},
          rendered aliases={{ _config.router_settings.model_group_alias }}
      vars:
        _expected_capabilities: >-
          {{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model,
              llm_router_embedding_model, llm_router_ocr_model] | unique | list
             + ['small-trial-mlx', 'small-trial-mlx-q6', 'small-trial-gpu'] }}
        _expected_aliases: >-
          {{ ['subagent', 'fast', 'cheap', 'review-oss',
              'review-private', 'review-local', 'hermes-default', 'goal-judge',
              'default', 'auto', 'coding', 'embeddings']
             + llm_router_direct_route_aliases }}
