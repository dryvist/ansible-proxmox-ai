---
- name: Project model limits using the router's production registry loader
  hosts: localhost
  gather_facts: false
  vars:
    hermes_brain_model: medium
    hermes_goal_judge_model: judge
  tasks:
    - name: Load registry entries and project catalog limits
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml
        public: true

    - name: Write the projected registry for the profile-render unit test
      ansible.builtin.copy:
        content: "{{ llm_router_model_registry | to_nice_json }}"
        dest: "{{ projection_output }}"
        mode: "0600"
