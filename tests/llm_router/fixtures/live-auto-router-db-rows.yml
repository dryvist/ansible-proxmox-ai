---
# Sanitized /v2/model/info rows captured from a live router. The deployment
# names and tuning fields are retained; database ids and connection metadata
# are omitted because the contract only concerns auto-router cardinality.
llm_router_live_role_model_info_fixture:
  - model_name: cheap
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        classifier_type: heuristic
        tiers:
          SIMPLE: mlx-community/Qwen3.8-27B-4bit
          MEDIUM: mlx-community/Qwen3.8-27B-4bit
          COMPLEX: gpu-medium-a
          REASONING: gpu-medium-a
        default_model: gpu-medium-a
  - model_name: fast
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        classifier_type: heuristic
        tiers:
          SIMPLE: mlx-community/Qwen3.8-27B-4bit
          MEDIUM: mlx-community/Qwen3.8-27B-4bit
          COMPLEX: gpu-medium-a
          REASONING: gpu-medium-a
        default_model: gpu-medium-a
