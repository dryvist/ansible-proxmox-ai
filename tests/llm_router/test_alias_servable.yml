---
# Pins the servable-alias contract from roles/llm_router/tasks/assert.yml.
#
# WHY THIS TEST EXISTS. On 2026-07-28 every consumer alias in the router pointed
# at a model the serving host does not serve — medium, tool-calling,
# small and interim-brain all returned HTTP 404 against the live gate, at
# the same time. The serving host runs llama-swap in single-model mode, where
# every non-resident model is demoted to `disabledModels` and answers 404 rather
# than being served under the wrong weights. Nothing in the repo could catch it:
# the pre-existing assert only proves an alias target carries a non-null
# context_window (the compress-death guard), never that it is REACHABLE.
#
# The failure was invisible for as long as llama-swap still grafted disabled ids
# onto the resident, because a request for a disabled model was quietly answered
# by whatever happened to be loaded. So this contract cannot be left to a live
# probe: it has to hold at render time, offline, on every converge.
#
# Run (from the REPO ROOT — the registry load resolves the llm_router role
# through ansible.cfg's cwd-relative roles_path):
#   ansible-playbook tests/llm_router/test_alias_servable.yml -i localhost, -c local
- name: Verify the llm_router servable-alias contract
  hosts: localhost
  gather_facts: false
  vars:
    _defaults_dir: "{{ playbook_dir }}/../../roles/llm_router/defaults/main"
    # The virtual-key scopes read the apps-domain secret map for their VALUES.
    # Only the model lists are under test, but Jinja renders the whole entry,
    # so the map has to exist. Empty is also the honest render of an unseeded
    # consumer, which is the state this contract has to hold in.
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
    bao_apps_secrets: {}
  tasks:
    - name: Add a fixture member for the GPU-tier projections
      ansible.builtin.add_host:
        name: llm-gpu-fixture
        groups: llm_gpu_group
        ansible_connection: local

    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _defaults_dir }}"

    - name: Select the small profile for this active-state contract
      ansible.builtin.set_fact:
        llm_router_gpu_profiles_enabled: true
        llm_active_profile: small

    # The defaults are projections of the registry, so both have to be in scope
    # for the contract to mean anything. Loaded through the role's own task file
    # rather than by a path spelled here: llm_router_registry_dir derives from
    # role_path, so a hand-rolled path would keep this test green while the
    # converge's own lookup was broken.
    - name: Load the fabric model registry the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Every alias target resolves into the servable set
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            llm_router_model_group_aliases | dict2items | map(attribute='value')
            | difference(llm_router_all_servable_models + llm_router_hermes_router_ids
                         + llm_router_long_context_alias_ids
                         + llm_router_direct_route_aliases) | length == 0
          - llm_router_small_capability_name in llm_router_rendered_capability_names
          - llm_router_model_group_aliases['fast'] == llm_router_small_capability_name
          - llm_router_model_group_aliases['cheap'] == llm_router_small_capability_name
          - llm_router_model_group_aliases['goal-judge'] == llm_router_small_capability_name
        fail_msg: >-
          Alias(es)
          [{{ llm_router_model_group_aliases | dict2items | map(attribute='value')
              | difference(llm_router_all_servable_models + llm_router_hermes_router_ids
                           + llm_router_long_context_alias_ids
                           + llm_router_direct_route_aliases) | unique | join(', ') }}]
          are outside the large/GPU servable set, the local complexity
          router, and the long-context entry, and would return HTTP 404.
        success_msg: "all {{ llm_router_model_group_aliases | length }} aliases are servable"

    - name: Every capability has a member with a real context_window
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_capability_names | difference(_safe) | length == 0
        fail_msg: >-
          [{{ llm_router_capability_names | difference(_safe) | join(', ') }}]
          have no registered capability member with a real context_window.
          They would fall through the "*" wildcard and compress every caller.
        success_msg: "all capabilities have a registered member with an explicit context window"
      vars:
        _safe: >-
          {{ llm_router_capability_members
             | selectattr('context_window', 'defined')
             | rejectattr('context_window', 'none')
             | map(attribute='route_group') | unique | list }}

    - name: The advertised window for the primary capability matches the serving profile
      # nix-ai catalog-data.nix pins the RESIDENT profile at
      # maxRequestTokens = 65536 (cacheMemoryMb 16384) — the same figure for
      # qwen38-27b, which holds serving_role: primary since 2026-08-14, as for
      # the qwen36-35b that held it before. The router carried 32768 — the
      # SWAP-class figure — so Hermes auto-compacted at 24.5K instead of ~49K.
      # Halving the advertised window protects nothing; it only wastes context,
      # and the catalog comment names 65536 as what avoids the 32768
      # truncation/retry death-loop.
      ansible.builtin.assert:
        quiet: true
        that:
          - _primary_entry | length == 1
          - (llm_router_primary_model == (_primary_entry | first).route_group)
          - (_primary_entry | first).context_window | int > 0
          - >-
            (_primary_entry | first).tier != 'local-large'
            or (_primary_entry | first).context_window | int == 65536
        fail_msg: >-
          llm_router_primary_model ({{ llm_router_primary_model }}) must be
          backed by one tuned serving entry with a
          positive context window; a large-tier primary must keep the
          nix-ai resident window 65536. Found
          {{ _primary_entry | map(attribute='context_window') | list }}.
        success_msg: "primary route resolves to one tuned large/GPU entry"
      vars:
        _primary_target: "{{ llm_router_primary_serving_model }}"
        _primary_entry: >-
          {{ (llm_router_large_models + llm_router_gpu_models)
             | selectattr('client_model_id', 'equalto', _primary_target) | list }}

    - name: The judge role targets the small capability without changing its params
      ansible.builtin.assert:
        quiet: true
        that:
          - _judge.model == llm_router_small_capability_name
          - _judge.litellm_params.extra_body.chat_template_kwargs.enable_thinking is sameas false
          - _judge.fallbacks == llm_router_d1_zdr_ladder_groups
        success_msg: "judge keeps its request policy on the small capability"
      vars:
        _judge: "{{ llm_router_role_deployments | selectattr('role', 'equalto', hermes_goal_judge_model) | first }}"

    - name: The recorder role targets the small capability and keeps logging disabled
      ansible.builtin.assert:
        quiet: true
        that:
          - _recorder.model == llm_router_small_capability_name
          - _recorder.litellm_params.turn_off_message_logging is sameas true
          - _recorder.fallbacks == []
        success_msg: "recorder keeps its logging policy on the small capability"
      vars:
        _recorder: "{{ llm_router_role_deployments | selectattr('role', 'equalto', 'recorder') | first }}"

    - name: Every per-caller virtual key scopes only names the router advertises
      # WHY THIS EXISTS. A key's `models` list is an allowlist enforced by the
      # proxy: a name in it that the router does not advertise is not an error
      # anywhere — the key simply cannot reach anything under that name, and the
      # consumer gets a 400 it will read as its own bug. Deriving the scopes
      # from the registry (defaults/main/56-virtual-keys.yml) is what keeps a
      # RETIRED alias from lingering in one, and this assert is what proves the
      # derivation still lands inside the advertised set after a rename.
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_virtual_keys | length > 0
          - _key_scope_models | difference(_advertised) | difference([_deny]) | length == 0
          # The deny sentinel is LiteLLM's reserved name, not an advertised
          # model, and it is admitted ONLY on a key that lists nothing else: a
          # key mixing the sentinel with real names is a contradiction that
          # LiteLLM resolves by granting the real names. Fails if any key
          # carries the sentinel alongside another scope.
          - _mixed_deny_keys | length == 0
          # An EMPTY scope on a key means ALL MODELS in LiteLLM (auth_checks:
          # len(models) == 0 -> all_model_access). Fails if any key renders
          # with no scope at all — the shape a metrics-only key would take if
          # written the obvious way, and it would be a full-access key.
          - _empty_scope_keys | length == 0
        fail_msg: >-
          Virtual-key scope(s)
          [{{ _key_scope_models | difference(_advertised) | difference([_deny]) | join(', ') }}]
          name nothing the router advertises. A key may only list a servable
          model, a group alias, a role deployment or a rung of its chain, a
          Hermes agent, or — alone —
          the '{{ _deny }}' sentinel. Keys mixing the sentinel with other scopes:
          [{{ _mixed_deny_keys | join(', ') }}]. Keys with an EMPTY scope, which
          LiteLLM reads as every model: [{{ _empty_scope_keys | join(', ') }}].
        success_msg: >-
          all {{ llm_router_virtual_keys | length }} virtual keys scope
          {{ _key_scope_models | length }} advertised names
      vars:
        # Everything a caller can legitimately address on this proxy.
        # ... plus every rung a role's chain walks (59-key-scopes.yml grants
        # them to the role's keys; the proxy checks the key for the fallback
        # target too). Each such rung is a rendered group, asserted by
        # test_local_first_by_order.yml.
        #
        # PLUS `free` and `free-zdrless`: two standalone model groups, not
        # a role or an alias. PLUS every light-tier deployment: its CPU half
        # always renders (model-list-light.yaml.j2), so its client name is a
        # group a key may be scoped to.
        _advertised: >-
          {{ (llm_router_all_servable_models
              + (llm_router_light_models | map(attribute='client_model_id') | list)
              + (llm_router_model_group_aliases | list)
              + (llm_router_hermes_agents | list)
              + ['free', 'free-zdrless']
              + (llm_router_role_deployments | map(attribute='role') | list)
              + (llm_router_role_deployments | map(attribute='model') | list)
              + (llm_router_role_deployments | map(attribute='fallbacks') | flatten)
              + _llm_router_directly_callable_ladder_names)
             | unique | list }}
        _key_scope_models: >-
          {{ llm_router_virtual_keys | map(attribute='models') | flatten
             | unique | list }}
        # LiteLLM's SpecialModelNames.no_default_models (_types.py).
        _deny: no-default-models
        _mixed_deny_keys: >-
          {{ llm_router_virtual_keys
             | selectattr('models', 'contains', _deny)
             | rejectattr('models', 'equalto', [_deny])
             | map(attribute='alias') | list }}
        _empty_scope_keys: >-
          {{ llm_router_virtual_keys
             | selectattr('models', 'equalto', [])
             | map(attribute='alias') | list }}
