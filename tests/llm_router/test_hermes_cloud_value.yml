---
- name: Verify Hermes provider-diverse value fallbacks and bounded controls
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: hermes-default
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Produce the fully credentialed render
      ansible.builtin.import_tasks: tasks/credentialed_render.yml

    - name: Load sanitized auto-router rows captured from a live router
      ansible.builtin.set_fact:
        llm_router_live_role_model_info_fixture: >-
          {{ (lookup('template', playbook_dir ~ '/fixtures/live-auto-router-db-rows.yml.j2')
             | from_yaml).llm_router_live_role_model_info_fixture }}

    - name: Provider chain, costs, and operational ceilings are exact
      ansible.builtin.assert:
        quiet: true
        that:
          # D1 determines cross-class order; each class preserves the catalog
          # order derived by the role defaults.
          #
          # Five enabled, credentialed, chain-joining provider groups:
          # two Alibaba, two Gemini, and one OpenRouter group.
          # hermes-cloud-free was the fourth until it was disabled (upstream
          # withdrew its model); the count follows that removal.
          - _local_groups | length == 1
          - llm_router_hermes_cloud_only_fallback_groups | length == 5
          - llm_router_hermes_cloud_fallback_groups == _expected_full_chain
          - _fallback_chain == _expected_chain
          # Distinct target names PLUS one order-based retarget per budgeted
          # target: max_fallbacks bounds rung ATTEMPTS along a path
          # (37-fallback-entry-points.yml carries the source citations). Stated
          # as the two sets rather than a bare number, so a new target family or
          # a new budgeted rung has to be reviewed here instead of silently
          # absorbed. The property itself (bound >= attempt keys, read off the
          # render) is proven in test_fallback_entry_points.yml.
          - >-
            _config.router_settings.max_fallbacks | int
            >= ((llm_router_d1_ladder_groups + [llm_router_primary_model]) | unique | length)
          - _config.router_settings.num_retries | int == 0
          - _config.router_settings.retry_policy.RateLimitErrorRetries | int == 0
          # One failure counter per deployment serves EVERY allowance
          # (cooldown_handlers.py:404-408 passes no per-type suffix), so a
          # timeout is judged against a counter the busy-slot 429s have already
          # filled. The timeout allowance must exist, sit strictly above the
          # generic allowed_fails (or the first timeout after two 429s parks
          # the deployment) and strictly below the rate-limit allowance (a
          # timeout is the stronger signal). Rationale: 40-routing.yml.
          - _config.router_settings.allowed_fails_policy.TimeoutErrorAllowedFails is defined
          - >-
            _config.router_settings.allowed_fails_policy.TimeoutErrorAllowedFails | int
            > _config.router_settings.allowed_fails | int
          - >-
            _config.router_settings.allowed_fails_policy.TimeoutErrorAllowedFails | int
            < _config.router_settings.allowed_fails_policy.RateLimitErrorAllowedFails | int
          # The zero-retry set starts with the full default fallback groups
          # (D1's ladder, including the auto alias's initial rung), then the
          # ordered provider groups and every entry-point name. The
          # four provider groups are stated literally so a change there gets a
          # direct review; entry points derive from the servable set and the
          # rendered alias map, never a copied model list. `_expected_chain`
          # is the auto alias's post-entry continuation and intentionally
          # omits its initial rung.
          - >-
            llm_router_hermes_cloud_zero_retry_groups
            == (llm_router_d1_ladder_groups
                + ['hermes-cloud-alibaba-routine',
                   'hermes-cloud-alibaba-agentic',
                   'hermes-cloud-gemini-routine',
                   'hermes-cloud-gemini-agentic']
                + (llm_router_all_servable_models
                   + (_config.router_settings.model_group_alias | list))
                + [hermes_brain_model]) | unique | list
          # The complexity router is a name the Hermes agents call, so it is the
          # one chain-carrying name that waits out a busy local slot (honouring
          # the upstream's Retry-After) before handing it to its chain. The
          # no-credential render keeps the same figure
          # (test_hermes_default_failover.yml); the rest of the contract is
          # pinned in test_hermes_rate_limit_retry.yml.
          - llm_router_hermes_rate_limit_retries | int > 0
          - >-
            _config.router_settings.model_group_retry_policy[hermes_brain_model]
              .RateLimitErrorRetries | int == llm_router_hermes_rate_limit_retries | int
          # The policy keys are the chain groups plus the listed names (the goal
          # judge carries no chain, so it is listed but not a chain group).
          - _cloud_retry_groups
            == (llm_router_hermes_cloud_zero_retry_groups + llm_router_rate_limit_retry_names) | unique | sort
          # Only the multi-member cloud groups (onto their next member) and the
          # names the Hermes agents call retry.
          - >-
            _nonzero_cloud_retry_groups | sort
            == (llm_router_multi_member_cloud_groups + llm_router_rate_limit_retry_names) | unique | sort
          - "'enforce_model_rate_limits' in _config.router_settings.optional_pre_call_checks"
          - "'session_affinity' in _config.router_settings.optional_pre_call_checks"
          - _cloud_models | length == 6
          - _modified_auto_routers | length == 1
          - _modified_auto_routers[0].model_name == hermes_brain_model
          - llm_router_model_group_aliases['fast'] == hermes_brain_model
          - llm_router_model_group_aliases['cheap'] == hermes_brain_model
          - "'fast' in llm_router_zdr_entry_point_names"
          - "'cheap' in llm_router_zdr_entry_point_names"
          - >-
            _config.router_settings.fallbacks
            | selectattr('fast', 'defined') | map(attribute='fast') | first
            == _expected_zdr_entry_chain
          - >-
            _config.router_settings.fallbacks
            | selectattr('cheap', 'defined') | map(attribute='cheap') | first
            == _expected_zdr_entry_chain
          - _post_migration_auto_router_count == 1
          - _live_auto_router_names == ['cheap', 'fast']
          - _retired_auto_router_names == ['cheap', 'fast']
          - _unaliased_auto_router_roles | length == 0
          - _uncapped | length == 0
          - _wrong_input_cap | length == 0
          - _wrong_output_cap | length == 0
          - _wrong_mode | length == 0
          - _wrong_retry | length == 0
          - _wrong_timeout | length == 0
          - _missing_prices | length == 0
          - _monthly_total | round(2) == 6.66
          # REVIEWED EDIT 2026-09-02. This pair used to assert that a
          # routing_group declared cost-based-routing over the final-resort
          # group. That mechanism is PROHIBITED now: declaring it for one group
          # registers LiteLLM's lowest-cost logging handler process-wide, and
          # that handler raises on every success event from any deployment it
          # does not manage, leaving the request's span half-closed.
          #
          # The policy the tripwire guards is unchanged — real prices, cheaper
          # final-resort model first. It is now asserted directly: the key must
          # be ABSENT (so reintroducing the mechanism trips this), and the two
          # final-resort deployments must appear in ascending input price, read
          # from their own litellm_params rather than restated as literals.
          - "'routing_groups' not in _config.router_settings"
          - _final_resort | length == 2
          - >-
            _final_resort | map(attribute='litellm_params.input_cost_per_token')
            | map('float') | list | sort
            == _final_resort | map(attribute='litellm_params.input_cost_per_token')
               | map('float') | list
        fail_msg: >-
          Hermes cloud policy drifted: chain={{ _fallback_chain }},
          cloud_count={{ _cloud_models | length }}, monthly={{ _monthly_total }},
          uncapped={{ _uncapped }}.
        success_msg: >-
          Hermes has one configured auto-router, ordered provider groups, zero
          ordinary or rate-limit retries, and bounded rate/concurrency controls.
      vars:
        _modified_auto_routers: >-
          {{ _config.model_list
             | selectattr('litellm_params.model', 'equalto', _auto_router_backend_model)
             | list }}
        _live_auto_router_rows: >-
          {{ llm_router_live_role_model_info_fixture
             | selectattr('litellm_params.model', 'equalto', _auto_router_backend_model)
             | list }}
        _auto_router_backend_model: >-
          {{ llm_router_hermes_virtual_models | map(attribute='litellm_model_name') | first }}
        _live_auto_router_names: >-
          {{ _live_auto_router_rows | map(attribute='model_name') | list | sort }}
        _retired_auto_router_names: >-
          {{ _live_auto_router_names | intersect(llm_router_model_group_aliases | list) | sort }}
        _unaliased_auto_router_roles: >-
          {{ llm_router_role_deployments
             | selectattr('model', 'equalto', llm_router_auto_router_model)
             | rejectattr('role', 'in', llm_router_model_group_aliases | list)
             | map(attribute='role') | list }}
        _post_migration_auto_router_count: >-
          {{ (_modified_auto_routers | length)
             + (_live_auto_router_names | difference(_retired_auto_router_names) | length)
             + (_unaliased_auto_router_roles | length) }}
        # Class order and rung names are derived from the registry.
        _local_groups: >-
          {{ llm_router_model_registry | selectattr('tier', 'equalto', 'hermes-local')
             | map(attribute='route_group') | unique | list }}
        _expected_full_chain: "{{ llm_router_d1_ladder_groups }}"
        _expected_chain: >-
          {{ llm_router_d1_ladder_groups
             | reject('equalto', llm_router_d1_auto_initial_group) | list }}
        _expected_zdr_entry_chain: >-
          {{ _expected_chain
             | reject('in', llm_router_zdr_unasserted_terminal_rungs) | list }}
        _fallback_chain: >-
          {{ _config.router_settings.fallbacks
             | selectattr('hermes-default', 'defined')
             | map(attribute='hermes-default') | flatten }}
        _final_resort: >-
          {{ _config.model_list
             | selectattr('litellm_params.input_cost_per_token', 'defined')
             | selectattr('model_name', 'equalto', 'hermes-cloud-openrouter')
             | list }}
        _cloud_models: >-
          {{ _config.model_list
             | selectattr('model_name', 'match', '^hermes-cloud-')
             | selectattr('litellm_params.input_cost_per_token', 'defined')
             | rejectattr('litellm_params.input_cost_per_token', 'in', [0, '0', '0.0']) | list }}
        _cloud_retry_groups: >-
          {{ _config.router_settings.model_group_retry_policy.keys() | list | sort }}
        _nonzero_cloud_retry_groups: >-
          {%- set ns = namespace(groups=[]) -%}
          {%- for group, policy in _config.router_settings.model_group_retry_policy.items() -%}
          {%- if policy.RateLimitErrorRetries | int != 0 -%}
          {%- set ns.groups = ns.groups + [group] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.groups }}
        _uncapped: >-
          {{ _cloud_models
             | rejectattr('litellm_params.rpm', 'defined')
             | map(attribute='model_name') | list }}
        _wrong_input_cap: >-
          {{ _cloud_models
             | rejectattr('model_info.max_input_tokens', 'equalto', 131072)
             | map(attribute='model_name') | list }}
        _wrong_output_cap: >-
          {{ _cloud_models
             | rejectattr('model_info.max_tokens', 'equalto', 8192)
             | map(attribute='model_name') | list }}
        _wrong_mode: >-
          {{ _cloud_models
             | rejectattr('model_info.mode', 'equalto', 'chat')
             | map(attribute='model_name') | list }}
        # Zero, except inside a multi-member group, which retries onto its
        # next member (llm_router_cloud_group_retries).
        _wrong_retry: >-
          {{ (_cloud_models | rejectattr('model_name', 'in', llm_router_multi_member_cloud_groups)
              | rejectattr('litellm_params.num_retries', 'equalto', 0) | list
              + _cloud_models | selectattr('model_name', 'in', llm_router_multi_member_cloud_groups)
              | rejectattr('litellm_params.num_retries', 'equalto', llm_router_cloud_group_retries | int) | list)
             | map(attribute='model_name') | list }}
        _wrong_timeout: >-
          {{ _cloud_models
             | rejectattr('litellm_params.timeout', 'equalto', 2400)
             | map(attribute='model_name') | list }}
        _missing_prices: >-
          {{ (_cloud_models
              | rejectattr('litellm_params.input_cost_per_token', 'defined')
              | map(attribute='model_name') | list)
             + (_cloud_models
                | rejectattr('litellm_params.output_cost_per_token', 'defined')
                | map(attribute='model_name') | list) }}
        _monthly_total: >-
          {{ _cloud_models | selectattr('litellm_params.max_budget', 'defined')
             | map(attribute='litellm_params.max_budget') | map('float') | sum }}
