---
- name: Verify Hermes provider-diverse value fallbacks and bounded controls
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Produce the fully credentialed render
      ansible.builtin.import_tasks: tasks/credentialed_render.yml

    - name: Model a logged-in node for the subscription segment golden
      ansible.builtin.set_fact:
        llm_router_chatgpt_auth_file_present: true

    - name: Re-evaluate cloud projections with the login present
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

    - name: Capture Hermes cloud route-group membership and ordering
      ansible.builtin.set_fact:
        _hermes_cloud_route_groups_json: >-
          {%- set ns = namespace(groups=[], rows=[]) -%}
          {%- for m in llm_router_hermes_cloud_models_credentialed -%}
          {%- if m.route_group is defined and m.route_group not in ns.groups -%}
          {%- set ns.groups = ns.groups + [m.route_group] -%}
          {%- set _members = (llm_router_hermes_cloud_models_credentialed
                | selectattr('route_group', 'equalto', m.route_group)
                | sort(attribute='route_rank')
                | map(attribute='client_model_id') | list) -%}
          {%- set ns.rows = ns.rows + [{'group': m.route_group, 'members': _members}] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.rows | to_json }}

    - name: Capture Hermes cloud routing projections
      ansible.builtin.set_fact:
        _hermes_cloud_routing_golden:
          route_groups: "{{ _hermes_cloud_route_groups_json | from_json }}"
          segments:
            paid:
              groups: "{{ llm_router_hermes_cloud_paid_groups }}"
              members: >-
                {{ llm_router_hermes_cloud_models_credentialed
                   | selectattr('price_class', 'equalto', 'paid')
                   | rejectattr('hermes_chain', 'defined')
                   | rejectattr('review_private_only', 'defined')
                   | map(attribute='client_model_id') | list }}
            free:
              groups: "{{ llm_router_hermes_cloud_free_groups }}"
              members: >-
                {{ llm_router_hermes_cloud_models_credentialed
                   | selectattr('price_class', 'equalto', 'free')
                   | map(attribute='client_model_id') | list }}
            subscription:
              groups: "{{ llm_router_hermes_cloud_subscription_groups }}"
              members: >-
                {{ llm_router_hermes_cloud_models_credentialed
                   | selectattr('price_class', 'equalto', 'subscription')
                   | rejectattr('review_private_only', 'defined')
                   | map(attribute='client_model_id') | list }}
          d1:
            rungs_by_class: "{{ llm_router_d1_rungs_by_class }}"
            ladder_groups: "{{ llm_router_d1_ladder_groups }}"

    - name: Assert Hermes cloud routing matches its golden structure
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _hermes_cloud_routing_golden
            == (lookup('file', playbook_dir ~ '/fixtures/hermes_cloud_routing_golden.json')
            | from_json)
        fail_msg: "Hermes cloud routing order, segments, or D1 membership changed."
        success_msg: "Hermes cloud routing order, segments, and D1 membership match the golden structure."

    - name: Restore the non-login fixture used by the remaining test
      ansible.builtin.set_fact:
        llm_router_chatgpt_auth_file_present: false

    - name: Re-evaluate cloud projections without the login
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

    - name: Load the sanitized primary capability row from the live-router fixture
      ansible.builtin.set_fact:
        llm_router_live_role_model_info_fixture: >-
          {{ (lookup('template', playbook_dir ~ '/fixtures/live-auto-router-db-rows.yml.j2')
             | from_yaml).llm_router_live_role_model_info_fixture }}

    - name: Assert Hermes cloud operational policy
      ansible.builtin.import_tasks: tasks/assert_hermes_cloud_value.yml

    - name: Select the offline pinned price-map fixture without a ChatGPT login
      ansible.builtin.set_fact:
        llm_router_price_map_rates_file: "{{ playbook_dir }}/fixtures/model_prices_needed_rows.json"
        llm_router_chatgpt_auth_file_present: false

    - name: Re-evaluate Hermes cloud deployments without the fixture login
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

    - name: Resolve fixture accounting rates with the real controller task
      ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/price-map-rates.yml"

    - name: Assert ChatGPT prices are available independently of node login state
      ansible.builtin.assert:
        quiet: true
        that:
          - _chatgpt_cloud_rate_ids | difference(llm_router_price_rates.keys() | list) | length == 0
      vars:
        _chatgpt_cloud_rate_ids: >-
          {{ llm_router_hermes_cloud_models | selectattr('provider', 'equalto', 'chatgpt')
             | map(attribute='client_model_id') | list }}

    - name: Model a logged-in router before rendering its ChatGPT deployments
      ansible.builtin.set_fact:
        llm_router_chatgpt_auth_file_present: true

    - name: Re-evaluate Hermes cloud deployments with the fixture login
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

    - name: Share the controller projection with the localhost render fixture
      ansible.builtin.set_fact:
        llm_router_price_rates: "{{ hostvars['localhost'].llm_router_price_rates }}"

    - name: Render the config with pinned fixture rates
      ansible.builtin.set_fact:
        _rates_config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: Assert pinned rates, prefix stripping, and no-rate behavior render correctly
      ansible.builtin.assert:
        quiet: true
        that:
          - _gemini | length == 1
          - >-
            _gemini[0].litellm_params.input_cost_per_token ==
            _fixture_rates[_gemini[0].litellm_params.model].input_cost_per_token
          - >-
            _gemini[0].litellm_params.output_cost_per_token ==
            _fixture_rates[_gemini[0].litellm_params.model].output_cost_per_token
          - _openrouter_cloud | length == 4
          - >-
            _openrouter_cloud | map(attribute='litellm_params.model')
            | select('match', '^openrouter/') | list | length == 4
          - >-
            (_openrouter_cloud
             | rejectattr('litellm_params.input_cost_per_token', 'defined')
             | list | length) == 0
          - >-
            _codex_api.litellm_params.input_cost_per_token ==
            _fixture_rates[_codex_api.litellm_params.model.split('/', 1)[1]].input_cost_per_token
          - >-
            _codex_api.litellm_params.output_cost_per_token ==
            _fixture_rates[_codex_api.litellm_params.model.split('/', 1)[1]].output_cost_per_token
          - >-
            _codex_subscription.litellm_params.input_cost_per_token ==
            _fixture_rates[_codex_subscription.litellm_params.model.split('/', 1)[1]].input_cost_per_token
          - >-
            _codex_ci.litellm_params.input_cost_per_token ==
            _fixture_rates[_codex_ci.litellm_params.model.split('/', 1)[1]].input_cost_per_token
          - "'input_cost_per_token' not in _alibaba.litellm_params"
          - "'output_cost_per_token' not in _alibaba.litellm_params"
          - "'input_cost_per_token' not in _free_openrouter.litellm_params"
          - "'output_cost_per_token' not in _free_openrouter.litellm_params"
        fail_msg: "The price-map projection did not render rates or omit the expected no-rate rows."
      vars:
        _fixture_rates: "{{ lookup('file', playbook_dir ~ '/fixtures/model_prices_needed_rows.json') | from_json }}"
        _gemini: >-
          {{ _rates_config.model_list
             | selectattr('model_name', 'equalto', 'hermes-cloud-gemini-routine') | list }}
        _openrouter_cloud: >-
          {{ _rates_config.model_list
             | selectattr('model_name', 'equalto', 'hermes-cloud-openrouter') | list }}
        _codex_api: >-
          {{ _rates_config.model_list
             | selectattr('model_name', 'equalto', 'codex-api') | first }}
        _codex_subscription: >-
          {{ _rates_config.model_list
             | selectattr('model_name', 'equalto', 'codex-subscription') | first }}
        _codex_ci: >-
          {{ _rates_config.model_list
             | selectattr('model_name', 'equalto', 'codex-ci') | first }}
        _alibaba: >-
          {{ _rates_config.model_list
             | selectattr('litellm_params.model', 'search', '^dashscope/') | first }}
        _free_openrouter: >-
          {% set free_model = llm_router_openrouter_models
             | selectattr('in_free_route', 'defined') | first %}
          {{ _rates_config.model_list
             | selectattr('litellm_params.model', 'equalto',
                 free_model.litellm_model_name
                 | default(free_model.provider ~ '/' ~ free_model.upstream_model_id))
             | first }}
