---
# Pins the background-health-check exclusion contract in
# roles/llm_router/templates/config.yaml.j2.
#
# WHY THIS TEST EXISTS. Background health checks are on by default now
# (defaults/main/50-servable.yml), but every llama-swap-backed deployment
# (large + standby, fast + light) sets model_info.disable_background_health_check
# so a probe never spawns/evicts a single-slot resident model. A future edit to
# the template could silently drop that flag from one tier and reintroduce the
# VRAM-churn/hard-hang incident 50-servable.yml documents, without any other
# assert in this role noticing — nothing else inspects model_info.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_background_health_check_exclusion.yml -i localhost, -c local

- name: The rendered config excludes exactly the single-slot tiers from probing
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
    bao_local_llm_secrets: {}
    ai_default_model: mlx-community/Qwen3.8-27B-4bit
    llm_large_serving_host: llm-large
    llm_router_subdomain: "pve.example.test"
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults and registry the way the converge does
      ansible.builtin.import_tasks: tasks/parity_setup.yml

    - name: Render the real proxy config
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}

    - name: Background health checks are on, with the on-demand /health exclusion wired
      ansible.builtin.assert:
        quiet: true
        that:
          - _config.general_settings.background_health_checks == true
          - _config.general_settings.health_check_skip_disabled_background_models == true
        fail_msg: >-
          Expected background_health_checks: true and
          health_check_skip_disabled_background_models: true in general_settings;
          got {{ _config.general_settings }}.
        success_msg: "Background health checks are on with the /health exclusion wired."

    - name: Every llama-swap-backed deployment is excluded from probing
      ansible.builtin.assert:
        quiet: true
        that:
          - _unexcluded_swap_backed | length == 0
        fail_msg: >-
          Deployment(s) {{ _unexcluded_swap_backed }} are backed by the large or
          light tier (both llama-swap, single-slot or VRAM-churn prone) but do
          NOT set model_info.disable_background_health_check: true. A probe
          against these spawns or evicts the resident model — see
          defaults/main/50-servable.yml for the incident this guards against.
        success_msg: >-
          All {{ _swap_backed_names | length }} large/light-tier deployment(s)
          are excluded from probing ({{ _swap_backed_names | join(', ') }}).
      vars:
        _swap_backed_names: >-
          {{ (llm_router_large_models | map(attribute='client_model_id') | list)
             + (llm_router_light_models | map(attribute='client_model_id') | list) }}
        _swap_backed_entries: >-
          {{ _config.model_list
             | selectattr('model_name', 'in', _swap_backed_names) | list }}
        _unexcluded_swap_backed: >-
          {{ _swap_backed_entries
             | rejectattr('model_info.disable_background_health_check', 'defined')
             | map(attribute='model_name') | list
             + _swap_backed_entries
             | selectattr('model_info.disable_background_health_check', 'defined')
             | rejectattr('model_info.disable_background_health_check')
             | map(attribute='model_name') | list }}

    - name: The dedicated vLLM tier stays probeable — no swap, nothing to evict
      ansible.builtin.assert:
        quiet: true
        that:
          - _vllm_entries | length > 0
          - _excluded_vllm | length == 0
        fail_msg: >-
          Expected at least one vLLM-tier deployment, none excluded from
          background health checks; got {{ _vllm_entries | map(attribute='model_name') | list }}
          with {{ _excluded_vllm }} incorrectly excluded. The vLLM guest is a
          single dedicated deployment with nothing to swap or evict, so
          disable_background_health_check should never apply to it.
        success_msg: >-
          The vLLM tier ({{ _vllm_entries | length }} deployment(s)) remains
          probeable.
      vars:
        _vllm_names: "{{ llm_router_vllm_models | map(attribute='client_model_id') | list }}"
        _vllm_entries: >-
          {{ _config.model_list | selectattr('model_name', 'in', _vllm_names) | list }}
        _excluded_vllm: >-
          {{ _vllm_entries
             | selectattr('model_info.disable_background_health_check', 'defined')
             | selectattr('model_info.disable_background_health_check')
             | map(attribute='model_name') | list }}
