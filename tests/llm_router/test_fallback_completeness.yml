---
# Every name a client can route to must have somewhere to go when its first
# deployment fails: at least one fallback rung, one rung as wide as the name it
# backs, and no rung that names nothing.
#
# WHAT IS RENDERED. The fully credentialed config.yaml (tasks/credentialed_render.yml)
# — model_list, router_settings.fallbacks, default_fallbacks,
# context_window_fallbacks and model_group_alias — plus the role deployments
# tasks/seed-roles.yml creates over the API. Role ladders come from the
# rendered router_settings.fallbacks map.
# How a name resolves its rungs: tasks/fallback_completeness_contract.yml.
#
# THE THREE CONTRACTS, each reported by client name:
#   (a) every model group, alias, alias target and seeded role has >= 1
#       general rung, counting default_fallbacks — except the names the role
#       declares fail-fast (cross-modality, local-only, ladder terminals);
#   (b) every chain reaches at least one rung as wide as its primary, unless
#       every other served group that wide comes before the primary in some
#       rendered chain (narrower rungs before it are fine: litellm walks on);
#   (c) every rung names a model group the proxy serves (config model_list
#       or a seeded role deployment).
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_fallback_completeness.yml -i localhost, -c local
- name: Verify every routable name has a complete, wide-enough fallback ladder
  hosts: localhost
  vars_files:
    - ../../inventory/group_vars/all/02-gpu-accelerator.yml
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
        llm_cpu_scaler:
          tags:
            nine_b: fixture-cpu-small
      containers:
        cpu-fixture:
          ip: 127.0.0.1
          tags: [fixture-cpu-small]
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Produce the fully credentialed render
      ansible.builtin.import_tasks: tasks/credentialed_render.yml

    - name: Every role declaring fallbacks has a rendered router_settings entry
      ansible.builtin.assert:
        quiet: true
        that:
          - _roles_with_fallbacks | difference(_rendered_fallback_keys) | length == 0
        fail_msg: >-
          Role(s) {{ _roles_with_fallbacks | difference(_rendered_fallback_keys) }}
          declare fallback ladders but are absent from router_settings.fallbacks.
      vars:
        _roles_with_fallbacks: >-
          {{ llm_router_role_deployments | selectattr('fallbacks')
             | map(attribute='role') | list }}
        _rendered_fallback_keys: >-
          {{ _config.router_settings.fallbacks | default([])
             | map('dict2items') | flatten | map(attribute='key') | list }}

    - name: Role fallback entries keep declared order and drop unrendered models
      ansible.builtin.assert:
        quiet: true
        that:
          - _role_fallback_mismatches | length == 0
        fail_msg: >-
          Rendered role fallback entries differ from their declared ladders
          filtered to rendered models: {{ _role_fallback_mismatches }}.
      vars:
        _rendered_model_names: "{{ _config.model_list | map(attribute='model_name') | unique | list }}"
        _rendered_fallback_map: >-
          {{ dict(_config.router_settings.fallbacks | default([])
             | map('dict2items') | flatten | map(attribute='key')
             | zip(_config.router_settings.fallbacks | default([])
               | map('dict2items') | flatten | map(attribute='value'))) }}
        _role_fallback_mismatches: >-
          {%- set ns = namespace(bad=[]) -%}
          {%- for role in llm_router_role_deployments if role.fallbacks | length > 0 -%}
          {%- set expected = role.fallbacks | select('in', _rendered_model_names) | list -%}
          {%- if _rendered_fallback_map.get(role.role, none) != expected -%}
          {%- set ns.bad = ns.bad + [role.role ~ ' expected ' ~ expected
                ~ ' got ' ~ _rendered_fallback_map.get(role.role, '<missing>')] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.bad }}

    - name: Role map additions do not change scoped virtual-key fallback names
      ansible.builtin.assert:
        quiet: true
        that:
          - _private_fallback_names == _base_fallback_names
          - _oss_fallback_names == _base_fallback_names
        fail_msg: >-
          The scoped key projections must retain the pre-role fallback-map
          names: base={{ _base_fallback_names }}, private={{ _private_fallback_names }},
          OSS={{ _oss_fallback_names }}.
      vars:
        _base_fallback_names: "{{ _llm_router_fallback_map_base_source.keys() | list | sort }}"
        _private_fallback_names: >-
          {{ llm_router_review_key_fallbacks.private
             | map('dict2items') | flatten | map(attribute='key') | list | sort }}
        _oss_fallback_names: >-
          {{ llm_router_review_key_fallbacks.oss
             | map('dict2items') | flatten | map(attribute='key') | list | sort }}

    - name: Check every routable name's ladder
      ansible.builtin.import_tasks: tasks/fallback_completeness_contract.yml

    - name: Entries marked ladder false never appear in a fallback ladder
      ansible.builtin.assert:
        quiet: true
        that:
          - _ladder_off | length > 0
          - _ladder_off | select('in', llm_router_d1_ladder_groups) | list | length == 0
        fail_msg: >-
          {{ _ladder_off | select('in', llm_router_d1_ladder_groups) | list }} is
          marked ladder: false but appears in llm_router_d1_ladder_groups.
        success_msg: "no ladder: false entry is in a fallback ladder"
      vars:
        _ladder_off: >-
          {{ llm_router_registry_enabled | selectattr('ladder', 'defined')
             | rejectattr('ladder') | map(attribute='client_model_id') | list }}
