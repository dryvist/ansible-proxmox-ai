---
# Pins that every LOCAL deployment carries an in-flight admission cap, so the
# router queues excess work instead of forwarding it to a backend that refuses
# it.
#
# WHY THIS TEST EXISTS. Until 2026-08 `rpm`, `tpm` and `max_parallel_requests`
# were set on the OpenRouter egress tier ONLY. No local deployment carried a
# ceiling of any kind, so LiteLLM admitted every inbound request and forwarded
# it to an mlx-lm-server running `--decode-concurrency 2 --prompt-concurrency 2`.
# That backend accepts 2 in-flight and 429s the remainder INSTANTLY.
#
# Measured on the live fabric 2026-08-15 over a 6h window: 12,201.6 s of model
# time against 43,200 slot-seconds — ~28% utilisation — while 51-234 requests
# per hour were rejected. The tier was never busy, it was UNBUFFERED, and every
# agent-mode Hermes cron had been dying on its first call since 2026-08-07.
#
# The failure was invisible for eight days for a reason worth restating: a
# refused request occupies no slot and emits no latency row, so precisely the
# traffic that is failing is absent from both utilisation and latency stats.
# "Low utilisation" was not headroom, it was the symptom.
#
# It is also invisible to ansible-lint and --syntax-check: the render succeeds
# with or without the cap. Only the RENDERED config shows it, which is what this
# test inspects — the same reason test_openrouter_allowlist.yml exists.
#
# Run (from the REPO ROOT — the registry load resolves the llm_router role
# through ansible.cfg's cwd-relative roles_path):
#   ansible-playbook tests/llm_router/test_local_admission_cap.yml -i localhost, -c local
- name: Verify local deployments carry an in-flight admission cap
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: "pve.example.test"
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the fabric model registry the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Render the real config.yaml.j2 template into a string
      ansible.builtin.set_fact:
        _rendered_config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') }}"

    - name: Parse the rendered config as YAML
      ansible.builtin.set_fact:
        _config: "{{ _rendered_config | from_yaml }}"

    # Local = anything pointed at a backend THIS FABRIC runs, matched against
    # the role's own base-URL variables rather than a substring.
    #
    # It was `search('llm-large')` until 2026-09-02, and that is why the light
    # and vLLM tiers shipped with no admission cap at all while this test
    # reported "all local deployments carry an admission cap". Their api_base
    # names a different host, so the selector silently dropped them and the
    # assertion passed over a two-thirds-empty set — a false green, not a gap
    # in coverage anyone could see from the result.
    #
    # Deriving the set from the variables that RENDER the deployments means a
    # new local backend is in scope the moment it is added, instead of being
    # invisible until someone remembers to widen a regex.
    #
    # Two exclusions remain: the OpenRouter/cloud tiers carry their own ceilings
    # (tuned for paid egress rate, not backend in-flight capacity), and the "*"
    # passthrough shares an api_base but has its OWN knob, asserted separately
    # below. Leaving the wildcard in made the value assertion fail with [1, 2]
    # on first run — the test finding its own selector bug.
    - name: Select every deployment pointed at a local backend
      ansible.builtin.set_fact:
        _local: >-
          {{ _config.model_list
             | selectattr('litellm_params.api_base', 'defined')
             | selectattr('litellm_params.api_base', 'in', _local_base_urls)
             | rejectattr('model_name', 'equalto', '*')
             | list }}
      vars:
        _local_base_urls: >-
          {{ [llm_router_llm_large_base_url,
              llm_router_llm_fast_base_url,
              llm_router_llm_light_base_url,
              llm_router_llm_vllm_base_url]
             + ([llm_router_llm_large_standby_base_url]
                if llm_router_llm_large_standby_base_url | length > 0 else []) }}

    - name: The test is not vacuous — local deployments actually rendered
      # Without this an empty selection would satisfy every assertion below and
      # report success while proving nothing. The same trap the OpenRouter
      # allowlist test guards with its key seeding.
      ansible.builtin.assert:
        quiet: true
        that:
          - _local | length > 0
        fail_msg: >-
          No local deployments rendered, so the assertions below would pass
          vacuously. The registry or the render is broken, not the cap.
        success_msg: "{{ _local | length }} local deployment(s) rendered"

    - name: Every local deployment carries max_parallel_requests
      ansible.builtin.assert:
        quiet: true
        that:
          - _uncapped | length == 0
        fail_msg: >-
          {{ _uncapped | length }} local deployment(s) render with no
          max_parallel_requests ({{ _uncapped | join(', ') }}). LiteLLM will
          admit unbounded concurrency and forward it to a backend that serves
          one request at a time, which refuses the excess INSTANTLY rather than
          queueing. That is the 2026-08-07 agent-cron outage.
        success_msg: "all {{ _local | length }} local deployment(s) carry an admission cap"
      vars:
        _uncapped: >-
          {{ _local
             | rejectattr('litellm_params.max_parallel_requests', 'defined')
             | map(attribute='model_name') | list }}

    # A6: a large-tier registry entry may declare its OWN max_parallel_requests
    # (mirroring that model's host effectiveConcurrency) instead of inheriting
    # the tier-wide default — so the expected value is looked up PER DEPLOYMENT
    # from the registry, not pinned to one shared literal. Every large-tier
    # entry declares one today (all 1, ground truth as of 2026-09-02), so this
    # still fails on a value that drifts from what the registry actually says.
    - name: Each local deployment's cap matches its own registry declaration
      ansible.builtin.assert:
        quiet: true
        that:
          - _mismatched | length == 0
        fail_msg: >-
          Local deployment(s) render max_parallel_requests that disagree with
          their own registry declaration (or the tier-wide default when none is
          declared): {{ _mismatched }}.
        success_msg: >-
          All {{ _local | length }} local deployment(s) carry the
          max_parallel_requests their own registry entry declares (or the
          tier-wide default).
      vars:
        _expected_by_name: >-
          {%- set ns = namespace(pairs=[]) -%}
          {%- for m in llm_router_registry_enabled -%}
          {%- if ns.pairs | selectattr('n', 'equalto', m.client_model_id) | list | length == 0 -%}
          {%- set ns.pairs = ns.pairs + [{'n': m.client_model_id,
                'v': m.max_parallel_requests | default(llm_router_local_max_parallel_requests) | int}] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ dict(ns.pairs | map(attribute='n') | zip(ns.pairs | map(attribute='v'))) }}
        _mismatched: >-
          {%- set ns = namespace(bad=[]) -%}
          {%- for d in _local -%}
          {%- set _rendered = d.litellm_params.max_parallel_requests | int -%}
          {%- set _default = llm_router_local_max_parallel_requests | int -%}
          {%- set _expected = _expected_by_name[d.model_name] | default(_default) -%}
          {%- if _rendered != _expected -%}
          {%- set ns.bad = ns.bad + [d.model_name ~ ' rendered=' ~ _rendered ~ ' expected=' ~ _expected] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.bad }}

    # The pool multiplies this. Three members each hold an INDEPENDENT
    # asyncio.Semaphore (LiteLLM caches it local_only=True, so redis cannot
    # share it), meaning the estate-wide ceiling is 3x whatever renders here.
    # At 1 that is 3 against a 2-slot backend — a deliberate 1-over overcommit,
    # because no integer makes three independent semaphores sum to 2. At 2 it
    # would be 6, which is the original defect with extra steps.
    # A6: per-model registry values can now diverge from the tier-wide
    # default, so the pool-ceiling bound is checked against EVERY distinct
    # value the large tier declares (the default itself, plus each entry's
    # own max_parallel_requests), not the default alone.
    - name: No local admission cap, tier default or per-model, exceeds the pool bound
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_local_max_parallel_requests | int >= 1
          - _over_bound | length == 0
        fail_msg: >-
          Cap(s) over 1 declared: {{ _over_bound }}. Three pool members each
          hold an independent in-process semaphore, so the backend sees 3x
          whichever model's cap this is. Raising it is not a capacity
          improvement — it restores the unbuffered flood this cap exists to
          stop. If a model's host effectiveConcurrency has genuinely
          increased, update its registry entry WITH the measurement that
          justifies it, and re-derive this bound alongside it.
        success_msg: >-
          Tier default and every per-model large-tier cap are each <= 1
          (pool ceiling 3 per model against a 1-slot backend).
      vars:
        _large_tier_values: >-
          {{ llm_router_registry_enabled
             | selectattr('tier', 'equalto', 'large')
             | selectattr('max_parallel_requests', 'defined')
             | map(attribute='max_parallel_requests') | map('int') | unique | list }}
        _over_bound: >-
          {{ ([llm_router_local_max_parallel_requests | int] + _large_tier_values)
             | select('gt', 1) | list }}

    - name: The passthrough wildcard is capped independently when enabled
      # Separate knob on purpose: LiteLLM keys the semaphore per DEPLOYMENT and
      # the wildcard is one deployment fronting every untuned model, so its
      # value serialises them against each other. 0 disables the cap entirely.
      ansible.builtin.assert:
        quiet: true
        that:
          - _wild | length == 0
            or llm_router_passthrough_max_parallel_requests | int == 0
            or _wild[0].litellm_params.max_parallel_requests | int
              == llm_router_passthrough_max_parallel_requests | int
        fail_msg: >-
          The "*" passthrough deployment does not carry
          llm_router_passthrough_max_parallel_requests
          ({{ llm_router_passthrough_max_parallel_requests }}). Uncapped, the
          zero-config tier floods the same backend the tuned brain and judge
          depend on.
        success_msg: "passthrough wildcard cap agrees with its own knob"
      vars:
        _wild: >-
          {{ _config.model_list | selectattr('model_name', 'equalto', '*') | list }}
