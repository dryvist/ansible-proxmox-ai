---
# The Hindsight key checks each fallback target against its model allowlist and
# effective tags, then excludes free or retaining deployments.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_hindsight_key_zdr_isolation.yml -i localhost, -c local
- name: Verify the hindsight key cannot reach a retaining/free deployment
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_apps_secrets:
      hindsight_llm_router_key: sk-fixture-hindsight
    bao_local_llm_secrets:
      OPENROUTER_API_KEY: test-openrouter-provider-key
      OPENCODE_API_KEY: test-opencode-provider-key
      OPENAI_API_KEY: test-openai-provider-key
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hermes_goal_judge_model: judge
    hindsight_retain_model: "{{ llm_router_small_model }}"
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Select the vLLM-off render
      ansible.builtin.set_fact:
        llm_router_llm_vllm_enabled: false
        llm_router_vllm_precheck_passed: false

    - name: Render the fully credentialed config without the vLLM rung
      ansible.builtin.set_fact:
        _config_vllm_off: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}
        _keys_vllm_off: "{{ llm_router_virtual_keys }}"

    - name: Select the vLLM-on render
      ansible.builtin.set_fact:
        llm_router_llm_vllm_enabled: true
        llm_router_vllm_precheck_passed: true

    - name: Render the fully credentialed config with the vLLM rung
      ansible.builtin.set_fact:
        _config_vllm_on: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}
        _keys_vllm_on: "{{ llm_router_virtual_keys }}"

    - name: Pair each render with its effective key catalog
      ansible.builtin.set_fact:
        _render_cases:
          - name: vLLM off
            config: "{{ _config_vllm_off }}"
            catalog: "{{ _keys_vllm_off }}"
          - name: vLLM on
            config: "{{ _config_vllm_on }}"
            catalog: "{{ _keys_vllm_on }}"

    - name: The hindsight key is scoped to exactly the inventory's retain model
      ansible.builtin.assert:
        quiet: true
        that:
          - _hindsight_key.models == [llm_router_small_capability_name]
          - "'&zdr' in _hindsight_key.tags"
          - "'!free' in _hindsight_key.tags"
          - "'!retains' in _hindsight_key.tags"
          - _effective_key_tags | select('match', '^&sensitivity:') | list | length == 1
          - _hindsight_key.router_settings.enable_tag_filtering | bool
        fail_msg: >-
          Expected the hindsight key scoped to exactly [{{ hindsight_retain_model }}], got
          {{ _hindsight_key.models }} tags={{ _effective_key_tags }} —
          a wider scope or missing key constraint can reach a retaining deployment.
        success_msg: >-
          hindsight key models={{ _hindsight_key.models }} effective_tags={{ _effective_key_tags }}.
      vars:
        _hindsight_key: "{{ item.catalog | selectattr('alias', 'equalto', 'hindsight') | first }}"
        _effective_key_tags: >-
          {{ (_hindsight_key.tags | default([]))
             + [_hindsight_key.sensitivity_tag | default('&sensitivity:sensitive')] }}
      loop: "{{ _render_cases }}"
      loop_control:
        label: "{{ item.name }}"

    - name: No tag-compatible hosted group reachable from Hindsight is retaining or free
      ansible.builtin.assert:
        quiet: true
        that:
          - _unsafe_group_names | length > 0
          - _reachable_unsafe | length == 0
        fail_msg: >-
          The hindsight key can reach retaining/free deployment(s): {{ _reachable_unsafe }}.
          Blocked paths/hops (key, path, deployment tags, blocked layer)={{ _blocked_hops }};
          compatible hosted groups are {{ _reachable }}.
        success_msg: >-
          The hindsight key's scope ({{ _hindsight_key.models }}) reaches
          only tag-compatible hosted groups {{ _reachable }} via paths={{ _tagged_hosted_reaches }},
          none of the deployments retaining/free ({{ _unsafe_group_names }}). Blocked paths/hops
          (key, path, deployment tags, blocked layer)={{ _blocked_hops }}.
      vars:
        _config: "{{ item.config }}"
        _hindsight_key: "{{ item.catalog | selectattr('alias', 'equalto', 'hindsight') | first }}"
        _key_models: "{{ _hindsight_key.models | default([]) | unique | list }}"
        _effective_key_tags: >-
          {{ (_hindsight_key.tags | default([]))
             + [_hindsight_key.sensitivity_tag | default('&sensitivity:sensitive')] }}
        _model_aliases: "{{ _config.router_settings.model_group_alias | default({}) }}"
        _unsafe_group_names: "{{ llm_router_zdr_unasserted_terminal_rungs }}"
        _fallbacks_by_key: >-
          {{ dict(_config.router_settings.fallbacks | default([])
                  | map('dict2items') | flatten | map(attribute='key')
                  | zip(_config.router_settings.fallbacks | default([])
                        | map('dict2items') | flatten | map(attribute='value'))) }}
        _cwf_by_key: >-
          {{ dict((_config.router_settings.context_window_fallbacks | default([]))
                  | map('dict2items') | flatten | map(attribute='key')
                  | zip((_config.router_settings.context_window_fallbacks | default([]))
                        | map('dict2items') | flatten | map(attribute='value'))) }}
        # BFS checks each target against Hindsight's model list, effective tags,
        # and at least one matching rendered deployment.
        _graph_reaches: >-
          {%- set ns = namespace(seen=[], frontier=[], paths=[], blocked=[]) -%}
          {%- for start in _key_models -%}
          {%- set ns.seen = ns.seen + [start] -%}
          {%- set ns.frontier = ns.frontier + [{'name': start, 'path': [start]}] -%}
          {%- if start in _hosted_names -%}
          {%- set _ = ns.paths.append({
                'key': _hindsight_key.alias, 'key_models': _key_models,
                'key_tags': _effective_key_tags, 'group': start,
                'path': [start], 'passed_layers': ['key models allowlist']}) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- for _ in range(0, 12) -%}
          {%- set next = namespace(nodes=[]) -%}
          {%- for node in ns.frontier -%}
          {%- for target in (_fallbacks_by_key.get(
                node.name, _config.router_settings.default_fallbacks | default([])) | list)
                + (_cwf_by_key.get(node.name, []) | list) -%}
          {%- if target not in ns.seen -%}
          {%- set ns.seen = ns.seen + [target] -%}
          {%- set path = node.path + [target] -%}
          {%- set resolved_target = _model_aliases.get(target, target) -%}
          {%- set model_access = namespace(allowed=(_key_models | length == 0
                or '*' in _key_models or 'all-proxy-models' in _key_models
                or 'all-team-models' in _key_models)) -%}
          {%- for allowed_model in _key_models -%}
          {%- if target == allowed_model or resolved_target == allowed_model -%}
          {%- set model_access.allowed = true -%}
          {%- elif '*' in allowed_model -%}
          {%- set pattern = '^' ~ (allowed_model | replace('*', '.*')) ~ '$' -%}
          {%- if target is match(pattern) or resolved_target is match(pattern) -%}
          {%- set model_access.allowed = true -%}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set required_tags = _effective_key_tags | select('match', '^&.+$')
                | map('regex_replace', '^&', '') | list -%}
          {%- set excluded_tags = _effective_key_tags | select('match', '^!.+$')
                | map('regex_replace', '^!', '') | list -%}
          {%- set deployments = namespace(rows=[], compatible=[]) -%}
          {%- for deployment in _config.model_list
                | selectattr('model_name', 'equalto', resolved_target) | list -%}
          {%- set deployment_tags = deployment.litellm_params.tags | default([]) -%}
          {%- set _ = deployments.rows.append({'tags': deployment_tags}) -%}
          {%- if required_tags | difference(deployment_tags) | length == 0
                and excluded_tags | intersect(deployment_tags) | length == 0 -%}
          {%- set _ = deployments.compatible.append({'tags': deployment_tags}) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- if _effective_key_tags | length == 0 -%}
          {%- set defaults = namespace(rows=[]) -%}
          {%- for deployment in deployments.compatible if 'default' in deployment.tags -%}
          {%- set _ = defaults.rows.append(deployment) -%}
          {%- endfor -%}
          {%- if defaults.rows | length > 0 -%}
          {%- set deployments.compatible = defaults.rows -%}
          {%- endif -%}
          {%- endif -%}
          {%- if not model_access.allowed or deployments.compatible | length == 0 -%}
          {%- set blocked_by = namespace(layers=[]) -%}
          {%- if not model_access.allowed -%}
          {%- set blocked_by.layers = blocked_by.layers + ['key models allowlist'] -%}
          {%- endif -%}
          {%- if deployments.compatible | length == 0 -%}
          {%- set blocked_by.layers = blocked_by.layers + ['sensitivity tag filter'] -%}
          {%- endif -%}
          {%- set _ = ns.blocked.append({
                'key': _hindsight_key.alias, 'key_models': _key_models,
                'key_tags': _effective_key_tags, 'group': target,
                'resolved_group': resolved_target, 'path': path,
                'deployment_tags': deployments.rows | map(attribute='tags') | list,
                'compatible_deployment_tags': deployments.compatible | map(attribute='tags') | list,
                'blocked_by': blocked_by.layers}) -%}
          {%- else -%}
          {%- set next.nodes = next.nodes + [{'name': target, 'path': path}] -%}
          {%- if resolved_target in _hosted_names -%}
          {%- for deployment in deployments.compatible -%}
          {%- set _ = ns.paths.append({
                'key': _hindsight_key.alias, 'key_models': _key_models,
                'key_tags': _effective_key_tags, 'group': resolved_target,
                'path': path, 'deployment_tags': deployment.tags,
                'passed_layers': ['key models allowlist', 'sensitivity tag filter']}) -%}
          {%- endfor -%}
          {%- endif -%}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {%- set ns.frontier = next.nodes -%}
          {%- endfor -%}
          {{ {'paths': ns.paths, 'blocked': ns.blocked} }}
        _tagged_hosted_reaches: >-
          {%- set out = namespace(reaches=[]) -%}
          {%- set required_tags = _effective_key_tags
                | select('match', '^&.+$') | map('regex_replace', '^&', '') | list -%}
          {%- set excluded_tags = _effective_key_tags
                | select('match', '^!.+$') | map('regex_replace', '^!', '') | list -%}
          {%- for reach in _graph_reaches.paths -%}
          {%- set candidates = namespace(deployments=[]) -%}
          {%- for deployment in _config.model_list
                | selectattr('model_name', 'equalto', _model_aliases.get(reach.group, reach.group)) | list -%}
          {%- set deployment_tags = deployment.litellm_params.tags | default([]) -%}
          {%- if required_tags | difference(deployment_tags) | length == 0
                and excluded_tags | intersect(deployment_tags) | length == 0 -%}
          {%- set _ = candidates.deployments.append({'tags': deployment_tags}) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- if _effective_key_tags | length == 0 -%}
          {%- set defaults = namespace(deployments=[]) -%}
          {%- for deployment in candidates.deployments if 'default' in deployment.tags -%}
          {%- set _ = defaults.deployments.append(deployment) -%}
          {%- endfor -%}
          {%- if defaults.deployments | length > 0 -%}
          {%- set candidates.deployments = defaults.deployments -%}
          {%- endif -%}
          {%- endif -%}
          {%- for deployment in candidates.deployments -%}
          {%- set _ = out.reaches.append(reach | combine({
                'deployment_tags': deployment.tags,
                'passed_layers': ['key models allowlist', 'sensitivity tag filter']})) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ out.reaches }}
        _tag_blocked_start_paths: >-
          {%- set out = namespace(blocked=[]) -%}
          {%- for reach in _graph_reaches.paths if reach.path | length == 1 -%}
          {%- set required_tags = _effective_key_tags | select('match', '^&.+$')
                | map('regex_replace', '^&', '') | list -%}
          {%- set excluded_tags = _effective_key_tags | select('match', '^!.+$')
                | map('regex_replace', '^!', '') | list -%}
          {%- set deployments = namespace(rows=[], compatible=[]) -%}
          {%- for deployment in _config.model_list
                | selectattr('model_name', 'equalto', _model_aliases.get(reach.group, reach.group)) | list -%}
          {%- set deployment_tags = deployment.litellm_params.tags | default([]) -%}
          {%- set _ = deployments.rows.append({'tags': deployment_tags}) -%}
          {%- if required_tags | difference(deployment_tags) | length == 0
                and excluded_tags | intersect(deployment_tags) | length == 0 -%}
          {%- set _ = deployments.compatible.append({'tags': deployment_tags}) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- if deployments.compatible | length == 0 -%}
          {%- set _ = out.blocked.append({
                'key': _hindsight_key.alias, 'key_models': _key_models,
                'key_tags': _effective_key_tags, 'group': reach.group,
                'resolved_group': _model_aliases.get(reach.group, reach.group),
                'path': reach.path,
                'deployment_tags': deployments.rows | map(attribute='tags') | list,
                'compatible_deployment_tags': [],
                'blocked_by': ['sensitivity tag filter']}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out.blocked }}
        # Hosted terminal rungs plus every retaining or free group: a group in either
        # set is checked against the key tags, so a non-terminal unsafe group is
        # never skipped.
        _hosted_names: >-
          {{ (llm_router_external_terminal_rungs + llm_router_zdr_unasserted_terminal_rungs)
             | unique | list }}
        _reachable: >-
          {{ ((_graph_reaches.paths | rejectattr('group', 'in', _hosted_names)
                | map(attribute='group') | list)
              + (_tagged_hosted_reaches | map(attribute='group') | list)) | unique | list }}
        _reachable_unsafe: >-
          {{ _tagged_hosted_reaches | selectattr('group', 'in', _unsafe_group_names) | list }}
        _blocked_hops: >-
          {{ _graph_reaches.blocked + _tag_blocked_start_paths }}
      loop: "{{ _render_cases }}"
      loop_control:
        label: "{{ item.name }}"
