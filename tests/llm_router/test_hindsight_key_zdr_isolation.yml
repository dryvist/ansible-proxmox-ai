---
# The Hindsight key checks each fallback target against its model allowlist and
# effective tags, then excludes free or retaining deployments.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_hindsight_key_zdr_isolation.yml -i localhost, -c local
- name: Verify the hindsight key cannot reach a retaining/free deployment
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    hindsight_service_enabled: true
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_apps_secrets:
      hindsight_llm_router_key: sk-fixture-hindsight
    bao_local_llm_secrets:
      OPENROUTER_API_KEY: test-openrouter-provider-key
      OPENCODE_API_KEY: test-opencode-provider-key
      OPENAI_API_KEY: test-openai-provider-key
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_goal_judge_model: judge
  tasks:
    - name: Load source inventory model selections without retyping registry aliases
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../inventory/group_vars/all/00-core.yml"
        name: _source_inventory

    - name: Set the Hindsight selectors from inventory
      ansible.builtin.set_fact:
        hermes_brain_model: "{{ _source_inventory.hermes_brain_model }}"
        hindsight_retain_model: "{{ _source_inventory.hindsight_retain_model }}"
        llm_router_hindsight_key_model: "{{ _source_inventory.hindsight_retain_model }}"

    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Select the vLLM-off render
      ansible.builtin.set_fact:
        llm_router_llm_vllm_enabled: false
        llm_router_vllm_precheck_passed: false

    - name: Refresh the router projections without the vLLM rung
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Render the fully credentialed config without the vLLM rung
      ansible.builtin.set_fact:
        _config_vllm_off: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}
        _keys_vllm_off: "{{ llm_router_virtual_keys }}"

    - name: Select the vLLM-on render
      ansible.builtin.set_fact:
        llm_router_llm_vllm_enabled: true
        llm_router_vllm_precheck_passed: true

    - name: Refresh the router projections with the vLLM rung
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Render the fully credentialed config with the vLLM rung
      ansible.builtin.set_fact:
        _config_vllm_on: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}
        _keys_vllm_on: "{{ llm_router_virtual_keys }}"

    - name: Pair each render with its effective key catalog
      ansible.builtin.set_fact:
        _render_cases:
          - name: vLLM off
            config: "{{ _config_vllm_off }}"
            catalog: "{{ _keys_vllm_off }}"
          - name: vLLM on
            config: "{{ _config_vllm_on }}"
            catalog: "{{ _keys_vllm_on }}"

    - name: Hindsight retain alias shares medium deployments and has an exact empty chain
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_model_group_aliases[hindsight_retain_model] == llm_router_primary_model
          - hindsight_retain_model in llm_router_local_only_fail_fast_names
          - llm_router_primary_model not in llm_router_local_only_fail_fast_names
          - _fallback_by_name[hindsight_retain_model] == []
          - item.config.router_settings.default_fallbacks == llm_router_default_fallbacks
        fail_msg: >-
          Hindsight's selected alias must resolve to medium and fail fast with
          an empty chain, while medium itself stays off the local-only list.
      vars:
        _fallback_entries: "{{ item.config.router_settings.fallbacks | map('dict2items') | flatten }}"
        _fallback_by_name: >-
          {{ dict(_fallback_entries | map(attribute='key')
                  | zip(_fallback_entries | map(attribute='value'))) }}
      loop: "{{ _render_cases }}"
      loop_control:
        label: "{{ item.name }}"

    - name: The hindsight key is scoped to exactly the inventory's retain model
      ansible.builtin.assert:
        quiet: true
        that:
          - _hindsight_key.models == [hindsight_retain_model]
          - "'&zdr' in _hindsight_key.tags"
          - "'!free' in _hindsight_key.tags"
          - "'!retains' in _hindsight_key.tags"
          - _effective_key_tags | select('match', '^&sensitivity:') | list | length == 1
          - _hindsight_key.router_settings.enable_tag_filtering | bool
        fail_msg: >-
          Expected the hindsight key scoped to exactly [{{ hindsight_retain_model }}], got
          {{ _hindsight_key.models }} tags={{ _effective_key_tags }} —
          a wider scope or missing key constraint can reach a retaining deployment.
        success_msg: >-
          hindsight key models={{ _hindsight_key.models }} effective_tags={{ _effective_key_tags }}.
      vars:
        _hindsight_key: "{{ item.catalog | selectattr('alias', 'equalto', 'hindsight') | first }}"
        _effective_key_tags: >-
          {{ (_hindsight_key.tags | default([]))
             + [_hindsight_key.sensitivity_tag | default('&sensitivity:sensitive')] }}
      loop: "{{ _render_cases }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Check no tag-compatible hosted group reachable from Hindsight is retaining or free
      ansible.builtin.include_tasks: tasks/hindsight_hosted_reach_contract.yml
