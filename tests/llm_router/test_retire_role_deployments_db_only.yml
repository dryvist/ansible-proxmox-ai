---
# Pins which database-stored deployments a converge reverts
# (_llm_router_db_model_reverts, defaults/main/76-drift.yml): a DB row that
# shadows a declared alias or a config deployment, or that no Git declaration
# tracks, is reverted (an untracked row only when
# llm_router_db_model_revert_untracked is on); a declared role is kept; a config-declared row is never
# a delete candidate (it can't be deleted through the API, and the final
# assert in retire-role-deployments.yml reports a config alias collision).
# Also pins the /v2/model/info read: /model/info appends one synthetic row per
# declared model_group_alias (Semaphore task 186, 2026-09-14), so reading it
# made every alias look shadowed.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_retire_role_deployments_db_only.yml -i localhost, -c local

- name: Only database rows Git does not own are reverted, each with its reason
  hosts: localhost
  gather_facts: false
  vars:
    llm_router_model_group_aliases: {an-alias: catalog-model, fast: auto-router}
    llm_router_role_deployments:
      - {role: subagent, model: catalog-model}
      - {role: fast, model: auto-router}
    _llm_router_model_rows:
      - {model_name: an-alias, model_info: {id: cfg-alias, db_model: false}}
      - {model_name: an-alias, model_info: {id: db-alias, db_model: true}}
      - {model_name: catalog-model, model_info: {id: cfg-model, db_model: false}}
      - {model_name: catalog-model, model_info: {id: db-shadow, db_model: true}}
      - {model_name: subagent, model_info: {id: role-row, db_model: true}}
      - {model_name: fast, model_info: {id: fast-row, db_model: true}}
      - {model_name: ui-added, model_info: {id: ui-row, db_model: true}}
  tasks:
    - name: Load the revert projection
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/llm_router/defaults/main/76-drift.yml"

    - name: Assert the reverted set, in row order
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_db_model_reverts == _expected
        fail_msg: "Expected {{ _expected }}, got {{ _llm_router_db_model_reverts }}"
      vars:
        _expected:
          - {id: db-alias, model_name: an-alias, reason: shadows a declared alias}
          - {id: db-shadow, model_name: catalog-model, reason: shadows a config deployment}
          - {id: fast-row, model_name: fast, reason: shadows a declared alias}
          - {id: ui-row, model_name: ui-added, reason: is not tracked in Git}

    - name: Assert untracked rows are kept by default
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_db_model_deletes | map(attribute='id') | list == ['db-alias', 'db-shadow', 'fast-row']
        fail_msg: "Expected the default delete set to skip ui-row, got {{ _llm_router_db_model_deletes }}"

    # include_vars outranks task vars, so the switch is flipped with set_fact.
    - name: Turn on reverting untracked rows
      ansible.builtin.set_fact:
        llm_router_db_model_revert_untracked: true

    - name: Assert the switch adds the untracked row to the delete set
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_db_model_deletes | map(attribute='id') | list == ['db-alias', 'db-shadow', 'fast-row', 'ui-row']
        fail_msg: "Expected ui-row deleted with the switch on, got {{ _llm_router_db_model_deletes }}"

- name: Nothing is reverted when every database row is a declared role
  hosts: localhost
  gather_facts: false
  vars:
    llm_router_model_group_aliases: {an-alias: catalog-model}
    llm_router_role_deployments:
      - {role: subagent, model: catalog-model}
    _llm_router_model_rows:
      - {model_name: an-alias, model_info: {id: cfg-alias, db_model: false}}
      - {model_name: subagent, model_info: {id: role-row, db_model: true}}
  tasks:
    - name: Load the revert projection
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/llm_router/defaults/main/76-drift.yml"

    - name: Assert no row is reverted
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_db_model_reverts == []
        fail_msg: "Expected [], got {{ _llm_router_db_model_reverts }}"

- name: Verify the reads use paged /v2/model/info, not the alias-projecting v1 endpoint
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
  tasks:
    - name: Read the model-row reader and the retire task sources
      ansible.builtin.slurp:
        src: "{{ _role_dir }}/tasks/{{ item }}"
      loop: [read-model-rows.yml, retire-role-deployments.yml]
      register: _sources

    - name: Assert the reader pages /v2/model/info and the retire task reads through it twice
      ansible.builtin.assert:
        quiet: true
        that:
          - "(_reader | regex_findall('/v2/model/info\\?page=')) | length == 2"
          - "'/model/info\"' not in _reader"
          - "(_retire | regex_findall('import_tasks: read-model-rows.yml')) | length == 2"
        fail_msg: "The model-row reader or retire-role-deployments.yml no longer matches the paged /v2/model/info shape"
      vars:
        _reader: "{{ _sources.results[0].content | b64decode }}"
        _retire: "{{ _sources.results[1].content | b64decode }}"
