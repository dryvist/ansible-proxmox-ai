---
# The recorder fails fast; the judge uses the shared, ZDR-filtered ladder.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_local_only_no_hosted_fallback.yml -i localhost, -c local
- name: Verify recorder isolation and judge ZDR fallback access
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_apps_secrets:
      github_actions_llm_router_key: sk-fixture-gha
      github_actions_oss_llm_router_key: sk-fixture-gha-oss
      judge_llm_router_key: sk-fixture-judge
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: "pve.example.test"
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: "http://otel.example.test:4318"
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
    bao_local_llm_secrets:
      OPENROUTER_API_KEY: sk-or-fixture
      OPENROUTER_HERMES_KEY: sk-orh-fixture
      OPENAI_API_KEY: sk-oa-fixture
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the fabric model registry the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Model the trusted callers these projections assume
      ansible.builtin.import_tasks: "{{ playbook_dir }}/tasks/trust_fixture_callers.yml"

    - name: Render config.yaml.j2 with every credential present
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: The recorder fails fast while judge uses the standard ZDR chain
      ansible.builtin.assert:
        quiet: true
        that:
          - _local_roles == [_recorder.role]
          - _local_roles | difference(_fallback_names) | length == 0
          - _nonempty | length == 0
          - _judge.fallbacks == llm_router_d1_zdr_ladder_groups
          # Database-seeded roles carry their own chains, not global entry-point keys.
          - _judge.role not in _fallback_names
          - _judge.fallbacks | length <= llm_router_max_fallbacks | int
          - _judge.fallbacks | intersect(_unsafe_rungs) | length == 0
          - _judge_key.allowed_classes == _llm_router_consumer_classes_zdr
          - >-
            (_judge_key.models | unique | sort)
            == (([llm_router_small_model, llm_router_small_capability_name, _judge.role]
                 + llm_router_d1_zdr_ladder_groups) | unique | sort)
          - "'&zdr' in _judge_key.tags"
          - "'!free' in _judge_key.tags"
          - "'!retains' in _judge_key.tags"
          - "'&local' not in _judge_key.tags"
        fail_msg: >-
          recorder={{ _recorder }}, judge={{ _judge }}, judge key={{ _judge_key }}.
        success_msg: "Recorder stays local-only and judge reaches only the standard ZDR chain."
      vars:
        _local_roles: >-
          {{ llm_router_role_deployments | selectattr('fallbacks', 'equalto', [])
             | map(attribute='role') | list }}
        _recorder: >-
          {{ llm_router_role_deployments
             | selectattr('litellm_params.turn_off_message_logging', 'defined') | first }}
        _judge: >-
          {{ llm_router_role_deployments
             | selectattr('role', 'equalto', hermes_goal_judge_model) | first }}
        _judge_key: >-
          {{ llm_router_virtual_keys | selectattr('alias', 'equalto', _judge.role) | first }}
        _fallback_entries: "{{ _config.router_settings.fallbacks | map('dict2items') | flatten }}"
        _fallback_names: "{{ _fallback_entries | map(attribute='key') | list }}"
        _fallback_map: >-
          {{ dict(_fallback_entries | map(attribute='key') | zip(_fallback_entries | map(attribute='value'))) }}
        _unsafe_rungs: >-
          {{ llm_router_d1_rungs_by_class['free']
             + llm_router_d1_rungs_by_class['retains'] }}
        _nonempty: >-
          {{ _fallback_entries | selectattr('key', 'in', _local_roles)
             | rejectattr('value', 'equalto', []) | map(attribute='key') | list }}

    - name: The judge role turns thinking off so a one-word verdict fits a 4-token reply
      ansible.builtin.assert:
        quiet: true
        that:
          - _judge.litellm_params.extra_body.chat_template_kwargs.enable_thinking is sameas false
        fail_msg: "judge role: {{ _judge }}"
        success_msg: "judge disables thinking."
      vars:
        _judge: "{{ llm_router_role_deployments | selectattr('role', 'equalto', 'judge') | first }}"

    - name: No local-only name reaches a hosted rung through default_fallbacks or any chain
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_default_fallbacks | length > 0
          - llm_router_default_fallbacks | intersect(_local_roles) | length == 0
          - _hosted_reach | length == 0
        fail_msg: "Local-only names with a hosted fallback: {{ _hosted_reach }}"
        success_msg: "No local-only name has a hosted fallback."
      vars:
        _local_roles: >-
          {{ llm_router_role_deployments | selectattr('fallbacks', 'equalto', [])
             | map(attribute='role') | list }}
        _hosted_reach: >-
          {{ _config.router_settings.fallbacks | map('dict2items') | flatten
             | selectattr('key', 'in', _local_roles)
             | map(attribute='value') | flatten
             | intersect(llm_router_external_terminal_rungs) | list }}
