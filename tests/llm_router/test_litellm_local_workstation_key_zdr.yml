---
- name: Verify the workstation local key has exactly the three local capabilities
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_apps_secrets:
      litellm_local_workstation_llm_router_key: sk-fixture-workstation
    bao_local_llm_secrets: {}
    llm_router_subdomain: pve.example.test
    llm_large_serving_host: llm-large
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    hermes_brain_model: "{{ llm_router_primary_model }}"
    hindsight_retain_model: "{{ llm_router_small_model }}"
  tasks:
    - name: Load defaults and the model registry
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load registry projections
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: The workstation key is local-only with explicit local policy
      ansible.builtin.assert:
        quiet: true
        that:
          - _key.allowed_classes == ['local']
          - _key.models | sort == _capability_names | sort
          - _key.models | intersect(_cloud_groups) | length == 0
          - _key.models_authoritative | bool
          - _key.tags == ['&zdr', '!free', '!retains']
          - _key.router_settings.enable_tag_filtering | bool
        fail_msg: "workstation key={{ _key }} cloud groups={{ _cloud_groups }}"
      vars:
        _capability_names: "{{ [llm_router_large_model, llm_router_primary_model, llm_router_small_model] }}"
        _key: "{{ llm_router_virtual_keys | selectattr('alias', 'equalto', 'litellm-local-workstation') | first }}"
        _cloud_groups: >-
          {{ llm_router_d1_group_class_by_name | dict2items
             | rejectattr('value', 'equalto', 'local') | map(attribute='key') | list }}
