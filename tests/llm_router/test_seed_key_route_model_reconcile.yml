---
# Regression/contract test for reconcile-seeded-key-policy.yml's key diff:
# MCP permissions, models, and sensitivity reconcile in every mode; routes
# and other metadata remain rebuild-only, with one update per changed key.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_seed_key_route_model_reconcile.yml -i localhost, -c local

- name: The combined route/model diff updates only the keys that actually changed
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    _seed_keys_file: "{{ _role_dir }}/tasks/seed-keys.yml"
    _create_task_name: "Create the caller keys that have a seeded value (an existing alias is not a failure)"
    _policy_file: "{{ _role_dir }}/tasks/reconcile-seeded-key-policy.yml"
    _diff_task_name: "Compute the key policy update each live key still needs, if any"
    llm_router_seed_mode: rebuild
    llm_router_mcp_default_object_permission:
      mcp_servers: [no-mcp-servers]

    # One /key/list?...&return_full_object=true snapshot covering every case
    # this test exercises:
    #   - steady: live already matches the seed on both fields -> no update.
    #   - widened-routes: seed's allowed_routes differs from live -> one
    #     update carrying BOTH allowed_routes and models (the unchanged
    #     field rides along in the same body).
    #   - malformed-live: a live record with neither allowed_routes nor
    #     models at all — the rejectattr trap. The diff must not crash on
    #     it, and must treat the missing fields as none/[] (fail safe),
    #     the same class of missing-key bug fixed in #945.
    #   - authoritative-narrow: a models_authoritative seed whose live list
    #     carries a name the seed no longer does — must be flagged changed
    #     even though nothing was ADDED, only removed.
    #   - live-only: a live key with no matching llm_router_virtual_keys
    #     entry at all — never a candidate, current behavior preserved.
    #   - null-models: a live record whose `models` key is PRESENT but JSON
    #     null — the null-vs-missing gap: default(...) alone only
    #     substitutes for a MISSING key, so an unguarded null here used to
    #     raise in the difference() call below instead of being treated as [].
    #   - null-routes: same null-vs-missing gap, for `allowed_routes` instead.
    llm_router_existing_keys:
      json:
        keys:
          - key_alias: steady
            models: [cheap]
            # UI tags survive while the policy-owned sensitivity tag remains fixed.
            metadata: {app: steady, tier: local, tags: ['ui-edited', '&sensitivity:sensitive']}
            object_permission: {mcp_servers: [no-mcp-servers]}
          - key_alias: widened-routes
            models: [cheap]
            allowed_routes: ["/metrics"]
            metadata: {app: widened-routes, tier: local, tags: ['ui-edited', '&sensitivity:sensitive']}
            object_permission: {mcp_servers: [no-mcp-servers]}
          - key_alias: malformed-live
            object_permission: {mcp_servers: [no-mcp-servers]}
          - key_alias: authoritative-narrow
            models: [cheap, stale-model]
            metadata: {tags: ['&sensitivity:sensitive']}
            object_permission: {mcp_servers: [no-mcp-servers]}
          - key_alias: live-only
            models: [cheap]
            object_permission: {mcp_servers: [no-mcp-servers]}
          - key_alias: null-models
            models: null
            metadata: {tags: ['&sensitivity:sensitive']}
            object_permission: {mcp_servers: [no-mcp-servers]}
          - key_alias: null-routes
            models: [cheap]
            allowed_routes: null
            metadata: {tags: ['&sensitivity:sensitive']}
            object_permission: {mcp_servers: [no-mcp-servers]}
          - key_alias: mcp-reader
            models: [cheap]
            metadata: {tags: ['&sensitivity:sensitive']}
            object_permission: {mcp_servers: [no-mcp-servers]}

    llm_router_virtual_keys:
      - alias: steady
        value: "sk-{{ 'a' * 20 }}"
        models: [cheap]
        tags: ['&zdr', '!free']
        router_settings: {enable_tag_filtering: true}
      - alias: widened-routes
        value: "sk-{{ 'b' * 20 }}"
        models: [cheap]
        allowed_routes: ["/metrics", "/metrics/"]
        tags: ['&zdr', '!free']
        router_settings: {enable_tag_filtering: true}
      - alias: malformed-live
        value: "sk-{{ 'c' * 20 }}"
        models: [cheap, embed]
        models_authoritative: false
      - alias: authoritative-narrow
        value: "sk-{{ 'd' * 20 }}"
        models: [cheap]
        models_authoritative: true
      - alias: null-models
        value: "sk-{{ 'e' * 20 }}"
        models: [cheap]
        models_authoritative: false
      - alias: null-routes
        value: "sk-{{ 'f' * 20 }}"
        models: [cheap]
        allowed_routes: ["/metrics"]
      - alias: mcp-reader
        value: "sk-{{ 'g' * 20 }}"
        models: [cheap]
        object_permission: {mcp_servers: [zammad, slack]}

    # Hand-set, not extracted: this helper's own expression already has
    # dedicated coverage in test_seed_key_live_aliases.yml. Every live
    # key_alias belongs here, matching what a real /key/list read returns.
    _llm_router_live_key_aliases:
      - steady
      - widened-routes
      - malformed-live
      - authoritative-narrow
      - live-only
      - null-models
      - null-routes
      - mcp-reader

  tasks:
    - name: Extract the real create-only permission payload from seed-keys.yml
      ansible.builtin.set_fact:
        _create_key_body: >-
          {{ (lookup('ansible.builtin.file', _seed_keys_file) | from_yaml
              | selectattr('name', 'equalto', _create_task_name) | first)
             ['ansible.builtin.uri']['body'] }}

    - name: MCP permissions are passed on key creation only
      ansible.builtin.assert:
        quiet: true
        that:
          - "'object_permission' in _create_key_body"
          - "'item.object_permission' in _create_key_body.object_permission"
        fail_msg: "seed-keys.yml must pass each declared object_permission on initial key creation."

    - name: Extract the real, committed diff expression from the policy task
      ansible.builtin.set_fact:
        _diff_expr: >-
          {{ (lookup('ansible.builtin.file', _policy_file) | from_yaml
              | selectattr('name', 'equalto', _diff_task_name) | first)
             ['ansible.builtin.set_fact']['_llm_router_key_updates'] }}

    - name: The real expression must guard lookups and reconcile MCP permissions
      ansible.builtin.assert:
        quiet: true
        that:
          - "\"map(attribute='allowed_routes', default=none)\" in _diff_expr"
          - "\"map(attribute='models', default=[])\" in _diff_expr"
          - "\"default(none, true)\" in _diff_expr"
          - "\"default([], true)\" in _diff_expr"
          - "'object_permission' in _diff_expr"
          - "'_permission_changed' in _diff_expr"
        fail_msg: >-
          Could not find the fail-safe attribute lookups in the policy task
          under the task name {{ _diff_task_name }} — this test's
          extraction is stale, fix the task name/lookup.

    - name: Confirm seed-keys imports the policy reconciler
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            'reconcile-seeded-key-policy.yml' in
            lookup('ansible.builtin.file', _role_dir ~ '/tasks/seed-keys.yml')
        fail_msg: The seed task no longer imports its caller policy reconciler.

    # Same "write to a real template file, render, from_yaml" technique as
    # tests/inventory_load/test_ssh_probe_result_selection.yml: a string
    # held in a variable is not re-templated just by referencing it again.
    - name: Persist the extracted expression as a renderable template
      ansible.builtin.tempfile:
        state: file
        suffix: .j2
      register: _diff_template_file

    - name: Write the extracted expression to the temp template
      ansible.builtin.copy:
        dest: "{{ _diff_template_file.path }}"
        content: "{{ _diff_expr }}"
        mode: "0600"

    - name: Set initial mode before rendering the real update expression
      ansible.builtin.set_fact:
        llm_router_seed_mode: initial

    - name: Render the expression in initial mode
      ansible.builtin.set_fact:
        _llm_router_initial_key_updates: "{{ lookup('ansible.builtin.template', _diff_template_file.path) }}"

    - name: Initial mode updates the explicit model allowlist and MCP permission
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _llm_router_initial_key_updates | map(attribute='alias') | sort
            == ['authoritative-narrow', 'malformed-live', 'mcp-reader']
          - "_initial_mcp.body.object_permission == {'mcp_servers': ['zammad', 'slack']}"
          - "'models' not in _initial_mcp.body"
          - "'allowed_routes' not in _initial_mcp.body"
          - "'metadata' not in _initial_mcp.body"
          - _initial_narrow.body.models == ['cheap']
          - _initial_malformed.body.metadata.tags == ['&sensitivity:sensitive']
          - "'models' not in _initial_malformed.body"
          - "'allowed_routes' not in _initial_malformed.body"
        fail_msg: >-
          initial mode did not apply model, MCP, and sensitivity policy:
          {{ _llm_router_initial_key_updates | map(attribute='alias') | list }}.
      vars:
        _initial_mcp: >-
          {{ _llm_router_initial_key_updates | selectattr('alias', 'equalto', 'mcp-reader') | first }}
        _initial_narrow: >-
          {{ _llm_router_initial_key_updates | selectattr('alias', 'equalto', 'authoritative-narrow') | first }}
        _initial_malformed: >-
          {{ _llm_router_initial_key_updates | selectattr('alias', 'equalto', 'malformed-live') | first }}

    - name: Set explicit rebuild mode for the detailed reconciliation fixtures
      ansible.builtin.set_fact:
        llm_router_seed_mode: rebuild

    - name: Render the real, live expression against the fixture above
      ansible.builtin.set_fact:
        # No | from_yaml: on this ansible-core the template lookup already
        # returns the rendered expression's native type (a list here), and
        # piping an already-native value through from_yaml is a deprecation
        # warning (removed in 2.23), not a no-op.
        _llm_router_key_updates: "{{ lookup('ansible.builtin.template', _diff_template_file.path) }}"

    - name: Assert only the six genuinely-changed keys are updated, each exactly once
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_key_updates | map(attribute='alias') | sort
            == ['authoritative-narrow', 'malformed-live', 'mcp-reader', 'null-models', 'null-routes', 'widened-routes']
        fail_msg: >-
          Expected exactly the six changed aliases, got
          {{ _llm_router_key_updates | map(attribute='alias') | list }}.
          steady must be absent (nothing differs); live-only must be absent
          (no seed entry names it — current behavior preserved).

    - name: Assert the route-changed key's body carries BOTH fields in one call
      ansible.builtin.assert:
        quiet: true
        that:
          - _widened.body.allowed_routes == ['/metrics', '/metrics/']
          - _widened.body.models == ['cheap']
          - "_widened.body.object_permission == {'mcp_servers': ['no-mcp-servers']}"
          - _widened.body.metadata.tags == ['ui-edited', '&sensitivity:sensitive']
          - "'router_settings' not in _widened.body"
        fail_msg: "widened-routes body: {{ _widened.body }}"
      vars:
        _widened: "{{ _llm_router_key_updates | selectattr('alias', 'equalto', 'widened-routes') | first }}"

    - name: Assert an MCP grant is reconciled for the intended caller only
      ansible.builtin.assert:
        quiet: true
        that:
          - "_mcp_reader.body.object_permission == {'mcp_servers': ['zammad', 'slack']}"
          - _llm_router_key_updates | selectattr('alias', 'equalto', 'steady') | list | length == 0
        fail_msg: "MCP key policy reconciliation: {{ _mcp_reader.body }}"
      vars:
        _mcp_reader: "{{ _llm_router_key_updates | selectattr('alias', 'equalto', 'mcp-reader') | first }}"

    - name: Assert a live record missing both fields entirely is treated as none/[] rather than raising
      ansible.builtin.assert:
        quiet: true
        that:
          - "'allowed_routes' not in _malformed.body"
          - _malformed.body.models == ['cheap', 'embed']
        fail_msg: "malformed-live body: {{ _malformed.body }}"
      vars:
        _malformed: "{{ _llm_router_key_updates | selectattr('alias', 'equalto', 'malformed-live') | first }}"

    - name: Assert an authoritative key is flagged changed on a pure narrowing (name removed, none added)
      ansible.builtin.assert:
        quiet: true
        that:
          - _narrowed.body.models == ['cheap']
        fail_msg: "authoritative-narrow body: {{ _narrowed.body }}"
      vars:
        _narrowed: "{{ _llm_router_key_updates | selectattr('alias', 'equalto', 'authoritative-narrow') | first }}"

    - name: Assert a live `models` value of explicit JSON null is treated the same as missing
      ansible.builtin.assert:
        quiet: true
        that:
          - "'allowed_routes' not in _null_models.body"
          - _null_models.body.models == ['cheap']
        fail_msg: "null-models body: {{ _null_models.body }}"
      vars:
        _null_models: "{{ _llm_router_key_updates | selectattr('alias', 'equalto', 'null-models') | first }}"

    - name: Assert a live `allowed_routes` value of explicit JSON null is treated the same as missing
      ansible.builtin.assert:
        quiet: true
        that:
          - _null_routes.body.allowed_routes == ['/metrics']
          - _null_routes.body.models == ['cheap']
        fail_msg: "null-routes body: {{ _null_routes.body }}"
      vars:
        _null_routes: "{{ _llm_router_key_updates | selectattr('alias', 'equalto', 'null-routes') | first }}"

    - name: A second render against a fixture with nothing left to change updates zero keys
      ansible.builtin.set_fact:
        _llm_router_key_updates_second_run: "{{ lookup('ansible.builtin.template', _diff_template_file.path) }}"
      vars:
        # The live snapshot AFTER the six updates above would have landed:
        # every seed entry now matches live on both fields.
        llm_router_existing_keys:
          json:
            keys:
              - key_alias: steady
                models: [cheap]
                metadata: {app: steady, tier: local, tags: ['&sensitivity:sensitive']}
                object_permission: {mcp_servers: [no-mcp-servers]}
              - key_alias: widened-routes
                models: [cheap]
                allowed_routes: ["/metrics", "/metrics/"]
                metadata: {app: widened-routes, tier: local, tags: ['ui-edited', '&sensitivity:sensitive']}
                object_permission: {mcp_servers: [no-mcp-servers]}
              - key_alias: malformed-live
                models: [cheap, embed]
                metadata: {app: malformed-live, tier: local, tags: ['&sensitivity:sensitive']}
                object_permission: {mcp_servers: [no-mcp-servers]}
              - key_alias: authoritative-narrow
                models: [cheap]
                metadata: {app: authoritative-narrow, tier: local, tags: ['&sensitivity:sensitive']}
                object_permission: {mcp_servers: [no-mcp-servers]}
              - key_alias: live-only
                models: [cheap]
              - key_alias: null-models
                models: [cheap]
                metadata: {app: null-models, tier: local, tags: ['&sensitivity:sensitive']}
                object_permission: {mcp_servers: [no-mcp-servers]}
              - key_alias: null-routes
                models: [cheap]
                metadata: {app: null-routes, tier: local, tags: ['&sensitivity:sensitive']}
                allowed_routes: ["/metrics"]
                object_permission: {mcp_servers: [no-mcp-servers]}
              - key_alias: mcp-reader
                models: [cheap]
                metadata: {app: mcp-reader, tier: local, tags: ['&sensitivity:sensitive']}
                object_permission: {mcp_servers: [zammad, slack]}

    - name: Assert the idempotent second run finds nothing left to change
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_key_updates_second_run == []
        fail_msg: >-
          Expected changed=0 on a converged fixture, got
          {{ _llm_router_key_updates_second_run }}.
