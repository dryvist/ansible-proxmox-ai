---
# The Hermes cron fleet's tier-2 local lane (roles/llm_router
# defaults/main/56d-priority-tiers.yml). Split out of
# test_auto_router_deployment_tags.yml to keep that file under the CI
# per-file token budget; that playbook imports this one, so the Router
# contract shard runs both. The fixture setup mirrors the importing
# playbook's because this one renders the same fully credentialed config.
# The key projection is set_fact-cached by assertion-inputs.yml, so the
# profile load and the key seeding must precede the LAST materialization —
# a render fixture that materializes before them reads a cached
# llm_router_virtual_keys without the cron stores.
- name: Verify the Hermes cron fleet serves the tier-2 local lane
  hosts: localhost
  gather_facts: false
  vars_files:
    - policy_fixture.yml
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets:
      CHATGPT_LOGIN_FILE: /dev/null
      DASHSCOPE_API_KEY: fixture-dashscope
      GEMINI_API_KEY: fixture-gemini
      OPENAI_API_KEY: fixture-openai
      OPENCODE_API_KEY: fixture-opencode
      OPENROUTER_API_KEY: fixture-openrouter
      OPENROUTER_HERMES_KEY: fixture-hermes-openrouter
    bao_apps_secrets:
      hermes_default_llm_router_key: sk-fixture-hermes-public
      github_actions_oss_llm_router_key: sk-fixture-github-actions-oss
    llm_router_oss_ci_key_enabled: true
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: fixture-large-bearer
    llm_router_llm_fast_base_url: http://localhost:10434/v1
    llm_router_llm_light_base_url: http://localhost:10434/v1
    llm_router_llm_large_base_url: http://localhost:11434/v1
    llm_router_llm_vllm_base_url: http://localhost:10434/v1
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_agent_identity: hermes
    hermes_brain_model: medium
    hermes_goal_judge_model: judge
    hindsight_retain_model: qwen3-4b
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Model a successful Studio load-and-serve gate for this render
      ansible.builtin.set_fact:
        llm_router_studio_precheck_passed: true

    - name: Refresh the admitted Studio candidate projections
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Model the trusted callers these projections assume
      ansible.builtin.import_tasks: "{{ playbook_dir }}/tasks/trust_fixture_callers.yml"

    - name: Load the Hermes operating profiles the scheduled cron fleet runs under
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../../playbooks/tasks/load_hermes_profiles.yml"
      vars:
        _hermes_agent_role_dir: "{{ playbook_dir }}/../../roles/hermes_agent"

    - name: Seed the cron-hosting profile stores' router keys
      ansible.builtin.set_fact:
        bao_apps_secrets: >-
          {{ (bao_apps_secrets | default({})) | combine({
               'hermes_splunk_admin_llm_router_key': 'sk-fixture-cron-splunk-admin',
               'hermes_homelab_admin_llm_router_key': 'sk-fixture-cron-homelab-admin',
               'hermes_github_maint_llm_router_key': 'sk-fixture-cron-github-maint',
               'hermes_orchestrator_llm_router_key': 'sk-fixture-cron-orchestrator'}) }}
      no_log: true

    - name: Re-materialize the key projection with the seeded cron stores
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Read the inventory's cron model selection
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../inventory/group_vars/all/00-core.yml"
        name: _cron_inventory

    - name: Render the fully credentialed config
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"

    - name: The cron model selection names the small lane through the alias map
      ansible.builtin.assert:
        quiet: true
        that:
          - _cron_inventory.hermes_agent_cron_model == llm_router_small_capability_name
          - llm_router_model_group_aliases[_cron_inventory.hermes_agent_cron_model]
            == llm_router_small_model
        success_msg: >-
          The scheduled cron fleet pins the router's small lane, whose alias
          target is the small capability while it renders.

    - name: The cron-hosting Hermes stores resolve to the tier-2 local lane
      ansible.builtin.assert:
        quiet: true
        that:
          - _cron_store.priority_tier == 2
          - "'&tier-2' in _cron_store.tags"
          - "'&local' in _cron_store.tags"
          - _cron_store.allowed_classes == ['local']
          - _cron_store.router_settings.fallbacks == []
          - _cron_store.router_settings.context_window_fallbacks == []
          - _cron_store.router_settings.timeout == llm_router_tier_2_timeout_seconds
          - _cron_store.models | intersect(_cloud_groups) | length == 0
          - _cron_inventory.hermes_agent_cron_model in _cron_store.models
        fail_msg: >-
          {{ item }} tier={{ _cron_store.priority_tier }} tags={{ _cron_store.tags }}
          classes={{ _cron_store.allowed_classes }} fallbacks={{ _cron_store.router_settings }}
        success_msg: "{{ item }} serves only tier-2 local deployments with emptied fallback maps."
      vars:
        _cron_store: "{{ llm_router_virtual_keys | selectattr('alias', 'equalto', item) | first }}"
        _cloud_groups: >-
          {{ llm_router_d1_group_class_by_name | dict2items
             | rejectattr('value', 'equalto', 'local') | map(attribute='key') | list }}
      loop:
        - hermes-splunk-admin
        - hermes-homelab-admin
        - hermes-github-maint
        - hermes-orchestrator
      loop_control:
        label: "{{ item }}"

    - name: The cron model group renders only local deployments and never a cloud provider
      ansible.builtin.assert:
        quiet: true
        that:
          - _cron_deployments | length > 0
          - _cron_deployments | rejectattr('litellm_params.tags', 'contains', 'local') | list | length == 0
          - _cron_chain | intersect(_cloud_groups) | length == 0
          - >-
            _cron_chain
            == ([llm_router_small_capability_name] + llm_router_review_local_chain)
               | unique
          - _cron_tier2 | length > 0
          - _cron_tier2_studio | length > 0
          - _cron_tier2_bad | length == 0
          - _cloud_tier2 | length == 0
        fail_msg: >-
          chain={{ _cron_chain }}, tier2={{ _cron_tier2 | map(attribute='model_name') | list }},
          tier2_bad={{ _cron_tier2_bad | map(attribute='model_name') | list }},
          cloud_tier2={{ _cloud_tier2 | map(attribute='model_name') | list }}
        success_msg: >-
          The cron group's candidates are local only, carry the tier-2 timeouts and
          keepalive on their tier-2 copies, spill small-first into the local review
          chain, and no cloud deployment admits tier 2.
      vars:
        _cloud_groups: >-
          {{ llm_router_d1_group_class_by_name | dict2items
             | rejectattr('value', 'equalto', 'local') | map(attribute='key') | list }}
        _cron_chain: "{{ llm_router_fallback_map[_cron_inventory.hermes_agent_cron_model] }}"
        _cron_deployments: >-
          {{ _config.model_list
             | selectattr('model_name', 'equalto',
                 llm_router_model_group_aliases[_cron_inventory.hermes_agent_cron_model]) | list }}
        _cron_tier2: >-
          {{ _cron_deployments | selectattr('litellm_params.tags', 'contains', 'tier-2') | list }}
        _cron_tier2_studio: >-
          {{ _cron_tier2 | selectattr('litellm_params.api_base', 'defined')
             | selectattr('litellm_params.api_base', 'equalto', llm_router_llm_large_base_url) | list }}
        _cron_tier2_bad: >-
          {{ _cron_tier2 | selectattr('litellm_params.timeout', 'defined')
             | rejectattr('litellm_params.timeout', 'equalto', llm_router_tier_2_timeout_seconds) | list
             + _cron_tier2 | selectattr('litellm_params.stream_timeout', 'defined')
               | rejectattr('litellm_params.stream_timeout', 'equalto', llm_router_tier_2_timeout_seconds) | list
             + _cron_tier2 | rejectattr('litellm_params.keepalive_seconds', 'defined') | list
             + _cron_tier2 | selectattr('litellm_params.keepalive_seconds', 'defined')
               | rejectattr('litellm_params.keepalive_seconds', 'equalto',
                            llm_router_tier_2_keepalive_seconds) | list }}
        _cloud_tier2: >-
          {{ _config.model_list | rejectattr('litellm_params.tags', 'contains', 'local')
             | selectattr('litellm_params.tags', 'contains', 'tier-2') | list }}

    - name: Interactive Hermes keeps its tier, class grants, and cloud fallback chain
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_priority_effective_key_tiers['hermes-default'] == 0
          - llm_router_priority_effective_key_tiers['donna'] == 0
          - _interactive_key.priority_tier == 0
          - _interactive_key.team_id == 'tier-0'
          - "'&tier-2' not in _interactive_key.tags"
          - "'fallbacks' not in _interactive_key.router_settings"
          - _interactive_key.allowed_classes | length == 5
          - _interactive_chain | intersect(_non_local_rungs) | length > 0
          - _medium_tier0 | length > 0
          - >-
            _medium_tier0 | map(attribute='litellm_params.timeout')
            | select('ge', llm_router_tier_2_timeout_seconds) | list | length == 0
          - _medium_tier0 | selectattr('litellm_params.keepalive_seconds', 'defined')
            | list | length == 0
        fail_msg: >-
          hermes-default tier={{ _interactive_key.priority_tier }}
          classes={{ _interactive_key.allowed_classes }}
          chain={{ _interactive_chain }} medium_tier0={{ _medium_tier0 | length }}
        success_msg: >-
          The chat front door and the personal assistant profile keep tier 0 with
          their cloud fallback chain and the short local bounds.
      vars:
        _interactive_key: >-
          {{ llm_router_virtual_keys
             | selectattr('alias', 'search', '-default$') | first }}
        _interactive_chain: "{{ llm_router_hermes_default_fallback_chain }}"
        _non_local_rungs: >-
          {{ (llm_router_d1_rungs_by_class['sub'] + llm_router_d1_rungs_by_class['paid-zdr']
              + llm_router_d1_rungs_by_class['free'] + llm_router_d1_rungs_by_class['retains'])
             | unique | list }}
        _medium_tier0: >-
          {{ _config.model_list | selectattr('model_name', 'equalto', llm_router_primary_model)
             | selectattr('litellm_params.tags', 'contains', 'tier-0') | list }}
