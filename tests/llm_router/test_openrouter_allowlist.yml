---
# Verify rendered registry allowlists, rate limits, spend backing and ZDR.
# Run from the repository root for ansible.cfg's relative roles_path:
#   ansible-playbook tests/llm_router/test_openrouter_allowlist.yml -i localhost, -c local
- name: Verify the OpenRouter egress allowlist and router-enforced budget
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    # Mirrors current tofu-proxmox service_ports (as the failover test does) —
    # the render needs them to resolve backend api_base values.
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          # Spend store port, rendered as a literal int — needed for the render.
          redis_default: 6379
    # Seeded properly below (built from the registry, not hand-listed, so a
    # new entry is covered automatically); starts empty here.
    bao_local_llm_secrets: {}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: "pve.example.test"
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    # group_vars/all.yml isn't loaded under `-i localhost,`, so its constants
    # must be supplied here.
    ai_router_retry_after_seconds: 40
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: hermes-default
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
    # Both parity directions use this set. Missing or false ZDR is retaining;
    # OpenAI-provider entries are excluded.
    _registry_or: >-
      {%- set ns = namespace(names=[]) -%}
      {%- for m in llm_router_registry_enabled
            | selectattr('provider', 'equalto', 'openrouter') -%}
      {%- set ns.names = ns.names + [m.route_group | default(m.client_model_id)] -%}
      {%- if m.in_free_route | default(false) -%}
      {%- set _free_name = 'free' if (m.zero_data_retention | default(false)) else 'free-zdrless' -%}
      {%- if _free_name not in ns.names -%}
      {%- set ns.names = ns.names + [_free_name] -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.names | unique }}
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    # set_fact, not a play var: include_vars above binds role defaults at a
    # HIGHER precedence than a play var, silently discarding an override.
    - name: Configure a shared spend store, as a budget-carrying deployment has
      ansible.builtin.set_fact:
        llm_router_redis_host: redis.example.test
        llm_router_redis_password: test-only-not-a-real-password
        # The role ships neither; setting only the store would render no
        # budget and the assertion below would fail for a misleading reason.
        llm_router_openrouter_budget_limit: 1.0

    - name: Load the fabric model registry the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    # Seed every OpenRouter provider entry so both parity directions apply.
    - name: Seed every registry key_field so the egress tier actually renders
      ansible.builtin.set_fact:
        bao_local_llm_secrets: >-
          {{ dict(_key_fields | zip(_key_fields | map('regex_replace', '^', 'test-key-'))) }}
      vars:
        _key_fields: >-
          {{ (llm_router_registry_enabled | selectattr('provider', 'equalto', 'openrouter')
              | map(attribute='key_field') | list) | unique }}

    - name: Render the real config.yaml.j2 template into a string
      ansible.builtin.set_fact:
        _rendered_config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') }}"

    - name: Parse the rendered config as YAML
      ansible.builtin.set_fact:
        _config: "{{ _rendered_config | from_yaml }}"

    # External wildcards require guards; the internal serving gate is exempt.
    - name: The external-provider wildcard carries its retaining class and egress guards
      ansible.builtin.assert:
        quiet: true
        that:
          - _unguarded_external_wildcards | length == 0
        fail_msg: >-
          External-provider wildcard(s) {{ _unguarded_external_wildcards
            | map(attribute='model_name') | list }} are missing a required
            guard (data_collection: deny, zdr: false, non-zero rpm/tpm/
          max_parallel_requests) — exposes the whole catalog with no ceiling.
        success_msg: >-
          {{ _external_wildcards | length }} external-provider wildcard(s)
          guarded ({{ _internal_wildcards | length }} internal exempt).
      vars:
        _internal_base_urls:
          - "{{ llm_router_llm_large_base_url }}"
          - "{{ llm_router_llm_fast_base_url }}"
          - "{{ llm_router_llm_light_base_url }}"
          - "{{ llm_router_llm_vllm_base_url }}"
        _all_wildcards: >-
          {{ _config.model_list
             | selectattr('model_name', 'match', '.*\*.*') | list }}
        _internal_wildcards: >-
          {{ _all_wildcards
             | selectattr('litellm_params.api_base', 'defined')
             | selectattr('litellm_params.api_base', 'in', _internal_base_urls)
             | list }}
        _external_wildcards: >-
          {{ _all_wildcards
             | rejectattr('litellm_params.api_base', 'defined')
             | list
             + (_all_wildcards
                | selectattr('litellm_params.api_base', 'defined')
                | rejectattr('litellm_params.api_base', 'in', _internal_base_urls)
                | list) }}
        _unguarded_external_wildcards: >-
          {{ _external_wildcards
             | rejectattr('litellm_params.extra_body.provider.data_collection', 'defined')
             | list
             + (_external_wildcards
                | selectattr('litellm_params.extra_body.provider.data_collection', 'defined')
                | rejectattr('litellm_params.extra_body.provider.data_collection', 'equalto', 'deny')
                | list)
             + (_external_wildcards
                | rejectattr('litellm_params.extra_body.provider.zdr', 'defined')
                | list)
             + (_external_wildcards
                | selectattr('litellm_params.extra_body.provider.zdr', 'defined')
                | rejectattr('litellm_params.extra_body.provider.zdr', 'equalto', false)
                | list)
             + (_external_wildcards
                | rejectattr('litellm_params.rpm', 'defined')
                | list)
             + (_external_wildcards
                | selectattr('litellm_params.rpm', 'defined')
                | rejectattr('litellm_params.rpm', 'gt', 0)
                | list)
             + (_external_wildcards
                | rejectattr('litellm_params.tpm', 'defined')
                | list)
             + (_external_wildcards
                | selectattr('litellm_params.tpm', 'defined')
                | rejectattr('litellm_params.tpm', 'gt', 0)
                | list)
             + (_external_wildcards
                | rejectattr('litellm_params.max_parallel_requests', 'defined')
                | list)
             + (_external_wildcards
                | selectattr('litellm_params.max_parallel_requests', 'defined')
                | rejectattr('litellm_params.max_parallel_requests', 'gt', 0)
                | list) }}

    - name: The rendered model list has no openrouter/* passthrough entry
      ansible.builtin.assert:
        quiet: true
        that:
          - _or_passthrough | length == 0
        fail_msg: >-
          {{ _or_passthrough | map(attribute='model_name') | list }} is an
          OpenRouter passthrough. Egress must be the registry allowlist only.
        success_msg: "no openrouter/* passthrough is rendered"
      vars:
        _or_passthrough: >-
          {{ (_config.model_list
              | selectattr('model_name', 'match', '^openrouter/.*\*') | list)
             + (_config.model_list
                | selectattr('litellm_params.model', 'match', '^openrouter/.*\*') | list) }}

    - name: Every rendered OpenRouter model is an enabled registry entry
      ansible.builtin.assert:
        quiet: true
        that:
          - _rendered_or | difference(_registry_or) | length == 0
        fail_msg: >-
          [{{ _rendered_or | difference(_registry_or) | join(', ') }}] are
          reachable but not enabled OpenRouter registry entries. Egress must
          be exactly the registry's allowlist.
        success_msg: >-
          all {{ _rendered_or | length }} rendered egress models come from the registry
      vars:
        # Wildcards are checked above, separately from registry deployments.
        _rendered_or: >-
          {{ _config.model_list
             | selectattr('litellm_params.model', 'match', '^openrouter/')
             | map(attribute='model_name')
             | reject('search', '\*') | list }}

    - name: Every enabled registry egress entry is actually reachable
      # The converse check rejects a missing egress loop.
      ansible.builtin.assert:
        quiet: true
        that:
          - _registry_or | difference(_rendered_or) | length == 0
        fail_msg: >-
          [{{ _registry_or | difference(_rendered_or) | join(', ') }}] are
          enabled with a seeded key but render no model_list entry — the
          egress loop has regressed.
        success_msg: "registry egress set and rendered egress set agree exactly"
      vars:
        _rendered_or: >-
          {{ _config.model_list
             | selectattr('litellm_params.model', 'match', '^openrouter/')
             | map(attribute='model_name') | list }}

    - name: A rendered spend budget is present AND backed by a shared store
      # A budget and its shared spend store must appear together.
      ansible.builtin.assert:
        quiet: true
        that:
          - "'provider_budget_config' in (_config.router_settings | default({}))"
          - >-
            (_config.router_settings.provider_budget_config.openrouter.budget_limit
             | float) > 0
          - >-
            (_config.router_settings.provider_budget_config.openrouter.time_period
             | length) > 0
          # The half making the budget honest; without it the ceiling is fiction.
          - "'redis_host' in (_config.router_settings | default({}))"
          - (_config.router_settings.redis_port | int) > 0  # literal int, see config.yaml.j2
          - "'redis_password' in (_config.router_settings | default({}))"
          # Credentials resolve via the EnvironmentFile, never as literals.
          - _config.router_settings.redis_password is search('^os.environ/')
          - _config.router_settings.redis_host is search('^os.environ/')
        fail_msg: >-
          provider_budget_config and redis_host/redis_port/redis_password must
          appear TOGETHER: LiteLLM tracks provider spend in Redis, and this is
          a multi-member pool, so a budget without a shared store advertises a
          ceiling that is really Nx its stated value and resets every
          converge. To run with no budget, remove the budget, not the store.
        success_msg: >-
          spend budget is present and backed by a shared store, with credentials
          resolved from the environment

    - name: No Postgres-backed budget setting is claimed without Postgres
      # Database-backed virtual-key budget enforcement is separate.
      ansible.builtin.assert:
        quiet: true
        that:
          - "'fail_closed_budget_enforcement' not in (_config.general_settings | default({}))"
          - "'fail_closed_budget_enforcement' not in (_config.litellm_settings | default({}))"
          - "'fail_closed_budget_enforcement' not in (_config.router_settings | default({}))"
        fail_msg: >-
          fail_closed_budget_enforcement validates spend against a
          POSTGRES-backed virtual-key budget system this proxy does not run —
          inert at best, a 503 generator at worst. Redis backs
          provider_budget_config; it does not back this.
        success_msg: >-
          no Postgres-backed budget setting is claimed on a database-less proxy

    - name: Every egress deployment carries rate and concurrency limits
      ansible.builtin.assert:
        quiet: true
        that:
          - _unlimited | length == 0
        fail_msg: >-
          Egress deployment(s) [{{ _unlimited | join(', ') }}] carry no
          rpm/tpm/max_parallel_requests — the ONLY enforcement this
          storage-less proxy can apply to an account-wide credential.
        success_msg: >-
          all egress deployments are rate- and concurrency-limited
          (per instance; the pool has three members)
      vars:
        _unlimited: >-
          {{ _config.model_list
             | selectattr('litellm_params.model', 'match', '^openrouter/')
             | rejectattr('litellm_params.rpm', 'defined')
             | map(attribute='model_name') | list }}

    # Each registry entry supplies ZDR, including retaining free presets.
    - name: Each rendered and role-param zdr flag matches its registry declaration
      ansible.builtin.import_tasks: tasks/openrouter_allowlist_zdr.yml
