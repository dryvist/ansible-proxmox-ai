---
# Native render contract for the sole Hermes emergency egress route.
- name: Verify the fixed OpenRouter Hermes fallback contract
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          llm_cluster_api: 11440
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: mlx-community/Qwen3.8-27B-4bit
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: test-master-key
    llm_router_llm_large_bearer: test-local-bearer
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults and registry
      ansible.builtin.import_tasks: tasks/parity_setup.yml

    - name: Enable the one provider credential only for this render
      ansible.builtin.set_fact:
        llm_router_openrouter_api_key: test-provider-key
        llm_router_openrouter_enabled: true
        llm_router_redis_host: redis.example.test
        llm_router_redis_password: test-redis-password
        llm_router_openrouter_budget_limit: 1.0

    - name: Render and parse the native LiteLLM configuration
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"
        _environment: "{{ lookup('template', _role_dir ~ '/templates/litellm.env.j2') }}"

    - name: The provider route is one fixed model with one provider environment reference
      ansible.builtin.assert:
        quiet: true
        that:
          - _openrouter | length == 1
          - _openrouter[0].model_name == 'hermes-openrouter-fallback'
          - _openrouter[0].litellm_params.model == 'openrouter/deepseek/deepseek-v4-flash-latest'
          - _openrouter[0].litellm_params.api_key == 'os.environ/OPENROUTER_API_KEY'
          - _openrouter[0].litellm_params.num_retries | int == 0
          - not _openrouter[0].litellm_params.extra_body.provider.allow_fallbacks
          - _openrouter[0].litellm_params.extra_body.provider.data_collection == 'deny'
          - _environment is search('(?m)^OPENROUTER_API_KEY=test-provider-key$')
          - _environment is not search('OPENROUTER_API_KEY_')
        fail_msg: >-
          The rendered provider deployment is not the single fixed, direct
          emergency route with one provider-scoped environment variable.
      vars:
        _openrouter: >-
          {{ _config.model_list | selectattr('litellm_params.model', 'match', '^openrouter/') | list }}

    - name: Hermes performs three scoped local attempts then one provider fallback
      ansible.builtin.assert:
        quiet: true
        that:
          - _config.router_settings.num_retries | int == 0
          - _config.router_settings.model_group_retry_policy['hermes-default'].TimeoutErrorRetries | int == 2
          - _config.router_settings.model_group_retry_policy['hermes-default'].InternalServerErrorRetries | int == 2
          - _config.router_settings.model_group_retry_policy['hermes-default'].RateLimitErrorRetries | int == 2
          - "_config.router_settings.fallbacks == [{'hermes-default': ['hermes-openrouter-fallback']}]"
          - _config.router_settings.max_fallbacks | int == 1
          - _config.router_settings.timeout | int == 2400
        fail_msg: >-
          Hermes local retry/fallback settings are not bounded to the expected
          route.

    - name: A missing provider credential leaves Hermes local-only
      ansible.builtin.set_fact:
        llm_router_openrouter_api_key: ""
        llm_router_openrouter_enabled: false

    - name: Render the missing-credential configuration
      ansible.builtin.set_fact:
        _without_key: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"
        _without_key_environment: "{{ lookup('template', _role_dir ~ '/templates/litellm.env.j2') }}"

    - name: Missing credential does not expose a provider route or fallback
      ansible.builtin.assert:
        quiet: true
        that:
          - (_without_key.model_list | selectattr('litellm_params.model', 'match', '^openrouter/') | list) | length == 0
          - "'fallbacks' not in _without_key.router_settings"
          - _without_key_environment is not search('(?m)^OPENROUTER_API_KEY=')
        fail_msg: Missing provider credential did not disable only the Hermes provider fallback.
