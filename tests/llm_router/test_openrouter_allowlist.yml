---
# Pins the OpenRouter egress contract: the registry is the allowlist, every
# egress deployment is rate-limited, and no spend budget is CLAIMED that this
# storage-less proxy cannot actually hold.
#
# WHY THIS TEST EXISTS. Until 2026-08 the role rendered an `openrouter/*`
# passthrough entry authenticated with one already-seeded key, which exposed the
# entire live OpenRouter catalog. The keys are ACCOUNT-WIDE — the role's own
# operator disclosure recorded that the per-model field names were "a
# naming-level guardrail, not a technical one" — so the only real control was
# caller-side prose: a persona paragraph and a skill describing a daily budget
# the agent tracked for ITSELF, in its own memory. That binds a compliant caller
# and nothing else.
#
# Two claims were false while it existed. "The registry is the sole enabled-model
# inventory" could not be true with a wildcard routing around it. And "spend is
# capped" was advisory, so a noncompliant or compromised caller had no ceiling.
#
# Both failures are silent by nature: the render succeeds either way, and the
# wildcard's absence or presence is invisible to ansible-lint and --syntax-check.
# Only the RENDERED config shows it, which is what this test inspects.
#
# Run (from the REPO ROOT — the registry load resolves the llm_router role
# through ansible.cfg's cwd-relative roles_path):
#   ansible-playbook tests/llm_router/test_openrouter_allowlist.yml -i localhost, -c local
- name: Verify the OpenRouter egress allowlist and router-enforced budget
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    # Mirrors the current tofu-proxmox service_ports constants, as the failover
    # test does — the render needs them to resolve backend api_base values.
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          llm_cluster_api: 11440
          otel_traces_http: 4318
    # Seeds every registry key_field so the OpenRouter entries actually render.
    # Without this they are inert (unseeded keys emit nothing) and the
    # allowlist assertions below would pass against an EMPTY list — proving
    # nothing. Built from the registry rather than spelled out, so a new entry
    # is covered the day it lands instead of silently skipping this test.
    bao_local_llm_secrets: {}
    ai_default_model: mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit
    llm_large_serving_host: llm-large
    llm_router_subdomain: "pve.example.test"
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    # group_vars/all.yml is not loaded under `-i localhost,`, so the all.yml
    # constants the role defaults reference must be supplied here.
    ai_router_retry_after_seconds: 40
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main.yml"

    - name: Load the fabric model registry the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    # Every OpenRouter entry renders only when its key_field is seeded. Seeding
    # them all here is what makes the "rendered set == registry set" assertion
    # meaningful; with an empty secrets dict both sides would be empty.
    - name: Seed every registry key_field so the egress tier actually renders
      ansible.builtin.set_fact:
        bao_local_llm_secrets: >-
          {{ dict(_key_fields | zip(_key_fields | map('regex_replace', '^', 'test-key-'))) }}
      vars:
        _key_fields: >-
          {{ llm_router_openrouter_models | map(attribute='key_field') | list }}

    - name: Render the real config.yaml.j2 template into a string
      ansible.builtin.set_fact:
        _rendered_config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') }}"

    - name: Parse the rendered config as YAML
      ansible.builtin.set_fact:
        _config: "{{ _rendered_config | from_yaml }}"

    - name: No OpenRouter passthrough wildcard is rendered
      # The whole point. `openrouter/*` would make every assertion below
      # cosmetic, because any catalog model would be reachable regardless of
      # what the registry says.
      ansible.builtin.assert:
        quiet: true
        that:
          - _wildcards | length == 0
        fail_msg: >-
          The rendered model_list contains {{ _wildcards | length }}
          OpenRouter passthrough entr(y|ies) ({{ _wildcards | join(', ') }}).
          That exposes the entire live OpenRouter catalog on an account-wide
          key and makes the registry no longer the enabled-model inventory.
        success_msg: "no openrouter passthrough wildcard — the registry is the allowlist"
      vars:
        _wildcards: >-
          {{ _config.model_list | map(attribute='model_name')
             | select('match', '^openrouter/\*$') | list }}

    - name: Every rendered OpenRouter model is an enabled registry entry
      ansible.builtin.assert:
        quiet: true
        that:
          - _rendered_or | difference(_registry_or) | length == 0
        fail_msg: >-
          [{{ _rendered_or | difference(_registry_or) | join(', ') }}] are
          reachable through the router but are not enabled OpenRouter entries
          in the registry. Egress must be exactly the registry's allowlist.
        success_msg: >-
          all {{ _rendered_or | length }} rendered egress models come from the registry
      vars:
        _rendered_or: >-
          {{ _config.model_list
             | selectattr('litellm_params.model', 'match', '^openrouter/')
             | map(attribute='model_name') | list }}
        _registry_or: >-
          {{ llm_router_openrouter_models | map(attribute='client_model_id') | list }}

    - name: Every enabled registry egress entry is actually reachable
      # The converse direction. Without it, a template regression that dropped
      # the egress loop entirely would still satisfy the assertion above (the
      # empty set is a subset of anything) and read as a pass.
      ansible.builtin.assert:
        quiet: true
        that:
          - _registry_or | difference(_rendered_or) | length == 0
        fail_msg: >-
          [{{ _registry_or | difference(_rendered_or) | join(', ') }}] are
          enabled in the registry with a seeded key but render no model_list
          entry — the egress loop has regressed.
        success_msg: "registry egress set and rendered egress set agree exactly"
      vars:
        _rendered_or: >-
          {{ _config.model_list
             | selectattr('litellm_params.model', 'match', '^openrouter/')
             | map(attribute='model_name') | list }}
        _registry_or: >-
          {{ llm_router_openrouter_models | map(attribute='client_model_id') | list }}

    - name: No LiteLLM spend budget is configured on this storage-less proxy
      # The INVERSE of what this assertion originally said, and the correction
      # matters more than the original claim did.
      #
      # LiteLLM's spend controls need storage this proxy does not have:
      # provider_budget_config tracks spend in REDIS, and max_budget /
      # budget_duration on virtual keys live in its Postgres-backed key
      # management. This proxy is deliberately DB-less (see the prisma note in
      # the role defaults: "We use no database") and has no Redis, because
      # DB-lessness is the load-bearing reason a single front door in the call
      # path is acceptable — a replicated stateless front, not a stateful
      # bottleneck.
      #
      # Configuring a budget anyway would be worse than configuring none.
      # llm_router_group is a three-member pool, so with no shared store each
      # member counts only its own spend: the rendered config would advertise a
      # ceiling that is really 3x, and every rolling converge would reset it.
      # An operator reading that config would believe in a control that does not
      # hold. This assertion exists to keep anyone from re-adding it as a
      # config line, because it is an architecture decision (add Redis or
      # Postgres to the estate's front door) and not a template edit.
      ansible.builtin.assert:
        quiet: true
        that:
          - "'provider_budget_config' not in (_config.router_settings | default({}))"
          - "'fail_closed_budget_enforcement' not in (_config.litellm_settings | default({}))"
        fail_msg: >-
          The rendered config carries a LiteLLM spend budget, but this proxy has
          neither Redis nor a database to track spend in, and runs as a
          three-member pool. The ceiling it advertises would be 3x its stated
          value and would reset on every rolling converge. Do not re-add it as a
          config line — adding a shared store to the fabric's front door is an
          architecture decision.
        success_msg: "no unbacked spend budget is claimed in the rendered config"

    - name: Every egress deployment carries rate and concurrency limits
      ansible.builtin.assert:
        quiet: true
        that:
          - _unlimited | length == 0
        fail_msg: >-
          Egress deployment(s) [{{ _unlimited | join(', ') }}] carry no
          rpm/tpm/max_parallel_requests. These are the ONLY enforcement this
          storage-less proxy can apply to an account-wide credential, so an
          unlimited deployment has no ceiling of any kind.
        success_msg: >-
          all egress deployments are rate- and concurrency-limited
          (per instance; the pool has three members)
      vars:
        _unlimited: >-
          {{ _config.model_list
             | selectattr('litellm_params.model', 'match', '^openrouter/')
             | rejectattr('litellm_params.rpm', 'defined')
             | map(attribute='model_name') | list }}
