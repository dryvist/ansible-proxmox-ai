---
# A Hermes brain model that is a group alias (the GPU profile aliases, or any
# stable alias) must not leave public keys unable to call the aliased entry
# point. Local-only profiles keep exactly their derived local review chain.
#
# Run from the repository root:
#   ansible-playbook tests/llm_router/test_hermes_public_key_alias_brain.yml -i localhost, -c local
- name: Verify Hermes keys hold the ladder when the brain model is a group alias
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets:
      OPENROUTER_API_KEY: test-openrouter-provider-key
      OPENCODE_API_KEY: test-opencode-provider-key
      OPENAI_API_KEY: test-openai-provider-key
    bao_apps_secrets:
      hermes_default_llm_router_key: sk-fixture-hermes-default
      hermes_private_llm_router_key: sk-fixture-hermes-private
      donna_llm_router_key: sk-fixture-donna
      hermes_eval_llm_router_key: sk-test-000000000000
    hermes_agent_profiles:
      - name: eval
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: "pve.example.test"
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: default
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the fabric model registry the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Model the trusted callers these projections assume
      ansible.builtin.import_tasks: "{{ playbook_dir }}/tasks/trust_fixture_callers.yml"

    - name: Confirm the brain model is an alias that is not itself a ladder name
      ansible.builtin.assert:
        quiet: true
        that:
          - hermes_brain_model in llm_router_model_group_aliases
          - hermes_brain_model not in _llm_router_directly_callable_ladder_names
          - llm_router_hermes_router_ids | difference(_llm_router_directly_callable_ladder_names) | length == 0

    - name: Run the profile-key chain contract against the rendered keys
      ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-hermes-profile-key-brain-model.yml"

    - name: Confirm the local-only fixture is rendered and excluded from the value-free projection
      ansible.builtin.assert:
        quiet: true
        that:
          - _hermes_eval_fixture.value == 'sk-test-000000000000'
          - _hermes_eval_fixture.models == [llm_router_review_aliases.local]
          - >-
            (_llm_router_virtual_keys_without_values | to_json)
            is not search('sk-test-')
        fail_msg: The local-only Hermes fixture must render its derived local chain without exposing its value.
      vars:
        _hermes_eval_fixture: >-
          {{ llm_router_virtual_keys
             | selectattr('alias', 'equalto', 'hermes-eval') | first }}

    - name: Replace the key fixture with an under-scoped Hermes key for the failure check
      ansible.builtin.set_fact:
        llm_router_virtual_keys:
          - alias: hermes-invalid-fixture
            value: sk-test-000000000000
            tags: []
            models: []
      no_log: true

    - name: Capture the expected chain assertion failure
      block:
        - name: Run the chain assertion against the under-scoped fixture
          ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-hermes-profile-key-brain-model.yml"
      rescue:
        - name: Register the failed assertion result for the secret scan
          ansible.builtin.set_fact:
            _hermes_assertion_failure_result: "{{ ansible_failed_result }}"
          no_log: true

    - name: Confirm a failed key assertion result contains no fixture value
      ansible.builtin.assert:
        quiet: true
        that:
          - _hermes_assertion_failure_result is defined
          - (_hermes_assertion_failure_result | to_json) is not search('sk-test-')
        fail_msg: The failed Hermes assertion result contained the fixture key value.
