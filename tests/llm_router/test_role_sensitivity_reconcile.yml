---
- name: Verify DB role tags follow their live routing target
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets:
      OPENROUTER_API_KEY: fixture-openrouter
    llm_router_subdomain: localhost
    llm_router_llm_large_base_url: http://localhost/v1
    llm_router_llm_light_base_url: http://localhost/v1
    llm_router_llm_fast_base_url: http://localhost/v1
    llm_router_llm_vllm_base_url: http://localhost/v1
    llm_router_llm_gpu_base_url: http://localhost/v1
  tasks:
    - name: Load router defaults and registry projections
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the fabric model registry
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml
        public: true

    - name: Select a cloud retaining deployment for the tag-sync fixture
      ansible.builtin.set_fact:
        _retaining_entry: >-
          {{ llm_router_registry_enabled
             | selectattr('tier', 'equalto', 'openrouter')
             | selectattr('zero_data_retention', 'defined')
             | rejectattr('zero_data_retention')
             | first }}

    - name: Add the retaining deployment to the role-tag fixture projection
      ansible.builtin.set_fact:
        _retaining_target: "{{ _retaining_entry.client_model_id }}"
        _llm_router_role_params: >-
          {{ _llm_router_role_params | combine({
              _retaining_entry.client_model_id: {
                'model': _retaining_entry.litellm_model_name
                         | default(_retaining_entry.provider ~ '/' ~ _retaining_entry.upstream_model_id),
                'api_base': _retaining_entry.api_base | default('')
              }}) }}

    - name: Declare the native router fixture target
      ansible.builtin.set_fact:
        _router_target: contract-native-router

    - name: Add the native router to the role-tag fixture projection
      ansible.builtin.set_fact:
        llm_router_registry_enabled: >-
          {{ llm_router_registry_enabled + [{
              'client_model_id': _router_target,
              'tier': 'hermes-router',
              'enabled': true
            }] }}
        llm_router_deployment_tags_by_model: >-
          {{ llm_router_deployment_tags_by_model | combine({
              _router_target: ['retains', 'sensitivity:public']}) }}
        llm_router_deployment_tags_by_entry: >-
          {{ llm_router_deployment_tags_by_entry | combine({
              _router_target ~ '|hermes-router': ['retains', 'sensitivity:public']}) }}
        _llm_router_role_params: >-
          {{ _llm_router_role_params | combine({
              _router_target: {'model': 'fixture/native-router-target'}
            }) }}

    - name: Refresh cached router projections after fixture input changes [role-sensitivity-reconcile-1]
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Select local and native complexity-router targets
      ansible.builtin.set_fact:
        # Role params are keyed by capability name; take the first capability
        # whose selected member is a local deployment.
        _local_target: >-
          {{ (llm_router_capability_members
              | selectattr('tier', 'in', ['local-large', 'light', 'vllm', 'gpu', 'cpu-9b', 'cpu-moe'])
              | first).route_group }}

    - name: Add a second member to the local capability as a retarget fixture
      ansible.builtin.set_fact:
        llm_router_capability_members: >-
          {{ llm_router_capability_members + [_alt_entry] }}
        llm_router_deployment_tags_by_entry: >-
          {{ llm_router_deployment_tags_by_entry | combine({
              _alt_entry.client_model_id ~ '|' ~ _alt_entry.tier:
                ['local', 'zdr', 'sensitivity:public', 'sensitivity:sensitive']}) }}
      vars:
        _alt_entry: >-
          {{ (llm_router_capability_members
              | selectattr('route_group', 'equalto', _local_target) | first)
             | combine({'client_model_id': 'contract-alt-member',
                        'upstream_model_id': 'contract-alt-model',
                        'litellm_model_name': 'openai/contract-alt-model'}) }}

    - name: Refresh cached router projections after fixture input changes [role-sensitivity-reconcile-2]
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Select a later capability member whose target differs from its group's first member
      ansible.builtin.set_fact:
        _alternate_member_projection: >-
          {%- set ns = namespace(found=none) -%}
          {%- for member in _llm_router_capability_member_params if ns.found is none -%}
          {%- set first = _llm_router_role_params[member.entry.route_group] -%}
          {%- if member.params.model != first.model
                or (member.params.api_base | default('')) != (first.api_base | default('')) -%}
          {%- set ns.found = member -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.found }}

    - name: Require a capability with a distinct later member
      ansible.builtin.assert:
        quiet: true
        that:
          - _alternate_member_projection is mapping
        fail_msg: No capability has a later member with a distinct target; the retarget case would test nothing.

    - name: Name the alternate member's capability
      ansible.builtin.set_fact:
        _alternate_group: "{{ _alternate_member_projection.entry.route_group }}"

    - name: Declare the roles represented by the live fixture
      ansible.builtin.set_fact:
        llm_router_role_deployments:
          - {role: local-role, model: "{{ _local_target }}", fallbacks: []}
          - {role: redirected-role, model: "{{ _local_target }}", fallbacks: []}
          - {role: unknown-role, model: "{{ _local_target }}", fallbacks: []}
          - {role: auto-router-role, model: "{{ _router_target }}", fallbacks: []}
          - {role: alternate-member-role, model: "{{ _alternate_group }}", fallbacks: []}
        _llm_router_roles_for_tag_sync:
          json:
            data:
              - model_name: local-role
                litellm_params:
                  model: "{{ _llm_router_role_params[_local_target].model }}"
                  api_base: "{{ _llm_router_role_params[_local_target].api_base | default('') }}"
                  tags: [local, zdr, operator-note, "sensitivity:public"]
                model_info: {id: local-role-id, db_model: true}
              - model_name: redirected-role
                litellm_params:
                  model: "{{ _llm_router_role_params[_retaining_target].model }}"
                  api_base: "{{ _llm_router_role_params[_retaining_target].api_base | default('') }}"
                  tags: [local, zdr, operator-note, "sensitivity:sensitive", "sensitivity:pii"]
                model_info: {id: redirected-role-id, db_model: true}
              - model_name: unknown-role
                litellm_params:
                  model: unsupported/target
                  api_base: http://localhost/v1
                  tags: [local, zdr, operator-note, "sensitivity:sensitive", "sensitivity:pii"]
                model_info: {id: unknown-role-id, db_model: true}
              - model_name: auto-router-role
                litellm_params:
                  model: "{{ _llm_router_role_params[_router_target].model }}"
                  tags: [retains, "sensitivity:public"]
                model_info: {id: auto-router-role-id, db_model: true}
              - model_name: alternate-member-role
                litellm_params:
                  model: "{{ _alternate_member_projection.params.model }}"
                  api_base: "{{ _alternate_member_projection.params.api_base | default('') }}"
                  tags: [retains, "sensitivity:public", operator-note]
                model_info: {id: alternate-member-role-id, db_model: true}

    - name: Refresh cached router projections after fixture input changes [role-sensitivity-reconcile-3]
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Run the production role-tag projection
      ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/prepare-role-tag-updates.yml"

    - name: A recognized local role accepts all classes and preserves operator tags
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _local.tags | difference([
              'local', 'zdr', 'operator-note', 'sensitivity:public',
              'sensitivity:sensitive', 'sensitivity:pii'
            ]) | length == 0
          - _local.tags | length == 6
          - _local.model_id == 'local-role-id'
        fail_msg: "Local role tags: {{ _local.tags }}"
      vars:
        _local: "{{ _llm_router_role_tag_updates | selectattr('role', 'equalto', 'local-role') | first }}"

    - name: A live role on a later member receives that member's deployment tags
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _alternate_member_projection.params.model != _llm_router_role_params[_alternate_group].model
            or (_alternate_member_projection.params.api_base | default(''))
            != (_llm_router_role_params[_alternate_group].api_base | default(''))
          - _alternate.tags | sort == (['operator-note'] + (_alternate_entry_tags
            | reject('match', '^telemetry_') | list)) | unique | sort
      vars:
        _alternate: >-
          {{ _llm_router_role_tag_updates
             | selectattr('role', 'equalto', 'alternate-member-role') | first }}
        _alternate_entry_tags: >-
          {{ llm_router_deployment_tags_by_entry[
              _alternate_member_projection.entry.client_model_id ~ '|'
              ~ _alternate_member_projection.entry.tier] }}

    - name: A known retaining UI retarget removes sensitive and PII admission
      ansible.builtin.assert:
        quiet: true
        that:
          - "'sensitivity:public' in _redirected.tags"
          - "'sensitivity:sensitive' not in _redirected.tags"
          - "'sensitivity:pii' not in _redirected.tags"
          - "'retains' in _redirected.tags"
          - "'operator-note' in _redirected.tags"
      vars:
        _redirected: "{{ _llm_router_role_tag_updates | selectattr('role', 'equalto', 'redirected-role') | first }}"

    - name: Unknown UI targets fail closed as retaining and public-only
      ansible.builtin.assert:
        quiet: true
        that:
          - _unknown.tags | sort == ['operator-note', 'retains', 'sensitivity:public']
      vars:
        _unknown: "{{ _llm_router_role_tag_updates | selectattr('role', 'equalto', 'unknown-role') | first }}"

    - name: Native auto-router roles keep all classes for downstream filtered selection
      ansible.builtin.assert:
        quiet: true
        that:
          - "'sensitivity:public' in _auto.tags"
          - "'sensitivity:sensitive' in _auto.tags"
          - "'sensitivity:pii' in _auto.tags"
          - "'retains' in _auto.tags"
      vars:
        _auto: "{{ _llm_router_role_tag_updates | selectattr('role', 'equalto', 'auto-router-role') | first }}"
