---
- name: Verify the OpenCode Go key resolves from its external OpenBao path
  hosts: localhost
  gather_facts: false
  vars:
    _identities_file: "{{ playbook_dir }}/../../inventory/group_vars/all/openbao_secrets/10-domains-identities.yml"
    _seed_file: "{{ playbook_dir }}/../../inventory/group_vars/all/openbao_secrets/00-seed-vars.yml"
    openbao_secrets_ai_api_key_mount: secrets-external
    openbao_secrets_ai_api_key_path_prefix: ai/saas
  tasks:
    - name: Load the local-llm OpenBao domain declaration
      ansible.builtin.include_vars:
        file: "{{ _identities_file }}"
        name: _identity_defaults

    - name: Check the declared mount, shared prefix, and key field
      ansible.builtin.assert:
        quiet: true
        that:
          - "_opencode_paths == [{'mount': 'secrets-external', 'path': 'ai/saas/opencode', 'optional': true}]"
          - _seed_source is search("default\\('secrets-external', true\\)")
          - _identity_source is search('openbao_secrets_ai_api_key_path_prefix }}/opencode')
          - "'OPENCODE_API_KEY' in _identity_source"
        fail_msg: >-
          OpenCode Go must read OPENCODE_API_KEY from secrets-external/ai/saas/opencode.
      vars:
        _local_llm_domain: >-
          {{ _identity_defaults._openbao_secrets_static_domains_identities
             | selectattr('name', 'equalto', 'local-llm') | first }}
        _opencode_paths: >-
          {{ _local_llm_domain.paths | select('mapping')
             | selectattr('path', 'equalto',
               openbao_secrets_ai_api_key_path_prefix ~ '/opencode') | list }}
        _seed_source: "{{ lookup('ansible.builtin.file', _seed_file) }}"
        _identity_source: "{{ lookup('ansible.builtin.file', _identities_file) }}"
