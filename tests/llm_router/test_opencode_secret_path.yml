---
- name: Verify OpenCode Go uses its external OpenBao path only
  hosts: localhost
  gather_facts: false
  vars:
    _identities_file: "{{ playbook_dir }}/../../inventory/group_vars/all/openbao_secrets/10-domains-identities.yml"
    _domains_file: "{{ playbook_dir }}/../../inventory/group_vars/all/openbao_secrets/10-domains.yml"
    _seed_file: "{{ playbook_dir }}/../../inventory/group_vars/all/openbao_secrets/00-seed-vars.yml"
    openbao_secrets_ai_api_key_mount: secret
    openbao_secrets_ai_api_key_path_prefix: ai/saas
  tasks:
    - name: Load the OpenBao domain declarations
      ansible.builtin.include_vars:
        file: "{{ _identities_file }}"
        name: _identity_defaults

    - name: Load the fleet OpenBao domain declarations
      ansible.builtin.include_vars:
        file: "{{ _domains_file }}"
        name: _domain_defaults

    - name: Check the OpenCode path mount and the shared provider paths
      ansible.builtin.assert:
        quiet: true
        that:
          - "_opencode_paths == [{'mount': 'secrets-external', 'path': 'ai/saas/opencode', 'optional': true}]"
          - "_openrouter_paths == [{'mount': 'secret', 'path': 'ai/saas/openrouter'}]"
          - _shared_provider_paths | length == _provider_paths | length - 1
          - _shared_provider_paths | map(attribute='mount') | unique | list == ['secret']
          - >-
            (_provider_paths | map(attribute='path') | sort)
            == ['ai/saas/alibaba', 'ai/saas/anthropic', 'ai/saas/gemini',
                'ai/saas/openai', 'ai/saas/openai', 'ai/saas/openrouter',
                'ai/saas/opencode'] | sort
          - _seed_source is search("default\\('secret', true\\)")
          - "'OPENCODE_API_KEY' in _identity_source"
        fail_msg: >-
          Only OpenCode Go must read from secrets-external; every other SaaS key
          remains on secret/ai/saas/<provider>.
      vars:
        _local_llm_domain: >-
          {{ _identity_defaults._openbao_secrets_static_domains_identities
             | selectattr('name', 'equalto', 'local-llm') | first }}
        _ai_runner_domain: >-
          {{ _domain_defaults._openbao_secrets_static_domains_fleet
             | selectattr('name', 'equalto', 'ai-runner') | first }}
        _provider_path_names:
          - ai/saas/openrouter
          - ai/saas/opencode
          - ai/saas/gemini
          - ai/saas/alibaba
          - ai/saas/openai
          - ai/saas/anthropic
        _provider_paths: >-
          {{ (_local_llm_domain.paths + _ai_runner_domain.paths)
             | select('mapping')
             | selectattr('path', 'in', _provider_path_names) | list }}
        _shared_provider_paths: >-
          {{ _provider_paths
             | rejectattr('path', 'equalto', 'ai/saas/opencode') | list }}
        _openrouter_paths: >-
          {{ _provider_paths | selectattr('path', 'equalto',
             'ai/saas/openrouter') | list }}
        _opencode_paths: >-
          {{ _provider_paths | selectattr('path', 'equalto',
             'ai/saas/opencode') | list }}
        _seed_source: "{{ lookup('ansible.builtin.file', _seed_file) }}"
        _identity_source: "{{ lookup('ansible.builtin.file', _identities_file) }}"
