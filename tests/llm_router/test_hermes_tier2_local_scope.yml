---
# Tier-2 Hermes profiles use only the local class scope rendered by the shared
# priority projection; public and ZDR profile checks retain their own ladders.
#
# Run from the repository root:
#   ansible-playbook tests/llm_router/test_hermes_tier2_local_scope.yml -i localhost, -c local
- name: Verify tier-2 Hermes keys match their local model scope
  hosts: localhost
  gather_facts: false
  vars_files:
    - policy_fixture.yml
    - ../../inventory/group_vars/all/02-gpu-accelerator.yml
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets:
      OPENROUTER_API_KEY: test-openrouter-provider-key
      OPENCODE_API_KEY: test-opencode-provider-key
      OPENAI_API_KEY: test-openai-provider-key
    bao_apps_secrets:
      hermes_default_llm_router_key: sk-fixture-hermes-default
      hermes_private_llm_router_key: sk-fixture-hermes-private
      donna_llm_router_key: sk-fixture-donna
      hermes_eval_llm_router_key: sk-fixture-hermes-eval
      hermes_splunk_admin_llm_router_key: sk-fixture-hermes-splunk-admin
      hermes_homelab_admin_llm_router_key: sk-fixture-hermes-homelab-admin
      hermes_github_maint_llm_router_key: sk-fixture-hermes-github-maint
      hermes_orchestrator_llm_router_key: sk-fixture-hermes-orchestrator
    hermes_agent_profiles:
      - name: eval
      - name: splunk-admin
      - name: homelab-admin
      - name: github-maint
      - name: orchestrator
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: "pve.example.test"
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: default
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the fabric model registry the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Model the trusted callers these projections assume
      ansible.builtin.import_tasks: "{{ playbook_dir }}/tasks/trust_fixture_callers.yml"

    - name: Define the tier-1 public Hermes chain for the rendered fixture
      ansible.builtin.set_fact:
        _tier_1_public_fixture_models: >-
          {{ (_llm_router_directly_callable_ladder_names
              + llm_router_hermes_default_fallback_chain)
             | reject('in', _llm_router_agent_excluded_groups) | unique | list }}

    - name: Select the rendered tier-2 cron profile keys by scope
      ansible.builtin.set_fact:
        _tier_2_cron_keys: >-
          {{ _llm_router_virtual_keys_without_values
             | selectattr('alias', 'match', '^hermes-')
             | selectattr('priority_tier', 'equalto', 2)
             | rejectattr('alias', 'in',
                 (_llm_router_hermes_local_only_profiles
                  | map('regex_replace', '^', 'hermes-') | list)) | list }}
      no_log: true

    - name: Confirm the four cron profiles use the tier-2 local projection
      ansible.builtin.assert:
        quiet: true
        that:
          - _tier_2_cron_keys | length == 4
          - _tier_2_cron_keys | selectattr('priority_tier', 'equalto', 2) | list | length == 4
          - _tier_2_cron_keys | selectattr('allowed_classes', 'equalto', ['local']) | list | length == 4
          - _tier_2_cron_keys | map(attribute='models') | flatten
            | intersect(_cloud_groups) | length == 0
          - _tier_2_cron_keys | selectattr('models', 'contains', llm_router_review_aliases.local)
            | list | length == 4
      vars:
        _cloud_groups: >-
          {{ llm_router_d1_group_class_by_name | dict2items
             | rejectattr('value', 'equalto', 'local') | map(attribute='key') | list }}

    - name: Assert the rendered Hermes profiles satisfy their tier and tag scopes
      ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-hermes-profile-key-brain-model.yml"

    - name: Model a tier-1 public Hermes key holding the whole chain
      ansible.builtin.set_fact:
        _tier_1_public_profile_key:
          alias: hermes-tier1-public-fixture
          priority_tier: 1
          sensitivity_tag: "&sensitivity:public"
          tags: []
          models: "{{ _tier_1_public_fixture_models }}"

    - name: Save the rendered tier-1 public key's complete chain
      ansible.builtin.set_fact:
        _tier_1_public_required_models: "{{ _tier_1_public_profile_key.models }}"

    - name: Select a cloud-class group and the rendered tier-2 profile for a negative check
      ansible.builtin.set_fact:
        _tier_2_cloud_group: >-
          {{ llm_router_d1_group_class_by_name | dict2items
             | rejectattr('value', 'equalto', 'local') | map(attribute='key') | first }}
        _tier_2_profile_key: "{{ _tier_2_cron_keys | first }}"

    - name: Add a cloud group to the tier-2 key fixture
      ansible.builtin.set_fact:
        _llm_router_virtual_keys_without_values: >-
          {{ [_tier_2_profile_key | combine({
               'models': _tier_2_profile_key.models + [_tier_2_cloud_group]})] }}

    - name: Capture rejection of a cloud group on a tier-2 key
      block:
        - name: Run the profile scope assertion against the cloud-expanded tier-2 key
          ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-hermes-profile-key-brain-model.yml"
      rescue:
        - name: Record the tier-2 cloud scope assertion failure
          ansible.builtin.set_fact:
            _tier_2_cloud_scope_failure: "{{ ansible_failed_result }}"
          no_log: true

    - name: Confirm the tier-2 scope rejects the cloud group
      ansible.builtin.assert:
        quiet: true
        that:
          - _tier_2_cloud_scope_failure is defined
          - _tier_2_cloud_group in (_tier_2_cloud_scope_failure | to_json)

    - name: Model a tier-1 public Hermes key missing one chain member
      ansible.builtin.set_fact:
        _llm_router_virtual_keys_without_values: >-
          {{ [_tier_1_public_profile_key | combine({
               'models': _tier_1_public_required_models[:-1]})] }}

    - name: Capture rejection of an under-scoped tier-1 public key
      block:
        - name: Run the profile scope assertion against the incomplete tier-1 chain
          ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-hermes-profile-key-brain-model.yml"
      rescue:
        - name: Record the tier-1 public chain assertion failure
          ansible.builtin.set_fact:
            _tier_1_public_scope_failure: "{{ ansible_failed_result }}"
          no_log: true

    - name: Confirm the tier-1 public key still requires the whole chain
      ansible.builtin.assert:
        quiet: true
        that:
          - _tier_1_public_required_models | length > 0
          - _tier_1_public_scope_failure is defined
          - _tier_1_public_required_models[-1] in (_tier_1_public_scope_failure | to_json)
