---
- name: Send env-marker router settings as their resolved values
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    llm_router_redis_host: redis.example.invalid
    _router_config: |
      router_settings:
        redis_host: os.environ/LLM_ROUTER_REDIS_HOST
        redis_password: os.environ/LLM_ROUTER_REDIS_PASSWORD
        redis_port: 6379
        routing_strategy: simple-shuffle
        routing_groups: [stale]
        extra_marker: os.environ/OTHER
    llm_router_rendered_config:
      content: "{{ _router_config | b64encode }}"
  tasks:
    - name: Load the payload and marker defaults
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/{{ item }}"
      loop:
        - 45-database.yml
        - 76-drift.yml

    - name: Resolve mapped markers, drop the credential, and clear routing groups
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_settings_payload.redis_host == 'redis.example.invalid'
          - "'redis_password' not in _llm_router_settings_payload"
          - _llm_router_settings_payload.redis_port == 6379
          - _llm_router_settings_payload.routing_strategy == 'simple-shuffle'
          - _llm_router_settings_payload.routing_groups == []
          - _llm_router_settings_payload.extra_marker == 'os.environ/OTHER'
