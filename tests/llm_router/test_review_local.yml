---
# Local-only model-group behavior for the two parameterized database roles.
- name: Verify the DB roles fail fast and retain local key scopes
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_apps_secrets:
      judge_llm_router_key: sk-fixture-judge
      recorder_llm_router_key: sk-fixture-recorder
    llm_router_subdomain: "pve.example.test"
    llm_large_serving_host: llm-large
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_router_retry_after_seconds: 2
    hermes_goal_judge_model: judge
    hermes_brain_model: "{{ llm_router_primary_model }}"
    hindsight_retain_model: "{{ llm_router_small_model }}"
    bao_local_llm_secrets: {}
  tasks:
    - name: Load the role defaults and registry
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load registry projections
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Render the router fallback map and local keys
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"
        _keys: "{{ llm_router_virtual_keys }}"

    - name: Roles fail fast and keys stay local-only
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_local_only_fail_fast_names | sort == (llm_router_role_deployments | map(attribute='role') | sort)
          - _empty_fallbacks | length == llm_router_role_deployments | length
          - _local_keys | length == llm_router_role_deployments | length
          - _local_keys | selectattr('allowed_classes', 'equalto', ['local']) | list | length == _local_keys | length
          - _local_keys | map(attribute='models') | flatten | intersect(_cloud_groups) | length == 0
        fail_msg: "roles={{ llm_router_local_only_fail_fast_names }}, keys={{ _local_keys }}"
      vars:
        _empty_fallbacks: >-
          {{ _config.router_settings.fallbacks | map('dict2items') | flatten
             | selectattr('key', 'in', llm_router_local_only_fail_fast_names)
             | selectattr('value', 'equalto', []) | list }}
        _local_keys: >-
          {{ _keys | selectattr('alias', 'in', (llm_router_role_deployments | map(attribute='role') | list)) | list }}
        _cloud_groups: >-
          {{ llm_router_d1_group_class_by_name | dict2items
             | rejectattr('value', 'equalto', 'local') | map(attribute='key') | list }}
