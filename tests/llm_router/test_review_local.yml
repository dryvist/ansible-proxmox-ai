---
# The recorder stays local-only; the judge has a ZDR fallback chain.
- name: Verify the recorder's local-only scope and judge ZDR access
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_apps_secrets:
      judge_llm_router_key: sk-fixture-judge
      recorder_llm_router_key: sk-fixture-recorder
    llm_router_subdomain: "pve.example.test"
    llm_large_serving_host: llm-large
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    ai_router_retry_after_seconds: 2
    hermes_goal_judge_model: judge
    hermes_brain_model: "{{ llm_router_primary_model }}"
    hindsight_retain_model: "{{ llm_router_small_model }}"
    bao_local_llm_secrets: {}
  tasks:
    - name: Load the role defaults and registry
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Set the render's test subdomain after loading role defaults
      ansible.builtin.set_fact:
        llm_router_subdomain: "pve.example.test"

    - name: Load registry projections
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Render the router fallback map and local keys
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"
        _keys: "{{ llm_router_virtual_keys }}"

    - name: Recorder fails fast while judge uses the standard ZDR chain
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_local_only_fail_fast_names | sort == _local_roles | sort
          - _empty_fallbacks | length == _local_roles | length
          - _local_keys | map(attribute='alias') | sort == _local_roles | sort
          - _local_keys | selectattr('allowed_classes', 'equalto', ['local']) | list | length == _local_keys | length
          - _local_keys | map(attribute='models') | flatten | intersect(_cloud_groups) | length == 0
          - _judge.fallbacks == llm_router_d1_zdr_ladder_groups
          - _judge_key.allowed_classes == _llm_router_consumer_classes_zdr
          - _judge_key.models | intersect(_unsafe_rungs) | length == 0
          - "'&zdr' in _judge_key.tags"
          - "'!free' in _judge_key.tags"
          - "'!retains' in _judge_key.tags"
          - "'&local' not in _judge_key.tags"
        fail_msg: "roles={{ llm_router_local_only_fail_fast_names }}, keys={{ _local_keys }}"
      vars:
        _local_roles: >-
          {{ llm_router_role_deployments | selectattr('fallbacks', 'equalto', [])
             | map(attribute='role') | list }}
        _empty_fallbacks: >-
          {{ _config.router_settings.fallbacks | map('dict2items') | flatten
             | selectattr('key', 'in', llm_router_local_only_fail_fast_names)
             | selectattr('value', 'equalto', []) | list }}
        _local_keys: >-
          {{ _keys | selectattr('alias', 'in', _local_roles) | list }}
        _judge: >-
          {{ llm_router_role_deployments
             | selectattr('role', 'equalto', hermes_goal_judge_model) | first }}
        _judge_key: "{{ _keys | selectattr('alias', 'equalto', _judge.role) | first }}"
        _unsafe_rungs: >-
          {{ llm_router_d1_rungs_by_class['free']
             + llm_router_d1_rungs_by_class['retains'] }}
        _cloud_groups: >-
          {{ llm_router_d1_group_class_by_name | dict2items
             | rejectattr('value', 'equalto', 'local') | map(attribute='key') | list }}
