---
# Pins the `cheap` role's seed and the attempt bounds every DB role inherits
# from its registry entry (roles/llm_router/defaults/main/55-roles.yml).
#
# `cheap` is a first-seed auto-router role. The heuristic selector targets the
# first D1 rung, and its fallback tail follows the same class order.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_cheap_gpu_first_ladder.yml -i localhost, -c local
- name: Verify the cheap role's D1 ladder and heuristic router seed
  hosts: localhost
  gather_facts: false
  vars:
    _defaults_dir: "{{ playbook_dir }}/../../roles/llm_router/defaults/main"
    bao_apps_secrets: {}
    # The role params render api_base values from these, same fixture shape as
    # test_local_admission_cap.yml; only the bounds are under test here.
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    llm_large_serving_host: llm-large
    llm_router_subdomain: "pve.example.test"
    ai_router_request_timeout_seconds: 2400
    ai_ingress_response_header_timeout_seconds: 120
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _defaults_dir }}"

    - name: Load the fabric model registry the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Resolve the cheap deployment and the catalog auto-router entry
      ansible.builtin.set_fact:
        _cheap: "{{ llm_router_role_deployments | selectattr('role', 'equalto', 'cheap') | first }}"
        _auto: "{{ _llm_router_role_params['hermes-default'] }}"

    - name: Cheap uses the native heuristic router and the D1 tail
      ansible.builtin.assert:
        quiet: true
        that:
          - _cheap.model == 'hermes-default'
          - >-
            _cheap.fallbacks ==
            (llm_router_d1_ladder_groups
             | reject('equalto', llm_router_d1_auto_initial_group) | list)
          - _auto.complexity_router_config.classifier_type == 'heuristic'
          - _auto.complexity_router_config.default_model == llm_router_d1_auto_initial_group
        fail_msg: "cheap seed is {{ _cheap }}"
        success_msg: "cheap: heuristic -> {{ llm_router_d1_ladder_groups | join(' -> ') }}"

    - name: Cheap never escapes to long
      ansible.builtin.assert:
        quiet: true
        that:
          - "'cheap' not in llm_router_long_context_escape_roles"
