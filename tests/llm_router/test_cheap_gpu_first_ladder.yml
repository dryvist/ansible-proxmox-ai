---
# Pins the deprecated caller aliases and the hardware order behind `small`.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_cheap_gpu_first_ladder.yml -i localhost, -c local
- name: Verify the small alias's D1 ladder and heuristic router target
  hosts: localhost
  gather_facts: false
  vars:
    _defaults_dir: "{{ playbook_dir }}/../../roles/llm_router/defaults/main"
    bao_apps_secrets: {}
    # The role params render api_base values from these, same fixture shape as
    # test_local_admission_cap.yml; only the bounds are under test here.
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    llm_large_serving_host: llm-large
    llm_router_subdomain: "pve.example.test"
    ai_router_request_timeout_seconds: 2400
    ai_ingress_response_header_timeout_seconds: 120
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _defaults_dir }}"

    - name: Load the fabric model registry the way the converge does
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Resolve the small capability's registry route group
      ansible.builtin.set_fact:
        _small_group: >-
          {{ llm_router_small_capability_name }}

    - name: Resolve the small capability members
      ansible.builtin.set_fact:
        _small_members: >-
          {{ llm_router_capability_registry_members
             | selectattr('route_group', 'equalto', _small_group) | list }}

    - name: Legacy cheap and fast names point at the small capability
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_model_group_aliases.cheap == llm_router_small_model
          - llm_router_model_group_aliases.fast == llm_router_small_model
          - _small_members | map(attribute='order') | map('int') | sort == [1, 2, 3]
          - llm_router_small_model == llm_router_routine_model
        fail_msg: "small capability members={{ _small_members }} aliases={{ llm_router_model_group_aliases }}"
        success_msg: "fast and cheap target the ordered small capability members"

    - name: The deleted long name has no fallback or alias projection
      ansible.builtin.assert:
        quiet: true
        that:
          - "'long' not in llm_router_model_group_aliases"
          - "'long' not in llm_router_entry_point_names"
