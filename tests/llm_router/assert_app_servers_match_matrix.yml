---
- name: Assert app servers match the matrix
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        _mcp_servers.mcp_servers.keys() | sort | list
        == (['zammad', 'slack', 'drawio'] + (_llm_router_app_agent_matrix
            | selectattr('enabled') | map(attribute='server_id') | list)) | sort
      # LiteLLM server names cannot contain '-'.
      - _mcp_servers.mcp_servers.keys() | select('search', '-') | list | length == 0
      - >-
        _vikunja_read_server.args[-1]
        == '@democratize-technology/vikunja-mcp@' ~ llm_router_app_agent_vikunja_mcp_version
      - _vikunja_read_server.env.VIKUNJA_API_TOKEN == 'os.environ/' ~ _vikunja_read_row.token_env_key
      - _vikunja_read_row.token_field == 'VIKUNJA_AGENT_READ_TOKEN'
      - _vikunja_read_row.reader_domain == 'app-agent-vikunja-read'
      - _vikunja_read_row.token_value == openbao_secrets_by_domain['app-agent-vikunja-read'].VIKUNJA_AGENT_READ_TOKEN
      - _vikunja_write_row.token_field == 'VIKUNJA_AGENT_WRITE_TOKEN'
      - _vikunja_write_row.reader_domain == 'app-agent-vikunja-write'
      - _vikunja_write_row.token_value == openbao_secrets_by_domain['app-agent-vikunja-write'].VIKUNJA_AGENT_WRITE_TOKEN
      - _vikunja_write_row.token_value != bao_local_llm_secrets.VIKUNJA_MCP_TOKEN_RW
      - _vikunja_clerk_row.server_id == 'vikunja_clerk'
      - _vikunja_clerk_row.token_field == 'VIKUNJA_AGENT_CLERK_TOKEN'
      - _vikunja_clerk_row.reader_domain == 'app-agent-vikunja-clerk'
      - _vikunja_clerk_row.token_value == openbao_secrets_by_domain['app-agent-vikunja-clerk'].VIKUNJA_AGENT_CLERK_TOKEN
      - _vikunja_clerk_row.token_value != _vikunja_write_row.token_value
      - _vikunja_clerk_row.holder == 'profile'
      - _vikunja_clerk_row.enabled
      - _vikunja_clerk_server.env.VIKUNJA_API_TOKEN == 'os.environ/' ~ _vikunja_clerk_row.token_env_key
      - _vikunja_clerk_row.allowed_tools == ['vikunja_tasks', 'vikunja_projects', 'vikunja_labels']
      - "'vikunja_filters' not in _vikunja_clerk_row.allowed_tools"
      - _zammad_write_row.token_field == 'ZAMMAD_AGENT_WRITE_TOKEN'
      - _zammad_write_row.reader_domain == 'app-agent-zammad-write'
      - _zammad_write_row.token_value == openbao_secrets_by_domain['app-agent-zammad-write'].ZAMMAD_AGENT_WRITE_TOKEN
      - _youtrack_write_row.transport == 'http'
      - _youtrack_write_row.url_value == 'https://youtrack.' ~ llm_router_subdomain ~ '/mcp'
      - _youtrack_write_row.token_field == 'YOUTRACK_AGENT_WRITE_TOKEN'
      - _youtrack_write_row.reader_domain == 'app-agent-youtrack-write'
      - >-
        _youtrack_write_row.token_value
        == openbao_secrets_by_domain['app-agent-youtrack-write'].YOUTRACK_AGENT_WRITE_TOKEN
      - >-
        _youtrack_write_row.allowed_tools
        == ['search_issues', 'get_issue', 'get_issue_comments', 'add_issue_comment',
            'create_issue', 'update_issue', 'change_issue_assignee', 'get_issue_fields_schema',
            'find_projects', 'get_project', 'find_user', 'link_issues', 'manage_issue_tags',
            'log_work', 'get_saved_issue_searches', 'get_current_user', 'search_articles',
            'get_article', 'create_article', 'update_article']
      - _semaphore_write_row.url_value == 'https://semaphore.' ~ llm_router_subdomain
      - _semaphore_write_row.reader_domain == 'app-agent-semaphore-write'
      - "_semaphore_write_row.token_value not in (_mcp_servers | to_json)"
      - >-
        _semaphore_write_row.allowed_tools
        | select('search', '(create|update|delete|restart|bulk|key|user|backup|stop_all)')
        | list | length == 0
      - >-
        _semaphore_write_row.token_value
        == openbao_secrets_by_domain['app-agent-semaphore-write'].SEMAPHORE_AGENT_WRITE_TOKEN
      - >-
        llm_router_app_agent_tiers | selectattr('token_field', 'equalto', 'VIKUNJA_MCP_TOKEN_RW')
        | list | length == 0
      - _vikunja_read_row.allowed_tools | select('search', '(create|update|add|delete|comment)') | list == []
      - llm_router_app_agent_matrix_markdown | trim == _matrix_file | trim
      - "'_app_agent.token_env_key' in _environment_template"
      - "'_app_agent.token_value' in _environment_template"
      - "'/mcp-rest/tools/call' in (_probe_tasks | to_json)"
      - (_probe_tasks | rejectattr('no_log', 'defined') | to_json) is not search('Bearer')
      - _probe_tasks | rejectattr('tags', 'defined') | list == []
    fail_msg: The app-agent matrix, isolated server permissions, probe, or generated knowledge table drifted.
  vars:
    _vikunja_read_row: "{{ _llm_router_app_agent_matrix | selectattr('id', 'equalto', 'vikunja-read') | first }}"
    _vikunja_write_row: "{{ _llm_router_app_agent_matrix | selectattr('id', 'equalto', 'vikunja-write') | first }}"
    _vikunja_clerk_row: "{{ _llm_router_app_agent_matrix | selectattr('id', 'equalto', 'vikunja-clerk') | first }}"
    _zammad_write_row: "{{ _llm_router_app_agent_matrix | selectattr('id', 'equalto', 'zammad-write') | first }}"
    _youtrack_write_row: "{{ _llm_router_app_agent_matrix | selectattr('id', 'equalto', 'youtrack-write') | first }}"
    _semaphore_write_row: "{{ _llm_router_app_agent_matrix | selectattr('id', 'equalto', 'semaphore-write') | first }}"
    _vikunja_read_server: "{{ _mcp_servers.mcp_servers[_vikunja_read_row.server_id] }}"
    _vikunja_clerk_server: "{{ _mcp_servers.mcp_servers[_vikunja_clerk_row.server_id] }}"
  no_log: true
