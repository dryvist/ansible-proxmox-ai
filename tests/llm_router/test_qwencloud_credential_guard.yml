---
- name: Verify Qwen Token Plan registry entries and projections
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../inventory/group_vars/all/02-gpu-accelerator.yml
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    _credentialed_render_extra_secrets: >-
      {{ {
        (llm_router_hermes_cloud_models
         | selectattr('provider', 'equalto', 'openai')
         | selectattr('api_base_field', 'defined')
         | map(attribute='credential_env') | first): 'test-token',
        (llm_router_hermes_cloud_models
         | selectattr('provider', 'equalto', 'openai')
         | selectattr('api_base_field', 'defined')
         | map(attribute='api_base_field') | first): 'https://example.invalid/v1'
      } }}
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 2
    ai_ingress_response_header_timeout_seconds: 120
    hermes_brain_model: medium
    hindsight_retain_model: qwen3-4b
    hermes_goal_judge_model: judge
  tasks:
    - name: Render with synthetic Qwen credential fields
      ansible.builtin.import_tasks: tasks/credentialed_render.yml

    - name: Select Qwen entries from the registry provider projection
      ansible.builtin.set_fact:
        _qwen_entries: >-
          {{ llm_router_hermes_cloud_models
             | selectattr('provider', 'equalto', 'openai')
             | selectattr('api_base_field', 'defined')
             | list }}

    - name: Save the fully credentialed inputs for missing-field render cases
      ansible.builtin.set_fact:
        _qwen_resolved_credentials_with_key: "{{ _llm_router_m_resolved_credentials }}"
        _qwen_resolved_api_bases_with_endpoint: "{{ _llm_router_m_resolved_api_bases }}"
        _qwen_secrets_with_both_fields: "{{ bao_local_llm_secrets }}"
        _qwen_route_groups: "{{ _qwen_entries | map(attribute='route_group') | list }}"
        _qwen_non_qwen_deployments: >-
          {{ _config.model_list
             | rejectattr('model_name', 'in', _qwen_entries | map(attribute='route_group') | list)
             | list }}
      no_log: true

    - name: Set an empty Qwen endpoint and remove its resolved endpoint projection
      ansible.builtin.set_fact:
        bao_local_llm_secrets: >-
          {{ _qwen_secrets_with_both_fields
             | combine({(_qwen_entries | first).api_base_field: ''}) }}
        _llm_router_m_resolved_credentials: "{{ _qwen_resolved_credentials_with_key }}"
        _llm_router_m_resolved_api_bases: >-
          {{ _qwen_resolved_api_bases_with_endpoint | dict2items
             | rejectattr('key', 'in', _qwen_entries | map(attribute='client_model_id') | list)
             | items2dict }}
      no_log: true

    - name: Recompute the credentialed projection without the Qwen endpoint
      ansible.builtin.set_fact:
        _llm_router_m_hermes_cloud_models_credentialed: "{{ llm_router_hermes_cloud_models_credentialed }}"
      no_log: true

    - name: Capture the expected missing-endpoint assertion failure
      block:
        - name: Require the Qwen endpoint assertion to fail
          ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-hermes-cloud-credentialed-models.yml"
        - name: Fail if the Qwen endpoint assertion passed
          ansible.builtin.fail:
            msg: The missing Qwen endpoint unexpectedly passed the credential assertion.
      rescue:
        - name: Keep the endpoint assertion message for its contract checks
          ansible.builtin.set_fact:
            _qwen_endpoint_failure_message: "{{ ansible_failed_result.msg | default('') }}"

    - name: Assert an empty endpoint failure names the model, gate, and field status
      ansible.builtin.assert:
        quiet: true
        that:
          - _qwen_endpoint_failure_message is search((_qwen_entries | first).client_model_id)
          - _qwen_endpoint_failure_message is search('api_base')
          - _qwen_endpoint_failure_message is search((_qwen_entries | first).api_base_field)
          - _qwen_endpoint_failure_message is search('present=true')
          - _qwen_endpoint_failure_message is search('empty_after_trim=true')
          - _qwen_endpoint_failure_message is not search('test-token')
          - _qwen_endpoint_failure_message is not search('https://example.invalid')
        fail_msg: "An empty Qwen endpoint failure did not identify its model, gate, and field status."

    - name: Remove both Qwen fields from OpenBao and their resolved projections
      ansible.builtin.set_fact:
        bao_local_llm_secrets: >-
          {{ _qwen_secrets_with_both_fields | dict2items
             | rejectattr('key', 'in', [
                 (_qwen_entries | first).key_field,
                 (_qwen_entries | first).api_base_field
               ])
             | items2dict }}
        _llm_router_m_resolved_credentials: >-
          {{ _qwen_resolved_credentials_with_key | dict2items
             | rejectattr('key', 'equalto', (_qwen_entries | first).credential_env)
             | items2dict }}
        _llm_router_m_resolved_api_bases: >-
          {{ _qwen_resolved_api_bases_with_endpoint | dict2items
             | rejectattr('key', 'in', _qwen_entries | map(attribute='client_model_id') | list)
             | items2dict }}
      no_log: true

    - name: Recompute the credentialed projection without either Qwen field
      ansible.builtin.set_fact:
        _llm_router_m_hermes_cloud_models_credentialed: "{{ llm_router_hermes_cloud_models_credentialed }}"
      no_log: true

    - name: Allow Qwen models with neither field seeded and emit name-only warnings
      ansible.builtin.include_tasks: "{{ _role_dir }}/tasks/assert-hermes-cloud-credentialed-models.yml"

    - name: Assert unseeded Qwen models warn by name without failing
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _llm_router_hermes_cloud_credential_gate_failures
            | selectattr('client_model_id', 'in', _qwen_entries | map(attribute='client_model_id') | list)
            | list | length == 0
          - >-
            _llm_router_hermes_cloud_unseeded_models
            | selectattr('client_model_id', 'equalto', (_qwen_entries | first).client_model_id)
            | list | length == 1
          - >-
            _llm_router_hermes_cloud_credential_warnings.results
            | map(attribute='msg') | join(' ')
            is search((_qwen_entries | first).client_model_id)
          - >-
            _llm_router_hermes_cloud_credential_warnings.results
            | map(attribute='msg') | join(' ')
            is search((_qwen_entries | first).key_field)
          - >-
            _llm_router_hermes_cloud_credential_warnings.results
            | map(attribute='msg') | join(' ')
            is search((_qwen_entries | first).api_base_field)
          - >-
            _llm_router_hermes_cloud_credential_warnings.results
            | map(attribute='msg') | join(' ')
            is search('not seeded')
          - >-
            (_llm_router_hermes_cloud_credential_warnings.results
             | map(attribute='msg') | join(' ')) is not search('test-token')
          - >-
            (_llm_router_hermes_cloud_credential_warnings.results
             | map(attribute='msg') | join(' ')) is not search('https://example.invalid')
        fail_msg: "Unseeded Qwen models must warn by name and remain non-fatal."

    - name: Render with the Qwen key present and its endpoint absent
      ansible.builtin.set_fact:
        _llm_router_m_resolved_credentials: "{{ _qwen_resolved_credentials_with_key }}"
        _llm_router_m_resolved_api_bases: >-
          {{ _qwen_resolved_api_bases_with_endpoint | dict2items
             | rejectattr('key', 'in', _qwen_entries | map(attribute='client_model_id') | list)
             | items2dict }}
      no_log: true

    - name: Recompute the cloud projection without the Qwen endpoint
      ansible.builtin.set_fact:
        _llm_router_m_hermes_cloud_models_credentialed: "{{ llm_router_hermes_cloud_models_credentialed }}"
      no_log: true

    - name: Render without the Qwen endpoint
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"
      no_log: true

    - name: Assert a missing Qwen endpoint omits Qwen and preserves other deployments
      ansible.builtin.assert:
        quiet: true
        that:
          - _config.model_list | selectattr('model_name', 'in', _qwen_route_groups) | list | length == 0
          - >-
            (_config.model_list
             | rejectattr('model_name', 'in', _qwen_route_groups) | list)
            == _qwen_non_qwen_deployments
        fail_msg: "A Qwen deployment rendered without its endpoint or removed another deployment."

    - name: Render with the Qwen endpoint present and its key absent
      ansible.builtin.set_fact:
        _llm_router_m_resolved_credentials: >-
          {{ _qwen_resolved_credentials_with_key | dict2items
             | rejectattr('key', 'in', _qwen_entries | map(attribute='credential_env') | list)
             | items2dict }}
        _llm_router_m_resolved_api_bases: "{{ _qwen_resolved_api_bases_with_endpoint }}"
      no_log: true

    - name: Recompute the cloud projection without the Qwen key
      ansible.builtin.set_fact:
        _llm_router_m_hermes_cloud_models_credentialed: "{{ llm_router_hermes_cloud_models_credentialed }}"
      no_log: true

    - name: Render without the Qwen key
      ansible.builtin.set_fact:
        _config: "{{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}"
      no_log: true

    - name: Assert a missing Qwen key omits Qwen and preserves other deployments
      ansible.builtin.assert:
        quiet: true
        that:
          - _config.model_list | selectattr('model_name', 'in', _qwen_route_groups) | list | length == 0
          - >-
            (_config.model_list
             | rejectattr('model_name', 'in', _qwen_route_groups) | list)
            == _qwen_non_qwen_deployments
        fail_msg: "A Qwen deployment rendered without its key or removed another deployment."
