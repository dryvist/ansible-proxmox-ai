---
- name: Existing keys receive trace and sensitivity defaults without changing UI policy
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    llm_router_seed_mode: initial
    _llm_router_live_key_aliases: [steady, class-only]
    llm_router_mcp_default_object_permission:
      mcp_servers: [no-mcp-servers]
  tasks:
    - name: Extract the real policy expression
      ansible.builtin.set_fact:
        _expr: >-
          {{ (lookup('file', _role_dir ~ '/tasks/reconcile-seeded-key-policy.yml') | from_yaml | first)
             ['ansible.builtin.set_fact']['_llm_router_key_updates'] }}
    - name: Allocate a renderable expression
      ansible.builtin.tempfile:
        state: file
        suffix: .j2
      register: _diff_template_file
    - name: Write the actual expression
      ansible.builtin.copy:
        dest: "{{ _diff_template_file.path }}"
        content: "{{ _expr }}"
        mode: '0600'
    - name: Render initial mode with a changed trace default and unrelated UI metadata
      ansible.builtin.set_fact:
        _trace_updates: "{{ lookup('ansible.builtin.template', _diff_template_file.path) }}"
      vars:
        llm_router_virtual_keys:
          - alias: steady
            value: sk-test-trace-key
            models: [cheap]
            metadata:
              trace_defaults: {client: steady, purpose: live}
              trace_required: [run_id]
          - alias: class-only
            value: sk-test-class-key
            models: [cheap]
        llm_router_existing_keys:
          json:
            keys:
              - key_alias: steady
                models: [cheap]
                metadata:
                  app: ui-owned-app
                  tags: [ui-edited]
                  other: keep-me
                  trace_defaults: {client: outdated}
                object_permission: {mcp_servers: [no-mcp-servers]}
              - key_alias: class-only
                models: [cheap]
                metadata:
                  app: class-only
                  tier: local
                  tags: [keep-tag, '&sensitivity:public']
                object_permission: {mcp_servers: [no-mcp-servers]}

    - name: Initial mode updates trace defaults while preserving UI policy
      ansible.builtin.assert:
        quiet: true
        that:
          - _trace_updates | length == 2
          - >-
            (_trace_updates | selectattr('alias', 'equalto', 'steady') | first).body.metadata.trace_defaults
            == {'client': 'steady', 'purpose': 'live'}
          - >-
            (_trace_updates | selectattr('alias', 'equalto', 'steady') | first).body.metadata.trace_required
            == ['run_id']
          - >-
            (_trace_updates | selectattr('alias', 'equalto', 'steady') | first).body.metadata.app
            == 'ui-owned-app'
          - >-
            (_trace_updates | selectattr('alias', 'equalto', 'steady') | first).body.metadata.tags
            == ['ui-edited', '&sensitivity:sensitive']
          - >-
            (_trace_updates | selectattr('alias', 'equalto', 'steady') | first).body.metadata.other
            == 'keep-me'
          - >-
            'models' not in (_trace_updates | selectattr('alias', 'equalto', 'steady') | first).body
          - >-
            'allowed_routes' not in (_trace_updates | selectattr('alias', 'equalto', 'steady') | first).body
          - >-
            (_trace_updates | selectattr('alias', 'equalto', 'class-only') | first).body.metadata.tags
            == ['keep-tag', '&sensitivity:sensitive']
          - >-
            'trace_defaults' not in
            (_trace_updates | selectattr('alias', 'equalto', 'class-only') | first).body.metadata
          - >-
            'trace_required' not in
            (_trace_updates | selectattr('alias', 'equalto', 'class-only') | first).body.metadata

    - name: Remove the temporary expression
      ansible.builtin.file:
        path: "{{ _diff_template_file.path }}"
        state: absent
