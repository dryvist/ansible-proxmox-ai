---
- name: Verify one provider key enables only that fallback domain
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    _secrets_role_dir: "{{ playbook_dir }}/../../roles/openbao_secrets"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: mlx-community/Qwen3.8-27B-4bit
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
    openbao_secrets_kv_mount: test-kv
    openbao_secrets_ai_api_key_mount: test-external
    openbao_secrets_ai_api_key_path_prefix: test/provider-keys
  tasks:
    - name: Load the external provider secret contract
      ansible.builtin.include_vars:
        file: "{{ _secrets_role_dir }}/defaults/main.yml"
        name: _secrets_defaults

    - name: Provider keys use exact leaves on the external mount
      ansible.builtin.assert:
        quiet: true
        that:
          - _provider_paths == _expected_provider_paths
          - "'item.mount if item is mapping' in _fetch_task"
          - "'item.path if item is mapping' in _fetch_task"
          - "'openbao_secrets_ai_api_key_mount' in _secrets_defaults_source"
          - "'openbao_secrets_ai_api_key_path_prefix' in _secrets_defaults_source"
      vars:
        _local_llm_domain: >-
          {{ _secrets_defaults.openbao_secrets_domains
             | selectattr('name', 'equalto', 'local-llm') | first }}
        _provider_paths: >-
          {{ _local_llm_domain.paths | select('mapping') | list }}
        # The two vendor keys are optional: seeded only when their provider is
        # enabled, and dropped from the credentialed projection when absent.
        _expected_provider_paths:
          - mount: test-external
            path: test/provider-keys/openrouter
          - mount: test-external
            path: test/provider-keys/opencode
            optional: true
          - mount: test-external
            path: test/provider-keys/gemini
            optional: true
          - mount: test-external
            path: test/provider-keys/alibaba
            optional: true
          - mount: test-kv
            path: ai/mcp/nautobot
            optional: true
          # Not yet seeded; see tests/openbao_secrets/test_optional_paths_are_gated.yml.
          - mount: test-kv
            path: ai/phoenix
            optional: true
        _fetch_task: >-
          {{ lookup('ansible.builtin.file', _secrets_role_dir ~ '/tasks/fetch_domain.yml') }}
        _secrets_defaults_source: >-
          {{ lookup('ansible.builtin.file', _secrets_role_dir ~ '/defaults/main.yml') }}

    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Configure the shared budget store
      ansible.builtin.set_fact:
        llm_router_redis_host: redis.example.test
        llm_router_redis_password: test-only-not-a-real-password

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Seed only the OpenRouter provider credential
      ansible.builtin.set_fact:
        bao_local_llm_secrets:
          OPENROUTER_API_KEY: test-openrouter-provider-key
          # Explicitly blank rather than absent. A field missing from this dict
          # falls through to lookup('env', ...), so the "renders no credential"
          # assertions below would be reading the RUNNER's environment and pass
          # or fail on whether the operator happens to export one of these.
          # A whitespace field is the fixture saying "this provider has no
          # credential" in a way the fixture controls.
          OPENCODE_API_KEY: "   "
          GEMINI_API_KEY: "   "
          DASHSCOPE_API_KEY: "   "

    - name: Re-evaluate the Hermes cloud projections
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

    - name: Render the provider-scoped config and environment
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}
        _environment: >-
          {{ lookup('template', _role_dir ~ '/templates/litellm.env.j2') }}

    - name: OpenRouter and the always-on legs join the Hermes fallback chain
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_hermes_default_fallback_chain == _expected_chain
          - _fallback_chain == _expected_chain
          # EVERY group that can raise ContextWindowExceeded escapes to the
          # wider cloud rungs -- not just the narrow local leg. Without this
          # LiteLLM aborts the entire chain at the failing rung on an over-long
          # request instead of advancing past it, so the rungs listed above are
          # never tried -- the chain reads correct and serves nothing.
          #
          # Asserted as a SET of keys plus a uniform value, rather than as a
          # frozen list literal. The previous form pinned the exact one-entry
          # list, which is what let the primary and the auto-router's own tier
          # targets stay uncovered while this test stayed green: the literal
          # described what the map WAS, so it could never notice what the map
          # was MISSING.
          - >-
            _cwf_keys | sort == [
              'hermes-default', 'hermes-local-4080',
              'mlx-community/Qwen3.6-35B-A3B-4bit',
              'mlx-community/Qwen3.8-27B-4bit'
            ] | sort
          # The primary itself must be keyed. Five cron jobs died of exactly its
          # absence, one exceeding the served window by 482 tokens.
          - "'hermes-default' in _cwf_keys"
          # Every escape target is this provider's groups and nothing else --
          # the original intent of this test, preserved.
          - >-
            _config.router_settings.context_window_fallbacks
            | map('dict2items') | flatten | map(attribute='value') | unique
            == [['hermes-cloud-free', 'hermes-cloud-openrouter']]
          - _cloud_models | length == 2
          - _environment | regex_findall('(?m)^OPENROUTER_API_KEY=') | length == 1
          - _environment | regex_findall('(?m)^OPENCODE_API_KEY=') | length == 0
          - _environment | regex_findall('(?m)^GEMINI_API_KEY=') | length == 0
          - _environment | regex_findall('(?m)^DASHSCOPE_API_KEY=') | length == 0
        fail_msg: >-
          A single provider credential must enable only its own provider group;
          got chain={{ _fallback_chain }} and
          cloud={{ _cloud_models | map(attribute='litellm_params.model') | list }}.
      vars:
        # Order is policy-dependent (llm_router_hermes_narrow_legs_last, in
        # roles/llm_router/defaults/main/35-hermes-cloud.yml). The 4080 leg is
        # narrower than the primary, so under the default policy it goes LAST:
        # ahead of a cloud rung it aborts the whole chain on an over-long
        # request. Membership is what this task is really about -- one
        # credential enables one provider group -- but the order is stated for
        # both policies so a toggle flip surfaces here as a reviewed edit.
        _expected_chain: >-
          {{ ['hermes-cloud-free', 'hermes-cloud-openrouter', 'hermes-local-4080']
             if llm_router_hermes_narrow_legs_last | bool
             else ['hermes-local-4080', 'hermes-cloud-free',
                   'hermes-cloud-openrouter'] }}
        _cwf_keys: >-
          {{ _config.router_settings.context_window_fallbacks | default([])
             | map('dict2items') | flatten | map(attribute='key') | list }}
        _fallback_chain: >-
          {{ _config.router_settings.fallbacks
             | selectattr('hermes-default', 'defined')
             | map(attribute='hermes-default') | flatten }}
        # Cloud deployments IN that group, not every member. It also carries a
        # local survivor (no budget, higher order) so budget exhaustion filters
        # down to local instead of emptying the group — see the LOCAL SURVIVOR
        # block in model-list.yaml.j2. That member reaches the local serving
        # gate, not a provider, so a per-provider credential assertion must not
        # count it; matching on model_name alone did.
        _cloud_models: >-
          {{ _config.model_list
             | selectattr('model_name', 'equalto', 'hermes-cloud-openrouter')
             | selectattr('litellm_params.model', 'match', '^openrouter/') | list }}

- name: Verify whitespace credentials enable no provider
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: mlx-community/Qwen3.8-27B-4bit
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Seed whitespace-only provider fields
      ansible.builtin.set_fact:
        bao_local_llm_secrets:
          OPENROUTER_API_KEY: "   "
          OPENCODE_API_KEY: "  "
          GEMINI_API_KEY: "  "
          DASHSCOPE_API_KEY: "\n"

    - name: Re-evaluate the Hermes cloud projections
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

    - name: Render the empty-provider config and environment
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}
        _environment: >-
          {{ lookup('template', _role_dir ~ '/templates/litellm.env.j2') }}

    - name: Whitespace is never treated as a credential
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_hermes_default_fallback_chain == ['hermes-local-4080']
          - "_config.router_settings.fallbacks == [{'hermes-default': ['hermes-local-4080']}]"
          # No cloud rung means nowhere wider to escape to, so the key is
          # omitted entirely. An empty map would not be "no map" to LiteLLM --
          # it would take the escape branch and fall back to nothing, hiding
          # the real error.
          - "'context_window_fallbacks' not in _config.router_settings"
          - _cloud_models | length == 0
          - _openrouter_egress | length == 0
          - _opencode_deployments | length == 0
          - _environment | regex_findall('(?m)^(OPENROUTER|OPENCODE|GEMINI|DASHSCOPE)_API_KEY=') | length == 0
        fail_msg: >-
          Whitespace-only secret fields must render no cloud deployments,
          fallbacks, or environment credentials -- only the not-credential-gated
          local fallback.
      vars:
        _cloud_models: >-
          {{ _config.model_list
             | selectattr('model_name', 'match', '^hermes-cloud-') | list }}
        _openrouter_egress: >-
          {{ _config.model_list
             | selectattr('litellm_params.model', 'match', '^openrouter/') | list }}
        # Matched on the tier's own base URL, not on a name prefix: a renamed
        # entry would slip past a name match and this assertion would go quiet.
        _opencode_deployments: >-
          {{ _config.model_list
             | selectattr('litellm_params.api_base', 'defined')
             | selectattr('litellm_params.api_base', 'equalto',
                          llm_router_opencode_base_url) | list }}

- name: Verify the seeded OpenCode subscription tier renders once per upstream
  # Every other fixture in this file leaves OPENCODE_API_KEY unseeded, so the
  # tier's whole render block sat on the false branch of its credential gate and
  # nothing in it was ever executed. This play is the one that runs it.
  #
  # Every expectation below is DERIVED -- from the registry entries and from the
  # tier's own defaults. A literal model id, order or window typed here would be
  # a second place the value lives, which is the duplication llm-models.d/
  # exists to remove; it would also keep passing after the registry changed.
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: mlx-community/Qwen3.8-27B-4bit
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Seed the subscription credential and nothing else
      ansible.builtin.set_fact:
        bao_local_llm_secrets:
          OPENCODE_API_KEY: test-opencode-subscription-key
          # Blank, not absent: an absent field falls through to the runner's
          # own environment and the metered-tier assertions below would depend
          # on what the operator happens to export.
          OPENROUTER_API_KEY: "   "
          GEMINI_API_KEY: "   "
          DASHSCOPE_API_KEY: "   "

    - name: Re-evaluate the Hermes cloud projections
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

    - name: Render the config and environment with the subscription key present
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}
        _environment: >-
          {{ lookup('template', _role_dir ~ '/templates/litellm.env.j2') }}

    - name: One deployment per registered upstream, at the tier's order and window
      ansible.builtin.assert:
        quiet: true
        that:
          # Degenerate-fixture guard: if the tier were ever emptied, every
          # assertion below would hold vacuously and this play would prove
          # nothing while still reporting green.
          - llm_router_opencode_models | length > 0
          - _rendered_shape == _registry_shape
          - _environment | regex_findall('(?m)^OPENCODE_API_KEY=') | length == 1
          - _environment | regex_findall('(?m)^(OPENROUTER|GEMINI|DASHSCOPE)_API_KEY=') | length == 0
        fail_msg: >-
          The subscription tier does not project one deployment per upstream at
          the tier's order and the entry's registered window.
          rendered={{ _rendered_shape }} expected={{ _registry_shape }}.
        success_msg: >-
          {{ _rendered_shape | length }} subscription deployments render, one per
          registry entry, each at order {{ llm_router_opencode_default_order }}
          and its registered window.
      vars:
        _opencode_deployments: >-
          {{ _config.model_list
             | selectattr('litellm_params.api_base', 'defined')
             | selectattr('litellm_params.api_base', 'equalto',
                          llm_router_opencode_base_url) | list }}
        # One [name, order, window] row per rendered deployment against one per
        # registry entry. Sorted, NOT deduplicated: a second deployment under an
        # id already rendered is the banned duplicate this comparison exists to
        # catch, and anything that collapses repeats would hide exactly that.
        # Every expected value is read -- the id and window from the entry, the
        # order from the tier default -- so a registry edit moves both sides
        # together and a drifting template moves only one.
        _rendered_shape: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for d in _opencode_deployments -%}
          {%- set ns.rows = ns.rows + [[d.model_name,
                d.litellm_params.order | int,
                d.model_info.max_input_tokens | int]] -%}
          {%- endfor -%}
          {{ ns.rows | sort }}
        _registry_shape: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for m in llm_router_opencode_models -%}
          {%- set ns.rows = ns.rows + [[m.client_model_id,
                llm_router_opencode_default_order | int,
                m.context_window | int]] -%}
          {%- endfor -%}
          {{ ns.rows | sort }}

    - name: No subscription id shares a model group with a metered one
      # The collision this tier's id prefix exists to prevent. Two deployments
      # under one model_name form ONE LiteLLM model group, where the lower
      # `order` wins selection -- so a subscription entry sharing a metered
      # entry's id would capture that id's traffic at its own, much smaller,
      # window. Asserted structurally against both tiers rather than against the
      # two ids that collided once, so the next one is caught too.
      ansible.builtin.assert:
        quiet: true
        that:
          - _collisions | length == 0
        fail_msg: >-
          Subscription and metered tiers share client_model_id(s):
          {{ _collisions | join(', ') }} -- they render into one model group and
          the lower-order subscription deployment captures every request to the
          name, at its own narrower window. Give the subscription entry a
          distinct id.
        success_msg: "No subscription id collides with the metered tier."
      vars:
        _collisions: >-
          {{ llm_router_opencode_models | map(attribute='client_model_id') | list
             | intersect(llm_router_openrouter_models
                         | map(attribute='client_model_id') | list) }}
