---
- name: Verify one provider key enables only that fallback domain
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    _secrets_role_dir: "{{ playbook_dir }}/../../roles/openbao_secrets"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: mlx-community/Qwen3.8-27B-4bit
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
    openbao_secrets_ai_api_key_mount: test-external
    openbao_secrets_ai_api_key_path_prefix: test/provider-keys
  tasks:
    - name: Load the external provider secret contract
      ansible.builtin.include_vars:
        file: "{{ _secrets_role_dir }}/defaults/main.yml"
        name: _secrets_defaults

    - name: Provider keys use exact leaves on the external mount
      ansible.builtin.assert:
        quiet: true
        that:
          - _provider_paths == _expected_provider_paths
          - "'item.mount if item is mapping' in _fetch_task"
          - "'item.path if item is mapping' in _fetch_task"
          - "'openbao_secrets_ai_api_key_mount' in _secrets_defaults_source"
          - "'openbao_secrets_ai_api_key_path_prefix' in _secrets_defaults_source"
      vars:
        _local_llm_domain: >-
          {{ _secrets_defaults.openbao_secrets_domains
             | selectattr('name', 'equalto', 'local-llm') | first }}
        _provider_paths: >-
          {{ _local_llm_domain.paths | select('mapping') | list }}
        _expected_provider_paths:
          - mount: test-external
            path: test/provider-keys/openrouter
          - mount: test-external
            path: test/provider-keys/gemini
          - mount: test-external
            path: test/provider-keys/alibaba
        _fetch_task: >-
          {{ lookup('ansible.builtin.file', _secrets_role_dir ~ '/tasks/fetch_domain.yml') }}
        _secrets_defaults_source: >-
          {{ lookup('ansible.builtin.file', _secrets_role_dir ~ '/defaults/main.yml') }}

    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Configure the shared budget store
      ansible.builtin.set_fact:
        llm_router_redis_host: redis.example.test
        llm_router_redis_password: test-only-not-a-real-password

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Seed only the OpenRouter provider credential
      ansible.builtin.set_fact:
        bao_local_llm_secrets:
          OPENROUTER_API_KEY: test-openrouter-provider-key

    - name: Re-evaluate the Hermes cloud projections
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

    - name: Render the provider-scoped config and environment
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}
        _environment: >-
          {{ lookup('template', _role_dir ~ '/templates/litellm.env.j2') }}

    - name: OpenRouter and the always-on legs join the Hermes fallback chain
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            llm_router_hermes_default_fallback_chain
            == ['hermes-local-4080', 'hermes-cloud-free', 'hermes-cloud-openrouter']
          - "_fallback_chain == ['hermes-local-4080', 'hermes-cloud-free', 'hermes-cloud-openrouter']"
          - _cloud_models | length == 2
          - _environment | regex_findall('(?m)^OPENROUTER_API_KEY=') | length == 1
          - _environment | regex_findall('(?m)^GEMINI_API_KEY=') | length == 0
          - _environment | regex_findall('(?m)^DASHSCOPE_API_KEY=') | length == 0
        fail_msg: >-
          A single provider credential must enable only its own provider group;
          got chain={{ _fallback_chain }} and
          cloud={{ _cloud_models | map(attribute='litellm_params.model') | list }}.
      vars:
        _fallback_chain: >-
          {{ _config.router_settings.fallbacks
             | selectattr('hermes-default', 'defined')
             | map(attribute='hermes-default') | flatten }}
        _cloud_models: >-
          {{ _config.model_list
             | selectattr('model_name', 'equalto', 'hermes-cloud-openrouter') | list }}

- name: Verify whitespace credentials enable no provider
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_local_llm_secrets: {}
    ai_default_model: mlx-community/Qwen3.8-27B-4bit
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_orchestration_otel_endpoint: http://otel.example.test:4318
    ai_router_request_timeout_seconds: 2400
    ai_stream_read_timeout_seconds: 1800
    ai_router_retry_after_seconds: 40
    hermes_brain_model: hermes-default
    hermes_goal_judge_model: goal-judge
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load the model registry through the role
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Seed whitespace-only provider fields
      ansible.builtin.set_fact:
        bao_local_llm_secrets:
          OPENROUTER_API_KEY: "   "
          GEMINI_API_KEY: "  "
          DASHSCOPE_API_KEY: "\n"

    - name: Re-evaluate the Hermes cloud projections
      ansible.builtin.include_vars:
        file: "{{ _role_dir }}/defaults/main/35-hermes-cloud.yml"

    - name: Render the empty-provider config and environment
      ansible.builtin.set_fact:
        _config: >-
          {{ lookup('template', _role_dir ~ '/templates/config.yaml.j2') | from_yaml }}
        _environment: >-
          {{ lookup('template', _role_dir ~ '/templates/litellm.env.j2') }}

    - name: Whitespace is never treated as a credential
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_router_hermes_default_fallback_chain == ['hermes-local-4080']
          - "_config.router_settings.fallbacks == [{'hermes-default': ['hermes-local-4080']}]"
          - _cloud_models | length == 0
          - _openrouter_egress | length == 0
          - _environment | regex_findall('(?m)^(OPENROUTER|GEMINI|DASHSCOPE)_API_KEY=') | length == 0
        fail_msg: >-
          Whitespace-only secret fields must render no cloud deployments,
          fallbacks, or environment credentials -- only the not-credential-gated
          local fallback.
      vars:
        _cloud_models: >-
          {{ _config.model_list
             | selectattr('model_name', 'match', '^hermes-cloud-') | list }}
        _openrouter_egress: >-
          {{ _config.model_list
             | selectattr('litellm_params.model', 'match', '^openrouter/') | list }}
