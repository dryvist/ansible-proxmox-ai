---
- name: Verify CI keys use capabilities and retain their cloud permissions
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    tofu_data:
      constants:
        service_ports:
          llm_router_api: 4000
          llm_fast_api: 10434
          ollama_api: 11434
          otel_traces_http: 4318
          redis_default: 6379
    bao_apps_secrets:
      github_actions_llm_router_key: sk-fixture-gha
      github_actions_oss_llm_router_key: sk-fixture-gha-oss
      github_actions_ci_fix_llm_router_key: sk-fixture-ci-fix
      github_actions_pr_review_llm_router_key: sk-fixture-pr-review
    bao_local_llm_secrets: {}
    llm_router_oss_ci_key_enabled: true
    ai_default_model: "{{ llm_router_primary_model }}"
    llm_large_serving_host: llm-large
    llm_router_subdomain: pve.example.test
    llm_router_master_key: sk-test-master
    llm_router_llm_large_bearer: test-bearer-token
    ai_router_request_timeout_seconds: 2400
    hermes_brain_model: "{{ llm_router_primary_model }}"
    hindsight_retain_model: "{{ llm_router_small_model }}"
  tasks:
    - name: Load role defaults and the model registry
      ansible.builtin.include_vars:
        dir: "{{ _role_dir }}/defaults/main"

    - name: Load registry projections
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml

    - name: Private CI reaches local capabilities, its review aliases and CI Luna, and no cloud class
      ansible.builtin.assert:
        quiet: true
        that:
          - _gha.models[:3] == _capabilities
          - _gha.allowed_classes == ['local']
          - _gha.models | difference(_capabilities) | sort == (_gha_aliases + llm_router_ci_luna_groups) | sort
          - _gha.models | intersect(_review_aliases) | sort == _gha_aliases | sort
          - _gha.models | intersect(_cloud_groups) | difference(llm_router_ci_luna_groups) | length == 0
          - llm_router_external_free_rungs | intersect(_gha.models) | length == 0
          - llm_router_ci_luna_groups | difference(_gha.models) | length == 0
          - _review_aliases | map('extract', _aliases) | unique | list == [llm_router_primary_model]
          - _review_aliases | length == 3
        fail_msg: "gha={{ _gha.models }} classes={{ _gha.allowed_classes }}"
      vars:
        _capabilities: "{{ [llm_router_small_model, llm_router_primary_model, llm_router_large_model] }}"
        _gha_aliases: "{{ [llm_router_review_aliases.private, llm_router_review_aliases.local] }}"
        _cloud_groups: >-
          {{ ['sub', 'paid-zdr', 'free', 'retains']
             | map('extract', llm_router_d1_rungs_by_class) | flatten | unique | list }}
        _aliases: "{{ llm_router_model_group_aliases }}"
        _review_aliases: >-
          {{ _aliases | dict2items | selectattr('key', 'match', '^review-')
             | map(attribute='key') | list }}
        _gha: "{{ llm_router_virtual_keys | selectattr('alias', 'equalto', 'github-actions') | first }}"

    - name: Public CI reaches its review alias and the groups that alias walks, nothing wider
      ansible.builtin.assert:
        quiet: true
        that:
          - _gha_oss.models[0] == llm_router_review_aliases.oss
          - >-
            _gha_oss.models
            == ([llm_router_review_aliases.oss, llm_router_primary_model]
                + llm_router_review_oss_chain) | unique | list
          - llm_router_review_aliases.private not in _gha_oss.models
          - llm_router_review_aliases.local not in _gha_oss.models
          - llm_router_ci_luna_groups | intersect(_gha_oss.models) | length == 0
          - _gha_oss.sensitivity_tag == '&sensitivity:public'
        fail_msg: "gha-oss={{ _gha_oss.models }}"
      vars:
        _gha_oss: "{{ llm_router_virtual_keys | selectattr('alias', 'equalto', 'github-actions-oss') | first }}"

    - name: Event-specific local keys keep their medium capability and trace metadata
      ansible.builtin.assert:
        quiet: true
        that:
          - _ci_fix.models == [llm_router_primary_model]
          - _pr_review.models == [llm_router_primary_model]
          - _ci_fix.allowed_classes == ['local']
          - _pr_review.allowed_classes == ['local']
          - _ci_fix.tags == ['&zdr', '!free', '!retains', '&local']
          - _pr_review.tags == ['&zdr', '!free', '!retains', '&local']
          - _ci_fix.metadata.trace_defaults.agent_flow == 'ci-failure-fixer'
          - _ci_fix.metadata.trace_defaults.agent_trigger == 'workflow_run'
          - _pr_review.metadata.trace_defaults.agent_flow == 'pr-review-responder'
          - _pr_review.metadata.trace_defaults.agent_trigger == 'review-event'
        fail_msg: "ci-fix={{ _ci_fix }} pr-review={{ _pr_review }}"
      vars:
        _ci_fix: "{{ llm_router_virtual_keys | selectattr('alias', 'equalto', 'github-actions-ci-fix') | first }}"
        _pr_review: "{{ llm_router_virtual_keys | selectattr('alias', 'equalto', 'github-actions-pr-review') | first }}"
