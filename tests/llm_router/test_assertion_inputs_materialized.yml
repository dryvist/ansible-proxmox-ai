---
# The shared assertion inputs are materialized once, without changing their
# values or native list/dict shapes.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_assertion_inputs_materialized.yml -i localhost, -c local

- name: Verify router assertion inputs retain their values when materialized
  hosts: localhost
  gather_facts: false
  # This test runs with an inline inventory, like Semaphore's generated file.
  # It proves the production router inputs are explicitly loaded even when the
  # inventory source is not next to inventory/group_vars.
  vars_files:
    - "{{ playbook_dir }}/../../inventory/group_vars/all.yml"
    - "{{ playbook_dir }}/../../inventory/group_vars/llm_router_group.yml"
  vars:
    _role_defaults_dir: "{{ playbook_dir }}/../../roles/llm_router/defaults/main"
    bao_ai_public_secrets: {}
    bao_apps_secrets: {}
    bao_local_llm_secrets: {}
    hermes_agent_profiles:
      - name: splunk-admin
      - name: homelab-admin
      - name: github-maint
  tasks:
    - name: Load the router defaults as they ship
      ansible.builtin.include_vars:
        dir: "{{ _role_defaults_dir }}"

    - name: Load the same registry and role map as the router converge
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: registry.yml
        public: true

    - name: Validate Hermes cloud class and rank fields from the loaded registry
      ansible.builtin.import_tasks: >-
        {{ playbook_dir }}/../../roles/llm_router/tasks/assert-hermes-cloud-price-class.yml

    - name: Prepare malformed cloud entries for negative guard checks
      ansible.builtin.set_fact:
        _registry_with_missing_cloud_class: >-
          {{ llm_router_model_registry
             + [{'client_model_id': 'missing-class', 'tier': 'hermes-cloud',
                 'route_group': 'missing-class', 'route_rank': 10}] }}
        _registry_with_unknown_cloud_class: >-
          {{ llm_router_model_registry
             + [{'client_model_id': 'unknown-class', 'tier': 'hermes-cloud',
                 'route_group': 'unknown-class', 'price_class': 'other',
                 'route_rank': 10}] }}

    - name: The Hermes cloud class guard rejects a missing class
      block:
        - name: Try the guard with a route group missing its class
          ansible.builtin.include_tasks: >-
            {{ playbook_dir }}/../../roles/llm_router/tasks/assert-hermes-cloud-price-class.yml
          vars:
            llm_router_model_registry: "{{ _registry_with_missing_cloud_class }}"
      rescue:
        - name: Record that the missing class failed the guard
          ansible.builtin.set_fact:
            _missing_cloud_class_rejected: true

    - name: The Hermes cloud class guard rejects an unknown class
      block:
        - name: Try the guard with an unknown class
          ansible.builtin.include_tasks: >-
            {{ playbook_dir }}/../../roles/llm_router/tasks/assert-hermes-cloud-price-class.yml
          vars:
            llm_router_model_registry: "{{ _registry_with_unknown_cloud_class }}"
      rescue:
        - name: Record that the unknown class failed the guard
          ansible.builtin.set_fact:
            _unknown_cloud_class_rejected: true

    - name: Confirm the Hermes cloud class guard failed closed
      ansible.builtin.assert:
        quiet: true
        that:
          - _missing_cloud_class_rejected | default(false)
          - _unknown_cloud_class_rejected | default(false)

    - name: Confirm inventory-backed key-scope selectors load from source files
      ansible.builtin.assert:
        quiet: true
        that:
          - hermes_brain_model == 'medium'
          - hindsight_retain_model is string
          - hindsight_retain_model | length > 0
          - >-
            (_llm_router_static_virtual_keys
             | selectattr('alias', 'equalto', 'hindsight') | first).models
            == [hindsight_retain_model]

    - name: Supply the shared budget store required by the subscription rung
      ansible.builtin.set_fact:
        llm_router_redis_host: redis.example.test
        llm_router_redis_password: test-only-not-a-real-password

    - name: Refresh cached router projections after fixture input changes [assertion-inputs-materialized-1]
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Model a router with its per-node subscription login
      ansible.builtin.set_fact:
        llm_router_chatgpt_auth_file_present: true

    - name: Refresh cached router projections after fixture input changes [assertion-inputs-materialized-2]
      ansible.builtin.import_tasks: tasks/materialize_router_inputs.yml

    - name: Capture the lazy values before materialization
      ansible.builtin.set_fact:
        _llm_router_assertion_inputs_before:
          registry_enabled: "{{ llm_router_registry_enabled }}"
          role_deployments: "{{ llm_router_role_deployments }}"
          servable_models: "{{ llm_router_servable_models }}"
          gpu_servable_models: "{{ llm_router_gpu_servable_models }}"
          all_servable_models: "{{ llm_router_all_servable_models }}"
          hermes_router_ids: "{{ llm_router_hermes_router_ids }}"
          long_context_alias_ids: "{{ llm_router_long_context_alias_ids }}"
          credentialed_cloud_models: "{{ llm_router_hermes_cloud_models_credentialed }}"
          d1_rungs_by_class: "{{ llm_router_d1_rungs_by_class }}"
          d1_class_order: "{{ llm_router_d1_class_order }}"
          d1_ladder_groups: "{{ llm_router_d1_ladder_groups }}"
          hermes_cloud_fallback_groups: "{{ llm_router_hermes_cloud_fallback_groups }}"
          fallback_chain: "{{ llm_router_hermes_default_fallback_chain }}"
          zdr_asserted_group_names: "{{ llm_router_zdr_asserted_group_names }}"
          model_group_aliases: "{{ llm_router_model_group_aliases }}"
          directly_callable_ladder_names: "{{ _llm_router_directly_callable_ladder_names }}"
          key_scope_all: "{{ _llm_router_key_scope_all }}"
          virtual_keys: "{{ llm_router_virtual_keys }}"
      no_log: true

    - name: Materialize the router assertion inputs
      ansible.builtin.include_role:
        name: llm_router
        tasks_from: assertion-inputs.yml

    - name: Run the contracts that consume the cached projections
      ansible.builtin.import_tasks: >-
        {{ playbook_dir }}/../../roles/llm_router/tasks/assert-hermes-profile-key-brain-model.yml
    - name: Validate the cached fallback chain
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../../roles/llm_router/tasks/assert-fallback-chain.yml"
    - name: Validate the cached key and provider budgets
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../../roles/llm_router/tasks/assert-budget-backing.yml"
    - name: Validate the cached egress projection
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../../roles/llm_router/tasks/assert-egress.yml"

    - name: Confirm materialization preserves every assertion input
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_assertion_inputs_before.registry_enabled == llm_router_registry_enabled
          - _llm_router_assertion_inputs_before.role_deployments == llm_router_role_deployments
          - _llm_router_assertion_inputs_before.servable_models == llm_router_servable_models
          - _llm_router_assertion_inputs_before.gpu_servable_models == llm_router_gpu_servable_models
          - _llm_router_assertion_inputs_before.all_servable_models == llm_router_all_servable_models
          - _llm_router_assertion_inputs_before.hermes_router_ids == llm_router_hermes_router_ids
          - _llm_router_assertion_inputs_before.long_context_alias_ids == llm_router_long_context_alias_ids
          - >-
            _llm_router_assertion_inputs_before.credentialed_cloud_models
            == _llm_router_m_hermes_cloud_models_credentialed
          - _llm_router_assertion_inputs_before.d1_rungs_by_class == _llm_router_m_d1_rungs_by_class
          - _llm_router_assertion_inputs_before.d1_class_order == _llm_router_m_d1_class_order
          - _llm_router_assertion_inputs_before.d1_ladder_groups == _llm_router_m_d1_ladder_groups
          - >-
            _llm_router_assertion_inputs_before.hermes_cloud_fallback_groups
            == _llm_router_m_hermes_cloud_fallback_groups
          - _llm_router_assertion_inputs_before.fallback_chain == _llm_router_m_hermes_default_fallback_chain
          - _llm_router_assertion_inputs_before.zdr_asserted_group_names == llm_router_zdr_asserted_group_names
          - _llm_router_assertion_inputs_before.model_group_aliases == llm_router_model_group_aliases
          - >-
            _llm_router_assertion_inputs_before.directly_callable_ladder_names
            == _llm_router_directly_callable_ladder_names
          - _llm_router_assertion_inputs_before.key_scope_all == _llm_router_key_scope_all
          - _llm_router_assertion_inputs_before.virtual_keys == llm_router_virtual_keys
          - llm_router_registry_enabled | type_debug == 'list'
          - llm_router_role_deployments | type_debug == 'list'
          - llm_router_model_group_aliases | type_debug == 'dict'
          - _llm_router_m_d1_rungs_by_class | type_debug == 'dict'
          - _llm_router_m_d1_class_order | type_debug == 'list'
          - _llm_router_m_d1_ladder_groups | type_debug == 'list'
          - llm_router_virtual_keys | type_debug == 'list'
          - "'codex-subscription' in _llm_router_m_hermes_default_fallback_chain"
        fail_msg: >-
          Materializing router assertion inputs changed a value or native data
          shape; see roles/llm_router/tasks/assertion-inputs.yml.
        success_msg: Router assertion inputs keep their values and native types.
