---
# Pins the servable probe's verdict labels (roles/llm_router/tasks/assert-servable-parity.yml).
#
# These are the last three plays of test_servable_probe.yml, split out to keep
# each file under the repo's per-file token budget. Each play proves the judge
# reports an alias, a peer, a disabled registry id, or a 404 listing as its own
# verdict, instead of counting it as drift or as a pass.
#
# Fixture model ids are deliberately fake, as in test_servable_probe.yml.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/llm_router/test_servable_probe_verdicts.yml -i localhost, -c local

- name: Records the gate labels alias or peer are not mistaken for unregistered drift
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    # Only fixture-model-a is registered. The other two ids are unregistered and
    # would each be fatal above — the ONLY thing that exempts them here is the
    # gate's own label on the record. An alias appears in the listing when the
    # gate enables alias listing; a peer appears when it federates, under an id
    # form no registry entry can ever carry. Both are working configurations,
    # so flagging them would be a false fatal over a healthy name.
    #
    # The conservative default is proven by the play above rather than restated
    # here: its fixtures carry NO label at all and are still fatal, so an
    # unlabelled record counts as a model and a gate that stops publishing this
    # field degrades to the old behaviour rather than to a silent hole.
    llm_router_servable_models: [fixture-model-a]
    llm_router_registry_enabled:
      - {client_model_id: fixture-model-a, upstream_model_id: fixture-model-a}
    llm_router_model_registry:
      - {client_model_id: fixture-model-a, upstream_model_id: fixture-model-a}
    llm_router_remote_probes: []
    llm_router_probe_unsupported_tiers: []
    _llm_router_remote_models: {results: []}
    _llm_router_gate_models:
      status: 200
      json:
        data:
          - id: fixture-model-a
            meta:
              llamaswap: {type: model, aliases: [fixture-role-alias]}
          - id: fixture-role-alias
            meta:
              llamaswap: {type: alias, modelID: fixture-model-a}
          - id: fixture-peer/fixture-model-z
            meta:
              llamaswap: {type: peer, peerID: fixture-peer}
  tasks:
    - name: Adjudicate a listing carrying an alias and a peer record
      ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/assert-servable-parity.yml"

    - name: Confirm only the gate's real models were compared
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_probe_report.gate == 'verified'
          - _llm_router_probe_report.gate_ids == ['fixture-model-a']
        fail_msg: >-
          The gate's compared set was {{ _llm_router_probe_report.gate_ids }},
          not just the one record it labels a model. An alias or peer id counted
          as a served model fails the converge over a name that is working, and
          neither is a name the registry can ever carry.
        success_msg: >-
          Alias and peer records are excluded by the gate's own label; only real
          models are compared.

- name: A served id the registry carries but disables passes, with its own verdict
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    # The serving host auto-registers every downloaded model that fits, so a
    # disabled registry entry still on disk IS listed by the gate. Before this
    # verdict existed that failed every converge as "unregistered" and, under
    # serial: 1, stranded the pool behind the first member. The injected
    # difference from the fatal play above is one field: the extra served id
    # HAS a registry entry, merely disabled (and one parked as standby).
    llm_router_servable_models: [fixture-model-a]
    llm_router_registry_enabled:
      - {client_model_id: fixture-model-a, upstream_model_id: fixture-model-a}
    llm_router_model_registry:
      - {client_model_id: fixture-model-a, upstream_model_id: fixture-model-a}
      - {client_model_id: fixture-model-disabled, upstream_model_id: fixture-model-disabled, enabled: false}
      - client_model_id: fixture-model-standby
        upstream_model_id: fixture-model-standby
        enabled: false
        standby: true
    llm_router_remote_probes: []
    llm_router_probe_unsupported_tiers: []
    _llm_router_remote_models: {results: []}
    _llm_router_gate_models:
      status: 200
      json:
        data:
          - {id: fixture-model-a}
          - {id: fixture-model-disabled}
          - {id: fixture-model-standby}
  tasks:
    - name: Adjudicate a gate that still serves two disabled registry entries
      ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/assert-servable-parity.yml"

    # Anti-vacuity: the assert above ran (gate is verified, so its `when` held)
    # and did not fail; this proves the two ids were classified rather than
    # merely tolerated. An empty listed_disabled here means the verdict never
    # fired and the pass was for the wrong reason.
    - name: Confirm the disabled entries were reported as listed_disabled, not drift
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_probe_report.gate == 'verified'
          - _llm_router_probe_report.listed_disabled | sort == ['fixture-model-disabled', 'fixture-model-standby']
        fail_msg: >-
          listed_disabled was {{ _llm_router_probe_report.listed_disabled }}. A
          disabled entry the gate still serves must be reported under that
          verdict — visible, never fatal — or the operator cannot see what is
          still occupying the serving host.
        success_msg: >-
          Disabled and standby entries still on the host are reported as
          listed_disabled and block nothing.

- name: A gate that answers 404 is reported as reached-without-a-listing, apart from an outage
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/llm_router"
    llm_router_servable_models: [fixture-model-a]
    llm_router_registry_enabled:
      - {client_model_id: fixture-model-a, upstream_model_id: fixture-model-a}
    llm_router_model_registry:
      - {client_model_id: fixture-model-a, upstream_model_id: fixture-model-a}
    llm_router_remote_probes: []
    llm_router_probe_unsupported_tiers: []
    _llm_router_remote_models: {results: []}
    _llm_router_gate_models: {status: 404}
  tasks:
    - name: Adjudicate with the gate reached but no listing at the probed path
      ansible.builtin.import_tasks: "{{ _role_dir }}/tasks/assert-servable-parity.yml"

    - name: Confirm a 404 is its own verdict
      ansible.builtin.assert:
        quiet: true
        that:
          - _llm_router_probe_report.gate == 'not_found'
        fail_msg: >-
          A 404 was recorded as "{{ _llm_router_probe_report.gate }}". A reached
          endpoint with no listing at that path is a wrong URL in this role,
          which never fixes itself; folding it into "unreachable" makes a
          permanent configuration defect look like a transient outage.
        success_msg: A 404 is reported as reached-without-a-listing, and blocks nothing.
