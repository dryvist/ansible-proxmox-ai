---
# One bounded-step case for the retention contract: renders the compute
# expressions extracted from roles/phoenix_docker/tasks/main.yml against a
# recorded live rule and asserts the oldest-trace age, the next maxDays and
# the patch gate. Provided per case: _render_dir, _case_live_days,
# _case_expected_oldest, _case_expected_next, _case_gate and, for the
# unlimited case, _case_oldest_start.
- name: Point the step case at the recorded live reply
  vars:
    _case_rule: >-
      {{ {'__typename': 'TraceRetentionRuleMaxCount'}
      if _case_live_days | int <= 0
      else {'__typename': 'TraceRetentionRuleMaxDays', 'maxDays': _case_live_days | int} }}
  ansible.builtin.set_fact:
    phoenix_docker_retention_current:
      json:
        data:
          defaultProjectTraceRetentionPolicy:
            id: UG9saWN5OmRlZmF1bHQ=
            rule: "{{ _case_rule }}"

- name: Carry the case's oldest-trace state
  ansible.builtin.set_fact:
    phoenix_docker_retention_starts: "{{ [] if _case_oldest_start is not defined else [_case_oldest_start] }}"

- name: Render the live maxDays read for the case
  vars:
    _rendered: "{{ lookup('ansible.builtin.template', _render_dir ~ '/live_days.j2') | trim }}"
  ansible.builtin.set_fact:
    phoenix_docker_retention_live_days: "{{ _rendered | int }}"

- name: The live maxDays read matches the case
  ansible.builtin.assert:
    quiet: true
    that:
      - phoenix_docker_retention_live_days | int == _case_live_days | int
    fail_msg: >-
      The live rule read did not reduce the recorded reply to the case's
      maxDays, where 0 means no effective day limit.

- name: Render the oldest trace age in whole days for the case
  vars:
    _rendered: "{{ lookup('ansible.builtin.template', _render_dir ~ '/oldest_days.j2') | trim }}"
  ansible.builtin.set_fact:
    phoenix_docker_retention_oldest_days: "{{ _rendered | int }}"

- name: The oldest trace age matches the case
  ansible.builtin.assert:
    quiet: true
    that:
      - phoenix_docker_retention_oldest_days | int == _case_expected_oldest | int
    fail_msg: The oldest trace age did not come out in whole days as the case recorded.

- name: Render the bounded step toward the target for the case
  vars:
    _rendered: "{{ lookup('ansible.builtin.template', _render_dir ~ '/next_days.j2') | trim }}"
  ansible.builtin.set_fact:
    phoenix_docker_retention_next_days: "{{ _rendered | int }}"

- name: The bounded step lands on the case's expected maxDays
  ansible.builtin.assert:
    quiet: true
    that:
      - phoenix_docker_retention_next_days | int == _case_expected_next | int
    fail_msg: >-
      The bounded step did not land on the expected maxDays for a live rule of
      {{ _case_live_days }} toward a target of 30.

- name: The patch gate matches the case
  vars:
    _rendered: "{{ lookup('ansible.builtin.template', _render_dir ~ '/patch_gate.j2') | trim }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - (_rendered | bool) == (_case_gate | bool)
    fail_msg: >-
      The patch gate did not match the case: it must fire when the step
      changes the policy and stay skipped when the live value already matches.
