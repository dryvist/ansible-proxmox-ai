---
# One render of the compose template with the given OIDC client secret.
# set_fact, not task vars: include_vars-loaded defaults outrank task vars in
# Ansible's precedence order, so a `vars:` override of the secret on the
# template task is silently ignored and the defaults' (empty) env lookup wins.
- name: Set the OIDC client secret fixture ({{ _render_name }})
  ansible.builtin.set_fact:
    phoenix_docker_oidc_client_secret: "{{ _render_secret }}"

- name: Render the compose template ({{ _render_name }})
  ansible.builtin.template:
    src: "{{ _template }}"
    dest: "{{ _render_dir }}/{{ _render_name }}.yml"
    mode: "0600"
