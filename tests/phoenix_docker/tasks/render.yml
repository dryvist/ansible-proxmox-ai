---
# One render of the compose template with the given OIDC client secret and,
# optionally, a non-default retention window. set_fact, not task vars:
# include_vars-loaded defaults outrank task vars in Ansible's precedence
# order, so a `vars:` override of the secret on the template task is silently
# ignored and the defaults' (empty) env lookup wins. Facts are host-level and
# persist across the caller's loop — only renders that want the shipped
# defaults must run before one that sets an override.
- name: Set the OIDC client secret fixture ({{ _render_name }})
  ansible.builtin.set_fact:
    phoenix_docker_oidc_client_secret: "{{ _render_secret }}"

- name: Set the retention days fixture ({{ _render_name }})
  ansible.builtin.set_fact:
    phoenix_docker_retention_days: "{{ _render_days }}"
  when: _render_days | default('') | length > 0

- name: Render the compose template ({{ _render_name }})
  ansible.builtin.template:
    src: "{{ _template }}"
    dest: "{{ _render_dir }}/{{ _render_name }}.yml"
    mode: "0600"
