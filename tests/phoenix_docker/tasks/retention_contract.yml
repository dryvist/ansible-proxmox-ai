---
# Offline contract for the trace-retention sync in roles/phoenix_docker/tasks/main.yml:
# PHOENIX_DEFAULT_RETENTION_POLICY_DAYS only seeds the Default policy row on first
# boot, so the role must read the live policy through the admin GraphQL API and
# patch it only when its maxDays differs from phoenix_docker_retention_days —
# never when it already matches.
#
# The GraphQL checks are behavioral: the decision expressions are extracted
# from the parsed role tasks and evaluated against recorded replies shaped
# like Phoenix's — results under the `data` envelope, failures as a non-empty
# `errors` list carried with HTTP 200 — so reading the wrong envelope or
# dropping the errors guard fails here instead of on a live converge.
- name: Read the Phoenix role sources for the retention contract
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop:
    - path: "{{ playbook_dir }}/../../roles/phoenix_docker/tasks/main.yml"
    - path: "{{ playbook_dir }}/../../roles/phoenix_docker/defaults/main.yml"
    - path: "{{ playbook_dir }}/../../roles/phoenix_docker/templates/docker-compose.yml.j2"
  loop_control:
    label: "{{ item.path | basename }}"
  register: phoenix_docker_retention_sources

- name: Decode the Phoenix role sources
  ansible.builtin.set_fact:
    phoenix_docker_retention_main_raw: "{{ phoenix_docker_retention_sources.results[0].content | b64decode }}"
    phoenix_docker_retention_defaults_source: "{{ phoenix_docker_retention_sources.results[1].content | b64decode }}"
    phoenix_docker_retention_template_source: "{{ phoenix_docker_retention_sources.results[2].content | b64decode }}"

- name: Parse the retention tasks out of the role source
  vars:
    _tasks: "{{ phoenix_docker_retention_main_raw | from_yaml }}"
  ansible.builtin.set_fact:
    phoenix_docker_retention_task_names: "{{ _tasks | selectattr('name', 'defined') | map(attribute='name') | list }}"
    phoenix_docker_retention_by_name: >-
      {{ dict(_tasks | selectattr('name', 'defined') | map(attribute='name')
              | zip(_tasks | selectattr('name', 'defined'))) }}

- name: Assert the retention sync runs on a healthy stack and never precedes the patch
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        phoenix_docker_retention_task_names.index('Deploy Phoenix via docker compose')
        < phoenix_docker_retention_task_names.index('Wait for Phoenix web port to be ready')
      - >-
        phoenix_docker_retention_task_names.index('Wait for Phoenix web port to be ready')
        < phoenix_docker_retention_task_names.index('Read the live Phoenix default trace retention policy')
      - >-
        phoenix_docker_retention_task_names.index('Read the live Phoenix default trace retention policy')
        < phoenix_docker_retention_task_names.index('Patch the Phoenix default trace retention policy when it differs')
    fail_msg: >-
      The retention read must follow compose deployment and the port wait, and
      precede the patch, so the policy is only ever patched against a serving
      server.

- name: Assert the retention read queries the live default policy through the admin API
  vars:
    _read_task: "{{ phoenix_docker_retention_by_name['Read the live Phoenix default trace retention policy'] }}"
    _read_uri: "{{ _read_task['ansible.builtin.uri'] }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - "'/graphql' in _read_uri.url"
      - _read_uri.method == 'POST'
      - _read_uri.body.query is search('defaultProjectTraceRetentionPolicy')
      - _read_uri.body.query is search('TraceRetentionRuleMaxDays')
      - "'Authorization' in _read_uri.headers"
      - _read_task.no_log is true
      - _read_task.changed_when is false
      - "'not ansible_check_mode' in _read_task.when"
    fail_msg: >-
      The read must POST the defaultProjectTraceRetentionPolicy query with the
      admin bearer header, be read-only and check-mode safe.

- name: Assert the retention patch carries the mutation and the configured days
  vars:
    _patch_task_name: Patch the Phoenix default trace retention policy when it differs
    _patch_task: "{{ phoenix_docker_retention_by_name[_patch_task_name] }}"
    _patch_uri: "{{ _patch_task['ansible.builtin.uri'] }}"
    _patch_when: "{{ _patch_task.when | join(' ') }}"
  ansible.builtin.assert:
    quiet: true
    that:
      - "'/graphql' in _patch_uri.url"
      - _patch_uri.method == 'POST'
      - "'Authorization' in _patch_uri.headers"
      - _patch_task.no_log is true
      - >-
        _patch_task.vars.phoenix_docker_retention_mutation
        is search('patchProjectTraceRetentionPolicy')
      - >-
        _patch_task.vars.phoenix_docker_retention_mutation
        is search('PatchProjectTraceRetentionPolicyInput')
      - "'| default(0)' in phoenix_docker_retention_main_raw"
      - >-
        phoenix_docker_retention_main_raw
        is search('phoenix_docker_retention_days \| int[}][}][}][}]')
      - "'not ansible_check_mode' in _patch_when"
      - "'phoenix_docker_retention_live_days | int' in _patch_when"
      - "'phoenix_docker_retention_days | int' in _patch_when"
    fail_msg: >-
      The patch must target the live policy id read from the API, send the
      configured days as a JSON number, and be guarded so it is skipped when
      the live maxDays already equals phoenix_docker_retention_days.

# The decision expressions are carried verbatim from the parsed tasks, so the
# checks below evaluate what the role ships, not a copy of it.
- name: Carry the retention decision expressions out of the role tasks
  vars:
    _read_name: Read the live Phoenix default trace retention policy
    _readable_name: Require the live Phoenix default trace retention policy to be readable
    _patch_name: Patch the Phoenix default trace retention policy when it differs
    _read_task: "{{ phoenix_docker_retention_by_name[_read_name] }}"
    _readable_task: "{{ phoenix_docker_retention_by_name[_readable_name] }}"
    _patch_task: "{{ phoenix_docker_retention_by_name[_patch_name] }}"
  ansible.builtin.set_fact:
    phoenix_docker_retention_contract_read_failed_when: "{{ _read_task.failed_when }}"
    phoenix_docker_retention_contract_readable_thats: "{{ _readable_task['ansible.builtin.assert'].that }}"
    phoenix_docker_retention_contract_patch_failed_when: "{{ _patch_task.failed_when }}"
    phoenix_docker_retention_contract_patch_body: "{{ _patch_task['ansible.builtin.uri'].body }}"
    phoenix_docker_retention_contract_mutation: "{{ _patch_task.vars.phoenix_docker_retention_mutation }}"

# Recorded replies shaped like the pinned Phoenix GraphQL API: results ride
# under `data`; failures arrive as a non-empty `errors` list with HTTP 200.
- name: Set the recorded GraphQL replies for the retention contract
  ansible.builtin.set_fact:
    phoenix_docker_retention_contract_fixtures:
      read_ok:
        json:
          data:
            defaultProjectTraceRetentionPolicy:
              id: UG9saWN5OmRlZmF1bHQ=
              rule:
                __typename: TraceRetentionRuleMaxDays
                maxDays: 30
      read_errors:
        json:
          errors:
            - message: validation failed (DefaultTraceRetentionPolicy)
      patch_ok:
        json:
          data:
            patchProjectTraceRetentionPolicy:
              node:
                id: UG9saWN5OmRlZmF1bHQ=
      patch_errors:
        json:
          errors:
            - message: patch rejected (DefaultTraceRetentionPolicy)

- name: Write the patch body template for rendering
  vars:
    _render_dir: "{{ lookup('env', 'RUNNER_TEMP') | default('/tmp', true) }}/phoenix_docker_retention_contract"
  block:
    - name: Create the retention contract render directory
      ansible.builtin.file:
        path: "{{ _render_dir }}"
        state: directory
        mode: "0700"

    - name: Write the patch body template
      ansible.builtin.copy:
        dest: "{{ _render_dir }}/patch_body.j2"
        content: "{{ phoenix_docker_retention_contract_patch_body }}"
        mode: "0600"

    # --- Behavior against a recorded success reply --------------------------
    # The read task must accept the reply, every readable-assert condition
    # must hold, and the patch body must resolve the policy id out of `data`.

    - name: Point the contract at the recorded success reply
      ansible.builtin.set_fact:
        phoenix_docker_retention_current: "{{ phoenix_docker_retention_contract_fixtures.read_ok }}"
        phoenix_docker_retention_days: 30
        phoenix_docker_retention_mutation: "{{ phoenix_docker_retention_contract_mutation }}"

    - name: The read task accepts a recorded success reply
      ansible.builtin.assert:
        quiet: true
        that: "{{ ['not (' ~ phoenix_docker_retention_contract_read_failed_when ~ ')'] }}"
        fail_msg: The read task's errors guard tripped on a recorded success reply.

    - name: The readable-assert conditions hold on a recorded success reply
      ansible.builtin.assert:
        quiet: true
        that: "{{ phoenix_docker_retention_contract_readable_thats }}"
        fail_msg: >-
          The readable-assert conditions do not all hold on a reply shaped
          like Phoenix's — the policy is not read out of the data envelope.

    - name: The patch body carries the policy id from the data envelope
      vars:
        _rendered_body: "{{ lookup('ansible.builtin.template', _render_dir ~ '/patch_body.j2') | trim }}"
      ansible.builtin.assert:
        quiet: true
        that:
          - "'UG9saWN5OmRlZmF1bHQ=' in _rendered_body"
          - "'None' not in _rendered_body"
          - "_rendered_body is search('maxDays.: 30')"
        fail_msg: >-
          The patch body did not resolve the recorded policy id out of the
          data envelope alongside the configured days.

    # --- Behavior against a recorded errors reply ---------------------------
    # GraphQL reports failures with HTTP 200, so the read task's errors guard
    # must trip and every readable-assert condition must fail.

    - name: Point the contract at the recorded errors reply
      ansible.builtin.set_fact:
        phoenix_docker_retention_current: "{{ phoenix_docker_retention_contract_fixtures.read_errors }}"

    - name: The read task refuses a recorded errors reply
      ansible.builtin.assert:
        quiet: true
        that: "{{ [phoenix_docker_retention_contract_read_failed_when] }}"
        fail_msg: >-
          The read task's errors guard did not trip on a recorded errors
          reply, which GraphQL reports with HTTP 200.

    - name: Every readable-assert condition fails on a recorded errors reply
      ansible.builtin.assert:
        quiet: true
        that: >-
          {{ ['not (' ~ (phoenix_docker_retention_contract_readable_thats
             | join(') and not (')) ~ ')'] }}
        fail_msg: >-
          A readable-assert condition still holds on a recorded errors reply,
          so a failed read could slip past the assert.

    # --- Behavior of the patch task against its own recorded replies --------

    - name: Point the contract at the recorded patch errors reply
      ansible.builtin.set_fact:
        phoenix_docker_retention_patch: "{{ phoenix_docker_retention_contract_fixtures.patch_errors }}"

    - name: The patch task refuses a recorded errors reply
      ansible.builtin.assert:
        quiet: true
        that: "{{ [phoenix_docker_retention_contract_patch_failed_when] }}"
        fail_msg: The patch task's errors guard did not trip on a recorded errors reply.

    - name: Point the contract at the recorded patch success reply
      ansible.builtin.set_fact:
        phoenix_docker_retention_patch: "{{ phoenix_docker_retention_contract_fixtures.patch_ok }}"

    - name: The patch task accepts a recorded success reply
      ansible.builtin.assert:
        quiet: true
        that: "{{ ['not (' ~ phoenix_docker_retention_contract_patch_failed_when ~ ')'] }}"
        fail_msg: The patch task's errors guard tripped on a recorded success reply.
  always:
    - name: Remove the retention contract render directory
      ansible.builtin.file:
        path: "{{ lookup('env', 'RUNNER_TEMP') | default('/tmp', true) }}/phoenix_docker_retention_contract"
        state: absent

- name: Assert the retention days are single-sourced from the role default
  ansible.builtin.assert:
    quiet: true
    that:
      - "'phoenix_docker_retention_days: 30' in phoenix_docker_retention_defaults_source"
      - >-
        'PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "{{ phoenix_docker_retention_days }}"'
        in phoenix_docker_retention_template_source
    fail_msg: >-
      The decided default is 30 days: the compose template must render
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS from phoenix_docker_retention_days,
      whose default lives only in the role defaults.
