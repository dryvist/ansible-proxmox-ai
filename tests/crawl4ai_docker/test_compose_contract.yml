---
- name: Verify Crawl4AI Compose contract
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
    ansible_managed: Ansible managed
    _template: "{{ playbook_dir }}/../../roles/crawl4ai_docker/templates/docker-compose.yml.j2"
    crawl4ai_docker_image: "unclecode/crawl4ai:0.9.5"
    crawl4ai_docker_container_name: crawl4ai
    crawl4ai_docker_restart_policy: unless-stopped
    crawl4ai_docker_port: 11235
    _expected_tmpfs:
      - /tmp
      - /var/lib/redis
      - /var/lib/crawl4ai/outputs
      - /home/appuser/.crawl4ai
      - /home/appuser/.cache/url_seeder
      - /home/appuser/.gunicorn
    _expected_api_token_expression: >-
      ${CRAWL4AI_API_TOKEN:?CRAWL4AI_API_TOKEN must be set}
  tasks:
    - name: Render the Compose document
      ansible.builtin.set_fact:
        _rendered: "{{ lookup('ansible.builtin.template', _template) | from_yaml }}"

    - name: Assert the pinned upstream deployment settings
      ansible.builtin.assert:
        quiet: true
        that:
          - _rendered.services.crawl4ai.image == 'unclecode/crawl4ai:0.9.5'
          - _rendered.services.crawl4ai.container_name == 'crawl4ai'
          - _rendered.services.crawl4ai.ports == ['11235:11235']
          - _rendered.services.crawl4ai.shm_size == '1gb'
          - _rendered.services.crawl4ai.tmpfs == _expected_tmpfs
          - >-
            _rendered.services.crawl4ai.environment.CRAWL4AI_API_TOKEN
            == _expected_api_token_expression
          - _rendered.services.crawl4ai.volumes is not defined
