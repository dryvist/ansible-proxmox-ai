---
# Pins the self-hosted Langfuse code-evaluator execution contract.
#
# The dispatcher and queue settings are shared by web and worker through the
# `langfuse_env` anchor. This test keeps both settings in the rendered stack.
#
# Run (from the repository root):
#   ansible-playbook tests/langfuse_docker/test_code_eval_dispatcher.yml -i localhost, -c local
- name: Verify the Langfuse code evaluator dispatcher contract
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
    _template: "{{ playbook_dir }}/../../roles/langfuse_docker/templates/docker-compose.yml.j2"
  tasks:
    - name: Load Langfuse defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/langfuse_docker/defaults/main.yml"

    - name: Read the compose template
      ansible.builtin.set_fact:
        _compose_template: "{{ lookup('file', _template) }}"

    - name: Require trusted local evaluation in web and worker
      ansible.builtin.assert:
        quiet: true
        that:
          - langfuse_docker_code_eval_dispatcher == 'insecure-local'
          - langfuse_docker_code_eval_queue_enabled | bool
          - "'environment: &langfuse_env' in _compose_template"
          - "'<<: *langfuse_env' in _compose_template"
          - "'LANGFUSE_CODE_EVAL_DISPATCHER:' in _compose_template"
          - "'langfuse_docker_code_eval_dispatcher' in _compose_template"
          - "'QUEUE_CONSUMER_CODE_EVAL_EXECUTION_QUEUE_IS_ENABLED:' in _compose_template"
          - "'langfuse_docker_code_eval_queue_enabled' in _compose_template"
        fail_msg: >-
          The evaluator dispatcher and queue must be enabled in the shared
          environment inherited by both Langfuse web and worker services.
