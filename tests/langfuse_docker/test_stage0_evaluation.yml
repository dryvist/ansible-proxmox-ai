---
# Verify the pinned Langfuse dataset/evaluator reconciliation without making
# any HTTP request or changing the initialized project.
- name: Verify Stage 0 Langfuse evaluation source
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
    _defaults: "{{ playbook_dir }}/../../roles/langfuse_docker/defaults/main.yml"
    _main_tasks: "{{ playbook_dir }}/../../roles/langfuse_docker/tasks/main.yml"
    _reconcile_tasks: "{{ playbook_dir }}/../../roles/langfuse_docker/tasks/reconcile-stage0-evaluation.yml"
    _evaluator_source: "{{ playbook_dir }}/../../roles/langfuse_docker/files/evaluators/typed-decisions.ts"
  tasks:
    - name: Load Langfuse defaults
      ansible.builtin.include_vars:
        file: "{{ _defaults }}"

    - name: Read the reconciliation and evaluator source
      ansible.builtin.set_fact:
        _main: "{{ lookup('file', _main_tasks) }}"
        _reconcile: "{{ lookup('file', _reconcile_tasks) }}"
        _source: "{{ lookup('file', _evaluator_source) }}"

    - name: Require source pinning, opt-in reconciliation, and typed scores
      ansible.builtin.assert:
        quiet: true
        that:
          - not langfuse_docker_stage0_eval_reconcile_enabled | bool
          - langfuse_docker_stage0_dataset_revision | length == 40
          - langfuse_docker_stage0_dataset_config == 'all'
          - langfuse_docker_stage0_dataset_split == 'test'
          - langfuse_docker_stage0_dataset_offset | int == 0
          - langfuse_docker_stage0_dataset_length | int == 20
          - >-
            'dataset=LocalLLaMA%2Ftyped-decisions&config=all'
            in langfuse_docker_stage0_dataset_api_url
          - >-
            '&split=test&offset=0&length=20'
            in langfuse_docker_stage0_dataset_api_url
          - "'langfuse_docker_stage0_eval_reconcile_enabled | bool' in _main"
          - "'dataset_rows.x_revision' in _reconcile"
          - "'langfuse_docker_stage0_dataset_revision' in _reconcile"
          - "'api/public/v2/datasets' in _reconcile"
          - "'api/public/dataset-items' in _reconcile"
          - "'api/public/v2/evaluators' in _reconcile"
          - "'sourceCodeLanguage: TYPESCRIPT' in _reconcile"
          - "'typed_decision_exact_accuracy' in _source"
          - "'typed_decision_numeric_equivalence' in _source"
          - "'typed_decision_probability_brier' in _source"

    - name: Require every project API request to hide credentials and data bodies
      ansible.builtin.assert:
        quiet: true
        that:
          - _langfuse_api_task_count | int == 8
          - _langfuse_api_no_log_count | int == 8
      vars:
        _langfuse_api_task_count: >-
          {{ _reconcile | regex_findall('ansible[.]builtin[.]uri:') | length }}
        _langfuse_api_no_log_count: >-
          {{ _reconcile | regex_findall('no_log: true') | length }}
