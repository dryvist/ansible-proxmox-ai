---
# Test-only entry point for the Langfuse secret reconciliation tasks.
- name: Exercise Langfuse secret reconciliation
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  vars:
    openbao_secrets_kv_mount: secret
    openbao_secrets_converge_writer_token: "{{ lookup('env', 'OPENBAO_SEED_WRITER_TOKEN') }}"
  tasks:
    - name: Load Langfuse role defaults
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/../../roles/langfuse_docker/defaults/main"

    # Set after include_vars: the role defaults define the production data dir,
    # which would otherwise override a play-level value.
    - name: Point the Langfuse data directory at the test directory
      ansible.builtin.set_fact:
        langfuse_docker_data_dir: "{{ lookup('env', 'LANGFUSE_TEST_DATA_DIR') }}"

    - name: Set the fake OpenBao endpoint
      ansible.builtin.set_fact:
        openbao_secrets_active_addr: "{{ lookup('env', 'LANGFUSE_TEST_OPENBAO_ADDR') }}"

    - name: Run the Langfuse secret tasks
      ansible.builtin.import_tasks: ../../roles/langfuse_docker/tasks/seed_secrets.yml
