---
# Verifies the code evaluator dispatcher reaches both Langfuse processes only
# while evaluator reconciliation is enabled. Web and worker inherit it through
# the shared worker environment anchor; with reconciliation off the variable is
# omitted from the rendered Compose document.
#
# Run from the repository root:
#   ansible-playbook tests/langfuse_docker/test_code_eval_compose.yml -i localhost, -c local
- name: Verify the Langfuse code evaluator Compose contract
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
    _template: "{{ playbook_dir }}/../../roles/langfuse_docker/templates/docker-compose.yml.j2"
  tasks:
    - name: Load the role defaults as they ship
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/langfuse_docker/defaults/main.yml"

    - name: Set fixture values for secrets and external configuration
      ansible.builtin.set_fact:
        langfuse_docker_clickhouse_endpoint: embedded
        langfuse_docker_postgres_password: fixture-postgres
        langfuse_docker_clickhouse_password: fixture-clickhouse
        langfuse_docker_redis_auth: fixture-redis
        langfuse_docker_s3_endpoint: https://s3.example.invalid
        langfuse_docker_s3_access_key_id: fixture-access
        langfuse_docker_s3_secret_access_key: fixture-secret
        langfuse_docker_init_user_email: fixture@example.invalid
        langfuse_docker_init_user_password: fixture-password
        langfuse_docker_init_public_key: fixture-public
        langfuse_docker_init_secret_key: fixture-secret-key
        langfuse_docker_web_port: "35555"
        langfuse_docker_nextauth_url: https://langfuse.example.invalid
        langfuse_docker_llm_connection_whitelisted_host: llm.example.invalid
        langfuse_docker_auth_custom_client_secret: ""
        langfuse_docker_oidc_enabled: false
        langfuse_docker_secrets:
          nextauth_secret: fixture-nextauth
          salt: fixture-salt
          encryption_key: fixture-encryption

    - name: Render the Compose document with evaluator reconciliation off
      ansible.builtin.set_fact:
        _rendered_off: "{{ lookup('template', _template) | from_yaml }}"

    - name: The default keeps the embedded ClickHouse service and its dependencies
      ansible.builtin.assert:
        quiet: true
        that:
          - _rendered_off.services['clickhouse'].image == langfuse_docker_clickhouse_image
          - _rendered_off.services['clickhouse'].environment.CLICKHOUSE_DB == 'default'
          - _rendered_off.services['clickhouse'].environment.CLICKHOUSE_USER == 'clickhouse'
          - _rendered_off.services['clickhouse'].environment.CLICKHOUSE_PASSWORD == 'fixture-clickhouse'
          - >-
            _rendered_off.services['clickhouse'].volumes[0]
            == '/opt/langfuse/clickhouse/data:/var/lib/clickhouse'
          - >-
            _rendered_off.services['clickhouse'].volumes[1]
            == '/opt/langfuse/clickhouse/logs:/var/log/clickhouse-server'
          - >-
            _rendered_off.services['clickhouse'].volumes[2]
            == '/opt/langfuse/clickhouse/config/system_logs.xml:/etc/clickhouse-server/config.d/system_logs.xml:ro'
          - _rendered_off.services['langfuse-worker'].depends_on.clickhouse.condition == 'service_healthy'
          - _rendered_off.services['langfuse-web'].depends_on.clickhouse.condition == 'service_healthy'
          - _rendered_off.services['langfuse-worker'].environment.CLICKHOUSE_URL == 'http://clickhouse:8123'
          - >-
            _rendered_off.services['langfuse-worker'].environment.CLICKHOUSE_MIGRATION_URL
            == 'clickhouse://clickhouse:9000'
          - _rendered_off.services['langfuse-worker'].environment.CLICKHOUSE_USER == 'clickhouse'
          - _rendered_off.services['langfuse-worker'].environment.CLICKHOUSE_DB is not defined

    - name: Add a placeholder ClickHouse guest to the test inventory
      ansible.builtin.add_host:
        name: clickhouse
        container_ip: clickhouse.example.invalid

    - name: Set the published ClickHouse service ports and OpenBao credential fixture
      ansible.builtin.set_fact:
        tofu_data:
          constants:
            service_ports:
              clickhouse_http: "8123"
              clickhouse_native: "9000"
        bao_clickhouse_secrets:
          APP_PASSWORD: fixture-clickhouse-external

    - name: Load the Langfuse inventory secret projection
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../inventory/group_vars/langfuse_group.yml"

    - name: Select the external ClickHouse endpoint
      ansible.builtin.set_fact:
        langfuse_docker_clickhouse_endpoint: external

    - name: Render the external ClickHouse endpoint
      ansible.builtin.set_fact:
        _rendered_external: "{{ lookup('template', _template) | from_yaml }}"

    - name: External ClickHouse omits its service and routes both processes to the published guest
      ansible.builtin.assert:
        quiet: true
        that:
          - "'clickhouse' not in _rendered_external.services"
          - "'clickhouse' not in _rendered_external.services['langfuse-worker'].depends_on"
          - "'clickhouse' not in _rendered_external.services['langfuse-web'].depends_on"
          - "'/opt/langfuse/clickhouse' not in (_rendered_external | to_yaml)"
          - >-
            _rendered_external.services['langfuse-worker'].environment.CLICKHOUSE_URL
            == 'http://clickhouse.example.invalid:8123'
          - >-
            _rendered_external.services['langfuse-worker'].environment.CLICKHOUSE_MIGRATION_URL
            == 'clickhouse://clickhouse.example.invalid:9000'
          - >-
            _rendered_external.services['langfuse-web'].environment.CLICKHOUSE_URL
            == 'http://clickhouse.example.invalid:8123'
          - >-
            _rendered_external.services['langfuse-web'].environment.CLICKHOUSE_MIGRATION_URL
            == 'clickhouse://clickhouse.example.invalid:9000'
          - _rendered_external.services['langfuse-worker'].environment.CLICKHOUSE_USER == 'langfuse'
          - >-
            _rendered_external.services['langfuse-worker'].environment.CLICKHOUSE_PASSWORD
            == 'fixture-clickhouse-external'
          - _rendered_external.services['langfuse-worker'].environment.CLICKHOUSE_DB == 'default'
          - _rendered_external.services['langfuse-worker'].environment.CLICKHOUSE_CLUSTER_ENABLED == 'false'
          - _rendered_external.services['langfuse-web'].environment.CLICKHOUSE_USER == 'langfuse'
          - _rendered_external.services['langfuse-web'].environment.CLICKHOUSE_PASSWORD == 'fixture-clickhouse-external'
          - _rendered_external.services['langfuse-web'].environment.CLICKHOUSE_DB == 'default'
          - _rendered_external.services['langfuse-web'].environment.CLICKHOUSE_CLUSTER_ENABLED == 'false'

    - name: Neither web nor worker receives a dispatcher while reconciliation is off
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            'LANGFUSE_CODE_EVAL_DISPATCHER' not in _rendered_off.services['langfuse-worker'].environment
          - >-
            'LANGFUSE_CODE_EVAL_DISPATCHER' not in _rendered_off.services['langfuse-web'].environment
        fail_msg: >-
          The insecure-local code evaluator dispatcher must not reach Langfuse
          web or worker unless evaluator reconciliation is enabled.

    - name: Enable evaluator reconciliation for the second render
      ansible.builtin.set_fact:
        langfuse_docker_stage0_eval_reconcile_enabled: true

    - name: Render the Compose document with evaluator reconciliation on
      ansible.builtin.set_fact:
        _rendered_on: "{{ lookup('template', _template) | from_yaml }}"

    - name: The dispatcher and queue are enabled for both web and worker while reconciliation is on
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _rendered_on.services['langfuse-worker'].environment.LANGFUSE_CODE_EVAL_DISPATCHER
            == 'insecure-local'
          - >-
            _rendered_on.services['langfuse-web'].environment.LANGFUSE_CODE_EVAL_DISPATCHER
            == 'insecure-local'
          - >-
            _rendered_on.services['langfuse-worker'].environment.QUEUE_CONSUMER_CODE_EVAL_EXECUTION_QUEUE_IS_ENABLED
            == 'true'
          - >-
            _rendered_on.services['langfuse-web'].environment.QUEUE_CONSUMER_CODE_EVAL_EXECUTION_QUEUE_IS_ENABLED
            == 'true'
        fail_msg: >-
          The local code evaluator dispatcher and queue must be enabled in both
          Langfuse web and worker processes when evaluator reconciliation is on.

    - name: Ingestion skips the ClickHouse read-back for every project
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _rendered_off.services[item].environment.LANGFUSE_SKIP_INGESTION_CLICKHOUSE_READ_MIN_PROJECT_CREATE_DATE
            == '2025-01-01'
        fail_msg: "{{ item }} must skip the per-event ClickHouse read during ingestion."
      loop: [langfuse-worker, langfuse-web]

    - name: The object-storage client gets 50 read and 50 write sockets
      ansible.builtin.assert:
        quiet: true
        that:
          - _rendered_off.services[item].environment.LANGFUSE_S3_CONCURRENT_READS == '50'
          - _rendered_off.services[item].environment.LANGFUSE_S3_CONCURRENT_WRITES == '50'
        fail_msg: "{{ item }} must carry the object-storage socket limits."
      loop: [langfuse-worker, langfuse-web]

    - name: The worker processes 20 ingestion and 5 OTel jobs at once
      ansible.builtin.assert:
        quiet: true
        that:
          - _worker_env.LANGFUSE_INGESTION_QUEUE_PROCESSING_CONCURRENCY == '20'
          - _worker_env.LANGFUSE_OTEL_INGESTION_QUEUE_PROCESSING_CONCURRENCY == '5'
          - _worker_env.LANGFUSE_ENABLE_REDIS_SEEN_EVENT_CACHE == 'true'
        fail_msg: The worker must carry the queue concurrency settings.
      vars:
        _worker_env: "{{ _rendered_off.services['langfuse-worker'].environment }}"

    - name: The default renders a single worker
      ansible.builtin.assert:
        quiet: true
        that:
          - "'langfuse-worker-2' not in _rendered_off.services"
        fail_msg: The default must render one worker process.

    - name: Render the Compose document with two workers
      ansible.builtin.set_fact:
        _rendered_two: "{{ lookup('template', _template, template_vars=_two_workers) | from_yaml }}"
      vars:
        _two_workers:
          langfuse_docker_worker_count: 2

    - name: The second worker shares the worker environment and binds no host port
      ansible.builtin.assert:
        quiet: true
        that:
          - _second.environment == _rendered_two.services['langfuse-worker'].environment
          - _second.ports is not defined
          - "'langfuse-worker-2:3030' in _second.healthcheck.test[1]"
          - "'langfuse-worker-3' not in _rendered_two.services"
        fail_msg: langfuse-worker-2 must mirror the worker without a host port.
      vars:
        _second: "{{ _rendered_two.services['langfuse-worker-2'] }}"
