---
# Render the role defaults against custom, disabled, and slash-terminated
# existing notification URLs. No network endpoints are contacted.
- name: Derive the success topic from the configured ntfy URL
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../roles/ai_runner/defaults/main.yml
  tasks:
    - name: Preserve an explicitly configured notification hub
      ansible.builtin.set_fact:
        ai_runner_ntfy_url: "https://alerts.example/custom-topic"

    - name: Route successful notifications to the status topic on that hub
      ansible.builtin.assert:
        quiet: true
        that:
          - ai_runner_ntfy_success_url == 'https://alerts.example/status'

    - name: Preserve an explicitly disabled notification URL
      ansible.builtin.set_fact:
        ai_runner_ntfy_url: ""

    - name: Keep the derived success URL disabled
      ansible.builtin.assert:
        quiet: true
        that:
          - ai_runner_ntfy_success_url == ''

    - name: Accept a trailing slash on the configured topic URL
      ansible.builtin.set_fact:
        ai_runner_ntfy_url: "https://alerts.example/custom-topic/"

    - name: Replace the topic after removing the trailing slash
      ansible.builtin.assert:
        quiet: true
        that:
          - ai_runner_ntfy_success_url == 'https://alerts.example/status'
