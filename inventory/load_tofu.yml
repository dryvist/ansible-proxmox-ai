---
# Pre-playbook that loads OpenTofu infrastructure data dynamically.
# Runs first to populate the Ansible inventory from the published tofu
# inventory, eliminating hardcoded VM IDs and IPs from Ansible configuration.
# Every AI guest this repo manages is an LXC container, so only the
# containers section of the inventory contract is mapped here — VM/Splunk/
# docker-VM mapping stays upstream in ansible-proxmox-apps.

- name: Load OpenTofu Infrastructure Inventory
  hosts: localhost
  become: false
  gather_facts: false
  tags: always

  # Inventory source resolution is owned by the shared inventory_resolve role.
  # Its README is the canonical description of the order and of why there is no
  # local-cache tier:
  # https://github.com/dryvist/homelab-contracts/tree/main/ansible/roles/inventory_resolve
  vars:
    # Override global ansible_become for localhost tasks
    ansible_become: false
    # The global inventory pins ansible_python_interpreter to /usr/bin/python3
    # (correct for the Debian LXC targets). That system python lacks boto3, so
    # the amazon.aws S3 fetch below fails to import it. Discover the interpreter
    # for this localhost play instead, so it picks the dev-shell python that
    # carries boto3/botocore. Scoped to this play only — remote-host resolution
    # is untouched.
    ansible_python_interpreter: auto_silent

  tasks:
    # Inventory resolution (TOFU_INVENTORY_PATH -> RustFS via OpenBao) is
    # delegated to the shared inventory_resolve role
    # (dryvist/homelab-contracts), which ends with `tofu_data` loaded.
    # The repo-specific asserts and add_host group mapping stay below.
    - name: Resolve the published OpenTofu inventory
      ansible.builtin.include_role:
        name: dryvist.homelab.inventory_resolve
      vars:
        inventory_resolve_required_keys: [constants, nodes, domain]

    - name: Validate tofu_data constants structure
      ansible.builtin.assert:
        that:
          - tofu_data is defined
          - tofu_data.constants is defined
          - tofu_data.constants.service_ports is defined
        fail_msg: |
          tofu_data.constants is missing or incomplete in the resolved
          inventory. Re-run the tofu-proxmox Terrakube workspace so the
          inventory is republished (including pipeline_constants) to RustFS.

    - name: Validate tofu_data carries the node-FQDN derivation inputs
      ansible.builtin.assert:
        that:
          - tofu_data.nodes is defined
          - tofu_data.domain is defined
          - tofu_data.domain | length > 0
        fail_msg: |
          tofu_data.nodes and/or tofu_data.domain are missing from the
          resolved inventory. Every LXC container's ansible_host is DERIVED as
          {node-role}.{domain} (the per-node management FQDN) — a missing or
          empty domain would silently produce a broken host (a bare
          "{node-role}." with no domain suffix).

          Re-run the tofu-proxmox Terrakube workspace so the inventory is
          republished with `nodes` and `domain` populated.

    # Tag -> group mapping note (kept OUT of the Jinja expression below: `#` is
    # not a comment inside {{ }}, it is a syntax error).
    #
    # `llm-fast` is a CAPABILITY tag. In tofu it selects the shared serving-API
    # firewall groups, and every GPU serving guest carries it whatever engine it
    # runs. It used to double as the signal for WHICH role serves, which stopped
    # being true once a second engine existed. `llm-vllm` names the
    # IMPLEMENTATION, so a guest declaring it is excluded from llm_fast_group
    # and does not receive both serving roles. CPU-pool tag vocabulary is
    # constants.llm_cpu_scaler.tags — never restated as literals here.
    - name: Resolve CPU LLM pool tag vocabulary from tofu constants
      ansible.builtin.set_fact:
        _llm_cpu_moe_tag: "{{ tofu_data.constants.llm_cpu_scaler.tags.moe }}"
        _llm_cpu_9b_tag: "{{ tofu_data.constants.llm_cpu_scaler.tags.nine_b }}"
        _llm_cpu_pool_tags: "{{ tofu_data.constants.llm_cpu_scaler.pool_tags }}"
      when: tofu_data.constants.llm_cpu_scaler is defined

    # Container connection selection (probe/fallback + the tag ->
    # ansible_connection composition) and the tag -> group mapping live in
    # their own file — see its header for why.
    - name: Add AI LXC containers to inventory
      ansible.builtin.import_tasks: load_tofu/add_lxc_hosts.yml

    # Push tofu_data onto every dynamically-added host so roles can access
    # tofu_data.constants.* directly without hostvars['localhost'] indirection.
    - name: Propagate tofu_data to all inventory hosts
      ansible.builtin.set_fact:
        tofu_data: "{{ tofu_data }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['all'] | reject('equalto', 'localhost') | list }}"
      when: tofu_data is defined

    # add_host CANNOT set a host var literally named `hostname`: it is an alias
    # of add_host's `name` option (aliases: host, hostname) and gets silently
    # consumed instead of becoming a hostvar. Set it as a real per-host fact.
    - name: Set the guest hostname fact on all inventory hosts
      vars:
        tofu_guests: "{{ tofu_data.containers | default({}) }}"
      ansible.builtin.set_fact:
        hostname: "{{ tofu_guests[item].hostname }}"
        container_reserved_ip: "{{ tofu_guests[item].reserved_ip | default('', true) }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['all'] | reject('equalto', 'localhost') | list }}"
      when: item in tofu_guests
