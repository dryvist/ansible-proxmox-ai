---
# Fine-tuned System 1 router, served beside the default model as an extra named model.
laya_systemone_finetune_enabled: true
laya_systemone_finetune_name: system1-v1
laya_systemone_finetune_gpu_peer_host: llm-ada-lovelace-6X-16GB-embed
laya_systemone_finetune_gpu_peer_unit: >-
  {{ nvidia_gpu_guest_unit_prefix ~ '-'
     ~ hostvars[laya_systemone_finetune_gpu_peer_host].llm_active_profile
     ~ '.service' }}
laya_systemone_finetune_gpu_peer_health_url: >-
  {{ 'http://'
     ~ (hostvars[laya_systemone_finetune_gpu_peer_host].nvidia_gpu_guest_listen_host
        | default(hostvars[laya_systemone_finetune_gpu_peer_host].ansible_facts.default_ipv4.address, true))
     ~ ':'
     ~ (tofu_data.constants.service_ports[
          hostvars[laya_systemone_finetune_gpu_peer_host].llm_gpu_serving_api_port_key
        ] | string)
     ~ '/v1/models' }}
laya_systemone_finetune_train_key: finetune/v1/train.csv
laya_systemone_finetune_train_sha256: 8966a58db4043ebedc6963ff129b410aa4a9d09f18f0d159fdaa4daa28631b00
laya_systemone_finetune_eval_key: finetune/v1/eval.csv
laya_systemone_finetune_eval_sha256: d59e032bc642774a50ef62914963e2d1dc53a3aefab7e7028385365097ecffec
laya_systemone_heldout_key: finetune/v1/heldout-v2-stable.csv
laya_systemone_heldout_sha256: 6dc2260de148ba5697c7d7378f67652fd760de5ef2123c1154367b9ad34dc37b
