---
llm_active_profile: small
llm_gpu_serving_model_cache_mount_path: /var/lib/llm
llm_gpu_serving_api_port_key: llm_gpu_serving_api
# Ada profile budget: MiMo weights 5841049120 / 2^30 = 5.439900905 GiB;
# Qwen ASR peak 4290 MiB = 4.189453125 GiB and Ming TTS peak 1924 MiB =
# 1.87890625 GiB (6.068359375 GiB total); KV is 0.25 GiB at 4096 x 2 for
# 8 full-attention layers, 4 KV heads, head_dim 256, f16; compute reserve 1 GiB.
# Total 12.758260280 GiB <= 13 GiB, leaving 0.241739720 GiB of margin.
llm_gpu_serving_profile_overrides:
  small:
    max_model_len: 4096
    max_num_seqs: 2
llm_gpu_serving_profile_artifact_overrides:
  small: mimo-9b-q4-k-m
llm_gpu_serving_co_resident_profiles: [speech]
# The router reaches this card through the small lane (llm-models.d/30-local-gpu.yml) on the light port.
llm_router_gpu_member: false
llm_router_gpu_audio_member: true
