---
llm_active_profile: small
llm_gpu_serving_model_cache_mount_path: /var/lib/llm
# Speech listens on the llama.cpp port + 1, which this guest's firewall already
# admits as its co-resident port; the router derives the same port from this key.
llm_gpu_serving_api_port_key: llm_fast_api
# Ada card budget, 15.0 GiB ceiling with every model loaded. llama.cpp holds
# MiMo 9B Q4_K_M (32768 ctx x 2 slots) plus glm-ocr Q8_0 with mmproj: measured
# 8.89 GiB peak. audio.cpp adds Qwen ASR peak 4290 MiB = 4.189453125 GiB and
# Ming TTS peak 1924 MiB = 1.87890625 GiB (6.068359375 GiB total).
# Total 14.958359375 GiB <= 15.0 GiB. If the measured peak reaches 15 GiB, set
# audio.cpp max_loaded_models to 1 (one speech model at a time, about 13.08 GiB).
llm_gpu_serving_profile_overrides:
  small:
    max_model_len: 4096
    max_num_seqs: 2
llm_gpu_serving_profile_artifact_overrides:
  small: mimo-9b-q4-k-m
llm_gpu_serving_co_resident_profiles: [speech]
# The router reaches this card through the small lane (llm-models.d/30-local-gpu.yml) on the light port.
llm_router_gpu_member: false
llm_router_gpu_audio_member: true
