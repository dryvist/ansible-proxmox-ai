---
llm_active_profile: small
llm_gpu_serving_model_cache_mount_path: /var/lib/llm
# gpu-small serves on the tofu GPU serving port; the light lane keeps llm_fast_api on this guest.
# Read from localhost: routers template this var while this guest is outside the play.
llm_gpu_serving_api_port: "{{ hostvars['localhost']['tofu_data'].constants.service_ports.llm_gpu_serving_api }}"
