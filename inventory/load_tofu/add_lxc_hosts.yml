---
# Extracted from inventory/load_tofu.yml to stay under the org token-limits
# gate: container connection selection and the tag -> group mapping, both
# bulky and this file's concern alone. Imported via import_tasks into the
# parent play, so every fact it already set (tofu_data,
# _llm_cpu_pool_tags, ...) is visible here without re-resolving anything.

# Safety gate for the tofu-proxmox contract's ansible_connection field
# ONLY — the tag allowlist below (tofu_ssh_container) is unconditional and
# never probed: those guests are already live in production over ssh
# specifically because pct exec is broken for them, so a transient sshd
# hiccup here must never fall them back into that bug. A container newly
# declaring the contract field is checked for a listening sshd before its
# connection is flipped; a caller (a test) that pre-sets
# load_tofu_ssh_ready skips the live probe entirely.
- name: Probe SSH readiness for containers declaring the contract's ssh connection
  ansible.builtin.wait_for:
    host: "{{ item.value.fqdn | default(item.value.ip, true) }}"
    port: 22
    timeout: 5
    state: started
  delegate_to: localhost
  loop: "{{ tofu_data.containers | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: load_tofu_ssh_probe
  ignore_errors: true
  changed_when: false
  when:
    - load_tofu_ssh_ready is not defined
    - tofu_data.containers is defined
    - tofu_data.containers | length > 0
    - item.value.ansible_connection | default('') == 'ssh'
    - (item.value.tags | default([]))
         | intersect(
             ['hermes-agent', 'llm-router', 'llm-redis', 'llm-vllm', 'llm-gpu',
              'llm-fast', 'open-webui', 'herdr', 'langfuse', 'phoenix']
             + (_llm_cpu_pool_tags | default([]))
           )
         | length == 0

# Ready means the probe actually ran and reported failed: false — a skipped
# item or one with no `failed` key at all is NOT ready (fail safe).
- name: Record which contract-declared-ssh containers actually answered
  ansible.builtin.set_fact:
    load_tofu_ssh_ready: >-
      {{ load_tofu_ssh_probe.results | default([])
         | selectattr('skipped', 'undefined')
         | selectattr('failed', 'defined') | rejectattr('failed')
         | map(attribute='item.key') | list }}
  when: load_tofu_ssh_ready is not defined

- name: Warn about contract-declared-ssh containers whose sshd did not answer
  ansible.builtin.debug:
    msg: >-
      {{ item.key }} declares ansible_connection=ssh but port 22 on
      {{ item.value.fqdn | default(item.value.ip, true) }} did not answer
      within the probe timeout — falling back to
      community.proxmox.proxmox_pct_remote for this run.
  loop: "{{ tofu_data.containers | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - tofu_data.containers is defined
    - item.value.ansible_connection | default('') == 'ssh'
    - (item.value.tags | default([]))
         | intersect(
             ['hermes-agent', 'llm-router', 'llm-redis', 'llm-vllm', 'llm-gpu',
              'llm-fast', 'open-webui', 'herdr', 'langfuse', 'phoenix']
             + (_llm_cpu_pool_tags | default([]))
           )
         | length == 0
    - item.key not in (load_tofu_ssh_ready | default([]))

- name: Resolve the selector and declared GPU engine members
  ansible.builtin.set_fact:
    load_tofu_gpu_engine_selector: >-
      {{ (tofu_data | default({})).get('llm_gpu_engine', 'llama_cpp') }}
    load_tofu_gpu_engine_members: >-
      {{ (tofu_data.containers | default({}) | dict2items)
         | selectattr('value.llm_gpu_engine_identity', 'defined')
         | selectattr('value.llm_gpu_engine_identity', 'in', ['llama_cpp', 'vllm']) | list }}

- name: Record whether the replacement engine pair is declared
  ansible.builtin.set_fact:
    load_tofu_gpu_engine_pair_present: >-
      {{ load_tofu_gpu_engine_members | length > 0 }}

- name: Log the GPU engine inventory decision
  ansible.builtin.debug:
    msg: >-
      GPU selector={{ load_tofu_gpu_engine_selector }};
      replacement_pair={{ 'present' if load_tofu_gpu_engine_pair_present else 'absent' }};
      legacy_group={{ 'enabled' if not load_tofu_gpu_engine_pair_present else 'excluded' }}.

- name: Validate the published GPU engine selector and pair before host projection
  ansible.builtin.assert:
    that:
      - load_tofu_gpu_engine_selector in ['llama_cpp', 'vllm']
      - load_tofu_gpu_engine_members | length == 0 or load_tofu_gpu_engine_members | length == 2
      - >-
        load_tofu_gpu_engine_members | length == 0 or
        (load_tofu_gpu_engine_members | map(attribute='value.llm_gpu_engine_identity') | sort | list
         == ['llama_cpp', 'vllm'])
      - >-
        load_tofu_gpu_engine_members | length == 0 or
        (load_tofu_gpu_engine_members
         | selectattr('value.llm_gpu_engine_identity', 'equalto', load_tofu_gpu_engine_selector)
         | selectattr('value.started', 'equalto', true) | list | length == 1)
      - >-
        load_tofu_gpu_engine_members | length == 0 or
        (load_tofu_gpu_engine_members
         | selectattr('value.started', 'equalto', true) | list | length == 1)
    fail_msg: >-
      Published GPU engine inventory must have a supported selector and either
      no replacement guests or exactly one llama_cpp and one vllm guest with
      exactly one selector-matching guest marked started.

- name: Add AI LXC containers to inventory
  ansible.builtin.import_tasks: add_lxc_host_inventory.yml
