---
- name: Derive the container to agent map
  ansible.builtin.import_tasks: derive_agent_map.yml

- name: Validate Hermes identity markers
  ansible.builtin.import_tasks: assert_hermes_identity.yml

- name: Add AI LXC containers to inventory (proxmox_pct_remote connection)
  ansible.builtin.add_host:
    name: "{{ item.key }}"
    # An eval tag maps only to its own evaluation group. refuse_eval_tag_conflicts.yml refuses
    # a production tag on an evaluation guest before this mapping runs.
    groups: >-
      {{ lookup('template', (ansible_config_file | dirname) ~
         '/inventory/load_tofu/add_lxc_host_groups.yml.j2') | from_yaml }}
    # Omitted (not 0/null) for an ssh-connected guest: pct exec never runs
    # for it, so nothing reads this vmid.
    proxmox_vmid: "{{ omit if container_ssh else item.value.vmid }}"
    # Per-node management FQDN, DERIVED — never a hand-pinned global host.
    # A guest reaches its own node at {node-role}.{domain}; those names
    # resolve internally while the bare cluster member name does not. The
    # nodes-map lookup corrects a legacy bare node key to its role, and
    # falls back to the node value itself when the map omits the key
    # (e.g. the generic test-fixture node key).
    #
    # A guest is ssh-connected (container_ssh, defined below) via EITHER
    # of two independent paths, which now compose rather than compete:
    #
    # 1. tofu_ssh_container: the tag allowlist below. Converges over
    #    direct ssh because pct exec on PVE 9.2.4 closes the channel mid
    #    module-upload (large stdin), failing every play at Gathering
    #    Facts with the misleading "Channel closed.". Membership requires
    #    sshd in the guest, the SSH client-CA (root login, `ansible`
    #    principal), and the guest's host key in the pinned
    #    SSH_KNOWN_HOSTS set. This is the pre-existing production
    #    mechanism; guests on it are unaffected by path 2 below.
    # 2. item.value.ansible_connection == 'ssh': the tofu-proxmox
    #    contract's own per-container field (dryvist/tofu-proxmox#1188),
    #    set once an operator flips a specific container in
    #    deployment.json — the "real fix" path 1's comment refers to.
    #    Gated on a controller-side port-22 probe (load_tofu_ssh_ready,
    #    set above) before the flip takes effect: an operator can declare
    #    the field before sshd is actually ready in the guest, and this
    #    run falls back to pct_remote with a warning rather than handing
    #    Ansible a connection nothing answers. Path 1 above is NEVER
    #    probed or gated this way.
    #
    # Either path prefers the contract's stable `fqdn` over `ip`; the
    # default keeps a pre-contract inventory without `fqdn` working.
    ansible_host: >-
      {{ (item.value.fqdn | default(item.value.ip, true)) if container_ssh
         else (tofu_data.nodes[item.value.node] | default({})).role
              | default(item.value.node, true) ~ '.' ~ tofu_data.domain }}
    # The else branch cannot echo item.value.ansible_connection: a guest
    # whose probe failed still carries 'ssh' there, a connection nothing
    # answers. Force pct_remote whenever container_ssh said no.
    ansible_connection: >-
      {{ 'ssh' if container_ssh
         else (item.value.ansible_connection
               if item.value.ansible_connection != 'ssh'
               else 'community.proxmox.proxmox_pct_remote') }}
    ansible_user: root
    ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') }}"
    # NOTE: no `hostname:` here — add_host treats it as an alias of `name`
    # and silently consumes it (it never becomes a hostvar). The hostname
    # fact is set for every guest by the propagate task at the bottom.
    container_ip: "{{ item.value.ip }}"
    # DHCP-first guests (tofu contract): `ip` carries the FQDN (DNS-first),
    # `reserved_ip` the DHCP-reservation address an A record must point at.
    # Static guests carry reserved_ip = null (or pre-contract inventories
    # omit it entirely) — both normalize to '' here.
    container_reserved_ip: "{{ item.value.reserved_ip | default('', true) }}"
    # tofu-proxmox's per-container shared models mount path
    # (containers[*].models_mount_path) — empty string when this guest has
    # none. The llama_cpp role derives llama_cpp_models_dir from this
    # instead of a hardcoded default, so the two can never disagree.
    container_models_mount_path: "{{ item.value.models_mount_path | default('', true) }}"
    container_models_cache_mount_path: "{{ item.value.models_cache_mount_path | default('', true) }}"
    container_models_origin_mount_path: "{{ item.value.models_origin_mount_path | default('', true) }}"
    container_models_origin_mount_read_only: >-
      {{ item.value.models_origin_mount_read_only | default(true, true) | bool }}
    host_tags: "{{ item.value.tags | default([]) }}"
    llm_gpu_engine_identity: "{{ item.value.llm_gpu_engine_identity | default('') }}"
    llm_gpu_engine_selector: "{{ load_tofu_gpu_engine_selector }}"
    # Which Hermes agent this guest runs. The deployment.json tag is the
    # single source of truth; roles/hermes_agent/defaults derives
    # hermes_agent_id from this, and every shared-service handle (Slack app
    # + channels, OpenBao domain, Vikunja project, memory bank, OTel name)
    # derives from that in turn.
    #
    # Deliberately a SEPARATE name from hermes_agent_id, and this indirection
    # is load-bearing: recover-hermes-queue pulls the seeded-cron list by
    # loading the whole role defaults file through `vars_files`, and play
    # vars_files OUTRANKS inventory host/group vars. Setting the identity
    # under its own name — one the defaults file never defines — is what
    # keeps those plays from silently reverting every guest to the first
    # agent and reconciling it with the first agent's credentials.
    hermes_agent_identity: >-
      {{ _ai_agent_by_container[item.key | default('')]
         if (item.key | default('')) in _ai_agent_by_container
         else ('pepper' if 'hermes-pepper' in (item.value.tags | default([]))
               else ('hermes-private' if 'hermes-private' in (item.value.tags | default([]))
               else ('donna' if 'hermes-donna' in (item.value.tags | default([]))
                     else 'hermes'))) }}
  vars:
    # _ai_agent_by_container is set by derive_agent_map.yml, imported at the top of this file.
    # Derived from tags, per-item, rather than a hand-maintained name
    # list: 'hermes-agent' covers every Hermes agent guest (hermes-donna
    # guests carry both tags — see hermes_agent_identity above),
    # 'llm-router' covers every LLM router guest, and 'llm-redis' the
    # spend store those routers count in.
    #
    # This list is an ALLOWLIST of guests moved off the pct-exec path, not
    # a statement that pct exec works for the rest. It does not: on current
    # PVE 9.2.x, fact gathering fails with "Channel closed." for every
    # guest still on that connection, and succeeds only for guests already
    # flipped to ssh here. Members are added one at a time as each is
    # confirmed to have sshd and CA trust. Inverting the default to ssh is
    # the real fix and is tracked separately.
    tofu_ssh_container: >-
      {{ (item.value.tags | default([]))
         | intersect(
             ['hermes-agent', 'llm-router', 'llm-redis', 'llm-vllm', 'llm-gpu',
              'llm-fast', 'open-webui', 'herdr', 'langfuse', 'phoenix']
             + (_llm_cpu_pool_tags | default([]))
           )
         | length > 0 }}
    # Contract path (2 above), gated on the probe recorded in
    # load_tofu_ssh_ready — never on tofu_ssh_container guests, which
    # take path 1 unconditionally regardless of probe outcome.
    _contract_ssh: >-
      {{ (not tofu_ssh_container)
         and item.value.ansible_connection == 'ssh'
         and item.key in (load_tofu_ssh_ready | default([])) }}
    # The two activation paths described above, OR'd together.
    container_ssh: "{{ tofu_ssh_container or _contract_ssh }}"
  loop: "{{ tofu_data.containers | dict2items }}"
  changed_when: false
  when:
    - tofu_data.containers is defined
    - tofu_data.containers | length > 0
