---
- name: Derive the container to agent map from the published roster
  ansible.builtin.set_fact:
    # group_vars/all is not loaded for implicit localhost during inventory
    # construction, so derive the container lookup from the resolved artifact.
    # A logical agent with no guest publishes no `container` key, so it maps to nothing here.
    _ai_agent_by_container: >-
      {{ dict(_ai_agents | dict2items | selectattr('value.container', 'defined')
              | map(attribute='value.container') | zip(_ai_agents | dict2items
              | selectattr('value.container', 'defined') | map(attribute='key'))) }}
  vars:
    _ai_agents: "{{ (tofu_data | default({})).agents | default({}) }}"
