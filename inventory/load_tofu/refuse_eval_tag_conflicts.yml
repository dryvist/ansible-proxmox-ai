---
# Refuses, before any host is added, a guest that carries an evaluation tag (any *-eval) with a tag that would
# put it in a production or secret-reading group: prefetch (managed-secrets, clickhouse), the ai-proxied pool,
# a production app (dify, langflow, sim), or the classify and Hermes agent tags.
# Failing here stops the whole inventory load.
- name: Refuse an evaluation guest that also carries a production or secret-reading tag
  ansible.builtin.assert:
    that:
      - >-
        ((item.value.tags | default([])) | select('search', '-eval$') | list | length == 0)
        or ((item.value.tags | default([])) | intersect(_eval_guard_forbidden_tags) | length == 0)
    fail_msg: >-
      {{ item.key }} carries an evaluation tag with a production or secret-reading tag (tags:
      {{ item.value.tags | default([]) | join(', ') }}). An evaluation guest must not join the prefetch,
      the ai-proxied pool or a production app group. Remove one of the tags in the published inventory.
  loop: "{{ tofu_data.containers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    _eval_guard_forbidden_tags:
      - managed-secrets
      - clickhouse
      - ai-proxied
      - dify
      - langflow
      - sim
      - llm-gpu-classify
      - hermes-agent
      - hermes-donna
  when:
    - tofu_data.containers is defined
    - tofu_data.containers | length > 0
