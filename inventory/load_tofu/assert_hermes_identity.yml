---
- name: Reject conflicting or unrecognized Hermes identity markers
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        identity_markers | difference(['hermes-private', 'hermes-donna', 'hermes-pepper',
                                      'hermes-agent', 'hermes-ui']) | length == 0
      - identity_markers | intersect(['hermes-private', 'hermes-donna', 'hermes-pepper']) | length <= 1
      - "'hermes-pepper' not in identity_markers or 'hermes-agent' in identity_markers"
      - >-
        'hermes-pepper' not in identity_markers
        or _ai_agent_by_container.get(item.key, 'pepper') == 'pepper'
    fail_msg: Invalid Hermes identity tags.
  vars:
    identity_markers: "{{ item.value.tags | default([]) | select('match', '^hermes-') | list }}"
  loop: "{{ tofu_data.containers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
