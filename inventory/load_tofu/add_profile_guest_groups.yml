---
- name: Add the selected profile group to unassigned legacy GPU guests
  ansible.builtin.add_host:
    name: "{{ item.key }}"
    groups: llm_gpu_serving_llama_cpp_group
  loop: "{{ tofu_data.containers | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - llm_active_profile | default('') == 'qwen38-27b-131k-1'
    - item.value.llm_gpu_engine_identity | default('') == ''
    - "'nvidia-gpu' in (item.value.tags | default([]))"
    - "'llm-vllm' in (item.value.tags | default([]))"
