---
# Shared knobs for every CPU-pool llama.cpp guest (any tag in
# constants.llm_cpu_scaler.pool_tags). Tier-specific models live in
# llm_cpu_moe_group / llm_cpu_9b_group — never in host_vars keyed by hostname.

llama_cpp_gpu_backend: cpu
llama_cpp_parallel: 1
llama_cpp_ctx_size: 8192

systemd_restart_policy_services:
  - llama-swap

syslog_forwarder_program_routes:
  - program: llama-swap
    port: "{{ tofu_data.constants.ai_log_routing.homelab_llm.port | default(10323) }}"
