---
# Dify LLMOps platform group variables.

# Production console: import the agent DSLs so the operator can view and tune them.
dify_docker_import_agent_dsls: true

# PR automation catalog apps use the fixture in shadow mode by default.
dify_docker_agent_app_variables:
  pr-keeper: &pr_automation_app_variables
    - name: PR_AUTOMATION_SHADOW
      secret: false
      value: "true"
    - name: PR_AUTOMATION_REPOS
      secret: false
      value: "{{ lookup('env', 'DIFY_PR_AUTOMATION_REPOS') | default('example-org/example-repo', true) }}"
  merge-steward: *pr_automation_app_variables
  # Vikunja clerk project policy, from converge-time env keys. The inert defaults
  # (empty allow list, inbox 0) make the clerk refuse every write.
  vikunja-clerk:
    - name: VIKUNJA_ALLOWED_PROJECTS
      secret: true
      value: "{{ lookup('env', 'DIFY_VIKUNJA_CLERK_ALLOWED_PROJECTS') | default('[]', true) }}"
    - name: VIKUNJA_DENIED_PROJECTS
      secret: true
      value: "{{ lookup('env', 'DIFY_VIKUNJA_CLERK_DENIED_PROJECTS') | default('[]', true) }}"
    - name: VIKUNJA_INBOX_PROJECT_ID
      secret: true
      value: "{{ lookup('env', 'DIFY_VIKUNJA_CLERK_INBOX_PROJECT_ID') | default('0', true) }}"
  # Triage apps stay in their DSL's shadow mode. Credentials come from converge-time env
  # keys; the empty defaults leave a run with nothing to read or post.
  vikunja-triage:
    - name: VIKUNJA_TRIAGE_ALLOWED_PROJECTS
      secret: true
      value: "{{ lookup('env', 'DIFY_VIKUNJA_TRIAGE_ALLOWED_PROJECTS') | default('[]', true) }}"
    - name: VIKUNJA_TRIAGE_READONLY_PROJECTS
      secret: true
      value: "{{ lookup('env', 'DIFY_VIKUNJA_TRIAGE_READONLY_PROJECTS') | default('[]', true) }}"
    - name: VIKUNJA_TRIAGE_RANK_ONLY_PROJECTS
      secret: true
      value: "{{ lookup('env', 'DIFY_VIKUNJA_TRIAGE_RANK_ONLY_PROJECTS') | default('[]', true) }}"
    - name: VIKUNJA_TRIAGE_DENIED_PROJECTS
      secret: true
      value: "{{ lookup('env', 'DIFY_VIKUNJA_TRIAGE_DENIED_PROJECTS') | default('[]', true) }}"
    - {name: OPENBAO_ADDR, secret: false, value: "{{ lookup('env', 'DIFY_TRIAGE_OPENBAO_ADDR') }}"}
    - {name: OPENBAO_ROLE_ID, secret: true, value: "{{ lookup('env', 'DIFY_VIKUNJA_TRIAGE_OPENBAO_ROLE_ID') }}"}
    - {name: OPENBAO_SECRET_ID, secret: true, value: "{{ lookup('env', 'DIFY_VIKUNJA_TRIAGE_OPENBAO_SECRET_ID') }}"}
    - {name: GITHUB_READ_TOKEN_PATH, secret: false, value: github-token/vikunja-triage}
    - {name: GITHUB_API_BASE, secret: false, value: "https://api.github.com"}
    - {name: GITHUB_WEB_HOST, secret: false, value: github.com}
    - {name: DIFY_API_BASE, secret: false, value: "{{ dify_docker_internal_trigger_url }}/v1"}
    - {name: DIFY_DATASET_API_KEY, secret: true, value: "{{ lookup('env', 'DIFY_TRIAGE_DATASET_API_KEY') }}"}
    - {name: TRIAGE_EMBEDDING_PROVIDER, secret: false, value: "{{ lookup('env', 'DIFY_TRIAGE_EMBEDDING_PROVIDER') }}"}
    - {name: TRIAGE_EMBEDDING_MODEL, secret: false, value: "{{ lookup('env', 'DIFY_TRIAGE_EMBEDDING_MODEL') }}"}
    - &triage_slack_token
      name: SLACK_AGENT_BOT_TOKEN
      secret: true
      value: "{{ lookup('env', 'DIFY_TRIAGE_SLACK_AGENT_BOT_TOKEN') }}"
    - &triage_slack_base {name: SLACK_API_BASE, secret: false, value: "https://slack.com/api"}
    - &triage_digest
      name: AGENT_DIGEST_CHANNEL
      secret: false
      value: "{{ lookup('env', 'DIFY_TRIAGE_AGENT_DIGEST_CHANNEL') }}"
    - &triage_failure
      name: AGENT_FAILURE_CHANNEL
      secret: false
      value: "{{ lookup('env', 'DIFY_TRIAGE_AGENT_FAILURE_CHANNEL') }}"
    - &triage_dashboard
      name: AGENT_DASHBOARD_URL
      secret: false
      value: "{{ lookup('env', 'DIFY_TRIAGE_AGENT_DASHBOARD_URL') }}"
  zammad-triage:
    - {name: ZAMMAD_API_BASE, secret: false, value: "{{ lookup('env', 'DIFY_ZAMMAD_TRIAGE_API_BASE') }}"}
    - {name: OPENBAO_ADDR, secret: false, value: "{{ lookup('env', 'DIFY_TRIAGE_OPENBAO_ADDR') }}"}
    - {name: OPENBAO_ROLE_ID, secret: true, value: "{{ lookup('env', 'DIFY_ZAMMAD_TRIAGE_OPENBAO_ROLE_ID') }}"}
    - {name: OPENBAO_SECRET_ID, secret: true, value: "{{ lookup('env', 'DIFY_ZAMMAD_TRIAGE_OPENBAO_SECRET_ID') }}"}
    - {name: ZAMMAD_TOKEN_PATH, secret: false, value: "{{ lookup('env', 'DIFY_ZAMMAD_TRIAGE_TOKEN_PATH') }}"}
    - {name: LITELLM_ROUTER_KEY, secret: true, value: "{{ lookup('env', 'DIFY_ZAMMAD_TRIAGE_ROUTER_KEY') }}"}
    - *triage_slack_token
    - *triage_slack_base
    - *triage_digest
    - *triage_failure
    - *triage_dashboard

# Session/credential-protection key, bao-first (ai/dify) with an env fallback —
# same shape as the other ai-domain consumers. bao_local_llm_secrets defaults to
# {} in group_vars/all/, so a run without the domain fetched falls through cleanly.
#
# This key protects the material that decrypts what the app has already stored.
# A database backup restored against a DIFFERENT key leaves that stored data
# unreadable, and nothing errors when it happens — which is why its home is the
# secret store rather than only a root-only file on the guest holding the data
# it unlocks. PROMOTED (read off the running guest), never generated: generating
# a replacement is exactly the unrecoverable outcome.
#
# Empty here does NOT silently become a fresh key: the role falls back to the
# guest's existing file and asserts a non-empty result before deploying.
dify_docker_secret_key: >-
  {{ bao_local_llm_secrets.DIFY_SECRET_KEY
     | default(lookup('env', 'DIFY_SECRET_KEY'), true) }}

# Console API base for the setup-state probe and the setup/login calls. It
# must be set to the console address reachable from the guest itself: nginx
# publishes the web port on the guest, so the host is the container's IP address
# from the published tofu inventory (`container_ip`, the value the inventory
# loader maps from the contract's `ip` field) and the port is the web port
# already derived from the tofu constants. There is no role default — every
# Dify host must set this here.
dify_docker_console_api_base: "http://{{ container_ip }}:{{ dify_docker_web_port }}/console/api"

# Deployment-specific Vikunja MCP provider and catalog DSL placeholder mapping.
# The Dify role defaults stay inert; only this deployment opts in to the provider.
# Each public value below is extended from an env-doc JSON key (see the end of this file).
dify_public_agent_tool_providers:
  vikunja-clerk:
    VIKUNJA_MCP_PROVIDER_ID: vikunja
  vikunja-triage:
    VIKUNJA_MCP_PROVIDER_ID: vikunja
dify_public_agent_mcp_providers:
  - name: vikunja
    server_identifier: vikunja
    server_url: >-
      https://mcp.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
      or undef('PROXMOX_SUBDOMAIN required (Doppler)') }}/vikunja-clerk
    icon: "📋"
    icon_type: emoji
    icon_background: "#E6F4EA"
    header_name: Authorization
    header_prefix: "Bearer "
    openbao_field: VIKUNJA_MCP_HTTP_TOKEN_VIKUNJA_CLERK
    timeout: 60
    sse_read_timeout: 300
    tool_name: vikunja_tasks

# Publish only the Vikunja clerk as a native MCP server; its URL goes only to the app's OpenBao leaf.
dify_docker_publish_agent_mcp: true
dify_public_publish_agent_mcp_apps: [vikunja-clerk]

# Private agent apps, supplied at converge time so no deployment-specific name
# lands in this file. Each env-doc key holds JSON in the shape of the variable it
# extends; an unset key adds nothing.
#   DIFY_PRIVATE_AGENT_DSLS              list of {name, url, sha256}
#   DIFY_PRIVATE_AGENT_TOOL_PROVIDERS    map, merged into the public map
#   DIFY_PRIVATE_AGENT_MCP_PROVIDERS     list, appended to the public list
#   DIFY_PRIVATE_PUBLISH_AGENT_MCP_APPS  list, appended to the public list
# The private DSL source token is bao-first (ai/dify) with an env fallback.
dify_docker_private_agent_dsls: "{{ lookup('env', 'DIFY_PRIVATE_AGENT_DSLS') | default('[]', true) | from_json }}"
dify_docker_private_agent_dsl_token: >-
  {{ bao_local_llm_secrets.DIFY_PRIVATE_AGENT_DSL_TOKEN
     | default(lookup('env', 'DIFY_PRIVATE_AGENT_DSL_TOKEN'), true) }}
dify_docker_agent_tool_providers: >-
  {{ dify_public_agent_tool_providers
     | combine(lookup('env', 'DIFY_PRIVATE_AGENT_TOOL_PROVIDERS') | default('{}', true) | from_json) }}
dify_docker_agent_mcp_providers: >-
  {{ dify_public_agent_mcp_providers
     + (lookup('env', 'DIFY_PRIVATE_AGENT_MCP_PROVIDERS') | default('[]', true) | from_json) }}
dify_docker_publish_agent_mcp_apps: >-
  {{ dify_public_publish_agent_mcp_apps
     + (lookup('env', 'DIFY_PRIVATE_PUBLISH_AGENT_MCP_APPS') | default('[]', true) | from_json) }}
