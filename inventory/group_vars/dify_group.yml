---
# Dify LLMOps platform group variables.

# Production console: import the agent DSLs so the operator can view and tune them.
dify_docker_import_agent_dsls: true

# PR automation catalog apps use the fixture in shadow mode by default.
dify_docker_agent_app_variables:
  pr-keeper: &pr_automation_app_variables
    - name: PR_AUTOMATION_SHADOW
      secret: false
      value: "true"
    - name: PR_AUTOMATION_REPOS
      secret: false
      value: JacobPEvans-ai/pr-automation-fixture
  merge-steward: *pr_automation_app_variables

# Session/credential-protection key, bao-first (ai/dify) with an env fallback —
# same shape as the other ai-domain consumers. bao_local_llm_secrets defaults to
# {} in group_vars/all/, so a run without the domain fetched falls through cleanly.
#
# This key protects the material that decrypts what the app has already stored.
# A database backup restored against a DIFFERENT key leaves that stored data
# unreadable, and nothing errors when it happens — which is why its home is the
# secret store rather than only a root-only file on the guest holding the data
# it unlocks. PROMOTED (read off the running guest), never generated: generating
# a replacement is exactly the unrecoverable outcome.
#
# Empty here does NOT silently become a fresh key: the role falls back to the
# guest's existing file and asserts a non-empty result before deploying.
dify_docker_secret_key: >-
  {{ bao_local_llm_secrets.DIFY_SECRET_KEY
     | default(lookup('env', 'DIFY_SECRET_KEY'), true) }}

# Console API base for the setup-state probe and the setup/login calls. It
# must be set to the console address reachable from the guest itself: nginx
# publishes the web port on the guest, so the host is the container's IP address
# from the published tofu inventory (`container_ip`, the value the inventory
# loader maps from the contract's `ip` field) and the port is the web port
# already derived from the tofu constants. There is no role default — every
# Dify host must set this here.
dify_docker_console_api_base: "http://{{ container_ip }}:{{ dify_docker_web_port }}/console/api"
