---
# agent_guest group vars — bao-first secret resolution for the pooled
# autonomous agent guests. Role defaults read env only (backend-agnostic);
# these override bao-first with an env fallback. An empty token leaves the
# queue disabled rather than failing the converge.
#
# bao_agent_guest_secrets is published by the Phase 0 pre-fetch play and is the
# `ai-runner` OpenBao domain — the successor role reuses the predecessor's
# domain rather than provisioning a second identity for the same guests.
#
# There is deliberately NO ANTHROPIC_API_KEY here, unlike ai_runner_group.yml:
# it outranks CLAUDE_CODE_OAUTH_TOKEN in claude's auth precedence, so seeding it
# silently moves billing off the subscription. The model credentials reach a job
# through `bao agent` env_template instead, never through a rendered file.

# Vikunja dispatch-queue token (the one credential the poller needs).
agent_guest_vikunja_token: >-
  {{ bao_agent_guest_secrets.VIKUNJA_API_TOKEN
     | default(lookup('env', 'VIKUNJA_API_TOKEN'), true) }}
