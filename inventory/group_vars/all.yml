---
# Global variables for all hosts

# System
ansible_become: true
ansible_become_method: sudo

# The published tofu inventory roster is the single source for agent identity
# and ownership.
ai_agents: "{{ (tofu_data | default({})).agents | default({}) }}"
ai_agent_by_container: >-
  {{ dict(ai_agents | dict2items | map(attribute='value.container')
          | zip(ai_agents.keys())) }}
ai_agent_owner: >-
  {%- set owners = {} -%}
  {%- for name, agent in ai_agents.items() -%}
    {%- for slug in agent.owns | default([]) -%}
      {%- set _ = owners.update({slug: name}) -%}
    {%- endfor -%}
  {%- endfor -%}
  {{ owners }}
# Every gateway caller identity -> {trust_tier}: the released harness registry
# (agent_callers_registry, loaded by dryvist.homelab.agent_callers) plus the
# roster. A roster agent without a trust_tier carries an empty tier, which
# the Hindsight ACL treats as no bank. An id in both sources is a fault,
# asserted in roles/agentgateway_docker/tasks/main.yml.
ai_callers: >-
  {%- set callers = {} -%}
  {%- for name, caller in (agent_callers_registry | default({})).items() -%}
    {%- set _ = callers.update({name: {'trust_tier': caller.trust_tier}}) -%}
  {%- endfor -%}
  {%- for name, agent in ai_agents.items() -%}
    {%- set _ = callers.update({name: {'trust_tier': agent.get('trust_tier', '')}}) -%}
  {%- endfor -%}
  {{ callers }}
# The ai_callers trust_tier allowed to call agents behind the gateway's A2A
# routes (roles/agentgateway_docker). Read by the role, never re-typed there.
agentgateway_docker_a2a_allowed_tier: trusted
ai_agent_gateway_key_fields: >-
  {%- set fields = {} -%}
  {%- for name in ai_callers -%}
    {%- set _ = fields.update({name: (name | replace('-', '_')) ~ '_agentgateway_key'}) -%}
  {%- endfor -%}
  {{ fields }}

# Shared Cribl Stream OTLP/HTTP receiver — every OTEL-emitting component points
# here, so this is global rather than scoped to ai_orchestration_group.yml
# (roles outside that group, e.g. hermes_agent/open_webui, reference it too).
ai_subdomain: "{{ lookup('env', 'PROXMOX_SUBDOMAIN') or undef('PROXMOX_SUBDOMAIN required') }}"
# The OTLP receiver is Cribl Stream's in_otel input, reached through the otel
# front door on HTTPS (Traefik, port 443). Stream sends traces to Langfuse and
# Phoenix; metrics also go to VictoriaMetrics and Splunk. Cribl Edge remains
# the per-guest session-log collector, not the OTLP receiver.
ai_orchestration_otel_endpoint: "https://otel.{{ ai_subdomain }}"

# Resolve the serving identity from published inventory constants, then the
# environment override. No host or address fallback is supplied. Missing
# identity is asserted by roles/llm_router/tasks/assert-serving-identity.yml.
llm_large_serving_host: >-
  {{ ((tofu_data.constants.serving | default({})).host | default('', true))
     or (lookup('env', 'LLM_LARGE_RUNNER_HOST') | split('.') | first) }}
llm_large_serving_ip: >-
  {{ ((tofu_data.constants.serving | default({})).ip | default('', true))
     or lookup('env', 'LLM_LARGE_RUNNER_IP') }}
# Which authority supplied the two values above, for the converge-time notice
# in roles/llm_router/tasks/assert-serving-identity.yml. "constants" is the
# destination state; "environment" is the operator override and the supply path
# while the published artifact predates tofu-proxmox#827; "unset" fails the
# assert.
llm_large_serving_source: >-
  {{ 'constants'
     if ((tofu_data.constants.serving | default({})).host | default('', true))
     else ('environment' if lookup('env', 'LLM_LARGE_RUNNER_HOST') else 'unset') }}

# Default capability for consumers that have not selected another capability.
# Open WebUI resolves an OpenBao override when present; Hermes reads its own
# selector below.
ai_default_model: >-
  {{ bao_ai_public_secrets.active_model
     | default('medium', true) }}

# Hermes Agent's brain can differ from ai_default_model; hermes_brain_model
# resolves to this value.
# The Tofu engine selector chooses the active model/context profile.
llm_gpu_active_profiles_by_engine:
  llama_cpp: medium-b
  vllm: medium-a
  sglang: flash-next-64k-8-fp8-mtp
llm_active_profile: >-
  {{ llm_gpu_active_profiles_by_engine.get(
       (hostvars['localhost']['tofu_data'] | default({})).get('llm_gpu_engine', 'llama_cpp'),
       'medium-a'
     )
     if groups.get(
          'llm_gpu_engine_' ~
          (hostvars['localhost']['tofu_data'] | default({})).get('llm_gpu_engine', 'llama_cpp') ~
          '_group', []) | length > 0
     else 'medium-a' }}

# Shared by the legacy and per-engine GPU serving roles for declared stress windows.
llm_gpu_serving_paused: false

#
# Hermes defaults to the same capability as every other default consumer.
hermes_brain_model: medium

# Agentic Hermes cron work is pinned to the router's local-only review ladder.
hermes_agent_cron_model: review-local

# Hindsight's fact extraction (retain) and reflection run on the local medium
# capability, a batching GPU lane; its router key is restricted to it.
hindsight_retain_model: medium
llm_router_hindsight_key_model: "{{ hindsight_retain_model }}"

# SELECTION PHILOSOPHY (2026-08-15, operator decision) — ACCURACY OVER SPEED.
# Where a tier choice trades quality against latency, this fabric takes the
# quality. A model that answers in four minutes and is right is worth more than
# one that answers in twenty seconds and is not, because a wrong answer is not
# cheap work — it is negative work, and something downstream pays to undo it.
#
# The reason this is affordable: the fabric runs continuously, unattended. A
# slow model working 24/7 completes an enormous amount; wall-clock latency per
# call only matters where a human is waiting, which is the minority of calls
# here. So the effort goes into better, more focused prompts — the lever that
# actually moves output quality — not into shaving seconds.
#
# This is NOT a licence to put everything on the biggest model. Two limits:
# a task that is genuinely a short classification (the goal judge is the
# canonical one) belongs on the cheap tier, because the deliberate model buys
# nothing there and takes a slot the real work wants; and no timeout may be
# widened without a measurement (see the judge timeout in
# roles/hermes_agent/defaults/main/60-kanban-dispatcher.yml). Deliberate where
# it pays, cheap where it does not.
#
# AI serving timeout chain (client-is-decider). Each OUTER layer must OUTLIVE the
# inner one, so no intermediate guard kills a still-healthy generation and the
# CLIENT alone decides when to give up:
#   nix-darwin MLX model server guard 3600s (external to this repo)
#     > llm_router per-attempt timeout  (ai_router_request_timeout_seconds)
#       > Hermes client stream read     (ai_stream_read_timeout_seconds)
# The two in-repo layers are named ONCE here (not as bare literals in each role)
# so the ordering invariant is a single source of truth AND the hermes_agent
# Layer-1 assert can verify `read < router` across two roles that never share a
# play — see roles/hermes_agent/tasks/assert.yml. Consumers:
# hermes_agent_stream_read_timeout and llm_router_request_timeout_seconds resolve
# to these, so the rendered configs stay byte-identical to the prior literals.
ai_stream_read_timeout_seconds: 1800
ai_router_request_timeout_seconds: 2400
# Router minimum backoff before a retry. Named here for the same reason as
# the two above: the brain watchdog's probe deadline must OUTLIVE one backoff
# or no retry can complete inside a probe, and that assert lives in
# roles/hermes_agent while the value is consumed by roles/llm_router — two
# roles that never share a play. Consumer: llm_router_retry_after_seconds.
#
# 2, was 40 (2026-09-19 admission rule, roles/llm_router 40-routing.yml): a
# 429 is no longer retried on the same rung at all, so this is only the
# backoff before the single timeout retry the router may make, and the whole
# wait on a busy rung is bounded by llm_router_admission_budget_seconds (15).
ai_router_retry_after_seconds: 2

# The ingress's response-header timeout in front of the router — the same
# figure ansible-proxmox-apps declares as traefik_backend_response_header_timeout
# (120s). Mirrored here, not read across repos, so roles/llm_router can hold
# every local rung's first-byte bound BELOW it: a bound at or above this makes
# the caller see the ingress's 504 before the router's fallback can fire.
# Change both together.
ai_ingress_response_header_timeout_seconds: 120

# The open-source-CI router key (llm_router 56-virtual-keys.yml github-actions-oss)
# and the apps-domain path that carries it (openbao_secrets 10-domains.yml).
# On: the apps policy grants the read, the path is fetched and the key is
# minted. Set false to drop the path from the fetch and stop minting the key;
# both roles read this one switch.
llm_router_oss_ci_key_enabled: true

# Router keys whose apps bucket has no read grant in the apps policy yet; the
# paths stay out of the domain fetch (a denied read fails the whole fetch).
llm_router_recorder_key_enabled: false
llm_router_judge_key_enabled: false

# The Hermes orchestrator profile's key; the apps read policy grants its bucket.
# hermes_agent converges need it on.
llm_router_hermes_orchestrator_key_enabled: true

# The docs site's router snapshot key; the apps read policy grants its bucket.
llm_router_docs_router_snapshot_key_enabled: true

# The Home Assistant read-only token path on the hermes domain (openbao_secrets
# 10-domains-identities.yml). Off until the hermes read grant exists: a denied read fails the
# whole hermes fetch. Set true once the grant lands.
hermes_agent_homeassistant_token_bao_enabled: false

# Per-model serving concurrency ceiling. THE single numeric definition now
# lives upstream in dryvist/tofu-proxmox's
# modules/proxmox-stack/constants-serving.tf (pipeline_constants.serving.llm_concurrency)
# and is published to every host via the same tofu_data.constants channel
# every other pipeline_constants family already uses (dryvist.homelab.
# inventory_resolve, see inventory/load_tofu.yml). This value is a DERIVATION,
# not a second definition — it was previously a bare literal kept "in sync by
# convention" with nix-ai's programs.mlx.proxy.concurrencyLimit (set per-host
# in dryvist/nix-darwin's lib/hosts/mac-studio.nix serveConcurrency), which
# drifted silently by design. nix-darwin's flake evaluation is hermetic (no
# network access at build time) so it cannot derive from tofu_data the same
# way; instead its CI runs a parity check
# (.github/workflows/_llm-concurrency-parity.yml) against this repo's
# published constant and fails the build on drift. The serving tier admits
# this many in-flight requests per model and 429s the rest (the 429s are
# absorbed by llm_router's rate-limit retry policy, not this repo's concern).
# Consumer: ollama_num_parallel (roles/ollama/defaults/main.yml). Agent
# admission caps are independent of serving slots; see
# ai_agent_default_concurrency below.
# ROLLOUT WINDOW (remove the fallback once the artifact carries it). Ansible
# reads the PUBLISHED inventory artifact, not tofu-proxmox's constants.tf, and
# that artifact is only rewritten by a `tofu apply`. Older artifacts have no
# `serving` key; a bare reference therefore raises "object of type 'dict' has
# no attribute 'serving'" and fails every converge. The fallback follows the
# active eight-slot profile until the artifact is republished.
#
# The fallback is a migration shim, NOT a second definition: it is the same
# value the constant publishes, it disappears from every render the moment the
# artifact carries the key, and `assert_serving_constant_published` below
# reports which path was taken so the shim cannot go quietly permanent. Delete
# the `| default` and that assert together after the first apply that
# republishes the inventory.
ai_llm_concurrency: >-
  {{ (tofu_data.constants.serving | default({})).llm_concurrency | default(8) }}
# True only while the shim above is load-bearing. Consumed by the converge-time
# notice in roles/hermes_agent/tasks/assert.yml.
ai_llm_concurrency_from_fallback: >-
  {{ (tofu_data.constants.serving | default({})).llm_concurrency is not defined }}

# Agent runners accept work up to this shared cap. LiteLLM handles backend
# saturation and fallback, so this value does not track any serving profile.
ai_agent_default_concurrency: 8

# Resource-domain secrets fetched from OpenBao by the openbao_secrets pre-play.
# Defaults to an empty dict so every consumer's
# `bao_local_llm_secrets.X | default(lookup('env','X'), true)` resolves even
# when the fetch is skipped (BAO_ADDR unset, or the domain's role_id/secret_id
# envs unset) or the host is outside the openbao_secrets play. The pre-play
# overrides this per host when active. bao_ai_public_secrets is the same
# shape for the `ai-public` domain (see ai_default_model above): empty here
# resolves to the ai_default_model literal fallback until that domain's
# AppRole exists and secret/ai/public/brain is seeded.
bao_local_llm_secrets: {}
bao_ai_public_secrets: {}
# Same floor for the `apps` domain. It was missing while two roles already read
# it (hindsight_docker, and now llm_router's database login), so any run that
# skipped the Phase 0 fetch — BAO_ADDR unset, a --tags run that excludes it,
# molecule — raised "bao_apps_secrets is undefined" instead of falling through
# to the env fallback the consumers were written to expect. An empty dict makes
# that fallback reachable, which is the whole point of the bao-first pattern.
bao_apps_secrets: {}

# The judge rides its OWN alias, not the worker's. Two reasons, and the router
# still owns the physical backend selection behind both.
#
# 1. A judge scoring its own model's output is self-preference bias by
#    construction. It survives blind evaluation (the perplexity asymmetry is
#    intrinsic to the scorer), so "the judge cannot see the author" is not a
#    defence. `goal-judge` resolves to a model of a different generation than
#    whatever serves as the worker.
# 2. The serving tier admits one in-flight request per model, so a worker and a
#    judge on the SAME model serialize against each other — the judge queues
#    behind the very generation it was spawned to score.
#
# THE JUDGE IS UNIVERSAL AND IT IS NOT THE WORKER — no exceptions, no
# per-caller override, no "just this once" fallback to the brain. Every
# evaluation the fabric performs goes through this alias. A judge that
# sometimes resolves to the worker is worse than one that always does, because
# the bias then varies by call and nothing downstream can correct for it.
#
# It is also deliberately the SMALLER model, and that is not a cost compromise.
# The worker is the tier that should think hard; a verdict is a short,
# well-specified classification, and spending the deliberate model's minutes on
# it buys nothing while taking the slot the actual work wants. Judge cheap,
# work deep.
#
# Until 2026-07-28 this read `hermes-default`, which made the `goal-judge` alias
# dead config: it was defined, asserted, and named by nothing. Pointing here is
# what makes it real — and until 2026-08-15 the var that actually reached
# inference (hermes_agent_kanban_goal_judge_model) still bypassed it. Both now
# read this name. It is the `judge` router role now; `goal-judge` remains a
# separate registry alias for the `small` route group.
hermes_goal_judge_model: judge


# Restart the Docker stack on failure (Phase 9 systemd restart policy).
systemd_restart_policy_services:
  - docker

# Shared by the router and OpenBao prefetch play across the full inventory.
llm_router_gpu_profiles_enabled: "{{ (groups['llm_gpu_group'] | default([])) | length > 0 }}"

# OpenBao catalog for dryvist.homelab.openbao_secrets: domains, paths and seed inputs.

# Repository-specific seed inputs. Read behavior and endpoint failover are
# owned by dryvist.homelab.openbao_secrets.
openbao_secrets_kv_mount: secret
openbao_secrets_ai_api_key_mount: >-
  {{ lookup('ansible.builtin.env', 'OPENBAO_AI_API_KEY_MOUNT')
     | default(openbao_secrets_kv_mount, true) }}
openbao_secrets_ai_api_key_path_prefix: >-
  {{ lookup('ansible.builtin.env', 'OPENBAO_AI_API_KEY_PATH_PREFIX')
     | default('ai/saas', true) }}

# The read-side local-llm AppRole cannot seed the Hermes key. The runner's
# BAO_TOKEN is never used as a writer token.
openbao_secrets_hermes_writer_token: >-
  {{ lookup('env', 'HERMES_WRITE_BAO_TOKEN') | default('', true) }}
openbao_secrets_hermes_api_key_fallback: >-
  {{ lookup('env', 'HERMES_API_SERVER_KEY') | default('', true) }}
openbao_secrets_hermes_writer_max_ttl_seconds: 600
openbao_secrets_hermes_api_key_path: ai/hermes
openbao_secrets_hermes_api_key_field: HERMES_API_SERVER_KEY

# The read-side local-llm AppRole cannot seed the llm-router Redis password.
openbao_secrets_redis_writer_token: >-
  {{ lookup('env', 'LLM_ROUTER_WRITE_BAO_TOKEN') | default('', true) }}
openbao_secrets_redis_password_fallback: >-
  {{ lookup('env', 'LLM_ROUTER_REDIS_PASSWORD') | default('', true) }}
openbao_secrets_redis_writer_max_ttl_seconds: 600
openbao_secrets_redis_password_path: ai/llm-router
openbao_secrets_redis_password_field: LLM_ROUTER_REDIS_PASSWORD

# Reconcile in list order before publishing the local-llm domain.
openbao_secrets_local_llm_seed_specs:
  - label: hermes
    path: "{{ openbao_secrets_hermes_api_key_path }}"
    field: "{{ openbao_secrets_hermes_api_key_field }}"
    fallback: "{{ openbao_secrets_hermes_api_key_fallback }}"
    writer_token: "{{ openbao_secrets_hermes_writer_token }}"
    writer_policy: hermes-write
    writer_max_ttl: "{{ openbao_secrets_hermes_writer_max_ttl_seconds }}"
  - label: llm-router
    path: "{{ openbao_secrets_redis_password_path }}"
    field: "{{ openbao_secrets_redis_password_field }}"
    fallback: "{{ openbao_secrets_redis_password_fallback }}"
    writer_token: "{{ openbao_secrets_redis_writer_token }}"
    writer_policy: llm-router-write
    writer_max_ttl: "{{ openbao_secrets_redis_writer_max_ttl_seconds }}"

# Repository-owned identity-domain paths for dryvist.homelab.openbao_secrets.
# Second part of the static OpenBao domain list (see 10-domains.yml). Agent identities, then the
# local-llm and clickhouse domains. Order is preserved by the concatenation in 10-domains.yml.
_openbao_secrets_static_domains_identities:
  # Hermes' own least-privilege AppRole (policy `hermes`, exact paths — NOT
  # local-llm's ai/* grant). Every field hermes_agent reads from OpenBao lives
  # on these paths; once this domain resolves, hermes_agent_group.yml drops the
  # local-llm layer for Hermes.
  - name: hermes
    paths:
      - ai/hermes      # HERMES_VIKUNJA_API_TOKEN, HERMES_API_SERVER_KEY,
                       #   WEBHOOK_SECRET, CODEX_AUTH_JSON
      - ai/mcp/splunk  # SPLUNK_MCP_TOKEN
      - ai/mcp/zammad  # ZAMMAD_MCP_URL, ZAMMAD_MCP_TOKEN
      - mount: secrets-external
        path: ai/saas/context7
      # Home Assistant read-only token (field `token`). Off until the hermes read grant
      # exists: a denied read fails the whole hermes fetch.
      - path: ai/public/homeassistant
        optional: true
        enabled: "{{ hermes_agent_homeassistant_token_bao_enabled | default(false) | bool }}"
  # Second agent identity, same shape as `hermes` above. Deliberately NOT given
  # a fallback onto local-llm's ai/* grant: that grant can read ai/hermes, so
  # falling back would hand this agent the FIRST agent's Slack, Vikunja and
  # GitHub credentials. Absent creds resolve empty and each feature stays off
  # (see roles/hermes_agent/defaults, every integration is presence-gated).
  - name: donna
    paths:
      - ai/donna
  - name: hermes-private
    paths:
      - ai/hermes-private # private Hermes Slack/API-server/firecrawl fields
      - ai/mcp/splunk     # read-only gateway route credential, independent of local-llm
  - name: local-llm
    paths:
      - ai/llm         # the router's own master key, LLM_LARGE_BEARER_TOKEN (single seeded KV path)
      - ai/llm-router  # LLM_ROUTER_REDIS_PASSWORD — the shared spend store's
                       #   AUTH credential, read by BOTH roles/redis (templated
                       #   into requirepass) and roles/llm_router (handed to
                       #   LiteLLM). One field, so the two ends cannot drift.
                       #   Every path in a domain merges into one flat dict, so
                       #   the key resolves regardless of which path holds it;
                       #   it lives here rather than in ai/llm to keep the
                       #   router's store credential separable later.
      - ai/qdrant      # QDRANT_API_KEY
      - path: ai/mcp/qdrant  # QDRANT_MEMORY_MCP_JWT
        optional: true
      - ai/open-webui  # OPEN_WEBUI_SECRET_KEY, OPEN_WEBUI_OPENAI_API_KEY
      - ai/hermes      # HERMES_GITHUB_APP_{ID,INSTALLATION_ID,
                       #   PRIVATE_KEY}.
      # OPENROUTER_API_KEY (the free rung and the general openrouter tier) AND
      # OPENROUTER_HERMES_KEY (the hermes-cloud-openrouter paid rung only, see
      # llm-models.d/40-hermes-cloud.yml) are two fields in this ONE secret —
      # every path merges its whole field set into bao_local_llm_secrets, so
      # no second path is needed for the second field.
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/openrouter"  # OPENROUTER_API_KEY, OPENROUTER_HERMES_KEY
      # OPENCODE_API_KEY — the OpenCode Go subscription tier
      # (llm-models.d/35-opencode.yml). Optional until seeded: an absent
      # path leaves both deployments unrendered, never fails the converge
      # closed.
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/opencode"    # OPENCODE_API_KEY
        optional: true
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/gemini"      # GEMINI_API_KEY
        optional: true
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/alibaba"     # DASHSCOPE_API_KEY
        optional: true
      # OPENAI_API_KEY — the terminal paid rung of every chat ladder
      # (llm-models.d/40-hermes-cloud.yml codex-api-model). Optional
      # until seeded: an absent path leaves the rung unrendered, never fails
      # the converge closed.
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/openai"      # OPENAI_API_KEY
        optional: true
      - ai/mcp/splunk  # SPLUNK_MCP_URL, SPLUNK_MCP_TOKEN; merged into the same
                       #   bao_local_llm_secrets fact consumed by Hermes
      - ai/mcp/zammad  # ZAMMAD_MCP_URL, ZAMMAD_MCP_TOKEN; authoritative incident API pair
      - ai/mcp/vikunja # VIKUNJA_MCP_URL, VIKUNJA_MCP_TOKEN_RO/_RW; RO field
                       #   feeds agentgateway_docker's Vikunja sidecar
      # NAUTOBOT_MCP_URL, NAUTOBOT_MCP_TOKEN — read-only IPAM/DCIM token from
      # ansible-proxmox-apps' roles/nautobot, published opt-in. optional:
      # an empty token omits the sidecar and the /nautobot route.
      - mount: "{{ openbao_secrets_kv_mount }}"
        path: ai/mcp/nautobot
        optional: true
      - ai/langfuse    # LANGFUSE_{POSTGRES_PASSWORD,CLICKHOUSE_PASSWORD,REDIS_AUTH,
                       #   S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,PUBLIC_KEY,SECRET_KEY,
                       #   INIT_USER_EMAIL,INIT_USER_PASSWORD} — fully seeded 2026-07-05
      # PHOENIX_{POSTGRES_PASSWORD,ADMIN_SECRET,DEFAULT_ADMIN_INITIAL_PASSWORD,
      # INGEST_API_KEY} — optional until the Phoenix guest exists and the path is
      # operator-seeded like its ai/* siblings. Declared required before it was
      # seeded, which failed every local-llm converge on a 404 (2026-09-04).
      # A 403 still fails. TODO: drop the flag once the path is seeded.
      - mount: "{{ openbao_secrets_kv_mount }}"
        path: ai/phoenix
        optional: true
      - ai/langflow    # LANGFLOW_{SUPERUSER,SUPERUSER_PASSWORD,DB_PASSWORD}
      - ai/dify        # DIFY_SECRET_KEY — the session/credential-protection key.
                       #   PROMOTED from the running guest, never regenerated: a
                       #   fresh value cannot decrypt what the existing value
                       #   encrypted, and nothing reports an error when that
                       #   happens. Operator-seeded like its ai/* siblings.
  # The ClickHouse domain reads internal datastore credentials from secret/.
  # Its AppRole and policy are declared in the secrets-management repository.
  - name: clickhouse
    paths:
      - ai/clickhouse  # APP_PASSWORD, GRAFANA_PASSWORD, HYPERDX_PASSWORD, SPLUNK_PASSWORD
      - ai/clickhouse-ingest  # CRIBL_PASSWORD (ClickHouse ingest writer)

# Repository-owned domain and path data for dryvist.homelab.openbao_secrets.
# Domains allowed to resolve empty instead of failing the play. The contract
# default is an empty list; each entry below is a TODO to DELETE as soon as
# that domain's AppRole + policy land (see the per-domain notes further down),
# not a permanent exemption.
# A single PATH may also be declared optional, independently of its domain, by
# giving its mapping form `optional: true` (see ai-runner's vendor keys below).
# A 404 on such a path is skipped with a visible warning naming the path; a 403
# — which means the credential is wrong, not the secret absent — and every other
# error still fail. Only the mapping path form supports the flag; a bare string
# path is always required. `mount` defaults to openbao_secrets_kv_mount.
_openbao_secrets_static_optional_domains:
  - ai-public   # AppRole/policy on secret/data/ai/public/* not provisioned yet
  - ai-runner   # CIDR-bound runner AppRole not provisioned yet
  - hermes      # AppRole credentials not provisioned yet
  - hermes-private # second Hermes identity has an independent AppRole
  - donna       # second agent identity, features presence-gated off until seeded
  - clickhouse  # AppRole/policy is not provisioned yet in ansible-proxmox-apps.
                #   This domain is prefetched for clickhouse_group and remains optional.

# One entry per resource-domain identity this Ansible converge fetches for.
# Each domain's role_id/secret_id come from its own env vars — sourced from
# the operator's keychain-backed resolver on macOS, or a root-only systemd
# credential on Linux (never a shared/broad credential). Add a domain here as
# new consumer roles are wired to read bao-first; each needs a matching
# AppRole + policy in ansible-proxmox-apps' roles/openbao
# (`openbao_approles`/`openbao_policies`) — the OpenBao server config stays
# in that repo; this repo only CONSUMES the local-llm domain.
# The static domain list is its two parts concatenated, in order: the fleet and runtime domains
# below, then _openbao_secrets_static_domains_identities in 10-domains-identities.yml.
_openbao_secrets_static_domains: >-
  {{ _openbao_secrets_static_domains_fleet
     + _openbao_secrets_static_domains_identities }}
_openbao_secrets_static_domains_fleet:
  # Apps domain — non-Hermes-identity app credentials generated at source by
  # ansible-proxmox-apps' roles/openbao, next to the other app DB/auth
  # credentials this repo's Docker-in-LXC roles consume.
  - name: apps
    paths:
      - apps/hindsight  # hindsight_db_password, hindsight_cp_access_key (+ replication),
                        #   hindsight_api_key, hindsight_llm_router_key
      - apps/llm-router # llm_router_db_password — the router's login on the ai-VLAN Postgres
                        #   cluster Hindsight uses; read at both ends (postgres_ai_group.yml)
                        #   so the field cannot drift. NOT ai/llm-router (the Redis password).
      - apps/hermes-ui  # hermes_ui_workspace_password, hermes_ui_hermes_api_token,
                        #   hermes_ui_mission_control_auth_user/_auth_pass
      - apps/authelia   # authelia_oidc_{litellm,phoenix}_client_secret — the
                        #   shared OIDC client-secret path, consumed by llm_router
                        #   generic-OIDC SSO (65-oidc.yml) and phoenix_docker.
      # Per-caller router keys; contract in roles/llm_router/tasks/seed-keys.yml.
      - {path: apps/github-actions, optional: true}
      # Event-triggered agent flows use independent, local-only keys so each
      # flow has a separate revoke point and router trace identity.
      - {path: apps/github-actions-ci-fix, optional: true}
      - {path: apps/github-actions-pr-review, optional: true}
      # Fetched only once the apps side grants the read (the row plus one
      # provisioning run): a 403 is a policy gap the fail-loud gate never
      # tolerates, so the path is off until llm_router_oss_ci_key_enabled.
      - path: apps/github-actions-oss
        optional: true
        enabled: "{{ llm_router_oss_ci_key_enabled | default(false) | bool }}"
      - {path: apps/open-webui, optional: true}
      - {path: apps/langgraph, optional: true}
      - {path: apps/n8n, optional: true}
      - {path: apps/zammad, optional: true}
      - {path: apps/agentgateway, optional: true}
      - {path: apps/dify, optional: true}
      - {path: apps/llamaindex, optional: true}
      - {path: apps/langfuse, optional: true}
      # The direct-only key is used by router routes across GPU profile drains.
      - path: apps/benchmark
        optional: true
        enabled: "{{ inventory_hostname in (groups['llm_router_group'] | default([])) }}"
      # Workstation-client router keys — path names match
      # _llm_router_declared_virtual_keys' alias field exactly
      # (roles/llm_router/defaults/main/56-virtual-keys.yml).
      - {path: apps/opencode, optional: true}
      - {path: apps/raycast, optional: true}
      - {path: apps/codex, optional: true}
      - {path: apps/cursor, optional: true}
      - {path: apps/claude-code, optional: true}
      - {path: apps/litellm-local, optional: true}
      - {path: apps/litellm-local-workstation, optional: true}
      # One per Hermes operating profile, including the implicit `default`
      # profile — path names match _llm_router_hermes_profile_keys' alias
      # field exactly ('hermes-' ~ profile name, same file).
      - {path: apps/hermes-default, optional: true}
      - {path: apps/hermes-private, optional: true}
      - {path: apps/hermes-splunk-admin, optional: true}
      - {path: apps/hermes-homelab-admin, optional: true}
      - {path: apps/hermes-github-maint, optional: true}
      - {path: apps/agy, optional: true}
      - {path: apps/donna, optional: true}
      # No apps read grant yet for these three; a denied read fails the whole fetch.
      - path: apps/hermes-orchestrator
        optional: true
        enabled: "{{ llm_router_hermes_orchestrator_key_enabled | default(false) | bool }}"
      - path: apps/recorder
        optional: true
        enabled: "{{ llm_router_recorder_key_enabled | default(false) | bool }}"
      - path: apps/judge
        optional: true
        enabled: "{{ llm_router_judge_key_enabled | default(false) | bool }}"
      - {path: apps/zcode, optional: true}
      - {path: apps/qwen-code, optional: true}
      # A missing sandbox-agent router-key path is skipped like other optional apps.
      - {path: apps/sandbox-agent-router, optional: true}
      - {path: apps/lane-walk-probe, optional: true}
      # The job bucket: the router enables the zcode, opencode and qwen-code
      # keys only when the bucket's *_ROUTER_KEY field equals the key's own
      # source field (56a-target-keys.yml).
      - {path: apps/open-llm, optional: true}
      - {path: apps/prometheus, optional: true}
      - {path: apps/glance, optional: true}
      - path: apps/docs-router-snapshot
        optional: true
        enabled: "{{ llm_router_docs_router_snapshot_key_enabled | default(false) | bool }}"
  # Public (non-secret) fabric coordination data — the "non-secret coordination
  # path" precedent in tofu-proxmox's SECRETS_HIERARCHY.md (secret/platform/
  # terrakube/main). Read-only, own least-privilege AppRole (NOT local-llm's
  # broader ai/* grant): this domain's role_id/secret_id is also handed to
  # CONSUMER GUESTS (hermes_agent, open_webui — see their *_brain_sync_* vars)
  # for a runtime poll, and a guest holding a live copy of local-llm's
  # credential could pull every OTHER ai/* secret. Needs a companion AppRole +
  # read-only policy on secret/data/ai/public/* in ansible-proxmox-apps'
  # roles/openbao before this domain resolves live.
  - name: ai-public
    paths:
      - ai/public/brain  # active_model — the runtime fabric-brain override;
                          #   see inventory/group_vars/all.yml (ai_default_model)
                          #   and roles/hermes_agent + roles/open_webui brain-sync.
  # AI runner domain — the headless job-runner guests (ai_runner role, WS7A).
  # Own least-privilege AppRole, CIDR-bound to the runner guest's fixed IP (the
  # secret_id is bound to that guest's reservation). Reads only the queue token
  # + the third-party model-provider keys the runner needs — NOT local-llm's
  # broad ai/* grant. Needs a matching CIDR-bound AppRole + read-only policy on
  # these paths in ansible-proxmox-apps' roles/openbao (openbao_approles/
  # openbao_policies) before it resolves live; until then it no-ops (role_id/
  # secret_id envs unset) and the role falls back to env secrets.
  - name: ai-runner
    paths:
      - ai/vikunja          # VIKUNJA_API_TOKEN — the dispatch-queue credential
      # optional: these two vendor keys are seeded only when the paid-provider
      # feature is enabled, so the path legitimately does not exist yet. A 404
      # is skipped with a visible warning; a 403 or any other error still
      # fails. Verified 404 against the live store 2026-09-02.
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/anthropic"  # ANTHROPIC_API_KEY
        optional: true
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/openai"     # OPENAI_API_KEY
        optional: true

# Domains an OPERATOR_VAULT_ROLE_ID / _SECRET_ID pair may serve when the
# domain's own pair is unset: the operator identity's policies cover these.
openbao_secrets_operator_domains:
  - apps
  - local-llm
  - media
  - monitoring
  - local-cloud
  - observability

# Each roster identity gets its own AppRole domain; the shared role derives its
# OPENBAO_APPROLE_<NAME>_ROLE_ID/_SECRET_ID variables from the domain name.
# The agentgateway-agent-keys reader domain covers every gateway caller
# (`ai_callers`: roster agents plus released-registry harnesses), one optional
# apps/<caller>-gw leaf each. The gateway role still asserts roster keys before
# it deploys, while agent roles can keep their direct path until a key is seeded.
openbao_secrets_optional_domains: >-
  {%- set optional_domains = _openbao_secrets_static_optional_domains.copy() -%}
  {%- if ai_agents | default({}) -%}
    {%- set _ = optional_domains.append('llm-router-agent-keys') -%}
  {%- endif -%}
  {%- if ai_callers | default({}) -%}
    {%- set _ = optional_domains.append('agentgateway-agent-keys') -%}
  {%- endif -%}
  {{ optional_domains }}

# Remove owned MCP paths from static legacy domains before adding roster domains.
openbao_secrets_domains: >-
  {%- set owners = ai_agent_owner | default({}) -%}
  {%- set domains = [] -%}
  {%- for domain in _openbao_secrets_static_domains -%}
    {%- set paths = [] -%}
    {%- for path in domain.paths -%}
      {%- set kv_path = path.path if path is mapping else path -%}
      {%- if not (kv_path.startswith('ai/mcp/') and kv_path[7:] in owners) -%}
        {%- set _ = paths.append(path) -%}
      {%- endif -%}
    {%- endfor -%}
    {%- set legacy_domain = domain.copy() -%}
    {%- set _ = legacy_domain.update({'paths': paths}) -%}
    {%- set _ = domains.append(legacy_domain) -%}
  {%- endfor -%}
  {%- set agents = ai_agents | default({}) -%}
  {%- set router_paths = [] -%}
  {%- set gateway_paths = [] -%}
  {%- for agent_name, agent in agents.items() -%}
    {%- set paths = ['ai/' ~ agent_name, 'apps/' ~ agent_name] -%}
    {%- set _ = paths.append({'path': 'apps/' ~ agent_name ~ '-gw', 'optional': true}) -%}
    {%- set _ = router_paths.append('apps/' ~ agent_name) -%}
    {%- for slug in agent.owns | default([]) -%}
      {%- set _ = paths.append('ai/mcp/' ~ slug) -%}
    {%- endfor -%}
    {%- set _ = domains.append({'name': agent_name, 'paths': paths, 'required': true}) -%}
  {%- endfor -%}
  {%- for caller_name in ai_callers | default({}) -%}
    {#- A registry caller's leaf may not be seeded yet: a 404 leaves it keyless, so it gets no bank. -#}
    {%- set leaf = 'apps/' ~ caller_name ~ '-gw' -%}
    {%- set _ = gateway_paths.append({'path': leaf, 'optional': true}) -%}
  {%- endfor -%}
  {%- if agents -%}
    {%- set _ = domains.append({'name': 'llm-router-agent-keys', 'paths': router_paths}) -%}
  {%- endif -%}
  {%- if gateway_paths -%}
    {%- set _ = domains.append({'name': 'agentgateway-agent-keys', 'paths': gateway_paths}) -%}
  {%- endif -%}
  {{ domains }}
