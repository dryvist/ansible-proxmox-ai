---
# Repository-owned domain and path data for dryvist.homelab.openbao_secrets.
# Domains allowed to resolve empty instead of failing the play. The contract
# default is an empty list; each entry below is a TODO to DELETE as soon as
# that domain's AppRole + policy land (see the per-domain notes further down),
# not a permanent exemption.
# A single PATH may also be declared optional, independently of its domain, by
# giving its mapping form `optional: true` (see ai-runner's vendor keys below).
# A 404 on such a path is skipped with a visible warning naming the path; a 403
# — which means the credential is wrong, not the secret absent — and every other
# error still fail. Only the mapping path form supports the flag; a bare string
# path is always required. `mount` defaults to openbao_secrets_kv_mount.
_openbao_secrets_static_optional_domains:
  - ai-public   # AppRole/policy on secret/data/ai/public/* not provisioned yet
  - ai-runner   # CIDR-bound runner AppRole not provisioned yet
  - hermes      # AppRole credentials not provisioned yet
  - hermes-private # second Hermes identity has an independent AppRole
  - donna       # second agent identity, features presence-gated off until seeded
  - clickhouse  # AppRole/policy is not provisioned yet in ansible-proxmox-apps.
                #   This domain is prefetched for clickhouse_group and remains optional.

# One entry per resource-domain identity this Ansible converge fetches for.
# Each domain's role_id/secret_id come from its own env vars — sourced from
# the operator's keychain-backed resolver on macOS, or a root-only systemd
# credential on Linux (never a shared/broad credential). Add a domain here as
# new consumer roles are wired to read bao-first; each needs a matching
# AppRole + policy in ansible-proxmox-apps' roles/openbao
# (`openbao_approles`/`openbao_policies`) — the OpenBao server config stays
# in that repo; this repo only CONSUMES the local-llm domain.
# The static domain list is its two parts concatenated, in order: the fleet and runtime domains
# below, then _openbao_secrets_static_domains_identities in 10-domains-identities.yml.
_openbao_secrets_static_domains: >-
  {{ _openbao_secrets_static_domains_fleet
     + _openbao_secrets_static_domains_identities }}
_openbao_secrets_static_domains_fleet:
  # Apps domain — non-Hermes-identity app credentials generated at source by
  # ansible-proxmox-apps' roles/openbao, next to the other app DB/auth
  # credentials this repo's Docker-in-LXC roles consume.
  - name: apps
    paths:
      - apps/hindsight  # hindsight_db_password, hindsight_cp_access_key (+ replication),
                        #   hindsight_api_key, hindsight_llm_router_key
      - apps/llm-router # llm_router_db_password — the router's login on the ai-VLAN Postgres
                        #   cluster Hindsight uses; read at both ends (postgres_ai_group.yml)
                        #   so the field cannot drift. NOT ai/llm-router (the Redis password).
      - apps/hermes-ui  # hermes_ui_workspace_password, hermes_ui_hermes_api_token,
                        #   hermes_ui_mission_control_auth_user/_auth_pass
      - apps/authelia   # authelia_oidc_{litellm,phoenix}_client_secret — the
                        #   shared OIDC client-secret path, consumed by llm_router
                        #   generic-OIDC SSO (65-oidc.yml) and phoenix_docker.
      # Per-caller router keys; contract in roles/llm_router/tasks/seed-keys.yml.
      - {path: apps/github-actions, optional: true}
      # Event-triggered agent flows use independent, local-only keys so each
      # flow has a separate revoke point and router trace identity.
      - {path: apps/github-actions-ci-fix, optional: true}
      - {path: apps/github-actions-pr-review, optional: true}
      # Fetched only once the apps side grants the read (the row plus one
      # provisioning run): a 403 is a policy gap the fail-loud gate never
      # tolerates, so the path is off until llm_router_oss_ci_key_enabled.
      - path: apps/github-actions-oss
        optional: true
        enabled: "{{ llm_router_oss_ci_key_enabled | default(false) | bool }}"
      - {path: apps/open-webui, optional: true}
      - {path: apps/langgraph, optional: true}
      - {path: apps/n8n, optional: true}
      - {path: apps/zammad, optional: true}
      - {path: apps/agentgateway, optional: true}
      - {path: apps/dify, optional: true}
      - {path: apps/llamaindex, optional: true}
      - {path: apps/langfuse, optional: true}
      # The direct-only key is used by router routes across GPU profile drains.
      - path: apps/benchmark
        optional: true
        enabled: "{{ inventory_hostname in (groups['llm_router_group'] | default([])) }}"
      # Workstation-client router keys — path names match
      # _llm_router_declared_virtual_keys' alias field exactly
      # (roles/llm_router/defaults/main/56-virtual-keys.yml).
      - {path: apps/opencode, optional: true}
      - {path: apps/raycast, optional: true}
      - {path: apps/codex, optional: true}
      - {path: apps/cursor, optional: true}
      - {path: apps/claude-code, optional: true}
      - {path: apps/litellm-local, optional: true}
      - {path: apps/litellm-local-workstation, optional: true}
      # One per Hermes operating profile, including the implicit `default`
      # profile — path names match _llm_router_hermes_profile_keys' alias
      # field exactly ('hermes-' ~ profile name, same file).
      - {path: apps/hermes-default, optional: true}
      - {path: apps/hermes-private, optional: true}
      - {path: apps/hermes-splunk-admin, optional: true}
      - {path: apps/hermes-homelab-admin, optional: true}
      - {path: apps/hermes-github-maint, optional: true}
      - {path: apps/agy, optional: true}
      - {path: apps/donna, optional: true}
      # No apps read grant yet for these four; a denied read fails the whole fetch.
      - path: apps/hermes-orchestrator
        optional: true
        enabled: "{{ llm_router_hermes_orchestrator_key_enabled | default(false) | bool }}"
      - path: apps/recorder
        optional: true
        enabled: "{{ llm_router_recorder_key_enabled | default(false) | bool }}"
      - path: apps/judge
        optional: true
        enabled: "{{ llm_router_judge_key_enabled | default(false) | bool }}"
      - path: apps/hermes-eval
        optional: true
        enabled: "{{ llm_router_hermes_eval_key_enabled | default(false) | bool }}"
      - {path: apps/zcode, optional: true}
      - {path: apps/qwen-code, optional: true}
      # A missing sandbox-agent router-key path is skipped like other optional apps.
      - {path: apps/sandbox-agent-router, optional: true}
      - {path: apps/lane-walk-probe, optional: true}
      # The job bucket: the router enables the zcode, opencode and qwen-code
      # keys only when the bucket's *_ROUTER_KEY field equals the key's own
      # source field (56a-target-keys.yml).
      - {path: apps/open-llm, optional: true}
      - {path: apps/prometheus, optional: true}
      - {path: apps/glance, optional: true}
      - path: apps/docs-router-snapshot
        optional: true
        enabled: "{{ llm_router_docs_router_snapshot_key_enabled | default(false) | bool }}"
  # Public (non-secret) fabric coordination data — the "non-secret coordination
  # path" precedent in tofu-proxmox's SECRETS_HIERARCHY.md (secret/platform/
  # terrakube/main). Read-only, own least-privilege AppRole (NOT local-llm's
  # broader ai/* grant): this domain's role_id/secret_id is also handed to
  # CONSUMER GUESTS (hermes_agent, open_webui — see their *_brain_sync_* vars)
  # for a runtime poll, and a guest holding a live copy of local-llm's
  # credential could pull every OTHER ai/* secret. Needs a companion AppRole +
  # read-only policy on secret/data/ai/public/* in ansible-proxmox-apps'
  # roles/openbao before this domain resolves live.
  - name: ai-public
    paths:
      - ai/public/brain  # active_model — the runtime fabric-brain override;
                          #   see inventory/group_vars/all/ (ai_default_model)
                          #   and roles/hermes_agent + roles/open_webui brain-sync.
  # AI runner domain — the headless job-runner guests (ai_runner role, WS7A).
  # Own least-privilege AppRole, CIDR-bound to the runner guest's fixed IP (the
  # secret_id is bound to that guest's reservation). Reads only the queue token
  # + the third-party model-provider keys the runner needs — NOT local-llm's
  # broad ai/* grant. Needs a matching CIDR-bound AppRole + read-only policy on
  # these paths in ansible-proxmox-apps' roles/openbao (openbao_approles/
  # openbao_policies) before it resolves live; until then it no-ops (role_id/
  # secret_id envs unset) and the role falls back to env secrets.
  - name: ai-runner
    paths:
      - ai/vikunja          # VIKUNJA_API_TOKEN — the dispatch-queue credential
      # optional: these two vendor keys are seeded only when the paid-provider
      # feature is enabled, so the path legitimately does not exist yet. A 404
      # is skipped with a visible warning; a 403 or any other error still
      # fails. Verified 404 against the live store 2026-09-02.
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/anthropic"  # ANTHROPIC_API_KEY
        optional: true
      - mount: "{{ openbao_secrets_ai_api_key_mount }}"
        path: "{{ openbao_secrets_ai_api_key_path_prefix }}/openai"     # OPENAI_API_KEY
        optional: true

# Domains an OPERATOR_VAULT_ROLE_ID / _SECRET_ID pair may serve when the
# domain's own pair is unset: the operator identity's policies cover these.
openbao_secrets_operator_domains:
  - apps
  - local-llm
  - media
  - monitoring
  - local-cloud
  - observability
