---
# Accelerator lane labels, declared once. The router's fast lane reads the
# secondary label (roles/llm_router/defaults/main/10-network.yml). Each GPU guest
# reads its own label from llm_gpu_accelerator; the router reads that per member
# (roles/llm_router/defaults/main/21-gpu-profiles.yml).
llm_gpu_accelerator_primary: gpu-primary
llm_gpu_accelerator_secondary: gpu-secondary
llm_gpu_accelerator: "{{ llm_gpu_accelerator_primary }}"
