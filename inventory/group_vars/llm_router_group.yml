---
# LLM router fleet config (llm_router_group).
#
# llm-fast GPU serving is FROZEN (four host hard-locks under large GPU loads;
# see roles/llama_cpp defaults + host_vars/llm-fast.yml). Routers must not
# carry its deployments meanwhile — the firewall DROPs traffic to the dead
# backend and a shuffled request hangs the whole client timeout. The light
# tier serves from llm-light (CPU on the DR node, pinned awake) only.
# Flip to true together with the llm-fast unfreeze.
llm_router_llm_fast_enabled: false

# Ship the LiteLLM router logs to the homelab_llm AI ingest listener
# (-> Cribl Stream ai_stamp -> Splunk index=llm) instead of the linux/os
# catch-all. $programname 'litellm' verified locally via
# `journalctl -o verbose -u litellm | grep _COMM`. Port from tofu constants
# ai_log_routing; guarded default = homelab_llm's assigned port for
# inventories that predate the map.
syslog_forwarder_program_routes:
  - program: litellm
    port: "{{ tofu_data.constants.ai_log_routing.homelab_llm.port | default(10323) }}"

# Shared spend store, and the OpenRouter ceiling it makes real. These two are
# set TOGETHER and must stay that way: LiteLLM counts provider spend in Redis,
# and this group is a multi-member pool converged serial: 1, so a budget without
# a shared store would advertise a ceiling that is really N times its stated
# value and reset on every rolling converge. That configuration shipped once and
# was backed out for exactly that reason;
# roles/llm_router/tasks/assert-budget-backing.yml now fails the build rather
# than let the pair separate again.
#
# The role itself defaults to neither, so a deployment without a store converges
# honestly with no budget rather than an unenforceable one.
#
# FQDN, never an address — the store moves with its reservation.
#
# The FQDN is READ FROM THE GUEST, not spelled out here. This was previously
# built as the literal ('llm-redis.' ~ ai_subdomain), which assumed the guest's
# name matched the tag and assumed it sat under the management subdomain.
# Neither holds: the guest carrying the tag is numbered, and the inventory
# contract publishes it under the estate domain, so the literal named a host
# that does not resolve and the ceiling could never reach its store. Taking the
# name from the same inventory entry that decides the store exists at all keeps
# the two from disagreeing again — the guest can be renamed or renumbered and
# this follows it.
#
# container_ip rather than ansible_host: the contract puts the guest's own
# FQDN there for DHCP-first guests whether or not the guest is on the direct-
# ssh path, while ansible_host is the NODE's FQDN for anything still going
# through pct-exec.
#
# [0] because this is a single-instance store by design — see roles/redis
# defaults on why a second consumer gets its own guest rather than a second
# logical DB in this one.
#
# Both derive from ONE condition — whether a guest carrying that tag is
# actually in the inventory — rather than being two literals a comment asks a
# future reader to keep in step. Written as literals, the pair is only as good
# as the discipline of whoever edits next: setting the budget here before the
# guest exists renders a ceiling against a host that is not serving, which is
# the unbacked-ceiling defect this whole change exists to prevent, reintroduced
# by the change meant to fix it. Derived, the ceiling arms itself the moment the
# store joins the inventory and is honestly absent before then, so no converge
# ever advertises a limit that does not hold and no follow-up edit can be
# forgotten. assert-budget-backing.yml stays as the backstop for anyone who
# sets these by hand somewhere else (host_vars, extra vars).
_llm_router_spend_store_present: >-
  {{ (groups['llm_redis_group'] | default([])) | length > 0 }}
llm_router_redis_host: >-
  {{ hostvars[(groups['llm_redis_group'] | default([]))[0]].container_ip
     if (_llm_router_spend_store_present | bool) else '' }}

# PERIOD IS WEEKLY, and the limit is deliberately NOT the daily one multiplied
# by the period. Egress here is bursty rather than level: only a small minority
# of days ever reach the ceiling, and the rest finish under it. A daily bucket
# discards the unused majority and then refuses requests on exactly the days
# that needed the headroom, which is the behaviour this replaces.
#
# The pair below is chosen so the change improves BOTH quantities the daily
# bucket traded against each other, rather than buying one with the other:
#   - a burst day may now draw several times what a single day could before, on
#     the days that were being refused;
#   - the worst-case spend per week FALLS well below seven times the old daily
#     ceiling, so the outer exposure is tightened, not multiplied.
# Multiplying the daily figure by seven would have held worst-case flat while
# letting realised spend rise toward it, which is a larger change than the
# redistribution this is meant to be.
#
# WHAT IS TRADED AWAY, because this is a real regression and not a free win:
# the window is a tumbling one anchored at its first spend, not calendar
# aligned (litellm/router_strategy/budget_limiter.py), and nothing here bounds
# how fast it drains. A single caller can exhaust the window in minutes, and
# the ceiling then holds until it rolls — longer than the previous period. The
# per-deployment rate ceilings in
# roles/llm_router/defaults/main/30-openrouter.yml bound the RATE of
# accumulation and are the only lever over drain speed; lower them if that
# recovery latency is unacceptable.
#
# Groups carrying a local survivor degrade to local serving when the ceiling
# binds. The enumerated egress tier has no survivor and refuses instead, so
# the longer recovery window is felt there.
llm_router_openrouter_budget_limit: "{{ 14.0 if (_llm_router_spend_store_present | bool) else 0 }}"
llm_router_openrouter_budget_period: 7d

# Postgres for the Adaptive Router's learned quality estimates (see the role's
# defaults/main/45-database.yml). Self-arming on the published inventory, the
# same shape as the spend store above: absent guest -> empty host -> no
# DATABASE_URL and no general_settings database block, rather than a connection
# string pointing at nothing.
#
# Named EXPLICITLY, not derived from a group the way the Redis host is. The
# cluster is a primary plus a hot standby, and a standby accepts no writes, so
# taking element [0] of a member group would connect to whichever host the
# inventory happened to order first and fail on the first write roughly half the
# time. The write target is a specific host, so it is named as one. That means a
# standby promotion needs an edit here — the same tradeoff hindsight_docker
# already carries, and tracked as its own task.
#
# `.ip` is ALREADY the resolvable FQDN for a dhcp guest in the published
# inventory (never a literal address), so no name is assembled by hand.
llm_router_db_host: >-
  {{ (tofu_data.containers | default({})).get('postgres-ai-1', {}).get('ip', '') }}

# Large-tier passthrough OFF: the "*" deployment matches every model name the
# router does not carry an exact entry for and forwards it to the serving gate,
# which answers 404. Its purpose was that adding a model to the fleet needs no
# router edit — but the gate advertises only models the registry already renders
# exact entries for, so the wildcard currently matches nothing legitimate.
#
# What it does match is client typos and models from other providers' defaults.
# Measured 2026-09-02 in the router log: gpt-5-nano, gpt-5-nano-2025-08-07 and
# openai/container each produced a "Fallback attempt failed ... no router for
# requested model" against llama-swap. The wildcard makes an unknown name look
# resolvable, so LiteLLM accepts it and spends a fallback round-trip per rung on
# the gate instead of returning model-not-found immediately.
#
# Turn back on only alongside a serving host that advertises models the registry
# does not, and expect unknown names to cost gate round-trips again.
llm_router_large_passthrough_enabled: false

# SSO admin identity for the LiteLLM UI (PROXY_ADMIN_ID under generic OIDC):
# the SAME expression the APPS authelia role uses for authelia_admin_email,
# so the Authelia email claim and LiteLLM's admin cannot drift apart. Mandatory,
# fail-loud (mirrors the llm_router_master_key/ai_subdomain pattern) rather than
# a literal fallback: this is only rendered once OIDC is actually enabled (see
# the `{% if llm_router_oidc_enabled %}` gate in litellm.env.j2), so a missing
# DEFAULT_USERNAME never breaks a converge with SSO off.
llm_router_oidc_admin_email: >-
  {{ (lookup('env', 'DEFAULT_USERNAME')
      or undef('DEFAULT_USERNAME must be set for the LiteLLM OIDC admin identity'))
  }}@{{ tofu_data.domain }}
