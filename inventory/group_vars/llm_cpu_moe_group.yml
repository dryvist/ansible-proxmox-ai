---
# Qwen3.6-35B-A3B MoE on pve-r540 (llm-moe-{50,51}). Tag llm-cpu-moe.

llama_cpp_gpu_backend: cpu
llama_cpp_registry_tier: cpu-moe
llama_cpp_max_param_billions: 40
llama_cpp_parallel: 1
llama_cpp_ctx_size: 8192

llama_cpp_models:
  - name: qwen3.6-35b-a3b
    aliases: []
    hf_repo: bartowski/Qwen_Qwen3.6-35B-A3B-GGUF
    gguf: Qwen_Qwen3.6-35B-A3B-Q4_K_M.gguf
    param_billions: 35
    ctx_size: 8192
    embeddings: false

systemd_restart_policy_services:
  - llama-swap

syslog_forwarder_program_routes:
  - program: llama-swap
    port: "{{ tofu_data.constants.ai_log_routing.homelab_llm.port | default(10323) }}"
