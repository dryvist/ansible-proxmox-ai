---
# MoE tier deltas only. Shared CPU/syslog/restart: llm_cpu_pool_group.

llama_cpp_registry_tier: cpu-moe
llama_cpp_max_param_billions: 40

_llama_cpp_cpu_moe_model_id: qwen3.6-35b-a3b

# See llm_cpu_9b_group.yml's identical treatment: hf_repo/gguf below come
# from the shared catalog by this name.
llama_cpp_catalog_lookup_names:
  - "{{ _llama_cpp_cpu_moe_model_id }}"

_llama_cpp_cpu_moe_catalog: >-
  {{ llm_model_catalog_models | selectattr('name', 'equalto', _llama_cpp_cpu_moe_model_id) | first }}

llama_cpp_models:
  - name: "{{ _llama_cpp_cpu_moe_model_id }}"
    aliases: []
    hf_repo: "{{ _llama_cpp_cpu_moe_catalog.hf_repo }}"
    gguf: "{{ _llama_cpp_cpu_moe_catalog.gguf }}"
    param_billions: 35
    ctx_size: 8192
    embeddings: false
