---
# 9B tier deltas only. Shared CPU/syslog/restart: llm_cpu_pool_group.

llama_cpp_registry_tier: cpu-9b

_llama_cpp_cpu_9b_model_id: qwen3.5-9b

# hf_repo/gguf below come from the shared catalog by this name — see
# roles/llama_cpp/defaults/main/00-core.yml for the full reasoning and
# roles/llama_cpp/tasks/guards.yml for the membership assert.
llama_cpp_catalog_lookup_names:
  - "{{ _llama_cpp_cpu_9b_model_id }}"

_llama_cpp_cpu_9b_catalog: >-
  {{ llm_model_catalog_models | selectattr('name', 'equalto', _llama_cpp_cpu_9b_model_id) | first }}

llama_cpp_models:
  - name: "{{ _llama_cpp_cpu_9b_model_id }}"
    aliases: []
    hf_repo: "{{ _llama_cpp_cpu_9b_catalog.hf_repo }}"
    gguf: "{{ _llama_cpp_cpu_9b_catalog.gguf }}"
    param_billions: 9
    ctx_size: 8192
    embeddings: false
