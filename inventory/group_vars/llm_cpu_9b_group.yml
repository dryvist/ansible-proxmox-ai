---
# Qwen3.5-9B on pve-r540 (llm-9b-{50,51}). Tag llm-cpu-9b.

llama_cpp_gpu_backend: cpu
llama_cpp_registry_tier: cpu-9b
llama_cpp_parallel: 1
llama_cpp_ctx_size: 8192

llama_cpp_models:
  - name: qwen3.5-9b
    aliases: []
    hf_repo: unsloth/Qwen3.5-9B-GGUF
    gguf: Qwen3.5-9B-Q4_K_M.gguf
    param_billions: 9
    ctx_size: 8192
    embeddings: false

systemd_restart_policy_services:
  - llama-swap

syslog_forwarder_program_routes:
  - program: llama-swap
    port: "{{ tofu_data.constants.ai_log_routing.homelab_llm.port | default(10323) }}"
