---
# Hindsight agent-memory LXCs (tag `hindsight` → hindsight_group). Two
# stateless API replicas behind the Traefik pool at hindsight.<domain>;
# role defaults live in roles/hindsight_docker/defaults; deployment inputs
# and group-level reliability wiring live here.

# Hindsight 1.1.0 configuration (accessed 2026-11-06):
# https://hindsight.vectorize.io/1.1/developer/configuration
# Auto-consolidation follows retain/delete/update; reconciliation recovers
# unconsolidated facts without a consolidation in progress. A six-hour sweep
# bounds recovery scans; it does not delay event-triggered consolidation.
# Zero reserved slots (role default) keeps consolidation in the shared pool.
hindsight_docker_enable_auto_consolidation: true
hindsight_docker_consolidation_reconcile_interval_seconds: 21600

# Restart the Docker engine on failure (systemd restart policy); the
# hindsight container itself carries restart: unless-stopped in compose.
systemd_restart_policy_services:
  - docker
