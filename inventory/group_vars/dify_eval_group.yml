---
# Evaluation instance (dify_eval_group, tag dify-eval): nothing resolves to production. Environment-backed
# credentials read DIFY_EVAL_* names; the model router key comes only from apps/dify/eval.
# The database and component secrets are optional seed inputs; the stored value
# wins, then the shared seeder generates one when neither source has a value.
dify_docker_openbao_path: ai/eval/specialist-platform/dify
dify_docker_eval_router_key_path: apps/dify/eval
# The compose file's model endpoint; the same router URL the production Dify group uses.
ai_orchestration_ollama_base_url: "https://llm.{{ ai_subdomain }}/v1"
dify_docker_secret_key: ""
dify_docker_db_password: "{{ lookup('env', 'DIFY_EVAL_DB_PASSWORD') }}"
dify_docker_redis_password: "{{ lookup('env', 'DIFY_EVAL_REDIS_PASSWORD') }}"
dify_docker_sandbox_api_key: "{{ lookup('env', 'DIFY_EVAL_SANDBOX_API_KEY') }}"
dify_docker_weaviate_api_key: "{{ lookup('env', 'DIFY_EVAL_WEAVIATE_API_KEY') }}"
dify_docker_plugin_daemon_key: "{{ lookup('env', 'DIFY_EVAL_PLUGIN_DAEMON_KEY') }}"
dify_docker_inner_api_key: "{{ lookup('env', 'DIFY_EVAL_INNER_API_KEY') }}"
dify_docker_admin_email: >-
  {{ lookup('env', 'DIFY_EVAL_ADMIN_EMAIL')
     or undef('DIFY_EVAL_ADMIN_EMAIL must be set for the evaluation instance') }}
dify_docker_admin_password: "{{ lookup('env', 'DIFY_EVAL_ADMIN_PASSWORD') }}"
dify_docker_model_api_key: >-
  {{ (dify_docker_seeded_model_api_key | default('', true) | string | trim)
     or ((bao_apps_secrets | default({}, true)).get('dify_eval_llm_router_key', '') | string | trim)
     or undef('bao_apps_secrets.dify_eval_llm_router_key is required '
              ~ 'from apps/dify/eval (seeded by dify_docker or fetched with the apps domain)') }}

# Console API base for the setup-state probe and the setup/login calls — the
# same per-host pattern as the production Dify group: nginx publishes the web
# port on the guest, so the host is the container's IP address from the
# published tofu inventory and the port is the web port already derived from
# the tofu constants. Evaluation hosts are not dify_group members, so this
# group must set it here too.
dify_docker_console_api_base: "http://{{ container_ip }}:{{ dify_docker_web_port }}/console/api"
