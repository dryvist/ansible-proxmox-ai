---
# Evaluation instance (dify_eval_group, tag dify-eval): nothing resolves to production. The unprefixed DIFY_*
# env names are production, so each credential reads a DIFY_EVAL_* name instead.
# The database and component secrets are optional seed inputs; the stored value
# wins, then the shared seeder generates one when neither source has a value.
dify_docker_openbao_path: ai/eval/specialist-platform/dify
dify_docker_secret_key: ""
dify_docker_db_password: "{{ lookup('env', 'DIFY_EVAL_DB_PASSWORD') }}"
dify_docker_redis_password: "{{ lookup('env', 'DIFY_EVAL_REDIS_PASSWORD') }}"
dify_docker_sandbox_api_key: "{{ lookup('env', 'DIFY_EVAL_SANDBOX_API_KEY') }}"
dify_docker_weaviate_api_key: "{{ lookup('env', 'DIFY_EVAL_WEAVIATE_API_KEY') }}"
dify_docker_plugin_daemon_key: "{{ lookup('env', 'DIFY_EVAL_PLUGIN_DAEMON_KEY') }}"
dify_docker_inner_api_key: "{{ lookup('env', 'DIFY_EVAL_INNER_API_KEY') }}"
dify_docker_admin_email: >-
  {{ lookup('env', 'DIFY_EVAL_ADMIN_EMAIL')
     or undef('DIFY_EVAL_ADMIN_EMAIL must be set for the evaluation instance') }}
dify_docker_admin_password: "{{ lookup('env', 'DIFY_EVAL_ADMIN_PASSWORD') }}"
# Overrides the role default, which reads the production router key from bao_apps_secrets.
dify_docker_model_api_key: >-
  {{ lookup('env', 'DIFY_EVAL_MODEL_API_KEY')
     or undef('DIFY_EVAL_MODEL_API_KEY must be a router key minted for the evaluation instance') }}
