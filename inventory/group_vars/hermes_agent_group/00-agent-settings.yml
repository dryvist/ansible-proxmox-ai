---
# Restart-on-failure for the Hermes gateway daemon, applied DRY by the shared
# systemd_restart_policy role (site.yml Phase 9) rather than hardcoded in the unit.
systemd_restart_policy_services:
  - hermes-gateway

# --- Per-agent OpenBao view ---------------------------------------------------
# This group serves EVERY agent identity (hermes_agent_id, defaulted in the role
# and overridden per guest in host_vars), so a credential read here must resolve
# against the reading agent's own secrets, not a hardcoded one.
#
# `hermes_agent_bao` is that view: the identity's OWN least-privilege domain
# (one AppRole per agent). A second agent must never inherit the broad
# local-llm ai/* grant: it can read ai/hermes, so a blanket fallback would hand
# the new agent the first agent's Slack, Vikunja and GitHub credentials.
#
# The `hermes` identity keeps the local-llm layer underneath only while its own
# `hermes` domain was not fetched this run. Once that domain resolves, Hermes
# reads nothing from local-llm. Both layers are empty when OpenBao is skipped,
# so every consumer below falls through to its env fallback.
hermes_agent_bao_local_llm_layer: >-
  {{ 'hermes' not in (openbao_secrets_by_domain | default({})) }}
hermes_agent_bao: >-
  {{ (bao_local_llm_secrets
      if (hermes_agent_id == 'hermes' and (hermes_agent_bao_local_llm_layer | bool))
      else {})
     | combine((openbao_secrets_by_domain | default({})).get(hermes_agent_id, {})) }}

# Shared MCP client fields (secret/ai/mcp/*, Context7). Hermes reads them through
# its own view; every other identity keeps the local-llm read.
hermes_agent_mcp_bao: >-
  {{ hermes_agent_bao if hermes_agent_id in ['hermes', 'hermes-private']
     else bao_local_llm_secrets }}

# Slack credentials live on each agent's own secret/ai/<identity> path. Env
# values remain a local/bootstrap override, with separate names per instance.
# The original hermes and donna domains keep their unprefixed stored field.
hermes_agent_slack_bot_token: >-
  {{ hermes_agent_bao['SLACK_' ~ hermes_agent_env_prefix ~ '_BOT_TOKEN']
     | default(hermes_agent_bao.SLACK_BOT_TOKEN
               if hermes_agent_id in ['hermes', 'donna'] else '', true)
     | default(lookup('env', 'SLACK_' ~ hermes_agent_env_prefix ~ '_BOT_TOKEN'), true) }}
hermes_agent_slack_app_token: >-
  {{ hermes_agent_bao['SLACK_' ~ hermes_agent_env_prefix ~ '_APP_TOKEN']
     | default(lookup('env', 'SLACK_' ~ hermes_agent_env_prefix ~ '_APP_TOKEN'), true) }}

# An absent secondary-agent bot token stays empty and leaves Slack disabled;
# other agents retain their existing token behavior.

# Field names: the ones carrying an agent prefix derive it from the identity, so
# `hermes` reads exactly the field it reads today. Unprefixed fields stay bare —
# the KV path (ai/<id>) already scopes them, and repeating the identity inside a
# path that names it would be redundant.

# Shared Splunk MCP client token (read/search access). Bao-first
# (secret/ai/mcp/splunk), env fallback — empty until the creds are
# seeded. The URL is the shared agentgateway /splunk route (non-secret, built
# from PROXMOX_SUBDOMAIN in the role defaults), same posture as context7/qdrant,
# so only the token is sourced here.
hermes_agent_splunk_mcp_token: >-
  {{ hermes_agent_mcp_bao.SPLUNK_MCP_TOKEN
     | default(lookup('env', 'SPLUNK_MCP_TOKEN'), true) }}

# Context7 MCP key (current library docs on demand). Bao-first, env fallback.
hermes_agent_context7_api_key: >-
  {{ hermes_agent_mcp_bao.CONTEXT7_API_KEY
     | default(lookup('env', 'CONTEXT7_API_KEY'), true) }}

# Self-hosted Firecrawl key, read from the identity's OWN domain
# (secret/ai/<id>) so Donna resolves it without the local-llm grant she is
# deliberately denied — that grant can read ai/hermes, which is the whole
# reason she does not have it.
#
# INTERNAL mount, not secrets-external: the service runs on the ai VLAN and is
# not internet-reachable. The value is a placeholder the service does not
# verify (it runs with USE_DB_AUTHENTICATION=false); firecrawl-py simply
# refuses an empty key. Access control is the firewall, which admits only the
# Hermes container IDs — so treat this as a required non-empty string, not as
# the thing keeping anyone out.
hermes_agent_firecrawl_api_key: >-
  {{ hermes_agent_bao.FIRECRAWL_API_KEY
     | default(lookup('env', (hermes_agent_env_prefix ~ '_FIRECRAWL_API_KEY')
                             if hermes_agent_id == 'hermes-private'
                             else 'FIRECRAWL_API_KEY'), true) }}

# Inbound webhook receiver global HMAC secret. Bao-first (the identity's own
# domain, secret/ai/<id>, generated-if-absent at the least-shared tier — one
# agent is its only consumer), env fallback. Global fallback for every route
# that doesn't set its own secret; empty disables the webhook platform (see
# defaults). Per-agent by construction: two gateways sharing one HMAC secret
# would let either verify the other's inbound payloads.
hermes_agent_webhook_secret: >-
  {{ hermes_agent_bao.WEBHOOK_SECRET
     | default(lookup('env', (hermes_agent_env_prefix ~ '_WEBHOOK_SECRET')
                             if hermes_agent_id == 'hermes-private'
                             else 'WEBHOOK_SECRET'), true) }}

# Inbound job-submission API bearer key. Bao-first
# (secret/ai/hermes), env fallback. Unlike the webhook secret, this key has
# external consumers by design (any sanctioned submitter dials
# https://hermes-api.<sub> with it), so it lives in the shared engine — seeded
# programmatically, never hand-typed. Empty disables the platform (see defaults).
hermes_agent_api_server_key: >-
  {{ hermes_agent_bao[hermes_agent_env_prefix ~ '_API_SERVER_KEY']
     | default(lookup('env', hermes_agent_env_prefix ~ '_API_SERVER_KEY'), true) }}

# Zammad ITSM client (dryvist/zammad-incidents skill). The canonical API pair is
# published at secret/ai/mcp/zammad; legacy environment names remain only as a
# local fallback. Empty disables the integration until Zammad is deployed.
hermes_agent_zammad_url: >-
  {{ (hermes_agent_mcp_bao.ZAMMAD_MCP_URL | regex_replace('/api/v1/?$', ''))
     if (hermes_agent_mcp_bao.ZAMMAD_MCP_URL | default('', true))
     else lookup('env', 'ZAMMAD_URL') }}
hermes_agent_zammad_api_token: >-
  {{ hermes_agent_mcp_bao.ZAMMAD_MCP_TOKEN
     | default(lookup('env', 'ZAMMAD_API_TOKEN'), true) }}

# GitHub issues + org projects PAT (read/write Issues in all repos, read/write
# Projects v2 in the dryvist org). Bao-first (secret/ai/hermes),
# env fallback — empty until the token is present. See the dryvist/github-issues
# skill for usage.
# --- GitHub credentials: ops identities ONLY ---------------------------------
# Each token below resolves Bao-first with an ENV FALLBACK, and that fallback is
# process-global: any identity converged in a shell holding these variables
# would inherit GitHub access it was never meant to have. An agent provisioned
# as a non-coding assistant must not reach GitHub at all, and the enforceable
# boundary is the credential, not the prompt or the skill — with no token the
# GitHub skill cannot act no matter what it is asked to do.
hermes_agent_github_issues_pat: >-
  {{ (hermes_agent_bao.GH_PAT_WRITE_PROJECT_ISSUES
      | default(lookup('env', 'GH_PAT_WRITE_PROJECT_ISSUES'), true))
     if ((hermes_agent_ops_workload_enabled | bool)
         and (hermes_agent_github_org_tokens_enabled | bool)) else '' }}

# Read-only GitHub security-alert token for the bot-PR triage job (reads
# code-scanning + Dependabot alerts + PR files across all repos). Separate from
# the issues PAT (which supplies the label write). Bao-first
# (secret/ai/hermes), env fallback — empty until seeded.
hermes_agent_github_alerts_token: >-
  {{ (hermes_agent_bao.GH_TOKEN_SECURITY_ALERTS_READ
      | default(lookup('env', 'GH_TOKEN_SECURITY_ALERTS_READ'), true))
     if ((hermes_agent_ops_workload_enabled | bool)
         and (hermes_agent_github_org_tokens_enabled | bool)) else '' }}

# Read-only GitHub token for the github-maint profile (issues, pull requests,
# contents, metadata across the dryvist org — no write scope of any kind).
# Bao-first (secret/ai/hermes), env fallback — empty until
# seeded, which leaves the github-maint cron inert.
hermes_agent_github_read_token: >-
  {{ (hermes_agent_bao.GH_TOKEN_ORG_READ
      | default(lookup('env', 'GH_TOKEN_ORG_READ'), true))
     if ((hermes_agent_ops_workload_enabled | bool)
         and (hermes_agent_github_org_tokens_enabled | bool)) else '' }}

# Codex CLI auth (ChatGPT-OAuth ~/.codex/auth.json) for the isolated
# codex-runner user. Bao-first (secret/ai/<identity>), then the identity's env
# fallback; hermes keeps its existing unprefixed fallback. Create-only on the
# guest: this is only a bootstrap snapshot, and Codex's guest-side refresh
# takes over after first login (see roles/codex_runner/README.md).
codex_runner_auth_json: >-
  {{ hermes_agent_bao.CODEX_AUTH_JSON
     | default(lookup('env', 'CODEX_AUTH_JSON'
                     if hermes_agent_id == 'hermes'
                     else hermes_agent_env_prefix ~ '_CODEX_AUTH_JSON'), true) }}

# --- Vikunja Kanban bridge ----------------------------------------------------
# Turns the operator's Vikunja board into Hermes' on-demand front end: a task in
# the Ready bucket becomes a Kanban card, moves across the operator's buckets as
# work runs, and gets the card's recorded result commented back. See the role
# README for the design and the two live-verified endpoint facts.
#
# Enabled here rather than in role defaults: the role default stays false (it
# writes to the operator's real board, so it must be opted into per estate), and
# this is the estate that opted in.
#
# Scoped per provisioned identity, not per group: every agent guest joins this
# group, but the bridge needs a write token and a board of its own before it can
# run, and assert.yml fails the converge when it is on without one. An identity
# joins by being listed here once its token is seeded. Uses the inventory var
# hermes_agent_identity rather than hermes_agent_id so it does not depend on
# role-defaults load order.
hermes_agent_vikunja_bridge_enabled: >-
  {{ (hermes_agent_identity | default('hermes')) in ['hermes', 'donna'] }}

# WRITE-scoped Vikunja API token. Bao-first (secret/ai/hermes),
# env fallback — same shape as every credential above. DISTINCT from the
# VIKUNJA_API_TOKEN on that same path, which is ai_runner's queue credential for
# a different guest with a different scope; sharing one would hand each the
# other's permissions.
#
# Its grants are exactly this daemon's operations: projects{read_all,
# views_buckets_tasks}, projects_views{read_all}, projects_views_tasks{read_all},
# tasks{read_one,update}, tasks_comments{create}. No project create/delete and no
# delete anywhere. NOTE projects_views and projects_views_tasks are SEPARATE
# permission groups from projects — a token holding only `projects` 401s on
# listing views and cannot drive this bridge.
hermes_agent_vikunja_bridge_token: >-
  {{ hermes_agent_bao[hermes_agent_env_prefix ~ '_VIKUNJA_API_TOKEN']
     | default(lookup('env', hermes_agent_env_prefix ~ '_VIKUNJA_API_TOKEN'), true) }}
