---
# Pepper has no operational capability or shared credential fallback.
hermes_agent_codex_mcp_enabled: false
hermes_agent_pepper_intake_enabled: false
hermes_agent_pepper_digest_deliver: ""
hermes_agent_pepper_content_reviewed: false
hermes_agent_kanban_goal_mode: "{{ hermes_agent_id != 'pepper' }}"
hermes_agent_youtrack_mcp_enabled: "{{ hermes_agent_id == 'pepper' }}"
hermes_agent_youtrack_mcp_url: >-
  {{ hermes_agent_bao.YOUTRACK_MCP_URL | default(lookup('env', 'PEPPER_YOUTRACK_MCP_URL'), true)
     if hermes_agent_id == 'pepper' else '' }}
hermes_agent_youtrack_mcp_token: >-
  {{ hermes_agent_bao.YOUTRACK_MCP_TOKEN | default(lookup('env', 'PEPPER_YOUTRACK_MCP_TOKEN'), true)
     if hermes_agent_id == 'pepper' else '' }}
hermes_agent_kanban_max_in_progress: "{{ 1 if hermes_agent_id == 'pepper' else ai_agent_default_concurrency | int }}"
hermes_agent_kanban_max_in_progress_per_profile: >-
  {{ 1 if hermes_agent_id == 'pepper' else ai_agent_default_concurrency | int }}
hermes_agent_context7_mcp_enabled: "{{ hermes_agent_id != 'pepper' }}"
hermes_agent_docs_mcp_enabled: "{{ hermes_agent_id != 'pepper' }}"
hermes_agent_grep_mcp_enabled: "{{ hermes_agent_id != 'pepper' }}"
hermes_agent_vikunja_mcp_enabled: "{{ hermes_agent_id != 'pepper' }}"
