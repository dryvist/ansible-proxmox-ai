---
# Donna's scheduled jobs post to her own Slack channel. The channel id comes
# from her OpenBao domain (secret/ai/donna, key SLACK_DELIVER_CHANNEL), with an
# env fallback. Without a value, or on any other identity, output stays local.
hermes_agent_donna_slack_channel: >-
  {{ (hermes_agent_bao.SLACK_DELIVER_CHANNEL
      | default(lookup('env', 'SLACK_DONNA_DELIVER_CHANNEL'), true)
      | default('', true))
     if (hermes_agent_identity | default('hermes', true)) == 'donna' else '' }}
hermes_agent_donna_deliver: >-
  {{ ('slack:' ~ hermes_agent_donna_slack_channel)
     if hermes_agent_donna_slack_channel | length > 0 else 'local' }}
# Failure notices never go to the main channel: it carries delivered content
# only. They go to Donna's alerts channel (secret/ai/donna, key
# SLACK_FAILURE_CHANNEL), else to the local log store.
hermes_agent_donna_failure_channel: >-
  {{ (hermes_agent_bao.SLACK_FAILURE_CHANNEL
      | default(lookup('env', 'SLACK_DONNA_FAILURE_CHANNEL'), true)
      | default('', true))
     if (hermes_agent_identity | default('hermes', true)) == 'donna' else '' }}
hermes_agent_donna_failure_deliver: >-
  {{ ('slack:' ~ hermes_agent_donna_failure_channel)
     if hermes_agent_donna_failure_channel | length > 0
        and hermes_agent_donna_failure_channel != hermes_agent_donna_slack_channel
     else 'local' }}
