---
# Research posture: web research and local learning on, client tracker and vault wiring off.
# A guest tagged youtrack-client works its tracker through MCP instead.
hermes_agent_research_enabled: "{{ 'youtrack-client' not in (host_tags | default([])) }}"
hermes_agent_research_egress_hosts:
  - duckduckgo.com
  - html.duckduckgo.com
  - lite.duckduckgo.com
hermes_agent_kanban_goal_mode: "{{ not (hermes_agent_isolated | bool) }}"
hermes_agent_youtrack_mcp_enabled: >-
  {{ hermes_agent_isolated | bool and not (hermes_agent_research_enabled | bool) }}
hermes_agent_youtrack_mcp_url: >-
  {{ hermes_agent_bao.YOUTRACK_MCP_URL | default(lookup('env', hermes_agent_env_prefix ~ '_YOUTRACK_MCP_URL'), true)
     if hermes_agent_isolated | bool and not (hermes_agent_research_enabled | bool) else '' }}
hermes_agent_youtrack_mcp_token: >-
  {{ hermes_agent_bao.YOUTRACK_MCP_TOKEN | default(lookup('env', hermes_agent_env_prefix ~ '_YOUTRACK_MCP_TOKEN'), true)
     if hermes_agent_isolated | bool and not (hermes_agent_research_enabled | bool) else '' }}
hermes_agent_kanban_max_in_progress: "{{ 1 if hermes_agent_isolated | bool else ai_agent_default_concurrency | int }}"
hermes_agent_kanban_max_in_progress_per_profile: >-
  {{ 1 if hermes_agent_isolated | bool else ai_agent_default_concurrency | int }}
hermes_agent_context7_mcp_enabled: "{{ not (hermes_agent_isolated | bool) }}"
hermes_agent_docs_mcp_enabled: "{{ not (hermes_agent_isolated | bool) }}"
hermes_agent_grep_mcp_enabled: "{{ not (hermes_agent_isolated | bool) }}"
hermes_agent_vikunja_mcp_enabled: "{{ not (hermes_agent_isolated | bool) }}"
